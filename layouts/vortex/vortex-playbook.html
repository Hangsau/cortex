{{ define "head-extra" }}
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@400;500;600;700&family=Quattrocento+Sans:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ .Site.BaseURL }}css/vortex.css">
<link rel="stylesheet" href="{{ .Site.BaseURL }}css/vortex-nav.css">
{{ end }}

{{ define "main" }}
<div class="vx-shell">
{{ partial "vortex/sidebar.html" (dict "ctx" . "current" "playbooks") }}
<div class="vx-page">

  <div class="vx-article-header">
    <a href="{{ .Site.BaseURL }}vortex/playbooks/" class="vx-back-link">← 教練 Playbook</a>
    <h1 class="vx-article-title">{{ .Title }}</h1>
    <p class="vx-article-meta">use-case 整合 · 從 Vortex canonical 萃取</p>
  </div>

  <div class="vx-article-body vx-playbook">
    {{ .Content }}
  </div>

  <footer class="vx-article-footer">
    <hr class="vx-divider">
    <a href="{{ .Site.BaseURL }}vortex/playbooks/" class="vx-back-link">← 返回 教練 Playbook</a>
  </footer>

</div>
</div>
{{ end }}
