baseURL = "https://hangsau.github.io/cortex/next/"
languageCode = "zh-Hant"
title = "Cortex"
publishDir = "public/next"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT"]

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.mounts]]
    source = "next/content"
    target = "content"
  [[module.mounts]]
    source = "next/layouts"
    target = "layouts"
  [[module.mounts]]
    source = "next/assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "next/data"
    target = "data"
  # 讀本章節是 Markdown canonical（含解說圖 shortcode），直接掛進新版；版面由 next/layouts 重做
  [[module.mounts]]
    source = "content/library/kinesiology"
    target = "content/library/kinesiology"
    excludeFiles = ["learning-map.md"]
  [[module.mounts]]
    source = "content/library/basic-biomechanics"
    target = "content/library/basic-biomechanics"
    excludeFiles = ["learning-map.md"]
  [[module.mounts]]
    source = "layouts/shortcodes"
    target = "layouts/_shortcodes"
  # Vortex 長文（技術深探／感知橋接／水感框架）是 TheVortexProject 同步來的 Markdown，直接掛入
  [[module.mounts]]
    source = "content/vortex/instructional"
    target = "content/vortex/instructional"
  [[module.mounts]]
    source = "content/vortex/bridge"
    target = "content/vortex/bridge"
  [[module.mounts]]
    source = "content/vortex/technica"
    target = "content/vortex/technica"
    excludeFiles = ["water-sense-guide.md"]
  [[module.mounts]]
    source = "content/vortex/adm"
    target = "content/vortex/adm"
    excludeFiles = ["_index.md", "matrix.md", "standards.md"]
