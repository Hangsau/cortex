# 課表工具的「技能段」資料（手管，2026-10-13）
# 週課表（③）會把這些段落掛進一週的部分堂次；數字一律來自下列出處，工具只做排列與換算。
# 水下安全條件不在這裡寫：直接讀 data/breathing/safety.yaml 的 hypoxic_blackout.rule_zh（canonical 同步）。

udk:
  title_zh: 水下海豚腿
  minutes: 10            # 每次約 10 分鐘
  per_week: {min: 2, max: 4}
  months: 4              # 先做 4 個月再評估
  retest_every_weeks: 2
  retest_zh: 熱身後蹬牆水下海豚腿計時，記 10 m／12.5 m／15 m 分段，和兩週前同條件比。
  drill: UDK5            # 比賽配速水下打水：蹬牆水下打到 10–15 m 再接出水
  max_underwater_m: 15
  max_underwater_zh: 競賽規則：自由式、仰式、蝶式在出發與轉身後，水下不得超過 15 m；練習也以 15 m 為上限，不比遠。
  dose_zh: 日本菁英泳者 4 個月介入：在常規訓練外加每次約 10 分鐘的水下海豚腿專項組，男子水下速度 1.73→1.81 m/s、女子 1.49→1.53 m/s。起始劑量照這個做：每週 2–4 次、每次約 10 分鐘，每 2 週重測一次。
  cert: 🟢
  source_zh: Vortex《水下蝶腳技術分析》§6.4 整合訓練方法
  doc: vortex/research/drafts/underwater-dolphin-kick-analysis/
  turn_test_zh: 想比較轉身做法，用「觸牆到 7.5 m」計時：一份比較三種轉法的研究發現推牆速度有差，到 7.5 m 時已經沒有差別。
  turn_doc: vortex/research/drafts/starts-turns-technical-analysis/
  row_note_zh: 約 10 分鐘：蹬牆水下海豚腿，最多到 15 m 就出水，輕鬆游完這一趟。趟數是用 10 分鐘換算的，依實際時間調；每趟要恢復到呼吸平穩再出發。
  taper_zh: 減量期保留短的水下段，不加量。

# 期內負荷節律：比例讀 data/periodization/structure.yaml 的 macrocycle.loading_patterns，
# 這裡只決定「哪一期對照哪一個比例」，依據是各比例自己的 note_zh。
loading_by_phase:
  general_prep: "4:1"        # note_zh：早期準備期
  specific_prep: "3:1"       # note_zh：書中常見的負荷／恢復安排範例（預設）
  competition: "2:2 / 1:1"   # note_zh：競賽期

# 主課前的器材技術準備（依目的選主課區，可選）。
# 三個模板＝器材使用指南「如何放進一堂課」的三個實務範例，距離／組數／休息照指南原文；
# 哪個目的開放哪個模板照 research/swim-equipment-recommendations-2026-10-07/REPORT.md §2 第一版配置。
# 指南原話：適用於能自在完成相關距離且已熟悉器材者；距離、趟數、休息都可調整，不是研究證實的最佳劑量。
equipment_prep_guide: vortex/instructional/equipment-guide/
equipment_prep_scope_zh: 適用於能自在完成這些距離、而且已經熟悉器材的人；距離、組數、休息都可以調，不是研究證實的最佳劑量。兒童或初學者從現場照看得到、能保持呼吸與控制的更短段開始。
equipment_prep:
  - id: snorkel-head
    version: 1
    title_zh: 換氣加入後，頭位仍能穩定
    strokes: [free]
    goals: [aerobic_easy, steady, threshold, velocity, lactate_production, lactate_tolerance, race_pace]
    equip: [snorkel]
    sets: {min: 2, max: 4}
    rest: {min: 20, max: 30}
    rest_note_zh: 段間休 20–30 秒，未恢復就延長。
    sequence:
      - {dist: 25, mode: swim, equip: [snorkel], note: 呼吸管自由式：頭不動，只感覺前進}
      - {dist: 25, mode: swim, equip: [], note: 取下呼吸管，正常換氣自由式}
    cue_zh: 主課保持正常換氣，觀察前進感有沒有在轉頭時被打斷。
    anchor: snorkel
  - id: fins-rotation
    version: 1
    title_zh: 轉體時，左右配合更清楚
    strokes: [free]
    goals: [aerobic_easy, steady]
    equip: [fins]
    sets: {min: 1, max: 4}
    rest: {min: 20, max: 30}
    rest_note_zh: 指南這一例沒寫秒數，只說每段停下恢復並換裝、先試一組再依品質決定重複；先用另外兩例的 20–30 秒，換裝來不及就延長。
    sequence:
      - {dist: 25, mode: drill, equip: [fins], note: 戴蛙鞋六踢換邊：側身踢六下再換邊}
      - {dist: 25, mode: swim, equip: [fins], note: 戴蛙鞋完整游}
      - {dist: 25, mode: swim, equip: [], note: 脫掉蛙鞋完整游}
    cue_zh: 主課只保留一個左右配合的提示。
    anchor: fins
  - id: buoy-pull
    version: 1
    title_zh: 有氧主課中，集中一部分划手工作
    strokes: [free]
    goals: [aerobic_easy, steady]
    equip: [pull_buoy]
    sets: {min: 2, max: 4}
    rest: {min: 20, max: 30}
    rest_note_zh: 每段休 20–30 秒。
    sequence:
      - {dist: 50, mode: pull, equip: [pull_buoy], note: 夾腿浮板（8 字球）拉手}
      - {dist: 50, mode: swim, equip: [], note: 正常游}
    cue_zh: 兩種條件各自維持可重複的努力程度。
    stop_zh: 如果已經只能靠拱腰或用力夾腿完成，縮短或改回正常游。
    anchor: pull-buoy
