<!doctype html>
<html lang="zh-Hant">
<head>{{ partial "head.html" . }}</head>
{{- $isVortex := or (eq .Section "vortex") (hasPrefix .RelPermalink (relURL "vortex/")) }}
<body class="series-vortex{{ if $isVortex }} has-rail{{ end }}">
{{ partial "site-head.html" . }}
<div class="frame">
  {{- if $isVortex }}{{ partial "vortex/rail.html" . }}{{ end }}
  <main id="main">{{ block "main" . }}{{ end }}</main>
</div>
<footer class="site-foot">Cortex · 新版預覽</footer>
</body>
</html>
