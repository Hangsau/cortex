{{ $ID := printf "rd-disc-pressure-%d" .Ordinal }}
<figure class="rd-diagram rd-disc-pressure" aria-labelledby="{{ $ID }}-caption">
<svg viewBox="0 0 320 390" role="img" aria-label="椎間盤的概念剖面：上方壓縮經終板提高髓核壓力；周圍纖維環受拉，限制髓核向外擴張，與終板共同傳遞負荷。">
<defs><marker id="{{ $ID }}-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="rd-arrow-accent" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<text x="160" y="26" text-anchor="middle">髓核、纖維環與終板一起承重</text>
<path class="rd-force" d="M160 45 V87" marker-end="url(#{{ $ID }}-arrow)"/>
<path class="rd-line" d="M60 95 H260 M60 205 H260"/>
<rect class="rd-bone" x="60" y="103" width="200" height="94" rx="36"/>
<rect class="rd-bone" x="75" y="112" width="170" height="76" rx="30"/>
<ellipse class="rd-soft" cx="160" cy="150" rx="62" ry="28"/>
<text x="160" y="157" text-anchor="middle">髓核</text>
<path class="rd-force" d="M94 150 H65" marker-end="url(#{{ $ID }}-arrow)"/>
<path class="rd-force" d="M226 150 H255" marker-end="url(#{{ $ID }}-arrow)"/>
<path class="rd-line" d="M62 205 L38 229 M240 187 L267 229"/>
<text x="38" y="254" text-anchor="middle">終板</text><text x="266" y="254" text-anchor="middle">纖維環</text>
<text x="160" y="299" text-anchor="middle">① 壓縮經終板傳入</text>
<text x="160" y="335" text-anchor="middle">② 髓核壓力升高</text>
<text x="160" y="371" text-anchor="middle">③ 纖維環受拉，約束擴張</text>
</svg>
<figcaption id="{{ $ID }}-caption">編者依原書圖 9.33–9.36 整理的概念剖面。髓核富含水分，受壓時形變並向外作用於纖維環；環狀組織的張力限制擴張，壓力也經上下終板傳遞。纖維環本身同樣參與承重。圖形只區分構造與作用，省略交錯纖維、椎體和三維細節；箭頭沒有數值尺度，不表示真實形變量或突出方向。</figcaption>
</figure>
