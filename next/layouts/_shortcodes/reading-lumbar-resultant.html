{{ $ID := printf "rd-lumbar-resultant-%d" .Ordinal }}
<figure class="rd-diagram rd-lumbar-resultant" aria-labelledby="{{ $ID }}-caption">
<svg viewBox="0 0 320 340" role="img" aria-label="壓縮反作用分量 C 垂直盤面，剪力反作用分量 S 平行盤面。C 接上 S 的端點，就是合力 R 的端點；三者形成直角三角形。">
<defs><marker id="{{ $ID }}-accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="rd-arrow-accent" d="M0 0 L7 3.5 L0 7 Z"/></marker><marker id="{{ $ID }}-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="rd-arrow-ink" d="M0 0 L9 4.5 L0 9 Z"/></marker></defs>
<text x="160" y="27" text-anchor="middle">同一反作用力的向量三角形</text>
<path class="rd-angle-reference" data-lumbar-plane d="M20 236.992 L110 300.010"/>
<path class="rd-force rd-component-normal" data-lumbar-c d="M60 265 L185.683469 85.505404" marker-end="url(#{{ $ID }}-accent)"/>
<path class="rd-force rd-component-shear" data-lumbar-s d="M185.683469 85.505404 L170.413464 74.813231" marker-end="url(#{{ $ID }}-accent)"/>
<path class="rd-line" data-lumbar-r d="M60 265 L170.413464 74.813231" marker-end="url(#{{ $ID }}-ink)"/>
<text x="170" y="160">C</text><text x="97" y="151">R</text>
<path class="rd-measure" d="M178 80 L211 55"/><text x="219" y="58">S</text>
<text x="160" y="329" text-anchor="middle">盤面與水平夾 35°</text>
</svg>
<figcaption id="{{ $ID }}-caption">編者依計算框 10-3A／B 重畫。C 約 4382 N、S 約 373 N；長虛線 C 垂直盤面，點線 S 接在 C 的端點、沿盤面朝左上抵抗下滑，實線 R 從原起點連到最後端點。三個力使用相同比例尺，R＝√(C²＋S²) 約 4398 N，與盤面所夾銳角約 85°。下方斜虛線只標示盤面方向。這是原書靜力模型的反作用力，未新增實測資料；向量圖不是人體姿勢圖。</figcaption>
</figure>
