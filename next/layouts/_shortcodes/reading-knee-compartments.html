{{ $ID := printf "rd-knee-compartments-%d" .Ordinal }}
<figure class="rd-diagram rd-knee-compartments" data-knee-compartments aria-labelledby="{{ $ID }}-caption">
<svg viewBox="0 0 320 360" role="img" aria-labelledby="{{ $ID }}-title {{ $ID }}-desc">
<title id="{{ $ID }}-title">相同膝接觸總力下的內外側分配</title>
<desc id="{{ $ID }}-desc">兩點等效接觸模型，總力2400牛頓，力矩0牛頓公尺時，內側與外側各1200牛頓。兩支向下箭頭使用相同比例，表示作用在脛骨側的壓縮力。</desc>
<text x="16" y="28">總力相同，分配可以改變</text>
<text x="16" y="61">總力 R＝2400 N</text>
<text x="16" y="94" data-knee-moment-label>M＝0 N·m</text>
<path class="rd-line" data-knee-lateral-arrow d="M80 152 V190"/>
<path class="rd-arrow-ink" d="M80 200 L73 190 L87 190 Z"/>
<path class="rd-force" data-knee-medial-arrow d="M240 152 V190"/>
<path class="rd-arrow-accent" d="M240 200 L233 190 L247 190 Z"/>
<path class="rd-line" d="M40 205 H280 M160 200 V215"/>
<text x="80" y="246" text-anchor="middle">外側 FL</text>
<text x="240" y="246" text-anchor="middle">內側 FM</text>
<text x="80" y="278" text-anchor="middle" data-knee-lateral-label>1200 N</text>
<text x="240" y="278" text-anchor="middle" data-knee-medial-label>1200 N</text>
<path class="rd-measure" d="M80 308 H240 M80 302 V314 M160 302 V314 M240 302 V314"/>
<text x="160" y="342" text-anchor="middle">接觸點距離 50 mm</text>
</svg>
<label for="{{ $ID }}-input">調整接觸力矩M（−40至＋40 N·m；正值使內側較大）</label>
<input id="{{ $ID }}-input" type="range" min="-40" max="40" step="2" value="0" disabled aria-describedby="{{ $ID }}-output {{ $ID }}-caption">
<output id="{{ $ID }}-output" for="{{ $ID }}-input" aria-live="polite">M＝0 N·m；內側 FM＝1200 N；外側 FL＝1200 N</output>
<figcaption id="{{ $ID }}-caption">編者兩點等效接觸模型：FM＋FL＝2400 N，(FM−FL)×0.025 m＝M。力矩以兩點中間為參考，正值定義為內側負荷較大；兩支箭頭向下表示脛骨側接觸力，總長度按同一力值比例。這是接觸負荷示意，未畫整腿自由體，也未計面積、肌肉與韌帶作用。兩接觸點固定且皆受壓時才適用；輸入M不是可直接代換的步態外部膝內收力矩。</figcaption>
</figure>
