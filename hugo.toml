baseURL = "https://hangsau.github.io/cortex/"
languageCode = "zh-tw"
title = "Cortex"
defaultContentLanguage = "zh-tw"
disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "github-dark"
  lineNos = false

[params]
  description = "個人知識庫"
  author = ""

# 沒有 [menu] 是刻意的：全站地圖是首頁的四領域目次（data/home.yaml），
# nav 只留字標與「回目次」。角落再擺一份只涵蓋部分內容的分區清單＝互相矛盾的第二套分類。
