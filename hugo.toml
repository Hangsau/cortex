# Cortex 網站設定（2026-09-26 正式切換到 next/ 新版；舊版封存於 git 標籤 legacy-site-2026-09-26）
baseURL = "https://hangsau.github.io/cortex/"
languageCode = "zh-Hant"
title = "Cortex"
publishDir = "public"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT"]

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.mounts]]
    source = "next/content"
    target = "content"
  [[module.mounts]]
    source = "next/layouts"
    target = "layouts"
  [[module.mounts]]
    source = "next/assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "next/data"
    target = "data"
  # 讀本章節是 Markdown canonical（含解說圖 shortcode），直接掛進新版；版面由 next/layouts 重做
  [[module.mounts]]
    source = "content/library/kinesiology"
    target = "content/library/kinesiology"
    excludeFiles = ["learning-map.md"]
  [[module.mounts]]
    source = "content/library/basic-biomechanics"
    target = "content/library/basic-biomechanics"
    excludeFiles = ["learning-map.md"]
  # Vortex 散文（TheVortexProject 同步）：instructional/ 只剩應用層文章（器材指南）；
  # 其餘長文是研究庫的研究底稿，在 research/。Bridge 與 Technica 掛載已於 2026-10-14 撤除。
  [[module.mounts]]
    source = "content/vortex/instructional"
    target = "content/vortex/instructional"
  [[module.mounts]]
    source = "content/vortex/research"
    target = "content/vortex/research"
  [[module.mounts]]
    source = "content/vortex/adm"
    target = "content/vortex/adm"
    excludeFiles = ["_index.md", "matrix.md", "standards.md"]
  # 舊網址轉址頁（tools/build_redirects.py 產生）
  [[module.mounts]]
    source = "next/static"
    target = "static"
