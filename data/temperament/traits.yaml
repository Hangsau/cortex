# 九個氣質維度（Thomas, Chess & Birch, NYLS）
# 來源：resources/notes/temperament-nine-traits/SYNTHESIS.md §1
# cert: 🔵 經典 / 🟢 驗證 / 🟡 待查 / 🟠 新興 / 🔴 延伸
dimensions:
  - key: activity
    no: 1
    name_zh: 活動量
    name_en: Activity Level
    cert: "🔵"
    definition: 身體動作與精力的量。
    high: 一直動、坐不住、精力旺盛。
    low: 動作慢、安靜、省力。
  - key: rhythmicity
    no: 2
    name_zh: 規律性
    name_en: Rhythmicity
    cert: "🔵"
    definition: 生理功能（吃、睡、排泄）的可預測度。
    high: 作息規律、好安排。
    low: 作息不定、難預測。
  - key: approach
    no: 3
    name_zh: 趨避性
    name_en: Approach / Withdrawal
    cert: "🔵"
    definition: 對新事物、新環境、陌生人的第一反應。
    high: 趨——好奇靠近、主動探索。
    low: 避——退縮、猶豫、先躲起來。
  - key: adaptability
    no: 4
    name_zh: 適應性
    name_en: Adaptability
    cert: "🔵"
    definition: 對改變與轉換的調整速度。
    high: 很快適應新安排。
    low: 抗拒改變、需要較久才適應。
  - key: intensity
    no: 5
    name_zh: 反應強度
    name_en: Intensity
    cert: "🔵"
    definition: 情緒表達的能量大小（不分正負）。
    high: 大哭大笑、反應劇烈。
    low: 反應溫和、平淡。
  - key: sensitivity
    no: 6
    name_zh: 敏感度（反應閾）
    name_en: Threshold / Sensitivity
    cert: "🔵"
    definition: 引發反應所需的刺激量。本站以「敏感度」正向命名——高敏感＝低閾值。
    high: 低閾值——細微的聲音、光線、衣物標籤就有感。
    low: 高閾值——要相當強的刺激才會注意到。
    note: "方向最易誤讀：低閾值＝高敏感。一點點刺激就有反應的孩子，是敏感度高的那一端。"
  - key: mood
    no: 7
    name_zh: 情緒本質
    name_en: Quality of Mood
    cert: "🔵"
    definition: 慣常的情緒底色。
    high: 多正向、開朗、友善。
    low: 多負向、易不悅、愛抱怨。
  - key: focus
    no: 8
    name_zh: 專注度（注意力分散度）
    name_en: Focus / Distractibility
    cert: "🔵"
    definition: 多不容易被外界打斷正在做的事。本站以「專注度」正向命名——高專注＝不易分心。
    high: 不易被周圍打斷、能持續在一件事上。
    low: 一點動靜就分心、停下手邊的事。
    note: "兩面性：易分心的嬰兒比較好哄（轉移注意就行），但同一特質到了學齡期變成『不專心』——同一氣質在不同情境價值相反。"
  - key: persistence
    no: 9
    name_zh: 堅持度
    name_en: Persistence
    cert: "🔵"
    definition: 持續投入一件事、遇難不放棄的程度。
    high: 持久、遇挫仍嘗試。
    low: 容易放棄、跳來跳去。
