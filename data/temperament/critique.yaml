# 批判與邊界（網站必須誠實呈現的）
# 來源：SYNTHESIS.md §5
items:
  - key: labeling
    name_zh: 標籤化風險
    cert: "🟢"
    body: "叫孩子『難搞／懶／亂』會啟動**自我實現預言**（比馬龍效應）：大人低期待 → 減少成功機會 → 孩子內化標籤 → 表現下滑。現代研究改用**描述性語言**——用『需要時間觀察新情境』取代『害羞』，保留大人的回應彈性。"
  - key: culture
    name_zh: 跨文化價值差異
    cert: "🟢"
    body: "氣質特質的『好壞』由文化決定。Xinyin Chen 的研究：害羞／抑制在**傳統中國**與領導力、同儕接納、學業正相關；但**當代中國**反轉為負相關。對華語家長特別重要：別把西方『外向＝好』直接套用。"
  - key: measurement
    name_zh: 測量是自我反思工具，不是診斷
    cert: "🔵"
    body: "主要量表（EAS／CBQ／Carey-McDevitt 九維度／ICQ）都是**研究工具**，捕捉的是『家長在某一時刻的知覺』，受家長壓力、文化、近期情境影響。**任何線上或書本『氣質測驗』都不是臨床診斷或分類，只供認識與調整支持方式之用。** 這是本站測驗的強制前提。"
  - key: stability
    name_zh: 穩定但非宿命
    cert: "🟢"
    body: "氣質有生理根源、約 30–60% 遺傳（依特質而異）、隨年齡漸趨穩定；**但仍有 40–70% 由環境解釋**。活動量、社交性較穩；憤怒／悲傷／注意控制較可變。生理根源**不等於固定命運**——強反應嬰兒在回應性教養下可成為專注熱情的學習者。"
