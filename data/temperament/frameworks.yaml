# 現代框架延伸（不只 1970s 原典）
# 來源：SYNTHESIS.md §3
frameworks:
  - key: rothbart
    name_zh: Rothbart 心理生物模型
    name_en: Reactivity + Self-Regulation
    cert: "🔵"
    lead: 在「反應」之外，加上「自我調節」這條軸。
    points:
      - "Thomas-Chess 偏重『反應』面，缺『調節』面。Rothbart 把氣質定義為**反應性**（reactivity）＋**自我調節**（self-regulation）兩軸的體質性個別差異。"
      - "**反應性**：生理／行為被激起的難易與強弱（閾值、潛伏、強度、恢復時間）。"
      - "**自我調節**：調控反應的能力，核心是**努力控制 effortful control**——抑制優勢反應、轉移注意、延宕滿足。"
      - "因素分析收斂成三大因素（IBQ／CBQ 量表）：外向／活躍 Surgency、負向情緒 Negative Affectivity、努力控制 Effortful Control。"
      - "🟢 為何重要：努力控制能預測社會能力、同儕接納、學業適應，而且**比純反應性更可被教養塑造**——這給了家長『可以做什麼』的著力點。"
  - key: kagan
    name_zh: Kagan 行為抑制
    name_en: Behavioral Inhibition
    cert: "🔵"
    lead: 怕生的神經底色。
    points:
      - "行為抑制（BI）：面對新奇／陌生人時以警戒、退縮、苦惱反應的傾向。"
      - "🟡 約 15–20% 嬰兒為『高反應』，4 個月時對新刺激即大哭、肢體緊張。"
      - "🟢 神經底色：杏仁核反應性 ＋ HPA 軸敏感。"
      - "🟡 縱貫穩定：約 70% 行為剖面延續到青春期，但**受環境調節**，不是宿命。高抑制與後續社交焦慮風險相關。"
  - key: eas
    name_zh: Buss & Plomin EAS
    name_en: Emotionality · Activity · Sociability
    cert: "🟢"
    lead: 遺傳的早現特質。
    points:
      - "把氣質定義為**可遺傳、早現（2 歲前）、跨時穩定**的人格子集。"
      - "三維度：情緒性 Emotionality（負向激起，遺傳性最高）、活動性 Activity、社交性 Sociability。"
      - "🟡 原本含第四維『衝動性』，因早期遺傳證據不足而拿掉。"
  - key: orchid
    name_zh: 差異易感性 / 蘭花-蒲公英
    name_en: Differential Susceptibility · Orchid & Dandelion
    cert: "🟠"
    lead: 近 20 年最重要的翻轉——敏感不是缺陷。
    points:
      - "**差異易感性（Belsky）**：有些孩子對**好環境與壞環境都更敏感**——不只『壞環境下更脆弱』，而是『for better and for worse』。推翻了舊的『素質-壓力（單向脆弱）』模型。"
      - "**情境生物敏感性（Boyce & Ellis, 2005）**：高反應孩子在逆境下結果最差、但在支持環境下結果**最好**，呈 U 型。"
      - "**蒲公英**：韌性強，哪種環境都過得去。**蘭花**：高度敏感，逆境下凋萎，但在對的照顧下開得最燦爛。（Boyce, 2019）"
      - "🔴 理解要點：蘭花孩子的高敏感是**高潛力的另一面**，前提是環境配合。對最敏感的孩子，『適配』不是錦上添花而是決定性的。"
  - key: bigfive
    name_zh: 氣質 → 大五人格的連續性
    name_en: Continuity to Big Five
    cert: "🟢"
    lead: 童年氣質是成人人格的早期樣貌。
    points:
      - "學齡期已見結構連續：Surgency → 外向 Extraversion；Negative Affectivity → 神經質 Neuroticism；Effortful Control → 盡責 Conscientiousness。"
      - "遺傳貢獻約 40–50%，其餘由環境、生活事件塑造——**穩定但可變**。（Caspi, Roberts & Shiner 2005）"
