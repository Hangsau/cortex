# 適配度應用（怎麼配合，不是怎麼矯正）
# 來源：SYNTHESIS.md §4
thesis: "適配度（goodness of fit）是貫穿 60 年研究的不變主軸：決定孩子發展的不是氣質本身，而是孩子的天生氣質與環境要求／教養方式之間的 match 程度。NYLS 縱貫研究發現：『磨難型』在良好適配下能健康發展，『安樂型』在不良適配下反而出現問題。中介變項是環境的回應性，不是氣質類型。"
strategies:
  - name_zh: 慢熱型 / 高退縮
    cert: "🟢"
    body: 提前預告轉換；新情境給觀察時間；尊重「先看再加入」；不強迫社交、不催。
  - name_zh: 高活動量
    cert: "🟢"
    body: 把動作嵌進日常（先放電再靜態任務）；被動學習時容許扭動；運動先於需久坐的場合。
  - name_zh: 強反應 / 強度高
    cert: "🟢"
    body: 發展共同調節工具（呼吸、數數）；避免多重感官超載；先承接情緒強度，而非否定它。
  - name_zh: 低閾值 / 高敏感（蘭花）
    cert: "🔴"
    body: 減少感官超載、可預測的環境；把高敏感當「需要對的環境」而非毛病。
  - name_zh: 低規律
    cert: "🟢"
    body: 用穩定的外部節奏（固定作息）幫忙建立內在規律。
classroom: "教室層面：建立可預測的常規節奏（對慢熱型尤其關鍵）；設不同學習區（先靜後動）；把『動一動』設計進教學，而非當獎賞。"
synthesis:
  - "三條歷史線在講同一件事的不同切面：Thomas-Chess 給『描述維度』，Rothbart 補『調節能力』，差異易感性給『環境敏感度的個別差異』。一個孩子＝他在九維度的落點（描述）× 他調節反應的能力（Rothbart）× 他對環境好壞的放大係數（蘭花／蒲公英）。"
  - "對華語家長最該翻轉的兩個直覺：①『敏感／慢熱＝問題』→ 其實是需要對的環境的高潛力；②『外向開朗才好』→ 那是文化偏好，不是普世真理。"

# ── 教學／教練應用（適配度用在課堂與運動場上）──
# 來源：SYNTHESIS.md §4 + Keogh (2003) 三因子 + McClowry INSIGHTS
teaching:
  lead: "教學應用的地基只有一句話：老師／教練不是去改變孩子的氣質，而是調整教學要求與互動方式，讓它跟孩子的氣質對上。要先認得一個隱形陷阱——『可教度（teachability）偏誤』：老師對孩子『好不好教』的評價，多半在評氣質而非能力。低堅持、高活動量、慢熱的孩子容易被誤判成能力差或態度差，一旦標籤形成就啟動比馬龍效應（低期待 → 少機會 → 孩子內化 → 表現下滑）。"
  keogh:
    - name_zh: 任務取向 Task Orientation
      cert: "🟢"
      body: "**組成**：堅持度＋專注（低分散）＋活動量。**課堂樣子**：能不能坐住、投入、不被打斷。**教學著力點**：任務切塊、減少干擾、把動作設計進教學。"
    - name_zh: 人際—社會彈性 Flexibility
      cert: "🟢"
      body: "**組成**：趨避＋適應性＋正向情緒。**課堂樣子**：面對新人新事、轉場、被糾正時的反應。**教學著力點**：提前預告轉換、給暖身觀察時間、不當眾施壓。"
    - name_zh: 反應強度 Reactivity
      cert: "🟢"
      body: "**組成**：情緒強度＋負向情緒＋敏感閾值。**課堂樣子**：情緒爆發、過載、對刺激敏感。**教學著力點**：共同調節工具（呼吸／數數）、降低感官超載、先承接再講理。"
  keogh_note: "九維度對教學太多，記不住也用不上。Keogh（2003）把它壓成這三個課堂相關因子——觀察一個孩子先問『他是哪個因子卡住？』：坐不住（①）、怕新狀況（②）、還是一點就炸（③）。三選一比九選一好操作太多。"
  dimensions:
    - name_zh: 活動量
      body: "**高**：把動作設計進教學（先放電再靜態）、容許扭動、動態任務。**低**：不催速度、給足完成時間。"
    - name_zh: 規律性
      body: "**低**：用固定流程表幫他建立內在節奏（高規律的孩子通常不需特別處理）。"
    - name_zh: 趨避性
      body: "**高**：給新挑戰、當示範開路。**低（退縮）**：新活動先讓他旁觀再加入，不點名、不強迫。"
    - name_zh: 適應性
      body: "**高**：轉場順，可當小幫手。**低**：提前預告轉換（『再 5 分鐘換下一項』）、減少臨時變動。"
    - name_zh: 反應強度
      body: "**高**：先承接情緒再講道理、教呼吸數數。**低**：別把『沒反應』當『不在乎』，主動確認他懂了。"
    - name_zh: 敏感閾值（低閾＝高敏）
      body: "**高敏**：降低感官超載、固定可預測環境、安靜角落。**低敏**：需較明確、有挑戰的任務才會有反應。"
    - name_zh: 情緒本質
      body: "**正向**：善用其感染力帶氣氛。**偏中性／負向**：別當『針對你』，用描述語回應。"
    - name_zh: 分散度
      body: "**易分心**：一次一個指令、座位遠離窗門、減少視聽干擾。**專注**：可給連續性深任務。"
    - name_zh: 堅持度
      body: "**高**：給有深度的挑戰、別中途打斷。**低**：任務切小塊、每段給完成感、遇挫先陪過再退場。"
  types:
    - name_zh: 安樂型（約 40%）
      body: "**基調**：好帶，但別忽略——安靜配合的孩子常被分到最少注意力。**最忌**：把『不吵』當『不需要』。"
    - name_zh: 高需求型（約 10%）
      body: "**基調**：結構＋預告＋先承接情緒；良好適配下發展一樣好。**最忌**：貼『難搞』標籤、跟他硬碰硬。"
    - name_zh: 慢熱型（約 15%）
      body: "**基調**：反覆溫和接觸是關鍵——同一活動多次低壓接觸後他會打開。**最忌**：把初次退縮當不合群、催或當眾逼他表現。"
  types_note: "約 35% 的孩子不完全屬於任何一型，所以『他是哪型』不該是教學的起點，九維度剖面才是。"
  insights:
    lead: "若要看『真的進校園、而且有隨機對照試驗（RCT）證據』的範例：Sandee McClowry（NYU）的 **INSIGHTS**。把九維度簡化成四型，同步訓練老師與家長辨認並差異化回應，另有給孩子的角色扮演單元；在紐約市公立學校的 RCT 顯示對行為問題與學業投入有效。設計哲學與本站一致：不貼好壞，給老師『對這型該怎麼回應』的操作腳本。"
    types:
      - "**勤奮型** Industrious"
      - "**社交躍躍欲試型** Social / Eager-to-Try"
      - "**謹慎慢熱型** Cautious / Slow-to-Warm-Up"
      - "**高維護型** High-Maintenance"
  traps:
    - "**標籤化 → 自我實現預言**：改用描述性語言——『需要時間觀察新情境』取代『害羞』、『精力旺盛』取代『過動』，保留你的回應彈性。"
    - "**文化價值不是普世**：Xinyin Chen 的研究顯示，害羞／抑制在傳統華人社會與學業、同儕接納正相關，在當代競爭環境反轉為負相關。別把西方『外向＝好』直接套到華語課堂。"
  sport:
    lead: "把這套帶進水裡（屬延伸詮釋）："
    points:
      - "**慢熱型**：下水前給足池邊觀察、別第一堂就要求跳水。"
      - "**高敏感（蘭花）**：對水溫、耳朵進水、人多吵雜反應大，環境可預測他才學得進去。"
      - "**低堅持**：把動作拆成單一焦點、每趟給完成感，不要一次喊五個重點。"
      - "**高活動量**：少排乾等，動作密度高他反而專注。"
      - "這與本站 Vortex『依游者反應調整』同源——不規定『該有什麼感覺』，而是讀個別差異去配合。"
