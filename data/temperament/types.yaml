# 三種典型氣質（NYLS 分類）+ 無法歸類
# 來源：SYNTHESIS.md §2
note: "比例（40/10/15/35）為 NYLS 廣傳數字，🟡 須回原文核實；本站一律加「約」。三型是光譜不是抽屜——約 1/3 的孩子不完全屬於任一型。"
types:
  - key: easy
    name_zh: 安樂型
    name_en: Easy
    ratio: "約 40%"
    cert: "🟡"
    summary: 規律、正向、趨近、適應快、強度溫和。
    detail: 作息好安排、轉換順、情緒多正向。好帶——但「好帶」不代表不用陪，穩定的回應一樣重要。
  - key: difficult
    name_zh: 高需求型
    name_en: Difficult
    ratio: "約 10%"
    cert: "🟡"
    summary: 不規律、負向、退縮、適應慢、強度激烈。
    detail: 作息亂、怕生、抗拒轉換、情緒容易爆。傳統稱「磨難型」，但氣質沒有好壞——這型孩子在「對的環境配合」下一樣發展得好，關鍵是適配，不是改造他。風險只在「不良適配」時才會實現。
  - key: slow_to_warm
    name_zh: 慢熱型
    name_en: Slow-to-warm-up
    ratio: "約 15%"
    cert: "🟡"
    summary: 初遇新事物退縮，反覆溫和接觸後逐漸適應；強度中低、情緒中性。
    detail: 給時間、給預告，他會自己暖起來。慢熱不是膽小，是需要先觀察再加入。
  - key: mixed
    name_zh: 混合型
    name_en: Mixed / 無法歸類
    ratio: "約 35%"
    cert: "🟡"
    summary: 九維度無清楚模式，不落入三型。
    detail: 這其實是最大的一群——提醒我們「三型」只是參考，孩子的真實樣貌要看九維度剖面。把上面的九維度當主要參考，三型當輔助。
