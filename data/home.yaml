# 首頁資料：四個領域 + 各自的入口。
#
# 舊的 data/books.yaml（書架卡片）已廢除——首頁的單位不再是「書」而是「領域」，
# 書降格成領域裡的一筆來源出處。書架隱喻逼每個項目都得長得像一本書，所以 Vortex
# 這種不是書的東西當初根本沒地方放，首頁只覆蓋到站上不到一成的內容。
#
# 新增入口改這裡，不動 layout。spec 那行的數字必須對得上 data/ 實況，不是形容詞。

site_line: "四個領域的知識庫。書是來源，不是單位。"

