      '
  - muscle_id: movement.muscle.shoulder-internal-rotator-extensors
    role: '肩內旋伸展肌群的作用線在解剖上可參與肩內收方向的移動與位置控制；本筆不由 胸口轉動與手臂後推的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群的作用線在解剖上可參與肘伸展方向的移動與位置控制；本筆不由肘部逐漸 伸直的外觀判定實際招募時序、程度或推進貢獻。

      '
  measurement_conditions:
  - source_id: src.kudo-yanai-matsuda-2025
    quantity: 推水相中胸廓旋轉、肩內收與肘伸展三個成分對划水功率的相對貢獻；原文為單一組內的功率分解，未設對照組或介入條件
    value: 約 32%、37%、31%（三個成分在原文報告中的貢獻比例，彼此接近）
    conditions: 最大強度前爬泳的直接功率分解；本專案未逐字轉錄受試人數、量測協議與族群
    endpoint: stroke-power
    extrapolation_boundary: 只支持「推水相的划水功率由三個成分共同構成，且三者貢獻彼此接近」。不支持任一成分為主導、不支持划距、distance per stroke、推進力或競賽速度等其他終點，不支持任何最佳角度、旋轉幅度或訓練劑量，不得反過來寫成加大其中一項就會提高功率，也不得與同一原文的拉水相數值互換，更不得換算到 race-club 六相模型的後象限推進。
  name_zh: 推水相由胸廓旋轉、肩內收與肘伸展三個成分共同構成
  description: '胸廓繞長軸旋轉、肩複合體內收與肘伸展在推水相同時進行，不是依序接力。一手功率 分解顯示三個成分對划水功率的貢獻彼此接近；具體量測值只保留在本筆的 measurement_conditions，不放入公開敘述。

    動作圖譜本來就不裁定哪一個成分主導；本筆特別之處在於，一手量測本身顯示沒有 一個壓倒性的成分，可說明為何不作主導判定。貢獻接近只是該組受試者在該量測條件 下的結果，不表示三者一樣重要，也不是平均訓練三者的指示。

    這項量測的終點是划水功率的力學分解，不是關節角度；它沒有量測推水相中任何關節 處於何種角度或活動多少範圍。因此本筆不建立角度目標，action_status 仍是 provisional。

    另一個分期模型把接近的時間區段稱為後象限推進，庫內另有記錄；兩個模型的相位 邊界定義不同、不可互相換算，本筆的量測值只在本模型的推水相內成立。同一原文 另有拉水相的量測值，屬庫內既有的拉水相記錄，本筆不轉錄也不比較。

    本筆的肩、肘成分以關節局部角度命名，但 trunk.axial-rotation 的暴露量是軀幹 繞自身長軸的方位；兩者參考系不同，判讀時不可混用。

    '
  limitation_context: '軀幹旋轉、肩內收與肘伸展是三個獨立成分，量測給的是它們對功率的貢獻比例，不是 各自的活動範圍；不能由貢獻比例推出應該轉多少、內收多少或伸多少，也不能指出 限制位於哪一個關節。划距、推進力與競賽速度都不在本筆。

    '
  safety_note: '做後段推水與軀幹轉動時若出現肩部、肘部、背部或腰部疼痛、麻木、上肢放射症狀、 明顯無力或不穩應停止，不要為了讓三個動作同時結束而強行加大轉動或把肘鎖到底。

    '
- id: movement.demand.free.release.little-finger-orientation-is-not-a-rotation
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.hall-murphy-2020
  - src.neumann-2017
  stroke: free
  phase_model: race-club-6phase
  phase: release
  body_position: prone
  poolside_direction: 由池畔觀察，手推到大腿附近之後從水面拔出來，出水時小指那一側朝上、掌心大致朝向大腿（教學語稱「小指先出水」「掌心貼著大腿滑出來」）
  action_reference_frame: joint-local
  derived_from_ids:
  - free.tech.8
  - free.tech.37
  action_ids:
  - movement.action.shoulder-complex.extension
  - movement.action.elbow.flexion
  muscle_roles:
  - muscle_id: movement.muscle.latissimus-dorsi
    role: '背闊肌的作用線在解剖上可參與肩伸展方向的移動與位置控制；本筆不由手在大腿 附近離水的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群的作用線在解剖上可參與肘屈曲方向的移動與位置控制；本筆不由手被帶離 水面的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 釋放相的離水動作，與「小指朝上」不能反推關節旋轉
  description: '本相位可命名的關節內容只有肩複合體處在推水末端的伸展位並開始離開該位置，以及 肘由伸直開始屈曲而把手帶離水面。釋放相在關節層本來就只有這兩件事；內容薄是 相位本身的性質，不是漏寫。

    池畔所說「小指先出水」與「掌心貼著大腿滑出來」描述手的空間朝向。手在空間中的 朝向由肱骨軸向旋轉、前臂旋前旋後與腕位置共同形成，單看朝向無法區分改變來自 哪一個關節來源；完整論證見 movement.demand.free.catch.palm-orientation-three-source-decomposition， 本相位的具體應用是不能由小指朝上的外觀指定旋轉動作。同一外觀可以由不同關節 組合達成，因此 action_ids 刻意不列 movement.action.shoulder-complex.internal-rotation、 movement.action.shoulder-complex.external-rotation、 movement.action.forearm.pronation 與 movement.action.forearm.supination； 這四個動作都不能由該空間朝向單獨判定，並非漏列。

    本層並未宣告「小指先出水」是假的；原主張未必錯，本筆只指出由出水外觀推不出 它對應哪一個關節動作。判定主張真假與指出推論依據不足是兩件不同的事。

    「最小阻力出水」是力學後果，不在本層。出水之後手臂如何移動屬早期回臂，庫內 另有記錄，本筆只作指路而不重述其內容。

    '
  limitation_context: '肩伸展位置與肘屈曲是兩個獨立成分，手的空間朝向則是不屬於關節層的另一個觀察值； 池畔看到的「小指先出水」不能反推任何一個關節的旋轉方向，也不能指出限制位於 哪一個關節。出水阻力、划水效率與回臂內容都不在本筆。

    '
  safety_note: '做出水動作時若出現肩部、肘部或腕部疼痛、夾擠感、麻木、明顯無力或不穩應停止， 不要為了做出小指先出水的外觀而強行扭轉手臂。

    '
- id: movement.demand.free.early-recovery.scapular-upward-rotation-with-wrist-neutral
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.hall-murphy-2020
