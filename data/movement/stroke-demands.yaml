  poolside_direction: 由池畔觀察，泳者水下最後一次海豚踢向下打出的同時手臂開始第一划，兩者接在一起沒有空檔；踢腿幅度小、頻率高，臀部沒有大幅上下起伏（教學語稱「最後一踢接第一划」「不要有空窗」「屁股不要亂晃」）
  action_reference_frame: joint-local
  derived_from_ids:
