    role: '肘伸肌群在解剖上可參與肘接近伸展的位置控制；接近伸展的外觀不能 判定實際收縮型態，也不能等同肌力、關節力矩或推進貢獻。

      '
  name_zh: 仰式回臂期的上舉平面軌跡與必要外旋
  description: '回臂是手臂繞到頭頂上方的弧形上舉。這段應描述為上舉平面的軌跡： 手臂由伸展側的後方移向額狀面，再移向矢狀面前方；它不是肩伸展、 外展與屈曲三個動作依次接力，而是同一上舉動作跨越不同平面。上舉 過程中肱骨必然伴隨外旋，肩胛骨也可同時上提與上迴旋。肘在大部分 回臂時間接近完全伸展；直臂與彎臂型式都存在，會隨個體與距離而異， 不能把任一型式寫成唯一正確形式。

    '
  limitation_context: '回臂型式會受到肩部可用上舉範圍影響；可用範圍不足時，強行採用某一 型式與肩部不適有關。這裡只陳述限制的存在，不指定應採用直臂或彎臂， 也不由回臂外觀判定限制來源。

    '
  safety_note: '回臂或接近頭頂上舉時若出現肩部或肘部疼痛、夾擠感、麻木、明顯無力 或不穩，應停止，不要強行維持特定回臂型式或壓向上舉終端。

    '
