  - breast.tech.8
  action_ids: []
  muscle_roles: []
  name_zh: 蛙式換氣的三個事件分離
  description: '蛙式換氣不是一個瞬間，而是三個分開的事件：頭開始上升、臉破出水面、 以及吸氣。教材把頭開始上升放在有深度的拉手段，把臉破水另外放在 內掃相並強調不會比這更早發生，吸氣又是第三個事件。上身被抬起來的 動力來源是手臂的運動，不是主動抬頭，也不是主動拱背。

    '
  limitation_context: '本筆不指名任何肩胛骨層級的動作。教材寫的是體表可見的肩部整體上升， 沒有任何一層資料量測肩胛骨相對胸廓的位置，因此肩胛帶上提屬於證據 缺口，不得寫入。兩本教材使用不同的分期命名系統，這是兩套命名而 不是學界分歧；引用任何一句都必須說明採用哪一套分期。

    '
  safety_note: '練習換氣時序時若出現頸部或腰背疼痛、麻木、上肢放射症狀、明顯無力 或不穩，應停止，不要為了換到氣而用力抬頭或拱腰。

    '
