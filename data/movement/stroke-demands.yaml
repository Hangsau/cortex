      '
  name_zh: 晚期回臂的上舉與肘伸展，以及「砸水」與「轉體」不是兩個指令
  description: '本相位可命名的關節動作是肩複合體上舉與肘伸展。手臂越過肩膀後往前落下的過程 對到 movement.action.shoulder-complex.elevation，肘由屈曲轉向伸直則對到 movement.action.elbow.extension；伸展程度隨回臂光譜而異，本層不裁定肘應伸到 哪一個位置。

    池畔所說「靠重力把手砸下去」描述的是作用在手臂上的外力，不是任何關節產生的 動作。action_ids 列的是手臂通過這段軌跡時的關節構型，不是在說明何種力量把 手臂帶下去。

    池畔所說「手砸得越用力、身體轉得越快」，是同一個連動的兩個觀察面。手落下的 強度與軀幹轉向另一側的速度在池畔可以分別看見，但不是兩個可以分別下令的關節 動作；因此本筆不把「轉體」另列成 action，以免讀成可以獨立操作的動作，這不是 漏列軀幹旋轉。本層只記錄兩個表現屬同一連動，不給教學選邊指示。

    池畔所說「手腕放鬆」在本筆記為腕中立。action_ids 同時列出 movement.action.wrist-hand.flexion 與 movement.action.wrist-hand.extension， 兩個都是記錄「不做」，不是要求腕屈曲與腕伸展；腕中立是屈伸兩側都要避開的 位置控制。

    晚期回臂在手接觸水面之前結束，入水瞬間的內容不屬本筆；入水期肩線滾轉見 movement.demand.free.entry.shoulder-line-roll-peak，本筆只作指路而不重述。 入水角度、手部姿態與入水阻力比較都屬入水期，也涉及數值或力學後果，本筆一律 不寫。連動的完整機制以及肩與髖旋轉峰的時間關係屬另一主題，本筆同樣不承載。

    '
  limitation_context: '肩上舉、肘伸展與腕中立是三個獨立成分，手落下的速度與軀幹轉速是同一個連動的 兩個表現，而不是額外的可操作成分；池畔看到的「砸得很有力」不能指出限制位於 哪一個關節，也不能由落手外觀判定軀幹轉動是否到位。入水姿態、入水阻力與連動 的力學後果都不在本筆。

    '
  safety_note: '做回臂下落與入水前加速時若出現肩部疼痛、夾擠感、肘部或腕部疼痛、麻木、明顯 無力或不穩應停止，不要為了把手砸得更用力而強行加大擺臂幅度或用力甩腕。

    '
- id: movement.demand.udk.terminal-down-kick.hip-external-rotation-and-missing-adduction-term
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.neumann-2017
  stroke: udk
  phase_model: descriptive
  phase: terminal-down-kick
  body_position: prone
  poolside_direction: 由池畔或水下窗觀察，海豚踢往下打到接近最低點時，兩隻腳往中間靠、腳尖幾乎併在一起，膝蓋這時已經打直（教學語稱「腳尖夾起來」「最後把水擠出去」）
  action_reference_frame: joint-local
  derived_from_ids:
  - udk.tech.6
  - udk.tech.9
  action_ids:
  - movement.action.hip.external-rotation
  - movement.action.knee.extension
  muscle_roles:
  - muscle_id: movement.muscle.hip-external-rotators
    role: '髖外旋肌群的作用線在解剖上可參與髖外旋方向的移動與位置控制；本筆不由雙腳 聚攏或腳尖靠近的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '膝伸肌群的作用線在解剖上可參與膝伸展方向的移動與位置控制；本筆不由膝蓋 已經打直的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 下踢末段的髖外旋與膝伸展，以及「雙腳聚攏」的成分歸屬
  description: '池畔所說「兩隻腳往中間靠」「腳尖聚攏」直覺上會被叫成內收或夾腿，素材卻把 這個現象歸給髖外旋，兩欄的方向並不相同。素材描述的是大腿繞自身長軸向外轉， 小腿與足因而被帶到相對靠內的位置；看起來像夾，素材實際命名的卻是轉。池畔的 「靠攏」是足部在空間中的位置變化，髖外旋則是大腿繞長軸的旋轉，兩者不是同一個 量，因此不能由足部位置反推髖旋轉的程度。

    足部靠攏這個可見現象除了髖外旋之外，還可能包含髖內收成分。動作詞彙表已 登錄髖內收（movement.action.hip.adduction），但本筆的素材把這個現象歸給 髖外旋，只把內收列為「還可能包含」的成分，沒有量到它實際發生多少；因此 action_ids 刻意不列髖內收——列進去等於用一個未被素材支持的歸屬去填滿 列舉，那不是把缺口補起來，而是把不確定寫成確定。action_ids 同樣刻意不列 髖外展來反向表示聚攏；列出髖外展會被讀成這個相位要做外展，意思正好相反。

    池畔看到「膝蓋這時已經打直」與膝伸展的解剖命名一致，對到 movement.action.knee.extension，不需要轉譯。下踢前段的膝屈曲屬下踢相位本身， 庫內已有記錄，本筆不重述。踝蹠屈也已由下踢相位的既有記錄承載，因此 action_ids 刻意不列踝蹠屈；這不是表示本相位沒有踝的參與，而是相關通則已記錄在別處， 重複列出會使兩筆內容互相覆蓋。

    池畔所說「踢完會甩出一團水」與「最後把水擠出去」描述的是水流結構，也就是 關節動作在水中造成的流體力學結果，不是一個可以被命名或下指令的關節動作， 因此本層不承載這項結果。

    素材所說「髖啟動→膝踢出→末段聚攏」描述的是事件在時間上的相對位置，屬於 時序；在 joint-local 框架下，沒有任何單一關節動作可以承載這個序列。序列開頭 的髖屈曲屬下踢相位，庫內已有記錄，本筆不重述；本層也不把這串時序改寫成訓練 順序或動作門檻。

    '
  limitation_context: '髖外旋與膝伸展是兩個獨立成分，足部在空間中的靠攏程度是另一個不屬於關節層的 觀察值；池畔看到的「腳尖夾得很好」是這些成分的合成，不能指出限制位於哪一個 關節，也不能由腳尖位置判定髖外旋是否到位。靠攏之中屬於髖內收的部分有沒有 發生、發生多少，本筆的素材沒有量到，因此仍是未知，而不是已排除。渦流結構、 推進力、踢腿速度與出水銜接都不在本筆。

    '
  safety_note: '做下踢末段的腿部轉動與伸展時若出現髖部、鼠蹊、膝部、腰背或踝部疼痛、麻木、 明顯無力或不穩應停止，不要為了把腳尖夾得更緊而強行轉動大腿或把膝蓋鎖到底。

    '
- id: movement.demand.fly.breathing-window.cervical-extension-avoidance-in-an-event-window
  claim_status: partially-supported
