      '
  name_zh: 起跳的後腿方向反轉、繞臂差在肘不在肩，與關節間時序
  description: '池畔看到、教練也會說的是「後腿往上踢，踢到接近垂直、腳尖朝上」。 只看腿往上會直覺把它記成髖屈曲，但起跳瞬間軀幹前傾下潛；以軀幹 為參考，大腿是往軀幹後方去，所以正確命名是髖伸展，並伴隨膝伸展 與踝蹠屈。

    這是同一類方向命名問題的另一個方向。庫內的仰躺上踢在池畔也看成 「往上」，解剖上卻是髖屈曲；起跳後腿在池畔同樣看成「往上」， 解剖上則是髖伸展。兩者的差別完全來自軀幹的空間朝向，不是腿的 空間動作不同。池畔可見方向與解剖學動作必須分欄，因為只看「往上」 會在這兩個相位得到方向相反的錯誤答案。本筆不記錄後腿踢的能量貢獻 或排名，也不由「腳尖朝上」反推踝或髖的旋轉；腳尖的空間朝向是髖、 膝與踝多個自由度的合成。

    池畔所說繞臂的「大圓」與「小圓」走的是同一個肩動作，也就是肩複合體 在矢狀面上舉；差別在肘是否維持伸展。肘屈伸改變的是上肢轉動慣量， 不是肩的動作名稱，因此 action_ids 同時列肘伸展與肘屈曲，本筆不把 任一種寫成錯誤做法，也不判定哪一種較快。

    池畔所說「起跳瞬間抬頭看遠處」解剖上是頸椎伸展；action_ids 使用 trunk.extension，此處指的是頸椎節段。零位的頭部設置是起始位置之爭， 起跳期的抬頭則是動作，兩者不是同一件事，不能互相引用代替。

    另一筆仰式起跳素材以「臀部先出水再蹬腿」描述髖伸展先於膝伸展。 這對到的是兩個關節的先後次序，不是單一動作；此相位髖伸展與膝伸展 的先後本身帶有力學後果，壓成一個動作名會遺失資訊。該時序描述出自 仰式起跳，本筆的 body_position 是 prone，不把它外推到俯臥起跳。

    '
  limitation_context: '髖伸展、膝伸展、踝蹠屈、肩上舉、肘屈伸與頸椎伸展是彼此獨立的成分， 它們之間的先後次序又是獨立維度。池畔看到的「起跳」是這些成分的合成， 不能指出限制位於哪一個關節，也不能由起跳外觀的快慢反推任一關節的 可用範圍。地面反作用力分工、慣用腳選擇與起跳時間是運動學量測， 不在本層。

    '
  safety_note: '起跳時若出現腰部、髖部、膝部或肩部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要為了把後腿踢得更高或把繞臂做得更大而勉強增加伸展幅度。

    '
