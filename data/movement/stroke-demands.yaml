    role: '肩胛上旋肌群的作用線在解剖上可參與肩胛上旋方向的移動與位置控制； 本筆不由手臂向外側分開的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '旋轉肌袖的作用線在解剖上可參與肱骨上舉與軸向旋轉方向的移動及 盂肱關節位置控制；本筆不由手臂轉向下方的外觀判定實際招募時序、 程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群的作用線在解剖上可參與肘屈曲方向的移動與位置控制；本筆 不由肘部由較直轉為彎曲的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 自由式抓水期的上舉平面移動與旋轉起始
  description: '「由屈曲轉為外展」不是關節角度改變。解剖來源明說，把手臂舉過頭 這個動作，在接近矢狀面時被非正式地稱為屈曲，在接近額狀面或肩胛 平面時被非正式地稱為外展。這是同一個上舉動作的兩個名字，差別在 上舉所處的平面，而且來源本身也把這種用法標注為非正式。

    正確描述是上舉平面由矢狀面移向肩胛平面或額狀面。若手臂已在接近 上舉一半的高度，該平面內的向後移動應改稱水平外展；這個名稱的定義 綁在上舉一半的起始位置。action_ids 同時列出上舉與水平外展，是因為 抓水期橫跨這個界線，適用哪一個名稱取決於當下的上舉高度；本層列舉 兩者，不裁定切換點。

    「開始內旋」這半句成立。內旋是肱骨繞縱軸的動作，與上舉平面是 互相獨立的兩個軸，可以同時發生；肘開始屈曲也成立。

    根因是欄位缺口，不是命名錯誤。原表用「屈曲／外展」單一欄位承載 一個三維動作，缺少獨立的「上舉平面」欄位；只要相位跨越平面， 同一缺陷就會在其他相位重複出現。治本方向是把上舉平面設為獨立 欄位，不是換一個更準的單字。

    '
  limitation_context: '本筆只承載命名與欄位結構，不含推進歸屬，也不含「高肘抓水／EVF」 的任何內容；後者涉及前臂朝向與推進假設，不在本層。derived_from_ids 指向的兩條記錄描述同一相位，但其流體與推進主張不由本筆繼承。

    '
  safety_note: '動作中若出現疼痛、卡住、麻木、明顯無力或不穩，應停止，不要勉強 改變手臂方向或增加動作範圍。

    '
