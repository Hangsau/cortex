      '
  name_zh: 蛙式捕水的水平內收命名與旋轉方向反轉
  description: '捕水時肱骨停止遠離中線、開始朝中線移動，這個方向反轉本身描述成立。 但捕水時手臂位於體前、上舉接近直角，肱骨朝中線移動的正確名稱是 水平內收，不是額狀面的內收。用錯基準會讓後續活動度比較與陸上輔助 動作對到不同平面的動作。

    外划期的外旋在捕水期轉為內旋，是肱骨繞自身縱軸的旋轉方向改變， 直接對應解剖定義，而且不依賴任何從手掌朝向做的反推。手掌在空間中 朝哪裡與前臂、肱骨的關節位置是不同欄位，不能彼此取代。

    肘屈曲增加的方向描述成立。教材另有「高肘」一詞，該詞涉及肘相對 手掌的高度、前臂朝向與推進假設，不在本層的裁決範圍；本筆不描述 其做法或判準。

    '
  limitation_context: '水平內收、軸向內旋與肘屈曲各自獨立；池畔看到的「手收攏」是三者 的合成，不能指出限制在哪一項，也不能由外觀指定任何肌群的收縮方式。

    '
  safety_note: '捕水時若出現肩前側疼痛、卡住、麻木、明顯無力或不穩應停止，不要 為了讓手更快收攏而加大內旋幅度。

    '
