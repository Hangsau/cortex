    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩胛上迴旋方向的移動與位置控制；本筆 不由提肘與肩胛骨往上轉的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群的作用線在解剖上可參與肘屈曲方向的移動與位置控制；本筆不由彎臂或 直臂回臂的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-flexors
    role: '腕屈肌群的作用線在解剖上可參與腕屈方向的位置控制與維持；本筆不由手腕放鬆 的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-extensors
    role: '腕伸肌群的作用線在解剖上可參與腕伸方向的位置控制與維持；本筆不由手腕放鬆 的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 早期回臂的肩胛上旋、肘屈曲光譜與腕中立
  description: '池畔所說「肩胛骨往上轉」對到 movement.action.shoulder-complex.scapular-upward-rotation，是本相位少數 真正在產生的動作，池畔方向與解剖命名一致。肩胛上旋與盂肱關節動作分屬不同 體節，是兩件事；池畔看到的「提肘」是兩者的合成，不能把兩層當成同一動作。

    池畔所說「手腕放鬆」在本筆記為腕中立。action_ids 同時列出 movement.action.wrist-hand.flexion 與 movement.action.wrist-hand.extension， 兩個都是記錄「不做」，不是要求產生腕屈曲與腕伸展。腕中立是屈伸兩側都要避開 的位置控制，不是一個方向的動作。

    池畔所說「彎臂回臂／直臂回臂」是肘屈曲程度的連續光譜，從明顯屈曲、部分伸展 到幾乎打直之間沒有分界。action_ids 只列 movement.action.elbow.flexion， 承載的是本相位存在肘屈曲且程度可變，不是要求屈曲到特定程度。本層不裁定應選 光譜上的哪一個位置；素材將選位連到距離與專項，屬教學決策。素材中的能量代價 比較是力學量，不是關節動作，本筆不承載也不引用其數值。

    回臂後半段的下落與加速屬晚期回臂，庫內另有記錄；手出水的瞬間屬釋放相，也有 另一筆記錄。本筆對兩者都只作指路，不重述其內容。

    '
  limitation_context: '肩胛上旋、肘屈曲程度與腕中立是三個獨立成分；池畔看到的「提肘提得很漂亮」是 三者的合成，不能指出限制位於哪一個關節，也不能由肘部高度的外觀判定肩胛上旋 是否到位。回臂的能量代價、適用距離與風格歸類都不在本筆。

    '
  safety_note: '做回臂動作時若出現肩部疼痛、夾擠感、頸部或上背疼痛、麻木、明顯無力或不穩 應停止，不要為了把肘抬得更高而強行聳肩、加大肩胛動作或把手臂繞得更開。

    '
