  - movement.action.wrist-hand.extension
  muscle_roles:
  - muscle_id: movement.muscle.shoulder-internal-rotator-extensors
    role: '肩內旋兼伸展肌群的作用線在解剖上可參與肩伸展、內旋方向的移動與 位置控制；本筆不由雙手向後推的外觀判定實際招募時序、程度或推進 貢獻。

      '
  - muscle_id: movement.muscle.latissimus-dorsi
    role: '背闊肌的作用線在解剖上可參與肩伸展、內收與內旋方向的移動及位置 控制；本筆不由手部接近大腿的外觀判定實際招募時序、程度或推進 貢獻。

      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群的作用線在解剖上可參與肘伸展方向的移動與位置控制； 本筆不由肘部轉為伸直的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-extensors
    role: '腕伸肌群的作用線在解剖上可參與腕伸展方向的移動與位置控制； 本筆不由推水時的手部外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 蝶式上划的肩伸展、內旋維持與肘腕伸展
  description: '肩伸展的名稱描述移動方向，不是絕對位置；只要肱骨朝解剖位置的後方 旋轉就稱為伸展，不論它尚在往零度靠近或已越過零度。蝶式推水期手臂 由身體下方向大腿移動，肱骨會越過零度進入伸展側。主動可達的額狀面 後方伸展範圍有限，但推水末端所需的伸展量落在一般解剖可用範圍內。

    抓水轉為內旋後，內掃與上划維持同一旋轉方向，內收位的內旋可用範圍 在解剖上餘裕充足。本筆只承載肩內旋持續；原始敘述中的加速屬相位內 速度剖面，大腿外側則是手在空間中的終點，由肩伸展量、內收量與軀幹 姿態合成。兩者都需要游泳專項文獻，本層不承載。

    肘由屈曲位朝零度方向移動稱為伸展，這項命名成立且不附掛游泳構念。 解剖來源把肘伸展與推的動作情境直接連結，與推水的力學語意一致； 但這只是命名層的吻合，不構成對推進機制的支持。

    腕伸展的方向成立，並與入水時的腕屈曲構成互逆的一對。腕伸展終末 受到掌側韌帶僵硬度限制，而且可用範圍本來就比屈曲少；這可供記錄 個別差異，但解剖來源不裁決游泳中該使用多少，不能改寫成建議。

    '
  limitation_context: '肩伸展、軸向內旋、肘伸展與腕伸展是四個獨立成分；池畔看到的推到 大腿是四者加上軀幹姿態的合成，不能指出限制在哪一項。推進力大小、 加速時序與手部終點位置都不在本層。

    '
  safety_note: '推水時若出現肩前側或腕部疼痛、卡住、麻木、明顯無力或不穩應停止， 不要為了把手推得更後面而勉強增加肩伸展或腕伸展。

    '
- id: movement.demand.fly.exit.extension-position-with-blank-rotation-field
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  stroke: fly
  phase_model: descriptive
  phase: exit
  body_position: prone
  poolside_direction: 由池畔觀察，雙手在大腿旁離開水面，教學語常描述為拇指側先出水（教學語稱「出水」）
  action_reference_frame: joint-local
  derived_from_ids:
  - fly.tech.20
  action_ids:
  - movement.action.shoulder-complex.extension
  muscle_roles:
  - muscle_id: movement.muscle.shoulder-internal-rotator-extensors
    role: '肩內旋兼伸展肌群的作用線在解剖上可參與肩伸展方向的移動與位置 控制；本筆不由拇指側先離水的外觀判定實際招募時序、程度或推進 貢獻。

      '
  name_zh: 蝶式出水的肩伸展位，與留白的旋轉欄位
  description: '出水時的肩伸展位與上划連貫，落在主動可達的後方範圍內。這是本筆 唯一能直接承載的關節動作，因此 action_ids 只列肩伸展。

    拇指側先出水不是關節動作，本層不以它填寫動作欄；它描述的是手在 空間中的方位與出水順序。本筆的實際症狀是旋轉欄位留白：教材只寫 肩的屈伸狀態，旋轉欄位空著，而拇指朝向是整條上肢旋轉的合成結果。 解剖來源指出，手部朝向的改變可以完全由肩關節軸向旋轉造成，不需要 前臂旋轉；因此由拇指朝向反推前臂旋後或任何單一關節的旋轉都不成立。 判定旋轉需要肱骨本身的參考標記或影像。

    治本方向是把內旋或外旋設為必填欄位；若量到中立，應明寫中立而不是 留白。旋轉欄位整格空著時，讀者無法分辨是量到中立還是沒有記錄， 兩者在判讀上完全不同。可用的肩伸展描述成立，但旋轉欄位不完整， 這是本筆只給 partially-supported 的理由。

    '
  limitation_context: '本筆只承載肩伸展位。出水順序、拇指朝向、前臂與腕的旋轉狀態全部 未記錄，不得由本筆推論它們處於中立或任何特定方向。

    '
  safety_note: '出水時若出現肩後側或肩前側疼痛、卡住、麻木、明顯無力或不穩應停止， 不要為了做出特定的出水手型而改變肩的旋轉位置。

    '
- id: movement.demand.udk.streamlined-glide.scapulohumeral-dual-clearance
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  stroke: udk
  phase_model: descriptive
  phase: streamlined-glide
  body_position: prone
  poolside_direction: 由池畔觀察，推牆後雙臂夾耳伸直、雙手在頭前疊合，身體拉成一直線
  action_reference_frame: joint-local
  derived_from_ids:
  - udk.tech.24
  action_ids:
  - movement.action.shoulder-complex.elevation
  - movement.action.shoulder-complex.external-rotation
  - movement.action.shoulder-complex.scapular-upward-rotation
  - movement.action.shoulder-complex.scapular-posterior-tilt
  - movement.action.shoulder-complex.scapular-elevation
  muscle_roles:
  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩胛上迴旋、後傾方向的移動 與位置控制；本筆不由雙臂夾耳的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.scapular-elevators
    role: '肩胛上提肌群的作用線在解剖上可參與肩胛上提方向的移動與位置控制； 本筆不由肩帶靠近耳側的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '旋轉肌袖的作用線在解剖上可參與肱骨外旋方向的移動與盂肱位置控制； 本筆不由流線姿勢的肩部外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 流線滑行的肩部避讓機制與肩胛三軸必然性差異
  description: '手臂舉到頭前最大上舉時，解剖來源描述兩個同時發生、方向不同的讓位 動作：肱骨外旋讓肱骨大結節從肩峰後方通過，肩胛骨後傾讓喙肩弓遠離 前進中的肱骨頭。兩者處理的是同一件事，一個轉肱骨、一個轉肩胛； 所以在流線姿勢同時標出外旋與後傾不是重複記錄，而是兩個獨立欄位。

    三個肩胛成分的必然性不同。上迴旋是抬臂過頭的必要組成，後傾是上舉 過程中的必然伴隨成分；肩胛上提不在解剖來源列出的必然清單裡，只是 容許有一些。把三者並列而不區分，會使讀者誤以為需要同等地做出三個動作。

    解剖來源指出，純額狀面上舉與肩胛骨平面上舉的強制外旋耦合程度不同， 額狀面的耦合較強。因此雙臂夾耳但肩胛平面沒有跟上，與整個肩帶沿 肩胛平面上舉，是外旋需求不同的兩種狀況。本層只列出差異存在，不判定 哪一種比較好。

    '
  limitation_context: '上舉角度、上舉平面、肱骨外旋、肩胛上迴旋、後傾與上提各有獨立的 可用範圍與控制條件；從池畔看到的手臂夾耳伸直是這些成分的合成， 不能指出限制位於哪一個關節或哪一個成分。外旋可用範圍也會隨起始 上舉角度改變，由手臂貼體側起算與由高上舉位起算不是同一個可用範圍， 所以陸上量到的外旋角度不能直接搬到流線姿勢的判讀。教材另有「減少 迎水面積」一類說法，該說法屬水動力學，不在本層裁決範圍。

    '
  safety_note: '進入或維持流線姿勢時若出現肩部疼痛、卡住、麻木、明顯無力或不穩 應停止，不要靠外力把手臂往耳側壓，也不要為了把手臂夾得更緊而增加 上舉角度。

    '
