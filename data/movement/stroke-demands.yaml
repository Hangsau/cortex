  poolside_direction: 由池畔觀察，蝶式泳者換氣時下巴沿著水面往前推出去吸氣，臉幾乎是擦著水面出來的，不是把頭仰起來看前方；吸完之後頭很快回到原位（教學語稱「下巴向前不要向上」「吸完馬上把頭放回去」）
