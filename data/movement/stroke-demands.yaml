      '
  - muscle_id: movement.muscle.shoulder-internal-rotator-extensors
    role: '肩內旋伸展肌群的作用線在解剖上可參與肩伸展方向的移動與位置控制；本筆不由 後段推水的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群的作用線在解剖上可參與肘伸展方向的移動與位置控制；本筆不由出手前 肘部伸直的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 後象限推進的肩伸展與肘伸展，以及「髖部往後甩」的解剖歸屬
  description: '本相位可命名的關節動作是肩伸展與肘伸展。手由身體下方往後移動對到 movement.action.shoulder-complex.extension，肘由屈曲轉為伸直對到 movement.action.elbow.extension；兩者的池畔可見方向與解剖命名一致。 本筆不推定兩者的先後，也不判定誰出力較多。

    池畔所說「手走到時鐘指定位置、推到底」是手相對靜水的空間位移，不是任何關節 的角度。時鐘位置不能反推肩、肘或軀幹角度，相同的手部位置可以由不同的關節 組合達成。

    池畔也會說「推進力在這裡最大」。推進力是力學量，不是關節動作，本層不承載 也不裁定；而且素材本身描述推進峰值的位置會隨風格提早或延後，並非固定位置， 因此不能把「這裡最大」寫成本相位的定義性質。本層不比較任何風格的優劣。

    池畔所說「出手時髖部往後甩」，也會表達成「屁股甩一下」或「髖部發力」，直覺 容易把骨盆快速轉過去命名成髖關節動作。解剖上，這是軀幹繞長軸旋轉在骨盆端 呈現的結果，對到 movement.action.trunk.axial-rotation，不是髖關節在做屈曲 或伸展。髖伸展是大腿相對骨盆往背側移動，與這個可見轉動不同，在本相位的該 現象中沒有發生。因此 action_ids 刻意不列 movement.action.hip.extension， 以免把池畔外觀誤寫成此相位要求髖伸展。

    另一個分期模型把接近的時間區段稱為推水相，庫內另有記錄；兩個模型的相位邊界 定義不同、不可互相換算，任何一方的量測數值都不得搬到另一方。本筆只作指路， 不重述另一筆內容。

    本筆的肩、肘成分以關節局部角度命名，但 trunk.axial-rotation 的暴露量是軀幹 繞自身長軸的方位；兩者參考系不同，判讀時不可混用。

    '
  limitation_context: '肩伸展、肘伸展與軀幹旋轉是三個獨立成分；池畔看到的「推得很紮實」是三者的 合成，不能指出限制位於哪一個關節，也不能由出手位置的外觀判定任何成分已經 到位。推進力大小、峰值位置、風格歸類與划距都不在本筆。

    '
  safety_note: '做後段推水與軀幹轉動時若出現肩部、肘部、背部或腰部疼痛、麻木、上肢放射症狀、 明顯無力或不穩應停止，不要為了把手推得更後面而強行增加肩伸展幅度或用腰去補 轉動。

    '
