  evidence_profile: swimming-kinematics
  source_ids:
  - src.chollet-2006
  - src.seifert-2008
  - src.riewald-rodeo-2015
  - src.sanders-1995-a
  - src.hall-murphy-2020
  stroke: fly
  phase_model: descriptive
  phase: first-kick
  body_position: prone
  action_reference_frame: body-fixed
  derived_from_ids:
  - fly.tech.7
  - fly.tech.4
  action_ids:
  - movement.action.hip.flexion
  - movement.action.knee.extension
  muscle_roles:
  - muscle_id: movement.muscle.hip-flexors
    role: '作為調整大腿相對骨盆位置並承接體波傳遞的候選角色。本批來源未 提供蝶式此相位的肌電，因此不固定實際招募、收縮型態或貢獻大小。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '作為膝伸展與小腿方向控制的候選角色。本批來源未提供蝶式此相位的 肌電，因此不固定實際招募、收縮型態或推進貢獻。

      '
  measurement_conditions:
  - source_id: src.sanders-1995-a
    quantity: '頭頂、肩、髖、膝、踝五個體表點垂直位移的傅立葉相位；量的是體波 沿身體由頭端向尾端傳遞的連續相位差，不是幾個離散的啟動時點

      '
    value: 原文以各點的相位角報告傳遞順序；本專案未轉錄其角度值與統計量
    conditions: '8 名男性與 8 名女性菁英蝶式泳者；以各體表點垂直位移的傅立葉分解 取相位，描述整條體波的傳遞，未對單次踢的力量作比較。

      '
    endpoint: body-wave-phase
    extrapolation_boundary: '只支持體波為由頭端向尾端連續傳遞的相位波。不支持把它拆成頭、肩、 髖、膝四個離散啟動事件，不支持任何時序門檻或劑量，也不支持排列 兩次踢的用力高低。

      '
  - source_id: src.hall-murphy-2020
    quantity: '教材單一測試例中，最大屈髖角的角度值與其相對手入水的時間延遲； 教材同段另描述屈膝開始時出現明顯減速

      '
    value: '最大屈髖約 25 至 30 度，出現在手入水後約 0.12 秒（教材測試例， 未報樣本數與統計）

      '
    conditions: '教材以其自有分析描述一個測試例，該瞬間胸部下壓、肩位於最深處； 未報告樣本數、統計量、族群與速度條件。

      '
    endpoint: joint-angle
    extrapolation_boundary: '只作教材測試例的定性條件描述，不是姿勢目標、不是可訓練門檻，也 不能推出族群通則。此數值是關節角，不能讀成髖部在空間中的升降 方向；同段教材另量到屈膝開始時的明顯減速，因此不得把屈膝寫成 蓄力。

      '
  name_zh: 蝶式第一踢的時序與體波承接需求
  description: '蝶式第一次下踢位在手臂入水與捕水到拉水前段的時間窗。它接住由 上身鐘擺動作經髖部傳向足部的體波，順著這股傳遞協助身體前轉。 這一踢是體波的承接端，腿不是體波的起點；教材將它描述為耗能低， 不需要以大力完成。量測顯示這股體波是由頭端向尾端連續傳遞的相位 波，各體表點依序達到各自的位移轉折，而不是幾個分開啟動的動作。 空間方向上要特別注意：肩部下沉的同時，髖部是往上走的。

    '
  limitation_context: '手入水、捕水與拉水是界定時間窗的不同事件，不能把入水、外掃、 壓胸與推進合併成同一瞬間。不同研究各自採用手臂事件與腿部轉折 作錨點，應保留各自的操作定義。現有資料未提供兩次踢的同協議 力量比較，因此不能排列兩次踢的用力高低。以下四種寫法都不成立： 把髖部寫成跟著肩部一起下壓（教材原文是肩下沉時髖上升）；把屈膝 寫成蓄力（教材在屈膝開始處量到的是明顯減速）；宣稱腳踝鞭動到 出水面（沒有任何踝角度或水面穿越的量測）；把連續傳遞的相位波 壓成頭、肩、髖、膝四個離散啟動時點。

    '
  safety_note: '配合入水練習下踢時若出現腰背、髖部或膝部疼痛、麻木、明顯無力 或不穩，應停止，不要為了追求節律而強行加大動作。

    '
