      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群在解剖上可參與肘由屈曲朝伸展方向移動；是否在此相位採用 及採用程度，仍需泳者運動學與相位化肌電資料支持。

      '
  - muscle_id: movement.muscle.wrist-extensors
    role: '腕伸肌群在解剖上可參與腕由屈曲轉向中立或輕度伸展；本筆不由 手部空間方位推定收縮型態、力量或推進作用。

      '
  name_zh: 仰式推水期的肩伸展、內旋與肘伸展需求
  description: '推水時手臂由體側移向髖部，肱骨相對軀幹向後形成肩伸展，並同時繞 長軸內旋；肘由屈曲位朝伸展方向移動，直到接近完全伸展；腕則由屈曲 轉為中立或輕度伸展。肩內旋、伸展與內收分屬不同軸，可以同時發生。 教學語所說的「打直」在這裡是接近完全伸展，不是要求抵達終末骨性 止點或把肘「鎖死」；肘沒有膝部的旋轉鎖定機制，正常終末是鷹嘴進入 鷹嘴窩的骨性限制。

    '
  limitation_context: '肩伸展、肱骨內旋、肘伸展與腕部轉向各有獨立的可用範圍與控制條件， 任一層都可能改變手臂靠近髖部時的合成外觀。手部在空間中的朝向也 不能單獨指定為腕動作或肱骨旋轉。

    '
  safety_note: '推水末段若出現肩部、肘部或腕部疼痛、夾擠感、卡住、麻木、明顯無力 或不穩，應停止，不要強行把肘壓向終末止點或扭轉手腕。

    '
