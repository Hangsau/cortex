      '
  name_zh: 飛行期的姿勢達成——關節動作不改變重心軌跡
  description: '飛行期的任務是姿勢達成，不是產生推進。池畔看到泳者離台後在空中 收攏身體，但離台之後身體是拋體，任何關節動作都不能改變重心軌跡， 也不能改變落點。關節動作能改變的是各身體節段相對重心的分布， 以及整體角動量在各節段間的分配，不能救回已經形成的起跳軌跡。

    池畔所說「腿不要打開」記錄的是維持，不是要發生的動作。action_ids 列出 hip.abduction，是為了表明髖維持在不外展的位置，不能把這個 ID 讀成此相位要做髖外展。庫內沒有登錄 hip.adduction，本筆不為此新造動作。

    本相位在 movement 層可覆蓋的內容只有姿勢達成與維持不外展，其餘由 入水筆承載。素材所述超流線、髖屈曲量與腳尖伸直是入水前的姿勢構造， 本筆不重複那些內容，也不為了增加篇幅把入水內容搬到飛行期。

    '
  limitation_context: '本筆只承載姿勢達成與髖維持不外展。飛行距離、騰空時間、入水角度 與重心軌跡全部不在本層，也不得由本筆推論任何關節在飛行期處於中立 或任何特定角度。

    '
  safety_note: '空中收攏姿勢時若出現腰部或髖部疼痛、卡住或明顯不穩，應停止， 不要為了在空中做出更緊的姿勢而勉強改變體線。

    '
