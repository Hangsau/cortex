    role: '髖屈肌群的作用線在解剖上可參與髖屈曲方向的移動、位置控制與維持； 本筆不由最後一次下踢的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '膝伸肌群的作用線在解剖上可參與膝伸展方向的移動、位置控制與維持； 本筆不由下踢末段膝部伸直的外觀判定實際招募時序、程度或推進貢獻。

      '
