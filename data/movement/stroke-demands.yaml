  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '肩胛上旋肌群的作用線在解剖上可參與上舉時的肩胛上旋與位置控制； 本筆不由雙手向外分開的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '旋轉肌袖的作用線在解剖上可參與肱骨外旋與盂肱關節位置控制； 本筆不由雙手向外分開的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群的作用線在解剖上可參與肘屈曲方向的移動與位置控制； 本筆不由外划路徑的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-flexors
    role: '腕屈肌群的作用線在解剖上可參與腕屈曲方向的移動與位置控制； 本筆不由手部向外分開的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 蛙式外划的上舉平面、必然外旋與肘腕輕度屈曲
  description: '外划起始時雙手位於頭前、手臂接近最大上舉；從這個位置把手向外分開， 在解剖體系裡是上舉平面由矢狀面移向肩胛平面或額狀面，不是從手臂 貼體側起算的額狀面外展。若外划進行到上舉角度降到接近直角，該平面 內的向外移動又要改稱水平外展。因此「外展」這個名稱要能使用，必須 先說清楚起始上舉角度與上舉平面；肱骨向外側移動的方向描述本身成立， 但命名基準尚不足，這正是本筆只給部分支持的原因。

    解剖來源指出，肩往外展方向上舉時，肱骨會自然伴隨外旋，讓肱骨大結節 從肩峰後方通過並避開肩峰下空間。因此外旋不是可選的附加動作；外划期 標出外旋不是多餘細節，而是上舉本身的必然伴隨成分。肘與腕同時可朝 輕度屈曲方向移動，但本筆不指定其水中幅度或時序。

    '
  limitation_context: '上舉平面、上舉角度、外旋與肘腕屈曲各有獨立的可用範圍與控制條件； 從池畔看到的「手向外分開」是這些的合成，不能指出限制位於哪一個 關節或哪一個成分。

    '
  safety_note: '外划時若出現肩部疼痛、卡住、麻木、明顯無力或不穩應停止，不要為了 把手分得更開而勉強增加上舉角度或改變上舉平面。

    '
