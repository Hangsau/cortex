  - source_id: src.gonjo-2021-body-roll
    quantity: 肩線滾轉角度峰值出現的相位位置；肩線是左右肩關節中心連線在橫斷面的投影角
    value: 峰值落在入水期到接續拉手期的交界（原文為時點定位，非角度門檻）
    conditions: '10 名男性泳者，四種游泳強度，19 個體表標記，四台水下與兩台水上 攝影機重建；量的是體表肩線的投影角，不是脊椎分節旋轉。

      '
    endpoint: roll-timing
    extrapolation_boundary: '只定位峰值的時點，不支持把峰值寫成整段入水期的狀態，不支持任何 滾轉幅度目標或角度門檻，也不得換寫成脊椎或骨盆的分節旋轉。

      '
  name_zh: 自由式入水期的肩線滾轉峰值時點
  description: '身體繞長軸的滾轉是自由式的節律基準，教材明說圖上用的是肩部滾轉 曲線作為身體滾轉的替代指標。量測顯示肩線滾轉的峰值落在入水期與 接續拉手期的交界——它是一個交界事件，不是整段入水期都維持的狀態。

    '
  limitation_context: '肩線滾轉是左右肩關節中心連線在橫斷面的投影角，不是脊椎旋轉； 不得把它寫成軀幹分節轉了幾度。描述轉向時，若沒有先講清楚參考系 與正負向約定，同側或對側兩種說法都能成立，這種句子無法被證實也 無法被推翻，因此本筆不使用。目前已有把慣性感測器貼在棘突上的 分節量測管道，可作日後升級錨點，但尚未以本筆的相位時序為終點。

    '
  safety_note: '練習滾轉節律時若出現肩部、背部或頸部疼痛、麻木、明顯無力或不穩， 應停止，不要為了加大滾轉而強行扭轉身體。

    '
