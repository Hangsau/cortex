    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與屈曲側、伸展側的移動與 位置控制；本筆不由腰部外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 流線滑行的腰椎基準——「中立或些微伸展」與「空心姿」指向相反側
  description: '常見寫法是「脊椎維持中立或些微伸展（空心姿）」。但按解剖定義， 伸展會加深腰椎前凸，使腰往下沉、腹部前推；空心姿所指的則是腰椎 前凸被壓平、下背貼平，落在屈曲側。兩者不是程度差異，而是中立點 的兩側。用括號把它們寫成同義詞，是實質矛盾，不是措辭鬆散。

    在流線姿勢裡，這個矛盾會被放大。解剖來源指出，腰椎伸展若合併髖 關節完全伸展，被拉長的髖屈肌與關節囊韌帶被動張力會使骨盆前傾， 把腰椎前凸推得更深；流線正是下肢完全拉直的姿勢，所以些微伸展 在此姿勢下不是一個小偏差。

    中立這半句本身也不合格。脊椎有多個平面且分為頸、胸、腰節段， 各節段可用範圍差異顯著；只寫脊椎維持中立，沒有標節段與平面，既 無法驗證也無法教。對照髖中立自帶不屈不伸，已綁定平面與基準，因而合格。

    本層的處置是列出兩個讀法各自指向屈曲側或伸展側，並指出原句缺少 節段、平面、相對於什麼的基準三個欄位。採用哪個讀法屬教學方針決定， 不由解剖來源裁決，所以本筆標為有爭議。這不是說教材錯了，而是現行 寫法無論如何解讀都內含矛盾，本層不選邊。

    '
  limitation_context: '本筆不提供腰椎應該在哪個角度的答案，也不提供判別某個泳者目前位於 屈曲側或伸展側的方法。凡出現中立、些微、輕度等程度副詞，都必須 補齊節段、平面、基準三欄才有意義；本筆記錄的就是三欄目前缺失。

    '
  safety_note: '調整腰部姿勢時若出現下背疼痛、放射到腿部的麻木或無力、或明顯不穩 應停止，不要為了做出某一種腰部形狀而強行拱腰或壓平下背。

    '
