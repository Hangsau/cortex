      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群的作用線在解剖上可參與肘伸展方向的移動與位置控制；本筆 不由雙手交疊過頭與肘夾緊的外觀判定實際招募時序、程度或推進貢獻。

