    role: '肩內旋兼伸展肌群的作用線在解剖上可參與肱骨內旋、伸展與朝中線 移動的位置控制；本筆不由雙手收攏的外觀判定實際招募時序、程度 或推進貢獻。

      '
  - muscle_id: movement.muscle.latissimus-dorsi
    role: '背闊肌的作用線在解剖上可參與肩內收、伸展與內旋方向的移動及位置 控制；本筆不由雙手在胸腹下方向內移動的外觀判定實際招募時序、 程度或推進貢獻。

      '
  - muscle_id: movement.muscle.scapular-retractors
    role: '肩胛後縮肌群的作用線在解剖上可參與肩胛後縮方向的移動與位置控制； 本筆不由雙手收攏或肩胛體表外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 蝶式內掃的雙軸內收、軸向內旋與肩胛後縮
  description: '蝶式內掃在胸腹下方、體前偏下進行，肱骨朝中線移動時同時含有額狀面 內收與水平內收。兩者繞不同的軸，可以同時發生；只記其中一軸不構成 矛盾，但完整紀錄必須把兩軸都列出。方向描述成立，單一內收名稱卻無法 承載雙軸，這是本筆只給 partially-supported 的理由。

    解剖來源指出，許多肩內旋肌也具有伸展與內收作用，並以游泳的推進 階段作為這組功能的動作情境。因此內旋、伸展與內收的組合具有命名層 與肌肉功能層的教科書旁證，但這不等於已量到蝶式內掃的推進貢獻或 招募時序，也不能據此指定主導肌群或出力排序。

    本筆從教材的複合敘述只承載肩內旋這項關節動作。雙手在胸腹下方向內、 向後掃是手部在水中的空間軌跡，鑰匙孔路徑則是游泳專屬的划手路徑 模型，兩者都超出本層。解剖來源只能說這條軌跡所需的內收、內旋與 伸展在解剖上可行，不能判定該軌跡實際是否發生或是否有效。

    肩胛後縮的方向與把物體拉向身體的動作情境一致，但它只是肩胛胸廓 三組獨立動作軸之一。上提與下壓、前伸與後縮、上迴旋與下迴旋可以 同時發生；只記後縮，代表後縮這一軸被記錄，不代表另外兩軸處於中立。

    '
  limitation_context: '額狀面內收、水平內收、軸向內旋與肩胛後縮是四個獨立成分；池畔看到 的雙手收攏是四者的合成，不能指出限制在哪一項，也不能由外觀指定 任何肌群的收縮方式或先後。推進歸屬不在本層。

    '
  safety_note: '內掃時若出現肩前側或肩胛內側疼痛、卡住、麻木、明顯無力或不穩應 停止，不要為了讓雙手更靠近中線而加大內旋或勉強加深內收。

    '
