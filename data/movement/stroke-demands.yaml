      '
  name_zh: 流線滑行的肘腕位置與被手部擺法遮蔽的前臂旋轉
  description: '肘伸展是矢狀面單一自由度的乾淨命名。一般人的肘可以超過中位再往 伸展方向一些，所以完全伸展在不同人身上對應的實際角度略有差異； 教學上不宜用「鎖死」描述，以免誘導停在被動結構末端。

    腕中立在本相位是合格用法，因為腕有明確的關節定義原點，而且此處 只涉及矢狀面屈伸，指涉單一。但這項合格有條件：若日後加入橈偏與 尺偏，中立就必須分兩軸各自標明。這是「中立必須綁定平面」的正面範例。

    本筆的核心是疊手法遮蔽前臂旋轉。掌根相疊、手背相疊與十指交握是 三種不同的手部擺法，對應不同的前臂旋前旋後角度。教材通常只寫雙手 疊合，卻沒有前臂旋轉欄位，等於用手部的空間關係取代關節旋轉描述。

    而且不能從手掌朝向反推。解剖來源明確指出，手固定時看似前臂旋轉的 動作，本質上可能是盂肱關節軸向旋轉。判定前臂旋轉必須直接看橈骨 相對尺骨的位置，由手掌朝哪裡推論旋前或旋後在解剖上無效。

    '
  limitation_context: '肘伸展、前臂旋轉與腕位置三者獨立；池畔看到的手臂伸直、雙手疊好 是三者的合成，不能指出限制在哪一項。三種疊手法之間的差異在本層 只登錄為對應不同的前臂旋轉角度，本層不判定哪一種疊手法比較好， 因為那需要水動力學或運動學證據，本層沒有。教材另有「延長身體線條」 一類說法，該說法屬外觀與水動力學，不在本層裁決範圍。

    '
  safety_note: '疊手或伸直手臂時若出現肘、腕或手部疼痛、卡住、麻木、明顯無力或 不穩應停止，不要為了把手疊得更整齊而強行扭轉前臂或壓迫手腕。

    '
