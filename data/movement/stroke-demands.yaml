  muscle_roles:
  - muscle_id: movement.muscle.hip-flexors
    role: '髖屈肌群的作用線在解剖上可參與股骨朝髖屈曲方向的移動與位置控制； 本筆不由腳跟收近的外觀判定實際招募時序、程度或推進貢獻。

      '
