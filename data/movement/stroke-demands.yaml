    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩胛上迴旋方向的移動與位置 控制；該力偶的前鋸肌成分也可參與肩胛沿胸廓的前向平移。本層不另立 肩胛前伸肌群，也不由此推論兩個方向由同一組肌肉等量負責；本筆不由 「把肩往前推」的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與頸椎與腰椎屈伸方向的移動 與位置控制；本筆不由下巴貼胸或腰部曲線的外觀判定實際招募時序、 程度或推進貢獻。

      '
  name_zh: 乾淨入水的超流線分層，與尚未解決的腰椎擇一
  description: '池畔所說「全身穿過同一個洞」描述的是各身體節段依序通過同一入水點， 屬於空間軌跡，不是關節動作。就這句教學語而言，本層能對到的關節條件 只有踝維持蹠屈與髖維持不外展；它不能被翻譯成任何單一關節動作， 本筆不為「穿過同一個洞」另行指定動作。

    池畔所說「腳尖完全伸直」解剖上是踝蹠屈，兩欄命名一致，素材也把 這一項點名為最常見的錯誤所在。蹠屈的可用範圍有個別差異，也會受 小腿後側軟組織張力限制；本筆不設定應達到的幅度，也不因腳尖未完全 伸直就判定原因一定是柔軟度不足。

    池畔所說「輕微膝彎幫腳尖指得更垂直」解剖上是膝屈曲。這與大幅膝彎 破壞流線是同一個動作的程度差異，不是方向差異；同一個 knee.flexion 在較小與較大幅度時被素材給出相反評價。本層只記錄此相位膝可能處於 輕度屈曲位，不裁決多少才算輕度。

    池畔與教材會說「把肩往前推」或「肩要再往前送一點」。素材曾把這句 話命名為肩關節過度伸展與半脫位，但兩個名字都不成立，而且錯的方向 相反：肩的過度伸展是手臂往身體背側去，超流線要的是手臂在頭上並把肩 往前上方送；半脫位是關節面部分失去對合的病理狀態，不是能主動做出的 動作。正確命名是肩胛前伸、肩胛上迴旋與肩複合體上舉的合成，前兩者 發生在肩胛胸廓層，不在盂肱關節。

    這與既有裁決的分層一致：手臂上舉是肩複合體的合計，不是單一關節的 角度；拆開是盂肱關節的貢獻加上肩胛胸廓上迴旋的貢獻。若把整包掛在 肩關節上，就會到錯的層級尋找限制。「把肩往前推」是同一個分層問題 又多錯一個方向，不能寫成單一關節動作。本筆不寫任何角度值，也不由 這些命名提出傷害宣稱或安全保證。

    池畔所說「下巴貼胸」解剖上是頸椎屈曲；action_ids 使用 trunk.flexion， 此處指的是頸椎節段。起跳期抬頭、入水期收下巴，是同一節段在兩個相位 朝相反方向移動，構成內部一致的序列，不是矛盾。

    腰椎方向仍是尚未解決的擇一。素材同時有脊椎些微伸展，也就是教學語的 「反弓」，以及腰椎維持平坦，也就是 hollow body、避免拱腰；兩者在 同一軸上方向相反，在同一份教材裡不能同時作為指令。既有裁決要求擇一 並說明理由，但選擇需要目前欠缺的游泳專項量測。本筆等量列出兩種說法， 明寫它們互斥並且不選邊，來源連結已指向該裁決記錄。因腰椎方向未定， action_ids 刻意不列 trunk.extension，列入就等於替爭議選邊；其中已有的 trunk.flexion 只對應前述頸椎屈曲，不代表選擇腰椎方向。

    '
  limitation_context: '踝蹠屈、髖屈曲、膝屈曲、頸椎屈曲、肩複合體上舉、肩胛前伸與上迴旋、 肘伸展是彼此獨立的成分，腰椎方向則是尚未確定的獨立維度。池畔看到的 「乾淨入水」是這些成分的合成，不能指出限制位於哪一個關節。入水深度、 入水角度與入水距離是空間量測，不在本層，也不得用來反推任何關節角度。

    '
  safety_note: '做超流線與入水姿勢時若出現肩部、頸部或腰部疼痛、卡住、麻木、明顯無力 或不穩，應停止，不要為了把肩往前送得更遠或把手交疊得更緊而勉強增加 上舉角度、改變肩胛位置或改變腰椎曲度。本筆不對任何一種腰椎設置給出 安全或危險的判定。

    '
- id: movement.demand.starts-turns.turn-approach.cervical-non-extension-and-coverage-boundary
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.neumann-2017
  - src.pmc5260528
  stroke: starts-turns
  phase_model: descriptive
  phase: turn-approach
  body_position: prone
  poolside_direction: 由池畔觀察，泳者接近池壁時頭部維持不抬起、視線不轉向牆面（教學語稱「不要抬頭看牆」）
  action_reference_frame: joint-local
  derived_from_ids:
  - starts-turns.tech.19
  - starts-turns.tech.20
  action_ids:
  - movement.action.trunk.extension
  muscle_roles:
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與頸椎屈伸方向的移動與位置 控制；本筆不由進牆時頭部維持不抬起的外觀判定實際招募時序、程度或 推進貢獻。

      '
  name_zh: 進牆期的頸椎維持不伸展，與本層的覆蓋邊界
  description: '本相位在本層唯一可承載的關節內容，是頸椎維持不伸展。池畔說的是 「不要抬頭看牆」，解剖上對應頸椎節段的伸展；action_ids 使用 movement.action.trunk.extension，此處指頸椎節段，而本相位的要求是 不做這個動作。列出該動作不表示此相位要產生伸展，而是記錄維持不伸展。

    進牆素材的主體是靠計步判斷距離，以及距離不對時補踢腿。計步屬於 神經控制與感知策略，補踢屬於節奏決策，兩者都沒有可命名的關節內容， 屬於感知層與策略層而不屬於動作圖譜層。本筆不為它們指定任何關節動作， 也不把它們改寫成關節語言；計步內容應在感知層查找，並非此處遺漏。

    素材另有翻滾啟動時機的內容，但那指向翻滾相位，不屬本筆。翻滾尚未 進入本層，因為剛體空間重定向在 joint-local 框架下沒有對應動作， 仍待結構決策；本筆不寫翻滾的任何內容。

    '
  limitation_context: '本筆只承載頸椎維持不伸展。進牆速度、判距方式、最後一划的完整性與 翻滾啟動時機全部不在本層，也不得由本筆推論其他關節在進牆期處於 中立或任何特定位置。

    '
  safety_note: '進牆時若出現頸部疼痛、麻木、上肢放射症狀或明顯不穩應停止，不要為了 保持頭不抬而強行下壓下巴或維持不適姿勢。

    '
- id: movement.demand.starts-turns.wall-contact.knee-flexion-position-and-depth-is-not-a-joint-action
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.neumann-2017
  - src.pmc6409673-b
  - src.pmc8960438-d
  stroke: starts-turns
  phase_model: descriptive
  phase: wall-contact
  body_position: prone
  poolside_direction: 由池畔觀察，雙腳觸上牆面時膝呈屈曲、腳掌置於某個水下深度（教學語稱「觸牆」或「腳上牆」）
  action_reference_frame: joint-local
  derived_from_ids:
  - starts-turns.tech.21
  - starts-turns.tech.22
  - starts-turns.tech.25
  action_ids:
  - movement.action.knee.flexion
  - movement.action.hip.flexion
  muscle_roles:
  - muscle_id: movement.muscle.knee-extensors
    role: '膝伸肌群的作用線在解剖上可參與膝伸展方向的移動與屈膝位置控制； 本筆不由觸牆時膝呈屈曲的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.hip-flexors
    role: '髖屈肌群的作用線在解剖上可參與髖屈曲方向的移動與位置控制；本筆 不由腳掌觸牆深度的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 觸牆的膝屈曲位，與「觸牆深度不是關節動作」
  description: '觸牆時膝處於屈曲位，池畔與解剖命名一致。屈曲量會影響後續蹬伸可用的 力量；這項關係來自肌肉力量隨長度變化的一般解剖關係，不是牆段量測。 本筆只作定性記錄，不寫觸牆時的角度範圍。

    素材針對觸牆屈曲量所述的範圍，與出發台零位沒有跨選手通用最優值的 陳述分屬不同相位：前者適用觸牆，後者適用出發台；兩者都連到同一條 肌肉力量與長度關係，因此不構成矛盾。兩處的角度資料不得跨相位互相 引用，本筆也不引用零位記錄的結論。

    池畔與教材會說「腳要上到多深」，但腳觸牆深度是腳掌在水中的空間位置， 由身體姿態、進牆角度與翻滾幅度共同決定，在 joint-local 框架下沒有 對應的關節動作名。本筆能承載的是否定式的關節內容：不以主動髖屈曲 換取觸牆深度，也就是不讓髖部主動下沉來找牆。action_ids 列出 movement.action.hip.flexion，記錄的是不主動做這個動作，並非要求屈髖。

    「觸牆太深推蹬會偏上」描述的是力學後果，不是關節動作；觸牆深度改變 的是推蹬力向量相對重心的方向。本筆不寫方向偏移的大小，也不寫它對 速度的影響。

    '
  limitation_context: '膝屈曲量與髖是否主動屈曲是彼此獨立的成分；池畔看到的「觸牆」是它們 加上整體空間位置的合成，不能指出限制位於哪一個關節。觸牆深度、 推蹬力向量與出水速度都不在本層，也不得用來反推任何關節角度。

    '
  safety_note: '觸牆時若出現膝部、髖部或腰部疼痛、卡住、明顯無力或不穩應停止，不要 為了把腳上到更深或做出某個屈曲外觀而勉強改變姿勢。

    '
