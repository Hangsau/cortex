    role: '肩胛上旋肌群的作用線在解剖上可參與上舉時的肩胛上旋與位置控制； 本筆不由此指定水中招募時序、收縮型態或貢獻程度。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '旋轉肌袖在解剖上可參與肱骨外旋與盂肱關節動態穩定；本筆不由 入水外觀判定個別肌肉的招募、力量或推進貢獻。

      '
  name_zh: 仰式入水期的肩上舉平面與肱骨外旋需求
  description: '入水時手臂接近最大上舉，上舉平面落在矢狀面附近。接近上舉終端時， 肱骨必然伴隨外旋，讓大結節通過肩峰後方並避開肩峰下空間；這個外旋 是上舉本身的一部分，不是可任意省略的附加姿勢。腕維持輕度屈曲。 若以小指側先接觸水面描述入水，那只是整條上肢旋轉與腕手位置合成後 的空間結果，不是腕或前臂的關節動作命名，腕屈本身也不決定哪根手指 先觸水。

    '
  limitation_context: '無法完成上舉可能來自盂肱被動活動度、肩胛上旋主動控制、軟組織長度 或疼痛保護，這些原因的方向並不相同，需要逐項、個別辨識；單一入水 外觀不足以判定限制位於哪一層。

    '
  safety_note: '入水或手臂接近上舉終端時若出現肩部疼痛、夾擠感、麻木、明顯無力 或不穩，應停止，不要強行把手臂壓向頭後方。

    '
