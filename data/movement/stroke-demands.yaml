  name_zh: 自由式下踢的窄通道對齊需求
  description: '自由式下踢時，腿與足以泳者的身體軸線為基準維持窄通道。身體滾轉 時，打水路徑從池畔看起來呈斜向是正常情形，不是動作缺陷；窄通道 並不等於雙腳必須留在池畔固定的垂直平面內。刻意把腳限制在該垂直 平面內反而有反效果，會妨礙隨身體滾轉形成的自然路徑。

    '
  limitation_context: '這是教材支持的姿勢提示，不能由腿部通道外觀反推髖外展或內收的 關節動作。現有主動阻力研究比較的是打水與只用手的條件，並未操弄 打水寬度，因此不能據此建立通道寬度與主動阻力之間的量化因果。

    '
  safety_note: '維持打水通道時若出現腰背、髖部、膝部或踝部疼痛、麻木、明顯無力 或不穩，應停止，不要為了追求窄的外觀而強行夾腿或固定腳的路徑。

    '
- id: movement.demand.free.pull.upper-trunk-rotation-hand-velocity
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: swimming-kinematics
  source_ids:
  - src.kudo-2021
  - src.riewald-rodeo-2015
  - src.hall-murphy-2020
  stroke: free
  phase_model: kudo-power-phase
  phase: pull
  body_position: prone
  poolside_direction: 由池畔觀察，身體繞長軸轉動，水下的手同時向後移動
  action_reference_frame: body-fixed
  derived_from_ids:
  - free.tech.2
  - free.tech.16
  action_ids:
  - movement.action.trunk.axial-rotation
  muscle_roles: []
  measurement_conditions:
  - source_id: src.kudo-2021
    quantity: '以 roll-pitch-yaw 分解計算，上軀幹旋轉對手部後向速度的貢獻比例； 原文為單一組內的運動學分解，未設對照組或介入條件

      '
    value: 28% 與 19%（原文報告的兩個貢獻比例；本專案未轉錄兩數各自對應的條件）
    conditions: '15 名熟練泳者，反光標記動作捕捉，前爬泳；貢獻量由身體三軸旋轉分解 求得，不是操弄旋轉幅度後量到的變化。

      '
    endpoint: hand-velocity
    extrapolation_boundary: '只支持「上軀幹旋轉對手的後向速度有可量化貢獻」。不支持划距、 distance per stroke、力量傳導、推進力或競賽速度等任何其他終點， 不支持任何最佳旋轉角度或訓練劑量，也不得反過來寫成增加旋轉就會 提高手速。

      '
  name_zh: 自由式拉水期的上軀幹旋轉對手部後向速度的貢獻
  description: '依 Kudo 的動力相位模型，自由式拉水期中，身體繞長軸的上軀幹旋轉對 手在水下向後移動的速度有可量化的貢獻。教材也把身體滾轉描述成整個 動作的節律基準。這裡成立的終點只有手的速度一項——現有資料量的是 旋轉分解出多少手速，不是旋轉能帶來多長的划距或多大的力量。

    '
  limitation_context: '「滾轉可以增加划距」與「滾轉可以傳導力量」目前都沒有對應的量測： 沒有任何研究以滾轉為操弄變項、以划距或力值為終點。教材談 stroke length 的段落是多變項關聯，而且論證方向相反——是配速決定了還有沒有 時間滾轉。因此本筆不對滾轉幅度、角度或時機給任何指示，也不得由 手速的貢獻比例推出划距或力量的結論。教材談側身姿勢與流線的兩種 說法指的是不同的量（體節對線與迎流阻力），不是彼此矛盾。

    '
  safety_note: '練習軀幹轉動時若出現背部、腰部或頸部疼痛、麻木、下肢放射症狀、 明顯無力或不穩，應停止，不要為了加大轉動而強行扭轉軀幹。

    '
- id: movement.demand.starts-turns.underwater-glide.head-position-drag
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: swimming-kinematics
  source_ids:
  - src.cortesi-gatta-2015
  - src.hall-murphy-2020
  - src.riewald-rodeo-2015
  stroke: starts-turns
  phase_model: descriptive
  phase: underwater-glide
  body_position: prone
  poolside_direction: 由池畔觀察，頭相對身體水平線偏高、對齊或偏低
  action_reference_frame: body-fixed
  derived_from_ids:
  - starts-turns.tech.27
  - starts-turns.tech.34
  action_ids: []
  muscle_roles: []
  measurement_conditions:
  - source_id: src.cortesi-gatta-2015
    quantity: '頭下壓或對齊相對頭上抬的平均被動阻力差，分別在手臂置於體側與 雙臂過頭兩種條件下量測

      '
    value: 手臂置於體側時 4–5.2%；雙臂過頭時 10.4–10.9%
    conditions: '10 名男性區域級泳者，水下 60 cm 被動拖曳，速度 1.5、1.7 與 1.9 m/s， 三種頭部位置乘以兩種手臂位置；操弄變項是頭部的空間位置分類， 不是頸椎節段角度。

      '
    endpoint: passive-drag
    extrapolation_boundary: '不得脫離手臂姿勢單獨引用任一數字——同一個頭位操弄在兩種手臂條件 下差距超過兩倍。不得外推到水面主動自由式、換氣動作或女性與非 競技族群，不得換算成任何頸椎角度，也不得作為個人姿勢門檻。

      '
  - source_id: src.hall-murphy-2020
    quantity: 教材自有阻力量測裝置量到的頭前傾（教材標註為 neck extended）相對其基準姿勢的阻力增加
    value: 增加 4%（教材自有量測）
    conditions: '教材以其自有的推進阻力量測裝置量測並分類姿勢，未報告樣本數、 統計、手臂姿勢與速度條件。

      '
    endpoint: passive-drag
    extrapolation_boundary: '不得與被動拖曳研究的百分比並列比較、相減或相加，不得作為任何 相位的門檻，也不得因為教材寫了 neck extended 就當作頸椎角度量測。

      '
  name_zh: 水下滑行期的頭部位置與被動阻力
  description: '水下滑行時，頭相對身體水平線的位置會改變被動阻力。可用的量測都是 操弄頭部的空間位置——偏高、對齊或偏低——而不是量頸椎轉了幾度。 效果量高度依賴手臂在哪裡：手臂置於體側與雙臂過頭兩種條件下，同一個 頭位操弄的阻力差距超過兩倍。因此任何百分比都必須連同手臂姿勢、 速度與被動或主動條件一起讀。

    '
  limitation_context: '這些數字來自水下被動拖曳，不能外推到水面主動游進或換氣動作；水面 換氣時向後抬頭增加阻力並干擾體線是教材描述，屬於另一個情境，與 本筆的百分比不共用條件。本筆不以頸椎伸展角作為暴露量，也不對頸椎 給任何角度目標。

    '
  safety_note: '調整滑行頭位時若出現頸部疼痛、麻木、上肢放射症狀、明顯無力或不穩， 應停止，不要為了壓低頭而強行下壓下巴或維持不適姿勢。

    '
- id: movement.demand.breast.arm-recovery.pull-to-kick-interval
  claim_status: partially-supported
