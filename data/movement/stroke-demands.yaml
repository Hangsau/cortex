  muscle_roles:
  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '在縱軸 body roll 無法協助的移臂空間條件下，承擔肩胛穩定與上旋的 候選角色。Nuber 研究指出前鋸肌在各泳式划水中皆接近最大肌肉測試值； 這項結果是負荷描述，不是泳式間比較，且水中樣本有限、摘要未報泳式間統計。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '在空中移臂期間等長維持肱骨相對身體的位置，作為盂肱關節動態穩定 的候選角色。水中實際招募程度屬肌電研究範疇，本筆不固定描述。

      '
  name_zh: 蝶式空中移臂的肩胛穩定需求
  description: '蝶式空中移臂的高度受肩部結構限制，而且不像自由式移臂可以由身體縱軸 body roll 協助。肩胛與盂肱穩定因此需要在這項身體固定的空間條件下 維持上肢構型。這是相位條件結合一般解剖角色的推論，不表示肩胛穩定 只在蝶式需要，也不建立不同泳式之間的負荷排序。

    '
  limitation_context: '空中移臂外觀受肩部結構、可用活動度與主動控制等多項條件影響，不能 只憑單一視角判定限制來源，也不能由本筆設定跨泳式的負荷高低。

    '
  safety_note: '空中移臂時若出現肩部疼痛、夾擠感、麻木、明顯無力或不穩，應停止， 不要強行抬高手臂或追求更高的移臂路徑。

    '
