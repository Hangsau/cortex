domain: movement
sub: stroke-demands
description: 泳式 × 相位 × 體位 × 池畔方向 × 解剖動作，連到 action 與 muscle-role；泳姿專屬主張須用游泳證據
demands:
- id: movement.demand.starts-turns.underwater-glide.shoulder-elevation
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.martens-2015
  stroke: starts-turns
  phase_model: descriptive
  phase: underwater-glide
  body_position: prone
  action_reference_frame: joint-local
  derived_from_ids:
  - starts-turns.tech.27
  - starts-turns.tech.34
  action_ids:
  - movement.action.shoulder-complex.elevation
  muscle_roles:
  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '在超流線位維持肩胛骨上旋，支撐雙臂貼耳的靜態姿勢。 水中實際招募程度屬 EMG 研究範疇，各研究間存在異質性。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '在上舉末端動態穩定盂肱關節，防止肱骨頭在水中阻力下向後移位。 招募型態在游泳群體間存在個體差異，不宜固定化描述。

      '
  - muscle_id: movement.muscle.latissimus-dorsi
    role: '在超流線位被動拉伸狀態；闊背肌柔韌性不足時可能限制完整上舉。 此為解剖推論，不代表游泳時闊背肌一定是限制主因——需逐案評估。

      '
  name_zh: 水下滑行超流線位的肩上舉需求
  description: '出發入水或轉身推蹬後的水下滑行，要求雙臂完全前舉過頭並夾緊雙耳， 形成超流線（streamline）姿勢以降低阻力。這個姿勢要求肩複合體 達到最大或接近最大的上舉角度，肩胛骨同步上旋，肱骨頭在關節盂中 保持穩定。 游泳群體的肌肉招募型態存在個體差異（游泳 EMG 研究一致顯示各研究 間有顯著異質性），因此「特定肌肉一定以何種程度啟動」的描述需謹慎。

    '
  limitation_context: '做不到完整超流線位的原因不只一種，而且不同原因的處理方向完全相反， 不能靠單一動作或單一伸展套用到所有人，需要個別評估後才知道該往哪走。

    '
  safety_note: '若在超流線姿勢中出現肩部疼痛、夾擠感或麻木，不應強撐維持姿勢， 應停止並評估。

    '
- id: movement.demand.udk.down-kick.ankle-plantarflexion
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.veiga-2022
  - src.yamakawa-2022
  - src.pmc9402090-b
  stroke: udk
  phase_model: descriptive
  phase: down-kick
  body_position: prone
  poolside_direction: 足部由水面側向池底側移動
  action_reference_frame: joint-local
  derived_from_ids:
  - udk.tech.5
  - udk.tech.9
  action_ids:
  - movement.action.ankle-foot.plantarflexion
  muscle_roles:
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '支持踝在下踢中進入並維持蹠屈方向。泳者研究直接量到腓腸肌活動 與踝蹠屈運動，但不能把腓腸肌的表面肌電擴成整個蹠屈肌群的固定 招募模式，也不能把肌電振幅直接等同肌力、力矩或推進貢獻。

      '
  - muscle_id: movement.muscle.ankle-dorsiflexors
    role: '脛前肌在 Yamakawa 研究的 UDK 下踢相出現活動峰值，顯示背屈肌並非 單純休息的拮抗肌；結合其一般作用線，可提出換向與蹠屈方向制動的 控制角色。該研究未直接判定離心收縮或因果性推進貢獻，本條不作 這兩項延伸。

      '
  name_zh: 水下蝶式打腿下踢的踝蹠屈需求
  description: '水下蝶式打腿的下踢相，可用腳趾從週期中的較高位置移到較低位置來 描述。泳者運動學顯示，踝在這段週期中有明確的蹠屈與背屈變化， 最大蹠屈出現在下踢已開始之後；泳者肌電研究也同時量到腓腸肌與 脛前肌活動。這表示踝需要可用的蹠屈範圍，也需要雙向的主動控制， 不能把腳踝理解成完全放鬆、任水流被動甩動。現有資料沒有建立所有 泳者共用的目標角度，也不支持「角度越大越好」。

    '
  limitation_context: '腳尖姿勢沒有出現時，原因不只一種，處理方向也可能相反；只看水中 外觀不能判定原因或該採哪一種處理，需個別評估後再決定。

    '
  safety_note: '下踢或繃腳時若出現踝部疼痛、麻木、明顯無力或不穩定感，不應繼續 強壓腳尖或追求更大角度。

    '
- id: movement.demand.free.down-kick.ankle-plantarflexion
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.mccullough-2009-a
  - src.riewald-rodeo-2015
  - src.hall-murphy-2020
  - src.pmc9402090-b
  stroke: free
  phase_model: descriptive
  phase: down-kick
  body_position: prone
  poolside_direction: 足部由水面側向池底側移動
  action_reference_frame: joint-local
  derived_from_ids:
  - free.tech.6
  - free.tech.11
  action_ids:
  - movement.action.ankle-foot.plantarflexion
  muscle_roles:
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '依一般作用線可承擔蹠屈與末端姿勢維持。自由式打腿的可用蹠屈範圍 與短距離打腿速度有跨人相關，但該相關由陸上量測與整段計時建立， 沒有相位化的踝運動學或肌電，故不宣稱此肌群在下踢相以特定時序或 程度招募。

      '
  - muscle_id: movement.muscle.ankle-dorsiflexors
    role: '依一般作用線可承擔蹠屈方向的制動與動作換向，仍是待驗證的候選 角色；目前不能由 UDK 或一般解剖資料外推自由式下踢的收縮型態， 更不能推論背屈肌訓練會改善打腿效率。

      '
  measurement_conditions:
  - source_id: src.mccullough-2009-a
    quantity: 陸上量測的踝蹠屈可用範圍，與 22.86 m flutter kick 計時速度的跨人相關
    value: r = 0.509（中度相關；原文為橫斷相關設計，未報個人內效果量）
    conditions: '10 名 NCAA Division I 女性泳者與 10 名休閒女性泳者；踝蹠屈與內翻在 陸上量測，打腿速度以 22.86 m 計時取得，另測 50 m 自由式時間。

      '
    endpoint: kick-speed
    extrapolation_boundary: '只支持「跨人之間，可用蹠屈範圍與短距離打腿速度同向變動」。不支持 因果、不支持個人增加角度後速度會提高、不支持任何最佳角度或門檻， 也不得換寫成效率。全為女性樣本與短距離任務，男性、長距離與比賽 配速外推皆無依據。

      '
  - source_id: src.pmc9402090-b
    quantity: 貼紮限制與急性伸展改變蹠屈後的水下海豚踢速度與 kick efficiency
    value: '限制蹠屈約 10.42% 時速度與效率低於正常；急性增加蹠屈約 6.87% 後， 增加條件與正常條件之間速度與效率無顯著差異

      '
    conditions: '10 名訓練良好成人泳者（5 男／5 女），隨機比較正常、貼紮限制與急性 伸展三條件，節拍器控制打腿頻率；任務是水下海豚踢，不是自由式打腿。

      '
    endpoint: uus-speed-and-efficiency
    extrapolation_boundary: '只用來說明「可用範圍被壓縮時可能不利，而正常範圍以上再增加未見額外 好處」這個形狀。任務是水下海豚踢，不得當成自由式打腿的介入效果； 急性伸展也不是訓練效果，不得作為柔軟度處方依據。

      '
  name_zh: 自由式打腿下踢的踝蹠屈需求
  description: '自由式打腿的下踢相需要可用的踝蹠屈範圍。泳者資料顯示，跨人之間可用 蹠屈範圍較大者，短距離打腿速度也偏快；限制踝關節活動的實驗則顯示 範圍被壓縮時打腿表現變差，但把範圍再往上加並沒有帶來額外好處。這些 結果的形狀是「不足可能限制表現」，不是「角度越大越有效率」。 單一泳者的個案量測還顯示，起始蹠屈較大的踢次未必推進較好——足部是否 仍浸在水裡、以及踢的時序，都會改變結果，不能只看腳背角度。 目前沒有自由式下踢相的踝關節運動學或肌電，因此本條不給目標角度， 也不作為伸展或肌力處方的依據。

    '
  limitation_context: '若觀察到腳背姿勢不同，不能直接判定原因或處理方向；在取得自由式 專屬運動學與肌電證據前，介入只能依個別評估與重測暫定。

    '
  safety_note: '自由式打腿或繃腳時若出現疼痛、麻木、明顯無力或不穩定感，應停止 強壓腳尖，不要為了符合外觀而追求更大角度。

    '
- id: movement.demand.free.front-quadrant-propulsion.wrist-isometric-stability
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: swimming-emg
  source_ids:
  - src.caty-2007
  - src.hall-murphy-2020
  stroke: free
  phase_model: race-club-6phase
  phase: front-quadrant-propulsion
  body_position: prone
  action_reference_frame: joint-local
  derived_from_ids:
  - free.tech.8
  - free.tech.4
  action_ids:
  - movement.action.wrist-hand.flexion
  - movement.action.wrist-hand.extension
  muscle_roles:
  - muscle_id: movement.muscle.wrist-flexors
    role: '與腕伸肌群高度共收縮，以等長方式穩住腕關節，使手與前臂成為共同 受力單元。此處的共收縮是穩定機制，不表示腕屈肌群正在帶動腕屈曲。

      '
  - muscle_id: movement.muscle.wrist-extensors
    role: '與腕屈肌群高度共收縮，以等長方式穩住腕關節，使手與前臂成為共同 受力單元。此處的共收縮是穩定機制，不表示腕伸肌群正在帶動腕伸展。

      '
  name_zh: 自由式前象限推進的腕關節等長穩定需求
  description: '依六相教材模型，抓水至早期推進期需要維持腕部穩定，讓手與前臂共同 成為受力單元。教材描述手、腕與前臂對齊；另有一手肌電研究在其所用的 內掃相觀察到腕部穩定與屈伸肌高度拮抗共收縮。兩者使用的分期不同， 內掃相不能換算成六相模型的前象限推進期，因此研究只支持穩定機制， 不建立這個相位的腕角度標準或效能結論。

    '
  limitation_context: '水中看到手與前臂維持在一起，不能據此判定應把手腕擺到哪個角度； 目前證據也未比較不同腕角配置，個別限制仍須另外評估。

    '
  safety_note: '維持腕部位置時若出現疼痛、麻木、刺痛或明顯不穩，應停止，不要為了 固定外觀而強行鎖住手腕。

    '
- id: movement.demand.free.early-pull-through.high-elbow-configuration
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: swimming-kinematics
  source_ids:
  - src.pmc3438875
  - src.suito-2017
  - src.hall-murphy-2020
  stroke: free
  phase_model: heinlein-2010-phases
  phase: early-pull-through
  body_position: prone
  poolside_direction: 由池畔觀察，肘位於手掌與水面之間
  action_reference_frame: body-fixed
  derived_from_ids:
  - free.tech.2
  - free.tech.16
  action_ids:
  - movement.action.shoulder-complex.elevation
  muscle_roles:
  - muscle_id: movement.muscle.rotator-cuff
    role: '在水中阻力下等長維持肱骨相對身體的位置。水中實際招募程度屬肌電 研究範疇，本筆沒有該層資料，不固定描述招募程度。

      '
  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '在水中阻力下等長維持肱骨相對身體的位置，協助保持上肢空間構型。 水中實際招募程度屬肌電研究範疇，本筆沒有該層資料。

      '
  measurement_conditions:
  - source_id: src.pmc3438875
    quantity: 界定 early pull-through 終點所用的肱骨相對身體前方角度；原文未設對照組
    value: 約 90°（原文為描述性界定，未給區間）
    conditions: 原文未報告量測協議、族群與樣本數；為肩部生物力學回顧中的分期描述
    endpoint: joint-angle
    extrapolation_boundary: '只作相位邊界的粗略界定，不是姿勢目標、不是可訓練門檻，也不得與 src.suito-2017 的 high-elbow index 互相換算。

      '
  name_zh: 自由式早期拉水的高肘構型需求
  description: '自由式早期拉水期維持高肘構型，從池畔可簡化描述為肘位於手掌與水面 之間。這是方便教學的粗粒度說法；正式研究以肩、肘、腕三個標記點的 座標構型建立 high-elbow index，本專案不採用該指標的門檻值。這項需求 描述的是上肢相對身體的空間構型，不是盂肱關節角度要求。

    '
  limitation_context: '池畔看到的肘與手掌相對位置，不能直接換算成肱骨相對肩胛的關節角度， 也不應由單一視角外觀設定個人角度目標。

    '
  safety_note: '維持拉水構型時若出現肩部疼痛、夾擠感、麻木、明顯無力或不穩，應停止， 不要為了追求外觀而強行固定手臂位置。

    '
- id: movement.demand.breast.leg-insweep.foot-orientation-control
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: swimming-kinematics
  source_ids:
  - src.matheson-2011
  - src.riewald-rodeo-2015
  - src.hall-murphy-2020
  stroke: breast
  phase_model: descriptive
  phase: leg-insweep
  body_position: prone
  poolside_direction: 雙腳由身體外側向中線移動，同時雙腿向後伸展
  action_reference_frame: joint-local
  derived_from_ids:
  - breast.tech.9
  - breast.tech.12
  action_ids:
  - movement.action.ankle-foot.plantarflexion
  muscle_roles:
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '在推進段承擔踝的蹠屈方向運動與角速度。三維運動學量到踝的最大動作與 蹠屈角速度出現在推進相早期，但該研究沒有同步肌電，因此不能把角速度 直接讀成特定肌群的招募程度或收縮型態。

      '
  - muscle_id: movement.muscle.ankle-dorsiflexors
    role: '依一般作用線可承擔換向與蹠屈方向的制動；蛙式推進段沒有相位化肌電 資料，本條不宣稱其收縮型態，也不由此推出背屈肌訓練效果。

      '
  measurement_conditions:
  - source_id: src.matheson-2011
    quantity: 踝總角位移與髖前進速度的關聯；踝最大動作與蹠屈角速度在推進相內的出現時點
    value: '該樣本未觀察到踝總角位移與髖前進速度的顯著關聯；踝的最大動作與蹠屈 角速度出現在推進相早期，推進相尾端的踝動作最少（原文未報效果量區間）

      '
    conditions: '12 名 NCAA Division I 女性泳者，三台水下攝影機建立下肢三維模型； 推進相操作定義為「膝伸展開始」到「雙腿完成內收」。

      '
    endpoint: hip-forward-velocity
    extrapolation_boundary: '「未觀察到顯著關聯」是這一個樣本、這一種相位切法下的結果，不是 「踝角位移不影響推進」的通則。男性、非大學競技族群、以及採用不同 推進相定義的分期都不在外推範圍內。本條也不由時點資訊推出任何 角速度目標或訓練劑量。

      '
  name_zh: 蛙式蹬夾推進段的足部方向控制需求
  description: '蛙式蹬腿的推進段，雙腳一邊向後伸展一邊向中線靠近。這段的推進主要來自 小腿與足內側把水向後推，因此需要的是足部朝向與踝的動作速度，而不是 等到最後把兩腳夾在一起。三維運動學顯示，踝的最大動作與蹠屈速度出現在 這一段的早期，越到尾端踝的動作反而越少；在該研究樣本裡，踝的總角度 變化量與身體前進速度之間也沒有量到顯著關聯。 換句話說，這段要處理的是「什麼時候動、往哪個方向動」，把它讀成 「角度變化越大越好」並沒有依據。

    '
  limitation_context: '水中單一視角看到的「腳掌轉出去」可能同時來自髖的旋轉、屈膝位下的 脛骨旋轉與足部其他關節，不能單獨歸給踝；判斷限制落在哪一層要靠 分層評估，不能由外觀反推。

    '
  safety_note: '蹬夾推進段若出現膝關節內側疼痛，不應以加大外翻或加快夾腿來處理， 應先停止該段的強度累加並個別評估。

    '
