  - movement.action.shoulder-complex.external-rotation
  - movement.action.shoulder-complex.internal-rotation
  - movement.action.wrist-hand.flexion
  muscle_roles:
  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩複合體上舉方向的移動與 位置控制；本筆不由雙手入水前伸的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '肩袖肌群的作用線在解剖上可參與肱骨軸向旋轉及盂肱位置控制； 本筆不由掌心朝向或入水點寬窄的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-flexors
    role: '腕屈肌群的作用線在解剖上可參與腕屈曲方向的移動與位置控制； 本筆不由入水時手部外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 蝶式入水的上舉平面、旋轉基準，與旋轉方向的來源分歧
  description: '手臂前伸過頭不是單一關節事件。盂肱關節本身提供的屈曲範圍有限， 接近完全過頭的上舉必須加上肩胛胸廓關節的上迴旋；因此本筆以肩複合體 上舉承載這個動作，並分別保留盂肱與肩胛胸廓的貢獻，不能把伸到最遠 全部掛在盂肱關節上。

    入水時肱骨略偏離中線的方向描述成立，但不應寫成屈曲再加些微外展。 解剖體系以同一個上舉動作所在的平面命名；蝶式雙手入水點通常略寬於 肩線，正確表述是上舉平面介於矢狀面與肩胛平面之間。把上舉平面資訊 拆成兩個動作名稱，會混用不同的術語系統。

    旋轉名稱必須先說明基準。教材所稱的些微內旋，可能是相對解剖位置的 零度，也可能是相對該上舉角度下依解剖原理應有的外旋量；兩種基準的 意義不同。肩往外展方向上舉時，肱骨會自然伴隨外旋，使大結節從肩峰 後方通過並避開肩峰下空間。接近最大上舉時，外旋是義務性的上舉成分， 不是可選的修飾動作。因此相對後一種基準所說的內旋傾向，實際意思是 比應有的外旋少，不能與相對解剖位置的內旋視為同一件事。旋轉欄位未 標基準便無法判讀，這是本筆維持 disputed 的第一個理由。

    兩個來源對入水旋轉方向的說法不一致。教材敘述入水有些微內旋傾向； 本專案文獻集中唯一一份蝶式肩的一手研究，以十二條肌肉的肌電圖與 電影分析描述入水肱骨為外展併外旋，同時記錄肩胛後縮與上迴旋，為 肱骨備好關節盂平台。蝶式雙手同步且沒有軀幹縱軸滾轉，上舉平面在 推論上較靠近額狀面，而額狀面上舉與義務性外旋的耦合最強。前者是 教材敘述，後者是一手量測；本層把內旋與外旋兩種可能都列出，不裁定 何者正確。掌心在空間中朝哪裡也不能反推肱骨旋轉，因為掌心朝向是 肱骨軸向旋轉、前臂旋前旋後與腕關節位置的合成；判定肱骨旋轉需要 肱骨本身的參考標記或影像。

    腕部的輕度屈曲符合解剖定義，落在一般屈曲可用範圍內，不附帶其他 游泳專屬構念。

    '
  limitation_context: '上舉平面、上舉角度、旋轉基準、旋轉方向與腕屈曲各有獨立的可用範圍 與判讀條件；池畔看到的雙手入水前伸是這些成分的合成，不能指出限制 位於哪一個關節或哪一個成分，也不能由入水點寬窄反推任何旋轉方向。

    '
  safety_note: '入水與前伸時若出現肩部疼痛、卡住、麻木、明顯無力或不穩應停止， 不要為了把手伸得更遠而勉強增加上舉角度或改變上舉平面。本筆不對 任何入水角度給出安全或危險的判定。

    '
