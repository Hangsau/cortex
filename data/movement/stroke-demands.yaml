  - muscle_id: movement.muscle.rotator-cuff
    role: '旋轉肌袖在解剖上可參與上舉伴隨的肱骨外旋與關節穩定；是否在個別 回臂型式中如何作用，仍需相位化運動學與肌電資料支持。

      '
