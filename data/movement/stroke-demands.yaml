    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩胛上迴旋方向的移動，以及肩複合體 上舉位的位置控制與維持；本筆不由入水後手臂前伸的外觀判定實際招募時序、 程度或推進貢獻。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '旋轉肌袖的共同作用在解剖上可參與肩複合體上舉方向的關節中心控制與維持； 本筆不由手往前送或延後下壓的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群的作用線在解剖上可參與肘伸展方向的移動、位置控制與維持；本筆不由 手臂維持前伸的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 升力相的上舉維持與下壓延後，以及風格差異的時間性質
  description: '本相位的關節內容主體是維持與延後，不是新產生動作。池畔所說「入水後先往前送、 不要急著壓」，由肩複合體維持在上舉位、肘維持伸展，以及下壓開始時間延後構成； 上舉位與肘伸展在入水瞬間已經達成，升力相只是維持而不破壞這些位置。

    池畔用「手走到時鐘指定位置」描述手的軌跡。時鐘位置標示的是手在身體持續前進 時相對靜水的空間位移，不是手相對身體的關節角度，因此不能反推任何一個關節的 角度；相同位置可以由不同的肩、肘與軀幹組合達成。

    池畔所說「這一派入水就抓水，那一派先延伸」，在關節層是同一組動作的時間差， 不是方向差。兩種做法列出的關節動作完全相同，差別只在下壓開始的時間點； action_ids 沒有欄位可表達何時開始，讀者不能只從動作清單讀出兩種風格。本層 不裁決哪一種風格較好或適用於何種情境。

    池畔所說「延伸是把肩膀送出去」看起來像手臂自己往前伸長，解剖上則是軀幹繞 長軸旋轉把該側肩帶送向前方，對到 movement.action.trunk.axial-rotation， 不是肩關節產生額外的前伸角度；兩者不是同一件事。本筆不由此外觀推定轉體幅度 或其力學後果。

    池畔所說「手掌轉向後方準備抓水」是手掌的空間朝向，無法單獨指出肱骨軸向旋轉、 前臂旋轉或腕位置中的哪一項改變，因此 action_ids 刻意不列 movement.action.shoulder-complex.internal-rotation 與 movement.action.forearm.pronation。完整論證見 movement.demand.free.catch.palm-orientation-three-source-decomposition， 本筆只將該限制用於升力相。

    本筆其餘肩、肘成分以關節局部角度命名，但 trunk.axial-rotation 的暴露量是 軀幹繞自身長軸的方位；兩者參考系不同，判讀時不可混用。

    '
  limitation_context: '肩上舉維持、肘伸展維持與軀幹旋轉是三個獨立成分，「下壓的開始時間」則是額外 的時間維度；池畔看到的「延伸得很好」是這些成分的合成，不能指出限制位於哪一個 關節，也不能由前伸外觀判定任何成分已經到位。划頻、風格歸類、抓水品質與推進力 都不在本筆。

    '
  safety_note: '維持手臂前伸上舉位與軀幹轉動時若出現肩部、頸部、背部或腰部疼痛、麻木、上肢 放射症狀、明顯無力或不穩應停止，不要為了把手送得更遠而強行增加上舉角度或加大 軀幹扭轉。

    '
