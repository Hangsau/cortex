    role: '作為調整大腿相對骨盆位置並銜接第二次下踢構型的候選角色。本批 來源未提供蝶式此相位的肌電，因此不固定實際招募、收縮型態或貢獻大小。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '作為膝伸展與小腿方向控制的候選角色。本批來源未提供蝶式此相位的 肌電，因此不固定實際招募、收縮型態或推進貢獻。

      '
  name_zh: 蝶式第二踢與推水的時序需求
  description: '蝶式第二次下踢的起始落在手臂推水與上掃的時間窗；這一踢的推進 峰值則接近雙手出水至回復臂入水的區間。起始與峰值是接續的不同 事件，不應壓成同一瞬間。這項需求用來對齊手臂與腿部節律，不表示 其中某個外觀事件可以單獨解釋整體推進。

    '
  limitation_context: '運動學研究分別採用手臂越過肩部、手離水、推水開始與回臂等事件作 相位錨點，各套操作定義應並列保存，不能互相換算成唯一瞬間。教材 分別描述下踢起始與推進峰值，兩者處理的是不同事件層級，可以並列 理解而不構成矛盾；現有資料也不支持排列兩次踢的用力高低，或把 臀部位置寫成這一踢的單一因果效果。

    '
  safety_note: '配合推水練習下踢時若出現腰背、髖部或膝部疼痛、麻木、明顯無力 或不穩，應停止，不要為了追求同步而強行加大動作。

    '
- id: movement.demand.fly.first-kick.timing-and-wave-reception
  claim_status: partially-supported
