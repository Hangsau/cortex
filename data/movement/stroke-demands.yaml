    role: '髖屈肌群的作用線在解剖上可參與股骨朝髖屈曲方向移動與位置控制； 本筆不由上踢外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '膝伸肌群的作用線在解剖上可參與膝朝接近伸展方向移動；特定水中 相位的收縮型態與採用程度仍需運動學及相位化肌電資料支持。

      '
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '踝蹠屈肌群的作用線在解剖上可參與蹠屈位置控制；本筆不由足部朝 水面移動的外觀推定肌力、關節力矩或推進貢獻。

      '
  name_zh: 仰式上踢的髖屈曲、膝接近伸展與踝蹠屈
  description: '池畔可見方向：上踢；解剖學動作：髖屈曲。仰躺時朝水面就是朝腹側與 身體前方，因此上踢時股骨朝腹側旋轉，在解剖學上命名為髖屈曲；膝朝 接近完全伸展的方向移動，踝維持蹠屈。池畔可見方向與解剖學動作是 兩個欄位，不是同一件事。踝蹠屈是足部遠離小腿前側，其可用範圍通常 明顯大於背屈，也不因身體在空間中的朝向而改名。若另行選擇陸上輔助 訓練動作，須以解剖學動作欄為準；只照「上踢」字面選擇，會落到矢狀面 方向相反的動作。

    '
  limitation_context: '髖屈曲、膝朝伸展方向移動與踝蹠屈各有獨立的可用範圍與控制條件； 足部朝水面的合成路徑不能指出限制位於髖、膝或踝，也不能由路徑外觀 指定任何肌群的收縮方式。

    '
  safety_note: '上踢時若出現髖部、膝部、踝部或腰背疼痛、卡住、麻木、明顯無力或 不穩，應停止，不要為了讓足部更靠近水面而強行伸膝或壓低腳背。

    '
