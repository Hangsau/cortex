      '
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '踝蹠屈肌群的作用線在解剖上可參與踝蹠屈方向的移動與位置控制； 本筆不由腳尖繃直的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 流線滑行的髖中立、膝完全伸展與踝蹠屈
  description: '髖中立是合格的中立寫法，因為它自帶不屈不伸的補充，等於同時綁定 矢狀面與解剖位置的零點基準。這正是下一筆腰椎基準中不合格的中立 所缺的欄位。髖在中立位之外仍能往伸展方向移動一段，所以流線的髖 中立不是活動範圍末端。

    膝完全伸展不是純矢狀面的單一動作。解剖來源指出，把膝鎖進完全伸展 的最後一段伴隨脛骨相對股骨的軸向外旋，也就是鎖扣機制。用矢狀面 命名膝伸展正確且必要，但整合判讀時仍要知道旋轉成分存在；無法完全 伸膝時，矢狀面活動度受限與旋轉成分受限是兩件不同的事。本層只列出 區分存在，不提供判別方法。

    踝蹠屈是乾淨的單一自由度命名，只使用距小腿關節的矢狀面自由度， 沒有把外翻或內翻併進踝這一格。它是本圖譜中單一關節誤稱的正面對照。

    蹠屈可用範圍在不同量測方法之間差異相當大，所以腳尖能否完全繃直 會隨評估方式得到不同答案。完全蹠屈在解剖上是距小腿關節的鬆弛位； 該位置的相對不穩定性是承重情境的議題，水下流線屬非承重，不構成 本層的風險宣稱。

    '
  limitation_context: '髖、膝、踝三者各自獨立；池畔看到的腿伸直、腳尖繃直是三者的合成， 不能指出限制位於哪一個關節。教材另有「減少足部迎水面積」一類說法， 該說法屬水動力學，不在本層裁決範圍。

    '
  safety_note: '伸直下肢或繃腳尖時若出現髖、膝、小腿或足部疼痛、抽筋、麻木、明顯 無力或不穩應停止，不要靠外力壓腳背或把膝往後扳。

    '
