    role: '肩內旋伸展肌群的作用線在解剖上可參與肱骨內旋方向的移動與位置 控制；本筆不由掌心朝向後下方的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.forearm-pronators
    role: '前臂旋前肌群的作用線在解剖上可參與前臂旋前方向的移動與位置控制； 本筆不由掌心朝向後下方的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.forearm-supinators
    role: '前臂旋後肌群的作用線在解剖上可參與前臂旋後方向的移動與位置控制； 本筆不由掌心朝向後下方的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-flexors
    role: '腕屈肌群的作用線在解剖上可參與腕屈方向的移動與位置控制；本筆 不由掌心朝向後下方的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 掌心空間朝向與前臂關節位置是兩個欄位
  description: '「手掌朝後下方」不能當成「前臂旋前」的證據，這是本筆的全部要點。 教材把可觀察的掌心朝向寫在括號裡，當作關節動作的依據；這個推論 在解剖學上不成立。

    掌心在空間中的朝向是三個獨立來源的合成：肱骨繞縱軸的軸向旋轉、 前臂的旋前旋後，以及腕關節的位置。三者各自都能改變掌心朝向， 單看掌心無法分辨改變來自哪一個。

    解剖來源直接示範過這件事：當手被固定時，看起來像旋前旋後的運動學 本質上可以是盂肱關節主動外旋與內旋的表現。也就是說，同一個掌心 朝向可以完全由肩關節旋轉達成，前臂完全不動。這正是 action_ids 同時列旋前與旋後、同時列腕屈與腕伸的理由；本筆列舉的是能產生 這個觀察值的關節位置組合，不是宣告抓水期處於哪一個方向。

    本層不宣告「前臂旋前」為假。原主張未必錯，本層宣告的是「由掌心 朝向推不出它」。前者是在判定是否為真，後者是指出依據不成立； 把這項裁決寫成教材寫錯了，就超出本層。

    根因是欄位缺口：原表沒有把空間朝向與關節位置分欄。治本方向是拆成 兩欄，手掌空間朝向是池畔可記的觀察值；前臂關節位置則分為旋前、 中立與旋後，需以前臂本身的參考標記或影像另行判定。凡以手掌朝向 反推關節動作的地方都會複製同一個錯，不只抓水期這一處。

    '
  limitation_context: '本筆只處理「觀察值與關節欄位的對應關係」，不含推進歸屬、不含手部 與手指配置的流體內容；後者涉及流體假設，不在本層。本筆也不含高肘 與 EVF。derived_from_ids 指向的兩條記錄描述同一相位，但其流體與 推進主張不由本筆繼承，也不包含「應該旋前多少」這類門檻。

    '
  safety_note: '動作中若出現疼痛、卡住、麻木、明顯無力或不穩，應停止。不要為了 做出特定的掌心朝向而勉強改變肩或前臂的旋轉位置。

    '
