      '
  - muscle_id: movement.muscle.shoulder-internal-rotator-extensors
    role: '肩內旋伸展肌群的作用線在解剖上可參與肩複合體伸展方向的移動與 位置控制；本筆不由抓握台板往上拉的外觀判定實際招募時序、程度 或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群的作用線在解剖上可參與肘屈曲方向的移動與抓握位置控制； 本筆不由直臂或屈肘抓握的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與軀幹與頸椎節段屈伸方向 的移動與位置控制；本筆不由零位前傾或頭位的外觀判定實際招募時序、 程度或推進貢獻。

      '
  name_zh: 起跳零位的並存設置——這裡是姿勢不是動作
  description: '零位是一個被保持的位置，不是此相位中會發生的動作；action_ids 列的是 各關節在零位所處的位置，不是要求泳者在零位期間依序做這些動作。膝處於 屈曲位，但屈曲量沒有跨選手通用的最優值，個人的較適位置會隨肌肉特性而 移動。本筆不設定角度區間，也不判定較深或較淺何者較好。

    池畔所說「臀部高於肩」是兩個身體部位的相對高度；解剖上牽涉髖屈曲 與軀幹前傾。這個空間關係由髖屈曲量、軀幹前傾與下肢屈曲量共同決定， 不能由高度差反推髖屈曲量。

    此相位頸椎的設置有兩種並存教法，一種採頭部中立，另一種採動態抬頭， 本層不選邊。解剖命名上的差別位於屈曲與伸展之間；此處指的是頸椎節段， 而且差的是起始位置，不是一個會發生的動作，因此不能改寫成應保持中立 或應抬頭。

    池畔會說「手抓台板往上拉」，方向感覺是往上、往前；解剖上，手固定在 台板而身體相對手向前移，肱骨相對軀幹往後方去，命名為肩複合體伸展。 直臂與屈肘抓握的效率接近，肘可處於屈曲或接近伸展位，兩者並存， 本筆不把其中一種寫成錯誤做法。

    池畔所說「身體稍微往後坐」不是關節動作。前傾與後坐的差別是整體重心 位置，各關節在過程中主要維持相對姿勢；在 joint-local 框架下沒有與這句 話對應的關節動作名，本筆不為它指定任何動作，也不排序或推薦任一重心策略。

    '
  limitation_context: '膝屈曲量、髖屈曲量、頸椎起始位置、肩伸展量、肘屈伸與整體重心位置 是彼此獨立的設置維度。池畔看到的「零位」是這些維度的合成，不能指出 限制位於哪一個關節，也不能由外觀的高低或深淺反推任一關節的角度。 本筆不對任何維度給最優值，也不排序任何並存設置。

    '
  safety_note: '擺零位時若出現肩部、腰部或膝部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要為了做出某一種設置的外觀而勉強加深屈曲或改變抓握方式。 本筆不對任何設置給出安全或危險的判定。

    '
