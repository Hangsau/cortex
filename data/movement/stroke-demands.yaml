    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩胛上迴旋方向的移動，以及 肩複合體上舉位的控制與維持；本筆不由雙手交疊前伸的外觀判定實際 招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群的作用線在解剖上可參與肘屈曲方向的移動、位置控制與維持； 本筆不由第一划手肘在身體內側發動的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群的作用線在解剖上可參與肘伸展方向的移動、位置控制與維持； 本筆不由前伸手肘維持不彎的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-flexors
    role: '腕屈肌群的作用線在解剖上可參與腕屈方向的移動，以及腕中立位置的 控制與維持；本筆不由指緊掌平的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-extensors
    role: '腕伸肌群的作用線在解剖上可參與腕伸方向的移動，以及腕中立位置的 控制與維持；本筆不由指緊掌平的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與頸椎節段屈伸方向的移動、 位置控制與維持；本筆不由下巴貼胸與抬頭延後的外觀判定實際招募 時序、程度或推進貢獻。

      '
  name_zh: 出水過渡期的流線維持與頸椎伸展延後
  description: '本相位素材裡可對到關節的四個要點，全部都是維持已達成的姿勢或延後 某個動作，沒有一個是在本相位新產生的動作。action_ids 列出的九個 動作裡，只有兩個是「做」，其餘七個記錄維持或不做；這串清單不能 讀成要在本相位依序產生九個動作。

    池畔說「手不要太早分開」。解剖上，「維持交疊前伸不提前分手」是 肩複合體維持在水平內收位，同時維持上舉位並讓肘維持伸展。這三個 都是維持，不是在本相位新產生的動作；相關位置在更早的滑行相位 就已達成。

    池畔說「指緊掌平」，解剖上記錄的是腕中立。action_ids 同時列出 movement.action.wrist-hand.flexion 與 movement.action.wrist-hand.extension，兩個都是記錄「不做」，不是 要在本相位做腕屈曲和腕伸展。腕中立是兩側都要避開的位置控制， 不是一個方向的動作。

    池畔說「第一划手肘在身體內側、不外掃」，同一句話包含兩個性質 相反的成分：手肘在內側發動對到 movement.action.elbow.flexion， 這是做肘屈曲；不外掃對到 movement.action.shoulder-complex.horizontal-abduction，這是避免做 肩複合體水平外展。兩者性質不同，不能寫成「肘屈曲加肩水平外展」； 本筆只記錄避開外掃，不寫其後果。

    池畔說「下巴貼胸到出水完成才抬頭」與「不要抬頭看前面」。解剖上， 前者是頸椎節段維持屈曲，action_ids 使用 movement.action.trunk.flexion，此處明確指頸椎節段；後者是延後 頸椎節段伸展，action_ids 使用 movement.action.trunk.extension， 此處同樣明確指頸椎節段。同一關節區域的兩個相反動作同時列出， 一個是維持、一個是延後，並不矛盾。「延後」是時間性質的要求， action_ids 沒有欄位可表達時間，不能只從動作清單讀出這層資訊。

    素材中的「第一划與最後一下海豚下踢同步」與踢法切換時機，是兩個 不屬於本筆的時序要點，記錄在 udk.breakout；本筆只作指路，不重述 其內容。素材中的「第一划不換氣」則是呼吸決策，沒有關節內容， 任何一筆都不寫。

    '
  limitation_context: '肩複合體水平內收、上舉、肘伸展、腕中立與頸椎屈曲是五個獨立成分， 延後抬頭是第六個時間維度；池畔看到的「還沒破壞流線」是它們的合成， 不能指出限制位於哪一個關節，也不能由浮起的外觀判定任何一個成分 已經到位。第一划的推進內容、踢腿時序與呼吸決策都不在本筆。

    '
  safety_note: '維持頸椎屈曲與雙臂上舉位時若出現頸部、肩部、腰部疼痛、麻木、 上肢放射症狀、明顯無力或不穩應停止，不要為了維持下巴貼胸或手臂 夾緊的外觀而強行下壓下巴、增加上舉角度或憋住不動。

    '
- id: movement.demand.udk.breakout.terminal-down-kick-and-first-pull-junction
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
