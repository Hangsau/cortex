  - src.riewald-rodeo-2015
  - src.hall-murphy-2020
  stroke: breast
  phase_model: descriptive
  phase: arm-recovery
  body_position: prone
  poolside_direction: 由池畔觀察，雙手結束拉水後向前伸出，雙腿收起後向後蹬出
  action_reference_frame: body-fixed
  derived_from_ids:
  - breast.tech.6
  action_ids: []
  muscle_roles: []
  measurement_conditions:
  - source_id: src.oxford-2017
    quantity: '協調指標 phase 2，定義為手臂拉水結束到腿部踢水開始之間的時間間隔； 原文比較 100 m 四趟之間的變化

      '
    value: 原文以時間間隔報告該協調指標；本專案未轉錄其數值與統計量
    conditions: '26 名蛙式專項泳者，三台 50 Hz 水下攝影機，取 100 m 每一趟末三個 週期分析；量的是手臂與腿部的事件時間差，沒有量頭、頸或呼吸流量。

      '
    endpoint: limb-coordination-timing
    extrapolation_boundary: '只界定手臂拉水結束到腿部踢水開始的間隔是可量的協調指標。 不支持任何最佳間隔值，不能判定快速或延遲收手何者較好，也不能 當作頭頸位置、呼氣時機或流線姿勢的錨點。

      '
  name_zh: 蛙式收手期的拉手到踢腿間隔
  description: '蛙式收手前伸與腿部蹬出之間存在可量的時間間隔，量測上定義為手臂 拉水結束到腿部踢水開始之間的時間差。教材對這段時序並存兩套策略： 一套讓手臂先進入比賽流線姿勢再等踢腿推進達到峰值，另一套讓手臂 延遲到踢腿推進峰值之後才入線。兩套都是教材技術主張，目前都沒有 實證比較，因此本筆並列保存，不指定其中一套。

    '
  limitation_context: '呼氣不能作為這些動作的時間錨點——沒有任何一層資料量測呼吸流量或 呼氣起訖。軀幹回到中立、頸部回到中立、手臂前伸、腿部蹬出是四個 各自獨立的事件，不能壓成同一瞬間。教材使用的三個姿勢名詞也不是 同義詞：週期起訖回到的是 body line，手臂前伸後進入的是比賽流線 姿勢，出發與轉身用的超流線又是另一個姿勢，彼此不可互換。本筆不 對頸椎中立給任何角度。

    '
  safety_note: '調整收手與蹬腿時序時若出現腰背、頸部、髖部或膝部疼痛、麻木、 明顯無力或不穩，應停止，不要為了追求時序而強行加快或憋住呼吸。

    '
- id: movement.demand.breast.arm-insweep.breath-event-separation
