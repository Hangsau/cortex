    role: '髖外展肌群的作用線在解剖上可參與股骨朝外展方向的移動與位置控制； 本筆不由大腿分開的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.hip-external-rotators
    role: '髖外旋肌群的作用線在解剖上可參與股骨外旋方向的移動與位置控制； 本筆不由大腿分開或腳跟位置的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-flexors
    role: '膝屈肌群的作用線在解剖上可參與膝屈曲方向的移動與位置控制； 本筆不由腳跟靠近臀部的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.ankle-dorsiflexors
    role: '踝背屈肌群的作用線在解剖上可參與距小腿關節背屈與位置控制； 本筆不由收腿或勾腳的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 蛙式收腿的髖屈曲外展、膝屈曲與踝背屈，以及可見現象的歸屬
  description: '髖屈曲：大腿朝腹側移動即命名為髖屈曲。這一欄記的是動作方向，不是 關節位置；只要股骨朝前旋轉就稱為屈曲，不論它正往中立位靠近或已經 超過中立位。因此收腿起始時，髖可能仍在伸展位置，卻已經朝屈曲方向 移動。

    髖外展：「大腿分開」的正確歸屬欄位是髖外展，這個可見現象不等於 髖旋轉。

    「腳跟往臀部拉」是膝屈曲，不是髖旋轉。腳跟接近臀部就是膝屈曲角度 增加的直接定義。髖旋轉不能從遠端反推，因為其旋轉軸大部分落在股骨 本體之外，沒有直接對應的體表標記；小腿與腳跟位置又另外受膝軸向 旋轉影響，而膝在部分屈曲時軸向旋轉最自由，收腿正是深屈膝情境。 這不代表收腿期沒有髖外旋；髖外旋在解剖上完全可能，只是「大腿分開」 與「腳跟位置」這兩個可見現象都不是它的證據。

    踝背屈的關節歸屬明確，背屈確實發生在距小腿關節。但收腿期的背屈 是在深屈膝條件下進行，與伸膝時的背屈不是同一條件，兩者不能互相 代表。

    '
  limitation_context: '髖屈曲、髖外展、髖外旋、膝屈曲與踝背屈各有獨立的可用範圍與控制 條件，其中髖外展的限制源偏向恥股韌帶與內收肌群的被動張力，髖外旋 的可用量隨髖屈曲角度改變。從池畔看到的收腿寬度與腳跟位置是這些的 合成，不能指出限制位於哪一個關節。

    '
  safety_note: '收腿時若出現髖部、鼠蹊、膝內側、腰背或踝部疼痛、卡住、麻木、明顯 無力或不穩應停止，不要為了把腳跟拉得更近或把膝分得更開而強壓。

    '
