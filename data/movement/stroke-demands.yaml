      '
  name_zh: 仰式下踢的髖伸展與膝屈伸序列
  description: '池畔可見方向：下踢；解剖學動作：髖伸展。仰躺時足部由水面側移向 池底側，股骨相對骨盆朝背側旋轉，在解剖學上命名為髖伸展；這與 自由式上踢落在同一個髖動作。膝先朝屈曲方向移動，再朝伸展方向移動， 此方向序列在矢狀面內成立；踝持續蹠屈。池畔可見方向與解剖學動作是 兩個欄位，不是同一件事，足部空間路徑不能取代關節局部命名。

    '
  limitation_context: '髖伸展、膝屈伸方向轉換與踝蹠屈各有獨立的可用範圍與控制條件； 足部朝池底的合成路徑混合多個關節，不能單獨指出限制來源，也不能 指定任何肌群的收縮型態或推進作用。

    '
  safety_note: '下踢時若出現髖部、膝部、踝部或腰背疼痛、卡住、麻木、明顯無力或 不穩，應停止，不要為了增加足部路徑而強行壓向關節終端。

    '
