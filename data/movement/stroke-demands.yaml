  - muscle_id: movement.muscle.shoulder-internal-rotator-extensors
    role: '肩內旋兼伸展肌群的作用線在解剖上可參與肱骨內旋方向的移動與位置 控制；本筆不由手掌轉向後方的外觀判定實際招募時序、程度或推進 貢獻。

      '
  name_zh: 蝶式抓水的肘屈曲加深與旋轉方向反轉
  description: '抓水時肘屈曲增加，這是乾淨的關節位置描述，沒有附掛其他成分。同一 動作在外掃記錄中另混入高肘一詞，抓水這一筆則只寫肘屈曲加深；這顯示 原始教材的問題是欄位混填而非知識錯誤，分開記錄即可直接對應關節定義， 混寫時則必須降級。

    外掃期的外旋在抓水期轉為內旋，是肱骨繞縱軸的軸向旋轉方向反轉， 直接對應解剖定義。這條的正確性不依賴從手掌朝向所作的任何反推， 因為教材直接記錄了關節旋轉方向；這正是入水與出水紀錄應採用卻沒有 完整採用的寫法。池畔看到手掌轉向後方仍可作為教學指標，但不能當成 旋轉欄位的填寫依據。

    本筆與外掃、內掃及上划構成外旋轉為內旋、再維持內旋的內部一致序列； 這項序列一致性只描述關節旋轉方向，不承載推進主張。

    '
  limitation_context: '肘屈曲與肱骨軸向內旋是兩個獨立自由度；池畔看到的抓水是兩者加上 手部空間位置的合成，不能指出限制在哪一項。教材另有 EVF 與划手 路徑模型等構念，涉及推進假設，不在本層。

    '
  safety_note: '抓水時若出現肩前側疼痛、卡住、麻木、明顯無力或不穩應停止，不要 為了讓手掌更快朝後而加大內旋幅度。

    '
