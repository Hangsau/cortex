  muscle_roles:
  - muscle_id: movement.muscle.hip-extensors
    role: '髖伸肌群的作用線在解剖上可參與髖伸展方向的移動與位置控制；本筆 不由雙腿蹬直離牆的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '膝伸肌群的作用線在解剖上可參與膝伸展方向的移動與位置控制；本筆 不由膝部蹬直的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '踝蹠屈肌群的作用線在解剖上可參與踝蹠屈方向的移動與位置控制；本筆 不由足部離牆的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩胛上迴旋方向的移動與位置 控制；本筆不由雙臂在頭前夾緊的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-extensors
    role: '肘伸肌群的作用線在解剖上可參與肘伸展方向的移動與位置控制；本筆 不由肘部維持伸直的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與軀幹屈伸方向的移動與位置 控制；本筆不由推蹬時身體伸直的外觀判定實際招募時序、程度或 推進貢獻。

      '
  name_zh: 推蹬的肩複合體合計角度分層，與流線先於蹬伸的時序
  description: '池畔所說「蹬直」是由髖伸展、膝伸展與踝蹠屈組成的下肢伸直序列， 池畔與解剖命名一致。本筆不指定誰先誰後，也不判定哪個關節出力最多； 牆段沒有相位化肌電，也沒有關節角速度量測可支持這些判定。

    池畔與教材會說「手臂要舉到最直、貼緊耳朵」，也會用一個角度描述 「手臂舉到接近極限」。該角度是肩複合體的合計值，不是單一關節角度； 它由盂肱關節本身的貢獻與肩胛胸廓上迴旋的貢獻共同組成，兩層各自提供 一部分，而且拆分比例來自寬廣的估計範圍，不是精確常數。本筆不寫 合計值或分層比例的任何數值。

    若把合計角度整包掛在單一關節上，就會到錯的層級尋找限制。手臂舉不到位 的限制可能在肩胛胸廓層，也可能在盂肱層，兩者的判讀與處理不同；只用 合計角度描述，這項分層差異就會被抹平。因此 action_ids 同時列出 movement.action.shoulder-complex.elevation 與 movement.action.shoulder-complex.scapular-upward-rotation，兩者都不可刪除。

    池畔所說「肘夾緊、雙手交疊」解剖上是肩複合體水平內收，加上肘伸展 的維持，兩欄命名一致。超流線把肩往前送的分層寫在入水相位的記錄裡。

    池畔所說「腳離牆前流線就要做好」描述的是關節間時序，不是單一動作。 流線姿勢在腳離牆前達成，是上肢姿勢達成與下肢蹬伸之間的先後關係； 本層只能記錄此相位存在關節間的先後要求，壓成任何單一動作名都會遺失 資訊。離牆之後身體受水阻影響仍可改變姿勢，這與空中拋體的情況不同， 所以兩個相位的時序要求不能互相套用。

    同一個未解決的擇一在推蹬期同樣適用，記錄在入水相位那一筆。因為腰椎 方向未定，action_ids 刻意不列 movement.action.trunk.extension 或 movement.action.trunk.flexion；列出其中任一動作就等於替擇一選邊， 並非本筆遺漏。

    '
  limitation_context: '髖伸展、膝伸展、踝蹠屈、肩複合體上舉、肩胛上迴旋、水平內收與肘伸展 是彼此獨立的成分，它們之間的先後次序是另一個獨立維度，腰椎方向則是 尚未確定的獨立維度。池畔看到的「蹬牆推出去」是這些維度的合成，不能 指出限制位於哪一個關節，更不能由手臂舉起的外觀判定限制位於肩胛胸廓 或盂肱層；這正是合計角度會誤導的地方。推蹬力向量與出水速度不在本層。

    '
  safety_note: '做推蹬與流線姿勢時若出現肩部、腰部、膝部疼痛、卡住、麻木、明顯無力 或不穩應停止，不要為了把手舉得更高或把身體伸得更直而勉強增加上舉 角度、改變肩胛位置或改變腰椎曲度。

    '
