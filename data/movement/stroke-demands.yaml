  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群在解剖上可參與肘屈曲與前臂位置控制；是否在捕水時採用 這項能力及採用程度，仍需相位化運動學與肌電資料支持。

      '
  name_zh: 仰式捕水期的肩軸向旋轉方向反轉需求
  description: '入水時肱骨位於外旋方向，進入捕水後，肱骨繞自身長軸的旋轉方向轉為 內旋。捕水時的受力構型包含前臂而不只有手掌朝向推進方向，使可接觸 水流的表面涵蓋前臂全長與手掌寬度。這裡描述的是肱骨旋轉方向與肢段 朝向，不指定固定深度、距離或推力來源比例。

    '
  limitation_context: '手掌朝向同時可能受肱骨軸向旋轉、前臂旋轉與腕手位置影響，不能只看 手掌反推肩內旋。肘屈曲與前臂朝向也屬不同層級，單一體表構型不足以 分辨哪個關節條件形成限制。

    '
  safety_note: '捕水轉向或屈肘時若出現肩部或肘部疼痛、夾擠感、麻木、明顯無力或 不穩，應停止，不要為了維持肢段朝向而強行扭轉肩肘。

    '
