    role: '髖屈肌群的作用線在解剖上可參與髖屈曲方向的移動與位置控制；本筆 不由雙腳朝水面移動的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '膝伸肌群的作用線在解剖上可參與膝伸展方向的移動與位置控制；本筆 不由仰躺上踢的膝部外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '踝蹠屈肌群的作用線在解剖上可參與踝蹠屈方向的移動與位置控制； 本筆不由仰躺上踢的足部外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 仰躺水下海豚腳上踢——同一個池畔動作對應的是髖屈曲
  description: '這個情境在日常賽訓中反覆發生：仰式選手每一次轉身後都會在仰躺體位 做水下海豚腳，並不是理論上的邊緣案例。

    仰躺時腹側朝水面，所以腳往水面移動就是腳往腹側移動，解剖命名為 髖屈曲，與俯臥版本的髖伸展完全相反。骨動學命名一律從解剖位置起算， 不隨身體在空間中的朝向改變；這不是兩種說法，而是同一規則在兩個 體位下得到的兩個結果。

    教材常見的「動作模式與蝶式的海豚打腿相同」在這裡會出錯。蝶式是 俯臥，直接照抄等於把俯臥的命名輸出到仰躺。要寫成正確內容，必須先 填體位欄位，不能以同蝶式帶過。

    力學條件也不對稱，不只是命名鏡像。髖屈曲的可用範圍遠大於髖伸展， 所以俯臥上踢使用髖的窄邊，仰躺上踢使用髖的寬邊。同一句上踢幅度不足， 在兩種體位下要看的地方不一樣；本層只列出不對稱存在，不提供判別流程。

    膝與踝不翻轉。膝只有屈曲方向可用，踝的蹠屈同理，所以兩種體位下的 解剖命名不變，改變的只是對應的池畔可見方向。唯有髖與軀幹會發生 命名翻轉，因為只有它們在中立位兩側都有可用範圍；不能把整段打腿 描述鏡像。

    '
  limitation_context: '髖屈曲、膝伸展與踝蹠屈各自獨立；池畔看到的上踢外觀在兩種體位下 看起來一樣但解剖內容不同，所以任何以池畔外觀建立的判讀，若沒有先 記錄體位，就無法對應到關節。本筆不提供任何幅度目標或角度門檻。

    '
  safety_note: '仰躺姿勢下上踢時若出現髖前側、下背、膝或小腿疼痛、抽筋、麻木、 明顯無力或不穩應停止，不要為了加大幅度而讓腰部反折。

    '
