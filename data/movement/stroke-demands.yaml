    role: '在滑行段承擔腳尖後指姿勢的維持。這是姿勢維持的候選角色，來自一般 作用線與教材描述；沒有蛙式滑行段的肌電資料，不宣稱維持所需的強度 或收縮型態。

      '
  name_zh: 蛙式蹬腿收尾進入滑行的蹠屈流線姿勢需求
  description: '蹬腿的最後，雙腿在身體後方伸直、雙腳完成靠攏、腳尖指向後方，接著進入 滑行。這個姿勢的作用是降低下一段滑行的正面阻力，不是靠「把兩腳夾在 一起」產生主要推進。 時序上也要注意：腳尖後指與踝的蹠屈在雙腿還在互相靠近的途中就已經 開始，不是等到兩腳併攏之後才做。 另外，「雙腳併攏」在部分研究裡被當成蹬腿與滑行之間的事件邊界，但三維 追蹤顯示這條界線切不乾淨——不同波幅風格的泳者，內夾與收腿的時序並不 一致，所以它是一個方便的分界，不是所有蛙式技術共用的標準。

    '
  limitation_context: '看到腳尖沒有指向後方時，原因可能是可用蹠屈範圍不足、姿勢維持的控制 不足，或這名泳者採用的是不同的收腿時序；三者處理方向不同，不能只看 外觀就決定。

    '
  safety_note: '滑行段刻意壓腳尖時若出現踝部疼痛、抽筋或麻木，應停止延長該姿勢的 時間，不要為了外觀而追求更大角度。

    '
- id: movement.demand.fly.aerial-recovery.scapular-stability-without-body-roll
