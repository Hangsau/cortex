  poolside_direction: 由池畔觀察，雙臂在頭前交疊夾緊、身體伸直，雙腿由屈曲蹬直離牆（教學語稱「蹬牆」「推出去」「流線先做好」）
  action_reference_frame: joint-local
  derived_from_ids:
