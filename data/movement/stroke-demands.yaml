  body_position: prone
  poolside_direction: 由池畔觀察，手出水之後肘部先抬起來、手掌鬆鬆地跟在後面；背後的肩胛骨明顯往上轉。不同泳者的肘部彎曲程度差很多，有人幾乎打直繞一個大圈，有人肘部彎得很明顯（教學語稱「提肘」「手放輕鬆」「彎臂回臂／直臂回臂」）
