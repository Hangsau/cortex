    role: '踝背屈肌群的作用線在解剖上可參與距小腿關節背屈與位置控制； 本筆不由腳尖朝外的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.foot-evertors
    role: '足外翻肌群的作用線在解剖上可參與距下與橫跗關節旋前及位置控制； 本筆不由腳尖朝外的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.hip-external-rotators
    role: '髖外旋肌群的作用線在解剖上可參與股骨外旋方向的移動與位置控制； 本筆不由腳尖朝外的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-flexors
    role: '膝屈肌群的作用線在解剖上可參與屈膝時的膝軸向旋轉與位置控制； 本筆不由小腿與足朝外的外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 蛙式翻腳的「腳尖朝外」是多關節合成，外翻不發生在距小腿關節；髖的旋轉方向兩向並列
  description: '關節歸屬更正：兩本解剖來源一致指出，距小腿關節只有背屈與蹠屈一個 主要自由度；外翻是額狀面動作，發生在距下關節與橫跗關節。因此 「踝關節外翻」是誤稱，正確寫法是距下關節／橫跗關節旋前。

    髖的旋轉方向本筆兩向並列，不選邊。庫內另有一筆記錄 （breast.tech.15）把翻腳所需的髖旋轉寫成內旋，與本筆原先只列的 外旋方向相反。翻腳不是一個瞬間的定姿，而是收腿到蹬出之間股骨方位 持續改變的過程；同一條腿在過程的不同時點可以先後出現兩個方向的 旋轉，兩筆素材各自描述的未必是同一個時點，而它們都沒有寫明自己 講的是哪一段。本圖譜是列舉性的——列出這個相位牽涉到哪些關節動作， 不裁決哪一個主導、哪一個才對——因此兩個方向都列進 action_ids， 並且不對任一方向指定幅度、時序或推進貢獻。

    「腳尖朝外」是多個貢獻源的向量和，數者可同時發生；池畔或水下攝影 看到的是合成結果，不能整個歸給任一單一關節。髖旋轉是股骨繞縱軸 轉動並帶動整條下肢，就可供腳掌方位改變的一般解剖幅度而言，是各 貢獻源中幅度最大的一項，但無法由遠端位置反推——這一點對外旋與 內旋同等成立。膝軸向旋轉是脛骨相對股骨 外旋，只在膝屈曲時存在，部分屈曲時最自由，而翻腳期膝正處於深屈曲。 距下關節旋前的外展成分會使前足相對小腿轉向外側，但可用幅度很小。 橫跗關節是足部最靈活的關節，具有兩條旋轉軸。

    解剖教科書能直接支持的正面事實是，旋前屬於單軸三平面運動，三個 成分的組合不變；任一成分存在，就代表另兩個也在發生。因此足部外翻 會伴隨腳尖外轉的定性關聯成立；不成立的是把幅度、關節歸屬與因果 全部壓在「踝」這一格。同一相位裡的持續背屈與外翻，也可能是同一個 旋前動作的兩個成分，不必然是兩個獨立動作。

    '
  limitation_context: '各貢獻源各有獨立的可用範圍，且髖旋轉的可用量隨髖屈曲角度改變、 膝軸向旋轉只在屈膝時存在。看到腳尖朝外的角度不足，不能指出限制 位於髖、膝、距下或橫跗的哪一處；要區分必須逐關節分別量測。

    '
  safety_note: '翻腳時若出現膝內側、踝外側、足部或髖部疼痛、卡住、麻木、明顯無力 或不穩應停止，不要靠外力扳轉腳掌來增加朝外的角度。

    '
- id: movement.demand.fly.entry.elevation-plane-and-contested-rotation-direction
  claim_status: disputed
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
