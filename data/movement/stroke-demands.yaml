  - muscle_id: movement.muscle.shoulder-internal-rotator-extensors
    role: '肩內旋伸展肌群在解剖上可參與肱骨內旋與肩部位置控制；特定拉水 段是否採用這些能力及採用程度，仍需相位化肌電資料支持。

      '
  name_zh: 仰式拉水期的前臂朝向優先於路徑形狀
  description: '拉水時肘維持明顯屈曲，手臂沿曲線而非直線路徑移動；具體屈曲位置與 划手路徑有顯著個體差異。強調固定 S 形路徑的指導語已過時，因此可 跨個體保留的是前臂朝向需求，而不是指定每位泳者採用相同路徑形狀。 手臂若只沿直線推進，會縮小可用的受力表面，並使肩關節處在較不利的 力學位置而承受剪力。

    '
  limitation_context: '前臂朝向是肩內旋、肘屈曲、前臂旋轉與腕手位置的合成結果；其中任一 層的可用範圍或控制條件都可能改變外觀。路徑偏離某個固定形狀本身 不代表存在限制，也不能由單一視角把原因指定給某一關節。

    '
  safety_note: '拉水時若出現肩部、肘部或腕部疼痛、夾擠感、麻木、明顯無力或不穩， 應停止，不要為了複製固定路徑而強行扭轉上肢。

    '
