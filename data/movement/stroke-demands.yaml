    role: '踝蹠屈肌群的作用線在解剖上可參與踝蹠屈方向的移動、位置控制與維持； 本筆不由最後一次下踢時足部的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與軀幹屈伸方向的移動、 位置控制與維持；本筆不由臀部固定的外觀判定實際招募時序、程度或 推進貢獻。

      '
  name_zh: 出水划手期的最後一次下踢，與「銜接」不是一個關節動作
  description: '池畔說「最後一下海豚下踢」，看到腿往池底方向打，直覺容易命名為 伸展。解剖學動作名以解剖姿勢為基準；在俯臥姿勢下，大腿往池底方向 相對軀幹移動是髖屈曲，不是髖伸展。庫內既有方向命名也顯示，仰臥時 腿往水面移動同樣是髖屈曲，俯臥時腿往水面移動才是髖伸展。「往下」 與「往上」是池畔的空間語言，屈曲與伸展是解剖語言，兩者的對應完全 由軀幹的空間朝向決定，不能直接互換。這個對照只說明命名基準；本筆 只記錄素材所屬的俯臥情形，不描述也不推論仰臥出水。

    下踢末段的膝伸展與踝蹠屈在池畔與解剖命名上相符。本筆只記錄下踢 末段的膝伸展；下踢前段的膝屈曲屬於下踢相位本身，庫內已有記錄， 本筆不重述。本筆也不寫三者誰先誰後或誰出力最多，因為出水段沒有 相位化肌電或關節角速度量測。

    池畔說「最後一踢接第一划」「不要有空窗」，也就是最後一次海豚下踢 與第一划同步、不留空檔。這個「銜接」描述兩個事件在時間上的相對位置， 在 joint-local 框架下沒有任何一個關節動作能對應；把它壓成單一動作名 會丟失時序資訊。另一個要求是最後一次海豚踢完成之後才切換成該泳式的 踢法，同樣是時序，也沒有對應的關節動作。第一划本身的關節內容另記在 starts-turns.breakout；本筆只作指路，不重述、不改寫也不節錄。

    池畔說「小幅高頻」，其中振幅是空間量，頻率是時間量，兩者都不是 可命名的關節動作，也不能反推任一關節的屈伸量；同一個可見振幅可以 由不同的髖膝分配組成。本筆不為「小幅高頻」指定任何關節動作。

    池畔說「臀部固定」或「屁股不要亂晃」，描述的是髖活動幅度受到控制， 不是要做髖屈曲，也不是要做髖伸展。action_ids 刻意不列 movement.action.hip.extension；列入就會把限制幅度的素材誤寫成要求 本相位做髖伸展，並非本筆漏列。

    '
  limitation_context: '髖屈曲、膝伸展與踝蹠屈是三個獨立成分，它們與第一划之間的時間關係 是第四個維度，而該維度在本層沒有任何關節動作可以承載；池畔看到的 「接得很順」是這四者的合成，不能指出限制位於哪一個關節，更不能由 踢腿外觀判定銜接時序是否到位。踢腿振幅、頻率、出水速度與第一划的 推進內容都不在本筆。

    '
  safety_note: '做最後一次下踢與出水銜接時若出現腰背、髖部、膝部或踝部疼痛、麻木、 明顯無力或不穩應停止，不要為了把踢腿做得更快或把銜接接得更緊而 勉強增加踢腿幅度或改變腰椎曲度。

    '
- id: movement.demand.fly.entry-pause.position-maintenance-and-pause-naming-conflict
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
  - src.neumann-2017
  - src.riewald-rodeo-2015
  stroke: fly
  phase_model: descriptive
  phase: entry-pause
  body_position: prone
  poolside_direction: 由池畔觀察，雙手入水之後手臂不再繼續往前衝，維持前伸位並有一段極短的停住；同時胸口往下沉、手腕微微向下折（教學語稱「入水後要停一下」「胸口壓下去」）
  action_reference_frame: joint-local
  derived_from_ids:
  - fly.tech.21
  - fly.tech.1
  action_ids:
  - movement.action.shoulder-complex.elevation
  - movement.action.wrist-hand.flexion
