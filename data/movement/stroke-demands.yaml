  muscle_roles:
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與頸椎節段在伸展與屈曲方向的位置 控制與維持；本筆不由下巴向前或頭部回位的外觀判定實際招募時序、程度或推進 貢獻。

      '
  name_zh: 呼吸視窗的頸椎伸展避免與回復，以及事件視窗這個分期性質
  description: '呼吸視窗不是從划手週期切出的連續段落，而是全登錄表唯一使用事件視窗分期模型 的相位。它描述在特定時間區間開啟、可以使用也可以不使用的機會窗，不是每個 週期都必然經過的一段動作。因此本筆列出的動作不是「這個相位要做的動作」， 而是「這個視窗被使用時，頸椎會發生什麼」。

    池畔所說「下巴往前推出去」描述的是下巴在空間中的位移，不是關節動作。下巴的 空間位置是頸椎角度、胸椎角度與整個身體在波動中姿態的合成，單看下巴推到 哪裡，推不出頸椎伸展的程度。因此 action_ids 沒有也不可能有一個叫「向前」的 動作；關節動作詞彙描述的是體節相對體節的角度變化，不是體節在空間中的位移。

    池畔所說「不要抬頭」是頸椎伸展的避免。action_ids 所列的 movement.action.trunk.extension 在此明確指頸椎節段；列出這個 id 是為了記錄 視窗使用時要避開頸椎伸展，不是要求做出伸展。這項列舉不主張伸展的力學後果， 也不裁決呼吸方式的優劣。

    池畔所說「吸完馬上把頭放回去」是頸椎屈曲方向的回復。action_ids 所列的 movement.action.trunk.flexion 在此明確指頸椎節段；它表示回到視窗開啟前已有 的位置，不是在視窗裡產生新的屈曲。同一關節區域的相反動作同時出現在 action_ids，一個是避免，一個是回復，並不矛盾，而是這個視窗的實際結構。

    池畔所說「出水到移臂之間那個空檔吸氣」描述的是時序，也是本相位的主體， 不是關節動作。素材所列的整串時間節點是在標示事件的相對位置；joint-local 框架下沒有任何一個關節動作能承載它，本筆列出的頸椎伸展避免與頸椎屈曲回復 不足以描述整個相位，這是相位性質而不是遺漏。本層不把時序改寫成訓練順序、 呼吸長短或換氣頻率策略。手臂的出水與空中移臂在時間上與視窗重疊，庫內另有 記錄，本筆只作指路而不重述。胸椎下壓由蝶式入水停頓的既有記錄承載，本筆不寫 其內容。頭部在不換氣時作為波動起始的角色屬划手週期，不屬本視窗，本筆不寫。

    '
  limitation_context: '頸椎伸展的避免與頸椎屈曲的回復是兩個成分，視窗的開啟時機與持續長度則是另一個 時間維度，而本層沒有欄位可以承載它；池畔看到的「下巴貼著水面出來」是這些的 合成，不能指出限制位於哪一個節段，也不能由下巴的位置判定頸椎處於什麼角度。 手臂動作、胸椎姿態、呼吸頻率策略與阻力後果都不在本筆。

    '
  safety_note: '換氣時若出現頸部疼痛、僵硬、頭暈、上肢麻木或放射症狀、明顯無力或不穩應停止， 不要為了把下巴推得更前面而強行仰頭、把頸部往後壓或憋氣硬撐。

    '
