  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩胛上迴旋方向的移動，以及 肩複合體上舉位的控制與維持；本筆不由手臂維持前伸的外觀判定實際 招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.wrist-flexors
    role: '腕屈肌群的作用線在解剖上可參與腕屈方向的移動、位置控制與維持； 本筆不由手腕微微向下折的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.trunk-sagittal-controllers
    role: '軀幹矢狀面控制肌群的作用線在解剖上可參與胸椎節段屈伸方向的移動、 位置控制與維持；本筆不由胸口往下沉的外觀判定實際招募時序、程度或 推進貢獻。

      '
  name_zh: 入水停頓期的位置維持，與「停頓」一詞的命名衝突
  description: '停頓期能承載的關節內容首先是維持位置。手臂入水後維持在肩複合體 上舉位，這個位置在入水瞬間就已達成；本相位只是不去破壞它，並非 在停頓期新產生肩複合體上舉。

    池畔說「胸口往下壓」，解剖上對到 movement.action.trunk.flexion， 此處明確指胸椎節段；若不標出胸椎節段便無法驗證。同時，池畔看到 「手腕微微向下折」，解剖上是 movement.action.wrist-hand.flexion， 也就是腕輕度屈曲，兩欄命名一致。

    教材也會說「拇指先切入」，並用一個角度描述手切入水面時的朝向。 這是手相對水面的空間姿態，屬於池畔固定參考框架；本筆的 action_reference_frame 則是 joint-local。把這個朝向反推成肩內旋 或前臂旋前，是庫內已判定為無效的推論方式。同一手部朝向可以由 肩旋轉、前臂旋轉、腕位置與整個軀幹滾轉的不同組合產生，單一朝向 不能唯一決定任何一個關節的角度。因此 action_ids 刻意不列 movement.action.shoulder-complex.internal-rotation 與 movement.action.forearm.pronation；這不是漏列，而是禁止由空間朝向 反推關節旋轉。

    「停頓」一詞在庫內有命名衝突。另一筆蝶式動力鏈記錄用「連續」描述 整個划水週期的速度結構，意指沒有蛙式那種明顯的滑行低谷；本筆的 「停頓」則描述入水瞬間的受控減速緩衝。兩者談的是不同時間尺度， 是同一個詞用在不同尺度造成的表面衝突，不是內容矛盾。本筆不裁決 哪一種說法較正確，也不建議改用哪個詞或暗示任一既有記錄需要修正。

    入水瞬間的肩上舉平面與旋轉方向爭議已記錄在蝶式入水相位的既有記錄， 本筆只作指路，不重述、不改寫也不節錄。第一踢的關節內容與時序也已 記錄在蝶式第一踢的既有記錄；本筆不寫停頓對第一踢的任何影響，因為 那是力學後果與速度歸屬，不在本層。

    '
  limitation_context: '肩複合體上舉維持、胸椎屈曲與腕屈曲是三個獨立成分，它們在時間上的 持續長度是第四個維度，而本層沒有欄位可以承載；池畔看到的「停了一下」 是這四者的合成，不能指出限制位於哪一個關節。手部切入水面的空間朝向、 動量轉換的力學後果與對第一踢的影響都不在本筆，也不得由它們反推任何 關節角度。

    '
  safety_note: '做入水與停頓時若出現肩部、頸部、胸背部或腕部疼痛、麻木、明顯無力 或不穩應停止，不要為了做出停頓外觀或把胸口壓得更低而勉強增加上舉 角度、加大胸椎彎曲或用力折腕。

    '
- id: movement.demand.free.lift.deferred-descent-and-style-time-difference
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: synthesis-inference
  source_ids:
