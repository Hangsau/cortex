    role: '髖伸肌群的作用線在解剖上可參與髖伸展方向的移動與位置控制；本筆 不由雙腳朝水面移動的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.knee-extensors
    role: '膝伸肌群的作用線在解剖上可參與膝伸展方向的移動與位置控制；本筆 不由俯臥上踢的膝部外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.ankle-plantarflexors
    role: '踝蹠屈肌群的作用線在解剖上可參與踝蹠屈方向的移動與位置控制； 本筆不由俯臥上踢的足部外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 俯臥水下海豚腳上踢的髖伸展與可用幅度不對稱
  description: '俯臥時腹側朝池底，所以腳往水面移動就是腳往背側移動，解剖命名為 髖伸展。這個對應只在俯臥時成立；仰躺版本對應的是相反的髖部動作。

    髖伸展可用範圍明顯小於髖屈曲，而且膝屈曲時會進一步壓縮。跨過髖與 膝兩個關節的股直肌被拉長後，被動張力會把髖伸展可用量壓回接近中位。 因此俯臥上踢使用的是髖矢狀面可用範圍的窄邊。

    在髖伸展可用量有限時，池畔看到的腿部上抬會有相當比例來自腰椎伸展 與骨盆前傾。所以動作清單列出軀幹伸展，不是額外的技術要求，而是 對可見幅度來源進行拆帳的項目。

    膝與踝的命名不隨體位翻轉。膝只有屈曲一個方向可用，踝的蹠屈同理， 因而在俯臥與仰躺下使用相同的解剖動作名，改變的只是它們對應的池畔 可見方向。唯有髖與軀幹會發生命名翻轉，因為只有它們在中立位兩側 都有可用範圍，不能把整段打腿描述全部鏡像。

    '
  limitation_context: '髖伸展、膝伸展、踝蹠屈與軀幹伸展各有獨立的可用範圍；池畔看到的 上踢幅度不足不能指出限制位於哪一項。教材另有把上踢與推進效益連起來 的說法，那些出自游泳運動學與流體量測，不在本層來源範圍，本筆不描述、 不引用、也不反駁。池畔看到的膝彎曲程度有一個以上的可能來源，包括 踝的可用蹠屈範圍、髖的位置與主動控制，外觀本身不能指定是哪一個。

    '
  safety_note: '上踢時若出現下背、髖前側、膝或小腿疼痛、抽筋、麻木、明顯無力或 不穩應停止，不要靠加大腰部拱起來換取更大的上踢幅度。

    '
