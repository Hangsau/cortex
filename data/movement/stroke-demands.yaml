  muscle_roles:
  - muscle_id: movement.muscle.scapular-upward-rotators
    role: '肩胛上迴旋肌群的作用線在解剖上可參與肩複合體上舉方向的移動與 位置控制；本筆不由雙手向外分開的外觀判定實際招募時序、程度或 推進貢獻。

      '
  - muscle_id: movement.muscle.rotator-cuff
    role: '肩袖肌群的作用線在解剖上可參與上舉所伴隨的外旋與盂肱位置控制； 本筆不由手部向外移動的外觀判定實際招募時序、程度或推進貢獻。

      '
  - muscle_id: movement.muscle.elbow-flexors
    role: '肘屈肌群的作用線在解剖上可參與肘屈曲方向的移動與位置控制； 本筆不由外掃時的肘部外觀判定實際招募時序、程度或推進貢獻。

      '
  name_zh: 蝶式外掃的上舉平面命名與必然外旋
  description: '外掃從接近最大上舉、手臂位於頭前的位置開始。從這個位置讓雙手向外 分開，在解剖體系中是上舉平面由近矢狀面移向肩胛平面或額狀面，不是 從手臂貼在體側起算的額狀面外展。如果外掃進行到上舉角度降至接近 直角，同一平面內向外、向後的移動又要改稱水平外展。因此使用外展 這個名稱前，必須先說清楚起始上舉角度與上舉平面。方向上，肱骨確實 向外側移動；但單一名稱承載不了整段變化，所以本筆只給 partially-supported。蝶式雙手同步且路徑貼近水面，這段上舉角度的 變化尤其難用單一術語概括。

    往外展方向上舉時，肱骨會自然伴隨外旋，使大結節從肩峰後方通過； 因此外旋不是可選的細節，而是上舉本身的必然成分。同一份教材在外掃 期填了旋轉欄位，卻在出水期留白，缺的是欄位紀律而不是知識。在外展 接近直角的位置，外旋的可用範圍比內收位更大，所以外掃期的外旋需求 在一般解剖容量上餘裕充足。

    肘開始屈曲的關節方向成立。教材另有高肘與 EVF 等詞，涉及肘相對 手掌和水面的位置、前臂朝向與推進假設，不在本層裁決範圍；本筆不 描述其做法、好處或判準。

    '
  limitation_context: '上舉平面、上舉角度、外旋與肘屈曲各自獨立；池畔看到的手向外分開 是它們的合成，不能指出限制在哪一項。外掃幅度大小與推進效果的關係 屬於游泳運動學，不在本層。

    '
  safety_note: '外掃時若出現肩部疼痛、卡住、麻木、明顯無力或不穩應停止，不要為了 把手分得更開而勉強增加上舉角度或改變上舉平面。

    '
