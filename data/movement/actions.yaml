  - posterior tilt
  - scapular posterior tilting
  joint_region: shoulder-arm
  definition: '肩胛骨後傾這個術語的定義層級是肩鎖關節：矢狀面調整繞近內外側軸 發生，外觀上是肩胛骨下角轉離胸廓後表面，命名依據則是關節窩的旋轉 方向，不是下角本身。在姿勢描述中，肩胛骨相對胸廓的最終位置是肩胛 胸廓層級的合成結果；肩鎖關節的定義層級與肩胛胸廓的姿勢層級都須標明。

    '
  plane:
  - sagittal
  axis:
  - 通過肩胛骨的內外側軸
  observable_boundaries: '解剖來源指出，上舉過程中上迴旋的肩胛骨必然伴隨不等量的後傾與淨外旋， 以貼合胸廓曲度、讓關節窩朝向手臂預定的上舉平面，並讓喙肩弓遠離前進 中的肱骨頭。肩胛後傾與肱骨外旋是同一個問題的兩個對策：一個轉肩胛， 一個轉肱骨，兩者是獨立欄位而不是重複命名。

    '
  general_anatomical_capacity: '後傾的幅度隨上舉角度變化，解剖來源以「不等量」描述其伴隨程度。 本條不以單一角度作能力門檻。

    '
  name_zh: 肩胛骨後傾
  description: '肩胛骨後傾在術語上定義於肩鎖關節，命名依據是關節窩的旋轉方向； 姿勢上看到的則是肩胛骨相對胸廓的合成位置。手臂上舉時，後傾與 上迴旋相伴，並與肱骨外旋形成兩個方向不同的讓位動作：一個轉肩胛， 一個轉肱骨，描述時應分開記錄。

    '
  safety_note: '抬高手臂或調整肩胛時若出現肩部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要以外力強壓肩胛或增加上舉範圍。

    '
- id: movement.action.shoulder-complex.scapular-elevation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩胛骨上提
  aliases:
  - 肩胛上提
  - 聳肩
  - scapular elevation
  joint_region: shoulder-arm
  definition: '肩胛骨上提是肩胛骨整體往頭側移動，是胸鎖與肩鎖兩個關節旋轉的合成； 聳肩大部分是肩胛骨跟隨鎖骨繞胸鎖關節上舉的直接結果。

    '
  plane:
  - frontal
  axis:
  - 通過胸鎖關節的前後軸
  observable_boundaries: '解剖來源在列舉手臂上舉時肩胛骨的必然伴隨動作時，列的是上迴旋、後傾 與淨外旋，上提不在其中。因此上提在過頭姿勢裡的性質是「容許有一些」， 與上迴旋、後傾的「必然發生」不是同一件事；把三者並列而不區分必然性 程度會造成誤導。

    '
  general_anatomical_capacity: '鎖骨的上提與下壓大致平行於額狀面、繞近前後軸，兩個方向的可用範圍 明顯不對稱，上提遠大於下壓。本條不以單一角度作能力門檻。

    '
  name_zh: 肩胛骨上提
  description: '肩胛骨上提是肩胛骨整體往頭側移動，主要呈現為肩胛骨跟隨鎖骨繞 胸鎖關節上舉。過頭姿勢可以容許一些上提，但解剖來源沒有把上提列入 手臂上舉時的必然伴隨清單；它不能與必然發生的上迴旋和後傾視為等價。

    '
  safety_note: '聳肩或抬高手臂時若出現肩部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要以外力強行增加肩胛上提或上舉範圍。

    '
- id: movement.action.forearm.pronation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 前臂旋前
  aliases:
  - 旋前
  - 前臂內轉
  - forearm pronation
  joint_region: shoulder-arm
  definition: '前臂旋前是橈骨相對尺骨繞前臂縱軸的旋轉，使手掌轉向背側方向；動作 發生在近端與遠端橈尺關節，與腕關節和肩關節都是不同的自由度。

    '
  plane:
  - transverse
  axis:
  - 通過橈骨頭到尺骨莖突的前臂縱軸
  observable_boundaries: '手固定不動時，看起來像前臂旋前或旋後的動作，本質上可能是盂肱關節 的軸向旋轉；解剖來源明確指出兩者在手固定時可以表現成同一個外觀。 因此手掌在空間中的朝向不是前臂旋轉的證據，而是肱骨軸向旋轉、前臂 旋前旋後與腕關節位置三者的合成。判定前臂旋轉必須直接看橈骨相對尺骨 的位置，不能由手掌朝向反推。

    '
  general_anatomical_capacity: '前臂可透過近端與遠端橈尺關節的配合，由中間位朝旋前方向移動；實際 可用範圍會隨肘部位置、近端與遠端橈尺關節狀態及量測固定方式而變。 本條不以單一角度作能力門檻。

    '
  name_zh: 前臂旋前
  description: '前臂旋前是橈骨相對尺骨繞前臂縱軸轉動，與肩關節旋轉和腕關節位置 都是不同的自由度。手掌在空間中的朝向由這三者合成，因此不能由 手掌朝向反推前臂是否旋前；判定時須直接看橈骨相對尺骨的位置。

    '
  safety_note: '旋轉前臂時若出現肘、前臂、腕或手部疼痛、卡住、麻木、明顯無力或 不穩，應停止，不要以外力強行增加旋前範圍。

    '
- id: movement.action.forearm.supination
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 前臂旋後
  aliases:
  - 旋後
  - 前臂外轉
  - forearm supination
  joint_region: shoulder-arm
  definition: '前臂旋後是旋前的反向動作，橈骨相對尺骨轉回與尺骨平行的位置，使手掌 轉向腹側方向；動作發生在近端與遠端橈尺關節，與腕關節和肩關節都是 不同的自由度。

    '
  plane:
  - transverse
  axis:
  - 通過橈骨頭到尺骨莖突的前臂縱軸
  observable_boundaries: '手掌在空間中的朝向是肱骨軸向旋轉、前臂旋前旋後與腕關節位置的合成， 不能由手掌朝向反推前臂旋後。判定前臂旋轉必須直接看橈骨相對尺骨的 位置。旋前與旋後的中間位，也就是前臂中立，是有明確解剖定義的參考位； 但「中立」必須說明是哪一個軸上的中立，單寫「中立」在多軸關節上無法驗證。

    '
  general_anatomical_capacity: '前臂可透過近端與遠端橈尺關節的配合，由中間位朝旋後方向移動；實際 可用範圍會隨肘部位置、近端與遠端橈尺關節狀態及量測固定方式而變。 本條不以單一角度作能力門檻。

    '
  name_zh: 前臂旋後
  description: '前臂旋後是橈骨相對尺骨轉回平行位置的動作。手掌朝向還受到肱骨 軸向旋轉與腕部位置影響，不能用來反推前臂旋後。前臂中間位有明確 解剖定義，但在多軸關節描述「中立」時，仍必須一併指出所指的軸。

    '
  safety_note: '旋轉前臂時若出現肘、前臂、腕或手部疼痛、卡住、麻木、明顯無力或 不穩，應停止，不要以外力強行增加旋後範圍。

    '
- id: movement.action.trunk.extension
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 軀幹伸展
  aliases:
  - 脊椎伸展
  - 腰椎伸展
  - trunk extension
  joint_region: spine-neck
  definition: '軀幹伸展是脊柱在矢狀面往背側方向的旋轉，是屈曲的逆向運動。脊柱 伸展會加深頸椎與腰椎的前凸，同時減少胸椎後凸；因此同一個「伸展」 在不同節段對應相反的曲度變化，不標節段就無法驗證。

    '
  plane:
  - sagittal
  axis:
  - 各椎節的內外側軸
  observable_boundaries: '腰椎伸展若合併髖關節完全伸展，被拉長的髖屈肌與關節囊韌帶的被動張力 會對骨盆產生前傾力，進一步加深腰椎前凸。因此下肢完全拉直的姿勢會 放大腰椎伸展的效果，髖部位置與腰椎伸展不是彼此獨立的觀察項目。

    '
  general_anatomical_capacity: '腰椎在矢狀面的伸展可用範圍明顯小於屈曲，不同節段的可用範圍差異顯著。 本條不以單一角度作能力門檻。

    '
  name_zh: 軀幹伸展
  description: '軀幹伸展是脊柱在矢狀面往背側旋轉。它會加深頸椎與腰椎前凸，卻會 減少胸椎後凸，所以描述時必須標明節段。腰椎伸展若與髖完全伸展同時 出現，髖屈肌與關節囊韌帶的被動張力還會促使骨盆前傾並加深腰椎前凸。

    '
  safety_note: '調整軀幹或腰部時若出現疼痛、向肢端放射的麻木、明顯無力或不穩， 應停止，不要以外力強行增加伸展範圍。

    '
- id: movement.action.trunk.flexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 軀幹屈曲
  aliases:
  - 脊椎屈曲
  - 腰椎屈曲
  - trunk flexion
  joint_region: spine-neck
  definition: '軀幹屈曲是脊柱在矢狀面往腹側方向的旋轉。其分節段效果與伸展相反： 減少並壓平頸椎與腰椎前凸，同時加深胸椎後凸。

    '
  plane:
  - sagittal
  axis:
  - 各椎節的內外側軸
  observable_boundaries: '教學語裡的「下背貼平」「腹部收緊」「空心姿」所指的是腰椎前凸被壓平， 按解剖定義落在屈曲側，不是伸展側。使用這些外觀詞時仍須標明節段、 平面與基準，不能讓外觀詞取代關節動作命名。

    '
  general_anatomical_capacity: '腰椎屈曲的可用範圍明顯大於伸展，不同脊柱節段仍有不同的可用條件。 本條不以單一角度作能力門檻。

    '
  name_zh: 軀幹屈曲
  description: '軀幹屈曲是脊柱在矢狀面往腹側旋轉，會壓平頸椎與腰椎前凸並加深 胸椎後凸。教學語中的下背貼平、腹部收緊或空心姿，按解剖定義落在 腰椎屈曲側；描述時仍須補上節段、平面與基準。

    '
  safety_note: '調整軀幹或腰部時若出現疼痛、向肢端放射的麻木、明顯無力或不穩， 應停止，不要以外力強行壓平下背或增加屈曲範圍。

    '
- id: movement.action.shoulder-complex.horizontal-abduction
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩水平外展
  aliases:
  - 肩水平伸展
  - horizontal abduction
  - horizontal extension
  joint_region: shoulder-arm
  definition: '肩水平外展是定義在上舉一半的起始位置上的第四組盂肱關節動作，肱骨 在該高度所在的水平面內向後方移動。它與 movement.action.shoulder-complex.horizontal-adduction 互為反向， 兩者共用同一個起始位置定義。

    '
  plane:
  - transverse
  axis:
  - 通過盂肱關節的垂直軸
  observable_boundaries: '可辨識的起訖是肱骨在該水平面內由前方朝後方移動。若起始位置不在 上舉一半附近，該動作應改用外展或伸展等其他命名，不得沿用水平外展。 肩胛骨在胸廓上的後縮也會造成相同的池畔外觀，單看手的位置無法區分 盂肱關節動作與肩胛動作。

    '
  general_anatomical_capacity: '在一般解剖條件下，肱骨由上舉一半附近的起始位置向水平面後方與前方 都有可用範圍；實際可用範圍會隨肩胛位置、肱骨軸向旋轉、上舉高度、 主動或被動條件及症狀而變。本條不以單一角度作能力門檻。

    '
  name_zh: 肩水平外展
  description: '肩水平外展的名稱綁定在手臂已到上舉一半附近的起始位置，指上臂骨 在該高度的水平面內向後方移動，與肩水平內收互為反向。若起始上舉 高度不同，池畔看到手向外分開時可能要改用外展或伸展等其他名稱； 肩胛骨後縮也能造成相同外觀，因此不能只看手的位置判定。

    '
  safety_note: '手臂在水平面移動時若出現疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要以外力強行增加移動範圍。

    '
- id: movement.action.hip.adduction
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 髖內收
  aliases:
  - 髖關節內收
  - 大腿內收
  - hip adduction
  joint_region: hip-knee
  definition: '髖內收是股骨在額狀面朝向或越過身體中線的轉動，以解剖位置為中立參考。 它與髖外展共用同一條前後軸。

    '
  plane:
  - frontal
  axis:
  - 髖外展內收的前後軸
  observable_boundaries: '「雙腳靠攏」「夾腿」或「腳尖併起來」等可見現象不能直接歸給髖內收； 足部在空間中的位置是髖旋轉、髖內收、屈膝下的脛骨旋轉與骨盆位置的 合成。判定髖內收須直接量測股骨相對骨盆的內收，不得以足部間距或 腳尖距離代替。本條也讓「這個方向在此不發生」可以被明確指名；把 可見的靠攏自動歸給髖內收，正是本欄要排除的讀法。

    '
  general_anatomical_capacity: '在一般解剖條件下，由解剖位置出發的髖內收範圍會先被對側肢體阻擋， 須在髖屈曲或對側腿讓開時才看得到完整範圍；被動限制來自外展肌群與 髖外側的關節囊韌帶張力。可用範圍會隨髖屈曲角度、對側肢體位置、 骨盆固定方式、主動或被動量測及症狀而變，本條不以單一角度作能力門檻。

    '
  name_zh: 髖內收
  description: '髖內收是大腿骨在額狀面朝向或越過身體中線，與髖外展共用同一條軸。 雙腳靠攏、夾腿或腳尖併起來是髖旋轉、髖內收、屈膝下的脛骨旋轉與 骨盆位置的合成，不能自動歸給髖內收。判定時要看大腿骨相對骨盆的 位置，不能用足部間距或腳尖距離代替。

    '
  safety_note: '大腿向內靠攏時若出現髖部、鼠蹊或腰背疼痛、卡住、麻木、明顯無力 或不穩，應停止，不要強行增加髖內收範圍。

    '
- id: movement.action.hip.internal-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 髖內旋
  aliases:
  - 髖關節內旋
  - 股骨內旋
  - hip internal rotation
  joint_region: hip-knee
  definition: '髖內旋是股骨相對骨盆繞自身縱軸向內轉動的水平面動作，旋轉軸由 股骨頭中心連到膝關節中心。

    '
  plane:
  - transverse
  axis:
  - 股骨頭中心到膝關節中心的縱軸
  observable_boundaries: '髖旋轉的縱軸是股骨頭中心到膝關節中心的連線；由於股骨頸傾斜角與 股骨幹前弓，這條軸大部分落在股骨本體之外，沒有任何體表可見標記 直接對應它。小腿與腳跟的位置另外受膝關節軸向旋轉影響，而膝在部分 屈曲時軸向旋轉最自由，因此同一個腳跟位置可由髖旋轉、膝旋轉或兩者 的任意組合達成。可用的判定方式是直接量測股骨繞其縱軸的旋轉，例如 追蹤大腿標記點或影像，或以標準體位徒手測角；不得以腳跟、小腿或 足部朝向反推髖內旋。

    '
  general_anatomical_capacity: '在一般解剖條件下，股骨可相對骨盆繞縱軸向內旋轉；限制源同時包含 骨性成分與軟組織成分。骨性成分包括股骨頸的前傾角，屬個體固定條件； 軟組織成分包括周邊關節囊與肌肉張力。兩者性質不同，應分開判斷。 可用範圍會隨髖屈曲角度、骨盆固定方式、主動或被動量測及症狀而變， 本條不以單一角度作能力門檻。

    '
  name_zh: 髖內旋
  description: '髖內旋是大腿骨繞著由股骨頭中心連到膝關節中心的縱軸向內轉。這條 軸大部分不在股骨本體內，也沒有直接對應的體表標記；小腿、腳跟與 足部朝向又會受到膝軸向旋轉影響。因此相同的腳跟位置可能來自髖、 膝或兩者的組合，不能由遠端外觀反推髖內旋。髖內旋的可用範圍同時 受股骨頸前傾角及周邊關節囊與肌肉張力影響。

    '
  safety_note: '旋轉大腿時若出現髖部、鼠蹊、膝部或腰背疼痛、卡住、麻木、明顯 無力或不穩，應停止，不要從足部施力強行增加髖內旋。

    '
