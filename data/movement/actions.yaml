  name: 腕伸展
  aliases:
  - 伸腕
  - 手腕伸展
  - wrist extension
  joint_region: shoulder-arm
  definition: '腕伸展是手相對前臂向背側轉動的矢狀面動作，由橈腕關節與腕中關節的 動作共同合成，並非單一關節的轉動。橈偏與尺偏是額狀面的另一組動作， 不屬於腕伸展；手同時往背側與橈側或尺側移動時，是不同動作層的合成， 描述與量測時必須分別指明。

    '
  plane:
  - sagittal
  axis:
  - 腕屈伸的內外側軸
  observable_boundaries: '起點為解剖零位，即手與前臂長軸對齊；終點為個體可達的最大主動或被動 腕伸展角度，會受活動度與疼痛影響。外部觀察與單一視角影片只能看到手 相對前臂的合成動作，無法拆分橈腕關節與腕中關節各自的貢獻；若同時伴隨 橈偏或尺偏，也不能把整段軌跡都記作腕伸展。

    '
  general_anatomical_capacity: '在一般解剖條件下，腕可由解剖零位向背側完成主動與被動伸展。實際可用 範圍會隨個體活動度、量測方式與症狀而變，本條不採用任何單一角度作為 能力門檻，也不由一般解剖容量推論特定泳姿的腕部位置。

    '
  name_zh: 腕伸展
  description: '腕伸展就是手相對前臂往手背側彎。這個外觀看似簡單的動作，其實由 橈腕關節與腕中關節共同完成；肉眼或單一角度的影片看不出兩個關節各自 動了多少。手若同時往橈側或尺側偏移，還混入了額狀面的另一組動作， 因此描述或量測時要分清楚是在看背側伸展，還是在看多個方向的合成軌跡。

    '
  safety_note: '腕部伸展時若出現疼痛、麻木、刺痛或明顯不穩，應立即停止，不要強行 壓到更大的末端角度。

    '
- id: movement.action.hip.flexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 髖屈曲
  aliases:
  - 屈髖
  - 髖關節屈曲
  - hip flexion
  joint_region: hip-knee
  definition: '髖屈曲是股骨相對骨盆朝前方轉動的矢狀面動作，使大腿前側朝軀幹靠近。 股骨固定時，骨盆相對股骨的前向轉動也會改變相同的外觀夾角，但移動的 節段與量測基準不同，描述時不能把兩者直接視為同一動作。

    '
  plane:
  - sagittal
  axis:
  - 髖屈伸的內外側軸
  observable_boundaries: '起點為股骨與骨盆處於解剖中立對齊，終點為個體可達的最大主動或被動 髖屈曲位置。從體表看到大腿與軀幹靠近時，可能同時包含股骨相對骨盆的 髖屈曲、骨盆前傾與軀幹姿勢變化；單一視角無法拆分各節段的貢獻。

    '
  general_anatomical_capacity: '在一般解剖條件下，髖可由中立位置向前完成主動與被動屈曲。實際可用 範圍會隨骨盆固定方式、膝部位置、主動或被動量測及症狀而變，本條不以 單一角度作能力門檻，也不由一般解剖容量推論特定泳姿的髖部位置。

    '
  name_zh: 髖屈曲
  description: '髖屈曲就是大腿相對骨盆往前抬。體表看到大腿靠近軀幹時，骨盆前傾 也可能造成相似外觀，因此肉眼或單一角度的影片無法分清各節段分別 移動了多少。描述這個動作時，需要說清楚是在看大腿相對骨盆移動， 還是在看骨盆與軀幹一起改變位置。

    '
  safety_note: '抬腿或屈髖時若出現髖部或鼠蹊疼痛、麻木、明顯無力或不穩，應立即 停止，不要強行壓向更深的位置。

    '
- id: movement.action.knee.extension
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 膝伸展
  aliases:
  - 伸膝
  - 膝關節伸展
  - knee extension
  joint_region: hip-knee
  definition: '膝伸展是脛骨相對股骨由屈曲位置朝較直方向轉動的矢狀面動作。承重時 也可由股骨相對固定脛骨移動而形成膝伸展；兩種情況的移動節段不同， 描述與量測時需明確指出採用哪一個節段作為基準。

    '
  plane:
  - sagittal
  axis:
  - 膝屈伸的內外側軸
  observable_boundaries: '起點為當下的屈膝位置，終點為個體可達的最大主動或被動伸膝位置。 膝在屈曲位置時，脛骨也可相對股骨發生軸向旋轉；單一視角只能看到 小腿的合成路徑，無法把矢狀面的伸展與伴隨旋轉各自拆分。

    '
  general_anatomical_capacity: '在一般解剖條件下，膝可由屈曲位置主動或被動朝伸展方向移動。實際 可用範圍會隨起始屈曲位置、髖與踝的位置、承重條件及症狀而變，本條 不以單一角度作能力門檻，也不由一般解剖容量推論特定泳姿的膝部時序。

    '
  name_zh: 膝伸展
  description: '膝伸展就是膝蓋由彎曲朝較直的方向移動。屈膝時，小腿還可能伴隨 旋轉，所以肉眼或單一角度的影片看到的是合成路徑，不能只憑外觀 分出伸展與旋轉各占多少。描述時也要說清楚是在看小腿相對大腿移動， 還是在承重下看大腿相對小腿移動。

    '
  safety_note: '伸膝時若出現膝部疼痛、卡住、麻木、明顯無力或不穩，應立即停止， 不要強行推向更直的位置。

    '
- id: movement.action.trunk.axial-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 軀幹軸向旋轉
  aliases:
  - 軀幹旋轉
  - 上軀幹旋轉
  - trunk axial rotation
  joint_region: spine-neck
  definition: '軀幹軸向旋轉是軀幹節段繞身體長軸的橫切面轉動。它與「各脊椎節段旋轉 角度的總和」不是同一個量：前者描述軀幹作為一個節段相對參考軸的方位， 後者需要逐節段量測才能得到。體表看到的肩線或髖線夾角是這個轉動的 替代指標，不是轉動本身。

    '
  plane:
  - transverse
  axis:
  - 身體長軸
  observable_boundaries: '起點為軀幹與參考軸對齊的中立方位，終點為個體可達的最大主動或被動 旋轉方位。由體表標記算出的肩線或髖線角度同時包含胸椎與腰椎各節段 旋轉、骨盆轉動與肩帶相對胸廓的移動；單一視角或單一線段無法拆分各 節段的貢獻，也無法區分軀幹主動轉動與整體滾轉造成的方位改變。

    '
  general_anatomical_capacity: '在一般解剖條件下，軀幹可繞身體長軸向兩側主動與被動旋轉，胸椎與腰椎 的可用範圍分布不同。實際可用範圍會隨骨盆固定方式、起始姿勢、主動或 被動量測及症狀而變，本條不以單一角度作能力門檻，也不由一般解剖容量 推論任何泳姿的滾轉幅度或時機。

    '
  name_zh: 軀幹軸向旋轉
  description: '軀幹軸向旋轉就是上半身繞著身體的長軸轉。從外面看到的肩線或髖線 轉了多少，是這個動作的替代看法，不是動作本身——因為那條線同時 受到胸椎、腰椎、骨盆與肩帶位置影響。描述時要說清楚是在看整段 軀幹的方位，還是在看某一段脊椎轉了多少。

    '
  safety_note: '轉動軀幹時若出現背部、腰部或頸部疼痛、麻木、下肢放射症狀、明顯 無力或不穩，應立即停止，不要強行加大旋轉幅度。

    '
- id: movement.action.shoulder-complex.extension
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩伸展
  aliases:
  - 肩關節伸展
  - 肱骨伸展
  - shoulder extension
  joint_region: shoulder-arm
  definition: '肩伸展是肱骨相對軀幹由解剖位置往後旋轉的矢狀面動作。解剖位置是 命名的共同參考，動作名稱取決於肱骨相對軀幹的旋轉方向，不取決於 身體在環境中的朝向或手臂在池畔畫面中的移動方向。

    '
  plane:
  - sagittal
  axis:
  - 內外側軸（通過肱骨頭）
  observable_boundaries: '肩伸展描述肱骨相對軀幹的矢狀面位置，以解剖位置為 0° 參考；身體在 空間中的朝向，不論俯臥或仰躺，都不改變這個命名。仰躺時手臂移向 髖部側後方仍是肩伸展。觀察時須直接比較肱骨與軀幹，不能只依手部 相對水面或池底的路徑命名。

    '
  general_anatomical_capacity: '在一般解剖條件下，肱骨可由解剖位置或前方位置相對軀幹朝後方伸展。 實際可用範圍會隨肩胛骨位置、胸廓姿勢、肱骨旋轉、主動或被動條件 及症狀而變，本條不以單一角度作能力門檻，也不由一般解剖容量推論 特定泳姿的動作幅度或時機。

    '
  name_zh: 肩伸展
  description: '肩伸展是上臂相對軀幹往後移動。名稱看的是上臂與軀幹的關係，不是 身體面朝哪裡；即使仰躺在水中，手臂往髖部側後方移動仍稱為肩伸展。 手在畫面中往水面或池底移動，不能單獨決定肩部動作名稱。

    '
  safety_note: '手臂往後移動時若出現肩部疼痛、夾擠感、麻木、明顯無力或不穩， 應停止，不要強行加大範圍。

    '
- id: movement.action.shoulder-complex.internal-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩內旋
  aliases:
  - 肩關節內旋
  - 肱骨內旋
  - shoulder internal rotation
  joint_region: shoulder-arm
  definition: '肩內旋是肱骨在橫切面內繞自身長軸向內旋轉。前臂旋前或旋後與肱骨 內旋或外旋都可能造成相同的手掌朝向外觀，因此不能由手掌朝向反推 是哪一段在轉；要判定肱骨軸向旋轉必須直接觀察肱骨相對肩胛與軀幹 的方位，不能只看手掌。

    '
  plane:
  - transverse
  axis:
  - 肱骨長軸
  observable_boundaries: '起點為已明確記錄的肱骨旋轉位置，終點為肱骨繞長軸朝內旋方向可達的 主動或被動位置。肘部姿勢、前臂旋轉與腕手位置都會改變遠端外觀； 只有追蹤肱骨本身，才能把肩內旋與前臂旋轉區分開來。

    '
  general_anatomical_capacity: '在一般解剖條件下，盂肱關節可繞肱骨長軸向內旋轉；內旋與外旋的可用 範圍並不必然對稱，個體差異也大。實際可用範圍會隨肩上舉平面、肩胛 固定方式、起始位置、主動或被動條件及症狀而變，本條不以單一角度 作能力門檻，也不推論特定泳姿中的旋轉時序。

    '
  name_zh: 肩內旋
  description: '肩內旋是上臂骨繞自身長軸向內轉。手掌轉向可能來自上臂旋轉、前臂 旋轉，或兩者合成，所以只看手掌不能判定肩膀是否內旋；需要看上臂骨 相對肩帶與軀幹的方向。

    '
  safety_note: '旋轉上臂時若出現肩部疼痛、夾擠感、麻木、明顯無力或不穩，應停止， 不要以扭轉前臂或手腕代償並強行增加範圍。

    '
- id: movement.action.elbow.flexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肘屈曲
  aliases:
  - 屈肘
  - 肘關節屈曲
  - elbow flexion
  joint_region: shoulder-arm
  definition: '肘屈曲是前臂相對上臂在矢狀面朝彎曲方向轉動，使前臂與上臂的夾角 減小。動作主要繞通過肱骨滑車與小頭的內外側軸發生；前臂旋前或旋後 是另一個軸向動作，不能由手掌朝向替代肘屈曲的命名。

    '
  plane:
  - sagittal
  axis:
  - 通過肱骨滑車與小頭的內外側軸
  observable_boundaries: '起點為當下的肘伸屈位置，終點為個體可達的最大主動或被動屈肘位置。 觀察時須比較前臂與上臂，並另外記錄前臂旋轉與肩部位置；手在空間中 的曲線路徑是多個關節合成，不能單獨證明肘屈曲幅度。

    '
  general_anatomical_capacity: '在一般解剖條件下，肘可由較直位置朝屈曲方向主動或被動移動。實際 可用範圍會隨前臂旋轉、肩部位置、軟組織接觸、主動或被動條件及症狀 而變，本條不以單一角度作能力門檻，也不由一般解剖容量推論特定泳姿 的肘部構型。

    '
  name_zh: 肘屈曲
  description: '肘屈曲就是前臂相對上臂朝彎曲方向移動。手掌朝哪裡屬於前臂旋轉與 整條上肢方位的結果，不等於肘屈曲；手在畫面中的路徑也可能同時受到 肩部與前臂動作影響。

    '
  safety_note: '彎肘時若出現肘部疼痛、卡住、麻木、明顯無力或不穩，應停止，不要 強行壓入更深的屈曲位置。

    '
- id: movement.action.elbow.extension
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肘伸展
  aliases:
  - 伸肘
  - 肘關節伸展
  - elbow extension
  joint_region: shoulder-arm
  definition: '肘伸展是前臂相對上臂在矢狀面由屈曲位置朝較直方向轉動，使前臂與 上臂的夾角增大。動作主要繞通過肱骨滑車與小頭的內外側軸發生；接近 完全伸展描述的是方向與位置，不表示必須撞上終末骨性止點。

    '
  plane:
  - sagittal
  axis:
  - 通過肱骨滑車與小頭的內外側軸
  observable_boundaries: '起點為當下的屈肘位置，終點為個體可達的最大主動或被動伸肘位置。 肘的正常終末可受鷹嘴進入鷹嘴窩的骨性接觸與軟組織張力限制，並不是 需要主動追求的「鎖定」；觀察時也須把前臂旋轉與肩部動作另行區分。

    '
  general_anatomical_capacity: '在一般解剖條件下，肘可由屈曲位置朝伸展方向主動或被動移動。實際 可用範圍會隨起始屈曲位置、前臂旋轉、肩部位置、主動或被動條件及 症狀而變，本條不以單一角度作能力門檻，也不要求任何動作抵達終末 骨性止點。

    '
  name_zh: 肘伸展
  description: '肘伸展就是前臂相對上臂由彎曲朝較直方向移動。「接近完全伸展」不等於 必須把肘鎖死；肘部的正常終末有骨性與軟組織限制，不應把碰到止點當成 動作品質的必要條件。

    '
  safety_note: '伸肘時若出現肘部疼痛、卡住、麻木、明顯無力或不穩，應停止，不要 強行壓向終末位置或反覆撞擊止點。

    '
- id: movement.action.hip.extension
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 髖伸展
  aliases:
  - 伸髖
  - 髖關節伸展
  - hip extension
  joint_region: hip-knee
  definition: '髖屈曲與伸展一律依股骨相對骨盆在矢狀面的旋轉方向命名，不隨身體 仰躺或俯臥而翻轉；股骨相對骨盆朝後旋轉即為髖伸展。在本圖譜的池畔 用語中，仰式「上踢」對應髖屈曲、「下踢」對應髖伸展，與自由式相反； 這表示同一組池畔方向詞在兩種身體朝向下對應到相反的關節動作。

    '
  plane:
  - sagittal
  axis:
  - 通過股骨頭的內外側軸
  observable_boundaries: '起點為已明確記錄的股骨相對骨盆位置，終點為股骨朝後方可達的主動或 被動位置。觀察時須追蹤股骨與骨盆的相對旋轉；足部朝水面或池底移動 是池畔空間方向，還混合膝與踝動作，不能單獨決定髖伸展的命名。

    '
  general_anatomical_capacity: '在一般解剖條件下，股骨可相對骨盆朝伸展方向主動或被動移動。實際 可用範圍會隨骨盆與腰椎位置、膝部姿勢、股骨旋轉、主動或被動條件 及症狀而變，本條不以單一角度作能力門檻，也不由池畔方向推論髖部 動作幅度或時序。

    '
  name_zh: 髖伸展
  description: '髖伸展是大腿骨相對骨盆往後轉，名稱不會因為身體仰躺或俯臥而改變。 仰式池畔所說的下踢對應髖伸展，上踢則對應髖屈曲；自由式的對應正好 相反，所以不能只照「上、下」字面選擇關節動作。

    '
  safety_note: '大腿往後移動時若出現髖部、鼠蹊或腰背疼痛、麻木、明顯無力或不穩， 應停止，不要用骨盆前傾或腰椎過度伸展強行增加路徑。

    '
- id: movement.action.shoulder-complex.external-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩外旋
  aliases:
  - 肩關節外旋
  - 肱骨外旋
  - shoulder external rotation
  joint_region: shoulder-arm
  definition: '從解剖位置起算，肩外旋是肱骨繞其縱軸向外側轉動的水平面動作。

    '
  plane:
  - transverse
  axis:
  - 肱骨縱軸
  observable_boundaries: '肩外旋的可用範圍會隨起始上舉角度改變；由內收位起算與由外展位起算 不是同一個可用範圍。解剖來源指出，肩在往外展方向上舉的過程中， 肱骨會自然伴隨外旋，讓肱骨大結節從肩峰後方通過並避開肩峰下空間。 因此外旋常常不是獨立選擇的動作，而是上舉的必然伴隨成分。

    '
  general_anatomical_capacity: '在一般解剖條件下，肱骨可繞其縱軸向外旋轉，也可在肩部上舉時以外旋 作為伴隨成分。實際可用範圍會隨起始上舉角度、上舉平面、肩胛固定方式、 主動或被動條件及症狀而變，本條不以單一角度作能力門檻。

    '
  name_zh: 肩外旋
  description: '肩外旋是上臂骨繞自身縱軸向外轉。它的可用範圍會隨手臂起始上舉位置 改變，由手臂靠近身側與由手臂已經外展的位置起算，不能直接當成同一 條件比較。解剖來源指出，手臂往外展方向上舉時會自然伴隨外旋，讓 肱骨大結節從肩峰後方通過，因此外旋也是上舉的必然伴隨成分。

    '
  safety_note: '旋轉或上舉手臂時若出現肩部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要強行增加外旋或上舉範圍。

    '
- id: movement.action.shoulder-complex.horizontal-adduction
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩水平內收
  aliases:
  - 水平內收
  - 水平屈曲
  - shoulder horizontal adduction
  joint_region: shoulder-arm
  definition: '肩水平內收以手臂外展接近直角的位置為起始參考，肱骨繞通過盂肱關節 的垂直軸向前、朝身體中線移動，是水平面內的動作。

    '
  plane:
  - transverse
  axis:
  - 通過盂肱關節的垂直軸
  observable_boundaries: '肩水平內收與額狀面的內收是兩個使用不同起始基準的名稱。手臂位於體前、 上舉接近直角時朝中線移動，正確名稱是水平內收；用額狀面內收承載一個 實際在水平面進行的動作，會讓後續活動度比較與陸上輔助動作選擇對到 錯的方向。觀察時須先記錄起始上舉角度與肱骨相對軀幹的移動平面。

    '
  general_anatomical_capacity: '在一般解剖條件下，肱骨可由外展接近直角的位置在水平面朝體前與中線 移動。實際可用範圍會隨肩胛位置、肱骨軸向旋轉、上舉角度、主動或 被動條件及症狀而變，本條不以單一角度作能力門檻。

    '
  name_zh: 肩水平內收
  description: '肩水平內收是手臂已上舉到接近直角時，上臂骨在水平面朝體前與中線 移動。它和手臂由身側朝軀幹靠近的額狀面內收使用不同起始基準；若把 兩者混稱，活動度比較與陸上輔助動作就可能對到不同平面的方向。

    '
  safety_note: '手臂朝體前或中線移動時若出現肩部疼痛、卡住、麻木、明顯無力或 不穩，應停止，不要強行增加水平內收範圍。

    '
- id: movement.action.hip.abduction
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 髖外展
  aliases:
  - 髖關節外展
  - 大腿外展
  - hip abduction
  joint_region: hip-knee
  definition: '髖外展是股骨在額狀面遠離身體中線的轉動，以解剖位置為中立參考。

    '
  plane:
  - frontal
  axis:
  - 髖外展內收的前後軸
  observable_boundaries: '「大腿分開」這個可見現象的正確歸屬欄位就是髖外展。觀察時仍須比較 股骨與骨盆的相對位置，因為骨盆側傾或軀幹移動也會改變大腿相對身體 中線的外觀，不能只以足部間距替代髖部局部動作。

    '
  general_anatomical_capacity: '在一般解剖條件下，髖可由中立位置朝外展方向移動；可用範圍主要受 恥股韌帶與內收肌群的被動張力限制。因此髖外展做不出來時，限制源 偏向結構性被動張力，與感知或控制問題屬不同性質， 本條不以單一角度作能力門檻。

    '
  name_zh: 髖外展
  description: '髖外展是大腿骨在額狀面遠離身體中線；「大腿分開」應記在這個欄位。 它不等於髖旋轉，足部或腳跟的位置也不能取代大腿骨相對骨盆的量測。 一般解剖條件下，可用範圍主要受恥股韌帶與內收肌群的被動張力限制。

    '
  safety_note: '大腿向外分開時若出現髖部、鼠蹊或腰背疼痛、卡住、麻木、明顯無力 或不穩，應停止，不要強行增加外展範圍。

    '
- id: movement.action.hip.external-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 髖外旋
  aliases:
  - 髖關節外旋
  - 股骨外旋
  - hip external rotation
  joint_region: hip-knee
  definition: '髖外旋是股骨相對骨盆繞自身縱軸向外轉動的水平面動作，旋轉軸由 股骨頭中心連到膝關節中心。

    '
  plane:
  - transverse
  axis:
  - 股骨頭中心到膝關節中心的縱軸
  observable_boundaries: '髖旋轉的縱軸是股骨頭中心到膝關節中心的連線；由於股骨頸傾斜角與 股骨幹前弓，這條軸大部分落在股骨本體之外，沒有任何體表可見標記 直接對應它。小腿與腳跟的位置另外受膝關節軸向旋轉影響，而膝在部分 屈曲時軸向旋轉最自由，因此同一個腳跟位置可由髖旋轉、膝旋轉或兩者 的任意組合達成。可用的判定方式是直接量測股骨繞其縱軸的旋轉，例如 追蹤大腿標記點或影像，或以標準體位徒手測角；不得以腳跟、小腿或 大腿分開的程度反推髖旋轉。

    '
  general_anatomical_capacity: '在一般解剖條件下，股骨可相對骨盆繞縱軸向外旋轉；力學條件與可用 範圍會隨髖屈曲角度、骨盆固定方式、主動或被動量測及症狀而變。 遠端足部方位不能代表股骨的實際旋轉量，本條不以單一角度作能力門檻。

    '
  name_zh: 髖外旋
  description: '髖外旋是大腿骨繞著由股骨頭中心連到膝關節中心的縱軸向外轉。這條 軸大部分不在股骨本體內，也沒有直接對應的體表標記；小腿與腳跟又 會受到膝軸向旋轉影響。因此相同的腳跟位置可能來自髖、膝或兩者的 組合，不能用腳跟、小腿或大腿分開程度反推髖外旋。

    '
  safety_note: '旋轉大腿時若出現髖部、鼠蹊、膝部或腰背疼痛、卡住、麻木、明顯 無力或不穩，應停止，不要從足部施力強行增加髖外旋。

    '
- id: movement.action.knee.flexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 膝屈曲
  aliases:
  - 屈膝
  - 膝關節屈曲
  - knee flexion
  joint_region: hip-knee
  definition: '膝屈曲是脛骨與股骨在矢狀面朝夾角減小方向的相對轉動，使小腿朝 大腿後側靠近。

    '
  plane:
  - sagittal
  axis:
  - 膝屈伸的內外側軸
  observable_boundaries: '「腳跟朝臀部靠近」就是膝屈曲角度增加的直接定義，與股骨的軸向旋轉 無關。非承重時主要描述脛骨相對股骨移動，承重時則可能是股骨相對 脛骨移動；兩者移動的節段不同，描述與比較時必須指明基準。

    '
  general_anatomical_capacity: '在一般解剖條件下，膝可由較直位置朝屈曲方向主動或被動移動。實際 可用範圍會隨髖部位置、承重條件、軟組織接觸、主動或被動量測及症狀 而變，本條不以單一角度作能力門檻。

    '
  name_zh: 膝屈曲
  description: '膝屈曲是小腿與大腿朝夾角減小方向移動；腳跟朝臀部靠近就是膝屈曲 增加的直接表現，與大腿骨的軸向旋轉無關。非承重時通常是小腿相對 大腿移動，承重時可能改由大腿相對小腿移動，描述時要說清楚基準。

    '
  safety_note: '屈膝時若出現膝部、腿後側或髖部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要強行把腳跟壓向臀部。

    '
- id: movement.action.knee.axial-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 膝軸向旋轉
  aliases:
  - 膝關節旋轉
  - 脛骨旋轉
  - knee axial rotation
  joint_region: hip-knee
  definition: '膝軸向旋轉是脛骨相對股骨繞縱軸的旋轉，也是膝關節在矢狀面屈伸之外 的第二個自由度。命名依脛骨粗隆相對股骨遠端前面的位置決定；脛骨粗隆 移向外側稱為外旋。

    '
  plane:
  - transverse
  axis:
  - 膝關節的縱軸
  observable_boundaries: '這個自由度只在膝至少些微屈曲時存在，接近完全伸展時被鎖定，部分屈曲 時最自由。因此在深屈膝情境下，它是小腿與足朝外轉的一個獨立且不可 忽略的貢獻源；觀察時仍須以脛骨相對股骨的方位命名，不能用足部朝向 取代膝部局部旋轉。

    '
  general_anatomical_capacity: '在一般解剖條件下，膝屈曲後可容許脛骨相對股骨向內或向外軸向旋轉， 而接近完全伸展時此自由度受關節鎖定限制。實際可用範圍會隨屈膝位置、 承重條件、主動或被動量測及症狀而變，本條不以單一角度作能力門檻。

    '
  name_zh: 膝軸向旋轉
  description: '膝除了屈伸，屈曲後還能讓小腿骨相對大腿骨繞縱軸旋轉；脛骨粗隆移向 外側稱為外旋。這個自由度在膝接近完全伸展時被鎖定，在部分屈曲時 最自由，所以深屈膝時小腿與足朝外轉可能有獨立的膝旋轉貢獻。

    '
  safety_note: '屈膝並旋轉小腿時若出現膝部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要從足部施力強行扭轉膝部。

    '
- id: movement.action.ankle-foot.dorsiflexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 踝背屈
  aliases:
  - 背屈
  - 踝關節背屈
  - 勾腳
  - ankle dorsiflexion
  joint_region: ankle-foot
  definition: '踝背屈是足相對小腿在矢狀面朝小腿前側靠近的動作，發生在距小腿關節； 中立位定義為足與小腿成直角。

    '
  plane:
  - sagittal
  axis:
  - 距小腿關節的內外側軸
  observable_boundaries: '背屈的關節歸屬明確：距小腿關節只有一個主要自由度，背屈與蹠屈就是 這個自由度，這是它與外翻最重要的分界。背屈的可用範圍明顯小於蹠屈。 背屈可用量也受膝角度影響，因為跨過膝與踝的雙關節肌在屈膝時被縮短； 所以屈膝時的背屈與伸膝時的背屈不是同一量測條件，比較前須指明膝角度。

    '
  general_anatomical_capacity: '在一般解剖條件下，距小腿關節可讓足由中立位朝小腿前側背屈，但可用 範圍明顯小於蹠屈，並會隨膝部位置、主動或被動量測及症狀而變。 不同膝角度下的背屈量不可直接互相比較，本條不以單一角度作能力門檻。

    '
  name_zh: 踝背屈
  description: '踝背屈是足在距小腿關節朝小腿前側靠近。距小腿關節的主要自由度是 背屈與蹠屈，外翻則屬於下方的距下與橫跗關節。背屈可用範圍明顯小於 蹠屈，且會隨膝部屈伸位置改變，屈膝與伸膝條件下的結果不能直接相比。

    '
  safety_note: '勾腳或量測背屈時若出現踝部、小腿或足部疼痛、卡住、麻木、明顯無力 或不穩，應停止，不要強行增加背屈範圍。

    '
- id: movement.action.ankle-foot.pronation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  - src.nordin-frankel-2012
  name: 距下／橫跗關節旋前
  aliases:
  - 旋前
  - 足旋前
  - subtalar pronation
  - foot pronation
  joint_region: ankle-foot
  definition: '旋前是單軸三平面運動，主成分為外翻與外展，並含背屈成分；它發生在 距下關節與橫跗關節，而不是距小腿關節。

    '
  plane:
  - oblique
  axis:
  - 距下關節斜軸
  - 橫跗關節縱軸與斜軸
  observable_boundaries: '兩本解剖來源一致指出，外翻不發生在距小腿關節。距小腿關節只有背屈 與蹠屈一個主要自由度；外翻是繞前後軸的額狀面動作，發生在距下關節 與橫跗關節，把它寫成「踝關節外翻」是單一關節誤稱。旋前的三個成分 不可分離，其中任一成分存在，就代表另兩個成分也正在發生；同一相位 把背屈與外翻寫成兩個獨立動作，可能其實是同一個旋前動作的兩個成分 被拆成兩格。主動外翻的可用範圍很小，外踝下伸與較厚的三角韌帶會自然 限制它，所以它不足以單獨造成腳掌明顯朝向外側；腳掌方位的主要來源 在更近端的髖與膝關節。

    '
  general_anatomical_capacity: '在一般解剖條件下，距下與橫跗關節可繞各自斜軸產生包含外翻、外展與 背屈的旋前。主動外翻可用範圍很小，並受外踝下伸與三角韌帶限制； 實際合成範圍會隨起始足位、承重條件與症狀而變， 本條不以單一角度作能力門檻。

    '
  name_zh: 距下／橫跗關節旋前
  description: '足旋前是外翻、外展與背屈不可分離的三平面組合，發生在距下與橫跗 關節。距小腿關節只承擔背屈與蹠屈，把外翻寫成踝關節的單一動作會 誤指關節。主動外翻可用幅度很小，不能單獨讓腳掌明顯朝外；腳掌 方位還需要分開考慮更近端的髖與膝關節。

    '
  safety_note: '轉動足部時若出現踝部或足部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要以外力強行增加旋前或外翻範圍。

    '
- id: movement.action.shoulder-complex.adduction
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩內收
  aliases:
  - 肩關節內收
  - 肱骨內收
  - shoulder adduction
  joint_region: shoulder-arm
  definition: '肩內收是肱骨在接近額狀面內朝身體中線方向的轉動，繞一條接近前後 方向的軸，並以解剖位置為零度中立參考。

    '
  plane:
  - frontal
  axis:
  - 肩外展內收的前後軸
  observable_boundaries: '額狀面內收與水平內收是使用不同基準的兩個動作名稱，既不是同義詞， 也不是彼此的粗細粒度。水平內收由手臂外展接近直角的位置起算，肱骨 繞垂直軸向前移動；額狀面內收則以解剖位置為零度，肱骨在接近額狀面 內朝中線移動。實際發生在體前偏下的朝中線移動，通常同時含有這兩個 成分；兩者可以並存且不互相取代，因此應分別列出。若用單一名稱承載 雙軸動作，後續的活動度比較與陸上輔助動作會對到錯誤的平面。

    '
  general_anatomical_capacity: '可用範圍受起始上舉角度、軀幹阻擋與軟組織張力共同影響；肱骨越過 身體中線的可能性取決於同時發生的屈伸與旋轉成分。本條不以單一角度 作能力門檻。

    '
  name_zh: 肩內收
  description: '肩內收是肱骨在接近額狀面內朝身體中線移動。它與水平內收使用不同 的起始基準和旋轉軸，兩者不是同義詞。手臂在體前偏下朝中線移動時， 可能同時含有額狀面內收與水平內收，因此描述時應分別記錄，不能用 單一名稱代替兩個成分。

    '
  safety_note: '手臂朝中線移動時若出現肩部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要強行增加內收範圍。

    '
- id: movement.action.shoulder-complex.scapular-protraction
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩胛前伸
  aliases:
  - 肩胛骨前伸
  - 肩胛前突
  - 肩胛外展
  - scapular protraction
  joint_region: shoulder-arm
  definition: '肩胛前伸是肩胛骨沿胸廓表面朝遠離脊椎的方向移動，屬於肩胛胸廓關節的 動作，方向與後縮相反，常出現在把手臂往前送或往前推的動作情境。

    '
  plane:
  - frontal
  axis:
  - 肩胛骨沿胸廓表面的內外側平移
  observable_boundaries: '肩胛胸廓關節有三組互相獨立的動作軸：上提與下壓、前伸與後縮、上迴旋 與下迴旋。三組可以同時發生，只描述其中一軸不代表另外兩軸處於中立； 一份只寫前伸的紀錄，正確讀法是前伸這一軸被記錄，而不是另兩軸沒有 移動。肩胛骨同時是肱骨的活動平台，並非獨立於肱骨的動作；肩胛位置會 決定關節盂朝向，因此同一個肱骨動作在不同肩胛位置下，關節內的相對 位置並不相同。描述肩胛動作時必須指明當時的肱骨上舉狀態。 手臂已上舉到頭頂時再把肩往前送，記錄的是本條加上肩胛上迴旋，不是 盂肱關節的伸展或過度伸展——後者指的是手臂往身體背側去，方向相反。

    '
  general_anatomical_capacity: '可用範圍受胸廓形狀、後縮方向軟組織張力與當時的肱骨上舉角度共同限制。 本條不以單一角度作能力門檻。

    '
  name_zh: 肩胛前伸
  description: '肩胛前伸是肩胛骨沿胸廓表面朝遠離脊椎的方向移動。肩胛胸廓關節的 上提下壓、前伸後縮與上迴旋下迴旋是三組可同時發生的獨立動作軸； 只記前伸，不表示另外兩軸處於中立。肩胛骨也是肱骨的活動平台， 描述前伸時還要一併記錄當時的肱骨上舉狀態。手臂舉過頭後再把肩 往前送，屬於本條與肩胛上迴旋，不是肩關節往後方的伸展。

    '
  safety_note: '移動肩胛或手臂時若出現肩部、肩胛周圍疼痛、卡住、麻木、明顯無力 或不穩，應停止，不要強行增加肩胛前伸範圍。

    '
