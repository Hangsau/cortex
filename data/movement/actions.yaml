domain: movement
sub: actions
description: 關節／節段動作定義、平面與軸、可觀察邊界、一般解剖能力
actions:
- id: movement.action.shoulder-complex.elevation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  - src.ludewig-2009
  - src.fernandez-matias-2025
  - src.aliaj-2021
  name: 肩複合體上舉
  aliases:
  - 肩上舉
  - 手臂上舉
  - shoulder elevation
  - arm elevation
  joint_region: shoulder-arm
  definition: '肩複合體上舉是上肢在矢狀面、冠狀面或肩胛面向上抬起的複合動作， 同時涉及盂肱關節（GHJ）的肱骨相對關節盂上轉，以及肩胸關節（STJ） 的肩胛骨在胸廓上的上旋。兩個關節的動作並非恆定比例的固定配合， 個體差異與平面差異均已被記錄。

    '
  plane:
  - sagittal
  - coronal
  - scapular
  axis:
  - 矢狀面：冠狀軸
  - 冠狀面：矢狀軸
  - 肩胛面：肩胛面垂直軸
  observable_boundaries: '起點為解剖零位（手臂自然垂放於側）；終點為最大主動或被動上舉角度， 受個體關節活動度、肌肉柔韌性與疼痛影響。觀察時僅能從外部看到整體 上舉角度，無法直接區分盂肱與肩胸貢獻。

    '
  general_anatomical_capacity: '肩複合體在解剖正常條件下可在多個平面完成完整或接近完整的上舉。 盂肱關節貢獻上舉弧度的大部分，肩胛骨同步上旋使關節盂面朝向肱骨頭， 維持關節接觸面。兩關節的協調比例存在個體差異與平面差異，教學上常用的 「盂肱 120°、肩胛 60°」是近似值，不是固定比例。 真實盂肱軸向旋轉量無法以手掌方向或 Euler 表觀角度可靠反推。

    '
  name_zh: 肩複合體上舉
  description: '手臂向上抬起時，肩膀不是只有一個關節在動——盂肱關節（上臂骨在肩窩內 轉動）與肩胸關節（肩胛骨在背部滑動上旋）同時參與。兩者的分工比例因人 而異，也因抬臂的方向而略有不同。教學上常說「盂肱出 2/3、肩胛出 1/3」 是方便的近似，不是每個人都固定如此。

    '
  safety_note: '若上舉時出現疼痛、夾擠感、明顯不穩或麻木感，應立即停止，不要強行 拉到更大角度。

    '
- id: movement.action.ankle-foot.plantarflexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  - src.brockett-2016
  name: 踝蹠屈
  aliases:
  - 蹠屈
  - 踝關節蹠屈
  - 腳尖下壓
  - ankle plantarflexion
  - plantar flexion
  joint_region: ankle-foot
  definition: '踝蹠屈是足部相對小腿向足底方向轉動的動作，主要發生在距小腿關節 （talocrural joint）。距小腿關節的主要自由度是背屈與蹠屈；額狀面的 內翻與外翻發生在距下關節與橫跗關節，不屬距小腿。足部繞斜軸的複合 動作另有專門術語——旋後包含內翻、內收與蹠屈三個成分，旋前包含外翻、 外展與背屈三個成分。因此「腳尖向下並轉出去」不是單一關節的動作， 描述與量測時必須指明講的是哪一層。

    '
  plane:
  - sagittal
  axis:
  - 距小腿關節的內外側軸
  - 該軸相對三個基本平面呈斜向，蹠屈末端因此伴隨輕微內收與內翻的耦合成分，不是純矢狀面動作
  observable_boundaries: '起點為解剖零位（足底與小腿長軸約成直角的中立位）；終點為最大主動或 被動蹠屈角度。外部觀察只能看到足部相對小腿的合成角度，無法區分距小腿 與距下／橫跗各自貢獻了多少。膝關節的屈伸位置會改變跨膝踝雙關節肌的 可用長度，因此不同膝角度下量到的蹠屈角度不可互相比較。水中觀察另受 單一視角投影限制，要把足部擺動拆回各關節的貢獻需要分節段量測。

    '
  general_anatomical_capacity: '距小腿關節在解剖正常條件下可完成完整的背屈與蹠屈弧度。教科書登錄有 一般人群的正常範圍值，但該值隨量測姿勢（尤其膝關節屈伸位置）與量測 方法而異，本條不引用單一數字作為門檻。 結構上值得指出的是：完全蹠屈是距小腿關節的鬆弛位（loose-packed position）——此時距骨較窄的部分位於踝穴之間、榫眼張力釋放，外側韌帶 張力下降，附屬活動度隨之增加。這是關節層的解剖事實，說明蹠屈末端的 骨性穩定度低於中立位；但由此推論任何游泳動作的擺動幅度、推進或風險， 都超出解剖層能支撐的範圍，本條不作此推論。

    '
  name_zh: 踝蹠屈
  description: '踝蹠屈就是腳尖往下壓的動作，主要由小腿與腳掌之間的距小腿關節完成。 要注意的是「腳踝」其實是好幾個關節疊在一起：上下壓（背屈與蹠屈） 發生在距小腿關節，腳掌往內外翻則發生在下方的距下與橫跗關節。所以 看到腳掌「往下又往外轉」，那不是一個關節在動，而是好幾層一起動的 合成結果——用肉眼或單一角度的影片沒辦法拆開各自出了多少。 另外，量腳踝角度時膝蓋是彎是直會影響結果，因為有肌肉同時跨過膝與 踝兩個關節；不同姿勢量到的數字不能直接互相比較。

    '
  safety_note: '壓到最大角度時若出現疼痛、麻木、刺痛，或關節有明顯不穩的感覺， 應立即停止，不要再往下壓。

    '
- id: movement.action.wrist-hand.flexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 腕屈曲
  aliases:
  - 屈腕
  - 手腕屈曲
  - wrist flexion
  joint_region: shoulder-arm
  definition: '腕屈曲是手相對前臂向掌側轉動的矢狀面動作，由橈腕關節與腕中關節的 動作共同合成，並非單一關節的轉動。橈偏與尺偏是額狀面的另一組動作， 不屬於腕屈曲；手同時往掌側與橈側或尺側移動時，是不同動作層的合成， 描述與量測時必須分別指明。

    '
  plane:
  - sagittal
  axis:
  - 腕屈伸的內外側軸
  observable_boundaries: '起點為解剖零位，即手與前臂長軸對齊；終點為個體可達的最大主動或被動 腕屈曲角度，會受活動度與疼痛影響。外部觀察與單一視角影片只能看到手 相對前臂的合成動作，無法拆分橈腕關節與腕中關節各自的貢獻；若同時伴隨 橈偏或尺偏，也不能把整段軌跡都記作腕屈曲。

    '
  general_anatomical_capacity: '在一般解剖條件下，腕可由解剖零位向掌側完成主動與被動屈曲。實際可用 範圍會隨個體活動度、量測方式與症狀而變，本條不採用任何單一角度作為 能力門檻，也不由一般解剖容量推論特定泳姿的腕部位置。

    '
  name_zh: 腕屈曲
  description: '腕屈曲就是手相對前臂往掌側彎。這個外觀看似簡單的動作，其實由橈腕 關節與腕中關節共同完成；肉眼或單一角度的影片看不出兩個關節各自動了 多少。手若同時往橈側或尺側偏移，還混入了額狀面的另一組動作，因此 描述或量測時要分清楚是在看掌側彎曲，還是在看多個方向的合成軌跡。

    '
  safety_note: '腕部彎曲時若出現疼痛、麻木、刺痛或明顯不穩，應立即停止，不要強行 壓到更大的末端角度。

    '
- id: movement.action.wrist-hand.extension
  claim_status: supported
