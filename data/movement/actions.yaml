  name: 腕伸展
  aliases:
  - 伸腕
  - 手腕伸展
  - wrist extension
  joint_region: shoulder-arm
  definition: '腕伸展是手相對前臂向背側轉動的矢狀面動作，由橈腕關節與腕中關節的 動作共同合成，並非單一關節的轉動。橈偏與尺偏是額狀面的另一組動作， 不屬於腕伸展；手同時往背側與橈側或尺側移動時，是不同動作層的合成， 描述與量測時必須分別指明。

    '
  plane:
  - sagittal
  axis:
  - 腕屈伸的內外側軸
  observable_boundaries: '起點為解剖零位，即手與前臂長軸對齊；終點為個體可達的最大主動或被動 腕伸展角度，會受活動度與疼痛影響。外部觀察與單一視角影片只能看到手 相對前臂的合成動作，無法拆分橈腕關節與腕中關節各自的貢獻；若同時伴隨 橈偏或尺偏，也不能把整段軌跡都記作腕伸展。

    '
  general_anatomical_capacity: '在一般解剖條件下，腕可由解剖零位向背側完成主動與被動伸展。實際可用 範圍會隨個體活動度、量測方式與症狀而變，本條不採用任何單一角度作為 能力門檻，也不由一般解剖容量推論特定泳姿的腕部位置。

    '
  name_zh: 腕伸展
  description: '腕伸展就是手相對前臂往手背側彎。這個外觀看似簡單的動作，其實由 橈腕關節與腕中關節共同完成；肉眼或單一角度的影片看不出兩個關節各自 動了多少。手若同時往橈側或尺側偏移，還混入了額狀面的另一組動作， 因此描述或量測時要分清楚是在看背側伸展，還是在看多個方向的合成軌跡。

    '
  safety_note: '腕部伸展時若出現疼痛、麻木、刺痛或明顯不穩，應立即停止，不要強行 壓到更大的末端角度。

    '
- id: movement.action.hip.flexion
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 髖屈曲
  aliases:
  - 屈髖
  - 髖關節屈曲
  - hip flexion
  joint_region: hip-knee
  definition: '髖屈曲是股骨相對骨盆朝前方轉動的矢狀面動作，使大腿前側朝軀幹靠近。 股骨固定時，骨盆相對股骨的前向轉動也會改變相同的外觀夾角，但移動的 節段與量測基準不同，描述時不能把兩者直接視為同一動作。

    '
  plane:
  - sagittal
  axis:
  - 髖屈伸的內外側軸
  observable_boundaries: '起點為股骨與骨盆處於解剖中立對齊，終點為個體可達的最大主動或被動 髖屈曲位置。從體表看到大腿與軀幹靠近時，可能同時包含股骨相對骨盆的 髖屈曲、骨盆前傾與軀幹姿勢變化；單一視角無法拆分各節段的貢獻。

    '
  general_anatomical_capacity: '在一般解剖條件下，髖可由中立位置向前完成主動與被動屈曲。實際可用 範圍會隨骨盆固定方式、膝部位置、主動或被動量測及症狀而變，本條不以 單一角度作能力門檻，也不由一般解剖容量推論特定泳姿的髖部位置。

    '
  name_zh: 髖屈曲
  description: '髖屈曲就是大腿相對骨盆往前抬。體表看到大腿靠近軀幹時，骨盆前傾 也可能造成相似外觀，因此肉眼或單一角度的影片無法分清各節段分別 移動了多少。描述這個動作時，需要說清楚是在看大腿相對骨盆移動， 還是在看骨盆與軀幹一起改變位置。

    '
  safety_note: '抬腿或屈髖時若出現髖部或鼠蹊疼痛、麻木、明顯無力或不穩，應立即 停止，不要強行壓向更深的位置。

    '
- id: movement.action.knee.extension
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 膝伸展
  aliases:
  - 伸膝
  - 膝關節伸展
  - knee extension
  joint_region: hip-knee
  definition: '膝伸展是脛骨相對股骨由屈曲位置朝較直方向轉動的矢狀面動作。承重時 也可由股骨相對固定脛骨移動而形成膝伸展；兩種情況的移動節段不同， 描述與量測時需明確指出採用哪一個節段作為基準。

    '
  plane:
  - sagittal
  axis:
  - 膝屈伸的內外側軸
  observable_boundaries: '起點為當下的屈膝位置，終點為個體可達的最大主動或被動伸膝位置。 膝在屈曲位置時，脛骨也可相對股骨發生軸向旋轉；單一視角只能看到 小腿的合成路徑，無法把矢狀面的伸展與伴隨旋轉各自拆分。

    '
  general_anatomical_capacity: '在一般解剖條件下，膝可由屈曲位置主動或被動朝伸展方向移動。實際 可用範圍會隨起始屈曲位置、髖與踝的位置、承重條件及症狀而變，本條 不以單一角度作能力門檻，也不由一般解剖容量推論特定泳姿的膝部時序。

    '
  name_zh: 膝伸展
  description: '膝伸展就是膝蓋由彎曲朝較直的方向移動。屈膝時，小腿還可能伴隨 旋轉，所以肉眼或單一角度的影片看到的是合成路徑，不能只憑外觀 分出伸展與旋轉各占多少。描述時也要說清楚是在看小腿相對大腿移動， 還是在承重下看大腿相對小腿移動。

    '
  safety_note: '伸膝時若出現膝部疼痛、卡住、麻木、明顯無力或不穩，應立即停止， 不要強行推向更直的位置。

    '
- id: movement.action.trunk.axial-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 軀幹軸向旋轉
  aliases:
  - 軀幹旋轉
  - 上軀幹旋轉
  - trunk axial rotation
  joint_region: spine-neck
  definition: '軀幹軸向旋轉是軀幹節段繞身體長軸的橫切面轉動。它與「各脊椎節段旋轉 角度的總和」不是同一個量：前者描述軀幹作為一個節段相對參考軸的方位， 後者需要逐節段量測才能得到。體表看到的肩線或髖線夾角是這個轉動的 替代指標，不是轉動本身。

    '
  plane:
  - transverse
  axis:
  - 身體長軸
  observable_boundaries: '起點為軀幹與參考軸對齊的中立方位，終點為個體可達的最大主動或被動 旋轉方位。由體表標記算出的肩線或髖線角度同時包含胸椎與腰椎各節段 旋轉、骨盆轉動與肩帶相對胸廓的移動；單一視角或單一線段無法拆分各 節段的貢獻，也無法區分軀幹主動轉動與整體滾轉造成的方位改變。

    '
  general_anatomical_capacity: '在一般解剖條件下，軀幹可繞身體長軸向兩側主動與被動旋轉，胸椎與腰椎 的可用範圍分布不同。實際可用範圍會隨骨盆固定方式、起始姿勢、主動或 被動量測及症狀而變，本條不以單一角度作能力門檻，也不由一般解剖容量 推論任何泳姿的滾轉幅度或時機。

    '
  name_zh: 軀幹軸向旋轉
  description: '軀幹軸向旋轉就是上半身繞著身體的長軸轉。從外面看到的肩線或髖線 轉了多少，是這個動作的替代看法，不是動作本身——因為那條線同時 受到胸椎、腰椎、骨盆與肩帶位置影響。描述時要說清楚是在看整段 軀幹的方位，還是在看某一段脊椎轉了多少。

    '
  safety_note: '轉動軀幹時若出現背部、腰部或頸部疼痛、麻木、下肢放射症狀、明顯 無力或不穩，應立即停止，不要強行加大旋轉幅度。

    '
