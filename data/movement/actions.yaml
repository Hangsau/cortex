- id: movement.action.shoulder-complex.scapular-upward-rotation
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩胛骨上迴旋
  aliases:
  - 肩胛上迴旋
  - 肩胛骨上旋
  - scapular upward rotation
  joint_region: shoulder-arm
  definition: '肩胛骨上迴旋是肩胛骨相對胸廓的旋轉，關節窩轉向上方、下角轉離脊椎。 它不是單一關節的動作，而是胸鎖關節的鎖骨上舉與肩鎖關節的肩胛上迴旋 加總而成的肩胛胸廓合成動作；記錄上迴旋條件時須分開考量這兩個關節， 不能把合成結果當成一個關節的單獨貢獻。

    '
  plane:
  - frontal
  axis:
  - 通過肩胛骨的前後軸
  observable_boundaries: '肩胛骨上迴旋是手臂舉過頭的必要組成部分，不是可有可無的附加動作。 解剖來源直接把它定義為抬臂過頭的一部分，使關節窩得以支撐並穩定被 舉起的肱骨頭；因此雙臂夾耳的流線姿勢必然包含上迴旋。肩胛骨可以嚴格 在額狀面上迴旋，但多數情況沿其自身的肩胛骨平面行進；所以「上迴旋」 與「上舉平面」是兩個必須分開記錄的欄位。

    '
  general_anatomical_capacity: '肩胛骨可透過胸鎖與肩鎖關節的合成運動提供手臂過頭所需的上迴旋；實際 可用幅度會隨胸廓形狀、鎖骨活動、肩鎖關節活動與上舉平面而變。 本條不以單一角度作能力門檻。

    '
  name_zh: 肩胛骨上迴旋
  description: '肩胛骨上迴旋是關節窩轉向上方、下角轉離脊椎的肩胛胸廓合成動作， 由胸鎖關節的鎖骨上舉與肩鎖關節的肩胛上迴旋共同形成。它是手臂舉 過頭的必要組成部分。上迴旋的方向與手臂採用的上舉平面是兩個不同 欄位，描述時不能互相替代。

    '
  safety_note: '抬高手臂或調整肩胛時若出現肩部疼痛、卡住、麻木、明顯無力或不穩， 應停止，不要以外力強行增加上舉或肩胛上迴旋範圍。

    '
- id: movement.action.shoulder-complex.scapular-posterior-tilt
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩胛骨後傾
  aliases:
