domain: movement
sub: muscle-groups
description: 肌群名稱、同義詞、跨關節特性與可承擔的角色；不宣稱任何泳姿一定如何招募
muscle_groups:
- id: movement.muscle.scapular-upward-rotators
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 肩胛上旋肌群
  aliases:
  - 肩胛骨上旋肌群
  - scapular upward rotators
  - 上旋肌群
  joint_regions:
  - shoulder-arm
  cross_joint_characteristics: '本肌群由前鋸肌（下束）與斜方肌（下束及上束）共同組成力偶 （force couple），協調驅動肩胛骨在胸廓上旋轉，使關節盂面在上舉時 朝向肱骨頭。斜方肌上束與下束、前鋸肌下束三者的力矩向量在肩胛骨 中央形成旋轉力偶，而非單肌獨立作用。

    '
  general_capabilities: '肩胛上旋：推動肩胛骨關節盂角朝上旋轉，是肩複合體上舉的必要同步動作。 穩定肩胛於胸廓：在上肢承載負荷時維持肩胸關節的穩定接觸。 協調盂肱空間：上旋使肩峰下空間在上舉弧度中保持相對通暢。

    '
  roles:
  - name: 肩上舉中的肩胛上旋
    boundary: '此角色在解剖條件正常時成立；具體在何種游泳動作中被多少程度地 招募，需泳者 EMG 資料支持，不得由解剖作用線直接外推。

      '
  name_zh: 肩胛上旋肌群
  description: '當手臂向上抬起時，肩胛骨需要同步上旋，讓肩關節窩的方向跟著手臂走。 負責這個動作的是「肩胛上旋力偶」——前鋸肌下束和斜方肌（上束、下束） 協同作用，就像齒輪組一樣把肩胛骨旋轉到對的角度。三條肌肉缺一不可， 任何一條無力或過緊都會影響這個協調。

    '
  safety_note: '若感到肩膀夾擠、不穩或疼痛，不要嘗試強制抬高手臂。

    '
- id: movement.muscle.rotator-cuff
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 旋轉肌袖
  aliases:
  - 肩旋轉肌群
  - rotator cuff
  - 旋轉袖肌群
  joint_regions:
  - shoulder-arm
  cross_joint_characteristics: '旋轉肌袖由棘上肌、棘下肌、小圓肌與肩胛下肌四條肌肉組成，共同包覆 肱骨頭，形成動態穩定系統。四者在整個上舉弧度中協同作用，使肱骨頭 維持對關節盂的向心壓緊，防止肱骨頭在上舉時向上移位撞擊肩峰。 棘下肌與小圓肌同時具有肱骨外旋能力，肩胛下肌具有內旋能力。

    '
  general_capabilities: '肱骨頭動態穩定：在主動運動全弧度中將肱骨頭壓向關節盂中心。 肱骨旋轉：棘下肌與小圓肌執行外旋，肩胛下肌執行內旋。 輔助上舉：棘上肌在上舉初始弧度（約 0–30°）貢獻外展力矩。

    '
  roles:
  - name: 盂肱關節動態穩定
    boundary: '此穩定角色在解剖層級有充分支持；在游泳各泳式的哪個相位以何種 程度被招募，屬泳者 EMG 層的問題，不得由解剖條件直接推論。

      '
  - name: 肱骨旋轉貢獻
    boundary: '旋轉方向與肌肉作用線為解剖事實；水中動作中的旋轉量與時序需 泳者運動學與 EMG 研究支持。

      '
  name_zh: 旋轉肌袖
  description: '旋轉肌袖是環繞肩關節的四條深層肌肉，功能像是一個「動態袖套」—— 在手臂移動的整個過程中，持續把肱骨頭壓向關節盂，防止它往上滑動 或錯位。旋轉肌袖的協調狀態會影響肱骨頭在上舉過程中的位置，這是 肩峰下空間大小的解剖決定因素之一。至於「協調不良是否導致夾擠症狀」 屬臨床病理研究問題，本條不作主張。

    '
  safety_note: '若肩部有急性疼痛、夾擠感、明顯無力或麻木，不要繼續強行完成上舉， 應停止並評估。

    '
- id: movement.muscle.latissimus-dorsi
  claim_status: partially-supported
  action_status: provisional
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 闊背肌
  aliases:
  - 背闊肌
  - latissimus dorsi
  - lats
  joint_regions:
  - shoulder-arm
  - spine-neck
  cross_joint_characteristics: '闊背肌是肩複合體最大的單一肌肉，起點廣大（胸腰筋膜、下位胸椎棘突、 腰椎棘突、髂嵴、下位肋骨），止點於肱骨小結節嵴。跨越肩關節時產生 肱骨伸展、內收與內旋的複合力矩。由於止點靠近肱骨頭旋轉中心， 在特定角度下對肱骨頭也有向下壓緊的分量。 在流線型姿勢（雙臂前舉過頭）下，闊背肌被拉伸至較大長度，若柔韌性 不足或靜止張力偏高，會限制肩複合體達到完整上舉，是超流線位常見的 潛在張力來源之一。此判斷屬臨床假設，需個案評估。

    '
  general_capabilities: '肱骨伸展：將手臂從上舉位拉回至側身，是肩複合體伸展的主要動力肌之一。 此為解剖作用線，具體在哪個泳式相位被招募多少屬游泳 EMG 研究範疇，本條不作主張。 肱骨內收：水平面從外展位拉向身體。 肱骨內旋：在特定關節角度下貢獻內旋力矩。 脊椎穩定：透過胸腰筋膜連結協助軀幹穩定（間接作用）。

    '
  roles:
  - name: 超流線姿勢下的柔韌度限制因子
    boundary: '此角色是依解剖作用線與臨床觀察提出的假設，「闊背肌緊繃即是限制 主因」不能作為通則斷言，需逐案被動與主動 ROM 評估才能確認。 招募程度在不同泳式中的差異屬游泳 EMG 研究問題。

      '
  name_zh: 闊背肌
  description: '闊背肌是背部最大的肌肉，負責把手臂從頭頂拉回側身（如拉水動作）， 也參與手臂向內收。因為它連接著背部與手臂，當雙臂前舉過頭做流線型 姿勢時，闊背肌需要足夠的柔韌性才能讓手臂完全貼耳。若它的靜止張力 偏高或柔韌性不足，可能會限制超流線位。但「闊背肌緊是限制所在」是需 要逐案確認的假設，不是所有人都適用。

    '
  safety_note: '若在雙臂上舉或流線型姿勢時肩部出現疼痛或夾擠感，不要強行撐開， 應停止評估原因。

    '
- id: movement.muscle.ankle-plantarflexors
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 踝蹠屈肌群
  aliases:
  - 蹠屈肌群
  - 小腿後側肌群
  - triceps surae and deep plantar flexors
  - ankle plantarflexors
  joint_regions:
  - ankle-foot
  - hip-knee
  cross_joint_characteristics: '本肌群以腓腸肌與比目魚肌組成的腓腸三頭肌為主要部分，並包含位於 小腿後側深層、肌腱通過距小腿關節軸後方的脛後肌、趾長屈肌與拇長屈肌。 腓腸肌跨過膝與踝兩個關節，比目魚肌不跨膝，因此膝關節位置會改變 腓腸肌的可用長度，卻不會以同樣方式改變比目魚肌。深層三肌除產生 蹠屈分量外，也具有足部旋後分量；趾長屈肌與拇長屈肌另跨趾關節。 腓骨長肌與腓骨短肌也能提供蹠屈分量，但其主要足部角色是外翻， 本條不把所有跨踝肌肉視為功能完全相同的一組。

    '
  general_capabilities: '踝蹠屈肌群可產生距小腿關節的蹠屈力矩，主動把足部帶向足底方向， 並在不需要繼續移動時提供位置維持。當外力把踝帶向背屈時，蹠屈肌群 也可用離心方式制動該方向。這些是一般解剖與肌肉作用線所能支持的 能力；不能由此直接判定任何泳式中的招募時序、力矩大小或推進貢獻。

    '
  roles:
  - name: 蹠屈力矩與末端姿勢容量
    boundary: '肌腱位於距小腿關節軸後方，支持主動蹠屈與位置維持；特定泳姿中 哪些成員在何時啟動、啟動多少，必須由泳者 EMG 與運動學資料裁決。

      '
  - name: 背屈方向的離心制動
    boundary: '肌群具備在踝被帶向背屈時離心制動的能力；某段打腿是否實際採用 此收縮型態，不能只看關節方向或表面 EMG 振幅推定。

      '
  name_zh: 踝蹠屈肌群
  description: '腳尖往下壓不是只有一條肌肉在做。小腿表層的腓腸肌與比目魚肌， 加上後側深層的脛後肌、趾長屈肌與拇長屈肌，都能提供蹠屈分量。 其中腓腸肌同時跨過膝與踝，比目魚肌只跨踝，所以膝蓋彎曲或伸直時， 兩者可用的長度條件並不相同。深層肌群還會影響足部旋後與腳趾動作， 因此「腳尖下壓」與「腳掌轉向」不應被當成完全相同的能力。

    '
  safety_note: '主動下壓腳尖或抗阻練習若引發踝部、跟腱或小腿疼痛，或出現麻木、 明顯無力與不穩定感，應立即停止，不要強行完成末端角度。

    '
- id: movement.muscle.ankle-dorsiflexors
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 踝背屈肌群
  aliases:
  - 背屈肌群
  - 小腿前側肌群
  - pretibial muscles
  - ankle dorsiflexors
  joint_regions:
  - ankle-foot
  cross_joint_characteristics: '本肌群由脛前肌、趾長伸肌、拇長伸肌與第三腓骨肌組成，肌腱均從 距小腿關節軸前方通過，因此都能產生背屈分量。脛前肌另有內翻與內收 分量，趾長伸肌與第三腓骨肌另有外翻分量，拇長伸肌與趾長伸肌還跨過 趾關節。接近中立方向的背屈需要這些相反的足部旋轉分量彼此平衡， 不能把整組簡化成脛前肌單獨作用。

    '
  general_capabilities: '踝背屈肌群可主動把足部帶向小腿前方，也可在足部被帶向蹠屈時以 離心方式控制速度與範圍，避免只靠被動擺動進入末端。肌群的拮抗角色 也可參與動作換向與姿勢維持；但特定泳姿採用何種收縮型態、是否產生 有意義的力矩，仍需把肌電與關節運動放在同一時序內確認。

    '
  roles:
  - name: 主動背屈與動作換向
    boundary: '肌肉作用線支持背屈與由蹠屈方向返回的主動控制；泳姿中的實際 回程時序與招募程度須由泳者運動學及 EMG 支持。

      '
  - name: 蹠屈方向的離心制動
    boundary: '一般功能中，背屈肌群可離心控制足部進入蹠屈；僅見肌電活動不能 單獨判定收縮為離心，也不能等同肌力、關節力矩或推進貢獻。

      '
  name_zh: 踝背屈肌群
  description: '小腿前側的脛前肌、趾長伸肌、拇長伸肌與第三腓骨肌共同負責把腳背 拉向小腿。它們也能在腳尖往下時提供煞車，讓足部不是被動甩進末端。 各肌肉還帶有不同的內翻、外翻或腳趾伸展分量，需要彼此平衡才能讓 足部沿著預期方向移動。這是一般肌肉能力，不代表訓練背屈肌就會讓 某一種打腿變快。

    '
  safety_note: '主動勾腳或控制腳尖下壓時若出現疼痛、麻木、明顯無力或踝部不穩， 應停止練習並評估，不要用更大的阻力硬撐。

    '
- id: movement.muscle.wrist-flexors
  claim_status: supported
  action_status: ready
  evidence_profile: anatomy
  source_ids:
  - src.neumann-2017
  name: 腕屈肌群
  aliases:
  - 屈腕肌群
  - 前臂屈腕肌群
  - wrist flexors
  joint_regions:
  - shoulder-arm
  cross_joint_characteristics: '本群包含尺側屈腕肌（FCU）、橈側屈腕肌（FCR）與掌長肌。這些主要成員 多數跨過肘與腕兩個關節，因此肘關節的屈伸位置會改變肌肉可用長度； 不同肘角度下量到的腕部力量或角度不能直接互相比較。各成員另有不同的 橈偏、尺偏或掌腱膜張力分量，不能把整群視為方向完全相同的單一肌肉。

    '
  general_capabilities: '腕屈肌群可產生腕屈曲力矩，也可依各成員作用線協助橈偏或尺偏。當手部 不需繼續移動時，本群能與腕伸肌群共同提供等長穩定，使腕在外力下維持 位置。這些是一般解剖能力，不宣稱任何泳式中的招募時序或招募程度。

    '
  roles:
  - name: 腕屈曲與方向控制
    boundary: '肌肉作用線支持腕屈曲及各成員的橈尺側方向分量；特定水中動作是否 採用這些能力，需泳者運動學與肌電資料支持。

      '
  - name: 與拮抗肌共收縮的腕關節等長穩定
    boundary: '可與腕伸肌群共收縮以等長穩定腕關節。共收縮是穩定機制，不等於 任一群正在出力完成屈曲或伸展動作；特定泳式的實際招募另由 demand 層的游泳證據裁決。

      '
  name_zh: 腕屈肌群
  description: '腕屈肌群包括尺側屈腕肌、橈側屈腕肌與掌長肌，能把手往掌側帶動， 也各自帶有不同的左右方向分量。這些肌肉多數同時跨過肘與腕，所以 手肘彎曲或伸直會改變它們可用的長度；不同手肘位置量到的腕部力量或 角度不能直接相比。它們也能和腕伸肌群一起等長用力來穩住手腕；這種 共收縮是在維持位置，不表示其中一群正在把手腕帶向某個方向。

    '
  safety_note: '腕部或肘部用力時若出現疼痛、麻木、刺痛、明顯無力或不穩，應立即 停止，不要用更大阻力硬撐。

    '
