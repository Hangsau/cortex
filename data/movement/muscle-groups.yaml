  cross_joint_characteristics: '本群在本圖譜包含髂腰肌、股直肌與闊筋膜張肌。股直肌同時跨過髖與膝， 膝部位置會改變它的可用長度與工作條件，因此不同膝部位置下量到的 力量或可用範圍不能直接互相比較。各成員還帶有不同的方向分量，不能 把整群視為作用完全相同的單一肌肉。

    '
  general_capabilities: '髖屈肌群可產生髖屈曲力矩，把大腿相對骨盆帶向前方；也可在大腿位置 不需繼續改變時提供等長穩定，或在髖朝伸展方向移動時提供離心控制。 這些是一般解剖能力，不宣稱任何泳式中的招募時序、收縮型態或貢獻大小。

    '
  roles:
  - name: 髖屈曲與大腿位置控制
    boundary: '肌肉作用線支持髖屈曲及大腿相對骨盆的位置控制；特定水中相位是否 採用這些能力，仍需泳者運動學與相位化肌電資料支持。

      '
  - name: 髖伸展方向的離心控制
    boundary: '一般功能中可在髖朝伸展方向移動時提供離心控制；僅見動作外觀不能 判定實際收縮型態，也不能等同肌力、關節力矩或推進貢獻。

      '
  name_zh: 髖屈肌群
  description: '髖屈肌群包括髂腰肌、股直肌與闊筋膜張肌，能把大腿相對骨盆往前帶， 也能協助維持大腿位置。股直肌同時跨過髖與膝，膝部彎曲或伸直會改變 它可用的長度，因此不同膝部位置下量到的力量或活動範圍不能直接相比。 這些是一般肌肉能力，不表示它們在某個泳式相位必然以相同方式工作。

    '
  safety_note: '抬腿或抗阻屈髖時若出現髖部、鼠蹊或膝部疼痛、麻木、明顯無力或不穩， 應停止練習，不要用更大的阻力硬撐。

    '
