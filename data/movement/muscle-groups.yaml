  - 肱骨內旋伸展肌群
  - shoulder internal rotator-extensors
  joint_regions:
  - shoulder-arm
  cross_joint_characteristics: '本群在本圖譜包含闊背肌、大圓肌、胸大肌胸骨部與肩胛下肌。這些成員 的作用線可同時帶有肩內旋、伸展與內收分量，但各分量會隨肱骨與肩胛 位置改變。解剖教科書以游泳推進期為例，說明許多肩內旋肌也具有強的 伸展與內收能力；這個例子支持的是動作能力並存，不是水中招募程度。

    '
  general_capabilities: '肩內旋伸展肌群可依關節位置產生肱骨內旋、伸展與內收方向的力矩，也可 在外力下協助維持或控制肱骨位置。教科書提及游泳推進期，是用來說明 這組肌肉具備多方向功能，並非量測它們在游泳中的招募時序、收縮型態 或貢獻大小，因此不能寫成游泳推進期由本群主導發力。

    '
  roles:
  - name: 肩內旋、伸展與內收方向的作用能力
    boundary: '肌肉作用線支持肩內旋、伸展與內收方向；特定水中相位是否採用這些 能力、採用到什麼程度，仍需泳者運動學與相位化肌電資料支持。僅見 動作外觀不能判定收縮型態，也不能等同肌力、關節力矩或推進貢獻。

      '
  name_zh: 肩內旋伸展肌群
  description: '這組肌肉包含闊背肌、大圓肌、胸大肌胸骨部與肩胛下肌。依上臂位置 不同，它們的作用線可支持肩內旋、伸展與內收，也能協助控制上臂位置。 這些是一般解剖能力；即使教科書用游泳推進期舉例，也不表示水中必然 由這組肌肉主導，或每位泳者都以相同方式使用它們。

    '
  safety_note: '肩部內旋、往後或往身側用力時若出現疼痛、夾擠感、麻木、明顯無力 或不穩，應停止，不要用更大阻力硬撐。

    '
