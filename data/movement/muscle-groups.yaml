  cross_joint_characteristics: '本群包含腓骨長肌、腓骨短肌與具有外翻分量的第三腓骨肌。這些肌肉的 肌腱路徑可對距下關節與橫跗關節產生外翻分量，並依各自走向同時帶有 蹠屈或背屈分量；它們作用的外翻不發生在只有背屈與蹠屈主要自由度的 距小腿關節。

    '
  general_capabilities: '足外翻肌群的作用線在解剖上可參與距下與橫跗關節的外翻及旋前位置控制， 也可依成員產生足部其他方向分量。外翻的可用幅度本身很小，因此足掌 明顯朝外不能只由本群的一般解剖能力解釋。

    '
