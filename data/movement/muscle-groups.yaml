    boundary: '肌肉作用線支持髖外旋與股骨軸向位置控制；特定蛙式相位的實際 招募時序、程度或推進貢獻不能由腳跟、小腿或大腿分開的外觀判定， 仍需相位化運動學與肌電資料支持。

      '
  name_zh: 髖外旋肌群
  description: '髖外旋肌群包含臀大肌與多條深層外旋肌，可依股骨位置參與外旋及位置 控制。它們的力矩臂與作用效果會隨髖屈曲角度改變，伸髖位與深屈髖位 的外旋能力不能互相代表。這裡列的是解剖上作用線可參與該方向動作的 肌群，不是該動作在蛙式中由誰主導。本層沒有相位化肌電或推進力量測， 因此不排名、不指定主動肌、不指定訓練順序。

    '
  safety_note: '大腿外旋或抗阻用力時若出現髖部、鼠蹊、膝部或腰背疼痛、麻木、 明顯無力或不穩，應停止，不要從足部施力強行扭轉。

    '
