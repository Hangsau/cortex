      '
  name_zh: 足外翻肌群
  description: '足外翻肌群包含腓骨長肌、腓骨短肌與具有外翻分量的第三腓骨肌，作用 在距下與橫跗關節，不是距小腿關節。外翻可用幅度本身很小，不能單靠 這組肌肉解釋腳掌明顯朝外。這裡列的是解剖上作用線可參與該方向動作 的肌群，不是該動作在蛙式中由誰主導。本層沒有相位化肌電或推進力量測， 因此不排名、不指定主動肌，也不指定訓練順序。

    '
