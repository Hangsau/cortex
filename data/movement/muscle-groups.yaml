  name: 膝屈肌群
  aliases:
  - 屈膝肌群
  - 膝關節屈肌群
  - knee flexors
  joint_regions:
  - hip-knee
  cross_joint_characteristics: '本群包含半腱肌、半膜肌、股二頭肌、縫匠肌、股薄肌與腓腸肌等可產生 膝屈曲分量的肌肉，多個成員同時跨過髖或踝。膝屈曲時，跨過膝內側的 成分也可參與脛骨內旋，跨過膝外側的股二頭肌可參與脛骨外旋；因此 膝屈肌群與膝軸向旋轉在解剖上不是兩組互不相干的肌肉。

    '
  general_capabilities: '膝屈肌群的作用線在解剖上可把膝帶向屈曲，也可協助維持或控制股骨與 脛骨的相對位置。膝屈曲後，部分成員還可依其跨過膝內側或外側的路徑 產生相反方向的軸向旋轉分量；各成員的跨關節條件並不相同。

    '
  roles:
  - name: 膝屈曲與膝軸向位置控制
    boundary: '肌肉作用線支持膝屈曲及屈膝時的軸向位置控制；特定蛙式相位的 實際招募時序、程度或推進貢獻不能由腳跟靠近臀部或足部朝外的 外觀判定，仍需相位化運動學與肌電資料支持。

      '
  name_zh: 膝屈肌群
  description: '膝屈肌群包含腿後肌群及其他跨過膝後方的肌肉，可參與屈膝與位置控制。 其中跨過膝內側或外側的成分，在膝屈曲時也能參與方向相反的膝軸向 旋轉，所以膝屈肌群與膝旋轉不是互不相干的兩組肌肉。這裡列的是解剖 上作用線可參與該方向動作的肌群，不是該動作在蛙式中由誰主導。本層 沒有相位化肌電或推進力量測，因此不排名、不指定主動肌，也不指定訓練順序。

    '
  safety_note: '屈膝、旋轉小腿或抗阻用力時若出現膝部、腿後側或髖部疼痛、麻木、 明顯無力或不穩，應停止，不要用更大阻力或從足部強行扭轉。

    '
