meta:
  title: 水感發展座標圖
  intro: 這不是一份要從頭讀到尾的課綱。整個水感發展攤平成一張圖——直軸是七個發展階段，橫軸是各式與心理。先看全貌，再決定要橫著走一式、還是直著比同一階段。
dimensions:
  - id: free
    zh: 自由式
  - id: back
    zh: 仰式
  - id: breast
    zh: 蛙式
  - id: fly
    zh: 蝶式
  - id: startturn
    zh: 起跳轉身
  - id: mind
    zh: 心理
levels:
  - id: L0
    zh: 安定
  - id: L1
    zh: 平衡
  - id: L2
    zh: 換氣協調
  - id: L3
    zh: 推進
  - id: L4
    zh: 節奏
  - id: L5
    zh: 銜接
  - id: L6
    zh: 整合
nodes:
  - level: L0
    dim: free
    overview: 呼吸與安定
    detail: 這一格談的是在自由式裡，呼吸節奏與身體放鬆如何先穩下來。原型內容，待 canonical 對齊。
  - level: L1
    dim: free
    overview: 水平與平衡
    detail: 身體在水面維持水平與平衡的課題。原型內容，待 canonical 對齊。
  - level: L2
    dim: free
    overview: 換氣與滾動
    detail: 這一格談的是換氣與身體滾動如何落在同一個節拍裡發生。拖動下面的節奏器，感覺一下不同快慢的節拍——這只是讓你體會節奏，不評對錯。
  - level: L3
    dim: free
    overview: 抱水與推進
    detail: 手臂抱水到推進的銜接課題。原型內容，待 canonical 對齊。
  - level: L4
    dim: free
    overview: 划頻與配速
    detail: 划手頻率與配速的關係。原型內容，待 canonical 對齊。
  - level: L5
    dim: free
    overview: 划手打腿銜接
    detail: 划手與打腿如何協同的課題。原型內容，待 canonical 對齊。
  - level: L6
    dim: free
    overview: 全程節奏整合
    detail: 把前面各層整合成全程穩定節奏。原型內容，待 canonical 對齊。
  - level: L1
    dim: back
    overview: 仰漂平衡
    detail: 仰式的水面平衡課題。原型內容，待 canonical 對齊。
  - level: L3
    dim: back
    overview: 直臂抱水
    detail: 仰式手臂抱水的課題。原型內容，待 canonical 對齊。
  - level: L2
    dim: breast
    overview: 蹬夾時序
    detail: 蛙式蹬腿與夾水的時序課題。原型內容，待 canonical 對齊。
  - level: L4
    dim: fly
    overview: 波動與第二踢
    detail: 蝶式身體波動與第二次打腿的課題。原型內容，待 canonical 對齊。
  - level: L5
    dim: startturn
    overview: 翻滾轉身銜接
    detail: 轉身翻滾與出牆銜接的課題。原型內容，待 canonical 對齊。
  - level: L0
    dim: mind
    overview: 安全感與放鬆
    detail: 還沒碰動作之前，水中的安全感與放鬆。原型內容，待 canonical 對齊。
  - level: L2
    dim: mind
    overview: 注意力分配
    detail: 練習時注意力放在哪裡的課題。原型內容，待 canonical 對齊。
