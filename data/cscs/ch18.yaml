id: ch18
weight: 18
title: Ch.18 增強式訓練計畫設計與技術
topics:
- id: equipment-facility
  title: 設備與場地 Equipment and Facility
  desc: ''
  tag: 環境設置
  items:
  - id: ch18.equipment-facility.i01
    q: 落地面的緩衝要求
    a:
    - 下肢增強式訓練的落地面必須具有足夠的吸震性
    - 合適選項包括草地、懸浮地板或橡膠墊
    - 混凝土、磁磚與硬木地板因吸震性不足，不建議使用
    detail: 教材將表面吸震性列為避免下肢增強式訓練傷害的場地條件。
    terms:
    - landing-surface
    numbers: []
    concepts:
    - safety
    - program-design
    related:
    - ch15.body-positioning.i08
    - ch16.instability-devices.i04
    - ch22.injury-prevention.i03
    locator: Safety Considerations > Equipment and Facilities > Landing Surface
  - id: ch18.equipment-facility.i02
    q: 過厚墊子與小型彈跳床的限制
    a:
    - 厚度達 6 英吋（15 公分）以上的運動墊會延長攤銷期
    - 小型彈跳床可作為復健時初階增強式與平衡訓練的引介，但不適合未受傷運動員的增強式訓練
    detail: 限制不在於墊子是否柔軟，而在於彈性表面延長接觸時間，無法有效運用牽張反射。
    terms:
    - amortization-phase
    - stretch-reflex
    numbers:
    - v: '6'
      unit: 英吋（15 公分）
      of: 會延長攤銷期的運動墊厚度門檻
    concepts:
    - safety
    - program-design
    related:
    - ch19.neuromuscular-basis.i02
    - ch05.neural-adaptations.i06
    locator: Safety Considerations > Equipment and Facilities > Landing Surface
  - id: ch18.equipment-facility.i03
    q: 訓練區域的空間要求
    a:
    - 大多數跨步跳與跑動訓練至少需要 30 公尺（33 碼）直線空間；部分動作可能需要 100 公尺（109 碼）
    - 多數立定跳、箱上動作與深跳所需地面面積較小，但天花板高度須有 3 至 4 公尺（9.8 至 13.1 英尺）
    detail: 空間需求取決於動作類型；教材分別處理水平移動所需直線距離與垂直跳躍所需淨高。
    terms:
    - bound
    - box-drill
    - depth-jump
    numbers:
    - v: 30（33）
      unit: 公尺（碼）
      of: 多數跨步跳與跑動動作所需的最小直線空間
    - v: 100（109）
      unit: 公尺（碼）
      of: 部分跨步跳或跑動動作所需的直線空間
    - v: 3–4（9.8–13.1）
      unit: 公尺（英尺）
      of: 立定跳、箱上動作與深跳訓練區的適當天花板高度
    concepts:
    - safety
    - program-design
    related:
    - ch15.power-exercises-technique.i04
    - ch19.training-methods.i04
    locator: Safety Considerations > Equipment and Facilities > Training Area
  - id: ch18.equipment-facility.i04
    q: 跳箱的尺寸與防滑要求
    a:
    - 箱上跳與深跳所用的箱子須穩固，頂面應防滑
    - 箱高範圍為 6 至 42 英吋（15 至 107 公分），落腳面至少為 18 × 24 英吋（46 × 61 公分）
    detail: 教材同時規定箱體穩固、頂面防滑與最小落腳面，以降低器材本身造成的風險。
    terms:
    - box-drill
    - depth-jump
    numbers:
    - v: 6–42（15–107）
      unit: 英吋（公分）
      of: 跳箱的高度範圍
    - v: 18 × 24（46 × 61）
      unit: 英吋（公分）
      of: 跳箱所需的最小落腳面尺寸
    concepts:
    - safety
    - program-design
    related:
    - ch15.power-exercises-technique.i04
    - ch16.bodyweight-training.i05
    locator: Safety Considerations > Equipment and Facilities > Equipment
  - id: ch18.equipment-facility.i05
    q: 跳箱的材質與防滑處理
    a:
    - 跳箱可用堅固木材（例如 3/4 英吋〔1.9 公分〕夾板）或厚規格金屬製作
    - 可用防滑踏條、在覆漆中混入砂子，或將橡膠地板固定於頂面來防滑
    detail: 教材提供的是可採行的防滑作法，不是規定只能使用其中任一種材料或處理。
    terms:
    - box-drill
    numbers:
    - v: 3/4（1.9）
      unit: 英吋（公分）
      of: 教材舉例的堅固木製跳箱夾板厚度
    concepts:
    - safety
    - program-design
    related:
    - ch15.power-exercises-technique.i04
    - ch16.general-guidelines.i01
    locator: Safety Considerations > Equipment and Facilities > Equipment
  - id: ch18.equipment-facility.i06
    q: 增強式訓練的鞋具條件
    a:
    - 鞋具必須有良好的踝部與足部支撐、良好的側向穩定性，以及寬闊防滑的鞋底
    - 窄鞋底且鞋面支撐差的鞋（如跑鞋）在側向動作時可能引發踝部問題
    detail: 教材另指出：足部支撐不足可能傷及足弓或小腿，緩衝不足則可能影響較近端的膝、髖關節。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch15.body-positioning.i08
    - ch22.injury-prevention.i01
    locator: Safety Considerations > Equipment and Facilities > Proper Footwear
  - id: ch18.equipment-facility.i07
    q: 彈性表面在復健與訓練的不同用途
    a:
    - 小型彈跳床可用於復健中的初階增強式與平衡訓練
    - 對未受傷運動員，過厚墊子與小型彈跳床會使攤銷期延長，因而不適合作為增強式訓練表面
    detail: 同一器材是否合適取決於使用情境；教材沒有把復健用的初階引介等同於未受傷運動員的訓練。
    terms:
    - amortization-phase
    - stretch-reflex
    numbers: []
    concepts:
    - safety
    - program-design
    related:
    - ch19.neuromuscular-basis.i02
    - ch16.instability-devices.i03
    locator: Safety Considerations > Equipment and Facilities > Landing Surface
  - id: ch18.equipment-facility.i08
    q: 上肢增強式訓練的器材與形式
    a:
    - 上肢增強式訓練包括藥球投擲、接球，以及數種伏地挺身
    - 上肢動作適用於需要快速有力上肢動作的運動員
    detail: 教材指出上肢增強式動作的研究與使用都少於下肢，但對需要上肢爆發力的運動員仍很重要。
    terms:
    - medicine-ball
    - push-up
    numbers: []
    concepts:
    - program-design
    - technique
    related:
    - ch15.upper-body.i08
    - ch16.bodyweight-training.i04
    locator: Program Design > Mode > Upper Body Plyometrics
- id: intensity-volume
  title: 強度與訓練量 Intensity and Volume
  desc: ''
  tag: 處方數據
  items:
  - id: ch18.intensity-volume.i01
    q: 增強式訓練強度的定義
    a:
    - 增強式訓練強度是施加在參與肌肉、結締組織與關節上的壓力
    - 強度主要由所選動作類型控制
    detail: 教材指出增強式動作的強度範圍很大，因此訓練週期中必須審慎選擇動作。
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related:
    - ch17.exercise-selection.i08
    - ch21.periodization-hierarchy.i05
    locator: Program Design > Intensity
  - id: ch18.intensity-volume.i02
    q: 影響下肢增強式動作強度的因素
    a:
    - 單腳動作的地面反作用力會讓單一肢體的肌肉、結締組織與關節承受比雙腳動作更大的壓力
    - 動作速度越快、身體重心越高、運動員體重越大，強度越高
    - 可用負重背心、踝部負重或腕部負重提高強度
    detail: 這些因素是動作類型之外的強度調整槓桿；教材未把它們列成固定的強度排名。
    terms:
    - ground-reaction-force
    numbers: []
    concepts:
    - program-design
    - safety
    related:
    - ch19.rfd-impulse.i04
    - ch17.exercise-selection.i04
    - ch16.bodyweight-training.i05
    locator: Program Design > Intensity > Table 18.3 Factors Affecting the Intensity of Lower Body Plyometric Drills
  - id: ch18.intensity-volume.i03
    q: 動作類型與增強式強度
    a:
    - 跳躍步的強度相對低
    - 深跳會對肌肉與關節造成高壓力
    - 動作類型是決定增強式強度的主要因素
    detail: 教材只用跳躍步與深跳示範低、高強度的範圍，沒有把六類下肢動作排成完整的低至高強度序列。
    terms:
    - depth-jump
    numbers: []
    concepts:
    - program-design
    - safety
    related:
    - ch17.exercise-selection.i04
    - ch19.neuromuscular-basis.i03
    locator: Program Design > Intensity
  - id: ch18.intensity-volume.i04
    q: 增強式訓練量的表示方式
    a:
    - 訓練量通常以單次訓練所做的反覆次數與組數表示
    - 下肢通常以足部接觸次數表示；跨步跳也可用距離表示
    - 上肢通常以每次訓練的投擲或接球次數表示
    detail: 足部接觸是指單腳或雙腳同時接觸表面的每一次接觸。
    terms:
    - foot-contact
    - bound
    numbers: []
    concepts:
    - program-design
    - measurement
    related:
    - ch17.training-volume.i01
    - ch17.training-volume.i02
    - ch12.terminology.i03
    locator: Program Design > Volume
  - id: ch18.intensity-volume.i05
    q: 下肢增強式訓練量的起始建議
    a:
    - 初學者每次訓練為 80 至 100 次足部接觸
    - 中階者每次訓練為 100 至 120 次足部接觸
    - 進階者每次訓練為 120 至 140 次足部接觸
    detail: 表中數值是依增強式經驗區分的起始訓練量，而非所有課程都應固定採用的上限。
    terms:
    - foot-contact
    numbers:
    - v: 80–100
      unit: 次足部接觸／次訓練
      of: 無增強式經驗初學者的起始下肢訓練量
    - v: 100–120
      unit: 次足部接觸／次訓練
      of: 有部分增強式經驗中階者的起始下肢訓練量
    - v: 120–140
      unit: 次足部接觸／次訓練
      of: 有相當增強式經驗進階者的起始下肢訓練量
    concepts:
    - program-design
    - normal-values
    related:
    - ch17.training-volume.i04
    - ch17.training-volume.i08
    - ch21.preparatory-period.i06
    locator: Program Design > Volume > Table 18.4 Appropriate Plyometric Volumes
  - id: ch18.intensity-volume.i06
    q: 強度與訓練量的關係
    a:
    - 一般而言，增強式動作強度增加時，訓練量應降低
    detail: 這是教材在強度與漸進超負荷段落重複提出的負荷配置原則；未指定固定的換算比例。
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related:
    - ch17.principles-exam-tips.i02
    - ch17.training-volume.i08
    - ch21.fitness-fatigue.i02
    locator: Program Design > Intensity
  - id: ch18.intensity-volume.i07
    q: 深跳箱高的安全範圍
    a:
    - 48 英吋（1.2 公尺）的落下高度雖提供顯著超負荷，但對許多運動員阻力過大，會提高傷害可能並延長攤銷期
    - 建議深跳高度為 16 至 42 英吋（41 至 107 公分），其中 30 至 32 英吋（76 至 81 公分）最常見
    detail: 過高的高度不只是衝擊增加；教材明說攤銷期延長會使該動作的目的落空。
    terms:
    - depth-jump
    - amortization-phase
    numbers:
    - v: 48（1.2）
      unit: 英吋（公尺）
      of: 教材說明可能造成過大阻力與較高傷害可能的深跳高度
    - v: 16–42（41–107）
      unit: 英吋（公分）
      of: 建議的深跳高度範圍
    - v: 30–32（76–81）
      unit: 英吋（公分）
      of: 教材所述最常見的深跳高度
    concepts:
    - safety
    - program-design
    related:
    - ch19.neuromuscular-basis.i03
    - ch16.bodyweight-training.i05
    - ch22.injury-prevention.i03
    locator: Safety Considerations > Equipment and Facilities > Depth Jumping
  - id: ch18.intensity-volume.i08
    q: 體重較大運動員的深跳限制
    a:
    - 體重超過 220 磅（100 公斤）的運動員做增強式訓練時，可能有較高傷害風險
    - 此族群應避免高訓練量、高強度動作，以及高度超過 18 英吋（46 公分）的深跳
    detail: 教材將較高風險連結到運動中增加的關節壓縮力；這是「可能增加風險」的限定，並非把體重當成絕對禁訓門檻。
    terms:
    - depth-jump
    numbers:
    - v: 220（100）
      unit: 磅（公斤）
      of: 教材指出做增強式訓練可能增加傷害風險的體重
    - v: 18（46）
      unit: 英吋（公分）
      of: 體重超過 220 磅運動員深跳箱高的上限
    concepts:
    - safety
    - population
    related:
    - ch22.injury-prevention.i01
    - ch17.exercise-selection.i08
    - ch12.safety.i02
    locator: Safety Considerations > Pretraining Evaluation of the Athlete > Physical Characteristics
- id: mechanical-models
  title: 力學與生理學模型 Mechanical & Neurophysiological Models
  desc: ''
  tag: 生理基礎
  items:
  - id: ch18.mechanical-models.i01
    q: 增強式運動的定義與目的
    a:
    - 增強式運動是使肌肉能在最短時間達到最大力量的活動
    - 實務上是使用預先拉伸或反向動作的快速、有力動作，涉及拉伸－縮短週期
    - 其目的在利用肌肉與肌腱的天然彈性成分及牽張反射，增加後續動作的功率
    detail: 教材也以希臘字根說明「plyometric」意為增加測量；定義的重點則是快速力量產生與預先拉伸。
    terms:
    - plyometric-exercise
    - stretch-shortening-cycle
    - stretch-reflex
    - power
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch05.neural-adaptations.i03
    - ch19.neuromuscular-basis.i02
    - ch17.exercise-selection.i04
    locator: Plyometric Mechanics and Physiology
  - id: ch18.mechanical-models.i02
    q: 機械模型如何增加力量產生
    a:
    - 肌腱－肌肉成分迅速被拉伸時，彈性能會增加並儲存
    - 若緊接向心肌肉動作，儲存的彈性能會釋放並增加總力量產生
    detail: 機械模型的關鍵條件是離心後立刻接向心動作；若不立即銜接，儲能不會完整轉為後續出力。
    terms:
    - series-elastic-component
    - eccentric-phase
    - concentric-phase
    numbers: []
    concepts:
    - force-production
    related:
    - ch05.connective-tissue.i05
    - ch19.neuromuscular-basis.i04
    - ch17.principles-exam-tips.i08
    locator: Plyometric Mechanics and Physiology > Mechanical Model of Plyometric Exercise
  - id: ch18.mechanical-models.i03
    q: 串聯彈性成分的角色
    a:
    - 串聯彈性成分包含部分肌肉成分，但主要由肌腱構成
    - 在離心肌肉動作中，串聯彈性成分如彈簧般拉長並儲存彈性能
    - 立即開始向心動作時，能量釋放並協助肌肉與肌腱回到未拉伸構形，對總力量產生作出貢獻
    detail: 教材稱串聯彈性成分是增強式運動的主要工作元件，但沒有把它等同於只有肌腱。
    terms:
    - series-elastic-component
    - eccentric-phase
    - concentric-phase
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch05.connective-tissue.i05
    - ch19.neuromuscular-basis.i04
    - ch05.neural-adaptations.i06
    locator: Plyometric Mechanics and Physiology > Mechanical Model of Plyometric Exercise
  - id: ch18.mechanical-models.i04
    q: 神經生理模型如何增加力量產生
    a:
    - 快速拉伸刺激肌梭，產生牽張反射
    - 肌梭是對拉伸速率與幅度敏感的本體感覺器官；偵測到快速拉伸時，反射性肌肉活動增加
    - 此反應增強主動肌活動，進而增加肌肉產生的力量
    detail: 教材以「potentiation」描述拉伸引起收縮元件力量－速度特性改變；拉伸後若未立即接向心動作，這種增強能力也會被抵銷。
    terms:
    - muscle-spindle
    - stretch-reflex
    - potentiation
    - concentric-phase
    numbers: []
    concepts:
    - force-production
    - reflex
    - motor-control
    related:
    - ch05.neural-adaptations.i06
    - ch19.neuromuscular-basis.i01
    - ch19.neuromuscular-basis.i02
    locator: Plyometric Mechanics and Physiology > Neurophysiological Model of Plyometric Exercise
  - id: ch18.mechanical-models.i05
    q: 儲能與反射增強何時會失去作用
    a:
    - 離心動作後若未立即接向心動作，儲存彈性能會以熱散失
    - 離心期過長或關節動作範圍過大，也會使儲能散失並抵銷牽張反射的增強能力
    detail: 教材在兩個模型中都提出同一時間與動作範圍邊界，說明兩者的有效運用都依賴快速銜接。
    terms:
    - eccentric-phase
    - concentric-phase
    - stretch-reflex
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch19.neuromuscular-basis.i02
    - ch19.rfd-impulse.i04
    - ch05.neural-adaptations.i06
    locator: Plyometric Mechanics and Physiology > Mechanical Model of Plyometric Exercise
  - id: ch18.mechanical-models.i06
    q: 增強式訓練的效果與機制證據
    a:
    - 正確使用增強式訓練，持續有研究顯示可改善肌肉力量與功率產生
    - 機械模型與神經生理模型都可能促成力量增加，但各自的貢獻程度仍不確定
    detail: 教材結論明確保留不確定性：研究尚未確定改善是否由機械或神經生理適應所致。
    terms:
    - plyometric-exercise
    - power
    numbers: []
    concepts:
    - adaptation
    - force-production
    related:
    - ch05.neural-adaptations.i06
    - ch05.connective-tissue.i05
    - ch19.training-methods.i03
    locator: Conclusion
  - id: ch18.mechanical-models.i07
    q: 功率在本章的意義
    a:
    - 功能性動作與運動成功同時依賴主動肌正常作用，以及肌肉力量被運用的速度
    - 本章以功率界定這項力量－速度關係
    detail: 教材在此只把功率稱為力量－速度關係，未在本章提供功率的公式。
    terms:
    - power
    numbers: []
    concepts:
    - force-production
    related:
    - ch17.principles-exam-tips.i08
    - ch19.rfd-impulse.i07
    - ch19.core-concepts.i06
    locator: Plyometric Mechanics and Physiology
  - id: ch18.mechanical-models.i08
    q: 骨骼肌機械模型的三個成分
    a:
    - 串聯彈性成分拉伸時儲存彈性能，增加產生的力量
    - 收縮成分由肌動蛋白、肌球蛋白與交叉橋組成，是向心動作中肌肉力量的主要來源
    - 並聯彈性成分包含肌外膜、肌束膜、肌內膜與肌膜，於未受刺激肌肉被拉伸時產生被動力量
    detail: 這些成分來自教材以文字完整呈現的圖 18.1；三者的功能不同，不能把所有力量都歸因於串聯彈性成分。
    terms:
    - series-elastic-component
    - contractile-component
    - parallel-elastic-component
    - concentric-phase
    numbers: []
    concepts:
    - structure
    - force-production
    related:
    - ch05.connective-tissue.i08
    - ch05.neural-adaptations.i05
    - ch19.neuromuscular-basis.i04
    locator: Plyometric Mechanics and Physiology > Mechanical Model of Plyometric Exercise > Figure 18.1 Mechanical model of skeletal muscle function
- id: program-design
  title: 訓練計畫設計變項 Program Design Variables
  desc: ''
  tag: 計畫設計
  items:
  - id: ch18.program-design.i01
    q: 增強式訓練的需求分析
    a:
    - 設計計畫前，應評估運動項目、場上位置與運動員訓練狀態
    - 不同運動與位置有不同動作需求、傷害樣態與風險；運動員也可能是初學者或曾受傷
    - 依運動、位置及個別運動員需要，選擇不同的增強式訓練方法
    detail: 需求分析的目的不是套用同一份動作清單，而是據此設計安全且有效的個別化計畫。
    terms:
    - needs-analysis
    numbers: []
    concepts:
    - program-design
    - population
    related:
    - ch17.needs-analysis.i01
    - ch17.needs-analysis.i03
    - ch19.program-design-monitoring.i07
    locator: Program Design > Needs Analysis
  - id: ch18.program-design.i02
    q: 每週訓練頻率與課間恢復
    a:
    - 增強式訓練頻率通常為每週 1 至 3 次，取決於運動項目、增強式經驗與一年中的訓練時期
    - 兩次增強式訓練間的典型恢復建議為 48 至 72 小時；依此通常可安排每週 2 至 3 次
    - 訓練時期、運動項目與經驗，比固定的每週頻率更常用來決定安排
    detail: 教材說明最佳頻率的研究有限，因此多位作者更重視訓練課間的恢復時間與實務經驗。
    terms:
    - training-frequency
    numbers:
    - v: 1–3
      unit: 次／週
      of: 增強式訓練的一般頻率範圍
    - v: 48–72
      unit: 小時
      of: 兩次增強式訓練之間的典型恢復建議
    - v: 2–3
      unit: 次／週
      of: 依典型恢復時間常見的增強式訓練頻率
    concepts:
    - program-design
    - periodization
    related:
    - ch17.training-frequency.i03
    - ch17.training-frequency.i05
    - ch21.periodization-hierarchy.i05
    locator: Program Design > Frequency
  - id: ch18.program-design.i03
    q: 重複、組間與課間的恢復
    a:
    - 深跳可在每次反覆之間休息 5 至 10 秒，組間休息 2 至 3 分鐘
    - 組間休息依工作－休息比 1:5 至 1:10 決定，且須配合動作類型與訓練量
    - 同一身體部位的動作不應連續兩天進行；運動項目與時期不同，課間恢復可為 2 至 4 天
    detail: 教材將增強式動作定位為改善無氧功率的最大努力，而非心肺訓練；對恢復時間的精確操弄仍缺乏足夠研究。
    terms:
    - depth-jump
    - power
    numbers:
    - v: 5–10
      unit: 秒
      of: 深跳每次反覆之間可採用的休息時間
    - v: 2–3
      unit: 分鐘
      of: 深跳組間可採用的休息時間
    - v: 1:5–1:10
      unit: 工作－休息比
      of: 決定增強式動作組間休息的比例範圍
    - v: 2–4
      unit: 天
      of: 依運動項目與訓練時期而定的課間恢復時間
    concepts:
    - program-design
    - periodization
    related:
    - ch17.rest-periods.i01
    - ch17.rest-periods.i02
    - ch21.fitness-fatigue.i04
    locator: Program Design > Recovery
  - id: ch18.program-design.i04
    q: 依經驗設定下肢訓練量
    a:
    - 下肢訓練量通常以單次訓練的足部接觸次數表示
    - 初學者為 80 至 100 次、中階者為 100 至 120 次、進階者為 120 至 140 次足部接觸
    detail: 這些數字是表 18.4 所列的起始訓練量，且按是否具有增強式經驗區分。
    terms:
    - foot-contact
    numbers:
    - v: 80–100
      unit: 次足部接觸／次訓練
      of: 初學者的起始下肢增強式訓練量
    - v: 100–120
      unit: 次足部接觸／次訓練
      of: 中階者的起始下肢增強式訓練量
    - v: 120–140
      unit: 次足部接觸／次訓練
      of: 進階者的起始下肢增強式訓練量
    concepts:
    - program-design
    - measurement
    related:
    - ch17.training-volume.i01
    - ch17.training-volume.i08
    - ch12.why-test.i04
    locator: Program Design > Volume > Table 18.4 Appropriate Plyometric Volumes
  - id: ch18.program-design.i05
    q: 漸進超負荷的安排
    a:
    - 增強式訓練是阻力訓練的一種，須遵循漸進超負荷原則
    - 漸進超負荷是系統性地以不同組合增加頻率、訓練量與強度
    - 通常強度增加時訓練量降低；安排方式由運動項目、訓練階段與整體課表決定
    detail: 教材的美式足球休季示例是由低至中訓練量的低強度，逐步到中強度與中至高強度，而不是同時把每項變項都推高。
    terms:
    - progressive-overload
    numbers: []
    concepts:
    - program-design
    - periodization
    related:
    - ch17.principles-exam-tips.i02
    - ch17.principles-exam-tips.i03
    - ch21.periodization-models.i08
    locator: Program Design > Progression
  - id: ch18.program-design.i06
    q: 課程長度與全年安排
    a:
    - 研究尚未確定最佳課程長度；多數增強式課程為 6 至 10 週
    - 垂直跳高度在開始課程後最快 4 週可改善
    - 需要快速有力動作的運動項目，適合在整個大週期持續安排增強式訓練，並隨賽季調整動作強度與訓練量
    detail: 教材主張以阻力與有氧訓練相同的方式處方增強式訓練；數週可見改善不等於已定出最佳課程長度。
    terms:
    - plyometric-exercise
    numbers:
    - v: 6–10
      unit: 週
      of: 教材所述大多數增強式訓練課程的長度
    - v: '4'
      unit: 週
      of: 開始增強式訓練後垂直跳高度最快可改善的時間
    concepts:
    - program-design
    - periodization
    related:
    - ch21.periodization-hierarchy.i03
    - ch21.preparatory-period.i01
    - ch20.periodization.i06
    locator: Program Design > Program Length
  - id: ch18.program-design.i07
    q: 增強式訓練的暖身
    a:
    - 每次訓練應依序包含一般暖身、伸展與專項暖身
    - 專項暖身應由低強度動態動作組成，例如行進、慢跑、跳躍步、步法與弓步
    detail: 表 18.5 將各暖身動作連到跑步姿勢、衝擊準備、快速起落或變向準備；不是把它們當成正式增強式訓練量。
    terms:
    - general-warm-up
    - specific-warm-up
    numbers: []
    concepts:
    - program-design
    - technique
    related:
    - ch12.administration.i05
    - ch15.exercise-technique-fundamentals.i04
    - ch19.sprint-technique.i01
    locator: Program Design > Warm-Up > Table 18.5 Plyometric Warm-Up Drills
  - id: ch18.program-design.i08
    q: 與阻力及有氧訓練的整合
    a:
    - 可將下肢阻力訓練與上肢增強式動作配對，或將上肢阻力訓練與下肢增強式動作配對
    - 同一天進行高強度阻力與增強式訓練通常不建議；若採高強度阻力訓練後接增強式的複合訓練，兩者間需充分恢復
    - 有氧運動可能對功率產生有負面影響，因此建議先做增強式，再做有氧耐力訓練
    detail: 教材允許部分運動員採複合訓練，但把充分恢復列為前提；傳統阻力動作結合增強式動作則是另一種提升功率的途徑。
    terms:
    - complex-training
    - power
    numbers: []
    concepts:
    - program-design
    - periodization
    related:
    - ch17.exercise-order.i02
    - ch17.rest-periods.i02
    - ch20.program-design.i06
    - ch05.cardiovascular-adaptations.i08
    locator: Plyometrics and Other Forms of Exercise > Plyometric Exercise and Resistance Training
- id: safety
  title: 安全考量 Safety Considerations
  desc: ''
  tag: 風險管理
  items:
  - id: ch18.safety.i01
    q: 下肢增強式訓練的落地技術
    a:
    - 落地時肩膀應位於膝蓋上方，膝蓋應位於腳趾上方
    - 透過踝、膝與髖屈曲完成此排列；正面觀察時膝蓋也須位於腳趾上方
    - 重心偏離支撐基底會妨礙表現並可能造成傷害，深跳尤其需要正確落地
    detail: 教材把落地技術列為增加動作效益及降低傷害風險的先決條件，不只是在落地瞬間「緩衝」。
    terms:
    - depth-jump
    numbers: []
    concepts:
    - safety
    - technique
    related:
    - ch15.body-positioning.i08
    - ch19.agility-cod.i05
    - ch22.injury-prevention.i03
    locator: Safety Considerations > Pretraining Evaluation of the Athlete > Technique
  - id: ch18.safety.i02
    q: 膝蓋內移是重要風險因子
    a:
    - 下肢增強式動作中，膝蓋向內移動稱為動態膝外翻
    - 動態膝外翻是各類膝傷的重要風險因子，包括髕股疼痛與前十字韌帶撕裂或斷裂
    detail: 教材用「向內移動」界定動態膝外翻；它是風險因子，不是以「訓練前必須矯正」這種絕對措辭表述。
    terms:
    - dynamic-valgus
    numbers: []
    concepts:
    - safety
    - injury
    related:
    - ch22.injury-prevention.i03
    - ch22.injury-prevention.i04
    - ch19.agility-cod.i05
    locator: Safety Considerations > Pretraining Evaluation of the Athlete > Technique
  - id: ch18.safety.i03
    q: 肌力與技術的訓練前考量
    a:
    - 過去建議下肢增強式訓練者的深蹲單次反覆最大重量至少為體重的 1.5 倍
    - 教材作者認為更重要的是技術；許多增強式動作可安全教給年輕運動員
    - 作者建議：需要跑步、落地、跳躍或切入的運動員，都應納入增強式訓練以教授正確排列與動作力學
    detail: 本段明確將 1.5 倍體重稱為「先前建議」，並主張技術是更重要的考量；不可把舊門檻寫成現行絕對資格。
    terms:
    - one-repetition-maximum
    numbers:
    - v: '1.5'
      unit: 倍體重
      of: 過去建議開始下肢增強式訓練前深蹲單次反覆最大重量的最低值
    concepts:
    - safety
    - technique
    related:
    - ch17.load-repetitions.i01
    - ch15.exercise-technique-fundamentals.i08
    - ch22.injury-prevention.i04
    locator: Safety Considerations > Pretraining Evaluation of the Athlete > Strength
  - id: ch18.safety.i04
    q: 下肢增強式訓練前的平衡評估
    a:
    - 平衡是維持某一姿勢不動一段時間的能力
    - 平衡測試依難度為站立、四分之一蹲與半蹲，各自可採雙腳或單腳變化，且每一姿勢需維持 30 秒
    - 初次訓練者須能單腳站立 30 秒不跌倒；開始進階計畫者須能單腳半蹲 30 秒不跌倒
    - 測試表面必須與增強式動作所用表面相同
    detail: 教材以非傳統移動模式與單腳動作說明平衡需求；因此評估表面要與實際訓練表面一致。
    terms:
    - balance
    numbers:
    - v: '30'
      unit: 秒
      of: 每個平衡測試姿勢必須維持的時間
    concepts:
    - safety
    - measurement
    related:
    - ch12.selection-factors.i03
    - ch16.instability-devices.i01
    - ch19.agility-cod.i05
    locator: Safety Considerations > Pretraining Evaluation of the Athlete > Balance > Table 18.7 Balance Tests
  - id: ch18.safety.i05
    q: 體重與既往傷害的安全考量
    a:
    - 體重超過 220 磅（100 公斤）的運動員做增強式運動時可能有較高傷害風險，因關節壓縮力增加
    - 此族群應避免高訓練量、高強度動作及高度超過 18 英吋（46 公分）的深跳
    - 開始前也應檢查關節結構與既往傷害
    detail: 教材用「可能增加」而非絕對禁忌來說明體重風險，並要求將個別關節結構與病史納入判斷。
    terms:
    - depth-jump
    numbers:
    - v: 220（100）
      unit: 磅（公斤）
      of: 可能增加增強式運動傷害風險的體重
    - v: 18（46）
      unit: 英吋（公分）
      of: 體重超過 220 磅運動員深跳高度的上限
    concepts:
    - safety
    - population
    related:
    - ch22.injury-prevention.i01
    - ch12.safety.i02
    - ch17.exercise-selection.i08
    locator: Safety Considerations > Pretraining Evaluation of the Athlete > Physical Characteristics
  - id: ch18.safety.i06
    q: 開始增強式訓練時須謹慎的病史
    a:
    - 有肌肉拉傷、病理性關節鬆弛或脊椎功能異常史者，開始增強式計畫時應謹慎
    - 教材舉例的脊椎功能異常包含椎間盤功能障礙或壓迫
    detail: 原文使用的是「應謹慎」，並未將這些病史全部列為一律不可進行增強式訓練的禁忌。
    terms: []
    numbers: []
    concepts:
    - safety
    - injury
    related:
    - ch22.injury-types.i03
    - ch22.injury-types.i05
    - ch12.safety.i01
    locator: Safety Considerations > Pretraining Evaluation of the Athlete > Physical Characteristics
  - id: ch18.safety.i07
    q: 增強式訓練常見的傷害風險來源
    a:
    - 增強式運動本身並非固有危險，但仍可能因意外受傷
    - 較常見的風險是違反適當訓練程序，例如肌力體能基礎不足、暖身不足、引導動作進展不當、訓練階段的量或強度不適當、鞋具或表面不佳，或技能不足
    detail: 教材把風險連到訓練程序的違反，並將簡單意外與可調整的計畫、場地與技術因素區分開來。
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related:
    - ch17.principles-exam-tips.i03
    - ch15.exercise-technique-fundamentals.i08
    - ch12.safety.i02
    locator: Safety Considerations
  - id: ch18.safety.i08
    q: 監督在增強式訓練中的作用
    a:
    - 需要密切監控運動員，以確保動作技術正確
    - 正確執行時，增強式運動並非本質危險；技術不佳則會讓運動員不必要地易受傷
    detail: 此處的監督是前述場地、鞋具與訓練前評估之外的持續安全措施。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch15.exercise-technique-fundamentals.i08
    - ch12.administration.i01
    - ch22.sports-medicine-team.i04
    locator: Safety Considerations > Equipment and Facilities > Supervision
- id: special-populations
  title: 特殊族群考量 Special Populations
  desc: ''
  tag: 族群應用
  items:
  - id: ch18.special-populations.i01
    q: 青春期前兒童的骨骺板與高強度動作
    a:
    - 青春期前兒童的骨骺板尚未閉合，因此深跳與其他高強度下肢動作屬禁忌
    - 生長板開放時，高強度活動與傷害可能使其過早閉合，導致肢體長度不一致
    detail: 教材的禁忌限定在深跳及其他高強度下肢動作，並非否定所有青春期前兒童的增強式運動。
    terms:
    - depth-jump
    numbers: []
    concepts:
    - population
    - safety
    related:
    - ch22.injury-types.i04
    - ch22.injury-prevention.i03
    - ch17.exercise-selection.i08
    locator: Age Considerations > Adolescents
  - id: ch18.special-populations.i02
    q: 兒童增強式訓練的目標與進展
    a:
    - 青春期前與青少年都可能從適當的增強式或類增強式運動獲益
    - 兒童課程應發展神經肌肉控制與無氧技能，協助更安全地參與運動
    - 動作應由相對簡單逐步進展到較複雜，並重視身體排列與動作速度的品質
    detail: 教材指出尚未確定可開始增強式訓練的普遍年齡；是否適合取決於適當課程與成熟度，而非單一歲數。
    terms:
    - plyometric-exercise
    numbers: []
    concepts:
    - population
    - safety
    - motor-control
    related:
    - ch05.neural-adaptations.i03
    - ch17.principles-exam-tips.i03
    - ch22.injury-prevention.i04
    locator: Age Considerations > Adolescents
  - id: ch18.special-populations.i03
    q: 兒童落地時的膝蓋內移
    a:
    - 兒童的增強式課程須特別注意膝蓋內移
    - 正確落地技術可降低下肢傷害風險；從正面看，膝蓋應位於腳趾上方
    - 過度向內的膝蓋移動會明顯增加膝傷風險
    detail: 此項依據教材以完整文字呈現的圖 18.4 說明；重點是落地排列，不是將「膝外翻」誤寫成膝蓋向外移動。
    terms:
    - dynamic-valgus
    numbers: []
    concepts:
    - population
    - safety
    - technique
    related:
    - ch18.safety.i02
    - ch22.injury-prevention.i04
    - ch19.agility-cod.i05
    locator: Age Considerations > Adolescents > Figure 18.4 Proper plyometric landing position
  - id: ch18.special-populations.i04
    q: 熟齡運動員的訓練前考量
    a:
    - 設計熟齡運動員的增強式課程前，應先明確訂定目標
    - 須考量既有骨科問題，例如骨關節炎、關節手術史或關節退化，並因此更加謹慎使用增強式運動
    detail: 教材不是依年齡一律排除熟齡運動員，而是要求以目標及既有關節狀況調整風險判斷。
    terms:
    - plyometric-exercise
    numbers: []
    concepts:
    - population
    - safety
    related:
    - ch22.injury-types.i05
    - ch22.sports-medicine-team.i04
    - ch12.safety.i01
    locator: Age Considerations > Masters
  - id: ch18.special-populations.i05
    q: 熟齡運動員的課程修改
    a:
    - 課程最多包含 5 項低至中強度動作
    - 總足部接觸量應低於標準增強式課程
    - 兩次增強式訓練間應恢復 3 至 4 天；若有慢性或過度疼痛、不適，應修改課程
    detail: 教材談的是兩次訓練之間的恢復，不是組間休息；它也要求留意熟齡運動員訓練與恢復後的主觀感受。
    terms:
    - foot-contact
    numbers:
    - v: '5'
      unit: 項動作
      of: 熟齡運動員增強式課程中低至中強度動作的最大數量
    - v: 3–4
      unit: 天
      of: 熟齡運動員兩次增強式訓練之間的恢復時間
