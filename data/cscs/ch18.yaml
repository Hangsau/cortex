cards:
- q: 增強式運動的實務定義是什麼？
  a: 使用預先拉伸或反向動作的快速、有力動作，涉及拉伸－縮短週期；目的在最短時間使肌肉達到最大力量。
  tag: ssc
- q: 教材提出哪兩個模型說明增強式運動的力量增加？
  a: 機械模型與神經生理模型；兩者都可能參與，但各自貢獻程度仍不確定。
  tag: ssc
- q: 串聯彈性成分在增強式運動中做什麼？
  a: 快速離心拉伸時如彈簧般儲存彈性能；立即接向心動作時釋放，對總力量產生作出貢獻。
  tag: ssc
- q: 牽張反射如何增加力量產生？
  a: 快速拉伸刺激肌梭，經第一型傳入神經與阿爾法運動神經元的路徑，反射性增加主動肌活動。
  tag: ssc
- q: 拉伸－縮短週期的三階段依序為何？
  a: 離心期、攤銷期、向心期。
  tag: ssc
- q: 攤銷期為何必須短暫？
  a: 過長時，儲存彈性能會以熱散失，牽張反射也不會在後續向心期增加肌肉活動。
  tag: ssc
- q: 肌腱－肌肉拉伸速率對拉伸－縮短週期有何影響？
  a: 拉伸速率高時，向心期的肌肉徵召與活動更大。教材未說它比拉伸幅度更重要。
  tag: ssc
- q: 靜態蹲跳、反向跳與助跑跳為何表現不同？
  a: 靜態蹲跳幾乎無離心期；反向跳有快速離心動作；助跑跳離心期更快、更有力，因此可達更高跳躍表現。
  tag: ssc
- q: 教材列出哪六種下肢增強式動作類型？
  a: 原地跳、立定跳、多次跳與跳躍、跨步跳、箱上動作及深跳。教材未將其排成固定強度序列。
  tag: training-modes
- q: 深跳的基本執行方式是什麼？
  a: 站在箱上踏下、落地後立即向上、向前或跳至另一個箱；可採單腳或雙腳。
  tag: training-modes
- q: 跨步跳的特徵與訓練量如何表示？
  a: 動作較誇張且水平速度較大；通常以距離表示，也可用反覆次數表示，通常距離超過 98 英尺（30 公尺）。
  tag: training-modes
- q: 上肢增強式運動包括哪些形式？
  a: 藥球投擲、接球及數種伏地挺身。
  tag: training-modes
- q: 軀幹動作如何更接近增強式運動？
  a: 縮短動作範圍與完成時間，以利刺激並運用牽張反射；許多軀幹動作並不具備所有真正增強式元素。
  tag: training-modes
- q: 下肢增強式動作強度受哪些因素影響？
  a: 動作類型、接觸點數、速度、動作高度與體重；單腳動作通常使單一肢體承受較大壓力。
  tag: intensity-volume
- q: 下肢與上肢增強式訓練量通常如何表示？
  a: 下肢以足部接觸次數表示，跨步跳也可用距離；上肢以投擲或接球次數表示。
  tag: intensity-volume
- q: 不同經驗者的起始下肢訓練量為何？
  a: 初學者 80 至 100 次、中階者 100 至 120 次、進階者 120 至 140 次足部接觸／次訓練。
  tag: intensity-volume
- q: 教材建議的深跳高度為何？
  a: 16 至 42 英吋（41 至 107 公分），其中 30 至 32 英吋（76 至 81 公分）最常見。
  tag: intensity-volume
- q: 體重超過 220 磅（100 公斤）者做深跳有何限制？
  a: 應避免高訓練量、高強度動作與高度超過 18 英吋（46 公分）的深跳。
  tag: intensity-volume
- q: 強度與訓練量的原則是什麼？
  a: 一般而言，強度增加時訓練量應降低；教材未指定固定的換算比例。
  tag: intensity-volume
- q: 增強式訓練頻率與課間恢復的一般建議？
  a: 通常每週 1 至 3 次；兩次訓練間的典型恢復為 48 至 72 小時。
  tag: mechanical-models
- q: 深跳的反覆、組間休息與工作－休息比為何？
  a: 反覆間可休息 5 至 10 秒，組間可休息 2 至 3 分鐘，工作－休息比為 1:5 至 1:10。
  tag: mechanical-models
- q: 為何教材不把增強式動作視為心肺訓練？
  a: 其為改善無氧功率的最大努力訓練，必須有完整且足夠的恢復。
  tag: mechanical-models
- q: 增強式課程長度的教材結論？
  a: 最佳長度尚未確定；多數課程為 6 至 10 週，垂直跳高度最快可在 4 週後改善。
  tag: mechanical-models
- q: 增強式訓練如何漸進超負荷？
  a: 系統性增加頻率、訓練量與強度的組合；通常強度增加時，訓練量降低。
  tag: mechanical-models
- q: 增強式訓練的暖身包含什麼？
  a: 一般暖身、伸展及由低強度動態動作組成的專項暖身。
  tag: mechanical-models
- q: 下肢增強式訓練前如何測試平衡？
  a: 站立、四分之一蹲、半蹲，各採雙腳或單腳變化；每一姿勢都須維持 30 秒，且測試表面須和訓練表面相同。
  tag: safety
- q: 正確落地姿勢的關鍵要點？
  a: 肩膀在膝蓋上方、膝蓋在腳趾上方，並以踝、膝、髖屈曲維持排列。
  tag: safety
- q: 動態膝外翻為何是風險因子？
  a: 它指膝蓋向內移動，是各類膝傷的重要風險因子，包括髕股疼痛與前十字韌帶撕裂或斷裂。
  tag: safety
- q: 適合與不適合的落地面？
  a: 草地、懸浮地板與橡膠墊適合；混凝土、磁磚與硬木地板因吸震性不足不建議。
  tag: safety
- q: 為何厚度達 6 英吋（15 公分）的墊子不適合？
  a: 會延長攤銷期；小型彈跳床雖可作復健初階引介，未受傷運動員的增強式訓練也不宜使用。
  tag: safety
- q: 跳箱的規格要求？
  a: 須穩固且頂面防滑；高度 6 至 42 英吋（15 至 107 公分），落腳面至少 18 × 24 英吋（46 × 61 公分）。
  tag: safety
- q: 青春期前兒童的高強度增強式禁忌？
  a: 骨骺板未閉合時，深跳與其他高強度下肢動作屬禁忌；高強度活動與傷害可能使生長板過早閉合。
  tag: special-populations
- q: 兒童增強式訓練的重點？
  a: 發展神經肌肉控制與無氧技能，從簡單逐步到複雜，並重視身體排列與動作速度品質。
  tag: special-populations
- q: 熟齡運動員的增強式課程如何修改？
  a: 最多 5 項低至中強度動作、總足部接觸量低於標準課程，兩次訓練間恢復 3 至 4 天。
  tag: special-populations
- q: 複合訓練是什麼，需注意什麼？
  a: 高強度阻力訓練後接增強式訓練；並非通常建議的同日組合，若採用則兩者間須充分恢復。
  tag: program-design
- q: 增強式與阻力訓練如何配對？
  a: 下肢阻力訓練配上肢增強式動作，或上肢阻力訓練配下肢增強式動作。
  tag: program-design
- q: 增強式與有氧耐力訓練的先後順序？
  a: 因有氧運動可能對功率產生有負面影響，建議先做增強式，再做有氧耐力訓練。
  tag: program-design
- q: 教材如何安排美式足球休季的漸進增強式課程？
  a: 由低至中訓練量的低強度，逐步到低至中訓練量的中強度，再到中至高強度；未要求先增加訓練量再增加強度。
  tag: program-design
- q: 為何動作加入課程前要先示範技術？
  a: 為最大化動作效益並降低傷害風險，肌力與體能專業人員必須先示範正確技術。
  tag: safety
- q: 增強式訓練鞋具的基本要求？
  a: 良好踝部與足部支撐、良好側向穩定性，以及寬闊防滑的鞋底。
  tag: safety
- q: 深跳為何是高強度動作？
  a: 它利用重力與運動員體重提高強度，會對肌肉與關節造成高壓力。
  tag: intensity-volume
- q: 48 英吋（1.2 公尺）深跳為何可能抵銷訓練目的？
  a: 阻力對許多運動員過大，增加傷害可能並延長攤銷期，使動作目的落空。
  tag: intensity-volume
- q: 三種垂直跳的表現順序與原因？
  a: 靜態蹲跳最低、助跑跳最高；隨拉伸速率增加，反向跳與助跑跳可更有效使用儲能與牽張反射。
  tag: ssc
- q: 串聯彈性成分主要由什麼構成？
  a: 包含部分肌肉成分，但主要由肌腱構成。
  tag: ssc
- q: 股四頭肌與腓腸肌的牽張反射潛伏期？
  a: 股四頭肌通常 20 至 30 毫秒；腓腸肌通常 30 至 45 毫秒。神經距離脊髓較遠時，潛伏期較長。
  tag: ssc
- q: 增強式訓練設計的第一步？
  a: 需求分析：評估運動、位置與訓練狀態，並考量不同動作需求、傷害樣態與風險。
  tag: program-design
- q: 耐力運動員為何也可能受益於下肢增強式訓練？
  a: 肌肉能以較少能量產生更多力量，教材指出可改善跑步與自行車表現。
  tag: training-modes
- q: 單腳動作為何通常比雙腳動作強度高？
  a: 單腳動作的地面反作用力會使單一肢體的肌肉、結締組織與關節承受更大壓力。
  tag: intensity-volume
- q: 實施增強式訓練計畫的五個步驟？
  a: 評估運動與訓練史、設定運動／位置／個別目標、指派設計變項、教授跳躍／落地／投擲技術、正確漸進計畫。
  tag: program-design
- q: 教材如何看待深蹲單次反覆最大重量為體重 1.5 倍的門檻？
  a: 它是先前建議；教材作者認為技術是更重要的考量。
  tag: safety
- q: 增強式訓練的主要目標？
  a: 快速施力以對主動肌造成超負荷；它應是包含肌力、速度、有氧、柔軟度與適當營養的整體課程之一部分。
  tag: program-design
- q: 教材列出的五種增強式專項暖身動作？
  a: 行進、慢跑、跳躍步、步法與弓步。
  tag: mechanical-models
