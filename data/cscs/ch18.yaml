  - id: ch18.special-populations.i08
    q: 兒童參與增強式訓練的成熟度
    a:
    - 男孩與女孩都應具備接受並遵循指示的情緒成熟度
    - 也應能理解此訓練方法的效益與注意事項
    detail: 教材將心理成熟度與身體條件並列為參與的條件，不能只依骨骺板狀態判定是否合適。
