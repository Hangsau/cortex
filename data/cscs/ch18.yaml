id: ch18
weight: 18
title: Ch.18 增強式訓練計畫設計與技術
topics:
- id: equipment-facility
  title: 設備與場地 Equipment and Facility
  desc: ''
  tag: 環境設置
  items:
  - id: ch18.equipment-facility.i01
    q: 落地面要求
    a:
    - 需有足夠緩衝
    - 推薦：草地、懸浮地板、橡膠墊
    - 不推薦：混凝土、磁磚、硬木地板
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
  - id: ch18.equipment-facility.i02
    q: 避免過厚墊子
    a:
    - ≥6 inches（15 cm）的厚墊 → 延長攤銷期 → 減少牽張反射效益
    - 小型彈跳床同理
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
  - id: ch18.equipment-facility.i03
    q: 訓練空間
    a:
    - 跨步跳/跑動類：至少 30m 直線空間（部分需 100m）
    - 跳箱類：天花板高 ≥3-4m
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
  - id: ch18.equipment-facility.i04
    q: 箱子規格
    a:
    - 高度：6-42 inches（15-107 cm）
    - 落地面 ≥18×24 inches（46×61 cm）
    - 防滑頂面
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
  - id: ch18.equipment-facility.i05
    q: 箱子材質
    a:
    - 3/4 inch 厚合板或重規格金屬
    - 防滑處理：防滑條、油漆加沙、橡膠地墊
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
  - id: ch18.equipment-facility.i06
    q: 鞋具要求
    a:
    - 良好足踝支撐、橫向穩定性、寬且防滑鞋底
    - 跑鞋鞋底過窄 → 踝關節風險高
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
  - id: ch18.equipment-facility.i07
    q: 不適合場地
    a:
    - 混凝土/磁磚：缺乏緩衝
    - 過厚軟墊/彈跳床：延長攤銷期，不利訓練效果
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
  - id: ch18.equipment-facility.i08
    q: 藥球設備
    a:
    - 上肢增強式訓練主要器材
    - 各種投擲、接球、伏地挺身均需適當重量藥球
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - program-design
    related: []
    locator: ''
- id: intensity-volume
  title: 強度與訓練量 Intensity and Volume
  desc: ''
  tag: 處方數據
  items:
  - id: ch18.intensity-volume.i01
    q: 強度定義
    a:
    - 施加於肌肉、結締組織、關節的壓力
    - 主要由動作類型決定
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.intensity-volume.i02
    q: 強度影響因素
    a:
    - ①接觸點數（單腳＞雙腳）②速度 ③跳躍高度（重心越高落地力越大）④體重
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.intensity-volume.i03
    q: 強度排序（低→高）
    a:
    - 跳繩/跨步 → 原地跳 → 立定跳 → 多次跳 → 箱跳 → 深跳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.intensity-volume.i04
    q: 量的計算
    a:
    - 下肢：foot contacts / 次訓練
    - 上肢：投擲或接球次數
    - 跨步跳以距離計
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.intensity-volume.i05
    q: 量的建議
    a:
    - 初學：80-100次
    - 中階：100-120次
    - 進階：120-140次（每次訓練 foot contacts）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.intensity-volume.i06
    q: 強度↑量↓原則
    a:
    - 強度增加時應減少訓練量
    - 防止過度疲勞與傷害
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.intensity-volume.i07
    q: 深跳箱高
    a:
    - 建議 16-42 inches（41-107 cm）
    - 常用 30-32 inches
    - 超過 48 inches 不建議
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.intensity-volume.i08
    q: 100 kg 體重限制
    a:
    - '>100 kg 運動員應避免高量高強度'
    - 深跳箱高限制在 ≤18 inches（46 cm）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
- id: mechanical-models
  title: 力學與生理學模型 Mechanical & Neurophysiological Models
  desc: ''
  tag: 生理基礎
  items:
  - id: ch18.mechanical-models.i01
    q: 增強式定義
    a:
    - 使肌肉在最短時間內產生最大力量的活動
    - 使用預拉伸或反向動作
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.mechanical-models.i02
    q: 機械模型
    a:
    - 肌腱單元快速拉伸 → 彈性能儲存於 SEC → 立即向心收縮釋放能量，增加總力輸出
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.mechanical-models.i03
    q: SEC（串聯彈性元件）
    a:
    - 機械模型核心
    - 主要由肌腱構成
    - 作用如彈簧，儲存並釋放彈性能
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.mechanical-models.i04
    q: 神經生理模型
    a:
    - 快速拉伸激活肌梭 → Type Ia 傳入神經 → 增強肌肉收縮力量（牽張反射）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.mechanical-models.i05
    q: 能量散失警告
    a:
    - 離心後若未立即接向心收縮，或動作過長，儲存彈性能以熱能形式散失
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.mechanical-models.i06
    q: 訓練效益
    a:
    - 已被反覆證實可提升肌肉力量與爆發力輸出（power production）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.mechanical-models.i07
    q: 力量-速度關係
    a:
    - Power = Force × Speed
    - 增強式訓練同時改善力量產生速率
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.mechanical-models.i08
    q: PEC / CC
    a:
    - PEC（並聯彈性元件）= 筋膜
    - CC（收縮元件）= actin/myosin，主動收縮主力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
- id: program-design
  title: 訓練計畫設計變項 Program Design Variables
  desc: ''
  tag: 計畫設計
  items:
  - id: ch18.program-design.i01
    q: 需求分析
    a:
    - 評估運動項目、場上位置、訓練史
    - 每位運動員需求不同，設計前必做
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.program-design.i02
    q: 頻率
    a:
    - 每週 1-3 次
    - 休季可增至 3-4 次
    - 每次間隔 48-72 小時恢復
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.program-design.i03
    q: 恢復
    a:
    - 深跳組間：2-3 分鐘
    - 組內：5-10 秒
    - 功率訓練非心肺訓練，充分恢復必要
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.program-design.i04
    q: 訓練量（下肢）
    a:
    - 初學：80-100 foot contacts
    - 中階：100-120
    - 進階：120-140（每次訓練）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.program-design.i05
    q: 進階原則
    a:
    - 遵循漸進超負荷
    - 強度↑則量↓
    - 從低強度→中→高強度系統推進
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.program-design.i06
    q: 課程長度
    a:
    - 通常 6-10 週
    - 4 週即可改善垂直跳高度
    - 應貫穿整個訓練大週期
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.program-design.i07
    q: 暖身
    a:
    - 一般暖身 → 伸展 → 專項暖身（低強度動態動作）：行進、慢跑、跳繩、跨步等
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch18.program-design.i08
    q: 與阻力訓練整合
    a:
    - 上肢阻力 + 下肢增強
    - 下肢阻力 + 上肢增強
    - 避免同日進行高強度阻力+增強式
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
- id: safety
  title: 安全考量 Safety Considerations
  desc: ''
  tag: 風險管理
  items:
  - id: ch18.safety.i01
    q: 落地技術
    a:
    - 肩膀對齊膝蓋、膝蓋對齊腳趾
    - 踝/膝/髖屈曲吸收衝擊
    - 避免 valgus（膝內扣）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch18.safety.i02
    q: Dynamic Valgus
    a:
    - 膝蓋向內移動 → 增加 ACL 損傷、髕股疼痛風險
    - 訓練前必須矯正
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch18.safety.i03
    q: 肌力標準
    a:
    - 過去要求蹲舉 1RM ≥1.5 倍體重
    - 現今更強調動作技術品質優先
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch18.safety.i04
    q: 平衡測試
    a:
    - 初學：單腳站立 30 秒
    - 中階：單腳 1/4 蹲 30 秒
    - 進階：單腳半蹲 30 秒（不跌落）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch18.safety.i05
    q: 體重限制
    a:
    - '>100 kg：避免高量高強度'
    - 深跳箱高 ≤18 inches
    - 關節壓力顯著增加
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch18.safety.i06
    q: 禁忌條件
    a:
    - 肌肉拉傷史、關節過鬆、脊椎功能異常（含椎間盤問題）需特別謹慎
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch18.safety.i07
    q: 受傷原因
    a:
    - 肌力基礎不足、暖身不夠、進階過快、量/強度不當、鞋具或場地不良
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch18.safety.i08
    q: 監督重要性
    a:
    - 需密切監控技術
    - 增強式本身非危險，但技術不良會造成不必要傷害
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
- id: special-populations
  title: 特殊族群考量 Special Populations
  desc: ''
  tag: 族群應用
  items:
  - id: ch18.special-populations.i01
    q: 青少年：骨骺板
    a:
    - 骨骺板未閉合 → 高強度下肢增強式（深跳）禁忌
    - 高強度刺激可能造成過早閉合
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch18.special-populations.i02
    q: 青少年：適合活動
    a:
    - 低強度增強式
    - 聚焦神經肌肉控制、無氧技能發展
    - 從簡單到複雜循序漸進
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch18.special-populations.i03
    q: 青少年：valgus 優先
    a:
    - 特別注意膝關節外翻控制
    - 正確落地技術已被證實可降低下肢傷害風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch18.special-populations.i04
    q: Masters 族群
    a:
    - 評估既有骨科問題（骨性關節炎、手術史、關節退化）再設計
    - 更需謹慎
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch18.special-populations.i05
    q: Masters 訓練指引
    a:
    - ≤5 項低至中強度動作
    - 總量低於標準
    - 組間恢復 3-4 天（非 2-4 天）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch18.special-populations.i06
    q: 複合訓練（Complex）
    a:
    - 高強度阻力訓練後接增強式
    - 需充分恢復
    - 僅適合有豐富增強式經驗的進階者
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch18.special-populations.i07
    q: 與有氧整合
    a:
    - 有氧訓練可能降低爆發力輸出
    - 應先做增強式，再做有氧耐力訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch18.special-populations.i08
    q: 情緒成熟度
    a:
    - 青少年必須具備情緒成熟度，能接受指導並理解訓練的效益與注意事項
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
- id: ssc
  title: 拉伸縮短週期 SSC
  desc: ''
  tag: 核心機制
  items:
  - id: ch18.ssc.i01
    q: Phase I 離心期
    a:
    - 肌肉伸長
    - 彈性能儲存於 SEC
    - 肌梭受到拉伸刺激
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.ssc.i02
    q: Phase II 攤銷期
    a:
    - 離心與向心之間的暫停
    - Type Ia 傳入神經突觸 → α運動神經元
    - 此期越短越好
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.ssc.i03
    q: Phase III 向心期
    a:
    - 肌肉縮短
    - SEC釋放彈性能
    - 肌肉收縮力量被增強
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.ssc.i04
    q: 攤銷期關鍵
    a:
    - 攤銷期過長 → 彈性能散失
    - 應立即接向心動作才能有效利用 SSC
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.ssc.i05
    q: 拉伸速率
    a:
    - 肌腱拉伸速率越快，牽張反射越強
    - 速率比拉伸幅度更重要
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.ssc.i06
    q: 牽張反射
    a:
    - 肌梭偵測快速拉伸 → 反射性增強向心收縮
    - 神經生理模型核心
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.ssc.i07
    q: SSC 應用例
    a:
    - 立定跳遠起跳前的下蹲、深跳落地後立即跳起，均為典型 SSC 應用
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch18.ssc.i08
    q: 雙模型整合
    a:
    - 機械+神經生理兩模型共同作用
    - 增強式訓練需同時利用彈性能與牽張反射
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
- id: training-modes
  title: 訓練模式分類 Training Modes
  desc: ''
  tag: 動作模式
  items:
  - id: ch18.training-modes.i01
    q: 下肢增強式
    a:
