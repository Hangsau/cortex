- id: ssc
  title: 拉伸縮短週期 SSC
  desc: ''
  tag: 核心機制
  items:
  - id: ch18.ssc.i01
    q: 拉伸－縮短週期的離心期
    a:
    - 第一階段是離心期，會預先負載主動肌群
    - 此時串聯彈性成分儲存彈性能，肌梭受到刺激
    - 肌梭受拉伸時，會經由第一型傳入神經纖維向脊髓腹根發送訊號
    detail: 表 18.1 雖為各階段列出機械與神經生理事件，但教材提醒各事件不一定只發生在列出的單一階段。
    terms:
    - stretch-shortening-cycle
    - eccentric-phase
    - series-elastic-component
    - muscle-spindle
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch05.neural-adaptations.i06
    - ch19.neuromuscular-basis.i02
    - ch18.mechanical-models.i03
    locator: Plyometric Mechanics and Physiology > Stretch–Shortening Cycle > Table 18.1 Stretch-Shortening Cycle Phase
  - id: ch18.ssc.i02
    q: 拉伸－縮短週期的攤銷期
    a:
    - 第二階段是離心與向心期之間的攤銷期，也稱過渡期
    - 此時第一型傳入神經與脊髓中的阿爾法運動神經元形成突觸，後者向主動肌群傳遞訊號
    - 此期必須維持短暫
    detail: 教材稱攤銷期可能是產生更大功率的最關鍵階段，但以「perhaps」保留限定語。
    terms:
    - stretch-shortening-cycle
    - amortization-phase
    - concentric-phase
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch05.neural-adaptations.i06
    - ch19.rfd-impulse.i04
    - ch18.mechanical-models.i04
    locator: Plyometric Mechanics and Physiology > Stretch–Shortening Cycle
  - id: ch18.ssc.i03
    q: 拉伸－縮短週期的向心期
    a:
    - 第三階段是主動肌纖維縮短的向心期
    - 離心期儲存於串聯彈性成分的能量在此釋放，或若未有效利用則以熱散失
    - 阿爾法運動神經元刺激主動肌群，引發反射性向心肌肉動作
    detail: 教材指出儲存彈性能可使向心期的力量高於孤立向心肌肉動作。
    terms:
    - stretch-shortening-cycle
    - concentric-phase
    - series-elastic-component
    - stretch-reflex
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch05.neural-adaptations.i06
    - ch19.neuromuscular-basis.i02
    - ch18.mechanical-models.i02
    locator: Plyometric Mechanics and Physiology > Stretch–Shortening Cycle > Table 18.1 Stretch-Shortening Cycle Phase
  - id: ch18.ssc.i04
    q: 攤銷期過長的後果
    a:
    - 攤銷期過長時，離心期儲存的能量會以熱散失
    - 牽張反射不會在後續向心期增加肌肉活動
    detail: 教材以跳遠運動員觸地後停住、再次開始動作前的時間來說明攤銷期；快速且無移動的轉換是其特徵。
    terms:
    - amortization-phase
    - stretch-reflex
    - concentric-phase
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch19.neuromuscular-basis.i02
    - ch19.rfd-impulse.i04
    - ch18.mechanical-models.i05
    locator: Plyometric Mechanics and Physiology > Stretch–Shortening Cycle
  - id: ch18.ssc.i05
    q: 肌腱－肌肉拉伸速率的影響
    a:
    - 快速的肌腱－肌肉拉伸速率，會使拉伸－縮短週期向心期的肌肉徵召與活動更大
    - 隨拉伸速率增加，靜態蹲跳、反向跳與助跑跳的絕對表現依序提升
    detail: 教材談的是拉伸速率的重要性，未說明它比拉伸幅度更重要。
    terms:
    - stretch-shortening-cycle
    - concentric-phase
    numbers: []
    concepts:
    - force-production
    - motor-control
    related:
    - ch19.rfd-impulse.i01
    - ch19.sprint-speed-components.i04
    - ch05.neural-adaptations.i03
    locator: Plyometric Mechanics and Physiology > Stretch–Shortening Cycle
  - id: ch18.ssc.i06
    q: 肌梭與牽張反射在增強式運動中的作用
    a:
    - 肌梭受到快速拉伸刺激時，會引發牽張反射
    - 該反射性反應增加主動肌活動，進而增加肌肉力量產生
    - 這是神經生理模型中增強向心肌肉動作的機制
    detail: 肌梭對拉伸的速率與幅度都敏感；若拉伸與向心動作間隔太久或活動範圍太大，教材指出增強效果會被抵銷。
    terms:
    - muscle-spindle
    - stretch-reflex
    - potentiation
    - concentric-phase
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch05.neural-adaptations.i06
    - ch19.neuromuscular-basis.i01
    - ch18.mechanical-models.i04
    locator: Plyometric Mechanics and Physiology > Neurophysiological Model of Plyometric Exercise
  - id: ch18.ssc.i07
    q: 三種垂直跳的拉伸－縮短週期差異
    a:
    - 靜態蹲跳幾乎沒有離心期，因此不使用儲存彈性能，且動作太慢而無法獲得牽張反射增強
    - 反向跳以快速部分下蹲接立即跳起，能儲存並使用彈性能，也會刺激牽張反射
    - 助跑跳具有更快速、更有力的離心期，因較高拉伸速率而可進一步提高垂直跳高度
    detail: 教材將這三種測驗用作拉伸速率的說明，並未把反向跳稱為「有限的拉伸－縮短週期」。
    terms:
    - eccentric-phase
    - stretch-reflex
    numbers: []
    concepts:
    - force-production
    - reflex
    - technique
    related:
    - ch12.selection-factors.i02
    - ch19.neuromuscular-basis.i03
    - ch19.rfd-impulse.i02
    locator: Plyometric Mechanics and Physiology > Stretch–Shortening Cycle
  - id: ch18.ssc.i08
    q: 機械與神經生理模型的整合與不確定性
    a:
    - 拉伸－縮短週期同時運用串聯彈性成分的儲能與牽張反射刺激
    - 兩個模型都可能促成增強式運動中的力量增加
    - 各模型實際貢獻的程度仍不確定，需要更多研究
    detail: 教材沒有斷言兩種機制各自占多少比例；此不確定性必須保留。
    terms:
    - stretch-shortening-cycle
    - series-elastic-component
    - stretch-reflex
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch05.neural-adaptations.i06
    - ch05.connective-tissue.i05
    - ch19.neuromuscular-basis.i02
    locator: Plyometric Mechanics and Physiology > Stretch–Shortening Cycle
- id: training-modes
  title: 訓練模式分類 Training Modes
  desc: ''
  tag: 動作模式
  items:
  - id: ch18.training-modes.i01
    q: 下肢增強式運動的適用情境
    a:
    - 下肢增強式運動適合幾乎所有運動員與運動項目，包括田徑投擲與短跑、足球、排球、籃球、美式足球、棒球，以及長跑與三項運動等耐力運動
    - 下肢訓練讓肌肉在較短時間產生更多力量；對耐力運動員則可讓肌肉以較少能量產生更多力量
    detail: 教材以籃球中鋒連續搶籃板說明重複跳躍需求，並將耐力效益表述為跑步與自行車表現改善。
    terms:
    - plyometric-exercise
    numbers: []
    concepts:
    - program-design
    - technique
    related:
    - ch19.training-methods.i03
    - ch20.aerobic-performance-factors.i04
    - ch17.needs-analysis.i02
    locator: Program Design > Mode > Lower Body Plyometrics
  - id: ch18.training-modes.i02
    q: 下肢增強式動作的六種類型
    a:
    - 下肢增強式動作類型包括原地跳、立定跳、多次跳與跳躍、跨步跳、箱上動作及深跳
    - 各類動作的強度與移動方向不同
    detail: 教材只列出六種動作類型，沒有宣稱它們構成固定的由低至高強度排序。
    terms:
    - jumps-in-place
    - standing-jump
    - multiple-hops-and-jumps
    - bound
    - box-drill
    - depth-jump
    numbers: []
    concepts:
    - program-design
    - technique
    related:
    - ch17.exercise-selection.i04
    - ch19.neuromuscular-basis.i03
    - ch16.bodyweight-training.i04
    locator: Program Design > Mode > Lower Body Plyometrics
  - id: ch18.training-modes.i03
    q: 深跳的動作模式
    a:
    - 深跳利用重力與運動員體重提高運動強度
    - 運動員站在箱上、踏下、落地後立即向上、向前或跳至另一個箱
    - 深跳可使用單腳或雙腳；箱高取決於運動員體型、落地表面與計畫目標
    detail: 「踏下」是教材指定的起始方式；先向上跳或降低重心再下來會改變實際落下高度。
    terms:
    - depth-jump
    numbers: []
    concepts:
    - program-design
    - technique
    - safety
    related:
    - ch19.neuromuscular-basis.i03
    - ch15.power-exercises-technique.i04
    - ch22.injury-prevention.i03
    locator: Program Design > Mode > Lower Body Plyometrics > Table 18.2 Lower Body Plyometric Drills
  - id: ch18.training-modes.i04
    q: 上肢增強式運動的模式
    a:
    - 上肢增強式訓練適用於需要快速有力上肢動作的運動，例如棒球、壘球、網球、高爾夫與田徑投擲
    - 上肢模式包括藥球投擲、接球及數種伏地挺身
    - 相較於下肢，上肢增強式動作較少被使用且研究較少，但對需要上肢功率的運動員仍很重要
    detail: 教材提到肩關節增強式訓練可能提升投球速度並預防肩、肘傷害，但對傷害預防的角色仍需要更多研究。
    terms:
    - medicine-ball
    - push-up
    - power
    numbers: []
    concepts:
    - program-design
    - technique
    related:
    - ch15.upper-body.i05
    - ch16.bodyweight-training.i04
    - ch22.injury-prevention.i02
    locator: Program Design > Mode > Upper Body Plyometrics
  - id: ch18.training-modes.i05
    q: 軀幹動作何時可稱為增強式
    a:
    - 直接針對軀幹肌肉的真正增強式動作通常難以完成，因為所需的所有元素可能不存在
    - 許多「增強式」軀幹動作雖可能在離心期儲存一些彈性能，但牽張反射未必充分參與以增強肌肉活動
    - 若要讓軀幹動作更像增強式，動作範圍與完成時間都必須縮短
    detail: 教材指出沒有研究直接探討腹肌的牽張反射；腹肌較靠近脊髓而可能有較短潛伏期，是作者的推論，不是實測結果。
    terms:
    - stretch-reflex
    - eccentric-phase
    numbers: []
    concepts:
    - program-design
    - technique
    - reflex
    related:
    - ch16.core-training.i01
    - ch19.neuromuscular-basis.i02
    - ch05.neural-adaptations.i06
    locator: Program Design > Mode > Trunk Plyometrics
  - id: ch18.training-modes.i06
    q: 跨步跳的特徵與計量
    a:
    - 跨步跳包含比其他動作更誇張、水平速度更大的動作
    - 訓練量通常以距離表示，也可用反覆次數表示
    - 跨步跳通常覆蓋超過 98 英尺（30 公尺）的距離，可包含單腳、雙腳與交替腳跨步跳
    detail: 教材將跨步跳視為下肢動作分類之一；以距離計量是通常作法，不是唯一作法。
    terms:
    - bound
    numbers:
    - v: 98（30）
      unit: 英尺（公尺）
      of: 教材所述跨步跳通常覆蓋的最小距離
    concepts:
    - program-design
    - measurement
    - technique
    related:
    - ch19.sprint-technique.i02
    - ch19.sprint-speed-components.i02
    - ch17.training-volume.i02
    locator: Program Design > Mode > Lower Body Plyometrics > Table 18.2 Lower Body Plyometric Drills
  - id: ch18.training-modes.i07
    q: 箱上動作的特徵
    a:
    - 箱上動作使用箱子來提高多次跳與跳躍的強度
    - 箱子可用於跳上或踏下，也可採單腳、雙腳或交替腳動作
    - 箱高取決於運動員體型、落地表面與計畫目標
    detail: 教材沒有設定每種箱上動作都應使用相同高度；高度是結合個人與計畫目標的處方變項。
    terms:
    - box-drill
    numbers: []
    concepts:
    - program-design
    - technique
    - safety
    related:
    - ch16.bodyweight-training.i05
    - ch15.power-exercises-technique.i04
    - ch17.exercise-selection.i08
    locator: Program Design > Mode > Lower Body Plyometrics > Table 18.2 Lower Body Plyometric Drills
  - id: ch18.training-modes.i08
    q: 運動項目的動作需求範例
    a:
    - 籃球中鋒需要反覆跳躍搶籃板；下肢增強式訓練可讓其在較短時間產生更多力量，協助跳得更高
    - 菁英棒球投手例行投球速度為每小時 80 至 100 英里（每小時 129 至 161 公里），肩關節速度超過每秒 6,000 度
    - 耐力運動員可藉由以較少能量產生更多力量，改善跑步與自行車表現
    detail: 教材以不同運動說明模式選擇要配合實際競賽動作需求，不能只依「增強式」這個名稱選動作。
    terms:
    - power
    numbers:
    - v: 80–100（129–161）
      unit: 英里／小時（公里／小時）
      of: 教材所舉菁英棒球投手的例行投球速度
