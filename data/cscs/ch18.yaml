cards:
- q: 增強式訓練（Plyometric Exercise）的定義？
  a: 利用預伸展（逆向動作）使肌肉在最短時間內達到最大力量的訓練方式；核心機制為拉伸縮短週期（SSC）
  tag: ssc
- q: 增強式訓練提升力量輸出的兩個模型？
  a: 機械模型（彈性能儲存於 SEC 並釋放）＋神經生理模型（牽張反射增強向心收縮）
  tag: ssc
- q: SEC（Series Elastic Component）在增強式訓練中的功能？
  a: 如彈簧：離心拉伸時儲存彈性能，緊接向心收縮時釋放，提升總力量輸出；主要由肌腱構成
  tag: ssc
- q: 牽張反射（Stretch Reflex）如何增強增強式訓練的力量？
  a: 肌梭偵測快速拉伸 → Type Ia 傳入神經 → 突觸 α 運動神經元 → 主動肌反射性增強
  tag: ssc
- q: SSC 的三個階段依序為何？
  a: Phase I 離心期（儲能/肌梭活化）→ Phase II 攤銷期（神經傳導）→ Phase III 向心期（釋能/收縮）
  tag: ssc
- q: 攤銷期（Amortization Phase）為何是 SSC 中最關鍵的階段？
  a: 過長會導致彈性能散失為熱，牽張反射失效；必須極短暫才能有效利用 SSC
  tag: ssc
- q: 拉伸速率（Stretch Rate）對 SSC 的影響？
  a: 速率越快 → 肌梭活化越強 → 牽張反射越大 → 向心力量越高；速率比拉伸幅度更重要
  tag: ssc
- q: 靜態蹲跳、反向跳、助跑跳的垂直高度依序高低原因？
  a: 靜態蹲跳無離心相（無彈性能/牽張反射）；反向跳有短暫離心相；助跑跳拉伸速率最大，牽張反射最強
  tag: ssc
- q: 下肢增強式訓練的六種類型（從低到高強度）？
  a: 原地跳→立定跳→多次跳→跨步跳（Bounds）→箱跳→深跳
  tag: training-modes
- q: 深跳（Depth Jump）的執行方式？
  a: 站在箱上踏下→落地後立即向上跳（或跳到另一個箱）；利用體重＋重力增加強度
  tag: training-modes
- q: 跨步跳（Bounding）的特點與訓練量計算？
  a: 誇張動作模式＋更大水平速度；訓練量以距離計（通常＞30 m），也可計次數
  tag: training-modes
- q: 上肢增強式訓練常用方法？
  a: 藥球投擲與接球、各種藥球過頭動作、爆發式伏地挺身（Plyometric Push-Ups）
  tag: training-modes
- q: 為何核心肌群難以真正做到增強式訓練？
  a: 核心肌群離脊髓較近但動作幅度大、時間長，牽張反射潛伏期難以配合；需縮小動作幅度/加快速度才能接近增強式效果
  tag: training-modes
- q: 增強式訓練強度的四個影響因素？
  a: 接觸點數（單腳>雙腳）、速度、跳躍高度（重心越高落地力越大）、體重
  tag: intensity-volume
- q: 下肢增強式訓練量的計算單位？
  a: Foot Contacts（每次腳接觸地面的次數）；跨步跳以距離計
  tag: intensity-volume
- q: 不同訓練程度的每次訓練 Foot Contacts 建議量？
  a: 初學：80-100次；中階：100-120次；進階：120-140次
  tag: intensity-volume
- q: 深跳箱建議高度範圍？一般標準與禁忌？
  a: 建議 16-42 英寸（41-107 cm）；常用 30-32 英寸；48 英寸以上不建議（攤銷期過長且傷害風險高）
  tag: intensity-volume
- q: 超過 100 kg 的運動員進行深跳有何限制？
  a: 應避免高量高強度增強式訓練；深跳箱高限制在 ≤18 英寸（46 cm）
  tag: intensity-volume
- q: 增強式訓練量與強度的反向關係？
  a: 強度越高應降低訓練量；防止神經肌肉疲勞累積與傷害風險
  tag: intensity-volume
- q: 增強式訓練的頻率建議（每週幾次）？
  a: 一般 1-3 次/週；比頻率更重要的是間隔時間：通常需要 48-72 小時恢復
  tag: mechanical-models
- q: 增強式訓練組間的工作休息比例？
  a: 1:5 到 1:10；如深跳組間休息 2-3 分鐘，每次重複間休息 5-10 秒
  tag: mechanical-models
- q: 為何增強式訓練應視為爆發力訓練而非心肺訓練？
  a: 訓練目標是最大功率輸出；組間需完整恢復；以心肺負荷設計會犧牲動作品質
  tag: mechanical-models
- q: 增強式訓練課表長度的一般建議？
  a: 多數課表 6-10 週；垂直跳高度可在 4 週後即開始改善
  tag: mechanical-models
- q: 增強式訓練漸進超負荷的方向？
  a: 從低量低強度 → 低量中強度 → 低量中高強度；強度與量反向變化
  tag: mechanical-models
- q: 增強式訓練熱身建議包含哪些元素？
  a: 一般熱身 + 靜態/動態伸展 + 專項熱身（行走/慢跑/跳繩/跨步動作）
  tag: mechanical-models
- q: 下肢增強式訓練前的基本平衡測試要求？
  a: 三種測試（雙腳站/單腳站/蹲姿），每個姿勢必須維持 30 秒不倒；與訓練地面相同
  tag: safety
- q: 正確落地姿勢（側面）的關鍵要點？
  a: 肩膀對齊膝蓋（重心在支撐基底上方）；踝、膝、髖屈曲緩衝
  tag: safety
- q: 動態膝外翻（Dynamic Valgus）為何是增強式訓練的重要風險因素？
  a: 膝蓋向內偏移顯著增加 ACL 撕裂、髕股疼痛等膝蓋傷害風險
  tag: safety
- q: 增強式訓練適合的落地面？不適合的落地面？
  a: 草地/彈性懸浮地板/橡膠墊；不適合：混凝土/磁磚/硬木地板（缺乏緩衝）
  tag: safety
- q: 為何厚軟墊（>15 cm）不適合用於增強式落地？
  a: 軟墊延長接觸時間 → 攤銷期拉長 → 牽張反射無法有效利用；同理也不建議小型蹦床
  tag: safety
- q: 增強式訓練跳箱的規格要求？
  a: 高度 6-42 英寸（15-107 cm）；落地面至少 18×24 英寸（46×61 cm）；需有防滑面
  tag: safety
- q: 青春期前孩子（骨骺線未閉合）的增強式訓練禁忌？
  a: 禁止高強度下肢動作及深跳；骨骺板在高衝擊下可能提前閉合造成肢體長度不均
  tag: special-populations
- q: 青少年進行增強式訓練的首要原則？
  a: 技術優先（不以肌力達標為前提）；從簡單到複雜漸進；特別注意膝外翻校正
  tag: special-populations
- q: 老年（Masters）運動員增強式訓練的修改建議？
  a: ≤5個低至中等強度動作；foot contacts 數量低於標準；組間恢復延長至 3-4 天；有關節退化史者避免深跳
  tag: special-populations
- q: Complex Training（複合訓練）的定義與適用對象？
  a: 高強度阻力訓練後接增強式訓練；需有充足恢復；僅適合有高強度增強式訓練基礎的進階運動員
  tag: program-design
- q: 增強式與阻力訓練整合的基本原則？
  a: 下肢阻力配上肢增強式；上肢阻力配下肢增強式；避免同日高強度雙邊訓練
  tag: program-design
- q: 增強式訓練與有氧訓練的先後順序建議？
  a: 先做增強式再做有氧；有氧訓練可能降低神經肌肉功率輸出，先做爆發力才有品質
  tag: program-design
- q: 增強式訓練課表設計中「漸進超負荷」的具體操作？
  a: 先增加訓練量，再在量穩定後提升強度；非同步同時提升兩者
  tag: program-design
- q: 跳躍訓練前為何需要技術示範？
  a: 增強式動作需要精確的技術（落地姿勢、膝關節位置）；錯誤技術比沒有肌力更危險
  tag: safety
- q: 增強式訓練鞋具的基本要求？
  a: 良好足踝支撐、側向穩定性、寬底防滑鞋底；不推薦窄底跑鞋（側向移動易扭傷）
  tag: safety
- q: 為何 Depth Jump 是所有下肢增強式訓練中強度最高的？
  a: 利用重力加速度增加離心負荷，拉伸速率最大，對肌腱關節壓力最大
  tag: intensity-volume
- q: 什麼情況下深跳目的反被抵消？
  a: 箱高過高（≥48 英寸）→ 落地力太大 → 攤銷期延長 → 彈性能散失、牽張反射失效
  tag: intensity-volume
- q: 垂直跳的三種形式及其SSC參與程度排列？
  a: 靜態蹲跳（無SSC）< 反向跳（有限SSC）< 助跑跳（完整且高速SSC）
  tag: ssc
- q: SEC的主要組成結構為何？
  a: 主要是肌腱（tendon）；另含部分肌肉結構；並聯彈性成分（PEC）則是肌外膜/肌束膜/肌內膜/肌膜
  tag: ssc
- q: 股四頭肌與腓腸肌的牽張反射潛伏期各為多少？
  a: 股四頭肌：20-30 ms；腓腸肌：30-45 ms；距離脊髓越遠潛伏期越長
  tag: ssc
- q: 增強式訓練的訓練目標設定第一步是什麼？
  a: 需求分析（Needs Analysis）：評估運動項目、場上位置、訓練現況（含傷病史）
  tag: program-design
- q: 跑步/自行車有氧運動員也能從增強式訓練獲益的原因？
  a: 增強式訓練使肌肉以更少能量產生更大力量，提升跑步/踩踏效率，降低能量消耗
  tag: training-modes
- q: 單腳落地比雙腳落地強度更高的原因？
  a: 單腳承受全部地面反作用力，對肌肉、結締組織、關節施加更大壓力
  tag: intensity-volume
- q: 增強式訓練課表啟動的五個步驟？
  a: ①評估運動員與運動需求 ②設定位置/個人目標 ③分配處方變數 ④教授跳落地投擲技術 ⑤漸進推進課表
  tag: program-design
- q: 進行增強式訓練前建議的肌力基準（舊版 vs 新版觀點）？
  a: 舊版：深蹲1RM≥1.5倍體重；新版更重視技術，認為凡需跑/跳/落/切的運動員均可納入，技術先於力量標準
  tag: safety
- q: 增強式訓練最主要的長期目標？
  a: 在最短時間內對主動肌施加最大力量，提升神經肌肉爆發力；是整體訓練計畫的一部分，不是獨立手段
  tag: program-design
- q: 增強式訓練常用的熱身動作有哪五種？
  a: 行進（Marching）、慢跑（Jogging）、跳繩/跳躍步（Skipping）、步伐練習（Footwork）、弓步（Lunging）
  tag: mechanical-models
