    - ch21.fitness-fatigue.i04
    - ch22.injury-prevention.i07
    locator: Age Considerations > Masters
  - id: ch18.special-populations.i06
    q: 熟齡跑者的深跳與單腳動作選擇
    a:
    - 無手術史且健康、希望改善跑步表現的熟齡運動員，應謹慎使用深跳與單腳動作；交替腿跨步跳與雙腳連續跳是較佳選擇
    - 有部分半月板切除等膝手術史或顯著關節退化的熟齡跑者，應把深跳與單腳增強式動作視為禁忌，其他增強式動作也須謹慎
    detail: 教材依個別病史區分「謹慎使用」與「視為禁忌」；不可把兩種情況合併成所有熟齡者都不能做深跳。
    terms:
    - depth-jump
    - bound
    numbers: []
    concepts:
    - population
    - safety
    related:
    - ch22.injury-types.i05
    - ch22.maturation-phase.i04
    - ch17.exercise-selection.i08
    locator: Age Considerations > Masters
  - id: ch18.special-populations.i07
    q: 兒童增強式訓練的課間恢復
    a:
    - 兒童兩次增強式訓練之間應有足夠恢復以預防過度訓練
    - 雖然最佳恢復量未知，教材認為至少間隔 2 至 3 天是必要的，以最佳化適應並降低傷害風險
    - 恢復時間應依強度、技能、能力、耐受性與訓練時期調整
    detail: 「至少 2 至 3 天」是教材對兒童課程的建議；它同時保留最佳恢復量尚未知的限制。
    terms:
    - plyometric-exercise
    numbers:
