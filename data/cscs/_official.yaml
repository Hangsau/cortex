meta:
  title: CSCS 官方原題
  source: resources/raw/cscs-questions/official_questions.md
  provided_by: 使用者（2026-09-30 貼上，確認為官方原題）
  translated_by: Claude（2026-09-30），練習一律用中文；英文原文留作參考
  answer_basis:
    given: 原文附有答案（多為網路討論者所寫的解答與解析）
    book: 原文未附答案或附的不是答案，依原書（ESC4）條文推定
    inferred: 原文未附答案，第 4 版原書查無直接條文，依領域通則推定；可信度較低
  notes: >-
    chapter 是對應原書（ESC4）章節，只用來篩選章節，不代表題目出處。
    practice: false 的題目只留作參考、不出題（原文題目本身有缺陷）。
questions:
- id: off.001
  chapter: ch13
  answer_basis: given
  zh:
    stem: 一名大學一級（D-I）籃球中鋒，身高 208 cm、體重 111.1 kg，季前測驗結果如下：1RM 背蹲舉 122.5 kg（270 lb）、1RM 爆發上膊 102.1 kg（225 lb）、垂直跳 45.7 cm（18 in）、立定跳遠 284 cm（112 in）、最大攝氧量 38 mL/kg/min。他的阻力訓練計畫最應該加強哪一個動作？
    options: [槓鈴背蹲舉, 懸垂爆發上膊, 負重跳躍蹲]
    correct: 0
    explanation: 籃球最看重爆發力，而他的爆發力指標（垂直跳、立定跳遠）已在約 60 百分位以上；一級籃球後衛與前鋒的垂直跳平均約 17.1 吋，18 吋算中上。反而背蹲舉只比爆發上膊多 45 lb，顯示最大肌力不足（約 53 百分位），所以重點是背蹲舉。
  en:
    stem: "A 6 ft 10 in (208 cm), 245 lb (111.1 kg) division I collegiate basketball center records the following preseason test results: 1RM back squat: 270 lb (122.5 kg); 1RM power clean: 225 lb (102.1 kg); Vertical jump: 18.0 in (45.7 cm); Standing long jump: 112 in (284 cm); V̇O₂max: 38 mL/kg/min. Which exercise should receive the greatest emphasis in the athlete’s resistance training program?"
    options: [Barbell back squat, Hang power clean, Loaded jump squats]
- id: off.002
  chapter: ch13
  answer_basis: given
  zh:
    stem: 一名體重 72.5 kg 的女子曲棍球選手，季前測驗結果：1RM 臥推 52.2 kg、1RM 背蹲舉 93.0 kg、垂直跳 45.7 cm（18 in）、20 公尺衝刺 3.52 秒、Pro-agility（5-10-5 折返）5.02 秒。下一個訓練週期最適合加入哪一個動作？
    options: [爆發上膊, 背蹲舉, 速度臥推]
    correct: 0
    explanation: 曲棍球是爆發力加反覆衝刺的運動。她的垂直跳不錯，但 20 公尺衝刺和 Pro-agility 都偏慢，顯示加速與爆發力不足，所以加爆發上膊。
  en:
    stem: "A 160 lb (72.5 kg) female field hockey player has the following test results during preseason testing: 1RM bench press: 115 lb (52.2 kg); 1RM back squat: 205 lb (93.0 kg); Vertical jump: 18 in (45.7 cm); 20 m sprint: 3.52 s; Pro-agility: 5.02 s. Which of the following exercises would be most appropriate to add to the subsequent training block?"
    options: [Power clean, Back squat, Speed bench press]
- id: off.003
  chapter: ch13
  answer_basis: book
  zh:
    stem: 一名女子足球選手，身高 175 cm、體重 75 kg，測驗結果：1RM 臥推 57 kg、1RM 背蹲舉 111 kg、垂直跳 41 cm（16 in）、立定跳遠 1.65 m、10 公尺衝刺 1.85 秒、Pro-agility 4.68 秒。她的訓練計畫最適合加入什麼？
    options: [減速訓練, 上斜臥推, 爆發上膊]
    correct: 2
    explanation: （原文未附答案，依原書第 13 章測驗判讀推定）背蹲舉約為體重 1.5 倍，最大肌力已足夠；垂直跳 16 吋、立定跳遠 1.65 m 都偏低，爆發力是弱點，所以加爆發上膊。Pro-agility 4.68 秒並不差，減速訓練不是優先。
  en:
    stem: "A 5'9, 165 lb (75 kg) female soccer player has the following test results: 1RM bench press: 125 lb (57 kg); 1RM back squat: 245 lb (111 kg); Vertical jump: 16 in (41 cm); Standing broad jump: 5 ft 5 in (1.65 m); 10 m sprint: 1.85 s; Pro-agility: 4.68 s. What is the most appropriate addition to her program?"
    options: [deceleration drills, incline bench press, power clean]
- id: off.004
  chapter: ch13
  answer_basis: given
  zh:
    stem: 一名大學三級（D-III）女子冰球選手，身高 168 cm、體重 76.7 kg，測驗結果：1RM 前蹲舉 79.4 kg、1RM 六角槓硬舉 103 kg、垂直跳 44.5 cm、立定跳遠 148 cm、300 碼折返跑 65 秒、1RM 臥推 52 kg。下一個訓練週期該怎麼調整？
    options: [以發展爆發力為重點, 以發展最大肌力為重點, 維持原本的週期不變]
    correct: 0
    explanation: 冰球是爆發力、無氧、反覆衝刺的運動，重點在爆發力多於最大肌力。她的立定跳遠只有 148 cm，水平爆發力特別差，而水平爆發力對冰球非常重要。
  en:
    stem: "A 5'6 169lb (76.7kg) division III collegiate female hockey athlete has the following results from a test battery: 1RM Front Squat: 175lb (79.4kg); 1RM Trap bar Deadlift: 225lb (103kg); Vertical Jump: 17.5in (44.5cm); Broad Jump: 58in (148cm); 300-yard shuttle: 65s; 1RM Bench Press: 115lb (52kg). What changes should be made to the next training block?"
    options: [focus on power development, focus on max strength development, make no changes to the block]
- id: off.005
  chapter: ch08
  answer_basis: given
  zh:
    stem: 在一段高強度訓練期間，肌力體能教練想用最有效的方法提升選手的專注。下列哪一種教練做法最適當？
    options: [選手做出技術正確的反覆後，給予肯定, 選手練習表現努力時，就取消練習後的體能訓練, 選手反覆出現技術錯誤時，減少他的訓練權限]
    correct: 0
    explanation: 技術正確就給予肯定，是正增強；研究顯示正增強最有效，能讓注意力留在任務上。取消體能訓練是負增強，減少權限是負處罰。
  en:
    stem: A strength and conditioning coach is seeking the most effective method to enhance athlete focus during a high-intensity training block. Which coaching behavior is most appropriate?
    options: [Provide recognition following technically sound repetitions, Eliminate post-session conditioning following strong practice effort, Reduce training privileges following repeated technical errors]
- id: off.006
  chapter: ch19
  answer_basis: inferred
  zh:
    stem: 你正帶美式足球隊的角衛做敏捷訓練。訓練中選手衝刺出去、攔截一顆傳短的球，這個動作屬於敏捷的哪一個階段？
    options: [轉換期（transition）, 啟動期（initiation）, 實現期（actualization）]
    correct: 2
    explanation: （原文未附答案，第 4 版原書查無，依第 5 版的敏捷三階段推定）啟動期是起動、轉換期是改變方向與動作模式、實現期是完成動作目標。衝刺並攔截到球就是完成任務目標，屬於實現期。
  en:
    stem: You are doing agility drills with the cornerbacks on the football team. The act of sprinting and intercepting the underthrown pass during the drill qualifies as which phase of agility?
    options: [transition, initation, actualization]
- id: off.007
  chapter: ch19
  answer_basis: given
  zh:
    stem: 肌力體能專家想提高一項「機動性（maneuverability）」訓練的難度，應該怎麼做？
    options: [加入減速的元素, 加入閃躲的元素, 加入彎道的元素]
    correct: 2
    explanation: 機動性是指在幾乎直線的奔跑中帶有轉彎的能力。原書第 19 章的進階方式就是增加「彎道」的難度，例如 L 形跑。
  en:
    stem: How can a strength and conditioning specialist increase the difficulty of a maneuverability drill?
    options: [add deceleration components, add evasion components, add bend components]
- id: off.008
  chapter: ch13
  answer_basis: given
  zh:
    stem: 肌力體能教練在休賽季為傷後回歸的選手施測星狀偏移平衡測驗（SEBT）。選手應該從哪個方向開始？
    options: [順時針, 逆時針, 隨機]
    correct: 2
    explanation: 星狀偏移平衡測驗各方向的施測順序採隨機，避免固定順序造成的學習與疲勞效應。
  en:
    stem: A strength and conditioning coach is implementing the Star Excursion Balance Test for athletes returning from injury in the off-season. In which direction should the athlete start?
    options: [clockwise, counterclockwise, randomly]
- id: off.009
  chapter: ch17
  answer_basis: book
  zh:
    stem: 一名選手背蹲舉用 83.9 kg（185 lb）做了 12 下。接下來他要以每組 5 下的方式訓練，理想的訓練重量是多少？
    options: [97.5–101.6 kg（215–224 lb）, 102.1–106.1 kg（225–234 lb）, 106.6–110.7 kg（235–244 lb）]
    correct: 2
    explanation: （原文附的是作答者用 Epley 公式的猜測，不是答案；依原書表 17.7 計算）12 下約等於 1RM 的 67%，1RM ≈ 185 ÷ 0.67 ≈ 276 lb；5 下約為 1RM 的 87%，276 × 0.87 ≈ 240 lb，落在 235–244 lb。
  en:
    stem: An athlete completes a back squat test at 185 lb (83.9 kg) for 12 repetitions. The athlete will be training for 5 repetitions. What would the ideal training weight be?
    options: [215-224 lb (97.5-101.6kg), 225-234 lb (102.1-106.1kg), 235-244 lb (106.6-110.7kg)]
- id: off.010
  chapter: ch21
  answer_basis: given
  zh:
    stem: 高強度訓練後進行主動恢復，研究顯示它對下列哪一項的影響最大？
    options: [明顯減少肌肉疲勞, 血乳酸的清除變慢, 改善心理層面的感受]
    correct: 2
    explanation: 主動恢復並不會明顯減輕肌肉疲勞，好處主要來自降低對疲勞與痠痛的「感受」，屬於心理層面，而非生理層面。
  en:
    stem: The performance of active recovery following an intense training session has shown the greatest impact on which of the following?
    options: [significantly reduced muscular fatigue, decreased blood lactate removal, improved psychological outcomes]
- id: off.011
  chapter: ch04
  answer_basis: given
  zh:
    stem: 一名選手剛完成阻力訓練。下列都會影響訓練後荷爾蒙反應的大小，「除了」哪一項？
    options: [選手為了維持動作姿勢所付出的努力程度, 這次訓練刺激到的肌肉量, 訓練後需要修復的結締組織程度]
    correct: 0
    explanation: 訓練後荷爾蒙反應的大小取決於刺激到的肌肉量、需要修復的組織程度等；「為了維持姿勢付出多少努力」不是影響因素。
  en:
    stem: "An athlete just completed a resistance training workout. All of the following are factors that influence the magnitude of the post-workout hormonal response EXCEPT:"
    options: [Amount of effort the athlete gave to maintain form during the workout, Quantity of muscle tissue stimulated by the workout, Degree of connective tissue repair needed after the workout]
- id: off.012
  chapter: ch13
  answer_basis: given
  zh:
    stem: 一名大三女子短距離游泳選手拿到第一次測驗結果：最大攝氧量 45 mL/kg/min、1RM 背蹲舉 55 kg、1RM 臥推 44 kg。你會怎麼調整她接下來的訓練計畫？
    options: [加入肌力／爆發力期, 加入最大肌力期, 加入肌肥大期]
    correct: 1
    explanation: 短距離游泳是爆發力與肌力型的項目，爆發力最重要，但這份測驗沒有爆發力項目；次重要的是肌力，而她的肌力低於 60 百分位，所以最適當的是加入最大肌力期。
  en:
    stem: "A college junior female sprint swimmer receives the results of her first testing day. VO2 Max: 45ml/kg/min, 1RM back squat: 115lbs (55kg), and a 1 RM bench press: 98lbs (44kg). What changes would you make to the future program?"
    options: [add a strength/power phase, add a max strength phase, add a hypertrophy phase]
- id: off.013
  chapter: ch18
  answer_basis: given
  zh:
    stem: 肌力教練想提示選手用「主動的全腳掌」落地。最適當的口令是哪一個？
    options: [「用全腳掌落地」, 「主動攻擊地面」, 「落地時勾腳尖（背屈）」]
    correct: 1
    explanation: 「攻擊地面」這類外在焦點的口令，能讓選手主動、快速地把腳踩向地面，而不是被動地讓腳掌拍地。
  en:
    stem: A strength coach is cueing athletes to land with an active flat foot. What is the most appropriate cue?
    options: ['"land with flat foot"', '"attack the ground"', '"dorsiflex at landing"']
- id: off.014
  chapter: ch20
  answer_basis: given
  zh:
    stem: 觀察長跑選手的跑姿時，他的軀幹應該前傾大約幾度？
    options: [1 度, 3 度, 5 度]
    correct: 1
    explanation: 長跑時軀幹應維持約 3 度的輕微前傾（原書第 20 章跑步技術）。
  en:
    stem: When observing the form of a distance runner, how much forward lean should this athlete have in their torso?
    options: [1 degree, 3 degrees, 5 degrees]
- id: off.015
  chapter: ch07
  answer_basis: given
  zh:
    stem: 一名女性運動員發生過多次腦震盪。下列哪一項是她「不會」出現的情況？
    options: [單一任務步態之間的變化較大, 單一任務步態之間的變化較小, 雙重任務步態之間的變化較大]
    correct: 1
    explanation: 女性運動員多次腦震盪後，腦血流量較低，而且在單一任務與雙重任務步態之間的變化「更大」；所以「變化較小」是不會出現的情況。
  en:
    stem: When a female athlete has multiple concussions, which of the following does she not experience?
    options: [greater changes between single-task gait activities, fewer changes between single-task gait activities, greater changes between dual-task gait activities]
- id: off.016
  chapter: ch17
  answer_basis: given
  zh:
    stem: 一名選手背蹲舉用 114 kg（250 lb）做了 10 下。接下來他要以每組 5 下的方式訓練，理想的重量是多少？
    options: [129.3–131.5 kg（285–290 lb）, 133.8–136 kg（295–300 lb）, 127–129.2 kg（280–285 lb）]
    correct: 0
    explanation: 依原書表 17.7：10 下約為 1RM 的 75%，1RM ≈ 250 ÷ 0.75 ≈ 333 lb；5 下約為 1RM 的 87%，333 × 0.87 ≈ 290 lb。
  en:
    stem: An athlete completes a back squat test at 250 lb (114 kg) for 10 repetitions. The athlete will be training for 5 repetitions. What would the ideal weight be?
    options: [285-290lb (129.3-131.5kg), 295-300lb (133.8-136kg), 280-285lb (127-129.2kg)]
- id: off.017
  chapter: ch19
  answer_basis: given
  zh:
    stem: 快速變向時，哪一組肌群在減速中扮演關鍵角色？
    options: [膕旁肌, 股四頭肌, 內收肌]
    correct: 1
    explanation: 變向前的減速主要靠股四頭肌做離心收縮來煞車（原書第 19 章）。
  en:
    stem: When executing a rapid change of direction, which muscle group plays a crucial role in deceleration?
    options: [hamstrings, quadriceps, adductors]
- id: off.018
  chapter: ch02
  answer_basis: given
  zh:
    stem: 棒球投手出手的瞬間，前臂（以肘為支點伸直）屬於哪一類槓桿？
    options: [第一類槓桿, 第二類槓桿, 第三類槓桿]
    correct: 2
    explanation: 支點是肘，肌力來自附著點很靠近肘的肱三頭肌，阻力是球。阻力臂遠長於肌力臂，所以是第三類槓桿：犧牲力量、換取速度。球很輕，速度比力量重要。
  en:
    stem: What class of lever is the lead forearm in a baseball pitch at ball release?
    options: [First class, Second Class, Third Class]
- id: off.019
  chapter: ch09
  answer_basis: given
  zh:
    stem: 哪一種胺基酸已被證實對肌肉蛋白質合成的影響最大？
    options: [白胺酸（leucine）, 纈胺酸（valine）, 異白胺酸（isoleucine）]
    correct: 0
    explanation: 三種支鏈胺基酸中，白胺酸是啟動肌肉蛋白質合成最關鍵的一種（原書第 9 章）。
  en:
    stem: Which amino acid has been shown to have the greatest effect on muscle protein synthesis?
    options: [Leucine, Valine, Isoleucine]
- id: off.020
  chapter: ch10
  answer_basis: given
  zh:
    stem: 一名體重 50 kg 的大學越野跑選手，正從賽後期轉入休賽期訓練。賽後期訓練量低，她每天吃 240 g 碳水化合物並維持體重。隨著訓練量增加，為了支撐訓練表現，你建議她把每日碳水攝取改成多少？
    options: [325 g, 425 g, 510 g]
    correct: 1
    explanation: 240 g ÷ 50 kg ≈ 每公斤 4.8 g，是低訓練量的水準。訓練量增加後的耐力選手約需每公斤 8–10 g，425 g ≈ 每公斤 8.5 g 最合適；510 g 已超過每公斤 10 g。
  en:
    stem: "A 110lb (50kg) collegiate cross-country runner is transitioning from post-season to offseason training. She was consuming 240g of carbohydrate per day and maintaining body weight with low training volume during the post-season. In order to fuel for performance as training volume increases, you advise her to change her carbohydrate intake to:"
    options: [325g, 425g, 510g]
- id: off.021
  chapter: ch08
  answer_basis: given
  zh:
    stem: Balaji 和 Divyang 正在為一場板球比賽熱身，看台上的觀眾比球隊以往任何一場都多。Balaji 覺得觀眾的喧鬧很刺激，熱身時保持專注；Divyang 在同樣的環境下卻覺得很不舒服。哪一個理論最能解釋這個現象？
    options: [災難理論, 倒 U 理論, 逆轉理論]
    correct: 2
    explanation: 逆轉理論認為，同樣高的喚醒程度，有人解讀成興奮、準備好了，有人解讀成不舒服、缺乏信心，差別在個人怎麼詮釋。
  en:
    stem: Balaji and Divyang are warming up for a cricket match. There are more fans in the audience than in any previous match the team has played. Balaji interprets this extra crowd noise as exciting and remains focused for his warm-up. Divyang experiences the same environment as unpleasant. Which theory best explains this phenomenon?
    options: [Catastrophe theory, Inverted U theory, Reversal Theory]
- id: off.022
  chapter: ch12
  answer_basis: given
  zh:
    stem: 同一批選手的垂直跳，分別由專項教練和肌力教練用觸碰式測量器施測。專項教練測出來的成績平均高了 3 吋，兩邊的標準差則差不多。這代表什麼？
    options: [建構效度低, 區辨效度低, 施測者間信度低]
    correct: 2
    explanation: 同樣的選手、同樣的測驗，換一個施測者成績就系統性地不同，代表施測者之間的一致性差，也就是施測者間信度低。
  en:
    stem: "A vertical jump test is performed with a jump and tap stick by the sport coach and by the strength coach. If the athletes scores average 3 inches higher when tested by the sport coach with a similar standard deviation on both measurements, this indicates:"
    options: [Low construct validity, Low discriminant validity, Low interrater reliability]
- id: off.023
  chapter: ch02
  answer_basis: given
  zh:
    stem: 哪一類槓桿的肌力臂比阻力臂長？
    options: [第一類槓桿, 第二類槓桿, 第三類槓桿]
    correct: 1
    explanation: 第二類槓桿的肌力與阻力在支點同一側，且肌力臂比阻力臂長，機械利益大於 1，例如踮腳尖。
  en:
    stem: In which class of lever is the moment arm of the muscle larger than the moment arm of the resistance?
    options: [1st Class, 2nd Class, 3rd Class]
- id: off.024
  chapter: ch04
  answer_basis: given
  zh:
    stem: 下列都是內分泌系統對阻力訓練的適應，「除了」哪一項？
    options: [荷爾蒙經肝臟清除的時間, 肌肉組織中的受器數量, 分泌出的荷爾蒙種類]
    correct: 2
    explanation: 阻力訓練會改變受器數量、清除速率等，但不會改變腺體分泌的荷爾蒙種類。
