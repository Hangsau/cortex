  - id: ch21.sfra-theory.i05
    q: SFRA 理論在週期化計畫的哪些層級出現，並如何支撐序列週期化？
    a:
    - 此基本模式出現在運動員每次接觸訓練動作、訓練節次、訓練日或訓練週期時
    - 概念上，它是序列週期化模型的基礎：模型藉由操弄不同訓練因子，調節整體疲勞、恢復速率與對刺激的適應反應
    detail: 原文舉的是動作、節次、訓練日與週期，未把中週期列為唯一或固定的適用層級。
