  - id: ch21.competition-period.i07
    q: 競賽期的專項訓練如何影響體能訓練時間？
    a:
    - 運動專項技能與戰術練習的時間會大幅增加
    - 阻力訓練等身體體能活動的時間會相應減少
    detail: 這是競賽期負荷管理的情境限制，也是同一賽季不能照搬休季體能課表的原因。
    terms:
    - competitive-period
