- id: periodization-models
  title: 線性 vs 波動週期化模型
  desc: ''
  tag: 模型比較
  items:
  - id: ch21.periodization-models.i01
    q: 為何傳統週期化（traditional periodization）不宜稱為線性？
    a:
    - 傳統阻力訓練模型因中週期強度隨時間漸增，常被錯稱為線性週期化
    - 實際上它在小週期層次及整個中週期中，都有訓練強度與訓練量負荷的非線性變化
    detail: 「線性」是當代文獻常採、但教材認為不精確的標籤；不能只依圖上直線式趨勢判定模型本質。
    terms:
    - traditional-periodization
    - linear-periodization
    - mesocycle
    - microcycle
    - volume-load
    numbers: []
    concepts:
    - periodization
    - program-design
    related:
    - ch21.preparatory-period.i08
    locator: Undulating Versus Linear Periodization Models
  - id: ch21.periodization-models.i02
    q: 每日波動週期化（daily undulating periodization, DUP）的特徵為何？
    a:
    - 在同一小週期內大幅改變核心阻力動作的負荷與訓練量，例如反覆次數與訓練量負荷
    - 同一週不同訓練日的負荷、訓練量與訓練焦點都改變；教材例子依序採六 RM、十 RM、三 RM 負荷，分別對應肌力、肌肥大與爆發力焦點
    detail: 此模型較適合稱為「波動」或「每日波動」，因其大幅變化發生在小週期內的每日訓練，而非只是中週期之間漸進變化。
    terms:
    - daily-undulating-periodization
    - microcycle
    - volume-load
    - repetition-maximum
    numbers:
    - v: 6
      unit: RM
      of: 教材例示每日波動週期化第一個訓練日的負荷
    - v: 10
      unit: RM
      of: 教材例示每日波動週期化下一訓練日的負荷
    - v: 3
      unit: RM
      of: 教材例示每日波動週期化最後訓練日的負荷
    concepts:
    - periodization
    - program-design
    related: []
    locator: Undulating Versus Linear Periodization Models
  - id: ch21.periodization-models.i03
    q: 傳統週期化模型如何在一週內調節負荷？
    a:
    - 傳統模型可在各訓練日維持相同組數與反覆次數、改變訓練負荷
    - 教材例子為各日皆四組六次，負荷依序為 85%、75%、65% 1RM，形成重到輕的安排
    - 即使反覆次數不變，訓練量負荷改變仍使工作負荷與訓練量波動
    detail: 這個例子正是傳統模型也具有非線性變化的證據；原本所稱「序列式發展更系統」不是本節的書中結論。
    terms:
    - traditional-periodization
    - volume-load
    - one-repetition-maximum
    numbers:
    - v: 4
      unit: 組
      of: 教材傳統模型例子每個訓練日的組數
    - v: 6
      unit: 次
      of: 教材傳統模型例子每組的反覆次數
    - v: 85
      unit: '% 1RM'
      of: 教材傳統模型重日的負荷
    - v: 75
      unit: '% 1RM'
      of: 教材傳統模型中等日的負荷
    - v: 65
      unit: '% 1RM'
      of: 教材傳統模型輕日的負荷
    concepts:
    - periodization
    - program-design
    related:
    - ch17.load-repetitions.i06
    locator: Undulating Versus Linear Periodization Models
  - id: ch21.periodization-models.i04
    q: 每日波動模型的支持者如何批評傳統模型？
    a:
    - 支持者主張，傳統模型常見的長期、持續增加訓練強度可能累積神經疲勞
    - 他們將每日波動模型的優點之一描述為沒有這種累積的神經疲勞
    detail: 這是每日波動模型支持者的立場，教材並未在此把「神經疲勞」當成傳統模型必然發生的結果。
    terms:
    - daily-undulating-periodization
    - traditional-periodization
    numbers: []
    concepts:
    - periodization
    - program-design
    related:
    - ch05.overtraining.i01
    locator: Undulating Versus Linear Periodization Models
  - id: ch21.periodization-models.i05
    q: 每日波動模型與傳統模型的每日變項差異為何？
    a:
    - 每日波動模型在小週期內同時改變負荷、訓練量與訓練焦點
    - 傳統模型的例子則維持各日相同組數與反覆次數，主要改變訓練負荷
    detail: 兩者的區別是負荷、訓練量與焦點改變的方式，不是「波動模型一定較有效」的結論。
    terms:
    - daily-undulating-periodization
    - traditional-periodization
    - microcycle
    - volume-load
    numbers: []
    concepts:
    - periodization
    - program-design
    related:
    - ch17.principles-exam-tips.i04
    locator: Undulating Versus Linear Periodization Models
  - id: ch21.periodization-models.i06
    q: 傳統模型的支持者如何批評每日波動模型？
    a:
    - 他們認為每日波動模型的高訓練量負荷會造成較多周邊疲勞與代謝疲勞
    - 與運動專項訓練併行時，可能提高傷害風險
    - 較高訓練量負荷的節次所累積的疲勞，也可能降低運動員準備狀態
    detail: 這同樣是模型論辯的一方觀點；教材用「可能」描述風險，不能刪去條件或改成已確定的因果。
    terms:
    - daily-undulating-periodization
    - traditional-periodization
    - fitness-fatigue-paradigm
    - preparedness
    numbers: []
    concepts:
    - periodization
    - program-design
    related:
    - ch05.overtraining.i01
    locator: Undulating Versus Linear Periodization Models
  - id: ch21.periodization-models.i07
    q: 研究對每日波動與傳統週期化模型的比較結論為何？
    a:
    - 有些研究認為波動模型比傳統模型有效
    - 另一些證據認為兩者沒有差異，也有研究認為傳統模型較佳
    detail: 本章只呈現研究證據互相矛盾，未據此給出應依運動員個別條件選某模型的處方規則。
    terms:
    - daily-undulating-periodization
    - traditional-periodization
    numbers: []
    concepts:
    - periodization
    - program-design
    related: []
    locator: Undulating Versus Linear Periodization Models
  - id: ch21.periodization-models.i08
    q: 週期化的核心原則如何看待「線性」？
    a:
    - 週期化的核心信條是從訓練中去除線性（removal of linearity）
    - 因此不論當代文獻採用何種模型名稱，傳統模型本身也包含結構化的負荷與訓練量波動
    detail: 「去除線性」是本節原文立場；它不是要求所有變項每天都必須大幅波動。
    terms:
    - periodization
    - traditional-periodization
    - linear-periodization
    numbers: []
    concepts:
    - periodization
    - program-design
