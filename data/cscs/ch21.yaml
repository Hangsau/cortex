    locator: Periodization Periods > First Transition Period > Strength/Power Phase
  - id: ch21.competition-period.i04
    q: 競賽期（competitive period）的訓練目標如何平衡？
    a:
    - 以進一步提高訓練強度、降低訓練量來準備競賽，並持續發展肌力與爆發力
    - 需要兼顧保留足夠適能與降低疲勞；訓練量、強度或兩者降得過多，都會降低競賽準備狀態
    detail: 專項技能與戰術練習在此期增加，會相應壓縮阻力訓練等體能活動時間；因此不是只靠單一阻力訓練變項就能調好準備狀態。
    terms:
    - competitive-period
    - fitness-fatigue-paradigm
    - preparedness
    - training-intensity
    - volume
    numbers: []
    concepts:
    - periodization
    related:
    - ch17.training-frequency.i08
    - ch19.program-design-monitoring.i01
    - ch20.periodization.i03
    locator: Periodization Periods > Competitive Period
  - id: ch21.competition-period.i05
    q: 巔峰調整（peaking）的處方與期限為何？
    a:
    - 使用 50% 至至少 93% 1RM 的強度，採極低訓練量：每動作一至三組、每組一至三次
    - 巔峰計畫約為一至二週，目標是在競賽前的漸減訓練中降低疲勞
    - 嘗試延長到更久，最終會因適能降低或可能過度訓練而使表現能力下降
    detail: 50% 至至少 93% 1RM 是隨巔峰計畫進程的範圍，不能解讀成運動員在每一堂課同時使用兩端負荷。
    terms:
