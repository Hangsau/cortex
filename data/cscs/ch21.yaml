    - ch12.terminology.i05
    locator: Periodization Periods > Preparatory Period
  - id: ch21.preparatory-period.i02
    q: 一般備賽相（general preparatory phase）的特徵為何？
    a:
    - 位於備賽期早段，目標是建立一般身體基礎
    - 使用高訓練量、低訓練強度與較多樣的訓練手段，發展一般動作能力與技能
    - 阻力訓練對應的早段可安排肌肥大／肌力耐力相
    detail: 此期的運動體能活動可不具專項性；運動專項性會隨進入特殊備賽相而在數週內提高。
