  - id: ch21.preparatory-period.i04
    q: 肌肥大／肌力耐力相（hypertrophy/strength endurance phase）的處方與目標為何？
    a:
    - 屬於備賽期早段的一般備賽相，採低至中強度（50–75% 1RM）與高訓練量（三至六組、每組八至二十次）
    - 目標可為增加瘦體重、建立肌肉與代謝耐力基礎，或兩者兼顧
    detail: 肌力／爆發力運動員可優先追求肌肥大和肌力耐力；耐力運動員則以不顯著增加肌肥大的前提下提高肌力耐力為目標。
