id: ch21
weight: 21
title: Ch.21 週期化訓練 Periodization
topics:
- id: active-rest
  title: 第二轉換期（主動休息）
  desc: ''
  tag: Postseason
  items:
  - id: ch21.active-rest.i01
    q: 時機
    a:
    - 競賽期結束後、下一年備賽期開始前
    - 連結兩個大週期或年度計畫的橋樑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.active-rest.i02
    q: 持續時間
    a:
    - 建議1-4週
    - 不應超過4週
    - 若因傷需要延長則例外
    - 過長→去適應→下一年需更長GPP
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.active-rest.i03
    q: 主動休息的內容
    a:
    - 休閒性活動（排球、游泳、羽球等）
    - 非常低強度、低量
    - 無正式結構化訓練課程
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.active-rest.i04
    q: 目的
    a:
    - 生理上：復健傷病、恢復疲勞
    - 心理上：從長賽季的精神壓力中放鬆、重啟動力
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.active-rest.i05
    q: 避免太快高強度訓練
    a:
    - 剛結束競賽期後應避免立即進行積極訓練
    - 讓身體與心理都有充分復原空間
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.active-rest.i06
    q: 去適應風險
    a:
    - 賽後期越長，去適應越多
    - 下一年備賽期需要更長的一般備賽相來恢復運動能力
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.active-rest.i07
    q: 次要用途：減量週
    a:
    - Active rest 概念也可用於長期訓練相/期之間插入1週減量
    - 降低過度訓練風險
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.active-rest.i08
    q: 阻力訓練建議
    a:
    - 若做阻力訓練，量極低（30-85% 1RM）、非專項動作
    - 維持基礎動作模式即可
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: competition-period
  title: 第一轉換期與競賽期
  desc: ''
  tag: Preseason→In
  items:
  - id: ch21.competition-period.i01
    q: 第一轉換期角色
    a:
    - 連結備賽期與競賽期
    - 對應季前（preseason）
    - 訓練聚焦肌力轉化為爆發力
    - 末週減量
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.competition-period.i02
    q: 肌力/爆發力相
    a:
    - 強度：30-95% 1RM（視動作而定）
    - 量：2-5組×2-5下
    - 爆發動作負荷視動作選擇而定
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.competition-period.i03
    q: 爆發動作負荷特殊性
    a:
    - 爆發力動作不遵循標準%RM-反覆次數關係
    - 如懸掛式抓舉以50-70% 1RM最大化爆發力輸出
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.competition-period.i04
    q: 競賽期目標
    a:
    - 維持強度、降低量
    - balance between fitness retention vs fatigue reduction
    - 強度↑量↓
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.competition-period.i05
    q: 巔峰（Peaking）
    a:
    - 強度：50%~>93% 1RM
    - 量：1-3組×1-3下
    - 持續1-2週
    - 巔峰無法長期維持（超過7-14天即衰退）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.competition-period.i06
    q: 維持（Maintenance）
    a:
    - 團隊運動整季需要
    - 強度：85-93% 1RM
    - 量：~2-5組×3-6下
    - 依賽程在小週期內微調
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.competition-period.i07
    q: 專項技術比重↑
    a:
    - 競賽期專項技術與戰術練習大幅增加
    - 體能訓練（含阻力訓練）時間相對減少
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.competition-period.i08
    q: 長賽季策略
    a:
    - 長賽季（12-16週）：以3-4週中週期為塊
    - 末週減量→超補償→重要比賽前達峰值狀態
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: fitness-fatigue
  title: Fitness–Fatigue 典範
  desc: ''
  tag: Zatsiorsky
  items:
  - id: ch21.fitness-fatigue.i01
    q: 兩大後效
    a:
    - 每次訓練產生適能（fitness）與疲勞（fatigue）兩種後效
    - 兩者加總決定準備狀態（preparedness）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.fitness-fatigue.i02
    q: 高訓練量時
    a:
    - 適能↑但疲勞同步↑
    - 疲勞掩蓋適能→準備狀態↓
    - 表現暫時下降是正常現象
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.fitness-fatigue.i03
    q: 低訓練量時
    a:
    - 疲勞少、適能增加有限→準備狀態仍低
    - 過度減量亦無法優化表現
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.fitness-fatigue.i04
    q: 疲勞消散快於適能
    a:
    - 關鍵特性：fatigue dissipates faster than fitness
    - 減量後準備狀態升高，即 tapering 原理
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.fitness-fatigue.i05
    q: 訓練負荷排序的重要性
    a:
    - 訓練負荷的排列順序（sequencing）影響準備狀態
    - 系統性變化量是週期化的核心操作
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.fitness-fatigue.i06
    q: 個別因子各有曲線
    a:
    - 各訓練因子（肌力、爆發、耐力）各有自己的 fitness/fatigue/preparedness 曲線，非單一條
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.fitness-fatigue.i07
    q: 殘留效果的應用
    a:
    - 前期訓練的殘留適能可被後期利用
    - 序列週期化的理論基礎之一
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.fitness-fatigue.i08
    q: 與DUP的關聯
    a:
    - 波動模型（DUP）高量訓練可能使疲勞累積，降低準備狀態
    - 有過度訓練風險（高階運動員）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: gas-theory
  title: GAS 一般適應症候群
  desc: ''
  tag: 理論基礎
  items:
  - id: ch21.gas-theory.i01
    q: 警覺期 Alarm
    a:
    - 接觸新/更強刺激時的初期反應
    - 疲勞、酸痛、表現↓
    - 可持續數小時至數週
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.gas-theory.i02
    q: 抵抗期 Resistance
    a:
    - 身體適應刺激，恢復正常功能
    - 若訓練適當→超補償，表現超越基線
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.gas-theory.i03
    q: 疲憊期 Exhaustion
    a:
    - 壓力持續過久→無法適應
    - 症狀類似警覺期
    - 過度訓練（overtraining）前兆
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.gas-theory.i04
    q: 超補償 Supercompensation
    a:
    - 抵抗期後表現超越原基線的新高點
    - 週期化的核心目標
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.gas-theory.i05
    q: 刺激計時的重要性
    a:
    - 在超補償窗口施予下一次訓練→累積適應
    - 太早→疲勞累積
    - 太晚→適應消退回基線
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.gas-theory.i06
    q: 應用於訓練設計
    a:
    - GAS 為週期化設計提供理論依據
    - 各層級週期（小/中/大週期）均遵循此原理
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: periodization-hierarchy
  title: 週期化層級結構
  desc: ''
  tag: Hierarchy
  items:
  - id: ch21.periodization-hierarchy.i01
    q: 多年計畫（2-4年）
    a:
    - 最廣但最不詳細
    - 如大學球員4年發展計畫
    - 設定各年主要目標與里程碑
    - 奧運週期＝四年計畫
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-hierarchy.i02
    q: 年計畫 Annual Plan
    a:
    - 依運動項目含1個或多個大週期
    - 包含備賽期、競賽期、轉換期
    - 是訓練年的整體藍圖
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-hierarchy.i03
    q: 大週期 Macrocycle
    a:
    - 數月～1年
    - 單一賽季運動（如美式足球）＝1個大週期
    - 雙賽季（如田徑）＝2個大週期
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-hierarchy.i04
    q: 中週期 Mesocycle
    a:
    - 2-6週
    - 最常見4週
    - 每個大週期含多個中週期
    - 各有不同訓練目標與優先順序
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-hierarchy.i05
    q: 小週期 Microcycle
    a:
    - 數天～2週
    - 最常見7天（1週）
    - 由多個訓練日組成
    - 是日常訓練安排的操作單位
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-hierarchy.i06
    q: 訓練日 Training Day
    a:
    - 1天
    - 可含多個訓練節次（sessions）
    - 在所屬小週期的脈絡下設計
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-hierarchy.i07
    q: 訓練節次 Session
    a:
    - 數小時
    - 若兩訓練間休息>30分鐘則視為兩個 session
    - 是最小的計畫單位
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-hierarchy.i08
    q: 由廣到精的設計邏輯
    a:
    - 年計畫設定方向→大週期定結構→中週期選手段→小週期排課表
    - 越細越具體
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: periodization-models
  title: 線性 vs 波動週期化模型
  desc: ''
  tag: 模型比較
  items:
  - id: ch21.periodization-models.i01
    q: 傳統模型（誤稱線性）
    a:
    - 中週期間量↓強度↑
    - 但小週期內仍有非線性波動（重日/輕日）
    - 嚴格來說非真正線性
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-models.i02
    q: DUP 每日波動週期化
    a:
    - 同一週內每次訓練的組數、反覆、強度和目標均不同
    - 如週一6RM、週四10RM、週六3RM
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-models.i03
    q: 傳統模型優勢
    a:
    - 序列式發展肌力→爆發力更系統
    - 符合GAS與fitness-fatigue的理論邏輯
    - 殘留效果可疊加
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-models.i04
    q: 傳統模型風險
    a:
    - DUP支持者指出：傳統模型持續高強度累積神經疲勞（neural fatigue）
    - 可能限制爆發力表現
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-models.i05
    q: DUP優勢
    a:
    - 每日目標不同避免神經疲勞累積
    - 訓練多樣性高
    - 有研究顯示比傳統模型更有效
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-models.i06
    q: DUP風險
    a:
    - 高量訓練產生更多代謝疲勞
    - 與專項訓練並行時受傷風險↑
    - 可能影響高階選手的準備狀態
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-models.i07
    q: 研究結論分歧
    a:
    - 部分研究：DUP>傳統
    - 部分：無差異
    - 部分：傳統>DUP
    - 目前尚無定論，需視運動員個別情況
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.periodization-models.i08
    q: 週期化核心原則
    a:
    - 週期化的核心是「去除線性」（removal of linearity）
    - 任何模型都需要有系統的負荷波動，非單調遞增
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: preparatory-period
  title: 備賽期 Preparatory Period
  desc: ''
  tag: Off-Season
  items:
  - id: ch21.preparatory-period.i01
    q: 時機與特性
    a:
    - 無比賽
    - 技術與專項訓練極少
    - 對應休賽季（off-season）
    - 建立後續高強度訓練的耐受基礎
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.preparatory-period.i02
    q: 一般備賽相（GPP）
    a:
    - 高量、低強度
    - 多樣化訓練手段
    - 發展一般運動能力與技能
    - 對應肥大/肌力耐力相
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.preparatory-period.i03
    q: 特殊備賽相（SPP）
    a:
    - 在GPP基礎上，增加專項性訓練比重
    - 為競賽期做準備
    - 對應基礎肌力相
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.preparatory-period.i04
    q: 肥大/肌力耐力相
    a:
    - 強度：50-75% 1RM
    - 量：3-6組×8-20下
    - 目標：↑瘦體重、肌耐力、代謝基礎
    - 對應GPP
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.preparatory-period.i05
    q: 基礎肌力相
    a:
    - 強度：80-95% 1RM
    - 量：2-6組×2-6下
    - 目標：強化主要動作鏈肌力
    - 對應SPP
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.preparatory-period.i06
    q: 初學者 vs 進階者
    a:
    - 初學者：低強度起始，緩慢提升
    - 進階者：需更高量與強度、更多變化才能持續適應
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.preparatory-period.i07
    q: 每日訓練變化
    a:
    - 整個備賽期仍需每日變化強度與訓練量，以促進恢復
    - 期末常安排減量週（unloading）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.preparatory-period.i08
    q: 非週期特性
    a:
    - 雖圖示看起來線性，實際上量與強度在微/中週期層次是非線性波動的，非真正線性週期化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: sfra-theory
  title: 刺激-疲勞-恢復-適應理論
  desc: ''
  tag: SFRA理論
  items:
  - id: ch21.sfra-theory.i01
    q: SFRA 核心概念
    a:
    - 訓練刺激→疲勞↑→恢復→適應（超補償）
    - 量↑則疲勞↑、恢復延遲、超補償幅度↑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch21.sfra-theory.i02
    q: 訓練量與疲勞的關係
    a:
    - 訓練量↑→疲勞↑→恢復延遲→超補償
    - 量過少→適應↓
    - 量過多→無法恢復→退步
