cards:
- q: 週期化（periodization）的定義為何？議建者是誰？
  a: 週期化是系統性、順序性地安排訓練介入的理論與實踐構造，以誘發特定生理適應並對準特定時間點達到峰展表現；Matveyev 在 1960 年代提出基礎理論，另有 Bompa、Nádori、Verkoshansky 同期探索。
  tag: periodization-definition
- q: 週期化的中心目標為何？
  a: 管理適應反應、累積疲勞與後續效應，以避免表現平台期或過度訓練；同時安排訓練介入，使選手在最重要的比賽時間點達到峰值狀態。
  tag: periodization-goals
- q: 一般適應綜合徵（GAS）的三階段為何？
  a: GAS（Selye, 1956）：1. 警報階段（alarm）——初次接觸新壓力，疲勞累積、表現下降；2. 抵抗階段（resistance）——身體適應刺激，恢復正常功能並可能出現超補償；3. 衰竭階段（exhaustion）——壓力持續過久，無法繼續適應，出現類似警報期的症狀。
  tag: gas-three-stages
- q: 超補償（supercompensation）的定義與如何應用至週期化？
  a: 在抵抗階段中，若訓練刺激適當且未過度，身體適應後的表現能力將超越訓練前基線水準；週期化的目標之一，是在超補償高點施予下一階段的訓練刺激，逐步提升選手能力。
  tag: supercompensation
- q: 刺激—疲勞—恢復—適應理論（SFRA）的核心要點為何？
  a: 訓練刺激的整體負荷量越大，疲勞累積越多、恢復延遲越長、超補償幅度越大；若無新刺激，身體將出現去適應（involution）；訓練程度較高的選手不一定需完全恢復後才能給予新刺激。
  tag: sfra-theory
- q: 體能—疲勞範式（fitness-fatigue paradigm）的基本原則為何？
  a: 每次訓練同時產生體能與疲勞兩種後效應；準備度由兩者加總決定；關鍵特性是疲勞消散速率快於體能，因此適當降低訓練量可在保持體能的同時降低疲勞，提升準備度。
  tag: fitness-fatigue-paradigm
- q: 週期化結構的層級由大至小排列為何？
  a: 多年計畫（2-4 年）→ 年度訓練計畫（1 年）→ 大週期（macrocycle，數月至一年）→ 中週期（mesocycle，2-6 週）→ 小週期（microcycle，通常 7 天）→ 訓練日 → 訓練節次（session）。
  tag: periodization-hierarchy
- q: 中週期（mesocycle）的典型長度與功能為何？
  a: 中週期最常見期間為 4 週，範圍 2-6 週；由多個相連的小週期組成；各中週期有各自的訓練目標與優先項目，共同構成大週期的訓練結構。
  tag: mesocycle-definition
- q: 小週期（microcycle）的典型長度為何？
  a: 小週期通常持續數天至 2 週，最常見為 1 週（7 天）；由多個訓練日組成；小週期內透過重、中、輕日交替安排，以管理疲勞與恢復。
  tag: microcycle-definition
- q: 週期化的四個訓練期構成正確順序為何？
  a: 准備期 (preparatory) → 第一轉換期 (first transition) → 競賽期 (competitive) → 第二轉換期 (second transition / active rest)；對應運動對抗期為淡季、賽前、賽季、後賽。
  tag: four-training-periods
- q: 准備期（preparatory period）的目標與兩個子階段為何？
  a: 目標為建立基礎體能，對應淡季；兩子階段：一般准備階段（general preparatory）—高訓練量、低強度、多種訓練手段；特殊准備階段（specific preparatory）—轉向特項訓練，建立更高強度的基礎。
  tag: preparatory-period
- q: 肌肉肥大／肌肉耐力階段（hypertrophy/strength endurance phase）的訓練處方為何？
  a: 強度 50-75% 1RM，訓練量高；組數 3-6 組，每組 8-20 次；主要目標是增加瘦體重（力量型選手）或建立肌耐力與代謝基礎（耐力型選手），為後續高強度訓練打底。
  tag: hypertrophy-strength-endurance-phase
- q: 基礎肌力階段（basic strength phase）的訓練處方為何？
  a: 強度 80-95% 1RM，訓練量中至高；組數 2-6 組，每組 2-6 次；目標是強化對主要運動動作最重要的肌群；訓練動作在特殊備賽階段變得更具專項性（如深蹲、爆發上拉）。
  tag: basic-strength-phase
- q: 第一轉換期內肌力／爆發力階段（strength/power phase）的訓練處方為何？
  a: 負荷 30-95% 1RM（依動作性質而定），訓練量低；組數 2-5 組，每組 2-5 次；爆發力動作的最佳負荷不遵循典型 %RM-反覆數關係，需依具體動作決定；採大負荷訓練與低負荷爆發力訓練並行的混合模式。
  tag: strength-power-phase
- q: 競賽期的峰值計畫（peaking program）訓練處方為何？
  a: 強度 50% 至 ≥93% 1RM，訓練量極低；組數 1-3 組，每組 1-3 次；持續 1-2 週；透過降低疲勞使選手達到最佳準備度；維持超過 2 週將因體能下降而無效。
  tag: peaking-program
- q: 競賽期的維持計畫（maintenance program）適用於哪種情境？
  a: 適用於競賽季長達數月的團隊運動（如籃球）；強度 85-93% 1RM，訓練量中等（約 2-5 組，3-6 次）；在小週期層次依比賽與旅行行程調整訓練負荷。
  tag: maintenance-program
- q: 第二轉換期（second transition / active rest）的內容與建議期間為何？
  a: 對應後賽期，通常持續 1-4 週；目的是讓選手從賽季的生理與心理壓力中復原，並進行傷害復健；不應進行正式結構化訓練；期間越長，下一年度準備期需越長；一般不超過 4 週。
  tag: second-transition-active-rest
- q: 淡季與週期化準備期的對應關係為何？
  a: 淡季對應週期化准備期；進行一般准備（hypertrophy/strength endurance）和特殊准備（basic strength）階段的中週期輪轉；最實際的基礎體能建立就是在淡季完成。
  tag: off-season-periodization-link
- q: 賽前期與週期化第一轉換期的對應關係為何？
  a: 賽前期對應第一轉換期，將重點放在肌力⽽爆發力階段；賽前不是建立基礎體能的時機，而是利用淡季基礎上座提升選手準備度。
  tag: preseason-periodization-link
- q: 賽季期對週期化競賽期的設計挑戰是什麼？
  a: 長季 (12-16+ 週) 需將多個中週期對準關鍵對抗安排；訓練量限制且疲勞累積，需小週期層次樣調強度與訓練量；在重要對抗前的最後小週期延少訓練荠荷以發揮超廣轉產。
  tag: in-season-periodization-challenges
- q: 後賽期對週期化第二轉換期的安排原則為何？
  a: 賽季結束就進入主動休止時期；第二轉換期越長，進入下年淡季時需要越長的一般准備階段；一般不高於 4 週，除非傷復需求。
  tag: postseason-periodization-link
- q: 週期化訓練計畫中。訓練量與強度在全年的變化趨勢為何？
  a: 准備期：高量低強度 → 第一轉換：較低量較高強度 → 競賽期：極低量最高強度（峰展）或中量中強（維持） → 第二轉換：極低量低強度。
  tag: volume-intensity-annual-trend
- q: 波動週期化模型（DUP / undulating periodization）的定義與特徵為何？
  a: 日常波動週期化（DUP）：小週期內大幅度調變訓練量與強度；例如週一 6RM（肌力目標）、週四 10RM（肌肉肥大目標）、週六 3RM（爆發力目標）；每次訓練的組數、次數、強度與訓練焦點均不同。
  tag: dup-definition
- q: 傳統週期化模型為何被誤標為「線性週期化」？
  a: 傳統模型在中週期間逐步遞增強度，外觀似乎線性；但小週期內有重、中、輕日的循環變化，訓練量也隨之波動，實質上是非線性的；將其稱為「線性」是對傳統模型的誤解。
  tag: linear-periodization-misnomer
- q: DUP 模型與傳統週期化模型的核心爭議為何？
  a: DUP 支持者認為其優點是避免長期持續高強度所累積的神經疲勞；傳統模型支持者則指出，DUP 的高訓練量可能產生更多代謝疲勞，與專項訓練並行時受傷風險較高，且可能因疲勞累積降低高水平選手的準備度。
  tag: dup-vs-traditional-debate
- q: 減量週（unloading week）在週期化中的功能為何？
  a: 降低中週期內的訓練量與強度，讓身體充分恢復並發生超補償；通常安排於每個中週期結束前，也可在長期訓練階段之間或重要比賽前插入，以降低過度訓練風險。
  tag: unloading-week
- q: 多年訓練計畫的定義與用途為何？
  a: 涵蓋 2-4 年的最高層次計畫（4 年計畫稱為 quadrennial plan）；設定長期發展目標與各年度里程碑；年度計畫（annual training plan）則在其框架下負責更詳細的實施方案。
  tag: multiyear-plan
- q: 高程度訓練選手的週期化訓練與初學者的主要差異為何？
  a: 高程度選手已接近能力上限，適應窗口更小，需要更大的訓練變化量及更高的訓練量與強度才能持續進步；對初學者有效的刺激負荷，對高程度選手而言充其量只是維持訓練。
  tag: advanced-vs-novice-periodization
- q: 週期化計劃中監控訓練變數的重要性為何？
  a: 疲勞累積與恢復狀態需持續監測，以確保訓練負荷安排得當；監控結果可用於在小週期層次調整訓練強度與訓練量，避免過度訓練並在重要比賽前達到最佳準備度。
  tag: periodization-monitoring
- q: 殘留訓練效應（residual training effects）對週期化的意義為何？
  a: 前一訓練期產生的體能適應效果可延續並影響後續訓練期的準備度；序列週期化模型（sequential periodization）即利用此原理，讓前期建立的肌力、爆發力基礎在後期訓練中得到延伸與轉化。
  tag: residual-training-effects
- q: 週期化計劃中大週期（macrocycle）的長度與結構為何？
  a: 大週期持續數月至一年；包含準備期、競賽期與轉換期；單一賽季項目（如美式足球）對應一個大週期，雙賽季項目（如大學田徑的室內與室外賽）則對應兩個大週期。
  tag: macrocycle-structure
- q: 競賽期訓練平衡的核心挑戰是什麼？
  a: 若訓練量或強度降低太多，疲勞雖減少，但體能也隨之下降，導致競賽準備度降低；反之，訓練量過高則疲勞累積；同時，競賽期專項技術與戰術練習大幅增加，體能訓練時間相對壓縮。
  tag: competitive-period-balance
- q: 非訓練壓力源（non-training stressors）如何影響週期化計畫？
  a: 職業壓力、睡眠不足、人際關係、飲食不良等非訓練因素均會累加至整體壓力負荷；制訂訓練負荷時需將這些額外壓力納入考量，強調的是整體壓力管理，而非單純的訓練壓力管理。
  tag: non-training-stressors
- q: 不同運動項目的年度訓練計畫結構如何因競賽季長度而不同？
  a: 單一賽季項目（如美式足球）對應一個大週期；雙賽季項目（如大學田徑的室內與室外賽）對應兩個大週期；競賽季越長（如籃球），賽季期管理越複雜，需以 3-4 週中週期為塊並在末週減量。
  tag: annual-plan-flexibility
- q: 殘留訓練效應（residual training effects）在週期化中的應用為何？
  a: 前一訓練期的體能、疲勞、準備度後效應可影響後續訓練期的表現；序列週期化（sequential periodization）模型正是利用這個原理，讓前期建立的適應效果延續至下一期，作為進階訓練的基礎。
  tag: readiness-signs-periodization
- q: 週期化計畫全年的訓練量與強度整體變化趨勢為何？
  a: 準備期：高量低強度 → 第一轉換期：低量高強度 → 競賽期：極低量最高強度（峰值）或中量中強度（維持）→ 第二轉換期：極低量低強度；小週期層次在各期內仍有波動，非完全線性。
  tag: volume-intensity-periodization-phases
- q: 週期化訓練相較於非週期化訓練的主要優勢為何？
  a: 週期化透過系統性安排訓練負荷，有助於管理疲勞累積、避免表現停滯期、降低過度訓練風險；研究顯示週期化訓練對長期肌力與爆發力提升的效率優於非週期化訓練。
  tag: periodization-research-evidence
- q: 準備期阻力訓練動作選擇的原則為何？
  a: 一般備賽階段：動作不需具高度專項性，目標是發展多元基礎體能；特殊備賽階段：動作逐漸轉向更具專項性（如深蹲、爆發上拉），準備選手進入競賽期的高強度訓練。
  tag: preparatory-exercise-selection
- q: 重訓練日與輕訓練日在週期化小週期中如何布局？
  a: 小週期內將重訓練日、中等訓練日和輕訓練日交替排列；主要組合如週一假設重天、週三中天、週五輕天，讓身體將這些輕重訓練日產生的疲勞對訓練水平總和。
  tag: heavy-light-microcycle
- q: 爆發力動作的負荷選擇原則為何？
  a: 爆發力動作的最佳負荷不遵循典型 %RM-反覆數關係，需依動作性質決定；例如懸掛式抓舉（hang power clean）以約 80% 1RM 可最大化爆發力輸出，而臥推拋（bench press throw）則以 50-70% 1RM 為佳。
  tag: power-athlete-periodization
- q: 賽季期阻力訓練量降低的原因與做法為何？
  a: 競賽季選手需大量時間進行比賽與專項技術練習；阻力訓練時間降低至每次 30 分鐘、每週 1-3 次；採波動模式調整訓練量與強度，在重要比賽前的小週期末週降低負荷以減少疲勞。
  tag: in-season-strength-training
- q: 週期化計畫中爆發力動作的負荷安排原則為何？
  a: 爆發力動作（如爆發上拉）的負荷不遵循標準 %RM-反覆數關係；需採混合訓練模式，同時使用大負荷動作（優化最大肌力）與低負荷爆發動作（優化爆發力輸出），兩者並行以同時發展肌力與爆發力。
  tag: power-exercise-loading-principle
- q: 比賽前訓練日的主要目標為何？
  a: 比賽前數天設定低強度訓練，確保充分恢復；訓練量與強度的調整方式需依比賽日程而定，目的是在降低疲勞的同時保持體能，使選手在比賽當天達到最佳準備度。
  tag: competition-day-training-design
- q: 年度訓練計畫範例中，女子大學籃球中鋒的賽前期訓練內容為何？
  a: 賽前期約 3.5 個月（八月中至十一月初），阻力訓練每週 3 次，聚焦肌力與爆發力；此階段為第一轉換期，增強式訓練與速度訓練的優先順序提升，阻力訓練內容詳見第 17 章。
  tag: annual-plan-example-basketball
- q: 年度訓練計畫範例中，女子大學籃球中鋒的淡季訓練安排為何？
  a: 淡季（備賽期）約 14 週（五月初至八月初）；第一週先進行測試確定訓練負荷；之後依序進行肌肉肥大／肌力耐力和基礎肌力等中週期；此為建立基礎體能、為後續高強度訓練打底的關鍵時期。
  tag: basketball-off-season-program
- q: 週期化計畫中最常見的錯誤是什麼？
  a: 最常見錯誤：將賽前期用於建立基礎體能（應在淡季完成）；賽季中訓練負荷調整不當導致疲勞累積；未統整運動教練與體能訓練計畫，使選手的整體訓練壓力無法被有效管理。
  tag: periodization-common-mistakes
- q: 週期化計畫中體能訓練師與運動教練的協作為何重要？
  a: 體能訓練專業人員與運動教練需共同設定目標與策略，才能整合選手所有訓練因素、有效管理疲勞與恢復；若體能計畫與運動訓練計畫不協調，選手難以在適當時間點達到峰值。
  tag: periodization-coach-cooperation
- q: 週期化計畫如何因選手個別需求進行調整？
  a: 週期化不應強行套用固定模型；選手的訓練年齡、專項需求、年度競賽安排等因素均影響計畫結構；不同運動或不同選手，可能需要對基本模型進行程度不一的調整。
  tag: periodization-individualization
- q: 週期化計畫中常用哪些測試方式評估訓練成效？
  a: 常見測試包括：1RM 測試、跳躍測定（垂直跳）、短跑計時等；測試結果提供選手訓練負荷的評估依據，並可驗證各中週期的訓練模式效果，供下一中週期調整參考。
  tag: periodization-testing-protocols
- q: 小週期內如何在準備期、競賽期與轉換期之間調節訓練強度與量？
  a: 每個大週期時期內，小週期層次仍維持重日（high）、中日（moderate）、輕日（low）的交替安排；此結構確保在整體量／強度依期別趨勢變化的同時，局部疲勞與恢復也得到管理。
  tag: periodization-microcycle-modulation
- q: 週期化全年計畫中訓練量與強度的整體配置邏輯為何？
  a: 準備期高量低強度打底 → 第一轉換期低量高強度轉化肌力為爆發力 → 競賽期在極低量下維持或達到最高強度 → 第二轉換期極低量低強度恢復；此序列使體能得以逐步建立並在賽季峰值釋放。
  tag: annual-plan-volume-intensity-pattern
- q: 長賽季（如 20 週）的週期化設計挑戰是什麼？如何應對？
  a: 長賽季頻繁比賽且疲勞持續累積；應對策略：以 3-4 週為一個中週期塊，在末週降低負荷讓選手在重要比賽前達到超補償；同時透過波動強度的維持計畫維持整體體能水準。
  tag: long-season-periodization-challenges
