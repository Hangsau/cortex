- id: fitness-fatigue
  title: Fitness–Fatigue 典範
  desc: ''
  tag: Zatsiorsky
  items:
  - id: ch21.fitness-fatigue.i01
    q: 適能—疲勞典範（fitness–fatigue paradigm）的兩種訓練後效為何？
    a:
    - 每次訓練動作、節次或週期都會產生適能（fitness）與疲勞（fatigue）後效
    - 兩種後效的合計影響運動員的準備狀態（preparedness）
    detail: 此典範是以後效的合計解釋當下準備狀態，不是把適能或疲勞其中一項單獨當作表現能力。
    terms:
    - fitness-fatigue-paradigm
    - preparedness
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch21.sfra-theory.i01
    locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  - id: ch21.fitness-fatigue.i02
    q: 訓練負荷最高時，適能、疲勞與準備狀態如何變化？
    a:
    - 適能會提高，但高訓練負荷同時會使疲勞增加
    - 兩者合計時，疲勞會使準備狀態降低
    detail: 教材談的是「準備狀態」降低，沒有在此斷言每位運動員的實測比賽表現必然暫時下降。
    terms:
    - fitness-fatigue-paradigm
    - preparedness
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch04.program-design.i07
    locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  - id: ch21.fitness-fatigue.i03
    q: 訓練工作負荷低時，為何準備狀態仍可能低？
    a:
    - 低工作負荷只會產生很少疲勞，但也只發展極少適能
    - 因此準備狀態仍會偏低
    detail: 本節的論點是低負荷造成「少疲勞、少適能」的雙重結果；沒有把它等同於所有形式的減量訓練。
    terms:
    - fitness-fatigue-paradigm
    - preparedness
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch06.detraining.i08
    locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  - id: ch21.fitness-fatigue.i04
    q: 適能—疲勞典範中，疲勞消散速率有何特性？
    a:
    - 疲勞比適能消散得更快
    - 若採取能保留適能並降低疲勞的適當策略，準備狀態即可提高
    detail: 這是安排負荷順序的生理依據；教材沒有在這一段指定某一種減量幅度或天數。
    terms:
    - fitness-fatigue-paradigm
    - preparedness
    - recovery
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch06.detraining.i08
    - ch21.competition-period.i05
    locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  - id: ch21.fitness-fatigue.i05
    q: 為何訓練負荷的排序（sequencing）重要？
    a:
    - 負荷的排序能使工作負荷以系統方式變化
    - 因此可影響準備狀態
    detail: 週期化並不只是把負荷加大；其意義在於以排序與變化同時管理適能和疲勞後效。
    terms:
