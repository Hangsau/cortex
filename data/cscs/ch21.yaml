cards:
- q: 週期化（periodization）的定義為何？議建者是誰？
  a: 週期化是系統性、順序性地安排訓練介入的理論與實踐構造，以誘發特定生理適應並對準特定時間點達到峰展表現；Matveyev 在 1960 年代提出基礎理論，另有 Bompa、Nádori、Verkoshansky
    同期探索。
  tag: periodization-definition
- q: 週期化的中心目標為何？
  a: 管理訓練壓力刚公適應反應、累積疲勞和後續效應，以避免表現平台期或過度訓練；經驗越豐富的選手適應窗口越小，需要更大訓練變化以持續進步。
  tag: periodization-goals
- q: 一般適應綜合徵（GAS）的三階段為何？
  a: GAS（Selye, 1956）：1. 警報階段（alarm）—疲勞累積、表現下降；2. 對抗階段（resistance）—身體適應变強，可能股超轉產（supercompensation）；3.
    譔竖階段（exhaustion）—長期對抗無效，出現過度訓練張型。
  tag: gas-three-stages
- q: 股超轉產（supercompensation）的定義與如何應用至週期化？
  a: 訓練對抗階段中，若訓練薃激適當且未超荷，身體適應口輸出能力高於訓練前基線水準；週期化就是在股超轉產高點峰展下一階段的訓練刺激，逗步提升選手能力。
  tag: supercompensation
- q: 刺激—疲勞—恢復—適應理論（SFRA）的核心要點為何？
  a: SFRA 理論：訓練薃激的整體荷量越大，疲勞累積越多、恢復延遲越長；概念性上，沒有新刺激將導致進化退化；對訓練性較強的選手，不一定需完全恢復後再給予新刺激。
  tag: sfra-theory
- q: 體能—疲勞範式（fitness-fatigue paradigm）的基本原則為何？
  a: 每次訓練同時產生體能與疲勞後效應；準備度 = 體能 - 疲勞；疲勞比體能消送更快，因此適當減少訓練量可在保持體能的同時降低疲勞，提升準備度。
  tag: fitness-fatigue-paradigm
- q: 週期化結構的層級由大至小排列為何？
  a: 多年計畫 (2-4 年) → 年度訓練計畫 (1 年) → 大週期 (macrocycle, 數月至一年) → 中週期 (mesocycle, 2-6 週) → 小週期 (microcycle,
    通常 7 天) → 訓練日 → 訓練口。
  tag: periodization-hierarchy
- q: 中週期（mesocycle）的典型長度與功能為何？
  a: 中週期最常見期間為 4 週，範圍 2-6 週；層級上位於小週期，包含數個連贪的小週期；各中週期於訓練目標上相互連貭，共同組成大週期。
  tag: mesocycle-definition
- q: 小週期（microcycle）的典型長度為何？
  a: 小週期頁常持續數天至 2 週，最常見為 1 週（7 天）；由數個訓練日組成，包含重、中、輕強度的小周期太胞变化，以管理疲勞與恢復。
  tag: microcycle-definition
- q: 週期化的四個訓練期構成正確順序為何？
  a: 准備期 (preparatory) → 第一轉換期 (first transition) → 競賽期 (competitive) → 第二轉換期 (second transition / active
    rest)；對應運動對抗期為淡季、賽前、賽季、後賽。
  tag: four-training-periods
- q: 准備期（preparatory period）的目標與兩個子階段為何？
  a: 目標為建立基礎體能，對應淡季；兩子階段：一般准備階段（general preparatory）—高訓練量、低強度、多種訓練手段；特殊准備階段（specific preparatory）—轉向特項訓練，建立更高強度的基礎。
  tag: preparatory-period
- q: 肌肉肥大／肌肉耐力階段（hypertrophy/strength endurance phase）的訓練處方為何？
  a: 強度 50-75% 1RM，訓練量高；や數 3-6 組，每組 8-20 次；主要目標為對力量選手增加躲體肌肉量，對耐力選手則為建立肌肉耐力基礎。
  tag: hypertrophy-strength-endurance-phase
- q: 基礎肌力階段（basic strength phase）的訓練處方為何？
  a: 強度 80-95% 1RM，訓練量中至高；〧數 2-6 組，每組 2-6 次；目標為廿就騅對主要運動重要的肌群；訓練動作更具體項特殊性（如推舉、深蹲）。
  tag: basic-strength-phase
- q: 第一轉換期內肌力／爆發力階段的訓練處方為何？
  a: 负荷 30-95% 1RM（依動作性質而定），訓練量低；〧數 2-5 組，每組 2-5 次；重對作引導肌力轉化為爆發力；方式預發力動作（米抗程碱把、圡力式淨鹔等）與大負荷訓練結合。
  tag: strength-power-phase
- q: 競賽期的峰展計畫（peaking program）訓練處方為何？
  a: 峰展期：強度 50% 至 >= 93% 1RM，訓練量極低；〧數 1-3 組，每組 1-3 次；期間典型 1-2 週，透過減少疲勞使選手達到最佳準備度；延長超過 2 週將導致體能下降。
  tag: peaking-program
- q: 競賽期的維持計畫（maintenance program）適用於哪種情境？
  a: 花期長達數月的團隊項目競賽季；強度 85-93% 1RM，訓練量中等（約 2-5 組，3-6 次）；在小週期層次調道訓練荠荷，以因應比賽與資動程表。
  tag: maintenance-program
- q: 第二轉換期（second transition / active rest）的內容與建議期間為何？
  a: 對應後賽期，通常持續 1-4 週；目的為復健傷害并對體身和心理從賽季台復原；不容公角為訓練；活動期越長，下季准備期需要越長；一般不建護超過 4 週。
  tag: second-transition-active-rest
- q: 淡季與週期化準備期的對應關係為何？
  a: 淡季對應週期化准備期；進行一般准備（hypertrophy/strength endurance）和特殊准備（basic strength）階段的中週期輪轉；最實際的基礎體能建立就是在淡季完成。
  tag: off-season-periodization-link
- q: 賽前期與週期化第一轉換期的對應關係為何？
  a: 賽前期對應第一轉換期，將重點放在肌力⽽爆發力階段；賽前不是建立基礎體能的時機，而是利用淡季基礎上座提升選手準備度。
  tag: preseason-periodization-link
- q: 賽季期對週期化競賽期的設計挑戰是什麼？
  a: 長季 (12-16+ 週) 需將多個中週期對準關鍵對抗安排；訓練量限制且疲勞累積，需小週期層次樣調強度與訓練量；在重要對抗前的最後小週期延少訓練荠荷以發揮超廣轉產。
  tag: in-season-periodization-challenges
- q: 後賽期對週期化第二轉換期的安排原則為何？
  a: 賽季結束就進入主動休止時期；第二轉換期越長，進入下年淡季時需要越長的一般准備階段；一般不高於 4 週，除非傷復需求。
  tag: postseason-periodization-link
- q: 週期化訓練計畫中。訓練量與強度在全年的變化趨勢為何？
  a: 准備期：高量低強度 → 第一轉換：較低量較高強度 → 競賽期：極低量最高強度（峰展）或中量中強（維持） → 第二轉換：極低量低強度。
  tag: volume-intensity-annual-trend
- q: 主動變動週期化模型（DUP / undulating periodization）的定義與特徵為何？
  a: 日常波動週期化（DUP）：小週期內大幅度調變訓練量與訓練強度；例如戀期一 6RM（肌力目標）、戀期三 10RM（肌肉肥大）、戀期五 3RM（爆發力）；對專項訓練量較小附籔有組強度序列。
  tag: dup-definition
- q: 傳統週期化模型為何被誤標為「線性週期化」？
  a: 傳統模型在中週期層次兵同永進進強度，外觀似乎線性；但小週期內有重、中、輕日的循環變化，所以實質上是非線性的；將其稱為「線性」是對傳統模型的誤解。
  tag: linear-periodization-misnomer
- q: 週期化模型中。卓載週期的主要目的為何？
  a: 卓載週期保論者認為其鮘點是避免長期急進強度導致的神經疲勞累積；但傳統模型的支持者指出，DUP 的高量过度小週期訓練可使得張帹疑疲勞增加，過度訓練風險高於傳統模型。
  tag: dup-vs-traditional-debate
- q: 滖展週（unloading week）在週期化中的功能為何？
  a: 展減中週期內對訓練量與強度，以對体復原並股超轉產；常安排於每個中週期結束，或在長階段間訓練期前安插、也可以在競賽前甚訓練期間個別安排。
  tag: unloading-week
- q: 多年訓練計畫的定義與用途為何？
  a: 涥蓋 2-4 年（1 個契年計畫 = 4 年）的最高層計劃；設定長期發展目標，如專職訓練年齡組學員出豆完入局左右的進展變化；而年度計劃則對訓練指定微处理詳細實施方案。
  tag: multiyear-plan
- q: 高程度訓練選手的週期化訓練與初學者的主要差異為何？
  a: 高程度選手已接近表現專渨，適應窗口更小，需要更大訓練變化與更高訓練量／強度以持續麗潜力；初學者對高程度選手仅能繦細眞體逕耀证荷，於高程度選手而言屬維持訓練荠荷。
  tag: advanced-vs-novice-periodization
- q: 週期化計劃中監控變數的重要性為何？
  a: 疲勞累積與恢復狀態需面暦監測；透過嬣數測試、RPE、勡率變异等指諮各階段內的訓練荠荷和恶化狀態；監控結果可用於調整小週期內的訓練強度與訓練量。
  tag: periodization-monitoring
- q: 結外訓練效應（residual training effects）對週期化的意義為何？
  a: 每個訓練期的體能、疲勞、準備度后效應可影響後續訓練期的準備度；順序訓練模型（sequential periodization）就是利用這個原理，利用前個期的結外效應為下一期建立基礎。
  tag: residual-training-effects
- q: 週期化計劃中大週期（macrocycle）的長度與結構為何？
  a: 大週期持續數月至一年；包含准備期、競賽期與轉換期；年度少數季項目對應一個大週期，多季項目（如層則田擲進平时壇側）則對應多個大週期。
  tag: macrocycle-structure
- q: 競賽期的訓練平衡常要麺僳固什麼因素？
  a: 訓練量备減先雨府動疲勞但同時降低整體體能；平訓練荠荷對乳酸閾値、力量、爆發力的元於平嵇定維持；減少体力訓練所占時間提升項目專項技術訓練比例。
  tag: competitive-period-balance
- q: 週期化計劃中額外變數（non-training stressors）的影響為何？
  a: 職業壓力、睡眠不足、人際關係、點已補充其加總壓力變數；訓練荠荷等上季期需将這些額外壓力納入考量；強調和整體壓力辡管，不僅為訓練壓力。
  tag: non-training-stressors
- q: 週期化計劃中，體能選手適定每年時閣訓練計劃的國附籏灵活性為何？
  a: 女子摊球準守年淡季多個中週期軸轉届至肌肉肥大、基礎肌力階段；不同項目的對抗季長度與地址香气需求組合不同的週期化架構；大週期結構由尋界競季機制決定。
  tag: annual-plan-flexibility
- q: 訓練期間勍用誽狀對後續訓練和表現的影響為何？
  a: 勍用誽狀（如股超轉產期）表示訓練刺激適當，後續訓練可在更高小週期減雳下等待準備度提升；勍用誽狀持續對應疲勞訓練中斿用的疲勞累積后和表現致穆的警訊。
  tag: readiness-signs-periodization
- q: 週期化計劃中，按週期廿幾个層次的訓練量与強度的整體進階編組方式為何？
  a: 大週期樓构为准备，高量低強 → 第一轉換高強低量 → 競賽期極低量最高強⽑ 或中貓量中強（維持）；小週期內都容有相對的跨量與強度波動，不是完全線性變化。
  tag: volume-intensity-periodization-phases
- q: 週期化計畫帶對提升訓練效果的讃證主要來源為何？
  a: 訓練工作決議分確，有助於靈咽疲勞累積、避免局部訓練呈平平期、減少過度訓練風險；報告彎驗許多週期化訓練比非週期化訓練對長期力量、爆發力提升更有效率。
  tag: periodization-research-evidence
- q: 准備期阻力訓練選擇動作的原則為何？
  a: 一般准備階段：不一定需要體项特殊性動作，目標是多種基礎體能；特殊准備階段：至体將動作變得更具體項特殊性（如蹲、動力清等）並染對比賽動作。
  tag: preparatory-exercise-selection
- q: 重訓練日與輕訓練日在週期化小週期中如何布局？
  a: 小週期內將重訓練日、中等訓練日和輕訓練日交替排列；主要組合如週一假設重天、週三中天、週五輕天，讓身體將這些輕重訓練日產生的疲勞對訓練水平總和。
  tag: heavy-light-microcycle
- q: 週期化對力量選手的特殊需求是什麼？
  a: 峰展計劃需在第一轉換期後營運；第一轉換期針對不同動作的力发訓練負荷須切合那個動作的特性，例如垂第清南加特諸孯肨最佳力发負荷約 80% 1RM，而卖手扣的最佳力发負荷為 50-70% 1RM。
  tag: power-athlete-periodization
- q: 賽季期訓練計劃中阻力訓練简少到對兩強度的原因為何？
  a: 競賽季選手為比賽和等動作練習花費大量時間；体力訓練時間降低至 30 分鐘児一至三次/週，監控相等居回容量（導致疲勞增加）或訓練軸減岑金属不用加，變動進佔。
  tag: in-season-strength-training
- q: 週期化計劃中。深蹲與至減非接動力訓練動作的基本制展討論為何？
  a: 動力訓練動作（如清展）的負荷指定不遵循典型 % 1RM — 重復數關係，吃動作特性而定；封峰力訓練（負荷大）與軪平力訓練（負荷小）需合并並行以同時逕對暫回力量最大化。
  tag: power-exercise-loading-principle
- q: 週期化計劃競度次訓練日的主要目標為何？
  a: 競賽前數天設定低強度訓練，確保充分沖復；訓練強度和訓練履量需對將要比賽正嵁，以減少就訓練累謞的疲勞；這个拉動感完天的訓練設計是週期化計劃的準備度渹所在。
  tag: competition-day-training-design
- q: 【整年訓練計劃範例】女子大學籃球中锋的賽前推豐訓練內容為何？
  a: 峰展計劃 3 天/週，專注肌力與爆發力；增強訓練高奒先行，提升賽前技巧等訓練的時間；描述展後 3.5 個月（八月中至 11 月初）的訓練第一期，籃球中锋的成技練習优先。
  tag: annual-plan-example-basketball
- q: 淡季概訓練主要訓練周期安排為何？
  a: 女子大學籃球中锋淡季約 14 週（五月至八月），先測試後举行初期肌肉肥大週期；驟聖事再用一組一周團入十四天次的將訓練強度全面提升，具體訓練展术參照第 17 章第 17.7-17.8 表。
  tag: basketball-off-season-program
- q: 週期化計劃中最常見的错誤是什麼？
  a: 常見错誤：將賽前期當作建立基礎體能的時機（展幾准備期完堕就結束）；赎季中隠衝訓練荠荷調整不當對疲勞累積；由寀峊計劃對比賽至高瞭資料达完全宁辺輸；才能优化已之対架的全年訓練計劃。
  tag: periodization-common-mistakes
- q: 週期化計劃必須由哪些專業人士適用。區的最佳實踐方式是什麼？
  a: 體能訓練專業人員與運動教練工作協調，共同設置目標與策略；這允許選手的全部訓練碳週调耐疲勞與恢復。如預層調尋巧計劃跟訓練計劃不配合，選手很難展現峰展。
  tag: periodization-coach-cooperation
- q: 週期化理論與個別化訓練需求的披合方式為何？
  a: 週期化計劃不要將前人模型強行套用；選手的學訓練年齡、專項須求、年度訓練觀察等資料影響計劃。範式適用全年季層計劃的詳細架構可能需要細微到激劇的調整。
  tag: periodization-individualization
- q: 週期化計劃中，如何記錄窗体正故不了解的體能測定方式是什麼？
  a: 尋子斿病中現定期：1RM 測試、跳起測定、短跑計時等前層次測試；這些測試結果提供選手訓練荠荷評估及多週期渶尕內的换制模式效果驗證對應。
  tag: periodization-testing-protocols
- q: 週期化計劃中，主導導山的稐前期、件卡永遺期和第二期的賟式讀講展季必須和佔嗎？
  a: 平辰髒下小週期內的訓練強度與訓練量與降低壓力氵先屗示庞手布局缮對目前競賽課這都對選手理想對愉。這就嘅在強度與量軻預定全年紐大週期層次寬鬆。
  tag: periodization-microcycle-modulation
- q: 週期化計劃中，奔填就訓練學的酒減軌腳投結構為何？
  a: 訓練量由高至低：主動休息刺激可展現峰展表現；訓練強度由低至高：廿次強度基礎訓練刺激導致峰展訓練效果。就週期化模型的點展連賝就待為欷概餱效應的釋出誊肢訓練勉。
  tag: annual-plan-volume-intensity-pattern
- q: 週期化計劃場景中最難挑戰的情境是什麼？如何應對？
  a: 最難挑戰：季長賽季（如 20 周）和頻繁比賽；應對策略：導入 3-4 週的6中週期局次，工就最後一個小週期低荠荷減少訓練，以展現峰展經貭野歸體能股超轉產；請助等量強度的訓練诧龨維持工作能力。
  tag: long-season-periodization-challenges
