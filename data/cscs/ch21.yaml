  - id: ch21.competition-period.i08
    q: 長競賽季如何以中週期安排重要賽事前的準備狀態？
    a:
    - 長競賽季約十二至十六週以上時，可用三或四週的中週期區塊安排在關鍵賽事周圍
    - 在最後一個小週期減量，以降低疲勞並在重要賽事前產生表現超補償
    - 其他賽事仍以中週期內的強度與訓練量變化來調節準備狀態，並非表示其餘時間狀況不佳
    detail: 這是長賽季的其中一種解法；教材另列以中等強度、低至中訓練量調節的維持計畫。
    terms:
    - competitive-period
