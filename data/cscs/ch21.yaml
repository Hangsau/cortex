cards:
- q: "週期化（periodization）如何定義？"
  a: "週期化是以邏輯且系統的方式排序、整合訓練介入，以在適當時間達到巔峰表現的過程。"
  tag: periodization-definition
- q: "週期化訓練計畫的核心目標為何？"
  a: "管理適應反應、累積疲勞與不同訓練因子的後效，並在適當時點使表現達到巔峰；巔峰表現只能在短期最佳化。"
  tag: periodization-goals
- q: "一般適應症候群（General Adaptation Syndrome, GAS）的三期為何？"
  a: "警覺期、抵抗期、耗竭期。警覺期累積疲勞並降低表現能力；抵抗期適應刺激；壓力過久則進入耗竭期。"
  tag: gas-three-stages
- q: "超補償（supercompensation）在 GAS 中如何出現？"
  a: "若訓練壓力安排適當且未過量，抵抗期的生化、結構與機械調整可進一步提高表現能力，稱為超補償。"
  tag: supercompensation
- q: "刺激—疲勞—恢復—適應理論（SFRA）的主要關係為何？"
  a: "工作負荷總量愈大，疲勞累積愈多，完全恢復與適應前的延遲愈長；恢復並適應時，疲勞消散、準備狀態與表現提高。"
  tag: sfra-theory
- q: "適能—疲勞典範（fitness–fatigue paradigm）的基本原則為何？"
  a: "每次訓練同時產生適能與疲勞後效，兩者合計影響準備狀態；疲勞比適能消散得快。"
  tag: fitness-fatigue-paradigm
- q: "週期化層級由大至小如何排列？"
  a: "多年計畫→年度訓練計畫→大週期→中週期→小週期→訓練日→訓練節次。"
  tag: periodization-hierarchy
- q: "中週期（mesocycle）的典型時程與組成為何？"
  a: "通常二至六週，最常見四週；由相互連結的小週期構成。"
  tag: mesocycle-definition
- q: "小週期（microcycle）的典型時程與組成為何？"
  a: "從數天到二週，最常見一週（七天）；由多次訓練課或訓練日構成。"
  tag: microcycle-definition
- q: "當代週期化模型的四個訓練期依序為何？"
  a: "備賽期→第一轉換期→競賽期→第二轉換期；依序對應休季、季前、賽季與賽後。"
  tag: four-training-periods
- q: "備賽期（preparatory period）的目標與兩個子相為何？"
  a: "在無競賽、專項工作有限時建立耐受後續高強度訓練的體能基礎；分為一般備賽相與特殊備賽相。"
  tag: preparatory-period
- q: "肌肥大／肌力耐力相的阻力訓練處方為何？"
  a: "採 50–75% 1RM、每動作三至六組、每組八至二十次；目標可為增加瘦體重、建立肌肉與代謝耐力基礎，或兩者兼顧。"
  tag: hypertrophy-strength-endurance-phase
- q: "基礎肌力相（basic strength phase）的阻力訓練處方為何？"
  a: "採 80–95% 1RM、每動作二至六組、每組二至六次，重點是提高主要運動動作所需肌群的肌力。"
  tag: basic-strength-phase
- q: "肌力／爆發力相（strength/power phase）的阻力訓練處方為何？"
  a: "依動作採 30–95% 1RM 的低至很高負荷，每動作二至五組、每組二至五次；爆發性動作的百分比須依所選動作決定。"
  tag: strength-power-phase
- q: "巔峰調整（peaking）的處方與期限為何？"
  a: "採 50% 至至少 93% 1RM、每動作一至三組、每組一至三次，約持續一至二週，以漸減訓練降低疲勞。"
  tag: peaking-program
- q: "維持計畫（maintenance program）適用何種競賽期？"
  a: "適用於持續數月的團隊運動賽季；以 85–93% 1RM、約二至五組、每組三至六次，並隨訓練、旅行與賽程調節。"
  tag: maintenance-program
- q: "第二轉換期（active rest）的時程與目的為何？"
  a: "通常一至四週；讓運動員復健傷害、在身體與心理上重新整理，再開始新的年度計畫或大週期。"
  tag: second-transition-active-rest
- q: "休季（off-season）與備賽期如何對應？"
  a: "休季即備賽期，通常從賽後結束延續到季前開始；透過一般與特殊備賽相的中週期準備下一競賽季。"
  tag: off-season-periodization-link
- q: "季前（preseason）與第一轉換期如何對應？"
  a: "季前通常進行第一轉換期，聚焦肌力／爆發力相；它要利用休季所建立的基礎提升競賽期表現能力，而非建立基礎體能。"
  tag: preseason-periodization-link
- q: "長賽季的競賽期如何安排重要賽事前的準備狀態？"
  a: "十二至十六週以上的長賽季可安排三或四週中週期區塊，最後一個小週期減量以降低疲勞並在關鍵賽事前產生超補償。"
  tag: in-season-periodization-challenges
- q: "賽後（postseason）的安排原則為何？"
  a: "賽後提供相對或主動休息；賽後期愈長，去訓練機會愈高，下一個休季就愈需要較長的一般備賽相。"
  tag: postseason-periodization-link
- q: "週期化各期的訓練量與強度整體趨勢為何？"
  a: "訓練通常從高訓練量、低強度的一般活動，逐步轉向較低訓練量、較高強度的活動；小週期與中週期內仍有負荷波動。"
  tag: volume-intensity-annual-trend
- q: "每日波動週期化（daily undulating periodization, DUP）有何特徵？"
  a: "在同一小週期內大幅改變核心阻力動作的負荷、訓練量與焦點；教材例子依序使用六 RM、十 RM、三 RM 負荷。"
  tag: dup-definition
- q: "傳統模型為何被錯稱為線性週期化？"
  a: "它因中週期強度漸增而看似線性，但小週期與中週期內的強度和訓練量負荷都有非線性變化。"
  tag: linear-periodization-misnomer
- q: "每日波動與傳統模型的主要論辯為何？"
  a: "每日波動模型支持者主張可避免傳統模型累積的神經疲勞；傳統模型支持者則憂慮每日波動的高訓練量負荷造成周邊與代謝疲勞、傷害風險及準備狀態下降。"
  tag: dup-vs-traditional-debate
- q: "主動休息概念如何用於減量週？"
  a: "可在長訓練相或訓練期之間安排一週休息，同時降低訓練強度與訓練量，為下一期做準備。"
  tag: unloading-week
- q: "多年計畫（multiyear plan）的定義與用途為何？"
  a: "涵蓋二至四年，是時間最長、細節最少的層級；設定長期發展目標後，再細分為年度訓練計畫。四年計畫稱為四年期計畫。"
  tag: multiyear-plan
- q: "高程度與初學運動員的週期化需求有何差異？"
  a: "高程度運動員的適應窗口較小，需要較大訓練變化及較高訓練量與強度；對初學者有刺激性的負荷，對高程度者至多可能只是維持負荷。"
  tag: advanced-vs-novice-periodization
- q: "團隊運動競賽期為何要監測表現能力與恢復？"
  a: "長賽季的負荷要依訓練、旅行與競賽行程在小週期中調節；仔細監測表現能力與恢復對管理疲勞很重要。"
  tag: periodization-monitoring
- q: "殘留訓練效應（residual training effects）對序列週期化有何意義？"
  a: "前一訓練期的殘留訓練效應可能依整體計畫結構影響後一訓練期的準備狀態，是序列週期化的基礎概念。"
  tag: residual-training-effects
- q: "大週期（macrocycle）的長度與結構為何？"
  a: "通常持續數月至一年，並分為備賽、競賽與轉換期；單一競賽季可對應一個大週期，雙賽季可分為兩個。"
  tag: macrocycle-structure
- q: "競賽期的核心訓練平衡是什麼？"
  a: "需保留足夠適能又降低疲勞；訓練量、強度或兩者降得過多，都會降低競賽準備狀態。"
  tag: competitive-period-balance
- q: "非訓練壓力源如何影響週期化？"
  a: "職業問題、睡眠不足、人際關係與不良飲食等也會提高運動員總壓力，因此訓練規劃必須管理的不只是訓練負荷。"
  tag: non-training-stressors
- q: "年度訓練計畫如何隨競賽季結構調整？"
  a: "單一競賽季的運動可把年度計畫視為一個大週期；大學田徑常因室內與室外賽季分為兩個大週期。"
  tag: annual-plan-flexibility
- q: "適能—疲勞典範中的殘留效應如何影響準備狀態？"
  a: "各訓練因子可能各自刺激適能、疲勞與準備狀態後效；前一訓練期的殘留後效可能影響後一訓練期。"
  tag: readiness-signs-periodization
- q: "為何各訓練期內的變化不是真正線性？"
  a: "即使整體趨勢從高訓練量、低強度走向較低訓練量、較高強度，小週期和中週期中的負荷仍有結構化波動。"
  tag: volume-intensity-periodization-phases
- q: "本章對每日波動和傳統模型的研究證據結論為何？"
  a: "證據不一致：有研究支持每日波動模型，有研究認為沒有差異，也有研究支持傳統模型。"
  tag: periodization-research-evidence
- q: "備賽期的動作選擇如何隨子相改變？"
  a: "一般備賽相可採不具專項性的活動建立基礎；進入特殊備賽相後，活動在數週內逐步變得更具運動專項性。"
  tag: preparatory-exercise-selection
- q: "輕、重訓練日如何協助疲勞管理？"
  a: "操弄輕、重訓練節次或訓練日的工作負荷與強度，可調節疲勞與恢復，同時使適能提高或維持。"
  tag: heavy-light-microcycle
- q: "爆發性動作的負荷選擇原則為何？"
  a: "不採典型 %RM—反覆次數關係，而由動作決定；教材例示懸垂爆發上拉可用 80% 1RM，臥推拋可用 50–70% 1RM。"
  tag: power-athlete-periodization
- q: "女子大學籃球中鋒的賽季阻力訓練範例如何安排？"
  a: "因比賽、技戰術練習與旅行限制場上外訓練量，阻力訓練可限為每次三十分鐘、每週一至三次，採不同訓練量負荷與相對強度的波動安排。"
  tag: in-season-strength-training
- q: "肌力／爆發力相的爆發性動作負荷安排原則為何？"
  a: "以高、低負荷並行的混合訓練，同時最佳化肌力與爆發力；爆發性動作的實際負荷依所選動作決定。"
  tag: power-exercise-loading-principle
- q: "巔峰調整中的競賽前漸減訓練目標為何？"
  a: "依負荷降低策略，訓練會從較高強度逐步轉為較低強度工作，以在競賽前降低疲勞。"
  tag: competition-day-training-design
- q: "女子大學籃球中鋒年度計畫範例的季前期如何安排？"
  a: "休季結束並經一或二個減量週後進入季前；範例約三個半月，阻力訓練每週三天，主要聚焦肌力與爆發力。"
  tag: annual-plan-example-basketball
- q: "女子大學籃球中鋒年度計畫範例的休季如何安排？"
  a: "主動休息後的備賽期約十四週；第一週先測試以決定第一中週期負荷，之後以阻力訓練建立承受後續高強度訓練的基礎。"
  tag: basketball-off-season-program
- q: "本章對季前期的常見錯置提出什麼警告？"
  a: "季前不是建立運動所需基礎體能的時機；基礎體能應主要在休季建立，季前應利用此基礎提升競賽期表現能力。"
  tag: periodization-common-mistakes
- q: "為何運動教練與體能訓練專業人員必須合作？"
  a: "共同規劃目標與策略才能整合所有訓練因子，較好管理訓練壓力、疲勞與恢復；缺乏合作就難以完整達到最佳表現。"
  tag: periodization-coach-cooperation
- q: "週期化模型能否直接套用到所有運動員？"
  a: "不能。本章範例只是一種模型；不同運動員或運動項目可能需要從細微到大幅的結構調整。"
  tag: periodization-individualization
- q: "籃球年度計畫範例在休季初始測試包含哪些項目？"
  a: "除阻力動作負荷測試外，還列有肩、髖柔軟度、十二分鐘跑、三百碼折返跑、折返跑、T 字跑、垂直跳與皮脂厚度測量。"
  tag: periodization-testing-protocols
- q: "小週期如何用以調節疲勞與恢復？"
  a: "透過輕、重訓練節次或訓練日的工作負荷與強度變化，調節疲勞與恢復反應，同時使適能提高或維持。"
  tag: periodization-microcycle-modulation
- q: "年度計畫中的訓練量與強度配置邏輯為何？"
  a: "以備賽期的高訓練量、低強度建立基礎，逐步轉向較低訓練量、較高強度，並依競賽期的巔峰或維持需求調整。"
  tag: annual-plan-volume-intensity-pattern
- q: "長賽季的週期化挑戰與其中一種解法為何？"
  a: "頻繁競賽使疲勞管理困難；可用三或四週中週期區塊，最後一個小週期減量，在關鍵賽事前降低疲勞並產生表現超補償。"
  tag: long-season-periodization-challenges
