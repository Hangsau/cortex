    locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  - id: ch21.fitness-fatigue.i06
    q: 訓練因子的適能、疲勞與準備狀態反應是否只有一條曲線？
    a:
    - 經典圖示雖畫成一組疲勞、適能與準備狀態曲線
    - 各個訓練因子很可能各自刺激其個別的適能、疲勞與準備狀態後效反應
    detail: 原文以「很可能」保留不確定性，不能改寫為已被證實的單一固定曲線組數。
    terms:
    - fitness-fatigue-paradigm
    - preparedness
    numbers: []
    concepts:
    - periodization
    - adaptation
    related: []
    locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  - id: ch21.fitness-fatigue.i07
    q: 殘留訓練效應（residual training effects）對序列週期化有何意義？
    a:
    - 訓練因子的個別後效常被視為殘留訓練效應
    - 前一訓練期的殘留訓練效應可能依週期化計畫結構，影響後一訓練期的準備狀態
    - 此概念是序列週期化模型的基礎
    detail: 教材用「可能」描述前期後效對後期準備狀態的影響，並將影響條件繫於整體計畫結構。
    terms:
    - residual-training-effects
    - preparedness
    - periodization
    numbers: []
    concepts:
    - periodization
    - adaptation
    related: []
    locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  - id: ch21.fitness-fatigue.i08
    q: 為何每日波動週期化可能降低高階運動員的準備狀態？
    a:
    - 高訓練量負荷的節次可能累積疲勞，使每日波動模型降低運動員的準備狀態
    - 有些作者依 GAS 認為，這可能提高高程度運動員的過度訓練潛能；與專項訓練併行也可能提高傷害風險
    detail: 這是教材呈現傳統模型支持者及部分作者的觀點，不是所有每日波動週期化研究的一致結論。
    terms:
    - daily-undulating-periodization
    - fitness-fatigue-paradigm
    - GAS
    - overtraining
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch05.overtraining.i01
    - ch04.program-design.i07
    locator: Undulating Versus Linear Periodization Models
- id: gas-theory
  title: GAS 一般適應症候群
  desc: ''
  tag: 理論基礎
  items:
  - id: ch21.gas-theory.i01
    q: 一般適應症候群（General Adaptation Syndrome, GAS）的警覺期為何？
    a:
    - 身體遭遇新穎、新的或比先前更強的壓力時，最初會進入警覺期
    - 疲勞、痠痛、僵硬或能量儲備降低會累積，並使表現能力下降
    - 反應持續時間取決於壓力程度，可從數小時、數天到數週
    detail: GAS 原本不是在身體訓練脈絡提出，但後來成為週期化理論的基礎概念之一。
    terms:
    - GAS
    - periodization
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch04.program-design.i04
    locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  - id: ch21.gas-theory.i02
    q: GAS 的抵抗期（resistance phase）與超補償如何發生？
    a:
    - 警覺期後，身體在抵抗期適應刺激並回到正常功能能力
    - 若訓練壓力安排適當且不過量，生化、結構與機械調整可進一步提高表現能力，形成超補償（supercompensation）
    detail: 超補償不是抵抗期必然結果；教材的條件是訓練壓力安排適當且未過量。
    terms:
    - GAS
    - supercompensation
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch17.principles-exam-tips.i03
    locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  - id: ch21.gas-theory.i03
    q: GAS 的耗竭期（exhaustion phase）代表什麼？
    a:
    - 壓力持續過長時，運動員會無法適應所施加的壓力源，進入耗竭期
    - 會出現與警覺期相同的一些症狀
    - 進入此期的運動員最可能正呈現功能性過度負荷或過度訓練反應
    detail: 教材的用語是「最可能」，並列出功能性過度負荷與過度訓練反應；不能把耗竭期簡化為唯一的過度訓練診斷。
    terms:
    - GAS
    - overreaching
    - overtraining
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch05.overtraining.i03
    - ch04.program-design.i07
    locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  - id: ch21.gas-theory.i04
    q: 教材如何定義超補償（supercompensation）？
    a:
    - 訓練壓力適當且未過量時，適應造成的生化、結構與機械調整會進一步提高運動員表現能力
    - 這種提高稱為超補償
    detail: 本章把超補償放在 GAS 的抵抗期適應之後；其所指是表現能力提高，非書中圖像以外的固定「基線上方時間窗」。
    terms:
    - supercompensation
    - GAS
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch21.gas-theory.i02
    locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  - id: ch21.gas-theory.i05
    q: GAS 的訓練反應曲線能否用固定時程安排刺激？
    a:
    - GAS 圖中的曲線斜率、幅度與時間點都高度個別化
    - 圖示僅代表 GAS 對訓練反應的基本應用
    detail: 原項目把圖中未轉出的「超補償窗口」當成文字事實；教材明示圖的實際尺度與時程高度個別化，沒有提供可通用的下一次刺激時點。
    terms:
    - GAS
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch17.needs-analysis.i04
    locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  - id: ch21.gas-theory.i06
    q: 如何以訓練規劃避免 GAS 的耗竭期？
    a:
    - 過度負荷、單調訓練與過度多變的訓練都可能導致耗竭期
    - 職業問題、睡眠不足、人際關係與不良飲食等非訓練壓力，也會提高總壓力
    - 體能訓練專業人員應藉由適當規劃與管理訓練壓力源，避免耗竭期
    detail: 訓練規劃需管理總壓力而非只看槓鈴負荷；這是本章將週期化連回 GAS 的實際邊界。
    terms:
    - GAS
    - periodization
    - overtraining
    - stress
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch04.program-design.i04
    - ch08.arousal-anxiety-stress.i06
    locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
- id: periodization-hierarchy
  title: 週期化層級結構
  desc: ''
  tag: Hierarchy
  items:
  - id: ch21.periodization-hierarchy.i01
    q: 多年計畫（multiyear plan）在週期化層級中的位置為何？
    a:
    - 涵蓋二至四年，是週期化結構中時間最長、細節最少的計畫
    - 例如可規劃大學美式足球球員從新生到畢業班的發展目標；四年計畫稱為四年期計畫（quadrennial plan）
    - 之後再依多年計畫的各階段或基準，細分為更詳細的年度訓練計畫
    detail: 教材的舉例是大學美式足球球員，不是將所有四年週期等同於奧運週期。
    terms:
    - multiyear-plan
    - annual-training-plan
    - quadrennial-plan
    numbers:
    - v: 2–4
      unit: 年
      of: 多年計畫的持續時間
    - v: 4
      unit: 年
      of: 四年期計畫的持續時間
    concepts:
    - periodization
    related:
    - ch08.goal-setting.i04
    locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  - id: ch21.periodization-hierarchy.i02
    q: 年度訓練計畫（annual training plan）包含什麼？
    a:
    - 是一年期的整體訓練計畫，可含單一或多個大週期
    - 細分為包括備賽、競賽與轉換期的不同訓練期
    - 年度訓練計畫設定訓練年的一般路徑，其他週期則安排達成主要競賽目標的手段、方法與模式
    detail: 年度計畫不是每項運動都等同一個大週期；其關係取決於該運動的競賽季數。
    terms:
    - annual-training-plan
    - macrocycle
    - preparatory-period
    - competitive-period
    numbers:
    - v: 1
      unit: 年
      of: 年度訓練計畫的持續時間
    concepts:
    - periodization
    related:
    - ch18.program-design.i06
    locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  - id: ch21.periodization-hierarchy.i03
    q: 大週期（macrocycle）的長度與年度計畫關係為何？
    a:
    - 通常持續數月至一年，並分為備賽、競賽及轉換期
    - 單一競賽季的運動（如美式足球）可將年度訓練計畫視為一個大週期
    - 大學田徑因常有室內與室外賽季，年度計畫可分成兩個大週期
    detail: 表 21.1 也註明有些作者把大週期稱作年度計畫；這是用語差異，不能略去運動競賽結構的條件。
    terms:
    - macrocycle
    - annual-training-plan
    numbers:
    - v: 1
      unit: 年
      of: 大週期可持續的最長時間
    concepts:
    - periodization
    related:
    - ch19.program-design-monitoring.i07
    locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  - id: ch21.periodization-hierarchy.i04
    q: 中週期（mesocycle）的典型時程與結構為何？
    a:
    - 為中型訓練週期，通常持續二至六週，最常見為四週
    - 由相互連結的小週期構成，並位於大週期之內
    - 大週期中的中週期數量取決於訓練目標與大週期長度
    detail: 內文曾以「數週至數月」概述中週期，而表 21.1 將二至六週列為最典型的時程；此處依表格保留典型範圍。
    terms:
    - mesocycle
    - microcycle
    - macrocycle
    numbers:
    - v: 2–6
      unit: 週
      of: 中週期最典型的持續時間
    - v: 4
      unit: 週
      of: 中週期最常見的持續時間
    concepts:
    - periodization
    related:
    - ch20.periodization.i08
    locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  - id: ch21.periodization-hierarchy.i05
    q: 小週期（microcycle）的典型時程與組成為何？
    a:
    - 為小型訓練週期，從數天到二週，最常見為一週（七天）
    - 由多次訓練課或訓練日構成
    detail: 小週期是中週期進一步拆解後的日常安排尺度；教材未把它限定為必然七天。
    terms:
    - microcycle
    - training-day
    numbers:
    - v: 2
      unit: 週
      of: 小週期持續時間的上限
    - v: 1
      unit: 週
      of: 小週期最常見的持續時間
    - v: 7
      unit: 天
      of: 最常見小週期的一週長度
    concepts:
    - periodization
    related:
    - ch17.load-repetitions.i06
    - ch14.ramp-protocol.i07
    locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  - id: ch21.periodization-hierarchy.i06
    q: 訓練日（training day）如何界定？
    a:
    - 持續一天
    - 可包含多個訓練節次，且應在所屬小週期的脈絡下設計
    detail: 訓練日的安排並非脫離週期單獨規劃；其位置受所在小週期的目標與負荷變化約束。
    terms:
    - training-day
    - training-session
    - microcycle
    numbers:
    - v: 1
      unit: 天
      of: 訓練日的持續時間
    concepts:
    - periodization
    related: []
    locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  - id: ch21.periodization-hierarchy.i07
    q: 訓練節次（training session）如何界定？
    a:
    - 一般由數小時訓練構成
    - 同一次訓練課若各訓練段之間休息超過三十分鐘，即構成多個訓練節次
    detail: 這是表 21.1 對訓練節次的操作性切分，不是在界定每次訓練一定要持續數小時。
    terms:
    - training-session
    numbers:
    - v: 30
      unit: 分鐘
      of: 同一次訓練課中判為不同訓練節次的組間休息門檻
    concepts:
    - periodization
    related:
    - ch14.ramp-protocol.i07
    locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  - id: ch21.periodization-hierarchy.i08
    q: 週期化如何從全局目標逐步發展為細部安排？
    a:
    - 多年或年度訓練計畫先設定一般、全局的訓練目標
    - 發展到大週期、中週期與小週期時，訓練安排會愈來愈具體
    - 年度計畫設定訓練年路徑，其他週期安排達到主要競賽目標的手段、方法與模式
    detail: 這是由廣至細的規劃邏輯，並非教材所列「年計畫→大週期→中週期→小週期」各自只負責單一任務的僵硬分工。
    terms:
    - multiyear-plan
    - annual-training-plan
    - macrocycle
    - mesocycle
    - microcycle
    numbers: []
