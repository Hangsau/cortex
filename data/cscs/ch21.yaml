  - id: ch21.competition-period.i06
    q: 維持計畫（maintenance program）如何安排？
    a:
    - 用於持續數月的團隊運動競賽期，以維持肌力與爆發力並管理頻繁競賽造成的疲勞
    - 使用中至高強度（85–93% 1RM）與低至中訓練量（約二至五組、每組三至六次）
    - 在小週期層次依訓練、旅行與競賽行程調節負荷，並密切監測表現能力與恢復
    detail: 維持計畫的微調依據包括旅行與賽程；它不是只按每週固定組數與百分比重複執行。
    terms:
