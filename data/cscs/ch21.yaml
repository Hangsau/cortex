  - id: ch21.preparatory-period.i07
    q: 備賽期如何以每日變化與恢復週促進恢復？
    a:
    - 備賽期內每日變化訓練強度與工作負荷，有助於恢復
    - 可在訓練相中安排恢復週或恢復小週期，最常在進入下一訓練相前的期末安排
    detail: 教材說的是「可」安排恢復週或小週期，並非每一訓練相都必定有固定形式的減量週。
