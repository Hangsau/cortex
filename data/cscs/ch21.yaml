    locator: Periodization Periods > First Transition Period > Strength/Power Phase
  - id: ch21.competition-period.i03
    q: 爆發性動作（power exercise）的負荷為何不能套用一般 %RM—次數關係？
    a:
    - 爆發性動作的負荷指派不遵循典型的 %RM—反覆次數關係；所選動作會決定負荷
    - 例：懸垂爆發上拉（hang power clean）可用 80% 1RM 促進爆發力；臥推拋（bench press throw）欲最大化爆發力時可用 50–70% 1RM
    detail: 書中主張以高、低負荷並行的混合訓練來同時處理肌力與爆發力發展，而非把單一百分比視為所有爆發性動作的答案。
    terms:
    - power-exercise
    - one-repetition-maximum
    - load
    numbers:
    - v: 80
      unit: '% 1RM'
      of: 書中舉例的懸垂爆發上拉負荷
    - v: 50–70
      unit: '% 1RM'
      of: 欲最大化爆發力時臥推拋的舉例負荷範圍
    concepts:
    - periodization
    related:
