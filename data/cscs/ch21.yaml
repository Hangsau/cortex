  - id: ch21.active-rest.i08
    q: 主動休息期若做阻力訓練，安排原則為何？
    a:
    - 採極低訓練量、非運動專項的阻力訓練
    - 使用極低負荷
    detail: 原本的「30–85% 1RM」錯置自表 21.2 的肌力／爆發力相；本節對主動休息只寫極低負荷，未給百分比。
