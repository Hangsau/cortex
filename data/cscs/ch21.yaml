- id: competition-period
  title: 第一轉換期與競賽期
  desc: ''
  tag: Preseason→In
  items:
  - id: ch21.competition-period.i01
    q: 第一轉換期（first transition period）的角色為何？
    a:
    - 連結備賽期與競賽期，通常對應季前（preseason）
    - 將訓練重點轉向提升肌力及將肌力轉化為爆發力
    - 最後一週降低訓練量、強度或兩者，以在競賽期開始前恢復
    detail: 書中要求小週期層次變化強度與工作負荷來促進恢復；末週並非固定只降低訓練量。
    terms:
    - first-transition-period
    - preparatory-period
    - competitive-period
    - preseason
    - training-intensity
    - volume
    numbers: []
    concepts:
    - periodization
    related:
    - ch20.periodization.i02
    - ch18.program-design.i06
    locator: Periodization Periods > First Transition Period
  - id: ch21.competition-period.i02
    q: 肌力／爆發力相（strength/power phase）的阻力訓練處方為何？
    a:
    - 依動作使用低至很高的負荷，為一次反覆最大重量（one-repetition maximum, 1RM）的 30–95%
    - 以低訓練量進行，每動作二至五組、每組二至五次
    detail: 百分比是跨不同動作的整體範圍；爆發性動作實際採用的百分比要由動作本身決定，不能當成每一動作的通用最佳負荷。
    terms:
