  - id: ch21.preparatory-period.i08
    q: 為何備賽期的訓練量與強度趨勢不是完全線性？
    a:
    - 初學者的基本模型圖雖以直線顯示訓練量逐漸下降、強度逐漸上升
    - 小週期與中週期層次的負荷波動使兩者進程實際上為非線性
    detail: 本章將把傳統模型稱為線性週期化視為常見誤解；圖形的直線只是總體呈現方式。
