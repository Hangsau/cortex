  - id: ch21.preparatory-period.i05
    q: 基礎肌力相（basic strength phase）的處方與目標為何？
    a:
    - 位於備賽期後段的特殊備賽相，以提高主要運動動作所需肌群的肌力為主要目標
    - 以 80–95% 1RM 的較高強度及中至高訓練量（每動作二至六組、每組二至六次）進行
    - 阻力訓練動作會比前一相更具運動專項性，且以較重負荷、較低訓練量進行
    detail: 「較低訓練量」是相對於肌肥大／肌力耐力相，而表 21.2 仍把此相的絕對組數類別列為中至高。
