  - id: ch21.preparatory-period.i03
    q: 特殊備賽相（specific preparatory phase）如何銜接競賽期？
    a:
    - 在一般備賽相完成後，訓練焦點轉移，並從既有基礎擴展訓練基礎
    - 提高運動專項訓練活動的比重，為競賽期做準備
    - 阻力訓練可對應基礎肌力相
    detail: 專項性是逐步提高而非一次跳變；教材以此期後、數週內活動變得更專項為例。
