- id: preparatory-period
  title: 備賽期 Preparatory Period
  desc: ''
  tag: Off-Season
  items:
  - id: ch21.preparatory-period.i01
    q: 備賽期（preparatory period）的時機與中心目標為何？
    a:
    - 發生在沒有競賽、技術、戰術或運動專項工作有限的時期，通常對應休季（off-season）
    - 中心目標是建立體能基礎，使運動員更能耐受後續較高強度訓練
    detail: 教材將休季視為備賽期，不是指備賽期完全不做任何專項活動，而是其工作量有限。
    terms:
    - preparatory-period
    - off-season
    - training-intensity
    numbers: []
    concepts:
    - periodization
    related:
