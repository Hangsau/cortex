- id: sfra-theory
  title: 刺激-疲勞-恢復-適應理論
  desc: ''
  tag: SFRA理論
  items:
  - id: ch21.sfra-theory.i01
    q: 刺激—疲勞—恢復—適應理論（stimulus-fatigue-recovery-adaptation theory）的核心為何？
    a:
    - 此理論是 GAS 的延伸，認為訓練刺激引發的整體反應受訓練壓力源總量影響
    - 工作負荷總量愈大，累積疲勞愈多，完全恢復與適應前的延遲愈長
    - 運動員從刺激恢復並適應時，疲勞消散，準備狀態與表現提高
    detail: 教材只說較大工作負荷造成更多疲勞與更久延遲，沒有說超補償幅度必然更大。
    terms:
    - stimulus-fatigue-recovery-adaptation-theory
    - GAS
    - recovery
    - preparedness
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch04.program-design.i04
    - ch05.overtraining.i01
    locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  - id: ch21.sfra-theory.i02
    q: SFRA 理論如何看待新訓練刺激與完全恢復的關係？
    a:
    - 恢復雖是訓練過程重要的一環，但開始新的訓練回合或節次前，不一定要達到完全恢復
    - 可利用輕、重訓練節次或訓練日操弄工作負荷與強度，調節疲勞與恢復，並使適能提高或維持
    detail: 「不一定完全恢復」不等於忽略恢復；書中同時要求以輕重日的操弄管理疲勞與恢復反應。
    terms:
    - stimulus-fatigue-recovery-adaptation-theory
    - recovery
    - training-intensity
    - fitness-fatigue-paradigm
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch17.training-frequency.i03
    locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  - id: ch21.sfra-theory.i03
    q: 沒有新的訓練刺激時，SFRA 理論預期會發生什麼？
    a:
    - 若沒有引入新的訓練刺激，會出現退化（involution）或去訓練
    - 整體能力會降到目前基線以下
    - 引入新的訓練刺激後，這個過程會重複
    detail: 此處的基線是「目前基線」；原項目把圖示未轉出的固定超補償時間窗當成文字規則，書中並未提供該時點。
    terms:
    - stimulus-fatigue-recovery-adaptation-theory
    - detraining
    numbers: []
    concepts:
    - periodization
    - adaptation
    related:
    - ch05.detraining.i01
    - ch06.detraining.i01
    locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  - id: ch21.sfra-theory.i04
    q: SFRA 理論中的輕、重訓練日有何用途？
    a:
    - 操弄輕、重訓練節次或訓練日的工作負荷與強度，可調節疲勞和恢復反應
    - 同時可使適能提高或維持
    detail: 原本的「殘留訓練效果」屬 fitness–fatigue 典範段落，不是 SFRA 小節在此條所說的內容。
    terms:
