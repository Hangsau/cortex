  - id: ch21.preparatory-period.i06
    q: 初學與高程度運動員在週期化負荷變化上有何不同？
    a:
    - 對訓練狀態較低的初學者，模型常以較低強度、高訓練量開始，並隨體能改善逐漸提高強度、降低訓練量；有些初學者只能耐受較小波動
    - 高程度運動員較接近能力上限、適應窗口較小，需更大訓練變化及較高訓練量與強度，才能持續獲得適當刺激
    detail: 教材以「初學者的刺激負荷對高程度者至多只是維持負荷」說明差異，並非用訓練年齡給出統一分類門檻。
