title: Ch.21 週期化訓練 Periodization
topics:
- id: active-rest
  title: 第二轉換期（主動休息）
  desc: ''
  tag: Postseason
  items:
  - id: ch21.active-rest.i01
    q: 第二轉換期（second transition period）位於何時？
    a:
    - 位於競賽季結束與下一年度訓練計畫或大週期備賽期之間
    - 用以銜接兩個訓練計畫階段
    detail: 教材將它列為四個相互關聯的訓練期之一；它不是額外的競賽準備期，而是新年度計畫開始前的轉換。
    terms:
    - second-transition-period
    - competitive-period
    - annual-training-plan
    - preparatory-period
    numbers: []
    concepts:
    - periodization
    related:
    - ch20.periodization.i04
    locator: Periodization Periods > Second Transition Period (Active Rest)
  - id: ch21.active-rest.i02
    q: 主動休息（active rest）的建議持續時間為何？
    a:
    - 通常持續一至四週；若需從傷害恢復，才可需要額外時間
    - 延長太久會使重建運動表現能力所需的備賽期拉長
    detail: 限制時程是在避免去訓練與保留傷害恢復空間之間取平衡；書中沒有把任何傷害情境列為固定延長週數。
    terms:
    - active-rest
    - detraining
    - preparatory-period
    numbers:
    - v: 1–4
      unit: 週
      of: 第二轉換期通常的持續時間
    concepts:
    - periodization
    related:
    - ch05.detraining.i01
    - ch20.periodization.i07
    locator: Periodization Periods > Second Transition Period (Active Rest)
  - id: ch21.active-rest.i03
    q: 主動休息期可安排哪些活動？
    a:
    - 可從事休閒活動，例如排球、球拍運動或游泳
    - 活動以低強度、低訓練量進行；若做阻力訓練，採極低訓練量、非專項且極低負荷的安排
    detail: 這些是書中以短跑選手為例的做法；重點是恢復，並非以維持正式訓練課表為目的。
    terms:
    - active-rest
    - resistance-training
    numbers: []
    concepts:
    - periodization
    related:
    - ch20.periodization.i04
    locator: Periodization Periods > Second Transition Period (Active Rest)
  - id: ch21.active-rest.i04
    q: 第二轉換期的恢復目的為何？
    a:
    - 讓運動員復健傷害並獲得身體休息
    - 讓運動員在心理上重新整理，再開始新的年度計畫或大週期
    detail: 教材明確同時列出生理與心理的刷新；因此僅以降低訓練負荷，卻忽略長賽季的心理恢復，並不完整。
    terms:
    - second-transition-period
    - recovery
    numbers: []
    concepts:
    - periodization
    related:
    - ch22.sports-medicine-team.i04
    locator: Periodization Periods > Second Transition Period (Active Rest)
  - id: ch21.active-rest.i05
    q: 為何主動休息期一開始要避免積極訓練？
    a:
    - 在巔峰表現後或維持期結束後，應避免立刻進行積極訓練
    - 這段時間讓運動員復健傷害，並在身體與心理上休息
    detail: 適用時點是競賽期結尾；書中不是主張所有訓練期結束後都必須停止積極訓練。
    terms:
    - active-rest
    - peaking
    - maintenance
    numbers: []
    concepts:
    - periodization
    related: []
    locator: Periodization Periods > Second Transition Period (Active Rest)
  - id: ch21.active-rest.i06
    q: 主動休息期過長有何後果？
    a:
    - 訓練長期降低會使運動員需要更長的備賽期，才能重獲表現能力
    - 賽後期越長，去訓練的機會越高
    detail: 教材在「賽後」小節同樣以較高去訓練機會表述，並未提供去訓練幅度或所需備賽期的固定數字。
    terms:
    - detraining
    - active-rest
    - preparatory-period
    numbers: []
    concepts:
    - periodization
    related:
    - ch05.detraining.i01
    locator: Applying Sport Seasons to the Periodization Periods > Postseason
  - id: ch21.active-rest.i07
    q: 主動休息概念如何用作減量週（unloading week）？
    a:
    - 可在長訓練相或訓練期之間安排一週休息，形成減量週
    - 藉由同時降低訓練強度與訓練量，為下一訓練相或訓練期做準備
    detail: 書中將降低過度訓練潛能表述為許多體能訓練專業人員的看法，而非保證效果。
