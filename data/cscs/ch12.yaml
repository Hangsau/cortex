id: ch12
weight: 12
title: Ch.12 測驗選擇與施測原則
topics:
- id: administration
  title: 施測者訓練 Administration
  desc: ''
  tag: Administration
  items:
  - id: ch12.administration.i01
    q: 施測者選拔
    a:
    - 需完全了解所有程序
    - 練習到分數與有經驗者高度相關
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.administration.i02
    q: 一致性原則
    a:
    - 不同組別應由同一人測同一項目
    - 避免激勵程度差異
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.administration.i03
    q: 記錄表單
    a:
    - 測前設計好表單：記錄結果、環境條件、器材設定細節
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.administration.i04
    q: 準備運動員
    a:
    - 提前公告日期、目的、流程
    - 1-3天前辦熟悉練習課
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.administration.i05
    q: 熱身
    a:
    - 一般熱身→專項熱身
    - 2-3次活動特定暖身試做→正式計分
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.administration.i06
    q: 指導說明
    a:
    - 清楚說明目的、動作、暖身、試做次數、計分標準
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.administration.i07
    q: 休息時間
    a:
    - 接近最大強度組間≥3min
    - 非最大≥2min
    - 測驗電池間≥5min
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.administration.i08
    q: 緩和運動
    a:
    - 劇烈測驗後進行監督緩和
    - 不可立即坐下或躺下
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: reliability
  title: 信度 Reliability
  desc: ''
  tag: Test Quality
  items:
  - id: ch12.reliability.i01
    q: Reliability 定義
    a:
    - 測驗一致性／重複性
    - 有信度才有效度，反之不然
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.reliability.i02
    q: Test-Retest（重測信度）
    a:
    - 同組施測兩次，用相關係數估計信度
    - 分數差異＝測量誤差
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.reliability.i03
    q: Typical Error（TE，典型誤差）
    a:
    - 包含設備誤差與生物變異
    - 可量化測量不穩定性
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.reliability.i04
    q: Intrasubject Variability（受試者內變異）
    a:
    - 受試者自身表現不一致（技術不熟、狀態起伏）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.reliability.i05
    q: Interrater Reliability（評分者間信度）
    a:
    - 不同評分者之間一致性
    - 同一受試應由同一人前後測
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.reliability.i06
    q: Intrarater Variability（評分者內變異）
    a:
    - 同一評分者不一致（前測嚴、後測鬆）
    - 需標準化程序
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.reliability.i07
    q: 影響信度因素
    a:
    - 校準設備、激勵方式、技術熟練度、程序標準化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.reliability.i08
    q: 信度 vs 效度
    a:
    - 有信度不代表有效度
    - 60m衝刺信度高但非有氧測驗
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: safety
  title: 健康安全 Safety
  desc: ''
  tag: Safety
  items:
  - id: ch12.safety.i01
    q: 醫療轉介症狀
    a:
    - 胸痛、頭暈、混亂、不規則脈搏、噁心、意識喪失→立即就醫
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.safety.i02
    q: 熱傷害風險
    a:
    - 高溫+高濕度下大量運動
    - 需輕便透氣衣物＋自由飲水
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.safety.i03
    q: 熱衰竭 / 熱中暑
    a:
    - 抽筋、頭暈、步態不穩、皮膚潮紅或蒼白、起雞皮疙瘩
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.safety.i04
    q: 低血鈉症
    a:
    - 過度補水導致血鈉降低
    - 極度稀釋尿液+意識改變→禁止再補液
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.safety.i05
    q: 心臟風險
    a:
    - 1RM或最大跑步測驗可能引發潛在心臟問題
    - 需事前醫療篩查
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.safety.i06
    q: 熱環境補水
    a:
    - 測前24小時充足水分
    - 運動中補充
    - <1hr用水、>1hr補電解質
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.safety.i07
    q: 溫度上限指引
    a:
    - 濕度0%→95°F
    - 21-50%→85°F
    - 51-90%→80°F
    - 91-100%→75°F
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.safety.i08
    q: 熱適應
    a:
    - 涼爽地區來的運動員需至少1週熱適應再進行高強度測驗
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: selection-factors
  title: 測驗選擇因素 Selection Factors
  desc: ''
  tag: Selection
  items:
  - id: ch12.selection-factors.i01
    q: 能量系統特異性
    a:
    - 磷酸原／醣解／氧化系統
    - 測驗須模擬該運動的能量需求
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.selection-factors.i02
    q: 動作模式特異性
    a:
    - 測驗動作越接近運動動作越好
    - 垂直跳適合籃球≠曲棍球
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.selection-factors.i03
    q: 經驗與訓練狀態
    a:
    - 技術型測驗僅適合熟練者
    - 新手技術不穩影響結果
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.selection-factors.i04
    q: 年齡因素
    a:
    - 1.5哩跑適合大學生但不適合青春期前
    - 應考量成熟度
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.selection-factors.i05
    q: 性別因素
    a:
    - 引體向上適合男性摔角手，女性上肢拉力較差需改良版
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.selection-factors.i06
    q: 溫度 / 濕度
    a:
    - ≥80°F尤其濕度>50%會損害耐力表現
    - 需調整或移至室內測驗
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.selection-factors.i07
    q: 海拔高度
    a:
    - '>1900ft影響有氧'
    - 每升3000ft VO₂max約降5%
    - 需10天適應
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.selection-factors.i08
    q: 位置特異性
    a:
    - 美足線衛需臥推+10碼衝刺
    - 外接手需30-100碼衝刺
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: terminology
  title: 測驗術語 Terminology
  desc: ''
  tag: Terminology
  items:
  - id: ch12.terminology.i01
    q: Test 測驗
    a:
    - 評估特定能力的程序
    - 可以是標準化或非標準化工具
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.terminology.i02
    q: Measurement 測量
    a:
    - 收集測驗數據的過程
    - 提供量化資料供後續分析
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.terminology.i03
    q: Evaluation 評估
    a:
    - 分析測驗結果以做決策（如調整訓練計畫）
    - 屬於判斷層次
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.terminology.i04
    q: Pretest 前測
    a:
    - 訓練開始前，確定初始能力水準，用以設計訓練計畫
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.terminology.i05
    q: Midtest 中測
    a:
    - 訓練期間評估進度並視需要修改計畫
    - 屬於 Formative Eval 的一部分
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.terminology.i06
    q: Posttest 後測
    a:
    - 訓練結束後評估計畫成功與否
    - 與前測比較以計算效益
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.terminology.i07
    q: Formative Eval
    a:
    - 依中測定期重新評估
    - 監控進度並個別化調整
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.terminology.i08
    q: Field Test
    a:
    - 在實驗室外執行、不需廣泛訓練或昂貴設備
    - 適合大多數運動場合
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: test-sequence
  title: 測驗順序 Test Sequence
  desc: ''
  tag: Sequence
  items:
  - id: ch12.test-sequence.i01
    q: 排序原則
    a:
    - 前一項測驗不能影響後一項表現
    - 確保每項最佳發揮
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.test-sequence.i02
    q: ①非疲勞測驗
    a:
    - 身高、體重、柔軟度、皮下脂肪、圍度、垂直跳
    - 不消耗能量系統
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.test-sequence.i03
    q: ②敏捷測驗
    a:
    - T-test、Pro agility test
    - 需高技術、疲勞影響大
    - 磷酸原系統需3-5min恢復
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.test-sequence.i04
    q: ③最大肌力 / 爆發力
    a:
    - 1RM Power Clean、1RM Squat
    - 磷酸原系統需3-5min完全恢復
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.test-sequence.i05
    q: ④衝刺測驗
    a:
    - 40m衝刺含10m / 20m分段計時
    - 高強度、短時間磷酸原系統
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.test-sequence.i06
    q: ⑤局部肌耐力
    a:
    - 伏地挺身測驗
    - 醣解系統為主
    - 需≥1hr完全恢復
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.test-sequence.i07
    q: ⑥無氧容量
    a:
    - 300碼折返跑
    - 高度疲勞→建議另日施測或排最後
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.test-sequence.i08
    q: ⑦有氧容量
    a:
    - 1.5哩跑或Yo-Yo間歇恢復測驗
    - 必須排最後或另日施測
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: validity
  title: 效度 Validity
  desc: ''
  tag: Test Quality
  items:
  - id: ch12.validity.i01
    q: Construct Validity（構念效度）
    a:
    - 測驗整體上確實測量其設計要測的構念
    - 最核心的效度類型
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.validity.i02
    q: Face Validity（表面效度）
    a:
    - 在運動員眼中「看起來」有意義
    - 非正式、非量化評估
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.validity.i03
    q: Content Validity（內容效度）
    a:
    - 專家確認測驗涵蓋所有相關子能力且比例適當
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.validity.i04
    q: Concurrent Validity（同時效度）
    a:
    - 與其他已被接受的同類測驗分數高度相關
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.validity.i05
    q: Convergent Validity（聚合效度）
    a:
    - 與黃金標準高度正相關
    - Field test 應具備此效度
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.validity.i06
    q: Predictive Validity（預測效度）
    a:
    - 測驗分數能預測未來運動表現（如用測驗預測賽季成績）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.validity.i07
    q: Discriminant Validity（區辨效度）
    a:
    - 與不同構念測驗低相關，避免重複浪費資源
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.validity.i08
    q: 有效性條件
    a:
    - 可重複、一次測一人、難度適中、能區辨能力高低
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: why-test
  title: 測驗目的 Why Test
  desc: ''
  tag: Why Test
  items:
  - id: ch12.why-test.i01
    q: 才能評估
    a:
    - 識別具備高潛力的運動員
    - 在訓練前確定能力基準
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.why-test.i02
    q: 能力識別
    a:
    - 找出各項運動能力的優劣差異
    - 作為個別化訓練的依據
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.why-test.i03
    q: 目標設定
    a:
    - 依基準值設定具體可行的短中長期訓練目標
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.why-test.i04
    q: 進度追蹤
    a:
    - 透過中測與後測比較前後差異
    - 量化訓練效益
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.why-test.i05
    q: Field Test
    a:
    - 在實驗室外執行、不需昂貴設備的能力評估工具
    - 實用性高
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.why-test.i06
    q: Formative Eval
    a:
    - 訓練期間定期再評估
    - 讓計畫保持新鮮、避免停滯
    - 個別化調整依據
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.why-test.i07
    q: Baseline（基準值）
    a:
    - 測驗前基準值
    - 用來比較訓練後進步幅度
    - 設計訓練計畫的起點
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch12.why-test.i08
    q: 行政決策
    a:
    - 協助教練選拔隊員、分組、分配位置及制定獎懲標準
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
cards:
- q: 對運動員施測的四大目的是什麼？
  a: 評估運動才能、識別待改善能力、設定訓練目標、追蹤訓練進度。
  tag: why-test
- q: Field test（場地測驗）的定義為何？
  a: 在實驗室外執行、不需大量訓練或昂貴設備即可施行的能力評估工具。
  tag: why-test
- q: 什麼是 formative evaluation（形成性評估）？
  a: 訓練期間定期進行的再評估，目的是監控進步、個別調整計畫、避免訓練停滯。
  tag: why-test
- q: Pretest、midtest、posttest 各在什麼時機施行？
  a: Pretest 在訓練前建立基準；midtest 在訓練中追蹤進度；posttest 在訓練後評估整體成效。
  tag: terminology
- q: 測驗（test）與評估（evaluation）的差異？
  a: Test 是收集資料的程序；evaluation 是分析測驗結果以做出決策的過程（如調整訓練計畫）。
  tag: terminology
- q: Measurement（測量）的定義？
  a: 收集測驗資料的過程，是進行 evaluation（評估）的前提步驟。
  tag: terminology
- q: Baseline（基準值）的功能為何？
  a: 作為比較訓練後進步幅度的起始參考點，同時是設計個別化訓練計畫的依據。
  tag: terminology
- q: 何謂 test battery（測驗組合）？
  a: 多個測驗組成的一套評估系統，用以全面評估運動員的多項身體能力。
  tag: terminology
- q: 為什麼 formative evaluation 有助於避免訓練停滯？
  a: 因為定期依個別需求調整訓練計畫，讓訓練保持新鮮並持續有效，同時可收集常模資料。
  tag: terminology
- q: 施測在目標設定中扮演什麼角色？
  a: 基準值確立可行的起始目標；定期施測追蹤進度；讓個別目標與團隊整體目標連結。
  tag: why-test
- q: Validity（效度）的定義為何？
  a: 測驗確實測量到它應測量之構念的程度，是評估測驗品質最重要的特性之一。
  tag: validity
- q: Construct validity（構念效度）指什麼？
  a: 測驗整體上確實代表並測量其設計要測量的理論構念；面效度、內容效度和效標效度都是其佐證。
  tag: validity
- q: Face validity（表面效度）的意義？
  a: 在運動員和旁觀者眼中「看起來」能測量所宣稱的能力；非量化評估，但能提高受測動機。
  tag: validity
- q: Content validity（內容效度）的定義？
  a: 專家確認測驗涵蓋所有相關子能力，且各能力的比重與其對整體表現的重要性相符。
  tag: validity
- q: Criterion-referenced validity（效標效度）的四種類型？
  a: 同時效度（concurrent）、聚合效度（convergent）、預測效度（predictive）、區辨效度（discriminant）。
  tag: validity
- q: Concurrent validity（同時效度）如何估計？
  a: 計算新測驗與已接受之同類測驗分數的 Pearson 相關係數；如新體脂測量與 DXA 的相關。
  tag: validity
- q: Convergent validity（聚合效度）的實用意義？
  a: 場地測驗與黃金標準高度正相關，但更省時省費；是 S&C 專業人員選用 field test 的核心依據。
  tag: validity
- q: Predictive validity（預測效度）如何操作化？
  a: 計算測驗分數與未來運動表現的統計相關；例如選才測驗組合與賽季積分統計的相關程度。
  tag: validity
- q: Discriminant validity（區辨效度）的作用？
  a: 確認測驗與不同構念的測驗低相關，避免在高度相似的測驗上重複耗費時間與資源。
  tag: validity
- q: 一個有效的體能測驗應具備哪些特性？
  a: 測量運動重要能力、結果可重複、難度適中、能區辨不同能力水準、允許精確計分、包含足夠次數。
  tag: validity
- q: 為何 face validity 在運動測驗中特別重要？
  a: 運動員假設自己想盡力表現，測驗看起來有意義可提高動機；與心理測驗刻意低 face validity 相反。
  tag: validity
- q: Content validity 與 face validity 的關鍵差異？
  a: Content validity 涉及實際效度（由專家評估）；face validity 只涉及非專家眼中的外觀觀感。
  tag: validity
- q: Reliability（信度）的定義？
  a: 測驗結果的一致性或可重複程度；能力不變的運動員在可靠測驗中應得到相同分數。
  tag: reliability
- q: 信度與效度的關係？
  a: 信度是效度的必要條件（不一致的結果沒有意義），但信度高不保證效度高。
  tag: reliability
- q: 何謂 test-retest reliability（再測信度）？
  a: 同組運動員兩次施測分數的統計相關；兩次分數的差異代表測量誤差。
  tag: reliability
- q: Typical error of measurement (TE) 包含哪兩種來源？
  a: 設備誤差（equipment error）和運動員的生物變異（biological variation）。
  tag: reliability
- q: Intrasubject variability（受試者內變異）是什麼？
  a: 受試者本身表現不一致，如技術不熟練或當日狀態差異，是信度不足的主要原因之一。
  tag: reliability
- q: Interrater reliability（評分者間信度）的定義？
  a: 不同評分者對同一測驗結果的一致性程度；又稱 objectivity 或 interrater agreement。
  tag: reliability
- q: 影響 interrater reliability 的主要因素有哪些？
  a: 評分標準是否清晰、評分者訓練與經驗程度、設備校準一致性、給予口頭鼓勵的一致性。
  tag: reliability
- q: Intrarater variability（同一評分者內變異）的常見原因？
  a: 前後測態度不一致（如後測較寬鬆期待看到進步）、注意力不集中、未遵守標準化施測程序。
  tag: reliability
- q: 選擇測驗時需考量的五大因素？
  a: 代謝能量系統特異性、生物力學動作特異性、運動員經驗與訓練狀態、年齡與性別、環境因素。
  tag: test-selection
- q: 為何測驗需具備代謝能量系統特異性？
  a: 有效測驗應模擬該運動的能量需求；如籃球以磷酸肌酸系統為主，不適合用長距離耐力跑評估。
  tag: test-selection
- q: 生物力學動作特異性（biomechanical specificity）的例子？
  a: 垂直跳對籃球/排球高特異性；10 碼衝刺對美式足球防線員特異；廣角接收員應測 30-100 碼衝刺。
  tag: test-selection
- q: 何時適合使用技術密集測驗（technique-intensive test）？
  a: 訓練有素、有經驗的運動員；初學者因技術不穩定，技術密集測驗信度低，不適用。
  tag: test-selection
- q: 為何訓練狀態影響測驗的有效性？
  a: 若運動員以腿推機訓練，槓鈴深蹲 1RM 就不是理想測驗；測驗應與實際訓練方式一致。
  tag: test-selection
- q: 年齡如何影響測驗有效性？
  a: 1.5 英里跑適合大學生但不適合青少年；引體向上對女性的區辨效度可能不足，可改用雙腳支撐版。
  tag: test-selection
- q: 高溫高濕環境如何影響有氧耐力測驗？
  a: 接近 80°F 且濕度超過 50% 時，有氧耐力表現顯著下降，1.5 英里跑會低估 VO2max。
  tag: test-selection
- q: 海拔高度如何影響有氧測驗結果？
  a: 超過 1,900 英呎（580 m）後每升高 3,000 英呎 VO2max 約下降 5%；應給至少 10 天高原適應期再施測。
  tag: test-selection
- q: 性別如何影響測驗選擇？
  a: 女性上肢拉力通常低於男性，傳統引體向上可能無法區辨女性肌耐力差異；可改用改良版（雙腳支撐）。
  tag: test-selection
- q: 施測中應觀察哪些需立即轉介醫療的危險症狀？
  a: 胸部壓迫/疼痛、頭暈、意識混亂、頭痛、皮膚深紅或濕冷、不規則脈搏、骨關節疼痛、視力模糊。
  tag: safety
- q: 水中毒（hyponatremia）的症狀與處置？
  a: 極度稀薄尿液合併皮膚浮腫、意識改變、體溫正常；禁止補液，須立即就醫。
  tag: safety
- q: 熱環境有氧施測的核心防護措施（至少 5 項）？
  a: 避免極端高溫高濕→至少一週熱適應→賽前 24 小時充分補水→測驗中補水→穿吸濕排汗衣→監測心率→備妥醫療資源。
  tag: safety
- q: 評分者應如何接受訓練以確保施測信度？
  a: 熟悉所有測試程序和評分標準；與有經驗人員的得分高度相關；給予運動員一致的口頭鼓勵。
  tag: test-administration
- q: 施測記錄表應包含哪些核心內容？
  a: 所有測驗結果、評論欄位、環境條件紀錄（溫濕度）、設備設定細節（如深蹲起槓高度）。
  tag: test-administration
- q: 為何前後測應由同一人施測？
  a: 不同施測者寬嚴度不一可能扭曲結果；後測評分者更寬鬆會高估進步、更嚴格則會低估進步。
  tag: test-administration
- q: 1RM 測驗各次嘗試之間的休息時間規範？
  a: 非接近最大值的嘗試之間至少休息 2 分鐘；接近最大值的嘗試之間至少休息 3 分鐘。
  tag: test-administration
- q: 測驗電池（test battery）各測驗之間應間隔多久？
  a: 至少 5 分鐘，以避免前一測驗的疲勞影響後續測驗的結果。
  tag: test-administration
- q: 施測前如何準備運動員以提高信度？
  a: 提前公告日期/目的；1-3 天前安排熟悉練習（低強度）；清楚說明動作要領、暖身規定、嘗試次數與計分方式。
  tag: test-administration
- q: 為何測驗應在一天中相同時間施行？
  a: 生理反應因晝夜節律（circadian rhythm）而異，不同時間施測會影響前後比較的準確性。
  tag: test-administration
- q: 暖身對施測信度的影響？
  a: 適當暖身（一般暖身接活動特異性暖身）可提高信度；可允許 2-3 次特異性熱身嘗試後再計入正式分數。
  tag: test-administration
- q: 推薦的施測順序（7 個類別）？
  a: ①非疲勞性測驗（身高體重柔韌垂直跳）→②敏捷→③最大肌力功率→④衝刺→⑤局部肌耐力→⑥無氧容量→⑦有氧容量
  tag: test-sequence
- q: 為何磷酸肌酸系統測驗與無氧糖解測驗的恢復時間差異巨大？
  a: 磷酸肌酸系統 3-5 分鐘可完全恢復；無氧糖解系統（如 300 碼折返跑）需至少 1 小時才能完全恢復。
  tag: test-sequence
- q: 有氧耐力測驗與無氧容量測驗若必須在同天進行，應如何安排？
  a: 放在所有其他測驗之後，且必須在充分休息後施行；理想情況下應安排在不同天。
  tag: test-sequence
