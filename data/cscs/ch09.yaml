  - id: ch09.protein.i05
    q: 蛋白質品質（protein quality）與 PDCAAS 如何判定？
    a:
    - 蛋白質品質取決於胺基酸組成與可消化性；高品質蛋白質消化性高，並含有全部必需胺基酸。
    - 動物性蛋白質（蛋、乳製品、肉、魚、家禽）含全部必需胺基酸；大豆是唯一含全部 9 種必需胺基酸的植物性蛋白質。一般而言，植物性蛋白質較動物性蛋白質不易消化，但加工與調理有時可改善。
    - 蛋白質消化率校正胺基酸分數（protein digestibility corrected amino acid score, PDCAAS）考量可消化性與提供合成身體蛋白質所需必需胺基酸的能力，但不納入食物中其他化合物如何改變胺基酸生物可用性。
    detail: 植物性飲食者仍可在一天內搭配豆類、蔬菜、種子、堅果、米與全穀等不同植物食物，取得所有必需胺基酸；PDCAAS 不能代替對整體食物組合的檢視。
