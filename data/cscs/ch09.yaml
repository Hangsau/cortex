  - id: ch09.vitamins-minerals.i06
    q: 鐵缺乏（iron deficiency）的階段、表現影響與高風險者為何？
    a:
    - 鐵缺乏依嚴重度分三階段：鐵儲存耗竭（depletion）、邊際缺乏（marginal deficiency）、貧血（anemia）。
    - 鐵把氧帶到工作肌肉，即使邊際鐵缺乏也可能損害運動表現；持續的低鐵儲存會讓身體無法製造足夠健康紅血球，形成缺鐵性貧血。
    - 症狀依個人而異，可有虛弱、疲勞、易怒、注意力差、頭痛、運動能力下降、落髮、口乾；缺鐵性貧血還可能有怕冷、舌炎、日常活動呼吸急促及異食癖（pica）。
    detail: 育齡女性、青春期女性、懷孕者、嬰幼兒、長跑者、素食運動員、女性運動員、月經失血多者及某些疾病者風險較高；補鐵的品項與服用方式應由醫師或註冊營養師建議。
