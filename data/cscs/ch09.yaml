  - id: ch09.fat.i06
    q: 脂肪（fat）在運動供能與訓練適應中扮演什麼角色？
    a:
    - 肌肉內與循環中的脂肪酸都可作為運動能量來源；人體脂肪儲備大，是長時間訓練或競賽的龐大燃料來源。
    - 靜息及低強度運動時，產生的能量有高比例來自脂肪酸氧化；運動強度增加時，燃料偏好會逐漸由脂肪轉向碳水化合物。
    - 持續有氧訓練會增加肌肉使用脂肪酸的能力；持續高脂低碳飲食也會使身體適應以較多脂肪供能，但對表現的影響因人而異。
    detail: 「脂肪儲備充足」只說明燃料量大，不代表在任何運動強度都能以脂肪取代碳水化合物的供能角色。
    terms:
    - fat
    - fatty-acid
    - carbohydrate
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    - adaptation
    related:
    - ch03.oxidative.i06
    locator: Macronutrients > Fat > Fat and Performance
  - id: ch09.fat.i07
    q: 本章列出哪些與血中三酸甘油酯（triglycerides）升高有關的因素？
    a:
    - 高精製碳水化合物攝取、體重增加、過量酒精與極低脂飲食都可能增加三酸甘油酯。
    - 久坐生活型態、過重或肥胖、吸菸、遺傳、某些疾病及藥物也會影響三酸甘油酯。
    detail: 原文將這些列為影響因子；三酸甘油酯不能只用單一飲食成分解釋，也不宜將並列因素寫成同一人的必然因果鏈。
    terms:
    - triglyceride
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: Macronutrients > Fat > Relationship With Cholesterol
  - id: ch09.fat.i08
    q: 脂溶性維生素（fat-soluble vitamins）的運輸、儲存與過量風險為何？
    a:
    - 維生素 A、D、E、K 溶於脂肪，由血中的脂肪攜帶，並儲存在體脂肪組織。
    - 過量的預形成維生素 A 具有毒性，可能造成肝損傷等嚴重不良效應；過量維生素 D 可造成心律不整及血鈣升高所引起的組織損傷。
    - 維生素 E 有抗凝血作用，長期過量與出血性中風風險增加相關；維生素 K 過量會干擾部分抗凝血藥物的效果。
    detail: 原文特別區分有毒性的是預形成維生素 A，而非可在體內轉換為維生素 A 的 β-胡蘿蔔素、α-胡蘿蔔素或 β-隱黃素；維生素 A 過量通常與補充品高劑量相關。
    terms:
    - fat-soluble-vitamin
    - vitamin
    numbers: []
    concepts:
    - nutrition
    - safety
    related: []
    locator: Vitamins
- id: hydration
  title: 水分補充 Hydration
  desc: ''
  tag: 水分平衡
  items:
  - id: ch09.hydration.i01
    q: 水分的足夠攝取量（Adequate Intake, AI）與來源為何？
    a:
    - 男性的每日水分 AI 為 3.7 L，女性為 2.7 L；懷孕與哺乳女性分別為每日 3.0 L 與 3.8 L。
    - 所有液體來源都計入水分需求，包括咖啡、茶、果汁、汽水等飲料以及食物中的水分。
    detail: 這些是一般水分 AI；維持訓練和競賽水分平衡的需要量還會受到流汗量、環境、衣著、裝備與體型影響。
