cards:
- q: "碳水化合物如何依糖單位分類？"
  a: "單醣是單一糖分子；雙醣由兩個單醣組成；多醣可含許多葡萄糖單位，澱粉、膳食纖維與糖原皆屬重要多醣。"
  tag: 巨量營養素
- q: "糖原的儲存量、分布與糖原合成為何？"
  a: "人體肝臟與肌肉糖原合計約 15 g/kg 體重；約 3/4 在骨骼肌、1/4 在肝臟。未立即供能的葡萄糖合成糖原稱糖原合成。"
  tag: 巨量營養素
- q: "有氧耐力與肌力／衝刺／技術型運動員的每日碳水化合物建議量為何？"
  a: "每天以 70–80% V̇O2max 訓練至少 90 分鐘的有氧耐力運動員為 8–10 g/kg 體重/日；肌力、衝刺與技術型活動約為 5–6 g/kg 體重/日。"
  tag: 巨量營養素
- q: "升糖指數（GI）如何定義與分級？"
  a: "GI 比較餐後 2 小時的血糖反應與等克數參考食物，白麵包或葡萄糖通常為 GI 100；表中低 GI 為 55 或以下、中 GI 為 55–69、高 GI 為 70 或以上。"
  tag: 巨量營養素
- q: "升糖負荷（GL）如何計算，與 GI 有何差異？"
  a: "GL = 食物 GI × 每份食物碳水化合物克數 ÷ 100。GL 納入一份食物的碳水量，因此比按標準份量的 GI 更貼近實際升糖反應。"
  tag: 巨量營養素
- q: "膳食纖維的每日 DRI 範圍與書中作用為何？"
  a: "女性依年齡、懷孕與哺乳狀態為 21–29 g/日，男性依年齡為 30–38 g/日；纖維可影響胃排空、增加糞便體積和水分，部分可溶性纖維會降低膽固醇吸收。"
  tag: 巨量營養素
- q: "持續低碳水化合物飲食時，運動供能如何適應？"
  a: "習慣攝取碳水化合物者在有氧運動主要使用碳水；持續低碳飲食會使身體更依賴脂肪，但高脂低碳適應對表現的影響因人而異。"
  tag: 巨量營養素
- q: "飲食參考攝取量（DRIs）的目的與依據為何？"
  a: "DRIs 用於評估及規劃健康個人的飲食，涵蓋巨量與微量營養素、電解質和水；其依據是營養攝取與降低慢性病的文獻，不僅是預防缺乏。"
  tag: 指引框架
- q: "RDA、AI、UL、EAR 分別是什麼？"
  a: "RDA：滿足多數健康人的平均每日需求量；AI：無法建立 RDA 時的平均每日建議量；UL：未被認為有不良健康效應的最高平均每日量；EAR：滿足一半健康人口的平均每日量。"
  tag: 指引框架
- q: "本章列出的蛋白質 AMDR 為何？"
  a: "1–3 歲為總熱量 5–20%，4–18 歲為 10–30%，18 歲以上成人為 10–35%。本章正文沒有列出碳水化合物或脂肪的 AMDR。"
  tag: 指引框架
- q: "MyPlate 對運動員有何用途與限制？"
  a: "MyPlate 是美國農業部的五食物群餐盤指引，可作為評估飲食的起點；基本份量是給多數日子中度活動少於 30 分鐘者，活動量較高者應依個人需求調整。"
  tag: 指引框架
- q: "排除乳製品可能造成哪些營養風險？"
  a: "可能難以符合鈣、鉀與維生素 D 的需求；鈣強化非乳替代食品可幫助達到鈣需求，但未必是營養上等效的乳製品替代品。"
  tag: 指引框架
- q: "排除所有動物性食物與魚類時，須留意哪一種維生素？"
  a: "可能無法符合維生素 B12 需求；部分早餐穀片、非乳飲品替代品、肉類替代品與營養酵母有 B12 強化，且原文強烈建議與運動營養師合作安排替代組合。"
  tag: 指引框架
- q: "汗液流失的主要電解質依序為何？"
  a: "最多是氯化鈉，其後依序為鉀、鎂、鈣；鈉有助保留已攝取的液體，所有這些電解質都與肌肉收縮與神經傳導有關。"
  tag: 水分平衡
- q: "低血鈉症的成因、血鈉界線與危險後果為何？"
  a: "劇烈或長時間運動者若過度攝取純水或無鈉、低鈉飲料，血鈉可低於 130 mmol/L；低於 125 mmol/L 可有頭痛、噁心等症狀，低於 120 mmol/L 則腦水腫、癲癇、昏迷與死亡風險增加。"
  tag: 水分平衡
- q: "本章如何預防運動中的低血鈉症？"
  a: "液體攝取不應超過流汗損失，運動結束後的體重不應高於開始時；並應從運動飲料或食物攝取鈉。"
  tag: 水分平衡
- q: "運動員汗液鈉濃度的報告範圍有多大？"
  a: "範圍為 0.2 至超過 12.5 g/L，也就是 10 至超過 544 mEq/L；差異極大，鈉損失大者可能須刻意選高鈉食物、加鹽或在飲料加電解質。"
  tag: 水分平衡
- q: "國家美式足球聯盟（NFL）案例如何顯示不同球員的流汗量？"
  a: "跑衛與接球員每小時平均流汗 1.4 ± 0.45 L，線鋒為 2.25 ± 0.68 L；4.5 小時雙練日合計分別為 6.4 ± 2.0 L 與 10.1 ± 3.1 L。"
  tag: 水分平衡
- q: "重複高溫運動後，熱適應的流汗反應為何？"
  a: "排汗量增加、汗液電解質濃度降低，且開始流汗的體溫下降；原文因此指出球季開始時可能較易脫水與承受熱壓力。"
  tag: 水分平衡
- q: "如何依一小時練習估計排汗量？"
  a: "在劇烈一小時練習前後量體重並測量運動中液體攝取及尿量：排汗量 = 運動前體重 − 運動後體重 + 運動中液體攝取 − 尿量。"
  tag: 水分平衡
- q: "本章所稱脂肪如何分類，並提供多少能量？"
  a: "飽和脂肪酸沒有雙鍵，單元不飽和有一個雙鍵，多元不飽和有兩個或以上雙鍵；脂肪約提供 9 kcal/g，碳水化合物與蛋白質約各 4 kcal/g。"
  tag: 巨量營養素
- q: "必需脂肪酸有哪些，ALA 轉換 EPA 與 DHA 的比例如何？"
  a: "必需的多元不飽和脂肪酸是 omega-6 與 omega-3；成人體內約 5% 的 ALA 轉為 EPA，少於 0.5% 轉為 DHA。"
  tag: 巨量營養素
- q: "本章如何表述 EPA 與 DHA 的健康效應？"
  a: "它們與三酸甘油酯的劑量依賴性下降有關，與小幅但具統計顯著性的血壓下降有關（尤其老年人），且可能有抗心律不整作用。"
  tag: 巨量營養素
- q: "表 9.7 的 LDL、總膽固醇與 HDL 分類為何？"
  a: "LDL：<100 最佳、130–159 邊界偏高、160–189 高、>190 非常高；總膽固醇：<200 理想、200–239 邊界偏高、>240 高；HDL：<40 低、>60 高，單位均為 mg/dL。"
  tag: 巨量營養素
- q: "飲食指南諮詢委員會報告對飽和脂肪、反式脂肪與添加糖的建議為何？"
  a: "避免含反式脂肪的部分氫化油；飽和脂肪少於總熱量 10%，以不飽和脂肪尤其多元不飽和脂肪取代；添加糖最多為總熱量 10%。"
  tag: 巨量營養素
- q: "脂肪在不同運動強度下的供能角色如何？"
  a: "肌肉內與循環脂肪酸皆可供能；靜息和低強度運動時，能量有高比例來自脂肪酸氧化，隨強度提高逐漸轉向碳水化合物。"
  tag: 巨量營養素
- q: "脂溶性維生素有哪些，過量時的主要風險為何？"
  a: "A、D、E、K 由脂肪運輸並儲存在體脂肪；過量預形成維生素 A 有毒性，過量 D 可造成高血鈣與心律不整，長期過量 E 與出血性中風風險增加相關。"
  tag: 微量營養素
- q: "男性、女性、懷孕與哺乳女性的每日水分 AI 為何？"
  a: "男性 3.7 L、女性 2.7 L、懷孕女性 3.0 L、哺乳女性 3.8 L；飲料與食物中的所有液體來源都計入。"
  tag: 水分平衡
- q: "輕度脫水達多少體重減少會影響運動表現？"
  a: "即使體重減少 2–3% 也會升高核心體溫、增加疲勞，並降低動機、神經肌肉控制、準確性、爆發力、肌力、肌耐力與整體表現。"
  tag: 水分平衡
- q: "USG、運動前後體重與尿液顏色如何用於水合評估？"
  a: "原文的正常水合 USG 截點為 <1.020 g/ml，但較適合慢性變化；每減少 1 磅（0.45 kg）約代表 16 oz（0.5 L）液體，尿液顏色判讀則很主觀。"
  tag: 水分平衡
- q: "熱天長時間運動時，醫學研究院（Institute of Medicine, IOM）建議運動飲料的成分為何？"
  a: "每 L 含鈉 20–30 mEq（460–690 mg）、鉀 2–5 mEq（78–195 mg）及碳水化合物 5–10%；在高速攝取飲料的劇烈或長時間活動中，可考慮不同運輸機制的多種碳水化合物。"
  tag: 水分平衡
- q: "脫水明顯或下次運動少於 12 小時時，運動後復水量為何？"
  a: "每減少 1 kg 體重約補充 1.5 L（50 oz）含足夠電解質的液體；每減少 1 磅約為 0.7 L（24 oz）。"
  tag: 水分平衡
- q: "哪些人或情境有較高脫水風險？"
  a: "兒童、老年人、具鐮刀型紅血球特徵或囊性纖維化者、炎熱潮濕或高海拔環境、體型大且裝備多者，以及採刻意脫水減重方式的摔角選手，都是原文列舉的風險例子。"
  tag: 水分平衡
- q: "本章的兒童與青少年訓練中飲水指引為何？"
  a: "88 磅（40 kg）兒童每 20 分鐘喝 5 oz（148 ml），132 磅（60 kg）青少年每 20 分鐘喝 9 oz（266 ml）；同章摘要把毫升數寫為 150 與 250 ml，教材原文如此。"
  tag: 水分平衡
- q: "19 歲以上健康成人的蛋白質 RDA 與一般健身者可能需求為何？"
  a: "RDA 為 0.80 g/kg 體重/日，基於氮平衡研究；一般健身計畫的成人可能以 0.8–1.0 g/kg 體重/日滿足需求。"
  tag: 巨量營養素
- q: "有氧耐力、肌力與減熱量運動員的蛋白質建議量為何？"
  a: "有氧耐力運動員為 1.0–1.6 g/kg 體重/日；肌力運動員為 1.4–1.7；章末指引對減熱量運動員列約 1.8–2.7。"
  tag: 巨量營養素
- q: "運動後蛋白質與急性肌肉蛋白合成（muscle protein synthesis, MPS）的關係為何？"
  a: "運動後肌肉對胺基酸的敏感性可增加達 48 小時但會下降；阻力訓練後 20–48 g 蛋白質有助最大刺激急性 MPS。耐力運動後適當蛋白質量尚未完全釐清。"
  tag: 巨量營養素
- q: "人體的必需胺基酸與條件必需胺基酸如何分類？"
  a: "人體蛋白質由 20 種胺基酸組成，4 種可合成；9 種必需胺基酸為 histidine、isoleucine、leucine、lysine、methionine、phenylalanine、threonine、tryptophan、valine；另有 8 種在疾病與壓力時成為條件必需。"
  tag: 巨量營養素
- q: "PDCAAS 判讀什麼，哪些蛋白質含所有必需胺基酸？"
  a: "PDCAAS 同時考量蛋白質可消化性與提供必需胺基酸的能力，但不納入食物內其他化合物對胺基酸生物可用性的影響；動物性蛋白質與大豆含全部必需胺基酸。"
  tag: 巨量營養素
- q: "蛋白質與骨骼健康的書中關係為何？"
  a: "蛋白質約占骨骼體積 50%、骨質量 33%，可能部分透過 IGF-I 影響骨與肌肉形成；低膳食蛋白質 0.7 g/kg 體重/日會抑制腸道鈣吸收。"
  tag: 巨量營養素
- q: "2.8 g/kg 體重/日高蛋白質研究的結論與限制為何？"
  a: "一項以 7 日飲食紀錄評估運動員的研究，該攝取量未損害腎功能指標；但這不代表所有人與更高攝取量均已證實安全，且持續過高可能犧牲碳水化合物和脂肪食物的營養素。"
  tag: 巨量營養素
- q: "運動營養專科認證（Board Certified Specialist in Sports Dietetics, CSSD）代表什麼？"
  a: "CSSD 是 Academy of Nutrition and Dietetics 用來區分具運動營養專長註冊營養師與其他營養專長註冊營養師的認證。"
  tag: 角色分工
- q: "肌力與體能專業人員在營養服務上的範圍與限制為何？"
  a: "可作為運動營養教練提供基本營養教育與建議；以食物或營養治療或管理醫療狀況（含營養素缺乏）的醫療營養治療屬運動營養師角色。"
  tag: 角色分工
- q: "運動營養團隊為何須遵守健康保險可攜性與責任法案（HIPAA）？"
  a: "為提供完整照護，運動員營養與醫療資訊可能與相關團隊或家屬共享；在美國，所有工作人員應依 HIPAA 指引處理受保護健康資訊。"
  tag: 角色分工
- q: "何時應轉介給團隊醫師或運動營養師？"
  a: "基本營養問題可由各運動營養專業人員回答；複雜營養問題應轉介。團隊醫師負責醫療照護，運動營養師負責個人化飲食建議，兩者也可能共同處理飲食失調、營養素缺乏或特定疾病。"
  tag: 角色分工
- q: "運動營養師建立個人化計畫前會評估哪些面向？"
  a: "先確認運動員與教練目標，再檢視飲食、文化與宗教偏好、烹飪能力、食物可近性、經濟限制、補充品、體重與體組成史、病史、訓練與傷病。"
  tag: 角色分工
- q: "脂溶性與水溶性維生素在儲存上有何差異？"
  a: "脂溶性 A、D、E、K 由脂肪運輸並儲存於體脂肪；水溶性 B 群與 C 經血液運輸、通常不大量儲存且多餘隨尿排出，B12 可在肝臟儲存數年。"
  tag: 微量營養素
- q: "血基質鐵與非血基質鐵的吸收率及飲食影響因素為何？"
  a: "血基質鐵約吸收 15–35%，不受同餐物質影響；非血基質鐵約吸收 2–20%，會受植酸、單寧、鈣等抑制，而同餐攝取維生素 C 或血基質鐵可增加吸收。"
  tag: 微量營養素
- q: "鐵缺乏的三個階段為何？"
  a: "依嚴重度依序為鐵儲存耗竭、邊際缺乏、貧血；即使邊際鐵缺乏也可能損害運動表現。"
  tag: 微量營養素
- q: "鈣對青少年骨骼與女性鈣攝取的書中資訊為何？"
  a: "峰值骨礦物質密度最多 90% 發生於青春期晚期；國民健康與營養檢查調查（NHANES）中僅 15% 的 9–13 歲女性，以及少於 10% 的 14–18 歲與 51 歲以上女性，僅靠飲食達到鈣 AI。"
  tag: 微量營養素
- q: "本章列出的關切營養素與攝取不足情況為何？"
  a: "所有年齡與性別組都高度盛行維生素 E 與鎂攝取不足；所有超過 2 歲者的纖維與鉀平均平常攝取量低於 DRI。2015 報告列纖維、鉀、鈣和維生素 D 為關切營養素。"
  tag: 微量營養素
- q: "50 歲以上成人為何要注意維生素 B12？"
  a: "約 10–30% 老年人胃中鹽酸不足而影響 B12 吸收；50 歲以上成人被鼓勵選擇合成 B12 強化食物或補充品，身體通常能吸收這些來源。"
  tag: 微量營養素
