  - id: ch09.vitamins-minerals.i05
    q: 本章列出的「關切營養素」與特定族群鐵、葉酸風險為何？
    a:
    - 所有年齡與性別組都高度盛行維生素 E 與鎂攝取不足；所有超過 2 歲者的纖維與鉀平均平常攝取量都低於 DRI。
    - 飲食指南諮詢委員會科學報告將纖維、鉀、鈣與維生素 D 列為關切營養素。
    - 可懷孕的許多女性與青春期女性缺鐵，同一群體中的許多人未達到膳食葉酸需求；鐵也是特定族群的關切營養素。
    detail: 「關切」描述的是人口攝取狀況或特定族群風險，不等於任何個人已經缺乏；個人缺乏仍需個別評估。
