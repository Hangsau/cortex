  - id: ch09.protein.i01
    q: 健康成人的蛋白質（protein）RDA 與一般健身者建議量為何？
    a:
    - 19 歲以上男女的蛋白質建議膳食攝取量（Recommended Dietary Allowance, RDA）是每日每公斤體重 0.80 g，依據氮平衡研究。
    - 參與一般健身計畫的成人，可能以每日每公斤體重 0.8–1.0 g 滿足蛋白質需求。
    detail: RDA 的背景是健康、久坐成人持續的細胞與細胞蛋白周轉；書中另指出運動員與劇烈運動者需要更多，不能把一般健身者範圍誤當作競技運動員處方。
