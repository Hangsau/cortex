  - id: ch09.fat.i03
    q: EPA 與 DHA 的書中健康效應如何表述？
    a:
    - EPA 與 DHA 與三酸甘油酯的劑量依賴性下降有關。
    - 它們與小幅但具統計顯著性的血壓下降有關，尤其在老年人；也可能具有抗心律不整作用。
    detail: 原文對抗心律不整使用的是「可能」效果，且未將這些關聯寫成運動表現或所有人必有的效果。
