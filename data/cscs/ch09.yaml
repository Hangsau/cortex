  - id: ch09.hydration.i07
    q: 哪些人或情境有較高脫水（dehydration）風險，原因為何？
    a:
    - 兒童相較成人有較高體表面積－體重比、運動產熱增加、較難靠流汗散熱且口渴感較低；老年人則因水分保存的生理改變與飲水量隨年齡下降而風險較高。
    - 鐮刀型紅血球特徵、囊性纖維化與其他疾病者風險增加；炎熱潮濕環境及高海拔也會增加風險。
    - 體型較大、衣著或裝備較多者流汗率較高；美式足球選手（特別是線鋒）、冰球選手與採用刻意脫水減重方式的摔角選手是書中的例子。
    detail: 原文將風險連結到生理、環境、裝備與行為等多重因素，不能把任何單一族群身分直接當作已脫水的判定。
    terms:
    - dehydration
    - hydration
    numbers: []
    concepts:
    - nutrition
