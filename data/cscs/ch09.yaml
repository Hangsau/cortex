  - id: ch09.hydration.i04
    q: 運動前如何進行預先補水？
    a:
    - 運動員應以低於 1.020 g/ml 的 USG 為起始訓練水合目標。
    - 有需要時，應在運動前數小時預先補水，以保留液體吸收與排尿的時間。
    detail: 這項目標在原文屬一般起點；運動員若起始已處於低水合狀態，單靠運動中飲水較難補足原先的缺口。
