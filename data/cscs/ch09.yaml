  - id: ch09.vitamins-minerals.i04
    q: 鈣（calcium）對骨骼與運動員飲食有何重要性？
    a:
    - 兒童與青少年有足夠鈣攝取對強健骨骼發展很重要；鈣在青春期幫助骨骼長度與密度增加，峰值骨礦物質密度最多 90% 發生於青春期晚期。成人則靠鈣維持骨密度。
    - 飲食鈣不足時，身體會從骨骼儲存處取鈣，以維持血液、肌肉與細胞間液的鈣濃度；缺鈣會妨礙達到峰值骨礦物質密度並增加日後骨折風險。
    - NHANES 發現僅 15% 的 9–13 歲女性，以及少於 10% 的 14–18 歲女性與 51 歲以上女性，僅靠飲食達到鈣的 AI；原文鼓勵運動員納入乳製品及其他富鈣食物。
    detail: 鈣除了骨骼，也參與牙齒、肌肉收縮、神經功能、血管舒縮與荷爾蒙及酶分泌；若飲食無法達標，是否補充應由運動員的醫師或註冊營養師建議。
    terms:
    - calcium
    - bone-mineral-density
    - adequate-intake
    - national-health-and-nutrition-examination-survey
    numbers:
    - v: 90
      unit: '% 峰值骨礦物質密度'
      of: 原文所述發生於青春期晚期的最多比例
    - v: 15
      unit: '% 9–13 歲女性'
