  - id: ch09.protein.i07
    q: 蛋白質（protein）與骨骼健康的書中關係為何？
    a:
    - 蛋白質是強健骨骼的建材，約占骨骼體積 50%、骨質量 33%。
    - 蛋白質對骨骼的影響，部分可能來自它對第一型類胰島素生長因子（insulin-like growth factor-I, IGF-I）的作用；IGF-I 由肝臟產生並促進骨與肌肉形成。
    - 健康者每日每公斤體重攝取 0.7–2.1 g 蛋白質時，尿鈣排泄與腸道鈣吸收都會增加；低膳食蛋白質攝取量 0.7 g/kg 體重/日會抑制腸道鈣吸收。
    detail: 原文區分「補充」蛋白質與「飲食」蛋白質：研究提示前者但非後者會增加尿鈣流失；不能把此現象延伸成一般飲食蛋白質必然傷骨。
    terms:
    - protein
    - insulin-like-growth-factor-i
    numbers:
    - v: 50
      unit: '% 骨骼體積'
      of: 蛋白質占骨骼體積的比例
    - v: 33
      unit: '% 骨質量'
      of: 蛋白質占骨質量的比例
    - v: 0.7–2.1
      unit: g/kg 體重/日
      of: 健康者尿鈣排泄與腸道鈣吸收皆增加的蛋白質攝取範圍
    - v: 0.7
      unit: g/kg 體重/日
      of: 原文指出會抑制腸道鈣吸收的低膳食蛋白質攝取量
