  - id: ch09.protein.i08
    q: 健康運動員高蛋白質（protein）攝取的書中安全性界線與限制為何？
    a:
    - 對健康者而言，高於 RDA 的蛋白質攝取疑慮大多沒有根據；多餘而未用於組織合成的蛋白質會分解，氮以尿素隨尿排出，剩餘酮酸可作能量、轉成碳水化合物或體脂肪。
    - 一項以 7 日飲食紀錄評估運動員的研究發現，每日每公斤體重最高 2.8 g 蛋白質未損害任何腎功能指標。
    - 但持續高於建造與修復肌肉建議量的攝取不建議，因為可能犧牲碳水化合物、脂肪及其常見食物所帶來的營養素。
    detail: 2.8 g/kg 的結論來自特定運動員研究和七日飲食紀錄，不能擴大為所有人、所有更高攝取量皆已證實安全。
    terms:
    - protein
    - gluconeogenesis
    numbers:
    - v: 7
      unit: 日飲食紀錄
      of: 評估高蛋白質運動員攝取量的研究紀錄期間
    - v: 2.8
      unit: g/kg 體重/日
      of: 該研究中未損害腎功能指標的最高蛋白質攝取量
    concepts:
