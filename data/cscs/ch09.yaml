  - id: ch09.dietary-reference-standards.i07
    q: 我的餐盤（MyPlate）對運動員可提供什麼參考？
    a:
    - MyPlate 是美國農業部依據《美國人飲食指南》建立的食物指引系統，以用餐時的餐盤視覺呈現五個食物群。
    - 其熱量、蔬果、穀物、蛋白質與油脂份量建議，是給多數日子中度身體活動少於 30 分鐘者；活動量較高者應依個人飲食需求調整。
    detail: 原文把 MyPlate 定位為運動員評估飲食的起點，而非完成的運動營養計畫；食物群多樣性有助於取得較完整的維生素與礦物質。
    terms:
    - myplate
    numbers:
    - v: 5
      unit: 個食物群
      of: MyPlate 餐盤視覺所呈現的食物群數量
    - v: '<30'
      unit: 分鐘/日
      of: MyPlate 基本份量建議所對應的多數日子中度身體活動量
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: Standard Nutrition Guidelines > MyPlate
  - id: ch09.dietary-reference-standards.i08
    q: 排除整個食物群時，本章指出哪些營養風險？
    a:
    - 排除乳製品的運動員可能難以符合鈣、鉀與維生素 D 的營養需求；雖然鈣強化的非乳替代食品可幫助達到鈣需求，未必是營養上等效的乳製品替代品。
    - 排除所有動物性食物與魚類者，可能無法符合維生素 B12 需求；部分早餐穀片、非乳飲品替代品、肉類替代品與營養酵母有 B12 強化。
    - 排除食物群者，原文強烈建議與運動營養師合作，找出適當替代食品或組合。
    detail: 食物群內的食物雖有可互換的相似營養組成，同一群仍應選擇多樣食物；整群排除時要檢視的是整體替代組合，不能只以單一強化產品判定。
    terms:
    - myplate
    - sports-dietitian
    - vitamin
    numbers: []
    concepts:
    - nutrition
    - population
    related:
    - ch09.sports-dietitian-role.i02
    locator: Standard Nutrition Guidelines > MyPlate
- id: electrolytes
  title: 電解質 Electrolytes
  desc: ''
  tag: 水分平衡
  items:
  - id: ch09.electrolytes.i01
    q: 汗液流失的主要電解質（electrolytes）為何？
    a:
    - 汗液流失最多的是氯化鈉，其後依序為鉀、鎂與鈣。
    - 鈉藉由幫助保留已攝取的液體，影響液體調節。
    - 所有隨汗流失的電解質都與肌肉收縮及神經傳導有關；體液電解質平衡受干擾時，可能干擾表現。
    detail: 這個順序是原文對「汗液流失量」的排序，不是人體總含量或每日飲食需要量的排序。
    terms:
    - electrolyte
    numbers: []
    concepts:
    - nutrition
    - safety
    related:
    - ch10.during-event.i02
    locator: Fluid and Electrolytes > Electrolytes
  - id: ch09.electrolytes.i02
    q: 低血鈉症（hyponatremia）的成因、界線與嚴重後果為何？
    a:
    - 劇烈或長時間運動者若以大量純水或無鈉、低鈉飲料過度補水，可將血鈉稀釋到低於 130 mmol/L，形成低血鈉症。
    - 血鈉低於 125 mmol/L 時，細胞內腫脹可伴隨頭痛、噁心、嘔吐、肌肉痙攣、手腳腫脹、躁動與定向感混亂。
    - 血鈉低於 120 mmol/L 時，腦水腫、癲癇、昏迷、腦幹疝脫、呼吸停止與死亡風險增加。
    detail: 原文把危險情境限定為「補液超過流汗損失」且飲料缺鈉，並非把正常飲水本身描述為致病原因。
    terms:
    - hyponatremia
    - electrolyte
    numbers:
    - v: '<130'
      unit: mmol/L 血鈉
      of: 原文界定為低血鈉症的危險性低血鈉濃度
    - v: '<125'
      unit: mmol/L 血鈉
      of: 原文列出頭痛、噁心等症狀時的血鈉濃度
    - v: '<120'
      unit: mmol/L 血鈉
      of: 腦水腫、癲癇、昏迷及死亡風險增加時的血鈉濃度
    concepts:
    - nutrition
    - safety
    related:
    - ch10.during-event.i01
    - ch12.safety.i08
    locator: Fluid and Electrolytes > Electrolytes
  - id: ch09.electrolytes.i03
    q: 本章如何預防運動中的低血鈉症（hyponatremia）？
    a:
    - 液體攝取量不應超過流汗損失；運動結束後的體重不應高於訓練開始時。
    - 運動員應從運動飲料或食物攝取鈉。
    detail: 這是避免過度稀釋血鈉的原則；實際液體與電解質補充仍要依個人流汗量與汗液濃度規劃。
    terms:
    - hyponatremia
    - electrolyte
    numbers: []
    concepts:
    - nutrition
    - safety
    related:
    - ch10.during-event.i01
    - ch12.safety.i08
    locator: Fluid and Electrolytes > Electrolytes
  - id: ch09.electrolytes.i04
    q: 汗液鈉流失為何必須個人化評估？
    a:
    - 運動員汗液鈉濃度的報告範圍從 0.2 到超過 12.5 g/L，也就是 10 到超過 544 mEq/L。
    - 鈉損失量很大者，可能需要刻意選擇較高鈉食物、在食物加鹽，並在運動飲料中加入電解質。
    detail: 原文強調鈉濃度的個別差異極大；不能由單一通用濃度反推出每位運動員的補鈉量。
    terms:
    - electrolyte
    numbers:
    - v: 0.2 至 >12.5
      unit: g/L 汗液
      of: 運動員汗液鈉濃度的報告範圍
    - v: 10 至 >544
      unit: mEq/L 汗液
      of: 同一汗液鈉濃度報告範圍的毫當量表示
    concepts:
