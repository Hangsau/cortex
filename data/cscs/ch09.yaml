    related: []
    locator: Minerals
  - id: ch09.vitamins-minerals.i08
    q: 50 歲以上成人為何要特別留意維生素 B12？
    a:
    - 約 10–30% 的老年人胃中鹽酸不足，會影響維生素 B12 吸收。
    - 因此 50 歲以上成人被鼓勵攝取以合成維生素 B12 強化的食物或服用膳食補充品；身體通常能吸收這些來源的 B12。
    - B12 可見於動物性食物、強化營養酵母與強化穀片；牛、羊、小牛與魚是較佳來源。
    detail: 原文指出 B12 已不再被列為關切營養素，但仍因年齡相關吸收限制提出這項建議；適用界線是 50 歲以上成人，不應延伸為所有年齡者都需補充。
