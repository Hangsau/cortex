    locator: Fluid and Electrolytes
  - id: ch09.electrolytes.i08
    q: 如何以運動前後體重建立個人化補水計畫？
    a:
    - 在劇烈的 1 小時練習前後量體重，並測量運動中液體攝取與尿量；排汗量 = 運動前體重 − 運動後體重 + 運動中液體攝取 − 尿量。
    - 應在特定天候下進行測量，依所得資訊建立個人化補水策略。
    detail: 原文以一小時練習的測量流程來估計流汗量；立刻重新補水時，尿量、尿比重或尿量評估可能在真正復水前就顯示大量排尿，因而造成誤判。
