  - id: ch09.hydration.i06
    q: 運動後如何依恢復時間補回水分與電解質？
    a:
    - 若下一次運動前時間充裕，正常餐點、含部分鈉的點心和水可恢復水分與電解質；汗液鈉流失很大時可在食物中額外加鹽。
    - 若脫水明顯，或距離下一次運動少於 12 小時，應採較積極方式：每減少 1 kg 體重，約攝取 1.5 L（50 oz）且有足夠電解質的液體；每減少 1 磅則約 0.7 L（24 oz）。
    detail: 較大的補液量納入大量飲水後尿量增加的損失；它是恢復時間短或脫水明顯時的處方，不是每次運動後人人都需要的固定量。
    terms:
