id: ch09
weight: 9
title: Ch.9 Basic Nutrition Factors in Health
topics:
- id: carbohydrate
  title: 碳水化合物 Carbohydrate
  desc: ''
  tag: 巨量營養素
  items:
  - id: ch09.carbohydrate.i01
    q: 分類
    a:
    - 單醣（葡萄糖、果糖、半乳糖）→ 雙醣（蔗糖、乳糖、麥芽糖）→ 多醣（澱粉、纖維、糖原）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.carbohydrate.i02
    q: 糖原 (Glycogen)
    a:
    - 儲量：~15 g/kg 體重
    - 3/4 在骨骼肌、1/4 在肝臟。糖原合成稱 glycogenesis
    - 是高強度運動主要燃料
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.carbohydrate.i03
    q: 運動員建議量
    a:
    - 有氧耐力（≥90 分鐘/天）：8–10 g/kg/day
    - 肌力/衝刺/技術：5–6 g/kg/day
    - 運動後 30 分鐘內：1.5 g/kg 高 GI 碳水促進快速糖原再合成
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.carbohydrate.i04
    q: GI（升糖指數）
    a:
    - 以白麵包或葡萄糖 GI=100 為基準，評估食物升血糖速度。低 ≤55、中 55–69、高 ≥70。運動中用高 GI
    - 運動前效果混合
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.carbohydrate.i05
    q: GL（升糖負荷）
    a:
    - GL = GI × 每份碳水克數 ÷ 100
    - 比 GI 更貼近實際血糖反應（考慮份量）。低 GL 飲食改善胰島素敏感性、降低發炎標誌
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.carbohydrate.i06
    q: 纖維 (Fiber)
    a:
    - DRI：女性 21–29 g/day
    - 男性 30–38 g/day。低纖維與便秘、心臟病、結腸癌、第 2 型糖尿病相關
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.carbohydrate.i07
    q: 低碳適應
    a:
    - 長期低碳飲食 → 身體轉向脂肪為主要燃料（fat adaptation）
    - 可能降低對碳水的依賴，但對表現影響因人而異
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.carbohydrate.i08
    q: 碳水與蛋白質保護
    a:
    - 高糖原儲量可降低蛋白質作為燃料的比例
    - 糖原耗盡時蛋白質供能可達總消耗的 10%
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
- id: dietary-reference-standards
  title: 飲食參考標準 Dietary Reference Standards
  desc: ''
  tag: 指引框架
  items:
  - id: ch09.dietary-reference-standards.i01
    q: DRI 定義
    a:
    - Dietary Reference Intakes
    - 美國食品與營養委員會制定
    - 涵蓋巨量＋微量營養素＋電解質＋水
    - 基於慢性病預防，非只是預防缺乏
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
  - id: ch09.dietary-reference-standards.i02
    q: RDA
    a:
    - Recommended Dietary Allowance：滿足同年齡/性別大多數健康人每日需求的平均攝取量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
  - id: ch09.dietary-reference-standards.i03
    q: AI
    a:
    - Adequate Intake：無法建立 RDA 時使用的建議攝取量（例如水分、纖維、鉀）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
  - id: ch09.dietary-reference-standards.i04
    q: UL
    a:
    - Tolerable Upper Intake Level：不造成不良影響的最高每日攝取量（含食物＋水＋補充品）
    - 超過 UL 風險增加
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
  - id: ch09.dietary-reference-standards.i05
    q: EAR
    a:
    - Estimated Average Requirement：滿足同年齡/性別 50% 健康人需求的平均每日攝取量
    - 用於評估群體
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
  - id: ch09.dietary-reference-standards.i06
    q: AMDR
    a:
    - Acceptable Macronutrient Distribution Range
    - 蛋白質：成人 10–35%
    - 碳水：成人 45–65%
    - 脂肪：成人 20–35%
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
  - id: ch09.dietary-reference-standards.i07
    q: MyPlate
    a:
    - USDA 飲食指南視覺工具，5 大食物群（蔬菜、水果、穀物、蛋白質、乳製品）。以身體活動量少者為基準，運動員需調整
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
  - id: ch09.dietary-reference-standards.i08
    q: 排除食物群的風險
    a:
    - 不喝奶 → 鈣、鉀、維生素 D 不足
    - 不吃動物食品 → B12 不足（需強化食品或補充）
    - 排除整個食物群應諮詢運動營養師
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: ''
- id: electrolytes
  title: 電解質 Electrolytes
  desc: ''
  tag: 水分平衡
  items:
  - id: ch09.electrolytes.i01
    q: 汗液主要電解質
    a:
    - 排序：氯化鈉（最多）→ 鉀 → 鎂 → 鈣。鈉對液體調節最關鍵，協助身體保留水分
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.electrolytes.i02
    q: 低血鈉 (Hyponatremia)
    a:
    - 血鈉 <130 mmol/L
    - 症狀：頭痛、噁心、肌肉痙攣。<120 mmol/L → 腦水腫、癲癇、昏迷風險。過量飲用低鈉水造成
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.electrolytes.i03
    q: 預防低血鈉
    a:
    - 避免運動後體重高於運動前
    - 運動中補充含鈉飲料或食物
    - 勿只喝白水
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.electrolytes.i04
    q: 鈉流失個體差異
    a:
    - 報告範圍：0.2–12.5+ g/L 汗液
    - 差異極大 → 需個人化電解質補充策略。高鈉流失者需主動選擇高鈉食物或補充電解質
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.electrolytes.i05
    q: 鉀攝取
    a:
    - 美國 <2% 成人達到鉀的飲食建議量。運動飲料含鉀量少，無法替代日常鉀攝取
    - 應從番茄、柑橘、香蕉、牛奶補充
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.electrolytes.i06
    q: 汗液量差異
    a:
    - NBA 球員：每場（40 分鐘）平均流失 2.2 L，範圍 1.0–4.6 L。NFL 線鋒：每小時流失約 2.25 L
    - 4.5 小時雙練總計約 10.1 L
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.electrolytes.i07
    q: 熱適應
    a:
    - 反覆高溫訓練 → 排汗量增加、汗液電解質濃度降低、開始排汗體溫降低。季初選手比賽適應性較差，脫水與熱壓風險較高
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.electrolytes.i08
    q: 個人化計畫
    a:
    - 計算排汗率 = （運動前體重 − 運動後體重 + 飲水量 − 尿量）
    - 根據特定環境條件制定個人化補水計畫
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
- id: fat
  title: 脂肪 Fat
  desc: ''
  tag: 巨量營養素
  items:
  - id: ch09.fat.i01
    q: 分類
    a:
    - 飽和脂肪酸（無雙鍵）→ 單元不飽和（1 個雙鍵）→ 多元不飽和（≥2 個雙鍵）
    - 脂肪提供 9 kcal/g
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.fat.i02
    q: 必需脂肪酸
    a:
    - Omega-6（大豆油、玉米油）& Omega-3（EPA、DHA 來自魚油）為必需
    - ALA（亞麻籽、核桃）轉換 EPA 僅約 5%、DHA <0.5%
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.fat.i03
    q: EPA & DHA
    a:
    - 劑量依賴性降低三酸甘油酯
    - 輕微降血壓（尤其老年人）
    - 潛在抗心律不整效果
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.fat.i04
    q: 膽固醇分類
    a:
    - LDL <100 最佳
    - HDL >60 保護性
    - 總膽固醇 <200 理想
    - VLDL（極低密度）最具動脈阻塞性
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.fat.i05
    q: 飲食建議
    a:
    - 飽和脂肪 <10% 總熱量
    - 避免反式脂肪（部分氫化油）
    - 添加糖 <10% 總熱量（2015 DGA）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.fat.i06
    q: 脂肪與表現
    a:
    - 靜息與低強度運動主要燃燒脂肪
    - 強度升高逐漸轉為碳水。訓練良好的肌肉脂肪氧化能力更高
    - 體脂肪是龐大能量儲備
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.fat.i07
    q: 三酸甘油酯升高
    a:
    - 高精製碳水、體重增加、過量酒精、極低脂飲食都會升高血中三酸甘油酯
    - 另受久坐、肥胖、遺傳影響
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch09.fat.i08
    q: 脂溶性維生素
    a:
    - A、D、E、K 由脂肪攜帶於血液中並儲存於脂肪組織
    - 攝取過多有毒性風險（尤其 A、D）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
- id: hydration
  title: 水分補充 Hydration
  desc: ''
  tag: 水分平衡
  items:
  - id: ch09.hydration.i01
    q: 每日水分 AI
    a:
    - 男性 3.7 L/day
    - 女性 2.7 L/day
    - 孕婦 3.0 L
    - 哺乳 3.8 L。含所有飲料及食物中水分
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.hydration.i02
    q: 脫水影響
    a:
    - 體重減少 2–3% → 升高核心體溫、疲勞↑、神經肌肉控制↓、力量↓、耐力↓、整體表現顯著下滑
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.hydration.i03
    q: 水合狀態評估
    a:
    - ①尿比重（USG）<1.020 = 正常
    - ②體重變化（每減少 0.45 kg = 0.5 L 液體流失）
    - ③尿液顏色（主觀，B 維生素會影響顏色）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.hydration.i04
    q: 運動前補水
    a:
    - 目標 USG <1.020
    - 如有不足需提前數小時補水，讓身體吸收並排出多餘尿液
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.hydration.i05
    q: 運動中補水
    a:
    - 熱天長時間運動：飲料含鈉 460–690 mg/L、鉀 78–195 mg/L、碳水 5–10%。飲料溫度應為 10–15°C。多種碳水來源（葡萄糖＋果糖＋麥芽糊精）提升吸收率
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.hydration.i06
    q: 運動後補水
    a:
    - 若脫水顯著或距下次訓練 <12 小時：補充 1.5 L 液體（含電解質）/ kg 體重流失
    - 正餐含鈉食物幫助液體滯留
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.hydration.i07
    q: 高風險族群
    a:
    - 兒童（體表面積比大、排汗少、口渴感弱）
    - 老年人（水分保留能力下降）
    - 美式足球員（體型大＋裝備）
    - 摔跤選手（人為脫水）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.hydration.i08
    q: 兒童補水指引
    a:
    - 40 kg 兒童：每 20 分鐘喝 150 ml 冷水或含鹽飲料
    - 60 kg 青少年：每 20 分鐘喝 250 ml
    - 即使不渴也要定時補充
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
- id: protein
  title: 蛋白質 Protein
  desc: ''
  tag: 巨量營養素
  items:
  - id: ch09.protein.i01
    q: RDA
    a:
    - 0.80 g/kg/day（19 歲以上健康成人）
    - 基於氮平衡研究。一般健身者：0.8–1.0 g/kg/day
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.protein.i02
    q: 運動員需求量
    a:
    - 有氧耐力：1.0–1.6 g/kg/day
    - 肌力運動：1.4–1.7 g/kg/day
    - 減熱量期：1.8–2.7 g/kg/day
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.protein.i03
    q: 運動後補蛋白
    a:
    - 阻力訓練後：20–48 g 可最大化急性 MPS（肌肉蛋白合成）
    - 48 小時內敏感性增高，越早補越好
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.protein.i04
    q: 必需胺基酸
    a:
    - 9 種必需（人體無法合成）：His, Ile, Leu, Lys, Met, Phe, Thr, Trp, Val
    - 8 種條件必需（生病/壓力時需攝取）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.protein.i05
    q: 蛋白質品質
    a:
    - PDCAAS：考量消化率＋必需胺基酸組成。動物蛋白（蛋、奶、肉）& 大豆含全部 9 種必需 AA
    - 植物蛋白消化率較低
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.protein.i06
    q: AMDR
    a:
    - 成人：10–35% 總熱量來自蛋白質
    - 熱量攝入低時蛋白質 % 需提高（每減少 100 kcal 約增加 1%）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.protein.i07
    q: 蛋白質與骨骼
    a:
    - 佔骨骼體積 50%、骨質量 33%
    - 透過 IGF-I 促進骨骼與肌肉生成
    - 低攝入（0.7 g/kg/day）抑制腸道鈣吸收
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch09.protein.i08
    q: 蛋白質安全性
    a:
    - 每日高達 2.8 g/kg 不損害腎功能（健康運動員）
    - 但過高可能排擠碳水與脂肪的攝取空間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
- id: sports-dietitian-role
  title: 運動營養師角色 Sports Dietitian Role
  desc: ''
  tag: 角色分工
  items:
  - id: ch09.sports-dietitian-role.i01
    q: CSSD 認證
    a:
    - Board Certified Specialist in Sports Dietetics
    - AND 認可，代表運動營養專業頂端
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - professional
    related: []
    locator: ''
  - id: ch09.sports-dietitian-role.i02
    q: 轉介時機
    a:
    - 複雜營養問題 → 團隊醫師（醫療監督）或運動營養師（個人化飲食建議）
