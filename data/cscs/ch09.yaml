  - id: ch09.sports-dietitian-role.i07
    q: 運動營養師建立個人化計畫前會評估什麼？
    a:
    - 第一步是確認運動員與教練各自的目標，兩者可能不同。
    - 運動營養師會詳細檢視飲食、食物偏好（含文化與宗教）、烹飪技巧、食物可近性、經濟限制、健康飲食的障礙、補充品使用、體重與體組成史、病史、訓練計畫與傷病。
    - 接著與運動員制定符合生活型態與口味的計畫，納入適當熱量、建議量的巨量與微量營養素、足夠液體與電解質，以及在需要修正缺乏、可能不足或達成訓練目標時的補充品。
    detail: 原文將評估列得很廣，重點是把營養需要與生活可行性連結；只從單一補充品或體組成數值無法完成這種個人化評估。
    terms:
    - sports-dietitian
    - electrolyte
    numbers: []
    concepts:
    - nutrition
    - professional
    related:
    - ch21.periodization-hierarchy.i02
    - ch17.needs-analysis.i07
