  - id: ch09.electrolytes.i07
    q: 重複高溫運動的熱適應會改變哪些流汗反應？
    a:
    - 反覆在高溫環境運動會使排汗量增加、汗液電解質濃度降低，且開始流汗的體溫下降。
    - 因此運動員在球季開始時，可能較容易有脫水與熱壓力。
    detail: 原文同時指出訓練較少者也較容易承受熱壓力；熱適應是對重複熱暴露的改變，不應視為所有季初運動員必然已具有的保護。
    terms:
    - electrolyte
    - hydration
    numbers: []
    concepts:
