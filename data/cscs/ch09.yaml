  - id: ch09.hydration.i02
    q: 脫水（dehydration）對運動表現與生理的影響為何？
    a:
    - 即使是體重減少 2–3% 的輕度脫水，也會升高核心體溫，增加疲勞，並降低動機、神經肌肉控制、準確性、爆發力、肌力、肌耐力與整體表現。
    - 當流汗損失超過液體攝取而形成低水合狀態（hypohydration）時，血漿容積下降、心率與自覺費力增加。
    - 脫水還可能降低每搏量與心輸出量、降低血壓與肌肉血流，並增加中暑與死亡風險。
    detail: 原文以「可能」描述部分後果；體重減少的百分比是脫水造成的水重改變，不能當成體脂或體組成改變來解讀。
    terms:
    - dehydration
    - hypohydration
    - stroke-volume
    - cardiac-output
    numbers:
    - v: 2–3
      unit: '% 體重減少'
      of: 原文稱即使屬輕度脫水仍會顯著影響運動表現的水重損失範圍
    concepts:
