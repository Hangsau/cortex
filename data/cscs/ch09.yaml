  - id: ch09.carbohydrate.i05
    q: 升糖負荷（glycemic load, GL）與升糖指數有何差異？
    a:
    - GL = 食物的 GI × 該份食物的碳水化合物克數 ÷ 100。
    - GL 把一份食物的碳水化合物量納入，因此比基於標準份量的 GI 更貼近實際的升糖反應；較高 GL 預期帶來較大的血糖與後續胰島素上升。
    - 原文僅指出：低 GL 飲食合併運動已在年長肥胖成人顯示改善胰島素敏感性；低 GI／低 GL 與較低發炎標記的關係來自觀察與介入研究。
    detail: GL 的優點是把份量納入判讀，但書中對健康結果分別使用「已顯示」與「有研究提示」的不同證據強度，不應一概寫成所有人的確定效果。
    terms:
    - glycemic-load
    - glycemic-index
    numbers:
    - v: 100
      unit: 公式除數
      of: 計算每份食物升糖負荷時的固定除數
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch09.carbohydrate.i04
    locator: Macronutrients > Carbohydrate > Glycemic Index and Glycemic Load
  - id: ch09.carbohydrate.i06
    q: 膳食纖維（dietary fiber）的建議量與書中描述的作用為何？
    a:
    - 女性的膳食纖維 DRI 依年齡、懷孕與哺乳狀態為每日 21–29 g；男性依年齡為每日 30–38 g。
    - 纖維可延緩胃排空而暫時影響飽足感；另一些纖維會增加糞便的體積與水分，減少便秘並縮短糞便通過時間。
    - 某些可溶性纖維會降低膽固醇吸收，益生元纖維則選擇性刺激腸道細菌生長。
    detail: 原文將低纖維飲食與便秘、心臟病、結腸癌及第二型糖尿病列為「相關」，這是關聯敘述，不能改寫成單一因果。
    terms:
    - fiber
    - dietary-reference-intakes
    numbers:
    - v: 21–29
      unit: g/日
      of: 女性依年齡、懷孕與哺乳狀態的膳食纖維 DRI 範圍
    - v: 30–38
      unit: g/日
      of: 男性依年齡的膳食纖維 DRI 範圍
    concepts:
    - nutrition
    related: []
    locator: Macronutrients > Carbohydrate > Fiber
  - id: ch09.carbohydrate.i07
    q: 長期低碳水化合物飲食時，運動供能會如何適應？
    a:
    - 習慣攝取碳水化合物的運動員，在有氧運動時主要使用碳水化合物供能。
    - 持續攝取低碳水化合物飲食會使身體在運動時更依賴脂肪作為燃料。
    - 高脂低碳飲食適應後的表現效果依個人而異。
    detail: 書中描述的是燃料利用的適應；燃料比例轉變本身不等於保證表現會提高或降低。
    terms:
    - carbohydrate
    - fat
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    - adaptation
    related:
    - ch03.oxidative.i06
    - ch10.weight-loss.i03
    locator: Macronutrients > Carbohydrate > Carbohydrate Requirements for Athletes
  - id: ch09.carbohydrate.i08
    q: 糖原（glycogen）充足時如何影響蛋白質（protein）作為燃料？
    a:
    - 較高糖原水準可節省蛋白質作為燃料的使用，並有助於減弱肌肉分解；蛋白質攝取量的差異也會影響肌肉分解。
    - 多數情況蛋白質僅提供總熱量消耗的 1–6%，但在糖原耗竭狀態下進行長時間運動時可達 10%。
    detail: 蛋白質供能比例取決於能量平衡與糖原狀態；原文的高值限定在糖原耗竭的長時間運動，不能當成一般運動的固定比例。
    terms:
    - glycogen
    - protein
    numbers:
    - v: 1–6
      unit: '% 總熱量消耗'
      of: 多數情況下蛋白質作為能量來源的比例
    - v: 10
      unit: '% 總熱量消耗'
      of: 糖原耗竭狀態下長時間運動時蛋白質作為能量來源的最高比例
    concepts:
