  - id: ch09.protein.i04
    q: 必需與條件必需胺基酸（amino acids）在本章如何分類？
    a:
    - 人體蛋白質由 20 種個別胺基酸的不同組合構成；其中 4 種可由人體合成，屬非必需胺基酸。
    - 9 種必需胺基酸是 histidine、isoleucine、leucine、lysine、methionine、phenylalanine、threonine、tryptophan、valine，人體無法製造，必須從飲食取得。
    - 8 種條件必需胺基酸通常不是必需，但在疾病與壓力時變成必需，必須從飲食取得。
    detail: 「必需」指人體能否製造，而非胺基酸是否對身體重要；條件必需的分類會隨疾病或壓力情境改變。
    terms:
    - amino-acid
    - essential-amino-acid
    - conditionally-essential-amino-acid
    numbers:
    - v: 20
      unit: 種胺基酸
      of: 構成人體蛋白質的個別胺基酸數量
    - v: 4
      unit: 種胺基酸
      of: 人體可合成的非必需胺基酸數量
    - v: 9
      unit: 種胺基酸
      of: 人體無法製造、必須由飲食取得的必需胺基酸數量
