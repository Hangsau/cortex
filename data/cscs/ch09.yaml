cards:
- q: 碳水化合物從單醣到多醣的分類依序是什麼？
  a: 單醣（葡萄糖、果糖、半乳糖）→ 雙醣（蔗糖、乳糖、麥芽糖）→ 多醣（澱粉、纖維、糖原）
  tag: 巨量營養素
- q: 糖原（Glycogen）的儲量分布和主要功能是什麼？
  a: 儲量約 15 g/kg 體重；3/4 在骨骼肌、1/4 在肝臟；是高強度運動主要燃料
  tag: 巨量營養素
- q: 有氧耐力（≥90 分鐘/天）和肌力/衝刺運動員的每日碳水建議量分別是多少？
  a: 有氧耐力：8–10 g/kg/day；肌力/衝刺/技術：5–6 g/kg/day
  tag: 巨量營養素
- q: GI（升糖指數）如何分級？運動中應選用哪種 GI 的食物？
  a: 低 ≤55、中 55–69、高 ≥70（以白麵包/葡萄糖 GI=100 為基準）；運動中用高 GI
  tag: 巨量營養素
- q: GL（升糖負荷）的計算公式是什麼？它比 GI 有何優點？
  a: GL = GI × 每份碳水克數 ÷ 100；考慮份量，更貼近實際血糖反應
  tag: 巨量營養素
- q: 纖維的每日 DRI 建議量是多少（男/女）？
  a: 女性 21–29 g/day；男性 30–38 g/day
  tag: 巨量營養素
- q: 糖原耗盡時蛋白質供能比例可達多少？碳水如何保護蛋白質？
  a: 糖原耗盡時蛋白質可達總消耗的 10%；高糖原儲量可降低蛋白質作為燃料的比例
  tag: 巨量營養素
- q: DRI 的制定依據是什麼？與過去的建議有何不同？
  a: 美國食品與營養委員會制定；基於慢性病預防，不只是預防缺乏
  tag: 指引框架
- q: RDA、AI、UL、EAR 各自的定義是什麼？
  a: RDA：大多數人每日需求；AI：無法建立 RDA 時使用；UL：不造成不良影響的最高量；EAR：滿足 50% 人需求的量
  tag: 指引框架
- q: AMDR 中蛋白質、碳水化合物、脂肪的建議範圍是多少？
  a: 蛋白質：10–35%；碳水：45–65%；脂肪：20–35%（佔總熱量）
  tag: 指引框架
- q: MyPlate 是什麼？對運動員有何限制？
  a: USDA 飲食指南視覺工具，5 大食物群；以活動量少者為基準，運動員需額外調整
  tag: 指引框架
- q: 不喝奶可能導致哪些營養素不足？
  a: 鈣、鉀、維生素 D 不足
  tag: 指引框架
- q: 完全排除動物食品需注意補充哪種維生素？為什麼？
  a: B12：動物食品是主要來源，純素者需靠強化食品或補充品
  tag: 指引框架
- q: 汗液中電解質含量由高到低的排序是什麼？
  a: 氯化鈉（最多）→ 鉀 → 鎂 → 鈣
  tag: 水分平衡
- q: 低血鈉（Hyponatremia）的定義和危險症狀是什麼？
  a: 血鈉 <130 mmol/L；症狀：頭痛、噁心；<120 mmol/L → 腦水腫、癲癇、昏迷風險
  tag: 水分平衡
- q: 如何預防運動中低血鈉？
  a: 避免運動後體重高於運動前；補充含鈉飲料或食物；勿只喝白水
  tag: 水分平衡
- q: 個人鈉流失量的範圍有多大？為何需要個人化補充策略？
  a: 0.2–12.5+ g/L 汗液，個體差異極大；高鈉流失者需主動補充電解質
  tag: 水分平衡
- q: NBA 球員每場（40 分鐘）平均汗液流失量是多少？
  a: 平均 2.2 L，範圍 1.0–4.6 L
  tag: 水分平衡
- q: 熱適應後排汗有哪三種改變？
  a: 排汗量增加、汗液電解質濃度降低、開始排汗體溫降低
  tag: 水分平衡
- q: 如何計算個人排汗率？
  a: 排汗率 = （運動前體重 − 運動後體重 + 飲水量 − 尿量）÷ 運動時間
  tag: 水分平衡
- q: 脂肪酸按雙鍵數如何分類？脂肪提供多少熱量？
  a: 飽和（無雙鍵）→ 單元不飽和（1個）→ 多元不飽和（≥2個）；9 kcal/g
  tag: 巨量營養素
- q: 必需脂肪酸有哪兩類？ALA 轉換 EPA 和 DHA 的效率如何？
  a: Omega-6 & Omega-3；ALA 轉換 EPA 約 5%、DHA <0.5%
  tag: 巨量營養素
- q: EPA & DHA 的健康效益有哪些？
  a: 劑量依賴性降低三酸甘油酯；輕微降血壓；潛在抗心律不整效果
  tag: 巨量營養素
- q: 膽固醇各指標的目標值是什麼？
  a: LDL <100 最佳；HDL >60 保護性；總膽固醇 <200 理想；VLDL 最具動脈阻塞性
  tag: 巨量營養素
- q: 飽和脂肪和添加糖的每日攝取上限建議是多少？
  a: 飽和脂肪 <10% 總熱量；添加糖 <10% 總熱量（2015 DGA）
  tag: 巨量營養素
- q: 脂肪在不同運動強度下的燃料角色如何變化？
  a: 靜息與低強度時主要燃燒脂肪；強度升高逐漸轉為碳水；訓練良好肌肉脂肪氧化能力更高
  tag: 巨量營養素
- q: 脂溶性維生素是哪四種？過量 A 和 D 分別有什麼毒性風險？
  a: A、D、E、K；過量 A → 肝毒性；過量 D → 血鈣升高、心律不整
  tag: 微量營養素
- q: 男性和女性的每日水分 AI 分別是多少？
  a: 男性 3.7 L/day；女性 2.7 L/day（含所有飲料及食物水分）
  tag: 水分平衡
- q: 脫水達體重減少幾%時會顯著影響運動表現？
  a: 2–3%；升高核心體溫、疲勞↑、神經肌肉控制↓、耐力↓
  tag: 水分平衡
- q: 三種評估水合狀態的方法是什麼？各自的正常值？
  a: 尿比重（USG）<1.020；體重變化（每減 0.45 kg = 0.5 L）；尿液顏色（主觀）
  tag: 水分平衡
- q: 熱天長時間運動中的飲料成分建議是什麼？
  a: 鈉 460–690 mg/L、鉀 78–195 mg/L、碳水 5–10%；溫度 10–15°C
  tag: 水分平衡
- q: 脫水後補水的建議量是多少？
  a: 每 kg 體重流失補充 1.5 L 液體（含電解質）；正餐含鈉食物幫助液體滯留
  tag: 水分平衡
- q: 哪些族群是特別高風險的脫水族群？
  a: 兒童（體表面積大、排汗少、口渴感弱）、老年人、美式足球員、摔跤選手
  tag: 水分平衡
- q: 40 kg 兒童的補水指引是什麼？
  a: 每 20 分鐘喝 150 ml 冷水或含鹽飲料；即使不渴也要定時補充
  tag: 水分平衡
- q: 一般健康成人（19 歲以上）的蛋白質 RDA 是多少？
  a: 0.80 g/kg/day，基於氮平衡研究
  tag: 巨量營養素
- q: 有氧耐力和肌力運動員的蛋白質需求量分別是多少？
  a: 有氧耐力：1.0–1.6 g/kg/day；肌力運動：1.4–1.7 g/kg/day
  tag: 巨量營養素
- q: 阻力訓練後要最大化肌肉蛋白合成（MPS）應攝取多少蛋白質？何時補最好？
  a: 20–48 g；48 小時內對蛋白質敏感性增高，訓練後越早補越好
  tag: 巨量營養素
- q: 人體的 9 種必需胺基酸縮寫是哪些？
  a: His, Ile, Leu, Lys, Met, Phe, Thr, Trp, Val
  tag: 巨量營養素
- q: PDCAAS 是什麼？哪些食物含有全部 9 種必需胺基酸？
  a: 蛋白質消化吸收率評分（消化率＋必需AA組成）；動物蛋白（蛋、奶、肉）& 大豆
  tag: 巨量營養素
- q: 蛋白質與骨骼健康的關係是什麼？
  a: 佔骨骼體積 50%、骨質量 33%；透過 IGF-I 促進骨骼與肌肉生成；低攝入抑制腸道鈣吸收
  tag: 巨量營養素
- q: 高蛋白飲食（2.8 g/kg/day）對健康運動員腎功能有何影響？
  a: 不損害腎功能；但過高可能排擠碳水與脂肪的攝取空間
  tag: 巨量營養素
- q: CSSD 認證的全名是什麼？由哪個機構認可？
  a: Board Certified Specialist in Sports Dietetics；AND（美國飲食協會）認可
  tag: 角色分工
- q: S&C 教練在營養指導上的範圍和限制是什麼？
  a: 可提供基礎營養教育；不可提供醫療營養治療（MNT）
  tag: 角色分工
- q: 運動員健康與飲食資訊的共享需遵守什麼法規？
  a: HIPAA（健康資訊屬於受保護健康資訊）
  tag: 角色分工
- q: 運動員出現哪種情況需轉介給運動營養師？
  a: 複雜營養問題（飲食失調、特殊疾病狀態、需精確個人化飲食計畫等）
  tag: 角色分工
- q: 運動營養師的需求分析應評估哪些面向？
  a: 飲食偏好、文化、烹飪技能、財務狀況、傷病、補充品使用等
  tag: 角色分工
- q: 脂溶性和水溶性維生素的儲存與毒性差異是什麼？
  a: 脂溶：儲存在脂肪組織，過量有毒性；水溶：多餘由尿液排出，較少毒性（除 B12 外）
  tag: 微量營養素
- q: 血紅素鐵（動物）和非血紅素鐵（植物）的吸收率分別是多少？
  a: 血紅素鐵：15–35%；非血紅素鐵：2–20%；維生素 C 可增加非血紅素鐵吸收
  tag: 微量營養素
- q: 鐵缺乏分哪三個階段？
  a: 鐵儲量耗盡（depletion）→ 邊際缺乏（marginal deficiency）→ 鐵缺乏性貧血（anemia）
  tag: 微量營養素
- q: 鈣的峰值骨密度大約在幾歲達成？9–13 歲女性的鈣攝取現況如何？
  a: 90% 在青春期晚期達成；NHANES：9–13 歲女性僅 15% 達到 AI
  tag: 微量營養素
- q: 各年齡層普遍攝取不足的關鍵營養素有哪些？
  a: 全年齡層：維生素 E、鎂；2 歲以上：纖維、鉀；2015 DGA 關注：纖維、鉀、鈣、維生素 D
  tag: 微量營養素
- q: 50 歲以上老年人為何需要特別注意 B12 攝取？
  a: 10–30% 的 50 歲以上者胃酸不足影響 B12 吸收；建議補充合成 B12 或攝取強化食品
  tag: 微量營養素
