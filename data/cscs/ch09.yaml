    locator: Fluid and Electrolytes > Fluid Balance
  - id: ch09.hydration.i08
    q: 美國兒科學會對兒童與青少年訓練中飲水的本章指引為何？
    a:
    - 體重 88 磅（40 kg）的兒童，在練習中每 20 分鐘應飲用 5 oz（148 ml）冷水或調味含鹽飲料，即使不覺得口渴也應定期飲用。
    - 體重 132 磅（60 kg）的青少年，在相同間隔應飲用 9 oz（266 ml）。
    - 「Fluid Intake Guidelines at a Glance」摘要將相同建議的毫升數寫成 150 ml 與 250 ml。
    detail: 教材原文如此：同章敘述段落與摘要的毫升換算不一致；此處保留兩者，不自行選擇或以外部數字校正。
