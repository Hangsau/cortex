  - id: ch09.carbohydrate.i03
    q: 運動員的碳水化合物（carbohydrate）攝取與運動後補充建議為何？
    a:
    - 每天以中等強度訓練至少 90 分鐘的有氧耐力運動員，建議每日每公斤體重攝取 8–10 g 碳水化合物；原文的中等強度界定為 70–80% V̇O2max。
    - 肌力、衝刺與技術型活動的運動員，約需每日每公斤體重 5–6 g。
    - 有氧耐力訓練後 30 分鐘內，約攝取每公斤體重 1.5 g 較高升糖指數的碳水化合物，可快速刺激糖原再合成。
    - 若運動後立即攝取較少碳水化合物，之後可約每 2 小時安排高碳水化合物餐點或點心；未每日訓練者只要全天總量足夠，可在 24 小時內恢復糖原。
    detail: 這些建議按訓練型態與恢復時程區分，不是所有運動員的一律處方；立即補充較少碳水的替代作法，前提是之後規律補足。
    terms:
