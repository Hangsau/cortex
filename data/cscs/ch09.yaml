  items:
  - id: ch09.carbohydrate.i01
    q: 碳水化合物（carbohydrate）如何依糖單位分類？
    a:
    - 單醣（monosaccharides）是單一糖分子，包括葡萄糖、果糖與半乳糖。
    - 雙醣（disaccharides）由兩個單醣組成，包括蔗糖、乳糖與麥芽糖。
    - 多醣（polysaccharides）可含許多葡萄糖單位；澱粉、膳食纖維與糖原都是營養上重要的多醣。
    detail: 膳食纖維雖屬碳水化合物，其中部分成分對人體消化酶具有抗性，因此其生理作用不等同可迅速供能的糖類。
    terms:
    - carbohydrate
    - monosaccharide
    - disaccharide
    - polysaccharide
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch03.glycolysis.i01
    locator: Macronutrients > Carbohydrate
  - id: ch09.carbohydrate.i02
    q: 糖原（glycogen）的儲存位置與糖原合成（glycogenesis）是什麼？
    a:
    - 人體肝臟與肌肉中的糖原總量約為每公斤體重 15 g。
    - 全身糖原約四分之三儲存在骨骼肌，其餘四分之一儲存在肝臟。
    - 葡萄糖進入肌肉或肝臟後，若未立即代謝供能，可合成糖原；這個過程稱為糖原合成。
    detail: 原文將糖原描述為人體肝臟與肌肉中的小量儲備；此處的數字是全身依體重估計，不能改寫為單一組織的儲量。
    terms:
    - glycogen
    - glycogenesis
    numbers:
