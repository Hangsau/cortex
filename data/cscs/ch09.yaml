  - id: ch09.electrolytes.i06
    q: 原文的美式足球案例如何顯示流汗量差異？
    a:
    - 國家美式足球聯盟（National Football League, NFL）跑衛與接球員平均體重 93 ± 6 kg，訓練時每小時平均流汗 1.4 ± 0.45 L；線鋒平均體重 135.6 ± 17 kg，每小時平均流汗 2.25 ± 0.68 L。
    - 兩次訓練合計 4.5 小時的日子裡，跑衛與接球員計算流汗損失為 6.4 ± 2.0 L，線鋒為 10.1 ± 3.1 L。
    detail: 這是一項 NFL 練習研究的群組平均值；體型、裝備與環境都會影響流汗率，因此不可直接套用給其他運動員。
    terms:
    - hydration
    - national-football-league
