  - id: ch09.fat.i05
    q: 本章引用的飲食指南諮詢委員會報告，對脂肪與添加糖提出什麼建議？
    a:
    - 避免含反式脂肪的部分氫化油。
    - 飽和脂肪應少於總熱量的 10%，並以不飽和脂肪、特別是多元不飽和脂肪取代。
    - 添加糖最多應占總熱量的 10%。
    detail: 這些是原文引述的飲食指南諮詢委員會建議，不是本章替不同運動項目制定的個人化燃料處方。
