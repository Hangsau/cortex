- id: dietary-reference-standards
  title: 飲食參考標準 Dietary Reference Standards
  desc: ''
  tag: 指引框架
  items:
  - id: ch09.dietary-reference-standards.i01
    q: 飲食參考攝取量（Dietary Reference Intakes, DRIs）是什麼？
    a:
    - DRIs 由美國國家科學院醫學研究院的食品與營養委員會建立，用於評估及規劃健康個人的飲食。
    - DRIs 包含巨量營養素、微量營養素、電解質與水的攝取量。
    - 它們依據營養素攝取與降低慢性病的文獻，而非僅以預防膳食缺乏為目標。
    detail: DRI 判讀的是一個人的「平常」攝取量；由於日與日差異，運動營養師會檢視數日紀錄來估計平均每日攝取，僅蛋白質通常需要較少天數即可估計。
    terms:
    - dietary-reference-intakes
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: Standard Nutrition Guidelines > Dietary Reference Intakes
  - id: ch09.dietary-reference-standards.i02
    q: 建議膳食攝取量（Recommended Dietary Allowance, RDA）如何定義？
    a:
    - RDA 是在每個生命期與性別組中，足以滿足多數健康人需要的平均每日營養素需求量。
    detail: RDA 的對象是健康人，且按生命期與性別分組；它不是為所有疾病、訓練狀態或個人化飲食問題量身訂做的處方。
    terms:
    - recommended-dietary-allowance
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: Standard Nutrition Guidelines > Dietary Reference Intakes
  - id: ch09.dietary-reference-standards.i03
    q: 足夠攝取量（Adequate Intake, AI）如何定義？
    a:
    - AI 是在無法建立 RDA 時所建議的平均每日營養素攝取量。
    detail: AI 的存在表示該營養素未能建立 RDA；不能將兩者誤作以相同證據途徑得出的同一類數值。
    terms:
    - adequate-intake
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related:
    - ch09.hydration.i01
    locator: Standard Nutrition Guidelines > Dietary Reference Intakes
  - id: ch09.dietary-reference-standards.i04
    q: 可容忍最高攝取量（Tolerable Upper Intake Level, UL）如何定義？
    a:
    - UL 是未被認為與任何不良健康效應相關的最高平均每日營養素攝取量。
    - 攝取超過 UL 會提高不良效應的潛在風險；UL 計入食物、水與補充品的所有來源。
    detail: UL 不是建議追求的目標，而是風險判讀的上限；以補充品增加攝取時仍必須和食物與飲水來源合併計算。
    terms:
    - tolerable-upper-intake-level
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related:
    - ch09.vitamins-minerals.i01
    locator: Standard Nutrition Guidelines > Dietary Reference Intakes
  - id: ch09.dietary-reference-standards.i05
    q: 估計平均需要量（Estimated Average Requirement, EAR）如何定義？
    a:
    - EAR 是在每個生命期與性別組中，被認為足以滿足一半健康人口需要的平均每日營養素攝取量。
    detail: EAR 的「一半」界定的是同生命期與性別組的健康人口，不能把它解讀成每位個人的足夠量。
    terms:
    - estimated-average-requirement
    numbers: []
    concepts:
    - nutrition
    - normal-values
    related: []
    locator: Standard Nutrition Guidelines > Dietary Reference Intakes
  - id: ch09.dietary-reference-standards.i06
    q: 可接受巨量營養素分布範圍（Acceptable Macronutrient Distribution Range, AMDR）在本章如何用於蛋白質？
    a:
    - AMDR 是在仍可提供其他必需營養素建議量的前提下，與降低慢性病風險相關的營養素攝取範圍。
    - 蛋白質的 AMDR：1–3 歲兒童占總熱量 5–20%，4–18 歲兒童與青少年占 10–30%，18 歲以上成人占 10–35%。
    detail: 原文只在蛋白質段落列出蛋白質的 AMDR；原本加入的碳水化合物與脂肪百分比並未見於本章正文，已刪除。
    terms:
    - acceptable-macronutrient-distribution-range
    - protein
    numbers:
