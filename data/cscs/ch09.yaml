  - id: ch09.vitamins-minerals.i07
    q: 礦物質（minerals）對運動員的主要功能為何？
    a:
    - 礦物質構成骨、牙與指甲，亦是酶的組成部分，並執行多種代謝功能；對運動員尤其關係到骨骼健康、攜氧能力與水分電解質平衡。
    - 鈣參與骨與牙形成、凝血、肌肉收縮與神經傳導；鐵是氧運輸及能量代謝所需酶系統的組成部分。
    - 鎂可活化接近 100 種酶並幫助神經和肌肉運作；鈉、鉀與氯是電解質，與鈣、磷、鎂、鐵同被稱為主要礦物質。
    detail: 礦物質功能彼此交疊，原文將它們放在骨骼、氧運輸及水分平衡的運動脈絡中；不能只把某一種礦物質當作單一性能補充品。
    terms:
    - mineral
    - calcium
    - iron
    - electrolyte
    numbers:
    - v: 接近 100
      unit: 種酶
      of: 原文指鎂可活化的酶數量
    concepts:
