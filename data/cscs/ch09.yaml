  - id: ch09.protein.i02
    q: 不同訓練型態運動員的蛋白質（protein）建議量為何？
    a:
    - 有氧耐力運動員約需每日每公斤體重 1.0–1.6 g。
    - 肌力運動員約需每日每公斤體重 1.4–1.7 g。
    - 降低熱量飲食的運動員為保留肌肉組織可能需要更多；章末巨量營養素指引列為約每日每公斤體重 1.8–2.7 g。
    detail: 這是章末依運動員類型列出的範圍；降低熱量飲食者被列為不同類別，不能直接用耐力或肌力範圍替代。
