  - id: ch09.protein.i06
    q: 熱量攝取改變時，蛋白質 AMDR（Acceptable Macronutrient Distribution Range）如何判讀？
    a:
    - 蛋白質 AMDR 為：1–3 歲占總熱量 5–20%、4–18 歲占 10–30%、18 歲以上成人占 10–35%。
    - 以 AMDR 表示時，熱量攝取低於 2,000 kcal 後，每再少 100 kcal，蛋白質占總熱量的需要量約增加 1%；熱量增加時，所需蛋白質百分比會降低到某一程度。
    detail: DRI 只按體重表示，不會將高低熱量攝取納入；因此原文建議實務上先確定運動員的蛋白質攝取量，再依總熱量需要加入碳水化合物與脂肪。
    terms:
    - acceptable-macronutrient-distribution-range
    - protein
    numbers:
