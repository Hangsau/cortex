  - id: ch09.fat.i04
    q: 本章如何分類膽固醇（cholesterol）與脂蛋白？
    a:
    - LDL 膽固醇：低於 100 mg/dL 為最佳、130–159 mg/dL 為邊界偏高、160–189 mg/dL 為高、超過 190 mg/dL 為非常高；LDL 是治療的主要目標。
    - 總膽固醇：低於 200 mg/dL 為理想、200–239 mg/dL 為邊界偏高、超過 240 mg/dL 為高。
    - HDL 膽固醇：低於 40 mg/dL 為低、超過 60 mg/dL 為高；脂蛋白檢驗應在禁食 9–12 小時後完成。
    - 原文稱較小且較緊密的顆粒為極低密度脂蛋白（very low-density lipoproteins, VLDL），且其比起較大的 LDL 顆粒更具動脈粥樣硬化性。
    detail: 教材原文如此：LDL 分類未列出 100–129 mg/dL，且文字將較小緊密顆粒稱為 VLDL；此處逐字保留原文，未以常見外部分類補齊或改寫。
