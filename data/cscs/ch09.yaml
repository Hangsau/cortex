- id: vitamins-minerals
  title: 維生素與礦物質 Vitamins & Minerals
  desc: ''
  tag: 微量營養素
  items:
  - id: ch09.vitamins-minerals.i01
    q: 脂溶性維生素（fat-soluble vitamins）的過量風險為何？
    a:
    - 維生素 A、D、E、K 由血中脂肪運輸，並儲存在體脂肪。
    - 過量預形成維生素 A 具有毒性，可能造成肝損傷、顱內壓升高、頭暈、噁心、頭痛、皮膚刺激、關節和骨痛、昏迷甚至死亡；通常是補充品中維生素 A 過高所致。
    - 毒性維生素 D 可能造成心律不整與高血鈣，繼而使血管和組織鈣化並損害心臟、血管與腎臟；維生素 E 長期過量與出血性中風風險增加相關，維生素 K 過量會干擾部分抗凝血藥物。
    detail: 有毒性的是預形成維生素 A，不包括可轉換為維生素 A 的 β-胡蘿蔔素、α-胡蘿蔔素與 β-隱黃素；教材並非說所有脂溶性維生素在一般飲食量都會造成毒性。
    terms:
    - fat-soluble-vitamin
    - vitamin
    numbers: []
    concepts:
    - nutrition
    - safety
    related: []
    locator: Vitamins
  - id: ch09.vitamins-minerals.i02
    q: 水溶性維生素（water-soluble vitamins）的儲存與功能特性為何？
    a:
    - B 群維生素與維生素 C 溶於水，經血液運輸；除維生素 B12 可在肝臟儲存數年外，其他不會在體內大量儲存，所需以外的量會隨尿排出。
    - 維生素通常作為輔酶，促進許多體內反應；例如 B 群維生素協助身體由碳水化合物代謝產生能量。
    - 雖然目前未見過量維生素 B12 的已知副作用，攝取超過身體所能利用的量不會增加能量或改善健康。
    detail: 水溶性不等於可任意大量補充；原文只明確指出過量 B12 不會提高能量或健康，並未把此句延伸為所有維生素補充品的安全結論。
    terms:
    - water-soluble-vitamin
    - vitamin
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: Vitamins
  - id: ch09.vitamins-minerals.i03
    q: 血基質鐵（heme iron）與非血基質鐵（nonheme iron）的吸收差異及影響因素為何？
    a:
    - 鐵是血紅素功能與合成所必需，肌紅蛋白也依賴鐵將氧運往肌肉；鐵缺乏是全球最常見的營養缺乏。
    - 血基質鐵來自血紅素，存在於原本含血紅素與肌紅蛋白的動物食物；約吸收 15–35%，且不受同時攝取食物中其他物質影響。
    - 非血基質鐵在蔬菜、穀類與鐵強化早餐穀片等非肉類食物中，約吸收 2–20%。植酸、茶與酒中的單寧、鈣、多酚、豆類與全穀的植酸鹽及部分大豆蛋白會降低吸收；同餐加入富含維生素 C 食物／飲料或血基質鐵可增加其吸收。
    detail: 原文列出非血基質鐵吸收受多種同餐成分影響，與血基質鐵不同；因此只用「植物鐵吸收差」會遺漏可改善或抑制吸收的飲食情境。
    terms:
    - iron
    - heme-iron
    - nonheme-iron
    - hemoglobin
    - myoglobin
    numbers:
    - v: 15–35
      unit: '%'
      of: 攝取血基質鐵後約被吸收的比例
    - v: 2–20
      unit: '%'
      of: 攝取非血基質鐵後約被吸收的比例
    concepts:
    - nutrition
    - circulation
    related:
