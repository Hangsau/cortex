  - id: ch09.hydration.i05
    q: 熱天長時間運動時，運動飲料與液體補充指引為何？
    a:
    - 因流汗率與電解質濃度差異很大，應在特定天候下量測訓練與競賽的體重變化，據此訂定個人策略。
    - 醫學研究院（Institute of Medicine, IOM）建議在炎熱天候的長時間活動中，每 L 運動飲料含鈉 20–30 mEq（以氯為陰離子時為 460–690 mg）、鉀 2–5 mEq（78–195 mg），碳水化合物濃度 5–10%。
    - 高速攝取運動飲料、進行劇烈或長時間運動時，可選含不同腸道運輸機制碳水化合物（如葡萄糖、果糖、麥芽糊精）的飲料；相較單一碳水化合物，這會增加胃排空、吸收、氧化，且可能改善表現。飲料應涼而不冰冷。
    detail: IOM 的成分範圍限定於炎熱天候的長時間活動；多種碳水化合物對表現的效益在原文仍使用「可能」，不宜硬化為必然提升。
