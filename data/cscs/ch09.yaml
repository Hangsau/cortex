- id: fat
  title: 脂肪 Fat
  desc: ''
  tag: 巨量營養素
  items:
  - id: ch09.fat.i01
    q: 本章所稱脂肪（fat）與脂肪酸（fatty acids）如何分類及供能？
    a:
    - 脂質（lipid）是較廣的名稱，包含三酸甘油酯、固醇與磷脂質；本章的「脂肪」特指三酸甘油酯。
    - 飽和脂肪酸沒有雙鍵，單元不飽和脂肪酸有一個雙鍵，多元不飽和脂肪酸有兩個或以上雙鍵。
    - 脂肪約提供每克 9 kcal；碳水化合物與蛋白質約各提供每克 4 kcal。
    detail: 脂肪每克供能較高的原因是脂肪酸鏈的碳與氫相對於氧較多；這是化學組成差異，不是把所有「脂質」都等同於三酸甘油酯。
    terms:
    - fat
    - lipid
    - fatty-acid
    - triglyceride
    numbers:
