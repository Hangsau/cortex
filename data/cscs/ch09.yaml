    locator: Fluid and Electrolytes
  - id: ch09.hydration.i03
    q: 如何評估水合狀態（hydration status），各方法有何限制？
    a:
    - 尿液比重（urine specific gravity, USG）容易使用、便宜且可攜；原文的正常水合（euhydration）截點為低於 1.020 g/ml，但 USG 較適合慢性而非急性水合改變。
    - 可在運動前後、擦乾並排尿後、穿著最少的輕便衣物量體重；每減少 1 磅（0.45 kg）代表 16 oz（0.5 L）液體。流失體重 2% 以上表示補回的汗液不足。
    - 尿液顏色的關係很主觀；甜菜、莓果、食用色素、藥物、B 群維生素與類胡蘿蔔素都可能改變顏色。
    detail: USG 不能靈敏反映急性變化；用秤重判讀時，長期追蹤還可能受體組成改變干擾，因此應把測量條件標準化。
