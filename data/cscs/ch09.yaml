  - id: ch09.carbohydrate.i04
    q: 升糖指數（glycemic index, GI）如何定義、分級與使用？
    a:
    - GI 按餐後 2 小時內的消化、吸收與升血糖速度，將食物與等克數的參考食物比較；白麵包或葡萄糖通常作為 GI 為 100 的參考。
    - 表中的低 GI 為 55 或以下、中 GI 為 55–69、高 GI 為 70 或以上。
    - 運動前選低 GI 食物是否節省碳水化合物並改善表現，證據不足且研究結果不一致；運動中可用高 GI 食物提供立即可用的糖，運動後也可用來較快補回糖原。
    detail: GI 數值會受檢測、原料、成熟度、加工、烹調、儲存及同餐食物量影響；因此它可作為嘗試食物選擇的工具，不能當成固定的個人表現預測。教材將 GI 55 同時列為低與中分級，教材原文如此。
    terms:
    - glycemic-index
    - glycogen
    numbers:
    - v: 2
      unit: 小時
      of: GI 比較餐後血糖反應的時間窗
    - v: 100
      unit: GI
      of: 白麵包或葡萄糖作為參考食物時的升糖指數
    - v: ≤55
      unit: GI
      of: 表中低升糖指數食物的分級
    - v: 55–69
      unit: GI
      of: 表中中升糖指數食物的分級
