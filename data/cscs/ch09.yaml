  - id: ch09.fat.i02
    q: 必需脂肪酸與 α-亞麻酸（alpha-linolenic acid, ALA）的轉換限制為何？
    a:
    - 兩種必需的多元不飽和脂肪酸是 omega-6 與 omega-3；它們與健康細胞膜、腦與神經系統發育和功能、以及荷爾蒙生成有關。
    - omega-6 在大豆油、玉米油與紅花油等食物供應中很常見；富含脂肪的魚類含 omega-3 的二十碳五烯酸（eicosapentaenoic acid, EPA）與二十二碳六烯酸（docosahexaenoic acid, DHA）。
    - 亞麻籽、核桃、大豆油與芥花油中的 ALA 可轉換為 EPA 與 DHA；成人體內研究約有 5% 轉為 EPA，少於 0.5% 轉為 DHA。
    detail: ALA 食物仍計入 omega-3 攝取，但原文指出這個轉換效率不足以對體內 EPA 與 DHA 水準產生實質影響。
    terms:
    - fatty-acid
    - omega-3-fatty-acid
    - omega-6-fatty-acid
    - alpha-linolenic-acid
    - eicosapentaenoic-acid
    - docosahexaenoic-acid
    numbers:
