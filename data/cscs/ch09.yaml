    locator: Role of Sports Nutrition Professionals
  - id: ch09.sports-dietitian-role.i08
    q: 原文如何描述具進階學位的運動營養學家與 IOC 文憑？
    a:
    - 具進階學位的運動營養學家可能在運動營養產業工作或進行研究，因此可討論特定主題的文獻，也可以選擇取得運動營養認證。
    - IOC 運動營養文憑（IOC Diploma in Sports Nutrition）是其中一項選擇，為期 2 年，包含課程、研討會、教學指導與實驗室實作。
    - IOC 指出有興趣者通常具營養或營養學、生命科學（含生物化學、生理學、運動科學）或醫學背景。
    detail: 原文說明這類人可討論文獻與選擇認證，並未說 IOC 文憑只適合「研究導向者」；原本的限縮說法已刪除。
