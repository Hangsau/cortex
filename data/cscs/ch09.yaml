    locator: Fluid and Electrolytes > Electrolytes
  - id: ch09.electrolytes.i05
    q: 運動飲料在鉀補充上扮演什麼角色？
    a:
    - 運動飲料提供少量鉀，用來補回隨汗流失的鉀，但不是總鉀攝取的重要來源。
    - 美國成年人的研究中，達到鉀飲食建議量者少於 2%；原文建議從番茄、柑橘類、水瓜、馬鈴薯、香蕉與牛奶等富鉀食物增加日常攝取。
    detail: 運動飲料的功能是協助處理運動時的流汗損失，不能取代平日整體飲食品質所提供的鉀。
    terms:
    - electrolyte
    numbers:
    - v: '<2'
      unit: '% 美國成人'
      of: 達到鉀飲食建議量的比例
    concepts:
