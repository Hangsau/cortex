  - id: ch09.protein.i03
    q: 運動後蛋白質（protein）補充與肌肉蛋白合成（muscle protein synthesis, MPS）的書中建議為何？
    a:
    - 運動後肌肉蛋白合成與分解都會增加；若在空腹狀態完成運動，淨蛋白平衡為負。運動後攝取蛋白質會增加肌肉蛋白合成。
    - 運動後肌肉對胺基酸的敏感性可增加達 48 小時，但會隨時間下降；較早攝取比等待更能影響急性肌肉蛋白合成。
    - 有氧耐力運動後的適當蛋白質量尚未完全釐清，部分人建議碳水化合物對蛋白質比為 4:1 或 3:1。阻力訓練後，20–48 g 蛋白質已證實有助於最大刺激急性肌肉蛋白合成。
    detail: 原文分別處理有氧耐力與阻力訓練：耐力運動後的蛋白質量尚未完全確定；阻力訓練的克數範圍也會受蛋白質白胺酸含量與年齡影響。
