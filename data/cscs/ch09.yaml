- id: sports-dietitian-role
  title: 運動營養師角色 Sports Dietitian Role
  desc: ''
  tag: 角色分工
  items:
  - id: ch09.sports-dietitian-role.i01
    q: 運動營養專科認證（Board Certified Specialist in Sports Dietetics, CSSD）代表什麼？
    a:
    - 運動營養師是具有運動營養特定教育與經驗的註冊營養師（registered dietitian）；註冊營養師也稱為註冊營養師營養學家。
    - Academy of Nutrition and Dietetics 的 CSSD 認證，用以區分具運動營養專業的註冊營養師與專長在其他營養領域的註冊營養師。
    detail: CSSD 是辨識運動營養專長的資格，而非原文所稱唯一可提供所有營養服務的頭銜；工作職責還必須依教育、提供的資訊與州執照法規界定。
    terms:
    - board-certified-specialist-in-sports-dietetics
    - sports-dietitian
    - registered-dietitian
    numbers: []
    concepts:
    - nutrition
    - professional
    related:
    - ch24.personnel.i03
    locator: Role of Sports Nutrition Professionals > Board Certified Specialist in Sports Dietetics (CSSD)
  - id: ch09.sports-dietitian-role.i02
    q: 運動員何時應轉介給團隊醫師或運動營養師（sports dietitian）？
    a:
    - 所有運動營養專業人員應能回答基本營養問題，例如健康點心的選擇。
    - 有複雜營養問題的運動員應轉介給適當資源：團隊醫師負責醫療照護，運動營養師負責個人化飲食建議。
    - 飲食失調、營養素缺乏或糖尿病等特定疾病狀態，醫師與運動營養師可能一起協助。
    detail: 轉介的判準是問題複雜度與是否涉及醫療照護；不是把所有營養問題一律交由單一職種處理。
    terms:
    - sports-dietitian
    - registered-dietitian
    numbers: []
    concepts:
    - nutrition
    - professional
    related:
    - ch24.legal.i07
    - ch22.sports-medicine-team.i05
    locator: Role of Sports Nutrition Professionals
  - id: ch09.sports-dietitian-role.i03
    q: 肌力與體能專業人員作為運動營養教練時，角色範圍為何？
    a:
    - 運動營養教練（sports nutrition coach）不是註冊營養師，但受過基本營養與運動科學訓練；肌力與體能專業人員可提供基本營養教育與建議。
    - 以食物或營養來治療或管理醫療狀況（包括營養素缺乏）的較複雜情境，需要醫療營養治療（medical nutrition therapy），屬運動營養師的角色。
    detail: 工作範圍還受各州營養執照法約束；即使具其他營養證照，基本教育與個人化醫療營養治療仍是不同層級的服務。
    terms:
    - sports-nutrition-coach
    - registered-dietitian
    - medical-nutrition-therapy
    numbers: []
    concepts:
    - nutrition
    - professional
    related:
    - ch24.legal.i07
    locator: Role of Sports Nutrition Professionals
  - id: ch09.sports-dietitian-role.i04
    q: 州營養執照法如何限制個人化營養服務？
    a:
    - 所有運動營養專業人員都必須遵守各州不同的營養執照法；法律會規定誰可提供個人化營養諮詢與醫療營養治療。
    - 原文以路易斯安那州為例：一般、正確且未依特定個人飲食需求量身訂做的營養教育，可由不同專業提供；營養評估與諮詢則僅能由持照營養師或營養學家提供。
    detail: 這是書中的單一州例，不可推論為所有州的相同法律；判別關鍵在資訊是否已依特定個人需求個別化。
    terms:
    - medical-nutrition-therapy
    numbers: []
    concepts:
    - nutrition
    - professional
    related:
    - ch24.legal.i07
    locator: Role of Sports Nutrition Professionals
  - id: ch09.sports-dietitian-role.i05
    q: 為何運動營養團隊須遵守 HIPAA？
    a:
    - 為了提供完整照護，運動員的營養與醫療資訊可能與球員發展人員、教練團隊或家屬共享。
    - 在美國，所有工作人員都應依 Health Insurance Portability and Accountability Act（HIPAA）指引處理運動員受保護的健康資訊。
    detail: 原文把 HIPAA 的必要性放在可能共享資訊以完成照護的脈絡；它不是允許無限制分享運動員資料的理由。
    terms:
    - health-insurance-portability-and-accountability-act
    numbers: []
    concepts:
    - professional
    related:
    - ch24.ethics-records.i03
    - ch22.sports-medicine-team.i06
    locator: Role of Sports Nutrition Professionals
  - id: ch09.sports-dietitian-role.i06
    q: 運動營養教練（sports nutrition coach）可取得哪些額外資格？
    a:
    - 運動營養教練可透過運動營養認證進修；American Council on Exercise 的 Fitness Nutrition Specialist 為私人教練、健康教練、團體健身指導員與健康照護人員設計。
    - International Society of Sports Nutrition 的 Sports Nutrition Specialist Certification 只要求高中畢業文憑，面向未持四年制大學學位的私人教練或其他健身專業人員。
    - 該組織的 Certified Sports Nutritionist（CISSN）則要求四年制大學學位，或正在就讀運動科學、營養或相關領域的大學生身分，面向與運動員及活躍人士工作的健康、健身與醫療專業人員。
    detail: 這些是原文舉的教育例子；取得營養認證不會改變醫療營養治療仍屬運動營養師角色，亦不能取代州執照要求。
