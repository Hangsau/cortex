id: ch10
weight: 10
title: Ch.10 Nutrition Strategies for Maximizing Performance
topics:
- id: carb-loading
  title: 碳水化合物補充法 Carbohydrate Loading
  desc: ''
  tag: Carb Loading
  items:
  - id: ch10.carb-loading.i01
    q: 碳水化合物超補（carbohydrate loading）的目的
    a:
    - 在耐力賽前幾天提高碳水化合物攝取，以最大化肌肉糖原儲存
    - 增加賽事後段可用的碳水化合物，延後長時間有氧耐力運動的疲勞
    detail: 此策略是為有糖原耗竭風險的耐力項目設計；書中只說它「可能」也會有益於其他運動員，未把效益推論為所有運動皆相同。
    terms:
    - carbohydrate-loading
    - carbohydrate
    - glycogen
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch10.carb-loading.i02
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  - id: ch10.carb-loading.i02
    q: 常用的碳水化合物超補方案
    a:
    - 賽前一週採減量運動，賽前 3 天高碳水化合物飲食，賽前一天完全休息
    - 超補期間每天攝取 8–10 g/kg 體重的碳水化合物
    - 此方案應可使肌肉糖原儲存高於平常 20–40%
    detail: 書中把「攝取足夠總熱量」列為此方案的一部分；只提高碳水比例、但總量不足，未必能達到預期糖原儲存。
    terms:
    - carbohydrate-loading
    - carbohydrate
    - glycogen
    numbers:
    - v: 3
      unit: 天
      of: 常用超補方案中賽前高碳水化合物飲食的期間
    - v: 8–10
      unit: g/kg 體重/日
      of: 超補期間每天的碳水化合物攝取量
    - v: 20–40
      unit: '%'
      of: 此方案後肌肉糖原高於正常的增幅
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch10.carb-loading.i08
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  - id: ch10.carb-loading.i03
    q: 馬拉松前的較高碳水化合物攝取建議
    a:
    - 跑者在馬拉松前 36–48 小時，可建議每天攝取 10–12 g/kg 體重的碳水化合物
    detail: 這是書中對馬拉松跑者提出的較高攝取量，不應把它當成所有耐力賽或所有運動員的通用劑量。
    terms:
    - carbohydrate-loading
    - carbohydrate
    numbers:
    - v: 36–48
      unit: 小時
      of: 馬拉松前建議提高碳水化合物攝取的時間窗
    - v: 10–12
      unit: g/kg 體重/日
      of: 馬拉松前時間窗內建議的每日碳水化合物攝取量
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  - id: ch10.carb-loading.i04
    q: 女性進行碳水化合物超補時的總熱量考量
    a:
    - 習慣每天攝取少於 2,400 kcal 的女性，可能難以吃到足量碳水化合物
    - 她們可能需要提高總能量攝取至 2,400 kcal 以上，並採較高碳水化合物飲食，才有助增加糖原儲存
    detail: 書中將早期女性研究結果不一致的可能原因，指向總熱量或總碳水量不足；這不是把女性的反應解釋為固定的生理限制。
    terms:
    - carbohydrate-loading
    - carbohydrate
    - glycogen
    numbers:
    - v: <2,400
      unit: kcal/日
      of: 書中指出可能難以吃到足量碳水化合物的女性習慣性每日能量攝取
    - v: '>2,400'
      unit: kcal/日
      of: 書中建議女性為增加糖原儲存可能需提高到的總能量攝取
    concepts:
    - nutrition
    - energy-supply
    - population
    related:
    - ch10.carb-loading.i05
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  - id: ch10.carb-loading.i05
    q: 女性碳水化合物超補研究的可用結論
    a:
    - 在一項女性自行車選手研究中，達到足夠的碳水化合物絕對攝取量後，糖原儲存與騎乘至力竭時間都增加
    - 男女在運動後按每公斤體重攝取相同碳水化合物時，4 小時內的糖原儲存能力沒有差異
    detail: 研究結果不能簡化成「女性超補無效」；書中強調的是實際吃進的碳水化合物總量與能量，而非只看碳水化合物占熱量的百分比。
    terms:
    - carbohydrate-loading
    - carbohydrate
    - glycogen
    numbers:
    - v: 4
      unit: 小時
      of: 男女按每公斤體重攝取相同碳水化合物後，比較糖原儲存能力的運動後時段
    concepts:
    - nutrition
    - energy-supply
    - population
    related:
    - ch10.carb-loading.i04
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  - id: ch10.carb-loading.i06
    q: 可能從碳水化合物超補獲益的運動
    a:
    - 長跑、公路自行車、越野滑雪等有糖原耗竭風險的有氧耐力運動員，可能獲益
    - 書中只說其他運動員也可能受益，未對間歇性高強度運動下出一概而論的結論
    detail: 效益程度會因人而異；書中建議運動員在練習期間權衡可能的暫時增重等副作用，再決定是否採用。
    terms:
    - carbohydrate-loading
    - glycogen
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch10.carb-loading.i07
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  - id: ch10.carb-loading.i07
    q: 碳水化合物超補的實務限制
    a:
    - 可能出現暫時性體重增加
    - 豆類、豌豆、洋蔥與添加菊糖或其他寡糖的食品，可能因腸道細菌快速發酵而造成過多腸氣與腹脹
    detail: 書中沒有在超補段落量化「糖原會帶幾倍水分」；這裡的重點是先在練習中試行，找出個人可耐受的碳水來源。
    terms:
    - carbohydrate-loading
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch10.carb-loading.i06
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  - id: ch10.carb-loading.i08
    q: 能從碳水化合物超補得到效益的攝取範圍
    a:
    - 超補期間每天需攝取 8–10 g/kg 體重的碳水化合物，才會察覺到超補效益
    detail: 這是書中對「超補期間」的範圍，不是一般訓練日、賽中或賽後的碳水化合物建議量。
    terms:
    - carbohydrate-loading
    - carbohydrate
    numbers:
    - v: 8–10
      unit: g/kg 體重/日
      of: 超補期間為獲得超補效益所需的每日碳水化合物攝取範圍
    concepts:
    - nutrition
    - energy-supply
    related:
