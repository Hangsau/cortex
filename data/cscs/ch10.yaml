  - id: ch10.post-competition.i08
    q: 同時訓練（concurrent training）的營養考量
    a:
    - 同時訓練是耐力運動與肌力訓練背靠背進行，可能使肌力增進低於只做肌力訓練，卻改善耐力表現的概念
    - 耐力運動後、舉重前攝取碳水化合物可幫助抑制骨骼肌分解
    - 運動員應考慮在耐力運動後及舉重前攝取蛋白質，或在舉重訓練中攝取蛋白質；研究所述阻力訓練為超過 2 小時的長時間訓練
    detail: 書中提醒，同時訓練的營養建議常依據分別研究耐力或阻力訓練的單一研究，直接針對同時訓練的證據仍有限。
