  - id: ch10.weight-gain.i07
    q: 依活動程度估計運動員每日熱量需求
    a:
    - 表 10.4 估計男性每公斤體重每天的需求：輕度 38、適度 41、重度 50 kcal；女性分別為 35、37、44 kcal
    detail: 這是快速估計表；書中定義的活動程度包含日常活動與運動，並非只以訓練強度一項判定，也不等同於 Cunningham 方程式的個別化預測。
    terms: []
