  - id: ch10.post-competition.i06
    q: 碳水化合物不足時加入蛋白質對糖原的作用
    a:
    - 當碳水化合物攝取不足（每小時低於 1.2 g/kg 體重）時，運動後加入蛋白質可提高糖原儲存速率
    detail: 這項作用的適用邊界是碳水化合物不足；書中不是說加入蛋白質在所有碳水化合物攝取量下都一定能額外提高糖原合成。
    terms:
