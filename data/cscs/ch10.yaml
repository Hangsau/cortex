    locator: Feeding and Eating Disorders > Bulimia Nervosa
  - id: ch10.eating-disorders.i04
    q: 神經性貪食症的身體症狀
    a:
    - 慢性喉嚨發炎與疼痛、頸部與下顎區唾液腺腫大、胃酸造成牙釉質磨損與牙齒敏感或蛀蝕
    - 胃食道逆流與其他腸胃問題、瀉藥濫用造成腸道不適與刺激、清除體液造成嚴重脫水
    - 鈉、鈣、鉀等礦物質過低或過高的電解質失衡，可能導致心臟病發作
    detail: 症狀清單同樣是書中轉載的 National Institute of Mental Health 資料；書上寫的是「heart attack」，不是泛稱的所有心臟疾病。
    terms:
    - bulimia-nervosa
    - electrolyte
    - dehydration
    numbers: []
    concepts:
    - nutrition
    - psychology
    related:
    - ch10.eating-disorders.i07
    locator: Feeding and Eating Disorders > Bulimia Nervosa > Symptoms of Bulimia Nervosa
  - id: ch10.eating-disorders.i05
    q: 暴食疾患（binge-eating disorder）的特徵與流行病學
    a:
    - 反覆無法控制地暴食；發作至少每週 1 次，持續 3 週，且同時出現至少 3 項相關行為或感受，例如吃得異常快、吃到不舒服地飽、非飢餓仍大量進食、因尷尬獨食或事後自責
    - 暴食後沒有像神經性貪食症一樣的清除行為，因此患者常過重或肥胖
    - 男性與女性終生盛行率分別為 2.0% 與 3.5%，平均發病年齡為 25 歲
    detail: 教材原文將最低頻率寫為「每週一次、持續三週」；這些統計也基於 2013 年納入特定診斷類別前的較舊標準，原文並說修訂後盛行率可能上升。
    terms:
    - binge-eating-disorder
    - bulimia-nervosa
    numbers:
    - v: 1
      unit: 次/週
      of: 教材原文所列暴食疾患發作的最低頻率
    - v: 3
      unit: 週
      of: 教材原文所列暴食疾患發作須持續的期間
    - v: 2.0
      unit: '%'
      of: 男性暴食疾患的終生盛行率
    - v: 3.5
      unit: '%'
      of: 女性暴食疾患的終生盛行率
    - v: 25
      unit: 歲
      of: 暴食疾患的平均發病年齡
    concepts:
    - nutrition
    - psychology
    related:
    - ch10.eating-disorders.i03
    locator: Feeding and Eating Disorders > Binge-Eating Disorder
  - id: ch10.eating-disorders.i06
    q: 運動員出現失序飲食與飲食疾患的風險情境
    a:
    - 研究顯示，運動員的失序飲食與飲食疾患盛行率高於對照組
    - 量級運動（如摔角）、強調纖瘦的運動（如越野跑）與審美運動（如體操）的運動員可能較易出現這些問題
    detail: 失序飲食的徵象可包括限制飲食、禁食、跳過正餐、服用減肥藥、瀉藥或利尿劑；但失序飲食並不等於已符合飲食疾患完整診斷標準。
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related:
    - ch10.eating-disorders.i07
    locator: Feeding and Eating Disorders
  - id: ch10.eating-disorders.i07
    q: 肌力與體能專業人員面對疑似飲食疾患的職責
    a:
    - 肌力與體能專業人員不負責診斷或治療，而是協助運動員取得合格醫師的正確診斷及治療團隊的治療
    - 當行為令人擔憂時，應聯絡有診斷與治療飲食疾患經驗、資格的專業人員；並預先建立心理、醫療與營養轉介網絡
    detail: 異常飲食模式或單獨的閉經，都不能單獨作為飲食疾患的指標；因此正確行動是轉介評估而非自行判定。
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - nutrition
    - psychology
    - professional
    related:
    - ch10.eating-disorders.i01
    - ch10.eating-disorders.i03
    locator: "Feeding and Eating Disorders > Eating Disorders: Management and Care"
  - id: ch10.eating-disorders.i08
    q: 迴避／限制性食物攝取疾患、異食癖與反芻疾患
    a:
    - 迴避／限制性食物攝取疾患（avoidant/restrictive food intake disorder, ARFID）可表現為缺乏進食興趣、因食物感官特徵而迴避，或害怕進食的不良後果，並持續無法滿足營養或能量需求
    - 異食癖（pica）是在至少 1 個月內食用非營養物質，例如黏土、洗衣澱粉、冰、菸蒂、頭髮或粉筆
    - 反芻疾患（rumination disorder）是在至少 1 個月內反覆咀嚼、再吞嚥或吐出逆流食物，且行為與醫療狀況無關
    detail: ARFID 不能單以食物不足或文化認可的飲食實踐解釋，也不應只在神經性厭食症或神經性貪食症病程中出現；異食癖則建議檢測貧血，因其與缺鐵有關。
    terms:
    - avoidant-restrictive-food-intake-disorder
    - pica
    - rumination-disorder
    numbers:
    - v: 1
      unit: 個月
      of: 異食癖食用非營養物質須持續的最低期間
    - v: 1
      unit: 個月
      of: 反芻疾患反覆處理逆流食物須持續的最低期間
