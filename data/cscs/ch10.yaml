- id: during-event
  title: 賽中營養 During-Event Nutrition
  desc: ''
  tag: During-Event
  items:
  - id: ch10.during-event.i01
    q: 賽中水分補充的原則
    a:
    - 運動中攝取足量液體，避免水分造成的體重流失超過體重的 2%
    - 應在特定天氣條件下量測訓練與比賽的體重變化，以此制定個人化水合策略
    detail: 書中把這項上限連結到運動表現、過熱、脫水與熱疾病的預防；個人化的依據是實際體重變化與電解質流失差異，而不是單一固定飲水量。
    terms:
    - hydration
    numbers:
    - v: 2
      unit: '% 體重'
      of: 賽中應避免超過的水分造成體重流失上限
    concepts:
    - nutrition
    related:
    - ch10.during-event.i03
    locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition
  - id: ch10.during-event.i02
    q: 熱天長時間運動時運動飲料的組成
    a:
    - 每公升含鈉 20–30 mEq（氯離子為陰離子時為 460–690 mg）、鉀 2–5 mEq（78–195 mg）
    - 碳水化合物濃度可為 5–10%；超過 8% 會延遲胃排空，故 6–8% 可能較理想
    detail: 「6–8% 可能理想」是源自高於 8% 會延遲胃排空、可能引起胃部不適的推論；不同運動員的耐受度仍須個別測試。
    terms:
    - electrolyte
    - carbohydrate
    numbers:
