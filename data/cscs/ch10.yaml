    locator: Feeding and Eating Disorders
- id: obesity-assessment
  title: 過重與肥胖評估 Overweight & Obesity Assessment
  desc: ''
  tag: Obesity
  items:
  - id: ch10.obesity-assessment.i01
    q: 身體質量指數（body mass index, BMI）的成人分類
    a:
    - 過輕：低於 18.5 kg/m²；正常：18.5–24.9 kg/m²；過重：25.0–29.9 kg/m²
    - 肥胖 I 級：30.0–34.9 kg/m²；肥胖 II 級：35.0–39.9 kg/m²；極端肥胖 III 級：高於 40 kg/m²
    detail: 教材表 10.5 對極端肥胖 III 級逐字列為「>40」，雖與常見分類的寫法可能不同，這裡依教材表格保留。
    terms:
    - body-mass-index
    numbers:
    - v: <18.5
      unit: kg/m²
      of: 成人 BMI 過輕分類的界值
    - v: 18.5–24.9
      unit: kg/m²
      of: 成人 BMI 正常分類範圍
    - v: 25.0–29.9
      unit: kg/m²
      of: 成人 BMI 過重分類範圍
    - v: 30.0–34.9
      unit: kg/m²
      of: 成人 BMI 肥胖 I 級分類範圍
    - v: 35.0–39.9
      unit: kg/m²
      of: 成人 BMI 肥胖 II 級分類範圍
    - v: '>40'
      unit: kg/m²
      of: 教材表 10.5 的成人 BMI 極端肥胖 III 級界值
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i02
    locator: Nutrition Strategies for Altering Body Composition > Overweight and Obesity
  - id: ch10.obesity-assessment.i02
    q: BMI 的計算方式與限制
    a:
    - 公制公式為體重（kg）／身高（m）²；英制公式為［體重（lb）／身高（in）²］× 703
    - BMI 是由身高與體重算出的超重指標，實際測量的是過多體重而不是過多體脂肪，不能區分脂肪、肌肉與骨量
    - 它只適合初步篩檢與追蹤族群盛行率；肌肉量高的運動員可能被高估，失去肌肉的高齡者可能被低估，應另用皮脂厚度或雙能量 X 光吸收儀等身體組成測量
    detail: BMI 與體脂肪的關聯還會受到年齡、性別、族群與肌肉量影響；書中明說沒有任何單一體脂肪測量可單獨評估健康、疾病或疾病風險。
    terms:
    - body-mass-index
    numbers:
    - v: 2
      unit: 次方
      of: BMI 兩種公式中身高的平方指數
    - v: 703
      unit: 係數
      of: 英制 BMI 公式將磅與英吋換算為 kg/m² 時使用的乘數
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i01
    - ch10.obesity-assessment.i07
    locator: Nutrition Strategies for Altering Body Composition > Overweight and Obesity
  - id: ch10.obesity-assessment.i03
    q: 腰圍與疾病相對風險
    a:
    - 男性腰圍高於 102 cm（40 in）及女性高於 88 cm（35 in）時，疾病相對風險增加
    - 即使體重正常，腰圍增加仍可能是風險增加的指標
    detail: 書中以腰圍作為 BMI 以外的疾病風險測量；表 10.5 的風險是相對於正常體重與較小腰圍者，而不是腰圍本身的診斷。
    terms:
    - waist-circumference
    - body-mass-index
    numbers:
    - v: '>102'
      unit: cm
      of: 男性腰圍疾病相對風險增加的界值
    - v: 40
      unit: in
      of: 男性腰圍疾病相對風險增加界值的英制表示
    - v: '>88'
      unit: cm
      of: 女性腰圍疾病相對風險增加的界值
    - v: 35
      unit: in
      of: 女性腰圍疾病相對風險增加界值的英制表示
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i01
    locator: Nutrition Strategies for Altering Body Composition > Overweight and Obesity
  - id: ch10.obesity-assessment.i04
    q: 過重與肥胖相關的疾病風險
    a:
    - 過重與肥胖會增加高血壓、血脂異常、冠心病、膽囊疾病、中風、第二型糖尿病、睡眠呼吸中止症、骨關節炎與呼吸問題的罹病風險
    - 也增加子宮內膜癌、乳癌、前列腺癌與結腸癌的風險
    detail: 心臟病風險還會與高血壓、高 LDL、低 HDL、高三酸甘油酯、高血糖、身體不活動、早發心臟病家族史或抽菸等風險因子共同升高。
    terms:
    - body-mass-index
    numbers: []
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i08
    locator: Nutrition Strategies for Altering Body Composition > Overweight and Obesity
  - id: ch10.obesity-assessment.i05
    q: 每日能量消耗的主要組成
    a:
    - 基礎代謝率（basal metabolic rate, BMR）約占每日能量消耗 65–70%，是最大的組成
    - 身體活動約占 20–30%，是個人之間最可變的組成，運動員可能更高
    - 飲食誘發性產熱（diet-induced thermogenesis）約占每日燃燒熱量 10–15%
    detail: 靜息代謝率（resting metabolic rate, RMR）常因較易量測而取代 BMR，但它不需要隔夜禁食，且會因近期進食或較早的身體活動而比 BMR 高 10–20%。
    terms:
    - basal-metabolic-rate
    - resting-metabolic-rate
    - diet-induced-thermogenesis
    numbers:
    - v: 65–70
      unit: '%'
      of: 基礎代謝率占每日總能量消耗的比例
    - v: 20–30
      unit: '%'
      of: 身體活動占每日總能量消耗的比例
    - v: 10–15
      unit: '%'
      of: 飲食誘發性產熱占每日燃燒熱量的比例
    - v: 10–20
      unit: '%'
      of: 靜息代謝率相較基礎代謝率較高的範圍
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i06
    locator: Nutrition Strategies for Altering Body Composition
  - id: ch10.obesity-assessment.i06
    q: Cunningham 方程式與運動員的能量估算
    a:
    - 靜息代謝率（resting metabolic rate, RMR）＝ 500 + 22 × 瘦體重（lean body mass, LBM；kg）
    - Harris-Benedict 方程式以性別、體重、身高與年齡預測 RMR，未納入肌肉量；Cunningham 方程式另納入瘦體重，故較適用於運動員
    detail: 以 Cunningham 方程式估出 RMR 後，書中建議再用活動係數估計每日總能量消耗；它仍是預測值而不是直接量測。
    terms:
    - resting-metabolic-rate
    - lean-body-mass
    - cunningham-equation
    - harris-benedict-equation
    numbers:
    - v: 500
      unit: kcal/日
      of: Cunningham 靜息代謝率方程式的常數項
    - v: 22
      unit: kcal/kg 瘦體重/日
      of: Cunningham 方程式中每公斤瘦體重的係數
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i05
    locator: Nutrition Strategies for Altering Body Composition
  - id: ch10.obesity-assessment.i07
    q: 兒童 BMI 的年齡百分位分類
    a:
    - 兒童 BMI 的計算式與成人相同，但解讀須考量年齡與性別
    - 低於第 5 百分位為過輕；第 5 至未滿第 85 百分位為健康體重；第 85 至未滿第 95 百分位為過重；第 95 百分位以上為肥胖
    detail: 書中另指出身高與性成熟也會影響兒童 BMI；因此不能把成人 BMI 界值直接套用到兒童。
    terms:
    - body-mass-index
    numbers:
    - v: <5
      unit: 百分位
      of: 兒童 BMI 過輕分類的界值
    - v: 5–<85
      unit: 百分位
      of: 兒童 BMI 健康體重分類範圍
    - v: 85–<95
      unit: 百分位
      of: 兒童 BMI 過重分類範圍
    - v: '≥95'
      unit: 百分位
      of: 兒童 BMI 肥胖分類的界值
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i02
    locator: Nutrition Strategies for Altering Body Composition > Overweight and Obesity
  - id: ch10.obesity-assessment.i08
    q: 過重與肥胖治療的方式與初始目標
    a:
    - 有效方式包括飲食治療、改變身體活動型態、行為治療技術、藥物治療與手術，有些患者會合併使用
    - 過重或肥胖者的初始減重目標應是 6 個月內減去初始體重的 10%
    detail: 肥胖的成因是基因與環境交互作用，包含社會、行為、文化、代謝、生理與遺傳因素；書中強調不能以同一方式處理所有肥胖者。
    terms:
    - body-mass-index
    numbers:
    - v: 6
      unit: 個月
      of: 過重或肥胖者初始減重目標的時間範圍
    - v: 10
      unit: '% 初始體重'
      of: 過重或肥胖者的初始減重目標
    concepts:
    - nutrition
    - measurement
    related:
    - ch10.obesity-assessment.i04
    locator: Nutrition Strategies for Altering Body Composition > Overweight and Obesity
- id: post-competition
  title: 賽後營養 Post-Competition Nutrition
  desc: ''
  tag: Postcompetition
  items:
  - id: ch10.post-competition.i01
    q: 運動後糖原再合成的第一階段
    a:
    - 第一階段持續 30–60 分鐘，不依賴胰島素，糖原合成很快
    - 運動或比賽後立即攝取每小時 1.0–1.85 g/kg 體重碳水化合物，之後每 15–60 分鐘定期補充，最多持續 5 小時，可使糖原快速合成
    detail: 書中以「大量」碳水化合物且「立即」攝取描述這個快速途徑；是否需要採這種積極策略，取決於下一次訓練或比賽的間隔。
    terms:
    - glycogen
    - glycogenesis
    - carbohydrate
    numbers:
    - v: 30–60
      unit: 分鐘
      of: 運動後糖原再合成第一階段持續的時間
    - v: 1.0–1.85
      unit: g/kg 體重/小時
      of: 運動或比賽後快速糖原合成時的碳水化合物攝取量
    - v: 15–60
      unit: 分鐘
      of: 快速糖原合成期間碳水化合物的定期補充間隔
    - v: 5
      unit: 小時
      of: 快速糖原合成攝取方案可持續的最長時間
    concepts:
    - nutrition
    related:
    - ch10.post-competition.i03
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition > Aerobic Endurance Events
  - id: ch10.post-competition.i02
    q: 運動後糖原再合成的第二階段
    a:
    - 第二階段持續數小時，糖原合成速率比第一階段慢得多
    detail: 源書只將第一階段稱為不依賴胰島素，沒有把第二階段標示為「胰島素依賴性」；不能自行補上此分類。
    terms:
    - glycogen
    - glycogenesis
    numbers: []
    concepts:
    - nutrition
    related:
    - ch10.post-competition.i01
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition > Aerobic Endurance Events
  - id: ch10.post-competition.i03
    q: 賽後碳水化合物攝取的時機取決於恢復間隔
    a:
    - 有多於 24 小時可恢復者，只要攝取足夠碳水化合物，可在運動後的 24 小時內補回糖原；研究中延後 2 小時開始進食，8 與 24 小時後的糖原再合成率與立即進食組相同
    - 每天訓練 2 或 3 次，或恢復時間少於 24 小時者，應考慮賽後立即高碳水化合物餐或飲品，並定期補充以加速回補
    detail: 這不是「任何人都可延後兩小時」的規則；書中將較積極的立即補充特別留給兩次活動間隔很短的情境。
    terms:
    - carbohydrate
    - glycogen
    numbers:
    - v: 24
      unit: 小時
      of: 有足夠恢復時間時可在其中補回糖原的時段，也是決定是否需要立即補充的界線
    - v: 2
      unit: 小時
      of: 研究中延後開始攝取高升糖餐的時間
    - v: 8
      unit: 小時
      of: 比較立即與延後攝取組糖原再合成率的第一個時間點
    - v: 2–3
      unit: 次/日
      of: 書中列為應考慮立即高碳水化合物補充的每日訓練頻率
    concepts:
    - nutrition
    related:
    - ch10.post-competition.i01
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition > Aerobic Endurance Events
  - id: ch10.post-competition.i04
    q: 不同運動後的蛋白質建議
    a:
    - 耐力運動後，書中一般指引為在 3 小時內至少攝取 10 g 蛋白質；精確劑量與時機尚不清楚，且可能受空腹／進食狀態與賽後總熱量影響
    - 阻力訓練後，年輕人以 20–25 g 高品質、高亮氨酸、吸收快的蛋白質（約含 8.5–10 g 必需胺基酸）達到最大急性肌肉蛋白合成；年長者可能需要 40 g 以上
    - 每份含 2–3 g 亮氨酸或每公斤體重 0.05 g 亮氨酸的蛋白質劑量，可使年輕成人肌肉蛋白合成達最大刺激
    detail: 耐力運動的蛋白質時機不能被寫成精確硬門檻；書中同時指出，延後蛋白質攝取僅 3 小時的研究發現合成效應受鈍化，但理想時間窗仍未釐清。
