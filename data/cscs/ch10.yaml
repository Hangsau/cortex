  - id: ch10.weight-gain.i04
    q: 增重的飲食執行策略
    a:
    - 增加每餐份量
    - 增加進食頻率
    - 著重選擇高熱量密度食物
    detail: 書中只列出這三種策略，沒有在此段指定堅果、乾果或全脂乳品等例子；這裡不以書外食物範例補充。
    terms: []
