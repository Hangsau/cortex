    related:
    - ch10.during-event.i04
    locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition > Aerobic Endurance Sports
- id: eating-disorders
  title: 飲食失調 Eating Disorders
  desc: ''
  tag: Eating Disorders
  items:
  - id: ch10.eating-disorders.i01
    q: 神經性厭食症（anorexia nervosa）的特徵與流行病學
    a:
    - 體像扭曲、強烈害怕增重或變胖，導致過度限制熱量與嚴重減重；也常過度重視體重或體型，卻不承認疾病嚴重性
    - 平均發病年齡為 19 歲；女性與男性終生盛行率分別為 0.9% 與 0.3%
    - 在所有精神健康疾患中，神經性厭食症的死亡率最高
    detail: 這些盛行率與治療統計採用較舊的診斷標準；書中明確提醒，2013 年修訂診斷標準後的盛行率可能上升。
    terms:
    - anorexia-nervosa
    numbers:
    - v: 19
      unit: 歲
      of: 神經性厭食症的平均發病年齡
    - v: 0.9
      unit: '%'
      of: 女性神經性厭食症的終生盛行率
    - v: 0.3
      unit: '%'
      of: 男性神經性厭食症的終生盛行率
    concepts:
