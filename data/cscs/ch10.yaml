cards:
- q: 賽前 ≥4 小時的碳水與蛋白質建議量？
  a: 碳水 1–4 g/kg BW；蛋白質 0.15–0.25 g/kg BW；水分 5–7 ml/kg BW
  tag: 賽前營養
- q: 賽前 2 小時的碳水建議量？
  a: 約 1 g/kg BW；若未達水合：補充 3–5 ml/kg BW 水分
  tag: 賽前營養
- q: 賽前 1 小時內首選什麼形式的碳水？
  a: 液態碳水 / gel / 果凍（胃排空快，降低腸胃不適風險）
  tag: 賽前營養
- q: 賽前水合達標指標：尿液比重（USG）應低於多少？
  a: USG < 1.020
  tag: 賽前營養
- q: 高 GI vs 低 GI 碳水賽前效果有差異嗎？
  a: 研究不支持一者優於另一者；初期血糖下降於運動開始 20 分鐘後通常恢復，不影響表現
  tag: 賽前營養
- q: 賽前餐為何要低脂低纖？
  a: 脂肪與纖維減慢消化速率，增加腸胃不適與痙攣風險
  tag: 賽前營養
- q: 碳水超補（Carbohydrate Loading）的標準劑量？
  a: 8–10 g/kg BW/day，賽前 3 天高碳水＋減量訓練；賽前一天完全休息
  tag: 碳水超補
- q: 碳水超補可使肌肉肝醣提升多少？
  a: 20–40% 以上正常水平
  tag: 碳水超補
- q: 馬拉松賽前 36–48 小時的碳水特殊建議量？
  a: 10–12 g/kg BW/day
  tag: 碳水超補
- q: 為何許多女運動員碳水超補效果較差？
  a: 習慣性熱量攝取不足（<2400 kcal/day），導致碳水總量不達標，並非性別差異本身造成
  tag: 碳水超補
- q: 碳水超補對爆發力/阻力訓練是否有效？
  a: 效果不顯著（研究：4 組跳蹲，6.5 g/kg vs 4.4 g/kg，爆發力無差異）
  tag: 碳水超補
- q: 碳水超補的主要副作用？
  a: 暫時體重增加（肝醣儲水 3–4 倍）；豆類/菊糖食物引起腸脹氣
  tag: 碳水超補
- q: 賽中脫水超過多少體重比例會影響運動表現？
  a: 超過 2% BW
  tag: 賽中補給
- q: 最佳運動飲料的含鈉建議量？
  a: 20–30 mEq/L（460–690 mg，陰離子為氯離子）
  tag: 賽中補給
- q: 最佳運動飲料的鉀含量？
  a: 2–5 mEq/L（78–195 mg）
  tag: 賽中補給
- q: 運動飲料碳水濃度超過多少會延遲胃排空？
  a: 超過 8%；理想濃度為 6–8%
  tag: 賽中補給
- q: 有氧耐力運動每小時建議攝取多少碳水？
  a: 28–144 g/h
  tag: 賽中補給
- q: 為何賽中應混合多種碳水（葡萄糖＋果糖）而非單一種？
  a: 不同腸道轉運蛋白；單一碳水轉運蛋白飽和後吸收受限，混合可提高氧化速率（突破 1 g/min 上限）
  tag: 賽中補給
- q: 碳水漱口（不吞嚥）對運動表現有何效果？
  a: 約 1 小時的運動可提升表現 2–3%，推測透過中樞神經系統作用
  tag: 賽中補給
- q: 40 kg 兒童賽中每 20 分鐘建議飲水量？
  a: 5 oz（148 ml）冷水或含鹽飲料
  tag: 賽中補給
- q: 60 kg 青少年賽中每 20 分鐘建議飲水量？
  a: 9 oz（256 ml），即使不渴也需飲用
  tag: 賽中補給
- q: 肝醣再合成的兩個階段各有何特點？
  a: Phase 1：前 30–60 min，胰島素非依賴性，速率最快；Phase 2：之後數小時，胰島素依賴性，速率較慢
  tag: 賽後恢復
- q: 最大化賽後肝醣再合成的補充方案？
  a: 1.0–1.85 g/kg BW/h 碳水，每 15–60 分鐘補充一次，持續 5 小時
  tag: 賽後恢復
- q: 若恢復時間 >24 小時，是否需要立即賽後補充碳水？
  a: 不必立即，可等 2 小時後開始補充，24 小時內補足即可
  tag: 賽後恢復
- q: 有氧耐力運動後蛋白質攝取的最低建議量與時機？
  a: 至少 10 g 蛋白質，運動後 3 小時內（越早越好）
  tag: 賽後恢復
- q: 年輕人阻力訓練後最大化肌蛋白合成（FSR）所需蛋白質量？
  a: 20–25 g 高品質高亮氨酸蛋白（EAA 8.5–10 g，亮氨酸 2–3 g 或 0.05 g/kg BW）
  tag: 賽後恢復
- q: 老年人阻力訓練後最大化肌蛋白合成所需蛋白質量？
  a: ≥40 g（年輕人的 2 倍）
  tag: 賽後恢復
- q: 阻力訓練後減少蛋白質分解所需的碳水量？
  a: 30–100 g 高升糖指數碳水
  tag: 賽後恢復
- q: 力量運動後恢復肝醣的建議補充方案？
  a: 立即 1.5 g/kg BW 碳水 + 1 小時後再補一次，6 小時內可恢復至賽前 91% 水平
  tag: 賽後恢復
- q: BMR 約佔總每日能量消耗的多少比例？
  a: 65–70%（最大貢獻因子）
  tag: 能量需求
- q: 體力活動約佔總每日能量消耗的多少比例？
  a: 20–30%（最可變因子，運動員可更高）
  tag: 能量需求
- q: 食物產熱效應（Diet-Induced Thermogenesis）約佔多少比例？
  a: 10–15%
  tag: 能量需求
- q: Cunningham 方程式計算 RMR 的公式？
  a: RMR = 500 + 22 × LBM（kg）
  tag: 能量需求
- q: Cunningham vs Harris-Benedict 方程式的差異？
  a: Cunningham 納入瘦體重（LBM），更適合運動員；Harris-Benedict 用體重/身高/年齡/性別，未考慮肌肉量
  tag: 能量需求
- q: 男性重度活動的每日熱量需求估算值？
  a: 50 kcal/kg/day（輕度 38、中度 41）
  tag: 能量需求
- q: 女性重度活動的每日熱量需求估算值？
  a: 44 kcal/kg/day（輕度 35、中度 37）
  tag: 能量需求
- q: 增重建議的每日額外熱量攝取量？
  a: 約 +500 kcal/day
  tag: 增重策略
- q: 增重期間最大化瘦體重增加所需蛋白質量？
  a: 1.5–2.0 g/kg BW/day
  tag: 增重策略
- q: 高蛋白過食研究（低/正常/高蛋白組）結果？
  a: 正常＋高蛋白組約 45% 多餘熱量存為瘦體重；低蛋白組 95% 多餘熱量存為脂肪
  tag: 增重策略
- q: CSCS 中哪種補充品被認為安全有效地增加瘦體重？
  a: 肌酸一水化物（Creatine Monohydrate）
  tag: 增重策略
- q: 減脂期間保留肌肉所需的蛋白質量？
  a: 1.8–2.7 g/kg BW/day（或 2.3–3.1 g/kg FFM/day）＋ 熱量赤字約 500 kcal/day
  tag: 減脂策略
- q: 低碳飲食初期體重快速下降的主要原因？
  a: 肝醣耗盡→儲存水分減少（肝醣儲水 3–4 倍）→體重快速下降，非真正脂肪減少
  tag: 減脂策略
- q: 成人 BMI 過重與肥胖的分界值？
  a: 過重：25–29.9 kg/m²；肥胖 I 30–34.9、II 35–39.9、III ≥40
  tag: 肥胖評估
- q: BMI 在運動員身上的局限性？
  a: 肌肉質量高者易高估體脂；老年人易低估體脂；只是篩選工具，非診斷工具
  tag: 肥胖評估
- q: 男性與女性腰圍增加疾病風險的切點？
  a: 男性 >102 cm（40 in）；女性 >88 cm（35 in）
  tag: 肥胖評估
- q: 肥胖（BMI ≥30）相關的主要疾病有哪些？
  a: 高血壓、高血脂、冠心病、第二型糖尿病、睡眠呼吸中止症、骨關節炎、子宮內膜/乳癌/前列腺/大腸癌
  tag: 肥胖評估
- q: 快速減重的常見危險手段有哪些？
  a: 禁食、主動脫水（利尿劑/三溫暖）、自我催吐、瀉藥、多穿衣物流汗、過度吐口水
  tag: 減脂策略
- q: 快速減重的生理危害有哪些？
  a: 脫水、熱病、電解質失衡、免疫抑制、腎衰竭（利尿劑）、心律不整、昏厥，極端情況可致死
  tag: 減脂策略
- q: 肥胖治療的初始體重目標？
  a: 6 個月內減少 10% 的初始體重
  tag: 肥胖評估
- q: 厭食症（Anorexia Nervosa）的核心特徵與流行病學？
  a: 體像扭曲＋強烈恐懼增重→極度限制熱量；平均發病 19 歲；女性終身盛行率 0.9%；所有精神疾患中死亡率最高
  tag: 飲食失調
- q: 暴食症（Bulimia Nervosa）的診斷標準？
  a: 反覆暴食後清除（催吐/瀉藥/過度運動）；至少 1 次/週 × 3 個月；平均發病 20 歲；盛行率 0.6%
  tag: 飲食失調
- q: 暴食失調（BED）與暴食症的主要區別？
  a: BED 無清除行為→常見過重/肥胖；女性盛行率 3.5%（高於暴食症）；平均發病 25 歲
  tag: 飲食失調
- q: 肌力與體能訓練師（SC）面對飲食失調的正確職責？
  a: 辨識症狀 → 轉介合格醫療/心理/營養師組成的跨專業治療團隊；SC 不負責診斷或治療
  tag: 飲食失調
