  - id: ch10.during-event.i04
    q: 長時間有氧耐力運動的賽中碳水化合物攝取
    a:
    - 每小時攝取 28–144 g 碳水化合物；較高攝取量的研究主要見於自行車運動
    - 對有限糖原儲存的依賴降低，可延長至力竭時間並改善表現
    detail: 運動飲料雖能供應碳水化合物，但在長時間高強度活動中，除非喝下過量液體，通常無法追上運動員的碳水化合物利用量。
    terms:
    - carbohydrate
    - glycogen
    numbers:
    - v: 28–144
      unit: g/小時
      of: 長時間有氧耐力活動中研究過的每小時碳水化合物攝取範圍
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch10.during-event.i05
    locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition > Aerobic Endurance Sports
  - id: ch10.during-event.i05
    q: 賽中混合多種碳水化合物的理由
    a:
    - 各種碳水化合物有不同腸道運輸系統；只攝取一種時，該種的運輸蛋白飽和會限制消化
    - 併用蔗糖、果糖、葡萄糖或麥芽糊精，可比等熱量的單一糖提高吸收率與外源性碳水化合物氧化
    - 外源性碳水化合物氧化率不超過每分鐘 1.0–1.1 g；葡萄糖加果糖在自行車計時賽研究中優於單用葡萄糖
    detail: 混合來源的優勢不是無限提高氧化速率；書中明確指出外源性氧化本身仍有每分鐘約 1 g 的上限。
    terms:
    - carbohydrate
    numbers:
    - v: 1.0–1.1
      unit: g/分鐘
      of: 外源性碳水化合物氧化率不會超過的範圍
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch10.during-event.i04
    locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition > Aerobic Endurance Sports
  - id: ch10.during-event.i06
    q: 間歇性高強度運動的賽中碳水化合物與液體
    a:
    - 長時間間歇性運動時，液體與碳水化合物供應對表現很重要
    - 碳水化合物補充可改善長時間網球比賽的擊球品質；在一項足球研究中，碳水化合物－電解質飲料改善部分特定技能表現
    detail: 足球研究的結果並非所有測試項目皆改善；且另一項研究先以耗竭運動、低碳水化合物餐與隔夜禁食處理，因此其效果不能直接外推到進食充足的比賽情境。
    terms:
    - carbohydrate
    - electrolyte
    - glycogen
    numbers: []
    concepts:
    - nutrition
    related:
    - ch10.during-event.i01
    locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition > Intermittent High-Intensity Sports
  - id: ch10.during-event.i07
    q: 力量與爆發力運動的賽中碳水化合物
    a:
    - 阻力訓練會使用大量肌肉糖原；力量與爆發力競賽或特別依賴肌力與爆發力的位置，可能耗竭糖原
    - 賽前與賽中補充碳水化合物可維持糖原儲存，可能降低慢縮肌纖維的肌肉疲勞並改善表現
    detail: 源書以「可能」描述對慢縮肌纖維疲勞與表現的效果；不可改寫成已確定的肌肉分解降低效果。
    terms:
    - carbohydrate
    - glycogen
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related:
    - ch10.post-competition.i05
    locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition > Strength and Power Sports
  - id: ch10.during-event.i08
    q: 碳水化合物漱口的表現效果
    a:
    - 將碳水化合物在口中漱過而不吞下，似乎可使約 1 小時的運動表現改善 2–3%
    - 其機制推測與中樞神經系統有關
    detail: 書中以「seems」與「presumably」表述這個發現，故效果與機制皆不能寫成確定因果。
    terms:
    - carbohydrate
    numbers:
    - v: 1
      unit: 小時
      of: 研究中碳水化合物漱口似乎可改善表現的運動持續時間
    - v: 2–3
      unit: '%'
      of: 碳水化合物漱口似乎帶來的表現改善幅度
    concepts:
