- id: weight-loss
  title: 體重（脂肪）減少策略 Weight Loss Strategies
  desc: ''
  tag: Weight Loss
  items:
  - id: ch10.weight-loss.i01
    q: 體脂減少的核心原則
    a:
    - 不論低碳水化合物或低脂飲食，只要攝取熱量少於維持體重所需，都能減重
    - 總熱量攝取與飲食依從性，是預測成功減重最重要的兩項因素；低碳水化合物與低脂飲食的減重幅度看起來沒有差異
    detail: 書中不主張一種適合所有人的理想飲食；減脂時相當一部分減重可能來自肌肉，因此對運動員還要考量蛋白質與能量不足對肌肉蛋白合成的影響。
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss
  - id: ch10.weight-loss.i02
    q: 減脂時維持肌肉的蛋白質與能量不足建議
    a:
    - 減脂又希望維持肌肉的運動員，每天約攝取每公斤體重 1.8–2.7 g 蛋白質，或每公斤無脂體重 2.3–3.1 g 蛋白質
    - 搭配約 500 kcal/日的適度能量不足
    detail: 這項建議針對「想維持肌肉並減脂」的運動員；書中先指出節食時熱量限制可能降低肌肉蛋白合成，因此不能把一般減重飲食直接視為保肌策略。
    terms:
    - protein
    - fat-free-mass
    - muscle-protein-synthesis
    numbers:
    - v: 1.8–2.7
      unit: g/kg 體重/日
      of: 減脂期間維持肌肉的每日蛋白質攝取建議
    - v: 2.3–3.1
      unit: g/kg 無脂體重/日
      of: 減脂期間維持肌肉的每日蛋白質攝取替代表達
    - v: 500
      unit: kcal/日
      of: 減脂期間建議的適度每日能量不足
    concepts:
    - nutrition
    related: []
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss
  - id: ch10.weight-loss.i03
    q: 低碳水化合物飲食的初期體重變化與適用界線
    a:
    - 顯著減少碳水化合物會耗竭糖原；糖原儲存時伴隨 3–4 份水，因此初期體重快速下降可主要來自水分，重新吃碳水化合物後也可能快速回升
    - 長期而言，低碳水化合物飲食對某些人可能有效，原因可能是蛋白質增加而提高飽足感、飲食誘發性產熱並保留代謝活躍的瘦肌肉
    - 對競賽運動員，特別在賽前與比賽期，減少碳水化合物可能不利；但對胰島素阻抗、第二型糖尿病、過重或肥胖者可能非常有效
    detail: 書中以「可能」描述低碳水化合物對特定人群的效果，且把初期水重變化與脂肪減少區分；不應將快速體重下降全寫成脂肪減少。
    terms:
    - low-carbohydrate-diet
    - glycogen
    - protein
    - diet-induced-thermogenesis
    - insulin-resistance
    numbers:
    - v: 3–4
      unit: 份水
      of: 每份糖原儲存時伴隨的水分量
    concepts:
    - nutrition
    related: []
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Low-Carbohydrate Diets
  - id: ch10.weight-loss.i04
    q: 快速減重（rapid weight loss）的定義與動機
    a:
    - 文獻沒有統一定義；一般指在短時間內以單靠降低熱量攝取與增加運動無法達成的速度快速減重
    - 運動員可能為了參加目標量級、達到教練設定的體重目標或改善表現而採用
    detail: 書中沒有說快速減重「常見於」某些特定項目，也未列舉拳擊或 MMA；這裡只保留其描述的目的與定義。
    terms:
    - rapid-weight-loss
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Rapid Weight Loss
  - id: ch10.weight-loss.i05
    q: 快速減重的潛在危險手段
    a:
    - 禁食、流行飲食法與自我催吐
    - 主動脫水（利尿劑、三溫暖、水分與鹽分操控、穿多層衣物）與過度吐口水
    - 瀉藥濫用及不當或過量使用產熱增效劑
    detail: 這些是書中列為「可能危險」的快速減重技術，不是健康減脂方案；主動脫水是其中刻意流失水分的一類做法。
    terms:
    - rapid-weight-loss
    - voluntary-dehydration
    numbers: []
    concepts:
    - nutrition
    - safety
    related:
    - ch10.weight-loss.i06
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Rapid Weight Loss
  - id: ch10.weight-loss.i06
    q: 嘗試過快減重的健康與表現危害
    a:
    - 可能流失瘦體重、疲勞、頭痛或情緒波動，並危及訓練與表現
    - 可能出現脫水、熱疾病、肌肉痙攣、疲勞、頭暈、免疫功能受抑、荷爾蒙失衡、高體溫、肌力下降、血漿與血量下降、低血壓與電解質失衡
    - 利尿劑濫用可能腎衰竭；也可能昏倒，極端案例可死亡
    detail: 原文列舉的是多項「可能」的嚴重副作用，不能把未列出的心律不整或其他診斷名稱加進這份教材清單。
    terms:
    - rapid-weight-loss
    - dehydration
    - electrolyte
    numbers: []
    concepts:
    - nutrition
    - safety
    related:
    - ch10.weight-loss.i05
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Rapid Weight Loss
  - id: ch10.weight-loss.i07
    q: 肌力與體能專業人員面對快速減重的職責
    a:
    - 應辨識快速減重技術的徵象，轉介給適當專業人員，並向其他教練團隊溝通疑慮
    - 可記錄已採取的協助步驟以利紀錄保存並避免責任風險；並與醫師或註冊營養師共同依身體組成、節食、醫療與飲食疾患病史設定合適體重目標
    - 若無法在不危及健康或表現的情況下達標，有些運動員可能須重新考慮參加的量級
    detail: 專業角色是辨識、溝通、轉介與共同規劃，而不是由肌力與體能專業人員單獨替運動員決定量級或體重。
    terms:
    - strength-and-conditioning-professional
    - registered-dietitian
    numbers: []
    concepts:
    - nutrition
    - professional
    related:
    - ch10.weight-loss.i05
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Rapid Weight Loss
  - id: ch10.weight-loss.i08
    q: 可長期維持的個別化減脂飲食
    a:
    - 飲食應安全、含足夠蛋白質、符合生活型態而容易遵循，並考量飲食習慣、食物偏好、病史及醫療顧慮（包括糖尿病、胰島素阻抗與其他疾病）
    - 持續的行為治療與支持可改善長期成果
    detail: 個別化的目的不只是選擇低碳或低脂，而是讓飲食在滿足訓練與表現所需營養的前提下能長期遵循。
    terms:
    - protein
    - insulin-resistance
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Low-Carbohydrate Diets
cards:
- q: 有氧耐力運動員賽前至少 4 小時的餐食與水分建議為何？
  a: 碳水化合物 1–4 g/kg 體重、蛋白質 0.15–0.25 g/kg 體重，以及水或運動飲料 5–7 ml/kg 體重。
  tag: 賽前營養
- q: 賽前 2 小時如何安排碳水化合物與液體？
  a: 約 1 g/kg 體重碳水化合物；若水合不足，依個人計畫小口攝取 3–5 ml/kg 體重液體。
  tag: 賽前營養
- q: 賽前餐接近開賽時應如何調整？
  a: 越接近開賽，食物與液體量越少；運動前 1 小時時，液態碳水化合物、凝膠與軟糖等因胃排空或消化較快，可能較適合。
  tag: 賽前營養
- q: 賽前水合時，尿液比重（USG）讀值應低於多少？
  a: 低於 1.020。
  tag: 賽前營養
- q: 賽前應選高還是低升糖指數（GI）碳水化合物？
  a: 兩者皆可，研究未顯示一者較有利；葡萄糖等可能讓運動開始時血糖先下降，但通常約 20 分鐘後恢復正常且不影響表現。
  tag: 賽前營養
- q: 為何賽前食品宜低脂、低膳食纖維？
  a: 脂肪與纖維會減慢消化；運動時若食物仍在消化，可能造成腸胃不適或胃痙攣。
  tag: 賽前營養
- q: 常用碳水化合物超補方案為何？
  a: 賽前一週減量運動、賽前 3 天高碳水化合物飲食、前一天完全休息；超補期間每天攝取 8–10 g/kg 體重碳水化合物。
  tag: 碳水超補
- q: 常用超補方案對肌肉糖原儲存的預期效果？
  a: 可使肌肉糖原儲存高於正常約 20–40%。
  tag: 碳水超補
- q: 馬拉松前 36–48 小時的較高碳水化合物建議量？
  a: 每天 10–12 g/kg 體重。
  tag: 碳水超補
- q: 女性超補時為何要考量總能量攝取？
  a: 習慣每天少於 2,400 kcal 的女性可能難以吃足碳水化合物；可能需把總能量提高到 2,400 kcal 以上並採高碳水飲食。
  tag: 碳水超補
- q: 一項跳蹲研究中，提高碳水化合物是否改善爆發力表現？
  a: 沒有；健康年輕男性連續 4 天攝取 6.5 而非 4.4 g/kg 體重碳水化合物後，四組跳蹲的爆發力沒有顯著差異。
  tag: 碳水超補
- q: 碳水化合物超補有哪些實務限制？
  a: 可能暫時增重；豆類、洋蔥或添加菊糖等寡糖的食品可被腸道細菌快速發酵，造成腸氣與腹脹。
  tag: 碳水超補
- q: 賽中應避免水分造成的體重流失超過多少？
  a: 體重的 2%。
  tag: 賽中補給
- q: 熱天長時間活動時，運動飲料每公升的鈉建議量？
  a: 20–30 mEq；若氯離子為陰離子，為 460–690 mg。
  tag: 賽中補給
- q: 熱天長時間活動時，運動飲料每公升的鉀建議量？
  a: 2–5 mEq，即 78–195 mg。
  tag: 賽中補給
- q: 何種運動飲料碳水化合物濃度會延遲胃排空？
  a: 高於 8% 會延遲胃排空並可能引起胃不適；6–8% 可能較理想。
  tag: 賽中補給
- q: 長時間有氧耐力活動中，研究過的每小時碳水化合物攝取範圍？
  a: 28–144 g；較高量的研究主要見於自行車運動。
  tag: 賽中補給
- q: 為何賽中可混合多種碳水化合物？
  a: 不同碳水化合物有不同腸道運輸系統；混合蔗糖、果糖、葡萄糖或麥芽糊精可比等熱量單一糖提高吸收與外源性氧化，但氧化率不超過約 1.0–1.1 g/分鐘。
  tag: 賽中補給
- q: 不吞下的碳水化合物漱口可能有何效果？
  a: 約 1 小時運動的表現似乎可改善 2–3%，推測與中樞神經系統有關。
  tag: 賽中補給
- q: 體重 40 kg 的兒童練習中每 20 分鐘應喝多少？
  a: 5 oz（148 ml）冷水或調味含鹽飲料。
  tag: 賽中補給
- q: 體重 60 kg 的青少年練習中每 20 分鐘應喝多少？
  a: 9 oz（256 ml），即使沒有口渴感。
  tag: 賽中補給
- q: 運動後糖原再合成的兩階段如何區分？
  a: 第一階段為前 30–60 分鐘、不依賴胰島素且合成很快；第二階段持續數小時、合成速度較慢。教材未將第二階段稱為胰島素依賴性。
  tag: 賽後恢復
- q: 要快速糖原回補時，賽後碳水化合物方案為何？
  a: 結束後立即每小時 1.0–1.85 g/kg 體重，接著每 15–60 分鐘補充，最多 5 小時。
  tag: 賽後恢復
- q: 恢復時間超過 24 小時時，是否一定要立刻吃碳水化合物？
  a: 不一定；只要攝取足夠碳水化合物，可在 24 小時內補回糖原。延後 2 小時開始的研究，在 8 與 24 小時後的再合成率相同。
  tag: 賽後恢復
- q: 耐力運動後，書中的蛋白質一般指引為何？
  a: 在 3 小時內至少 10 g；但精確劑量與時機尚不清楚，可能受空腹／進食狀態與總能量影響。
  tag: 賽後恢復
- q: 年輕人阻力訓練後最大刺激肌肉蛋白合成的蛋白質量？
  a: 20–25 g 高品質、高亮氨酸、吸收快的蛋白質，約含 8.5–10 g 必需胺基酸；每份約含 2–3 g 亮氨酸或 0.05 g/kg 體重亮氨酸。
  tag: 賽後恢復
- q: 年長者阻力訓練後最大刺激肌肉蛋白合成可能需要多少蛋白質？
  a: 40 g 以上；教材沒有把它定義為年輕人需要量的固定倍數。
  tag: 賽後恢復
- q: 碳水化合物不足時，賽後加入蛋白質有何作用？
  a: 若碳水化合物低於 1.2 g/kg 體重/小時，加入蛋白質可提高糖原儲存速率。
  tag: 賽後恢復
- q: 阻力訓練研究中的糖原回補案例為何？
  a: 運動後立即與 1 小時後各攝取 1.5 g/kg 體重碳水化合物，6 小時時肌肉糖原由耗竭後的 71% 回到運動前的 91%。
  tag: 賽後恢復
- q: 基礎代謝率（BMR）約占每日總能量消耗多少？
  a: 65–70%，是最大組成。
  tag: 能量需求
- q: 身體活動約占每日總能量消耗多少？
  a: 20–30%，也是個人之間最可變的組成；運動員可能更高。
  tag: 能量需求
- q: 飲食誘發性產熱約占每日燃燒熱量多少？
  a: 10–15%。
  tag: 能量需求
- q: Cunningham 方程式如何估算靜息代謝率（RMR）？
  a: RMR = 500 + 22 × 瘦體重（LBM；kg）。
  tag: 能量需求
- q: Cunningham 與 Harris-Benedict 方程式的運動員差異？
  a: Cunningham 另納入瘦體重，較適用於運動員；Harris-Benedict 使用性別、體重、身高與年齡，未納入肌肉量。
  tag: 能量需求
- q: 表 10.4 的男性每日熱量需求估計值？
  a: 每公斤體重每天：輕度 38、適度 41、重度 50 kcal。
  tag: 能量需求
- q: 表 10.4 的女性每日熱量需求估計值？
  a: 每公斤體重每天：輕度 35、適度 37、重度 44 kcal。
  tag: 能量需求
- q: 增重的一般每日額外能量攝取起點？
  a: 約 500 kcal，但應依個人調整；持續大幅增加可能增加超出預期的脂肪。
  tag: 增重策略
- q: 增重時最大化瘦體重增加的每日蛋白質範圍？
  a: 1.5–2.0 g/kg 體重。
  tag: 增重策略
- q: 8 週過度餵食研究中，蛋白質比例與儲存組成有何差別？
  a: 正常蛋白（15%）與高蛋白（25%）組約 45% 多餘熱量儲為瘦體重；低蛋白（5%）組有 95% 儲為體脂肪。
  tag: 增重策略
- q: 本章列為可安全且有效增加瘦體重的補充品？
  a: 一水肌酸（creatine monohydrate）。
  tag: 增重策略
- q: 減脂又要維持肌肉時，蛋白質與能量不足如何安排？
  a: 蛋白質 1.8–2.7 g/kg 體重/日，或 2.3–3.1 g/kg 無脂體重/日；搭配約 500 kcal/日適度能量不足。
  tag: 減脂策略
- q: 低碳水化合物飲食初期體重快速下降的主要原因？
  a: 糖原耗竭及其伴隨水分減少；每份糖原儲存伴隨 3–4 份水，因此不應把初期快速下降全當成脂肪減少。
  tag: 減脂策略
- q: 教材表 10.5 的成人 BMI 過重與肥胖分類？
  a: 過重 25.0–29.9；肥胖 I 級 30.0–34.9、II 級 35.0–39.9、極端肥胖 III 級 >40 kg/m²。III 級界值依教材表格保留。
  tag: 肥胖評估
- q: BMI 在運動員與高齡者身上的限制？
  a: BMI 測量的是過多體重而非過多體脂，不能分辨脂肪、肌肉與骨量；肌肉量高者可能被高估，高齡肌肉流失者可能被低估，只能作初步篩檢。
  tag: 肥胖評估
- q: 腰圍增加疾病相對風險的界值？
  a: 男性 >102 cm（40 in），女性 >88 cm（35 in）。
  tag: 肥胖評估
- q: 過重與肥胖會增加哪些疾病風險？
  a: 高血壓、血脂異常、冠心病、膽囊疾病、中風、第二型糖尿病、睡眠呼吸中止症、骨關節炎、呼吸問題，以及子宮內膜、乳房、前列腺與結腸癌。
  tag: 肥胖評估
- q: 教材列出的快速減重潛在危險手段？
  a: 禁食、流行飲食法、自我催吐、主動脫水（利尿劑、三溫暖、水鹽操控、多層衣物）、過度吐口水、瀉藥濫用與不當或過量產熱增效劑。
  tag: 減脂策略
- q: 嘗試過快減重的主要危害？
  a: 可危及訓練與表現，並可能脫水、熱疾病、肌肉痙攣、頭暈、免疫功能受抑、荷爾蒙與電解質失衡、低血壓；利尿劑濫用可能腎衰竭，極端案例可死亡。
  tag: 減脂策略
- q: 過重與肥胖的初始減重目標？
  a: 6 個月內減去初始體重的 10%。
  tag: 肥胖評估
- q: 神經性厭食症（anorexia nervosa）的核心特徵與統計？
  a: 體像扭曲、害怕增重或變胖，導致過度限制熱量與嚴重減重；平均發病 19 歲，女性與男性終生盛行率為 0.9% 與 0.3%，且死亡率在精神健康疾患中最高。
  tag: 飲食失調
- q: 神經性貪食症（bulimia nervosa）的行為與統計？
  a: 反覆暴食後以催吐、劇烈運動、瀉藥或利尿劑清除，至少每週 1 次、持續 3 個月；平均發病 20 歲，終生盛行率 0.6%。
  tag: 飲食失調
- q: 暴食疾患（binge-eating disorder）與神經性貪食症的主要差別？
  a: 暴食疾患的暴食後沒有清除行為，因此患者常過重或肥胖；教材原文列為每週至少 1 次、持續 3 週，男性與女性終生盛行率 2.0% 與 3.5%，平均發病 25 歲。
  tag: 飲食失調
- q: 肌力與體能專業人員面對疑似飲食疾患的正確職責？
  a: 不診斷或治療；辨識令人擔憂的行為並轉介有資格的專業人員，協助運動員取得正確診斷與心理、醫療、營養治療團隊的協助。
  tag: 飲食失調
