    related: []
    locator: Nutrition Strategies for Altering Body Composition > Weight Gain
  - id: ch10.weight-gain.i03
    q: 過度餵食研究中蛋白質比例與體重組成
    a:
    - 一項 8 週代謝病房隨機對照過度餵食研究中，正常蛋白（總熱量 15%）與高蛋白（25%）組約有 45% 的多餘熱量儲為瘦體重
    - 低蛋白組（總熱量 5%）的多餘熱量有 95% 儲為體脂肪
    detail: 這是健康成人的受控過度餵食研究結果；它支持「若能持續，過度餵食蛋白質有利」的書中說法，不能直接當成每位運動員的身體組成預測式。
    terms:
