  - id: ch10.weight-gain.i06
    q: 運動營養諮詢對增重的效益
    a:
    - 一項 21 名重度訓練菁英運動員的研究中，接受營養諮詢者在 8–12 週增重介入期間與 12 個月後，總體重與瘦體重增加都較大
    detail: 研究中的比較組是自由進食；結果表示諮詢結束後數月仍可能保有指導效益，而非只代表介入期間的短期改變。
