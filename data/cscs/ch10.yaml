  - id: ch10.weight-gain.i05
    q: 增重時的一水肌酸（creatine monohydrate）
    a:
    - 一水肌酸可安全且有效地增加瘦體重
    detail: 本章在增重段落只做此安全性與效果的概述；「必考補充品」不是教材原文，故不保留。
    terms:
