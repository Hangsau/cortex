  - id: ch10.during-event.i03
    q: 兒童與青少年的賽中飲水建議
    a:
    - 體重 40 kg 的兒童，練習中每 20 分鐘飲用 5 oz（148 ml）冷水或調味含鹽飲料
    - 體重 60 kg 的青少年，每 20 分鐘飲用 9 oz（256 ml），即使沒有口渴感
    detail: 書中提醒一次喝 9 oz 對青少年已是不小的量，可能造成胃部不適，因此仍可能需要依個別運動員調整。
    terms:
    - hydration
    - electrolyte
    numbers:
