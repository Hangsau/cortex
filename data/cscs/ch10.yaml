- id: pre-competition
  title: 賽前營養 Pre-Competition Nutrition
  desc: ''
  tag: Precompetition
  items:
  - id: ch10.pre-competition.i01
    q: 賽前餐（precompetition meal）的主要目的
    a:
    - 提供足夠液體以維持水合狀態
    - 提供碳水化合物以最大化血糖與儲存糖原，並減少飢餓感
    detail: 賽前餐對表現的研究結果並不一致；書中建議依時機、餐食與液體組成、項目及個人偏好調整，而非用單一食譜套用所有人。
    terms:
    - precompetition-meal
    - hydration
    - carbohydrate
    - glycogen
    numbers: []
    concepts:
    - nutrition
    related:
    - ch10.pre-competition.i06
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition
  - id: ch10.pre-competition.i02
    q: 賽前至少 4 小時的餐食與水分
    a:
    - 有氧耐力運動員若在賽前至少 4 小時進食，餐食約含每公斤體重 1–4 g 碳水化合物及 0.15–0.25 g 蛋白質
    - 水或運動飲料約每公斤體重 5–7 ml
    detail: 這些是可為其他運動調整的有氧耐力建議；書中特別提到容易噁心、比賽腹瀉、焦慮、從事高強度運動或在高溫比賽者，可考慮較早進食。
    terms:
    - carbohydrate
    - protein
    - hydration
    numbers:
