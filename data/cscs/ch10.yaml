id: ch10
weight: 10
title: Ch.10 Nutrition Strategies for Maximizing Performance
topics:
- id: carb-loading
  title: 碳水化合物補充法 Carbohydrate Loading
  desc: ''
  tag: Carb Loading
  items:
  - id: ch10.carb-loading.i01
    q: 目的
    a:
    - 最大化肌肉與肝臟肝醣儲存，延遲長時間有氧運動的疲勞
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch10.carb-loading.i02
    q: 標準方案
    a:
    - 賽前 3 天高碳水＋減量訓練
    - 賽前一天完全休息
    - 劑量：8–10 g/kg BW/day → 肝醣↑ 20–40%
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch10.carb-loading.i03
    q: 馬拉松特例
    a:
    - 賽前 36–48h 可增至 10–12 g/kg BW/day
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch10.carb-loading.i04
    q: 男女差異
    a:
    - 女性需更高總熱量才能有效補充肝醣（>2400 kcal/day）
    - 在熱量充足條件下，兩性肝醣儲存能力無差異
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch10.carb-loading.i05
    q: 女性關鍵
    a:
    - 習慣每日 <2400 kcal 的女運動員需先提高總熱量才能達到有效肝醣超補
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch10.carb-loading.i06
    q: 適用運動
    a:
    - 長跑、公路自行車、越野滑雪等 >2h 的有氧耐力項目
    - 間歇性高強度運動效果有限
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch10.carb-loading.i07
    q: 副作用
    a:
    - 暫時性體重增加（肝醣存水 3–4 倍）
    - 腸脹氣（避免豆類/菊糖 oligosaccharides）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
  - id: ch10.carb-loading.i08
    q: 考試重點
    a:
    - 有效超補最低劑量 = 8 g/kg BW
    - 女性失敗主因 = 總碳水攝取不足而非性別差異
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - energy-supply
    related: []
    locator: ''
- id: during-event
  title: 賽中營養 During-Event Nutrition
  desc: ''
  tag: During-Event
  items:
  - id: ch10.during-event.i01
    q: 水分補充原則
    a:
    - 預防體重流失超過 2% BW
    - 個別化補水計畫（賽前後體重差）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.during-event.i02
    q: 運動飲料成分
    a:
    - Na 20–30 mEq/L（460–690 mg）
    - K 2–5 mEq/L（78–195 mg）
    - 碳水濃度 5–10%（理想 6–8%）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.during-event.i03
    q: 兒童補水
    a:
    - 40 kg 兒童：148 ml / 每 20 分鐘
    - 60 kg 青少年：256 ml / 每 20 分鐘（即使不渴）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.during-event.i04
    q: 有氧耐力碳水攝取
    a:
    - 28–144 g/h
    - 多種碳水組合（葡萄糖＋果糖＋麥芽糊精）可提高氧化速率至 >1 g/min
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.during-event.i05
    q: 多種碳水優勢
    a:
    - 不同腸道轉運蛋白 → 轉運飽和後可繼續吸收
    - 葡萄糖＋果糖比單獨葡萄糖改善計時賽表現
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.during-event.i06
    q: 間歇性高強度運動
    a:
    - 碳水電解質飲料改善技術表現（網球揮拍精準度、足球運球）
    - 在肝醣耗竭狀態效果更顯著
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.during-event.i07
    q: 力量/爆發力運動
    a:
    - 阻力訓練需消耗大量肌肉肝醣
    - 賽前與賽中補充碳水可維持肝醣、減少肌肉分解
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.during-event.i08
    q: 口腔漱口效應
    a:
    - 碳水漱口（不吞嚥）可透過中樞神經系統改善約 1 小時運動表現 2–3%
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
- id: eating-disorders
  title: 飲食失調 Eating Disorders
  desc: ''
  tag: Eating Disorders
  items:
  - id: ch10.eating-disorders.i01
    q: 厭食症 Anorexia Nervosa
    a:
    - 體像扭曲＋強烈恐懼增重 → 極度限制熱量
    - 平均發病 19 歲
    - 女性終身盛行率 0.9%
    - 所有精神疾患中死亡率最高
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
  - id: ch10.eating-disorders.i02
    q: 厭食症症狀
    a:
    - 骨質疏鬆、掉髮、皮膚乾燥黃化、lanugo（胎毛）、貧血、低血壓、心臟損傷、腦部損傷、多器官衰竭
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
  - id: ch10.eating-disorders.i03
    q: 暴食症 Bulimia Nervosa
    a:
    - 反覆暴食後清除（催吐/瀉藥/過度運動）
    - ≥1 次/週 × 3 個月
    - 體重通常正常
    - 發病平均 20 歲
    - 盛行率 0.6%
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
  - id: ch10.eating-disorders.i04
    q: 暴食症症狀
    a:
    - 慢性喉嚨發炎、頸部腺體腫大、牙釉質受損（胃酸）、電解質失衡（低鈉/鉀/鈣 → 心臟病發）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
  - id: ch10.eating-disorders.i05
    q: 暴食症 BED
    a:
    - 反覆無控制暴食，無清除行為
    - ≥1 次/週 × 3 週
    - 女性 3.5%、男性 2.0%
    - 常見過重或肥胖
    - 發病平均 25 歲
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
  - id: ch10.eating-disorders.i06
    q: 高風險運動類型
    a:
    - 量級運動（摔角）→ 節食
    - 強調瘦度（越野跑）
    - 審美性運動（體操、花式溜冰）→ 飲食失調比例更高
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
  - id: ch10.eating-disorders.i07
    q: SC 的職責
    a:
    - 辨識症狀 → 轉介合格醫療/心理/營養師團隊
    - SC 不負責診斷或治療
    - 建立轉介網絡是倫理義務
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
  - id: ch10.eating-disorders.i08
    q: ARFID / Pica / 反芻
    a:
    - ARFID：因感官/後果恐懼迴避食物
    - Pica：吞食非食物（泥土/頭髮）≥1 月
    - 反芻：反覆咀嚼反芻食物
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - psychology
    related: []
    locator: ''
- id: obesity-assessment
  title: 過重與肥胖評估 Overweight & Obesity Assessment
  desc: ''
  tag: Obesity
  items:
  - id: ch10.obesity-assessment.i01
    q: BMI 分類
    a:
    - 過重：25–29.9 kg/m²
    - 肥胖 I：30–34.9
    - 肥胖 II：35–39.9
    - 極端肥胖 III：≥40
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
  - id: ch10.obesity-assessment.i02
    q: BMI 公式
    a:
    - kg/m²
    - 或 [lb/in²] × 703
    - ⚠️ 運動員肌肉多→高估體脂
    - 老年人→低估體脂
    - 只作篩選工具，非診斷工具
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
  - id: ch10.obesity-assessment.i03
    q: 腰圍疾病風險
    a:
    - 男性 >102 cm（40 in）→ 相對風險增加
    - 女性 >88 cm（35 in）→ 相對風險增加
    - 即使 BMI 正常，腰圍超標仍代表風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
  - id: ch10.obesity-assessment.i04
    q: 肥胖相關疾病
    a:
    - 高血壓、高血脂、冠心病、第二型糖尿病、睡眠呼吸中止症、骨關節炎、多種癌症（子宮內膜、乳癌、前列腺、大腸）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
  - id: ch10.obesity-assessment.i05
    q: 熱量消耗三大組成
    a:
    - BMR/RMR（65–70%）：最大
    - 體力活動（20–30%）：最可變
    - 食物產熱效應（10–15%）：最小
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
  - id: ch10.obesity-assessment.i06
    q: Cunningham 方程式
    a:
    - RMR = 500 + 22 × LBM(kg)
    - 比 Harris-Benedict 更適用於運動員（納入瘦體重）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
  - id: ch10.obesity-assessment.i07
    q: 兒童 BMI
    a:
    - 同計算式，但需按年齡性別百分位解讀：<5th = 過輕，5–85th = 健康，85–95th = 過重，≥95th = 肥胖
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
  - id: ch10.obesity-assessment.i08
    q: 肥胖治療
    a:
    - 飲食療法＋運動＋行為治療＋藥物＋手術（多合一）
    - 初始目標：6 個月內減少 10% 初始體重
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - measurement
    related: []
    locator: ''
- id: post-competition
  title: 賽後營養 Post-Competition Nutrition
  desc: ''
  tag: Postcompetition
  items:
  - id: ch10.post-competition.i01
    q: 肝醣再合成 Phase 1
    a:
    - 運動後 30–60 分鐘
    - 胰島素非依賴性
    - 速率最快 → 1.0–1.85 g/kg BW/h 碳水，每 15–60 分鐘一次，持續 5 小時
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.post-competition.i02
    q: 肝醣再合成 Phase 2
    a:
    - 數小時後
    - 胰島素依賴性
    - 速率較慢 → 若恢復時間 >24h，可在整日分次補充碳水即可
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.post-competition.i03
    q: 碳水攝取時機
    a:
    - <24h 需再次比賽/訓練 → 立即補充
    - '>24h 可等待約 2h 後才進食，24h 內補足即可'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.post-competition.i04
    q: 賽後蛋白質
    a:
    - 有氧耐力：至少 10 g / 運動後 3h 內
    - 阻力訓練：年輕人 20–25 g（含 EAA 8.5–10 g）
    - 老年人 ≥40 g
    - 含亮氨酸 2–3 g 或 0.05 g/kg BW
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.post-competition.i05
    q: 力量/爆發力運動後碳水
    a:
    - 運動後立即 1.5 g/kg BW＋1 小時後再補一次 → 可使肝醣恢復至賽前 91%（6h 內）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.post-competition.i06
    q: 蛋白質的碳水節省效果
    a:
    - 碳水攝取 <1.2 g/kg BW/h 時，加入蛋白質可提高肝醣合成速率（補救作用）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.post-competition.i07
    q: 每餐蛋白質分配
    a:
    - 成人每餐至少 20–30 g 高亮氨酸蛋白質
    - 每 3–4 小時進食一次（阻力訓練後肌肉對氨基酸敏感性持續 24–48h）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.post-competition.i08
    q: 同期訓練 (Concurrent)
    a:
    - 有氧後＋重訓前：補充碳水壓制分解
    - 有氧後即補充蛋白質
    - 或在重訓中補充蛋白質
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
- id: pre-competition
  title: 賽前營養 Pre-Competition Nutrition
  desc: ''
  tag: Precompetition
  items:
  - id: ch10.pre-competition.i01
    q: 主要目的
    a:
    - 補充水分維持水合狀態
    - 最大化血糖與肝醣儲存
    - 避免飢餓感
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.pre-competition.i02
    q: 4 小時前 ≥4h
    a:
    - 碳水 1–4 g/kg BW
    - 蛋白質 0.15–0.25 g/kg BW
    - 水分 5–7 ml/kg BW
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.pre-competition.i03
    q: 2 小時前
    a:
    - 碳水 ≈1 g/kg BW
    - 若未達水合：3–5 ml/kg BW
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.pre-competition.i04
    q: 1 小時前 / <1h
    a:
    - 碳水 0.5 g/kg BW
    - 液態碳水 / 果凍 / gel 較佳（排空快）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.pre-competition.i05
    q: GI 高低選擇
    a:
    - 高 GI 或低 GI 皆可
    - 血糖初期下降於運動開始 20 分鐘後通常恢復，不影響表現
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.pre-competition.i06
    q: 食物原則
    a:
    - 低脂低纖（排空快）
    - 中等蛋白質（增加飽足感）
    - 熟悉食物（練習時先試）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.pre-competition.i07
    q: 腸胃不適預防
    a:
    - 避免高脂高纖
    - 避免山梨醇/甘露醇（sugar alcohols）
    - 液態碳水在 1h 前更好
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
  - id: ch10.pre-competition.i08
    q: 水合指標
    a:
    - 賽前尿液比重 USG <1.020 = 適當水合
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    related: []
    locator: ''
- id: weight-gain
  title: 體重增加策略 Weight Gain Strategies
  desc: ''
  tag: Weight Gain
  items:
  - id: ch10.weight-gain.i01
    q: 熱量盈餘原則
    a:
    - 每天額外攝取約 +500 kcal
    - 避免短時間大量增加（易增脂肪）
    - 在休賽季執行
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - ergogenic
    related: []
    locator: ''
  - id: ch10.weight-gain.i02
    q: 蛋白質目標
    a:
    - 1.5–2.0 g/kg BW/day 以最大化瘦體重增加
    - 高蛋白飲食增加飽足感與產熱效應→執行較困難
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - ergogenic
    related: []
    locator: ''
  - id: ch10.weight-gain.i03
    q: 高蛋白過食研究
    a:
    - 正常蛋白（15%）& 高蛋白（25%）→ 約 45% 多餘熱量存為瘦體重
    - 低蛋白（5%）→ 95% 存為脂肪
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - ergogenic
    related: []
    locator: ''
  - id: ch10.weight-gain.i04
    q: 策略：增加食物密度
    a:
    - 增加份量大小
    - 提高進食頻率
    - 選擇高熱量食物（堅果、乾果、全脂乳品）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - nutrition
    - ergogenic
    related: []
    locator: ''
  - id: ch10.weight-gain.i05
    q: 肌酸補充
    a:
