    locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition > Aerobic Endurance Events
  - id: ch10.post-competition.i07
    q: 成人每餐蛋白質分配
    a:
    - 成人每餐建議至少攝取 20–30 g 蛋白質，且主餐約每 3–4 小時一次
    - 阻力訓練後，肌肉對胺基酸的敏感性可增加 24–48 小時；但一餐的合成效應約只持續 3–5 小時
    detail: 這是除了運動後立即補充之外的全天蛋白質安排；兒童不需遵循成人的每餐蛋白質指引，因其蛋白質合成的調控不同。
    terms:
    - protein
    - muscle-protein-synthesis
    numbers:
