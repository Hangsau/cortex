    locator: Feeding and Eating Disorders > Anorexia Nervosa
  - id: ch10.eating-disorders.i02
    q: 神經性厭食症的身體症狀
    a:
    - 骨質變薄（骨質減少症或骨質疏鬆症）、頭髮與指甲脆弱、皮膚乾燥偏黃、全身長出細毛（胎毛）
    - 輕度貧血、肌肉消耗與無力、嚴重便祕、低血壓、呼吸與脈搏變慢
    - 心臟結構與功能受損、腦部損傷、多器官衰竭、體內溫度下降而長期怕冷、倦怠與不孕
    detail: 本清單是書中轉載的 National Institute of Mental Health 症狀清單，屬於識別警訊，不可由肌力與體能專業人員據此自行診斷。
    terms:
    - anorexia-nervosa
    numbers: []
    concepts:
    - nutrition
    - psychology
    related:
    - ch10.eating-disorders.i07
    locator: Feeding and Eating Disorders > Anorexia Nervosa > Symptoms of Anorexia Nervosa
  - id: ch10.eating-disorders.i03
    q: 神經性貪食症（bulimia nervosa）的特徵與流行病學
    a:
    - 在一段明確時間內反覆吃下遠多於一般人會吃的量，之後以自我催吐、劇烈運動、瀉藥或利尿劑等方式清除
    - 暴食與清除至少每週 1 次、持續 3 個月；患者暴食時感到失去控制，較常為正常體重而非過輕
    - 平均發病年齡為 20 歲，終生盛行率為 0.6%
    detail: 書中同樣註明此盛行率基於較舊診斷標準，修訂後的盛行率可能上升；不要把「較常正常體重」誤寫成診斷條件。
    terms:
