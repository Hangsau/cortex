  - id: ch10.weight-gain.i08
    q: 以飲食紀錄估計每日能量需求的方法
    a:
    - 在體重穩定期間，至少連續記錄 3 天具代表性的飲食攝取；平均每日攝取熱量可假設為每日能量需求
    detail: 這種方法較費工，且記錄食物本身可能改變平常飲食習慣，人們也未必能精準記錄，因此只是高度投入運動員可採的估計方式。
    terms: []
