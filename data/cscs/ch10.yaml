      of: 此營養諮詢與自由進食比較研究的菁英運動員人數
    - v: 8–12
      unit: 週
      of: 該研究的增重介入期間
    - v: 12
      unit: 個月
      of: 該研究追蹤營養諮詢效益的時間點
