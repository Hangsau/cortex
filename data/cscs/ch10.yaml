      unit: g/kg 體重
      of: 研究中阻力訓練後立即及一小時後各次攝取的碳水化合物量
    - v: 1
      unit: 小時
      of: 研究中第二次碳水化合物攝取相對於阻力訓練結束的時間
    - v: 6
