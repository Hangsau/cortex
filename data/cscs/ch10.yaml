  - id: ch10.post-competition.i05
    q: 力量與爆發力運動後的糖原回補案例
    a:
    - 一項阻力訓練研究中，受試者運動後立即及 1 小時後各攝取 1.5 g/kg 體重碳水化合物，6 小時時肌肉糖原由耗竭後的 71% 回到運動前的 91%
    detail: 這是隔夜禁食後、單腿膝伸展運動的研究結果，並非保證所有力量運動員都會在相同時間恢復到相同比例；所需量取決於強度、時間、體重與肌肉量等因素。
    terms:
    - carbohydrate
    - glycogen
    numbers:
