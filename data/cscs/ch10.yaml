  - id: ch10.pre-competition.i03
    q: 賽前 2 小時的碳水化合物與水分
    a:
    - 餐食約含每公斤體重 1 g 碳水化合物
    - 若水合不足，應每公斤體重小口攝取 3–5 ml 液體，並依個人水合計畫調整
    detail: 源書將此量放在「賽前餐於運動前兩小時」的情境；熱天長時間活動時，另需考量運動飲料的鈉、鉀與碳水化合物濃度。
    terms:
    - carbohydrate
    - hydration
    numbers:
    - v: 2
      unit: 小時
      of: 本賽前餐與水分建議相對於運動開始的時間
    - v: 1
      unit: g/kg 體重
      of: 賽前兩小時餐食建議的碳水化合物量
    - v: 3–5
      unit: ml/kg 體重
