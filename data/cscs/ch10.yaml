    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Aerobic Endurance Sports
  - id: ch10.pre-competition.i04
    q: 接近比賽開始時的賽前餐形式
    a:
    - 越接近比賽開始，應吃較少的食物與液體
    - 賽前餐在運動前 1 小時時，液態碳水化合物可能比固體食物好，因為從胃排空較快；凝膠、軟糖等碳水來源也消化很快
    detail: 書中將減量原則與胃不適風險連結，而不是說液態碳水化合物在所有情況都優於固體食物。
    terms:
    - carbohydrate
    numbers:
    - v: 1
      unit: 小時
      of: 書中指出液態碳水化合物可能較適合的賽前餐時間
    concepts:
    - nutrition
    related:
    - ch10.pre-competition.i07
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Aerobic Endurance Sports
  - id: ch10.pre-competition.i05
    q: 賽前高低升糖指數（glycemic index, GI）碳水化合物的選擇
    a:
    - 高或低 GI 的碳水化合物都可選用；研究沒有顯示其中一種更有利
    - 迅速升高胰島素的碳水化合物（如葡萄糖）會使運動開始時血糖先下降，但通常約 20 分鐘後回到正常，且不影響表現
    detail: 這項結論指的是研究未顯示血糖初降造成表現負面影響，不代表所有運動員的個人胃腸感受或食物選擇完全相同。
    terms:
    - glycemic-index
    - carbohydrate
    numbers:
    - v: 20
      unit: 分鐘
      of: 運動開始後血糖通常回到正常的約略時間
    concepts:
    - nutrition
    related:
    - ch10.pre-competition.i06
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition
  - id: ch10.pre-competition.i06
    q: 賽前食物與飲料的選擇原則
    a:
    - 選擇練習中已嘗試過的熟悉食物與飲料
    - 低脂、低膳食纖維，以利快速胃排空並減少可能的腸胃不適
    - 蛋白質適量，因蛋白質可帶來較持久的飽足感
    detail: 食物選擇需要與進食時間一起考量；越接近比賽，書中建議食物與液體量越少。
    terms:
    - fiber
    - protein
    numbers: []
    concepts:
    - nutrition
    related:
    - ch10.pre-competition.i01
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition
  - id: ch10.pre-competition.i07
    q: 賽前減少腸胃不適的方法
    a:
    - 新食物要先在數次練習中測試；越接近比賽，減少食物與液體量
    - 避免高脂、高纖食物，因脂肪與纖維會減慢消化，運動時仍在消化的食物可能造成胃痙攣
    - 避免糖醇（sugar alcohol），特別是山梨醇與甘露醇；它們在腸道未完全吸收，可能造成腸氣、腹脹、痙攣與瀉下效果
    detail: 對糖醇的反應具有個別差異；書中不是指所有碳水化合物都會造成腸胃問題，而是提醒特定未完全吸收的糖醇來源。
    terms:
    - fiber
    - sugar-alcohol
    numbers: []
    concepts:
    - nutrition
    related:
    - ch10.pre-competition.i04
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Minimizing Gastrointestinal Issues
  - id: ch10.pre-competition.i08
    q: 賽前尿液比重的水合指標
    a:
    - 若需要賽前預先補水，應在運動前數小時進行，以利液體吸收與排尿
    - 尿液比重（urine specific gravity, USG）讀值應低於 1.020
    detail: USG 是書中列出的賽前水合讀值；它與賽中的個別化飲水策略配合，而不是取代賽中對體重變化的監測。
    terms:
    - urine-specific-gravity
    - hydration
    numbers:
    - v: <1.020
      unit: USG
      of: 賽前適當水合的尿液比重讀值
    concepts:
    - nutrition
    related:
    - ch10.during-event.i01
    locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Aerobic Endurance Sports
- id: weight-gain
  title: 體重增加策略 Weight Gain Strategies
  desc: ''
  tag: Weight Gain
  items:
  - id: ch10.weight-gain.i01
    q: 增重的能量攝取原則
    a:
    - 在休賽季調整飲食以增加體重
    - 以每天多攝取約 500 kcal 作為可依個人調整的一般指引；若持續大幅增加熱量，可能增加超出預期的脂肪
    detail: 書中把增重能力歸於許多因素，但可控制的主要是飲食與訓練；500 kcal 是一般起點，不是保證的體重增加速率。
    terms: []
    numbers:
    - v: 500
      unit: kcal/日
      of: 書中作為個別化增重起點的一般額外能量攝取建議
    concepts:
    - nutrition
    related: []
    locator: Nutrition Strategies for Altering Body Composition > Weight Gain
  - id: ch10.weight-gain.i02
    q: 增重時最大化瘦體重增加的蛋白質目標
    a:
    - 每天攝取每公斤體重 1.5–2.0 g 蛋白質，以最大化瘦體重增加
    - 蛋白質的飽足效果強，且高蛋白飲食的飲食誘發性產熱較高，可能讓增重飲食更難持續
    detail: 書中並未說「蛋白質越多越好」；重點是同時有足夠的總能量與可持續的飲食，而蛋白質增加飽足感正是執行上的限制。
    terms:
    - protein
    - diet-induced-thermogenesis
    numbers:
    - v: 1.5–2.0
      unit: g/kg 體重/日
      of: 增重時最大化瘦體重增加的每日蛋白質攝取範圍
    concepts:
