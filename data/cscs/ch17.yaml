    - ch05.overtraining.i07
    - ch20.program-design.i06
    locator: 'Step 3: Training Frequency > Training Status'
  - id: ch17.training-frequency.i05
    q: 負荷與動作類型如何影響可安排的頻率？
    a:
    - 最大或近最大負荷後需要較多恢復；交替輕、重訓練日有助於提高可訓練頻率。
    - 有證據顯示上肢比下肢更快從重負荷恢復，單關節動作也比多關節動作更快恢復。
    detail: 這些發現可說明為何健力運動員每週可能只排一次非常重的硬舉或深蹲，但並不構成所有人的固定頻率處方。
    terms:
    - training-frequency
    - single-joint-exercise
    - multijoint-exercise
    numbers: []
