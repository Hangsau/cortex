  - id: ch17.rest-periods.i06
    q: 重負荷深蹲的休息期研究結果為何？
    a:
    - 在背蹲舉研究中，組間休息 3 分鐘比 30 秒帶來更大的肌力增進。
    - 較重負荷會使運動員需要較長休息，才能安全且成功完成後續指定組。
    detail: 這是背蹲舉研究結果，不可擴大成所有動作都必須休息三分鐘；書中以整體指引的 2–5 分鐘範圍處理肌力與爆發力課表。
    terms:
    - rest-period
    numbers:
    - v: '3'
      unit: 分鐘
      of: 背蹲舉研究中帶來較大肌力增進的組間休息期
    - v: '30'
      unit: 秒
      of: 同一背蹲舉研究中用以比較的短組間休息期
    - v: '2–5'
      unit: 分鐘
      of: 教材對肌力與爆發力訓練的整體組間休息指引
    concepts:
    - program-design
    - energy-supply
    related:
    - ch13.max-strength.i04
    - ch03.substrate.i02
    - ch15.lower-body.i01
    locator: 'Step 7: Rest Periods > Strength and Power'
  - id: ch17.rest-periods.i07
    q: 為何負荷越重通常需要越長休息？
    a:
    - 休息量與負荷密切相關；後續組要安全且成功完成，重負荷比輕負荷需要更長的組間恢復。
    - 例如使用 4RM 的肌力訓練，比使用較輕 15RM 的肌耐力訓練需要顯著較長休息。
    detail: 訓練可提高運動員以較少休息運動的能力，但這不會取消重負荷、下肢或全身結構性動作通常需要長休息的處方考量。
    terms:
    - rest-period
    - repetition-maximum
    - structural-exercise
    numbers:
    - v: '4'
      unit: RM
      of: 教材用以說明肌力訓練需要較長休息的重負荷範例
    - v: '15'
      unit: RM
      of: 教材用以對照較短休息肌耐力訓練的輕負荷範例
