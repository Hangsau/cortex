  - id: ch17.exercise-order.i07
    q: 為何需把使下背肌向心收縮的動作排在後面？
    a:
    - 先完成需要直立軀幹或中立脊椎的動作，再安排使下背肌向心收縮的動作。
    - 下背肌疲勞會使結構性或站姿動作的技術不正確，且可能造成傷害。
    detail: 此規則是書中情境 C 的排序註解，適用例子包含弓箭步與側平舉先於機械式背伸；它不是所有下背訓練動作的一般禁令。
    terms:
    - structural-exercise
    - exercise-order
    numbers: []
    concepts:
    - program-design
    related:
    - ch15.body-positioning.i08
    - ch15.lower-body.i03
    - ch02.joint-biomechanics.i02
    locator: 'Step 4: Exercise Order'
  - id: ch17.exercise-order.i08
    q: 安排一堂課動作順序時，應以何種準則判斷？
    a:
    - 以某動作會如何影響另一動作的出力品質或技術作為判斷準則。
    - 通常要安排到運動員能在充分休息或恢復後，以正確技術完成一組並發揮最大力量能力。
    detail: 本章列出「爆發、其他核心、輔助」、「上下肢交替」、「推拉交替」及「超級組／複合組」四種常見方法；各方法是安排選項，不是同一堂課必須全部採用的固定序列。
    terms:
