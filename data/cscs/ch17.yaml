    - ch03.phosphagen.i04
    - ch13.max-strength.i05
    locator: 'Step 7: Rest Periods'
  - id: ch17.rest-periods.i08
    q: 休息期處方還要考慮哪兩項條件？
    a:
    - 除了訓練目標，也要考慮實際相對負荷與該動作涉及的肌肉量。
    - 若運動員身體狀況未達良好，開始時可能需要比典型指派更長的休息期。
    detail: 這些條件說明休息期要按動作與運動員個別化，而不是把同一組數字平均分配到全課表。
