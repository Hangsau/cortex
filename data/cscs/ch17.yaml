    locator: 'Principles of Anaerobic Exercise Prescription > Resistance Training Program Design Variables'
  - id: ch17.principles-exam-tips.i05
    q: 特異性是否要求訓練完全複製運動技能？
    a:
    - 不要求；例如深蹲與垂直跳都包含相同動作與肌肉，但兩者的動作速度與施力並不相同。
    - 針對高速爆發動作的運動員，應盡量以最高可能速度活化或徵召其運動所需的相同運動單位。
    detail: 特異性的判斷需保留動作、肌肉與需求之間實際重疊的範圍，不能把「越像越好」誤讀為所有訓練細節都要相同。
    terms:
    - specificity
    numbers: []
    concepts:
    - program-design
    related:
    - ch02.planes.i06
    - ch19.neuromuscular-basis.i01
    - ch18.mechanical-models.i07
    locator: Principles of Anaerobic Exercise Prescription
  - id: ch17.principles-exam-tips.i06
    q: 除了增加重量，還能如何造成超負荷？
    a:
    - 可增加每週（有時每日）訓練次數、加入動作或組數、強調複雜而非簡單動作，或縮短組間與動作間休息。
    - 也可組合上述或其他改變，以提高身體承受的訓練壓力。
    detail: 超負荷的核心是壓力高於運動員的既有適應，不是把任何一個變項無限制拉高。
    terms:
    - overload
    - training-frequency
    - rest-period
    numbers: []
