  - id: ch17.training-volume.i05
    q: 肌肥大訓練的訓練量指引為何？
    a:
    - 肌肥大訓練採每組 6–12 次、每動作 3–6 組。
    - 一般認為較高訓練量與肌肉尺寸增加相關。
    - 對每個肌群做 3 個或更多動作，是來自精英健美選手觀察、訪談及處方指引所建議的最有效策略。
    detail: 教材明確區分：前兩項有一般研究支持，而每肌群三個以上動作的說法也來自實務觀察與訪談；不應把後者表述成同等強度的直接實驗結論。
