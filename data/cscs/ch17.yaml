  - id: ch17.training-volume.i04
    q: 單次與多次出力爆發力訓練的組數與次數指引為何？
    a:
    - 單次出力項目：1–2 次、3–5 組；多次出力項目：3–5 次、3–5 組。
    - 受訓練運動員的爆發性動作通常採熱身後 3–5 組。
    detail: 爆發力的訓練量通常低於肌力訓練，以最大化動作品質；降低主要來自較少的目標次數與較輕負荷，而不是建議組數較少。
