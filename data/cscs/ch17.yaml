- id: exercise-selection
  title: 步驟二：動作選擇 Exercise Selection
  desc: ''
  tag: Exercise Selection
  items:
  - id: ch17.exercise-selection.i01
    q: 核心動作（core exercise）如何界定？
    a:
    - 核心動作徵召一個或多個大肌群區域，例如胸、肩、背、髖或大腿。
    - 它涉及兩個或以上主要關節，屬多關節動作（multijoint exercise），並因直接應用於運動而優先選用。
    detail: 分類時整個肩關節（盂肱與肩帶關節）算一個主要關節；脊椎也同樣算一個主要關節。
    terms:
    - core-exercise
    - multijoint-exercise
    numbers: []
    concepts:
    - program-design
    related:
    - ch16.machine-vs-freeweight.i03
    - ch02.planes.i06
    - ch15.exercise-technique-fundamentals.i02
    locator: 'Step 2: Exercise Selection > Exercise Type > Core and Assistance Exercises'
  - id: ch17.exercise-selection.i02
    q: 輔助動作（assistance exercise）如何界定及使用？
    a:
    - 輔助動作通常徵召較小肌群區域，只涉及一個主要關節，屬單關節動作（single-joint exercise）。
    - 可藉由孤立特定肌肉或肌群，處理運動技能容易受傷的肌肉，或協助傷後重新訓練。
    detail: 輔助動作在提升運動表現時通常比核心動作重要性低；但在傷害預防與復健的目的下，孤立訓練正是其價值所在。
    terms:
    - assistance-exercise
    - single-joint-exercise
    numbers: []
    concepts:
    - program-design
    related:
    - ch16.core-training.i02
    - ch22.maturation-phase.i06
    - ch15.exercise-technique-fundamentals.i07
    locator: 'Step 2: Exercise Selection > Exercise Type > Core and Assistance Exercises'
  - id: ch17.exercise-selection.i03
    q: 結構性動作（structural exercise）如何界定？
    a:
    - 結構性動作是直接負荷脊椎（如背蹲舉）或間接負荷脊椎（如高翻）的核心動作。
    - 執行時必須以肌肉穩定姿勢，例如背蹲舉時維持軀幹僵直與脊椎中立。
    detail: 「結構性」不只描述槓鈴放在哪裡；教材定義還包含在舉重動作中以肌肉維持姿勢穩定。
    terms:
    - structural-exercise
    - core-exercise
    numbers: []
    concepts:
    - program-design
    related:
    - ch15.weight-belt.i07
    - ch15.body-positioning.i08
    - ch02.joint-biomechanics.i02
    locator: 'Step 2: Exercise Selection > Exercise Type > Structural and Power Exercises'
  - id: ch17.exercise-selection.i04
    q: 爆發性動作（power exercise）如何界定？
    a:
    - 以非常快速或爆發方式完成的結構性動作，稱為爆發性動作。
    - 當這類動作符合運動專項訓練的優先需求時，通常會編入課表。
    detail: 高翻與抓舉是本章列舉的動作，但「爆發性」的定義是結構性動作的執行方式，並非所有核心動作都屬爆發性動作。
    terms:
    - power-exercise
    - structural-exercise
    numbers: []
    concepts:
    - program-design
    related:
    - ch15.power-exercises-technique.i01
    - ch18.mechanical-models.i01
    - ch19.rfd-impulse.i01
    locator: 'Step 2: Exercise Selection > Exercise Type > Structural and Power Exercises'
  - id: ch17.exercise-selection.i05
    q: 運動專項動作如何依特異性選擇？
    a:
    - 選擇與該運動的身體與肢段動作模式、關節活動範圍及肌肉參與相關的動作；訓練活動越接近實際運動動作，正向遷移的可能性越大。
    - 以籃球跳躍為例，背蹲舉與腿推皆可訓練髖、膝伸肌，但背蹲舉因站立姿勢、平衡及承重特徵而較相關。
    detail: 特異性（specificity）不等於必須複製所有運動技能細節；本章以深蹲對垂直跳為例，兩者的速度與施力並不相同，仍可因共同動作與肌群而相關。
    terms:
    - specificity
    - movement-analysis
    numbers: []
    concepts:
    - program-design
    related:
    - ch02.planes.i06
    - ch19.program-design-monitoring.i07
    - ch20.aerobic-performance-factors.i08
    locator: 'Step 2: Exercise Selection > Movement Analysis of the Sport > Sport-Specific Exercises'
  - id: ch17.exercise-selection.i06
    q: 肌肉平衡（muscle balance）在選動作時代表什麼？
    a:
    - 應維持各關節以及相對肌群之間的肌力平衡，避免不成比例訓練增加傷害風險。
    - 若發現不平衡，選擇可恢復適當肌力平衡的動作；例如腿後肌相對股四頭肌極弱時，可增加腿後肌動作。
    detail: 肌肉平衡不表示相等肌力，而是某肌肉或肌群相對另一者應有適當的肌力、爆發力或肌耐力比率。
    terms:
    - muscle-balance
    - agonist
    - antagonist
    numbers: []
    concepts:
    - program-design
    related:
    - ch22.injury-prevention.i03
    - ch07.female-acl.i06
    - ch16.kettlebell-unilateral.i05
    locator: 'Step 2: Exercise Selection > Movement Analysis of the Sport > Muscle Balance'
  - id: ch17.exercise-selection.i07
    q: 恢復性動作（recovery exercise）的目的與安排為何？
    a:
    - 恢復性動作不造成高肌肉壓力或高神經系統壓力，而是促進動作與恢復。
    - 可在主要阻力訓練結束時或微週期內另排一節，以輕負荷阻力動作或低強度有氧進行。
    detail: 教材把其作用說成協助清除代謝廢物與副產物，並維持已訓練肌肉的部分血流，讓修復過程最佳化。
    terms:
    - recovery-exercise
    numbers: []
    concepts:
    - program-design
    related:
    - ch21.active-rest.i03
    - ch20.program-design.i06
    - ch05.overtraining.i02
    locator: 'Step 2: Exercise Selection > Movement Analysis of the Sport > Exercises to Promote Recovery'
  - id: ch17.exercise-selection.i08
    q: 技術、器材與時間如何影響動作選擇？
    a:
    - 若技術正確性有疑問，應先要求運動員示範並提供完整指導；技術未熟者常先使用機器與自由重量輔助動作。
    - 缺乏特定器材可能迫使選擇較不具運動專項性的替代動作。
    - 時間有限時，應權衡動作價值與完成所需時間，優先較有效率的動作。
    detail: 機器腿推可比自由重量弓箭步節省時間，但教材沒有把它訂成一律較佳的選擇；是否值得多花時間做較專項的弓箭步，取決於賽季目標與可用時間。
    terms:
    - exercise-technique-experience
    - assistance-exercise
    numbers: []
    concepts:
    - program-design
    related:
    - ch15.exercise-technique-fundamentals.i07
    - ch16.machine-vs-freeweight.i02
    - ch23.needs-analysis.i08
    locator: 'Step 2: Exercise Selection > Available Training Time per Session'
- id: load-repetitions
  title: 步驟五：負荷與次數 Load & Repetitions
  desc: ''
  tag: Load
  items:
  - id: ch17.load-repetitions.i01
    q: 何時適合直接測試單次反覆最大重量（1-repetition maximum, 1RM）？
    a:
    - 1RM 是以正確技術只能舉起一次的最大重量；直接測試通常保留給具動作技術經驗的中階或進階阻力訓練者。
    - 未受訓、經驗不足、受傷或受醫療監督者，可能不適合做 1RM 測試。
    - 優先選核心動作，但若無法提供有效且可靠的最大肌力資料，仍不應選作測試。
    detail: 最大肌力測試對肌肉、結締組織與關節壓力顯著；忽略訓練狀態與技術經驗會同時降低安全性與結果準確度。教材提出 3RM 可作為 1RM 的替代選項。
    terms:
    - one-repetition-maximum
    - training-status
    - exercise-technique-experience
    - core-exercise
    - repetition-maximum
    numbers:
    - v: '1'
      unit: RM
      of: 以正確技術只能完成一次的最大重量
    - v: '3'
      unit: RM
      of: 教材建議可替代最大 1RM 測試的較低最大反覆測試
    concepts:
    - program-design
    related:
    - ch17.load-repetitions.i09
    - ch13.max-strength.i01
    - ch12.safety.i02
    - ch13.max-strength.i07
    locator: 'Step 5: Training Load and Repetitions > 1RM and Multiple-RM Testing Options > Testing the 1RM'
  - id: ch17.load-repetitions.i09
    q: 教材的 1RM 測試流程怎麼走？
    a:
    - 以能輕鬆完成 5–10 次的輕負荷熱身，休息 1 分鐘。
    - 加重估出能完成 3–5 次的熱身負荷：上肢加 10–20 lb（4–9 kg）或 5–10%，下肢加 30–40 lb（14–18 kg）或 10–20%；休息 2 分鐘。
    - 再以同樣增幅加到能完成 2–3 次的保守近最大負荷，休息 2–4 分鐘。
    - 再以同樣增幅加重後嘗試 1RM；成功則休息 2–4 分鐘再加一次，失敗則休息 2–4 分鐘後減重（上肢 5–10 lb／2–4 kg 或 2.5–5%，下肢 15–20 lb／7–9 kg 或 5–10%）再試。
    - 反覆增減至能以正確技術完成一次為止；理想上應在 3–5 個測試組內測得。
    detail: 增幅之所以分上下肢，是因為下肢動作的絕對負荷基數大得多，同樣的百分比換算成重量差距懸殊。組數上限 3–5 組是準確度與疲勞的取捨——測試組太多，後段測到的是耐疲勞能力而非最大肌力。本流程出自教材圖 17.1（Reprinted from Earle 2006），在電子版中是完整文字條列而非圖片。
    terms:
    - one-repetition-maximum
    - repetition-maximum
    - interset-rest
    numbers:
    - v: 5-10
      unit: 次
      of: 1RM 測試第一步熱身負荷應能輕鬆完成的反覆次數
    - v: '1'
      unit: 分鐘
      of: 第一次熱身後的休息時間
    - v: 10-20
      unit: lb
      of: 上肢動作每次加重的絕對增幅（4–9 kg，或 5–10%）
    - v: 30-40
      unit: lb
      of: 下肢動作每次加重的絕對增幅（14–18 kg，或 10–20%）
    - v: 2-4
      unit: 分鐘
      of: 接近最大負荷之間的休息時間
    - v: 3-5
      unit: 組
      of: 理想上測得 1RM 所需的測試組數上限
    concepts:
    - program-design
    related:
    - ch17.load-repetitions.i01
    - ch13.max-strength.i05
    - ch12.administration.i05
    - ch12.test-sequence.i04
    locator: 'Step 5: Training Load and Repetitions > 1RM and Multiple-RM Testing Options > Testing the 1RM > Figure 17.1 1RM Testing Protocol'
  - id: ch17.load-repetitions.i02
    q: 如何由多次反覆測試估算 1RM？
    a:
    - 不適合最大肌力測試時，可測 10RM，再查表或以預測方程式估算 1RM；前提是受測者能正確完成動作。
    - 用於多次反覆測試的負荷越接近實際 1RM，估計越準；以不超過 10RM 的負荷建立方程式時，預測也較準。
    detail: 10RM 是適用於幾乎所有能正確示範動作的運動員之次佳選項；爆發性動作不適合反覆做超過五次的多次反覆測試，因技術會迅速變差。
    terms:
    - one-repetition-maximum
    - repetition-maximum
    - power-exercise
    numbers:
    - v: '10'
      unit: RM
      of: 未宜直接測最大肌力時可用以估算 1RM 的多次反覆測試負荷
    - v: '≤10'
      unit: RM
      of: 用來建立 1RM 預測方程式而預測較準的負荷範圍
    - v: '>5'
      unit: 次
      of: 爆發性動作不宜進行的重複多次反覆測試次數
    concepts:
    - program-design
    related:
    - ch13.max-strength.i05
    - ch13.max-strength.i06
    - ch12.selection-factors.i03
    locator: 'Step 5: Training Load and Repetitions > 1RM and Multiple-RM Testing Options > Estimating a 1RM'
  - id: ch17.load-repetitions.i03
    q: 何謂依目標次數的多次反覆測試？
    a:
    - 先決定課表中該動作每組的目標次數（goal repetitions），再以只能完成該次數的負荷測試。
    - 例如課表的臥推每組目標為 6 次，就測 6RM；可直接用結果指派負荷，免去計算或估算。
    detail: 高反覆測試會造成疲勞並可能損及測試準確度，尤其是多關節、大肌群動作；輔助動作的測試與負荷指派應至少為 8RM，以降低對關節與結締組織的孤立壓力。
    terms:
    - goal-repetitions
    - repetition-maximum
    - core-exercise
    - assistance-exercise
    numbers:
    - v: '6'
      unit: 次
      of: 課表若指定每組六次時應測定的目標次數範例
    - v: '6'
      unit: RM
      of: 對應每組六次目標所做的多次反覆測試
    - v: '≥8'
      unit: RM
      of: 輔助動作多次反覆測試與負荷指派的最低反覆最大重量
