cards:
- q: 阻力訓練課程設計的七大步驟是什麼？
  a: 需求分析→動作選擇→訓練頻率→動作順序→負荷與次數→訓練量→組間休息
  tag: needs-analysis
- q: 需求分析（Needs Analysis）包含哪兩個主要階段？
  a: 運動特性評估（Sport Evaluation）＋運動員個人評估（Athlete Assessment）
  tag: needs-analysis
- q: 需求分析的「運動分析」包含哪三個面向？
  a: 動作模式與肌群參與（Movement Analysis）、生理需求分析（Physiological Analysis）、傷害部位分析（Injury Analysis）
  tag: needs-analysis
- q: 如何分類運動員的訓練等級（Training Status）？
  a: 初學者（<2個月）、中階（2-6個月）、進階（>1年）；影響頻率、組數、技術要求
  tag: needs-analysis
- q: 四個賽季的阻力訓練重心分別為何？
  a: 休賽季：肥大/肌耐力→肌力/爆發；賽前：運動特異性；賽季中：維持；後賽季：非特定
  tag: needs-analysis
- q: SAID 原則的全名與意義？
  a: Specific Adaptation to Imposed Demands；身體適應所受到的特定需求形式，訓練應模擬運動動作
  tag: needs-analysis
- q: Core Exercise（主要動作）的定義？
  a: 招募≥1個大肌群、涉及≥2個主要關節的多關節動作；直接應用於運動表現
  tag: needs-analysis
- q: Assistance Exercise（輔助動作）的定義？
  a: 招募較小肌群、涉及單一關節；用於傷害預防/復健，或強化特定弱點
  tag: needs-analysis
- q: Structural Exercise 和 Power Exercise 的區別？
  a: Structural：需要脊椎穩定/負重（如深蹲、上搏）；Power：在 Structural 基礎上以爆發性速度執行
  tag: exercise-selection
- q: 為何 Back Squat 比 Leg Press 更適合籃球運動員？
  a: 深蹲需要直立姿勢、平衡與負重，更接近跳躍情境；腿部推蹬機缺乏這些特異性
  tag: exercise-selection
- q: 肌肉平衡（Muscle Balance）的意義？
  a: 拮抗肌群力量比例適當（非等量）；不均衡會增加傷害風險，需補充弱側動作
  tag: exercise-selection
- q: 恢復性動作（Recovery Exercise）的定義與時機？
  a: 低神經/肌肉壓力的動作（輕量訓練或低強度有氧），置於主訓練結尾或獨立排入微週期
  tag: exercise-selection
- q: 選擇訓練動作時需考慮哪五個因素？
  a: 運動特異性、技術熟練度、動作肌群、器材可用性、每次訓練可用時間
  tag: exercise-selection
- q: 訓練頻率依訓練等級的建議分別為何？
  a: 初學者：2-3次/週；中階：3-4次/週；進階：4-7次/週
  tag: training-frequency
- q: Split Routine（分割訓練）的適用對象與優點？
  a: 中階/進階；不同日訓練不同肌群，使每部位有充足恢復又增加整體頻率
  tag: training-frequency
- q: 各賽季建議的訓練頻率為何？
  a: 休賽季：4-6次；賽前：3-4次；賽季中：1-3次；後賽季：0-3次
  tag: training-frequency
- q: 同一肌群的訓練間隔建議？
  a: 至少1天、不超過3天休息；避免過度訓練也避免訓練狀態下降
  tag: training-frequency
- q: 為何上肢可訓練頻率高於下肢？
  a: 上肢肌肉比下肢恢復更快；單關節動作比多關節動作恢復更快
  tag: training-frequency
- q: 動作順序的首要原則是什麼？
  a: 爆發力動作→其他主要動作→輔助動作；爆發力最需技術與精神集中，先做才能確保品質
  tag: exercise-order
- q: 什麼是上下肢交替的訓練排序？
  a: 每組交替安排上肢與下肢動作；讓各部位有更多恢復時間，降低整體訓練時間
  tag: exercise-order
- q: 推拉交替（Push-Pull Alternating）的目的？
  a: 避免同一肌群在連續動作中累積疲勞（如二頭肌在多個拉式動作後力竭）
  tag: exercise-order
- q: Superset 和 Compound Set 的區別？
  a: Superset：兩個對抗肌動作（如彎舉+三頭下壓）；Compound Set：同一肌群的兩個動作，更集中疲勞
  tag: exercise-order
- q: 核心動作的背伸（Lower Back）動作應安排在什麼位置？
  a: 在需要直立姿勢或中立脊椎的動作之後才做；避免疲勞後技術崩壞
  tag: exercise-order
- q: 1RM 的定義？
  a: 以正確技術只能完成一次的最大重量；直接測試適合中階/進階且技術嫻熟者
  tag: load-repetitions
- q: 1RM 測試流程中，上下肢的負荷增加幅度分別為何？
  a: 上肢每次增加 4-9 kg（5-10%）；下肢每次增加 14-18 kg（10-20%）；理想在3-5組內測出
  tag: load-repetitions
- q: '%1RM 與次數的對應關係：75% 對應幾次？'
  a: 10次；100%=1次，95%=2次，90%=4次，85%=6次，80%=8次，75%=10次，67%=12次
  tag: load-repetitions
- q: RM 連續帶（RM Continuum）如何對應訓練目標？
  a: 肌力：≤6RM（≥85%）；爆發：1-5RM（75-90%）；肥大：6-12RM（67-85%）；肌耐力：≥12RM（≤67%）
  tag: load-repetitions
- q: 爆發力訓練的負荷為何低於%1RM-次數表所預測？
  a: 爆發動作在疲勞前技術就會崩壞，無法做到真正的多次最大；輕負荷確保每次都能以最大速度完成
  tag: load-repetitions
- q: 單次爆發與多次爆發運動員的負荷與組數建議有何不同？
  a: 單次（如鉛球）：80-90% 1RM，1-2次；多次（如籃球）：75-85% 1RM，3-5次
  tag: load-repetitions
- q: 輔助動作的負荷上限是什麼，原因是何？
  a: 最重不超過 8RM；保護單關節的關節軟骨與結締組織，即使目標是肌力計畫
  tag: load-repetitions
- q: Two-for-Two Rule（兩加兩法則）是什麼？
  a: 連續兩次訓練最後一組超出目標次數 ≥2次 → 下次訓練增加該動作的重量
  tag: load-repetitions
- q: 重日-輕日-中日（Heavy-Light-Medium）的負荷比例？
  a: 重日（Mon）= 100%；輕日（Wed）= 80%；中日（Fri）= 90%；防止過度訓練而仍維持頻率
  tag: load-repetitions
- q: Volume-Load 的計算公式？
  a: 組數 × 次數 × 重量；與機械功直接相關，Volume-Load ÷ 次數 = 每次平均重量（強度指標）
  tag: training-volume
- q: 各訓練目標的組數建議（Table 17.11）？
  a: 肌力：2-6組；爆發：3-5組；肥大：3-6組；肌耐力：2-3組（不含熱身）
  tag: training-volume
- q: 為何多組訓練優於單組訓練？
  a: 初學者單組有效，但中進階需多組才能持續進步；3組×10次不力竭 > 1組力竭（研究支持）
  tag: training-volume
- q: 肥大訓練對每塊肌群的動作數建議為何？
  a: ≥3個動作；多動作設計是增加肌肉尺寸的有效策略（觀察菁英健美選手及文獻支持）
  tag: training-volume
- q: 爆發力計畫的訓練量為何低於肌力計畫？
  a: 減少次數（1-5次）以保持動作品質；組數維持相似（3-5組），量的降低來自次數而非組數
  tag: training-volume
- q: Circuit Training（循環訓練）的特點？
  a: 動作輪流進行、休息極短（<30秒）；可同時提升心肺功能；常用上下交替排列
  tag: training-volume
- q: 各訓練目標的組間休息建議（Table 17.12）？
  a: 肌力：2-5分鐘；爆發：2-5分鐘；肥大：30秒-1.5分鐘；肌耐力：≤30秒
  tag: rest-periods
- q: 肥大訓練使用短休息的生理依據？
  a: 刻意在未完全恢復時開始下一組，增加代謝壓力與合成代謝荷爾蒙（如生長激素）分泌
  tag: rest-periods
- q: 為何深蹲比臥推需要更長的組間休息？
  a: 下肢大肌群恢復較上肢慢；多關節比單關節恢復更慢；結構性動作神經疲勞也更重
  tag: rest-periods
- q: 決定組間休息長度時應看哪個指標？
  a: 看實際使用的負荷百分比，而非「訓練計畫的大目標」；每個動作要個別評估
  tag: rest-periods
- q: Circuit Training 的組間休息通常控制在多長？
  a: ≤30秒；目的是讓短暫休息本身成為肌耐力的特異性訓練刺激
  tag: rest-periods
- q: 進階運動員每週不超過幾次最大肌力訓練日，原因為何？
  a: 通常只設1次「重日」；身體無法每天承受最大負荷，否則會進入過度訓練狀態
  tag: load-repetitions
- q: Back Squat 和 Power Clean 都強化髖膝伸肌，為何後者對跳躍更有益？
  a: Power Clean 具有高速率力量發展（RFD）和高功率輸出，更接近跳躍動作的力速特性
  tag: exercise-selection
- q: 為何建議不要對 Bent-Over Row 做 1RM 測試？
  a: 腰部穩定肌在多組重測中疲勞過快，難以全程維持正確姿勢，測試結果不可靠且有傷害風險
  tag: load-repetitions
- q: Overload 原則的實作方式有哪些？（至少列4種）
  a: 增加負荷、增加組數/次數、縮短組間休息、增加訓練頻率、換成更複雜動作
  tag: needs-analysis
- q: Progression 原則的應用方式？
  a: 根據運動員訓練狀態系統性且漸進地提升刺激；例如：前蹲→懸掛上搏→完整上搏的技術進程
  tag: needs-analysis
- q: 為何 10RM 估算 1RM 比更高次數的多次測試更準確？
  a: 負荷越接近真正 1RM，預測誤差越小；75% 1RM 以上（<10次）的關係最接近線性
  tag: load-repetitions
- q: 1RM 測試在哪類動作較不適合使用？
  a: 爆發力動作（如上搏）不適合高次數測試，因技術在疲勞前就崩壞；建議用3RM測試再估算
  tag: load-repetitions
- q: 什麼情況下應對已在使用的動作重新測試 1RM？
  a: 賽季更換或訓練目標改變時（如從賽前換到休賽季）；若目標次數不變可沿用舊負荷
  tag: load-repetitions
- q: Rest Period 的長短受哪三個主要因素影響？
  a: 訓練目標（最重要）、實際使用負荷百分比、運動員訓練狀態（新手初期可能需要更長）
  tag: rest-periods
