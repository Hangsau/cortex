    - ch12.selection-factors.i04
    - ch21.preparatory-period.i06
    locator: 'Step 1: Needs Analysis > Assessment of the Athlete > Training Status'
  - id: ch17.needs-analysis.i05
    q: 體能測試與評估應如何選擇？
    a:
    - 評估可涵蓋肌力、柔軟度、爆發力、速度、肌耐力、身體組成、心肺耐力等；本章需求分析聚焦最大肌力。
    - 測試應與運動相關、符合運動員技術程度，且以可取得的器材實際可行為準。
    - 完成測試後，將結果與常模或描述性資料比較，以找出優勢與弱點。
    detail: 動作分析提供選測方向；教材例示常用主要上肢動作及模擬跳躍程度不同的動作。測試結果要與運動需求分析合併，才可用來改善弱點、維持優勢或進一步發展生理能力。
    terms:
    - one-repetition-maximum
    - movement-analysis
    - needs-analysis
    numbers: []
    concepts:
    - program-design
    - measurement
    related:
    - ch12.selection-factors.i01
    - ch13.test-administration.i05
    - ch13.statistics.i08
    locator: 'Step 1: Needs Analysis > Assessment of the Athlete > Physical Testing and Evaluation'
  - id: ch17.needs-analysis.i06
    q: 各賽季的阻力訓練重點如何安排？
    a:
    - 休賽季：運動練習優先低、阻力訓練優先高；初期著重肌肥大與肌耐力，後期著重肌力與爆發力。
    - 季前：兩者優先都為中等，目標依運動而定，採運動與動作專項的肌力、爆發力或肌耐力訓練。
    - 賽季中：運動練習優先高、阻力訓練優先低，維持季前訓練目標；賽後主動休息則不設特定目標。
    detail: 表 17.2 明說實際目標與優先順序須依特定運動或活動調整，未必與表中的一般範例相同。
    terms:
    - training-frequency
    - specificity
    numbers: []
    concepts:
    - program-design
    - measurement
    related:
    - ch21.preparatory-period.i01
    - ch21.competition-period.i04
    - ch21.active-rest.i01
    locator: 'Step 1: Needs Analysis > Assessment of the Athlete > Primary Resistance Training Goal'
  - id: ch17.needs-analysis.i07
    q: 訓練背景（training background）要評估哪些內容？
    a:
    - 評估先前訓練的類型，例如短跑、增強式或阻力訓練。
    - 評估最近規律參與先前課表的時間、該課表的強度水準，以及動作技術經驗。
    detail: 訓練背景是開始新課表或修訂課表之前所進行的運動歷程；了解它可協助專業人員判斷運動員的訓練能力，並應同時由運動醫學專業人員評估可能影響訓練的既往或現有傷害。
    terms:
    - training-background
    - exercise-technique-experience
    - training-status
    numbers: []
    concepts:
    - program-design
    - measurement
    related:
    - ch12.selection-factors.i03
    - ch13.test-administration.i04
    - ch18.safety.i03
    locator: 'Step 1: Needs Analysis > Assessment of the Athlete > Training Status'
  - id: ch17.needs-analysis.i08
    q: 主要阻力訓練目標如何決定？
    a:
    - 由運動員測試結果、運動的動作與生理分析，以及該運動賽季的優先順序共同決定。
    - 通常目標是改善肌力、爆發力、肌肥大或肌耐力；即使想同時改善兩項，也應力求每個賽季集中在一個訓練結果。
    detail: 「力求集中」是教材的處方原則，不是說其他能力完全不會受益；後續的負荷、次數、訓練量與休息都要依這個主要目標指派。
