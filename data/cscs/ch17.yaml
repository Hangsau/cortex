id: ch17
weight: 17
title: Ch.17 阻力訓練課程設計
topics:
- id: exercise-order
  title: 步驟四：動作順序 Exercise Order
  desc: ''
  tag: Exercise Order
  items:
  - id: ch17.exercise-order.i01
    q: 動作順序的基本建議為何？
    a:
    - 依序執行爆發性動作（power exercise）、其他核心動作（core exercise）、輔助動作（assistance exercise）。
    - 若未選爆發性動作，則建議先核心動作再輔助動作。
    detail: 爆發性動作最需要技術與專注，也最易受疲勞影響；先做可降低技術變差及傷害風險，並在代謝狀態較新鮮時完成其高能量支出。
    terms:
    - power-exercise
    - core-exercise
    - assistance-exercise
    numbers: []
    concepts:
    - program-design
    related:
    - ch15.power-exercises-technique.i05
    - ch18.program-design.i08
    - ch19.training-methods.i03
    locator: 'Step 4: Exercise Order > Power, Other Core, Then Assistance Exercises'
  - id: ch17.exercise-order.i02
    q: 上下肢動作交替有何用途？
    a:
    - 上下肢動作交替可讓各部位在動作間獲得較完整的恢復。
    - 對未受訓者特別有用；時間有限時，也能縮短動作間所需休息、拉長同一部位的實際恢復。
    - 動作間僅休息 20–30 秒時，這種安排也稱為循環訓練（circuit training）。
    detail: 循環訓練可在較少總時間內完成訓練，並可能改善心肺耐力，但書中明確說明其效果小於傳統有氧訓練。
    terms:
    - circuit-training
    - exercise-order
    numbers:
    - v: '20–30'
      unit: 秒
      of: 上下肢交替而稱為循環訓練時的極短動作間休息
    concepts:
    - program-design
    related:
    - ch20.program-design.i06
    - ch05.overtraining.i01
    - ch17.rest-periods.i01
    locator: 'Step 4: Exercise Order > Upper and Lower Body Exercises (Alternated)'
  - id: ch17.exercise-order.i03
    q: 推／拉動作交替為何能減少疲勞？
    a:
    - 交替安排推動作與拉動作，可避免同一肌群在連續動作或組中重複使用。
    - 例如連續安排多個拉動作會使肱二頭肌疲勞，進而降低後續動作可完成的次數。
    detail: 此安排也適用循環訓練，且是剛開始或重新開始阻力訓練者的理想安排；下肢有些動作是否算推或拉則不一定明確。
    terms:
    - exercise-order
    - circuit-training
    numbers: []
    concepts:
    - program-design
    related:
    - ch02.musculature.i05
    - ch17.exercise-order.i04
    locator: 'Step 4: Exercise Order > “Push” and “Pull” Exercises (Alternated)'
  - id: ch17.exercise-order.i04
    q: 超級組（superset）如何定義？
    a:
    - 超級組是在兩個幾乎不休息的連續動作中，訓練一對相反作用的肌肉或肌群，即主動肌（agonist）與拮抗肌（antagonist）。
    - 例如先做槓鈴肱二頭彎舉，再做肱三頭下拉。
    detail: 超級組是刻意提高需求、且節省時間的配對方式；對體能未建立者可能不適合。書中也提醒，有時文獻會把超級組與複合組的名稱互換。
    terms:
    - superset
    - agonist
    - antagonist
    numbers: []
    concepts:
    - program-design
    related:
    - ch02.musculature.i04
    - ch02.musculature.i05
    - ch17.exercise-order.i03
    locator: 'Step 4: Exercise Order > Supersets and Compound Sets'
  - id: ch17.exercise-order.i05
    q: 複合組（compound set）如何定義？
    a:
    - 複合組是在幾乎不休息的情況下，連續做兩個訓練同一肌群的不同動作。
    - 例如做完槓鈴肱二頭彎舉後，立即改做啞鈴錘式彎舉。
    detail: 兩個動作都徵召同一肌群，因此壓力會疊加；它和超級組同樣省時但刻意提高需求，可能不適合體能未建立者。
    terms:
    - compound-set
    - superset
    numbers: []
    concepts:
    - program-design
    related:
    - ch17.exercise-order.i03
    - ch17.training-volume.i07
    - ch03.metabolic-specificity.i03
    locator: 'Step 4: Exercise Order > Supersets and Compound Sets'
  - id: ch17.exercise-order.i06
    q: 循環訓練（circuit training）的本章特徵為何？
    a:
    - 以最少休息在各動作間輪替；可用上下肢交替或推／拉交替來安排。
    - 動作間休息極短時，常限制在 30 秒或更短。
    detail: 本章在兩處以循環訓練說明不同目的：20–30 秒的上下肢交替可節省時間；肌耐力課程則以不超過 30 秒的休息維持特異性。
    terms:
    - circuit-training
    - exercise-order
    numbers:
    - v: '≤30'
      unit: 秒
      of: 肌耐力循環訓練常用的動作或組間休息上限
    concepts:
