    q: 訓練狀態如何影響可承受的組數？
    a:
    - 初學者適合只做 1–2 組，隨訓練程度提升再逐漸加組。
    - 在一致且設計良好的課表中適應後，可逐步增加組數，以符合該訓練目標的指引。
    detail: 訓練狀態決定運動員可安全承受的訓練量；加組要循序進行，而不是因進階就預設所有動作都採最高組數。
