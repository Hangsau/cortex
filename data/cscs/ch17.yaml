    locator: Principles of Anaerobic Exercise Prescription
  - id: ch17.principles-exam-tips.i07
    q: 漸進可改變哪些訓練內容？
    a:
    - 除了阻力，也可增加每週訓練次數、每節的練習或動作數量，或改變動作的類型與技術要求。
    - 所有改變都要循序、系統地配合運動員的訓練狀態。
    detail: 教材把增加訓練刺激列為漸進的可行方式，但沒有將單一項改變指定為所有運動員都必須採行的唯一方法。
