- id: training-volume
  title: 步驟六：訓練量 Training Volume
  desc: ''
  tag: Volume
  items:
  - id: ch17.training-volume.i01
    q: 訓練量負荷（volume-load）如何計算？
    a:
    - 訓練量負荷＝總組數 × 每組次數 × 每次舉起的重量。
    - 它與向心機械功及相關代謝能量需求直接相關；若每組重量不同，先各自計算再相加。
    detail: 機械功還會乘上位移，但同一運動員的位移因素相對固定，故訓練量負荷不納入位移。教材也提醒，在移動運動員本身的阻力動作中，應以系統質量計算。
    terms:
    - volume-load
    - mechanical-work
    - set
    numbers: []
    concepts:
    - program-design
    related:
