  - id: ch17.training-frequency.i06
    q: 其他訓練與生活活動如何影響阻力訓練頻率？
    a:
    - 頻率受整體身體壓力影響；已有有氧或無氧訓練、專項練習，或其組合時，可能需要降低阻力訓練頻率。
    - 勞力工作、協助他人做體能活動或整天站立等活動量，也可能降低可承受的頻率。
    detail: 頻率設計必須看運動員全部的身體負荷，而不是只計重量室內的課表。
    terms:
    - training-frequency
    numbers: []
