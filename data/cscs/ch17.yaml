    - ch03.epoc.i07
    - ch21.sfra-theory.i02
    locator: 'Step 6: Volume'
  - id: ch17.training-volume.i02
    q: 次數訓練量（repetition-volume）與訓練量負荷有何差別？
    a:
    - 次數訓練量是一次訓練中完成的總反覆次數；訓練量負荷則納入重量。
    - 訓練量負荷除以次數訓練量，得到每次反覆的平均舉起重量，可近似機械與代謝功率輸出。
    detail: 相同訓練量負荷可用不同組數與次數配置完成，但配置會影響阻力運動真正的強度或工作品質；反覆越多通常訓練耗時越久，尚未另計休息期。
    terms:
    - repetition-volume
    - volume-load
    - rest-period
    numbers: []
