    locator: 'Step 3: Training Frequency > Other Training'
  - id: ch17.training-frequency.i07
    q: 上、下肢分部位課表的四次／週範例如何安排？
    a:
    - 週一與週四訓練下肢，週二與週五訓練上肢。
    - 每個上肢或下肢訓練課之間有 2–3 日恢復，即使每週共有 4 節且兩次連續日訓練。
    detail: 此例示範如何以不同肌群分組維持局部恢復；三個不同訓練日的分部位課表，其休息日不會每週固定在同一天。
    terms:
    - split-routine
    - training-frequency
