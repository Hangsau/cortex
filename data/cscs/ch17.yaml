  - id: ch17.training-volume.i07
    q: 單組與多組訓練的教材結論為何？
    a:
    - 單組訓練可適用未受訓者或開始訓練的前幾個月，但許多研究指出中階與進階阻力訓練者要進一步增進肌力需要更高訓練量。
    - 3 組、每組 10 次而不做到力竭，比 1 組做到力竭的 8–12 次更能增進肌力。
    detail: 教材同時指出三組方案有較高訓練量，這是結果的促成因素之一；也不能期待運動員每一個動作的多組都能以完整 RM 負荷完成固定次數，因疲勞會影響後續組。
