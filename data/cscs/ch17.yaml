- id: needs-analysis
  title: 步驟一：需求分析 Needs Analysis
  desc: ''
  tag: Needs Analysis
  items:
  - id: ch17.needs-analysis.i01
    q: 需求分析（needs analysis）的運動評估包括什麼？
    a:
    - 需求分析是先評估運動需求與特徵、再評估運動員的兩階段過程。
    - 運動評估至少包括動作模式與肌肉參與（movement analysis）、肌力／爆發力／肌肥大／肌耐力優先順序（physiological analysis），以及常見關節與肌肉傷害部位和原因（injury analysis）。
    detail: 也應評估心肺耐力、速度、敏捷性與柔軟度等運動特性；但本章只處理與阻力訓練課程設計直接相關的四項生理結果。
    terms:
    - needs-analysis
    - movement-analysis
    - physiological-analysis
    - injury-analysis
    numbers: []
    concepts:
    - program-design
    - measurement
    related:
    - ch12.selection-factors.i01
    - ch12.selection-factors.i02
    - ch19.program-design-monitoring.i07
    - ch22.injury-prevention.i01
    locator: 'Step 1: Needs Analysis > Evaluation of the Sport'
  - id: ch17.needs-analysis.i02
    q: 運動的生理分析如何影響阻力訓練？
    a:
    - 生理分析要排定肌力、爆發力、肌肥大與肌耐力的優先順序。
    - 本章的阻力訓練課程設計只聚焦這四項生理結果。
    detail: 這個分析是需求分析的一部分，需連同動作與傷害分析使用；它不是以一般體能需求取代特定運動的阻力訓練目標。
    terms:
    - physiological-analysis
    - needs-analysis
    numbers: []
    concepts:
    - program-design
    - measurement
    related:
    - ch03.metabolic-specificity.i01
    - ch05.hypertrophy.i01
    - ch19.core-concepts.i06
    locator: 'Step 1: Needs Analysis > Evaluation of the Sport'
  - id: ch17.needs-analysis.i03
    q: 傷害分析（injury analysis）要辨識什麼？
    a:
    - 辨識運動中常見的關節與肌肉傷害部位，以及其致因。
    - 可據此選擇孤立特定肌肉或肌群的輔助動作（assistance exercise），協助預防運動技能所易造成的傷害或傷後重新訓練。
    detail: 教材把傷害分析列為運動評估的最低必要內容；它是使課表對該運動特徵更具專項性的資料來源。
    terms:
    - injury-analysis
    - assistance-exercise
    numbers: []
    concepts:
    - program-design
    - measurement
    related:
    - ch22.injury-prevention.i01
    - ch22.sports-medicine-team.i04
    - ch07.female-acl.i06
    locator: 'Step 1: Needs Analysis > Evaluation of the Sport'
  - id: ch17.needs-analysis.i04
    q: 阻力訓練狀態如何按訓練年齡分類？
    a:
    - 初學者（beginner）為未訓練或剛開始訓練者，訓練年齡少於 2 個月；中階者（intermediate）為 2–6 個月；進階者（advanced）為超過 1 年。
    - 分類還會參考目前是否訓練、訓練頻率、訓練壓力，以及技術經驗與技能。
    detail: 三種分類位在連續帶上，不能做明確切割；因此訓練年齡是範例分類資訊，不是唯一或絕對的判定標準。
    terms:
    - training-status
    - training-background
    - exercise-technique-experience
    numbers:
    - v: '<2'
      unit: 個月
      of: 初學者阻力訓練年齡的範例範圍
    - v: '2–6'
      unit: 個月
      of: 中階者阻力訓練年齡的範例範圍
    - v: '>1'
      unit: 年
      of: 進階者阻力訓練年齡的範例範圍
    concepts:
