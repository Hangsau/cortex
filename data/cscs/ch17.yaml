cards:
- q: 阻力訓練課程設計的七個變項為何？
  a: 需求分析、動作選擇、訓練頻率、動作順序、訓練負荷與次數、訓練量、休息期。
  tag: needs-analysis
- q: 需求分析（needs analysis）的兩個階段為何？
  a: 先評估運動的需求與特徵，再評估運動員。
  tag: needs-analysis
- q: 運動評估至少包含哪三項分析？
  a: 動作分析（movement analysis）、生理分析（physiological analysis）、傷害分析（injury analysis）。
  tag: needs-analysis
- q: 訓練狀態（training status）的訓練年齡範例為何？
  a: 初學者少於 2 個月；中階者 2–6 個月；進階者超過 1 年；三類位於連續帶，不能明確切割。
  tag: needs-analysis
- q: 四個賽季的阻力訓練目標範例為何？
  a: 休賽季初期肌肥大與肌耐力、後期肌力與爆發力；季前依運動採專項目標；賽季中維持季前目標；賽後主動休息不設特定目標。
  tag: needs-analysis
- q: SAID 的全名與意義為何？
  a: specific adaptation to imposed demands；施加於身體的需求類型決定會發生的適應類型。
  tag: needs-analysis
- q: 核心動作（core exercise）如何界定？
  a: 徵召一個或以上大肌群區域、涉及兩個或以上主要關節、且直接應用於運動的多關節動作。
  tag: needs-analysis
- q: 輔助動作（assistance exercise）如何界定？
  a: 通常徵召較小肌群區域、只涉及一個主要關節；可孤立特定肌肉以用於傷害預防或傷後重新訓練。
  tag: needs-analysis
- q: 結構性動作與爆發性動作有何關係？
  a: 結構性動作會直接或間接負荷脊椎並需穩定姿勢；以非常快速或爆發方式完成的結構性動作即為爆發性動作。
  tag: exercise-selection
- q: 為何教材以背蹲舉優先於腿推作為跳躍相關動作？
  a: 兩者皆訓練髖與膝伸肌，但背蹲舉具有站立姿勢、平衡與承重特徵，較相關於跳躍。
  tag: exercise-selection
- q: 肌肉平衡（muscle balance）代表什麼？
  a: 關節與相對肌群之間具有適當的肌力、爆發力或肌耐力比率，不表示肌力相等；若不平衡，選擇動作予以恢復。
  tag: exercise-selection
- q: 恢復性動作（recovery exercise）的目的與時機為何？
  a: 以輕負荷阻力或低強度有氧促進動作與恢復，可排在主要阻力訓練結尾或微週期內另排一節。
  tag: exercise-selection
- q: 動作選擇時的五項考量為何？
  a: 動作類型、運動的動作與肌肉需求、技術經驗、器材可用性、每節可用訓練時間。
  tag: exercise-selection
- q: 各訓練狀態每週的頻率指引為何？
  a: 初學者 2–3 節；中階者 3–4 節；進階者 4–7 節。
  tag: training-frequency
- q: 分部位課表（split routine）的適用對象與作用為何？
  a: 適合中階或進階阻力訓練者；以不同日訓練不同肌群，使接近每日訓練仍保有相近課表間的恢復。
  tag: training-frequency
- q: 受訓練運動員各賽季的每週頻率指引為何？
  a: 休賽季 4–6 節；季前 3–4 節；賽季中 1–3 節；賽後主動休息期 0–3 節。
  tag: training-frequency
- q: 對同一肌群造成壓力的兩次訓練間，恢復日數原則為何？
  a: 至少一個休息或恢復日，且不超過三個。
  tag: training-frequency
- q: 哪些動作特徵可使訓練後恢復較快？
  a: 有證據顯示上肢比下肢更快從重負荷恢復，單關節動作也比多關節動作恢復快。
  tag: training-frequency
- q: 一般動作順序的建議為何？
  a: 爆發性動作、其他核心動作、輔助動作；若未選爆發性動作，則先核心再輔助。
  tag: exercise-order
- q: 上下肢動作交替有何好處？
  a: 讓各部位在動作間恢復較完整；時間有限時可縮短動作間休息而縮短整體訓練時間。
  tag: exercise-order
- q: 推／拉動作交替的目的為何？
  a: 避免同一肌群在連續動作或組中重複使用；連續拉動作會使肱二頭肌疲勞並降低後續可完成的次數。
  tag: exercise-order
- q: 超級組與複合組有何差別？
  a: 超級組連續訓練相反作用肌肉或肌群；複合組連續做兩個訓練同一肌群的不同動作。
  tag: exercise-order
- q: 為何下背肌向心收縮的動作應排在後面？
  a: 下背疲勞會使需要直立軀幹或中立脊椎的結構性與站姿動作技術不正確，且可能造成傷害。
  tag: exercise-order
- q: 1RM 的定義與直接測試適用對象為何？
  a: 以正確技術只能舉起一次的最大重量；通常適合具動作技術經驗的中階或進階阻力訓練者。
  tag: load-repetitions
- q: 哪些情況可能不適合直接 1RM 測試？
  a: 未受訓、經驗不足、受傷或受醫療監督者可能不適合；忽略訓練狀態與技術經驗會降低安全性與準確度。
  tag: load-repetitions
- q: 表 17.7 中 75% 1RM 對應多少次？
  a: 10 次；該表僅作估算特定 RM 負荷的指引，且是假定單一組。
  tag: load-repetitions
- q: RM 連續帶的核心意義為何？
  a: 低次 RM 較強調肌力與最大爆發力，高次 RM 較有利於肌耐力；任何 RM 的訓練效益仍是混合的。
  tag: load-repetitions
- q: 為何爆發力訓練的負荷低於 %1RM－次數表所推定？
  a: 爆發性動作的技術會在瞬間肌肉疲勞界定真正 RM 前下降；較輕負荷讓每次反覆可用最大速度完成。
  tag: load-repetitions
- q: 單次與多次出力爆發力項目的負荷與次數指引為何？
  a: 單次出力為 80–90% 1RM、1–2 次；多次出力為 75–85% 1RM、3–5 次。
  tag: load-repetitions
- q: 輔助動作允許的最重負荷為何？
  a: 8RM；即使核心動作採重負荷，也以此限制減少對所涉關節與結締組織的孤立壓力。
  tag: load-repetitions
- q: 2-for-2 rule（兩加二法則）何時增加重量？
  a: 最後一組連續兩次訓練都比指定目標多完成至少兩次時，下一次訓練增加該動作負荷。
  tag: load-repetitions
- q: 重、輕、中日如何以重日負荷安排？
  a: 輕日取重日爆發與其他核心動作負荷的 80%，中日取 90%，但都維持指定目標次數。
  tag: load-repetitions
- q: 訓練量負荷（volume-load）如何計算？
  a: 總組數乘每組次數，再乘每次舉起重量；除以次數訓練量可得每次反覆平均舉起重量。
  tag: training-volume
- q: 表 17.11 的組數指引為何？
  a: 肌力 2–6 組；爆發力單次及多次出力皆 3–5 組；肌肥大 3–6 組；肌耐力 2–3 組。
  tag: training-volume
- q: 單組與多組訓練的教材結論為何？
  a: 單組可適用未受訓者或最初數月；中階與進階者要繼續增進肌力通常需要較高訓練量，且 3 組 10 次不力竭優於 1 組 8–12 次力竭。
  tag: training-volume
- q: 肌肥大每肌群三個以上動作的依據是什麼？
  a: 教材引述精英健美選手的實證觀察與訪談，以及較完整的處方指引，認為這是增加肌肉尺寸的有效策略。
  tag: training-volume
- q: 爆發力課表的訓練量為何通常低於肌力？
  a: 為最大化動作品質，主要是較少目標次數與較輕負荷所致，而非建議組數較少。
  tag: training-volume
- q: 循環訓練（circuit training）的安排特徵為何？
  a: 以極短休息輪替各動作，常用上下肢或推／拉交替；肌耐力循環訓練常將休息限制在 30 秒或更短。
  tag: training-volume
- q: 表 17.12 的休息期指引為何？
  a: 肌力與爆發力皆 2–5 分鐘；肌肥大 30 秒至 1.5 分鐘；肌耐力至多 30 秒。
  tag: rest-periods
- q: 肌肥大訓練的休息安排有何原則？
  a: 部分課表綜述建議未完全恢復即開始下一組，但大肌群動作代謝需求高，可能需要額外恢復時間。
  tag: rest-periods
- q: 背蹲舉休息期的研究比較結果為何？
  a: 在背蹲舉研究中，組間休息 3 分鐘比 30 秒帶來較大的肌力增進。
  tag: rest-periods
- q: 決定休息期時要考慮什麼？
  a: 訓練目標、實際相對負荷、動作涉及肌肉量，以及運動員訓練狀態；每個動作要個別指派。
  tag: rest-periods
- q: 肌耐力循環訓練的休息期上限為何？
  a: 30 秒；輕負荷多反覆時，刻意限制恢復是肌耐力特異性原則的一部分。
  tag: rest-periods
- q: 三日／週高負荷範例如何避免每天都很重？
  a: 每週只安排一個重日；其他兩日的爆發與核心動作負荷分別降為重日的 80% 與 90%。
  tag: load-repetitions
- q: 高翻與抓舉為何和跳躍相關？
  a: 它們具有快速動作特徵，因此能產生快速力量發展率與高功率。
  tag: exercise-selection
- q: 為何不宜以俯身划船做 1RM 測試？
  a: 下背較弱的穩定肌在數組測試後可能疲勞，難全程維持正確姿勢，導致資料無效且可能不可靠。
  tag: load-repetitions
- q: 超負荷（overload）可如何實作？
  a: 可增加負荷、每週訓練節數、動作或組數，強調複雜而非簡單動作，或縮短組間與動作間休息。
  tag: needs-analysis
- q: 漸進（progression）原則如何應用？
  a: 依運動員訓練狀態系統且漸進提高訓練刺激；可增加頻率、動作數量，或提高動作技術要求。
  tag: needs-analysis
- q: 為何以 10RM 或更重多次反覆負荷預測 1RM 較準？
  a: 多次反覆測試負荷越接近實際 1RM，估計越準；以不超過 10RM 的負荷建立方程式時，預測也較準。
  tag: load-repetitions
- q: 爆發性動作為何不適合高次數多次反覆測試？
  a: 重複測試組若超過五次，技術會快速變差；因此它不適合做高次數的多次反覆測試。
  tag: load-repetitions
- q: 指派訓練負荷的三種測試選項為何？
  a: 直接測實際 1RM、由多次 RM 測試估算 1RM，或直接測與課表目標次數相同的多次 RM。
  tag: load-repetitions
- q: 休息期（rest period）長度主要受哪些因素影響？
  a: 訓練目標、所舉相對負荷與運動員訓練狀態。
  tag: rest-periods
