  - id: ch17.load-repetitions.i08
    q: 負荷增加量的通用建議為何？
    a:
    - 較小、較弱、較少訓練者：上肢加 2.5–5 lb（1–2 kg），下肢加 5–10 lb（2–4 kg）。
    - 較大、較強、較多訓練者：上肢加 5–10+ lb（2–4+ kg），下肢加 10–15+ lb（4–7+ kg）。
    - 也可改用 2.5–10% 的相對增加量。
    detail: 表中的絕對增量是一般建議，訓練狀態、訓練量負荷、動作類型及肌肉參與都會改變適宜幅度；這些數字適用於約三組、每組五至十次且目標次數維持不變的課表。
