- id: rest-periods
  title: 步驟七：組間休息 Rest Periods
  desc: ''
  tag: Rest Periods
  items:
  - id: ch17.rest-periods.i01
    q: 何謂休息期（rest period／interset rest）？
    a:
    - 休息期或組間休息，是組與組及動作與動作之間用於恢復的時間。
    - 長度高度取決於訓練目標、所舉相對負荷與運動員訓練狀態。
    detail: 若運動員體能狀態不好，開始時的休息期可能要比典型指派更長；因此休息期不是只由訓練目標單獨決定。
    terms:
    - rest-period
    - interset-rest
    - training-status
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related:
    - ch03.substrate.i02
    - ch05.overtraining.i01
    - ch20.program-design.i06
    locator: 'Step 7: Rest Periods'
  - id: ch17.rest-periods.i02
    q: 肌力與爆發力訓練的休息期建議為何？
    a:
    - 肌力及爆發力訓練的建議休息期皆為 2–5 分鐘。
    - 尋求以重負荷完成最大或近最大反覆的運動員，通常需要較長休息，尤其是下肢或全身結構性動作。
    detail: 長休息是為了安全且成功完成後續指定組；教材說這些恢復間隔看來同樣適用於最大肌力與肌肉爆發力課表。
    terms:
    - rest-period
    - power-exercise
    - structural-exercise
    numbers:
    - v: '2–5'
      unit: 分鐘
      of: 肌力與爆發力訓練的建議組間休息期
    concepts:
    - program-design
    - energy-supply
    related:
    - ch03.substrate.i02
    - ch15.power-exercises-technique.i05
    - ch18.program-design.i03
    - ch13.max-strength.i05
    locator: 'Step 7: Rest Periods > Strength and Power'
  - id: ch17.rest-periods.i03
    q: 肌肥大訓練的休息期建議為何？
    a:
    - 肌肥大訓練的建議休息期為 30 秒至 1.5 分鐘。
    - 部分肌肥大課表綜述建議在未完全恢復前開始下一組。
    detail: 大肌群動作的代謝需求高，指派休息長度時應額外考量恢復時間；不能因採肌肥大目標而一概套用最短休息。
    terms:
    - rest-period
    numbers:
    - v: '30'
      unit: 秒
      of: 肌肥大訓練建議組間休息期的下限
    - v: '1.5'
      unit: 分鐘
      of: 肌肥大訓練建議組間休息期的上限
    concepts:
