  - id: ch17.training-frequency.i03
    q: 同一肌群訓練間的恢復日數原則為何？
    a:
    - 對同一肌群造成壓力的兩次訓練之間，安排至少 1 個休息或恢復日，但不超過 3 個。
    detail: 兩次全身課表若每週僅做兩天，應平均分開；教材以週一與週四或週二與週五為例，並提醒週一、週三後到下週一沒有刺激可能使訓練狀態下降。
    terms:
