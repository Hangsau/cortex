- id: principles-exam-tips
  title: 無氧運動處方原則 Principles of Anaerobic Exercise Prescription
  desc: ''
  tag: Principles
  items:
  - id: ch17.principles-exam-tips.i01
    q: 特異性（specificity）與 SAID 原則是什麼？
    a:
    - 特異性是以特定方式訓練，產生特定適應或訓練結果；阻力訓練應考量所涉肌肉、動作模式與肌肉動作性質，例如動作速度與施力。
    - SAID 是 specific adaptation to imposed demands，意指施加於身體的需求類型決定會發生的適應類型。
    detail: 特異性不表示訓練必須模仿運動技能的所有面向。課表也要隨賽季從一般化逐漸轉為運動專項；實際參與該運動本身仍是提升該運動表現的最大機會。
    terms:
    - specificity
    - said
    numbers: []
    concepts:
    - program-design
    related:
    - ch03.metabolic-specificity.i01
    - ch22.resistance-training-systems.i05
    - ch20.aerobic-performance-factors.i08
    locator: Principles of Anaerobic Exercise Prescription
  - id: ch17.principles-exam-tips.i02
    q: 超負荷（overload）原則如何定義？
    a:
    - 超負荷是指安排強度高於運動員已習慣程度的訓練或課表。
    - 沒有超負荷刺激，即使課表其他部分設計良好，改善能力也會大幅受限。
    detail: 正確套用超負荷的目的，是讓身體承受較原本習慣更高的壓力並產生所欲適應，同時避免過度訓練。
    terms:
    - overload
    numbers: []
    concepts:
    - program-design
    related:
    - ch05.overtraining.i01
    - ch21.gas-theory.i06
    - ch21.fitness-fatigue.i01
    locator: Principles of Anaerobic Exercise Prescription
  - id: ch17.principles-exam-tips.i03
    q: 漸進（progression）原則如何套用？
    a:
    - 若課表要持續產生更高表現，訓練強度必須逐漸提高。
    - 漸進必須依運動員訓練狀態，以系統且漸進的方式引入。
    detail: 漸進不只增加阻力；教材以從前蹲舉、學習高懸式高翻，再到高翻的技術漸進為例。
    terms:
    - progression
    - training-status
    numbers: []
    concepts:
    - program-design
    related:
    - ch18.program-design.i05
    - ch21.periodization-hierarchy.i08
    - ch07.program-design-populations.i01
    locator: Principles of Anaerobic Exercise Prescription
  - id: ch17.principles-exam-tips.i04
    q: 阻力訓練課程設計的七個變項為何？
    a:
    - 依序為需求分析、動作選擇、訓練頻率、動作順序、訓練負荷與次數、訓練量、休息期。
    detail: 教材將這七項稱為步驟 1–7；它們是需要辨識並操作的課程設計變項，非可任意省略的獨立清單。
    terms:
    - program-design
    - needs-analysis
    - exercise-selection
    - training-frequency
    - exercise-order
    - load
    - volume
    - rest-period
    numbers:
