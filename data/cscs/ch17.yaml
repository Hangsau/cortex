  - id: ch17.load-repetitions.i05
    q: 為何肌力課表中的輔助動作不能太重？
    a:
    - 即使核心動作採 2RM 等重負荷，輔助動作的最重負荷也應為 8RM。
    - 此限制是為了減少對所涉關節與結締組織的孤立壓力。
    detail: 表 17.9 的肌力負荷與次數指派只適用核心動作；不能把它不加區分地套用至輔助動作。
    terms:
    - assistance-exercise
    - core-exercise
    - repetition-maximum
    numbers:
    - v: '2'
      unit: RM
      of: 肌力課表核心動作可採用的重負荷範例
    - v: '8'
      unit: RM
      of: 輔助動作允許的最重負荷
    concepts:
