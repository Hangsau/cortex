id: ch17
weight: 17
title: Ch.17 阻力訓練課程設計
topics:
- id: exercise-order
  title: 步驟四：動作順序 Exercise Order
  desc: ''
  tag: Exercise Order
  items:
  - id: ch17.exercise-order.i01
    q: 爆發力優先原則
    a:
    - 爆發性動作 → 主要動作 → 輔助動作
    - 爆發力動作需最高技術與能量，疲勞最敏感，必須最先做
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-order.i02
    q: 上下肢交替
    a:
    - 讓局部肌群充分恢復
    - 適合初學者或時間有限時
    - 可用於循環訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-order.i03
    q: 推拉交替
    a:
    - 推（臥推、肩推）與拉（划船、下拉）交替
    - 避免同一肌群連續疲勞
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-order.i04
    q: 超級組
    a:
    - 兩個相鄰拮抗肌群動作連續執行（二頭彎舉 → 三頭下推）
    - 省時且增加刺激
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-order.i05
    q: 複合組
    a:
    - 同一肌群兩個動作連續執行（槓鈴彎舉 → 錘式彎舉）
    - 疊加同部位刺激
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-order.i06
    q: 循環訓練
    a:
    - 上下肢交替 + 極短休息（20-30秒）= 循環訓練
    - 可同時刺激心肺（但效果不及有氧）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-order.i07
    q: 下背肌注意
    a:
    - 需要直立姿勢的動作先做
    - 下背疲勞會影響深蹲/硬舉技術，增加傷害風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-order.i08
    q: 考題陷阱
    a:
    - 爆發上搏必須排最前
    - 同一肌群多動作連續排列會降低後續組數表現
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
- id: exercise-selection
  title: 步驟二：動作選擇 Exercise Selection
  desc: ''
  tag: Exercise Selection
  items:
  - id: ch17.exercise-selection.i01
    q: 主要動作
    a:
    - 大肌群、多關節（multijoint）
    - 直接影響運動表現優先選擇（如：squat、bench press）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-selection.i02
    q: 輔助動作
    a:
    - 小肌群、單關節（single-joint）
    - 常用於傷害預防與復健（如：biceps curl、calf raise）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-selection.i03
    q: 結構性動作
    a:
    - 脊椎直接或間接承重的主要動作（如：back squat直接
    - power clean間接）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-selection.i04
    q: 爆發性動作
    a:
    - 以爆發方式執行的結構性動作（如：power clean, snatch）
    - 需最高技術與專注度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-selection.i05
    q: 動作特異性
    a:
    - 需求適應原則：訓練動作越像運動動作，正向遷移越大（back squat > leg press for jump）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-selection.i06
    q: 肌肉平衡
    a:
    - 拮抗肌群需保持適當力量比例（主動肌 vs 拮抗肌）
    - 防止失衡造成傷害
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-selection.i07
    q: 恢復性動作
    a:
    - 低強度、低神經壓力動作
    - 幫助代謝廢物清除，加速組織修復
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.exercise-selection.i08
    q: 實務考量
    a:
    - 技術經驗、設備可用性、訓練時間都影響動作選擇（時間少 → 機器 > 自由重量）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
- id: load-repetitions
  title: 步驟五：負荷與次數 Load & Repetitions
  desc: ''
  tag: Load
  items:
  - id: ch17.load-repetitions.i01
    q: 直接測試最大單次
    a:
    - 適合中階/進階
    - 需足夠技術與訓練背景
    - 建議3-5組完成測定
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.load-repetitions.i02
    q: 間接估算最大單次
    a:
    - 10RM測試後查表估算1RM
    - 準確度在≤10RM、>75%1RM時最高
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.load-repetitions.i03
    q: 目標次數測試法
    a:
    - 直接以計畫的目標次數做多次最大測試（如計畫6次就測6RM）
    - 省去換算步驟
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.load-repetitions.i04
    q: 百分比與訓練目標
    a:
    - 肌力≥85%（≤6次）
    - 爆發75-90%（1-5次）
    - 肥大67-85%（6-12次）
    - 肌耐力≤67%（≥12次）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.load-repetitions.i05
    q: 輔助動作負荷上限
    a:
    - 輔助動作最重不超過8RM負荷
    - 保護單關節的關節與結締組織
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.load-repetitions.i06
    q: 負荷波動策略
    a:
    - 重日(100%)→輕日(80%)→中日(90%)
    - 防止過度訓練，維持頻率與訓練量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.load-repetitions.i07
    q: 兩加兩法則
    a:
    - 連續兩次訓練最後一組超出目標次數≥2次 → 下次訓練增加重量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.load-repetitions.i08
    q: 負荷增加量
    a:
    - 上肢較弱+2.5-5磅
    - 下肢較弱+5-10磅
    - 上肢強壯+5-10+磅
    - 下肢強壯+10-15+磅
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
- id: needs-analysis
  title: 步驟一：需求分析 Needs Analysis
  desc: ''
  tag: Needs Analysis
  items:
  - id: ch17.needs-analysis.i01
    q: 運動分析
    a:
    - 動作模式、關節ROM、主要肌群參與（如：shot-put = 三頭、臀、股四頭）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
  - id: ch17.needs-analysis.i02
    q: 生理分析
    a:
    - 優先訓練目標：肌力 / 爆發力 / 肥大 / 肌耐力
    - 每賽季只專注一項
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
  - id: ch17.needs-analysis.i03
    q: 傷害分析
    a:
    - 找出常見受傷部位與原因
    - 設計預防性輔助動作（assistance exercises）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
  - id: ch17.needs-analysis.i04
    q: 訓練狀態分類
    a:
    - Beginner（<2月）/ Intermediate（2-6月）/ Advanced（>1年）
    - 影響頻率、強度、技術要求
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
  - id: ch17.needs-analysis.i05
    q: 體能測試
    a:
    - 1RM、爆發力、體組成等
    - 選與運動相關的測試項目（bench press、squat、power clean）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
  - id: ch17.needs-analysis.i06
    q: 賽季優先順序
    a:
    - 'Off: 肥大→肌力'
    - 'Pre: 肌力/爆發'
    - 'In: 維持'
    - 'Post: 非特定'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
  - id: ch17.needs-analysis.i07
    q: 訓練背景評估
    a:
    - 評估項目：訓練類型、持續時間、強度水準、技術熟練度（technique experience）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
  - id: ch17.needs-analysis.i08
    q: 主要訓練目標
    a:
    - 由測試結果 + 運動分析 + 賽季共同決定
    - 一次只訂一個目標
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - measurement
    related: []
    locator: ''
- id: principles-exam-tips
  title: 訓練原則與考題重點 Principles & Exam Tips
  desc: ''
  tag: Principles
  items:
  - id: ch17.principles-exam-tips.i01
    q: 特異性 / 需求適應
    a:
    - 訓練刺激決定適應結果
    - 動作模式、速度、肌群都要盡量接近運動需求
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.principles-exam-tips.i02
    q: 超負荷原則
    a:
    - 超過現有能力的刺激才能產生適應
    - 可增重量、次數、組數、縮短休息等方式達成
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.principles-exam-tips.i03
    q: 漸進原則
    a:
    - 循序漸進提升強度
    - 應依訓練狀態系統性增加
    - 過快 → 過度訓練，過慢 → 停滯
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.principles-exam-tips.i04
    q: 情境A：籃球（季前）
    a:
    - 進階
    - 目標：肌力/爆發力
    - 3次/週
    - 週一重/週三輕/週五中
    - 爆發上搏優先
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.principles-exam-tips.i05
    q: 情境B：美足（休賽）
    a:
    - 進階
    - 目標：肥大
    - 4次/週（分部位）
    - 週一四下肢 / 週二五上肢
    - 輪胎翻轉
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.principles-exam-tips.i06
    q: 情境C：越野跑（賽季）
    a:
    - 初學者
    - 目標：肌耐力
    - 2次/週
    - 循環訓練
    - ≥12次/組
    - ≤30秒休息
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.principles-exam-tips.i07
    q: 常見考題方向
    a:
    - 爆發動作排序、賽季頻率增減、負荷與休息對應、兩加兩法則、輔助動作8RM上限
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.principles-exam-tips.i08
    q: 力量-速度曲線
    a:
    - 最大爆發力出現在中等速度/中等負荷（75-90%）
    - 最大單次速度太慢，功率反而低
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
- id: rest-periods
  title: 步驟七：組間休息 Rest Periods
  desc: ''
  tag: Rest Periods
  items:
  - id: ch17.rest-periods.i01
    q: 肌力組間休息
    a:
    - 2-5分鐘
    - 重量越大需越長
    - 下肢/全身結構動作需要最長（深蹲研究：3分 > 30秒）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch17.rest-periods.i02
    q: 爆發力組間休息
    a:
    - 同肌力：2-5分鐘
    - 需完全恢復神經系統才能維持爆發品質
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch17.rest-periods.i03
    q: 肥大組間休息
    a:
    - 30秒-1.5分鐘
    - 刻意未完全恢復即開始下一組
    - 增加代謝壓力與生長激素分泌
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch17.rest-periods.i04
    q: 肌耐力組間休息
    a:
    - ≤30秒
    - 循環訓練常見
    - 短休息本身就是肌耐力特異性訓練的一部分
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch17.rest-periods.i05
    q: 輔助動作例外
    a:
    - 即使在肌力計畫中，若輔助動作用10RM → 休息應改為30秒-1.5分（按實際負荷決定）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch17.rest-periods.i06
    q: 肌群大小影響
    a:
    - 大肌群/多關節需更長休息
    - 小肌群/單關節恢復較快，可縮短休息
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch17.rest-periods.i07
    q: 上下肢差異
    a:
    - 上肢比下肢恢復快 → 下肢訓練通常需要更長的組間休息
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch17.rest-periods.i08
    q: 考題重點
    a:
    - 休息長短依「實際使用的百分比」決定，而非「訓練計畫目標」
    - 每個動作需個別分析
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
- id: training-frequency
  title: 步驟三：訓練頻率 Training Frequency
  desc: ''
  tag: Frequency
  items:
  - id: ch17.training-frequency.i01
    q: 依訓練狀態
    a:
    - '初學者: 2-3次/週'
    - '中階: 3-4次'
    - '進階: 4-7次'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.training-frequency.i02
    q: 依賽季
    a:
    - '休賽季: 4-6次'
    - '季前: 3-4次'
    - '賽季中: 1-3次'
    - '賽後: 0-3次（休息恢復）'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.training-frequency.i03
    q: 休息天數原則
    a:
    - 同肌群訓練之間至少1天休息、最多不超過3天（以維持訓練效果）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.training-frequency.i04
    q: 分部位訓練
    a:
    - 進階選手分部位訓練（上下肢分開）
    - 可增加訓練日數而不過度疲勞
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.training-frequency.i05
    q: 負荷與恢復
    a:
    - 近最大負荷需更長恢復
    - 上肢比下肢恢復快
    - 單關節比多關節恢復快
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.training-frequency.i06
    q: 其他訓練影響
    a:
    - 有氧、增強式、專項練習都會消耗恢復資源
    - 需整體考量訓練頻率
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.training-frequency.i07
    q: 分部位範例
    a:
    - 週一&四=下肢，週二&五=上肢
    - 每個部位之間有2-3天休息，共4次/週
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch17.training-frequency.i08
    q: 賽季中原則
    a:
    - 賽季中時間有限 → 減少頻率維持訓練
    - 優先保留專項練習時間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
