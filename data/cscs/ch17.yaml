    - ch04.cortisol.i06
    - ch03.epoc.i07
    locator: 'Step 7: Rest Periods > Hypertrophy'
  - id: ch17.rest-periods.i04
    q: 肌耐力訓練的休息期建議為何？
    a:
    - 肌耐力課表的休息期很短，通常少於或等於 30 秒。
    - 輕負荷、多次數時刻意只給最少恢復，是肌耐力特異性原則的一部分。
    detail: 短休息也是循環訓練的特徵，通常以交替動作並將休息限制在 30 秒或更短來安排。
    terms:
    - rest-period
    - circuit-training
    - specificity
    numbers:
    - v: '≤30'
      unit: 秒
      of: 肌耐力訓練與常見循環訓練的休息期上限
    concepts:
    - program-design
    - energy-supply
    related:
    - ch03.metabolic-specificity.i03
    - ch20.training-types.i03
    - ch13.anaerobic-endurance.i03
    locator: 'Step 7: Rest Periods > Muscular Endurance'
  - id: ch17.rest-periods.i05
    q: 為何休息期須按個別動作的實際負荷指派？
    a:
    - 即使同屬肌力課表，4RM 臥推這類核心動作可休息 4 分鐘；12RM 側平舉這類輔助動作則只需 1 分鐘。
    - 休息期應檢視每個動作的實際負荷，而非一概沿用該課表的訓練目標。
    detail: 教材特別指出肌力課表的輔助動作有時會使用不屬肌力負荷範圍的反覆最大重量，因此以訓練目標套用全課表同一休息期會失準。
    terms:
    - rest-period
    - repetition-maximum
    - core-exercise
    - assistance-exercise
    numbers:
