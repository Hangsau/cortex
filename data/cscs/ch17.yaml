  - id: ch17.training-frequency.i02
    q: 受訓練運動員依賽季的頻率指引為何？
    a:
    - 休賽季每週 4–6 節；季前每週 3–4 節；賽季中每週 1–3 節；賽後主動休息期每週 0–3 節。
    detail: 這是受訓練運動員的賽季別範例。賽季中會因專項練習優先提高而減少重量室時間，並非運動員能力一定無法負荷較高頻率。
    terms:
