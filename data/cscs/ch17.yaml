      unit: RM
      of: 肌力課表中臥推核心動作的負荷範例
    - v: '4'
      unit: 分鐘
      of: 4RM 臥推核心動作的休息期範例
    - v: '12'
      unit: RM
      of: 肌力課表中側平舉輔助動作的負荷範例
    - v: '1'
