    q: 肌耐力訓練的訓練量指引為何？
    a:
    - 肌耐力訓練採每組至少 12 次、每動作通常 2–3 組。
    - 雖然反覆次數高，因舉起負荷較輕且組數較少，整體訓練量負荷不一定過高。
    detail: 此組數與次數指引不包括熱身組，且表 17.11 通常適用核心動作；處方仍須配合運動員訓練狀態與主要訓練目標。
