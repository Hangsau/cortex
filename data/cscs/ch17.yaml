- id: training-frequency
  title: 步驟三：訓練頻率 Training Frequency
  desc: ''
  tag: Frequency
  items:
  - id: ch17.training-frequency.i01
    q: 訓練狀態對每週訓練頻率的指引為何？
    a:
    - 初學者：每週 2–3 節；中階者：每週 3–4 節；進階者：每週 4–7 節。
    detail: 傳統上許多運動員建議每週三次；隨適應與體能改善，可考慮增至四次，並在更多訓練後再增加。頻率必須配合運動員所需的恢復日數。
    terms:
    - training-frequency
    - training-status
    numbers:
