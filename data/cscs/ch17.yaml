    locator: 'Step 5: Training Load and Repetitions > 1RM and Multiple-RM Testing Options > Multiple-RM Testing Based on Goal Repetitions'
  - id: ch17.load-repetitions.i04
    q: 不同訓練目標的負荷與目標次數如何指派？
    a:
    - 肌力：至少 85% 1RM、至多 6 次；肌肥大：67–85% 1RM、6–12 次；肌耐力：至多 67% 1RM、至少 12 次。
    - 爆發力的單次出力項目：80–90% 1RM、1–2 次；多次出力項目：75–85% 1RM、3–5 次。
    detail: RM 連續帶表示各訓練效益在任何 RM 都會混合，但會偏重某一結果。%1RM 表只應作估算特定 RM 的指引；其在超過 75% 1RM、少於 10 次時最準，且表中的次數是假定單一組。教材自己點出爆發力這一列與負荷－次數關係表不一致：照關係表，3–5 次對應的是 93–87% 1RM，而非爆發力表列的 75–85%。書上的解釋是爆發力動作在任何次數安排下都不能給到最大負荷——動作品質會在真正力竭之前先崩壞，所以那些負荷「不是真正的反覆最大重量（repetition maximums）」，較輕才能維持最大速度以發展功率。實務上爆發力動作每組通常限五次以內，負荷可達 10RM（約 75% 1RM）。
    terms:
    - one-repetition-maximum
    - repetition-maximum
    - goal-repetitions
    - specificity
