  - id: ch17.training-frequency.i04
    q: 分部位課表（split routine）適合誰？
    a:
    - 中階或進階阻力訓練者可用分部位課表，在不同日訓練不同肌群。
    - 藉由分組訓練部分身體或特定肌群，可在接近每日訓練時仍讓相近訓練課之間有足夠恢復。
    detail: 分部位課表不違反同一肌群的恢復原則；它改變的是不同部位的安排，而非要求同一肌群每天重訓。
    terms:
