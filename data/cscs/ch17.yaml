  - id: ch17.training-frequency.i08
    q: 為何賽季中通常降低阻力訓練頻率？
    a:
    - 賽季中專項練習的重點提高，重量室可用時間因此減少，阻力訓練頻率也隨之降低。
    - 即使受訓練運動員有能力每週完成四節以上阻力訓練，運動的其他時間需求也可能不允許。
    detail: 賽季中的阻力訓練目標是維持季前目標；降低頻率是處理每日無法容納所有訓練模式的時間與恢復取捨。
