    locator: 'Step 5: Training Load and Repetitions > 1RM and Multiple-RM Testing Options > Multiple-RM Testing Based on Goal Repetitions'
  - id: ch17.load-repetitions.i06
    q: 重、輕、中日的負荷變化如何安排？
    a:
    - 每週僅一日以爆發與其他核心動作的完整 RM 負荷作為重日；輕日取重日負荷的 80%，中日取 90%，但維持原定目標次數。
    - 即使運動員能做更多次，輕日與中日也不增加超過指定目標次數的反覆。
    detail: 此策略以刻意降低其他訓練日的負荷，平衡重負荷造成的過度訓練風險，同時保留頻率與訓練量；輔助動作的負荷在此例整週維持不變。
    terms:
    - repetition-maximum
    - core-exercise
    - goal-repetitions
    numbers:
    - v: '80'
      unit: '%'
      of: 輕日相對重日之爆發與其他核心動作負荷
    - v: '90'
      unit: '%'
      of: 中日相對重日之爆發與其他核心動作負荷
