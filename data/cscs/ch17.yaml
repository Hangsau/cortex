      unit: '%1RM'
      of: 非舉重式多關節爆發動作與單關節肌肉動作通常達峰值功率的負荷範圍
    - v: '75–90'
      unit: '%1RM'
      of: 可高度負荷的抓舉、高翻等舉重衍生動作實務建議負荷
