    - ch05.overtraining.i02
    locator: 'Step 5: Training Load and Repetitions > Variation of the Training Load'
  - id: ch17.load-repetitions.i07
    q: 2-for-2 rule（兩加二法則）何時增加負荷？
    a:
    - 若運動員在某動作的最後一組，連續兩次訓練都比指定目標多完成至少 2 次，下一次訓練就應增加該動作重量。
    detail: 規則針對「最後一組」與「連續兩次」的實際表現，而非只看某一次組數；教練需持續監測並記錄反應，才能決定何時與增加多少負荷。
    terms:
    - two-for-two-rule
    - goal-repetitions
    - load
    numbers:
    - v: '2'
      unit: 次
      of: 最後一組超過指定目標所需的最少額外反覆次數
    - v: '2'
      unit: 連續訓練次數
      of: 觸發下次訓練增加負荷所需的連續成功次數
    concepts:
