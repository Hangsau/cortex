  - id: ch17.training-volume.i03
    q: 肌力訓練的核心與輔助動作組數指引為何？
    a:
    - 肌力訓練的核心動作：每組至多 6 次、2–6 組。
    - 輔助動作通常可採 1–3 組。
    detail: 表 17.11 的組數與次數不含熱身組，且通常只適用核心動作；文獻回顧對核心動作可促進最大肌力的組數範圍並不完全一致。
    terms:
