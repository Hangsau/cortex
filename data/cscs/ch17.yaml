  - id: ch17.principles-exam-tips.i08
    q: 力量－速度關係如何影響爆發力負荷的選擇？
    a:
    - 向心肌力越大，肌肉縮短與動作速度越慢；1RM 能產生最大力，但功率輸出較低。
    - 最大功率出現在中等速度、輕至中等負荷。非舉重式多關節爆發動作與單關節資料的峰值功率通常在體重（0%）至 30% 1RM。
    - 對可高負荷的抓舉、高翻等舉重衍生動作，實務上最有效的負荷約為 75–90% 1RM。
    detail: 這些範圍適用於不同動作類型，不能把 75–90% 1RM 當成所有爆發動作的最大功率負荷；教材也指出輕負荷動作可能因一般器材與安全性而難正確執行。
    terms:
    - one-repetition-maximum
    - power-exercise
    numbers:
