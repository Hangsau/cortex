meta:
  chapter: ch10
  source: data/cscs/ch10.yaml
questions:
- id: ch10.pre-competition.i01.q1
  item: ch10.pre-competition.i01
  dco: sf3.A.2
  lang: zh
  cognitive: recall
  stem: 賽前餐（precompetition meal）的兩項主要目的為何？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition
  options:
  - text: 提供液體維持水合，並以碳水化合物維持糖原與減少飢餓感
    correct: true
  - text: 補充大量蛋白質啟動肌肉合成並加速胃部排空
    correct: false
    why_wrong: 把賽前餐當成阻力訓練後的恢復餐；書中強調的是液體與碳水化合物，而非高量蛋白質。
  - text: 限制液體避免中途如廁，並以脂肪延緩胃部排空時間
    correct: false
    why_wrong: 把賽前餐的方向寫反；水合是書中明列的主要目的之一，且脂肪會延緩胃排空而提高腸胃不適風險。
- id: ch10.pre-competition.i02.q1
  item: ch10.pre-competition.i02
  dco: sf3.A.2
  lang: en
  cognitive: application
  stem: An aerobic endurance athlete weighs 60 kg and will start competition in 5 hours. What is the most appropriate pre-event water or sports drink intake?
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Aerobic Endurance Sports
  options:
  - text: 300–420 ml
    correct: true
  - text: 30–42 ml
    correct: false
    why_wrong: Shifts the decimal one place, as if 60 kg called for 0.5 to 0.7 ml per kg; the recommendation is 5 to 7 ml per kg.
  - text: 3.0–4.2 L
    correct: false
    why_wrong: Confuses the fluid recommendation with an exaggerated figure; the upper bound at 7 ml/kg for 60 kg is well under 1 L.
- id: ch10.pre-competition.i03.q1
  item: ch10.pre-competition.i03
  dco: sf3.A.2
  lang: zh
  cognitive: application
  stem: 一名耐力跑者賽前 2 小時進食，依教材每公斤體重最應攝取多少碳水化合物？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Aerobic Endurance Sports
  options:
  - text: 約 1 g
    correct: true
  - text: 約 5 g
    correct: false
    why_wrong: 把 4 小時以上餐食的每公斤 1–4 g 區間直接套到賽前 2 小時，會顯著過量並提高腸胃不適風險。
  - text: 約 0.2 g
    correct: false
    why_wrong: 把量壓得太低；書中對賽前 2 小時仍建議每公斤約 1 g 碳水化合物。
- id: ch10.pre-competition.i05.q1
  item: ch10.pre-competition.i05
  dco: sf3.A.2
  lang: en
  cognitive: recall
  stem: Which statement about glycemic index of pre-event carbohydrates is most consistent with the textbook?
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition
  options:
  - text: Both high- and low-GI options are acceptable pre-event
    correct: true
  - text: Rapid-insulin carbohydrate impairs performance at event onset
    correct: false
    why_wrong: Treats the early dip in blood glucose as a performance cost; the chapter notes it returns to normal about 20 minutes in and leaves performance unchanged.
  - text: Low-GI carbohydrate is the recommended default before events
    correct: false
    why_wrong: Turns the absence of a demonstrated difference into a preference for low-GI food; the chapter leaves both ends of the index open to the athlete.
- id: ch10.pre-competition.i07.q1
  item: ch10.pre-competition.i07
  dco: sf3.A.2
  lang: zh
  cognitive: recall
  stem: 賽前為了減少腸胃不適，下列哪一類成分最應避免？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Minimizing Gastrointestinal Issues
  options:
  - text: 山梨醇與甘露醇等糖醇類
    correct: true
  - text: 簡單低脂的白米飯品項
    correct: false
    why_wrong: 低脂且熟悉的澱粉是書中建議的賽前食物；把焦點放在碳水類型而非特定糖醇來源。
  - text: 練習中已用過的電解質飲料
    correct: false
    why_wrong: 把熟悉的賽前補給寫成應避免；書中反而建議選用練習中已嘗試過的食物與飲料。
- id: ch10.pre-competition.i08.q1
  item: ch10.pre-competition.i08
  dco: sf3.A.2
  lang: en
  cognitive: recall
  stem: Before competition, a strength and conditioning professional is checking hydration status by urine specific gravity. Which reading best indicates adequate pre-event hydration?
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Aerobic Endurance Sports
  options:
  - text: Below 1.020
    correct: true
  - text: About 1.025
    correct: false
    why_wrong: Sits just above the 1.020 cutoff, so the urine is still too concentrated to show adequate pre-event hydration.
  - text: Above 1.030
    correct: false
    why_wrong: Falls well beyond the cutoff; readings this high reflect concentrated urine from an underhydrated athlete.
- id: ch10.carb-loading.i02.q1
  item: ch10.carb-loading.i02
  dco: sf3.A.2
  lang: zh
  cognitive: application
  stem: 一名 70 kg 跑者預備執行 3 天的碳水化合物超補方案，這 3 天每日最應攝取的碳水化合物量為何？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Precompetition Nutrition > Carbohydrate Loading
  options:
  - text: 560–700 g
    correct: true
  - text: 210–280 g
    correct: false
    why_wrong: 把每公斤 8–10 g 的超補區間少算成 3–4 g；那是普通訓練日而非超補期間的攝取量。
  - text: 1,680–2,100 g
    correct: false
    why_wrong: 把 3 天的總量當成每日攝取量；題目問的是超補期間每一天要吃多少。
- id: ch10.during-event.i01.q1
  item: ch10.during-event.i01
  dco: sf3.A.2
  lang: zh
  cognitive: recall
  stem: 賽中補水時，運動造成的體重流失最應避免超過多少？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition
  options:
  - text: 體重的 2%
    correct: true
  - text: 體重的 5%
    correct: false
    why_wrong: 把脫水的上限放得太寬；書中以 2% 為避免過熱與表現下降的具體界線。
  - text: 體重的 10%
    correct: false
    why_wrong: 把脫水容許值拉到危及健康的程度，遠高於書中所列的可接受上限。
- id: ch10.during-event.i02.q1
  item: ch10.during-event.i02
  dco: sf3.A.2
  lang: zh
  cognitive: application
  stem: 熱天長時間運動時，下列哪一種運動飲料的碳水化合物濃度最可能延遲胃排空？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > During-Event Nutrition
  options:
  - text: 濃度高於 8%
    correct: true
  - text: 濃度 6% 至 8%
    correct: false
    why_wrong: 把書中視為可能理想的區間當作會延遲胃排空的濃度；延遲效應被書中歸在更高的濃度。
  - text: 濃度 2% 至 4%
    correct: false
    why_wrong: 把濃度拉得太低，那已屬於無法在長時間活動中提供足量碳水化合物的稀釋飲料。
- id: ch10.post-competition.i01.q1
  item: ch10.post-competition.i01
  dco: sf3.A.2
  lang: zh
  cognitive: application
  stem: 一名耐力運動員結束比賽後希望儘速回補糖原，在第一個小時內最應攝取的碳水化合物量為何（以每公斤體重計算）？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition > Aerobic Endurance Events
  options:
  - text: 1.0–1.85 g
    correct: true
  - text: 0.2–0.5 g
    correct: false
    why_wrong: 給出過低的碳水化合物量；那是無法在 30–60 分鐘內達到快速糖原回補的攝取級距。
  - text: 3.0–4.0 g
    correct: false
    why_wrong: 把攝取量推得過量；那已是書中以多餘熱量不易執行的高量級距。
- id: ch10.post-competition.i04.q1
  item: ch10.post-competition.i04
  dco: sf3.A.2
  lang: en
  cognitive: application
  stem: After endurance exercise, an athlete is told to ingest at least 10 g of protein within 3 hours. What is the most appropriate interpretation of this guidance?
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition
  options:
  - text: A general lower bound, since exact dose and timing remain unclear
    correct: true
  - text: A precisely defined minimum that must be met on every occasion
    correct: false
    why_wrong: Treats a general guideline as a hard threshold; the chapter explicitly notes the precise dose and timing are not established.
  - text: A recommendation reserved for resistance-trained athletes only
    correct: false
    why_wrong: Mislocates the recommendation; the 10 g figure is framed for general post-endurance intake, not for resistance training.
- id: ch10.post-competition.i06.q1
  item: ch10.post-competition.i06
  dco: sf3.A.2
  lang: zh
  cognitive: analysis
  stem: 賽後運動員的碳水化合物攝取量低於每公斤體重每小時 1.2 g，此時加入蛋白質最可能產生下列何種作用？
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition > Aerobic Endurance Events
  options:
  - text: 提高糖原的儲存速率
    correct: true
  - text: 顯著增加肝醣新生使血糖過高
    correct: false
    why_wrong: 把焦點放在血糖過高；書中談的是肌肉糖原儲存速率，不是肝醣新生或血糖變化。
  - text: 阻斷糖原再合成的胰島素路徑
    correct: false
    why_wrong: 把書中未提及的「阻斷」寫成加入蛋白質的後果；書中反而把它視為有助糖原回補的搭配。
- id: ch10.obesity-assessment.i05.q1
  item: ch10.obesity-assessment.i05
  dco: sf3.A.4
  lang: zh
  cognitive: application
  stem: 一名運動員想了解每日能量消耗的主要組成，下列哪一項最符合教材所述的三大組成比例？
  locator: Nutrition Strategies for Altering Body Composition
  options:
  - text: 65–70% 來自 BMR，20–30% 來自身體活動，10–15% 來自飲食誘發性產熱
    correct: true
  - text: 20–30% 來自 BMR，65–70% 來自身體活動，10–15% 來自飲食誘發性產熱
    correct: false
    why_wrong: 把 BMR 與身體活動的比例對調；書中 BMR 是最大組成，身體活動次之。
  - text: 10–15% 來自 BMR，20–30% 來自身體活動，65–70% 來自飲食誘發性產熱
    correct: false
    why_wrong: 把飲食誘發性產熱寫成最大組成；書中其實是三項中比例最小的一項。
- id: ch10.obesity-assessment.i06.q1
  item: ch10.obesity-assessment.i06
  dco: sf3.A.4
  lang: en
  cognitive: application
  stem: A 90 kg athlete has a lean body mass of 70 kg. Using the Cunningham equation, what is the most appropriate estimated resting metabolic rate?
  locator: Nutrition Strategies for Altering Body Composition
  options:
  - text: 2,040 kcal per day
    correct: true
  - text: 1,540 kcal per day
    correct: false
    why_wrong: Omits the 500 kcal constant and reports only 22 multiplied by lean body mass; the equation adds that constant.
  - text: 2,480 kcal per day
    correct: false
    why_wrong: Applies the coefficient of 22 to the total body mass of 90 kg; the Cunningham equation uses lean body mass only.
- id: ch10.weight-gain.i02.q1
  item: ch10.weight-gain.i02
  dco: sf3.A.4
  lang: en
  cognitive: application
  stem: A strength athlete in the off-season aims to gain lean mass. Which daily protein intake in grams per kilogram of body mass best supports that goal?
  locator: Nutrition Strategies for Altering Body Composition > Weight Gain
  options:
  - text: 1.5–2.0
    correct: true
  - text: 0.8–1.0
    correct: false
    why_wrong: Uses the general adult RDA range, which the chapter does not treat as the gain-specific target.
  - text: 3.0–3.5
    correct: false
    why_wrong: Exceeds the gain range and would likely make the energy surplus difficult to sustain due to protein's satiety effect.
- id: ch10.weight-loss.i02.q1
  item: ch10.weight-loss.i02
  dco: sf3.A.4
  lang: zh
  cognitive: application
  stem: 一名運動員想在減脂期間維持肌肉，依教材蛋白質攝取量與能量不足最應為何？
  locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss
  options:
  - text: 蛋白質 1.8–2.7 g/kg，搭配約 500 kcal 不足
    correct: true
  - text: 蛋白質 0.8–1.0 g/kg，搭配約 1,000 kcal 不足
    correct: false
    why_wrong: 把蛋白質降到一般 RDA 區間並把熱量缺口拉大；書中指出節食會降低肌肉蛋白合成，需要較高蛋白質與較小熱量缺口。
  - text: 蛋白質 3.0–3.5 g/kg，搭配約 500 kcal 不足
    correct: false
    why_wrong: 把蛋白質推到章內任何級距之上；書中保肌減脂的上限是每公斤體重 2.7 g，再高並未帶來額外好處。
- id: ch10.weight-loss.i03.q1
  item: ch10.weight-loss.i03
  dco: sf3.A.4
  lang: en
  cognitive: analysis
  stem: Why does a low-carbohydrate diet most often produce rapid initial weight loss that can rebound once carbohydrates are reintroduced?
  locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Low-Carbohydrate Diets
  options:
  - text: Because each gram of glycogen is stored with 3–4 g of water, so glycogen depletion causes water loss
    correct: true
  - text: Because low-carbohydrate diets permanently raise basal metabolic rate by 30%
    correct: false
    why_wrong: Overstates and overgeneralizes a metabolic claim; the chapter does not document a 30% permanent BMR change from low-carbohydrate intake.
  - text: Because low-carbohydrate diets force the body to excrete all stored triglycerides in the first week
    correct: false
    why_wrong: Misidentifies the mechanism as instantaneous triglyceride excretion; rapid initial changes in the textbook come from water tied to glycogen.
- id: ch10.weight-loss.i07.q1
  item: ch10.weight-loss.i07
  dco: sf3.A.4
  lang: zh
  cognitive: analysis
  stem: 一名教練注意到運動員頻繁使用三溫暖與利尿劑以達到比賽量級，下列何者最符合肌力與體能專業人員在此情境的職責？
  locator: Nutrition Strategies for Altering Body Composition > Weight (Fat) Loss > Rapid Weight Loss
  options:
  - text: 辨識徵象、轉介合格人員並與教練團隊溝通
    correct: true
  - text: 直接禁止該運動員參賽以保護團隊成績
    correct: false
    why_wrong: 把處置權推到肌力與體能專業人員身上；書中強調專業人員的角色是辨識與溝通，而非單獨決定禁賽。
  - text: 替運動員擬定低熱量菜單並監控脫水程度
    correct: false
    why_wrong: 越界承擔營養與醫療決策；書中把營養與醫療決策交給醫師與註冊營養師。
- id: ch10.eating-disorders.i06.q1
  item: ch10.eating-disorders.i06
  dco: sf3.A.1
  lang: zh
  cognitive: analysis
  stem: 一名越野跑選手出現限制飲食、跳過正餐並偶爾服用瀉藥的行為，最應如何解讀？
  locator: Feeding and Eating Disorders
  options:
  - text: 屬於失序飲食徵象，越野跑風險高，應進一步評估
    correct: true
  - text: 已符合完整飲食疾患診斷，可由教練直接判定
    correct: false
    why_wrong: 把失序飲食的徵象直接當成完整診斷；書中明確指出失序飲食不等於已符合完整診斷標準。
  - text: 屬於越野跑常見的正常現象，不必過度擔憂
    correct: false
    why_wrong: 把高風險行為寫成正常現象；書中越野跑與審美運動被列為較易出現失序飲食的類別。
- id: ch10.post-competition.i03.q1
  item: ch10.post-competition.i03
  dco: sf3.A.2
  lang: en
  cognitive: analysis
  stem: An athlete has more than 24 hours before the next session. What is the most appropriate implication for immediate post-exercise carbohydrate intake?
  locator: Precompetition, During-Event, and Postcompetition Nutrition > Postcompetition Nutrition > Aerobic Endurance Events
  options:
  - text: Immediate intake is not mandatory, as long as enough carbohydrate is taken within 24 hours
    correct: true
  - text: Immediate intake is required regardless of how long until the next session
    correct: false
    why_wrong: Treats immediate post-exercise feeding as universally required; the chapter restricts this urgency to short recovery windows.
  - text: Carbohydrate intake can be skipped entirely when recovery time exceeds 24 hours
    correct: false
    why_wrong: Overgeneralizes the flexibility; with >24 hours to recover, sufficient carbohydrate is still needed, just not on an immediate schedule.
