meta:
  chapter: ch15
  source: data/cscs/ch15.yaml
questions:
- id: ch15.body-positioning.i02.q1
  item: ch15.body-positioning.i02
  dco: pa2.B.1.a
  lang: zh
  cognitive: recall
  stem: 在臥椅上做仰臥動作時，教材所稱的五點身體接觸姿勢，對軀幹與下肢的要求為何？
  locator: Fundamentals of Exercise Technique > Stable Body and Limb Positioning
  options:
  - text: 上背與臀部穩定貼靠椅面，雙腳平放地面
    correct: true
  - text: 腰椎刻意拱起離開椅面，雙腳踩在椅面上
    correct: false
    why_wrong: 拱腰與把腳放上椅面都讓接觸點減少，教材要求臀部坐實且左右腳平踩地面。
  - text: 肩胛主動離開椅面，改以足尖點地維持彈性
    correct: false
    why_wrong: 肩膀與上背本身就是五個接觸點之一，足尖點地也不符合雙腳平放的規定。
- id: ch15.breathing.i04.q1
  item: ch15.breathing.i04
  dco: pa2.B.1.a
  lang: en
  cognitive: recall
  stem: Which best describes the Valsalva maneuver as defined in the chapter?
  locator: Fundamentals of Exercise Technique > Breathing Considerations
  options:
  - text: Exhaling against a closed glottis while contracting the abdominal and rib cage musculature
    correct: true
  - text: Inhaling deeply at the start of each rep and holding the breath through the full range of motion
    correct: false
    why_wrong: Reverses the mechanism; the maneuver is exhalation against a closed glottis, not a sustained deep inhalation.
  - text: Breathing normally throughout the set and tightening the trunk only at the sticking point
    correct: false
    why_wrong: Describes paced breathing with selective bracing; the chapter defines the maneuver as a single closed-glottis effort producing a fluid-ball rigidity zone.
- id: ch15.breathing.i06.q1
  item: ch15.breathing.i06
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  stem: 一名已有兩年阻力訓練經驗的大學美式足球員準備執行高負荷背蹲舉時，下列哪一個策略最能協助維持脊椎排列與支撐？
  locator: Fundamentals of Exercise Technique > Breathing Considerations
  options:
  - text: 在負重階段對閉合聲門呼氣並收縮腹肌與肋廓肌
    correct: true
  - text: 在整組反覆中維持正常節奏呼吸
    correct: false
    why_wrong: 在高負荷結構性動作中放棄腹內壓的提升，會失去教材所說的脊椎支撐效益。
  - text: 在離心階段頂點深深吸氣並全程憋氣到動作結束
    correct: false
    why_wrong: 憋氣至反覆結束已超過教材所說的「一到二秒」上限，並可能讓血壓顯著上升。
- id: ch15.grips.i04.q1
  item: ch15.grips.i04
  dco: pa2.B.4.a
  lang: zh
  cognitive: application
  stem: 下列哪一種握法最常被建議用於抓舉等需要較強握力的爆發力動作？
  locator: Fundamentals of Exercise Technique > Handgrips
  options:
  - text: 拇指在食指與中指下方的正手握變式
    correct: true
  - text: 一手正手、另一手反手的交替握
    correct: false
    why_wrong: 把交替握誤當成抓舉的常見握法；交替握常用於硬舉等單側控制情境，不是爆發力動作的首選。
  - text: 拇指未環繞槓鈴的開放握或假握
    correct: false
    why_wrong: 採用假握；缺少拇指支撐會降低握力，與爆發力動作對握力的需求相反。
- id: ch15.grips.i07.q1
  item: ch15.grips.i07
  dco: pa2.B.4.a
  lang: zh
  cognitive: application
  stem: 安排一名新進運動員學習抓舉握距時，下列哪一種估算方式最符合教材所述？
  locator: Fundamentals of Exercise Technique > Handgrips
  options:
  - text: 以拳頭到對側肩或肘到肘的距離估算
    correct: true
  - text: 以略寬於肩寬、雙手落在膝外的距離估算
    correct: false
    why_wrong: 這是高翻握距的估算方式，不是抓舉；抓舉握距明顯寬於高翻。
  - text: 約肩寬的一般動作握距估算
    correct: false
    why_wrong: 採用一般動作的肩寬握距；抓舉需要寬握以容納過頭接槓的肩帶活動度。
- id: ch15.lower-body.i01.q1
  item: ch15.lower-body.i01
  dco: pa2.B.1.a
  lang: zh
  cognitive: analysis
  stem: 一名教練觀察運動員做背蹲舉時，發現下蹲末段軀幹開始圓背，下列哪一個處置最能呼應教材對下蹲終點的規範？
  locator: Back Squat
  options:
  - text: 大腿平行地面、軀幹前屈或腳跟離地，三者先發即停
    correct: true
  - text: 為了加深刺激，要求運動員在圓背姿勢下繼續下蹲到底
    correct: false
    why_wrong: 以動作深度取代教材列出的終點條件；圓背本身已是教材列出的停止時機之一。
  - text: 把腳跟墊高讓運動員可以蹲得更深並延長動作範圍
    correct: false
    why_wrong: 改變器材配置以延長下蹲；教材沒有把腳跟墊高列為背蹲舉的建議。
- id: ch15.lower-body.i03.q1
  item: ch15.lower-body.i03
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  stem: 教練示範硬舉起始姿勢時，要求槓鈴位於脛骨前方約一英吋。這個位置最主要的功能為何？
  locator: Deadlift
  options:
  - text: 讓槓鈴落在前腳掌上方，便於沿脛骨上拉
    correct: true
  - text: 讓槓鈴遠離脛骨以避免摩擦造成脛骨擦傷
    correct: false
    why_wrong: 把位置選擇歸因於避免摩擦；教材把一英吋定位為功能性距離，目的是對齊前腳掌並維持槓鈴路徑。
  - text: 讓槓鈴落在腳掌中段以減輕下背負荷
    correct: false
    why_wrong: 改寫為腳掌中段；教材明定槓鈴在前腳掌上方，不是中段。
- id: ch15.power-exercises-technique.i02.q1
  item: ch15.power-exercises-technique.i02
  dco: pa2.B.4.a
  lang: en
  cognitive: application
  stem: During a power exercise, the bar moves out of control in front of the athlete. Which response best aligns with the chapter's guidance?
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises
  options:
  - text: Push the bar away from the body or drop the barbell
    correct: true
  - text: Have the spotter catch the bar at the lifter's chest
    correct: false
    why_wrong: Recommends spotting a power exercise; the chapter explicitly states power exercises should not be spotted.
  - text: Step backward and try to slow the bar with the arms
    correct: false
    why_wrong: Invites contact between the athlete and an uncontrolled bar; the chapter instructs clearing the area and pre-teaching how to fail safely.
- id: ch15.power-exercises-technique.i03.q1
  item: ch15.power-exercises-technique.i03
  dco: pa2.B.4.a
  lang: zh
  cognitive: application
  stem: 運動員進行爆發力動作時，槓鈴於頭後失去控制。依教材對「如何失誤」的指引，最合適的處置為何？
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises
  options:
  - text: 立刻放開槓鈴並向前跳開
    correct: true
  - text: 倒退幾步讓保護者從後方接槓
    correct: false
    why_wrong: 仍依賴保護者介入，教材明定爆發力動作不予保護，須由運動員自行避開失控的槓鈴。
  - text: 嘗試以肩部與上背力量撐住槓鈴
    correct: false
    why_wrong: 試圖用軀幹阻擋下落中的槓鈴，教材要求跳開而非承受衝擊。
- id: ch15.power-exercises.i05.q1
  item: ch15.power-exercises.i05
  dco: pa2.B.4.a
  lang: zh
  cognitive: analysis
  stem: 比較力量抓舉與力量高翻的接槓姿勢，下列哪一項差異最能反映兩者動作目的的不同？
  locator: Power Snatch (and Hang Power Snatch Variation)
  options:
  - text: 抓舉伸肘穩定於頭頂而高翻架於鎖骨
    correct: true
  - text: 兩者都把槓接在頭頂，只差別在握距寬度
    correct: false
    why_wrong: 將高翻的接槓位置誤置於頭頂，高翻接在前三角肌與鎖骨，與抓舉的過頭位置不同。
  - text: 力量抓舉接在肩膀後方，高翻接在肩膀前方
    correct: false
    why_wrong: 把力量抓舉接槓位置寫到頸後，教材只描述從前方路徑完成過頭穩定。
- id: ch15.spotting-when.i01.q1
  item: ch15.spotting-when.i01
  dco: pa2.B.1.b
  lang: zh
  cognitive: application
  stem: 一名新進的體能教練正在規劃哪些自由重量動作需要安排保護者。下列哪一類動作最需要一名以上的保護者？
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved
  options:
  - text: 槓鈴在頭上、背上、前肩架或越過臉部的動作
    correct: true
  - text: 啞鈴二頭肌彎舉與三頭肌下壓等單關節機械動作
    correct: false
    why_wrong: 將保護者原則套用至單關節機械動作；教材把保護者需求連結到槓鈴位置與過臉風險，不是機械動作本身。
  - text: 懸垂高翻等從大腿高度開始的爆發力動作
    correct: false
    why_wrong: 把爆發力動作歸入須保護的類別；教材明定爆發力動作不予保護，須教導運動員自行避開失控的槓。
- id: ch15.spotting-how.i02.q1
  item: ch15.spotting-how.i02
  dco: pa2.B.1.b
  lang: zh
  cognitive: analysis
  stem: 一名新手保護者試圖在啞鈴上斜臥推時扶著運動員的上臂。這個位置最容易在何種情況下失效？
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Over-the-Face Exercises
  options:
  - text: 當運動員肘部屈曲塌陷時，保護者無法阻止啞鈴撞向臉或胸
    correct: true
  - text: 當運動員改為閉合正手握時，保護者會誤抓手腕
    correct: false
    why_wrong: 把風險歸因於握法變化；教材指出的風險在於肘塌陷時保護者無法攔截啞鈴，不是握法造成的混淆。
  - text: 當啞鈴重量低於運動員暖組負荷時，保護者的手感會誤判
    correct: false
    why_wrong: 把風險歸因於負荷過低；教材強調的是保護位置，而非負荷大小。
- id: ch15.spotting-how.i05.q1
  item: ch15.spotting-how.i05
  dco: pa2.B.1.b
  lang: en
  cognitive: analysis
  stem: A lifter is attempting a near-maximal back squat with a bar across the back. Which set of conditions best justifies adding a second spotter?
  locator: Spotting Free Weight Exercises > Number of Spotters
  options:
  - text: The load exceeds what one spotter can safely manage given their strength and experience
    correct: true
  - text: The athlete prefers verbal cues during heavy sets, regardless of load
    correct: false
    why_wrong: Bases the decision on coaching preference; the chapter ties the number of spotters to load, experience, and the spotter's physical strength.
  - text: The athlete has performed the same lift for several sessions and feels confident
    correct: false
    why_wrong: Uses athlete confidence as the trigger; confidence does not change the load-versus-spotter-capacity judgment the chapter prescribes.
- id: ch15.spotting-how.i01.q1
  item: ch15.spotting-how.i01
  dco: pa2.B.1.b
  lang: en
  cognitive: analysis
  stem: A spotter is preparing to assist a lifter on a barbell exercise in which the bar passes over the face. Which grip choice and rationale best reflect the chapter's spotting guidance?
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Over-the-Face Exercises
  options:
  - text: An alternated grip slightly narrower than the lifter's, to keep the bar from rolling onto the face or neck
    correct: true
  - text: A supinated grip matched to the lifter's width, because it mirrors the lifter's hand position
    correct: false
    why_wrong: Adopts a same-width supinated grip; the chapter specifies a narrower alternated grip for over-the-face bars and treats a supinated hold as an option open to the spotter, not a requirement.
  - text: A hook grip used by the spotter for added security, because the lifter is also using a hook grip
    correct: false
    why_wrong: Transfers the lifter's hook grip to the spotter; the chapter reserves the hook grip for the lifter's own power exercises and does not extend it to spotters.
- id: ch15.grips.i03.q1
  item: ch15.grips.i03
  dco: pa2.B.4.a
  lang: en
  cognitive: application
  stem: A coach watches an athlete lift a bar with one palm turned back toward the body and the other turned forward. Which grip name from the chapter best fits that hand arrangement?
  locator: Fundamentals of Exercise Technique > Handgrips
  options:
  - text: Alternated grip, which pairs one pronated hand with one supinated hand
    correct: true
  - text: Closed pronated grip, with both palms facing away from the athlete
    correct: false
    why_wrong: A pronated grip turns both palms the same way, so it cannot be the grip the chapter defines by opposing hand positions.
  - text: Hook grip, with the thumb pinned beneath the first two fingers
    correct: false
    why_wrong: The chapter lists this thumb placement as a separate variation used for extra pulling security, not as the name for opposing palms.
- id: ch15.body-positioning.i04.q1
  item: ch15.body-positioning.i04
  dco: pa2.B.2.a
  lang: zh
  cognitive: application
  stem: 運動員使用凸輪式腿伸展器械時，主要關節應對齊哪個位置以確保執行安全？
  locator: Fundamentals of Exercise Technique > Stable Body and Limb Positioning
  options:
  - text: 器械旋轉軸
    correct: true
  - text: 阻力片的中心
    correct: false
    why_wrong: 把調整對位誤導到阻力片；旋轉軸才是決定動作弧線與受力點的位置。
  - text: 座椅前緣中央
    correct: false
    why_wrong: 以座椅幾何為對位依據；座椅只決定坐姿長度，不決定關節與阻力弧線的對齊。
- id: ch15.body-positioning.i06.q1
  item: ch15.body-positioning.i06
  dco: pa2.A.1
  lang: zh
  cognitive: recall
  stem: 阻力訓練追求全關節活動範圍時，教材為哪些關節另外標明了例外？
  locator: Fundamentals of Exercise Technique > Range of Motion and Speed
  options:
  - text: 弓步的後腳膝關節與深蹲的椎間關節
    correct: true
  - text: 臥推的肩關節與提踵的踝關節
    correct: false
    why_wrong: 教材沒有把肩關節或踝關節列為例外，這兩處可依動作要求完成全程範圍。
  - text: 二頭彎舉的肘關節與硬舉的髖關節
    correct: false
    why_wrong: 肘關節與髖關節在書中都以完整範圍示範，不屬於無法達成或不建議的那一類。
- id: ch15.breathing.i02.q1
  item: ch15.breathing.i02
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  stem: 多數阻力動作中，下列哪一個動作位置最符合教材所推薦的吐氣時機？
  locator: Fundamentals of Exercise Technique > Breathing Considerations
  options:
  - text: 通過向心階段的黏滯點時
    correct: true
  - text: 動作頂端鎖定關節之時
    correct: false
    why_wrong: 把吐氣錯置到頂端；教材以通過黏滯點為吐氣時機，不是動作完成時。
  - text: 動作底端最低位置之時
    correct: false
    why_wrong: 把吐氣錯置到底部；此處通常不是教材所指的費力相位交界。
- id: ch15.breathing.i05.q1
  item: ch15.breathing.i05
  dco: pa2.B.1.a
  lang: en
  cognitive: application
  stem: Which of the following is most likely a benefit of the Valsalva maneuver during a heavy structural lift?
  locator: Fundamentals of Exercise Technique > Breathing Considerations
  options:
  - text: Increased trunk rigidity to support the spine
    correct: true
  - text: Reduced need for a weight belt during submaximal work
    correct: false
    why_wrong: Conflates the maneuver's intra-abdominal pressure effect with equipment substitution; the text addresses spinal support, not belt replacement.
  - text: Lowered resting blood pressure throughout the set
    correct: false
    why_wrong: Confuses the Valsalva response with a hypotensive effect; the maneuver is associated with sharp rises in blood pressure, not reductions.
- id: ch15.breathing.i07.q1
  item: ch15.breathing.i07
  dco: pa2.B.1.a
  lang: en
  cognitive: recall
  stem: According to the text, what is the upper limit for breath-holding duration when performing the Valsalva maneuver?
  locator: Fundamentals of Exercise Technique > Breathing Considerations
  options:
  - text: About 1 to 2 seconds
    correct: true
  - text: About 5 to 6 seconds
    correct: false
    why_wrong: Confuses the breath-hold ceiling with a typical rep duration; the text explicitly caps the hold near 1 to 2 seconds.
  - text: About 10 to 12 seconds
    correct: false
    why_wrong: Treats the hold as if it could span an entire set; doing so would violate the text's safety limit and risk syncope.
- id: ch15.exercise-technique-fundamentals.i02.q1
  item: ch15.exercise-technique-fundamentals.i02
  dco: pa2.B.1.a
  lang: zh
  cognitive: analysis
  stem: 教練想整理一份適用於多數自由重量與器械動作的技術檢查表，下列哪一組最符合教材所列的共同要素？
  locator: Fundamentals of Exercise Technique
  options:
  - text: 握法、身體位置、動作範圍與速度、呼吸方式
    correct: true
  - text: 護腰帶、勾握、起槓程序與落槓高度
    correct: false
    why_wrong: 護腰帶與起槓只是部分動作另外需要的程序，教材沒有把它們列為多數動作共有的要素。
  - text: 訓練頻率、每組反覆次數與休息時間長短
    correct: false
    why_wrong: 這些屬於課程設計變項而非單一動作的技術要素，教材列的共同要素不含訓練頻率與休息。
- id: ch15.upper-body.i03.q1
  item: ch15.upper-body.i03
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  locator: Bent-Over Row
  stem: 教練指導運動員執行俯身划船，下列哪一項最符合教材對起槓與軀幹的規定？
  options:
  - text: 正手握起槓，拉槓時軀幹保持不動
    correct: true
  - text: 交替握起槓，並隨每次拉動挺身
    correct: false
    why_wrong: 教材明定起槓用正手握而非交替握，且拉槓時不可向上猛拉軀幹。
  - text: 反手握起槓，肘部貼緊體側上提
    correct: false
    why_wrong: 起槓握法寫成反手握，教材要求的是較肩寬的閉合正手握。
- id: ch15.lower-body.i04.q1
  item: ch15.lower-body.i04
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  stem: 執行羅馬尼亞硬舉下降時，下列哪一項最符合教材所列的控制要點？
  locator: Romanian Deadlift (RDL)
  options:
  - text: 膝略至中度屈曲並全程維持
    correct: true
  - text: 膝完全打直以拉長腿後側
    correct: false
    why_wrong: 將膝打直視為最大化張力；教材明定膝須略至中度屈曲並全程維持，不是完全伸直。
  - text: 膝隨下降逐步伸直到站姿
    correct: false
    why_wrong: 把 RDL 誤寫成屈膝漸伸的硬舉；RDL 的膝角度是維持而非漸伸。
- id: ch15.power-exercises-technique.i01.q1
  item: ch15.power-exercises-technique.i01
  dco: pa2.B.4.b
  lang: en
  cognitive: application
  stem: In which category of lifts does the text most strongly advise that spotters should not provide assistance?
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises
  options:
  - text: Power exercises such as cleans, snatches, and their variations
    correct: true
  - text: Heavy structural barbell back squats with a bar across the back
    correct: false
    why_wrong: Groups power exercises with barbell back squats; the text singles out back squats as cases that typically do need spotters.
  - text: Seated machine shoulder presses performed along a fixed path
    correct: false
    why_wrong: Treats a fixed-path machine lift like a free-weight power lift; seated machine presses are not the exception described.
- id: ch15.power-exercises-technique.i04.q1
  item: ch15.power-exercises-technique.i04
  dco: pa2.B.4.b
  lang: zh
  cognitive: application
  stem: 運動員準備執行爆發力動作前，下列哪項場地準備最符合教材要求？
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises
  options:
  - text: 清除周邊其他運動員與器材
    correct: true
  - text: 安排多名保護者貼身待命
    correct: false
    why_wrong: 把爆發力動作套用一般過頭動作的保護原則；教材明列爆發力動作不予保護。
  - text: 在槓前放置大片緩衝墊
    correct: false
    why_wrong: 用緩衝墊代替失誤處理；教材要求教會運動員避開失控的槓，而非預設承接裝置。
- id: ch15.power-exercises.i03.q1
  item: ch15.power-exercises.i03
  dco: pa2.B.4.a
  lang: zh
  cognitive: application
  stem: 高翻的第二拉階段，下肢爆發性伸展完成後，教材最要求何時才開始屈肘把身體拉到槓下？
  locator: Power Clean (and Hang Power Clean Variation)
  options:
  - text: 聳肩至最高時
    correct: true
  - text: 髖膝剛啟動爆發時
    correct: false
    why_wrong: 把屈肘提前到爆發啟動；教材要求下肢全伸並聳肩後才屈肘。
  - text: 槓已靜止於大腿前時
    correct: false
    why_wrong: 等槓靜止再屈肘；此時已喪失爆發速度，違背第二拉的加速目的。
- id: ch15.power-exercises.i07.q1
  item: ch15.power-exercises.i07
  dco: pa2.B.4.a
  lang: zh
  cognitive: analysis
  stem: 教練在指導推舉時，最需要向運動員強調下列哪一項以同時兼顧速度與控制？
  locator: Push Press
  options:
  - text: 髖膝踝爆發後再以手臂完成過頭
    correct: true
  - text: 全程以手臂力量獨立推至鎖定
    correct: false
    why_wrong: 把推舉當成純上肢動作；教材把腿部驅動列為必備環節，不是輔助。
  - text: 下沉後直接把槓甩向頭頂最高點
    correct: false
    why_wrong: 採甩放式過頭；教材要求在控制與正確姿勢下盡力加速，不是任意甩放。
- id: ch15.weight-belt.i04.q1
  item: ch15.weight-belt.i04
  dco: pa2.B.1.b
  lang: en
  cognitive: analysis
  stem: Which of the following best explains why overusing a weight belt is considered a drawback in the text?
  locator: Fundamentals of Exercise Technique > Weight Belts
  options:
  - text: It reduces training opportunities for the abdominal muscles
    correct: true
  - text: It causes irreversible core weakness in every athlete
    correct: false
    why_wrong: Inflates the listed drawback from a reduced training opportunity to an inevitable injury; the text only notes a loss of training stimulus for the abdominals.
  - text: It eliminates the Valsalva maneuver during heavy lifts
    correct: false
    why_wrong: Treats the belt as a substitute for breathing control; the text does not claim that belts replace the Valsalva maneuver or any specific breathing strategy.
- id: ch15.spotter-communication.i08.q1
  item: ch15.spotter-communication.i08
  dco: pa2.B.1.b
  lang: en
  cognitive: analysis
  stem: Which scenario best illustrates the cooperation between an athlete and spotter during a forced repetition?
  locator: Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Amount and Timing of Spotting Assistance
  options:
  - text: The athlete signals immediately and the spotter gives just enough help to clear the sticking point
    correct: true
  - text: The spotter takes the bar before the athlete signals so that fatigue never accumulates
    correct: false
    why_wrong: Reverses the communication flow; the text requires the athlete to initiate the request, not the spotter to preempt it.
  - text: The athlete finishes the set alone and the spotter only loads the next plates afterward
    correct: false
    why_wrong: Removes the spotter from the rep; the text places the spotter inside the repetition to assist at the sticking point, not only between sets.
- id: ch15.weight-belt.i07.q1
  item: ch15.weight-belt.i07
  dco: pa2.B.1.b
  lang: zh
  cognitive: analysis
  stem: 教材定義「結構性動作」時，最關鍵的判斷依據為下列何者？
  locator: Fundamentals of Exercise Technique > Breathing Considerations
  options:
  - text: 是否對脊椎加載而對其施加壓力
    correct: true
  - text: 是否同時動員多個大肌群
    correct: false
    why_wrong: 把結構性動作誤寫成多關節動員定義；教材是以脊椎受壓為唯一判準，不是肌肉動員數量。
  - text: 是否使用自由重量而非機械式器械
    correct: false
    why_wrong: 把器材類型當成判斷條件；教材未把機械式器械排除在結構性動作之外。
- id: ch15.body-positioning.i01.q1
  item: ch15.body-positioning.i01
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  stem: 一名運動員準備進行站姿的槓鈴划船，若他以略寬於髖寬、腳跟與前腳掌都接地的站姿開始，最主要的功能是什麼？
  locator: Fundamentals of Exercise Technique > Stable Body and Limb Positioning
  options:
  - text: 維持動作中的支撐基底穩定
    correct: true
  - text: 自動決定背部圓背的程度
    correct: false
    why_wrong: 站距不能決定也無法自動限制圓背程度；該條件需由動作全程的脊椎排列主動維持，不是站姿寬度的功能。
  - text: 直接決定握距的選擇方式
    correct: false
    why_wrong: 站距與握距是兩個獨立的技術變項，站姿基準並不「決定」握距；握距依動作設計另行選定。
- id: ch15.body-positioning.i03.q1
  item: ch15.body-positioning.i03
  dco: pa2.B.2.a
  lang: en
  cognitive: application
  stem: An athlete performing a seated dumbbell press maintains five-point body contact throughout every repetition. What is the primary purpose of this positioning?
  locator: Fundamentals of Exercise Technique > Stable Body and Limb Positioning
  options:
  - text: To promote maximum stability and spinal support
    correct: true
  - text: To guarantee the athlete cannot be injured
    correct: false
    why_wrong: The textbook limits the claim to promoting stability and spinal support; it does not state that five-point contact guarantees injury prevention.
  - text: To replace the need for proper breathing technique
    correct: false
    why_wrong: Stability positioning supports but does not substitute for breathing technique; the chapter lists breathing as a separate technical element handled by the liftoff and spotting roles.
- id: ch15.body-positioning.i07.q1
  item: ch15.body-positioning.i07
  dco: pa2.B.1.a
  lang: en
  cognitive: analysis
  stem: A powerlifter performs a snatch pull with maximum acceleration, but the bar drifts forward off the line of the shins. Which principle has most likely been violated?
  locator: Fundamentals of Exercise Technique > Range of Motion and Speed
  options:
  - text: Acceleration must happen within control and posture
    correct: true
  - text: Slower controlled reps always produce full ROM
    correct: false
    why_wrong: The textbook applies the slower controlled rule to non-power movements; the violation here is the missing control condition during a maximal-acceleration lift.
  - text: Power exercises should be spotted at all times
    correct: false
    why_wrong: The chapter explicitly states power exercises should not be spotted; applying a spotting rule here would contradict the exception for power movements.
- id: ch15.upper-body.i05.q1
  item: ch15.upper-body.i05
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  locator: Seated Barbell Shoulder Press (and Dumbbell Variation)
  stem: 坐姿槓鈴肩推的上推與下放過程中，教材最強調的頸部處置為何？
  options:
  - text: 略為伸頸讓槓貼著臉前通過
    correct: true
  - text: 主動屈頸並把槓繞到頸子後方
    correct: false
    why_wrong: 教材這份清單只描述從身體前方的路徑，並未列出頸後版本的肩推。
  - text: 頸部完全不動，改成側移軀幹避開
    correct: false
    why_wrong: 靠側移軀幹閃避並非教材作法，教材要求略伸頸讓槓從臉旁通過。
- id: ch15.breathing.i01.q1
  item: ch15.breathing.i01
  dco: pa2.A.1
  lang: zh
  cognitive: recall
  stem: 教材中對「黏滯點」（sticking point）的位置描述為何？
  locator: Fundamentals of Exercise Technique > Breathing Considerations
  options:
  - text: 通常在離心轉向心後不久
    correct: true
  - text: 永遠是動作的最高點位置
    correct: false
    why_wrong: 教材用「通常」描述其發生時機，並未宣稱黏滯點永遠是動作最高點；不同動作的黏滯點位置不同。
  - text: 一定是離心階段的最低點
    correct: false
    why_wrong: 教材把黏滯點放在離心轉向心後不久，並非離心階段的最低位置；把最低點當黏滯點是位置判讀錯誤。
- id: ch15.upper-body.i08.q1
  item: ch15.upper-body.i08
  dco: pa2.B.2.a
  lang: zh
  cognitive: application
  locator: Triceps Pushdown (Machine)
  stem: 運動員站在滑輪器械前準備三頭肌下壓，下列哪一組起始設定最符合教材？
  options:
  - text: 靠近器械站，使纜線起始時垂直
    correct: true
  - text: 退離器械兩步，讓纜線向前斜拉
    correct: false
    why_wrong: 纜線在起始位置必須垂直下垂，退離器械會讓阻力方向偏離教材設定。
  - text: 採中立握並讓上臂隨下壓前後擺動
    correct: false
    why_wrong: 教材只列閉合正手握，且要求上臂貼身固定而不是隨下壓擺動。
- id: ch15.exercise-technique-fundamentals.i01.q1
  item: ch15.exercise-technique-fundamentals.i01
  dco: pa2.B.1.a
  lang: zh
  cognitive: recall
  stem: 教材本章所稱安全且有效阻力訓練的核心是什麼？
  locator: Fundamentals of Exercise Technique
  options:
  - text: 正確執行動作
    correct: true
  - text: 使用最大可能負荷
    correct: false
    why_wrong: 教材把核心定位在正確執行而非負荷大小；以最大負荷為核心會犧牲技術與安全。
  - text: 完成最多的反覆次數
    correct: false
    why_wrong: 反覆次數是訓練量變項，不是教材定義的核心；用次數當核心會忽略動作正確性本身。
- id: ch15.exercise-technique-fundamentals.i05.q1
  item: ch15.exercise-technique-fundamentals.i05
  dco: pa2.B.2.a
  lang: zh
  cognitive: application
  stem: 運動員準備使用一部有調整旋鈕的胸推機，開始動作前最主要要先做什麼？
  locator: Fundamentals of Exercise Technique > Stable Body and Limb Positioning
  options:
  - text: 調整座椅與阻力臂並扣緊束帶
    correct: true
  - text: 直接坐到機器上並開始推
    correct: false
    why_wrong: 未先調整束帶與座椅就開始動作，違反教材對機械式動作的技術起點要求。
  - text: 用最大力量試推以感受負荷
    correct: false
    why_wrong: 機械動作的技術起點是調整與束帶，而非用最大力測試；以最大力試推會跳過設定步驟。
- id: ch15.exercise-technique-fundamentals.i06.q1
  item: ch15.exercise-technique-fundamentals.i06
  dco: pa2.B.1.b
  lang: zh
  cognitive: analysis
  stem: 教練為運動員安排強迫反覆時，保護者的角色該如何定位最為恰當？
  locator: Spotting Free Weight Exercises
  options:
  - text: 首要責任是被保護者的安全
    correct: true
  - text: 與運動員平分槓鈴控制權
    correct: false
    why_wrong: 教材把安全列為首要責任，「平分控制」會模糊責任歸屬，干擾黏滯點附近的即時協助。
  - text: 以激勵口號取代安全協助
    correct: false
    why_wrong: 教材承認激勵可存在，但若凌駕安全則違反首要責任；用口號取代協助是顛倒優先順序。
- id: ch15.exercise-technique-fundamentals.i07.q1
  item: ch15.exercise-technique-fundamentals.i07
  dco: pa2.B.1.a
  lang: zh
  cognitive: recall
  stem: 依本章，體能專業人員在技術教學上不應教導運動員的內容為何？
  locator: Conclusion
  options:
  - text: 完全不鼓勵運動員發問
    correct: true
  - text: 阻力訓練動作技術教學
    correct: false
    why_wrong: 教材明列阻力訓練動作技術為教學內容；將其排除在外違背教材列舉的教學責任範圍。
  - text: 護腰帶使用時機教學
    correct: false
    why_wrong: 護腰帶使用是教材列為教學責任的一部分；排除它會讓運動員誤用或忽略護具時機。
- id: ch15.exercise-technique-fundamentals.i08.q1
  item: ch15.exercise-technique-fundamentals.i08
  dco: pa2.B.1.a
  lang: en
  cognitive: application
  stem: A new athlete's training environment features quality supervision but inconsistent feedback. Which outcome is most consistent with the textbook's combined requirement?
  locator: Conclusion
  options:
  - text: The environment cannot fully achieve safe and effective training
    correct: true
  - text: Quality supervision alone fully satisfies the chapter's standard
    correct: false
    why_wrong: The chapter ties safe and effective training to instruction plus quality supervision plus ongoing feedback together; treating supervision alone as sufficient ignores the feedback component.
  - text: Inconsistent feedback only affects motivation, not safety
    correct: false
    why_wrong: The chapter links all three to both safety and effectiveness; reducing feedback to a motivation issue understates its role in the combined requirement.
- id: ch15.grips.i08.q1
  item: ch15.grips.i08
  dco: pa2.B.1.a
  lang: zh
  cognitive: application
  stem: 教練指導運動員進行一般握距的多關節自由重量動作，最適當的起始握距應為何？
  locator: Fundamentals of Exercise Technique > Handgrips
  options:
  - text: 約肩寬並使槓鈴保持平衡均勻
    correct: true
  - text: 永遠採用最寬的握距以增加穩定
    correct: false
    why_wrong: 教材把「約肩寬」列為多數動作的一般原則，並未主張所有動作都採最寬握距。
  - text: 完全依照前一次反覆的握距即可
    correct: false
    why_wrong: 教材以動作需求為原則並強調槓鈴平衡；把前次握距當唯一依據會忽略動作特性與平衡要求。
- id: ch15.lower-body.i05.q1
  item: ch15.lower-body.i05
  dco: pa2.B.1.a
  lang: zh
  cognitive: analysis
  stem: 運動員做直腿硬舉下降到一半時腳跟即將離地，最適當的處置為何？
  locator: Stiff-Leg Deadlift
  options:
  - text: 在腳跟離地前停止下降
    correct: true
  - text: 為了追求更大活動範圍而繼續下放
    correct: false
    why_wrong: 教材明列腳跟離地為下降停止條件之一；繼續下放會犧牲教材強調的中立脊椎與平衡。
  - text: 改為膝關節完全打直繼續下放
    correct: false
    why_wrong: 教材要求全程維持膝略至中度屈曲；膝完全伸直時即觸發停止條件，繼續下放違反該規則。
- id: ch15.power-exercises-technique.i06.q1
  item: ch15.power-exercises-technique.i06
  dco: pa2.B.4.b
  lang: en
  cognitive: application
  stem: An athlete is about to perform a heavy hang power clean. According to the chapter, what is the most appropriate spotting approach?
  locator: Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved
  options:
  - text: The lift should not be spotted because it is a power exercise
    correct: true
  - text: One spotter must stand behind the bar as for a back squat
    correct: false
    why_wrong: The chapter carves power exercises out of the general spotting rule; applying back-squat-style spotting here treats power lifts as if the exception did not exist.
  - text: Two spotters must lift the bar off the rack for the lifter
    correct: false
    why_wrong: A hang clean is not lifted from a rack by spotters; requiring two spotters to take the bar misreads the starting position and the spotting exception.
- id: ch15.spotter-communication.i02.q1
  item: ch15.spotter-communication.i02
  dco: pa2.B.1.b
  lang: zh
  cognitive: analysis
  stem: 訓練中保護者因訊息不清，在反覆最費力前就接管了槓鈴，最主要的危險為何？
  locator: Spotting Free Weight Exercises > Communication Between Athlete and Spotter
  options:
  - text: 干擾動作並可能傷害運動員
    correct: true
  - text: 讓保護者本身的握力獲得過度訓練
    correct: false
    why_wrong: 教材強調的是傷害運動員的風險，而非保護者的握力訓練；把焦點放在保護者自身訓練屬於抓錯重點。
  - text: 增加槓鈴磨損但不會影響安全
    correct: false
    why_wrong: 教材把時機錯誤連到傷害運動員；忽略安全後果僅談器材磨損與教材的因果關係不符。
- id: ch15.spotter-communication.i07.q1
  item: ch15.spotter-communication.i07
  dco: pa2.B.1.b
  lang: zh
  cognitive: analysis
  stem: 運動員剛接過起槓協助的槓鈴還沒穩定，保護者就提前放手，最主要的後果為何？
  locator: Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Use of a Liftoff
  options:
  - text: 運動員尚未完全控制即失去支撐
    correct: true
  - text: 保護者的姿勢進入省力狀態
    correct: false
    why_wrong: 教材強調的確認是為避免運動員尚未控制槓鈴；把它解讀為保護者省力屬於抓錯焦點。
  - text: 槓鈴自動調整為平衡不受影響
    correct: false
    why_wrong: 槓鈴不會自動平衡；教材明列須確認運動員完全控制才能結束起槓協助，過早放手違背此規則。
- id: ch15.body-positioning.i05.q2
  item: ch15.body-positioning.i05
  dco: pa2.B.2.a
  lang: en
  cognitive: application
  stem: An athlete sits at a leg extension machine and adjusts the ankle pad and back rest before beginning. Which joint alignment is the primary goal of this adjustment?
  locator: Fundamentals of Exercise Technique > Stable Body and Limb Positioning
  options:
  - text: Aligning the knee joint with the machine's axis of rotation
    correct: true
  - text: Aligning the hip joint with the resistance cam's outer edge
    correct: false
    why_wrong: Targets a different joint than the example specifies; the chapter uses the knee-to-axis alignment as the demonstration of joint-to-axis positioning, not the hip-to-cam edge.
  - text: Aligning the ankle pad with the top of the tibia at the seat edge
    correct: false
    why_wrong: Pairs the ankle pad with the tibia edge; the chapter's purpose of the adjustment is joint-to-axis alignment, not pad-to-bone landmark matching.
- id: ch15.upper-body.i01.q1
  item: ch15.upper-body.i01
  dco: pa2.B.1.a
  lang: zh
  cognitive: recall
  locator: Flat Barbell Bench Press (and Dumbbell Variation)
  stem: 教材對平槓臥推的下放高度與握距分別有什麼規定？
  options:
  - text: 降到乳頭高度的胸部，握距略寬於肩
    correct: true
  - text: 降到鎖骨正上方，握距與肩同寬
    correct: false
    why_wrong: 臥推的下放點是乳頭高度的胸部而不是鎖骨，握距也要略寬於肩。
  - text: 降到肋骨下緣，握距窄到兩手相碰
    correct: false
