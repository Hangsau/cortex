meta:
  chapter: ch08
  source: data/cscs/ch08.yaml
questions:
- id: ch08.arousal-anxiety-stress.i01.q1
  item: ch08.arousal-anxiety-stress.i01
  dco: sf2.A.1
  lang: zh
  cognitive: recall
  stem: 依教材所列，下列何者屬於喚醒（arousal）的測量指標？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Arousal'
  options:
  - text: 心率與兒茶酚胺濃度
    correct: true
  - text: 最大肌力測試的成績
    correct: false
    why_wrong: 肌力表現屬於能力測驗，反映的是可輸出的力量水準，不是當下的活化程度。
  - text: 最大攝氧量的估計值
    correct: false
    why_wrong: 有氧能力是相對穩定的體能屬性，一節課內不會隨情緒起伏而改變。
- id: ch08.arousal-anxiety-stress.i02.q1
  item: ch08.arousal-anxiety-stress.i02
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 一名選手心跳加速且肌肉緊繃，但並未把情境視為威脅。依教材，這時最適當的描述為何？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Anxiety'
  options:
  - text: 他只是生理喚醒升高
    correct: true
  - text: 他正經歷狀態焦慮
    correct: false
    why_wrong: 焦慮要求對情境有負面知覺，本題明確排除了威脅解讀，因此不成立。
  - text: 他的特質焦慮偏高
    correct: false
    why_wrong: 特質焦慮描述的是跨情境的穩定傾向，與單次的生理反應是兩個層次的概念。
- id: ch08.arousal-anxiety-stress.i03.q1
  item: ch08.arousal-anxiety-stress.i03
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 教材對狀態焦慮與表現關係的主張，最主要的依據為何？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Anxiety'
  options:
  - text: 受技能程度與任務複雜度調節
    correct: true
  - text: 在所有情境下都呈負向關係
    correct: false
    why_wrong: 教材並未把負向效果畫上絕對等號，仍保留正、負、無三種可能；過度延伸到「一律負向」會失去調節變項的角色。
  - text: 只受生理性別一項因素調節
    correct: false
    why_wrong: 教材列出的調節變項包含技能、人格與任務複雜性等，並未單獨強調生理性別為唯一調節者。
- id: ch08.arousal-anxiety-stress.i04.q1
  item: ch08.arousal-anxiety-stress.i04
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名特質焦慮偏高的桌球選手在關鍵決勝局頻頻漏接，最可能的解釋為何？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Anxiety'
  options:
  - text: 與任務無關的想法占用注意力容量
    correct: true
  - text: 桌球動作的肌肉協調已自動失效
    correct: false
    why_wrong: 失誤源自注意力被認知干擾，而非技術本身喪失；肌肉協調問題屬於動作學習或技術層次，與特質焦慮的主張不同層次。
  - text: 特質焦慮已使其運動單位徵召全面失效
    correct: false
    why_wrong: 教材描述的是注意力路徑的失能，並未把特質焦慮連結到運動單位徵召的全面失效；用運動神經層次解釋屬於範圍外推論。
- id: ch08.arousal-anxiety-stress.i06.q1
  item: ch08.arousal-anxiety-stress.i06
  dco: sf2.B.2
  lang: zh
  cognitive: recall
  stem: 教材對「壓力」與「壓力源」的關係，何者最為正確？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Stress'
  options:
  - text: 壓力源是觸發壓力反應的事件
    correct: true
  - text: 壓力源是壓力反應中的生理喚醒
    correct: false
    why_wrong: 教材把壓力源定位為引發反應的環境或認知事件；把生理喚醒當成壓力源，會與壓力反應的內含混淆。
  - text: 壓力源與壓力反應完全等同
    correct: false
    why_wrong: 教材以「引發」關係區分兩者，畫上等號會失去壓力源與反應之間的時間先後層次。
- id: ch08.arousal-anxiety-stress.i07.q1
  item: ch08.arousal-anxiety-stress.i07
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 選手將一場關鍵比賽解讀為嚴重威脅，並出現心跳加速與反覆擔憂失誤。教練最適當的回應應聚焦於？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Stress'
  options:
  - text: 處理其對壓力源的負面知覺
    correct: true
  - text: 立即減少所有體能訓練量
    correct: false
    why_wrong: 減少訓練量並未觸及「把威脅解讀為負面」這個核心知覺；也可能打斷備戰節奏，與心理介入無關。
  - text: 要求選手完全壓抑焦慮反應
    correct: false
    why_wrong: 要求壓抑反應並未改變他對情境的評估；教材不主張壓制活化，而是先處理產生焦慮的知覺層。
- id: ch08.arousal-anxiety-stress.i08.q1
  item: ch08.arousal-anxiety-stress.i08
  dco: sf2.A.3
  lang: en
  cognitive: recall
  stem: Which component is the textbook most explicit in excluding from the eustress response?
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Stress'
  options:
  - text: Cognitive or somatic anxiety
    correct: true
  - text: Positive psychological energy
    correct: false
    why_wrong: Positive psychological energy is listed as part of eustress; removing it would contradict the textbook's own description.
  - text: A rise in physiological arousal
    correct: false
    why_wrong: A rise in physiological arousal is part of the eustress response; the textbook separates it from anxiety, not from arousal.
- id: ch08.arousal-theories.i01.q1
  item: ch08.arousal-theories.i01
  dco: sf2.A.1
  lang: en
  cognitive: recall
  stem: According to the chapter, which qualifier best describes the practical status of drive theory?
  locator: Influence of Arousal and Anxiety on Performance > Drive Theory
  options:
  - text: It is a limited starting point, not a universal law
    correct: true
  - text: It applies equally to every athlete and skill level
    correct: false
    why_wrong: The chapter limits drive theory to a rough rise from low arousal; equal application ignores skill and task complexity.
  - text: It explains performance better than later arousal models
    correct: false
    why_wrong: The chapter uses drive theory as a starting point that later models refine, not as the strongest explanation on its own.
- id: ch08.arousal-theories.i02.q1
  item: ch08.arousal-theories.i02
  dco: sf2.A.1
  lang: en
  cognitive: application
  stem: An experienced lifter and a beginner are both more keyed up than usual before a heavy attempt, yet only the experienced lifter still makes the lift. Which textbook explanation best fits this difference?
  locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Skill Level
  options:
  - text: A wider tolerable band around optimal arousal
    correct: true
  - text: A higher optimal arousal point for beginners
    correct: false
    why_wrong: The chapter places the optimal point lower, not higher, for less skilled performers, so this reverses the stated relationship.
  - text: A larger store of sensation-seeking traits
    correct: false
    why_wrong: Sensation seeking is a personality dimension the chapter treats separately from how skill level widens the workable arousal range.
- id: ch08.arousal-theories.i03.q1
  item: ch08.arousal-theories.i03
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 兩名選手同樣在高噪音環境下比賽：甲跑的是已熟練的 400 公尺，乙要即時判斷戰術的格鬥選手。教練的差異化處置最可能依據？
  locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Task Complexity
  options:
  - text: 任務所需的有意識決策負荷
    correct: true
  - text: 兩人外在動作型態的視覺複雜度
    correct: false
    why_wrong: 教材強調的關鍵是「有意識決策」而非單純的動作控制；用視覺複雜度判斷會誤把跑步也算進高喚醒需求。
  - text: 兩人過去的訓練總時數
    correct: false
    why_wrong: 訓練時數代表練習量，無法區分任務本身是否需要高度決策；教材沒把訓練時數當作喚醒需求的主要調節變項。
- id: ch08.arousal-theories.i04.q1
  item: ch08.arousal-theories.i04
  dco: sf2.A.1
  lang: en
  cognitive: application
  stem: A coach is using the inverted-U concept to explain why an athlete struggles both when overly hyped and when flat before competition. Which qualification from the textbook best refines this explanation?
  locator: Influence of Arousal and Anxiety on Performance > Inverted-U Theory
  options:
  - text: The curve is moderated by skill and task
    correct: true
  - text: Only beginners respond to arousal level
    correct: false
    why_wrong: The textbook does not limit arousal effects to novices; skilled athletes still have a curve, just with a wider tolerance band.
  - text: The curve assumes identical personalities
    correct: false
    why_wrong: While individual differences matter, the textbook's named critique is skill, ability, experience, and task complexity, not personality per se.
- id: ch08.arousal-theories.i05.q1
  item: ch08.arousal-theories.i05
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 教練若想用 Hanin 的個人最佳功能區（IZOF）幫助網球選手備賽，最關鍵的調整為何？
  locator: Influence of Arousal and Anxiety on Performance > Individual Zones of Optimal Functioning Theory
  options:
  - text: 找出每位選手的最佳喚醒帶寬
    correct: true
  - text: 把所有選手的目標喚醒統一為中等
    correct: false
    why_wrong: 教材批評「中等喚醒最佳」並指出每個人最佳點不同；統一中等會抹平 IZOF 強調的個別差異。
  - text: 只監測客觀生理指標，忽略情緒自陳
    correct: false
    why_wrong: IZOF 同時容許情緒被不同運動員正向或負向知覺；只看生理指標會失去情緒自陳所提供的訊息。
- id: ch08.arousal-theories.i06.q1
  item: ch08.arousal-theories.i06
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 一名選手在認知焦慮升高時，一旦生理喚醒跟著攀升，表現常突然崩塌。下列何者最能描述這個現象？
  locator: Influence of Arousal and Anxiety on Performance > Catastrophe Theory
  options:
  - text: 表現突然大幅下滑
    correct: true
  - text: 表現以平穩斜率下滑
    correct: false
    why_wrong: 教材明列災難理論反對漸進衰退；用平穩斜率描述會把災難模型誤畫成簡單倒 U 的延伸。
  - text: 從此不再恢復任何水準
    correct: false
    why_wrong: 教材只說「恢復一些平靜不一定能回到下跌前水準」，未主張永遠不可逆；說成「不再恢復」是過度延伸。
- id: ch08.arousal-theories.i07.q1
  item: ch08.arousal-theories.i07
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 同一場高張力比賽中，甲把觀眾噪音視為「很興奮」，乙把它視為「很不舒服」。教材最可能用哪個概念來解釋這種差異？
  locator: Influence of Arousal and Anxiety on Performance > Reversal Theory
  options:
  - text: 喚醒效果取決於個人如何詮釋
    correct: true
  - text: 兩人天生的生理喚醒閾值不同
    correct: false
    why_wrong: 天生閾值屬於生理層次，無法解釋為何同一強度刺激會被兩人貼上截然不同的情緒標籤。
  - text: 觀眾噪音對運動表現毫無影響
    correct: false
    why_wrong: 題幹已說明同一環境在兩人身上產生不同效果；說「毫無影響」與題幹情境直接衝突。
- id: ch08.attention-concentration.i01.q1
  item: ch08.attention-concentration.i01
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名羽球選手在比賽時抱怨「腦袋一片空白，只想著剛才那顆失誤球」。下列何者最適合用來描述他的困難？
  locator: Attention and Focus
  options:
  - text: 選擇性注意被任務無關想法占據
    correct: true
  - text: 長期記憶容量不足以提取戰術
    correct: false
    why_wrong: 題幹描述的是當下被失誤想法占據，屬於注意力與工作記憶層次；長期記憶容量是另一個獨立機制。
  - text: 視覺搜尋速度下降到生理極限
    correct: false
    why_wrong: 視覺搜尋屬於外在線索處理層次；「想著失誤球」是內在認知占用，無法用視覺疲勞解釋。
- id: ch08.attention-concentration.i02.q1
  item: ch08.attention-concentration.i02
  dco: sf2.A.2
  lang: en
  cognitive: recall
  stem: According to Nideffer's framework, which attentional style is used when surveying multiple elements of the playing environment?
  locator: Attention and Focus > Attentional Styles
  options:
  - text: Broad-external focus
    correct: true
  - text: Narrow-external focus
    correct: false
    why_wrong: Narrow-external focus isolates one or two cues for action; surveying many elements describes breadth, not narrowing.
  - text: Broad-internal focus
    correct: false
    why_wrong: Broad-internal focus is about internally integrating many pieces of information, not scanning the external environment.
- id: ch08.attention-concentration.i03.q1
  item: ch08.attention-concentration.i03
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A soccer coach wants a player to internally compare several tactical options before receiving the ball. Which attentional style best fits this intent?
  locator: Attention and Focus > Attentional Styles
  options:
  - text: Broad-internal focus
    correct: true
  - text: Narrow-internal focus
    correct: false
    why_wrong: Narrow-internal focus is used to mentally rehearse an imminent action, not to integrate multiple tactical options.
  - text: Broad-external focus
    correct: false
    why_wrong: Broad-external focus scans the environment, not the player's own internal analysis of options.
- id: ch08.attention-concentration.i04.q1
  item: ch08.attention-concentration.i04
  dco: sf2.A.2
  lang: en
  cognitive: recall
  stem: According to the textbook, when is narrow-internal attentional focus most appropriate for an athlete?
  locator: Attention and Focus > Attentional Styles
  options:
  - text: While mentally rehearsing an upcoming action
    correct: true
  - text: While surveying many environmental cues at once
    correct: false
    why_wrong: Surveying many environmental cues describes breadth, not the narrow focus used to mentally rehearse one action.
  - text: While filtering out a single opponent cue
    correct: false
    why_wrong: Filtering out a single opponent cue is an external focus task, not an internal mental-rehearsal task.
- id: ch08.attention-concentration.i05.q1
  item: ch08.attention-concentration.i05
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一位拳擊手容易被對手假動作淹沒，教練想用注意力策略協助他聚焦。最符合 Nideffer 框架的處置為？
  locator: Attention and Focus > Attentional Styles
  options:
  - text: 引導他聚焦單一外在線索
    correct: true
  - text: 要求他在腦中預演全套戰術
    correct: false
    why_wrong: 在腦中預演全套戰術屬於廣內部注意，可能反而加重認知負荷，與「被刺激淹沒」的問題相反。
  - text: 同時觀察場上所有外在元素
    correct: false
    why_wrong: 同時觀察所有元素正是他被淹沒的原因；擴大外在廣度會讓處理負擔更重，違背處置目的。
- id: ch08.attention-concentration.i06.q1
  item: ch08.attention-concentration.i06
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名剛學深蹲的新手在課堂上明顯吃力，每一下都要「邊想邊做」。根據 Fitts 與 Posner 的階段，他最可能處於哪個階段？
  locator: Attention and Focus
  options:
  - text: 認知階段
    correct: true
  - text: 聯結階段
    correct: false
    why_wrong: 聯結階段仍把注意力放在任務上，但已較不會被動作細節占住；題幹描述「邊想邊做」屬於最費力的初始階段。
  - text: 自動化階段
    correct: false
    why_wrong: 自動化階段心智放鬆、技能可無須思考執行，與新手必須有意識調節的現象相反。
- id: ch08.attention-concentration.i08.q1
  item: ch08.attention-concentration.i08
  dco: sf2.A.2
  lang: zh
  cognitive: analysis
  stem: 一位資深泳者在比賽後段能同時監控划水節奏與對手位置，但仍保持動作順暢。這最能用哪一個概念解釋？
  locator: Attention and Focus
  options:
  - text: 自動化讓心智得以釋放給外在線索
    correct: true
  - text: 注意力範圍徹底從動作轉為環境
    correct: false
    why_wrong: 教材說自動化是自動濾除不相關線索，並未主張注意力完全切離動作；說「徹底轉為環境」是過度延伸。
  - text: 划水動作已退化為低階反射
    correct: false
    why_wrong: 教材把自動化描述為「心智放鬆、技能無須思考即可執行」，而非動作退化為反射；這混淆了自動化與反射的神經機制。
- id: ch08.goal-setting.i01.q1
  item: ch08.goal-setting.i01
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 一名體態過重的運動員想減重，下列何者最符合「過程目標」的設定方式？
  locator: Psychological Techniques for Improved Performance > Goal Setting > Process Goals
  options:
  - text: 設定每週有氧與飲食的執行項目
    correct: true
  - text: 設定單月內完成八次阻力訓練
    correct: false
    why_wrong: 阻力訓練次數本身仍偏向表現數量，且未明確落在運動員可控制的策略行動上；教材把過程目標聚焦於良好執行技能所採取的行動，不只是次數。
  - text: 設定半年後贏得比賽的目標
    correct: false
    why_wrong: 競賽名次取決於對手與裁判等不可控因素；這正是教材把結果目標與過程目標區分時所排除的範疇。
- id: ch08.goal-setting.i02.q1
  item: ch08.goal-setting.i02
  dco: sf2.A.1
  lang: en
  cognitive: analysis
  stem: A coach is concerned that focusing only on winning may occupy attention capacity and disrupt coordination. Which feature of outcome goals best explains this concern?
  locator: Psychological Techniques for Improved Performance > Goal Setting > Outcome Goals
  options:
  - text: Attention is drawn to fixed standards
    correct: true
  - text: Outcomes are decided entirely by the athlete's effort
    correct: false
    why_wrong: Outcomes also depend on opponents and circumstances; the coach's concern assumes the opposite of this option.
  - text: Outcomes remove the need for process goals entirely
    correct: false
    why_wrong: The textbook recommends combining outcome and process goals, not replacing process goals with outcomes.
- id: ch08.goal-setting.i03.q1
  item: ch08.goal-setting.i03
  dco: sf2.A.1
  lang: zh
  cognitive: recall
  stem: 下列對「短期目標」的心理功能之描述，何者最符合教材？
  locator: Psychological Techniques for Improved Performance > Goal Setting > Short-Term Goals
  options:
  - text: 提高自信、自我效能與動機
    correct: true
  - text: 提供長期目標的替代與取代
    correct: false
    why_wrong: 教材把短期目標視為通往長期目標的一串可達成標準，並非取代關係；用「替代與取代」會切斷兩者的連結。
  - text: 主要功能是降低比賽結果的不確定性
    correct: false
    why_wrong: 對比賽結果的掌控屬於結果目標範疇；短期目標的心理功能教材聚焦於自信與動機提升。
- id: ch08.goal-setting.i05.q1
  item: ch08.goal-setting.i05
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 教練解釋「為什麼系統性目標設定能改善表現」，下列何者最同時涵蓋教材所列的三個理由？
  locator: Psychological Techniques for Improved Performance > Goal Setting
  options:
  - text: 注意力、努力與正向回饋
    correct: true
  - text: 天賦潛力、營養介入與睡眠時數
    correct: false
    why_wrong: 天賦、營養、睡眠屬於體能與恢復背景，不是教材列在目標設定功能下的三項理由；混用會失去鑑別度。
  - text: 戰術演練、體能數據與心理諮商次數
    correct: false
    why_wrong: 戰術與體能是訓練內容；教材沒有把心理諮商次數列為目標設定影響表現的機制。
- id: ch08.goal-setting.i07.q1
  item: ch08.goal-setting.i07
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 選手面對漫長的奧運備戰期，教練希望兼顧方向感與持續動力。最符合教材指引的目標設計為？
  locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  options:
  - text: 串接短期達成與長期方向
    correct: true
  - text: 只設長期目標，要求每天自律
    correct: false
    why_wrong: 只設長期目標會讓日常訓練失去可達成的階段感，教材強調短期目標建立精熟感與自信，不能省略。
  - text: 同時設定多個彼此獨立的長期目標
    correct: false
    why_wrong: 多個彼此獨立的長期目標會分散努力方向，違背教材「長期目標統整一系列彼此連結的短期目標」的主張。
- id: ch08.ideal-performance-state.i03.q1
  item: ch08.ideal-performance-state.i03
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一位選手在關鍵時刻感到「眼裡只剩眼前的這一拍，其他什麼都看不到」。根據教材，這最屬於理想表現狀態的哪一特徵？
  locator: Ideal Performance State
  options:
  - text: 注意力狹窄且集中於當下活動
    correct: true
  - text: 注意力廣泛掃描所有場上元素
    correct: false
    why_wrong: 廣泛掃描屬於廣外部注意，與題幹「只剩眼前這一拍」的狹窄集中相反；放在這裡會與教材描述衝突。
  - text: 注意力完全脫離動作的肌肉感覺
    correct: false
    why_wrong: 教材說注意力集中於正在進行的活動，並未主張脫離肌肉感覺；用「完全脫離」會把焦點窄化擴大成失聯。
- id: ch08.ideal-performance-state.i07.q1
  item: ch08.ideal-performance-state.i07
  dco: sf2.A.2
  lang: en
  cognitive: recall
  stem: Beyond freedom from fear and time distortion, which set of features also characterizes the ideal performance state?
  locator: Ideal Performance State
  options:
  - text: Adaptive focus on task-relevant cues
    correct: true
  - text: Constant analysis of technique
    correct: false
    why_wrong: The textbook lists the absence of analysis as a feature; constant analysis would contradict the ideal performance state.
  - text: Reliance on external coach cues only
    correct: false
    why_wrong: The ideal performance state emphasizes the athlete's internal focus and confidence, not reliance on coach cues.
- id: ch08.motivation.i04.q1
  item: ch08.motivation.i04
  dco: sf2.A.1
  lang: zh
  cognitive: recall
  stem: 教材對 MAS 主導者偏好的挑戰情境，最忠實的描述為何？
  locator: Motivation > Achievement Motivation
  options:
  - text: 約五成勝率、可評估自身能力
    correct: true
  - text: 必須有十足把握才會選擇
    correct: false
    why_wrong: 教材明說 MAS 對極高把握的情境興趣較低；用「十足把握」會把偏好情境完全寫反。
  - text: 必須是不可能成功的艱難挑戰
    correct: false
    why_wrong: MAS 偏好的是中等勝率以評估能力，而非明顯不可能的艱難挑戰；這是 MAF 的舒適區。
- id: ch08.motivation.i05.q1
  item: ch08.motivation.i05
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 教練想增加選手準時出席晨練的機會。下列哪一種做法最屬於「負增強」？
  locator: Motivation > Positive and Negative Reinforcement in Coaching
  options:
  - text: 全隊準時後免做收操衝刺
    correct: true
  - text: 對準時者頒發本月最佳出席獎
    correct: false
    why_wrong: 頒獎是在行為後給予正向事件，屬於正增強；這裡誤把添加事件當成移除事件，與教材定義衝突。
  - text: 對遲到者公開責備並要求加練
    correct: false
    why_wrong: 公開責備並加練是在行為後呈現嫌惡事件，屬於正懲罰；用懲罰機制會降低而非增強出席行為。
- id: ch08.motivation.i07.q1
  item: ch08.motivation.i07
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 教練想說明「為何採用增強而非懲罰」的注意力理由，下列哪一項最涵蓋教材主張？
  locator: Motivation > Positive and Negative Reinforcement in Coaching > How Should Positive and Negative Reinforcement Be Applied?
  options:
  - text: 增強聚焦做對的事、保留任務相關焦點
    correct: true
  - text: 懲罰永遠比增強更能提升自我效能
    correct: false
    why_wrong: 教材明說增強有助自我效能；說「懲罰永遠更能」直接與教材偏好正向取向的主張衝突。
  - text: 懲罰可消除一切任務無關注意力
    correct: false
    why_wrong: 教材指出懲罰會讓注意力被無關線索占滿，而非消除；說成可「消除一切」會把懲罰效用反向化。
- id: ch08.motivation.i08.q1
  item: ch08.motivation.i08
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A strength coach wants athletes to feel ownership over how they structure parts of a session. Which arrangement best supports self-controlled practice?
  locator: Motivation > Motivational Aspects of Skill Learning (Self-Controlled Practice)
  options:
  - text: Let athletes choose which drill to attempt first
    correct: true
  - text: Prescribe every drill order and rest interval
    correct: false
    why_wrong: Prescribing every detail removes athlete decision-making and is the opposite of self-controlled practice.
  - text: Deliver feedback only at season end
    correct: false
    why_wrong: The textbook frames self-control as including timing of feedback; withholding it entirely removes a key motivational lever.
- id: ch08.motor-skill-acquisition.i04.q1
  item: ch08.motor-skill-acquisition.i04
  dco: pa3.A.2
  lang: zh
  cognitive: application
  stem: 教練安排新手在同一堂課中隨機交替練三種傳球動作，初期單一動作表現下滑。下列哪個解釋最貼近教材？
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Random Practice
  options:
  - text: 練習中表現下降但有助於學習
    correct: true
  - text: 三種動作彼此毫無技能遷移關係
    correct: false
    why_wrong: 隨機練習下降不等於無遷移；教材強調隨機練習的當下表現下降，正因其干擾效應有利於長期學習。
  - text: 此安排不適合任何練習階段
    correct: false
    why_wrong: 教材反而推薦以少量重複後轉換的混合方式；說完全不適合任何階段會誤把練習安排的彈性抹平。
- id: ch08.arousal-anxiety-stress.i05.q1
  item: ch08.arousal-anxiety-stress.i05
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 一名田徑選手在焦慮狀態下難以自主調節喚醒，此時最主要的困難最可能來自何處？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Anxiety'
  options:
  - text: 對情境成敗的不確定感
    correct: true
  - text: 骨骼肌爆發力相對不足
    correct: false
    why_wrong: 焦慮時的喚醒主要受不確定感干擾，而不是肌力不足；把它歸因於體能會誤判介入方向。
  - text: 尚未學過任何呼吸調節技術
    correct: false
    why_wrong: 焦慮喚醒失控源自內在的不確定感，並非單純因為未採用呼吸調節技術。
- id: ch08.attention-concentration.i07.q1
  item: ch08.attention-concentration.i07
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名短跑選手在聯結階段學習起跑反應，教練最優先應觀察哪一個注意力特徵？
  locator: Attention and Focus
  options:
  - text: 動作細節已不再占住全部注意空間
    correct: true
  - text: 技能完全不必思考即可執行
    correct: false
    why_wrong: 「完全自動化」屬於自動化階段的特徵；聯結階段仍須有意識地把注意放在任務上。
  - text: 焦點已能同時掃描所有隊友位置
    correct: false
    why_wrong: 場地掃描屬於廣外部注意；把注意力廣度當成聯結階段的特徵屬於層次混淆。
- id: ch08.goal-setting.i04.q1
  item: ch08.goal-setting.i04
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 一名馬拉松選手正在準備半年內的賽事，長期與短期目標應以何種關係安排最能提升動機？
  locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  options:
  - text: 短期目標的達成應導向長期目標
    correct: true
  - text: 兩者獨立設定、彼此不互相參照
    correct: false
    why_wrong: 兩者相互依存而非獨立；短期目標脫離長期方向會失去練習的整體意義。
  - text: 僅依短期目標訓練即可，不需長期目標
    correct: false
    why_wrong: 缺乏長期目標使短期目標失去方向與意義，教材強調兩者必須連結。
- id: ch08.goal-setting.i06.q1
  item: ch08.goal-setting.i06
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 教材舉出跑步目標時，最具體可量化的設定為何？
  locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  options:
  - text: 連續跑25分鐘心率受監測
    correct: true
  - text: 每天以正向心情去練習
    correct: false
    why_wrong: 以模糊情緒做為目標，無法提供成功與失敗的具體回饋。
  - text: 把比賽名次列為唯一目標
    correct: false
    why_wrong: 比賽名次屬於結果目標，達成不只取決於個人努力。
- id: ch08.goal-setting.i08.q1
  item: ch08.goal-setting.i08
  dco: sf2.A.3
  lang: zh
  cognitive: application
  stem: 一名四百公尺跑者想透過目標設定縮短成績，教練在設計目標時最需要納入哪一類知識？
  locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  options:
  - text: 該跑者代謝與生物力學特徵
    correct: true
  - text: 該跑者最喜歡的音樂類型
    correct: false
    why_wrong: 音樂偏好與運動表現目標的設計無直接關聯。
  - text: 該跑者人格特質完整光譜
    correct: false
    why_wrong: 人格特質雖與動機相關，但教材強調目標須對齊運動科學子領域。
- id: ch08.ideal-performance-state.i02.q1
  item: ch08.ideal-performance-state.i02
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名資深網球選手在比賽關鍵分時報告「完全不去想動作怎麼打」，此經驗最符合理想表現狀態的哪一特徵？
  locator: Ideal Performance State
  options:
  - text: 不去思考或分析表現
    correct: true
  - text: 強烈的自我效能感
    correct: false
    why_wrong: 自我效能感描述的是對能力的信心，與「不去想動作」這種主觀經驗並非同一特徵。
  - text: 對觀眾評價高度敏感
    correct: false
    why_wrong: 對觀眾評價敏感與「不去想動作」的方向相反。
- id: ch08.ideal-performance-state.i04.q1
  item: ch08.ideal-performance-state.i04
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 教材指出理想表現狀態的「輕鬆感」與一般可命令式放鬆最主要的差異為何？
  locator: Ideal Performance State
  options:
  - text: 它是一種非自願發生的經驗
    correct: true
  - text: 它主要靠意志命令自己產生
    correct: false
    why_wrong: 教材明指這種放鬆感是非自願的經驗，不能像開關般命令自己進入。
  - text: 它必須透過外部回饋才會出現
    correct: false
    why_wrong: 教材未把此經驗與外部回饋掛勾；它是主觀、不由命令產生的狀態。
- id: ch08.ideal-performance-state.i05.q1
  item: ch08.ideal-performance-state.i05
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: Which subjective experience is most directly described by the athlete's sense of personal control during the ideal performance state?
  locator: Ideal Performance State
  options:
  - text: feeling in control of the performance
    correct: true
  - text: consciously planning every movement detail
    correct: false
    why_wrong: The textbook links the personal-control feature of the ideal performance state to the subjective sense during the flow-like state, not to the conscious planning that belongs to the cognitive learning stage.
  - text: feeling detached from the outcome of the event
    correct: false
    why_wrong: The chapter lists personal control as a felt sense of being in command during performance, not as indifference to the outcome; detachment inverts the construct.
- id: ch08.ideal-performance-state.i08.q1
  item: ch08.ideal-performance-state.i08
  dco: sf2.A.3
  lang: en
  cognitive: application
  stem: Which foundation does the textbook most emphasize when using Kobe Bryant to illustrate the ideal performance state?
  locator: Ideal Performance State
  options:
  - text: solid physical training plus past successful performances
    correct: true
  - text: a relaxed pregame routine inherited from his coach
    correct: false
    why_wrong: The textbook ties Bryant's state to physical preparation and a history of successful performances, not to inheriting a specific pregame routine from his coach.
  - text: unusually low baseline anxiety before competition
    correct: false
    why_wrong: The illustration is built on physical training and past success, not on any claim that his baseline anxiety was unusually low before competition.
- id: ch08.motivation.i01.q1
  item: ch08.motivation.i01
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 一名選手即使沒有獎金或獎牌仍每日自主訓練，教練最可能據此判斷該選手的哪一種動機最為活躍？
  locator: Motivation > Intrinsic and Extrinsic Motivation
  options:
  - text: 來自內在的自主動機
    correct: true
  - text: 外在獎項與社會認可驅動
    correct: false
    why_wrong: 教材把獎項與社會認可歸為外在動機，而題幹已說明無酬也練習，外在獎勵不足以解釋此行為。
  - text: 為避免懲罰而被迫練習
    correct: false
    why_wrong: 教材指出懲罰恐懼屬於外在動機，且必須有具體嫌惡後果；題幹未呈現任何懲罰情境，難以推論為避免懲罰而動。
- id: ch08.motivation.i03.q1
  item: ch08.motivation.i03
  dco: sf2.A.1
  lang: zh
  cognitive: application
  stem: 一名選手總是主動挑選剛好能測試自身能力的比賽強度，動機理論最可能將他歸類為哪一型？
  locator: Motivation > Achievement Motivation
  options:
  - text: 追求成功動機主導
    correct: true
  - text: 避免失敗動機主導
    correct: false
    why_wrong: 教材指出 MAF 主導者偏好極易成功或極難、不會被期待獲勝的情境，以減少感到羞恥的可能；題幹敘述其實是 MAS 主導者主動選擇可評估自身能力的挑戰。
  - text: 同時受兩動機支配
    correct: false
    why_wrong: 教材說每個人都有 MAS 與 MAF，但本題的行為偏向 MAS 主導而非兩者強度相等；說兩者並列會失去題幹的傾向線索。
- id: ch08.motivation.i06.q1
  item: ch08.motivation.i06
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名選手在練習中不斷出現甩手與逃避伸展的行為，教練想降低此行為頻率，最直接屬於哪一類操作策略？
  locator: Motivation > Positive and Negative Reinforcement in Coaching
  options:
  - text: 正懲罰
    correct: true
  - text: 正增強
    correct: false
    why_wrong: 正增強是在目標行為後給予正向事件以增加其發生機率，方向與降低逃避伸展的頻率相反。
  - text: 負增強
    correct: false
    why_wrong: 負增強同樣旨在增加目標行為，教材並未把移除嫌惡事件作為降低逃避伸展行為的主要操作策略。
- id: ch08.motor-skill-acquisition.i01.q1
  item: ch08.motor-skill-acquisition.i01
  dco: pa3.A.2
  lang: zh
  cognitive: application
  stem: 教練在評估運動員是否「學會」一個動作時，最應避免哪一類的判斷依據？
  locator: Enhancing Motor Skill Acquisition and Learning > Learning–Performance Distinction
  options:
  - text: 單次練習當下的表現結果
    correct: true
  - text: 多次練習後技能的相對永久改變
    correct: false
    why_wrong: 教材定義學習為相對永久的改變，多次練習趨勢才是學習的判準。
  - text: 運動員對動作感覺的回饋
    correct: false
    why_wrong: 內在感覺回饋屬於教材所述的內在回饋來源，提供動作線索但本身並非「學會」與否的最終判準。
- id: ch08.motor-skill-acquisition.i02.q1
  item: ch08.motor-skill-acquisition.i02
  dco: pa3.A.2
  lang: zh
  cognitive: application
  stem: 教練想把弓箭步動作的兩個高度相關的下肢環節拆開分練，教材最建議改用哪一種練習安排？
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Whole Versus Part Practice
  options:
  - text: 整體練習
    correct: true
  - text: 部分練習
    correct: false
    why_wrong: 子成分高度相互關聯時教材反而建議整體練習以免妨礙重新組合；拆開分練違反此指引。
  - text: 心中意象演練
    correct: false
    why_wrong: 純粹意象屬於心理意象技巧，並非教材針對高度關聯動作所建議的動作實作安排。
- id: ch08.motor-skill-acquisition.i05.q1
  item: ch08.motor-skill-acquisition.i05
  dco: pa3.A.2
  lang: en
  cognitive: application
  stem: A coach plans to improve an athlete's ability to transfer a learned skill to unfamiliar tactical contexts. Which practice arrangement is most consistent with the textbook's guidance?
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Variable Practice
  options:
  - text: include variable practice of the skill within a session
    correct: true
  - text: repeat the same drill unchanged in every set
    correct: false
    why_wrong: Repeating unchanged drills is constant practice, which the textbook contrasts with variable practice and does not present as a way to build contextual flexibility.
  - text: shorten the session to remove all skill variations
    correct: false
    why_wrong: Removing variation eliminates the contextual transfer that variable practice is designed to develop in the first place.
- id: ch08.motor-skill-acquisition.i06.q1
  item: ch08.motor-skill-acquisition.i06
  dco: pa3.A.2
  lang: zh
  cognitive: application
  stem: 一對搭檔在重量訓練室輪流執行抓舉，另一人在休息時仔細觀察搭檔動作。這項安排最符合教材所稱的哪一種練習益處？
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Observational Learning
  options:
  - text: 觀察結合身體練習
    correct: true
  - text: 純粹的意象演練
    correct: false
    why_wrong: 教材所述的觀察練習是觀看實際執行中的動作或影片，與在心中演練的心理意象不同層次。
  - text: 隨機練習安排
    correct: false
    why_wrong: 隨機練習強調同一節課內交替多項技能以產生相互干擾，與教材描述的觀察與實作搭配並非同義。
- id: ch08.motor-skill-acquisition.i07.q1
  item: ch08.motor-skill-acquisition.i07
  dco: pa3.A.2
  lang: en
  cognitive: application
  stem: A novice lifter is preparing for a high-pressure competition and the coach wants to minimize attentional overload. Which instructional style is most aligned with the textbook's guidance for this context?
  locator: Enhancing Motor Skill Acquisition and Learning > Instructions
  options:
  - text: explicit instructions with concrete cues
    correct: true
  - text: discovery style with minimal direction
    correct: false
    why_wrong: Discovery style leaves athletes to explore solutions with little direction, which the textbook warns can slow learning and add attentional load in a high-pressure novice context.
  - text: guided discovery with only abstract goals
    correct: false
    why_wrong: Guided discovery without concrete cues still leans toward discovery, which the textbook cautions may impair performance under pressure for novices.
- id: ch08.motor-skill-acquisition.i08.q1
  item: ch08.motor-skill-acquisition.i08
  dco: pa3.A.3
  lang: zh
  cognitive: application
  stem: 一名已能穩定完成深蹲的運動員，教練若最重視長期技能學習，應採取哪一種回饋安排？
  locator: Enhancing Motor Skill Acquisition and Learning > Feedback
  options:
  - text: 嘗試後再給予延遲回饋
    correct: true
  - text: 每次動作中即時給予同步回饋
    correct: false
    why_wrong: 教材指出同步回饋可增進當下表現但損害學習，與題幹追求長期學習的目標相反。
  - text: 在初次學會後就不再給予任何回饋
    correct: false
    why_wrong: 教材以較低頻率的延遲回饋促進技能習得，並未主張學會後完全停止回饋；停止會喪失教材強調的回饋線索功能。
- id: ch08.psychological-techniques.i03.q1
  item: ch08.psychological-techniques.i03
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: An older athlete with a recovering shoulder cannot tolerate high muscle tension during relaxation drills. Which technique is most consistent with the textbook's recommendation for this situation?
  locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Autogenic Training
  options:
  - text: autogenic training focusing on warmth and heaviness
    correct: true
  - text: progressive muscle relaxation with maximal contractions
    correct: false
    why_wrong: Maximal contractions reintroduce high tension that the recovering shoulder cannot tolerate, the opposite of what the textbook recommends for this case.
  - text: systematic desensitization before learning any imagery
    correct: false
    why_wrong: Systematic desensitization still relies on prior PMR and imagery, so it cannot serve as the low-tension alternative the chapter proposes for injured or older athletes.
- id: ch08.psychological-techniques.i05.q1
  item: ch08.psychological-techniques.i05
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: Based on the textbook, which combination best represents the recommended imagery practice for an athlete just beginning to use mental imagery?
  locator: Psychological Techniques for Improved Performance > Imagery
  options:
  - text: start with familiar static images and gradually add sensory complexity
    correct: true
  - text: use exclusively third-person perspectives throughout training
    correct: false
    why_wrong: The textbook notes the imagery literature cannot determine that third-person is superior to first-person; prescribing exclusivity overstates the evidence the chapter actually cites.
  - text: rely on mental imagery as a complete substitute for physical practice
    correct: false
    why_wrong: Mental imagery augments but does not replace physical practice in skill acquisition; substituting it entirely contradicts the chapter's framing.
- id: ch08.psychological-techniques.i07.q1
  item: ch08.psychological-techniques.i07
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名新手選手在練習中對自己重複「肘部抬高、把槓貼身」，教練最應注意這屬於哪一種類型的自我對話？
  locator: Psychological Techniques for Improved Performance > Self-Talk
  options:
  - text: 指導性自我對話
    correct: true
  - text: 鼓勵性自我對話
    correct: false
    why_wrong: 鼓勵性自我對話強調動機與情緒增強，「肘部抬高、把槓貼身」屬於具體的表現線索而非情緒鼓勵。
  - text: 負向自我對話
    correct: false
    why_wrong: 負向自我對話反映憤怒、沮喪或自我懷疑，「肘部抬高、把槓貼身」並非此類負面評價。
- id: ch08.motor-skill-acquisition.i05.q2
  item: ch08.motor-skill-acquisition.i05
  dco: pa3.A.2
  lang: zh
  cognitive: recall
  stem: 變化練習（variable practice）最主要的特徵為何？
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Variable Practice
  options:
  - text: 同節課中改變同一技能變化
    correct: true
  - text: 嚴格固定一種技術動作操作
    correct: false
    why_wrong: 嚴格固定單一變化是常數練習的特徵，反而與變化練習的定義相反。
  - text: 同時隨機穿插多項不同技能
    correct: false
    why_wrong: 隨機穿插多項不同技能屬於隨機練習的安排，與本題變化同一技能不同變化的概念不同。
- id: ch08.motor-skill-acquisition.i06.q2
  item: ch08.motor-skill-acquisition.i06
  dco: pa3.A.2
  lang: en
  cognitive: recall
  stem: Which finding from research cited in the textbook best supports combining observational practice with physical practice during power cleans?
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Observational Learning
  options:
  - text: the combination improved technique versus physical practice alone
    correct: true
  - text: observation alone outperformed all forms of physical practice
    correct: false
    why_wrong: The textbook cites added benefit over physical practice alone, not a claim that observation alone outperforms every form of physical practice.
  - text: observational practice had no effect on lifting performance
    correct: false
    why_wrong: The cited research links observational plus physical practice to improved high-pull technique, contradicting any no-effect claim.
- id: ch08.motor-skill-acquisition.i07.q2
  item: ch08.motor-skill-acquisition.i07
  dco: pa3.A.2
  lang: zh
  cognitive: recall
  stem: 依教材定義，「引導發現」指示風格最主要的訊息內容為何？
  locator: Enhancing Motor Skill Acquisition and Learning > Instructions
  options:
  - text: 整體動作目標與重要提示
    correct: true
  - text: 完整的執行規則與具體處方
    correct: false
    why_wrong: 完整規則與具體處方屬於明確指示的內容，與引導發現的訊息範圍不同。
  - text: 只給整體任務目標而不附提示
    correct: false
    why_wrong: 只給整體任務目標而不附提示屬於發現法的極端，引導發現仍會提供重要提示協助學習。
- id: ch08.motor-skill-acquisition.i02.q2
  item: ch08.motor-skill-acquisition.i02
  dco: pa3.A.2
  lang: zh
  cognitive: recall
  stem: 依教材所舉例，弓箭步動作最不適合拆解分練，最主要原因為何？
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Whole Versus Part Practice
  options:
  - text: 兩個下肢動作高度相互關聯
    correct: true
  - text: 弓箭步的子成分數量過少
    correct: false
    why_wrong: 教材以子成分關聯性作為整體或部分練習的依據，並未把子成分數量列為關鍵變因。
  - text: 弓箭步需要最大肌力才能執行
    correct: false
    why_wrong: 肌力門檻並非教材決定整體或部分練習的標準，教材只看子成分關聯性與風險代價。
- id: ch08.psychological-techniques.i02.q1
  item: ch08.psychological-techniques.i02
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 漸進式肌肉放鬆中，每個肌群最大收緊的建議時間最接近哪一個？
  locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Progressive Muscular Relaxation
  options:
  - text: 10至15秒
    correct: true
  - text: 30至45秒
    correct: false
    why_wrong: 教材把時間帶界定在 10 至 15 秒，把收緊拖到 30 至 45 秒已超出此區間一倍以上。
  - text: 60至90秒
    correct: false
    why_wrong: 教材未要求把最大收緊持續到一分鐘以上；收緊應為短暫的，並隨後立即進入有意識放鬆。
- id: ch08.psychological-techniques.i06.q1
  item: ch08.psychological-techniques.i06
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: Bandura 列出的自我效能來源共有幾項？
  locator: Psychological Techniques for Improved Performance > Self-Efficacy
  options:
  - text: 六項
    correct: true
  - text: 三項
    correct: false
    why_wrong: 教材列出過去表現成就、替代經驗、口語說服、意象、生理狀態與情緒狀態共六項來源，僅取其三會明顯低估 Bandura 所提範圍。
  - text: 兩項
    correct: false
    why_wrong: 教材所列自我效能來源明顯超過兩項，僅列兩項同樣屬於低估。
- id: ch08.ideal-performance-state.i01.q1
  item: ch08.ideal-performance-state.i01
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 在理想表現狀態的典型報告中，「無恐懼」最主要指運動員沒有什麼？
  locator: Ideal Performance State
  options:
  - text: 對失敗的恐懼感受
    correct: true
  - text: 對任何一場比賽結果的預期
    correct: false
    why_wrong: 教材把此特徵界定為沒有失敗恐懼，而不是對結果沒有任何預期；沒有預期反而剝奪了運動員評估自身表現的依據。
  - text: 對賽前緊張的生理活化感受
    correct: false
    why_wrong: 教材描述的理想表現狀態中，狹窄的注意力與任務相關焦點並未排除賽前活化；用「沒有緊張活化」是對此特徵的過度延伸。
- id: ch08.ideal-performance-state.i06.q1
  item: ch08.ideal-performance-state.i06
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 教材中提及的理想表現狀態之時間與空間扭曲，最具體描述為何？
  locator: Ideal Performance State
  options:
  - text: 感到時間似乎變慢
    correct: true
  - text: 感到時間明顯加快
    correct: false
    why_wrong: 教材只具體寫出時間似乎變慢的主觀感覺，說「時間變快」直接與教材描述的方向相反。
  - text: 感到空間距離被放大
    correct: false
    why_wrong: 教材並未對空間距離的扭曲給出具體描述；把焦點放到空間維度會超出教材對此特徵的界定範圍。
- id: ch08.motivation.i02.q1
  item: ch08.motivation.i02
  dco: sf2.A.1
  lang: en
  cognitive: recall
  stem: Which item is most clearly an example of an extrinsic reward in sport, according to the textbook?
  locator: Motivation > Intrinsic and Extrinsic Motivation
  options:
  - text: receiving a trophy for placing first
    correct: true
  - text: feeling competent after mastering a drill
    correct: false
    why_wrong: The textbook ties feeling competent to intrinsic drives such as autonomy and competence, not to extrinsic rewards from outside the athlete.
  - text: choosing when to attempt the next drill
    correct: false
    why_wrong: Self-controlled practice is framed as intrinsic motivation through autonomy; deciding drill order is not itself an extrinsic reward.
- id: ch08.psychological-techniques.i04.q1
  item: ch08.psychological-techniques.i04
  dco: sf2.A.2
  lang: en
  cognitive: analysis
  stem: A gymnast fears the balance beam and the sport psychologist first helps her master progressive muscle relaxation and imagery, then guides her through imagined scenes from least to most intimidating while staying relaxed. Which technique is this most consistent with?
  locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Systematic Desensitization
  options:
  - text: systematic desensitization using counterconditioning
    correct: true
  - text: autogenic training focused on warmth and heaviness
    correct: false
    why_wrong: Autogenic training centers on bodily sensations in a single session; it does not pair a fear hierarchy with relaxation to replace the fear response.
  - text: imagery rehearsal of the skill in isolation
    correct: false
    why_wrong: Imagery rehearsal of the skill alone targets motor learning rather than substituting a relaxation response for fear across a graduated set of scenes.
- id: ch08.psychological-techniques.i08.q1
  item: ch08.psychological-techniques.i08
  dco: sf2.A.2
  lang: en
  cognitive: analysis
  stem: A penalty taker routinely checks breathing, scans the goal, and rehearses leg position before each kick. Based on the textbook, this habit most directly functions to do what during performance?
  locator: Attention and Focus
  options:
  - text: protect selective attention from task-irrelevant worries
    correct: true
  - text: raise baseline arousal into the optimal performance zone
    correct: false
    why_wrong: Routines are framed as attentional checks on controllable cues, not as arousal regulators that shift baseline activation toward a target zone.
  - text: replace the need for imagery-based preparation
    correct: false
    why_wrong: Routines work alongside imagery and other psychological techniques; they complement mental preparation rather than substitute for it.
- id: ch08.arousal-theories.i08.q1
  item: ch08.arousal-theories.i08
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名教練即將帶領首次參加全國錦標賽的高中舉重選手，賽前最重要的工作應優先聚焦於哪一項？
  locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Skill Level
  options:
  - text: 簡化任務並降低決策負擔
    correct: true
  - text: 提升選手對動作細節的有意識分析
    correct: false
    why_wrong: 教材對新手的指引是降低決策負荷；強化有意識分析會讓工作記憶被動作細節占滿，與高壓情境下的處置方向相反。
  - text: 反覆安排模擬觀眾噪音以提高抗壓性
    correct: false
    why_wrong: 高壓模擬屬於額外刺激輸入，教材對新手教練的策略是降低喚醒與決策責任，並未主張以噪音暴露來提升新手表現。
- id: ch08.motor-skill-acquisition.i01.q2
  item: ch08.motor-skill-acquisition.i01
  dco: pa3.A.3
  lang: zh
  cognitive: analysis
  stem: 教練在一次訓練課後觀察到選手的動作表現下滑，最不應該將這次表現直接解讀為什麼？
  locator: Enhancing Motor Skill Acquisition and Learning > Learning–Performance Distinction
  options:
  - text: 選手尚未學會該項技能
    correct: true
  - text: 環境光線偏暗影響動作協調
    correct: false
    why_wrong: 環境因素會壓低當下表現，但屬於表現層次的暫時變數，不能反映技能是否學會，仍非教材對學習的主要判準。
  - text: 安排了較不熟悉的練習器材
    correct: false
    why_wrong: 器材陌生會影響當下動作表現，但教材定義的學習仍須回到多次練習下技能是否產生相對永久改變來判斷。
- id: ch08.motor-skill-acquisition.i03.q2
  item: ch08.motor-skill-acquisition.i03
  dco: pa3.A.2
  lang: zh
  cognitive: recall
  stem: 教練採用分段法（segmentation）拆解技術時，最主要的拆解依據為何？
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Whole Versus Part Practice
  options:
  - text: 技能中清楚可辨的間斷點
    correct: true
  - text: 動作速度或器材的難度調整
    correct: false
    why_wrong: 改變速度或器材以降低難度屬於簡化法（simplification）的處理方式，不是分段法的拆解依據。
  - text: 教練主觀認定哪一動作較不重要
    correct: false
    why_wrong: 分段法以技能結構中客觀可辨的間斷點為依據；教練主觀認定重要性並非教材所列的拆解原則。
- id: ch08.motor-skill-acquisition.i04.q2
  item: ch08.motor-skill-acquisition.i04
  dco: pa3.A.2
  lang: zh
  cognitive: analysis
  stem: 教練在一次訓練中隨機交替安排三項投籃變化，選手單一變化的當下命中率明顯下降，此時教練最恰當的解讀為何？
  locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Random Practice
  options:
  - text: 此安排有利於長期學習
    correct: true
  - text: 應立即轉為意象練習
    correct: false
    why_wrong: 教材明列隨機練習初期單一技能表現下降是正常現象；改為意象練習跳過了隨機練習本身的學習機制，並非書中建議的因應方式。
  - text: 應全面改為區塊式單項反覆
    correct: false
    why_wrong: 教材建議以少量重複後再轉換的混合方式；據此全面退回區塊式會錯失隨機練習帶來的學習效果。
- id: ch08.motor-skill-acquisition.i08.q2
  item: ch08.motor-skill-acquisition.i08
  dco: pa3.A.3
  lang: zh
  cognitive: application
  stem: 教練希望最大化選手的長期技能學習，最應優先採用哪種回饋安排？
  locator: Enhancing Motor Skill Acquisition and Learning > Feedback
  options:
  - text: 延遲回饋且降低頻率
    correct: true
  - text: 嘗試後立即且大量給予
    correct: false
    why_wrong: 教材指出每次嘗試後大量即時回饋會損害技能習得；延遲且低頻才是教材對長期學習的建議安排。
  - text: 動作中持續口頭提示
    correct: false
    why_wrong: 動作中持續口頭提示屬於同步回饋，教材明列其有助當下表現但不利學習，與本題追求長期學習的目標相反。
- id: ch08.psychological-techniques.i01.q1
  item: ch08.psychological-techniques.i01
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名田徑選手在比賽前因緊張而肌肉僵硬，最應優先安排下列哪一項技巧以降低生理喚醒並建立任務相關焦點？
  locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Diaphragmatic Breathing
  options:
  - text: 橫膈膜呼吸搭配控制吐氣
    correct: true
  - text: 賽前聆聽節奏偏快的音樂
    correct: false
    why_wrong: 教材把腹式呼吸定位為降低生理喚醒的前置技巧；聆聽快節奏音樂屬於提升能量輸入，與降低喚醒的目標方向不一致。
  - text: 賽前大聲覆述對手名單
    correct: false
    why_wrong: 反覆覆述對手名單屬於戰術記憶的語言任務，教材並未把此活動列為降低喚醒或建立任務相關焦點的主要方法。
- id: ch08.psychological-techniques.i01.q2
  item: ch08.psychological-techniques.i01
  dco: sf2.A.2
  lang: en
  cognitive: recall
  stem: Which physiological change does the chapter attribute to diaphragmatic breathing's controlled exhalation phase?
  locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Diaphragmatic Breathing
  options:
  - text: Increased vagal tone or parasympathetic activity
    correct: true
  - text: Elevated sympathetic outflow to skeletal muscle
    correct: false
    why_wrong: The chapter frames controlled exhalation as shifting autonomic balance toward parasympathetic activity, the opposite direction from increased sympathetic outflow.
  - text: A sudden surge in catecholamine release
    correct: false
    why_wrong: Catecholamine surges are part of acute activation; the chapter describes the breathing effect as lowering neural drive to muscle and organs, not amplifying stress hormones.
- id: ch08.psychological-techniques.i03.q2
  item: ch08.psychological-techniques.i03
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A coach is selecting a relaxation method for an older athlete recovering from a hamstring strain. Which technique is most appropriate given that the athlete should avoid sustained high muscle tension?
  locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Autogenic Training
  options:
  - text: Autogenic relaxation training
    correct: true
  - text: Imagery of the limb at full effort
    correct: false
    why_wrong: Picturing maximal exertion raises arousal instead of lowering it, which is the opposite of what this athlete needs.
  - text: Precompetition mental rehearsal
    correct: false
    why_wrong: Rehearsing skills beforehand prepares execution rather than easing the sustained muscle tension this athlete must avoid.
- id: ch08.psychological-techniques.i04.q2
  item: ch08.psychological-techniques.i04
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 教材指出在進行系統減敏感法之前，運動心理師最應先協助選手完成哪些準備？
  locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Systematic Desensitization
  options:
  - text: 先熟練 PMR 與意象並自建恐懼層級
    correct: true
  - text: 直接在比賽現場反覆練習恐懼動作
    correct: false
    why_wrong: 教材強調先在可控制的小劑量中經驗制約恐懼，跳過準備直接上場屬於暴露情境的反向延伸。
  - text: 把恐懼事件統一由教練代為列出層級
    correct: false
    why_wrong: 教材要求由運動員自己建立恐懼的事件與情境層級，由教練代列會把層級的個人化來源移轉。
- id: ch08.psychological-techniques.i05.q2
  item: ch08.psychological-techniques.i05
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名選手在心理意象練習上已能熟練想像單一靜態畫面，下一步最應優先發展的能力為何？
  locator: Psychological Techniques for Improved Performance > Imagery
  options:
  - text: 增加影像的動態控制與多感官複雜度
    correct: true
  - text: 改為只在外在第三人稱視角想像動作
    correct: false
    why_wrong: 教材指出文獻未能確定哪一種視角較優，建議採較投入且自然的視角；改為只用第三人稱並非教材的進階指引。
  - text: 同步減少呼吸深度以拉長每次意象時間
    correct: false
    why_wrong: 教材把意象描述為動用多感官模擬表現，並未主張以降低呼吸深度來延長意象時間。
- id: ch08.psychological-techniques.i07.q2
  item: ch08.psychological-techniques.i07
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 一名已能自動執行發球動作的資深網球選手在重大比賽前，刻意對自己覆述「肘部抬高、拋球點在額前」。教材對此安排最主要的保留為何？
  locator: Psychological Techniques for Improved Performance > Self-Talk
  options:
  - text: 對專家而言指導性線索可能干擾表現
    correct: true
  - text: 指導性線索可進一步鞏固專家的自動化
    correct: false
    why_wrong: 教材把這類具體線索的效果限定在實驗室情境，對已熟練者反而列為可能的干擾來源，不是鞏固手段。
  - text: 改用正向自我對話即可提高自我效能
    correct: false
    why_wrong: 教材指出部分運動員在換成鼓勵語句後，自我效能反而下降，因此不能當成穩定成立的替代方案。
- id: ch08.arousal-anxiety-stress.i01.q2
  item: ch08.arousal-anxiety-stress.i01
  dco: sf2.A.2
  lang: en
  cognitive: recall
  stem: According to the textbook, an athlete's arousal at any given moment falls somewhere within which range?
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Arousal'
  options:
  - text: A continuum from deep sleep or coma to intense excitement
    correct: true
  - text: A fixed level that does not change across situations
    correct: false
    why_wrong: The chapter places arousal on a continuous band; describing it as a fixed level contradicts that framing.
  - text: A rating scale that runs from mild to severe anxiety
    correct: false
    why_wrong: Anxiety is a separate construct with its own negative appraisal; the band described in this section spans activation level, not degrees of worry.
- id: ch08.arousal-anxiety-stress.i02.q2
  item: ch08.arousal-anxiety-stress.i02
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A gymnast reports dreading an upcoming competition and notices her heart is pounding and her stomach feels uneasy. Which component of anxiety is best illustrated by these bodily reactions?
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Anxiety'
  options:
  - text: Somatic anxiety
    correct: true
  - text: Attentional narrowing
    correct: false
    why_wrong: Narrowed focus is a change in what the athlete attends to, not the bodily symptom pattern described here.
  - text: Positive eustress
    correct: false
    why_wrong: Eustress is the facilitative reading of activation; dread and an uneasy stomach point the other way entirely.
- id: ch08.arousal-anxiety-stress.i04.q2
  item: ch08.arousal-anxiety-stress.i04
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A coach wants to predict which athletes are most likely to flood their working memory with catastrophic thoughts during complex decisions. Which individual difference best fits this concern?
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Anxiety'
  options:
  - text: High trait anxiety
    correct: true
  - text: Outcome-goal orientation
    correct: false
    why_wrong: Caring about results describes what an athlete pursues, not a standing disposition to read pressure as threatening.
  - text: Low technical skill level
    correct: false
    why_wrong: Poor technique limits execution, but the chapter pins catastrophic thinking under pressure on a stable anxiety disposition.
- id: ch08.arousal-anxiety-stress.i06.q2
  item: ch08.arousal-anxiety-stress.i06
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 教材中對「壓力」（stress）所下的定義，最核心的條件為何？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Stress'
  options:
  - text: 需求與因應能力之間的重大失衡
    correct: true
  - text: 心率與血壓同步升高的生理狀態
    correct: false
    why_wrong: 心率與血壓升高只是壓力反應的表徵之一，教材把失衡列為壓力的核心定義；用生理反應代替失衡會把定義縮窄到生理層。
  - text: 對失敗的自責與羞恥等情緒評價
    correct: false
    why_wrong: 自責與羞恥屬於避免失敗動機章節的內容，教材未把壓力的核心條件寫成內在情緒評價。
- id: ch08.arousal-theories.i01.q2
  item: ch08.arousal-theories.i01
  dco: sf2.A.2
  lang: en
  cognitive: recall
  stem: According to Hull's drive theory as summarized in the chapter, which statement is most accurate?
  locator: Influence of Arousal and Anxiety on Performance > Drive Theory
  options:
  - text: Higher arousal can help performance up to a point, beyond which it can be harmful
    correct: true
  - text: Performance gains scale linearly with arousal at every skill level
    correct: false
    why_wrong: The chapter qualifies the upward relationship and explicitly rejects a one-to-one linear scaling across all skill levels and arousal amounts.
  - text: Only physiological arousal, not cognitive state anxiety, drives performance
    correct: false
    why_wrong: Drive theory treats arousal and state anxiety as overlapping drivers, so claiming cognitive state anxiety has no role contradicts the chapter's framing.
- id: ch08.arousal-theories.i02.q2
  item: ch08.arousal-theories.i02
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A novice lifter is learning the clean and jerk. Compared with an elite lifter performing the same lift, where is the novice's optimal arousal level most likely to sit?
  locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Skill Level
  options:
  - text: Lower
    correct: true
  - text: Equal
    correct: false
    why_wrong: The chapter ties the optimal point to skill maturity, so two lifters at different levels cannot share one optimum.
  - text: Higher
    correct: false
    why_wrong: Drive theory pairs a weaker skill base with a lower activation ceiling, so more arousal degrades the beginner's lift.
- id: ch08.arousal-theories.i04.q2
  item: ch08.arousal-theories.i04
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 教材所述倒 U 理論最核心的主張為何？
  locator: Influence of Arousal and Anxiety on Performance > Inverted-U Theory
  options:
  - text: 升至最佳點前有利，超過後反致表現下降
    correct: true
  - text: 表現永遠與喚醒呈正向線性關係
    correct: false
    why_wrong: 教材指出超過最佳點後表現會下降；把關係寫成永遠正向線性會把倒 U 的轉折點整個抹平。
  - text: 中等喚醒在任何運動項目都必然最差
    correct: false
    why_wrong: 教材把中等喚醒視為倒 U 假說的核心起點，說它必然最差會把方向直接翻轉。
- id: ch08.arousal-theories.i07.q2
  item: ch08.arousal-theories.i07
  dco: sf2.A.2
  lang: zh
  cognitive: application
  stem: 教練希望協助一名在賽前把高喚醒視為「緊張失控」的選手重新解讀同樣的生理活化，最適合引用的理論為何？
  locator: Influence of Arousal and Anxiety on Performance > Reversal Theory
  options:
  - text: 逆轉理論
    correct: true
  - text: IZOF理論
    correct: false
    why_wrong: IZOF 強調個別最佳喚醒帶寬，但並未把選手對喚醒的詮釋差異列為介入點；用來指導重新解讀會把焦點從詮釋拉到帶寬。
  - text: 災難理論
    correct: false
    why_wrong: 災難理論描述高認知焦慮下表現可能突然崩跌，並未提出透過詮釋改變來介入的策略，與題幹要求的介入方式不一致。
- id: ch08.attention-concentration.i01.q2
  item: ch08.attention-concentration.i01
  dco: pa3.A.2
  lang: zh
  cognitive: application
  stem: 教練要求選手在罰球前默唸「呼吸、膝蓋、球離手」三個線索後，選手回報「腦中只剩這三個字，原本的緊張想法自動退到一邊」。教材最能用哪一個機制解釋這個現象？
  locator: Attention and Focus
  options:
  - text: 任務相關想法占滿工作記憶，擠出擔憂
    correct: true
  - text: 長期記憶容量被臨時擴大以容納新線索
    correct: false
    why_wrong: 教材以工作記憶容量有限來解釋擠出效應，把機制寫成長期記憶容量擴張會把層次整個搬移。
  - text: 視覺搜尋速度因疲倦而自然下降
    correct: false
    why_wrong: 視覺搜尋屬於外在線索處理，教材描述的擠出效應發生在工作記憶層次，與視覺疲勞不同機制。
- id: ch08.attention-concentration.i04.q2
  item: ch08.attention-concentration.i04
  dco: pa3.A.2
  lang: zh
  cognitive: recall
  stem: 依 Nideffer 框架，窄內部注意與廣內部注意最主要的差別為何？
  locator: Attention and Focus > Attentional Styles
  options:
  - text: 寬度由整合多項資訊縮為單一預演
    correct: true
  - text: 方向由內在轉為外在環境掃描
    correct: false
    why_wrong: 把方向由內在改為外在環境掃描，是從內部風格換成外部風格，與本題比較窄內部與廣內部兩種內在風格的題意不同。
  - text: 內容由動作預演改為完全沒有焦點
    correct: false
    why_wrong: 教材描述窄內部注意仍在心中預演即將進行的動作，並未把它寫成完全沒有焦點的空白狀態。
- id: ch08.attention-concentration.i06.q2
  item: ch08.attention-concentration.i06
  dco: pa3.A.2
  lang: en
  cognitive: application
  stem: A novice tennis player freezes and cannot decide where to hit when an unexpected wind gust shifts the ball's flight. Which cognitive mechanism from Fitts and Posner most directly explains this overload?
  locator: Attention and Focus
  options:
  - text: Available attention is fully consumed by movement details
    correct: true
  - text: The athlete has reached the automaticity stage too early
    correct: false
    why_wrong: Automaticity frees attention for external cues; the chapter reserves this overload pattern for learners whose attention is already filled by movement details.
  - text: Broad-internal focus is overloading strategic planning
    correct: false
    why_wrong: Strategic planning is a separate attentional style; the chapter ties the overload to cognitive-stage learners, not to breadth of internal focus.
- id: ch08.attention-concentration.i08.q2
  item: ch08.attention-concentration.i08
  dco: pa3.A.2
  lang: zh
  cognitive: application
  stem: 教練希望選手在高強度比賽中能自然濾除不相關線索，最終追求的注意力階段為何？
  locator: Attention and Focus
  options:
  - text: 自動化階段，技能不須思考即可執行
    correct: true
  - text: 認知階段，必須有意識分析動作細節
    correct: false
    why_wrong: 認知階段要求有意識分析每個動作細節，注意力正被細節占滿，與教材所述自然濾除不相關線索的狀態相反。
  - text: 聯結階段，動作細節不再需要任何注意
    correct: false
    why_wrong: 教材明列聯結階段選手仍須把注意力放在任務上，並非動作細節不再需要任何注意。
- id: ch08.goal-setting.i03.q2
  item: ch08.goal-setting.i03
  dco: sf2.A.1
  lang: en
  cognitive: application
  stem: A veteran marathoner is two months into a buildup block and starting to feel the work is monotonous. Which goal characteristic best counteracts this drift while preserving a high probability of success?
  locator: Psychological Techniques for Improved Performance > Goal Setting > Short-Term Goals
  options:
  - text: Challenging yet attainable near-term targets
    correct: true
  - text: Outcome targets keyed to podium finishes
    correct: false
    why_wrong: Podium outcomes hinge on rival runners, so the athlete cannot bank the early wins that sustain motivation through a long buildup.
  - text: Vague long-range performance ideals
    correct: false
    why_wrong: Distant ideals without checkpoints leave weeks without feedback, which is exactly the monotony the coach is trying to break.
- id: ch08.goal-setting.i04.q2
  item: ch08.goal-setting.i04
  dco: sf2.A.1
  lang: zh
  cognitive: recall
  stem: 教材指出長期目標對日常訓練投入感最主要的功能為何？
  locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  options:
  - text: 看見每日練習如何通往最終表現
    correct: true
  - text: 取代所有短期目標並免除逐週檢核
    correct: false
    why_wrong: 教材把長期與短期目標視為相互依存，寫成取代關係會切斷階層式的精熟感連結。
  - text: 必須逐年重新制定以避免失去動機
    correct: false
    why_wrong: 教材未規定長期目標必須逐年重設，年度重設並非教材連結原則的一部分。
- id: ch08.goal-setting.i06.q2
  item: ch08.goal-setting.i06
  dco: sf2.A.1
  lang: en
  cognitive: application
  stem: A runner records each session's distance, duration, and heart-rate range in a logbook. Which feature of the chapter's quantifiable-target principle is most directly demonstrated by this logging habit?
  locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  options:
  - text: It converts success and failure into clear feedback
    correct: true
  - text: It replaces process goals with outcome goals
    correct: false
    why_wrong: The logging records training execution, not race placings; it stays inside the process-goal domain rather than swapping in outcome goals.
  - text: It removes the need for a long-term direction
    correct: false
    why_wrong: Tracking session metrics supplements long-term planning; it does not retire the directional role the chapter assigns to long-term goals.
- id: ch08.ideal-performance-state.i03.q2
  item: ch08.ideal-performance-state.i03
  dco: sf2.A.2
  lang: zh
  cognitive: recall
  stem: 教材中指出，理想表現狀態的任務相關焦點與下列哪一種注意力使用方式相反？
  locator: Ideal Performance State
  options:
  - text: 浪費注意力在擔憂、災難化或在意評價
    correct: true
  - text: 透過狹窄焦點監控當下動作的感覺
    correct: false
    why_wrong: 監控當下動作感覺與教材描述的狹窄任務相關焦點方向一致，把它列為相反項會混淆教材所列的正反對比。
  - text: 在心中預演即將執行的單一動作
    correct: false
    why_wrong: 心中預演單一動作屬於窄內部注意的用法，教材把它放在任務相關焦點的範疇內，不視為浪費。
- id: ch08.motivation.i04.q2
  item: ch08.motivation.i04
  dco: sf2.A.1
  lang: zh
  cognitive: recall
  stem: 教材中 MAS 主導者最傾向選擇的挑戰類型為何？
  locator: Motivation > Achievement Motivation
  options:
  - text: 成功機率約五成且具挑戰性的不確定情境
    correct: true
  - text: 極易成功、無需評估自身能力的情境
    correct: false
    why_wrong: 極易成功且無需評估能力的情境是 MAF 主導者的偏好，把它當作 MAS 主導者的傾向會把兩個相對動機的舒適區寫反。
  - text: 完全無成敗壓力的純趣味練習
    correct: false
    why_wrong: 無成敗壓力的情境剝奪了 MAS 主導者用以評估自身能力的機會，並非教材描述的偏好。
- id: ch08.arousal-anxiety-stress.i05.q2
  item: ch08.arousal-anxiety-stress.i05
  dco: sf2.A.2
  lang: zh
  cognitive: analysis
  stem: 一名自由車選手在非焦慮的輕鬆訓練中可以自由升降強度，但焦慮時心跳與肌肉張力動輒飆高且難以壓回。教材對此差異最關鍵的描述為何？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Anxiety'
  options:
  - text: 非焦慮時可依需要調節，焦慮時相對失控
    correct: true
  - text: 非焦慮時完全無法調整任何生理指標
    correct: false
    why_wrong: 教材明列非焦慮時可依需要升降喚醒；寫成完全無法調整會把非焦慮狀態的調節能力整個抹除。
  - text: 焦慮時的喚醒一定會自動回歸平常水準
    correct: false
    why_wrong: 教材指出焦慮時喚醒相對失控且通常過高，並未主張它會自動回歸平常；說成自動回歸會把失控的方向整個翻轉。
- id: ch08.arousal-anxiety-stress.i08.q2
  item: ch08.arousal-anxiety-stress.i08
  dco: sf2.A.2
  lang: zh
  cognitive: analysis
  stem: 教材中如何說明「同一個壓力事件會分化成正向壓力或負向壓力」的主要依據？
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Stress'
  options:
  - text: 運動員對壓力源的知覺不同
    correct: true
  - text: 兩位選手生理閾值的先天差異
    correct: false
    why_wrong: 教材把分化依據放在對壓力源的詮釋，而非天生閾值；用先天差異解釋會把焦點從知覺層拉到體質層。
  - text: 兩位選手每週訓練總時數的差距
    correct: false
    why_wrong: 訓練量屬於體能準備層次，教材未把它列為正向與負向壓力分野的依據；用訓練時數解釋屬於自行延伸。
- id: ch08.arousal-theories.i06.q2
  item: ch08.arousal-theories.i06
  dco: sf2.A.2
  lang: zh
  cognitive: analysis
  stem: 教練注意到，旗下選手在認知焦慮升高時，只要生理喚醒也跟著攀升，表現便從穩定變成突然大幅下滑。下列何者最是教材對此現象所強調的特徵？
  locator: Influence of Arousal and Anxiety on Performance > Catastrophe Theory
  options:
  - text: 認知焦慮與生理喚醒同時升高致崩塌
    correct: true
  - text: 表現沿平穩斜率隨喚醒線性下滑
    correct: false
    why_wrong: 教材明列災難理論反對漸進式衰退，平穩斜率屬於簡單倒 U 的延伸，與災難模型強調的突然崩塌不同。
  - text: 認知焦慮升高時生理喚醒反而下降
    correct: false
    why_wrong: 教材描述的是生理喚醒在認知焦慮存在時升高並造成崩跌，把方向寫成生理喚醒下降會把機制整個翻轉。
- id: ch08.motivation.i07.q2
  item: ch08.motivation.i07
  dco: sf2.A.2
  lang: zh
  cognitive: analysis
  stem: 教練希望比較「增強」與「懲罰」對選手注意力結構的長期影響，下列哪一項最能體現教材主張的差異？
  locator: Motivation > Positive and Negative Reinforcement in Coaching > How Should Positive and Negative Reinforcement Be Applied?
  options:
  - text: 增強留焦點在任務，懲罰易塞錯誤
    correct: true
  - text: 懲罰更能擴大任務相關注意力容量
    correct: false
    why_wrong: 教材指出懲罰會讓注意力容量被任務無關線索占滿，與此處描述的方向相反；用懲罰擴大容量會把教材主張的效果寫反。
  - text: 增強與懲罰對注意力結構無差別
    correct: false
    why_wrong: 教材明列兩者在注意力與自我效能上有差異，說兩者效果相同會抹平教材所強調的差異。
- id: ch08.arousal-anxiety-stress.i07.q2
  item: ch08.arousal-anxiety-stress.i07
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A lifter interprets a major meet as a severe threat and develops both mental worry and physical symptoms. Which component set is most directly produced by this negative interpretation of the stressor?
  locator: 'Energy Management: Arousal, Anxiety, and Stress > Stress'
  options:
  - text: Cognitive anxiety and somatic anxiety
    correct: true
  - text: Trait anxiety and automaticity
    correct: false
    why_wrong: Trait anxiety is a stable tendency to see environments as threatening, and automaticity is a skill stage; the chapter lists anxiety components under distress, not these.
  - text: Broad-external focus and broad-internal focus
    correct: false
    why_wrong: These are Nideffer's attentional styles from a different section; the chapter lists distress as producing affective components, not these two focus quadrants together.
- id: ch08.arousal-theories.i03.q2
  item: ch08.arousal-theories.i03
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A marathon runner on autopilot and a soccer midfielder scanning for the next pass both face the same hostile crowd. According to the chapter's criterion, who is most justified in keeping arousal lower?
  locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Task Complexity
  options:
  - text: The soccer midfielder
    correct: true
  - text: The marathon runner
    correct: false
    why_wrong: Long-distance running, although biomechanically complex, typically requires little conscious decision making, so the chapter allows a relatively higher arousal ceiling for that task.
  - text: Both performers equally
    correct: false
    why_wrong: The chapter ties the appropriate arousal ceiling to conscious decision load, which clearly differs between real-time tactical choices and a practiced endurance motor pattern.
- id: ch08.motivation.i06.q2
  item: ch08.motivation.i06
  dco: sf2.A.2
  lang: en
  cognitive: application
  stem: A youth forward keeps arriving late to scheduled lifts, and the coach tells her she will lose her starting spot on game day each time she misses. Which operant category does this arrangement best exemplify?
  locator: Motivation > Positive and Negative Reinforcement in Coaching
  options:
  - text: Negative punishment
    correct: true
  - text: Positive punishment
    correct: false
    why_wrong: Positive punishment adds an aversive stimulus after the response; the coach is removing a valued privilege, the opposite direction.
  - text: Negative reinforcement
    correct: false
    why_wrong: Negative reinforcement removes an aversive stimulus to increase a desired response; removing a starting spot aims to decrease tardiness, the opposite function.
- id: ch08.attention-concentration.i05.q2
  item: ch08.attention-concentration.i05
  dco: sf2.A.2
  lang: en
  cognitive: application
  pool: extra
  stem: When a fighter becomes overwhelmed by external stimuli during a face-off and needs to regain composure, which attentional focus most appropriately addresses this situation?
  locator: Attention and Focus > Attentional Styles
  options:
  - text: Broad-external, which surveys many elements of the surrounding environment
    correct: false
    why_wrong: A performer already overstimulated by outside cues has no capacity left for absorbing more external information, so widening external focus typically deepens the overload rather than relieving it.
  - text: Narrow-external, which locks attention onto one or two key external cues
    correct: true
  - text: Broad-internal, which integrates multiple pieces of information into a plan
    correct: false
    why_wrong: An athlete flooded by sensory input first needs to filter cues down to a single manageable target, not to expand internal analysis across many factors at once.
- id: ch08.motivation.i05.q2
  item: ch08.motivation.i05
  dco: sf2.A.2
  lang: en
  cognitive: application
  pool: extra
  stem: A strength and conditioning coach wants to sharpen athlete focus during a demanding training block using reinforcement principles. Which coaching behavior best fits positive reinforcement?
  locator: Motivation > Positive and Negative Reinforcement in Coaching
  options:
  - text: Praise and recognize the athlete right after a technically sound repetition.
    correct: true
  - text: Cancel the planned conditioning finisher when the athlete finishes the session strong.
    correct: false
    why_wrong: The candidate pictures removing an aversive stimulus after a target behavior, which is the textbook example of negative reinforcement, not positive reinforcement.
  - text: Take away a perk the athlete values whenever technique breaks down in the same drill.
    correct: false
    why_wrong: Stripping a privilege after a behavior aims to reduce that behavior and is textbook punishment, so it does not match a positive reinforcement approach for sharpening focus.
