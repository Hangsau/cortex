meta:
  chapter: ch19
  source: data/cscs/ch19.yaml
questions:
- id: ch19.core-concepts.i03.q1
  item: ch19.core-concepts.i03
  dco: pa1.A.1
  lang: zh
  cognitive: application
  stem: 一名足球員在聽到教練哨音後變向閃過防守者，這項表現最主要是哪一種能力的展現？
  locator: Agility Performance and Change-of-Direction Ability
  options:
  - text: 有刺激下的敏捷
    correct: true
  - text: 預先規劃的變向
    correct: false
    why_wrong: 把有刺激反應的動作誤當成預先決定路徑的變向；題幹明列教練哨音，未涵蓋反應成分的測驗或操練屬於方向改變，不是敏捷。
  - text: 直線衝刺速度
    correct: false
    why_wrong: 混淆敏捷與直線速度；衝刺強調加速並達到最大移動速度，題幹情境是變向閃人，比較的是方向與刺激反應，不是水平位移速度。
- id: ch19.agility-cod.i01.q1
  item: ch19.agility-cod.i01
  dco: pa1.A.1
  lang: zh
  cognitive: analysis
  stem: 一名足球邊後衛在比賽中需要切入約 80 度以上的高速變向，教練最應優先發展哪一種身體素質？
  locator: Agility Performance and Change-of-Direction Ability > Factors Affecting Change of Direction and Perceptual–Cognitive Ability
  options:
  - text: 高速離心與最大肌力
    correct: true
  - text: 低強度有氧耐力
    correct: false
    why_wrong: 把較急切入當成一般耐力問題；本章對切入角度大於或等於 75 度者的建議是離心力量與最大力量，不是心肺耐力。
  - text: 視覺掃描與反應時間
    correct: false
    why_wrong: 把身體變向需求誤讀為純知覺—認知問題；題幹並未提到刺激判斷，只描述較急切入的煞車與再加速需求。
- id: ch19.agility-cod.i02.q1
  item: ch19.agility-cod.i02
  dco: pa1.A.1
  lang: en
  cognitive: application
  stem: A coach wants a test that best reflects the ability to sprint around cones while keeping speed high. Which category best fits that goal?
  locator: Agility Performance and Change-of-Direction Ability > Factors Affecting Change of Direction and Perceptual–Cognitive Ability
  options:
  - text: Maneuverability test
    correct: true
  - text: Reactive agility test
    correct: false
    why_wrong: Adds a reaction stimulus the scenario does not include; without a stimulus to respond to, the task fits maneuverability rather than reactive agility.
  - text: Linear sprint test
    correct: false
    why_wrong: Removes the directional component entirely; sprinting straight does not require the cone navigation described in the stem.
- id: ch19.neuromuscular-basis.i02.q1
  item: ch19.neuromuscular-basis.i02
  dco: pa1.B.1
  lang: zh
  cognitive: recall
  stem: 下列哪一項最能描述伸展—縮短循環（SSC）？
  locator: Neurophysiological Basis for Speed > Stretch–Shortening Cycle
  options:
  - text: 肌肉—肌腱被快速拉伸後立即彈性縮短
    correct: true
  - text: 肌肉無預拉伸單獨做向心收縮
    correct: false
    why_wrong: 忽略了 SSC 必要的離心前置；本章定義明確指出離心—向心耦合是 SSC 的核心，沒有拉伸就沒有 SSC。
  - text: 神經系統以固定速率送出動作電位
    correct: false
    why_wrong: 把神經驅動的描述搬進 SSC 定義；神經驅動是送往肌肉的衝動特性，與肌肉—肌腱的拉長—縮短耦合無關。
- id: ch19.neuromuscular-basis.i08.q1
  item: ch19.neuromuscular-basis.i08
  dco: pa1.B.2
  lang: zh
  cognitive: application
  stem: 下列哪一項最正確描述複合訓練的定位與限制？
  locator: Neurophysiological Basis for Speed > Stretch–Shortening Cycle
  options:
  - text: 交替 SSC 任務與重阻力，初學者不宜
    correct: true
  - text: 只安排 SSC 任務並排除重阻力運動
    correct: false
    why_wrong: 把複合訓練誤當成純 SSC 課表；本章定義複合訓練為 SSC 任務與重阻力運動交替，而非單獨安排 SSC。
  - text: 用長時間低強度收縮發展有氧基礎
    correct: false
    why_wrong: 把複合訓練誤植為有氧手段；複合訓練以 PAP 為急性後效應，與長時間低強度有氧訓練無關。
- id: ch19.program-design-monitoring.i04.q1
  item: ch19.program-design-monitoring.i04
  dco: pa1.A.3
  lang: zh
  cognitive: application
  stem: 一名教練記錄到選手在 505 變向的入速較上次下降，下列哪一項解讀最為合理？
  locator: Agility Development Strategies > Monitoring Agility and Change-of-Direction Ability > Table 19.7 Monitoring Agility Development
  options:
  - text: 較快出速可能只是入速變慢換來
    correct: true
  - text: 入速與出速不需要一起監控
    correct: false
    why_wrong: 忽略本章對入速控制的提醒；本章明定若不控制或記錄入速，較快出速無法解讀為煞車與再加速進步。
  - text: 變向測驗只需比較整段完成時間
    correct: false
    why_wrong: 把入速與出速當成不必要資訊；本章建議以進、出速度與接地時間共同監控，單看整段時間會掩蓋變向改善訊號。
- id: ch19.program-design-monitoring.i06.q1
  item: ch19.program-design-monitoring.i06
  dco: pa1.H
  lang: zh
  cognitive: analysis
  stem: 一名大學足球隊的進階運動員已能完成預先規劃的方向改變操練，教練下一步最應該加入什麼？
  locator: Methods of Developing Agility > Perceptual–Cognitive Ability
  options:
  - text: 哨音口令或箭頭等一般刺激
    correct: true
  - text: 取消刺激只做封閉式操練
    correct: false
    why_wrong: 把進階停在前一階段；本章說明已具備身體與技術能力後，應由預先規劃操練進展到帶有一般刺激的階段。
  - text: 只用小場比賽取代所有安排
    correct: false
    why_wrong: 把「進展到具專項刺激的階段」誤當成放棄結構；本章提醒只用小場比賽或隨機安排並未被證實同樣有效。
- id: ch19.rfd-impulse.i03.q1
  item: ch19.rfd-impulse.i03
  dco: pa1.B.1
  lang: zh
  cognitive: application
  stem: 一名教練想讓短跑選手在每一步改變更多動量，下列哪一項概念最直接相關？
  locator: Speed and Agility Mechanics > Impulse
  options:
  - text: 每一步的衝量大小
    correct: true
  - text: 髖關節的被動活動度
    correct: false
    why_wrong: 把動量改變誤連到關節活動度；本章以衝量—動量關係說明每步改變動量的是力量與施力時間的乘積，不是活動度。
  - text: 跑步時的氧攝取量
    correct: false
    why_wrong: 引入與每步動量改變無關的有氧指標；本章討論的是力學衝量，不是有氧能量供應。
- id: ch19.sprint-speed-components.i04.q1
  item: ch19.sprint-speed-components.i04
  dco: pa2.C.1
  lang: en
  cognitive: analysis
  stem: Current sprint literature described in the chapter points to which component as most critical for improving sprint speed?
  locator: Running Speed
  options:
  - text: Vertical ground reaction force magnitude applied with high rate of force development
    correct: true
  - text: Maximum stride length achieved by reaching the foot far forward at contact
    correct: false
    why_wrong: Promotes overstriding rather than force application; the chapter warns that reaching forward reduces force transfer and is a common sprint error.
  - text: Deliberate knee lift used as the primary cue during sprinting
    correct: false
    why_wrong: Treats knee lift as a coaching target instead of a byproduct of force application; the chapter notes knee height reflects vertical force direction, not a cue.
- id: ch19.sprint-technique.i07.q1
  item: ch19.sprint-technique.i07
  dco: pa2.C.1
  lang: en
  cognitive: analysis
  stem: A coach notices an athlete cycling the legs and reaching forward horizontally during sprinting. Which cue best addresses this error according to the chapter?
  locator: Running Speed > Technical Errors and Coaching > Table 19.1 Common Sprinting Technique Errors, Causes, and Corrections
  options:
  - text: Drive the foot down and back into the track to apply vertical force
    correct: true
  - text: Scratch the ground backward with a horizontal sweep of the foot
    correct: false
    why_wrong: Preserves the horizontal sweep that blocks vertical force application and overloads the stretch-shortening cycle.
  - text: Lift the knees as high as possible on every stride
    correct: false
    why_wrong: Treats knee height as a primary cue; the chapter warns that direct lift cues can disrupt force transfer and change natural muscle use.
- id: ch19.core-concepts.i07.q1
  item: ch19.core-concepts.i07
  dco: pa1.B.1
  lang: zh
  cognitive: analysis
  stem: 一名短跑選手從起跑器加速到最大速度，這段過程最符合本章的哪一項分類？
  locator: Speed and Agility Mechanics > Practical Implications for Change of Direction and Agility
  options:
  - text: 直線加速的能力
    correct: true
  - text: 敏捷的能力
    correct: false
    why_wrong: 把無刺激的起跑加速誤當成敏捷；本章明定敏捷需含反應成分，起跑加速屬於直線速度的加速期，並非敏捷。
  - text: 預先規劃的變向
    correct: false
    why_wrong: 把直線加速誤當成方向改變；本章指出方向改變包含爆發性改變方向、速度或模式，起跑加速未涉及方向變化。
- id: ch19.training-methods.i03.q1
  item: ch19.training-methods.i03
  dco: pa1.C.1
  lang: en
  cognitive: application
  stem: A coach wants to use resistance training that may transfer to sprint performance. Which principle should most guide exercise selection?
  locator: Methods of Developing Speed > Strength
  options:
  - text: Match movement pattern, peak force, RFD, and velocity profile to sprinting
    correct: true
  - text: Choose lifts only because they visually look like sprinting
    correct: false
    why_wrong: Reduces specificity to appearance; the chapter lists movement pattern, force, rate of force development, and velocity profile, not visual similarity.
  - text: Ignore velocity profile and only maximize external load lifted each session
    correct: false
    why_wrong: Removes velocity profile from the transfer rationale; the chapter explicitly includes velocity profile as part of the specificity consideration.
- id: ch19.agility-cod.i05.q1
  item: ch19.agility-cod.i05
  dco: pa2.C.3
  lang: en
  cognitive: analysis
  stem: During deceleration before a change of direction, an athlete keeps the knee nearly straight and lands flat-footed. Which technique correction is most appropriate to address this error?
  locator: Agility Performance and Change-of-Direction Ability > Technical Guidelines and Coaching
  options:
  - text: Cue the athlete to absorb the braking load within an effective knee range of motion
    correct: true
  - text: Tell the athlete to maintain a rigid trunk and hold the breath on contact
    correct: false
    why_wrong: Rigid-trunk cuing increases braking load transmission instead of absorbing it; the chapter calls for controlled trunk flexion and knee flexion, not stiffness.
  - text: Ask the athlete to lock the ankle and push off only after full stop
    correct: false
    why_wrong: Locking the ankle shifts load to the joint structures rather than to muscles; the chapter warns against stiff-leg braking because it cannot dissipate force through the knee range.
- id: ch19.core-concepts.i02.q1
  item: ch19.core-concepts.i02
  dco: pa1.A.1
  lang: en
  cognitive: application
  stem: A pre-planned change-of-direction drill is added to training. Which statement best captures how this drill differs from agility training as defined in the chapter?
  locator: Agility Performance and Change-of-Direction Ability
  options:
  - text: The drill develops deceleration and reacceleration without a stimulus
    correct: true
  - text: The drill requires the athlete to respond to an unpredictable stimulus
    correct: false
    why_wrong: Describes reactive agility rather than a pre-planned change-of-direction drill; the chapter separates the two by the presence of a stimulus.
  - text: The drill eliminates the need for the athlete to decelerate before redirecting
    correct: false
    why_wrong: Removes deceleration from the drill; the chapter stresses that even a pre-planned change-of-direction still requires braking and reacceleration.
- id: ch19.neuromuscular-basis.i03.q1
  item: ch19.neuromuscular-basis.i03
  dco: pa1.B.2
  lang: en
  cognitive: application
  stem: A coach wants to use complex training to enhance stretch–shortening cycle performance in an experienced athlete. Which design choice is most consistent with the chapter?
  locator: Neurophysiological Basis for Speed > Stretch–Shortening Cycle
  options:
  - text: Alternate SSC tasks with heavy resistance exercises within the same session
    correct: true
  - text: Use long work bouts with minimal rest to accumulate fatigue and volume
    correct: false
    why_wrong: Treats complex training like general conditioning; the chapter calls for short work bouts or clusters with frequent rest to preserve technique and quality.
  - text: Replace heavy resistance exercises with low-intensity SSC drills only
    correct: false
    why_wrong: Removes the heavy resistance component that complex training relies on; the chapter specifically combines progressive plyometrics with heavy resistance methods.
- id: ch19.rfd-impulse.i02.q1
  item: ch19.rfd-impulse.i02
  dco: pa1.A.1
  lang: zh
  cognitive: application
  stem: 本章指出最大力量發展可能需要 0.6 至 0.8 秒，下列哪項訓練意涵最為直接？
  locator: Speed and Agility Mechanics > Rate of Force Development > Figure 19.1 Force as a Function of Time
  options:
  - text: 短動作更需力量發展速率
    correct: true
  - text: 短時間動作可不練最大力量
    correct: false
    why_wrong: 把時間窗限制誤當成放棄最大力量；本章明示較大力量仍是快速施力的基礎，並未建議完全不練。
  - text: 短動作應把總組數加倍補時間
    correct: false
    why_wrong: 用總量補足時間限制；本章強調的是施力速率與衝量，不是以更多組數延長動作時間。
- id: ch19.rfd-impulse.i05.q1
  item: ch19.rfd-impulse.i05
  dco: pa1.A.1
  lang: zh
  cognitive: analysis
  stem: 一名衝刺者在相同時間窗內要增加衝量以提升加速表現，依本章力學下列哪項最為直接可行？
  locator: Speed and Agility Mechanics > Impulse
  options:
  - text: 同時間內產生較大力量
    correct: true
  - text: 延長施力時間累積動量
    correct: false
    why_wrong: 把動量累積誤當成時間延長的結果；本章明示在時間窗固定時，必須靠力量增加來擴大衝量。
  - text: 增加體重放大動量變化
    correct: false
    why_wrong: 用體重放大動量；本章的實務焦點放在每一步可主動產生的力量與時間，不是被動改變體重。
- id: ch19.sprint-speed-components.i02.q1
  item: ch19.sprint-speed-components.i02
  dco: pa1.A.3
  lang: zh
  cognitive: recall
  stem: 本章引用的菁英男性衝刺者在最大速度時的步幅為何？
  locator: Running Speed
  options:
  - text: 2.70 m
    correct: true
  - text: 2.56 m
    correct: false
    why_wrong: 對應到新手衝刺者的數值；本章把 2.56 m 列為新手最大速度時的步幅，不是菁英。
  - text: 1.85 m
    correct: false
    why_wrong: 誤以為衝刺步幅接近身高的一半；本章列出的最大速度步幅遠大於此，衝刺每一步的位移比一般跑步大得多。
- id: ch19.sprint-speed-components.i07.q1
  item: ch19.sprint-speed-components.i07
  dco: pa2.C.3
  lang: zh
  cognitive: application
  stem: 教練想以口令直接要求運動員抬膝以提升衝刺表現，依本章對膝高的解釋，下列哪項提示最為合適？
  locator: Running Speed
  options:
  - text: 先處理地面施力方向
    correct: true
  - text: 反覆口令抬膝直到變高
    correct: false
    why_wrong: 落入本章警告的錯誤示範；教材明示直接提示抬膝可能干擾自然步態與力量傳遞，不是適當修正。
  - text: 用水平爪地口令加速擺腿
    correct: false
    why_wrong: 用錯誤的爪地提示加速擺腿；本章警告爪地動作會阻礙垂直力量運用並過度負荷 SSC。
- id: ch19.sprint-technique.i03.q1
  item: ch19.sprint-technique.i03
  dco: pa2.C.1
  lang: zh
  cognitive: application
  stem: 依本章的衝刺姿勢檢核表，最大速度期的關節堆疊應呈現下列哪一項？
  locator: 'Running Speed > Sprinting Technique Guidelines > Figure 19.9 Sprinting Technique Checklist: Start, Acceleration, and Maximum Velocity'
  options:
  - text: 支撐期保持肩在髖上方
    correct: true
  - text: 肩膀高聳以增加擺臂
    correct: false
    why_wrong: 抬高肩膀破壞放鬆與對齊；本章明示肩膀應下沉放鬆，以維持力量傳遞而非放大擺臂。
  - text: 頭部刻意抬高擴胸腔
    correct: false
    why_wrong: 把抬頭當成姿勢優化；本章指出頭部應保持放鬆中立，眼睛看向正前方，不是刻意抬高。
- id: ch19.sprint-technique.i04.q1
  item: ch19.sprint-technique.i04
  dco: pa2.C.1
  lang: en
  cognitive: analysis
  stem: In early swing phase during maximum-velocity sprinting, which fundamental movement best matches the chapter's description?
  locator: Running Speed > Sprinting Technique Guidelines > Figure 19.10 Fundamental Movements Occurring in Maximum-Velocity Sprinting
  options:
  - text: Eccentric hip flexion decelerates the posterior swing of the thigh
    correct: true
  - text: Concentric hip flexion drives the thigh forward during early swing
    correct: false
    why_wrong: Describes mid-swing, not early swing; the chapter assigns eccentric hip flexion to early swing to decelerate the rearward thigh motion.
  - text: Concentric knee flexion shortens the limb during ground contact
    correct: false
    why_wrong: Places knee flexion in ground contact; the chapter ties knee flexion to swing-phase actions, not to the support phase.
- id: ch19.training-methods.i02.q1
  item: ch19.training-methods.i02
  dco: pa1.B.2
  lang: zh
  cognitive: analysis
  stem: 教練考慮使用彈力繩拉引以發展頂速，下列哪項本章所提風險最值得在採用前審慎評估？
  locator: Methods of Developing Speed > Sprinting > Table 19.3 Assistance and Resistance Training for Speed Development
  options:
  - text: 可能縮短支撐期並降低肌肉活化與推進力
    correct: true
  - text: 會自動增加最大肌力而無需其他訓練
    correct: false
    why_wrong: 假設輔助衝刺能直接強化最大肌力；本章未主張輔助工具能取代肌力訓練，且警示其力學風險。
  - text: 會消除落地時的離心煞車需求
    correct: false
    why_wrong: 把輔助訓練誤當成減少煞車的工具；本章反而警告輔助衝刺可能提高煞車力。
- id: ch19.training-methods.i05.q1
  item: ch19.training-methods.i05
  dco: pa1.B.1
  lang: zh
  cognitive: application
  stem: 一名進階運動員要發展敏捷，本章在力量需求上最強調的面向為何？
  locator: Methods of Developing Agility > Strength > Table 19.4 Comparison of Focus for Agility Development in Novice and Advanced Athletes
  options:
  - text: 向心爆發力與離心力量的均衡發展
    correct: true
  - text: 純粹以最大肌力取代所有爆發力工作
    correct: false
    why_wrong: 把最大肌力誤當成敏捷的主要力量需求；本章把向心爆發力與離心力量並列為敏捷煞車與再加速的關鍵。
  - text: 只以慢速等長收縮建立基礎張力
    correct: false
    why_wrong: 以等長收縮取代爆發性需求；本章明示敏捷需要快速向心爆發力與高速離心負荷，慢速等長無法滿足。
- id: ch19.program-design-monitoring.i07.q1
  item: ch19.program-design-monitoring.i07
  dco: pa1.A.4
  lang: zh
  cognitive: analysis
  stem: 一名教練為籃球員安排敏捷發展區塊，依本章範例的需求分析流程，下列哪一項決策順序最為合適？
  locator: Agility Development Strategies > Sample Program of Agility Development
  options:
  - text: 先做需求分析並配對測驗，再與標準分數比較找出弱點
    correct: true
  - text: 直接複製某固定敏捷訓練百分比套用到每位球員
    correct: false
    why_wrong: 略過個別評估而採用統一比例；本章明示重點是依運動員強弱決定主要與次要發展區域，不能直接套用固定比例。
  - text: 只看單一測驗分數就決定整個區塊的訓練比重
    correct: false
    why_wrong: 化約為單一指標；本章提醒敏捷表現由多項因素支撐，不能只依單一測驗分數下判斷。
- id: ch19.agility-cod.i07.q1
  item: ch19.agility-cod.i07
  dco: pa1.A.5
  lang: zh
  cognitive: analysis
  stem: 一名選手在防守情境下反應時間較進攻時長，最可能的解讀為何？
  locator: Agility Development Strategies > Monitoring Agility and Change-of-Direction Ability > Table 19.7 Monitoring Agility Development
  options:
  - text: 進攻與防守決策所需處理策略不同
    correct: true
  - text: 防守時該選手的肌肉量不足以應付
    correct: false
    why_wrong: 題幹描述的是決策時間差異，與肌肉徵召量無關；肌肉量改變的是動力輸出而非知覺處理速度。
  - text: 進攻情境的測驗反應時間較不準確
    correct: false
    why_wrong: 兩種情境使用相同的決策時間定義，差異反映選手在進攻與防守的知覺處理不同。
- id: ch19.core-concepts.i05.q1
  item: ch19.core-concepts.i05
  dco: pa1.A.1
  lang: en
  cognitive: application
  stem: For a team-sport athlete, which movement demand is most appropriately prioritized over pure linear sprinting?
  locator: Agility Performance and Change-of-Direction Ability
  options:
  - text: Multidirectional movement with reactive responses
    correct: true
  - text: Maximum velocity along a straight sprint lane
    correct: false
    why_wrong: Linear maximum velocity is the foundation for track sprinters; team-sport performance is rarely limited by straight-line top speed alone.
  - text: Single-effort acceleration in isolated drills
    correct: false
    why_wrong: Team sports demand repeated changes, not isolated acceleration; training only acceleration misses the sport’s context.
- id: ch19.neuromuscular-basis.i01.q1
  item: ch19.neuromuscular-basis.i01
  dco: pa1.B.2
  lang: zh
  cognitive: application
  stem: 教練想同時增強肌力與動作電位發放速率，下列哪一類訓練最能直接達成？
  locator: Neurophysiological Basis for Speed > Nervous System
  options:
  - text: 阻力與增強式組合
    correct: true
  - text: 長時間慢跑訓練
    correct: false
    why_wrong: 慢跑屬於有氧代謝訓練，對神經驅動的動作電位速率提升幫助極小。
  - text: 靜態伸展熱身
    correct: false
    why_wrong: 靜態伸展主要影響關節活動度與肌肉延展性，無法提升神經系統的動作電位發生速率。
- id: ch19.neuromuscular-basis.i04.q1
  item: ch19.neuromuscular-basis.i04
  dco: pa2.C.1
  lang: zh
  cognitive: analysis
  stem: 從彈簧—質量模型觀察直立衝刺時，動量向前推進主要發生於步態週期哪一階段？
  locator: Neurophysiological Basis for Speed > Spring–Mass Model
  options:
  - text: 中支撐後彈簧伸展期
    correct: true
  - text: 飛行期擺腿的前擺
    correct: false
    why_wrong: 飛行期擺腿屬於回正與準備接地，並不直接對地面產生推進衝量。
  - text: 早期壓縮吸收期
    correct: false
    why_wrong: 早期壓縮以吸收衝擊為主，此時彈簧尚未回傳力量，不是主要推進階段。
- id: ch19.program-design-monitoring.i02.q1
  item: ch19.program-design-monitoring.i02
  dco: pa1.A.4
  lang: en
  cognitive: application
  stem: A coach wants to interpret sprint development beyond finish times. Which gait metric most directly indicates improved force application within a short contact window?
  locator: Speed Development Strategies > Monitoring Sprint Ability > Table 19.6 Monitoring Speed Development
  options:
  - text: Reduced ground contact time with faster times
    correct: true
  - text: Greater flight time without contact data
    correct: false
    why_wrong: Greater flight time can result from either effective vertical force or wasted vertical oscillation; without contact time data the interpretation is ambiguous.
  - text: Longer stride length regardless of contact
    correct: false
    why_wrong: Stride length alone can reflect overstriding rather than better force application; contact time is the more direct indicator.
- id: ch19.program-design-monitoring.i05.q1
  item: ch19.program-design-monitoring.i05
  dco: pa1.A.4
  lang: en
  cognitive: analysis
  stem: A sprinter shows a negative decision time on a reactive agility test. Which interpretation best fits the chapter’s definition?
  locator: Agility Development Strategies > Monitoring Agility and Change-of-Direction Ability > Table 19.7 Monitoring Agility Development
  options:
  - text: Anticipated change before stimulus end
    correct: true
  - text: Reacted slower than stimulus needed
    correct: false
    why_wrong: Negative decision time reflects anticipation, not slow reaction; a slower reaction would yield a longer positive decision time.
  - text: Stimulus source was mis-synchronized
    correct: false
    why_wrong: Equipment or stimulus timing errors would invalidate the trial rather than produce a meaningful negative decision time.
- id: ch19.rfd-impulse.i04.q1
  item: ch19.rfd-impulse.i04
  dco: pa1.A.4
  lang: en
  cognitive: analysis
  stem: When sprint monitoring shows similar ground contact times but faster sprint times, which underlying change most plausibly explains the improvement?
  locator: Speed and Agility Mechanics > Impulse
  options:
  - text: Greater impulse produced per step
    correct: true
  - text: Reduced stride length per step
    correct: false
    why_wrong: Shorter strides generally reduce horizontal displacement per step; they do not explain faster sprint times at similar contact durations.
  - text: Lower vertical oscillation of mass
    correct: false
    why_wrong: Lower oscillation may improve efficiency but does not, by itself, account for producing more impulse within the same contact window.
- id: ch19.sprint-speed-components.i01.q1
  item: ch19.sprint-speed-components.i01
  dco: pa1.A.1
  lang: zh
  cognitive: application
  stem: 下列哪一項最能說明衝刺速度背後的底層限制因子？
  locator: Running Speed
  options:
  - text: 快速力量產生
    correct: true
  - text: 靜態關節活動度
    correct: false
    why_wrong: 活動度影響動作範圍，但衝刺速度的底層限制在於力量產生速率，而非被動活動度。
  - text: 心率變異度
    correct: false
    why_wrong: 心率變異度屬於自主神經監控指標，與衝刺速度的力學表現無直接因果關係。
- id: ch19.sprint-speed-components.i03.q1
  item: ch19.sprint-speed-components.i03
  dco: pa1.A.4
  lang: zh
  cognitive: analysis
  stem: 比較菁英與新手男性衝刺者，下列哪一項最能解釋兩者最大速度差異？
  locator: Running Speed
  options:
  - text: 短接地期內的高垂直力量
    correct: true
  - text: 擺腿重新就位時間較短
    correct: false
    why_wrong: 教材指出菁英與較慢者擺腿重新就位時間相近，差異不在擺腿速度。
  - text: 身體質量明顯較大
    correct: false
    why_wrong: 衝刺表現比較的是相同性別內的個體差異，身體質量並非教材所強調的差異來源。
- id: ch19.sprint-technique.i01.q1
  item: ch19.sprint-technique.i01
  dco: pa2.C.1
  lang: zh
  cognitive: application
  stem: 教練指導選手起跑離開起跑器時，下列哪一項技術原則最為關鍵？
  locator: 'Running Speed > Sprinting Technique Guidelines > Figure 19.9 Sprinting Technique Checklist: Start, Acceleration, and Maximum Velocity'
  options:
  - text: 雙腿積極伸展推蹬
    correct: true
  - text: 上半身先抬頭再啟動
    correct: false
    why_wrong: 起跑時過早抬頭會讓重心過早上升，削弱加速期的水平推進效果。
  - text: 單腳輕推再換腳加速
    correct: false
    why_wrong: 起跑要求雙腳同時爆發推蹬，單腳輕推會延遲水平速度的建立。
- id: ch19.sprint-technique.i02.q1
  item: ch19.sprint-technique.i02
  dco: pa2.C.1
  lang: zh
  cognitive: analysis
  stem: 加速初期擺腿低位回收的主要目的為何？
  locator: 'Running Speed > Sprinting Technique Guidelines > Figure 19.9 Sprinting Technique Checklist: Start, Acceleration, and Maximum Velocity'
  options:
  - text: 增加接地次數與水平推進
    correct: true
  - text: 增加步幅以達到頂速
    correct: false
    why_wrong: 加速初期擺腿應低位回收以增加接地次數，刻意拉長步幅反屬過度跨步。
  - text: 強化擺腿時的髖屈收縮
    correct: false
    why_wrong: 加速初期擺腿的主要考量是縮短騰空與增加接地次數，而非單獨強化髖屈肌。
- id: ch19.training-methods.i01.q1
  item: ch19.training-methods.i01
  dco: pa1.E.1
  lang: zh
  cognitive: application
  stem: 田徑短跑選手使用阻力衝刺時，下列哪一項負荷設定最能保留正常衝刺力學？
  locator: Methods of Developing Speed > Sprinting > Table 19.3 Assistance and Resistance Training for Speed Development
  options:
  - text: 使跑速下降不超過 10 至 12%
    correct: true
  - text: 使跑速下降至少 30 至 40%
    correct: false
    why_wrong: 跑速下降過多會延長接地時間、縮短步幅，反而破壞衝刺力學，並非教材推薦設定。
  - text: 以最大負荷全力拖拉不分階段
    correct: false
    why_wrong: 全力拖拉屬於過負荷範例，會引發過度跨步與錯誤姿勢，教材明確不建議。
- id: ch19.agility-cod.i06.q1
  item: ch19.agility-cod.i06
  dco: pa2.C.1
  lang: zh
  cognitive: analysis
  stem: 依本章對較佳方向改變能力的描述，下列哪一組軀幹特徵最為正確？
  locator: Agility Performance and Change-of-Direction Ability > Factors Affecting Change of Direction and Perceptual–Cognitive Ability > Change-of-Direction Ability
  options:
  - text: 減速時軀幹位移小，180 度時側傾大
    correct: true
  - text: 減速時軀幹晃動明顯，180 度時幾乎不側傾
    correct: false
    why_wrong: 把較佳變向的兩項軀幹特徵都寫成相反方向；本章指出減速進入時的軀幹角位移應較小，而較大的側向傾斜只出現在 180 度變向。
  - text: 兩個階段都要求軀幹完全保持直立
    correct: false
    why_wrong: 把姿勢控制誤解成軀幹完全不動；本章要求的是減速時控制軀幹幅度，並在大角度變向時允許側向傾斜，而不是全程維持僵直。
- id: ch19.core-concepts.i06.q1
  item: ch19.core-concepts.i06
  dco: pa2.C.1
  lang: en
  cognitive: recall
  stem: According to the chapter, what is the minimum time needed to develop maximal contractile force, and within which duration range do most sport activities fall?
  locator: Speed and Agility Mechanics > Rate of Force Development
  options:
  - text: 300 ms minimum, 0 to 200 ms range
    correct: true
  - text: 200 ms minimum, 0 to 300 ms range
    correct: false
    why_wrong: Reverses the two figures; the chapter states 300 ms is the lower bound for maximal force and 0 to 200 ms covers most sport actions.
  - text: 600 ms minimum, 0 to 800 ms range
    correct: false
    why_wrong: Mixes the time needed to develop absolute maximal force with the threshold asked about here; this item gives 300 ms as the minimum for maximal contractile force and 0 to 200 ms as the range covering most sport actions.
