meta:
  chapter: ch23
  source: data/cscs/ch23.yaml
questions:
- id: ch23.key-numbers.i02.q1
  item: ch23.key-numbers.i02
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: NSCA 安全檢查表中，過頭動作所需的天花板最低淨高為多少？
  locator: Designing the Strength and Conditioning Facility > Ceiling Height；Maintaining and Cleaning Surfaces and Equipment > Figure 23.6 NSCA’s Safety Checklist for Exercise Facility and Equipment Maintenance
  options:
  - text: 至少 12 ft（3.7 m）
    correct: true
  - text: 至少 8 ft（2.4 m）
    correct: false
    why_wrong: 把奧林匹克舉重平台的常見尺寸誤當天花板淨高；平台高度與頭頂動作所需淨空是兩種不同的設計參數。
  - text: 至少 16 ft（4.9 m）
    correct: false
    why_wrong: 把建議範圍 12–14 ft 的上限再往上推高一截；教材列的過頭動作最低淨高與建議範圍都沒有到這個數字。
  factory: ''
- id: ch23.key-numbers.i03.q1
  item: ch23.key-numbers.i03
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: What is the minimum distance that a mirror must be off the floor in a strength and conditioning facility?
  locator: Designing the Strength and Conditioning Facility > Mirrors
  options:
  - text: 20 in (51 cm)
    correct: true
  - text: 6 in (15 cm)
    correct: false
    why_wrong: Confuses the mirror-to-equipment clearance with the mirror-to-floor clearance; the two requirements are set separately and serve different purposes.
  - text: 2 in (5 cm)
    correct: false
    why_wrong: Confuses the safety clearance between a standard plate and the mirror with the mirror's off-the-floor distance; the plate-clearance figure is the rationale, not the mounting height.
  factory: ''
- id: ch23.key-numbers.i07.q1
  item: ch23.key-numbers.i07
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: According to the facility design text, what ramp ratio is specified for accessible height changes?
  locator: Designing the Strength and Conditioning Facility > Access
  options:
  - text: 1 in of rise per 12 in of horizontal run
    correct: true
  - text: 1 in of rise per 6 in of horizontal run
    correct: false
    why_wrong: Halves the horizontal run, which makes the ramp twice as steep as the 1:12 ratio the chapter states; the ADA reference in this chapter concerns accessible telephones, not ramps.
  - text: 1 in of rise per 24 in of horizontal run
    correct: false
    why_wrong: Doubles the run, which exceeds the chapter's stated ramp ratio and would create an unnecessarily long ramp for the same vertical rise.
  factory: ''
- id: ch23.key-numbers.i08.q1
  item: ch23.key-numbers.i08
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: Which range of air exchanges per hour is recommended to prevent stagnant air odors in the training facility?
  locator: Designing the Strength and Conditioning Facility > Location；Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: 8 to 12 exchanges per hour
    correct: true
  - text: 1 to 2 exchanges per hour
    correct: false
    why_wrong: Uses a rate closer to what a house would need; a training room carries far higher occupancy and sweat load, so the chapter sets a faster exchange range.
  - text: 20 to 30 exchanges per hour
    correct: false
    why_wrong: Overstates the rate; the text sets an upper bound well below that figure, and higher rates would waste energy without additional benefit for preventing odors.
  factory: ''
- id: ch23.maintenance.i05.q1
  item: ch23.maintenance.i05
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: NSCA 安全檢查表中，有氧器材及選擇式阻力訓練器材的導桿應多久清潔與潤滑一次？
  locator: Maintaining and Cleaning Surfaces and Equipment > Figure 23.6 NSCA’s Safety Checklist for Exercise Facility and Equipment Maintenance
  options:
  - text: 每週兩到三次
    correct: true
  - text: 每日檢查一次
    correct: false
    why_wrong: 把地板、護墊、飲水機等高頻接觸面的每日清潔頻率套到導桿；導桿依較低的週排程保養即可。
  - text: 每月潤滑一次
    correct: false
    why_wrong: 把週排程直接拉長成月排程；圖 23.6 沒有為導桿列出月頻率，導桿是使用中的活動零件，間隔不能拉到一個月。
- id: ch23.maintenance.i03.q1
  item: ch23.maintenance.i03
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 教材正文中，牆面與天花板至少應多久清潔一次？
  locator: Maintaining and Cleaning Surfaces and Equipment
  options:
  - text: 每一至兩週
    correct: true
  - text: 每日清一次
    correct: false
    why_wrong: 把地板、鏡窗等高頻接觸面的每日清潔頻率套到牆面與天花板；正文中牆面與天花板排程較鬆，另有指定。
  - text: 每季安排一次
    correct: false
    why_wrong: 把間隔從一兩週拉長到一季；正文對牆面與天花板指定的是一至兩週，圖 23.6 另列每週兩到三次。
- id: ch23.design-elements.i04.q1
  item: ch23.design-elements.i04
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 設施的天花板高度必須容納下列哪類活動所需的淨空？
  locator: Designing the Strength and Conditioning Facility > Ceiling Height
  options:
  - text: 箱跳與垂直跳等過頭動作
    correct: true
  - text: 靜態伸展與動態暖身活動
    correct: false
    why_wrong: 把暖身區所需的開放地面空間誤當天花板高度的判準；淨高要容納的是運動員身高再加上過頭動作。
  - text: 循環訓練器械的有氧踏步
    correct: false
    why_wrong: 把器械上的踏步動作當成需要過頭淨空的活動；教材列入淨高計算的是箱跳、垂直跳與奧林匹克舉重。
- id: ch23.four-phases.i01.q1
  item: ch23.four-phases.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 新訓練設施建造的第一步是？
  locator: General Aspects of New Facility Design > Predesign Phase
  options:
  - text: 前設計
    correct: true
  - text: 設計期
    correct: false
    why_wrong: 把設計期當成新設施的第一步；設計期是把委員會構想整合成藍圖的階段，需要前設計期的主計畫作為依據。
  - text: 施工期
    correct: false
    why_wrong: 把施工期當成新設施的第一步；施工期通常最長，且在藍圖完成後才開始，屬於後段的執行階段。
- id: ch23.four-phases.i06.q1
  item: ch23.four-phases.i06
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 新訓練設施設計委員會中，至少應考慮納入哪類成員以提升空間實用性與安全性？
  locator: General Aspects of New Facility Design
  options:
  - text: 日後在設施工作的教練或專業人員
    correct: true
  - text: 僅由外部承包商與建築師組成
    correct: false
    why_wrong: 漏掉使用者端的專業人員；委員會明列應包含日後在設施工作的教練或專家，僅靠外部設計專業會失去實際使用觀點。
  - text: 由贊助商獨自決定所有設計細節
    correct: false
    why_wrong: 把財務與贊助端誤當設計委員會的權責；贊助商並不在教材所列的委員會成員中。
- id: ch23.needs-analysis.i07.q1
  item: ch23.needs-analysis.i07
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 當設施設計同時受預算與空間限制時，下列哪一項應優先處理？
  locator: Assessing Athletic Program Needs
  options:
  - text: 空間不足對訓練與排程的影響
    correct: true
  - text: 購買單一最昂貴的專門器材
    correct: false
    why_wrong: 在預算與空間都受限時，教材明確指出空間與排程的影響大於少一件專門器材；把錢優先花在單一昂貴器材反客為主。
  - text: 重新規劃整個賽季課表
    correct: false
    why_wrong: 把設施資源問題的處理點移到課表設計；課表是依器材與場地條件制定的結果，不能取代空間規劃。
- id: ch23.maintenance.i04.q1
  item: ch23.maintenance.i04
  dco: pa4.B
  lang: en
  cognitive: application
  stem: A cable on a selectorized machine shows fraying during the weekly inspection. According to the chapter, what is the most appropriate immediate action?
  locator: Maintaining and Cleaning Surfaces and Equipment
  options:
  - text: Tag the unit Out of Order and remove it from the floor
    correct: true
  - text: Keep using the unit until the cable actually breaks
    correct: false
    why_wrong: Continues using equipment with a known damaged cable; the chapter requires stopping use and tagging, not running equipment to failure.
  - text: Tape over the frayed section and resume the workout
    correct: false
    why_wrong: Repairs the surface symptom rather than the component; the chapter calls for repair or replacement of the cable itself, not a covering that leaves the wear in place.
- id: ch23.safety-electrical.i03.q1
  item: ch23.safety-electrical.i03
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 當設施內僅有一人能即時協助事故處理，而此人為輪椅使用者時，下列哪項安排最能符合本章強調的安全與無障礙要求？
  locator: Designing the Strength and Conditioning Facility > Other Considerations
  options:
  - text: 確保至少一支電話讓輪椅使用者可及
    correct: true
  - text: 把電話鎖在督導者辦公桌抽屜以防誤用
    correct: false
    why_wrong: 把可及電話的反面操作當成安全措施；本章明列可及電話是為了緊急通訊與 ADA 要求，上鎖會讓輪椅使用者在事故時無法聯絡外援。
  - text: 讓輪椅使用者每次離場時再撥打行動電話求助
    correct: false
    why_wrong: 把固定式可及電話誤換成依賴個人手機；手機在緊急情境可能不在手邊、沒電或訊號不佳，並不符合 ADA 在本章指明的固定可及電話精神。
  factory: ''
- id: ch23.layout.i08.q1
  item: ch23.layout.i08
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 在一個大房間形式的肌力與體能設施中，下列哪種器材排列最能同時支援動線與督導視線？
  locator: Arranging Equipment in the Strength and Conditioning Facility > Traffic Flow
  options:
  - text: 低矮器材置中、高器材沿牆固定，並用器材排列形成走道
    correct: true
  - text: 把所有器材沿四面牆平均擺放，中央留空作暖身區
    correct: false
    why_wrong: 把中央完全空出來當暖身區，會犧牲督導者由中央看到全場的視線，也失去「用器材排列形成走道」的做法。
  - text: 把所有器材集中在設施中央，四面牆邊留作走道
    correct: false
    why_wrong: 把高矮器材都擺中央，會擋住督導視線並讓高器材失去靠牆固定的穩定性，與本章的排列原則相反。
  factory: ''
- id: ch23.design-elements.i01.q1
  item: ch23.design-elements.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 肌力與體能設施的位置應優先考量哪些事項？
  locator: Designing the Strength and Conditioning Facility > Location
  options:
  - text: 理想上設在一樓，並遠離辦公室與教室
    correct: true
  - text: 應設在地下室以便與其他運動設施共用出入口
    correct: false
    why_wrong: 教材列出的位置選項是一樓，非一樓時另有樓板承重要求；地下室不在教材舉出的任何一種配置中。
  - text: 應設於建築物最高的樓層以取得最佳視野
    correct: false
    why_wrong: 教材以一樓為理想，理由是避免落下重量與噪音干擾建築內其他空間；最高樓層沒有這個好處，還要另外滿足非一樓的樓板要求。
- id: ch23.design-elements.i02.q1
  item: ch23.design-elements.i02
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 設置設施督導站或辦公室時，位置的選擇應以什麼為主要考量？
  locator: Designing the Strength and Conditioning Facility > Supervision Location
  options:
  - text: 設在中央位置以取得對全場的清楚視線
    correct: true
  - text: 設在設施最靠近入口處以便迎賓
    correct: false
    why_wrong: 教材強調的是全場可視性與鏡子的運用，迎賓動線並非督導站位置的主要考量。
  - text: 設在遠離訓練區的安靜角落以利文書工作
    correct: false
    why_wrong: 把辦公室設在遠離訓練區會喪失即時督導視線，教材反而主張中央位置或抬高的觀察點。
- id: ch23.design-elements.i03.q1
  item: ch23.design-elements.i03
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 當設施的走廊過窄、無法讓大型器材直接通過時，最務實的處置方式為何？
  locator: Designing the Strength and Conditioning Facility > Access
  options:
  - text: 暫時拆除外牆或開啟車庫門以利搬運
    correct: true
  - text: 永久加寬所有走廊以容納任何器材
    correct: false
    why_wrong: 教材提到狹窄走廊在搬運時可能需要暫時拆除外牆或開啟車庫門；永久加寬走廊並非教材建議的標準處置。
  - text: 僅採購小型器材以避免搬運問題
    correct: false
    why_wrong: 教材並未建議為了動線而限制器材規格；課表所需的器材種類仍應優先考量。
- id: ch23.design-elements.i05.q1
  item: ch23.design-elements.i05
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 一支舉重隊要新增舉重平台，其地面材質最應如何鋪設？
  locator: Designing the Strength and Conditioning Facility > Flooring
  options:
  - text: 中央為木材、外側為橡膠
    correct: true
  - text: 全區鋪設乙烯基軟墊以減少噪音
    correct: false
    why_wrong: 教材列出的地板選項是橡膠、抗真菌地毯、室內草皮與平台木材，沒有把軟墊列為平台表面；平台中央用木材是為了避免鞋子卡住或滑動。
  - text: 全區鋪設混凝土以承受最大重擊
    correct: false
    why_wrong: 混凝土不在教材列出的地板選項中；平台在教材裡的描述是中央木材、外側橡膠。
- id: ch23.design-elements.i08.q1
  item: ch23.design-elements.i08
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: When arranging equipment in the facility, where should the shortest pieces of equipment generally be placed?
  locator: Arranging Equipment in the Strength and Conditioning Facility > Equipment Placement
  options:
  - text: In the central area to preserve supervision sightlines
    correct: true
  - text: Along the wall opposite the main traffic lane
    correct: false
    why_wrong: Wall placement is the recommendation for tall equipment; placing short equipment there does not match the chapter's logic of preserving sightlines by keeping low items centrally.
  - text: Inside a locked storage closet until each is needed
    correct: false
    why_wrong: The chapter's storage guidance covers equipment that is out of service, not the low equipment that belongs on the active floor to keep the whole room visible.
- id: ch23.environment.i01.q1
  item: ch23.environment.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 訓練設施的照明規劃應以何者為原則？
  locator: Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: 同時採用人工與自然光
    correct: true
  - text: 完全依賴人工照明以維持照度穩定
    correct: false
    why_wrong: 教材明確建議人工與自然光並用；完全依賴人工光會忽略窗戶與鏡子反射自然光的效益。
  - text: 僅使用自然光以節省能源成本
    correct: false
    why_wrong: 教材要求人工與自然光並用，並以天花板高度與可得自然光共同判定照度；只用自然光就少了可調整的人工照度那一半。
- id: ch23.environment.i02.q1
  item: ch23.environment.i02
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: Which heating and cooling capability does the text call most desirable for the training areas?
  locator: Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: Zone-based heating and cooling for separate areas
    correct: true
  - text: A single building-wide thermostat setting
    correct: false
    why_wrong: A single building-wide setting is the very arrangement the chapter contrasts its recommendation against; the text asks for a system that can heat or cool the separate areas independently.
  - text: Cooling-only operation with portable space heaters
    correct: false
    why_wrong: Portable heaters are not the prescribed system; the chapter recommends integrated HVAC that can separately heat or cool distinct zones.
- id: ch23.environment.i03.q1
  item: ch23.environment.i03
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 相對濕度必須受到監測，教材給出的理由是防止何種風險？
  locator: Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: 防止細菌滋生，避免感染傳播
    correct: true
  - text: 降低空調系統的耗電量
    correct: false
    why_wrong: 教材並未把節能列為濕度控制的主要目的；濕度控制的直接連結是衛生與感染風險。
  - text: 提升鏡面反射光線的均勻程度
    correct: false
    why_wrong: 鏡子光線屬照明層面的考量，與濕度上限所對應的衛生目的不同。
- id: ch23.environment.i04.q1
  item: ch23.environment.i04
  dco: pa4.B
  lang: en
  cognitive: application
  stem: In addition to the HVAC system, which auxiliary measure is most appropriate for preventing stagnant air in the facility?
  locator: Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: Ceiling or box fans to keep air moving
    correct: true
  - text: Carpeted flooring in all training zones
    correct: false
    why_wrong: Carpet is unrelated to air movement and is not presented as a method for preventing stagnant air; it is mentioned in the context of flooring choices.
  - text: Tinted windows on all exterior walls
    correct: false
    why_wrong: Window treatment is not among the circulation methods the chapter lists; it names HVAC, fresh-air exchange systems, and ceiling or box fans.
- id: ch23.environment.i05.q1
  item: ch23.environment.i05
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 安裝設施音響系統時，音量上限的主要依據為何？
  locator: Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: 確保運動員仍能聽見指令與提示
    correct: true
  - text: 避免打擾建築內其他辦公空間
    correct: false
    why_wrong: 教材把音量上限連到運動員聽指令的能力；辦公區干擾是噪音控制的考量，與本段規範音量上限的理由不同。
  - text: 讓音樂節奏與訓練週期完全同步
    correct: false
    why_wrong: 教材描述音樂可帶來動機與節奏，但音量上限的理由是安全通訊，不是節奏同步。
- id: ch23.environment.i06.q1
  item: ch23.environment.i06
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: Which facility situation most justifies installing sound-absorbing materials on the walls and floor?
  locator: Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: A studio used for yoga or dance classes
    correct: true
  - text: A free-weight area with power racks
    correct: false
    why_wrong: The chapter does not tie wall-and-floor sound treatment to power racks; it names sound-absorbing rubber flooring for impact noise and reserves the studio example for yoga or dance classes.
  - text: An outdoor turf field adjacent to the building
    correct: false
    why_wrong: Outdoor fields are not part of the indoor wall-and-floor sound treatment described in this section; the rationale specifically cites indoor yoga or dance studios.
- id: ch23.environment.i07.q1
  item: ch23.environment.i07
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 訓練設施中的鏡子在環境層面上最主要的效益為何？
  locator: Designing the Strength and Conditioning Facility > Environmental Factors
  options:
  - text: 反射光線使空間顯得較大
    correct: true
  - text: 降低牆面碰撞造成的設備損壞
    correct: false
    why_wrong: 教材在這一段只把鏡子連到反射自然光與人工光；防止牆面碰撞不在鏡子的敘述範圍內。
  - text: 吸收訓練區內的環境噪音
    correct: false
    why_wrong: 教材指吸音材料是用於牆面與地板，未把鏡子列為噪音控制手段。
- id: ch23.four-phases.i02.q1
  item: ch23.four-phases.i02
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 新設施設計期（design phase）最主要的工作內容為何？
  locator: General Aspects of New Facility Design > Design Phase
  options:
  - text: 整合委員會構想並規劃動線
    correct: true
  - text: 完成室內裝潢與建立清潔排程
    correct: false
    why_wrong: 把前營運期的開館準備當成設計期的工作；裝潢與排程屬於動工後的另一階段。
  - text: 進行需求分析與可行性研究
    correct: false
    why_wrong: 把前設計期的工作搬到設計期；需求分析與可行性研究在聘請建築師前就應完成。
- id: ch23.four-phases.i03.q1
  item: ch23.four-phases.i03
  dco: pa4.B
  lang: en
  cognitive: application
  stem: During the construction phase of a new facility, which action should the committee prioritize most to keep the project aligned with its goals?
  locator: General Aspects of New Facility Design > Construction Phase
  options:
  - text: Continuously compare progress to the master plan
    correct: true
  - text: Hire additional staff for opening day operations
    correct: false
    why_wrong: Treats a preoperation-phase task as a construction-phase task; staffing setup occurs after construction completes.
  - text: Replace the architect for minor design changes
    correct: false
    why_wrong: Overreacts when minor scope drift occurs; the master plan already records the agreed design, so the committee does not need to swap architects to address routine alignment.
- id: ch23.four-phases.i08.q1
  item: ch23.four-phases.i08
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 改建既有肌力與體能設施時，最主要的流程差異為何？
  locator: Existing Strength and Conditioning Facilities
  options:
  - text: 不需從零建造，可不一定要承包商與建築師
    correct: true
  - text: 必須重新做 SWOT 分析才能動工
    correct: false
    why_wrong: 把新建設施的前設計步驟硬套到改建上；原文並未要求改建前再做一次 SWOT。
  - text: 可跳過標準與人員發展的持續推動
    correct: false
    why_wrong: 誤以為改建可免除標準與專業化的要求；不論新舊設施都應持續重視教育與人員發展。
- id: ch23.key-numbers.i04.q1
  item: ch23.key-numbers.i04
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 自由重量與循環訓練器械之間的最低間距應為多少？
  locator: Arranging Equipment in the Strength and Conditioning Facility > Equipment Placement；Arranging Equipment in the Strength and Conditioning Facility > Circuit Training Area；Arranging Equipment in the Strength and Conditioning Facility > Free Weights
  options:
  - text: 36 in（91 cm）
    correct: true
  - text: 12 in（30 cm）
    correct: false
    why_wrong: 把坡道每上升 1 in 所需的 12 in 水平長度誤當器材間距；器材間距的判準是運動員與保護者能在架間安全移動。
  - text: 60 in（152 cm）
    correct: false
    why_wrong: 這個數字不在教材列出的間距值中；循環器械最低 24 in、較佳 36 in，自由重量與架周邊同樣是 36 in。
- id: ch23.layout.i01.q1
  item: ch23.layout.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 伸展與暖身區應提供哪些基本器材與空間？
  locator: Arranging Equipment in the Strength and Conditioning Facility > Stretching and Warm-Up Area
  options:
  - text: 開放空間與小型軟組織器材
    correct: true
  - text: 完整淋浴間與團隊置物櫃區
    correct: false
    why_wrong: 把更衣與淋浴設備當成暖身區必備；它們列在設施其他考量，不是暖身區的主要內容。
  - text: 奧林匹克舉重平台與大片鏡
    correct: false
    why_wrong: 把暖身區誤認為重量訓練區；舉重平台與大片鏡子是另一個區域的器材。
- id: ch23.layout.i02.q1
  item: ch23.layout.i02
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 配置循環訓練區時，最主要的分組考量為何？
  locator: Arranging Equipment in the Strength and Conditioning Facility > Circuit Training Area
  options:
  - text: 依動作類型或身體部位分組排列
    correct: true
  - text: 把所有器材緊靠牆面以節省空間
    correct: false
    why_wrong: 把自由重量區的沿牆配置原則搬到循環訓練區；循環區需要讓人能在器械間自由移動。
  - text: 只按價格高低隨機擺放位置
    correct: false
    why_wrong: 把經濟因素當成配置的唯一考量；書中以功能性與動線作為主要分類依據。
- id: ch23.layout.i03.q1
  item: ch23.layout.i03
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: In the free weights area, which placement principle is recommended for racks and dumbbells?
  locator: Arranging Equipment in the Strength and Conditioning Facility > Free Weights
  options:
  - text: Place racks and dumbbells along the walls with walking space between
    correct: true
  - text: Place all free weights in the center to maximize mirror visibility
    correct: false
    why_wrong: Reverses the layout logic; the center is reserved for low equipment so supervisors can see the whole floor.
  - text: Stack racks directly against the mirrors for easy access
    correct: false
    why_wrong: Ignores the required clearance from mirrors; equipment too close to mirrors risks damage and injuries.
- id: ch23.maintenance.i01.q1
  item: ch23.maintenance.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 設施表面與器材的清潔頻率原則為何？
  locator: Maintaining and Cleaning Surfaces and Equipment
  options:
  - text: 高頻使用器材每日或隔日清潔
    correct: true
  - text: 全部器材每週清潔一次即可
    correct: false
    why_wrong: 忽略使用頻率差異；護墊與乙烯基等高接觸面需要更密集的清潔。
  - text: 只有外觀髒污時才需要擦拭
    correct: false
    why_wrong: 以可見髒污當唯一標準；微生物在未以殺菌清潔劑擦拭時就會開始生長。
- id: ch23.needs-analysis.i01.q1
  item: ch23.needs-analysis.i01
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 設施需求分析最優先要確認的是什麼？
  locator: Assessing Athletic Program Needs
  options:
  - text: 同時使用設施的運動員人數
    correct: true
  - text: 設施預定採購的器材品牌清單
    correct: false
    why_wrong: 器材清單是需求分析後段依訓練計畫推導的結果；同時使用人數先決定設施大小、排程與動線，是更上游的問題。
  - text: 教練團每週可排的值班時數
    correct: false
    why_wrong: 值班時數屬督導人力安排；教材把同時使用人數列為影響設施大小、排程與動線的資訊。
- id: ch23.needs-analysis.i04.q1
  item: ch23.needs-analysis.i04
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: How should the athletes' training experience guide the equipment needs of a facility?
  locator: Assessing Athletic Program Needs
  options:
  - text: Less experienced athletes may rely more on bodyweight movements
    correct: true
  - text: All athletes must use identical equipment regardless of experience
    correct: false
    why_wrong: Overlooks the chain the chapter draws from training experience to program design and then to equipment; identical equipment for everyone ignores the first link.
  - text: Only experienced athletes need access to weightlifting areas
    correct: false
    why_wrong: Builds a single-purpose layout; new athletes still progress into barbell and platform work over a season.
- id: ch23.needs-analysis.i06.q1
  item: ch23.needs-analysis.i06
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 面對需要維修或修改的器材，最主要的處置原則為何？
  locator: Assessing Athletic Program Needs
  options:
  - text: 故障者修理或更換，升級加附件
    correct: true
  - text: 一律以全新器材替換現有設備
    correct: false
    why_wrong: 忽略區分故障與升級；纜線柱等情況可透過新增附件恢復完整用途，未必需要替換整機。
  - text: 等到年度盤點時再統一處理
    correct: false
    why_wrong: 延誤處置會讓器材持續處於不安全狀態；書中強調應及時修理或停止使用。
- id: ch23.safety-electrical.i01.q1
  item: ch23.safety-electrical.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 為什麼肌力與體能設施需要比一般建築更完善的電力服務？
  locator: Designing the Strength and Conditioning Facility > Electrical Service
  options:
  - text: 插座需求多，部分器材需較高電壓
    correct: true
  - text: 因為訓練時需要把燈具同時全開
    correct: false
    why_wrong: 把電力需求窄化為照明問題；真正的差異在器材所需插座數量與部分器材較高的電壓。
  - text: 因為必須讓所有插座集中在單一迴路
    correct: false
    why_wrong: 教材沒有要求把插座集中在單一迴路；差異在插座數量、部分器材需較高電壓，以及電力服務必須正確接地。
- id: ch23.safety-electrical.i02.q1
  item: ch23.safety-electrical.i02
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: In the facility's electrical service, what is the primary safety role of a ground-fault circuit?
  locator: Designing the Strength and Conditioning Facility > Electrical Service
  options:
  - text: Protect athletes in the event of an electrical short circuit
    correct: true
  - text: Reduce the building's overall energy consumption
    correct: false
    why_wrong: Treats a safety device as an energy-saving tool; the ground-fault circuit is specified for short-circuit protection.
  - text: Stabilize the voltage supplied to all cardio machines
    correct: false
    why_wrong: Confuses power conditioning with safety; voltage stabilization is not the listed purpose of a ground-fault circuit.
- id: ch23.safety-electrical.i07.q1
  item: ch23.safety-electrical.i07
  dco: pa4.B
  lang: en
  cognitive: application
  stem: A new gym plan puts two drinking fountains beside the free weight racks. What is the best correction to that plan?
  locator: Designing the Strength and Conditioning Facility > Other Considerations
  options:
  - text: Relocate them near the entrance so they do not interrupt traffic flow
    correct: true
  - text: Keep them where they are but add mats around each unit
    correct: false
    why_wrong: Mats do not solve the underlying problem, which is that the fountains still interrupt the traffic flow through the busiest training zone.
  - text: Remove drinking fountains and rely on athletes bringing bottles
    correct: false
    why_wrong: The chapter expects the facility to supply fountains for hydration, so taking them out shifts a facility duty onto the athletes themselves.
- id: ch23.design-elements.i01.q2
  item: ch23.design-elements.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 訓練空間被安排在二樓時，樓板規格的判準是什麼？
  locator: Designing the Strength and Conditioning Facility > Location
  options:
  - text: 樓板必須穩定，能承載重型及可能落下的器材
    correct: true
  - text: 樓板必須使用地毯以降低落下重量的噪音
    correct: false
    why_wrong: 教材未把地毯列為樓板設計標準；非一樓的重點在承重與掉落情境，不是表面裝潢。
  - text: 樓板應為中空設計以容納空調管線
    correct: false
    why_wrong: 把空調管線需求誤當樓板的主要考量；教材對非一樓的要求聚焦於承重安全。
