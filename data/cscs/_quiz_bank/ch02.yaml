questions:
- id: ch02.levers.i01.q1
  item: ch02.levers.i01
  dco: sf1.C.2
  lang: zh
  cognitive: recall
  stem: 第一類槓桿在結構上的最明顯特徵為何？
  locator: 第 2 章 · Levers of the Musculoskeletal System
  options:
  - text: 支點居於肌力與阻力兩端之間
    correct: true
  - text: 阻力落在支點和肌腱附著端的中間
    correct: false
    why_wrong: 第二類的阻力在中段而非支點在中段；第一類的判定依據是支點居於肌力與阻力之間。
  - text: 肌腱與阻力同側，且肌腱靠近支點
    correct: false
    why_wrong: 第三類的特徵是肌力與阻力同側且肌腱靠近支點；題幹問的是支點居中，而非肌腱與阻力的相對位置。
- id: ch02.work-power.i05.q1
  item: ch02.work-power.i05
  dco: sf1.C.2
  lang: zh
  cognitive: recall
  stem: 書中表2.1所列「一磅」換算成牛頓的係數為何？
  locator: 第 2 章 · Positive Work and Power
  options:
  - text: 4.448 N
    correct: true
  - text: 9.807 N
    correct: false
    why_wrong: 把公斤力換算成牛頓的常數當成磅到牛頓的係數；書中表2.1的同一張表確實有 kgf → N，但這不是 lb → N。
  - text: 0.454 N
    correct: false
    why_wrong: 把磅換算成公斤的常數直接當作牛頓數值；缺少乘上 9.807 m/s² 的重力加速度。
- id: ch02.strength-factors.i07.q1
  item: ch02.strength-factors.i07
  dco: sf1.A.2
  lang: en
  cognitive: recall
  stem: In which type of muscle action does the muscle produce force without any change in length?
  locator: 第 2 章 · Joint Angular Velocity
  options:
  - text: an isometric hold against a fixed bar
    correct: true
  - text: concentric work while the belly shortens
    correct: false
    why_wrong: Picks the phase where fibers pull the joint through its range; force there arrives with visible shortening, which the stem rules out.
  - text: eccentric action, muscle gives way slowly
    correct: false
    why_wrong: Picks the phase where the load wins and fibers stretch under tension; that yielding is still a change in muscle length.
- id: ch02.joint-biomechanics.i08.q1
  item: ch02.joint-biomechanics.i08
  dco: sf1.D.2
  lang: zh
  cognitive: recall
  stem: 書中所列阻力訓練的傷害發生率，每千小時大約為多少次？
  locator: '第 2 章 · Joint Biomechanics: Concerns in Resistance Training'
  options:
  - text: 平均每千小時約四件傷害
    correct: true
  - text: 全季賽事約二十件傷害
    correct: false
    why_wrong: 把單一賽季總件數當成每千小時發生率；賽季總件數與時率是完全不同的統計量。
  - text: 職業足球員每千小時上百件傷害
    correct: false
    why_wrong: 把團隊運動等高傷害率活動的數量級搬到阻力訓練；書中強調阻力訓練屬於低傷害率運動。
- id: ch02.levers.i06.q1
  item: ch02.levers.i06
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 手持啞鈴做彎舉時，啞鈴對肘關節的阻力矩在哪個前臂位置最大？
  locator: 第 2 章 · Levers of the Musculoskeletal System
  options:
  - text: 前臂與地面平行，啞鈴遠離肘關節時
    correct: true
  - text: 前臂向上舉至垂直，指尖朝向天花板時
    correct: false
    why_wrong: 假設上舉到頂阻力矩最大；前臂朝上垂直時啞鈴與肘關節幾乎同一水平線，阻力臂接近零。
  - text: 前臂自然下垂於身側，啞鈴貼近大腿時
    correct: false
    why_wrong: 把起始位置當成阻力矩最大；前臂下垂時啞鈴作用線大致通過肘關節旋轉軸，阻力臂極短。
- id: ch02.planes.i01.q1
  item: ch02.planes.i01
  dco: sf1.C.1
  lang: en
  cognitive: application
  stem: A sprinter accelerates down the track with hips and knees extending in a forward-backward direction. In which plane does this lower-body action primarily occur?
  locator: 第 2 章 · Anatomical Planes and Major Body Movements
  options:
  - text: sagittal
    correct: true
  - text: frontal
    correct: false
    why_wrong: Names the plane that divides the body into front and back halves; sprint action is forward-backward, not side-to-side.
  - text: transverse
    correct: false
    why_wrong: Names the plane that divides upper and lower halves and governs rotation; hip and knee action is linear, not rotational.
- id: ch02.musculature.i05.q1
  item: ch02.musculature.i05
  dco: sf1.C.3
  lang: zh
  cognitive: application
  stem: 投擲末期，肱二頭肌對剛完成伸肘的前臂產生作用的主要目的為何？
  locator: 第 2 章 · Skeletal Musculature
  options:
  - text: 在動作末段煞車，保護關節免受衝擊
    correct: true
  - text: 提供向心加速，協助把球推得更遠
    correct: false
    why_wrong: 假設末段需要更多主動力；此時前臂已在極高速度下延伸，再加速並非肌力可及，反而應減速。
  - text: 預先啟動準備下一投的向心收縮
    correct: false
    why_wrong: 把拮抗肌的角色誤當成下一動作的準備；末段的作用是煞車與穩定，不是預先啟動向心收縮。
- id: ch02.resistance-sources.i06.q1
  item: ch02.resistance-sources.i06
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 與人體肌力曲線相比，彈力帶最主要的缺點是什麼？
  locator: 第 2 章 · Elasticity
  options:
  - text: 末端阻力最大，但多數肌群末端力量最弱
    correct: true
  - text: 阻力隨動作一直線下降，需中途加力
    correct: false
    why_wrong: 把彈性阻力曲線的方向顛倒；彈力帶阻力隨拉伸距離增加，並非隨動作下降。
  - text: 阻力完全不受拉伸距離影響，與橡皮筋不同
    correct: false
    why_wrong: 把彈力帶當作不受距離影響的器械；彈性阻力定義就是隨拉伸距離增加，這條假設違背定義。
- id: ch02.musculature.i07.q1
  item: ch02.musculature.i07
  dco: sf1.C.3
  lang: en
  cognitive: application
  stem: During a heavy squat the rectus femoris pulls the shank up but also bends the hip. Which muscle most needs to contract at the same time to keep the trunk upright?
  locator: 第 2 章 · Skeletal Musculature
  options:
  - text: gluteus maximus
    correct: true
  - text: tibialis anterior
    correct: false
    why_wrong: this muscle dorsiflexes the ankle; it has no action at the hip and so cannot oppose hip flexion caused by the rectus femoris during the squat.
  - text: gastrocnemius
    correct: false
    why_wrong: this muscle plantarflexes the ankle; its actions are at the ankle and knee and do not include hip extension, so it cannot directly oppose the rectus femoris at the hip.
- id: ch02.resistance-sources.i03.q1
  item: ch02.resistance-sources.i03
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 爆發上搏的加速段，運動員對槓鈴的向上施力最主要必須包含哪個分量？
  locator: 第 2 章 · Inertia
  options:
  - text: 對抗重力加上向上加速度的慣性分量
    correct: true
  - text: 只對抗槓鈴靜重，讓合力恰為零
    correct: false
    why_wrong: 把等速托住當成加速時的需求；合力為零時槓鈴並未向上加速，無法完成爆發上搏的加速段。
  - text: 略小於槓鈴重量，由拮抗肌協助煞車
    correct: false
    why_wrong: 套用下放階段的力學；下放是減速（施力小於重量），但爆發上搏的加速段需要施力大於重量。
- id: ch02.work-power.i01.q1
  item: ch02.work-power.i01
  dco: sf1.C.2
  lang: en
  cognitive: application
  stem: An athlete carries a heavy box across a level room at constant speed. The supporting force on the box is purely vertical while the motion is purely horizontal. What does this supporting force primarily contribute to the box?
  locator: 第 2 章 · Positive Work and Power
  options:
  - text: no work done on the box at all
    correct: true
  - text: positive work equal to weight times path
    correct: false
    why_wrong: Multiplies weight by the distance walked, ignoring that work counts only the force component lying along the displacement.
  - text: added kinetic energy from the carry
    correct: false
    why_wrong: Mistakes steady horizontal travel for a gain in speed; the box never accelerates, so its kinetic energy holds constant.
- id: ch02.resistance-sources.i04.q1
  item: ch02.resistance-sources.i04
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 摩擦制動式腳踏車測功計，係數與壓緊力固定時，若踩踏速度加倍，平均功率輸出最主要會如何改變？
  locator: 第 2 章 · Friction
  options:
  - text: 摩擦力大致不變，平均功率約為原來的兩倍
    correct: true
  - text: 摩擦阻力加倍，平均功率則會膨脹為四倍
    correct: false
    why_wrong: 把流體阻力隨速度增加的特性套到滑動摩擦；滑動摩擦的力只看法向力與係數，速度本身不會放大阻力。
  - text: 阻力與踏速互相抵銷，平均功率因此保持不變
    correct: false
    why_wrong: 假設阻力與踏速反向變動可使功率不變；同樣的功若在更短時間完成，功率仍會上升。
- id: ch02.size-strength.i01.q1
  item: ch02.size-strength.i01
  dco: sf1.C.2
  lang: zh
  cognitive: analysis
  stem: 一位跳遠選手經過八週阻力訓練後，體重增加一成，垂直跳成績提升五成，但肌力測驗只進步兩成；最可能反映的問題是什麼？
  locator: 第 2 章 · Strength-to-Mass Ratio
  options:
  - text: 肌力體重比不增反降，因為肌力增幅跑不贏體重增幅
    correct: true
  - text: 垂直跳成績顯著進步，肌力體重比必然隨之提升
    correct: false
    why_wrong: 把絕對成績進步當成相對比值進步；肌力測驗只進步兩成而體重增加一成，分子增幅並未超越分母，比值實際下降。
  - text: 肌力測驗分數提高，代表肌力體重比已經水漲船高
    correct: false
    why_wrong: 把肌力測驗的絕對分數變化直接等同於比值變化；題幹的比值分母是體重而非測驗分數，分子增幅未超越分母則比值下滑。
- id: ch02.size-strength.i05.q1
  item: ch02.size-strength.i05
  dco: sf1.C.2
  lang: en
  cognitive: analysis
  stem: An athlete's tendon attaches farther from the joint than average. What is the primary trade-off that this longer moment arm creates?
  locator: 第 2 章 · Variations in Tendon Insertion
  options:
  - text: more torque, but a smaller joint sweep
    correct: true
  - text: more force and more speed together
    correct: false
    why_wrong: Reads a longer moment arm as a free upgrade; the book's figure shows the joint turning only 34° where the shorter arm turns 37°.
  - text: weaker leverage, yet a wider sweep
    correct: false
    why_wrong: Flips the geometry around; moving the attachment away from the axis lengthens the moment arm instead of shrinking it.
- id: ch02.joint-biomechanics.i03.q1
  item: ch02.joint-biomechanics.i03
  dco: sf1.C.3
  lang: zh
  cognitive: application
  stem: 一名舉重選手在做大重量深蹲時，教練希望同時提升軀幹剛性與心臟負荷安全性，最應優先採用哪種呼吸方式？
  locator: 第 2 章 · Intra-Abdominal Pressure and Lifting Belts
  options:
  - text: 閉聲門的瓦氏呼吸法
    correct: false
    why_wrong: 瓦氏法雖能拉高全軀幹剛性，但同時升高胸腔壓力而壓迫心臟，並非「同時兼顧安全」的最佳選擇。
  - text: 保持氣道開放的腹肌收縮
    correct: true
  - text: 每次反覆都佩戴加重腰帶
    correct: false
    why_wrong: 腰帶每組都戴會讓深層腹肌缺乏自主產生腹內壓的刺激，且無法直接控制呼吸壓力的分配。
- id: ch02.joint-biomechanics.i04.q1
  item: ch02.joint-biomechanics.i04
  dco: sf1.A.1
  lang: en
  cognitive: recall
  stem: Which structure is most responsible for stabilizing the shoulder joint during upper-body resistance training?
  locator: 第 2 章 · Shoulders
  options:
  - text: The rotator cuff musculature
    correct: true
  - text: The deltoid's large cross-sectional area
    correct: false
    why_wrong: Confuses prime mover capacity with passive stability; the deltoid produces force but is not the principal stabilizer of the glenohumeral joint.
  - text: The acromioclavicular ligament alone
    correct: false
    why_wrong: Isolates a single ligament and overlooks that dynamic muscular stabilization, not ligament restraint, is the primary safeguard for this highly mobile joint.
- id: ch02.joint-biomechanics.i05.q1
  item: ch02.joint-biomechanics.i05
  dco: sf1.D.2
  lang: zh
  cognitive: analysis
  stem: 一名選手深蹲後出現膝前疼痛，理學檢查顯示是髕腱炎。最有可能的根本原因是什麼？
  locator: 第 2 章 · Knees
  options:
  - text: 深蹲這個動作本身結構上有害
    correct: false
    why_wrong: 把症狀歸因於動作類型，忽略書中明示髕腱炎多源自負荷與恢復安排不當，而非深蹲這個動作的內在風險。
  - text: 訓練量、強度或恢復未妥善漸進
    correct: true
  - text: 股四頭肌絕對力量明顯不足
    correct: false
    why_wrong: 誤將肌腱過用問題簡化為單一肌群絕對力量問題；書中把髕腱炎定位在負荷管理失衡而非股四頭肌的力學輸出。
- id: ch02.joint-biomechanics.i06.q1
  item: ch02.joint-biomechanics.i06
  dco: sf1.D.2
  lang: en
  cognitive: recall
  stem: When should knee wraps be considered for use during a back squat, according to the mechanical effect described in the text?
  locator: 第 2 章 · Knees
  options:
  - text: On every working set
    correct: false
    why_wrong: Misapplies the recommendation; wraps are reserved for maximal loads, and constant use masks true knee-extensor strength and risks cartilage wear.
  - text: Only on the heaviest sets
    correct: true
  - text: Only during the warm-up
    correct: false
    why_wrong: Confuses the warm-up purpose with peak-load support; the elastic assistance is meaningful precisely when the resistance is greatest.
- id: ch02.levers.i02.q1
  item: ch02.levers.i02
  dco: sf1.C.2
  lang: en
  cognitive: application
  stem: In a calf raise where the ball of the foot acts as the fulcrum, which best describes the mechanical arrangement of the gastrocnemius?
  locator: 第 2 章 · Levers of the Musculoskeletal System
  options:
  - text: A second-class lever, so the muscle needs less force than the load
    correct: true
  - text: A third-class arrangement in which the gastrocnemius is at a disadvantage
    correct: false
    why_wrong: Places the gastrocnemius at a mechanical disadvantage; in a calf raise the muscle arm is longer than the resistance arm, so it works with an advantage.
  - text: A first-class setup with bodyweight and muscle on opposite sides
    correct: false
    why_wrong: Splits muscle force and load across the fulcrum; in a calf raise both act on the same side, which is what defines the second-class pattern.
- id: ch02.levers.i04.q1
  item: ch02.levers.i04
  dco: sf1.C.2
  lang: en
  cognitive: recall
  stem: Most human muscles operate at a mechanical advantage below 1. What does that arrangement imply?
  locator: 第 2 章 · Levers of the Musculoskeletal System
  options:
  - text: Tendon and muscle are loaded more heavily than the resistance
    correct: true
  - text: The joint moves through a smaller range of motion
    correct: false
    why_wrong: Confuses a force ratio with joint travel; mechanical advantage describes how force is scaled across the lever, not how far the joint can move.
  - text: Contraction speed at the hand drops below muscle speed
    correct: false
    why_wrong: Gets the speed trade-off backwards; a mechanical advantage below one lets the hand travel faster than the muscle shortens, which is the price paid for the force disadvantage.
- id: ch02.levers.i05.q1
  item: ch02.levers.i05
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 啞鈴彎舉到前臂水平時感覺最吃力，此現象最能由下列哪一個力學概念解釋？
  locator: 第 2 章 · Levers of the Musculoskeletal System
  options:
  - text: 阻力力臂（前臂水平距離）在此時最大
    correct: true
  - text: 肌肉的靜息長度恰在此時達到最大
    correct: false
    why_wrong: 把張力—長度關係套到動態動作的難點上，忽略真正限制扭矩的是阻力力臂的瞬時幾何。
  - text: 重力加速度在水平時達到最大
    correct: false
    why_wrong: 將 g 視為變動量；事實上重力加速度在地表近乎常數，無法解釋角度依賴的難度變化。
- id: ch02.musculature.i01.q1
  item: ch02.musculature.i01
  dco: sf1.A.1
  lang: zh
  cognitive: recall
  stem: 解剖學傳統上對肌肉「起點（origin）」的定義為何？
  locator: 第 2 章 · Skeletal Musculature
  options:
  - text: 靠近身體中心的那一端
    correct: true
  - text: 肌腹最膨大的中段位置
    correct: false
    why_wrong: 把肌肉的外形描述當成附著點；起點講的是肌肉接在骨頭上的位置，不是肌腹最粗的那一段。
  - text: 跨過關節後的遠側附著
    correct: false
    why_wrong: 把止點的位置說成起點；跨過關節後的遠端附著是止點，傳統命名裡起點指的是近端那一側。
- id: ch02.musculature.i03.q1
  item: ch02.musculature.i03
  dco: sf1.A.1
  lang: zh
  cognitive: analysis
  stem: 需要精確施力點的動作，最依賴下列哪一項附著特性？
  locator: 第 2 章 · Skeletal Musculature
  options:
  - text: 肌腱把力集中在小面積並直接傳入骨膜
    correct: true
  - text: 肉質附著把力集中在小面積，壓迫骨骼
    correct: false
    why_wrong: 倒置兩種附著的力學特性；肉質附著的特徵是分散力於較大骨骼面積，與肌腱相反。
  - text: 肌腱含有大量收縮性肌纖維，可放大施力
    correct: false
    why_wrong: 把肌腱誤當作可主動收縮的結構；肌腱本質是結締組織，被動傳導肌肉收縮力。
- id: ch02.musculature.i06.q1
  item: ch02.musculature.i06
  dco: sf1.C.3
  lang: zh
  cognitive: application
  stem: 一名選手在做臥推時教練注意到肩胛過度移動，最可能缺乏哪一類肌肉的功能？
  locator: 第 2 章 · Skeletal Musculature
  options:
  - text: 推側主動肌（三頭與胸肌）
    correct: false
    why_wrong: 把臥推的主要出力肌誤認為負責肩胛穩定；胸大肌與三頭肌的拉力會透過肩胛傳遞，但穩定肩胛的是另一群肌。
  - text: 穩定肩胛的協同肌群
    correct: true
  - text: 對側拮抗肌（背部伸肌）
    correct: false
    why_wrong: 把問題歸因到背部伸展肌；肩胛過度移動屬於近端基座不穩，並非背部大肌群功能不足所致。
- id: ch02.planes.i02.q1
  item: ch02.planes.i02
  dco: sf1.C.1
  lang: zh
  cognitive: recall
  stem: 下列哪一個訓練動作主要發生在冠狀面？
  locator: 第 2 章 · Anatomical Planes and Major Body Movements
  options:
  - text: 站立側平舉
    correct: true
  - text: 站立彎舉動作
    correct: false
    why_wrong: 把矢狀面的典型動作誤判為冠狀面；彎舉主要在矢狀面屈伸肘關節，與冠狀面無關。
  - text: 啞鈴飛鳥動作
    correct: false
    why_wrong: 將橫切面的水平外展誤認為冠狀面動作；飛鳥的主要關節動作發生在橫切面的水平面上。
- id: ch02.planes.i06.q1
  item: ch02.planes.i06
  dco: sf1.H.1
  lang: en
  cognitive: application
  stem: A coach wants to apply the principle of specificity to a sprinter. Which is the most appropriate first step?
  locator: 第 2 章 · Anatomical Planes and Major Body Movements
  options:
  - text: Select exercises that match the joint actions of sprinting
    correct: true
  - text: Choose the heaviest compound lifts the athlete can perform
    correct: false
    why_wrong: Defaults to a strength-maximization approach; specificity requires matching the movement pattern first, not just loading the athlete maximally.
  - text: Replace all machine work with free weights
    correct: false
    why_wrong: Confuses a free-weight preference with movement matching; specificity is driven by joint actions and planes, not the equipment category.
- id: ch02.planes.i07.q1
  item: ch02.planes.i07
  dco: sf1.H.1
  lang: zh
  cognitive: application
  stem: 教練設計課表時只覆蓋三大解剖平面，不為每個斜向角度各設一個動作，最主要的理由是什麼？
  locator: 第 2 章 · Anatomical Planes and Major Body Movements
  options:
  - text: 因為主平面訓練的效果會外溢到跨平面動作
    correct: true
  - text: 因為真實運動從不發生在跨平面角度上
    correct: false
    why_wrong: 把訓練簡化的理由建立在錯誤前提上；書中明示動作很少只發生在單一平面，跨平面動作本就存在。
  - text: 因為三大平面已涵蓋所有可能的關節角度
    correct: false
    why_wrong: 把「足夠」誤當成「完整」；三大平面是教學與規劃框架，並未列舉關節所有角度。
- id: ch02.resistance-sources.i05.q1
  item: ch02.resistance-sources.i05
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 液壓與氣壓器械跟槓片相比，最明顯少掉的是哪一個訓練成分？
  locator: 第 2 章 · Fluid Resistance
  options:
  - text: 阻力隨速度變化而變動，無法維持等速
    correct: false
    why_wrong: 把流體阻力特性與等速概念混為一談；書中明示此類器械本就不是等速，此處不是主要限制。
  - text: 缺乏真正的離心收縮訓練相
    correct: true
  - text: 阻力與速度成正比，無法做慢速動作
    correct: false
    why_wrong: 把流體阻力特性寫成絕對限制；書中明示低速時阻力小，並非無法做慢速動作。
- id: ch02.size-strength.i02.q1
  item: ch02.size-strength.i02
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 體型等比例放大時，肌力／體重比下降的最根本原因在哪裡？
  locator: 第 2 章 · Body Size
  options:
  - text: 肌力隨尺寸的平方成長，體重隨立方成長
    correct: true
  - text: 肌肉橫截面積在放大過程中維持不變
    correct: false
    why_wrong: 否認橫截面積會跟著體型放大；面積確實變大，問題在於它只跟尺寸的平方成正比，追不上體重的立方。
  - text: 絕對肌力在體型變大時反而會下降
    correct: false
    why_wrong: 把相對值的下降誤讀成絕對值下降；體型變大時絕對肌力其實是增加的，只是體重增加得更快。
- id: ch02.size-strength.i03.q1
  item: ch02.size-strength.i03
  dco: sf1.J.4
  lang: en
  cognitive: analysis
  stem: Why does the classic allometric formula dividing lifted weight by body weight to the two-thirds power most consistently appear to favor middleweight athletes?
  locator: 第 2 章 · Body Size
  options:
  - text: Because the middleweight class is the most populated and competitive
    correct: true
  - text: Because the formula is known to systematically overstate lighter athletes' scores
    correct: false
    why_wrong: Treats the apparent bias as a built-in error rather than a sampling effect; the text attributes the pattern to population density at the middleweight class.
  - text: Because heavier athletes cannot generate enough absolute force
    correct: false
    why_wrong: Confuses absolute force with relative force; heavier athletes usually generate more absolute force, but the ratio still drops because weight scales faster.
- id: ch02.strength-factors.i01.q1
  item: ch02.strength-factors.i01
  dco: sf1.H.1
  lang: zh
  cognitive: application
  stem: 一名新手阻力訓練學員在最初幾週肌力快速進步，最主要的生理機制為何？
  locator: 第 2 章 · Neural Control
  options:
  - text: 運動單位徵召與放電頻率的提升
    correct: true
  - text: 肌纖維橫截面積的肥大
    correct: false
    why_wrong: 將早期進步歸因於肌肥大；書中明示肌肥大發生較慢，初期的快速進步屬神經適應而非結構性肥大。
  - text: 肌腱附著點遠離關節的結構改變
    correct: false
    why_wrong: 把不可訓練的骨骼特徵當作早期進步原因；附著點屬先天幾何，訓練無法改變其位置。
- id: ch02.strength-factors.i02.q1
  item: ch02.strength-factors.i02
  dco: sf1.A.1
  lang: en
  cognitive: application
  stem: Two athletes share the same upper-arm girth but differ in height. Which is most consistent with the textbook?
  locator: 第 2 章 · Muscle Cross-Sectional Area
  options:
  - text: Both produce similar force, but the shorter athlete has the better relative strength
    correct: true
  - text: The taller athlete is necessarily much stronger when tested in absolute terms
    correct: false
    why_wrong: Assumes length scales strength; the chapter ties strength to cross-sectional area, not to limb length, so equal girth implies similar absolute force.
  - text: The shorter athlete must have longer fibers and higher contraction speed
    correct: false
    why_wrong: Invents an unsupported fiber-length relationship; the textbook's argument is about cross-sectional area and body mass, not fiber length.
- id: ch02.strength-factors.i04.q1
  item: ch02.strength-factors.i04
  dco: sf1.H.1
  lang: zh
  cognitive: recall
  stem: 肌肉處於哪一種長度時能輸出最大力量？
  locator: 第 2 章 · Muscle Length
  options:
  - text: 肌肉縮到最短時
    correct: false
    why_wrong: 將最短長度視為最佳；肌動蛋白與肌凝蛋白在最短長度時重疊少，可接合橫橋數量並非最大。
  - text: 肌肉被拉到最長時
    correct: false
    why_wrong: 將最長長度視為最佳；過度拉長同樣會減少肌動蛋白與肌凝蛋白的重疊區與可用橫橋。
  - text: 肌肉靜息長度時
    correct: true
- id: ch02.work-power.i02.q1
  item: ch02.work-power.i02
  dco: sf1.C.2
  lang: en
  cognitive: application
  stem: Which is the most important reason the textbook warns against treating "power" as a synonym for the colloquial term "explosive strength"?
  locator: 第 2 章 · Positive Work and Power
  options:
  - text: Because power has a precise physical definition involving force and velocity
    correct: true
  - text: Because explosive strength is a higher quantity than mechanical power
    correct: false
    why_wrong: Inverts the relationship; explosive strength is an informal term that the text subordinates to the precise power definition, not the other way around.
  - text: Because power and explosive strength are measured in different units
    correct: false
    why_wrong: Fixates on units; the chapter's concern is the conceptual precision of the term, not a simple unit mismatch.
- id: ch02.work-power.i06.q1
  item: ch02.work-power.i06
  dco: sf1.C.2
  lang: zh
  cognitive: application
  stem: 把「肌力」綁在低速動作、「功率」綁在高速動作，這種二分法最主要的錯誤在哪裡？
  locator: 第 2 章 · Strength Versus Power
  options:
  - text: 兩者皆反映在特定速度下產力的能力
    correct: true
  - text: 兩者分別專屬低速與高速情境，不可互通
    correct: false
    why_wrong: 採取了書中明示的常見錯誤分類；肌力與功率都與速度相關，不應被二分到兩個速度帶。
  - text: 功率僅取決於肌力大小，與速度無關
    correct: false
    why_wrong: 把 P = F × v 中的速度項忽略；功率若與速度無關，公式就退化成單純的力學描述。
