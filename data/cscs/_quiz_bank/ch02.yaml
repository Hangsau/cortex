meta:
  chapter: ch02
  source: data/cscs/ch02.yaml
questions:
  # ── 槓桿系統（sf1.C 生物力學）──
  - id: ch02.levers.i01.q1
    item: ch02.levers.i01
    dco: sf1.C.2
    lang: zh
    cognitive: recall
    stem: 第一類槓桿在結構上的最明顯特徵為何？
    locator: 第 2 章 · Levers of the Musculoskeletal System
    options:
      - text: 支點居於肌力與阻力兩端之間
        correct: true
      - text: 阻力落在支點和肌腱附著端的中間
        correct: false
        why_wrong: 第二類的阻力在中段而非支點在中段；第一類的判定依據是支點居於肌力與阻力之間。
      - text: 肌腱與阻力同側，且肌腱靠近支點
        correct: false
        why_wrong: 第三類的特徵是肌力與阻力同側且肌腱靠近支點；題幹問的是支點居中，而非肌腱與阻力的相對位置。

  - id: ch02.work-power.i05.q1
    item: ch02.work-power.i05
    dco: sf1.C.2
    lang: zh
    cognitive: recall
    stem: 書中表2.1所列「一磅」換算成牛頓的係數為何？
    locator: 第 2 章 · Positive Work and Power
    options:
      - text: 4.448 N
        correct: true
      - text: 9.807 N
        correct: false
        why_wrong: 把公斤力換算成牛頓的常數當成磅到牛頓的係數；書中表2.1的同一張表確實有 kgf → N，但這不是 lb → N。
      - text: 0.454 N
        correct: false
        why_wrong: 把磅換算成公斤的常數直接當作牛頓數值；缺少乘上 9.807 m/s² 的重力加速度。

  - id: ch02.strength-factors.i07.q1
    item: ch02.strength-factors.i07
    dco: sf1.A.2
    lang: en
    cognitive: recall
    stem: In which type of muscle action does the muscle produce force without any change in length?
    locator: 第 2 章 · Joint Angular Velocity
    options:
      - text: an isometric hold against a fixed bar
        correct: true
      - text: concentric work while the belly shortens
        correct: false
        why_wrong: Picks the phase where fibers pull the joint through its range; force there arrives with visible shortening, which the stem rules out.
      - text: eccentric action, muscle gives way slowly
        correct: false
        why_wrong: Picks the phase where the load wins and fibers stretch under tension; that yielding is still a change in muscle length.

  - id: ch02.joint-biomechanics.i08.q1
    item: ch02.joint-biomechanics.i08
    dco: sf1.D.2
    lang: zh
    cognitive: recall
    stem: 書中所列阻力訓練的傷害發生率，每千小時大約為多少次？
    locator: '第 2 章 · Joint Biomechanics: Concerns in Resistance Training'
    options:
      - text: 平均每千小時約四件傷害
        correct: true
      - text: 全季賽事約二十件傷害
        correct: false
        why_wrong: 把單一賽季總件數當成每千小時發生率；賽季總件數與時率是完全不同的統計量。
      - text: 職業足球員每千小時上百件傷害
        correct: false
        why_wrong: 把團隊運動等高傷害率活動的數量級搬到阻力訓練；書中強調阻力訓練屬於低傷害率運動。

  # ── 動態力臂（sf1.C 生物力學）──
  - id: ch02.levers.i06.q1
    item: ch02.levers.i06
    dco: sf1.C.2
    lang: zh
    cognitive: application
    stem: 手持啞鈴做彎舉時，啞鈴對肘關節的阻力矩在哪個前臂位置最大？
    locator: 第 2 章 · Levers of the Musculoskeletal System
    options:
      - text: 前臂與地面平行，啞鈴遠離肘關節時
        correct: true
      - text: 前臂向上舉至垂直，指尖朝向天花板時
        correct: false
        why_wrong: 假設上舉到頂阻力矩最大；前臂朝上垂直時啞鈴與肘關節幾乎同一水平線，阻力臂接近零。
      - text: 前臂自然下垂於身側，啞鈴貼近大腿時
        correct: false
        why_wrong: 把起始位置當成阻力矩最大；前臂下垂時啞鈴作用線大致通過肘關節旋轉軸，阻力臂極短。

  # ── 平面（sf1.C 生物力學）──
  - id: ch02.planes.i01.q1
    item: ch02.planes.i01
    dco: sf1.C.1
    lang: en
    cognitive: application
    stem: A sprinter accelerates down the track with hips and knees extending in a forward-backward direction. In which plane does this lower-body action primarily occur?
    locator: 第 2 章 · Anatomical Planes and Major Body Movements
    options:
      - text: sagittal
        correct: true
      - text: frontal
        correct: false
        why_wrong: Names the plane that divides the body into front and back halves; sprint action is forward-backward, not side-to-side.
      - text: transverse
        correct: false
        why_wrong: Names the plane that divides upper and lower halves and governs rotation; hip and knee action is linear, not rotational.

  # ── 拮抗肌（sf1.C 肌肉角色）──
  - id: ch02.musculature.i05.q1
    item: ch02.musculature.i05
    dco: sf1.C.3
    lang: zh
    cognitive: application
    stem: 投擲末期，肱二頭肌對剛完成伸肘的前臂產生作用的主要目的為何？
    locator: 第 2 章 · Skeletal Musculature
    options:
      - text: 在動作末段煞車，保護關節免受衝擊
        correct: true
      - text: 提供向心加速，協助把球推得更遠
        correct: false
        why_wrong: 假設末段需要更多主動力；此時前臂已在極高速度下延伸，再加速並非肌力可及，反而應減速。
      - text: 預先啟動準備下一投的向心收縮
        correct: false
        why_wrong: 把拮抗肌的角色誤當成下一動作的準備；末段的作用是煞車與穩定，不是預先啟動向心收縮。

  # ── 彈性阻力（sf1.C 阻力來源）──
  - id: ch02.resistance-sources.i06.q1
    item: ch02.resistance-sources.i06
    dco: sf1.C.2
    lang: zh
    cognitive: application
    stem: 與人體肌力曲線相比，彈力帶最主要的缺點是什麼？
    locator: 第 2 章 · Elasticity
    options:
      - text: 末端阻力最大，但多數肌群末端力量最弱
        correct: true
      - text: 阻力隨動作一直線下降，需中途加力
        correct: false
        why_wrong: 把彈性阻力曲線的方向顛倒；彈力帶阻力隨拉伸距離增加，並非隨動作下降。
      - text: 阻力完全不受拉伸距離影響，與橡皮筋不同
        correct: false
        why_wrong: 把彈力帶當作不受距離影響的器械；彈性阻力定義就是隨拉伸距離增加，這條假設違背定義。

  # ── 雙關節肌（sf1.C 肌肉角色）──
  - id: ch02.musculature.i07.q1
    item: ch02.musculature.i07
    dco: sf1.C.3
    lang: en
    cognitive: application
    stem: During a heavy squat the rectus femoris pulls the shank up but also bends the hip. Which muscle most needs to contract at the same time to keep the trunk upright?
    locator: 第 2 章 · Skeletal Musculature
    options:
      - text: gluteus maximus
        correct: true
      - text: tibialis anterior
        correct: false
        why_wrong: this muscle dorsiflexes the ankle; it has no action at the hip and so cannot oppose hip flexion caused by the rectus femoris during the squat.
      - text: gastrocnemius
        correct: false
        why_wrong: this muscle plantarflexes the ankle; its actions are at the ankle and knee and do not include hip extension, so it cannot directly oppose the rectus femoris at the hip.

  # ── 慣性（sf1.C 阻力來源）──
  - id: ch02.resistance-sources.i03.q1
    item: ch02.resistance-sources.i03
    dco: sf1.C.2
    lang: zh
    cognitive: application
    stem: 爆發上搏的加速段，運動員對槓鈴的向上施力最主要必須包含哪個分量？
    locator: 第 2 章 · Inertia
    options:
      - text: 對抗重力加上向上加速度的慣性分量
        correct: true
      - text: 只對抗槓鈴靜重，讓合力恰為零
        correct: false
        why_wrong: 把等速托住當成加速時的需求；合力為零時槓鈴並未向上加速，無法完成爆發上搏的加速段。
      - text: 略小於槓鈴重量，由拮抗肌協助煞車
        correct: false
        why_wrong: 套用下放階段的力學；下放是減速（施力小於重量），但爆發上搏的加速段需要施力大於重量。

  # ── 功與功率（sf1.C 生物力學）──
  - id: ch02.work-power.i01.q1
    item: ch02.work-power.i01
    dco: sf1.C.2
    lang: en
    cognitive: application
    stem: An athlete carries a heavy box across a level room at constant speed. The supporting force on the box is purely vertical while the motion is purely horizontal. What does this supporting force primarily contribute to the box?
    locator: 第 2 章 · Positive Work and Power
    options:
      - text: no work done on the box at all
        correct: true
      - text: positive work equal to weight times path
        correct: false
        why_wrong: Multiplies weight by the distance walked, ignoring that work counts only the force component lying along the displacement.
      - text: added kinetic energy from the carry
        correct: false
        why_wrong: Mistakes steady horizontal travel for a gain in speed; the box never accelerates, so its kinetic energy holds constant.

  # ── 摩擦力（sf1.C 阻力來源）──
  - id: ch02.resistance-sources.i04.q1
    item: ch02.resistance-sources.i04
    dco: sf1.C.2
    lang: zh
    cognitive: application
    stem: 摩擦制動式腳踏車測功計，係數與壓緊力固定時，若踩踏速度加倍，平均功率輸出最主要會如何改變？
    locator: 第 2 章 · Friction
    options:
      - text: 摩擦力大致不變，平均功率約為原來的兩倍
        correct: true
      - text: 摩擦阻力加倍，平均功率則會膨脹為四倍
        correct: false
        why_wrong: 把流體阻力隨速度增加的特性套到滑動摩擦；滑動摩擦的力只看法向力與係數，速度本身不會放大阻力。
      - text: 阻力與踏速互相抵銷，平均功率因此保持不變
        correct: false
        why_wrong: 假設阻力與踏速反向變動可使功率不變；同樣的功若在更短時間完成，功率仍會上升。

  # ── 肌力/體重比（sf1.C 結構與功能）──
  - id: ch02.size-strength.i01.q1
    item: ch02.size-strength.i01
    dco: sf1.C.2
    lang: zh
    cognitive: analysis
    stem: 一位跳遠選手經過八週阻力訓練後，體重增加一成，垂直跳成績提升五成，但肌力測驗只進步兩成；最可能反映的問題是什麼？
    locator: 第 2 章 · Strength-to-Mass Ratio
    options:
      - text: 肌力體重比不增反降，因為肌力增幅跑不贏體重增幅
        correct: true
      - text: 垂直跳成績顯著進步，肌力體重比必然隨之提升
        correct: false
        why_wrong: 把絕對成績進步當成相對比值進步；肌力測驗只進步兩成而體重增加一成，分子增幅並未超越分母，比值實際下降。
      - text: 肌力測驗分數提高，代表肌力體重比已經水漲船高
        correct: false
        why_wrong: 把肌力測驗的絕對分數變化直接等同於比值變化；題幹的比值分母是體重而非測驗分數，分子增幅未超越分母則比值下滑。

  # ── 肌腱遠附著點（sf1.C 結構與功能）──
  - id: ch02.size-strength.i05.q1
    item: ch02.size-strength.i05
    dco: sf1.C.2
    lang: en
    cognitive: analysis
    stem: An athlete's tendon attaches farther from the joint than average. What is the primary trade-off that this longer moment arm creates?
    locator: 第 2 章 · Variations in Tendon Insertion
    options:
      - text: more torque, but a smaller joint sweep
        correct: true
      - text: more force and more speed together
        correct: false
        why_wrong: Reads a longer moment arm as a free upgrade; the book's figure shows the joint turning only 34° where the shorter arm turns 37°.
      - text: weaker leverage, yet a wider sweep
        correct: false
        why_wrong: Flips the geometry around; moving the attachment away from the axis lengthens the moment arm instead of shrinking it.
