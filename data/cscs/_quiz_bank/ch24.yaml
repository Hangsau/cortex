meta:
  chapter: ch24
  source: data/cscs/ch24.yaml
questions:
- id: ch24.administration.i01.q1
  item: ch24.administration.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 一份有效的使命聲明最應具備下列哪一項特質？
  locator: Mission Statement and Program Goals
  options:
  - text: 簡短聚焦且不規定具體手段
    correct: true
  - text: 詳列達成宗旨的所有操作方法
    correct: false
    why_wrong: 把手段寫進聲明等於替未來決策綁手綁腳；聲明應保留廣度，由後續目的填補執行細節。
  - text: 聚焦於單一隊伍並限定該季使用
    correct: false
    why_wrong: 使命聲明須範圍廣泛以維持長期適用，鎖定單一隊伍或賽季會隨環境變動而失效。
- id: ch24.administration.i02.q1
  item: ch24.administration.i02
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: Which of the following best completes the three components of an effective mission statement?
  locator: Mission Statement and Program Goals
  options:
  - text: Key market, contribution, and distinction
    correct: true
  - text: Vision, values, and strategic objectives
    correct: false
    why_wrong: Vision, values, and strategic objectives belong to broader organizational planning, not the three named building blocks of a mission statement.
  - text: Inputs, outputs, and performance measures
    correct: false
    why_wrong: Inputs, outputs, and performance measures describe evaluation logic, not the content a mission statement must answer about who, what, and why unique.
- id: ch24.administration.i05.q1
  item: ch24.administration.i05
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 在設施的書面文件中，政策與程序各自承擔什麼樣的分工？
  locator: Mission Statement and Program Goals
  options:
  - text: 政策是規則與規範，程序說明如何執行政策
    correct: true
  - text: 政策是訓練動作清單，程序是報名表單
    correct: false
    why_wrong: 把政策窄化為動作清單會把規範與執行混為一談，忽略政策應反映目標與目的的定位。
  - text: 兩者為同義詞，可任意互換使用
    correct: false
    why_wrong: 政策與程序在本章被明確區分為「規範」與「如何符合規範」，合併使用會讓手冊失去層次。
- id: ch24.emergency.i01.q1
  item: ch24.emergency.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 緊急行動計畫（EAP）最根本的存在目的是什麼？
  locator: Emergency Planning and Response
  options:
  - text: 詳述照護傷害的正確程序
    correct: true
  - text: 取代專業急救訓練的書面憑據
    correct: false
    why_wrong: 書面計畫不能代替人員實際受過的急救與 CPR 訓練，二者必須並存。
  - text: 作為保險公司理賠的唯一依據
    correct: false
    why_wrong: 保險理賠依據是保單條款與傷害報告，EAP 是現場應變工具而非理賠文件。
- id: ch24.emergency.i03.q1
  item: ch24.emergency.i03
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 當運動員在訓練中倒地不起，緊急團隊四個主要角色中最應優先由誰執行？
  locator: Emergency Planning and Response > Roles Within the Emergency Team
  options:
  - text: 立即照護運動員的人員
    correct: true
  - text: 趕去取得緊急設備的人員
    correct: false
    why_wrong: 取得設備雖屬四大角色之一，但生命照護以時間為最關鍵因素，不能排在第一位。
  - text: 由熟悉設施者引導救護車進入
    correct: false
    why_wrong: 引導救護車是後續步驟，需在有人先穩定傷者後才有意義，不能取代第一時間的處置。
- id: ch24.emergency.i07.q1
  item: ch24.emergency.i07
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 依本章，緊急行動計畫至少應多久演練一次？
  locator: Emergency Planning and Response > Components of an Emergency Action Plan
  options:
  - text: 每季至少一次
    correct: true
  - text: 每兩年一次
    correct: false
    why_wrong: 把演練頻率放寬到兩年一次會讓人員忘記分工與動線，無法在真正的緊急時刻即時反應。
  - text: 僅新人到職時
    correct: false
    why_wrong: 只在新進人員到職時演練無法維持全體人員的反應熟稔度，且未達本章設定的最低頻率。
- id: ch24.ethics-records.i03.q1
  item: ch24.ethics-records.i03
  dco: pa4.C
  lang: en
  cognitive: application
  stem: Under HIPAA, an athletic trainer asks the strength coach to share an athlete's injury report without a signed authorization. What is the most appropriate action?
  locator: Staff Policies and Activities > Reporting and Documentation
  options:
  - text: Decline to disclose the protected health information until written authorization is provided
    correct: true
  - text: Forward the full report because the athletic trainer is part of the sports medicine team
    correct: false
    why_wrong: Sports-medicine affiliation does not override HIPAA; written authorization is still required before protected information leaves the file.
  - text: Share only the diagnosis and withhold every other section of the injury report
    correct: false
    why_wrong: Selective disclosure still counts as unauthorized release of protected health information under the same federal rule.
- id: ch24.facility.i05.q1
  item: ch24.facility.i05
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 依本章的設施規則，爆發力動作應在何處進行、並搭配哪一種槓片？
  locator: Facility Administration > Figure 24.6 Facility Rules and Guidelines
  options:
  - text: 在平台上使用緩衝槓片
    correct: true
  - text: 在深蹲架內使用標準槓片
    correct: false
    why_wrong: 深蹲架是本章指定給深蹲的位置，不是爆發力動作；緩衝槓片的用途是承受落下。
  - text: 在自由重量區使用固定槓片
    correct: false
    why_wrong: 自由重量區在本章對應的是鎖扣與器材歸位要求，承接落下重量則交給平台與緩衝槓片。
- id: ch24.legal.i04.q1
  item: ch24.legal.i04
  dco: pa4.C
  lang: zh
  cognitive: recall
  stem: 依本章，認定肌力與體能專業人員過失必須同時具備哪四項要素？
  locator: Legal and Ethical Issues > Common Legal Terminology
  options:
  - text: 義務、違反義務、近因及損害
    correct: true
  - text: 動機、手段、結果與懲罰
    correct: false
    why_wrong: 動機與懲罰屬於紀律或倫理範疇，不是法律上認定過失的要件。
  - text: 書面契約、口頭協議、見證人與罰金
    correct: false
    why_wrong: 契約形式與罰金是民事執行層面的問題，與過失的四項構成要素無關。
- id: ch24.legal.i07.q1
  item: ch24.legal.i07
  dco: pa4.A
  lang: en
  cognitive: recall
  stem: Which of the following most accurately describes the strength and conditioning professional's scope of practice regarding medical clearance?
  locator: Legal and Ethical Issues > Preparticipation Screening and Medical Clearance
  options:
  - text: Neither diagnose conditions nor issue clearance for participation
    correct: true
  - text: Diagnose health conditions but leave clearance to medical staff
    correct: false
    why_wrong: A diagnostic role is explicitly outside the scope of practice, so granting it misstates the boundary even when clearance is left to others.
  - text: Issue clearance once an athlete signs a participation waiver
    correct: false
    why_wrong: A signed waiver documents consent and does not replace the medical evaluation that only sports medicine personnel are authorized to perform.
- id: ch24.personnel.i01.q1
  item: ch24.personnel.i01
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 肌力與體能主任在行政上最終要對哪些事務負責？
  locator: Strength and Conditioning Performance Team > Director of Strength and Conditioning (Head Strength and Conditioning Coach) > Figure 24.2 Responsibilities of the Strength and Conditioning Director
  options:
  - text: 對計畫、設施、器材、人員及預算等行政事務全面負責
    correct: true
  - text: 僅負責設計自身負責隊伍的訓練課表
    correct: false
    why_wrong: 把主任窄化為僅寫自身隊伍的課表會忽略跨隊伍、跨設施與跨預算的整體治理責任。
  - text: 只督導學生實習生，其餘人員由各隊教練自行管理
    correct: false
    why_wrong: 主任的職責涵蓋全部工作人員與學生實習生，把學生以外的人員排除在外會違反其行政定位。
- id: ch24.supervision.i01.q1
  item: ch24.supervision.i01
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: According to the chapter, which professional-to-participant ratio is recommended at the collegiate level during peak facility use?
  locator: Staff Policies and Activities > Instruction and Supervision
  options:
  - text: '1:20'
    correct: true
  - text: '1:10'
    correct: false
    why_wrong: One to ten is the guideline for the middle school level, where younger lifters need closer staffing than collegiate athletes.
  - text: '1:15'
    correct: false
    why_wrong: One to fifteen applies at the high school level, so using it for a university program loosens supervision past the stated guideline.
- id: ch24.emergency.i02.q1
  item: ch24.emergency.i02
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 緊急行動計畫的書面內容最不可能包含下列哪一項？
  locator: Emergency Planning and Response > Components of an Emergency Action Plan
  options:
  - text: 設施地址與最近出口的位置
    correct: false
    why_wrong: 設施地址與出口位置正是 EAP 必須寫明的項目，用來引導 EMS 進場與人員撤離。
  - text: 隊伍下一季的訓練週期表
    correct: true
  - text: EMS 啟動程序與聯絡人電話
    correct: false
    why_wrong: 啟動 EMS 與聯絡人是 EAP 的核心要件；它不是訓練課表，不能與緊急程序混為一談。
- id: ch24.ethics-records.i05.q1
  item: ch24.ethics-records.i05
  dco: pa4.C
  lang: en
  cognitive: recall
  stem: What is the first step in establishing a risk management strategy for a strength and conditioning facility?
  locator: Legal and Ethical Issues
  options:
  - text: Identify the key terms and the areas of liability exposure
    correct: true
  - text: Purchase the most expensive insurance policy available
    correct: false
    why_wrong: Insurance is one tool, but it comes after the exposure is mapped; skipping the diagnostic step leaves the most obvious gaps untreated.
  - text: Restrict every athlete to bodyweight exercises only
    correct: false
    why_wrong: It is a restriction strategy, not a risk assessment; effective risk management starts with understanding where exposure exists.
- id: ch24.facility.i01.q1
  item: ch24.facility.i01
  dco: pa4.C
  lang: zh
  cognitive: recall
  stem: 什麼樣的器材使用方式，會把責任歸屬導向產品責任（product liability）？
  locator: Legal and Ethical Issues > Product Liability
  options:
  - text: 未依製造商預定用途使用器材
    correct: true
  - text: 在器材上張貼警告標籤
    correct: false
    why_wrong: 張貼警告標籤是履行警示義務的作為，產品責任的爭點在於是否依製造商用途使用器材。
  - text: 定期向運動醫學部門提交報告
    correct: false
    why_wrong: 報告屬於另一節的紀錄要求，與產品責任的核心要件無關。
- id: ch24.facility.i02.q1
  item: ch24.facility.i02
  dco: pa4.C
  lang: en
  cognitive: application
  stem: When purchasing new equipment, which action most directly reduces the team's product liability exposure?
  locator: Legal and Ethical Issues > Product Liability
  options:
  - text: Use equipment only as intended and affix all warning labels visibly
    correct: true
  - text: Modify the equipment to fit facility-specific needs before first use
    correct: false
    why_wrong: Modifications void manufacturer intent; only modifications explicitly described in product literature preserve the intended-use defense.
  - text: Disregard recall notices until the next annual inspection
    correct: false
    why_wrong: Ignoring recalls directly shifts liability to the professional; the rule is to act immediately on recall information, not to defer it.
- id: ch24.legal.i01.q1
  item: ch24.legal.i01
  dco: pa4.A
  lang: zh
  cognitive: recall
  stem: 取得知情同意時向參與者說明固有風險與益處，是為了讓他能夠做什麼？
  locator: Legal and Ethical Issues > Common Legal Terminology
  options:
  - text: 讓個人依風險益處決定是否參與
    correct: true
  - text: 全面免除設施的一切法律責任
    correct: false
    why_wrong: 同意書僅保護決策過程，不消滅法律責任；把它當成全面免責會誤導對同意範圍的理解。
  - text: 讓教練得以無監督加重負荷
    correct: false
    why_wrong: 知情同意與督導規範分屬兩件事，再多的簽署也不能取代督導責任。
- id: ch24.personnel.i02.q1
  item: ch24.personnel.i02
  dco: pa4.A
  lang: zh
  cognitive: recall
  stem: NCAA 第一級立法對肌力與體能教練認證的核心要求為何？
  locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications)
  options:
  - text: 須通過全國認可認證計畫取得認證
    correct: true
  - text: 具備碩士學位即可直接任教
    correct: false
    why_wrong: 學位不等於專業認證；NCAA 立法明確要求外部認證，非以學位替代。
  - text: 由各校運動部門自行頒發的證照
    correct: false
    why_wrong: 自行頒發失去「全國認可」前提，違反立法要求外部認證組織把關的精神。
- id: ch24.screening.i01.q1
  item: ch24.screening.i01
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 參與前篩查與醫療放行的最關鍵條件為何？
  locator: Legal and Ethical Issues > Preparticipation Screening and Medical Clearance
  options:
  - text: 先通過健康照護提供者的篩查與放行
    correct: true
  - text: 由肌力與體能主任目測後即可放行
    correct: false
    why_wrong: 目測放行逾越執業範圍；只有健康照護提供者能作醫療放行的判斷。
  - text: 由隊友互測體能即可代表篩查
    correct: false
    why_wrong: 同儕互測不具醫療放行效力；體能測驗與醫療篩查不能相互替代。
- id: ch24.screening.i02.q1
  item: ch24.screening.i02
  dco: pa4.A
  lang: en
  cognitive: recall
  stem: Who is authorized to grant medical clearance for an athlete entering or returning to a strength and conditioning program?
  locator: Legal and Ethical Issues > Preparticipation Screening and Medical Clearance
  options:
  - text: Medical staff such as an athletic trainer or physician
    correct: true
  - text: The head strength and conditioning coach acting alone
    correct: false
    why_wrong: Medical clearance is outside the strength and conditioning scope of practice; the coach cannot substitute judgment for medical staff.
  - text: The athlete's team captain by majority vote
    correct: false
    why_wrong: Teammates lack clinical authority; clearance requires a qualified medical professional, not peer approval.
- id: ch24.screening.i08.q1
  item: ch24.screening.i08
  dco: pa4.C
  lang: zh
  cognitive: application
  stem: 教練考慮以額外體能負荷處罰違規運動員時，下列哪一個判斷最符合本章指引？
  locator: Legal and Ethical Issues > Discipline
  options:
  - text: 不應增加會提高受傷或猝死的負荷
    correct: true
  - text: 只要運動員簽署同意書即可加重
    correct: false
    why_wrong: 同意書不能凌駕於受傷與猝死風險之上；此禁制基於健康風險，與同意無關。
  - text: 視違規嚴重度由教練彈性加重
    correct: false
    why_wrong: 教練彈性加重會落入以體能活動懲罰的禁區；教材明確不鼓勵此作法。
- id: ch24.supervision.i02.q1
  item: ch24.supervision.i02
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 本章列出的督導原則裡，對督導者到場方式的要求是什麼？
  locator: Staff Policies and Activities > Instruction and Supervision
  options:
  - text: 始終在場並主動親自參與
    correct: true
  - text: 透過監視器遠端觀察即可
    correct: false
    why_wrong: 監視器無法取代親自在場與主動參與；遠端觀察削弱了直接溝通與即時反應。
  - text: 由資深運動員代理督導
    correct: false
    why_wrong: 督導是合格專業人員的責任；交由運動員代理違反專業分工，也無法承擔法律後果。
- id: ch24.supervision.i04.q1
  item: ch24.supervision.i04
  dco: pa4.B
  lang: en
  cognitive: recall
  stem: Which instructional emphasis most directly reduces both injury rates and liability exposure?
  locator: Staff Policies and Activities > Instruction and Supervision
  options:
  - text: Safe and correct technique rather than the weight lifted
    correct: true
  - text: Maximizing load progression week to week
    correct: false
    why_wrong: Load progression is a programming outcome; leading with load over technique is precisely the pattern the chapter warns against for safety and liability.
  - text: Letting athletes self-select technique variations
    correct: false
    why_wrong: Self-selection removes the corrective teaching that the chapter ties to injury reduction; it shifts instruction away from the safety-first emphasis.
- id: ch24.ethics-records.i04.q1
  item: ch24.ethics-records.i04
  dco: pa4.C
  lang: zh
  cognitive: application
  stem: 設施的保單沒有涵蓋個別教練時，該教練首要的風險控管動作是什麼？
  locator: Legal and Ethical Issues > Liability Insurance
  options:
  - text: 購買專業責任保險以界定責任上限
    correct: true
  - text: 自行承擔所有風險並停止投保規劃
    correct: false
    why_wrong: 自行吸收風險違背風險管理原則，也讓自身曝險無限擴大；忽略保險規畫會讓責任上限無從界定。
  - text: 要求每位運動員個別購買壽險
    correct: false
    why_wrong: 壽險解決的是人身保障而非責任賠償，無法替代專業責任保險的功能；混淆了人身保險與責任保險的差異。
- id: ch24.personnel.i05.q1
  item: ch24.personnel.i05
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 新進肌力與體能助理到館報到當天，最應優先熟讀下列哪一組資料？
  locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications) > Figure 24.4 Points of Preparedness Required of Each Staff Member
  options:
  - text: 計畫政策、督導比例與緊急應變程序
    correct: true
  - text: 近三年所有運動員的私人社群媒體貼文
    correct: false
    why_wrong: 個人社群貼文屬隱私範疇，非工作準備的規範來源；蒐集這類資料也違反倫理守則與隱私原則。
  - text: 其他機構的同類型薪資比較表
    correct: false
    why_wrong: 薪資比較屬個人議價參考，與到職後的執行安全與督導準備無直接關聯；混淆了勞動條件與執業準備。
- id: ch24.administration.i04.q1
  item: ch24.administration.i04
  dco: pa4.A
  lang: zh
  cognitive: recall
  stem: 計畫目標已經訂好之後，計畫目的（program objectives）還要補上什麼？
  locator: Program Objectives
  options:
  - text: 目的是達成目標的具體手段
    correct: true
  - text: 目的是設定組織的最終宗旨
    correct: false
    why_wrong: 把目的與使命聲明（mission statement）混為一談；目標才是廣泛的預期終點，目的只是達成它的具體手段。
  - text: 目的是規範設施的懲戒處置
    correct: false
    why_wrong: 把目的誤認為紀律政策；紀律處置屬於政策與程序手冊的範疇，與目的陳述的對象不同。
- id: ch24.emergency.i08.q1
  item: ch24.emergency.i08
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 運動員在設施內受傷後，工作人員必須完成並保存哪一份文件？
  locator: Staff Policies and Activities > Reporting and Documentation
  options:
  - text: 完成事故－傷害報告表並存檔
    correct: true
  - text: 僅以電子郵件簡述告知教練
    correct: false
    why_wrong: 把口頭或電子郵件通知當成書面紀錄，忽略了事故傷害報告表作為正式存檔文件的法律與行政功能。
  - text: 等下次季末再統一填寫報告
    correct: false
    why_wrong: 延遲填寫會讓細節遺漏並破壞時序紀錄的完整性；報告應在事件發生後儘速完成並進入指揮鏈。
- id: ch24.ethics-records.i06.q1
  item: ch24.ethics-records.i06
  dco: pa4.A
  lang: zh
  cognitive: application
  stem: 設施編寫政策與程序手冊時，最核心是要它發揮什麼作用？
  locator: Mission Statement and Program Goals
  options:
  - text: 作為安全計畫的藍圖並納入訴訟風險防護
    correct: true
  - text: 取代運動醫學部門的醫療放行流程
    correct: false
    why_wrong: 把手冊的功能擴張到醫療放行範疇，忽略了醫療放行必須由運動醫學人員執行而非由行政手冊取代。
  - text: 作為向外部廠商採購器材的唯一依據
    correct: false
    why_wrong: 把手冊窄化為採購文件；採購只是設施管理的一環，手冊同時涵蓋指導、督導與緊急應變等更廣的範圍。
- id: ch24.ethics-records.i07.q1
  item: ch24.ethics-records.i07
  dco: pa4.A
  lang: zh
  cognitive: recall
  stem: 肌力與體能設施的專業性政策，可以為哪一類事項訂定標準？
  locator: Staff Policies and Activities > Code of Ethics and Professionalism
  options:
  - text: 教練－運動員關係的行為標準
    correct: true
  - text: 運動員在賽場上的得分戰術
    correct: false
    why_wrong: 把得分戰術當作肌力體能專業的政策範疇，忽略了戰術屬於運動教練的專業而非行政政策所能規範。
  - text: 比賽裁判的判決爭議處理
    correct: false
    why_wrong: 把裁判爭議列入肌力與體能設施的行政政策，混淆了場上執法與設施內部規範的適用對象。
- id: ch24.facility.i04.q1
  item: ch24.facility.i04
  dco: pa4.B
  lang: en
  cognitive: application
  stem: When scheduling multiple teams in a shared strength and conditioning facility, which group should most appropriately receive priority access?
  locator: Facility Administration
  options:
  - text: In-season teams whose schedules must match practices
    correct: true
  - text: Alumni athletes using the facility recreationally
    correct: false
    why_wrong: Alumni use is recreational rather than institutional, so it cannot outrank teams whose training has to coordinate with practice and competition.
  - text: External community groups renting weekly time slots
    correct: false
    why_wrong: Renting slots to outside groups earns revenue but serves fewer institutional athletes than the chapter's scheduling goal requires.
- id: ch24.facility.i08.q1
  item: ch24.facility.i08
  dco: pa4.B
  lang: zh
  cognitive: application
  stem: 設施在訂定開館與閉館程序時，最主要應該涵蓋哪一類範圍？
  locator: Facility Administration
  options:
  - text: 日常營運及檢查與清潔的政策
    correct: true
  - text: 運動員的個人比賽戰術指導
    correct: false
    why_wrong: 把開館閉館程序誤用於戰術指導，跨出了行政範疇進入運動教練的專業職責。
  - text: 客製化營養補充品調配細節
    correct: false
    why_wrong: 把營養調配的細節當作開館閉館程序的內容；補充品界線另於法律章節規範，與營運檢查流程不同。
- id: ch24.legal.i05.q1
  item: ch24.legal.i05
  dco: pa4.C
  lang: zh
  cognitive: application
  stem: 把風險承擔（assumption of risk）套用到重量訓練時，最貼近它原意的描述是什麼？
  locator: Legal and Ethical Issues > Common Legal Terminology
  options:
  - text: 運動員知悉固有風險仍自願參與
    correct: true
  - text: 專業人員免除所有告知與安全預防責任
    correct: false
    why_wrong: 把風險承擔誤用為免除專業人員責任的依據；風險承擔的前提仍是徹底告知與適當安全預防。
  - text: 運動部門不再需要任何保險或政策
    correct: false
    why_wrong: 把風險承擔的觀念擴大為取消保險與政策，忽略了書面聲明與行政規範仍是必要的配套。
- id: ch24.personnel.i03.q1
  item: ch24.personnel.i03
  dco: pa4.A
  lang: en
  cognitive: recall
  stem: Which credentials should assistant strength and conditioning professionals maintain in addition to their professional certification?
  locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications)
  options:
  - text: First aid, CPR, and AED certifications
    correct: true
  - text: A registered nursing license
    correct: false
    why_wrong: A nursing license belongs to a clinical role and does not cover the emergency-response credentials the chapter requires of assistants.
  - text: A personal trainer certification alone
    correct: false
    why_wrong: A training credential does not replace the first aid, CPR, and AED certifications that assistant staff must hold and renew.
- id: ch24.personnel.i06.q1
  item: ch24.personnel.i06
  dco: pa4.A
  lang: zh
  cognitive: recall
  stem: 依教材附錄的定義，CSCS 這個專業要對運動員做哪些事？
  locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications)
  options:
  - text: 評估、激勵、教育及訓練運動員
    correct: true
  - text: 為運動員進行醫學診斷與處方
    correct: false
    why_wrong: 把醫學診斷視為 CSCS 的核心職責，忽略了診斷屬於執業範圍外的醫療專業人員工作。
  - text: 專職擔任隊伍的進攻戰術教練
    correct: false
    why_wrong: 把 CSCS 的角色等同於戰術教練；戰術指導屬於運動教練的範圍，與肌力體能專業不同。
- id: ch24.screening.i04.q1
  item: ch24.screening.i04
  dco: pa4.A
  lang: en
  cognitive: recall
  stem: According to the eligibility criteria, which group is typically permitted to use the strength and conditioning facility?
  locator: Legal and Ethical Issues > Eligibility Criteria
  options:
  - text: Enrolled student-athletes in sponsored sports
    correct: true
  - text: Any walk-in member of the general public
    correct: false
    why_wrong: Public walk-in access contradicts the eligibility criteria, which restrict the facility to the institution's identified training population.
  - text: Unaffiliated personal training clients of staff
    correct: false
    why_wrong: Outside clients may train there only with director approval and supervision, so they are not part of the typical permitted group.
- id: ch24.screening.i06.q1
  item: ch24.screening.i06
  dco: pa4.C
  lang: zh
  cognitive: recall
  stem: 所有參與者在使用設施前簽署放棄責任協議表，想要降低的是什麼？
  locator: Legal and Ethical Issues > Eligibility Criteria
  options:
  - text: 降低設施內使用期間受傷的責任
    correct: true
  - text: 取代所有緊急行動計畫的角色
    correct: false
    why_wrong: 把放棄責任表當作緊急行動計畫的替代品；前者處理民事責任風險，後者處理傷害發生時的即時處置。
  - text: 免除專業人員的督導責任
    correct: false
    why_wrong: 把簽署放棄責任表視為免除督導的手段，忽略了專業人員的督導義務並不會因簽署而消失。
- id: ch24.supervision.i03.q1
  item: ch24.supervision.i03
  dco: pa4.C
  lang: en
  cognitive: recall
  stem: Approximately what percentage of sport injury court cases cite supervision as a factor?
  locator: Staff Policies and Activities > Instruction and Supervision
  options:
  - text: Approximately 80 percent
    correct: true
  - text: Approximately 20 percent
    correct: false
    why_wrong: Twenty percent would make supervision a minor factor, whereas the chapter reports it in roughly four out of five injury cases.
  - text: Approximately 50 percent
    correct: false
    why_wrong: Half of all cases is a midpoint guess rather than the explicit estimate of about 80 percent that the chapter gives.
- id: ch24.supervision.i07.q1
  item: ch24.supervision.i07
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 教材引用的研究中，較低督導比例下訓練的受試者，肌力增進呈現什麼方向？
  locator: Staff Policies and Activities > Instruction and Supervision
  options:
  - text: 肌力增進幅度較大
    correct: true
  - text: 肌力增進明顯較小
    correct: false
    why_wrong: 把較低督導比例誤認為會妨礙肌力增進，與教材所載研究結果的方向相反。
  - text: 肌力完全沒有變化
    correct: false
    why_wrong: 把較低督導比例的效應誇大成完全沒有肌力變化，忽略教材只描述方向而非量化差距。
- id: ch24.administration.i07.q1
  item: ch24.administration.i07
  dco: pa4.B
  lang: zh
  cognitive: recall
  stem: 主任在分派肌力與體能表現團隊職務時，最應依據下列哪一項原則？
  locator: Strength and Conditioning Performance Team
  options:
  - text: 人員的特定科學基礎專長
    correct: true
  - text: 該成員本季可用工時的長短
    correct: false
    why_wrong: 工時多寡屬於排程層面的考量，不能取代專業專長作為分派依據；忽略專長會讓任務落在不適任的人身上。
  - text: 該成員隸屬運動教練團的資歷
    correct: false
    why_wrong: 運動教練團資歷不等於肌力與體能專業專長；本章把分派依據明確定位於科學基礎專長而非外部頭銜。
- id: ch24.legal.i06.q1
  item: ch24.legal.i06
  dco: pa4.C
  lang: en
  cognitive: application
  stem: A professional notices severe cable wear on a selectorized machine but does not repair it or post an out-of-order sign; an athlete is later injured using the machine. Which element of negligence is most directly established by the failure to act?
  locator: Legal and Ethical Issues > Common Legal Terminology
  options:
  - text: Breach of the duty to repair or warn about the worn cable
    correct: true
  - text: Assumption of risk by the equipment manufacturer
    correct: false
    why_wrong: Assumption of risk belongs to the athlete's understanding, not to the manufacturer; the chapter ties liability to the professional's inaction in this scenario.
  - text: Damages unrelated to foreseeability in the equipment case
    correct: false
    why_wrong: Damages alone do not establish the duty component; the conduct element is the failure to repair or post the warning, which breaches the existing duty.
