questions:
- id: ch21.preparatory-period.i04.q1
  item: ch21.preparatory-period.i04
  dco: pa1.E.1
  lang: zh
  cognitive: application
  stem: 一名肌力與爆發力項目運動員正進入備賽期早段的一般備賽相，教練應最優先採用哪一個阻力訓練處方？
  locator: Periodization Periods > Preparatory Period > Hypertrophy/Strength Endurance Phase
  options:
  - text: 50–75% 1RM，每動作 3 至 6 組、每組 8 至 20 次
    correct: true
  - text: 80–95% 1RM，每動作 2 至 6 組、每組 2 至 6 次
    correct: false
    why_wrong: 這是特殊備賽相基礎肌力相的負荷，強度更高而反覆次數更少；一般備賽相要的是較輕負荷搭配高反覆次數來累積訓練量。
  - text: 30–95% 1RM，每動作 2 至 5 組、每組 2 至 5 次
    correct: false
    why_wrong: 把第一轉換期肌力／爆發力相的處方搬到一般備賽相；該處方目標是把肌力轉化為爆發力，不是建立體能基礎。
- id: ch21.preparatory-period.i05.q1
  item: ch21.preparatory-period.i05
  dco: pa1.E.1
  lang: zh
  cognitive: application
  stem: 一名運動員從肌肥大／肌力耐力相推進到基礎肌力相，除了負荷加重之外，依教材所述他的阻力訓練動作選擇最主要會往哪個方向改變？
  locator: Periodization Periods > Preparatory Period > Basic Strength Phase
  options:
  - text: 往更貼近運動專項的動作靠攏
    correct: true
  - text: 改用更多單關節的器械輔助動作
    correct: false
    why_wrong: 器械上的單關節動作專項性更低，方向正好和這一相相反，那更像是前一相用來堆積肌肉量的手段。
  - text: 沿用前一相的同一份動作清單
    correct: false
    why_wrong: 教材明確寫出這一相的動作會比前一相更具運動專項性，動作清單原封不動等於沒有反映相位的推進。
- id: ch21.competition-period.i05.q1
  item: ch21.competition-period.i05
  dco: pa1.E.1
  lang: zh
  cognitive: application
  stem: 教練要在關鍵賽事前一至二週為運動員安排巔峰調整，下列哪一阻力訓練處方最符合此階段的設計？
  locator: Periodization Periods > Competitive Period
  options:
  - text: 漸進強度並搭配極低訓練量
    correct: true
  - text: 維持固定強度並搭配中訓練量
    correct: false
    why_wrong: 維持計畫的處方目標是長賽季持續保有肌力與爆發力，非賽前把疲勞降到最低以產生超補償。
  - text: 大幅波動強度並搭配中等訓練量
    correct: false
    why_wrong: 把第一轉換期肌力／爆發力相的較高訓練量套到巔峰調整；巔峰調整必須採極低訓練量以避免加重疲勞。
- id: ch21.competition-period.i06.q1
  item: ch21.competition-period.i06
  dco: pa1.E.1
  lang: en
  cognitive: application
  stem: A strength coach is designing a maintenance program for a team sport that competes across several months. Which resistance training prescription best fits this phase?
  locator: Periodization Periods > Competitive Period
  options:
  - text: 85–93% 1RM, about 2–5 sets of 3–6 reps per exercise
    correct: true
  - text: 50–75% 1RM, 3–6 sets of 8–20 reps per exercise
    correct: false
    why_wrong: Reader treats this as a hypertrophy block; that load and rep range belongs to the hypertrophy/strength endurance phase of the preparatory period, not a team-sport maintenance phase that must preserve strength and power across many fixtures.
  - text: 50% to at least 93% 1RM, 1–3 sets of 1–3 reps per exercise
    correct: false
    why_wrong: Reader applies the peaking prescription to a months-long season; the extremely low volume here cannot sustain strength and power when competitions occur every week.
- id: ch21.fitness-fatigue.i04.q1
  item: ch21.fitness-fatigue.i04
  dco: pa1.G.4
  lang: zh
  cognitive: analysis
  stem: 教練在長賽季中以中週期區塊管理準備狀態，想利用「疲勞消散速率」這個特性提高關鍵賽前的表現，最符合此企圖的做法為何？
  locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  options:
  - text: 賽前把負荷退下來，讓疲勞先散而適能留著
    correct: true
  - text: 賽前持續堆高訓練量，把最大適能逼出來
    correct: false
    why_wrong: 讀者以為工作負荷愈多適能就愈多；疲勞消散得比適能快，賽前繼續加重只會把更多疲勞留到比賽當天。
  - text: 賽前停掉阻力訓練，把疲勞降到最低
    correct: false
    why_wrong: 把恢復誤讀成歸零；停訓會連同辛苦累積的適能一起流失，準備狀態照樣偏低，也不是本章典範所說的漸減訓練。
- id: ch21.fitness-fatigue.i02.q1
  item: ch21.fitness-fatigue.i02
  dco: pa1.G.4
  lang: en
  cognitive: analysis
  stem: A coach pushes the highest training load of the mesocycle in the week before a key competition. According to the fitness–fatigue paradigm, what is the most likely immediate effect on the athlete's preparedness?
  locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  options:
  - text: Preparedness decreases because accumulated fatigue outweighs the new fitness gain
    correct: true
  - text: Preparedness increases sharply because the heavy load maximizes fitness
    correct: false
    why_wrong: Reader values fitness alone and ignores fatigue; in this paradigm both contribute, and the high load also loads fatigue heavily right before competition.
  - text: Preparedness is unchanged because fitness and fatigue cancel each other exactly
    correct: false
    why_wrong: Reader treats the paradigm as an algebraic identity; the textbook only states that fatigue dissipates faster than fitness, not that the two offset perfectly at peak load.
- id: ch21.gas-theory.i03.q1
  item: ch21.gas-theory.i03
  dco: pa1.I.2
  lang: zh
  cognitive: analysis
  stem: 一名運動員在長期高壓訓練下開始出現與警覺期相同的痠痛、僵硬與表現下滑，最可能落在 GAS 的哪一期？
  locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  options:
  - text: 耗竭期
    correct: true
  - text: 警覺期
    correct: false
    why_wrong: 警覺期是剛接觸新刺激時的短暫反應，不是長期壓力累積後的結果；題幹描述的是無法再繼續適應的階段。
  - text: 抵抗期
    correct: false
    why_wrong: 抵抗期是身體回到正常功能甚至超補償的階段，不會以警覺期症狀重新出現為特徵。
- id: ch21.gas-theory.i02.q1
  item: ch21.gas-theory.i02
  dco: pa1.I.2
  lang: en
  cognitive: analysis
  stem: According to the General Adaptation Syndrome, under which circumstance is supercompensation most likely to occur during the resistance stage?
  locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  options:
  - text: When training stress is appropriate and not excessive
    correct: true
  - text: When training stress is increased continuously without variation
    correct: false
    why_wrong: Reader assumes that more stress always produces more adaptation; the textbook ties supercompensation to stress that is appropriate and not excessive.
  - text: When the athlete is pushed into the exhaustion stage
    correct: false
    why_wrong: Reader conflates overreaching with supercompensation; exhaustion is the failure-to-adapt stage, not the condition that produces performance gains.
- id: ch21.periodization-hierarchy.i04.q1
  item: ch21.periodization-hierarchy.i04
  dco: pa1.I.2
  lang: zh
  cognitive: recall
  stem: 依週期化層級，中週期（mesocycle）最典型的持續時間為何？
  locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  options:
  - text: 二至六週，最常見為四週
    correct: true
  - text: 從數天到二週，最常見一週
    correct: false
    why_wrong: 這是小週期的典型時程；中週期的尺度比小週期更長，不能混用。
  - text: 十二至十六週以上
    correct: false
    why_wrong: 這是教材談長競賽季的尺度，屬於競賽期或大週期層次，非中週期範圍。
- id: ch21.sfra-theory.i01.q1
  item: ch21.sfra-theory.i01
  dco: pa1.I.2
  lang: zh
  cognitive: analysis
  stem: 教練把一名運動員單節的訓練工作量提高一倍以上，下列何者最能反映 SFRA 理論對此安排的預期？
  locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  options:
  - text: 累積疲勞會更多，從刺激中完全恢復並完成適應所需的時間也會拉長
    correct: true
  - text: 累積疲勞會更多，但完全恢復與適應的時間會明顯縮短
    correct: false
    why_wrong: 把疲勞與恢復時間的關係反過來；工作負荷愈大，疲勞消散與適應所需的時間愈長，並非縮短。
  - text: 累積疲勞與恢復時間都不會改變，因為只改變一節課的工作量
    correct: false
    why_wrong: 認為節次層級的工作量無法影響整體疲勞；SFRA 理論明示每一次接觸的訓練都會進入疲勞與恢復的合計。
- id: ch21.active-rest.i06.q1
  item: ch21.active-rest.i06
  dco: pa1.G.4
  lang: zh
  cognitive: application
  stem: 一名田徑選手在賽季結束後進入主動休息期，若此期被刻意拉長至八週以上，最可能的後果為何？
  locator: Applying Sport Seasons to the Periodization Periods > Postseason
  options:
  - text: 賽後期愈長，運動員去訓練的機會愈高，後續備賽期需更長才能重建表現
    correct: true
  - text: 主動休息愈長愈有助於肌力與爆發力累積，不需延長備賽期
    correct: false
    why_wrong: 把恢復誤當成訓練效果來源；主動休息期的低負荷無法累積肌力，過長反而侵蝕已建立的表現。
  - text: 八週主動休息已超過建議上限，必須立刻完全停止所有體能活動
    correct: false
    why_wrong: 把主動休息誤讀為「完全停止」；本書主動休息本來就允許低強度休閒活動，題幹描述的是拉長後果而非活動禁令。
- id: ch21.preparatory-period.i01.q1
  item: ch21.preparatory-period.i01
  dco: pa1.I.2
  lang: en
  cognitive: application
  stem: A collegiate sprinter has just finished the competitive season and begins a block with no scheduled competitions. Which periodization phase best matches this situation?
  locator: Periodization Periods > Preparatory Period
  options:
  - text: Preparatory period, with a central goal of building physical capacity to tolerate later high-intensity work
    correct: true
  - text: Competitive period, with the goal of peaking performance for upcoming competitions
    correct: false
    why_wrong: Reader places the athlete in-season despite the absence of competitions; the textbook links the competitive period to the time when competition is being prepared for, not to a competition-free block.
  - text: Second transition period, focused on rehabilitating injuries and psychological reset before the next plan
    correct: false
    why_wrong: Reader treats any off-competition block as active rest; the second transition period is the brief active-rest window after the season, not the longer block described in the stem.
- id: ch21.active-rest.i01.q1
  item: ch21.active-rest.i01
  dco: pa1.I.2
  lang: zh
  cognitive: application
  stem: 一名大學美式足球運動員結束長達四個月的賽季，教練想在新的年度訓練計畫啟動前安排一段緩衝期，最適合安排的是哪一個訓練期？
  locator: Periodization Periods > Second Transition Period (Active Rest)
  options:
  - text: 主動休息期
    correct: true
  - text: 第一轉換期
    correct: false
    why_wrong: 把銜接備賽期與競賽期的時段誤放在賽季之後；它是季前用來把肌力轉為爆發力的橋段，不是賽後緩衝。
  - text: 一般備賽相
    correct: false
    why_wrong: 把建立體能基礎的時段誤當作賽後過渡；一般備賽相已屬於新年度計畫的內容，不能替代賽後的恢復階段。
- id: ch21.active-rest.i03.q1
  item: ch21.active-rest.i03
  dco: pa1.G.4
  lang: zh
  cognitive: application
  stem: 一名短跑選手在主動休息期仍想維持一些活動量，下列哪一項安排最符合教材對主動休息期活動的原則？
  locator: Periodization Periods > Second Transition Period (Active Rest)
  options:
  - text: 低強度的休閒游泳與球拍運動
    correct: true
  - text: 專項短跑的衝刺反覆跑
    correct: false
    why_wrong: 將正式訓練的強度與專項性搬進主動休息期；活動目的在恢復，不是維持正式訓練課表的刺激量。
  - text: 高訓練量的大重量阻力訓練
    correct: false
    why_wrong: 把備賽期的訓練量與負荷直接複製到主動休息期；此期阻力訓練應採極低負荷與極低訓練量，且非專項。
- id: ch21.fitness-fatigue.i06.q1
  item: ch21.fitness-fatigue.i06
  dco: pa1.I.1
  lang: en
  cognitive: application
  stem: When explaining the fitness–fatigue paradigm to a coaching staff, which statement best reflects how training factors actually behave according to the textbook?
  locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  options:
  - text: each factor likely produces its own fitness, fatigue, and preparedness curve
    correct: true
  - text: a single universal curve fully explains every training factor's response
    correct: false
    why_wrong: Overstating the textbook's classic figure; the text says individual factors probably generate their own response curves, not a single universal one.
  - text: fatigue always disappears faster than fitness for every athlete tested
    correct: false
    why_wrong: Treating a general tendency as an absolute rule; the textbook notes fatigue dissipates faster than fitness, but does not promise this for every case.
- id: ch21.gas-theory.i05.q1
  item: ch21.gas-theory.i05
  dco: pa1.I.1
  lang: zh
  cognitive: analysis
  stem: 一名教練想在每週固定時點套用 GAS 圖示安排下一次刺激，書中對此作法最直接的提醒為何？
  locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  options:
  - text: GAS 圖示的曲線斜率與時程高度個別化
    correct: true
  - text: GAS 圖示已提供每位運動員通用的刺激時點
    correct: false
    why_wrong: 把圖形當成可直接套用的時程表；書中明示圖的尺度高度個別化，沒有通用刺激時點。
  - text: GAS 圖示只能用在阻力訓練
    correct: false
    why_wrong: 把 GAS 的應用範圍縮窄到單一訓練類型；書中將 GAS 視為週期化的一般基礎概念，適用範圍不限於阻力訓練。
- id: ch21.periodization-hierarchy.i07.q1
  item: ch21.periodization-hierarchy.i07
  dco: pa1.G.3
  lang: en
  cognitive: application
  stem: A strength and conditioning specialist is deciding how to split a single training session for a collegiate athlete. According to the periodization hierarchy, when does one training session most clearly become multiple sessions?
  locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  options:
  - text: when rest between training segments exceeds 30 minutes
    correct: true
  - text: whenever any rest period exceeds 5 minutes between sets
    correct: false
    why_wrong: Lowering the textbook's threshold to a casual rest interval; the table specifies a 30-minute break to mark a new training session.
  - text: only when the athlete leaves the training facility
    correct: false
    why_wrong: Confusing logistics with the textbook's operational definition; the cutoff is the length of the rest interval, not leaving the gym.
- id: ch21.periodization-hierarchy.i08.q1
  item: ch21.periodization-hierarchy.i08
  dco: pa1.I.2
  lang: zh
  cognitive: analysis
  stem: 體能訓練專業人員在多年計畫、年度計畫、大週期到小週期的規劃中，訓練安排的具體程度應如何變化才是最合乎教材的設計邏輯？
  locator: Periodization Hierarchy
  options:
  - text: 由廣至細，逐步具體
    correct: true
  - text: 每個層級具體程度相同
    correct: false
    why_wrong: 抹平週期化層級間的細節差異；層級愈往下愈要落實到動作與組次，無法維持同一抽象度。
  - text: 小週期只負責設定全局目標
    correct: false
    why_wrong: 反轉層級的分工；全局目標應在多年或年度層級設定，小週期負責細部安排。
- id: ch21.periodization-models.i03.q1
  item: ch21.periodization-models.i03
  dco: pa1.I.1
  lang: zh
  cognitive: application
  stem: 傳統週期化模型以四組六次為例，一週內調整負荷依序為 85%、75%、65% 1RM，此安排的訓練量負荷最主要的結果為何？
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: 即使組數與反覆次數固定，工作負荷仍會波動
    correct: true
  - text: 負荷雖然逐日改變，工作負荷總量不受影響
    correct: false
    why_wrong: 書中明示即使反覆次數不變，負荷改變仍會讓訓練量負荷跟著變，工作負荷不可能完全不受影響。
  - text: 重日的訓練量與強度會同步往上疊加
    correct: false
    why_wrong: 把重日錯讀成又變重又變多；這個例子的組數與次數是固定的，重日只是負荷提高，訓練量負荷才隨之上升。
- id: ch21.periodization-models.i06.q1
  item: ch21.periodization-models.i06
  dco: pa1.I.1
  lang: zh
  cognitive: analysis
  stem: 傳統模型支持者指出每日波動模型的高訓練量節次會帶來額外疲勞，依教材所述這裡指的最主要是哪一類疲勞？
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: 周邊疲勞與代謝疲勞
    correct: true
  - text: 中樞神經系統的疲勞
    correct: false
    why_wrong: 神經疲勞是支持者用來批評傳統模型長期漸增強度的說法，方向剛好相反，不是他們對每日波動模型提出的指控。
  - text: 心理層面的動機疲勞
    correct: false
    why_wrong: 教材這一段談的是生理性的疲勞來源，沒有把動機低落或心理倦怠列為每日波動模型的疲勞型態。
- id: ch21.sfra-theory.i02.q1
  item: ch21.sfra-theory.i02
  dco: pa1.G.2
  lang: en
  cognitive: analysis
  stem: Which statement best reflects how the stimulus-fatigue-recovery-adaptation theory treats full recovery before an athlete begins a new training bout or session?
  locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  options:
  - text: complete recovery is not required before each new bout
    correct: true
  - text: always required before any new training stimulus
    correct: false
    why_wrong: Treating complete recovery as a strict prerequisite; the textbook explicitly allows starting a new bout without full recovery when manipulating heavy and light sessions.
  - text: only required during the competitive period of training
    correct: false
    why_wrong: Limiting the no-full-recovery allowance to a single phase; the theory applies across the periodization structure, not just the competitive period.
- id: ch21.sfra-theory.i04.q1
  item: ch21.sfra-theory.i04
  dco: pa1.G.2
  lang: zh
  cognitive: application
  stem: 體能訓練專業人員希望在運動員尚未完全恢復的情況下仍維持適能，同時把疲勞控制住，依 SFRA 理論最直接的操作手段為何？
  locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  options:
  - text: 用輕重交替的訓練日管理負荷起伏
    correct: true
  - text: 每天都套用同一組工作負荷數字
    correct: false
    why_wrong: 抹掉輕重訓練日之間的落差；沒有負荷起伏，就沒有可以用來調節疲勞與恢復反應的槓桿。
  - text: 一週全由高訓練量節次組成
    correct: false
    why_wrong: 把調節疲勞的機制反過來用；連續的高訓練量節次只會讓周邊與代謝疲勞不斷疊高，恢復反而更慢。
- id: ch21.competition-period.i04.q1
  item: ch21.competition-period.i04
  dco: pa1.I.2
  lang: zh
  cognitive: analysis
  stem: 一位田徑短跑選手進入長達十四週的競賽期，教練正在調整訓練量與強度這兩個變項，根據教材對競賽期訓練平衡的描述，最主要應避免的做法為何？
  locator: Periodization Periods > Competitive Period
  options:
  - text: 兩者一起壓得太低而流失適能
    correct: true
  - text: 持續推高強度以再榨出爆發力
    correct: false
    why_wrong: 競賽期要的是平衡而不是一味加壓；選手已臨近賽事，再往上加只會讓疲勞蓋過適能的貢獻，準備狀態反而下滑。
  - text: 凍結訓練量以免流失專項體能
    correct: false
    why_wrong: 這個選擇忽略競賽期要依賽程調節整體負荷；把量固定住並不能處理一路累積下來的疲勞。
- id: ch21.competition-period.i07.q1
  item: ch21.competition-period.i07
  dco: pa1.I.2
  lang: zh
  cognitive: application
  stem: 某大學美式足球隊進入競賽期後，阻力訓練課的可用時段明顯縮短，根據教材的說明，最主要應優先調整的安排為何？
  locator: Periodization Periods > Competitive Period
  options:
  - text: 縮短阻力訓練時間以容納更多戰術練習
    correct: true
  - text: 增加阻力訓練組數以維持肌力水準
    correct: false
    why_wrong: 這是反向操作；競賽期專項練習增加時，阻力訓練時間會被壓縮，盲目加組無法解決時間不足。
  - text: 取消所有戰術練習以保留完整體能課
    correct: false
    why_wrong: 競賽期戰術練習本身不可犧牲；此選擇違反賽季實際需求，會使準備狀態失衡。
- id: ch21.fitness-fatigue.i03.q1
  item: ch21.fitness-fatigue.i03
  dco: pa1.I.1
  lang: zh
  cognitive: analysis
  stem: 教練把一名選手的訓練工作負荷降得非常低，期望藉此提升準備狀態，根據適能—疲勞典範，這項安排最主要的問題為何？
  locator: Central Concepts Related to Periodization > Fitness–Fatigue Paradigm
  options:
  - text: 適能與疲勞同步降低而仍偏低
    correct: true
  - text: 疲勞消散過快使適能來不及累積
    correct: false
    why_wrong: 教材只說疲勞比適能消散較快，並未說消散過快會妨礙適能累積；此選項自創因果關係。
  - text: 低工作負荷會引發過度訓練反應
    correct: false
    why_wrong: 過度訓練來自過高負荷而非過低負荷；此選擇把典範中的現象反過來描述。
- id: ch21.gas-theory.i01.q1
  item: ch21.gas-theory.i01
  dco: pa1.I.1
  lang: en
  cognitive: application
  stem: A novice lifter begins a new program and during the first sessions reports soreness, stiffness, and a drop in performance. According to GAS, which phase best describes this response?
  locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  options:
  - text: Alarm phase
    correct: true
  - text: Resistance phase
    correct: false
    why_wrong: The resistance phase reflects adaptation returning function toward or above baseline, not the initial fatigue, soreness, and performance drop described in the stem.
  - text: Exhaustion phase
    correct: false
    why_wrong: The exhaustion phase requires prolonged excessive stress and is associated with chronic overload signs; a few early sessions in a novice do not meet that condition.
- id: ch21.gas-theory.i04.q1
  item: ch21.gas-theory.i04
  dco: pa1.I.1
  lang: zh
  cognitive: recall
  stem: 教材中將超補償明確定義為何種訓練結果？
  locator: Central Concepts Related to Periodization > The General Adaptation Syndrome
  options:
  - text: 抵抗期適應使表現再提升
    correct: true
  - text: 警覺期結束後疲勞完全消散
    correct: false
    why_wrong: 疲勞消散本身並非超補償；超補償要求訓練安排適當且未過量，使表現能力進一步提高。
  - text: 耗竭期前的表現能力下降
    correct: false
    why_wrong: 耗竭期表現能力下降是過度負荷反應，方向與超補償相反，與定義不符。
- id: ch21.periodization-hierarchy.i02.q1
  item: ch21.periodization-hierarchy.i02
  dco: pa1.I.2
  lang: zh
  cognitive: application
  stem: 一位教練正在為單一賽季的運動編排年度訓練計畫，根據週期化層級，最適合用何種結構來組織這個年度計畫？
  locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  options:
  - text: 視為一個大週期並細分備賽與競賽期
    correct: true
  - text: 同時容納兩個獨立的大週期以涵蓋雙賽季
    correct: false
    why_wrong: 教材指出雙賽季才需要分為兩個大週期；單一賽季運動並無此需求，屬過度分割。
  - text: 直接拆成多個小週期而不另設中、大週期
    correct: false
    why_wrong: 小週期需在大週期之內規劃；跳過大、中週期會喪失整體目標與階段邏輯。
- id: ch21.periodization-hierarchy.i06.q1
  item: ch21.periodization-hierarchy.i06
  dco: pa1.G.3
  lang: en
  cognitive: application
  stem: A coach schedules two training sessions on the same day separated by a 45-minute rest between blocks. According to the periodization hierarchy, how should this day most appropriately be classified?
  locator: Periodization Hierarchy > Table 21.1 Periodization Cycles
  options:
  - text: One training day containing multiple training sessions
    correct: true
  - text: Two separate training days back to back
    correct: false
    why_wrong: A training day is defined as a single calendar day; splitting by calendar date, not by rest length, would be needed to call this two days.
  - text: A single training session spanning the entire day
    correct: false
    why_wrong: The hierarchy defines a threshold of more than thirty minutes between blocks as separating training sessions; a 45-minute gap exceeds that threshold.
- id: ch21.periodization-models.i01.q1
  item: ch21.periodization-models.i01
  dco: pa1.I.1
  lang: zh
  cognitive: analysis
  stem: 當代文獻常把傳統阻力訓練週期化稱為線性週期化，教材認為這個標籤並不精確，其最主要的理由為何？
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: 小、中週期皆有非線性負荷變化
    correct: true
  - text: 完全沒有任何形式的強度安排
    correct: false
    why_wrong: 傳統模型仍有強度安排，只是否定其為純線性；此選項把模型描寫成沒有結構，與教材不符。
  - text: 只允許訓練量隨時間線性增加
    correct: false
    why_wrong: 教材要反駁的正是這種線性標籤，而非強化它；此選項把被批判的誤稱當作事實。
- id: ch21.periodization-models.i04.q1
  item: ch21.periodization-models.i04
  dco: pa1.I.1
  lang: zh
  cognitive: application
  stem: 某選手採用傳統週期化已進入第十二週，強度持續上升但訓練量緩降，教練擔心神經疲勞累積，根據每日波動模型支持者的論點，最主要應採取的調整為何？
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: 改用每日波動以分散每日負荷與焦點
    correct: true
  - text: 完全停止阻力訓練改採純有氧訓練
    correct: false
    why_wrong: 轉換訓練模式並非每日波動模型支持者的主張；此選擇失去肌力刺激，與目標相反。
  - text: 維持傳統模型但刪除所有減量日
    correct: false
    why_wrong: 教材原文批評的重點正是長期持續提高強度會累積神經疲勞；刪除減量日會惡化這個問題。
- id: ch21.preparatory-period.i02.q1
  item: ch21.preparatory-period.i02
  dco: pa1.I.2
  lang: zh
  cognitive: analysis
  stem: 一般備賽相在訓練量、強度與手段多樣性上的搭配，最貼近下列哪一組描述？
  locator: Periodization Periods > Preparatory Period
  options:
  - text: 高訓練量、低強度與多樣化訓練手段
    correct: true
  - text: 低訓練量、高強度與專項化爆發力動作
    correct: false
    why_wrong: 高強度、低量與高度專項是特殊備賽相以後的特徵；一般備賽相的訓練量高且手段多樣，並非如此。
  - text: 中等訓練量配合長時間高強度間歇
    correct: false
    why_wrong: 教材沒有把高強度間歇列為一般備賽相的代表；此相的強度屬低至中，且手段不只限於間歇。
- id: ch21.sfra-theory.i03.q1
  item: ch21.sfra-theory.i03
  dco: pa1.I.1
  lang: en
  cognitive: analysis
  stem: According to the stimulus–fatigue–recovery–adaptation theory, what is the most likely outcome when an athlete experiences no new training stimulus for an extended period?
  locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  options:
  - text: Detraining with performance dropping below the current baseline
    correct: true
  - text: Continued supercompensation above baseline indefinitely
    correct: false
    why_wrong: Supercompensation requires recovery from a new stimulus; without a new stimulus, fitness effects decay rather than persist indefinitely above baseline.
  - text: Stable preparedness because fatigue has fully dissipated
    correct: false
    why_wrong: Removing the stimulus also removes the fitness aftereffect; preparedness falls rather than holding steady simply because fatigue is gone.
- id: ch21.sfra-theory.i05.q1
  item: ch21.sfra-theory.i05
  dco: pa1.I.1
  lang: zh
  cognitive: application
  stem: 教練正在規劃一名進階運動員的阻力訓練週期化，根據 SFRA 理論在週期化各層級出現的描述，最主要的操作啟示為何？
  locator: Central Concepts Related to Periodization > Stimulus-Fatigue-Recovery-Adaptation Theory
  options:
  - text: 從訓練節次到週期皆可調節負荷與恢復
    correct: true
  - text: 只在中週期層級調整負荷即可
    correct: false
    why_wrong: 教材明示此模式從節次、日到週期皆出現；只動中週期會忽略其他層級的疲勞與恢復管理。
  - text: 必須每次訓練前完全恢復才能進展
    correct: false
    why_wrong: SFRA 明確指出不一定需要完全恢復才開始下一節次；此選擇把恢復條件絕對化。
- id: ch21.fitness-fatigue.i08.q1
  item: ch21.fitness-fatigue.i08
  dco: pa1.I.1
  lang: en
  cognitive: analysis
  stem: According to the textbook, which combination of concerns is most often raised by some authors regarding daily undulating periodization for highly trained athletes?
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: Accumulated fatigue, possible overtraining potential, and added injury risk with sport-specific work
    correct: true
  - text: Insufficient variety in training stress and limited transfer to sport-specific qualities
    correct: false
    why_wrong: The textbook critique of DUP emphasizes too much variation and fatigue, not too little variety; this option describes the opposite concern.
  - text: Loss of general fitness because resistance training volume is always minimized
    correct: false
    why_wrong: DUP uses high-volume sessions on some days; the concern is excess fatigue and injury risk, not a systematic loss of general fitness.
- id: ch21.periodization-models.i07.q1
  item: ch21.periodization-models.i07
  dco: pa1.I.1
  lang: en
  cognitive: analysis
  stem: What is the textbook's summary of the research evidence most relevant to choosing between daily undulating and traditional periodization models?
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: Mixed evidence - some favor undulating, some find no difference, some favor traditional
    correct: true
  - text: Undulating is consistently superior across all training outcomes and populations
    correct: false
    why_wrong: The textbook explicitly notes conflicting evidence; a universal superiority claim contradicts the cited mixed findings.
  - text: Traditional is always better because it builds linear strength progressions
    correct: false
    why_wrong: The textbook also rejects the linear label for traditional models and does not claim universal superiority; this option overstates the case.
- id: ch21.competition-period.i05.q2
  item: ch21.competition-period.i05
  dco: pa1.E.1
  lang: zh
  cognitive: analysis
  stem: 教練想延長巔峰調整計畫至三週以上以維持更多肌力，根據教材對巔峰計畫時程與後效的描述，最主要的風險為何？
  locator: Periodization Periods > Competitive Period
  options:
  - text: 適能最終會下降，表現能力可能連帶下滑
    correct: true
  - text: 巔峰強度上限會持續突破而無上限
    correct: false
    why_wrong: 教材明示巔峰強度有一個至少 93% 1RM 的範圍上限，並沒有「無上限突破」的生理機制。
  - text: 訓練量愈低愈能延長巔峰並避免任何疲勞
    correct: false
    why_wrong: 訓練量再低仍會累積疲勞；教材指出延長巔峰最終仍因適能流失或過度訓練而表現下降，並非零疲勞狀態。
- id: ch21.active-rest.i02.q2
  item: ch21.active-rest.i02
  dco: pa1.G.4
  lang: en
  cognitive: recall
  stem: How long does the textbook most commonly recommend the active rest period should last?
  locator: Periodization Periods > Second Transition Period (Active Rest)
  options:
  - text: one to four weeks
    correct: true
  - text: one to two weeks at most
    correct: false
    why_wrong: Caps the textbook's range too low; active rest can extend to four weeks when injury recovery or psychological reset requires it.
  - text: six to eight weeks
    correct: false
    why_wrong: Stretches active rest into the length of a preparatory block; going this long raises detraining risk and lengthens the rebuild phase.
- id: ch21.competition-period.i04.q2
  item: ch21.competition-period.i04
  dco: pa1.G.2
  lang: en
  cognitive: application
  pool: extra
  stem: A coach designs the final training week before a national championship and wants the athlete to arrive at peak readiness. Which plan best matches the textbook's guidance for balancing training variables during the competitive period?
  locator: Periodization Periods > Competitive Period
  options:
  - text: Raise intensity while lowering volume, retaining enough fitness and reducing accumulated fatigue.
    correct: true
  - text: Cut both intensity and volume sharply so the athlete rests fully before competition day.
    correct: false
    why_wrong: Slashes intensity along with volume, ignoring the textbook's warning that dropping intensity too far also erodes fitness and undermines competition readiness.
  - text: Keep volume high and only add intensity on top, maintaining the same overall workload.
    correct: false
    why_wrong: Preserves or piles on volume rather than lowering it, so accumulated fatigue is not shed and the athlete enters competition under-residual rather than refreshed.
- id: ch21.periodization-models.i05.q1
  item: ch21.periodization-models.i05
  dco: pa1.G.3
  lang: en
  cognitive: analysis
  pool: extra
  stem: When comparing daily undulating periodization with traditional periodization, which statement most accurately describes the primary difference in how daily training variables are manipulated within a microcycle?
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: Daily undulating periodization changes load, volume, and training focus across different days within the same microcycle.
    correct: true
  - text: Traditional periodization changes load, volume, and focus daily, while keeping weekly structure fixed across the mesocycle.
    correct: false
    why_wrong: Confuses the models by describing undulating characteristics as the traditional model's, since traditional periodization examples in the text keep daily sets and reps constant and mainly shift load.
  - text: Traditional periodization adds an extra tapering week at the end of every macrocycle, whereas undulating models never reduce volume.
    correct: false
    why_wrong: Invented detail not supported by the entry, since the text describes daily variable manipulation, not end-of-macrocycle tapering patterns unique to the traditional model.
- id: ch21.active-rest.i07.q1
  item: ch21.active-rest.i07
  dco: pa1.G.2
  lang: en
  cognitive: recall
  pool: extra
  stem: Why is a deload or unloading week scheduled within a macrocycle according to the textbook?
  locator: Periodization Periods > Second Transition Period (Active Rest)
  options:
  - text: To allow dissipation of cumulative fatigue and prepare the body for the next training phase.
    correct: true
  - text: To cause complete detraining and measurable loss of muscle mass.
    correct: false
    why_wrong: The chapter frames unloading as a planned recovery tool that keeps training adaptations intact, not as a deliberate cause of detraining or muscle loss.
  - text: To increase acute injury risk by pushing systemic stress past the recovery threshold.
    correct: false
    why_wrong: An unloading week is positioned as a way to manage fatigue precisely so that accumulated stress does not push the athlete toward overtraining or injury.
- id: ch21.active-rest.i04.q1
  item: ch21.active-rest.i04
  dco: pa1.I.1
  lang: en
  cognitive: recall
  pool: extra
  stem: What is the primary goal of the transition period, also called active rest, that follows the competitive season in an annual training program?
  locator: Periodization Periods > Second Transition Period (Active Rest)
  options:
  - text: Unloading the athlete physically and mentally so prior injuries heal before the next annual plan begins
    correct: true
  - text: Maximizing strength and power through the heaviest training loads the athlete faces all year
    correct: false
    why_wrong: The athlete is coming off a long competitive season, so piling on the heaviest loads of the year ignores the period's restorative purpose.
  - text: Eliminating all physical activity for several months to ensure full passive recovery before training resumes
    correct: false
    why_wrong: The transition period is termed active rest, meaning training does not stop entirely but shifts toward lighter, regenerative work.
- id: ch21.periodization-models.i02.q2
  item: ch21.periodization-models.i02
  dco: pa1.G.3
  lang: en
  cognitive: recall
  pool: extra
  stem: Which feature best characterizes a daily undulating periodization program within a microcycle?
  locator: Undulating Versus Linear Periodization Models
  options:
  - text: Large daily shifts in load, volume, and focus such as alternating 6 RM, 10 RM, and 3 RM sessions
    correct: true
  - text: A steady linear progression of intensity across the 52-week macrocycle with small weekly changes
    correct: false
    why_wrong: Coaches familiar with traditional linear periodization may select this because it mirrors the progressive overload they already use across a macrocycle.
  - text: Identical sets and reps on every training day, with only the absolute load creeping upward over time
    correct: false
    why_wrong: This describes the traditional model's daily pattern, so choosing it reflects applying the linear framework to a model that explicitly varies volume and focus each day.
