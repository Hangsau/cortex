meta:
  chapter: ch11
  source: data/cscs/ch11.yaml
questions:
- id: ch11.anabolic-steroids.i01.q1
  item: ch11.anabolic-steroids.i01
  dco: sf3.B.2
  lang: zh
  cognitive: recall
  stem: 教材中「合成代謝類固醇」一詞所指的人工合成衍生物，其母體激素為何？
  locator: Hormones > Anabolic Steroids
  options:
  - text: 男性激素睾固酮
    correct: true
  - text: 雌激素雌二醇
    correct: false
    why_wrong: 把雌激素當成合成代謝類固醇的母體；教材明確指出該衍生物源於男性性激素睾固酮，雌二醇反而是其下游芳香化產物。
  - text: 壓力荷爾蒙皮質醇
    correct: false
    why_wrong: 把壓力荷爾蒙誤認為合成代謝類固醇的化學前體；教材將皮質醇歸為分解代謝類激素，與本條所述的合成衍生物不同族。
- id: ch11.anabolic-steroids.i02.q1
  item: ch11.anabolic-steroids.i02
  dco: sf3.B.2
  lang: zh
  cognitive: application
  stem: 一份研究回顧指出類固醇使用者「堆疊」的平均模式最接近下列哪一組數字？
  locator: Hormones > Anabolic Steroids > Dosing
  options:
  - text: 同用約 3 種藥物、週期 5 至 10 週
    correct: true
  - text: 同用約 7 種藥物、週期 12 至 16 週
    correct: false
    why_wrong: 把典型用藥模式擴大成更大量；教材引用的研究是 3.1 種藥物、5–10 週，題幹說的是典型而非最大量。
  - text: 同用約 1 種藥物、週期 2 至 3 週
    correct: false
    why_wrong: 把堆疊模式簡化為單一藥物短週期；堆疊的核心就是同時使用數種藥物，教材未把單藥短週期描述為典型。
- id: ch11.anabolic-steroids.i03.q1
  item: ch11.anabolic-steroids.i03
  dco: sf3.B.2
  lang: zh
  cognitive: recall
  stem: 教材所述「金字塔式（step-up）」用藥模式，最能描述下列哪一種劑量變化？
  locator: Hormones > Anabolic Steroids > Dosing
  options:
  - text: 數週內逐週提高劑量
    correct: true
  - text: 起始即為全程最高劑量
    correct: false
    why_wrong: 把用藥模式描述為固定高劑；教材說的是週期內逐週加量再到期末減量的階梯式變化。
  - text: 每週隨機升降劑量
    correct: false
    why_wrong: 將模式寫成無規律波動；教材所述是為了降低副作用而刻意安排的金字塔，不是隨機變動。
- id: ch11.anabolic-steroids.i04.q1
  item: ch11.anabolic-steroids.i04
  dco: sf3.B.2
  lang: en
  cognitive: application
  stem: In experienced resistance-trained athletes using supraphysiologic doses, by approximately what factor does strength gain most likely exceed that of similar non-using athletes?
  locator: Hormones > Anabolic Steroids > Efficacy > Athletic Performance
  options:
  - text: about 2 to 3 times larger on average
    correct: true
  - text: about the same as matched non-users
    correct: false
    why_wrong: applies a near-null effect to supraphysiologic dosing in trained athletes; the textbook specifically reports a 2–3 fold gain beyond matched non-users.
  - text: more than an order of magnitude higher
    correct: false
    why_wrong: inflates the magnitude beyond any textbook estimate; the largest contrast cited is 2–3 times for trained lifters, not an order of magnitude.
- id: ch11.anabolic-steroids.i05.q1
  item: ch11.anabolic-steroids.i05
  dco: sf3.B.2
  lang: zh
  cognitive: recall
  stem: 教材引述的研究中，接近多少比例的合成代謝類固醇使用者回報出現易怒與攻擊性增加？
  locator: Hormones > Anabolic Steroids > Psychological Effects
  options:
  - text: 約六成
    correct: true
  - text: 低於一成
    correct: false
    why_wrong: 把教材所述的「接近 60%」縮小為少數；教材原文寫的是近六成使用者有此現象。
  - text: 接近全部
    correct: false
    why_wrong: 把有回報的子集放大為全員；教材強調因果尚未確認，且心理效應並非每位使用者都一致出現。
- id: ch11.anabolic-steroids.i06.q1
  item: ch11.anabolic-steroids.i06
  dco: sf3.B.2
  lang: zh
  cognitive: application
  stem: 教材表列合成代謝類固醇濫用的心血管不良反應時，下列何者最被明確指出？
  locator: Hormones > Anabolic Steroids > Adverse Effects
  options:
  - text: HDL 下降
    correct: true
  - text: 肺活量上升
    correct: false
    why_wrong: 把心血管反應寫成呼吸功能的正向改變；教材表列的是血脂與血壓等負向反應，沒有把肺活量當作不良反應。
  - text: 心肌再生加速
    correct: false
    why_wrong: 把心肌功能寫成加速再生；教材明確指出心肌功能下降是濫用的負向結果。
- id: ch11.anabolic-steroids.i08.q1
  item: ch11.anabolic-steroids.i08
  dco: sf3.B.2
  lang: en
  cognitive: recall
  stem: Under the federal statute described in the textbook, anabolic steroids are designated as which class of controlled substance?
  locator: Types of Performance-Enhancing Substances > Major Sport Organizations’ Lists of Banned Substances
  options:
  - text: Class III
    correct: true
  - text: Class II
    correct: false
    why_wrong: Places anabolic steroids one tier stricter than the textbook does; that tier covers drugs with higher abuse potential such as major narcotics.
  - text: Class V
    correct: false
    why_wrong: Places the substance in the least restrictive federal tier, which covers preparations with limited narcotic content rather than anabolic steroids.
- id: ch11.anabolic-supplements.i01.q1
  item: ch11.anabolic-supplements.i01
  dco: sf3.B.2
  lang: zh
  cognitive: recall
  stem: 教材指出，磷酸肌酸（CP）協助 ATP 再生的主要機制為何？
  locator: Dietary Supplements > Creatine > Importance of Creatine to Exercise
  options:
  - text: 肌酸激酶再磷酸化
    correct: true
  - text: 氧化葡萄糖直接生成
    correct: false
    why_wrong: 將有氧路徑當作 CP 供能的機制；CP 再生 ATP 是透過肌酸激酶的無氧磷酸化反應，並非葡萄糖氧化。
  - text: 粒線體氧化脂肪酸
    correct: false
    why_wrong: 把脂肪酸氧化誤植到 CP 機制；該路徑屬於長時間能量供應，與教材所述 CP 在高強度短時間內的角色無關。
- id: ch11.anabolic-supplements.i02.q1
  item: ch11.anabolic-supplements.i02
  dco: sf3.B.2
  lang: zh
  cognitive: application
  stem: 一位 70 公斤的運動員依體重執行肌酸的「負荷期」，依教材所述方案，每日攝取量最接近下列何者？
  locator: Dietary Supplements > Creatine > Creatine Supplementation
  options:
  - text: 21 g
    correct: true
  - text: 2.1 g
    correct: false
    why_wrong: 把每日維持量 0.03 g/kg 當成負荷期劑量；教材的負荷期是每日 0.3 g/kg，70 公斤者為 21 g。
  - text: 210 g
    correct: false
    why_wrong: 把 0.3 g/kg 的小數點右移成 3 g/kg；教材的負荷期上限是每日 20–25 g，不可能到三位數。
- id: ch11.anabolic-supplements.i03.q1
  item: ch11.anabolic-supplements.i03
  dco: sf3.B.2
  lang: en
  cognitive: application
  stem: For trained athletes supplementing with creatine across several weeks to months of training, how much extra body mass or fat-free mass is most likely gained?
  locator: Dietary Supplements > Creatine > Efficacy
  options:
  - text: 0.5 to 2 kg
    correct: true
  - text: 5 to 8 kg
    correct: false
    why_wrong: scales the reported gain up by roughly an order of magnitude; the textbook puts the typical extra body or fat-free mass at 0.5 to 2 kg over weeks to months.
  - text: 0.1 to 0.2 kg
    correct: false
    why_wrong: shrinks the gain to a fraction of the reported range; the textbook's figure is large enough to be attributed partly to intracellular water and partly to contractile protein.
- id: ch11.anabolic-supplements.i06.q1
  item: ch11.anabolic-supplements.i06
  dco: sf3.B.2
  lang: zh
  cognitive: analysis
  stem: 一位休閒訓練者想用 HMB 提升阻力訓練效果，依教材證據，下列建議最為合適？
  locator: Dietary Supplements > β-Hydroxy-β-Methylbutyrate > Efficacy
  options:
  - text: 未受訓短期最可能見效
    correct: true
  - text: 有經驗者必然顯著增肌
    correct: false
    why_wrong: 把受訓者的不確定效果當成必然；教材明示受訓者結果較不一致，必須配合高強度高訓練量才可能見效。
  - text: 不訓練也會增加肌量
    correct: false
    why_wrong: 把效果寫成與訓練刺激無關；HMB 的改善需在阻力訓練背景下出現，沒有訓練刺激單獨補充不會增肌。
- id: ch11.beta-agonists-stimulants.i07.q1
  item: ch11.beta-agonists-stimulants.i07
  dco: sf3.B.2
  lang: en
  cognitive: application
  stem: In the shooting-accuracy studies cited by the textbook comparing two oxprenolol doses, which dose produced the greatest shooting accuracy?
  locator: Hormones > β-Blockers > Efficacy
  options:
  - text: 80 mg
    correct: true
  - text: 20 mg
    correct: false
    why_wrong: selects a dose outside the cited comparison; the textbook contrasts 80 mg with 40 mg, not with 20 mg.
  - text: 40 mg
    correct: false
    why_wrong: chooses the lower of the two compared doses; the textbook reports 80 mg outperformed 40 mg in the cited shooter study.
- id: ch11.caffeine-energy-drinks.i02.q1
  item: ch11.caffeine-energy-drinks.i02
  dco: sf3.B.2
  lang: zh
  cognitive: application
  stem: 一位 70 公斤耐力運動員於賽前約 60 分鐘想攝取具增補效果的咖啡因，依教材建議，攝取量最接近下列何者（mg）？
  locator: Dietary Supplements > Stimulants > Caffeine > Efficacy
  options:
  - text: 350 mg
    correct: true
  - text: 210 mg
    correct: false
    why_wrong: 把 3–9 mg/kg 的下限再下修為 3 mg/kg；教材明示有效區間為 3–9 mg/kg 體重，70 公斤下應約 210–630 mg。
  - text: 630 mg
    correct: false
    why_wrong: 把有效劑量估成 9 mg/kg 上限附近；教材明示 ≥9 mg/kg 無額外效益且副作用風險上升，350 mg 才是中段建議量。
- id: ch11.epo-blood-doping.i05.q1
  item: ch11.epo-blood-doping.i05
  dco: sf3.B.2
  lang: en
  cognitive: analysis
  stem: A distance runner considering EPO use should be most concerned about which mechanism of serious risk described in the textbook?
  locator: Hormones > Erythropoietin > Adverse Effects
  options:
  - text: blood viscosity rise raising clot risk
    correct: true
  - text: permanent loss of bone mineral density
    correct: false
    why_wrong: introduces a skeletal outcome not described for EPO; the textbook focuses on hematologic and cardiovascular mechanisms, not bone mineral loss.
  - text: an immediate gain in visual acuity
    correct: false
    why_wrong: lists a positive sensory effect that contradicts the adverse-effects focus; the textbook frames EPO misuse around cardiovascular harm.
- id: ch11.insulin-hgh.i02.q1
  item: ch11.insulin-hgh.i02
  dco: sf3.B.2
  lang: zh
  cognitive: application
  stem: 一位原本健康的運動員考慮注射胰島素以增肌，依教材所述，最可能面臨的後果為何？
  locator: Hormones > Insulin > Adverse Effects
  options:
  - text: 可能死亡昏迷或成癮
    correct: true
  - text: 僅輕微可逆肌肉酸痛
    correct: false
    why_wrong: 把危險性低估為輕微可逆反應；教材明示健康者自行注射胰島素可能導致嚴重甚至致命的後果。
  - text: 自然反應自動保護安全
    correct: false
    why_wrong: 把生理反應的安全誤推給外源注射；教材強調自然反應安全並不能延伸到自行注射。
- id: ch11.muscle-buffering.i03.q1
  item: ch11.muscle-buffering.i03
  dco: sf3.B.2
  lang: en
  cognitive: application
  stem: According to the textbook, β-alanine is most likely to benefit which type of athletic effort?
  locator: Dietary Supplements > Nutritional Muscle Buffers > β-Alanine > Efficacy
  options:
  - text: repeated high-intensity efforts over 60 seconds
    correct: true
  - text: single maximal sprints under about 10 seconds
    correct: false
    why_wrong: Selects the briefest, lowest-acid category; the textbook identifies extreme intramuscular acidosis from sustained efforts over 60 seconds as the responsive condition.
  - text: steady low-intensity jogging for long periods
    correct: false
    why_wrong: Chooses a low-intensity, low-acidosis modality; the textbook states aerobic-power-type efforts are not where beta-alanine helps.
- id: ch11.muscle-buffering.i06.q1
  item: ch11.muscle-buffering.i06
  dco: sf3.B.2
  lang: zh
  cognitive: analysis
  stem: 一位經驗豐富的男性划船選手在 0.3 g/kg 碳酸氫鈉急性補充下完成 2,000 m 計時，依教材所述，最可能觀察到下列哪一種結果？
  locator: Dietary Supplements > Nutritional Muscle Buffers > Sodium Bicarbonate > Efficacy
  options:
  - text: 總時間未縮短末段卻改善
    correct: true
  - text: 全程時間均勻顯著縮短
    correct: false
    why_wrong: 將特定分段改善擴大成整體時間；教材明示 2,000 m 總時間無顯著差異，只有第 3 與最後 500 m 分段改善。
  - text: 所有分段皆無任何改變
    correct: false
    why_wrong: 把部分改善寫成完全無效；教材明示仍有分段改善，不能說全無改變。
- id: ch11.prohormones-hcg.i05.q1
  item: ch11.prohormones-hcg.i05
  dco: sf3.B.2
  lang: zh
  cognitive: application
  stem: 一名男性類固醇使用者在週期末嘗試以 HCG 恢復自身睾固酮生成，依教材所述，最可能的機制為何？
  locator: Hormones > HCG (Human Chorionic Gonadotropin) > Efficacy
  options:
  - text: 模擬 LH 作用
    correct: true
  - text: 直接分解肝醣
    correct: false
    why_wrong: 把激素機制誤寫成能量代謝；HCG 模擬 LH 作用於睪丸，並不涉及肝醣分解。
  - text: 結合胰島素受體
    correct: false
    why_wrong: 把受體專一性寫錯；HCG 與 LH 結構相近，作用對象不是胰島素受體。
- id: ch11.beta-agonists-stimulants.i08.q1
  item: ch11.beta-agonists-stimulants.i08
  dco: sf3.B.2
  lang: en
  cognitive: analysis
  stem: An endurance athlete is prescribed a beta-blocker for a cardiovascular condition; which performance effect described by the textbook should the strength and conditioning specialist most anticipate?
  locator: Hormones > β-Blockers > Adverse Effects
  options:
  - text: reduced maximal heart rate and VO2 over 10 km
    correct: true
  - text: elevated maximal heart rate at the same pace
    correct: false
    why_wrong: predicts a heart-rate rise opposite to the textbook; beta-blockade lowers maximal heart rate rather than raising it.
  - text: markedly improved Wingate peak power output
    correct: false
    why_wrong: borrows a positive anaerobic outcome from unrelated studies; the textbook lists ergolytic effects, not Wingate improvements, for beta-blockers.
- id: ch11.muscle-buffering.i04.q1
  item: ch11.muscle-buffering.i04
  dco: sf3.B.2
  lang: zh
  cognitive: analysis
  stem: 一位教練想把運動員的 β-丙胺酸每日量分成小劑次，依教材所述，最主要的考量為何？
  locator: Dietary Supplements > Nutritional Muscle Buffers > β-Alanine > Adverse Effects
  options:
  - text: 預防感覺異常發生
    correct: true
  - text: 突破肌肽合成上限
    correct: false
    why_wrong: 把分次策略誤認成可突破肌肽飽和；教材所述飽和是長期現象，分次並非為了突破上限。
  - text: 同時改善有氧功率
    correct: false
    why_wrong: 把分次目的與表現效益混為一談；教材明示分次是為了降低感覺異常，與有氧功率改善無關。
