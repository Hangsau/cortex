meta:
  chapter: ch14
  source: data/cscs/ch14.yaml
questions:
- id: ch14.ballistic-stretch.i02.q1
  item: ch14.ballistic-stretch.i02
  dco: pa2.A.2
  lang: zh
  cognitive: application
  stem: 熱身時採用彈震式拉伸，運動員最常因哪個反射而無法放鬆被牽拉的肌肉？
  locator: Types of Stretching > Ballistic Stretch
  options:
  - text: 牽張反射
    correct: true
  - text: 自身抑制
    correct: false
    why_wrong: 把高爾基腱器造成的反射性放鬆套到快速拉伸的情境；自身抑制需要主動收縮刺激 GTO，並非快速彈跳的主要反應。
  - text: 交互抑制
    correct: false
    why_wrong: 把主動肌收縮時拮抗肌放鬆的機制套到這裡；彈震式拉伸並沒有同步的主動肌收縮來觸發這條路徑。
- id: ch14.ballistic-stretch.i03.q1
  item: ch14.ballistic-stretch.i03
  dco: pa2.A.2
  lang: zh
  cognitive: recall
  stem: 教材對彈震式拉伸在增加關節活動範圍上的效果持何種結論？
  locator: Types of Stretching > Ballistic Stretch
  options:
  - text: 與靜態拉伸同樣有效
    correct: true
  - text: 明顯優於靜態拉伸
    correct: false
    why_wrong: 把教材的「同樣有效」誇大成「優於」；這裡的結論是等效，不是勝出。
  - text: 效果不如靜態拉伸
    correct: false
    why_wrong: 把比較方向反過來；教材引用的研究顯示在 ROM 改善上兩者相當，並未證明靜態拉伸較佳。
- id: ch14.dynamic-stretch.i05.q1
  item: ch14.dynamic-stretch.i05
  dco: pa2.A.2
  lang: en
  cognitive: recall
  stem: When designing a dynamic stretching routine, which repetition range is most appropriate for each movement?
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: 5 to 10 repetitions
    correct: true
  - text: 1 to 2 repetitions
    correct: false
    why_wrong: One or two repetitions cannot build the progressive increase in range of motion the chapter asks for. The prescribed count exists so that each successive repetition reaches a little further under control.
  - text: 20 to 30 repetitions
    correct: false
    why_wrong: Pushing far past the prescribed count turns a warm-up into localized fatigue work. An athlete who arrives at the main session already tired has lost the point of the warm-up.
- id: ch14.dynamic-stretch.i06.q1
  item: ch14.dynamic-stretch.i06
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 若訓練目標主要是增加靜態關節活動範圍，下列哪種拉伸方法最應優先採用？
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: 靜態拉伸
    correct: true
  - text: 動態拉伸
    correct: false
    why_wrong: 把熱身情境的「首選」誤用到「增加靜態 ROM」目標上；教材明示動態拉伸在這項目的上效果不如靜態或 PNF。
  - text: 彈震式拉伸
    correct: false
    why_wrong: 用「同樣有效」過度推論到「最適合」；在以增加靜態 ROM 為目標時，教材未將其列為優先。
- id: ch14.flexibility-factors.i01.q1
  item: ch14.flexibility-factors.i01
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 教練同時評估髖關節與膝關節的柔軟度，最有可能觀察到下列哪一種差異？
  locator: Flexibility > Factors Affecting Flexibility > Joint Structure
  options:
  - text: 髖關節可在多解剖平面活動
    correct: true
  - text: 兩關節活動範圍幾乎相同
    correct: false
    why_wrong: 把球窩關節的多平面特性誤當作所有關節的通則；膝為改良鉸鏈關節，主要只在矢狀面活動。
  - text: 膝關節比髖關節活動範圍大
    correct: false
    why_wrong: 把活動範圍的比較方向反過來；鉸鏈關節的活動自由度本就小於球窩關節。
- id: ch14.flexibility-factors.i05.q1
  item: ch14.flexibility-factors.i05
  dco: pa2.A.2
  lang: zh
  cognitive: application
  stem: 設計柔軟度訓練課表時，最關鍵的神經控制介入點為何？
  locator: Flexibility > Factors Affecting Flexibility > Neural Control
  options:
  - text: 影響傳入與傳出機制
    correct: true
  - text: 透過被動加熱關節液
    correct: false
    why_wrong: 把溫度相關效應誤當作神經控制的主要介入點；教材在神經控制段落談的是傳入與傳出機制，而非黏度變化。
  - text: 增加拮抗肌力壓制主動肌
    correct: false
    why_wrong: 將柔軟度訓練歸因於以肌力壓制；柔軟度訓練的目標是放鬆被牽拉肌，而非用力量去對抗它。
- id: ch14.flexibility-factors.i07.q1
  item: ch14.flexibility-factors.i07
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 對美式足球進攻線員而言，柔軟度訓練最應採取下列哪一種取向？
  locator: Flexibility > Factors Affecting Flexibility > Muscle Bulk
  options:
  - text: 肌肉量需求優先於極端關節活動度
    correct: true
  - text: 設法減少肌肉量以換取最大柔軟度
    correct: false
    why_wrong: 把教材的「肌肉量可能妨礙 ROM」推論成該減肌；教材明說應以該項目需求權衡，而非一概減肌。
  - text: 同時追求最大肌肉量與最大 ROM
    correct: false
    why_wrong: 把兩個可能衝突的目標當成可同時最大化；教材指出對需要大肌肉量的位置，肌肉量需求可能優先。
- id: ch14.pnf-techniques.i02.q1
  item: ch14.pnf-techniques.i02
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 比較收縮－放鬆法與保持－放鬆法，下列何者為最主要差異？
  locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Contract-Relax
  options:
  - text: 第二階段為通過完整 ROM 的向心收縮
    correct: true
  - text: 第一階段被動預拉時間縮短為 6 秒
    correct: false
    why_wrong: 把兩技術的差異誤置於預拉時間；教材的差異在第二階段的肌肉動作，預拉皆為 10 秒。
  - text: 最後階段改為主動肌等長收縮
    correct: false
    why_wrong: 將保持－放鬆加主動肌收縮法的特徵誤套到收縮－放鬆；CR 最後仍為被動拉伸 30 秒。
- id: ch14.pnf-techniques.i03.q1
  item: ch14.pnf-techniques.i03
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 保持－放鬆加主動肌收縮法的最後拉伸中，下列對兩種抑制機制主次的描述何者最符合教材？
  locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Hold-Relax With Agonist Contraction
  options:
  - text: 交互抑制為主，自身抑制居次
    correct: true
  - text: 兩種抑制的貢獻程度並無差別
    correct: false
    why_wrong: 把主次抹平成同等貢獻；教材明示最後的拉伸主要由交互抑制促成，自身抑制只是次要因素，兩者貢獻程度並不相同。
  - text: 自身抑制單獨造成最後的拉伸
    correct: false
    why_wrong: 只留下自身抑制；教材指出第三階段加入主動肌向心收縮，最後拉伸主要來自交互抑制，自身抑制無法單獨造成這個結果。
- id: ch14.pnf-techniques.i08.q1
  item: ch14.pnf-techniques.i08
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 教材認為哪一種 PNF 技術效果最佳，且理由為何？
  locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Hold-Relax With Agonist Contraction
  options:
  - text: HRAC，可同時促進雙重抑制
    correct: true
  - text: 收縮－放鬆，因為只使用自身抑制
    correct: false
    why_wrong: 認為只用自身抑制比雙重抑制更聚焦反而更佳；教材結論是同時促進兩種抑制者效果最佳。
  - text: 保持－放鬆，因為不需主動肌收縮
    correct: false
    why_wrong: 把「最簡單」誤當成「最有效」；教材明示同時促進兩種抑制的 HRAC 才是最有效的 PNF 技術。
- id: ch14.proprioceptors.i02.q1
  item: ch14.proprioceptors.i02
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 進行快速拉伸時，肌梭活化最可能造成下列哪一種結果？
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: 牽拉肌反射性收縮
    correct: true
  - text: 牽拉肌反射性放鬆
    correct: false
    why_wrong: 把 GTO 造成的反射性放鬆誤歸到肌梭；肌梭對應的是牽張反射引起的收縮，不是放鬆。
  - text: 對側拮抗肌收縮
    correct: false
    why_wrong: 把交互抑制的方向性誤用；交互抑制放鬆的是被牽拉肌，而不是讓對側肌肉收縮。
- id: ch14.ramp-protocol.i05.q1
  item: ch14.ramp-protocol.i05
  dco: pa2.A.1
  lang: en
  cognitive: analysis
  stem: Which conclusion most accurately reflects the textbook's stance on static stretching before performance?
  locator: Warm-Up > Targeted and Structured Warm-Ups
  options:
  - text: Weigh trade-offs given conflicting evidence
    correct: true
  - text: Rule out the practice before every session
    correct: false
    why_wrong: The chapter reports conflicting findings rather than a uniform decrement. One review found no impairment below sixty seconds, so a blanket ban discards a tool that may be harmless at short durations.
  - text: Apply the practice regardless of duration
    correct: false
    why_wrong: A meta-analysis cited in the chapter found measurable decrements even under forty-five seconds. Ignoring duration therefore throws away the one variable the evidence actually distinguishes.
- id: ch14.static-stretch.i03.q1
  item: ch14.static-stretch.i03
  dco: pa2.A.1
  lang: en
  cognitive: application
  stem: When teaching static stretching to a new athlete, which guideline best captures the textbook's safety condition for its effectiveness?
  locator: Types of Stretching > Static Stretch
  options:
  - text: Use correct technique with appropriate intensity
    correct: true
  - text: Use maximum tolerable intensity for each stretch
    correct: false
    why_wrong: Appropriate intensity means stretching to mild discomfort, not to pain. Working at the maximum an athlete can tolerate raises the risk of straining neurovascular structures and connective tissue.
  - text: Stretch only after a complete cool-down
    correct: false
    why_wrong: The chapter places this work within five to ten minutes of finishing, while muscle temperature is still elevated. Waiting for a full cool-down gives that elevated temperature away.
- id: ch14.warmup-physiology.i08.q1
  item: ch14.warmup-physiology.i08
  dco: pa2.A.1
  lang: en
  cognitive: analysis
  stem: Which statement best summarizes what warm-ups can and cannot guarantee?
  locator: Warm-Up
  options:
  - text: Boosts performance, injury prevention unclear
    correct: true
  - text: Prevents all training-related injuries
    correct: false
    why_wrong: The chapter calls the injury-prevention effect unclear while allowing that it may be positive. Promising prevention of every injury claims far more than the authors are willing to claim.
  - text: Has no effect on any performance variable
    correct: false
    why_wrong: Studies cited in the chapter report positive effects on endurance, jumping, and psychological readiness. Denying any effect discards the side of the evidence that is reasonably well supported.
- id: ch14.flexibility-factors.i06.q1
  item: ch14.flexibility-factors.i06
  dco: pa2.A.2
  lang: en
  cognitive: application
  stem: A strength coach wants resistance training to support, not reduce, an athlete's range of motion. Which programming choice is most consistent with the textbook?
  locator: Flexibility > Factors Affecting Flexibility > Resistance Training
  options:
  - text: Train agonists and antagonists through full ROM
    correct: true
  - text: Use heavy loads only in a limited ROM
    correct: false
    why_wrong: This is the exact pattern the chapter warns against. Heavy resistance work confined to a restricted range can reduce range of motion instead of supporting it.
  - text: Prioritize single-joint isolation over full ROM
    correct: false
    why_wrong: The remedy the chapter gives is training the agonists and their antagonists through the full range. Isolating one joint leaves the opposing muscles untrained and does not protect range of motion.
- id: ch14.ballistic-stretch.i01.q1
  item: ch14.ballistic-stretch.i01
  dco: pa2.A.1
  lang: zh
  cognitive: recall
  stem: 彈震式拉伸 ballistic stretch 在終點位置的處理方式，最符合教材描述的是？
  locator: Types of Stretching > Ballistic Stretch
  options:
  - text: 抵達終點即不再停留
    correct: true
  - text: 在終點位置維持 30 秒
    correct: false
    why_wrong: 把它和靜態拉伸的末端維持時間混淆；彈震式拉伸以彈跳為特徵，並不要求在終點維持。
  - text: 由夥伴把肢體固定於終點
    correct: false
    why_wrong: 把它誤認為被動拉伸；彈震式拉伸是由運動員主動用力產生彈跳動作。
- id: ch14.ballistic-stretch.i04.q1
  item: ch14.ballistic-stretch.i04
  dco: pa2.A.2
  lang: zh
  cognitive: application
  stem: 一名田徑選手過往有後腿肌拉傷紀錄，教練希望加入彈震式拉伸以提升爆發力，最應優先考量？
  locator: Types of Stretching > Ballistic Stretch
  options:
  - text: 舊傷史與當下身體準備程度
    correct: true
  - text: 該動作可達的最大 ROM
    correct: false
    why_wrong: 把重點放在 ROM 極限，反而忽略有舊傷時需要控制強度與安排的前提。
  - text: 彈震動作的總跳躍次數
    correct: false
    why_wrong: 把焦點放在次數這類表面參數，沒有回應教材強調的控制與準備條件。
- id: ch14.ballistic-stretch.i05.q1
  item: ch14.ballistic-stretch.i05
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 教練在安排柔軟度熱身時，最能區分動態拉伸與彈震式拉伸的關鍵動作特徵為何？
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: 是否全程受控制且不彈跳
    correct: true
  - text: 是否以單一肌肉為目標
    correct: false
    why_wrong: 把單一肌肉當成判準；動態拉伸的特徵是以功能性動作為基礎，不是只挑一塊肌肉。
  - text: 是否使用器材提供外力
    correct: false
    why_wrong: 把動態拉伸誤以為被動拉伸；是否用器材是主動/被動的分類，與動態/彈震的區分無關。
- id: ch14.ballistic-stretch.i08.q1
  item: ch14.ballistic-stretch.i08
  dco: pa2.A.1
  lang: en
  cognitive: application
  stem: A coach notices an athlete performing rapid bouncing stretches, during which the muscle being stretched contracts and limits ROM. Which proprioceptor is most likely responsible for limiting the ROM in this scenario?
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: Muscle spindle
    correct: true
  - text: Golgi tendon organ
    correct: false
    why_wrong: Attributes the response to tension monitoring; the GTO relaxes the same muscle when tension rises, which is not the limiting reflex seen here.
  - text: Pacinian corpuscle
    correct: false
    why_wrong: Brings in a receptor not responsible for length-change reflexes; rapid stretch reflexes arise from the spindle, not from pressure/vibration sensing.
- id: ch14.dynamic-stretch.i02.q1
  item: ch14.dynamic-stretch.i02
  dco: pa2.A.1
  lang: en
  cognitive: application
  stem: When comparing dynamic and ballistic stretching, which combination of features most reliably distinguishes dynamic stretching in practice?
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: No bouncing, with control throughout the ROM
    correct: true
  - text: Larger ROM through repeated bouncing at end range
    correct: false
    why_wrong: Describes the bouncing pattern of ballistic stretching; larger ROM through bouncing is not the defining feature of dynamic stretching.
  - text: Passive force applied by a partner for 30 seconds
    correct: false
    why_wrong: Mixes up the active/passive axis with the dynamic/ballistic axis; duration and partner force do not define dynamic stretching.
- id: ch14.dynamic-stretch.i03.q1
  item: ch14.dynamic-stretch.i03
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 教練在設計多數運動的熱身時，最優先採用動態拉伸而非靜態拉伸的主要理由為何？
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: 能複製運動專項動作模式與 ROM
    correct: true
  - text: 提升靜態 ROM 的效果優於靜態拉伸
    correct: false
    why_wrong: 把靜態 ROM 的效果當成主要理由；教材指出動態拉伸在這點反而不如靜態或 PNF 拉伸。
  - text: 執行時不會改變肌肉溫度高低
    correct: false
    why_wrong: 反向假設動態拉伸會降溫；事實上動態拉伸能維持提升階段的溫度效益。
- id: ch14.dynamic-stretch.i04.q1
  item: ch14.dynamic-stretch.i04
  dco: pa2.E.1
  lang: zh
  cognitive: analysis
  stem: 體能教練為短跑選手設計熱身動作時，最合邏輯的第一步應是？
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: 分析短跑主要動作模式及所需 ROM
    correct: true
  - text: 列出全身各大肌群的常見伸展動作
    correct: false
    why_wrong: 以肌群清單為起點，跳過動作需求分析；教材強調先看動作模式再選練習。
  - text: 比較各種拉伸法增加靜態 ROM 的能力
    correct: false
    why_wrong: 把靜態 ROM 當成熱身設計的主要變項；動態拉伸的核心是動作模式對應，不是靜態柔軟度比較。
- id: ch14.dynamic-stretch.i07.q1
  item: ch14.dynamic-stretch.i07
  dco: pa2.A.2
  lang: en
  cognitive: analysis
  stem: A strength coach uses a high-knee drill as part of the warm-up. Which cueing adjustment most appropriately integrates motor skill factors with dynamic stretching?
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: Cue ankle dorsiflexion while raising the knee
    correct: true
  - text: Instruct athletes to relax the foot throughout the drill
    correct: false
    why_wrong: Omits the joint position that defines the skill cue; relaxed feet lose the dorsiflexion that mirrors sprint mechanics.
  - text: Switch to a passive hamstring stretch instead
    correct: false
    why_wrong: Abandons the dynamic stretch framework; a passive static stretch does not integrate the sprint pattern into the warm-up.
- id: ch14.flexibility-factors.i02.q1
  item: ch14.flexibility-factors.i02
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 比較同樣接受阻力訓練的年長者與年輕選手柔軟度差異時，教材最可能歸因於？
  locator: Flexibility > Factors Affecting Flexibility > Age and Sex
  options:
  - text: 纖維化及活動量減少的累積效應
    correct: true
  - text: 年長者關節結構完全喪失活動能力
    correct: false
    why_wrong: 把年齡與關節結構的效果絕對化；教材強調適當運動仍可改善，並未說完全喪失。
  - text: 年長者肌肉量天生高於年輕人
    correct: false
    why_wrong: 反向假設肌肉量差異；教材將柔軟度差異連結到纖維化與活動，並沒有此種肌肉量結論。
- id: ch14.flexibility-factors.i08.q1
  item: ch14.flexibility-factors.i08
  dco: pa2.E.1
  lang: zh
  cognitive: analysis
  stem: 一位平時活動量充足但從未做拉伸的學員，最可能呈現哪一種柔軟度狀態？
  locator: Flexibility > Factors Affecting Flexibility > Activity Level
  options:
  - text: 柔軟度未必較高，仍需完整 ROM
    correct: true
  - text: 活動量本身即足以顯著提升柔軟度
    correct: false
    why_wrong: 把活動量直接等同於柔軟度訓練；教材明示活動量本身不會改善柔軟度，必須是通過完整 ROM 的活動或專項拉伸計畫才算數。
  - text: 阻力訓練對其柔軟度完全沒有幫助
    correct: false
    why_wrong: 過度推論；教材指出設計良好的阻力訓練可增加柔軟度，只是不能取代讓關節通過完整 ROM 的拉伸活動。
- id: ch14.proprioceptors.i08.q1
  item: ch14.proprioceptors.i08
  dco: pa2.A.1
  lang: en
  cognitive: analysis
  stem: An athlete's hamstring relaxes both when its own tension rises and when the opposing quadriceps contracts. Which account of these two relaxations is most consistent with the textbook?
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: One receptor explains both, the tendon organ
    correct: true
  - text: Two different receptors, one for each case
    correct: false
    why_wrong: The chapter assigns both relaxations to the same receptor. Splitting them between two receptors loses the point that tendon-organ firing accounts for autogenic and reciprocal inhibition alike.
  - text: The spindle explains both of these responses
    correct: false
    why_wrong: The spindle fires when a muscle is lengthened quickly and produces contraction, not relaxation. It cannot account for either of the two relaxations described here.
- id: ch14.static-stretch.i01.q1
  item: ch14.static-stretch.i01
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 教練為初學者選擇拉伸方式時，最應優先採用靜態拉伸而非彈震式拉伸的主要考量為何？
  locator: Types of Stretching > Static Stretch
  options:
  - text: 緩慢執行可避免引發牽張反射，受傷可能性較低
    correct: true
  - text: 末端必須維持至少 60 秒才能發揮效果
    correct: false
    why_wrong: 把末端維持時間寫成 60 秒；教材建議靜態拉伸末端維持 15 至 30 秒，並無 60 秒的硬性下限。
  - text: 只能由夥伴提供外力才算靜態拉伸
    correct: false
    why_wrong: 把靜態拉伸誤限於被動形式；主動或被動靜態拉伸都屬於此類，並非只能由夥伴施力。
- id: ch14.warmup-physiology.i05.q1
  item: ch14.warmup-physiology.i05
  dco: pa2.E.1
  lang: zh
  cognitive: application
  stem: 熱身使體溫升高後，最能解釋工作肌群氧氣供應獲得改善的生理機制為何？
  locator: Warm-Up
  options:
  - text: 波耳效應使血紅素更易釋放氧氣
    correct: true
  - text: 心輸出量下降使氧氣停留更久
    correct: false
    why_wrong: 把方向寫反；熱身會提升心輸出量與血流，而不是使心輸出量下降。
  - text: 血紅素氧氣結合力增強更難釋出
    correct: false
    why_wrong: 把釋放效果寫反；波耳效應是使血紅素在較高溫下更易釋氧，而非結合更緊。
- id: ch14.ballistic-stretch.i06.q1
  item: ch14.ballistic-stretch.i06
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 一位教練只在賽前熱身使用彈震式拉伸，想知道能否納入平時的柔軟度發展課表，下列判斷最符合教材？
  locator: Types of Stretching > Ballistic Stretch
  options:
  - text: 可納入柔軟度發展計畫，不限於熱身
    correct: true
  - text: 僅能在運動前熱身階段短暫使用
    correct: false
    why_wrong: 把它限縮在熱身情境；教材明說彈震式拉伸可納入柔軟度發展計畫，熱身只是它常見的使用場合之一。
  - text: 只有 PNF 課表才可納入彈震動作
    correct: false
    why_wrong: 把彈震動作誤綁在 PNF 上；PNF 靠夥伴阻力與反射抑制，與彈震式拉伸的彈跳動作分屬不同方法。
- id: ch14.ballistic-stretch.i07.q1
  item: ch14.ballistic-stretch.i07
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 教練在指導彈震式拉伸時，應最優先監控的指標為何？
  locator: Types of Stretching > Ballistic Stretch
  options:
  - text: 是否出現反射收縮
    correct: true
  - text: 心率是否進入訓練區間
    correct: false
    why_wrong: 把焦點放在心率；本項要觀察的是反射對 ROM 的限制，而非心率監控。
  - text: 場地溫度是否高於二十度
    correct: false
    why_wrong: 把焦點放在環境溫度；教材監控的是神經反射對動作的影響，與場地溫度無關。
- id: ch14.dynamic-stretch.i01.q1
  item: ch14.dynamic-stretch.i01
  dco: pa2.A.1
  lang: en
  cognitive: recall
  stem: Which term is sometimes used interchangeably with dynamic stretching because both focus on movement-specific ROM rather than isolated muscles?
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: Mobility drills that mirror the sport
    correct: true
  - text: Bouncing ballistic drills in sport
    correct: false
    why_wrong: Confuses the bouncing characteristic of ballistic stretching with the controlled active movement that defines dynamic stretching.
  - text: Partner assisted PNF stretch technique
    correct: false
    why_wrong: Treats PNF as a synonym for dynamic stretching; PNF relies on partner-assisted contractions and reflex inhibition, not sport-specific active ROM.
- id: ch14.dynamic-stretch.i08.q1
  item: ch14.dynamic-stretch.i08
  dco: pa2.A.1
  lang: zh
  cognitive: recall
  stem: 以動態拉伸為主、完成有效的熱身通常最接近下列何種時間範圍？
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: 10 至 15 分鐘
    correct: true
  - text: 3 至 5 分鐘
    correct: false
    why_wrong: 把有效熱身低估為短時間熱身；教材明確指出動態拉伸熱身可於十分鐘以上完成。
  - text: 25 至 30 分鐘
    correct: false
    why_wrong: 將熱身誤以為越久越好；教材以十分鐘至二十分鐘的區間界定，未涵蓋二十五分鐘以上的範圍。
- id: ch14.flexibility-factors.i03.q1
  item: ch14.flexibility-factors.i03
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 一位選手接受長期阻力訓練後，肌肉明顯增大，卻抱怨肩膀活動度下降，最可能的組織性限制來源為何？
  locator: Flexibility > Factors Affecting Flexibility > Muscle and Connective Tissue
  options:
  - text: 肌肉、肌腱與結締組織的彈性與塑性
    correct: true
  - text: 大腦皮質的注意力調控能力下降
    correct: false
    why_wrong: 把限制歸到中樞神經；題幹已呈現肌肉量增大與 ROM 下降的對應。
  - text: 紅血球總量降低使關節液循環變差
    correct: false
    why_wrong: 以血液學變因解釋柔軟度下降；教材未把紅血球總量列為直接限制。
- id: ch14.flexibility-factors.i04.q1
  item: ch14.flexibility-factors.i04
  dco: pa2.A.1
  lang: en
  cognitive: application
  stem: Two athletes complete an identical stretching program, but Athlete A tolerates a noticeably greater end-range load than Athlete B. Which factor most plausibly accounts for this difference?
  locator: Flexibility > Factors Affecting Flexibility > Stretch Tolerance
  options:
  - text: Higher stretch tolerance from regular training practice
    correct: true
  - text: Lower resting heart rate from aerobic endurance work
    correct: false
    why_wrong: Reaches for a cardiovascular metric; the tolerance difference here tracks directly with stretch tolerance, not aerobic fitness.
  - text: Longer training age in the same competitive sport
    correct: false
    why_wrong: Invokes training age without specifying the relevant mechanism; the source variable is the athlete's tolerance of stretch discomfort.
- id: ch14.pnf-techniques.i01.q1
  item: ch14.pnf-techniques.i01
  dco: pa2.A.1
  lang: zh
  cognitive: recall
  stem: 保持－放鬆法（hold-relax）三個階段的時間分配，下列何者最符合教材所述？
  locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Hold-Relax
  options:
  - text: 被動預拉 10 秒、等長收縮 6 秒、被動拉伸 30 秒
    correct: true
  - text: 被動預拉 6 秒、等長收縮 10 秒、被動拉伸 30 秒
    correct: false
    why_wrong: 把預拉與收縮時間對調；教材明示預拉十秒、收縮六秒的順序。
  - text: 被動預拉 30 秒、等長收縮 10 秒、被動拉伸 6 秒
    correct: false
    why_wrong: 把三個時間全部錯置；正確配置為短預拉、短收縮、長維持。
- id: ch14.pnf-techniques.i04.q1
  item: ch14.pnf-techniques.i04
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 一名選手在股四頭肌被動拉伸前先主動用力收縮該肌群，最可能引發的神經機制為何？
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: 自身抑制，由高爾基腱器受張力刺激所引發
    correct: true
  - text: 交互抑制，由肌梭受牽拉刺激所啟動
    correct: false
    why_wrong: 把自身抑制與交互抑制混淆；本情境是被拉伸肌自身收縮，與對側肌收縮不同。
  - text: 牽張反射，由肌梭偵測長度變化所啟動
    correct: false
    why_wrong: 把反射方向寫反；牽張反射會使被拉伸肌收縮而非放鬆，與題幹所求相反。
- id: ch14.pnf-techniques.i05.q1
  item: ch14.pnf-techniques.i05
  dco: pa2.A.1
  lang: en
  cognitive: application
  stem: A hamstring is being passively stretched while the athlete actively contracts the quadriceps. Which mechanism most directly allows the hamstring to relax?
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: Reciprocal inhibition driven by GTO activation
    correct: true
  - text: Autogenic inhibition from increased hamstring tension
    correct: false
    why_wrong: Treats the contracting muscle as the stretched one; the stretch here is the hamstring while the quadriceps contracts.
  - text: Stretch reflex from rapid muscle spindle firing
    correct: false
    why_wrong: Predicts reflex contraction of the stretched muscle; reciprocal inhibition is meant to relax it instead.
- id: ch14.pnf-techniques.i06.q1
  item: ch14.pnf-techniques.i06
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 體能訓練專業人員在評估是否將 PNF 拉伸列為團隊常態柔軟度訓練時，最應考量的限制為何？
  locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch
  options:
  - text: 多數 PNF 拉伸需搭配夥伴與技術，實用性受限
    correct: true
  - text: PNF 拉伸對肌力發展會產生顯著負面影響
    correct: false
    why_wrong: 把限制誇大成肌力流失；教材未把肌力下降列為 PNF 的主要疑慮。
  - text: PNF 拉伸在熱身階段無法與其他活動整合
    correct: false
    why_wrong: 假設 PNF 無法整合進熱身流程；教材的限制是夥伴與技術需求，並未排除與其他活動的搭配。
- id: ch14.proprioceptors.i01.q1
  item: ch14.proprioceptors.i01
  dco: pa2.A.1
  lang: zh
  cognitive: recall
  stem: 下列有關肌梭（muscle spindle）的描述，何者最符合教材的敘述？
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: 位於梭內肌纖維，與梭外肌平行，監控肌肉長度
    correct: true
  - text: 位於肌腱肌肉交界附近，監控肌肉張力變化
    correct: false
    why_wrong: 把肌梭與高爾基腱器的位置與功能互換；張力監控屬於高爾基腱器的範疇。
  - text: 位於關節囊內，監控關節角度與旋轉速度
    correct: false
    why_wrong: 將肌梭誤認為關節本體感覺受器；教材未把關節囊受器列為肌梭的位置。
- id: ch14.proprioceptors.i04.q1
  item: ch14.proprioceptors.i04
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 保持－放鬆法與收縮－放鬆法之所以能提升關節活動度，最主要共同依賴的神經機制為何？
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: 被拉伸肌收縮後由高爾基腱器引發的放鬆
    correct: true
  - text: 主動肌收縮後由肌梭引發的牽張反射
    correct: false
    why_wrong: 把機制指向會限制 ROM 的牽張反射；自身抑制才是兩種 PNF 的共通基礎。
  - text: 對側拮抗肌收縮造成的交互抑制
    correct: false
    why_wrong: 將第三種 PNF 變化的機制搬過來；保持－放鬆與收縮－放鬆並未以對側肌收縮為主。
- id: ch14.proprioceptors.i05.q1
  item: ch14.proprioceptors.i05
  dco: pa2.A.1
  lang: zh
  cognitive: analysis
  stem: 在保持－放鬆加主動肌收縮法中，被拉伸肌之所以能進入更大的活動範圍，最關鍵的神經機制為何？
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: 主動肌收縮刺激高爾基腱器，使對側被拉伸肌反射性放鬆
    correct: true
  - text: 被拉伸肌內的肌梭偵測長度變化，啟動自身放鬆
    correct: false
    why_wrong: 將交互抑制誤寫為肌梭的長度偵測；肌梭啟動的是收縮而非放鬆。
  - text: 高爾基腱器抑制所有運動神經元，使肌肉完全失去張力
    correct: false
    why_wrong: 把高爾基腱器的效果誇大成全面抑制；教材僅描述被拉伸肌的反射性放鬆，未涉及全面失張力。
- id: ch14.proprioceptors.i06.q1
  item: ch14.proprioceptors.i06
  dco: pa2.A.1
  lang: en
  cognitive: application
  stem: A coach wants to stretch a muscle group without provoking the stretch reflex. Which stretching approach best meets this criterion?
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: Slow static stretching that holds the end position
    correct: true
  - text: Rapid bouncing at the end range of motion
    correct: false
    why_wrong: Picks the high-velocity approach that the textbook identifies as a common trigger of the stretch reflex.
  - text: Fast dynamic leg swings before practice starts
    correct: false
    why_wrong: Selects the dynamic movement that the source warns may also stimulate muscle spindles and provoke the reflex.
- id: ch14.ramp-protocol.i07.q1
  item: ch14.ramp-protocol.i07
  dco: pa2.A.1
  lang: en
  cognitive: analysis
  stem: A strength and conditioning coach treats the warm-up as part of long-term athlete development. Which planning principle best reflects this approach?
  locator: Warm-Up > Targeted and Structured Warm-Ups
  options:
  - text: Embed the warm-up in short-, medium-, and long-term planning
    correct: true
  - text: Keep the warm-up identical every session to minimize variables
    correct: false
    why_wrong: Treats repetition as the priority; the source stresses progressive integration across time horizons.
  - text: Schedule the warm-up only on competition days to conserve training time
    correct: false
    why_wrong: Confines the warm-up to competition days; the textbook frames it as a training component across the cycle.
- id: ch14.ramp-protocol.i08.q1
  item: ch14.ramp-protocol.i08
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 訓練熱身與競賽熱身在目標設定上最主要的差異為何？
  locator: Warm-Up > Targeted and Structured Warm-Ups
  options:
  - text: 訓練熱身同時處理當下表現與運動員的長期發展
    correct: true
  - text: 訓練熱身僅需著重當次課表表現，不考量長期發展
    correct: false
    why_wrong: 將訓練熱身窄化為只服務當下；教材明示它還要肩負中長期發展。
  - text: 競賽熱身只需做好心理準備，無須規劃專項活動
    correct: false
    why_wrong: 把競賽熱身簡化為心理準備；教材要求競賽熱身以漸進專項活動做好生理與心理準備。
- id: ch14.static-stretch.i06.q1
  item: ch14.static-stretch.i06
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 一位選手在賽前熱身後立即進行靜態拉伸，結果在比賽前半段明顯感覺柔軟度提升，但結束後一小時已恢復至接近熱身前的水準。教練最應採取的長期策略為何？
  locator: Flexibility > Frequency, Duration, and Intensity of Stretching
  options:
  - text: 規劃長期柔軟度計畫以取得持久改善
    correct: true
  - text: 改在比賽中段穿插短暫拉伸以延長效果
    correct: false
    why_wrong: 把焦點放在比賽中段的應急拉伸；教材明示急性效果短暫，需要長期計畫。
  - text: 停止所有靜態拉伸以免干擾賽後恢復
    correct: false
    why_wrong: 把因應策略推向完全放棄拉伸；教材未建議停止靜態拉伸。
- id: ch14.static-stretch.i07.q1
  item: ch14.static-stretch.i07
  dco: pa2.A.1
  lang: zh
  cognitive: application
  stem: 一名選手進行腿後肌拉伸時感到小腿後側出現放射至腳底的刺痛，教練最合適的即時處置為何？
  locator: Flexibility > Frequency, Duration, and Intensity of Stretching
  options:
  - text: 立即降低拉伸強度並停止造成疼痛的動作
    correct: true
  - text: 維持同一姿勢以嘗試撐過疼痛、爭取更大 ROM
    correct: false
    why_wrong: 把疼痛當作正常代價而堅持；教材明示疼痛、放射症狀或感覺喪失時應降低強度。
  - text: 改為被動拉伸並由夥伴加大外力以突破限制
    correct: false
    why_wrong: 試圖以更大外力突破不適；此舉可能加重神經或血管結構的受壓，違反教材的安全規範。
- id: ch14.dynamic-stretch.i02.q2
  item: ch14.dynamic-stretch.i02
  dco: pa2.A.2
  lang: en
  cognitive: application
  stem: When selecting dynamic stretching over ballistic stretching for an athlete's warm-up, which combination of execution features most directly addresses the safety concern that the textbook identifies?
  locator: Types of Stretching > Dynamic Stretch
  options:
  - text: Controlled active movement without bouncing at end range
    correct: true
  - text: Rebounding at end range to maximize ROM gained
    correct: false
    why_wrong: Applies the bouncing characteristic that the textbook specifically warns against; ballistic-style rebounding is the trigger for the reflex-related risk that dynamic stretching is designed to avoid.
  - text: A partner applying external pressure for 30 seconds
    correct: false
    why_wrong: Imports a passive stretching procedure; partner-applied force defines passive technique rather than the active, controlled pattern that distinguishes dynamic stretching.
- id: ch14.pnf-techniques.i07.q2
  item: ch14.pnf-techniques.i07
  dco: pa2.A.1
  lang: zh
  cognitive: recall
  stem: 教材描述三種 PNF 技術的共同結構時，下列何者最正確？
  locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch
  options:
  - text: 三種技術第一階段皆為被動預拉 10 秒
    correct: true
  - text: 第二與第三階段的動作三者相同
    correct: false
    why_wrong: 把不同階段的差異抹平；教材明示第二與第三階段的肌肉動作因技術而異，正是這個差異構成三種技術各自的名稱。
  - text: 三種技術最後階段皆為主動肌等長收縮
    correct: false
    why_wrong: 把單一技術的特徵擴大成三種共通項；教材明示第二、三階段的肌肉動作因技術而異，並非一律為等長收縮。
- id: ch14.proprioceptors.i03.q1
  item: ch14.proprioceptors.i03
  dco: pa2.A.1
  lang: en
  cognitive: recall
  pool: extra
  stem: Which mechanoreceptor is most sensitive to changes in muscular tension and inhibits motor neuron firing when excessive tension is detected?
  locator: Flexibility > Proprioceptors and Stretching
  options:
  - text: Golgi tendon organ
    correct: true
  - text: Muscle spindle
    correct: false
    why_wrong: Muscle spindles monitor changes in muscle length and reflexively trigger contraction of the stretched muscle, so their reflex promotes firing rather than inhibiting it.
  - text: Pacinian corpuscle
    correct: false
    why_wrong: Pacinian corpuscles are vibration and pressure receptors in skin and connective tissue, so they are not positioned to detect muscular tension or shape motor neuron output in the tendon.
