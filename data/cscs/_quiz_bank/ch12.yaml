meta:
  chapter: ch12
  source: data/cscs/ch12.yaml
questions:
- id: ch12.administration.i01.q1
  item: ch12.administration.i01
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 一名新手施測者首次為大學籃球隊施行垂直跳測驗，最需要先建立哪一項條件才能讓他後續施測的分數可靠？
  locator: Test Administration > Selection and Training of Testers
  options:
  - text: 與資深施測者的分數高度相關
    correct: true
  - text: 熟悉每位球員的姓名與位置
    correct: false
    why_wrong: 認識受測者屬於人際熟悉度，與評分一致性無直接關係；信度要求的是量出來的分數彼此一致。
  - text: 能在施測時提供口頭鼓勵
    correct: false
    why_wrong: 鼓勵不一致本身就是損及信度的原因，把它列為優先會與本章訓練施測者的核心目的相反。
- id: ch12.administration.i03.q1
  item: ch12.administration.i03
  dco: pa3.B.2
  lang: zh
  cognitive: recall
  stem: 預先製作深蹲 1RM 測驗的記錄表單時，應在表單上預留的最關鍵欄位為何？
  locator: Test Administration > Recording Forms
  options:
  - text: 槓鈴所用插銷高度的設定細節
    correct: true
  - text: 運動員前一晚的睡眠時數
    correct: false
    why_wrong: 睡眠資訊對單次 1RM 記錄有幫助，但本章要求的是讓日後重測能重現相同設定的施測細節。
  - text: 該運動員的姓名與出生年月日
    correct: false
    why_wrong: 身分資料當然要記，但與「重現施測設定」這個本章特別強調的欄位目的不同。
- id: ch12.administration.i06.q1
  item: ch12.administration.i06
  dco: pa3.B.2
  lang: en
  cognitive: application
  stem: Which instruction element should the tester prioritize to most improve reliability across multiple trials of a field test?
  locator: Test Administration > Preparing Athletes for Testing
  options:
  - text: clear criteria for invalidating a trial
    correct: true
  - text: friendly small talk between attempts
    correct: false
    why_wrong: Small talk is unrelated to the standardization of attempts; consistency in judging validity is what protects reliability.
  - text: publicly sharing each athlete's score after a trial
    correct: false
    why_wrong: Public score sharing can shift effort and pacing strategies; it does not address the tester-controlled instruction variables that drive reliability.
- id: ch12.administration.i07.q1
  item: ch12.administration.i07
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 為深蹲 1RM 安排的多次嘗試，後一次嘗試已逼近運動員預期最大值時，兩次之間至少應休息多久？
  locator: Test Administration > Testing Batteries and Multiple Testing Trials
  options:
  - text: 3 分鐘
    correct: true
  - text: 30 秒
    correct: false
    why_wrong: 30 秒遠低於本章對接近最大值嘗試的最低恢復要求，會把疲勞誤判為能力。
  - text: 2 分鐘
    correct: false
    why_wrong: 2 分鐘是非接近最大值嘗試的最低休息，套用在接近最大值會低估需要的恢復。
- id: ch12.reliability.i01.q1
  item: ch12.reliability.i01
  dco: pa3.C.1
  lang: zh
  cognitive: application
  stem: 教練回報某垂直跳測驗在某高中隊伍上得到的分數波動很大，這時最優先要判斷的是什麼？
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: 該測驗在此群運動員的可靠度
    correct: true
  - text: 該測驗是否為國際賽事所用
    correct: false
    why_wrong: 是否為國際賽採用與該隊伍本身的測量品質是兩個獨立問題，本章強調的是分數可不可重複。
  - text: 該測驗使用的器材品牌
    correct: false
    why_wrong: 器材品牌是器材誤差的其中一個來源，但整體信度還涉及生物變異與施測穩定度，不能只看品牌。
- id: ch12.reliability.i02.q1
  item: ch12.reliability.i02
  dco: pa3.C.1
  lang: en
  cognitive: recall
  stem: Which statistic best estimates test–retest reliability when the same group of athletes performs the same test on two occasions?
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: the correlation between the two sets of scores
    correct: true
  - text: the mean of the highest score on each day
    correct: false
    why_wrong: Taking the highest score discards day-to-day variability, which is exactly the variation test–retest reliability is meant to capture.
  - text: the difference between the group totals on each day
    correct: false
    why_wrong: Group totals average out individual variation; reliability is a property of individual scores, not group sums.
- id: ch12.reliability.i04.q1
  item: ch12.reliability.i04
  dco: pa3.C.1
  lang: zh
  cognitive: analysis
  stem: 一名運動員在同一名施測者、相同電子計時系統與相同暖身流程下重複進行 20 公尺衝刺，兩次成績仍有差距，最可能的來源是下列何者？
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: 受試者本身無法維持一致的表現
    correct: true
  - text: 不同評分者之間的寬嚴標準差異
    correct: false
    why_wrong: 題幹已指明由同一名施測者施測，評分者之間的寬嚴差異在此情境已被控制，不構成成績差距的來源。
  - text: 同一評分者前後給分的不一致
    correct: false
    why_wrong: 成績由電子計時系統直接讀出，不經評分者主觀給分，同一評分者前後標準的漂移不適用於此情境。
- id: ch12.reliability.i05.q1
  item: ch12.reliability.i05
  dco: pa3.C.1
  lang: en
  cognitive: application
  stem: Two testers measure the same athletes' squat depth using slightly different criteria, and the depth scores differ systematically between them. Which quality of the test is most directly compromised?
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: interrater reliability
    correct: true
  - text: test-retest reliability
    correct: false
    why_wrong: Test-retest reliability concerns agreement across repeated administrations by the same tester; here the disagreement is between two testers, not between occasions.
  - text: discriminant validity
    correct: false
    why_wrong: Discriminant validity concerns separation between different constructs; rater scoring differences do not address construct separation.
- id: ch12.reliability.i06.q1
  item: ch12.reliability.i06
  dco: pa3.C.1
  lang: zh
  cognitive: application
  stem: 教練在學期初與學期末親自為同一組學生施測深蹲動作，期末分數卻普遍高於期初。最有可能的成因屬於下列哪一類？
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: 同一評分者給分前後不一致
    correct: true
  - text: 評分者間的寬嚴標準不同
    correct: false
    why_wrong: 評分者間變異需要不同評分者之間的差異，本情境只有同一位教練。
  - text: 學生彼此之間的能力差距
    correct: false
    why_wrong: 受試者間變異涉及不同運動員之間的差異，無法解釋同一人前後測的系統性偏移。
- id: ch12.reliability.i07.q1
  item: ch12.reliability.i07
  dco: pa3.C.1
  lang: zh
  cognitive: analysis
  stem: 一項高度技術性的測驗在同一群新手運動員身上產生高度不一致的結果，最主要的變異來源最可能為何？
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: 測驗本身的技術要求
    correct: true
  - text: 器材校正的系統性誤差
    correct: false
    why_wrong: 系統性器材誤差會把所有分數同向偏移，但不會直接造成新手之間的高度不一致。
  - text: 受測者的年齡差異
    correct: false
    why_wrong: 年齡影響效度與常模，但不必然是技術性測驗在新手中變異的主因。
- id: ch12.reliability.i08.q1
  item: ch12.reliability.i08
  dco: pa3.C.1
  lang: zh
  cognitive: application
  stem: 某支隊伍使用的 40 公尺衝刺測驗每次結果都很接近，但教練仍質疑它能否反映比賽表現，這時最需要檢驗什麼？
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: 該測驗的效度
    correct: true
  - text: 該測驗的器材精度
    correct: false
    why_wrong: 結果很接近已代表器材與施測本身是穩定的，此時再追問器材精度無助於回答教練的疑問。
  - text: 該測驗的常模表年代
    correct: false
    why_wrong: 常模年代影響比較對象，不能告訴我們這個測驗究竟有沒有測到比賽所需的能力。
- id: ch12.safety.i01.q1
  item: ch12.safety.i01
  dco: pa3.B.1
  lang: zh
  cognitive: analysis
  stem: 一名運動員在完成一組全力跑步測驗後 10 分鐘仍持續抱怨胸部壓迫感與不規則脈搏，最適當的處置為何？
  locator: Test Administration > Health and Safety Considerations
  options:
  - text: 立即安排醫療轉介評估
    correct: true
  - text: 繼續施測下一項以分散注意力
    correct: false
    why_wrong: 繼續施測會讓運動員暴露在症狀惡化的風險中，與本章要求持續監測並適時轉介相反。
  - text: 給予溫開水後請其坐下休息
    correct: false
    why_wrong: 症狀已超出單純疲勞可解釋的範圍；單純補水休息不足以取代本章要求的醫療轉介。
- id: ch12.selection-factors.i06.q1
  item: ch12.selection-factors.i06
  dco: pa3.B.1
  lang: zh
  cognitive: application
  stem: 當環境溫度接近 80 °F 且相對濕度超過 50% 時，施測有氧耐力測驗最應注意什麼？
  locator: Test Selection > Environmental Factors
  options:
  - text: 表現可能受損而低估最大攝氧量
    correct: true
  - text: 應立即改為熱病處置流程
    correct: false
    why_wrong: 該溫濕度尚未達到熱病條件下的處置門檻，本章談的是表現與效度受損，不是熱傷害處置。
  - text: 必須停止所有測驗直到氣溫下降
    correct: false
    why_wrong: 本章只要求在解讀結果時考慮環境條件，並未要求一達該溫濕度即全面停止測驗。
- id: ch12.test-sequence.i03.q1
  item: ch12.test-sequence.i03
  dco: pa3.B.2
  lang: en
  cognitive: application
  stem: According to the logical test order, which category of test should most appropriately be performed immediately after non-fatiguing tests?
  locator: Test Administration > Sequence of Tests
  options:
  - text: agility tests, such as the T-test
    correct: true
  - text: maximum strength tests, such as 1RM
    correct: false
    why_wrong: Maximum strength tests follow agility, not non-fatiguing tests, in the chapter's sequence.
  - text: aerobic capacity tests, such as 1.5-mile
    correct: false
    why_wrong: Aerobic capacity tests are performed last; placing them after non-fatiguing tests would violate the logical order.
- id: ch12.selection-factors.i05.q1
  item: ch12.selection-factors.i05
  dco: pa1.A.3
  lang: en
  cognitive: analysis
  stem: A coach wants to assess muscular endurance in the elbow flexors of a female high school wrestling team. According to the chapter, which modification is most appropriate?
  locator: Test Selection > Age and Sex
  options:
  - text: use a feet-supported pull-up for females
    correct: true
  - text: keep the standard pull-up unchanged
    correct: false
    why_wrong: A standard pull-up may fail to discriminate endurance levels in females; keeping it ignores the limitation the chapter flags.
  - text: replace the test with a 1RM biceps curl
    correct: false
    why_wrong: A 1RM measures maximal strength, not endurance, so it does not address the chapter's endurance-testing goal.
- id: ch12.administration.i02.q1
  item: ch12.administration.i02
  dco: pa3.B.2
  lang: en
  cognitive: analysis
  stem: A strength and conditioning staff cannot have the same person administer every test. Which arrangement best preserves interrater reliability?
  locator: Test Administration > Test Format
  options:
  - text: assign tests requiring expert judgment to the most experienced tester
    correct: true
  - text: rotate all testers evenly across every test regardless of complexity
    correct: false
    why_wrong: Even rotation ignores differences in test complexity and tester experience; the chapter calls for differentiated assignment.
  - text: let interns perform every test so they can learn on the job
    correct: false
    why_wrong: Interns lack the experience required for tests needing skilled judgment, which would lower interrater reliability.
- id: ch12.administration.i08.q1
  item: ch12.administration.i08
  dco: pa3.B.2
  lang: zh
  cognitive: recall
  stem: 完成會大幅提高心率的測驗後，最適當的收尾安排為何？
  locator: Test Administration > Preparing Athletes for Testing
  options:
  - text: 安排受監督的低強度活動與輕度伸展
    correct: true
  - text: 立即讓運動員坐下並大量飲水
    correct: false
    why_wrong: 突然停止高心率活動不利於恢復流程，且大量飲水在未確認流失量的情況下並非標準收尾。
  - text: 緊接安排下一項肌力測驗以節省時間
    correct: false
    why_wrong: 緩和運動的目的正是讓心率與血流逐步回復，立即再測會把疲勞帶進下一項，混淆後續結果。
- id: ch12.reliability.i03.q1
  item: ch12.reliability.i03
  dco: pa3.C.1
  lang: zh
  cognitive: application
  stem: 兩位運動員在同一日重測 40 碼衝刺，分數出現小幅差異，最可能源自哪一類典型測量誤差？
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: 器材誤差與運動員的生物變異
    correct: true
  - text: 評分者對起跑犯規的判定寬嚴不一
    correct: false
    why_wrong: 衝刺計時多以電子感測為主，且此題問的是受測者本身分數變動的來源，與評分者判斷無關。
  - text: 運動員賽季目標設定不一致
    correct: false
    why_wrong: 目標設定屬於訓練計畫層次的決策，並不會在同日重測之間造成可測得的分數差異。
- id: ch12.safety.i03.q1
  item: ch12.safety.i03
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 在高溫環境中安排大量用力的跑步測驗時，最應優先考量的施測風險為何？
  locator: Test Administration > Health and Safety Considerations
  options:
  - text: 熱傷害風險且濕度高時加劇
    correct: true
  - text: 計時器讀數的系統性偏差
    correct: false
    why_wrong: 計時誤差屬於測量品質問題，與環境溫濕度沒有直接放大關係。
  - text: 運動員對測驗目的理解不足
    correct: false
    why_wrong: 動機與理解屬於施測者指示層次，並不會因環境溫濕度而被顯著放大。
- id: ch12.safety.i04.q1
  item: ch12.safety.i04
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 預期當日氣溫逼近圖示熱指數上限時，熱中有氧耐力測驗最應如何調整？
  locator: Test Administration > Health and Safety Considerations > Aerobic Endurance Testing in the Heat
  options:
  - text: 比圖示上限再降低華氏 5 度
    correct: true
  - text: 仍依圖示上限施測，不需額外保留邊際
    correct: false
    why_wrong: 直接套用圖示上限忽略了原書要求的緩衝邊際，會讓晴天條件下的施測承擔不必要的熱傷害風險。
  - text: 把測驗距離加倍以加快完成
    correct: false
    why_wrong: 加長距離會拉長熱暴露時間，與本章降低風險的方向完全相反。
- id: ch12.safety.i07.q1
  item: ch12.safety.i07
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 熱中運動持續時間在何種範圍內，最適當的飲水選擇為何？
  locator: Test Administration > Health and Safety Considerations > Aerobic Endurance Testing in the Heat
  options:
  - text: 至多 1 小時的運動以白開水為主
    correct: true
  - text: 不論時間長短一律改用含電解質運動飲料
    correct: false
    why_wrong: 短時間運動補充電解質的必要性低，本章只在較長時間情境下把點心休息視為可能的補充時機。
  - text: 全程禁止飲水以避免腸胃不適
    correct: false
    why_wrong: 熱中運動期間應鼓勵飲水，完全禁止反而提高熱傷害風險。
- id: ch12.safety.i08.q1
  item: ch12.safety.i08
  dco: pa3.B.2
  lang: zh
  cognitive: analysis
  stem: 一名運動員熱中跑步後出現極度稀釋尿液、皮膚浮腫與意識改變，但體溫未升高，最優先的處置為何？
  locator: Test Administration > Health and Safety Considerations > Aerobic Endurance Testing in the Heat
  options:
  - text: 立即停止補液並交由醫師處置
    correct: true
  - text: 給予大量冰水以加速降溫
    correct: false
    why_wrong: 體溫未升高代表並非典型熱病，持續補液會使血鈉進一步被稀釋而惡化低血鈉症。
  - text: 繼續低強度跑步以促進血液循環
    correct: false
    why_wrong: 意識已出現改變時繼續活動會延誤就醫，且低血鈉症本身就是本章要求立即停止運動的狀況。
- id: ch12.selection-factors.i02.q1
  item: ch12.selection-factors.i02
  dco: pa1.A.3
  lang: zh
  cognitive: application
  stem: 對不涉及垂直跳的冰球選手施測時，最需要調整的測驗特異性考量為何？
  locator: Test Selection > Biomechanical Movement Pattern Specificity
  options:
  - text: 改用以水平動作為主的測驗
    correct: true
  - text: 沿用垂直跳作為主要爆發力測驗
    correct: false
    why_wrong: 垂直跳的動作型態與冰球比賽需求不一致，作為主要爆發力測驗會降低內容效度。
  - text: 改為單次最大握力測驗
    correct: false
    why_wrong: 握力與冰球的滑行、衝刺與變向動作型態差距過大，並未回應動作模式特異性的要求。
- id: ch12.selection-factors.i03.q1
  item: ch12.selection-factors.i03
  dco: pa1.A.3
  lang: zh
  cognitive: application
  stem: 對剛開始學習該動作的運動員，選擇高技術要求測驗時最應注意的限制為何？
  locator: Test Selection > Experience and Training Status
  options:
  - text: 無法假定不佳技術不會損害測驗表現
    correct: true
  - text: 必須改用實驗室測量以提高精密度
    correct: false
    why_wrong: 本章的限制來自受測者的技術經驗，而非測量精密度；換成實驗室並不能解決技術不熟造成的變異。
  - text: 必須把測驗改為長時間低強度型態
    correct: false
    why_wrong: 把測驗改成不同強度並未回應技術不熟的限制，原項目的動作型態仍是問題所在。
- id: ch12.selection-factors.i04.q1
  item: ch12.selection-factors.i04
  dco: pa1.A.3
  lang: zh
  cognitive: analysis
  stem: 一名棒球員主要從事間歇與短跑訓練，秋季訓練開始前一週最不宜安排下列何種測驗？
  locator: Test Selection > Experience and Training Status
  options:
  - text: 長距離跑的有氧耐力測驗
    correct: true
  - text: 10 公尺衝刺的分段計時
    correct: false
    why_wrong: 短距離衝刺屬於棒球員既有的訓練型態，符合其訓練狀態，並未違反本章的測驗選擇原則。
  - text: 站姿體前彎的柔軟度測量
    correct: false
    why_wrong: 柔軟度量測對能量系統與技術要求皆低，並不會因訓練狀態而構成選擇障礙。
- id: ch12.selection-factors.i07.q1
  item: ch12.selection-factors.i07
  dco: pa1.A.3
  lang: zh
  cognitive: application
  stem: 在海拔約 6,000 英尺的場地對籃球員施測時，下列哪一項測驗最需要調整常模？
  locator: Test Selection > Environmental Factors
  options:
  - text: 最大攝氧量測驗
    correct: true
  - text: 深蹲 1RM 測驗
    correct: false
    why_wrong: 本章明確指出海拔不損害肌力與爆發力測驗表現，無須調整常模。
  - text: 站姿體前彎柔軟度量測
    correct: false
    why_wrong: 柔軟度量測的能量系統需求極低，海拔對其表現與常模的影響不在本章討論範圍內。
- id: ch12.validity.i01.q1
  item: ch12.validity.i01
  dco: pa3.C.1
  lang: zh
  cognitive: analysis
  stem: 下列哪一項條件最能同時體現構念效度與體能測驗的可實施性？
  locator: Evaluation of Test Quality > Validity > Construct Validity
  options:
  - text: 量到目標能力並區分水準
    correct: true
  - text: 動用越多不同肌群越好
    correct: false
    why_wrong: 動用越多肌群並不保證構念對應，且可能違反區辨效度所要避免的高度重複測驗。
  - text: 完成時間越短越好
    correct: false
    why_wrong: 時間短只是施測便利，無法取代構念對應與區分能力的核心要求。
- id: ch12.administration.i05.q1
  item: ch12.administration.i05
  dco: pa3.B.2
  lang: en
  cognitive: application
  stem: Before a 1RM back squat test, which warm-up arrangement best balances athlete preparation with measurement consistency?
  locator: Test Administration > Preparing Athletes for Testing
  options:
  - text: 2 to 3 sport-specific warm-up attempts after general warm-up
    correct: true
  - text: Skip warm-up and begin immediately with the test load
    correct: false
    why_wrong: Skipping sport-specific warm-ups leaves learning and readiness effects embedded in the early scored trials, undermining comparisons across sessions.
  - text: Use only a light jog with no specific squat rehearsal
    correct: false
    why_wrong: A general-only warm-up does not replicate the squat motor pattern and neural recruitment needed before 1RM attempts.
- id: ch12.safety.i02.q1
  item: ch12.safety.i02
  dco: pa3.B.2
  lang: en
  cognitive: application
  stem: Even with medical clearance to train, which type of test most requires ongoing health monitoring during administration?
  locator: Test Administration > Health and Safety Considerations
  options:
  - text: Maximal-effort tests such as 1RM lifts
    correct: true
  - text: Skinfold and girth measurements
    correct: false
    why_wrong: Anthropometric measurements impose negligible cardiovascular stress and rarely reveal or worsen underlying cardiac conditions.
  - text: Low-intensity indoor cycling warm-up
    correct: false
    why_wrong: A low-intensity cycling warm-up does not approach the maximal-effort scenario that the chapter flags for cardiac surveillance.
- id: ch12.selection-factors.i01.q1
  item: ch12.selection-factors.i01
  dco: pa1.A.3
  lang: zh
  cognitive: analysis
  stem: 為籃球員選擇跑動測驗時，最需要先掌握的是哪一項特異性原則？
  locator: Test Selection > Metabolic Energy System Specificity
  options:
  - text: 模擬比賽的能量需求與衝刺距離方向
    correct: true
  - text: 採用實驗室等級的氣體分析設備
    correct: false
    why_wrong: 本章強調的是測驗內容是否對應運動需求，而非設備等級；氣體分析屬於實驗室資源，不是選擇場地測驗的優先考量。
  - text: 完全排除磷酸原系統的介入以免混淆
    correct: false
    why_wrong: 籃球實戰本就高度動用磷酸原系統，將其排除反而違背了模擬比賽能量需求的特異性原則。
- id: ch12.selection-factors.i08.q1
  item: ch12.selection-factors.i08
  dco: pa1.A.3
  lang: zh
  cognitive: analysis
  stem: 為美式足球防守線鋒與外接手分別選擇測驗時，下列何種安排最符合動作特異性？
  locator: Test Selection > Biomechanical Movement Pattern Specificity
  options:
  - text: 防守線鋒側重推的肌力與短距離衝刺
    correct: true
  - text: 兩者皆以最大攝氧量測驗為主要篩選項目
    correct: false
    why_wrong: 有氧耐力並非本章為這兩個位置所列的主要身體需求，作為共同篩選項目並未對應其動作特異性。
  - text: 兩者皆以握力測驗作為肌力指標
    correct: false
    why_wrong: 握力無法區分防守線鋒所需的推的肌力與外接手所需的衝刺能力，違反內容效度的要求。
- id: ch12.test-sequence.i01.q1
  item: ch12.test-sequence.i01
  dco: pa3.B.2
  lang: en
  cognitive: application
  stem: When sequencing a same-day test battery, what is the minimum recovery interval before administering another test after a maximal anaerobic glycolytic test?
  locator: Test Administration > Sequence of Tests
  options:
  - text: At least 1 hour
    correct: true
  - text: At least 5 minutes
    correct: false
    why_wrong: Five minutes is the general between-test minimum in the chapter, not the full-recovery threshold for maximal glycolytic tests.
  - text: At least 3 minutes
    correct: false
    why_wrong: Three minutes is the between-trial minimum for near-maximal strength attempts, insufficient as the recovery standard for maximal glycolytic tests.
- id: ch12.test-sequence.i08.q1
  item: ch12.test-sequence.i08
  dco: pa3.B.2
  lang: en
  cognitive: recall
  stem: Where in the chapter's recommended test sequence should the 1.5-mile run be administered?
  locator: Test Administration > Sequence of Tests
  options:
  - text: As the final aerobic capacity test in the battery
    correct: true
  - text: Immediately after the non-fatiguing tests
    correct: false
    why_wrong: Placing the aerobic test right after non-fatiguing measurements introduces fatigue that will contaminate every subsequent category in the battery.
  - text: Before the maximal power and strength tests
    correct: false
    why_wrong: Running an aerobic test before maximal strength attempts leaves fatigue in the system that compromises the heavier lifts.
- id: ch12.test-sequence.i02.q1
  item: ch12.test-sequence.i02
  dco: pa3.B.2
  lang: zh
  cognitive: recall
  stem: 依本章建議的測驗類別順序，下列何者應最先施行？
  locator: Test Administration > Sequence of Tests
  options:
  - text: 非疲勞類測驗
    correct: true
  - text: 敏捷性技術測驗
    correct: false
    why_wrong: 把第二類測驗誤置於第一類；敏捷屬於技術性測驗，須在可能造成疲勞的測驗之前，但仍排在非疲勞測驗之後。
  - text: 疲勞性無氧測驗
    correct: false
    why_wrong: 把順序末端的高疲勞性測驗當成起點；這類測驗接近順序末端，因為疲勞最容易損害後續表現。
- id: ch12.test-sequence.i04.q1
  item: ch12.test-sequence.i04
  dco: pa3.B.2
  lang: zh
  cognitive: recall
  stem: 依本章建議的測驗類別順序，最大爆發力與肌力測驗應安排在何時施行？
  locator: Test Administration > Sequence of Tests
  options:
  - text: 敏捷之後、衝刺之前
    correct: true
  - text: 衝刺之後、肌耐力之前
    correct: false
    why_wrong: 把第三類與第四類順序對調；衝刺應在最大肌力之後，而非之前。
  - text: 非疲勞之後再安排
    correct: false
    why_wrong: 把高疲勞性的最大肌力測驗排在非疲勞測驗之後，會讓後續所有測驗都帶著疲勞。
- id: ch12.test-sequence.i05.q1
  item: ch12.test-sequence.i05
  dco: pa3.B.2
  lang: en
  cognitive: recall
  stem: In the chapter's suggested test sequence, where are sprint tests placed relative to the maximal power and strength tests?
  locator: Test Administration > Sequence of Tests
  options:
  - text: After maximal power and strength tests
    correct: true
  - text: Before non-fatiguing measurements
    correct: false
    why_wrong: Places sprints at the very start; sprints would fatigue every later test and violate the order's logic.
  - text: Between agility and maximal strength tests
    correct: false
    why_wrong: Puts sprints before maximal power and strength; the chapter orders sprints after strength because fatigue from strength trials would compromise sprint performance.
- id: ch12.test-sequence.i06.q1
  item: ch12.test-sequence.i06
  dco: pa3.B.2
  lang: zh
  cognitive: recall
  stem: 依本章建議的測驗類別順序，局部肌耐力測驗應安排在何時施行？
  locator: Test Administration > Sequence of Tests
  options:
  - text: 衝刺之後、無氧容量之前
    correct: true
  - text: 敏捷之後、最大爆發力之前
    correct: false
    why_wrong: 把局部肌耐力排在很前面；肌耐力測驗會產生局部疲勞，干擾後續的最大肌力與爆發力測驗。
  - text: 有氧容量測驗之後施行
    correct: false
    why_wrong: 把局部肌耐力排在邏輯順序的最後；本章把有氧容量測驗安排在最後一類，以避免疲勞影響先前所有測驗。
- id: ch12.test-sequence.i07.q1
  item: ch12.test-sequence.i07
  dco: pa3.B.2
  lang: en
  cognitive: application
  stem: A strength and conditioning coach is planning a single-day testing battery and must place a 300-yard (275 m) shuttle test. Which placement is most appropriate?
  locator: Test Administration > Sequence of Tests
  options:
  - text: Near the end, after the local endurance trials
    correct: true
  - text: First, before non-fatiguing measurements
    correct: false
    why_wrong: Places the most fatiguing anaerobic capacity test at the start; this would contaminate every subsequent test with fatigue.
  - text: Right after the agility tests in the order
    correct: false
    why_wrong: Treats the shuttle as a moderate-effort test like agility; the 300-yard shuttle is classified as a fatiguing anaerobic capacity test and belongs near the end.
- id: ch12.validity.i02.q1
  item: ch12.validity.i02
  dco: pa3.C.1
  lang: zh
  cognitive: application
  stem: 一名田徑短跑選手接受 40 公尺衝刺測驗，賽前即表示「這個測驗看起來就是在測我衝刺的速度」。此反應最能用以說明該測驗的哪一種品質？
  locator: Evaluation of Test Quality > Validity > Face Validity
  options:
  - text: 表面效度
    correct: true
  - text: 構念效度
    correct: false
    why_wrong: 把運動員對測驗外觀的觀感當成實際測量到目標能力的程度；構念效度需要專家與統計證據支持，不能由運動員一句話認定。
  - text: 區辨效度
    correct: false
    why_wrong: 把表面效度誤當成測驗區分不同構念的能力；區辨效度需要與不同構念測驗呈低相關，與運動員主觀感受無關。
- id: ch12.validity.i03.q1
  item: ch12.validity.i03
  dco: pa3.C.1
  lang: en
  cognitive: application
  stem: A panel of experts is judging whether a basketball test battery proportionally covers all the physical capacities required for the sport. Which type of validity are they most directly evaluating?
  locator: Evaluation of Test Quality > Validity > Content Validity
  options:
  - text: Content validity
    correct: true
  - text: Face validity
    correct: false
    why_wrong: Treats expert judgment about coverage as if it were how the test appears to non-experts; face validity is informal and non-quantitative.
  - text: Concurrent validity
    correct: false
    why_wrong: Confuses coverage of the construct with agreement against another same-ability measure; concurrent validity is a subtype of criterion-referenced validity, not expert coverage judgment.
- id: ch12.validity.i05.q1
  item: ch12.validity.i05
  dco: pa3.C.1
  lang: en
  cognitive: application
  stem: A new skinfold equation is being compared with dual-energy X-ray absorptiometry results taken on the same athletes at the same time. Which type of validity is most directly being established?
  locator: Evaluation of Test Quality > Validity > Criterion-Referenced Validity
  options:
  - text: Concurrent validity
    correct: true
  - text: Predictive validity
    correct: false
    why_wrong: Frames a same-time comparison as a forecast of future performance; predictive validity requires a future criterion, not a same-day criterion.
  - text: Discriminant validity
    correct: false
    why_wrong: Treats agreement between two measures of the same construct as evidence of separation between different constructs; the X-ray and skinfold are both estimating body composition.
- id: ch12.validity.i06.q1
  item: ch12.validity.i06
  dco: pa3.C.1
  lang: zh
  cognitive: analysis
  stem: 某場地有氧能力測驗與實驗室最大攝氧量標準具高度正相關，且所需器材、時間與人力明顯較少。下列對該場地測驗的判斷最符合本章觀點？
  locator: Evaluation of Test Quality > Validity > Criterion-Referenced Validity
  options:
  - text: 具聚合效度且資源要求較低
    correct: true
  - text: 較省時間即構成效度證據
    correct: false
    why_wrong: 把方便當成效度證據；本章明示「資源要求較低」只能作為補充條件，聚合效度本身必須先與標準高度正相關才能成立。
  - text: 場地測驗不必考慮相關程度
    correct: false
    why_wrong: 以為場地測驗的定義就免除效度要求；本章反而明寫場地測驗應展現與標準的聚合效度。
- id: ch12.validity.i07.q1
  item: ch12.validity.i07
  dco: pa3.C.1
  lang: en
  cognitive: analysis
  stem: A basketball talent identification test battery total score is statistically correlated with a composite index of later in-game performance. Which type of validity does this most directly support?
  locator: Evaluation of Test Quality > Validity > Criterion-Referenced Validity
  options:
  - text: Predictive validity
    correct: true
  - text: Concurrent validity
    correct: false
    why_wrong: Treats a future-performance comparison as a same-time comparison; concurrent validity requires another accepted measure of the same ability at the same time.
  - text: Face validity
    correct: false
    why_wrong: Confuses statistical association with future performance for an informal appearance judgment by non-experts; face validity does not require statistical evidence.
- id: ch12.validity.i08.q1
  item: ch12.validity.i08
  dco: pa3.C.1
  lang: zh
  cognitive: analysis
  stem: 某測驗組合中的柔軟度測驗與有氧耐力測驗結果呈現極低相關。下列對這項結果的詮釋，最符合本章區辨效度的定義？
  locator: Evaluation of Test Quality > Validity > Criterion-Referenced Validity
  options:
  - text: 兩項測驗各測到相對獨立的能力成分，可避免重複測驗
    correct: true
  - text: 兩項測驗的信度都很低，應改用同一構念的測驗
    correct: false
    why_wrong: 把低相關誤當成信度問題；區辨效度處理的是測驗是否涵蓋不同構念，與單一測驗的可重複性無關。
  - text: 兩項測驗都缺乏效度，應從測驗組合中刪除
    correct: false
    why_wrong: 把區辨效度的成立誤判為區辨效度的失敗；本章明示低相關是區辨效度的正面證據，不是淘汰測驗的理由。
- id: ch12.terminology.i06.q1
  item: ch12.terminology.i06
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 一名教練在賽季中期重新施測部分選手，並根據結果修改下個微週期的訓練課表。此作法在本章中最應歸類為？
  locator: Testing Terminology
  options:
  - text: 形成
    correct: true
  - text: 後測
    correct: false
    why_wrong: 把期中修改計畫的過程當作整段訓練期的最終評估；後測是用來判定訓練期是否達成目標，不在期中進行。
  - text: 前測
    correct: false
    why_wrong: 把賽季中期的施測當作訓練開始前的基準；前測必須在訓練開始前施行，與本情境時間點不符。
- id: ch12.terminology.i07.q1
  item: ch12.terminology.i07
  dco: pa3.B.2
  lang: en
  cognitive: analysis
  stem: A coach schedules midtests at regular intervals during the training year and uses them to adjust individual programs. Beyond monitoring progress, which additional benefit does the chapter most directly attribute to this practice?
  locator: Testing Terminology
  options:
  - text: It helps keep training fresh and prevents mental and physical staleness
    correct: true
  - text: It replaces the need for any posttest at the end of the macrocycle
    correct: false
    why_wrong: Treats regular midtests as a substitute for end-of-cycle evaluation; the chapter still treats posttests as the standard for judging whether goals were met.
  - text: It guarantees that every athlete reaches the team goal
    correct: false
    why_wrong: Promotes regular feedback as a guarantee of outcomes; midtests monitor progress but cannot ensure that performance goals will be achieved.
- id: ch12.why-test.i02.q1
  item: ch12.why-test.i02
  dco: pa3.B.1
  lang: zh
  cognitive: analysis
  stem: 教練在季初測驗後，針對「可改變 vs. 先天難以改變」的結果進行分組討論。下列對此做法的詮釋，最符合本章？
  locator: Reasons for Testing > Identification of Physical Abilities in Need of Improvement
  options:
  - text: 適當的測驗分析有助於判斷哪些特質可作為訓練介入目標
    correct: true
  - text: 所有低分項目都應排入訓練計畫，與先天或後天無關
    correct: false
    why_wrong: 把每一項低分都當成可訓練目標；本章明示有些身體能力是先天且不易改變，並非所有弱項都適合介入。
  - text: 測驗結果只能用於天賦篩選，不可用於訓練決策
    correct: false
    why_wrong: 把「辨識需要改善的身體能力」窄化為天賦評估；本章在同節就把這項用途定位為規劃訓練介入的依據。
- id: ch12.safety.i05.q1
  item: ch12.safety.i05
  dco: pa3.B.1
  lang: zh
  cognitive: analysis
  stem: 教練帶領田徑隊從 15°C 的營地抵達 33°C、相對濕度 70% 的比賽地，隔日即安排選手進行最大攝氧量場地測驗。下列對此安排的最優先批評為何？
  locator: Test Administration > Health and Safety Considerations > Aerobic Endurance Testing in the Heat
  options:
  - text: 未遵守至少一週熱適應期，可能危及選手健康並低估有氧表現
    correct: true
  - text: 最大攝氧量測驗時間過長，應改為 30 公尺衝刺測驗
    correct: false
    why_wrong: 把焦點放在測驗項目而非環境風險；本章在此情境的主要警示是熱適應與環境安全，不是測驗長度。
  - text: 熱中運動應一律禁止，應直接取消所有測驗
    correct: false
    why_wrong: 把熱適應的時間要求擴大成全面禁止；本章明示熱中測驗在採取防護措施後可以進行，重點在準備而非取消。
- id: ch12.terminology.i02.q1
  item: ch12.terminology.i02
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 一支大學田徑隊在校內跑道實施不需昂貴器材的最大攝氧量測驗，依本章定義，此測驗最應被歸類為？
  locator: Testing Terminology
  options:
  - text: 場地測驗
    correct: true
  - text: 實驗室測驗
    correct: false
    why_wrong: 以施測地點與資源需求判斷，此測驗在校內跑道施行且無需昂貴設備，與實驗室測驗的條件不符。
  - text: 構念效度測驗
    correct: false
    why_wrong: 把施測分類與效度類型混為一談；構念效度是測驗品質的評估面向，不是按地點與資源區分的測驗類別。
- id: ch12.terminology.i03.q1
  item: ch12.terminology.i03
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 教練在施測當天將每位選手的垂直跳成績、體重與皮脂厚度逐一登錄於計分表。依本章定義，此步驟最屬於下列哪一項？
  locator: Testing Terminology
  options:
  - text: 測量
    correct: true
  - text: 評估
    correct: false
    why_wrong: 把資料登錄當作決策分析；本章明示評估是為做決策而分析測驗結果的過程，與收集資料本身不同。
  - text: 形成性
    correct: false
    why_wrong: 把單次登錄成績擴張為依中測進行的定期再評估；形成性評估需要訓練期間反覆取得資料，不只是當天收集。
- id: ch12.terminology.i05.q1
  item: ch12.terminology.i05
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 教練在為期 12 週的肌力訓練計畫開始前一天，對全隊實施深蹲 1RM 與 20 公尺衝刺測驗。依本章定義，此測驗在時程上最符合下列何種定位？
  locator: Testing Terminology
  options:
  - text: 前測
    correct: true
  - text: 中測
    correct: false
    why_wrong: 把訓練起始前的施測當作訓練期間的進度檢核；中測是在訓練期間施行一次或多次，與本情境時點不同。
  - text: 後測
    correct: false
    why_wrong: 把訓練前的基準測驗當作訓練結束後的成功判定；後測是用來判定整段訓練期是否達成目標。
- id: ch12.terminology.i08.q1
  item: ch12.terminology.i08
  dco: pa3.B.2
  lang: zh
  cognitive: application
  stem: 一名教練於賽季結束後對全隊再次施測垂直跳與 1RM 深蹲，並用以判斷本賽季的訓練計畫是否達成既定目標。依本章定義，此作法最符合？
  locator: Testing Terminology
  options:
  - text: 評估
    correct: true
  - text: 測量
    correct: false
    why_wrong: 把判定目標是否達成的決策步驟當作資料收集本身；本章明示測量只處理資料收集，決策屬於評估。
  - text: 形成性
    correct: false
    why_wrong: 以為賽後決策屬於期中反覆進行的再評估；形成性評估需要中測在訓練期中規律提供資料，不適用於賽後判斷目標。
- id: ch12.why-test.i01.q1
  item: ch12.why-test.i01
  dco: pa3.A.3
  lang: zh
  cognitive: application
  stem: 一名大學教練對來自不同球隊、競賽經驗不明的轉學生候選人安排 1RM 深蹲、垂直跳與 20 公尺衝刺測驗，以判斷其身體潛力是否能結合技術訓練成為可用之才。依本章，此用途最符合？
  locator: Reasons for Testing > Assessment of Athletic Talent
  options:
  - text: 評估運動才能
    correct: true
  - text: 辨識可改善特質
    correct: false
    why_wrong: 把選才評估誤當成訓練標的辨識；本章明示後者用於分辨可作為訓練介入目標的特質，與判斷候選人是否值得培育不同。
  - text: 形成性評估支援
    correct: false
    why_wrong: 將單次選才施測當作訓練期間的反覆再評估；形成性評估需要中測在訓練期中規律提供資料，不適用於候選人評估情境。
- id: ch12.administration.i02.q2
  item: ch12.administration.i02
  dco: pa3.B.2
  lang: en
  cognitive: application
  stem: A university testing battery includes a deep vertical jump and a subjective movement-skill rating. When two testers cannot both administer every item, which arrangement best preserves interrater reliability for the subjective rating?
  locator: Test Administration > Test Format
  options:
  - text: assign the subjective rating to the most experienced tester for every athlete
    correct: true
  - text: let the two testers alternate the subjective rating at random across athletes
    correct: false
    why_wrong: Random alternation introduces between-tester differences directly into the subjective scores; the chapter calls for assigning judgment-requiring tests to the most skilled tester rather than equal rotation.
  - text: have both testers score each athlete together and average their ratings
    correct: false
    why_wrong: Averaging two judges still leaves each athlete exposed to different rating behavior; the chapter treats assignment of skilled judgment as the primary way to protect interrater reliability.
- id: ch12.terminology.i04.q1
  item: ch12.terminology.i04
  dco: pa3.B.2
  lang: en
  cognitive: analysis
  stem: After collecting vertical jump and 1RM squat scores, a coach weighs the results against the team's training goals and decides to add an Olympic lifting block. Which step in the testing process does this decision most directly represent?
  locator: Testing Terminology
  options:
  - text: evaluation, because the scores are being analyzed to make a training decision
    correct: true
  - text: measurement, because the scores were collected during the testing session
    correct: false
    why_wrong: Data collection is the prior step; once the coach weighs the scores against goals and chooses an action, the process has moved past measurement into evaluation.
  - text: formative evaluation, because the decision changes the next training block
    correct: false
    why_wrong: Formative evaluation requires midtests repeated at regular intervals during training; a single post-collection decision point does not by itself establish that pattern.
- id: ch12.reliability.i05.q2
  item: ch12.reliability.i05
  dco: pa3.B.2
  lang: en
  cognitive: recall
  pool: extra
  stem: When two testers consistently produce different scores for the same athletes on the same test, which quality of the test is most directly compromised?
  locator: Evaluation of Test Quality > Reliability
  options:
  - text: Interrater reliability, which reflects how consistently different evaluators score the same performance.
    correct: true
  - text: Construct validity, which concerns whether the test measures the underlying ability it claims to measure.
    correct: false
    why_wrong: A learner who remembers the reliability-versus-validity distinction may still confuse the two and assume any scoring disagreement raises doubts about what the test measures, when the issue here is purely agreement between scorers.
  - text: Test-retest reliability, which concerns score stability when the same testers repeat the test on a later occasion.
    correct: false
    why_wrong: A reader who treats any repeated-measurement concern as a stability issue may pick this option because two testers are involved, overlooking that test-retest reliability addresses the same testers repeating the test, not different scorers disagreeing at one sitting.
