id: ch14
weight: 14
title: Ch.14 Warm-Up and Flexibility Training
topics:
- id: ballistic-stretch
  title: 彈震式拉伸 Ballistic Stretch
  desc: ''
  tag: 拉伸類型
  items:
  - id: ch14.ballistic-stretch.i01
    q: 彈震式拉伸的定義
    a:
    - 彈震式拉伸（ballistic stretch）通常包含主動的肌肉用力與彈跳式動作，終點位置不維持。
    detail: 「終點不維持」是它與靜態拉伸的明確區別；教材以坐姿體前彎的快速彈跳作為示例。
    terms:
    - ballistic-stretch
    numbers: []
    concepts:
    - technique
    related:
    - ch18.mechanical-models.i01
    - ch01.proprioception.stretch-reflex
    locator: Types of Stretching > Ballistic Stretch
  - id: ch14.ballistic-stretch.i02
    q: 彈震式拉伸與牽張反射
    a:
    - 彈震式拉伸通常會引發牽張反射（stretch reflex），使被牽拉的肌肉不易放鬆，因而可能限制關節活動範圍（range of motion, ROM）。
    detail: 這是「通常」而非必然結果；訓練時應監控是否已出現限制動作範圍的反射性收縮。
    terms:
    - ballistic-stretch
    - stretch-reflex
    - range-of-motion
    numbers: []
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.stretch-reflex
    - ch18.ssc.i06
    locator: Types of Stretching > Ballistic Stretch
  - id: ch14.ballistic-stretch.i03
    q: 對關節活動範圍的效果
    a:
    - 教材指出，彈震式拉伸在增加關節活動範圍（range of motion, ROM）上，已被證實與靜態拉伸同樣有效。
    - 它可在柔軟度發展計畫中扮演角色。
    detail: 「同樣有效」僅指教材引用研究中的 ROM 改善，不能推論它在所有訓練情境都優於或等同其他方法。
    terms:
    - ballistic-stretch
    - range-of-motion
    - static-stretch
    numbers: []
    concepts:
    - technique
    related:
    - ch13.balance-flexibility-bc.i07
    - ch15.body-positioning.i06
    locator: Types of Stretching > Ballistic Stretch
  - id: ch14.ballistic-stretch.i04
    q: 使用時的風險與準備
    a:
    - 彈震式拉伸若未適當控制或安排，可能傷害肌肉或結締組織，尤其是已有舊傷時。
    - 使用前應確認運動員在急性及長期層面都已適當準備；既往受傷者要格外謹慎。
    detail: 教材不是全面禁止此法，而是把風險與控制、動作安排及既往受傷情形連在一起。
    terms:
    - ballistic-stretch
    numbers: []
    concepts:
    - technique
    - safety
    related:
    - ch22.injury-prevention.i01
    - ch18.safety.i03
    locator: Types of Stretching > Ballistic Stretch
  - id: ch14.ballistic-stretch.i05
    q: 與動態拉伸的差異
    a:
    - 動態拉伸（dynamic stretch）不採彈跳，執行時比彈震式拉伸更受控制。
    - 它的 ROM 常小於彈震式拉伸所產生的範圍，但強調主動控制並能到達、維持終點位置。
    detail: 兩者外觀可能相似，但教材將「沒有彈跳」與「全程控制」列為動態拉伸避開彈震式拉伸潛在負面效果的關鍵。
    terms:
    - ballistic-stretch
    - dynamic-stretch
    - range-of-motion
    numbers: []
    concepts:
    - technique
    related:
    - ch18.program-design.i07
    - ch19.training-methods.i04
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.ballistic-stretch.i06
    q: 在柔軟度計畫中的位置
    a:
    - 彈震式拉伸可納入柔軟度發展計畫，但必須確保運動員在當下及長期都已適當準備。
    detail: 本項的適用邊界是柔軟度發展計畫；教材另提它常用於運動前熱身，兩者不能據此當成無條件使用的建議。
    terms:
    - ballistic-stretch
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch17.principles-exam-tips.i01
    - ch18.program-design.i07
    locator: Types of Stretching > Ballistic Stretch
  - id: ch14.ballistic-stretch.i07
    q: 牽張反射的訓練監控
    a:
    - 彈震式拉伸通常會觸發牽張反射（stretch reflex）；它不讓受牽拉肌肉放鬆，可能限制 ROM。
    - 體能訓練專業人員應在訓練中監控這個反射。
    detail: 監控的目的不是把反射視為診斷結果，而是觀察它是否正限制動作範圍與拉伸目的。
    terms:
    - ballistic-stretch
    - stretch-reflex
    - range-of-motion
    numbers: []
    concepts:
    - technique
    - reflex
    - professional
    related:
    - ch01.proprioception.stretch-reflex
    - ch18.ssc.i06
    locator: Types of Stretching > Ballistic Stretch
  - id: ch14.ballistic-stretch.i08
    q: 快速拉伸的反射性限制
    a:
    - 快速的彈震式或動態拉伸可能刺激肌梭（muscle spindle），造成牽張反射（stretch reflex）。
    - 因此，快速動作可能使受牽拉肌肉收縮並限制 ROM；靜態拉伸的緩慢動作則不會引發該反射。
    detail: 教材對動態拉伸使用「可能」刺激肌梭；不應把所有動態拉伸一律等同於必然引發牽張反射。
    terms:
    - ballistic-stretch
    - dynamic-stretch
    - muscle-spindle
    - stretch-reflex
    - static-stretch
    - range-of-motion
    numbers: []
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.spindle
    - ch18.ssc.i06
    locator: Flexibility > Proprioceptors and Stretching
- id: dynamic-stretch
  title: 動態拉伸 Dynamic Stretch
  desc: ''
  tag: 拉伸類型
  items:
  - id: ch14.dynamic-stretch.i01
    q: 動態拉伸的定義
    a:
    - 動態拉伸（dynamic stretch）是以功能為基礎、用運動通用或專項動作讓關節主動通過運動所需 ROM 的拉伸。
    - 它有時稱為活動度操練（mobility drills），重點是運動或活動的動作要求，而不是單一肌肉。
    detail: 教材以跑者的行走抬膝模擬衝刺抬膝為例，說明「專項」是動作模式的對應，而非只指定某一塊肌肉。
    terms:
    - dynamic-stretch
    - mobility-drills
    - range-of-motion
    numbers: []
    concepts:
    - technique
    related:
    - ch19.sprint-technique.i02
    - ch17.exercise-selection.i05
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.dynamic-stretch.i02
    q: 與彈震式拉伸的關鍵差異
    a:
    - 動態拉伸不含彈跳，且比彈震式拉伸（ballistic stretch）更受控制。
    - 它產生的 ROM 常較小，但運動員必須能主動控制整個範圍，並到達和維持終點位置。
    detail: 教材把控制能力視為差異的核心；ROM 較小不是缺點的斷言，而是常見的結果。
    terms:
    - dynamic-stretch
    - ballistic-stretch
    - range-of-motion
    numbers: []
    concepts:
    - technique
    related:
    - ch01.proprioception.spindle
    - ch18.ssc.i05
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.dynamic-stretch.i03
    q: 熱身時的優點
    a:
    - 動態拉伸能促進動態柔軟度，並複製運動所需的動作模式與 ROM。
    - 它可維持 RAMP 提升階段的溫度效益、把多個關節整合在同一動作，且研究顯示可改善後續跑步表現。
    detail: 這些優點與其在熱身中逐漸成為首選有關；教材的「首選」限定為多數運動的熱身情境。
    terms:
    - dynamic-stretch
    - range-of-motion
    - ramp
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch18.program-design.i07
    - ch19.sprint-technique.i02
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.dynamic-stretch.i04
    q: 設計的起點
    a:
    - 先仔細分析該運動的主要動作模式及其中需要的 ROM。
    - 再選擇能以一連串動態拉伸複製這些動作的練習。
    detail: 此程序可使柔軟度計畫高度專項化；它依據的是運動的動作需求，不是先從單一肌肉名單開始。
    terms:
    - dynamic-stretch
    - range-of-motion
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch17.needs-analysis.i01
    - ch19.training-methods.i04
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.dynamic-stretch.i05
    q: 重複與進展原則
    a:
    - 每個動作可原地或在指定距離中做 5 至 10 次重複。
    - 每次重複盡可能逐步增加 ROM；後續組數可加快速度，但全程維持控制。
    detail: 動態拉伸的進展是逐步的；教材明確要求不可為了更大 ROM 而犧牲良好技術。
    terms:
    - dynamic-stretch
    - range-of-motion
    numbers:
    - v: 5-10
      unit: 次
      of: 每個動態拉伸動作建議的重複次數
    concepts:
    - technique
    - safety
    related:
    - ch18.intensity-volume.i05
    - ch19.program-design-monitoring.i01
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.dynamic-stretch.i06
    q: 對靜態 ROM 的限制
    a:
    - 動態拉伸雖適合作為熱身，增加靜態 ROM 的效果可能不如靜態拉伸（static stretch）或本體感覺神經肌肉誘發（proprioceptive neuromuscular facilitation, PNF）拉伸。
    - 若目標是增加靜態 ROM，教材表示可優先考慮靜態或 PNF 方法。
    detail: 這是針對「增加靜態 ROM」的比較，不能解讀成動態拉伸不適合熱身或不具運動專項價值。
    terms:
    - dynamic-stretch
    - static-stretch
    - proprioceptive-neuromuscular-facilitation
    - range-of-motion
    numbers: []
    concepts:
    - technique
    related:
    - ch13.balance-flexibility-bc.i07
    - ch22.maturation-phase.i06
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.dynamic-stretch.i07
    q: 動作技術的整合
    a:
    - 動態拉伸若模擬運動技能，應同時強調該動作的關鍵技能因素與有效身體力學。
    - 例如以抬膝操練熱身時，教材要求同時強調抬起腳踝的背屈；動態拉伸不得破壞適當運動技術。
    detail: 這使動態拉伸同時成為動作技術的複習，而不是在熱身時另行接受較差的動作品質。
    terms:
    - dynamic-stretch
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch15.exercise-technique-fundamentals.i02
    - ch19.sprint-technique.i02
    locator: Types of Stretching > Dynamic Stretch
  - id: ch14.dynamic-stretch.i08
    q: 有效熱身所需時間
    a:
    - 使用動態拉伸的有效熱身可在 10 至 15 分鐘內完成。
    detail: 這是教材對「使用動態拉伸的有效熱身」的時間敘述，不是每一種運動或完整熱身都必須固定在此區間。
    terms:
    - dynamic-stretch
    numbers:
    - v: 10-15
      unit: 分鐘
      of: 使用動態拉伸完成有效熱身所需的時間
    concepts:
    - technique
    - program-design
    related:
    - ch18.program-design.i07
    - ch12.administration.i05
    locator: Types of Stretching > Dynamic Stretch
- id: flexibility-factors
  title: 影響柔軟度的因素 Flexibility Factors
  desc: ''
  tag: 柔軟度
  items:
  - id: ch14.flexibility-factors.i01
    q: 關節結構如何影響 ROM
    a:
    - 關節結構決定關節活動範圍（range of motion, ROM）；關節種類、關節面形狀及周圍軟組織都會影響它。
    - 髖與肩的球窩關節（ball-and-socket joint）可在所有解剖平面活動、ROM 最大；腕的橢球關節（ellipsoidal joint）與膝的改良鉸鏈關節（hinge joint）則較小。
    detail: 教材比較的是髖、肩相對於腕與膝；腕主要在矢狀面與額狀面活動，膝主要在矢狀面活動。
    terms:
    - range-of-motion
    - ball-and-socket-joint
    - ellipsoidal-joint
    - hinge-joint
    numbers: []
    concepts:
    - structure
    related:
    - ch01.skeleton.synovial-joint
    - ch02.joint-biomechanics.i04
    locator: Flexibility > Factors Affecting Flexibility > Joint Structure
  - id: ch14.flexibility-factors.i02
    q: 年齡與性別
    a:
    - 年輕人傾向比年長者柔軟，女性傾向比男性柔軟。
    - 年長者會發生纖維化（fibrosis），即纖維性結締組織取代退化的肌纖維；適當運動仍可改善柔軟度。
    detail: 教材將纖維化「很可能」與缺乏活動及較少使用可用 ROM 的傾向連結，並未把年齡視為不可改善的絕對限制。
    terms:
    - fibrosis
    - range-of-motion
    numbers: []
    concepts:
    - structure
    - population
    related:
    - ch07.aging-musculoskeletal.i08
    - ch07.female-physiology.i08
    locator: Flexibility > Factors Affecting Flexibility > Age and Sex
  - id: ch14.flexibility-factors.i03
    q: 肌肉與結締組織
    a:
    - 肌肉、肌腱肌肉單位、肌腱、韌帶、筋膜鞘、關節囊與皮膚都可能限制 ROM。
    - 結締組織的彈性（elasticity）與塑性（plasticity）會影響 ROM；拉伸可利用其塑性潛力。
    detail: 各組織在急性或慢性柔軟度改變中的相對貢獻及個體差異，教材皆說仍不清楚。
    terms:
    - range-of-motion
    - elasticity
    - plasticity
    numbers: []
    concepts:
    - structure
    related:
    - ch05.connective-tissue.i06
    - ch01.muscle-structure.epimysium
    locator: Flexibility > Factors Affecting Flexibility > Muscle and Connective Tissue
  - id: ch14.flexibility-factors.i04
    q: 拉伸耐受度的角色
    a:
    - 拉伸耐受度（stretch tolerance）是耐受拉伸不適感的能力。
    - ROM 較大的人傾向有較高耐受度，可承受較大的拉伸負荷；規律拉伸計畫能提高耐受度，因而可能允許柔軟度再增加。
    detail: 教材以「可能允許」表達耐受度與後續柔軟度增加的關係，沒有將它寫成保證效果。
    terms:
    - stretch-tolerance
    - range-of-motion
    numbers: []
    concepts:
    - adaptation
    related:
    - ch05.connective-tissue.i08
    - ch13.balance-flexibility-bc.i07
    locator: Flexibility > Factors Affecting Flexibility > Stretch Tolerance
  - id: ch14.flexibility-factors.i05
    q: 神經控制
    a:
    - 運動員能達到的 ROM 最終由中樞與周圍神經系統控制，結構因素的影響較小。
    - 有效的柔軟度計畫應能正向影響傳入與傳出機制，以取得較大的 ROM。
    detail: 教材指出這些機制可引發反射性及有意識的活動，所以 ROM 不能只當作組織結構的結果。
    terms:
    - range-of-motion
    numbers: []
    concepts:
    - motor-control
    - reflex
    related:
    - ch01.proprioception.definition
    - ch05.neural-adaptations.i06
    locator: Flexibility > Factors Affecting Flexibility > Neural Control
  - id: ch14.flexibility-factors.i06
    q: 阻力訓練
    a:
    - 完整且適當的阻力訓練計畫可增加柔軟度，並透過較大的 ROM 協助發展施力能力。
    - 但以有限 ROM 進行的大重量阻力訓練可能降低 ROM；為避免流失，應同時訓練主動肌與拮抗肌，並在可用全 ROM 中運動。
    detail: 教材把有效的肌力訓練視為拉伸計畫的輔助，不是以有限活動範圍訓練為代價的替代品。
    terms:
    - range-of-motion
    numbers: []
    concepts:
    - adaptation
    - program-design
    related:
    - ch15.body-positioning.i06
    - ch17.exercise-selection.i06
    locator: Flexibility > Factors Affecting Flexibility > Resistance Training
  - id: ch14.flexibility-factors.i07
    q: 肌肉量
    a:
    - 肌肉量顯著增加可能阻礙關節動作而不利 ROM；教材以大肱二頭肌與三角肌妨礙肱三頭肌拉伸為例。
    - 對鉛球選手或美式足球進攻線員等需要大肌肉量的運動員，肌肉量需求可能優先於極端關節活動度。
    detail: 是否調整訓練以減少肌肉量，必須以該運動對肌肉量與 ROM 的需求權衡，不能一概而論。
    terms:
    - range-of-motion
    numbers: []
    concepts:
    - structure
    - program-design
    related:
    - ch05.hypertrophy.i06
    - ch02.strength-factors.i02
    locator: Flexibility > Factors Affecting Flexibility > Muscle Bulk
  - id: ch14.flexibility-factors.i08
    q: 活動量的影響
    a:
    - 活躍者傾向比不活躍者柔軟，尤其當活動包括拉伸；設計良好的阻力訓練也可增加柔軟度。
    - 但活動量本身不會改善柔軟度；若要維持或增加關節柔軟度，必須做拉伸或需要身體通過完整 ROM 的運動。
    detail: 教材把「是否通過完整 ROM」列為關鍵條件，故不能把一般活動量直接當成柔軟度訓練。
    terms:
    - range-of-motion
    numbers: []
    concepts:
    - adaptation
    - program-design
    related:
    - ch15.body-positioning.i06
    - ch20.periodization.i04
    locator: Flexibility > Factors Affecting Flexibility > Activity Level
- id: pnf-techniques
  title: PNF 拉伸技術 Proprioceptive Neuromuscular Facilitation
  desc: ''
  tag: PNF
  items:
  - id: ch14.pnf-techniques.i01
    q: 保持－放鬆法的三階段
    a:
    - 保持－放鬆（hold-relax）先在輕微不適點做被動預拉 10 秒，再抵抗夥伴的髖屈力做等長收縮 6 秒。
    - 放鬆後做被動拉伸並維持 30 秒；腿後肌活化造成自身抑制（autogenic inhibition），最終拉伸應更大。
    detail: 「保持」是被拉伸拮抗肌的等長收縮，而非主動肌的收縮。
    terms:
    - hold-relax
    - autogenic-inhibition
    numbers:
    - v: 10
      unit: 秒
      of: 保持－放鬆法的被動預拉時間
    - v: 6
      unit: 秒
      of: 保持－放鬆法的等長收縮時間
    - v: 30
      unit: 秒
      of: 保持－放鬆法最後被動拉伸的維持時間
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch22.fibroblastic-phase.i04
    locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Hold-Relax
  - id: ch14.pnf-techniques.i02
    q: 收縮－放鬆法的三階段
    a:
    - 收縮－放鬆（contract-relax）先被動預拉 10 秒，接著對抗夥伴阻力做髖伸的向心收縮，通過完整 ROM。
    - 放鬆後做被動髖屈拉伸並維持 30 秒；增加的 ROM 由腿後肌活化造成的自身抑制促成。
    detail: 與保持－放鬆法的差異在第二階段為通過完整 ROM 的向心收縮。
    terms:
    - contract-relax
    - autogenic-inhibition
    - range-of-motion
    numbers:
    - v: 10
      unit: 秒
      of: 收縮－放鬆法的被動預拉時間
    - v: 30
      unit: 秒
      of: 收縮－放鬆法最後被動拉伸的維持時間
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch22.fibroblastic-phase.i06
    locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Contract-Relax
  - id: ch14.pnf-techniques.i03
    q: 保持－放鬆加主動肌收縮法
    a:
    - 保持－放鬆加主動肌收縮（hold-relax with agonist contraction）的前兩階段與保持－放鬆相同。
    - 第三階段在被動拉伸外，加上主動肌的向心收縮；最後拉伸主要因交互抑制（reciprocal inhibition），次要因自身抑制。
    detail: 以腿後肌為例，等長保持後主動髖屈進入新 ROM；兩種抑制機制的主次不可對調。
    terms:
    - hold-relax-with-agonist-contraction
    - hold-relax
    - reciprocal-inhibition
    - autogenic-inhibition
    numbers: []
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch22.fibroblastic-phase.i07
    locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Hold-Relax With Agonist Contraction
  - id: ch14.pnf-techniques.i04
    q: 自身抑制的機制
    a:
    - 自身抑制（autogenic inhibition）是張力增加的同一肌肉反射性放鬆。
    - 被拉伸肌先主動收縮，張力刺激高爾基腱器（Golgi tendon organ, GTO），使其在後續被動拉伸時放鬆。
    detail: 教材將此機制用於保持－放鬆與收縮－放鬆法；不可與肌梭的牽張反射混淆。
    terms:
    - autogenic-inhibition
    - golgi-tendon-organ
    numbers: []
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch14.pnf-techniques.i01
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.pnf-techniques.i05
    q: 交互抑制的機制
    a:
    - 交互抑制（reciprocal inhibition）是張力增加肌肉的對側肌肉放鬆。
    - 主動肌收縮時，該收縮肌的張力刺激 GTO，使被拉伸肌同步反射性放鬆。
    detail: 教材將它列為保持－放鬆加主動肌收縮法最主要的機制，且此處同樣寫的是 GTO 受刺激。
    terms:
    - reciprocal-inhibition
    - golgi-tendon-organ
    numbers: []
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch14.pnf-techniques.i03
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.pnf-techniques.i06
    q: PNF 的實用性與證據
    a:
    - 本體感覺神經肌肉誘發（proprioceptive neuromuscular facilitation, PNF）可能因促進肌肉抑制而優於其他拉伸法，但證據並非一致。
    - 多數 PNF 拉伸需要夥伴與技巧，因此常不實用。
    detail: 「可能優於」與「證據並非一致」都是教材的保留，不能寫成增加 ROM 效果最佳。
    terms:
    - proprioceptive-neuromuscular-facilitation
    numbers: []
    concepts:
    - technique
    - reflex
    related:
    - ch22.fibroblastic-phase.i07
    - ch13.balance-flexibility-bc.i07
    locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch
  - id: ch14.pnf-techniques.i07
    q: 三種 PNF 技術的共同結構
    a:
    - 三種 PNF 技術都分三階段，第一階段都是被動預拉 10 秒。
    - 第二及第三階段的肌肉動作不同，並由此構成技術名稱。
    detail: 被動靜態拉伸稱為「放鬆」；保持是等長收縮，收縮是向心收縮。
    terms:
    - proprioceptive-neuromuscular-facilitation
    - hold-relax
    - contract-relax
    numbers:
    - v: 10
      unit: 秒
      of: 三種 PNF 技術共同的第一階段被動預拉時間
    concepts:
    - technique
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch14.pnf-techniques.i01
    locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch
  - id: ch14.pnf-techniques.i08
    q: 教材對 PNF 效果的結論
    a:
    - 教材指出，保持－放鬆加主動肌收縮法是最有效的 PNF 技術，因為同時促進交互抑制與自身抑制。
    detail: 此結論是該技術段落的表述；PNF 整體是否優於其他拉伸法仍有前段所述的證據不一致但書。
    terms:
    - hold-relax-with-agonist-contraction
    - proprioceptive-neuromuscular-facilitation
    - reciprocal-inhibition
    - autogenic-inhibition
    numbers: []
    concepts:
    - technique
    - reflex
    related:
    - ch13.balance-flexibility-bc.i07
    - ch05.connective-tissue.i06
    locator: Types of Stretching > Proprioceptive Neuromuscular Facilitation Stretch > Hold-Relax With Agonist Contraction
- id: proprioceptors
  title: 本體感覺器 Proprioceptors
  desc: ''
  tag: 神經控制
  items:
  - id: ch14.proprioceptors.i01
    q: 肌梭的位置與功能
    a:
    - 肌梭（muscle spindle）位於與梭外肌纖維平行的梭內肌纖維，監控肌肉長度變化。
    - 快速拉伸時，肌梭的感覺神經元在脊髓支配運動神經元。
    detail: 教材將肌梭與 GTO 並列為拉伸時須考慮的兩個重要本體感覺器。
    terms:
    - muscle-spindle
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.spindle
    - ch01.proprioception.intrafusal
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.proprioceptors.i02
    q: 牽張反射如何限制 ROM
    a:
    - 快速牽拉刺激肌梭後，運動神經元使先前被拉伸的梭外肌纖維產生肌肉動作，這就是牽張反射（stretch reflex）。
    - 拉伸時應避免它，因為反射性肌肉動作會限制 ROM。
    detail: 這是反射性收縮限制活動範圍的機制，不是增加拉伸幅度的策略。
    terms:
    - muscle-spindle
    - stretch-reflex
    - range-of-motion
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.stretch-reflex
    - ch18.ssc.i06
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.proprioceptors.i03
    q: 高爾基腱器的位置與功能
    a:
    - 高爾基腱器（Golgi tendon organ, GTO）是位於肌腱肌肉交界附近、對肌肉張力增加敏感的機械受器。
    - 受刺激時，GTO 使肌肉反射性放鬆。
    detail: 肌梭監控長度變化，GTO 對張力增加敏感；兩者的刺激條件不可互換。
    terms:
    - golgi-tendon-organ
    - muscle-spindle
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.gto-location
    - ch01.proprioception.gto-function
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.proprioceptors.i04
    q: 自身抑制
    a:
    - 自身抑制（autogenic inhibition）是增加張力的同一肌肉放鬆；先主動收縮被拉伸肌會刺激 GTO，隨後被動拉伸時反射性放鬆。
    - 保持－放鬆與收縮－放鬆皆利用此機制。
    detail: 「自身」指增加張力的同一塊肌肉，不是對側肌肉。
    terms:
    - autogenic-inhibition
    - golgi-tendon-organ
    - hold-relax
    - contract-relax
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch14.pnf-techniques.i01
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.proprioceptors.i05
    q: 交互抑制
    a:
    - 交互抑制（reciprocal inhibition）是被動拉伸肌的對側肌肉張力增加時，受拉伸肌同步反射性放鬆。
    - 收縮肌的張力刺激 GTO；保持－放鬆加主動肌收縮法額外利用此機制。
    detail: 「交互」指對側受拉伸肌的放鬆，而非原先收縮的肌肉自己放鬆。
    terms:
    - reciprocal-inhibition
    - golgi-tendon-organ
    - hold-relax-with-agonist-contraction
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.gto-function
    - ch14.pnf-techniques.i03
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.proprioceptors.i06
    q: 靜態拉伸與肌梭
    a:
    - 靜態拉伸（static stretch）的動作非常緩慢，不會引發牽張反射；肌肉因而可放鬆並允許較大拉伸。
    detail: 教材以較低的受傷可能性說明其優勢；並非宣稱靜態拉伸完全沒有受傷風險。
    terms:
    - static-stretch
    - stretch-reflex
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.spindle
    - ch18.ssc.i05
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.proprioceptors.i07
    q: 快速拉伸與肌梭
    a:
    - 快速的彈震式或動態拉伸可能刺激肌梭並造成牽張反射。
    detail: 教材用「可能」描述快速動態拉伸；彈震式拉伸另有控制不當時傷及組織的風險。
    terms:
    - ballistic-stretch
    - dynamic-stretch
    - muscle-spindle
    - stretch-reflex
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.stretch-reflex
    - ch18.ssc.i05
    locator: Flexibility > Proprioceptors and Stretching
  - id: ch14.proprioceptors.i08
    q: 三種反射結果的對照
    a:
    - 肌梭活化造成被拉伸肌收縮；GTO 活化可造成張力增加的同一肌肉放鬆（自身抑制）。
    - 收縮受拉伸肌的對側主動肌時，GTO 促成被拉伸肌放鬆（交互抑制）。
    detail: 最後兩種情況在教材都涉及 GTO；肌梭對應的是牽張反射。
    terms:
    - muscle-spindle
    - golgi-tendon-organ
    - autogenic-inhibition
    - reciprocal-inhibition
    numbers: []
    concepts:
    - reflex
    related:
    - ch01.proprioception.spindle-vs-gto
    - ch18.ssc.i06
    locator: Flexibility > Proprioceptors and Stretching
- id: ramp-protocol
  title: RAMP 熱身架構 Raise, Activate and Mobilize, and Potentiate
  desc: ''
  tag: 結構設計
  items:
  - id: ch14.ramp-protocol.i01
    q: 提升階段
    a:
    - RAMP 的提升（raise）階段以低強度活動提升體溫、心率、呼吸率、血流及關節液黏度，類似一般熱身。
    - 但活動應模擬即將進行的動作模式或發展運動所需技能，不只是一般有氧運動。
    detail: 從熱身一開始即針對動作與技能，也有助心理準備。
    terms:
    - ramp
    - general-warm-up
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch01.cardiovascular.heart-rate
    - ch03.epoc.i01
    locator: Warm-Up > Targeted and Structured Warm-Ups
  - id: ch14.ramp-protocol.i02
    q: 活化與活動度階段
    a:
    - 活化與活動度（activating and mobilizing）是 RAMP 的單一第二階段，類似典型熱身的拉伸部分。
    - 以深蹲、弓步等關鍵模式為重點；活動度是主動通過 ROM，需結合動作控制、穩定性與柔軟度。
    detail: 教材不是分成 Activate 與 Mobilize 兩個獨立階段。
    terms:
    - ramp
    - range-of-motion
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch15.lower-body.i01
    - ch19.training-methods.i05
    locator: Warm-Up > Targeted and Structured Warm-Ups
  - id: ch14.ramp-protocol.i03
    q: 增強階段
    a:
    - 增強（potentiation）階段類似專項熱身，使用專項活動並逐漸提高強度，直到後續訓練或競賽所需強度。
    - 運動所需速度、肌力與爆發力越高，此階段越重要；傳統熱身常遺漏它。
    detail: 此階段也可在不增加整體訓練時間下，融入速度與敏捷等長期發展內容。
    terms:
    - ramp
    - potentiation
    - specific-warm-up
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch18.ssc.i06
    - ch14.ramp-protocol.i08
    locator: Warm-Up > Targeted and Structured Warm-Ups
  - id: ch14.ramp-protocol.i04
    q: 熱身的時間與間隔
    a:
    - 整個熱身通常持續 10 至 20 分鐘，並應漸進到足以升高肌肉與核心溫度、但不造成疲勞或耗竭能量。
    - 熱身結束後應在 15 分鐘內開始後續活動，超過後正面效果開始消散。
    detail: 較長熱身可出現在熱身本身已是主課表一部分或競賽特定熱身的情況。
    terms:
    - ramp
    numbers:
    - v: 10-20
      unit: 分鐘
      of: 整個熱身通常持續的時間
    - v: 15
      unit: 分鐘
      of: 熱身結束至後續活動開始的最長建議間隔
    concepts:
    - technique
    - program-design
    related:
    - ch13.test-administration.i04
    - ch18.program-design.i07
    locator: Warm-Up > Components of a Warm-Up
  - id: ch14.ramp-protocol.i05
    q: 靜態拉伸的表現證據
    a:
    - 一篇回顧認為短時間靜態拉伸（static stretch）除非維持超過 60 秒，否則不會損害後續表現。
    - 但另一篇統合分析指出，少於 45 秒的拉伸雖有較少表現下降，下降仍存在且可能影響競賽表現。
    detail: 教材明示文獻結論相互衝突；是否在此階段使用靜態拉伸應進行效益－風險分析。
    terms:
    - static-stretch
    numbers:
    - v: 60
      unit: 秒
      of: 該回顧認為超過此維持時間才可能損害後續表現的門檻
    - v: 45
      unit: 秒
      of: 統合分析所稱表現下降較少的靜態拉伸持續時間上限
    concepts:
    - technique
    - program-design
    related:
    - ch13.test-administration.i04
    - ch19.rfd-impulse.i01
    locator: Warm-Up > Targeted and Structured Warm-Ups
  - id: ch14.ramp-protocol.i06
    q: 活化與活動度階段的活動選擇
    a:
    - 拉伸與傷害預防或後續肌肉痠痛之間尚未顯示一致關聯，因此暖身重點應轉向表現。
    - 動態拉伸與活動度練習可維持提升階段的溫度效益、整合多關節與多平面動作，教材視為多數運動熱身的首選。
    detail: 「尚未顯示一致關聯」不是拉伸必然無效的反向斷言，而是教材對目前證據的保留。
    terms:
    - dynamic-stretch
    - ramp
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch18.program-design.i07
    - ch19.sprint-technique.i02
    locator: Warm-Up > Targeted and Structured Warm-Ups
  - id: ch14.ramp-protocol.i07
    q: 熱身的長期規劃
    a:
    - 熱身是訓練的一部分，不是獨立事務；應納入短期、中期及長期考量，以促進整體運動員發展。
    - 多數訓練熱身持續 10 至 20 分鐘，累積於訓練週期中是相當可觀的訓練時間。
    detail: 教材區分競賽與訓練熱身：後者除急性表現外，也可服務長期發展。
    terms:
    - ramp
    numbers:
    - v: 10-20
      unit: 分鐘
      of: 多數訓練熱身持續的時間
    concepts:
    - technique
    - program-design
    related:
    - ch21.periodization-hierarchy.i07
    - ch17.principles-exam-tips.i04
    locator: Warm-Up > Targeted and Structured Warm-Ups
  - id: ch14.ramp-protocol.i08
    q: 競賽與訓練熱身的目的
    a:
    - 競賽熱身以將隨後競賽表現最大化為目標，應有漸進的專項活動以在生理與心理上做好準備。
    - 訓練熱身除為當次課表準備，也應處理運動員的長期需求。
    detail: 兩者都要針對隨後活動，但訓練熱身承擔額外的中、長期發展功能。
    terms:
    - specific-warm-up
    - ramp
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch21.competition-period.i07
    - ch20.periodization.i03
    locator: Warm-Up > Targeted and Structured Warm-Ups
- id: static-stretch
  title: 靜態拉伸 Static Stretch
  desc: ''
  tag: 拉伸類型
  items:
  - id: ch14.static-stretch.i01
    q: 定義
    a:
    - 靜態拉伸（static stretch）緩慢且持續，末端位置維持 15 至 30 秒，並包含受拉伸肌的放鬆與同時延長。
    - 緩慢執行不會引發牽張反射（stretch reflex）。
    detail: 因不引發牽張反射，其受傷可能性低於彈震式拉伸，但太高強度仍可傷及肌肉或結締組織。
    terms:
    - static-stretch
    - stretch-reflex
    numbers:
    - v: 15-30
      unit: 秒
      of: 靜態拉伸末端位置的維持時間
    concepts:
    - technique
    related:
    - ch01.proprioception.stretch-reflex
    - ch22.fibroblastic-phase.i03
    locator: Types of Stretching > Static Stretch
  - id: ch14.static-stretch.i02
    q: 主動 vs 被動
    a:
    - 主動拉伸（active stretch）由拉伸者提供拉伸力。
    - 被動拉伸（passive stretch）由夥伴或拉伸器械提供外力以造成或增強拉伸。
    detail: 這是拉伸力的來源分類，與靜態或動態等動作型態分類不同。
    terms:
    - active-stretch
    - passive-stretch
    numbers: []
    concepts:
    - technique
    related:
    - ch02.musculature.i04
    - ch15.body-positioning.i06
    locator: Types of Stretching
  - id: ch14.static-stretch.i03
    q: 效果
    a:
    - 靜態拉伸容易學習，且已證實可有效改善 ROM。
    - 只要使用正確技術，適合各種運動的所有運動員增加柔軟度。
    detail: 本項的安全性有正確技術與強度適當的前提，不可改寫成完全無風險。
    terms:
    - static-stretch
    - range-of-motion
    numbers: []
    concepts:
    - technique
    related:
    - ch13.balance-flexibility-bc.i03
    - ch05.connective-tissue.i06
    locator: Types of Stretching > Static Stretch
  - id: ch14.static-stretch.i04
    q: 最佳拉伸時機
    a:
    - 訓練或競賽後的拉伸應在 5 至 10 分鐘內進行；增加的肌肉溫度有助 ROM 改善。
    - 若以獨立課程增加柔軟度，應先做徹底的一般熱身；這類課程可作為競賽隔日的恢復課。
    detail: 運動後拉伸可能減少肌肉痠痛，但教材說此證據含糊。
    terms:
    - general-warm-up
    - range-of-motion
    numbers:
    - v: 5-10
      unit: 分鐘
      of: 訓練或競賽後進行拉伸的時間窗
    concepts:
    - technique
    related:
    - ch20.periodization.i04
    - ch03.epoc.i03
    locator: Flexibility > When Should an Athlete Stretch?
  - id: ch14.static-stretch.i05
    q: 頻率建議
    a:
    - 每週拉伸兩次、至少持續五週，已顯示可顯著改善柔軟度。
    - 靜態拉伸通常建議每次 15 至 30 秒；30 秒優於較短時間，超過後效益遞減。
    detail: 教材也說特定拉伸參數指引有限，特別是 PNF 方法。
    terms:
    - static-stretch
    numbers:
    - v: 2
      unit: 次/週
      of: 已顯示可顯著改善柔軟度的拉伸頻率
    - v: 5
      unit: 週
      of: 上述拉伸頻率至少持續的時間
    - v: 15-30
      unit: 秒
      of: 一次靜態拉伸通常建議的持續時間
    concepts:
    - technique
    related:
    - ch17.training-frequency.i01
    - ch13.balance-flexibility-bc.i07
    locator: Flexibility > Frequency, Duration, and Intensity of Stretching
  - id: ch14.static-stretch.i06
    q: 急性效果
    a:
    - 拉伸對 ROM 的急性效果是暫時的，在拉伸後立即最大，隨後下降。
    - 顯著柔軟度改善的持續時間可從 3 分鐘至 24 小時。
    detail: 這正是需要長期專門柔軟度計畫以取得較持久效果的原因。
    terms:
    - range-of-motion
    numbers:
    - v: 3
      unit: 分鐘
      of: 顯著柔軟度急性改善可能持續的最短時間
    - v: 24
      unit: 小時
      of: 顯著柔軟度急性改善可能持續的最長時間
    concepts:
    - technique
    related:
    - ch13.test-administration.i04
    - ch21.fitness-fatigue.i04
    locator: Flexibility > Frequency, Duration, and Intensity of Stretching
  - id: ch14.static-stretch.i07
    q: 注意事項
    a:
    - 拉至輕微不適而非疼痛；不可為增加 ROM 而犧牲關節完整性。
    - 若出現疼痛、放射症狀或感覺喪失，應降低強度。
    detail: 神經與血管結構也會在拉伸中受拉，教材要求監控這些症狀。
    terms:
    - range-of-motion
    numbers: []
    concepts:
    - technique
    related:
    - ch22.sports-medicine-team.i07
    - ch22.injury-prevention.i02
    locator: Flexibility > Frequency, Duration, and Intensity of Stretching
  - id: ch14.static-stretch.i08
    q: 拉伸前提
    a:
    - 所有拉伸課應先有一般活動以提高肌肉溫度。
    - 靜態拉伸指南另要求採有助放鬆的姿勢，單側拉伸兩側都要重複。
    detail: 對活動度過高的關節應小心，且應避免涉及脊柱的組合動作。
    terms:
    - general-warm-up
    - static-stretch
    numbers: []
