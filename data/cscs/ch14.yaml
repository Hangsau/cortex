id: ch14
weight: 14
title: Ch.14 Warm-Up and Flexibility Training
topics:
- id: ballistic-stretch
  title: Ballistic Stretch 彈震拉伸
  desc: ''
  tag: 拉伸類型
  items:
  - id: ch14.ballistic-stretch.i01
    q: 定義
    a:
    - 主動肌肉用力，彈跳式動作，末端不維持不動
    - 例：坐姿體前彎反覆彈跳伸手
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.ballistic-stretch.i02
    q: 誘發牽張反射
    a:
    - 快速拉伸 → 誘發 Muscle Spindle → Stretch Reflex → 肌肉收縮 → 可能限制 ROM
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.ballistic-stretch.i03
    q: 效果
    a:
    - 增加 ROM 效果與靜態拉伸相當
    - 可在柔軟度訓練計畫中使用
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.ballistic-stretch.i04
    q: 風險
    a:
    - 若控制不當或有舊傷，容易傷害肌肉或結締組織
    - 需確保運動員急性與慢性準備度足夠
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.ballistic-stretch.i05
    q: vs 動態拉伸
    a:
    - 外觀相似但有本質差異：彈震有彈跳且末端不控制
    - 動態拉伸有控制、無彈跳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.ballistic-stretch.i06
    q: 使用時機
    a:
    - 在柔軟度發展計畫中可占一席之地
    - 需特別謹慎於有舊傷的運動員
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.ballistic-stretch.i07
    q: 教練監督
    a:
    - S&C 教練需在訓練中監控牽張反射是否被誘發，避免動作受限
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.ballistic-stretch.i08
    q: 考試注意
    a:
    - CSCS 常考：彈震拉伸「誘發牽張反射」→「限制 ROM」
    - 靜態不誘發牽張反射
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
- id: dynamic-stretch
  title: Dynamic Stretch 動態拉伸
  desc: ''
  tag: 拉伸類型
  items:
  - id: ch14.dynamic-stretch.i01
    q: 定義
    a:
    - 功能性拉伸，使用運動通用/專項動作模式，主動帶動關節通過 ROM
    - 又稱 Mobility Drills
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.dynamic-stretch.i02
    q: vs 彈震拉伸
    a:
    - 動態拉伸有控制、無彈跳
    - ROM 通常較彈震小但可主動控制，避免彈震的潛在傷害
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.dynamic-stretch.i03
    q: 熱身首選
    a:
    - 可維持 Raise 階段溫度效益
    - 改善跑步表現
    - 多關節整合動作省時
    - 最適合大多數運動熱身
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.dynamic-stretch.i04
    q: 設計原則
    a:
    - 先分析運動主要動作模式及需要的 ROM → 選擇可複製該模式的動態動作
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.dynamic-stretch.i05
    q: 執行方式
    a:
    - 原地重複（如 10 次弓步）或移動距離（如弓步走 15m）
    - 從慢開始逐漸加大 ROM 和速度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.dynamic-stretch.i06
    q: 限制
    a:
    - 增加靜態 ROM 效果不如靜態拉伸或 PNF
    - 需要增加靜態 ROM 時，應優先選靜態/PNF
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.dynamic-stretch.i07
    q: 技術整合
    a:
    - 動作中必須強調正確技術與關鍵關節位置（如衝刺膝抬高需同時強調踝關節背屈）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.dynamic-stretch.i08
    q: 時間效率
    a:
    - 有效動態拉伸熱身約 10–15 分鐘可完成
    - 多關節組合動作提高效率
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
- id: flexibility-factors
  title: Flexibility 影響因素
  desc: ''
  tag: 影響因子
  items:
  - id: ch14.flexibility-factors.i01
    q: 關節結構
    a:
    - 球窩關節（髖、肩）ROM 最大
    - 橢球關節（腕）次之
    - 鉸鏈關節（膝）ROM 最小
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
  - id: ch14.flexibility-factors.i02
    q: 年齡與性別
    a:
    - 年輕人 > 老年人
    - 女性 > 男性
    - 老化導致纖維化（Fibrosis）：纖維結締組織取代退化肌肉
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
  - id: ch14.flexibility-factors.i03
    q: 肌肉與結締組織
    a:
    - 彈性（Elasticity）＋塑性（Plasticity）共同決定 ROM
    - 拉伸可利用結締組織的塑性潛力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
  - id: ch14.flexibility-factors.i04
    q: 伸展耐受度
    a:
    - Stretch Tolerance：承受拉伸不適的能力
    - ROM 較大者通常耐受度較高
    - 規律拉伸可提升耐受度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
  - id: ch14.flexibility-factors.i05
    q: 神經控制
    a:
    - ROM 最終由中樞與周圍神經系統控制，而非單純結構限制
    - 有效柔軟度訓練需改善神經系統反應
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
  - id: ch14.flexibility-factors.i06
    q: 阻力訓練
    a:
    - 適當阻力訓練可增加柔軟度
    - 全 ROM 動作為前提
    - 僅練主動肌/未練拮抗肌 → 可能降低 ROM
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
  - id: ch14.flexibility-factors.i07
    q: 肌肉量
    a:
    - 大肌肉量可能物理性阻礙關節活動（如大二頭肌限制三頭肌拉伸）
    - 大力量運動員需權衡
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
  - id: ch14.flexibility-factors.i08
    q: 活動量 & ROM 與性能
    a:
    - 活動量高柔軟度較好
    - 最靈活≠表現最好
    - 各運動有最佳 ROM
    - 過度或不足柔軟度均↑傷害風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - structure
    related: []
    locator: ''
- id: pnf-techniques
  title: PNF 三技巧
  desc: ''
  tag: PNF
  items:
  - id: ch14.pnf-techniques.i01
    q: Hold-Relax
    a:
    - ①被動預拉 10 秒 → ②等長收縮（Hold）6 秒 → ③被動拉伸 30 秒
    - 機制：Autogenic Inhibition（GTO 被活化）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
  - id: ch14.pnf-techniques.i02
    q: Contract-Relax
    a:
    - ①被動預拉 10 秒 → ②向心收縮（全 ROM）→ ③被動拉伸 30 秒
    - 機制：Autogenic Inhibition
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
  - id: ch14.pnf-techniques.i03
    q: Hold-Relax + Agonist
    a:
    - ①被動預拉 10 秒 → ②等長收縮 6 秒 → ③被動拉伸 + 主動肌向心收縮
    - 機制：Reciprocal + Autogenic Inhibition（最有效）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
  - id: ch14.pnf-techniques.i04
    q: Autogenic Inhibition（自身抑制）
    a:
    - 被拉肌肉收縮 → 肌腱張力↑ → GTO 活化 → 同一肌肉反射性放鬆 → 允許更大 ROM
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
  - id: ch14.pnf-techniques.i05
    q: Reciprocal Inhibition（交互抑制）
    a:
    - 主動肌收縮 → GTO 活化 → 對側（被拉伸）肌肉放鬆
    - Hold-Relax+Agonist 同時利用兩種抑制 → 效果最強
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
  - id: ch14.pnf-techniques.i06
    q: PNF 優缺點
    a:
    - 優：增加 ROM 效果最佳
    - 缺：需要夥伴、需要一定技術、不易自行執行
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
  - id: ch14.pnf-techniques.i07
    q: PNF 三階段
    a:
    - Phase 1：被動預拉（所有技術相同）
    - Phase 2 & 3：依技術不同（給技術命名）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
  - id: ch14.pnf-techniques.i08
    q: 考試重點
    a:
    - 最有效 PNF = Hold-Relax with Agonist Contraction（同時利用 Reciprocal + Autogenic Inhibition）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - reflex
    related: []
    locator: ''
- id: proprioceptors
  title: Proprioceptors 本體感覺器
  desc: ''
  tag: 神經控制
  items:
  - id: ch14.proprioceptors.i01
    q: Muscle Spindle 肌梭
    a:
    - 位於梭內肌纖維（平行於梭外肌纖維）
    - 偵測肌肉長度變化
    - 快速拉伸 → 感覺神經元 → 脊髓運動神經元
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
  - id: ch14.proprioceptors.i02
    q: 牽張反射
    a:
    - 肌梭受刺激 → 反射性收縮被拉伸的肌肉（Stretch Reflex）→ 限制 ROM
    - 靜態拉伸可避免誘發
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
  - id: ch14.proprioceptors.i03
    q: GTO（高爾基腱器）
    a:
    - 位於肌腱交界處（Musculotendinous Junction）
    - 偵測肌腱張力增加
    - 活化後→肌肉反射性放鬆
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
  - id: ch14.proprioceptors.i04
    q: Autogenic Inhibition（自身抑制）
    a:
    - 同一肌肉收縮 → GTO 活化 → 同一肌肉放鬆
    - Hold-Relax 和 Contract-Relax 均利用此機制
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
  - id: ch14.proprioceptors.i05
    q: Reciprocal Inhibition（交互抑制）
    a:
    - 主動肌收縮 → GTO 活化 → 對側（被拉伸）肌肉放鬆
    - Hold-Relax+Agonist 額外利用此機制
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
  - id: ch14.proprioceptors.i06
    q: 靜態拉伸 vs 肌梭
    a:
    - 靜態拉伸動作緩慢 → 不誘發牽張反射 → 肌肉可放鬆 → 允許更大 ROM
    - 這是靜態拉伸安全性的基礎
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
  - id: ch14.proprioceptors.i07
    q: 彈震拉伸 vs 肌梭
    a:
    - 彈震/動態快速拉伸可能刺激肌梭 → 誘發牽張反射 → 肌肉反射性收縮 → 可能限制 ROM 或增加傷害風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
  - id: ch14.proprioceptors.i08
    q: 考試常考對比
    a:
    - GTO活化 → 被拉肌放鬆（Autogenic）
    - 對側肌收縮 → 被拉肌放鬆（Reciprocal）
    - 肌梭活化 → 被拉肌收縮
    detail: ''
    terms: []
    numbers: []
    concepts:
    - reflex
    related: []
    locator: ''
- id: ramp-protocol
  title: RAMP Protocol
  desc: ''
  tag: 結構設計
  items:
  - id: ch14.ramp-protocol.i01
    q: R — Raise
    a:
    - 低強度活動提升體溫、心率、血流、關節液黏度
    - 需模擬運動動作模式（非單純慢跑）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch14.ramp-protocol.i02
    q: A — Activate & Mobilize
    a:
    - 類似傳統拉伸階段
    - 強調關鍵動作模式（如深蹲、弓步）的活動度與運動控制
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch14.ramp-protocol.i03
    q: P — Potentiate
    a:
    - 類似專項熱身
    - 逐漸提升至訓練/競賽所需強度，對速度/爆發力項目尤為重要
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch14.ramp-protocol.i04
    q: 熱身時間
    a:
    - 一般 10–20 分鐘
    - 結束後不超過 15 分鐘需開始訓練，否則熱身效果消散
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch14.ramp-protocol.i05
    q: 靜態伸展爭議
    a:
    - 靜態伸展 >60秒會降低後續表現（力量、速度、反應時間）
    - 短時間（<45秒）仍可能有些微負面影響
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch14.ramp-protocol.i06
    q: 動態拉伸優先
    a:
    - A&M 階段建議使用動態拉伸，可維持 Raise 階段溫度效益，且多關節、省時
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch14.ramp-protocol.i07
    q: 長期規劃
    a:
    - 熱身時間佔訓練週期比重大
    - 應納入短中長期計畫，貢獻整體運動員發展
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch14.ramp-protocol.i08
    q: 競賽 vs 訓練
    a:
    - 競賽熱身以最大化當下表現為主
    - 訓練熱身可兼顧長期能力發展
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
- id: static-stretch
  title: Static Stretch 靜態拉伸
  desc: ''
  tag: 拉伸類型
  items:
  - id: ch14.static-stretch.i01
    q: 定義
    a:
    - 緩慢且持續，末端位置維持 15–30 秒
    - 不誘發牽張反射（Stretch Reflex）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.static-stretch.i02
    q: 主動 vs 被動
    a:
    - 主動拉伸：由自身肌肉施力。被動拉伸：由夥伴或器械提供外力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.static-stretch.i03
    q: 效果
    a:
    - 有效增加 ROM
    - 傷害風險低
    - 適合所有運動員。ROM 改善最佳時機為運動後（肌溫高）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.static-stretch.i04
    q: 最佳拉伸時機
    a:
    - ①訓練/競賽後 5–10 分鐘內 ②獨立拉伸課（需先充分暖身）— 不建議在熱身中大量使用
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.static-stretch.i05
    q: 頻率建議
    a:
    - 每週至少 2 次，持續 ≥5 週可顯著改善柔軟度
    - 30 秒效果優於更短時間，超過 30 秒無明顯額外效益
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.static-stretch.i06
    q: 急性效果
    a:
    - ROM 改善是暫時性的
    - 效果在拉伸後立即最大，持續 3 分鐘到 24 小時不等
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch14.static-stretch.i07
    q: 注意事項
    a:
    - 拉至輕微不適（非疼痛）
    - 不可為了增加 ROM 而犧牲關節完整性
    - 出現放射痛或麻木需降低強度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
