cards:
- q: 熱身的溫度相關效益有哪些？
  a: 肌肉溫度↑、核心溫度↑、神經功能強化、結締組織暫時性鍵結打斷
  tag: warmup-physiology
- q: 熱身的非溫度相關效益有哪些？
  a: 肌肉血流↑、基礎耗氧↑、Post-Activation Potentiation（PAP）
  tag: warmup-physiology
- q: Bohr Effect 在熱身中的意義？
  a: 溫度升高使血紅素釋放O₂能力增強，改善工作肌肉的氧氣輸送效率
  tag: warmup-physiology
- q: 主動熱身 vs 被動熱身，哪個效果較好？
  a: 主動熱身（Active warm-up）效果優於被動熱身（如熱敷）
  tag: warmup-physiology
- q: 熱身可以改善哪些運動能力？
  a: 收縮速度↑、RFD（Rate of Force Development）↑、反應時間↑、肌力↑、爆發力↑
  tag: warmup-physiology
- q: 一般熱身（General Warm-Up）的目標與做法？
  a: 5 分鐘低強度有氧（如慢跑/跳繩），提升心率、血流、肌肉溫度、呼吸率，降低關節液黏度
  tag: warmup-physiology
- q: 熱身結束後多久應開始訓練/競賽？
  a: 不超過 15 分鐘；超過後熱身正面效果開始消散
  tag: warmup-physiology
- q: 熱身能降低受傷風險嗎？
  a: 有正面跡象（肌肉溫度↑可提高抗撕裂能力），但拉伸與傷害預防的直接關聯尚無一致證據
  tag: warmup-physiology
- q: RAMP 熱身協議各字母代表什麼？
  a: R=Raise（提升體溫/心率）、A=Activate & Mobilize（活化與動員）、P=Potentiate（後激活強化）
  tag: ramp-protocol
- q: RAMP 的 Raise 階段與傳統一般熱身的差異？
  a: Raise 需模擬運動動作模式（而非單純慢跑），從一開始就針對關鍵動作和技能能力
  tag: ramp-protocol
- q: RAMP 的 Activate & Mobilize 階段包含哪些內容？
  a: 關鍵動作模式（如深蹲、弓步）；強調活動度（Mobility）＋動作控制＋穩定性的整合
  tag: ramp-protocol
- q: RAMP 的 Potentiate 階段的重要性？
  a: 逐漸提升至訓練/競賽強度；爆發力項目最關鍵；傳統熱身常省略此階段
  tag: ramp-protocol
- q: 靜態拉伸超過 60 秒對表現的影響？
  a: 顯著降低力量、爆發力、速度、反應時間；少於 45 秒仍可能有些微負面效果
  tag: ramp-protocol
- q: A&M 階段為何偏好動態拉伸而非靜態拉伸？
  a: 動態拉伸維持 Raise 的溫度效益；多關節整合、省時；能複製運動動作模式
  tag: ramp-protocol
- q: 訓練熱身 vs 競賽熱身的目標差異？
  a: 訓練熱身：兼顧即時表現＋長期能力發展；競賽熱身：最大化當下競賽表現
  tag: ramp-protocol
- q: Potentiate 階段如何決定熱身的最適長度？
  a: 此階段可融入速度/敏捷訓練，整個熱身無縫銜接主訓練，不增加總訓練時間
  tag: ramp-protocol
- q: 靜態柔軟度 vs 動態柔軟度的定義？
  a: 靜態：被動情況下關節可動範圍（外力施予）；動態：主動肌肉收縮產生的可用 ROM
  tag: flexibility-factors
- q: 不可訓練改變的柔軟度影響因素？
  a: 關節結構（形狀與骨骼）、年齡、性別
  tag: flexibility-factors
- q: 球窩關節 vs 鉸鏈關節的 ROM 比較？
  a: 球窩關節（髖、肩）ROM 最大（多平面活動）；鉸鏈關節（膝）ROM 最小（主要矢狀面）
  tag: flexibility-factors
- q: 老化如何影響柔軟度？
  a: 老化導致纖維化（Fibrosis）：退化肌纖維被纖維結締組織取代；加上活動量少，ROM 下降
  tag: flexibility-factors
- q: 彈性（Elasticity）vs 可塑性（Plasticity）的差異？
  a: 彈性：拉伸後恢復原長；可塑性：拉伸後維持新長度；拉伸訓練利用結締組織的塑性潛力
  tag: flexibility-factors
- q: 拉伸耐受性（Stretch Tolerance）對柔軟度的影響？
  a: 忍受拉伸不適的能力；定期拉伸可提高耐受性，進而允許進入更大 ROM
  tag: flexibility-factors
- q: 阻力訓練對柔軟度的正負面影響？
  a: 正：全 ROM 訓練可改善柔軟度；負：有限 ROM 的大重量訓練可能降低柔軟度
  tag: flexibility-factors
- q: 最佳柔軟度目標是最大化還是最適化？
  a: 最適化（Optimal）而非最大化；不同運動有不同最適 ROM，過度或不足均可能增加傷害風險
  tag: flexibility-factors
- q: 肌梭（Muscle Spindle）的位置與功能？
  a: 位於梭內肌纖維（與梭外肌平行）；監測肌肉長度變化；快速拉伸時觸發牽張反射（Stretch Reflex）
  tag: proprioceptors
- q: 牽張反射（Stretch Reflex）如何影響拉伸效果？
  a: 快速拉伸→肌梭活化→運動神經元→肌肉收縮，限制 ROM；靜態拉伸速度慢，避免觸發
  tag: proprioceptors
- q: 高爾基腱器（GTO）的位置與感知目標？
  a: 位於肌腱-肌肉交界處；對肌肉張力（而非長度）敏感；張力過高→GTO 活化→反射性放鬆
  tag: proprioceptors
- q: 自身抑制（Autogenic Inhibition）的機制？
  a: 肌肉張力↑→GTO 活化→同一肌肉反射性放鬆；應用於 Hold-Relax 和 Contract-Relax 技術
  tag: proprioceptors
- q: 交互抑制（Reciprocal Inhibition）的機制？
  a: 主動肌收縮→GTO 活化→對側拮抗肌（被拉伸肌）放鬆；應用於 Hold-Relax with Agonist Contraction
  tag: proprioceptors
- q: 哪種 PNF 技術同時利用自身抑制和交互抑制？
  a: Hold-Relax with Agonist Contraction（效果最強，雙重放鬆機制）
  tag: proprioceptors
- q: 靜態拉伸為何不觸發牽張反射？
  a: 動作緩慢，肌梭未被快速拉伸；無防護性收縮，肌肉可放鬆進入更大 ROM
  tag: proprioceptors
- q: 彈道拉伸為何可能限制 ROM？
  a: 快速彈跳可能快速拉伸肌梭，觸發牽張反射，導致被拉伸肌肉收縮，反而限制 ROM
  tag: proprioceptors
- q: 靜態拉伸（Static Stretch）的執行規範？
  a: 緩慢移至輕度不適的 ROM 端；維持 15–30 秒；避免快速動作；超過 30 秒效益遞減
  tag: static-stretch
- q: 靜態拉伸的主要優點？
  a: 安全（不觸發牽張反射）、容易學習、有效提升 ROM；適合所有運動員
  tag: static-stretch
- q: 靜態拉伸的最佳執行時機？
  a: 訓練/競賽後（體溫高，膠原彈性佳，需在 5–10 分鐘內執行）；或作為單獨拉伸課（前需充分熱身）
  tag: static-stretch
- q: 靜態拉伸有效的訓練頻率最低要求？
  a: 每週至少 2 次；維持至少 5 週，才能顯著改善柔軟度
  tag: static-stretch
- q: 執行靜態拉伸時若感到疼痛或放射症狀，應如何處理？
  a: 立即降低拉伸強度；疼痛為警示訊號，可能牽涉神經血管結構
  tag: static-stretch
- q: 彈道拉伸（Ballistic Stretch）的特徵？
  a: 主動彈跳式動作，終端位置不維持；速度快，可能觸發牽張反射
  tag: ballistic-stretch
- q: 彈道拉伸的主要風險？
  a: 可能觸發牽張反射（限制 ROM）；未充分準備或有既往傷害時，易造成肌肉/結締組織損傷
  tag: ballistic-stretch
- q: 彈道拉伸的效果與使用前提？
  a: 改善 ROM 效果與靜態拉伸相當；需確保運動員有充分急性與慢性準備，有舊傷需特別注意
  tag: ballistic-stretch
- q: 動態拉伸（Dynamic Stretch）的定義？
  a: 功能性、專項動作為基礎的拉伸；主動肌肉控制通過 ROM；無彈跳；複製運動所需動作模式
  tag: dynamic-stretch
- q: 動態拉伸 vs 彈道拉伸的關鍵差異？
  a: 動態：有控制、無彈跳、維持技術；彈道：有彈跳、ROM 可能更大但控制較差
  tag: dynamic-stretch
- q: 動態拉伸在熱身中的主要優勢？
  a: 複製運動動作模式；多關節整合；維持溫度效益；可在 10–15 分鐘內完成有效熱身
  tag: dynamic-stretch
- q: 動態拉伸計劃設計的起點？
  a: 分析運動主要動作模式和所需 ROM → 選擇能複製這些動作的動態拉伸動作
  tag: dynamic-stretch
- q: 動態拉伸改善靜態 ROM 的效果如何？
  a: 不如靜態/PNF 拉伸；需要增加靜態 ROM 時，仍以靜態或 PNF 方法為主
  tag: dynamic-stretch
- q: 動態拉伸的執行指引？
  a: 5–10 次重複；逐步增加 ROM 和速度；全程維持動作控制；勿犧牲技術換取更大 ROM
  tag: dynamic-stretch
- q: PNF 拉伸的起源與目的？
  a: 原發展用於神經肌肉復健（降低肌張力）；後延伸為增加運動員柔軟度的訓練方法
  tag: pnf-techniques
- q: PNF 三種基本技術的名稱？
  a: Hold-Relax（HR）、Contract-Relax（CR）、Hold-Relax with Agonist Contraction（HRAC）
  tag: pnf-techniques
- q: Hold-Relax 的三個階段？
  a: ①被動預拉 10 秒→②等長收縮（Hold）6 秒→③被動拉伸 30 秒；機制：Autogenic Inhibition
  tag: pnf-techniques
- q: Contract-Relax 與 Hold-Relax 的差異？
  a: CR 第二階段是向心收縮（完整 ROM）而非等長收縮；兩者機制相同（Autogenic Inhibition）
  tag: pnf-techniques
- q: Hold-Relax with Agonist Contraction 的第三階段特點？
  a: 被動拉伸＋同時主動肌向心收縮；主要機制：Reciprocal Inhibition；次要：Autogenic Inhibition
  tag: pnf-techniques
- q: 為何 HRAC 是最有效的 PNF 技術？
  a: 同時激活交互抑制（Reciprocal）和自身抑制（Autogenic），雙重放鬆效果，ROM 增加最多
  tag: pnf-techniques
