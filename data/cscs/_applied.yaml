# 實務判斷層：由測試數據推導訓練決策的題型與判讀規則
#
# 抽取單位是「題型 + 判讀規則 + 課本缺口」，不是題目。
# 來源為 CSCS 讀書會的情境式討論；原文與作者一律不落盤（見 HANDOFF 的
# 「內容要吸收後再寫」）。案例只保留去識別化的參數輪廓與比值。
#
# 已納入驗收閘：cscs_check.py 會解析本檔的 chapters / domain 參照，並斷言
# 每個題型至少有一條分支、每個缺口至少橫跨兩章（單章的是待補內容不是缺口）。

meta:
  created: 2026-09-11
  source_kind: practitioner-discussion
  extraction_rule: 一則討論 → 題型分支 + 判讀規則 + textbook_gap，原文不存

  revisions:
    - date: 2026-09-11
      what: >-
        test-battery 題型的第三分支初版判定錯誤（判最大肌力，正解是水平向爆發），
        由讀書會公布的解答抓到。
      root_cause: >-
        三層疊加：(1) 用男性高層級的相對肌力門檻判 D-III 女性，把適當值讀成不足；
        (2) 把接近族群平均的垂直跳與嚴重偏離的水平跳合併敘述成「都差」，製造出
        「多項偏低」的假象；(3) 推理鏈裡沒有發力向量這一步。
      fix: >-
        reasoning_chain 前面補「常模族群對齊」、後面補「發力向量對應」，並以
        「缺口嚴重度排序」取代原本的「缺口數量與分布」。
      also_retracted: >-
        原先認定第二、第三分支「答案相反」的對照表。修正後兩者同屬爆發側，只是
        處方不同；真正的「先建肌力」分支只有第一個（男性高層級 + 相對肌力確實低
        + 轉換率已高於 0.8）。

    - date: 2026-09-11
      what: >-
        同日再錯兩題：機動性 drill 加難度判「加閃避」（正解加彎繞）、SEBT 起始
        方向判「順時針」（正解隨機，且主動論證隨機是錯的）。
      root_cause: >-
        兩題的正解都已寫在本庫：ch13.balance-flexibility-bc.i02 的 detail 明寫
        「起始方向與支撐腳隨機選定」，ch19.agility-cod.i02 明寫機動性是沿彎繞
        路徑維持速度。錯因不是推理鏈缺步驟，而是根本沒查 canonical，直接用外部
        帶進來的通則（「標準化＝一切固定」、「加難度＝加認知負荷」）覆蓋來源定義。
        與 D-III 女性那題（套男性門檻）是同一個根因的第三次發作。
      fix: >-
        新增 answering_protocol：查 canonical 列為第 0 步，先於任何推理。並把兩條
        具體規則各自建成題型（drill 難度進階、測驗流程固定 vs 隨機），加兩條缺口。

answering_protocol:
  - step: 0. 先查 canonical
    rule: >-
      拿到題目先 grep data/cscs/ 找對應知識單位，用它的 detail 與 locator 作答。
      只有本庫確實沒有該條目時，才進入下面的推理層。
    failure_mode: >-
      2026-09-11 一天內三次踩到：三題錯答全部是「憑記憶推理，而正解就寫在檔案裡
      或與檔案的族群前提衝突」。其中 SEBT 那題我還用外部通則主動論證正解是錯的。
  - step: 1. 檢查是否在套外部通則
    rule: >-
      「標準化＝一切固定」、「加難度＝加認知負荷」、「背蹲 1.5–2.0 倍體重」都是
      外部帶進來的一般框架。來源的具體定義優先於任何一般框架；框架與來源衝突時
      一律以來源為準，不是反過來論證來源有問題。

templates:
  - id: applied.test-battery-to-training-decision
    name: 由測試組合推導訓練決策
    stem_pattern: >-
      給定體型（身高／體重）、運動項目與位置，加上一組測試結果
      （下肢多關節 1RM、爆發式上舉 1RM、上肢推 1RM、縱跳、水平跳、
      短距衝刺、變向、代謝耐力其中數項），要求判斷下一訓練區塊的
      動作選擇或訓練重點。
    task: 先判定限制因子，再由限制因子導出訓練決策
    answer_axis: 最大肌力不足 ↔ 發力率不足 ↔ 無須變動

    reasoning_chain:
      - step: 常模族群對齊
        rule: >-
          先確認性別與競技層級，再挑常模。「背蹲 1.5–2.0 倍體重」是男性高層級的
          參照，套到女性或 D-III 會把適當值誤讀成不足；大專女性適當區間約
          1.2–1.6 倍體重。這一步放在最前面，錯了後面全錯。
        failure_mode: 2026-09-11 實際踩過：用男性門檻判 D-III 女性，結論直接反向
      - step: 變式換算
        rule: >-
          題目給的動作可能是變式，先換回可對常模的基準。前蹲約為背蹲 0.85 倍；
          trap bar 硬舉與背蹲槓桿不同，不可直接互換比對。
      - step: 相對肌力
        rule: 下肢 1RM ÷ 體重，對照上一步選定的族群常模
      - step: 力量轉換率
        rule: >-
          爆發式上舉 1RM ÷ 下肢 1RM。高於 0.8 表示轉換能力已超前、缺口在最大肌力；
          低於 0.6 表示力量有但轉換差、缺口在發力率與技術。
      - step: 課表現況反推
        rule: >-
          有 1RM 數據的動作就是現行課表動作。「新增什麼」的選項裡出現它，
          必定是干擾項。
      - step: 發力向量對應
        rule: >-
          把每項測試對應到項目的主要發力向量。滑冰推蹬與陸上衝刺是水平／側向，
          水平跳（立定跳遠）才是對應指標；垂直跳與水平跳是不同質，轉移有限，
          不可合併成單一個「爆發」。主要向量上的測試最差時，優先序最高。
      - step: 缺口嚴重度排序
        rule: >-
          逐項對各自族群常模算偏離幅度，看嚴重度排序，不看偏低項目的數量。
          單一指標嚴重偏離且該指標對應項目主要向量 → 直接訓練該質。只有在
          多項指標對各自常模皆偏低、且無單項突出偏離時，才判肌力基礎是上游原因。
        supersedes: >-
          舊版「缺口數量與分布」規則已撤除。它允許用「這是下游結果」覆蓋一個
          具體而嚴重的缺口，2026-09-11 就是這樣把水平爆發缺口判成肌力問題。

    distractor_logic:
      - type: 限制因子對應型
        note: 各選項分別對應一種限制因子，答錯反映比值判讀方向錯
      - type: 課表已有型
        note: 選項是已在測試組合中出現的動作，考「新增」的語意
      - type: 維持不變型
        note: 出現「不做調整」時，考的是能否確認缺口存在，而非排優先序

    branches:
      - id: branch.strength-base-deficient-with-power-present
        profile: 高大型項目位置；下肢相對肌力約 1.1 倍體重；轉換率約 0.83；縱跳顯著低於常模
        verdict: 最大肌力
        decision: 以下肢多關節最大肌力動作為主要強調
        why: 轉換率已高於 0.8，爆發表現不是缺口；相對肌力才是跳躍與位移的天花板

      - id: branch.strength-adequate-no-power-movement
        profile: 下肢相對肌力約 1.28 倍體重；測試組合中無任何爆發式上舉；變向與縱跳尚可
        verdict: 發力率
        decision: 新增爆發式上舉（power clean）
        why: 肌力基礎站得住而課表缺爆發質，邊際效益在提高發力率

      - id: branch.isolated-vector-specific-power-deficit
        profile: >-
          大專女性反覆衝刺型項目（冰球）；相對肌力對齊女性常模後屬適當
          （換算背蹲約 1.22 倍體重、trap bar 約 1.34 倍、臥推 0.68 倍）；
          垂直跳接近族群平均；水平跳嚴重偏離常模；代謝耐力無急迫問題
        verdict: 發力率（水平向）
        decision: 訓練區塊重點轉爆發發展，並偏水平／側向發力
        why: >-
          肌力對該族群已適當，唯一嚴重缺口落在水平跳，而水平發力正是滑冰推蹬的
          主要向量——最差的測試同時是項目最吃重的質，優先序最高。
        correction_note: >-
          此分支初版判為「最大肌力」，是錯的。三個錯誤疊加：套男性門檻、把接近
          平均的垂直跳和嚴重偏低的水平跳合併成「都差」、完全未納入發力向量。

    domain: [pa1-program-design, pa3-program-implementation]
    chapters: [ch12, ch13, ch17]

  - id: applied.behavior-modification-quadrant
    name: 教練行為的操作制約象限判別
    stem_pattern: >-
      給定教練目標（提升專注、提高訓練投入、修正技術錯誤），選項各為一種
      教練行為，要求選出最適當者。
    task: 先把每個選項歸入操作制約象限，再對照目標方向與 NSCA 的優先序
    answer_axis: 正強化 ↔ 負強化 ↔ 懲罰

    reasoning_chain:
      - step: 目標方向
        rule: >-
          題目要「增加」某行為（專注、投入）→ 答案在強化側；要「減少」某行為
          → 才看懲罰側。方向錯的選項先排除。
      - step: 象限歸類
        rule: >-
          給予想要的刺激＝正強化；移除嫌惡刺激＝負強化；移除想要的事物或施加
          嫌惡刺激＝懲罰。看的是「加或減」與「該刺激是想要或嫌惡」兩軸。
      - step: 優先序
        rule: >-
          NSCA 立場以正強化為首選。懲罰的已知副作用是提高焦慮與失敗恐懼，
          並把注意力從執行動作轉向避免受罰。
      - step: 訓練手段不當籌碼
        rule: >-
          把體能訓練、訓練特權當獎懲籌碼的選項，即使機制上成立也不選——它會
          讓該訓練被認知為懲罰，破壞其生理目的。

    distractor_logic:
      - type: 機制正確方向錯型
        note: 選項是有效的懲罰，但題目要增加行為，不是減少
      - type: 訓練當籌碼型
        note: 包裝成負強化，機制成立但違反訓練手段不作獎懲的原則

    branches:
      - id: branch.increase-focus-choose-positive-reinforcement
        profile: 目標為提升高強度區塊中的專注；選項含正強化、以體能為籌碼的負強化、削減特權的懲罰
        verdict: 正強化
        decision: 在技術達標的反覆之後給予肯定
        why: 方向與目標一致，且不動用訓練手段作籌碼

    domain: [sf2-sport-psychology]
    chapters: [ch08]

  - id: applied.drill-difficulty-progression
    name: drill 難度進階的變數選擇
    stem_pattern: >-
      給定一個已歸類的 drill（機動性、方向改變、敏捷、增強式其一），問如何提高
      其難度；選項各為一種加法（加彎繞、加閃避對手、加距離、加負荷、加刺激）。
    task: 先認出該 drill 所屬的質，再沿該質的定義變數加難度
    answer_axis: 沿定義變數加深 ↔ 換成另一種質

    reasoning_chain:
      - step: 認出 drill 屬於哪一質
        rule: >-
          機動性＝沿彎繞路徑盡量維持速度；方向改變＝急劇減速、轉向、再加速；
          敏捷＝在刺激下選擇反應（方向改變 + 知覺—認知）。看的是「有無急煞車」
          與「有無外部刺激」兩軸，不是看路徑複雜度。
      - step: 找出該質的定義變數
        rule: >-
          機動性的定義變數是彎繞（半徑、數量、入彎速度）；方向改變的是角度與
          進入速度；敏捷的是刺激的不可預測性與反應窗。
      - step: 沿定義變數加，不換類別
        rule: >-
          「把這個 drill 變難」與「進階到更難的 drill 類別」是兩個問題。加入外部
          刺激（閃避對手、反應信號）會把機動性或方向改變 drill 變成敏捷 drill——
          那是換質不是加難度，題目問前者時它是干擾項。
        failure_mode: >-
          2026-09-11 實際踩過：機動性 drill 問加難度，選了「加閃避」。閃避是敏捷
          的定義變數，不是機動性的。

    distractor_logic:
      - type: 換質型
        note: 選項是另一種質的定義變數（最常見：對機動性題給敏捷的加法）
      - type: 一般化超負荷型
        note: 加距離、加負荷這類通用超負荷，與該 drill 要練的質無對應

    branches:
      - id: branch.maneuverability-add-bends
        profile: 已歸類為機動性的 drill；選項含加彎繞、加閃避對手、加衝刺距離
        verdict: 加彎繞
        decision: 沿路徑增加彎繞成分（半徑更小、彎數更多）
        why: >-
          機動性的定義就是沿彎繞路徑維持速度，彎繞是它的定義變數；加閃避會把它
          變成敏捷 drill，加距離只是延長同難度的工作。

    domain: [pa1-program-design]
    chapters: [ch17, ch19]

  - id: applied.test-protocol-fixed-vs-randomized
    name: 測驗流程中哪些固定、哪些隨機
    stem_pattern: >-
      給定一個多條件測驗（SEBT 的八個伸展方向、多種跳躍、雙側測試），問某個
      流程細節該如何設定；選項含固定順序、依某規則排序、隨機、由受測者自選。
    task: 分清「流程標準化」與「條件順序隨機化」各管什麼
    answer_axis: 固定（流程） ↔ 隨機（條件順序）

    reasoning_chain:
      - step: 分辨問的是流程還是條件順序
        rule: >-
          流程＝所有受測者與所有重測都必須一致的執行方式（格網尺寸、試驗次數、
          組間休息、預先練習次數、姿勢維持時間、捨棄試驗的判準）。條件順序＝
          同一次測驗內多個條件（方向、肢側、變式）的呈現先後。
      - step: 流程一律固定
        rule: 流程不一致，跨人與跨時間的比較就失去意義；重測必須沿用初測的量測方法。
      - step: 條件順序一律隨機
        rule: >-
          固定順序會讓疲勞與學習效應系統性地偏壓特定條件（總是最後測的方向永遠
          最疲勞）。隨機化是在控制順序效應，不是在破壞標準化。
        failure_mode: >-
          2026-09-11 實際踩過：把「標準化＝一切固定」當無條件通則，判 SEBT 起始
          方向為順時針，並主動論證「隨機」選項錯。ch13 的 detail 原文就是隨機選定。

    distractor_logic:
      - type: 標準化過度推廣型
        note: >-
          選項給一個聽起來很嚴謹的固定規則（順時針、由短到長、固定先測優勢側）。
          「標準化」這個詞的正當性會讓它看起來永遠是對的，實際要看它管的是流程
          還是條件順序。
      - type: 受測者自選型
        note: 交給受測者決定既非標準化也非隨機化，方向上直接錯

    branches:
      - id: branch.sebt-start-direction-randomized
        profile: SEBT 八方向格網；問起始伸展方向與支撐腳如何決定
        verdict: 隨機
        decision: 起始方向與支撐腳隨機選定
        why: >-
          八個方向是八個條件而非流程步驟；固定起始點會讓後測方向承受累積疲勞。
          該測驗的流程面（每條件三次取平均、間隔 15 秒、至少預先練習四次、捨棄
          試驗的判準）才是必須固定的部分。

    domain: [pa3-program-implementation]
    chapters: [ch12, ch13]

gaps:
  - id: gap.test-ratio-to-exercise-priority
    statement: >-
      ch13 的常模只回答「這個數字算好算壞」，ch17 的動作選擇原則是從需求分析走，
      兩章之間沒有「由測試比值推導動作優先序」的顯式決策規則。
    chapters: [ch13, ch17]
    evidence: 三則情境討論全數卡在同一接縫，屬系統性缺口而非個案
    status: open

  - id: gap.norm-tables-not-stratified-for-decisions
    statement: >-
      ch13 的常模未分層到可直接判讀的程度：同一個相對肌力數字，對男性高層級是
      不足、對大專女性是適當，但表格沒把「該族群的適當區間」擺在判讀位置上，
      很容易拿錯尺。ch07 才是講性別與年齡差異的地方，但它的族群框架沒有被帶進
      ch13 的判讀位置——兩章之間斷開，查表時就會拿別的族群的尺。
    chapters: [ch07, ch13]
    severity: high
    evidence: 2026-09-11 實際造成一題判定反向
    status: open

  - id: gap.force-vector-specificity-in-test-interpretation
    statement: >-
      垂直跳與水平跳被 ch13 當成同一類「爆發」測試呈現，但兩者是不同質、轉移
      有限；ch17 的動作選擇也沒有「由項目主要發力向量回推該優先哪一項爆發測試」
      的入口。滑冰、衝刺這類水平推進項目最需要這條規則。
    chapters: [ch13, ch17]
    severity: high
    status: open

  - id: gap.lift-variant-conversion-factors
    statement: >-
      ch13 的常模表以標準動作（背蹲、臥推）為基準，但實務課表大量使用前蹲、
      trap bar 硬舉等變式，課本未給變式之間的換算係數，查表時直接卡住。ch15 教
      這些變式的動作技術，但不談它們與標準動作在負荷上的對應關係。
    chapters: [ch13, ch15]
    status: open

  - id: gap.training-means-as-reward-or-punishment
    statement: >-
      ch08 講操作制約的原則與懲罰的副作用，ch17／ch20 講各訓練手段的生理目的，
      但兩處之間沒有「不得把訓練手段當獎懲籌碼」的顯式跨章禁令——而這正是
      情境題最常見的干擾項設計。
    chapters: [ch08, ch17, ch20]
    status: open

  - id: gap.standardization-vs-randomization-boundary
    statement: >-
      ch12 立了測驗標準化與再測信度的原則，ch13 逐測驗給流程（SEBT 的 detail 就
      明寫起始方向隨機），但沒有任何一處把「流程要固定、條件順序要隨機」講成
      顯式規則。只讀 ch12 的原則會把標準化過度推廣成「一切固定」，剛好推翻
      ch13 的具體流程。
    chapters: [ch12, ch13]
    severity: high
    evidence: 2026-09-11 造成一題判定反向，且是主動論證正解為錯
    status: open

  - id: gap.progression-variable-per-quality
    statement: >-
      ch19 把機動性、方向改變、敏捷三者定義得很清楚，ch17 講超負荷與進階原則，
      但兩章之間沒有「每一質的難度進階該動哪個變數」的對照——結果是拿通用超負荷
      或另一質的定義變數去「加難度」，實際上換掉了訓練的質。
    chapters: [ch17, ch19]
    severity: high
    status: open

  - id: gap.symptom-period-vs-test-schedule
    statement: >-
      ch12 講測試選擇原則、ch22 講復健與復原，兩章之間沒有「症狀期撞上測試排程」
      的決策連結（是否延後、改等長、改預測式 multiple-RM）。
    chapters: [ch12, ch13, ch22]
    status: open
