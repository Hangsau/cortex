# 實務判斷層：由測試數據推導訓練決策的題型與判讀規則
#
# 抽取單位是「題型 + 判讀規則 + 課本缺口」，不是題目。
# 來源為 CSCS 讀書會的情境式討論；原文與作者一律不落盤（見 HANDOFF 的
# 「內容要吸收後再寫」）。案例只保留去識別化的參數輪廓與比值。
#
# 已納入驗收閘：cscs_check.py 會解析本檔的 chapters / domain 參照，並斷言
# 每個題型至少有一條分支、每個缺口至少橫跨兩章（單章的是待補內容不是缺口）。

meta:
  created: 2026-09-11
  source_kind: practitioner-discussion
  extraction_rule: 一則討論 → 題型分支 + 判讀規則 + textbook_gap，原文不存

  revisions:
    - date: 2026-09-11
      what: >-
        test-battery 題型的第三分支初版判定錯誤（判最大肌力，正解是水平向爆發），
        由讀書會公布的解答抓到。
      root_cause: >-
        三層疊加：(1) 用男性高層級的相對肌力門檻判 D-III 女性，把適當值讀成不足；
        (2) 把接近族群平均的垂直跳與嚴重偏離的水平跳合併敘述成「都差」，製造出
        「多項偏低」的假象；(3) 推理鏈裡沒有發力向量這一步。
      fix: >-
        reasoning_chain 前面補「常模族群對齊」、後面補「發力向量對應」，並以
        「缺口嚴重度排序」取代原本的「缺口數量與分布」。
      also_retracted: >-
        原先認定第二、第三分支「答案相反」的對照表。修正後兩者同屬爆發側，只是
        處方不同；真正的「先建肌力」分支只有第一個（男性高層級 + 相對肌力確實低
        + 轉換率已高於 0.8）。

    - date: 2026-09-11
      what: >-
        同日再錯兩題：機動性 drill 加難度判「加閃避」（正解加彎繞）、SEBT 起始
        方向判「順時針」（正解隨機，且主動論證隨機是錯的）。
      root_cause: >-
        兩題的正解都已寫在本庫：ch13.balance-flexibility-bc.i02 的 detail 明寫
        「起始方向與支撐腳隨機選定」，ch19.agility-cod.i02 明寫機動性是沿彎繞
        路徑維持速度。錯因不是推理鏈缺步驟，而是根本沒查 canonical，直接用外部
        帶進來的通則（「標準化＝一切固定」、「加難度＝加認知負荷」）覆蓋來源定義。
        與 D-III 女性那題（套男性門檻）是同一個根因的第三次發作。
      fix: >-
        新增 answering_protocol：查 canonical 列為第 0 步，先於任何推理。並把兩條
        具體規則各自建成題型（drill 難度進階、測驗流程固定 vs 隨機），加兩條缺口。

    - date: 2026-09-11
      what: >-
        九題一批，錯四題（RM 換算 12 次、游泳選手課表決策、長跑軀幹前傾角度、
        女性多次腦震盪步態）。四個根因彼此獨立，沒有一個是前兩次的重複。
      root_cause: >-
        最嚴重的不是那四題，而是第五個：公布的答案與我的答案衝突時，我把那則答案
        重新分類成「只是成員自己的算式，不算公布解答」，然後做了一張三方法對照表
        論證自己對。降級反證的理由（對方寫了「I hope I did it right」）是我挑出來的
        讀法。這與同日 SEBT 那次「主動論證正解是錯的」是同一件事，只是這次包裝得
        更像分析。
      fix: >-
        answering_protocol 前面再加兩步：反證優先（-1）與題型路由（0.5）。並新增
        兩個題型（RM 換算的表內外判定、外部研究的對照組檢查）、一條訓練狀態推斷
        規則、兩條缺口。同時改寫 ch17.load-repetitions.i04 的 detail——那句適用範圍
        警告寫成了精度註記的語氣，是我誤讀的成因之一。

answering_protocol:
  - step: -1. 反證優先
    rule: >-
      任何與我的答案衝突的來源（公布解答、使用者轉述、課本原文），一律先假定它
      是對的，再回頭找自己錯在哪。**禁止先評估來源的可信度**——「那只是某成員的
      算式」「他自己也說不確定」「出處頁碼可能有誤」這類判斷，只有在已經確認自己
      的推理無誤之後才允許提出。
    failure_mode: >-
      2026-09-11 兩次。SEBT 那次直接論證正解是錯的；RM 換算那次更隱蔽——我沒說
      對方錯，而是把對方的答案降級成「非正式解答」，再用一張自製的方法對照表
      證明自己對。答錯是知識缺口，改判反證的效力會讓後面每個判斷都失真。
  - step: 0. 先查 canonical
    rule: >-
      拿到題目先 grep data/cscs/ 找對應知識單位，用它的 detail 與 locator 作答。
      只有本庫確實沒有該條目時，才進入下面的推理層。
    failure_mode: >-
      2026-09-11 一天內三次踩到：三題錯答全部是「憑記憶推理，而正解就寫在檔案裡
      或與檔案的族群前提衝突」。其中 SEBT 那題我還用外部通則主動論證正解是錯的。
  - step: 0.5 題型路由
    rule: >-
      查完 canonical、開始推理之前，先問這題屬於本檔哪一個 template。命中就照該
      template 的 reasoning_chain 逐步走，不要另起一條推理路線。
    failure_mode: >-
      2026-09-11 游泳選手那題：applied.test-battery-to-training-decision 就是為這型
      建的，reasoning_chain 第一步「常模族群對齊」正是該題的考點（官方判準是
      低於第 60 百分位）。我卻繞去週期化理論，還寫了「她的數字很低」——說得出低
      卻沒去查那個低是第幾百分位，用定性形容詞取代了查表這個動作。規則擺著沒被
      調用等於不存在，所以路由必須是獨立的一步。
  - step: 1. 檢查是否在套外部通則
    rule: >-
      「標準化＝一切固定」、「加難度＝加認知負荷」、「背蹲 1.5–2.0 倍體重」都是
      外部帶進來的一般框架。來源的具體定義優先於任何一般框架；框架與來源衝突時
      一律以來源為準，不是反過來論證來源有問題。
  - step: 2. 檢查外部知識的適用邊界
    rule: >-
      引用課本以外的研究結論前，先確認題目的比較基準與該結論的比較基準是同一組。
      同一主題換一組對照就可能換一個結論；記得住結論不代表記得住它的對照組。
    failure_mode: >-
      2026-09-11 腦震盪步態那題：我調用「有腦震盪史 vs 無腦震盪」的結論（雙工敏感、
      單工測不出差異），題目問的卻是「多次腦震盪 vs 單次腦震盪」——在這個對比下
      單工與雙工都出現更大變化。我答成了她確實會經歷的那一項。

templates:
  - id: applied.test-battery-to-training-decision
    name: 由測試組合推導訓練決策
    stem_pattern: >-
      給定體型（身高／體重）、運動項目與位置，加上一組測試結果
      （下肢多關節 1RM、爆發式上舉 1RM、上肢推 1RM、縱跳、水平跳、
      短距衝刺、變向、代謝耐力其中數項），要求判斷下一訓練區塊的
      動作選擇或訓練重點。
    task: 先判定限制因子，再由限制因子導出訓練決策
    answer_axis: 最大肌力不足 ↔ 發力率不足 ↔ 無須變動

    reasoning_chain:
      - step: 訓練狀態只從訓練史讀
        rule: >-
          訓練狀態必須有明說的訓練史才能認定。「第一次測驗日」「賽季第一週」
          「剛轉入本隊」都只是行程描述，不解讀為「沒受過訓練」。預設值由身分
          給：大專校隊選手預設是受訓者，除非題目明說剛接觸阻力訓練。
        failure_mode: >-
          2026-09-11：把大三游泳選手的「first testing day」讀成「第一次接觸阻力
          訓練」，於是套用「肌肥大→基礎肌力→爆發力」的序列起點，答成肌肥大期。
          正解是最大肌力期。假設一抽掉整條推理就垮，而那個假設題目從未給過。
      - step: 常模族群對齊
        rule: >-
          先確認性別與競技層級，再挑常模。「背蹲 1.5–2.0 倍體重」是男性高層級的
          參照，套到女性或 D-III 會把適當值誤讀成不足；大專女性適當區間約
          1.2–1.6 倍體重。這一步放在最前面，錯了後面全錯。
          **要報出百分位，不能只說「偏低」**——判準落在百分位上（實測有以第 60
          百分位為門檻者），定性形容詞會讓後面那一步無從接手。
        failure_mode: >-
          2026-09-11 兩次。第一次用男性門檻判 D-III 女性，結論直接反向；第二次
          （游泳選手）連查表都沒做，只寫「數字很低」就跳到結論。
      - step: 變式換算
        rule: >-
          題目給的動作可能是變式，先換回可對常模的基準。前蹲約為背蹲 0.85 倍；
          trap bar 硬舉與背蹲槓桿不同，不可直接互換比對。
      - step: 相對肌力
        rule: 下肢 1RM ÷ 體重，對照上一步選定的族群常模
      - step: 力量轉換率
        rule: >-
          爆發式上舉 1RM ÷ 下肢 1RM。高於 0.8 表示轉換能力已超前、缺口在最大肌力；
          低於 0.6 表示力量有但轉換差、缺口在發力率與技術。
      - step: 課表現況反推
        rule: >-
          有 1RM 數據的動作就是現行課表動作。「新增什麼」的選項裡出現它，
          必定是干擾項。
      - step: 發力向量對應
        rule: >-
          把每項測試對應到項目的主要發力向量。滑冰推蹬與陸上衝刺是水平／側向，
          水平跳（立定跳遠）才是對應指標；垂直跳與水平跳是不同質，轉移有限，
          不可合併成單一個「爆發」。主要向量上的測試最差時，優先序最高。
      - step: 缺口嚴重度排序
        rule: >-
          逐項對各自族群常模算偏離幅度，看嚴重度排序，不看偏低項目的數量。
          單一指標嚴重偏離且該指標對應項目主要向量 → 直接訓練該質。只有在
          多項指標對各自常模皆偏低、且無單項突出偏離時，才判肌力基礎是上游原因。
        supersedes: >-
          舊版「缺口數量與分布」規則已撤除。它允許用「這是下游結果」覆蓋一個
          具體而嚴重的缺口，2026-09-11 就是這樣把水平爆發缺口判成肌力問題。

    distractor_logic:
      - type: 限制因子對應型
        note: 各選項分別對應一種限制因子，答錯反映比值判讀方向錯
      - type: 課表已有型
        note: 選項是已在測試組合中出現的動作，考「新增」的語意
      - type: 維持不變型
        note: 出現「不做調整」時，考的是能否確認缺口存在，而非排優先序

    branches:
      - id: branch.strength-base-deficient-with-power-present
        profile: 高大型項目位置；下肢相對肌力約 1.1 倍體重；轉換率約 0.83；縱跳顯著低於常模
        verdict: 最大肌力
        decision: 以下肢多關節最大肌力動作為主要強調
        why: 轉換率已高於 0.8，爆發表現不是缺口；相對肌力才是跳躍與位移的天花板

      - id: branch.strength-adequate-no-power-movement
        profile: 下肢相對肌力約 1.28 倍體重；測試組合中無任何爆發式上舉；變向與縱跳尚可
        verdict: 發力率
        decision: 新增爆發式上舉（power clean）
        why: 肌力基礎站得住而課表缺爆發質，邊際效益在提高發力率

      - id: branch.isolated-vector-specific-power-deficit
        profile: >-
          大專女性反覆衝刺型項目（冰球）；相對肌力對齊女性常模後屬適當
          （換算背蹲約 1.22 倍體重、trap bar 約 1.34 倍、臥推 0.68 倍）；
          垂直跳接近族群平均；水平跳嚴重偏離常模；代謝耐力無急迫問題
        verdict: 發力率（水平向）
        decision: 訓練區塊重點轉爆發發展，並偏水平／側向發力
        why: >-
          肌力對該族群已適當，唯一嚴重缺口落在水平跳，而水平發力正是滑冰推蹬的
          主要向量——最差的測試同時是項目最吃重的質，優先序最高。
        correction_note: >-
          此分支初版判為「最大肌力」，是錯的。三個錯誤疊加：套男性門檻、把接近
          平均的垂直跳和嚴重偏低的水平跳合併成「都差」、完全未納入發力向量。

    domain: [pa1-program-design, pa3-program-implementation]
    chapters: [ch12, ch13, ch17]

  - id: applied.behavior-modification-quadrant
    name: 教練行為的操作制約象限判別
    stem_pattern: >-
      給定教練目標（提升專注、提高訓練投入、修正技術錯誤），選項各為一種
      教練行為，要求選出最適當者。
    task: 先把每個選項歸入操作制約象限，再對照目標方向與 NSCA 的優先序
    answer_axis: 正強化 ↔ 負強化 ↔ 懲罰

    reasoning_chain:
      - step: 目標方向
        rule: >-
          題目要「增加」某行為（專注、投入）→ 答案在強化側；要「減少」某行為
          → 才看懲罰側。方向錯的選項先排除。
      - step: 象限歸類
        rule: >-
          給予想要的刺激＝正強化；移除嫌惡刺激＝負強化；移除想要的事物或施加
          嫌惡刺激＝懲罰。看的是「加或減」與「該刺激是想要或嫌惡」兩軸。
      - step: 優先序
        rule: >-
          NSCA 立場以正強化為首選。懲罰的已知副作用是提高焦慮與失敗恐懼，
          並把注意力從執行動作轉向避免受罰。
      - step: 訓練手段不當籌碼
        rule: >-
          把體能訓練、訓練特權當獎懲籌碼的選項，即使機制上成立也不選——它會
          讓該訓練被認知為懲罰，破壞其生理目的。

    distractor_logic:
      - type: 機制正確方向錯型
        note: 選項是有效的懲罰，但題目要增加行為，不是減少
      - type: 訓練當籌碼型
        note: 包裝成負強化，機制成立但違反訓練手段不作獎懲的原則

    branches:
      - id: branch.increase-focus-choose-positive-reinforcement
        profile: 目標為提升高強度區塊中的專注；選項含正強化、以體能為籌碼的負強化、削減特權的懲罰
        verdict: 正強化
        decision: 在技術達標的反覆之後給予肯定
        why: 方向與目標一致，且不動用訓練手段作籌碼

    domain: [sf2-sport-psychology]
    chapters: [ch08]

  - id: applied.drill-difficulty-progression
    name: drill 難度進階的變數選擇
    stem_pattern: >-
      給定一個已歸類的 drill（機動性、方向改變、敏捷、增強式其一），問如何提高
      其難度；選項各為一種加法（加彎繞、加閃避對手、加距離、加負荷、加刺激）。
    task: 先認出該 drill 所屬的質，再沿該質的定義變數加難度
    answer_axis: 沿定義變數加深 ↔ 換成另一種質

    reasoning_chain:
      - step: 認出 drill 屬於哪一質
        rule: >-
          機動性＝沿彎繞路徑盡量維持速度；方向改變＝急劇減速、轉向、再加速；
          敏捷＝在刺激下選擇反應（方向改變 + 知覺—認知）。看的是「有無急煞車」
          與「有無外部刺激」兩軸，不是看路徑複雜度。
      - step: 找出該質的定義變數
        rule: >-
          機動性的定義變數是彎繞（半徑、數量、入彎速度）；方向改變的是角度與
          進入速度；敏捷的是刺激的不可預測性與反應窗。
      - step: 沿定義變數加，不換類別
        rule: >-
          「把這個 drill 變難」與「進階到更難的 drill 類別」是兩個問題。加入外部
          刺激（閃避對手、反應信號）會把機動性或方向改變 drill 變成敏捷 drill——
          那是換質不是加難度，題目問前者時它是干擾項。
        failure_mode: >-
          2026-09-11 實際踩過：機動性 drill 問加難度，選了「加閃避」。閃避是敏捷
          的定義變數，不是機動性的。

    distractor_logic:
      - type: 換質型
        note: 選項是另一種質的定義變數（最常見：對機動性題給敏捷的加法）
      - type: 一般化超負荷型
        note: 加距離、加負荷這類通用超負荷，與該 drill 要練的質無對應

    branches:
      - id: branch.maneuverability-add-bends
        profile: 已歸類為機動性的 drill；選項含加彎繞、加閃避對手、加衝刺距離
        verdict: 加彎繞
        decision: 沿路徑增加彎繞成分（半徑更小、彎數更多）
        why: >-
          機動性的定義就是沿彎繞路徑維持速度，彎繞是它的定義變數；加閃避會把它
          變成敏捷 drill，加距離只是延長同難度的工作。

    domain: [pa1-program-design]
    chapters: [ch17, ch19]

  - id: applied.test-protocol-fixed-vs-randomized
    name: 測驗流程中哪些固定、哪些隨機
    stem_pattern: >-
      給定一個多條件測驗（SEBT 的八個伸展方向、多種跳躍、雙側測試），問某個
      流程細節該如何設定；選項含固定順序、依某規則排序、隨機、由受測者自選。
    task: 分清「流程標準化」與「條件順序隨機化」各管什麼
    answer_axis: 固定（流程） ↔ 隨機（條件順序）

    reasoning_chain:
      - step: 分辨問的是流程還是條件順序
        rule: >-
          流程＝所有受測者與所有重測都必須一致的執行方式（格網尺寸、試驗次數、
          組間休息、預先練習次數、姿勢維持時間、捨棄試驗的判準）。條件順序＝
          同一次測驗內多個條件（方向、肢側、變式）的呈現先後。
      - step: 流程一律固定
        rule: 流程不一致，跨人與跨時間的比較就失去意義；重測必須沿用初測的量測方法。
      - step: 條件順序一律隨機
        rule: >-
          固定順序會讓疲勞與學習效應系統性地偏壓特定條件（總是最後測的方向永遠
          最疲勞）。隨機化是在控制順序效應，不是在破壞標準化。
        failure_mode: >-
          2026-09-11 實際踩過：把「標準化＝一切固定」當無條件通則，判 SEBT 起始
          方向為順時針，並主動論證「隨機」選項錯。ch13 的 detail 原文就是隨機選定。

    distractor_logic:
      - type: 標準化過度推廣型
        note: >-
          選項給一個聽起來很嚴謹的固定規則（順時針、由短到長、固定先測優勢側）。
          「標準化」這個詞的正當性會讓它看起來永遠是對的，實際要看它管的是流程
          還是條件順序。
      - type: 受測者自選型
        note: 交給受測者決定既非標準化也非隨機化，方向上直接錯

    branches:
      - id: branch.sebt-start-direction-randomized
        profile: SEBT 八方向格網；問起始伸展方向與支撐腳如何決定
        verdict: 隨機
        decision: 起始方向與支撐腳隨機選定
        why: >-
          八個方向是八個條件而非流程步驟；固定起始點會讓後測方向承受累積疲勞。
          該測驗的流程面（每條件三次取平均、間隔 15 秒、至少預先練習四次、捨棄
          試驗的判準）才是必須固定的部分。

    domain: [pa3-program-implementation]
    chapters: [ch12, ch13]

  - id: applied.rm-conversion-table-or-equation
    name: RM 換算先判次數在不在表內
    stem_pattern: >-
      給定某動作的 multiple-RM（負荷 × 次數，常見 8／10／12／15 次），要求估算
      1RM，或反過來由 1RM 推某 RM 的負荷；選項是幾個相近的重量。
    task: 先判定次數落在 %1RM 關係表之內或之外，再選換算方法
    answer_axis: 查表 ↔ 預測方程式

    reasoning_chain:
      - step: 先看次數，不要先看重量
        rule: >-
          %1RM–反覆次數關係表的最後一列是 10 次（約 75% 1RM）。**次數 ≤10 就查表，
          次數 >10 就出表**，出表一律改用預測方程式（Epley：1RM = 負荷 ×
          (1 + 次數 ÷ 30)）。這一步要在任何算術之前完成，否則後面每一位數都錯。
      - step: 不要把處方表當換算表
        rule: >-
          「肌耐力：至多 67% 1RM、至少 12 次」是**目標導向的負荷／次數處方表**，
          它講的是訓練區間的邊界（要練肌耐力就落在這個區以下），不是「12 次 =
          67% 1RM」的換算係數。兩張表長得像、都由 %1RM 和次數組成，但一張回答
          「這個 RM 值多少 1RM」，另一張回答「要練這個質該開多少」。
        failure_mode: >-
          2026-09-11：185 lb × 12 次，我拿 67% 去除，答成 276 lb。正解走 Epley：
          83.9 × 1.4 ≈ 117.5 kg（約 259 lb）。誤讀的成因之一是本庫
          ch17.load-repetitions.i04 把適用邊界寫成了精度註記的語氣（該句已於同日
          改寫成邊界語氣）。
      - step: 單位先統一再算
        rule: >-
          題目給 lb、選項給 kg（或反過來）是常見設計。先換算再套公式，不要算完
          才換——四個選項常刻意涵蓋「算對但沒換單位」的值。
      - step: 同一份考卷不保證同一種方法
        rule: >-
          「這張卷子前面用查表，所以這題也該查表」是自己發明的一致性原則，沒有
          任何依據。方法由該題的次數決定，逐題獨立判定。
        failure_mode: >-
          2026-09-11：用「同卷同法」論證 12 次那題也該查表，還據此質疑公布的解答。

    distractor_logic:
      - type: 換方法型
        note: >-
          正解走方程式時，選項裡放查表算出的值（反之亦然）。這是本題型的主幹
          干擾項——四個選項常是「表／方程式 × 換／沒換單位」的四格。
      - type: 未換單位型
        note: 用對方法但停在原單位的值
      - type: 相鄰列型
        note: 查表時取到相鄰次數那一列的百分比（10 次 75% vs 8 次 80%）

    branches:
      - id: branch.reps-above-table-use-equation
        profile: 下肢多關節動作，負荷 185 lb、12 次
        verdict: 出表
        decision: 用 Epley 估 1RM（83.9 kg × 1.4 ≈ 117.5 kg）
        why: 12 次超過關係表的最後一列（10 次），表沒有這一格，只能用方程式外推

      - id: branch.reps-at-table-edge-use-table
        profile: 下肢多關節動作，負荷 250 lb、10 次
        verdict: 表內
        decision: 直接查表，10 次對應約 75% 1RM
        why: >-
          10 次正是關係表的最後一列，仍在表內。同一份考卷上這題查表、12 次那題
          用方程式，不是不一致——決定方法的是次數落點。

    domain: [pa1-program-design, pa3-program-implementation]
    chapters: [ch13, ch17]

  - id: applied.external-finding-comparison-baseline
    name: 外部研究結論的對照組檢查
    stem_pattern: >-
      給定一個帶研究背景的族群（多次腦震盪史、慢性踝關節不穩、經期階段、
      特定年齡層），問該族群「會出現什麼」；選項是幾個方向相近的生理或動作表現變化。
    task: 比對題目的對照組與我記得的那個結論的對照組是不是同一組
    answer_axis: 相對健康對照 ↔ 相對同類但程度較輕的對照

    reasoning_chain:
      - step: 標出題目的對照組
        rule: >-
          先把題目改寫成「A 相對於 B」。「多次腦震盪的女性選手會經歷什麼」的 B
          不是健康人，是**單次腦震盪者**；「慢性踝不穩」的 B 可能是健康踝，也
          可能是單次扭傷後已復原者。B 沒標出來就不要往下推。
      - step: 標出記憶中那條結論的對照組
        rule: >-
          回想到的研究結論一定也有它自己的 B。記得住結論不代表記得住對照組——
          結論是一句話，對照組是實驗設計，複習時最先掉的就是後者。
      - step: 兩個 B 不同就不能直接套
        rule: >-
          同一主題換一組對照就可能換一個結論。B 不同時，該結論對本題沒有效力，
          要改用其他依據；答案不會是「該族群確實會出現的任何一項」，而是**在這個
          對比下才成立的那一項**。
        failure_mode: >-
          2026-09-11：我調用「有腦震盪史 vs 無腦震盪」的結論（雙工作業敏感、單工
          測不出差異），但題目的對比是「多次 vs 單次」——在這個對比下單工與雙工
          都出現更大變化。我選的那項她確實會經歷，只是不是這題在問的對比。
      - step: 本庫沒有就明說沒有
        rule: >-
          這型題的來源常是課本以外的期刊研究。查不到 canonical 條目時，回答要
          標明依據是外部記憶而非本庫，並附推理；不要為了看起來有出處而引一條
          不相干的條目。

    distractor_logic:
      - type: 換對照組型
        note: >-
          選項是同族群在**另一種對比下**成立的結論。它本身是真的，所以最難排除——
          唯一的分辨方式是回到題幹確認 B 是誰。
      - type: 方向反轉型
        note: 把「更大變化」寫成「無顯著差異」，考的是記不記得效果方向

    branches:
      - id: branch.multiple-vs-single-concussion-gait
        profile: 女性選手，多次腦震盪史；問步態相關表現；選項含單工、雙工、無差異
        verdict: 對照組是單次腦震盪者
        decision: 單工與雙工作業下都出現較大的步態變化
        why: >-
          「單工測不出差異」是腦震盪史 vs 健康對照下的結論。改成多次 vs 單次的
          對比後，單工也顯現得出來。
        correction_note: >-
          此題我答錯，選了前一組對照下的結論。錯的不是記憶內容，是沒檢查對照組。

    domain: [pa1-program-design, pa3-program-implementation]
    chapters: [ch13, ch22]

gaps:
  - id: gap.test-ratio-to-exercise-priority
    statement: >-
      ch13 的常模只回答「這個數字算好算壞」，ch17 的動作選擇原則是從需求分析走，
      兩章之間沒有「由測試比值推導動作優先序」的顯式決策規則。
    chapters: [ch13, ch17]
    evidence: 三則情境討論全數卡在同一接縫，屬系統性缺口而非個案
    status: open

  - id: gap.norm-tables-not-stratified-for-decisions
    statement: >-
      ch13 的常模未分層到可直接判讀的程度：同一個相對肌力數字，對男性高層級是
      不足、對大專女性是適當，但表格沒把「該族群的適當區間」擺在判讀位置上，
      很容易拿錯尺。ch07 才是講性別與年齡差異的地方，但它的族群框架沒有被帶進
      ch13 的判讀位置——兩章之間斷開，查表時就會拿別的族群的尺。
    chapters: [ch07, ch13]
    severity: high
    evidence: 2026-09-11 實際造成一題判定反向
    status: open

  - id: gap.force-vector-specificity-in-test-interpretation
    statement: >-
      垂直跳與水平跳被 ch13 當成同一類「爆發」測試呈現，但兩者是不同質、轉移
      有限；ch17 的動作選擇也沒有「由項目主要發力向量回推該優先哪一項爆發測試」
      的入口。滑冰、衝刺這類水平推進項目最需要這條規則。
    chapters: [ch13, ch17]
    severity: high
    status: open

  - id: gap.lift-variant-conversion-factors
    statement: >-
      ch13 的常模表以標準動作（背蹲、臥推）為基準，但實務課表大量使用前蹲、
      trap bar 硬舉等變式，課本未給變式之間的換算係數，查表時直接卡住。ch15 教
      這些變式的動作技術，但不談它們與標準動作在負荷上的對應關係。
    chapters: [ch13, ch15]
    status: open

  - id: gap.training-means-as-reward-or-punishment
    statement: >-
      ch08 講操作制約的原則與懲罰的副作用，ch17／ch20 講各訓練手段的生理目的，
      但兩處之間沒有「不得把訓練手段當獎懲籌碼」的顯式跨章禁令——而這正是
      情境題最常見的干擾項設計。
    chapters: [ch08, ch17, ch20]
    status: open

  - id: gap.standardization-vs-randomization-boundary
    statement: >-
      ch12 立了測驗標準化與再測信度的原則，ch13 逐測驗給流程（SEBT 的 detail 就
      明寫起始方向隨機），但沒有任何一處把「流程要固定、條件順序要隨機」講成
      顯式規則。只讀 ch12 的原則會把標準化過度推廣成「一切固定」，剛好推翻
      ch13 的具體流程。
    chapters: [ch12, ch13]
    severity: high
    evidence: 2026-09-11 造成一題判定反向，且是主動論證正解為錯
    status: open

  - id: gap.progression-variable-per-quality
    statement: >-
      ch19 把機動性、方向改變、敏捷三者定義得很清楚，ch17 講超負荷與進階原則，
      但兩章之間沒有「每一質的難度進階該動哪個變數」的對照——結果是拿通用超負荷
      或另一質的定義變數去「加難度」，實際上換掉了訓練的質。
    chapters: [ch17, ch19]
    severity: high
    status: open

  - id: gap.running-technique-not-extracted
    statement: >-
      ch20 的八個主題全是能量系統與課表面（有氧因子、高地、心率換算、強度監控、
      週期化、課表設計、特殊議題、訓練型態），**跑步技術本身一條都沒抽到**——
      軀幹前傾角度、步頻步幅、觸地位置這類參數不在本庫。ch19 有速度與加速的
      技術段，但只到衝刺，接不上長距離。這是抽取遺漏不是範圍外：出處在
      ESC4 ch20 p.580 表 20.7。
    chapters: [ch19, ch20]
    severity: high
    evidence: 2026-09-11 造成一題答錯，且我把「本庫沒有」誤說成「課本沒有」
    recoverable: 有明確出處，可直接補抽
    status: open

  - id: gap.recovery-modality-effect-ranking
    statement: >-
      ch03 講到主動恢復清除乳酸快於被動恢復，那是**機制層**；但「幾種恢復手段
      之中哪一種對某個結果變項效果最大」這種排序，ch03 與 ch21 之間都沒有。
      情境題問的幾乎都是排序而非機制——知道主動恢復為什麼有效，答不出它和
      冷水浸泡、按摩、加壓誰排前面。
    chapters: [ch03, ch21]
    severity: high
    evidence: >-
      出處在 ESC5 ch21 p.696，其引用的統合分析為 Ortiz et al., JSCR
      33(8):2275-2287, 2019
    status: open

  - id: gap.symptom-period-vs-test-schedule
    statement: >-
      ch12 講測試選擇原則、ch22 講復健與復原，兩章之間沒有「症狀期撞上測試排程」
      的決策連結（是否延後、改等長、改預測式 multiple-RM）。
    chapters: [ch12, ch13, ch22]
    status: open
