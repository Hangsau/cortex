  - id: ch19.training-methods.i03
    q: 重量訓練如何可能轉移到衝刺表現？
    a:
    - 力量進步能否轉移到衝刺，取決於運動動作型態、峰值力量、RFD、加速度與速度型態，和運動專項之間的相似程度
    - 最大力量訓練可能有益，但訓練應結合最大力量與速度—力量品質
    - 高翻、抓舉、mid-thigh pull 等舉重動作與衍生動作，可能藉由肌肉剛度、RFD 及髖膝周邊肌肉共同活化的生理適應，增進衝刺表現
    detail: 教材以「may」描述舉重動作的轉移，而不是保證每一種動作都能直接提高速度；訓練特異性要同時看力、速度及動作型態，不只看動作外觀相似。
