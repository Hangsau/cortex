    - ch19.sprint-speed-components.i04
    locator: Running Speed > Technical Errors and Coaching > Table 19.1 Common Sprinting Technique Errors, Causes, and Corrections
  - id: ch19.sprint-technique.i08
    q: 本章如何劃分線性衝刺的技術階段？
    a:
    - 線性衝刺可分為起跑、加速與最大速度三個子任務
    - 三階段技術上不同，但都要求下肢經由支撐與飛行期，以最大速度主動移動
    - 支撐期包含離心煞車期與向心推進期；飛行期包含擺腿的回復與接地準備
    detail: 階段劃分用來協助教學與評估，不表示階段間有瞬間切換。訓練從加速轉至直立最高速度時，仍要保留連續的步態與正確力量傳遞。
