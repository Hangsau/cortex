- id: rfd-impulse
  title: RFD 與 Impulse 力學基礎
  desc: ''
  tag: 力學核心
  items:
  - id: ch19.rfd-impulse.i01
    q: 力量發展速率（rate of force development, RFD）是什麼？
    a:
    - RFD 是以最短時間發展最大力量，通常作為爆發力的指標
    - 可描述為力量的變化除以時間的變化
    - 在時間限制決定成敗的運動情境，RFD 可能比最大力量更有助於衡量爆發能力
    detail: RFD 關注的是施力速度，不是單看力量峰值；這正是它能處理多數競技動作無法等到最大力量出現的原因。
    terms:
    - rate-of-force-development
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch19.core-concepts.i06
    - ch19.neuromuscular-basis.i01
    locator: Speed and Agility Mechanics > Rate of Force Development
  - id: ch19.rfd-impulse.i02
    q: 為何最大力量不必然是短時間運動的主要限制？
    a:
    - 產生最大收縮力至少需要 300 ms
    - 許多運動活動只持續 0 至 200 ms
    - 功能動作施力通常很短，常為 0.1 至 0.2 秒；絕對最大力量發展可能需 0.6 至 0.8 秒
    detail: 本章以此時間落差說明 RFD 的實務價值，並非宣稱最大力量沒有用；較大的力量能力仍是快速施力的基礎之一。
    terms:
    - rate-of-force-development
    numbers:
    - v: 300
      unit: ms
      of: 產生最大收縮力至少所需時間
    - v: 0–200
      unit: ms
      of: 多數運動活動的時間範圍
    - v: 0.1–0.2
      unit: 秒
      of: 功能性動作通常施力的時間範圍
    - v: 0.6–0.8
      unit: 秒
      of: 絕對最大力量發展可能所需時間
    concepts:
    - force-production
    - measurement
    related:
    - ch19.core-concepts.i06
    - ch19.sprint-speed-components.i04
    locator: Speed and Agility Mechanics > Rate of Force Development > Figure 19.1 Force as a Function of Time
  - id: ch19.rfd-impulse.i03
    q: 衝量（impulse）是什麼，如何影響動量？
    a:
    - 衝量是產生的力量乘以產生該力量所需的時間，也是力量—時間曲線下的面積
    - 依衝量—動量關係，衝量決定物體動量改變的大小
    - 跑步每一步的施力大小與施力時間共同改變運動員動量，可用於加速、再加速或減速
    detail: 衝量把「力多大」與「能施力多久」一起納入；本章建議速度訓練除了 RFD 外，也要聚焦力量—時間曲線下的衝量。
    terms:
    - impulse
    - momentum
    - rate-of-force-development
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch19.rfd-impulse.i05
    - ch19.rfd-impulse.i06
    locator: Speed and Agility Mechanics > Impulse
  - id: ch19.rfd-impulse.i04
    q: 接地時間（ground contact time）在衝刺與方向改變中代表什麼？
    a:
    - 衝刺支撐期或方向改變植地期中，力量施加到跑步表面的時間稱為接地時間
    - 此期間的力量與時間乘積形成衝量；改變衝量便會改變動量
    - 最大速度期的接地時間比加速期短，且其施力不對稱、RFD 很高
    detail: 接地時間不是單獨追求愈短愈好。它必須配合動作階段和能否產生足夠力量解讀；方向改變的植地時間本來就通常長於衝刺。
    terms:
    - ground-contact-time
    - impulse
    - rate-of-force-development
    - change-of-direction
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch19.neuromuscular-basis.i06
    - ch19.program-design-monitoring.i02
    locator: Speed and Agility Mechanics > Impulse
  - id: ch19.rfd-impulse.i05
    q: 本章如何說明動量與衝量的實務意義？
    a:
    - 動量定義為物體質量與移動速度的關係
    - 衝刺時運動員身體質量保持不變；在相同時間窗內，要取得較大衝量只能產生較大的力量
    - 衝量增加或減少會改變動量，依意圖用於加速、再加速或減速後的變向
    detail: 本章刻意將焦點放在每一步的力量大小和施力時間，而非僅用導出的功率數值解釋表現。動量改變是衝量變化的結果，也是物體發生移動的原因。
    terms:
    - momentum
    - impulse
    numbers: []
