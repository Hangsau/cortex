    q: 本章列出的速度發展訓練目標是什麼？
    a:
    - 強調短地面支撐時間，以達到快速步頻；這需要高爆發力量，並由持續速度訓練與良好力量計畫系統性發展
    - 發展 SSC，以增加每個衝刺步伐的衝量幅度
    - 頂速優秀者可在短支撐期以 SSC 產生高力量；完整舉重動作及其衍生動作可用高於自由衝刺的力量過負荷 SSC
    detail: 這些目標連結步態品質與力量傳遞，並不等於單獨操練「更快腳步」。Fast Feet 操練的文字說明同樣提醒：步頻是短接地時間高垂直力量的副產物。
