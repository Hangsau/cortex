  - id: ch19.rfd-impulse.i08
    q: 為何速度訓練應同時關注 RFD 與衝量？
    a:
    - RFD 描述力量隨時間增加的速率，適用於施力時間極短的動作
    - 衝量是力量與時間的乘積，代表每一步可改變多少動量
    - 速度成功依賴短時間內施力，因此訓練不只要提高施力速率，也要重視每一步力量—時間曲線下的衝量
    detail: 兩者相關但不是同義詞：RFD 專注曲線的斜率，衝量專注曲線下面積。把衝量誤寫成力量乘速度，會把它和功率混淆。
