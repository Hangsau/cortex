  - id: ch19.sprint-speed-components.i03
    q: 本章所列菁英與新手男性衝刺者的步頻與接地時間為何？
    a:
    - 菁英男性的步頻接近每秒 4.63 步；新手為每秒 4.43 步
    - 在最大速度時，菁英男性接地時間為 0.087 秒；新手為 0.101 秒
    - 菁英者以較頻繁步頻花更多時間在空中，但擺腿重新就位所需時間與較慢者相近
    detail: 較快的步頻不是只靠「腳動得更快」；教材把差異連到在更短接地時間內施加力量，以及恰當的垂直施力方向。
