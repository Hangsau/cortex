  - id: ch19.neuromuscular-basis.i05
    q: 肌肉剛度（muscle stiffness）與步頻有何關係？
    a:
    - 在固定跑速下，步頻提高時，腿部彈簧的一項重要特徵是肌肉剛度提高
    - 力量與速度訓練的暴露可能與衝刺所用肌群預活化提高有關
    - 肌梭回饋所需時間改善，與更大的肌肉剛度及肌腱順應性有關
    detail: 這組生理條件為 SSC 與 SMM 提供支持；本章的實務建議是安排能提高神經驅動、並過負荷 SSC 中髖與膝區肌群的運動。
