  - id: ch19.training-methods.i08
    q: 選用衝刺輔助或阻力工具時，本章的共同原則是什麼？
    a:
    - 阻力方式可為加速期過負荷，但負荷必須保留非阻力衝刺的正常生物力學
    - 輔助／超速方式理論上讓運動員暴露於更高速度，卻可能縮短施力時間、降低肌肉活化與推進力
    - 教材認為超速訓練的研究支持很少，應優先選擇自然、安全、符合訓練狀態與最佳力學的頂速訓練工具
    detail: 兩類工具不是對稱的「一個練加速、一個必然練頂速」。表格對阻力訓練提供保留正常力學的使用建議，對輔助訓練則明確要求在採用前審慎評估其影響。
