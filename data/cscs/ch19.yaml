  - id: ch19.sprint-speed-components.i02
    q: 本章所列菁英與新手男性衝刺者的最大速度步幅為何？
    a:
    - 菁英男性衝刺者在最大速度的步幅為 2.70 m；新手為 2.56 m
    - 本章將步幅視為身體質量的位移，並指出較佳的垂直力量方向可讓菁英者跑得更遠
    detail: 這是書中引用的菁英男性與新手比較資料，不可擴大成所有運動員的常模。教材的重點也不是叫人刻意跨大步，而是正確向地面傳遞力量。
