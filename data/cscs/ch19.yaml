cards:
- q: 本章如何定義速度（speed）？
  a: 速度是達成高移動速度所需的技能與能力；衝刺速度要求能加速並達到最大速度。物理上 speed 只描述快慢，velocity 才同時包含快慢與方向。
  tag: speed-definition
- q: 方向改變與敏捷（agility）的核心差異是什麼？
  a: 方向改變是在預先規劃路徑上爆發性改變移動方向、速度或模式；敏捷還必須因應刺激，結合方向改變與知覺—認知能力。
  tag: cod-agility-definition
- q: 力量發展速率（rate of force development, RFD）是什麼？
  a: RFD 是在最短時間發展最大力量，通常作為爆發力指標；可描述為力量變化除以時間變化。在時間限制決定成敗的動作中，它可能比最大力量更有用。
  tag: rfd-definition
- q: 衝量（impulse）與動量改變有何關係？
  a: 衝量是力量乘以施力時間，也是力量—時間曲線下面積；依衝量—動量關係，它決定動量改變的大小。跑步每一步可藉衝量改變來加速、再加速或減速。
  tag: impulse-momentum
- q: 肌肉剛度（muscle stiffness）與衝刺步頻有何關係？
  a: 在固定跑速下，步頻提高時腿部彈簧的重要特徵是肌肉剛度提高。力量與速度訓練可能提高衝刺肌群預活化，並改善肌梭回饋所需時間。
  tag: muscle-stiffness
- q: 伸展—縮短循環（stretch–shortening cycle, SSC）在衝刺中是什麼？
  a: SSC 是肌肉—肌腱複合體快速被拉長後立即以反應性或彈性方式縮短的離心—向心耦合；其急性作用傾向透過彈性能量回收提升機械效率與衝量。
  tag: ssc-sprinting
- q: 神經驅動（neural drive）如何與衝刺相關？
  a: 神經驅動是神經系統送往目標肌肉之衝動的速率與振幅。力量訓練可提升它；增加的動作電位發生速率與肌力及 RFD 增加相關。
  tag: neural-drive
- q: 複合訓練中的運動後活化增益（PAP）是什麼？
  a: 複合訓練在同一訓練交替 SSC 任務與重阻力運動；其基礎是稱為 PAP 的急性後效應。教材指出它可能不適合初學者或青少年。
  tag: pap-sprinting
- q: 步幅與步頻如何影響衝刺速度？
  a: 衝刺速度的經典定義著重步幅與步頻的關係；速度可藉步幅增加或步頻增加而提高。讓兩者最大化的底層要素是快速力量產生。
  tag: speed-stride-frequency
- q: 本章比較的菁英與新手男性衝刺者步幅、步頻有何差異？
  a: 最大速度時，菁英男性步幅為 2.70 m、新手為 2.56 m；菁英步頻為每秒 4.63 步、新手為每秒 4.43 步。菁英者擺腿重新就位時間與較慢者相近。
  tag: elite-vs-novice-stride
- q: 衝刺起跑的技術重點為何？
  a: 用起跑器、三點或四點交錯起跑建立平衡的 set position，讓肢段角度有利爆發施力；雙腿積極伸展並全力推向起跑器或地面，產生高水平速度。
  tag: sprint-start-technique
- q: 起跑後加速的技術重點是什麼？
  a: 最初幾步擺腿低位回收、腳趾幾乎不離地，並持續推地；頭部放鬆中立，與軀幹同速上升。約到 20 m 時，重心已升到幾乎直立的衝刺位置。
  tag: sprint-acceleration
- q: 最大速度期的姿勢原則是什麼？
  a: 支撐期維持堆疊關節：肩在髖上方、髖在足部上方；頭部放鬆中立、眼睛看前方、肩膀下沉放鬆，手臂以和腿部週期相同速率擺動。
  tag: sprint-max-velocity
- q: 本章列出的衝刺常見技術錯誤有哪些例子？
  a: 起跑時髖過高、初始驅動期向側面跨出、手臂過短緊繃、過早直立、過度跨步、刻意延續加速姿勢、腿部循環與手臂橫向錯誤動作，都是表 19.1 所列例子。
  tag: sprint-common-errors
- q: 衝刺時手臂動作應如何提示？
  a: 教材建議手臂向下、向後驅動，並讓手臂回收靠近身體中線；在最大速度期，肩膀保持下沉放鬆，手臂與腿部週期同速擺動。
  tag: arm-action-sprinting
- q: 方向改變表現的身體與動作因素有哪些？
  a: 較佳表現與較快髖伸展、較低重心、較大煞車與推進衝量、進入時較多膝屈曲及較小軀幹角位移相關。進入速度與切入角度愈大，所需衝量愈大。
  tag: cod-biomechanics
- q: 敏捷與方向改變訓練的進展差異是什麼？
  a: 先用預先規劃的方向改變操練建立身體能力與技術，再加入哨音、口令、箭頭或燈光等一般刺激；之後進展至具運動專項刺激的閃避操練與小場比賽。
  tag: agility-vs-cod-training
- q: 哪些知覺—認知因素構成敏捷？
  a: 視覺掃描、預期、模式辨識、情境知識、決策時間與正確性，以及反應時間。這些能力多具運動專項性，進攻與防守情境也會改變處理策略。
  tag: perceptual-cognitive-agility
- q: 本章的方向改變與敏捷測驗如何分類？
  a: 表 19.2 將 reactive agility tests 列為同時測量方向改變速度與知覺—認知能力；505 與 pro agility 測驗列為方向改變速度，T-test、Illinois agility 與 L-run 較著重機動性。
  tag: cod-tests
- q: 阻力衝刺的目的與工具是什麼？
  a: 雪橇拖拉、風阻、上坡衝刺與推雪橇旨在改善加速，並強調較低的軀幹、髖與脛角。負荷過重會延長接地時間與縮短步幅，應保留正常衝刺力學。
  tag: resisted-sprint-training
- q: 輔助／超速衝刺的理論與限制是什麼？
  a: 繩索、彈力繩拉引或下坡跑企圖讓運動員以超過無輔助衝刺的速度跑動，假設提高步頻可帶來神經肌肉適應；但可能過早催促支撐期並降低肌肉活化與推進力。
  tag: assisted-overspeed-sprint
- q: 舉重動作如何可能轉移到衝刺？
  a: 高翻、抓舉與 midthigh pull 等動作及其衍生動作，可能透過肌肉剛度、RFD 與髖膝周邊肌肉共同活化等適應增進衝刺。轉移仍取決於動作、力量與速度型態的特異性。
  tag: weightlifting-sprint-transfer
- q: 本章如何定位最大力量訓練與衝刺？
  a: 最大力量訓練可能有益，但衝刺訓練應結合最大力量與速度—力量品質；最重要的是能否在動作所限的短時間內，產生所需力量與速度型態。
  tag: max-strength-sprint
- q: 彈力繩拉引在本章屬於哪一種衝刺工具？
  a: 表 19.3 將 bungee cord pulls 列在輔助訓練／超速訓練的例子，目的在讓運動員跑出超過無輔助衝刺的速度；教材同時提醒要審慎評估其力學風險。
  tag: band-resisted-speed
- q: 本章如何呈現速度訓練的訓練量與休息？
  a: 速度發展應按訓練區塊處方組、重複、距離與組間休息，例如短到長範例在不同區塊用短衝刺、加速與頂速工作；不應套用未列於本章的固定總距離或工作休息比。
  tag: speed-training-volume
- q: 本章如何定義用於發展衝刺能力的衝刺工作？
  a: 衝刺被描述為通常在短距離與短時間內進行的快速、非配速、最大努力跑動；方法章指出沒有任何運動比最大速度衝刺更能改善跑速。
  tag: speed-training-intensity
- q: 本章的短到長速度範例如何安排組間休息？
  a: 休息隨距離與訓練區塊改變：第一區塊的 15 m、20 m 上坡衝刺分別列 1.5、2 分鐘；後續較長的加速、飛跑與速度耐力工作則列較長休息。教材沒有給單一通用休息規則。
  tag: speed-training-rest
- q: 本章的短到長速度範例如何安排每週訓練？
  a: 範例在第一至第四區塊都安排週一、週三、週五的衝刺工作，並隨區塊改變加速、頂速、速度耐力與專項耐力的重點；這是範例，不是所有運動員的固定頻率處方。
  tag: speed-training-frequency
- q: 短到長模型如何以距離發展加速與頂速？
  a: 模型一開始用短距離衝刺發展加速與推進力，後續以較長衝刺銜接直立跑姿的頂速工作；範例也以 acceleration hold 作為從加速力學轉入頂速與速度耐力的橋梁。
  tag: acceleration-training-distance
- q: 速度發展如何運用週期化？
  a: 速度規劃應按階段強調與淡化特定品質，協調衝刺的身體與心理成分。短到長範例依序成熟加速、長加速與過渡、頂速，並在後期維持加速與加入耐力工作。
  tag: speed-periodization
- q: 切入角度如何影響方向改變訓練？
  a: 小於 75° 的淺切入通常接地時間短於 250 ms，身體需求接近速度訓練；等於或大於 75° 的較急切入因煞車需求較大，常超過 250 ms，宜更強調離心與最大力量。
  tag: cod-cutting-angles
- q: 方向改變煞車與再加速的姿勢原則是什麼？
  a: 減速時控制軀幹，支撐期將軀幹與髖重新朝向行進方向，並以低重心進出變向；膝蓋要在有效活動範圍內吸收離心煞車負荷，避免僵直腿式煞車。
  tag: cod-plant-technique
- q: 如何讓方向改變操練成為敏捷操練？
  a: 在封閉式操練加入需要反應的刺激，例如哨音、教練口令、指向箭頭或閃光箭頭；進階時改用閃避操練、小場比賽等具運動專項刺激的活動，並增加時間或空間壓力。
  tag: reactive-agility-test
- q: 本章的 A-skip 與 Fast Feet 操練各自要練什麼？
  a: A-skip 模擬直立衝刺力學與垂直力量產生；Fast Feet 旨在發展步頻。兩者皆要求堆疊關節、足部在髖下著地，且手臂與腿部同速動作。
  tag: speed-warmup
- q: 本章對衝刺技術提示提供哪些例子？
  a: 起跑與加速可提示低位腳跟回收、腳向下穿過地面、積極完整的手臂動作，以及頭部與脊柱對齊；修正方向改變可用「把地面推開」的外部注意焦點。
  tag: speed-technique-cues
- q: 除完成時間外，如何監控衝刺發展？
  a: 可用高速攝影機或光學計時系統監控接地時間、步長、步幅、騰空時間、步幅角度、速度與加速度；這些資料可補足手持計時與起跑方式造成的解讀限制。
  tag: split-timing-sprinting
- q: 上坡與下坡衝刺在本章的定位是什麼？
  a: 上坡衝刺是阻力衝刺，可促進加速期較低的軀幹、髖與脛角；下坡跑是超速訓練例子，但可能讓運動員「尋找地面」、增加不必要離心力並改變 SSC。
  tag: hill-sprint-training
- q: 本章對初學者與青少年使用複合訓練有何提醒？
  a: 複合訓練以交替 SSC 任務與重阻力運動為基礎，雖日益用於提升進階運動員表現，但教材說它可能不適合初學者或青少年。
  tag: speed-agility-youth
- q: 力量訓練轉移到衝刺時的特異性如何判斷？
  a: 轉移程度可能來自訓練動作與運動專項在動作型態、峰值力量、RFD、加速度與速度型態上的相似性；因此不應只以動作外觀判定是否特異。
  tag: speed-specificity
- q: 為何衝刺者仍需要力量訓練？
  a: 衝刺要求在短時間產生足以承托體重、克服重力並增加速度的力量。最大力量可有益，但教材建議將最大力量與速度—力量品質結合，並依特異性促進轉移。
  tag: strength-base-for-speed
- q: SSC 訓練活動應如何安排？
  a: 選擇能沿動力鏈傳遞力量並利用彈性—反射機制的技巧性多關節動作；為管理疲勞與保持品質，使用短工作段或叢集，並穿插頻繁休息。
  tag: plyometrics-speed-bridge
- q: 短到長速度範例如何安排速度耐力？
  a: 範例在第三區塊開始暴露速度耐力與專項耐力，並安排在一週較後段，因累積疲勞可能降低神經驅動；第四區塊則持續安排與主要項目相關的速度耐力或專項耐力。
  tag: speed-endurance
- q: 如何計算方向改變缺額（COD deficit）？
  a: 它是等長直線衝刺與方向改變測驗完成時間的差。書中範例為從 505 方向改變時間扣除 10 m 直線衝刺時間，用以表示方向改變需求額外花費的時間。
  tag: cod-deficit-assessment
- q: 本章如何評估與監控衝刺能力？
  a: 長期常用與專項相關距離的最大努力直線衝刺，例如 40 yards（36.6 m）；完成時間有效但會受手持計時與起跑策略影響，因此可加用高速攝影機或光學計時系統的步態資料。
  tag: acceleration-tests
- q: 本章提到哪些速度與敏捷監控設備？
  a: 衝刺可使用高速攝影機或以紅外線中斷記錄足部接觸資料的光學計時系統；方向改變與敏捷可用每秒超過 100 幀的高速攝影機，搭配手持或電子計時。
  tag: speed-training-equipment
- q: 本章的短到長範例在週內如何變化？
  a: 每個區塊以週一、週三、週五安排工作，但工具會逐步由上坡衝刺與起跑，轉為飛跑、加速維持、速度耐力與專項耐力；週內安排服務於該區塊的主要、次要與第三目標。
  tag: speed-weekly-schedule
- q: 本章對衝刺力量訓練的肌群重點是什麼？
  a: 教材建議安排可提高神經驅動、並過負荷 SSC 中髖與膝區肌群的運動；舉重動作可能透過髖膝周邊肌肉共同活化、肌肉剛度與 RFD 適應協助衝刺。
  tag: sprint-strength-focus
- q: 速度監控應如何解讀步態資料？
  a: 接地時間縮短且完成時間改善，通常表示較能在短時間產生高施力速率；但加速初期接地時間可能稍長。騰空時間增加也有兩種可能，須分辨是短時大力的有效位移，或過久施力造成不必要的垂直振幅。
  tag: speed-monitoring
- q: 方向改變訓練如何建立煞車能力？
  a: 先從低量的前向減速操練開始，讓運動員保持低姿勢、犧牲速度以練好位置；再進展側向減速與再加速。需能在膝的有效活動範圍吸收離心煞車負荷，避免僵直腿式煞車。
  tag: cod-acl-prevention
- q: 短到長速度發展的四個區塊依序強調什麼？
  a: 第一區塊主攻加速；第二區塊主攻長加速、次要為轉直立跑姿、第三目標為速度耐力；第三區塊開始頂速、維持加速並繼續耐力；第四區塊主攻頂速並維持其餘能力。
  tag: speed-periodization-phases
- q: 本章如何安全地進展敏捷操練？
  a: 先建立身體與技術勝任度，再由初學者方向改變操練逐步增加進入速度、切入角度、再加速與知覺—認知壓力；煞車任務要從類似初次導入離心任務的低量開始。
  tag: speed-agility-safety
- q: set position 的關鍵要素是什麼？
  a: 在起跑器、三點或四點交錯起跑中，用平衡的體重分配與有助爆發施力的肢段角度建立預備姿勢；本章列菁英者前小腿約 90°、後小腿約 133° 作為參考資料。
  tag: set-position-sprint-start
