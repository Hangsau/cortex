  - id: ch19.rfd-impulse.i07
    q: 本章為何不以功率（power）作為爆發表現的主要指標？
    a:
    - 功率源自力量與速度，是一個衍生的力學構念
    - 單一功率值無法指出該值是由力量還是速度造成
    - 本章認為力量、RFD 與衝量已是直接量測，不需要再以較複雜的衍生值增加洞見
    detail: 這是本章對功率用於理解速度與敏捷表現的限制，而非說功率不能量測或完全沒有用途；教材原文如此，重點是其解釋力不足以拆開施力與速度來源。
