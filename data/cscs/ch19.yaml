  - id: ch19.neuromuscular-basis.i07
    q: 為何方向改變的煞車須特別訓練高速離心收縮？
    a:
    - 有效煞車是敏捷表現的重要部分，應考量高速、高力離心收縮的神經肌肉發展
    - 離心收縮所動用的適應或運動單位徵召途徑，與向心收縮不同
    - 離心訓練的適應似乎對離心負荷速度具有特異性
    detail: 書中因此建議以動作所需的高速離心負荷建立煞車能力；drop landing、負重跳落地與高翻或抓舉接槓都能提供離心負荷，但各自作用於髖、膝、踝的方式不同。
