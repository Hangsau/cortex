- id: sprint-speed-components
  title: 跑步速度構成 步幅 × 步頻
  desc: ''
  tag: 速度決定因子
  items:
  - id: ch19.sprint-speed-components.i01
    q: 步幅與步頻如何影響衝刺速度？
    a:
    - 衝刺速度的經典定義著重步幅與步頻的關係
    - 速度可藉步幅增加或步頻增加而提高
    - 讓兩者達到最大化的底層要素是快速力量產生
    detail: 本章沒有把速度寫成可脫離力學的固定算式，而是進一步以著地期的力量大小、方向與施力時間，說明為何有些運動員能兼具較長步幅與較高步頻。
