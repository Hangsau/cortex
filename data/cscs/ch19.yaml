  - id: ch19.neuromuscular-basis.i06
    q: 方向改變、敏捷與衝刺的接地時間如何比較？
    a:
    - 敏捷動作的植地接觸時間為 0.23 至 0.25 秒，方向改變動作為 0.44 至 0.722 秒
    - 兩者都長於衝刺加速期的 0.17 至 0.20 秒與最大速度期的 0.09 至 0.11 秒
    - 因此，多數方向改變需要較長的 SSC 活動
    detail: 接地時間的差異是本章將方向改變的訓練需求與直線衝刺區隔開的理由之一；較長並不代表較好，而是反映煞車、重新定向及再加速的負荷。
