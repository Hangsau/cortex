  - id: ch19.agility-cod.i02
    q: 方向改變能力與機動性（maneuverability）有何不同？
    a:
    - 急劇方向改變需要迅速減速、改變身體朝向，再爆發性地加速
    - 需要繞錐筒或物體、盡量維持速度的測驗，較可視為機動性測驗
    - Illinois agility test 與 L-run 的路徑包含彎繞以維持速度，並非都是要求急煞車的方向改變
    detail: 相近總長度的測驗未必測到同一種方向改變能力；傳統 505、modified 505 與 L-run 的關聯只有中等，選測驗前要先確認運動專項真正需要的是急煞車或機動性。
    terms:
    - change-of-direction
    - maneuverability
    - five-zero-five-agility-test
    - illinois-agility-test
    - l-run
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
