  - id: ch19.agility-cod.i04
    q: 知覺—認知能力（perceptual–cognitive ability）包括哪些成分？
    a:
    - 視覺掃描、預期、模式辨識與情境知識
    - 決策所需時間與正確性，以及反應時間
    - 這些能力多具運動專項性；本章只在敏捷訓練方法中討論一般性練習
    detail: 有足夠的身體方向改變能力後，才能把這些知覺—認知成分整合到場上表現；它們不是單靠預先規劃的封閉式方向改變操練就能完整訓練的能力。
    terms:
    - perceptual-cognitive-ability
    - agility
    numbers: []
    concepts:
