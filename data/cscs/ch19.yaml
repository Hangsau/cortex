    - ch13.agility-speed.i05
    locator: Agility Performance and Change-of-Direction Ability > Factors Affecting Change of Direction and Perceptual–Cognitive Ability
  - id: ch19.agility-cod.i03
    q: 何時測到的是方向改變能力，何時才是敏捷？
    a:
    - 沒有反應成分的測驗應視為方向改變測驗；含有反應刺激的測驗才依定義測到敏捷
    - Table 19.2 將 reactive agility tests 列為同時測到方向改變速度與知覺—認知能力；505 與 pro agility 測驗只列方向改變速度
    - T-test、Illinois agility 與 L-run 較著重機動性；測驗時間愈長，代謝需求愈可能影響成績
    detail: 「agility」出現在測驗名稱並不保證它測的是敏捷；測驗的刺激與路徑決定了其建構內容，因此應依該運動最重要的能力選擇多種測驗共同監控。
