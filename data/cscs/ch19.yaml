  - id: ch19.sprint-speed-components.i05
    q: 本章比較的菁英與新手男性最大速度為何？
    a:
    - 菁英男性衝刺者可達約 12.55 m/s；新手受限於約 11.25 m/s
    - 較快衝刺者在短支撐期持續施加高力量，因此產生較長而頻率較高的步幅
    - 雖然力量產生可說是限制因素，技術效率與適當訓練也限制衝刺速度
    detail: 這是教材舉用的族群比較值，並非速度診斷的切點；應搭配步幅、步頻與接地時間，才看得出表現改變發生在哪一個環節。
