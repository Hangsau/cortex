- id: neuromuscular-basis
  title: 神經生理基礎 SSC / SMM / 肌肉剛度
  desc: ''
  tag: 生理機制
  items:
  - id: ch19.neuromuscular-basis.i01
    q: 神經驅動（neural drive）如何與衝刺表現相關？
    a:
    - 神經驅動是神經系統送往目標肌肉之衝動的速率與振幅
    - 力量訓練可提高神經驅動；其增加代表動作電位發生速率上升，並與肌力及力量發展速率的增加相關
    - 增強式訓練可提高高閾值運動神經元興奮性，也能增進神經驅動
    detail: 本章以神經驅動串連力量訓練、增強式訓練與衝刺訓練的神經肌肉適應，並將其視為可能促進 RFD 與衝量產生的因素，而非保證單一訓練就會直接提升衝刺成績。
    terms:
    - neural-drive
    - action-potential
    - rate-of-force-development
    - motor-neuron
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch19.rfd-impulse.i01
    - ch19.training-methods.i03
    - ch01.neuromuscular.rate-coding
    locator: Neurophysiological Basis for Speed > Nervous System
  - id: ch19.neuromuscular-basis.i02
    q: 伸展—縮短循環（stretch–shortening cycle, SSC）是什麼？
    a:
    - SSC 是肌肉—肌腱複合體快速且強制地被拉長或預拉伸後，立即以反應性或彈性方式縮短的離心—向心耦合現象
    - 快速從離心動作轉換到向心動作的跑、跳與爆發性速度改變，特別常見 SSC
    - 急性 SSC 動作傾向透過彈性能量回收，提高機械效率與衝量
    detail: 在菁英運動員中，SSC 表現是一項獨立於最大力量的能力；它利用肌肉—肌腱本身特性以及傳回神經系統的力量與長度反射回饋。
    terms:
    - stretch-shortening-cycle
    - eccentric-action
    - concentric-action
    - impulse
    numbers: []
    concepts:
    - force-production
    - reflex
    related:
    - ch19.neuromuscular-basis.i03
    - ch19.training-methods.i04
    locator: Neurophysiological Basis for Speed > Stretch–Shortening Cycle
  - id: ch19.neuromuscular-basis.i03
    q: 改善 SSC 表現的訓練活動應符合哪些條件？
    a:
    - 動作應是能沿動力鏈傳遞力量並利用彈性—反射機制的技巧性多關節動作
    - 為管理疲勞、強調工作品質與技術，應安排短工作段或叢集，並穿插頻繁休息
    - 漸進增強式訓練與重阻力方法的組合可達成這兩個目標；複合訓練是在同一次訓練交替 SSC 任務與重阻力運動
    detail: 複合訓練的急性後效應被稱為運動後活化增益；書中說它日益流行於進階運動員，但可能不適合初學者或青少年。
    terms:
    - stretch-shortening-cycle
    - complex-training
    - postactivation-potentiation
