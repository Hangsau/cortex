title: Ch.19 速度與敏捷訓練計畫設計
topics:
- id: agility-cod
  title: 敏捷與方向改變 COD
  desc: ''
  tag: 多向運動
  items:
  - id: ch19.agility-cod.i01
    q: 切入角度如何改變方向改變的身體需求？
    a:
    - 小於 75° 的淺切入通常接地時間短於 250 ms，身體需求接近速度訓練，但仍須加入知覺—認知訓練
    - 等於或大於 75° 的較急切入，因煞車需求較大，接地時間常超過 250 ms
    - 較急的切入應在再加速所需的向心爆發力之外，更強調離心力量與最大力量
    detail: 這是依切入角度與進入速度而改變的負荷，不是把某一種切入技術當成所有敏捷動作的通則；技術選擇本身也會改變力量與接地時間的需求。
    terms:
    - change-of-direction
    - agility
    - ground-contact-time
    - eccentric-action
    - relative-strength
    numbers:
    - v: 75
      unit: 度
      of: 區分淺切入與較急方向改變的切入角度
    - v: 250
      unit: ms
      of: 淺切入與較急切入常用的接地時間分界
    concepts:
