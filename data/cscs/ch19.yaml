- id: core-concepts
  title: 三大核心概念 Speed / COD / Agility
  desc: ''
  tag: 定義必考
  items:
  - id: ch19.core-concepts.i01
    q: 速度（speed）在本章的定義是什麼？
    a:
    - 速度是達成高移動速度所需的技能與能力
    - 衝刺速度需要能加速並達到最大速度
    detail: 本章將 speed 用於描述高移動速度的能力；物理上 speed 是只有快慢、沒有方向的純量，不能和同時包含方向的 velocity 混用。
    terms:
    - speed
    - acceleration
    - velocity
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch19.sprint-speed-components.i01
    - ch19.rfd-impulse.i01
    locator: Running Speed
  - id: ch19.core-concepts.i02
    q: 方向改變（change of direction）在本章的定義是什麼？
    a:
    - 方向改變是爆發性改變移動方向、速度或移動模式所需的技能與能力
    - 預先決定路徑時，運動員受限於其減速、重新定向與再加速的身體能力
    detail: 加速只是方向改變能力的一部分；減速能力與移動模式的要求，讓其訓練需求不同於單純直線速度。
    terms:
    - change-of-direction
    - acceleration
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch19.agility-cod.i05
    - ch19.agility-cod.i06
    locator: Agility Performance and Change-of-Direction Ability
  - id: ch19.core-concepts.i03
    q: 敏捷（agility）在本章的定義是什麼？
    a:
    - 敏捷是在回應刺激時，改變方向、速度或移動模式所需的技能與能力
    - 它結合方向改變能力與知覺—認知能力
    detail: 刺激可以是防守者或球；同樣的身體變向，是否需在刺激下選擇反應，決定它在本章被歸為敏捷或預先規劃的方向改變。
    terms:
    - agility
    - change-of-direction
    - perceptual-cognitive-ability
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch19.agility-cod.i03
    - ch19.agility-cod.i04
    - ch13.agility-speed.i01
    locator: Agility Performance and Change-of-Direction Ability
  - id: ch19.core-concepts.i04
    q: 為何方向改變與敏捷不能視為同一訓練品質？
    a:
    - 方向改變可在預先規劃的路徑上檢驗身體能力與技術
    - 敏捷除了方向改變能力，還要因應刺激所帶來的知覺—認知要求
    - 敏捷中的時間限制可能縮短可用來產生所需力量與衝量的時間，因而改變身體需求
    detail: 兩者重疊但不等同；若訓練只安排固定路徑，能發展方向改變的身體與技術面，卻不能完整重現場上敏捷的知覺—認知限制。
    terms:
    - agility
    - change-of-direction
    - perceptual-cognitive-ability
    - impulse
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch19.rfd-impulse.i06
    - ch19.training-methods.i05
    locator: Speed and Agility Mechanics > Practical Implications for Change of Direction and Agility
  - id: ch19.core-concepts.i05
    q: 線性與多向高速移動在運動中的差異是什麼？
    a:
    - 線性高速移動通常指衝刺，是田徑與開放場地跑動的基礎要求
    - 團隊運動的比賽主要是多向移動，成功部分仰賴迅速且有效率地因應不斷改變的場上情境
    detail: 把「跑得快」視為單一能力會掩蓋專項需求：直線衝刺的加速與最大速度，和多向運動的減速、變向及刺激反應都有不同限制。
    terms:
    - sprinting
    - change-of-direction
    - agility
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch19.sprint-technique.i08
    - ch19.agility-cod.i02
    locator: Agility Performance and Change-of-Direction Ability
  - id: ch19.core-concepts.i06
    q: 為何速度、方向改變與敏捷都重視快速施力？
    a:
    - 這些爆發性動作的表現取決於身體能力與技術熟練度，以及在活動限制內使用力量的能力
    - 最大收縮力至少需 300 ms 才能產生，但許多運動活動只持續 0 至 200 ms
    - 因此，比起僅有高最大力量，運動情境更重視在有限時間快速施力的能力
    detail: 本章沒有否定最大力量的重要性，而是指出它不能在多數比賽動作的時間窗內完整表現；訓練應把力量能力轉成符合動作時間限制的施力能力。
    terms:
    - rate-of-force-development
    numbers:
    - v: 300
      unit: ms
      of: 產生最大收縮力至少所需時間
    - v: 0–200
      unit: ms
      of: 多數運動活動的持續時間範圍
    concepts:
    - technique
    - motor-control
    related:
    - ch19.rfd-impulse.i01
    - ch19.rfd-impulse.i02
    - ch13.power-tests.i01
    locator: Speed and Agility Mechanics > Rate of Force Development
  - id: ch19.core-concepts.i07
    q: 加速、減速與再加速如何區分速度、方向改變與敏捷？
    a:
    - 速度要求加速並到達最大速度
    - 方向改變能力要求有效施力以減速，再朝另一方向加速；有時還會改變移動模式
    - 敏捷同樣需要這些身體能力，但刺激反應會影響可用於煞車與施力的時間
    detail: 減速不是「負加速」的文字替代而已：在實務上它意味著要控制動量並承受煞車負荷，因此訓練會特別納入離心力量與身體重新定向。
    terms:
    - acceleration
    - change-of-direction
    - agility
    - eccentric-action
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch19.agility-cod.i05
    - ch19.rfd-impulse.i05
    locator: Speed and Agility Mechanics > Practical Implications for Change of Direction and Agility
  - id: ch19.core-concepts.i08
    q: 敏捷與方向改變能力的關係是什麼？
    a:
    - 敏捷需要方向改變能力結合知覺—認知能力
    - 方向改變的身體能力可以是敏捷的一個成分，但知覺—認知成分會改變其身體需求
    detail: 這個關係是概念性的組合，不是可直接相加的數學方程式；評估與訓練都須分別查看身體變向與刺激反應兩面。
    terms:
    - agility
    - change-of-direction
    - perceptual-cognitive-ability
    numbers: []
