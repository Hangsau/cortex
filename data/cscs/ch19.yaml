  - id: ch19.neuromuscular-basis.i08
    q: 複合訓練與運動後活化增益（PAP）的關係是什麼？
    a:
    - 複合訓練在同一訓練中交替 SSC 任務與重阻力運動
    - 此策略的基礎是稱為運動後活化增益的急性後效應
    - 它日益用於提升進階運動員表現，但可能不適合初學者或青少年
    detail: 書中只將 PAP 列為這個訓練策略的急性後效應，沒有給出固定的負荷、休息時間或保證效果；安排時仍須以動作品質與運動員訓練狀態為界。
