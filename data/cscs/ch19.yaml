  - id: ch19.program-design-monitoring.i07
    q: 敏捷發展範例如何利用需求分析安排計畫？
    a:
    - 先做運動需求分析，並配對適當測驗來評估所需能力
    - 以標準分數和表現標準或團隊平均比較，找出優勢與弱點
    - 為運動員安排主要與次要發展區域，再依需要分配可用訓練時間
    - 持續監控方向改變與敏捷的發展，確認訓練區塊的時間比例是否合適
    detail: 本章範例用籃球員說明，重點不是複製固定百分比，而是直接評估運動員的強弱，鎖定最大的改善窗口；敏捷表現由多項因素支撐，不能只依單一測驗分數。
