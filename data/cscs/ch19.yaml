  - id: ch19.agility-cod.i05
    q: 變向時煞車與再加速的姿勢原則是什麼？
    a:
    - 進入減速時控制軀幹，避免過大的軀幹動作
    - 在支撐期將軀幹與髖部重新朝向預定行進方向，以利再加速
    - 保持踝、膝、髖至軀幹與肩膀的強力排列，並以較低重心進出變向；側向滑步時尤其重要
    - 膝蓋需在有效關節活動範圍內吸收離心煞車負荷，避免僵直腿式煞車
    detail: 本章把姿勢視為有效把力量施加到地面的條件；教練可用「把地面推開」這類外部注意焦點來教導封閉式操練，而不是只要求運動員注意某一身體部位。
    terms:
    - change-of-direction
    - eccentric-action
    - range-of-motion
    numbers: []
    concepts:
    - technique
    - motor-control
    related:
    - ch19.agility-cod.i06
    - ch19.training-methods.i06
    - ch02.joint-biomechanics.i05
    locator: Agility Performance and Change-of-Direction Ability > Technical Guidelines and Coaching
  - id: ch19.agility-cod.i06
    q: 較佳方向改變能力的動作特徵有哪些？
    a:
    - 較快的髖伸展速度、較低的重心、較大的煞車與推進衝量，以及進入變向時較多的膝屈曲
    - 減速進入時較小的軀幹角位移；在 180° 變向時則有較大的側向軀幹傾斜
    - 力量發展應涵蓋動態、等長，尤其是離心力量；高速離心收縮要以其煞車負荷特異地訓練
    detail: 這是一組與較佳表現相關的特徵，不能化約成單一指標。書中還提醒不同動作（如落地、負重跳接收、高翻或抓舉接槓）對髖、膝、踝施加的離心負荷並不相同。
    terms:
    - change-of-direction
    - impulse
    - eccentric-action
    - isometric-action
    numbers:
    - v: 180
      unit: 度
      of: 與較大側向軀幹傾斜相關的方向改變角度
    concepts:
