  - id: ch19.sprint-speed-components.i06
    q: 菁英與新手衝刺者的擺腿重新就位時間有何差異？
    a:
    - 菁英衝刺者重新就位擺腿所需時間，與較慢對照者相近
    - 菁英者能靠正確導向至跑道的垂直力量推進得更遠
    - 他們的較高膝位置提供較長的施力與後續離地淨空時間，也可能說明多數力量在支撐期前半段出現
    detail: 這推翻「速度差主要來自空中擺腿更快」的簡化說法；教材將關鍵放在著地期的力量導向與由此形成的技術優勢。
