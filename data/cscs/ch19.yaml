  - id: ch19.program-design-monitoring.i03
    q: 如何以方向改變缺額監控方向改變表現？
    a:
    - 方向改變缺額是等長直線衝刺與方向改變測驗完成時間的差
    - 範例是以 505 方向改變測驗時間減去 10 m 直線衝刺時間
    - 它反映方向改變需求使運動員額外花費的時間
    detail: 完成整個測驗的時間包含大量直線跑，未必隔離出真正的變向能力；缺額可減少這個混淆，但仍應和植地相接地時間及進、出速度一起監控。
