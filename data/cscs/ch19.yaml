  - id: ch19.neuromuscular-basis.i04
    q: 彈簧—質量模型（spring–mass model, SMM）如何描述直立衝刺？
    a:
    - SMM 將衝刺描繪成：身體質量的位移源自肌肉架構內類彈簧作用共同捲曲與伸展所傳遞的能量
    - 一個步態週期中，一側彈簧壓縮並把衝刺者向前推進，另一側則前擺準備接地
    - 直立衝刺在足部著地後開始壓縮；身體重心越過足部時在中支撐達到最低點，推離時則以彈簧伸展回傳能量與力量
    detail: SMM 是連結 SSC、肌肉剛度與衝刺的概念框架。書中也指出頂尖衝刺者在最大速度的支撐期可能偏離典型 SMM，因其多數垂直力出現在接地的前半段。
    terms:
    - spring-mass-model
    - stretch-shortening-cycle
    - ground-reaction-force
    numbers: []
