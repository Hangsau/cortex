  - id: ch19.program-design-monitoring.i04
    q: 入速與出速如何用於監控方向改變？
    a:
    - 入速是植地相前的速度，可在數步或進入植地相的最後一步測得
    - 出速是變向植地推離後、再加速的第一步水平速度，從植地腳趾離地至下一步著地計算
    - 出速變快且接地時間相同或更快，表示與方向改變改善相關的力量發展速率較佳
    detail: 入速讓教練知道運動員實際承受的變向需求；若不控制或至少記錄入速，較快出速可能只是以較慢的入速換來，無法解讀為煞車與再加速能力進步。
    terms:
