  - id: ch19.training-methods.i02
    q: 輔助／超速衝刺（overspeed training）的潛在風險與實務建議是什麼？
    a:
    - 繩索拖拉、彈力繩拉引與下坡跑企圖讓運動員以超過無輔助衝刺的速度跑動，假設提高步頻可帶來神經肌肉適應
    - 輔助衝刺可能過早催促支撐期，減少正確施力時間；與全力跑相比，可能降低肌肉活化與推進力，出現碎步
    - 牽引可能提高煞車力；下坡跑可能因「尋找地面」而增加不必要離心力並改變 SSC
    detail: 教材指出目前幾乎沒有研究支持實施超速訓練，建議以考量訓練狀態與最佳生物力學的自然且安全工具發展頂速；採用輔助工具前必須審慎評估。
