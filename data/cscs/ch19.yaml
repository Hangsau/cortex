- id: sprint-technique
  title: 衝刺技術指導 起跑 / 加速 / 最大速度
  desc: ''
  tag: 技術應用
  items:
  - id: ch19.sprint-technique.i01
    q: 衝刺起跑的 set position 與離開起跑器重點是什麼？
    a:
    - 以起跑器、三點或四點交錯起跑建立平衡的 set position，利用有助爆發施力的肢段角度分配體重
    - 菁英衝刺者的前小腿角約為 90°、後小腿角約為 133°
    - 以雙腿積極伸展，對起跑器或地面全力推蹬，以產生高水平速度
    - 起跑離開時除了推進身體，還須產生垂直力量承托體重並使重心上升至跑姿
    detail: 本章將這些角度標為菁英衝刺者資料，不能當作每位運動員的僵硬姿勢標準；起跑的重要原則是平衡且能產生爆發力量的分段位置。
    terms:
    - sprinting
    - force
    - set-position
    numbers:
    - v: 90
      unit: 度
      of: 菁英衝刺者起跑時前小腿角
    - v: 133
      unit: 度
      of: 菁英衝刺者起跑時後小腿角
    concepts:
