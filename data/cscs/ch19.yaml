  - id: ch19.sprint-speed-components.i07
    q: 本章如何解釋較快衝刺者的擺腿膝高？
    a:
    - Mann 指出，在恢復腿最大屈曲時較高的膝位置，可能讓垂直力量更妥善導向跑道
    - 較高膝位置提供更多施力及後續離地淨空的時間
    - 技術指導不應單純叫運動員「抬膝」；本章指出膝高是地面反作用力的呈現
    detail: 在技術錯誤表中，教材警告直接提示抬膝可能進一步造成力量傳遞不當，並改變衝刺中自然使用的肌群；應先處理地面施力與步態週期。
