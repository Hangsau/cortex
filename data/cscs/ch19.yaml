  - id: ch19.sprint-technique.i02
    q: 起跑後的加速階段有哪些技術重點？
    a:
    - 起跑離開與加速的最初幾步，擺腿應低位回收，腳趾幾乎不離地
    - 以持續推地與自然軀幹前傾完成加速；頭部保持放鬆中立，與軀幹以相同速率上升
    - 約到 20 m 時，身體重心已上升到幾乎直立衝刺的位置
    - 菁英男性在第二步的步頻為每秒 5.26 步，新手為每秒 3.45 步
    detail: 低位回收是起跑與初期加速的技術，不是所有衝刺階段的線索。教材連結其目的在減少騰空時間、取得較頻繁接地以增加水平速度。
    terms:
    - sprinting
    - stride-rate
    numbers:
    - v: 20
      unit: m
      of: 身體重心已幾乎升至直立跑姿的位置
    - v: 5.26
      unit: 步／秒
      of: 菁英男性衝刺者起跑離開後第二步的步頻
    - v: 3.45
