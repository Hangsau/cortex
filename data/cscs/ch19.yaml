  - id: ch19.program-design-monitoring.i08
    q: 為何 Illinois agility test 的改善不能直接當作方向改變能力進步？
    a:
    - Illinois agility test 常用於足球運動員，但沒有反應成分，依本章定義應視為方向改變／機動性測驗，而非完整敏捷測驗
    - 它的測驗長度造成較短測驗沒有的高代謝需求
    - 因此季前訓練後成績改善，可能反映代謝能力改善，而不一定是方向改變能力變好
    detail: 測驗本身的長度與路徑會改變被測量的能力。評估時應批判地選擇測驗，搭配不同變向需求與知覺—認知要求的測驗，而非從名稱推定其內容。
