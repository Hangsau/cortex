  - id: ch19.agility-cod.i07
    q: 敏捷的進攻與防守情境如何影響決策？
    a:
    - 知覺—認知需求包括視覺搜尋掃描、預期、決策與反應時間
    - 戰術情境是進攻或防守，會改變所需的腦部處理策略
    - 監控決策時間時，防守定義為朝刺激同方向移動；進攻定義為朝刺激相反方向移動
    detail: 同一位運動員在進攻與防守可能呈現不同的敏捷限制，因此評估不應只報一個籠統的反應時間，而應保留符合比賽情境的刺激與方向規則。
    terms:
    - agility
    - perceptual-cognitive-ability
    - decision-making-time
    numbers: []
    concepts:
    - psychology
    - motor-control
    related:
    - ch19.agility-cod.i04
    - ch19.program-design-monitoring.i05
    locator: Agility Development Strategies > Monitoring Agility and Change-of-Direction Ability > Table 19.7 Monitoring Agility Development
  - id: ch19.agility-cod.i08
    q: 方向改變缺額（change-of-direction deficit）如何計算與解讀？
    a:
    - 方向改變缺額是等長直線衝刺時間與方向改變測驗時間之差
    - 書中範例為：從 505 方向改變時間扣除 10 m 直線衝刺時間
    - 此值用來看方向改變需求讓運動員多花了多少時間
    detail: 它提供的是相對於直線跑的額外時間，而不是獨立、無誤差的「純能力」分數；宜連同植地接觸時間、入速與出速一起判讀。
    terms:
    - change-of-direction-deficit
    - five-zero-five-agility-test
    numbers:
    - v: 10
      unit: m
      of: 書中方向改變缺額範例所扣除的直線衝刺距離
    concepts:
