  - id: ch19.training-methods.i07
    q: 短到長（short to long）衝刺訓練模型如何安排？
    a:
    - 短到長模型以訓練區塊的順序，先成熟加速能力，再進入最大速度的訓練
    - 年度開始時，藉短衝刺發展推進力，維持加速期的力學
    - 後續銜接較長衝刺，以直立跑姿發展頂速；概念是先投資加速發展與最佳化，再讓頂速有更大改善空間
    detail: 這是教材提出的概念性進展，不是放諸所有專項的唯一週期。範例將心理與身體的衝刺成分按區塊強調與淡化，並在後期仍保留短衝刺以維持加速能力。
