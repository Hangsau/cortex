  - id: ch19.sprint-technique.i03
    q: 最大速度期的整體姿勢與手臂動作原則是什麼？
    a:
    - 支撐期應呈現堆疊關節：肩在髖上方、髖在足部上方
    - 頭部保持放鬆中立、眼睛向正前方；肩膀下沉放鬆
    - 手臂以與腿部週期相同的速率擺動
    detail: 堆疊並非「用力挺直」的姿勢，而是使力量能正確傳到跑步表面的對齊。當脛與髖上升至垂直，教材的指導是讓軀幹和頭部一同上升。
    terms:
    - sprinting
    - ground-reaction-force
    numbers: []
    concepts:
    - technique
    related:
    - ch19.sprint-technique.i06
    - ch19.sprint-speed-components.i07
    locator: 'Running Speed > Sprinting Technique Guidelines > Figure 19.9 Sprinting Technique Checklist: Start, Acceleration, and Maximum Velocity'
  - id: ch19.sprint-technique.i04
    q: 最大速度衝刺的飛行與支撐期有哪些基本動作？
    a:
    - 早期飛行以離心髖屈曲減速大腿後擺，並以離心膝伸展減速腿與足後擺
    - 中飛行以向心髖屈曲加速大腿前擺；晚飛行以向心髖伸展準備足部接觸，離心膝屈曲加速腿後擺並限制伸膝
    - 早期支撐持續向心髖伸展以減少足部著地的煞車效應，並以離心蹠屈吸收衝擊、控制脛骨前轉
    - 晚期支撐以向心膝伸展推進重心向前，向心蹠屈協助推進
    detail: 這些是 Figure 19.10 中「基本動作」的文字列表，不是以單一關節動作取代整體衝刺教學；各相位同時發生的關節動作共同管理煞車、吸震與推進。
    terms:
    - eccentric-action
    - concentric-action
    - sprinting
    numbers: []
    concepts:
    - technique
    related:
    - ch19.neuromuscular-basis.i04
    - ch19.rfd-impulse.i04
    locator: Running Speed > Sprinting Technique Guidelines > Figure 19.10 Fundamental Movements Occurring in Maximum-Velocity Sprinting
  - id: ch19.sprint-technique.i05
    q: 過度跨步（overstriding）為何是常見衝刺錯誤，應如何修正？
    a:
    - 過度跨步源於誤解施力方式，企圖用較大的接地時間提高速度
    - 衝刺成功在於短時間產生高垂直力量；跨步會減弱 SSC 的效果
    - 可提示運動員「跑在自己的跑道內」，維持自然步態週期
    detail: 本章也舉例指出，教練若用逐漸拉遠的地面標記要求選手「追更遠」，可能反而誘發過度跨步；修正焦點應回到正確向地面傳力，不是急性拉大步幅。
    terms:
    - stretch-shortening-cycle
    - ground-contact-time
    - ground-reaction-force
    - overstriding
    numbers: []
    concepts:
    - technique
    related:
    - ch19.sprint-speed-components.i02
    - ch19.sprint-speed-components.i08
    locator: Running Speed > Technical Errors and Coaching > Table 19.1 Common Sprinting Technique Errors, Causes, and Corrections
  - id: ch19.sprint-technique.i06
    q: 衝刺時手臂橫向擺動應如何修正？
    a:
    - 手臂在橫斷面出現錯誤動作，常源於對動作模式的誤解
    - 應強調手臂向下、向後驅動，同時維持直立軀幹
    - 手臂回收靠近身體中線，可利用肩關節的自然活動範圍
    detail: 教材指出，速度受限的主因是力學施力而非代謝效率；因此不要只把混亂手臂擺動歸咎於疲勞，應修正其與下肢協調的施力模式。
    terms:
    - sprinting
    numbers: []
    concepts:
    - technique
    related:
    - ch19.sprint-technique.i03
    - ch19.sprint-technique.i07
    locator: Running Speed > Technical Errors and Coaching > Table 19.1 Common Sprinting Technique Errors, Causes, and Corrections
  - id: ch19.sprint-technique.i07
    q: 為何不應以「爪地」或腿部循環動作教衝刺？
    a:
    - 腿部循環使完成擺腿期的時間增加，支撐期時兩膝之間會出現明顯空隙
    - 應提示運動員將足部向下、向後驅動進跑道，而非用水平方式爪地
    - 水平爪地會阻礙垂直力量的運用，並過度負荷 SSC
    detail: 教材說明此錯誤常源於教練把足部看似水平的動作錯誤地提示為爪地；修正時要重視垂直力量與自然步態，而不是模仿足部的表面軌跡。
    terms:
    - stretch-shortening-cycle
    - ground-reaction-force
    - sprinting
    numbers: []
    concepts:
