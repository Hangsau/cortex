id: ch19
weight: 19
title: Ch.19 速度與敏捷訓練計畫設計
topics:
- id: agility-cod
  title: 敏捷與方向改變 COD
  desc: ''
  tag: 多向運動
  items:
  - id: ch19.agility-cod.i01
    q: 切角影響
    a:
    - <75°切角：接地時間 <250ms → 類似速度訓練需求
    - ≥75°：接地時間 >250ms → 需更強離心/最大力量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.agility-cod.i02
    q: COD vs Maneuverability
    a:
    - COD：急劇方向改變需大幅煞車
    - 操作性：維持速度繞過障礙（如 Illinois test）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.agility-cod.i03
    q: 測驗選擇
    a:
    - 505：COD 速度
    - T-test：操作性
    - Illinois：操作性＋代謝
    - 反應敏捷：有刺激才算真敏捷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.agility-cod.i04
    q: 知覺認知能力
    a:
    - 視覺掃描、預期、模式辨認、情境知識、決策時間準確性、反應時間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.agility-cod.i05
    q: 植地相技術
    a:
    - 軀幹控制進入煞車
    - 透過植地相重新定向髖部朝向新方向
    - 低重心入出切
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.agility-cod.i06
    q: COD 改善因子
    a:
    - 髖伸展速度↑、重心高度↓、煞車衝量↑、膝屈曲↑、軀幹位移↓、外側軀幹傾斜
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.agility-cod.i07
    q: 攻守差異
    a:
    - 進攻：往相反方向
    - 防守：跟隨刺激方向
    - 兩者腦部處理策略不同
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.agility-cod.i08
    q: 考試關鍵
    a:
    - ★ COD Deficit = COD 時間 - 直線衝刺時間
    - 反映 COD 純能力（排除直線速度）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
- id: core-concepts
  title: 三大核心概念 Speed / COD / Agility
  desc: ''
  tag: 定義必考
  items:
  - id: ch19.core-concepts.i01
    q: Speed 速度
    a:
    - 達成高移動速度所需的技能與能力
    - 需能加速並達到最大速度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.core-concepts.i02
    q: Change of Direction（COD）
    a:
    - 爆發性改變移動方向、速度或模式的能力
    - 無反應刺激（預先規劃）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.core-concepts.i03
    q: Agility 敏捷
    a:
    - 在回應刺激（對手、球）下改變方向/速度/模式
    - 需加入知覺認知能力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.core-concepts.i04
    q: COD vs Agility 差異
    a:
    - COD：純物理能力（預定路線）
    - Agility：COD + 知覺認知（反應刺激）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.core-concepts.i05
    q: 線性 vs 多向
    a:
    - 直線高速＝衝刺
    - 團隊運動以多向移動為主，需快速高效的 COD
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.core-concepts.i06
    q: 力量的角色
    a:
    - 速度、COD、敏捷均以力量為基礎
    - 但事件時間短（0–200ms）無法達最大肌力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.core-concepts.i07
    q: 加速與煞車
    a:
    - 速度→加速為主
    - COD 需加速＋煞車＋再加速
    - 敏捷更加入認知限制煞車時間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
  - id: ch19.core-concepts.i08
    q: 考試關鍵
    a:
    - ★ Agility = COD ability + perceptual-cognitive ability（常考區分題）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - motor-control
    related: []
    locator: ''
- id: neuromuscular-basis
  title: 神經生理基礎 SSC / SMM / 肌肉剛度
  desc: ''
  tag: 生理機制
  items:
  - id: ch19.neuromuscular-basis.i01
    q: Neural Drive 神經驅動
    a:
    - 力量訓練 → 提升神經驅動（衝動速率與幅度）→ 增加力量與 RFD
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch19.neuromuscular-basis.i02
    q: SSC 伸縮循環
    a:
    - 離心-向心耦合現象
    - 肌腱快速被拉長後立即縮短
    - 增加機械效率與衝量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch19.neuromuscular-basis.i03
    q: SSC 訓練標準
    a:
    - ①多關節技巧動作傳遞力量 ②短組間歇保持品質
    - 複合訓練（PAP）可增強效果
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch19.neuromuscular-basis.i04
    q: Spring-Mass Model（SMM）
    a:
    - 人體跑步如彈簧
    - 著地壓縮→蓄能→伸展推進
    - 肌肉剛度是關鍵
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch19.neuromuscular-basis.i05
    q: Muscle Stiffness
    a:
    - 步頻增加→腿彈簧剛度須增加
    - 訓練可提升預激活與肌梭敏感度達此效果
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch19.neuromuscular-basis.i06
    q: COD 地面接觸時間
    a:
    - COD 植地：0.44–0.72s
    - Agility：0.23–0.25s
    - 均長於衝刺（需較長 SSC）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch19.neuromuscular-basis.i07
    q: 離心訓練特異性
    a:
    - 煞車需高速高力離心收縮
    - 離心訓練須針對負荷速度具特異性才有效
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
  - id: ch19.neuromuscular-basis.i08
    q: 考試關鍵
    a:
    - ★ PAP = postactivation potentiation
    - 複合訓練基礎
    - 不適合新手/青少年
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - reflex
    related: []
    locator: ''
- id: program-design-monitoring
  title: 計畫設計與監控 週期化 / COD Deficit
  desc: ''
  tag: 程式設計
  items:
  - id: ch19.program-design-monitoring.i01
    q: 週期化變數
    a:
    - 訓練間距、順序、頻率、強度、休息間隔、組數、總量、功重比
    - 與重訓週期化概念相同
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
  - id: ch19.program-design-monitoring.i02
    q: 速度監控指標
    a:
    - 接地時間、步長、步幅、騰空時間、步幅角度、速度、加速度
    - 搭配高速攝影機
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
  - id: ch19.program-design-monitoring.i03
    q: COD Deficit
    a:
    - = 505 測驗時間 - 10m 直線時間
    - 排除直線速度影響，反映純 COD 能力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
  - id: ch19.program-design-monitoring.i04
    q: 出速與入速監控
    a:
    - Entry velocity（植地前）＋ Exit velocity（離地後第一步）
    - 搭配接地時間判斷 RFD
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
  - id: ch19.program-design-monitoring.i05
    q: 決策時間
    a:
    - 刺激出現到第一確定踩地間距
    - 負值＝預測到刺激前已動（只在真人刺激中出現）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
  - id: ch19.program-design-monitoring.i06
    q: 敏捷訓練進程
    a:
    - COD 閉式技能（前進煞車→側向煞車→再加速）→ 加入一般刺激 → 加入運動特異刺激
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
  - id: ch19.program-design-monitoring.i07
    q: 需求分析步驟
    a:
    - ①運動需求分析 ②比較標準分→找強弱 ③確定主次訓練目標 ④分配各 block 時間比例
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
  - id: ch19.program-design-monitoring.i08
    q: 考試關鍵
    a:
    - ★ Illinois test 改善可能只反映代謝能力提升，非 COD 改善（測驗時間過長）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - periodization
    related: []
    locator: ''
- id: rfd-impulse
  title: RFD 與 Impulse 力學基礎
  desc: ''
  tag: 力學核心
  items:
  - id: ch19.rfd-impulse.i01
    q: RFD 定義
    a:
    - Rate of Force Development：最短時間內發展最大力量
    - = ΔForce / ΔTime
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
  - id: ch19.rfd-impulse.i02
    q: 最大力量時間限制
    a:
    - 最大收縮力需 ≥300ms
    - 但多數運動動作僅 0–200ms → RFD 比最大力更重要
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
  - id: ch19.rfd-impulse.i03
    q: Impulse 衝量
    a:
    - = Force × Time
    - 力-時間曲線下面積
    - 決定動量變化的大小
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
  - id: ch19.rfd-impulse.i04
    q: Ground Contact Time
    a:
    - 衝刺著地相 / COD 植地相時，力施加於地面的時間
    - 越短 → 越需高 RFD
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
  - id: ch19.rfd-impulse.i05
    q: Momentum 動量
    a:
    - = mass × velocity
    - 衝量變化 → 動量變化
    - 加速/煞車皆透過衝量調控
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
  - id: ch19.rfd-impulse.i06
    q: Braking Impulse
    a:
    - COD/Agility 特有：煞車衝量
    - 切角越大、入速越快 → 需更大煞車衝量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
  - id: ch19.rfd-impulse.i07
    q: Power 的局限
    a:
    - Power = Force × velocity（衍生值）
    - 無法單獨說明爆發表現
    - 書中不採用
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
  - id: ch19.rfd-impulse.i08
    q: 考試關鍵
    a:
    - ★ Impulse = product of force and TIME（選項常混淆 force × velocity）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related: []
    locator: ''
- id: sprint-speed-components
  title: 跑步速度構成 步幅 × 步頻
  desc: ''
  tag: 速度決定因子
  items:
  - id: ch19.sprint-speed-components.i01
    q: 速度公式
    a:
    - Speed = Stride Length × Stride Frequency
    - 兩者皆取決於快速力量產生能力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch19.sprint-speed-components.i02
    q: 菁英步幅數據
    a:
    - 菁英男：2.70m
    - 新手：2.56m（最大速度時）
    - 差異來自更好的垂直力施加方向
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch19.sprint-speed-components.i03
    q: 菁英步頻數據
    a:
    - 菁英男：4.63步/秒
    - 新手：4.43步/秒
    - 菁英接地時間更短（0.087 vs 0.101s）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch19.sprint-speed-components.i04
    q: 垂直力的關鍵性
    a:
    - 著地相垂直力大小是提升速度最關鍵因素
    - 需在最短時間施加（RFD）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch19.sprint-speed-components.i05
    q: 最大速度數值
    a:
    - 菁英男：~12.55 m/s
    - 新手：~11.25 m/s
    - 差距來自更大更頻繁的力輸出
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch19.sprint-speed-components.i06
    q: 擺腿時間
    a:
    - 菁英與新手擺腿重置時間相近
    - 差異在著地相力量而非空中時間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch19.sprint-speed-components.i07
    q: 膝關節高度
    a:
    - 菁英膝蓋抬高更好（非刻意提膝），反映地面反作用力方向更優化
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch19.sprint-speed-components.i08
    q: 考試關鍵
    a:
    - ★ 步幅增加來自垂直力方向優化，非刻意「大步跑」→ 過步是錯誤
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
- id: sprint-technique
  title: 衝刺技術指導 起跑 / 加速 / 最大速度
  desc: ''
  tag: 技術應用
  items:
  - id: ch19.sprint-technique.i01
    q: 起跑姿勢
    a:
    - 前腳脛骨 ~90°
    - 後腳 ~133°
    - 雙腿積極伸展
    - 目標產生高水平速度（推蹬）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch19.sprint-technique.i02
    q: 加速階段重點
    a:
    - 腳跟低位回收
    - 前傾軀幹
    - 約 20m 時身體漸直立
    - 步頻菁英第 2 步 5.26步/秒
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch19.sprint-technique.i03
    q: 最大速度姿勢
    a:
    - 肩-髖-踝垂直堆疊（stacked joints）
    - 頭部放鬆中立
    - 臂腿同頻率擺動
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch19.sprint-technique.i04
    q: 著地相動作
    a:
    - 早期：離心髖屈曲
    - 中期：向心髖屈曲
    - 晚期：向心髖伸展＋膝伸展＋蹠屈
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch19.sprint-technique.i05
    q: 常見錯誤：過步
    a:
    - 原因：誤解力量施加
    - 嘗試用大步幅加速 → 增加接地時間 → 抑制 SSC
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch19.sprint-technique.i06
    q: 常見錯誤：手臂
    a:
    - 手臂橫向擺動：應強調手臂向下向後驅動
    - 維持軀幹直立不扭轉
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch19.sprint-technique.i07
    q: 常見錯誤：腿循環
    a:
    - 「循環」腿動作（pawing）：應腳向下向後踩地利用垂直力，非水平爪地
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch19.sprint-technique.i08
    q: 考試關鍵
    a:
    - ★ 三階段：Start → Acceleration → Maximum Velocity
