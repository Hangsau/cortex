  - id: ch19.program-design-monitoring.i02
    q: 速度發展可監控哪些步態指標？
    a:
    - 可監控接地時間、步長、步幅、騰空時間、步幅角度、速度與加速度
    - 高速攝影機或以紅外線中斷記錄資料的光學計時系統，可補足只看完賽時間的限制
    - 接地時間變短且衝刺完成時間改善，通常表示能在較短時間產生較高施力速率；但起跑初期因加速力學，接地時間可能稍長
    detail: 各數值不是單獨的「越大越好」或「越小越好」：例如騰空時間變長，可能是短時間大垂直力帶來的正確水平位移，也可能是過久施力造成不必要的重心垂直振幅。
    terms:
