  - id: ch19.sprint-speed-components.i08
    q: 衝刺速度改善的核心訓練目標是什麼？
    a:
    - 以正確施力方式達到最佳步幅與步頻
    - 在短支撐期傳遞高力量，以形成快速步頻
    - 發展 SSC，讓每一步衝量的幅度增加；頂速優秀者能在較短支撐期內以 SSC 產生高力量
    detail: 完整舉重動作及其衍生動作被本章列為可用超過自由衝刺力量過負荷 SSC 的關鍵運動；這是訓練目標的例子，不是以刻意放大步幅取代正常步態。
