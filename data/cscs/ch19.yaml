  - id: ch19.rfd-impulse.i06
    q: 煞車衝量（braking impulse）為何是方向改變與敏捷的重要考量？
    a:
    - 除了加速外，方向改變與敏捷操控應考量在一定時間內產生的煞車力量，即煞車衝量
    - 所需衝量直接反映有效、有效率地改變動量的身體要求
    - 所需變向角度或進入速度愈高，改變動量所需衝量愈大，動作的身體負荷也愈高
    detail: 刺激反應造成的時間限制也會減少可用來產生所需煞車力量與衝量的時間，這就是敏捷不只等同於預先規劃方向改變的力學原因。
