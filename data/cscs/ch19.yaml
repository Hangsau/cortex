- id: program-design-monitoring
  title: 計畫設計與監控 週期化 / COD Deficit
  desc: ''
  tag: 程式設計
  items:
  - id: ch19.program-design-monitoring.i01
    q: 速度、方向改變與敏捷計畫中可操作的訓練變項有哪些？
    a:
    - 工作間隔、運動順序、頻率、強度、恢復間隔、重複次數、組、組數序列與總量
    - 工作休息比描述組內運動與休息的相對密度；總量負荷則是處方強度下完成的總量密度
    - 這些變項既要分別考慮，也要連同整體系統與個別運動員的監控反應一起調整
    detail: 週期化是利用循序訓練階段策略性調整準備狀態，以協調訓練疲勞與適應；本章明確指出第 21 章的阻力訓練週期化概念也可套用於速度、方向改變與敏捷。
