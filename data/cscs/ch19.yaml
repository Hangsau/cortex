    q: 哪些動作可用於方向改變煞車所需的離心負荷？
    a:
    - drop landing、負重跳落地與高翻或抓舉的接槓期，都可用於高速離心負荷的訓練
    - 這些動作對髖、膝、踝的離心負荷需求不同
    - 實務上應以高速離心收縮訓練煞車能力，並納入動態、等長與尤其是離心力量的全面發展
    detail: 本章不把任何一項動作稱為唯一最佳選擇。真正的判準是能否讓神經肌肉系統適應煞車期所需的負荷速率，並與目標方向改變的技術需求相符。
