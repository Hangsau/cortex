    locator: Agility Development Strategies > Monitoring Agility and Change-of-Direction Ability > Table 19.7 Monitoring Agility Development
  - id: ch19.program-design-monitoring.i06
    q: 敏捷訓練應如何由方向改變操練進展？
    a:
    - 先以預先規劃的方向改變操練建立身體能力與閉鎖技能的技術，再提高其身體負荷
    - 然後加入一般刺激，例如哨音、教練口令、指向箭頭或閃光箭頭
    - 成功後再進展至具運動專項刺激的閃避操練與小場比賽；可逐漸增加時間或空間壓力
    detail: 書中說隨機安排或只用小場比賽的「運動專項方法」未被發現同樣有效；進階前要先讓運動員有足夠身體與技術能力承受敏捷操練的負荷。
    terms:
    - agility
    - change-of-direction
    - perceptual-cognitive-ability
    - small-sided-games
    numbers: []
