    q: 敏捷發展需要哪些力量與能力面向？
    a:
    - 動態力量為後續訓練提供基礎，也確保自體重與負重訓練有足夠活動度
    - 向心爆發力量用於煞車後再加速或維持強壯的變向過渡姿勢；離心力量則用於吸收煞車期負荷
    - 反應力量有助從高離心負荷轉為向心爆發，多向力量則用於在多種動作要求中維持身體位置
    - 知覺—認知能力需進展視覺掃描、有效預期與決策
