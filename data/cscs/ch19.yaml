cards:
- q: 速度（speed）的定義是什麼？
  a: 速度是在某一方向以最快速率移動的能力；在田徑中通常指直線衝刺，是力量、技術與神經肌肉效率的整合輸出。
  tag: speed-definition
- q: 方向改變速度（COD speed）與敏捷性（agility）的核心差異是什麼？
  a: COD speed 是在預先設計路徑中快速改變方向的能力；agility 額外包含對外部刺激的感知與認知決策，是在不確定情境下的即時反應能力。
  tag: cod-agility-definition
- q: 力量發展速率（RFD）的定義及其公式為何？
  a: RFD（Rate of Force Development）= ΔForce / ΔTime，即單位時間內力量的增加量，反映肌肉產生爆發力的速度；高 RFD 對短接觸時間動作（如短跑、跳躍）至關重要。
  tag: rfd-definition
- q: 衝量（impulse）與速度改變的關係為何？
  a: 衝量 = 力 × 時間，依動量定理 Impulse = Δ(mv)；地面反作用力的衝量大小決定身體速度的改變量，因此短跑加速期需要較大衝量（較長接觸時間）。
  tag: impulse-momentum
- q: 短跑中肌肉剛度（stiffness）的功能為何？
  a: 肌肉與肌腱剛度高，可縮短與地面的接觸時間、提高彈性能量儲存與釋放效率；最大速度階段的接觸時間約 80–100 ms，需要極高肌肉剛度維持。
  tag: muscle-stiffness
- q: 伸展縮短循環（SSC）在短跑中的具體作用為何？
  a: 短跑著地時，肌腱與肌肉先離心預伸展（儲存彈性能量），緊接向心收縮釋放能量；SSC 效率越高，代謝成本越低且推進力越大。
  tag: ssc-sprinting
- q: 神經驅動（neural drive）如何影響短跑速度？
  a: 更高的運動神經元放電頻率（rate coding）與更多快縮肌纖維的徵召，使收縮力量與速度提升；高水準短跑選手的神經驅動顯著優於一般訓練者。
  tag: neural-drive
- q: 運動後增強效應（PAP）的定義及短跑應用為何？
  a: PAP（Post-Activation Potentiation）：重負荷收縮後，運動單位興奮性暫時提升，可增強後續爆發力動作（如短跑起跑）的輸出；通常在 3–8 分鐘後效果最佳。
  tag: pap-sprinting
- q: 短跑速度的生物力學公式是什麼？
  a: 速度 = 步幅（stride length）× 步頻（stride rate）；提升其中任一或兩者皆可提高速度，但菁英短跑選手主要靠較大步幅區分於業餘者。
  tag: speed-stride-frequency
- q: 菁英與一般短跑選手在步幅與步頻的主要差異為何？
  a: 菁英選手步幅顯著較長，步頻差異較小；長步幅源於更強的髖部伸展力量與更高的地面反作用力，而非腿部擺動速度的差異。
  tag: elite-vs-novice-stride
- q: 短跑起跑階段（start phase）的技術重點為何？
  a: 起跑姿勢：低重心、軀幹前傾 45°；強調後腿驅動（hip extension）和爆發性推蹬（push-off）；初始幾步應短而有力，逐漸拉長步幅。
  tag: sprint-start-technique
- q: 加速階段（acceleration phase）的技術特徵是什麼？
  a: 加速階段（0–30 m）：身體持續前傾，步幅逐漸增長，接觸時間較長；雙腳在身體後方著地產生向前衝量；強調後方腿的充分伸展。
  tag: sprint-acceleration
- q: 最大速度階段（max velocity phase）的技術要素是什麼？
  a: 最大速度期：軀幹接近垂直，步幅最長、步頻最高；著地在身體正下方（midfoot strike）；強調髖屈肌快速前擺與膝部高抬；接觸時間極短（80–100 ms）。
  tag: sprint-max-velocity
- q: 短跑常見技術錯誤有哪些？
  a: 過度向前撲（overstriding）、足跟著地、上肢橫向擺動（cross-body arm swing）、軀幹過度扭轉、頭部位置不穩定——皆會增加制動力並降低推進效率。
  tag: sprint-common-errors
- q: 手臂動作在短跑中的功能為何？
  a: 手臂前後擺動（非橫向）協助下肢步頻，維持旋轉平衡（counter-rotation）；肘關節約保持 90°，手放鬆，驅動力主要來自肩關節屈伸而非肘關節。
  tag: arm-action-sprinting
- q: 方向改變（COD）的生物力學決定因素有哪些？
  a: 進入切入的速度、切入角度、制動時間、踏地腳的力量與角度，以及重心控制；切入角度越大，速度損失越多，技術需求越高。
  tag: cod-biomechanics
- q: 敏捷性訓練與 COD 訓練的主要差別為何？
  a: COD 訓練使用預定路徑（無決策），訓練方向改變的力學與體能；敏捷性訓練引入外部刺激（視覺、聽覺），訓練感知—認知—動作的整合速度。
  tag: agility-vs-cod-training
- q: 感知—認知因素（perceptual-cognitive factors）如何影響敏捷性表現？
  a: 預判能力（anticipation）、反應時間、情境識別（pattern recognition）決定在決策動作前多少時間開始啟動；菁英選手能提早 100–200 ms 讀取對手動作線索。
  tag: perceptual-cognitive-agility
- q: 常用的 COD 測試有哪些，各測量什麼？
  a: 505 Agility Test（5 m COD）、T-test（前後左右）、Illinois Agility Test（複雜路徑）、L-drill；主要測量 COD speed，不含反應刺激，無法直接評估敏捷性認知成分。
  tag: cod-tests
- q: 阻力短跑（resisted sprinting）的訓練目的與方法為何？
  a: 阻力短跑（拖橇、阻力傘、坡道上跑）針對加速階段，增強水平推進力（horizontal force production）；阻力不應超過導致明顯技術崩潰的程度（通常速度降低 < 10%）。
  tag: resisted-sprint-training
- q: 協助短跑（assisted sprinting）的訓練原理是什麼？
  a: 協助短跑（順坡、彈力帶拉引）使跑速超過選手最大速度（overspeed training）；目標是暴露神經肌肉系統於更高步頻刺激，提升最大速度階段的神經適應。
  tag: assisted-overspeed-sprint
- q: 舉重動作（weightlifting movements）如何轉移至短跑表現？
  a: 抓舉、上博等動作訓練高速三關節伸展（hip-knee-ankle triple extension），與短跑推蹬動作高度相似；能同時提升力量、RFD 與爆發力。
  tag: weightlifting-sprint-transfer
- q: 最大肌力（maximal strength）如何影響短跑速度？
  a: 更高的最大肌力提供更大的力量儲備，允許在短接觸時間內輸出更高推進力；1RM 深蹲與短跑加速表現呈中度至高度相關（r = 0.5–0.8）。
  tag: max-strength-sprint
- q: 彈力帶阻力（band-resisted）訓練在速度訓練中的功能？
  a: 彈力帶提供速度依賴性阻力（阻力隨拉伸增加），可用於加速末段至最大速度區段；也常用於協助（rebound）訓練增加反應速度。
  tag: band-resisted-speed
- q: 速度訓練的訓練量（volume）建議為何？
  a: 速度訓練應在完全疲勞前結束，每次訓練衝刺距離總量通常 400–800 m（依距離與強度）；每組需充分恢復（1:8–1:12 工作：休息比），確保每趟接近最大努力。
  tag: speed-training-volume
- q: 速度訓練的強度如何設定？
  a: 強度應達到最大速度的 95–100%；低強度短跑（< 85% 最大速度）屬技術練習或熱身，不足以刺激神經肌肉最大速度適應。
  tag: speed-training-intensity
- q: 速度訓練的休息間隔建議為何？
  a: 完全恢復原則：磷酸肌酸（PCr）系統完全恢復需 3–5 分鐘；速度訓練每組間休息至少 2–5 分鐘（依強度與距離），不可用有氧恢復間歇代替。
  tag: speed-training-rest
- q: 速度訓練的頻率建議為何？
  a: 速度訓練每週 2–3 次，需在非疲勞狀態下進行（通常排在每日訓練最前段）；不建議連續兩天進行高強度速度訓練。
  tag: speed-training-frequency
- q: 加速訓練的推薦距離範圍是多少？
  a: 加速訓練常用 10–30 m；10 m 以內著重起跑爆發，30 m 接近初始加速結束；需要改善最大速度則用 40–60 m 以上。
  tag: acceleration-training-distance
- q: 速度訓練的週期化建議是什麼？
  a: 準備期以技術與力量基礎為主（低量高頻技術跑）；競賽前期引入高強度短跑；競賽期維持速度品質、減少總量；結合力量與爆發力週期同步規劃。
  tag: speed-periodization
- q: 不同切入角度對 COD 訓練的影響是什麼？
  a: 小角度（< 45°）：速度損失少，技術需求較低，適合初學者；大角度（90°–180°）：需要顯著制動與再加速，對力量與技術要求高；訓練應涵蓋多種角度。
  tag: cod-cutting-angles
- q: 植地（plant）技術在方向改變中的重要性為何？
  a: 植地腳應在身體外側著地（外展位），膝關節微屈吸震，利用伸膝力量快速推離；過度內旋（knee valgus）增加 ACL 損傷風險。
  tag: cod-plant-technique
- q: 敏捷性測試（agility test）如何設計才能包含認知成分？
  a: 使用燈號、球或對手動作作為刺激，選手需在刺激後決定方向；例如 Reactive Agility Test（RAT）使用真人對手模擬真實比賽情境，比固定路徑測試更有效度。
  tag: reactive-agility-test
- q: 速度訓練前的動態熱身應包含哪些元素？
  a: A-skip、B-skip、高抬膝、後踢腿（butt kicks）、動態伸展、短跑漸進加速（build-up runs）；避免靜態伸展在訓練前降低肌腱剛度與爆發力輸出。
  tag: speed-warmup
- q: 速度訓練中技術提示（cues）的使用原則為何？
  a: 提示應簡短、動作導向（如「抬膝高、腳踩地快」），針對當下最關鍵的技術錯誤；避免一次給多個提示，讓選手有內化時間。
  tag: speed-technique-cues
- q: 短跑訓練中「分段計時」的用途是什麼？
  a: 透過 10 m、20 m、30 m 分段計時，可分別評估加速能力（0–10 m）、過渡加速（10–20 m）和最大速度區間（20–30 m）的弱點，指導訓練重點。
  tag: split-timing-sprinting
- q: 坡道短跑（uphill/downhill sprinting）訓練效果為何？
  a: 上坡跑：增加水平推進力需求，強化加速力學；下坡跑（2–3° 坡）：超速訓練提升最大步頻；坡度不應超過 3–4°，否則導致技術變形。
  tag: hill-sprint-training
- q: 速度訓練與敏捷性訓練的年齡適應考量為何？
  a: 青少年（9–12 歲）：神經可塑性高，此階段訓練步頻效果佳；青春期後力量適應成為主要驅動因素；成年運動員需整合力量、爆發力與技術訓練。
  tag: speed-agility-youth
- q: 競技運動中速度訓練的特殊性原則（specificity）如何應用？
  a: 訓練動作應模擬比賽中的起跑方向、切入角度與反應情境；足球員需多方向加速，短跑選手著重直線；不同運動的速度訓練設計差異顯著。
  tag: speed-specificity
- q: 力量訓練如何為速度訓練提供基礎？
  a: 最大肌力為爆發力提供力量儲備（force reservoir）；下肢推蹬力量（squat、deadlift、lunge）直接轉移至起跑與加速推進；不充分的力量基礎限制速度適應上限。
  tag: strength-base-for-speed
- q: 增強式訓練（plyometrics）在速度訓練計畫中的定位為何？
  a: plyometrics 提升 SSC 效率與肌腱剛度，是速度訓練的橋樑；低強度跳躍（繩梯、連續跳）→ 高強度跳躍（depth jump）應循序漸進，最終轉移至短跑動作。
  tag: plyometrics-speed-bridge
- q: 速度—耐力訓練（speed endurance）的定義與功能是什麼？
  a: 速度耐力：在較長距離（60–150 m）維持次最大速度的能力；訓練目的是延緩疲勞對速度的損耗，適合需要多次衝刺的運動（籃球、足球）。
  tag: speed-endurance
- q: 如何評估運動員的 COD 速度與敏捷性缺失（deficit）？
  a: COD deficit = COD test 時間 - 等距離直線衝刺時間；正值越大代表方向改變技術或力量弱點越明顯，指引訓練側重點（技術 vs. 力量）。
  tag: cod-deficit-assessment
- q: 哪些測試可評估加速能力？
  a: 10 m 衝刺計時（手動或電子）是最直接指標；也可用 flying start（20–30 m，排除反應時間）單獨測最大速度；雷達槍可記錄速度曲線。
  tag: acceleration-tests
- q: 速度訓練的設備需求有哪些？
  a: 計時門（timing gates）、拖橇（sprint sled）、彈力帶、錐筒、反應燈（reactive light system）；有條件可加 GPS 或加速度計追蹤速度分佈。
  tag: speed-training-equipment
- q: 速度訓練計畫的週次安排建議？
  a: 典型週結構：Day 1 最大速度（全力短衝）、Day 2 COD 與敏捷性、Day 3 加速（阻力短跑）；速度訓練排在力量訓練前或獨立日，避免疲勞影響技術品質。
  tag: speed-weekly-schedule
- q: 短跑運動員的下肢力量發展重點是什麼？
  a: 髖部伸展肌群（臀大肌、腿後）是推進力主要來源；膝伸展（股四頭）在加速期重要；踝關節剛度（小腿複合體）在最大速度期關鍵；訓練應三者兼顧。
  tag: sprint-strength-focus
- q: 如何進行速度訓練的監控與回饋？
  a: 每組記錄衝刺時間（timing gate）評估疲勞；技術錯誤用影像回饋（slow-motion video）；RPE 與心率監控恢復狀態；速度下降 > 3% 視為疲勞停訓標準。
  tag: speed-monitoring
- q: COD 訓練對 ACL 損傷預防的意義為何？
  a: 訓練正確植地技術（膝外展控制、軀幹位置穩定）可降低 ACL 損傷風險；篩查膝外翻（knee valgus）是前置條件；女性運動員更需重視此訓練。
  tag: cod-acl-prevention
- q: 速度訓練在不同運動週期的比例應如何調整？
  a: 一般準備期：低比例速度訓練，以技術與力量為主；特殊準備期：速度比例提升；賽前期：接近比賽速度的高品質短衝；賽季中：維持速度品質，降低總量。
  tag: speed-periodization-phases
- q: 速度訓練和敏捷性訓練的共同安全注意事項有哪些？
  a: 充分動態熱身、確保場地無濕滑或障礙物、初學者先建立直線速度基礎再進行多方向訓練、疲勞時停止（技術崩潰增加損傷風險）、漸進增加訓練強度與複雜度。
  tag: speed-agility-safety
- q: 什麼是「正式起跑」（set position）的關鍵要素？
  a: 北布式起跑履階正式起跑：患腹跟尼轉，臀部高於肩部，前腳要筆直低影；壓襉式：規桌點假想，横平控制上身；起跑指令發出後，瞬間推進，前幾步保持低身前傾。
  tag: set-position-sprint-start
