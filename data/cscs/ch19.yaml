  - id: ch19.sprint-speed-components.i04
    q: 本章如何描述垂直力量在衝刺速度中的角色？
    a:
    - 當前衝刺文獻指出，著地期施加到地面的垂直力量量值可能是改善速度最關鍵的成分
    - 這些較大的力量必須在最短時間內施加，即需要高 RFD
    - 較快衝刺者能在短支撐期持續施加高力量，形成較長且頻率更高的步幅
    detail: 教材以「may be」與「suggests」呈現這項文獻結論，並非絕對斷言；技術效率與訓練設計也同樣限制衝刺速度。
