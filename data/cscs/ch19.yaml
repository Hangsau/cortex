  - id: ch19.program-design-monitoring.i05
    q: 敏捷測驗的決策時間如何定義與解讀？
    a:
    - 決策時間是兩個事件之間的時間，可為正或負；可量測刺激與運動員第一個明確變向植地之間的時間
    - 防守為朝刺激同方向移動；進攻為朝刺激相反方向移動
    - 負決策時間表示運動員在刺激完成動作前就預判變向；這只見於對另一人動作的反應，包括影片或真人刺激
    detail: 將高速攝影機放在變向側面，可同時捕捉刺激與第一個確定植地。進攻、防守都量能顯示運動員是否只在特定比賽情境需要發展知覺—認知能力。
    terms:
    - decision-making-time
    - agility
    - perceptual-cognitive-ability
    numbers: []
    concepts:
