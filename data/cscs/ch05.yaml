cards:
- q: 未訓練者最大自主收縮時能徵召多少比例的肌肉？訓練後為何能提升？
  a: 平均約71%；阻力訓練提高運動皮質驅動輸出，經皮質脊髓徑傳遞，讓更大比例肌肉被徵召
  tag: Neural
- q: Size Principle（大小原則）的徵召順序是什麼？
  a: 依運動神經元大小由小到大：小（慢縮、低閾值）先徵召，大（快縮、高閾值）後徵召
  tag: Neural
- q: 選擇性徵召在什麼情境下發生？時間窗多短？
  a: 爆發性彈道式動作（奧舉、增強式、衝刺）可跳過大小原則直接徵召快縮單位；反向動作到起跳僅約0.4秒的跳躍即可誘發
  tag: Neural
- q: 發火率（rate coding）對小肌肉與大肌肉的相對重要性有何不同？
  a: 小肌肉靠發火率貢獻較大；大肌肉靠徵召更多運動單位貢獻較大；多單位同步發火可讓力量上升更快、峰值更高
  tag: Neural
- q: Deschenes 大鼠研究與人類 7 週研究分別發現 NMJ 有哪些適應？
  a: 大鼠：高強度訓練使突觸面積增加、型態更分散不規則；人類：7 週阻力訓練後運動終板周長/面積增加、乙醯膽鹼受體分散範圍擴大
  tag: Neural
- q: 反射增益（reflex potentiation）的提升幅度是多少？哪些族群反射電位較高？
  a: 提升19–55%；舉重與健美選手的比目魚肌反射電位高於未訓練者
  tag: Neural
- q: Cross-Education 效應的最大值與平均值？機制是什麼？
  a: 最大22%、平均約8%；對側肢體EMG同步增加，顯示效應源自中樞神經適應而非肌肉本身
  tag: Neural
- q: 阻力訓練後拮抗肌協同收縮如何改變？雙側缺失如何變化？
  a: 過度協同收縮降低、淨力輸出提升；雙側缺失（bilateral deficit）減少，甚至轉為雙側促進；衝刺/增強式訓練改變的是協同收縮時機而非量
  tag: Neural
- q: 肌纖維CSA擴大的生物機轉是什麼？
  a: myofibril內actin/myosin淨累積（合成增加、分解減少或兩者）+myofibril數量增加；titin/nebulin等結構蛋白依比例同步合成
  tag: Hypertrophy
- q: Akt/mTOR路徑如何被活化？與myostatin的關係？蛋白合成率上升可持續多久？
  a: 機械負荷（不依賴激素）獨立激活Akt/mTOR/AMPK/MAPK；Akt/mTOR訊號上升驅動肌蛋白合成，myostatin同時下調，合成率上升可持續48小時
  tag: Hypertrophy
- q: EIMD如何促成長期肥大？蛋白合成的順序是什麼？
  a: 高強度訓練造成myofibril/肌節結構破壞，改變基因表現以強化組織；合成順序：水分攝入→非收縮性蛋白→收縮性蛋白；發炎與蛋白轉換共同促成肥大
  tag: Hypertrophy
- q: 機械刺激與代謝刺激兩條肥大路徑各對應什麼訓練特徵？CSA顯著變化需多少次訓練？
  a: 機械：重負荷+離心+低中量（力量訓練）；代謝：高量短休息（健美訓練）；CSA顯著改變需16次以上訓練
  tag: Hypertrophy
- q: Hyperplasia的證據狀態與估計佔比？
  a: 動物模型確認、人體證據矛盾具爭議；若人體確實發生，估計不到10%，非主要肥大機制
  tag: Hypertrophy
- q: Type II纖維肥大幅度為何通常大於Type I？
  a: 依大小原則，Type II需先被徵召才啟動肥大訊號，一旦啟動增生反應比Type I明顯
  tag: Hypertrophy
- q: MacDougall研究中5個月阻力訓練後CP、ATP、肝糖分別增加多少？
  a: CP增加28%、ATP增加18%、肝糖最多增加112%（3–5組×8–10下，組間休息2分鐘）
  tag: Hypertrophy
- q: 肌纖維連續體有哪幾型？訓練誘發的轉型方向是什麼？
  a: I、Ic、IIc、IIac、IIa、IIax、IIx；訓練誘發方向IIx→IIax→IIa；I/II大類由遺傳決定，亞型間可訓練轉型
  tag: Fiber Types
- q: Staron研究中IIx纖維比例8週如何變化？男女出現顯著下降的時間點各是？
  a: 從約18%降至約7%；女性2週（4次訓練）、男性4週（8次訓練）即出現顯著下降
  tag: Fiber Types
- q: 去訓練對纖維類型的影響？overshoot現象是什麼？
  a: IIx比例上升、IIa下降；去訓練後IIx比例可能overshoot，高於訓練前原始水準
  tag: Fiber Types
- q: Type I與Type II之間能否直接轉換？
  a: 看似不太可能（MHC同型異構物與氧化酵素含量差異太大），但目前證據不足以確認或排除
  tag: Fiber Types
- q: 羽狀角與肌束長度如何隨訓練改變？
  a: 阻力訓練增加羽狀角（容納更多蛋白沉積、CSA增加空間更大）；力量型運動員肌束較長；短跑選手腓腸肌/股外側肌肌束長於長跑選手
  tag: Fiber Types
- q: 衝刺訓練如何影響鈣離子釋放？緩衝能力可提升多少？
  a: 衝刺訓練強化鈣離子釋放，助actin/myosin橋接形成；超過乳酸閾值的高強度間歇訓練可使緩衝能力提升16%至38%
  tag: Fiber Types
- q: 骨骼建模（modeling）的機制順序是什麼？
  a: 機械負荷使骨頭形變 → 成骨細胞遷移到形變最大區域 → 分泌膠原蛋白填入空隙 → 膠原纖維礦化，骨徑變粗
  tag: Connective Tissue
- q: MES（最小必要應變）是什麼？書中如何描述它與骨折所需力量的關係？
  a: 啟動新骨生成的應變門檻；書中稱「據認為」約是折斷骨頭所需力量的1/10
  tag: Connective Tissue
- q: 骨密度（BMD）通常需要多久才能測到可測量的變化？為什麼造骨過程其實更早開始？
  a: 約6個月以上；造骨標記可提早驗血測到，BMD儀器要等礦化累積夠久才顯現變化
  tag: Connective Tissue
- q: 促進骨骼強度的訓練原則有哪些？
  a: 多關節結構性動作、力沿軸向穿過脊椎與髖、負荷落在1–10RM、混用重負荷與彈震高衝擊動作、變換動作改變受力方向
  tag: Connective Tissue
- q: 阻力訓練後肌腱結構產生哪些改變？Kubo研究的剛度增幅是多少？
  a: 膠原纖維直徑變大、數量增加、堆積密度提高、共價交聯增多；8週訓練後阿基里斯腱剛度增加15–19%
  tag: Connective Tissue
- q: 韌帶與筋膜的適應各有什麼特點？
  a: 韌帶除膠原外含彈性蛋白，允許關節正常活動；筋膜膠原束朝多平面排列以抵抗各方向的力；適應需走完整關節活動範圍
  tag: Connective Tissue
- q: 軟骨如何獲取養分？固定不動會造成什麼後果？
  a: 軟骨無血液供應，靠滑液擴散；關節活動改變關節囊內壓力推動擴散；固定 → 擴散受阻 → 軟骨細胞死亡、基質被吸收
  tag: Connective Tissue
- q: 膠原蛋白從纖維母細胞到成熟纖維的形成過程？強度真正來自什麼？
  a: 纖維母細胞合成分泌前膠原 → 三條蛋白鏈纏繞成三螺旋 → 兩端保護延伸離開細胞後被酵素切除 → 活性膠原對齊成纖維；交聯（cross-linking）才是強度真正來源
  tag: Connective Tissue
- q: 急性合成激素反應中，哪些激素會升高？可維持多久？在什麼訓練條件下幅度最大？
  a: 睾固酮、GH分子變體、皮質醇；可維持升高長達30分鐘；大肌群動作+中高強度/量+較短休息時幅度最大
  tag: Endocrine
- q: 血乳酸與GH、皮質醇的關聯是什麼？游離睾固酮在阻力訓練者與有氧訓練者有何差異？
  a: 高度相關，氫離子堆積被認為是刺激GH與皮質醇分泌的主要因子；游離睾固酮升幅在阻力訓練者身上大於有氧訓練者
  tag: Endocrine
- q: IGF-I與機械生長因子（mechano growth factor）的差異是什麼？
  a: IGF-I是GH下游媒介、反應延遲且依賴GH；機械生長因子在機械負荷下獨立於GH，於骨骼肌內直接上調
  tag: Endocrine
- q: 胰島素與兒茶酚胺在無氧訓練中的角色分別是什麼？
  a: 胰島素分泌主要受飲食時機影響，不是運動誘發；兒茶酚胺（腎上腺素、去甲腎上腺素、多巴胺）反映急性訓練需求，調節力量產生、收縮速率與能量可用性
  tag: Endocrine
- q: 長期訓練後靜息激素濃度是否會改變？為什麼運動當下的短暫升高就已足夠？
  a: 證據不一致、慢性改變可能性不高；運動中與運動後的短暫升高已足以刺激組織重塑，不需靜息值長期偏高
  tag: Endocrine
- q: Ratamess研究中1組vs6組深蹲對AR分別有何影響？如何減緩AR下調？
  a: 單組無AR差異；6組高量課表在運動後1小時造成AR顯著下調；Kraemer發現運動前後補充蛋白+碳水可減緩這種下調
  tag: Endocrine
- q: 95% 1RM腿推曾測得的血壓與心率峰值各是多少？
  a: 血壓峰值可達320/250 mmHg，心率約170 bpm（Macdougall et al.）
  tag: Cardiovascular
- q: 血壓的向心期/離心期相位差是什麼？一組結束後前5秒心率如何變化？
  a: 血壓向心期高於離心期（黏滯點附近最明顯）；每搏量與心輸出量反而在離心期或組間休息上升更多（Valsalva導致）；一組結束後前5秒心率比動作進行中更高
  tag: Cardiovascular
- q: 肌肉收縮超過多少%MVC會夾壓微血管？造成的代謝物堆積有何生理意義？
  a: 超過20% MVC；血流受阻造成的氫離子堆積與pH下降，本身被認為是刺激肌肉生長的訊號
  tag: Cardiovascular
- q: 短期與長期阻力訓練對靜息心率的影響？統合分析中血壓下降幅度是多少？
  a: 短期下降5–12%，長期研究結果不一致（部分下降4–13%）；統合分析顯示收縮壓與舒張壓皆下降2–4%
  tag: Cardiovascular
- q: 阻力訓練對左心室結構的影響，與有氧訓練的差異是什麼？
  a: 左心室壁厚度與心臟重量上升，但腔室大小幾乎不變；有氧訓練則是腔室擴大，是兩者心臟結構適應的主要差異
  tag: Cardiovascular
- q: 長期訓練後，同樣絕對強度下的心血管反應如何被鈍化？
  a: HR、BP、double product的急性升高幅度都被鈍化；被認為源自左心室後負荷下降，使心肌耗氧量減少
  tag: Cardiovascular
- q: Kraemer五組別研究發現合併阻力+有氧訓練對力量、爆發力、有氧能力各有何影響？
  a: 純阻力組1RM與力量發展速率增幅大於合併組；兩組最大攝氧量進步幾乎相同（未見有氧過度訓練）；爆發力比最大力量更易受干擾，純阻力組峰值功率提升、合併組沒有
  tag: Cardiovascular
- q: 不同訓練程度者的最大肌力增幅（超過100項研究綜述）？
  a: 未訓練約40%、中度訓練20%、訓練者16%、進階10%、精英2%
  tag: Program Design
- q: 各動作峰值功率輸出對應的最佳負荷？
  a: Jump squat：0%1RM（體重）；深蹲峰值功率在56%1RM；power clean在80%1RM；上肢彈震臥推投擲在46–62%1RM；訓練有素的爆發力運動員在較高負荷（30–60%1RM）也可達峰值功率
  tag: Program Design
- q: 無氧肌耐力訓練誘發的骨骼肌適應有哪些？
  a: 纖維類型轉型（教材原文為IIx→IIb）；粒線體與微血管數量增加；緩衝能力、抗疲勞性與代謝酶活性提升
  tag: Program Design
- q: 合併阻力+有氧訓練最容易出現不相容效應的頻率安排是什麼？Sale研究發現什麼？
  a: 每週交替6天分開訓練、或每週4–6天高強度合併訓練較容易出現不相容；Sale研究：每週4天分開訓練（2天阻力+2天有氧）比每週2天合併訓練對腿推1RM效果更好（25% vs 13%）
  tag: Program Design
- q: 訓練順序如何影響表現？25分鐘有氧後做深蹲，反覆次數減少多少？
  a: 三組平均減少13%至36%
  tag: Program Design
- q: 過度訓練連續體的四階段是什麼？各自恢復所需時間為何？
  a: 急性疲勞（數天）→ FOR（數天至數週）→ NFOR（數週至數月）→ OTS（數月至數年）
  tag: Overtraining
- q: 交感型與副交感型OTS的差異？最終都走向哪一型？
  a: 交感型：靜息交感活性上升，好發訓練速度/力量的年輕運動員，通常先出現；副交感型：靜息與運動時副交感活性都上升；所有過度訓練狀態最終走向副交感型
  tag: Overtraining
- q: Fry兩項NFOR研究的設計與結果分別是什麼？
  a: 研究一：8組95%1RM深蹲、連續6天 → 非特定性表現下降但1RM維持不變；研究二：10組1RM深蹲、7天（中間休息一天）→ 73%受試者1RM下降超過9.9磅（4.5公斤）
  tag: Overtraining
- q: 訓練有素舉重選手停訓14天後，各項表現指標分別下降多少？
  a: 臥推1RM −1.7%、深蹲1RM −0.9%、等長膝伸展−7%、等速向心膝伸展−2.3%、垂直跳+1.2%（幾乎無變化）
  tag: Detraining
- q: 長期停訓的累積流失數據？健力選手7個月與健美選手13.5個月分別損失多少？
  a: 健力選手7個月後所有纖維類型平均萎縮37.1%；健美選手13.5個月後無脂肪體重−9.3%、大腿圍−0.5%、手臂圍−11.5%、平均纖維面積−8.3%
  tag: Detraining
