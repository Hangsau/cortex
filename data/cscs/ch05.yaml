id: ch05
weight: 5
title: Ch.5 無氧訓練適應
topics:
- id: cardiovascular-adaptations
  title: 心血管反應 Cardiovascular Adaptations
  desc: ''
  tag: Cardiovascular
  items:
  - id: ch05.cardiovascular-adaptations.i01
    q: 急性反應
    a:
    - 阻力運動時心率（HR）、每搏量（SV）、心輸出量（CO）、血壓全部顯著急性上升
    - 高強度（95% 1RM）腿推曾測得血壓峰值 320/250 mmHg、心率 170 bpm
    - 血壓反應隨主動肌肉量增加而呈非線性上升
    detail: 這組數字來自單一項腿推測試研究，代表可能出現的極端值，不是每次重訓的常態反應。書中同時強調：儘管血壓瞬間飆得很高，目前證據不足以顯示阻力訓練會對靜息血壓造成負面影響。
    terms:
    - stroke-volume
    - cardiac-output
    numbers:
    - v: 320/250
      unit: mmHg
      of: 95% 1RM 腿推測得的血壓峰值
    - v: 170
      unit: bpm
      of: 同一測試測得的心率峰值
    - v: 95
      unit: '% 1RM'
      of: 該峰值血壓與心率測試所用的負荷強度
    concepts:
    - adaptation
    - circulation
    related:
    - ch06.acute-cardiovascular.i01
    - ch06.acute-cardiovascular.i06
    locator: Cardiovascular and Respiratory Responses to Anaerobic Exercise > Acute
      Cardiovascular Responses to Anaerobic Exercise
  - id: ch05.cardiovascular-adaptations.i02
    q: 血壓相位差
    a:
    - 血壓在向心期高於離心期，尤其在動作的「黏滯點」（sticking point）附近最明顯
    - 每搏量與心輸出量反而在離心期上升較多，使用 Valsalva 手法時更明顯
    - 原因是向心期胸內壓與腹內壓上升（Valsalva）限制靜脈回流、降低舒張末期容積，使血液動力反應延後到離心期或組間休息才浮現
    - 一組結束後的前 5 秒，心率反而比動作進行中還高
    detail: 血流的高峰不是跟著出力最大的瞬間走，而是被向心期的胸內壓機制延後——這代表監測阻力訓練的心血管負荷不能只看動作當下，組間休息的前幾秒同樣是高負荷時刻。
    terms:
    - valsalva
    - stroke-volume
    - cardiac-output
    numbers:
    - v: 5
      unit: 秒
      of: 一組結束後心率高於動作進行中的時間窗
    concepts:
    - adaptation
    - circulation
    related:
    - ch01.cardiovascular.muscle-pump
    - ch06.acute-cardiovascular.i05
    locator: Cardiovascular and Respiratory Responses to Anaerobic Exercise > Acute
      Cardiovascular Responses to Anaerobic Exercise
  - id: ch05.cardiovascular-adaptations.i03
    q: 血流阻斷
    a:
    - 肌肉收縮超過 20% 最大自主收縮力（MVC）時會夾壓微血管，造成局部血流受阻
    - 休息期血流回升，稱為反應性充血（reactive hyperemia）
    - 血流受阻造成的代謝物（氫離子）堆積與 pH 下降，本身被認為是刺激肌肉生長的訊號
    - 血流受阻的程度取決於阻力強度、持續時間（反覆次數）、動用的肌肉量三項
    detail: 缺血與刺激生長在書中被直接連在一起講——這不是阻力訓練的副作用，而是重量夠重時本來就會發生、且被認為具有生理意義的一環；輕負荷高反覆的阻力運動因為不會夾壓微血管，血流表現反而比較接近有氧運動。
    terms:
    - mvc
    - reactive-hyperemia
    numbers:
    - v: 20
      unit: '% MVC'
      of: 造成微血管夾壓、血流受阻的收縮強度門檻
    concepts:
    - adaptation
    - circulation
    related:
    - ch03.lactate.i02
    - ch05.hypertrophy.i04
    locator: Cardiovascular and Respiratory Responses to Anaerobic Exercise > Acute
      Cardiovascular Responses to Anaerobic Exercise
  - id: ch05.cardiovascular-adaptations.i04
    q: 慢性靜息適應
    a:
    - 短期阻力訓練可使靜息心率下降 5–12%
    - 長期追蹤結果不一致：有些研究無變化，有些下降 4–13%
    - 長期訓練者（健美、健力、舉重選手）靜息心率的平均值與偏低值（60–78 bpm）都比未訓練者常見
    - 統合分析顯示收縮壓與舒張壓皆下降 2–4%，起始血壓略高者效果最明顯
    - 每搏量絕對值上升，但相對於體表面積或除脂體重則沒有上升（隨除脂體重增加而增加）
    - 總膽固醇與低密度脂蛋白可能不變或略降，高密度脂蛋白可能上升
    detail: 書中明講「重阻力訓練對靜息心臟功能的提升有限」——真正對靜息心血管功能有較大改善的，反而是高量、短休息的健美式或循環訓練，因為那種訓練整體的持續張力更高，更接近有氧刺激。
    terms:
    - double-product
    numbers:
    - v: 5–12
      unit: '%'
      of: 短期阻力訓練後靜息心率下降幅度
    - v: 4–13
      unit: '%'
      of: 部分長期追蹤研究的靜息心率下降幅度
    - v: 60–78
      unit: bpm
      of: 長期訓練者靜息心率範圍
    - v: 2–4
      unit: '%'
      of: 統合分析中收縮壓／舒張壓下降幅度
    concepts:
    - adaptation
    - circulation
    related:
    - ch06.chronic-cardiovascular.i03
    - ch06.chronic-cardiovascular.i04
    locator: Cardiovascular and Respiratory Responses to Anaerobic Exercise > Chronic
      Cardiovascular Adaptations at Rest
  - id: ch05.cardiovascular-adaptations.i05
    q: 左心室壁厚↑
    a:
    - 慢性阻力訓練使左心室壁厚度與心臟重量上升，但換算成相對體表面積或除脂體重後，差異就消失了
    - 左心室腔室大小或容積幾乎沒有變化——這是阻力訓練與有氧訓練在心臟結構適應上的主要差異
    - 健美選手的左右心室絕對舒張末期／收縮末期容積比正常值大，但舉重選手沒有這個現象；書中提醒這可能與健美選手常兼練有氧運動有關
    - 健美與舉重選手的左心房內徑（絕對值與相對值）都比正常值大，健美選手的差異更明顯
    detail: 心室壁增厚被認為源自訓練中間歇性的血壓與胸內壓升高，加上除脂體重與體型增加所需的代償。「腔室不變、壁增厚」常被拿來與有氧訓練的「腔室擴大」模式對比，但書中同時提醒健美選手的容積變化未必是阻力訓練單獨造成的。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - circulation
    related:
    - ch06.chronic-cardiovascular.i01
    - ch06.chronic-cardiovascular.i02
    locator: Cardiovascular and Respiratory Responses to Anaerobic Exercise > Chronic
      Cardiovascular Adaptations at Rest
  - id: ch05.cardiovascular-adaptations.i06
    q: 運動心血管鈍化
    a:
    - 長期阻力訓練後，同樣絕對強度下 HR、BP、double product（心率×收縮壓，反映心肌作功）的急性上升幅度都會被鈍化
    - 男性健美選手在 50–100% 1RM 力竭組別中，收縮壓、舒張壓與心率都低於久坐者與訓練較少者
    - 健美選手的峰值心輸出量與每搏量顯著高於健力選手，顯示同樣絕對負荷下訓練者能動用更大的每搏量與心輸出量
    - 這些適應被認為源自左心室後負荷（afterload）下降，使心輸出量上升、心肌耗氧量下降
    - 重負荷低量的阻力訓練通常無法改善氧氣攝取率，高量短休息的阻力訓練或連續有氧運動改善幅度較大
    detail: 鈍化不是心臟變弱，而是同一份工作對心臟造成的相對負擔變小。書中特別點出健美 vs 健力的對比不是負荷大小的差異，而是量與休息結構的差異——健美式的高量短休息練法本身就比健力式的低量長休息更接近能練到心血管功能的刺激。
    terms:
    - double-product
    - afterload
    numbers:
    - v: 50–100
      unit: '% 1RM'
      of: 健美選手力竭組別測試所用的負荷範圍
    concepts:
    - adaptation
    - circulation
    related:
    - ch06.chronic-cardiovascular.i04
    - ch17.training-volume.i01
    locator: Cardiovascular and Respiratory Responses to Anaerobic Exercise > Chronic
      Adaptations of the Acute Cardiovascular Response to Anaerobic Exercise
  - id: ch05.cardiovascular-adaptations.i07
    q: 通氣反應
    a:
    - 通氣速率通常不是阻力訓練的限制因子，阻力訓練對它的影響不明顯或只有中度改善
    - 每組動作中通氣量已顯著升高，恢復的第一分鐘升高幅度甚至更大
    - 已測到通氣量超過 60 L/min；休息時間長短影響很大，短休息（30 秒至 1 分鐘）造成的通氣升高最明顯
    - 訓練適應包含最大運動時潮氣容積與呼吸頻率都上升；次大強度運動時呼吸頻率反而下降、潮氣容積上升
    - 訓練者的每分通氣當量（V̇E/V̇O2，通氣量對耗氧量的比值）比未訓練者更有效率
    detail: 休息期間通氣量比組內還高，提醒了一件事：阻力訓練的呼吸負荷高峰常落在組間，不是動作當下——這也是短休息的高量訓練通氣需求特別大的原因。
    terms:
    - tidal-volume
    - ventilatory-equivalent
    numbers:
    - v: 60
      unit: L/min
      of: 阻力訓練組間通氣量的已測上限（超過此值）
    - v: 30 秒–1
      unit: 分鐘
      of: 造成最大通氣升高的休息時間範圍
    concepts:
    - adaptation
    - circulation
    related:
    - ch06.acute-respiratory.i01
    - ch06.chronic-cardiovascular.i07
    locator: Cardiovascular and Respiratory Responses to Anaerobic Exercise > Ventilatory
      Response to Anaerobic Exercise
  - id: ch05.cardiovascular-adaptations.i08
    q: 有氧阻力並用
    a:
    - 合併阻力與有氧訓練可能干擾力量／爆發力增益，主因是有氧訓練的強度、量或頻率過高
    - Kraemer 三個月五組別研究：純阻力組的 1RM 力量與力量發展速率增幅都大於合併組；但兩組的最大攝氧量進步幾乎相同，顯示合併訓練沒有造成有氧的過度訓練
    - 爆發力比最大力量更容易受干擾：純阻力組上肢與下肢的峰值功率都有提升，合併組沒有
    - 每週交替 6 天分開訓練（3 天阻力＋3 天有氧）或每週 4–6 天高強度合併訓練較容易出現不相容效應；同一次訓練同時做兩者、每週約 3 天且組間留休息日則較少出現不相容
    - 訓練順序也有影響：25 分鐘有氧運動後 30 分鐘做深蹲，反覆次數比未先做有氧時減少 13–36%
    detail: 干擾效應不是「有氧就會抵銷力量」的全稱命題——書中的反例是每週 4 天分開訓練（2 天阻力＋2 天有氧）比每週 2 天合併訓練對腿推 1RM 的效果更好（25% vs 13%），代表安排的頻率與恢復間隔比「有沒有做有氧」本身更關鍵。
    terms: []
    numbers:
    - v: 13–36
      unit: '%'
      of: 有氧運動後 30 分鐘做深蹲，反覆次數的減少幅度
    - v: 25
      unit: '%'
      of: 每週 4 天分開訓練組的腿推 1RM 增幅
    - v: 13
      unit: '%'
      of: 每週 2 天合併訓練組的腿推 1RM 增幅
    concepts:
    - adaptation
    - circulation
    related:
    - ch18.program-design.i08
    - ch20.special-issues.i05
    locator: Compatibility of Aerobic and Anaerobic Modes of Training
- id: connective-tissue
  title: 結締組織適應 Bone & Connective Tissue
  desc: ''
  tag: Bone / CT
  items:
  - id: ch05.connective-tissue.i01
    q: 骨骼建模
    a:
    - 機械負荷讓骨頭產生形變（彎曲、壓縮或扭轉）
    - 成骨細胞（osteoblast）遷移到形變最大的區域
    - 分泌膠原蛋白填進骨細胞之間的空隙
    - 膠原纖維礦化，骨骼直徑因此變粗
    detail: 力量從肌肉經肌腱拉在骨頭的附著點上，骨頭被拉彎的那一側就是訊號發生的地方——所以刺激骨骼的關鍵不是「有沒有動」，而是形變夠不夠大。骨徑變粗之所以重要，是因為抗彎能力隨直徑增加而大幅上升，同樣一份負荷造成的應變就變小了。
    terms:
    - osteoblast
    - bone-modeling
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch05.connective-tissue.i02
    - ch01.skeleton.bone-adaptation
    - ch17.exercise-selection.i03
    locator: Connective Tissue Adaptations
  - id: ch05.connective-tissue.i02
    q: MES 閾值
    a:
    - 最小必要應變（MES）是啟動新骨生成的門檻
    - 書中說 MES「據認為」約是折斷骨頭所需力量的 1/10
    - 低於門檻的力不構成刺激，超過才會叫成骨細胞來造骨
    detail: 骨細胞會反過來調節造骨速度，讓日常反覆承受的力量維持在 MES 之下，等於自動保留一段防骨折的安全邊際。這也解釋了為什麼日常活動練不到骨頭——身體已經把日常負荷校準在門檻底下了，要長骨就必須拿出超過日常的負荷。
    terms:
    - minimal-essential-strain
    - bone-modeling
    numbers:
    - v: 約 1/10
      unit: 倍
      of: MES 相對於折斷骨頭所需力量的比例（原文為推估值）
    concepts:
    - adaptation
    - structure
    related:
    - ch01.skeleton.bone-adaptation
    - ch17.principles-exam-tips.i02
    locator: Connective Tissue Adaptations > General Bone Physiology
  - id: ch05.connective-tissue.i03
    q: BMD 與肌力相關
    a:
    - 肌力或肌肉量上升，肌肉拉骨頭的力量跟著變大，骨量必須跟上才撐得住
    - 所以肌力增加通常伴隨骨密度（BMD）上升
    - 不活動或被固定則相反，骨質會流失
    - 骨骼適應的時間尺度約六個月以上
    detail: 六個月指的是骨密度真的量得出變化所需的時間，不是適應開始的時間——造骨過程在頭幾次訓練就啟動了。差別在於骨頭會把新生成的物質先分泌到血液中（造骨標記），驗血就能提早看到反應，而 BMD 儀器要等礦化累積夠久才看得出來。
    terms:
    - bone-mineral-density
    - osteoblast
    numbers:
    - v: 約 6
      unit: 個月以上
      of: 骨密度出現可測量變化所需的時間
    concepts:
    - adaptation
    - structure
    related:
    - ch07.older-adults-training.i03
    - ch09.protein.i07
    locator: Connective Tissue Adaptations > Anaerobic Training and Bone Growth
  - id: ch05.connective-tissue.i04
    q: 骨骼訓練原則
    a:
    - 選多關節的結構性動作，避開單關節孤立動作
    - 讓力的向量沿軸向穿過脊椎與髖
    - 用漸進超負荷，負荷落在 1–10RM 這種重的區間
    - 兼用重負荷與彈震／高衝擊動作，給骨頭不同強度的力
    - 變換動作選擇，改變力的分布方向
    detail: 前四點是強度，第五點是方向——骨基質裡的膠原纖維會順著承受應力的方向重新排列，所以一直練同樣的動作，骨頭會把那個方向「補強完就不再反應」。換動作等於換受力線，對骨頭而言又是新刺激。專一性也一樣嚴格：只有真正被載到的那段骨骼會長，跑步練得到下肢卻練不到脊椎。
    terms:
    - progressive-overload
    - structural-exercise
    - repetition-maximum
    numbers:
    - v: 1–10
      unit: RM
      of: 刺激骨骼生長所需的負荷區間
    concepts:
    - adaptation
    - program-design
    related:
    - ch17.exercise-selection.i03
    - ch17.principles-exam-tips.i02
    locator: Connective Tissue Adaptations > Principles of Training to Increase Bone Strength
  - id: ch05.connective-tissue.i05
    q: 肌腱適應
    a:
    - 膠原纖維（fibril）直徑變大
    - 纖維數量增加
    - 纖維排列的堆積密度提高
    - 纖維之間的共價交聯變多
    - 結果是肌腱能承受更大的張力
    detail: 這四項合起來造成的可測結果是「肌腱剛度」上升——同樣的拉力下肌腱被拉長得比較少，力量傳遞的損耗因此減少。Kubo 等人的研究測到八週阻力訓練後阿基里斯腱剛度增加 15–19%。強度是關鍵變項：低到中強度不會明顯改變結締組織的膠原含量。
    terms:
    - collagen
    - tendon-stiffness
    - cross-link
    numbers:
    - v: 15–19
      unit: '%'
      of: 八週阻力訓練後阿基里斯腱剛度的增加幅度
    - v: 8
      unit: 週
      of: 上述肌腱剛度研究的訓練期長度
    concepts:
    - adaptation
    - structure
    related:
    - ch18.mechanical-models.i03
    - ch22.injury-types.i06
    locator: Connective Tissue Adaptations > Adaptations of Tendons, Ligaments, and Fascia to Anaerobic Training
  - id: ch05.connective-tissue.i06
    q: 韌帶與筋膜
    a:
    - 三者的生長刺激都來自高強度運動造成的機械力，適應程度與強度成正比
    - 韌帶除膠原外還含彈性蛋白（elastin），才能允許關節正常活動
    - 筋膜的膠原束朝不同平面排列，用來抵抗來自各方向的力
    - 動作要走完整關節活動範圍，並盡量用多關節動作
    detail: 成熟的肌腱與韌帶細胞很少、代謝活性低，需氧與養分需求都小——這是它們受傷後癒合特別慢的結構原因，不是血流「差」而已。全關節活動範圍之所以被特別點名，是因為結締組織能增強的位置有三處：腱（韌帶）與骨的交界、腱體本身、以及肌肉內的筋膜網，而只有走完整範圍才會把力施加到交界處。
    terms:
    - collagen
    - fascia
    - range-of-motion
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch01.skeleton.synovial-joint
    - ch22.injury-types.i03
    locator: Connective Tissue Adaptations > Adaptations of Tendons, Ligaments, and Fascia to Anaerobic Training
  - id: ch05.connective-tissue.i07
    q: 軟骨
    a:
    - 軟骨沒有自己的血液供應，靠滑液擴散取得氧氣與養分
    - 關節活動改變關節囊內壓力，把養分推向關節軟骨
    - 關節被固定 → 擴散受阻 → 軟骨細胞死亡、基質被吸收
    - 中等強度運動看來足以增加軟骨厚度
    detail: 「沒有血流、靠擴散」直接解釋了兩件事：軟骨受傷後不易自行修復，以及不動比動更傷關節——因為擴散是靠關節活動時的壓力變化驅動的。書中對外部負荷「增加」軟骨厚度的效果講得保留（尚未完全釐清），但對移除負荷造成萎縮則講得肯定。
    terms:
    - hyaline-cartilage
    - synovial-fluid
    - chondrocyte
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch01.skeleton.cartilaginous-joint
    - ch06.connective-endocrine.i03
    locator: Connective Tissue Adaptations > Adaptations of Cartilage to Anaerobic Training
  - id: ch05.connective-tissue.i08
    q: 膠原蛋白結構
    a:
    - 纖維母細胞（fibroblast）合成並分泌前膠原蛋白（procollagen）
    - 前膠原由三條蛋白鏈互相纏繞成三螺旋
    - 兩端帶保護性延伸，離開細胞後才被酵素切除
    - 切除後成為活性膠原，與其他膠原分子對齊成長纖維
    - 交聯（cross-linking）才是強度的真正來源
    detail: 兩端的保護性延伸是防止膠原在細胞內就提早聚合。因為切除靠酵素，測酵素濃度就能反映膠原代謝速率——訓練後酵素上升，是結締組織正在重塑的證據。骨、肌腱、韌帶用的是第一型膠原，軟骨用第二型。
    terms:
    - collagen
    - fibroblast
    - cross-link
    numbers: []
    concepts:
    - structure
    related:
    - ch22.fibroblastic-phase.i02
    - ch22.maturation-phase.i02
    locator: Connective Tissue Adaptations > Adaptations of Tendons, Ligaments, and Fascia to Anaerobic Training
- id: detraining
  title: 去訓練 Detraining
  desc: ''
  tag: Detraining
  items:
  - id: ch05.detraining.i01
    q: 可逆性原則
    a:
    - 去訓練指停止無氧訓練，或頻率、訓練量、強度大幅減少後，表現與已累積的生理適應下降的現象
    - 依可逆性原則，訓練誘發的適應是暫時性的，訓練負荷不足或完全移除時會逐漸消失
    - 損失幅度取決於去訓練期間的長度，以及個人原本的訓練狀態
    detail: 可逆性原則是整個去訓練主題的統攝概念——後面所有具體數字（4 週、8–12 週、7 個月、13.5 個月）都是同一條原則在不同時間尺度下的展開，不是各自獨立的現象。
    terms:
    - reversibility
    numbers: []
    concepts:
    - adaptation
    related:
    - ch06.detraining.i01
    - ch21.sfra-theory.i03
    locator: Detraining
  - id: ch05.detraining.i02
    q: 停訓初期：肌力的滯後效應
    a:
    - 移除訓練刺激後，去訓練效應要經過一段延遲才會完全顯現
    - 一般而言肌力可維持長達 4 週不受影響
    - 但高度訓練者的離心力量與運動專項爆發力，可能提早、更快出現下滑
    detail: 「一般肌力維持 4 週」與「高訓練者更快下滑」看似矛盾，其實反映訓練狀態越高，維持適應所需的持續刺激也越精細——離心力與爆發力是相對晚期、高度特化的適應，停止刺激後也最先流失。
    terms: []
    numbers:
    - v: 4
      unit: 週
      of: 一般情況下肌力可維持不受去訓練影響的時間
    concepts:
    - adaptation
    related:
    - ch05.neural-adaptations.i01
    - ch21.active-rest.i06
    locator: Detraining
  - id: ch05.detraining.i03
    q: 14 天停訓的實測數據
    a:
    - 訓練有素的舉重選手停訓 14 天：1RM bench press –1.7%、squat –0.9%
    - 等長膝伸展力 –7%、等速向心膝伸展力 –2.3%、垂直跳表現 +1.2%（幾乎無變化）
    - 休閒訓練男性在停訓前 6 週內變化非常小
    detail: 這組數字說明短期停訓（2 週）對訓練有素者的影響其實很輕微，垂直跳甚至沒有下滑——這與「停練馬上退步」的直覺不同，也支持前一條「肌力一般可維持 4 週」的說法。
    terms: []
    numbers:
    - v: -1.7
      unit: "%"
      of: 舉重選手停訓 14 天後臥推 1RM 的變化
    - v: -0.9
      unit: "%"
      of: 舉重選手停訓 14 天後深蹲 1RM 的變化
    - v: 6
      unit: 週
      of: 休閒訓練男性停訓後幾乎無變化可維持的期間
    concepts:
    - adaptation
    related:
    - ch13.max-strength.i01
    - ch13.power-tests.i04
    locator: Detraining
  - id: ch05.detraining.i04
    q: 8–12 週的中期損失與神經機制
    a:
    - 訓練有素的力量型運動員停訓時間拉長後，肌力下滑幅度明顯加大，但停訓 8–12 週的損失仍限制在 7% 至 12%
    - 肌力損失伴隨著雙側與單側最大肌電圖（EMG）活性下降
    - 肌力下降初期與神經機制相關，隨去訓練期間拉長，肌肉萎縮才逐漸取代神經因素成為主因
    detail: EMG 下降先於（並先於）明顯的肌肉萎縮，說明肌力流失的順序與獲得時相似——神經適應先變化，結構性適應（肌肉量）的改變在後，這跟本章神經適應主題「肌力增益初期多來自神經」的邏輯剛好對稱。
    terms: []
    numbers:
    - v: 7-12
      unit: "%"
      of: 停訓 8 至 12 週後力量型運動員的肌力損失範圍
    concepts:
    - adaptation
    related:
    - ch05.neural-adaptations.i01
    - ch21.fitness-fatigue.i07
    locator: Detraining
  - id: ch05.detraining.i05
    q: 殘留效應與肌肉記憶
    a:
    - 保留下來的肌力很少低於訓練前的原始水準，顯示阻力訓練停止後仍有「殘留效應」
    - 恢復訓練時，肌力重新獲得的速度很快，支持「肌肉記憶」的說法
    detail: 殘留效應加上快速重獲，是去訓練主題裡對訓練者最實用的訊息——即使長時間中斷訓練，肌力也很少完全打回原點，回歸訓練後找回水準的速度也遠比從零開始訓練快。
    terms: []
    numbers: []
    concepts:
    - adaptation
    related:
    - ch21.fitness-fatigue.i07
    - ch20.program-design.i07
    locator: Detraining
  - id: ch05.detraining.i06
    q: 纖維類型分布與氧化性纖維的反直覺變化
    a:
    - 停訓初期，纖維結構的破壞程度大致不變；力量型運動員停訓 14 天，肌纖維類型分布沒有明顯改變
    - 停訓 8 週內，力量型運動員的氧化性纖維比例可能反而增加（耐力型運動員則是減少）
    detail: 這是本主題最反直覺的一條——一般預期「不練了適應就全部退步」，但氧化性纖維比例在力量型運動員身上短期內不減反增，且與耐力型運動員的方向相反，說明去訓練效應會依原本的訓練型態分道而行，不是單一退化曲線。
    terms: []
    numbers:
    - v: 14
      unit: 天
      of: 力量型運動員停訓後肌纖維類型分布仍無明顯改變的時間
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch05.fiber-type-transitions.i01
    - ch06.chronic-muscular.i04
    locator: Detraining
  - id: ch05.detraining.i07
    q: 橫截面積（CSA）的快速流失：快縮優先
    a:
    - 纖維類型分布不變的同時，肌纖維橫截面積（CSA）在力量與短跑型運動員身上下滑得很快
    - Hortobagyi 等人對 12 位訓練有素舉重選手的研究：停訓 14 天，快縮纖維 CSA 下降 6.4%，慢縮纖維初期無顯著變化
    - 職業橄欖球聯盟球員：賽季末快縮纖維 CSA 比慢縮大 23%，但停訓 6 週後這個差距只剩 9%
    detail: CSA 與纖維類型分布是兩個獨立指標——「型態沒變」不代表「大小沒變」，快縮纖維的體積流失速度遠快於慢縮纖維，也遠快於纖維類型本身重新分類的速度。
    terms: []
    numbers:
    - v: -6.4
      unit: "%"
      of: 舉重選手停訓 14 天後快縮纖維 CSA 的下降幅度
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch07.aging-musculoskeletal.i01
    - ch09.protein.i03
    locator: Detraining
  - id: ch05.detraining.i08
    q: 長期停訓的累積流失
    a:
    - 一位健力選手停訓 7 個月後，所有纖維類型平均萎縮 37.1%
    - 頂尖健美選手停訓 13.5 個月後：無脂肪體重 –9.3%、大腿圍 –0.5%、手臂圍 –11.5%、平均纖維面積 –8.3%
    detail: 大腿圍幾乎不變（–0.5%）但纖維面積大幅下降（–8.3%），兩個數字放在一起說明周徑測量對偵測肌肉流失並不敏感——外觀維度變化遠小於實際肌纖維層級的萎縮程度。
    terms: []
    numbers:
    - v: 37.1
      unit: "%"
      of: 健力選手停訓 7 個月後所有纖維類型的平均萎縮幅度
    - v: 13.5
      unit: 個月
      of: 頂尖健美選手停訓後觀察無脂肪體重、圍度與纖維面積下降的時間點
    concepts:
    - adaptation
    related:
    - ch06.detraining.i03
    - ch21.active-rest.i06
    locator: Detraining
- id: endocrine-adaptations
  title: 內分泌反應 Endocrine Adaptations
  desc: ''
  tag: Endocrine
  items:
  - id: ch05.endocrine-adaptations.i01
    q: 急性合成激素反應
    a:
    - 無氧運動（特別是阻力訓練）後，男性的睾固酮、GH 分子變體、皮質醇濃度可維持升高長達 30 分鐘
    - 升高幅度在使用大肌群動作，或中高強度、中高訓練量搭配較短休息時最大
    detail: 這條建立本主題的基準模式——急性激素反應不是恆定的，其幅度直接由訓練變項（動作選擇、強度、量、休息）決定，後面幾條都是圍繞這個基準模式的延伸與例外。
    terms:
    - testosterone
    - cortisol
    numbers:
    - v: 30
      unit: 分鐘
      of: 無氧運動後男性睾固酮／GH／皮質醇維持升高的時間
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.program-design.i01
    - ch04.growth-hormone.i04
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Acute Anabolic Hormone Responses
  - id: ch05.endocrine-adaptations.i02
    q: 乳酸／氫離子與 GH、皮質醇的關聯
    a:
    - 血乳酸與 GH、皮質醇濃度呈高度相關，氫離子累積被認為是刺激 GH 與皮質醇分泌的主要因子
    - 游離睾固酮的升高幅度在阻力訓練者身上大於有氧訓練者
    - 部分研究顯示女性運動後睾固酮也有輕微升高
    detail: 氫離子累積作為刺激因子的推論，直接呼應本章稍早高強度間歇訓練提升緩衝能力的邏輯——同一種代謝壓力（H⁺堆積）既是誘發內分泌反應的訊號，也是誘發緩衝適應的訊號。
    terms:
    - testosterone
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch03.lactate.i02
    - ch04.cortisol.i06
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Acute Anabolic Hormone Responses
  - id: ch05.endocrine-adaptations.i03
    q: IGF-I 與機械生長因子
    a:
    - IGF-I 是 GH 的主要下游媒介，作用於幾乎所有細胞（尤其骨骼肌、軟骨、骨）的生長促進
    - IGF-I 對運動的反應延遲，且依賴急性 GH 反應才會啟動
    - 機械生長因子（mechano growth factor）則在機械負荷下獨立於 GH 於骨骼肌內上調
    detail: 「獨立於 GH」是這條的關鍵——它說明肌肉的生長訊號不是單一線性鏈（GH→IGF-I→生長），而是存在一條不需要等待 GH 反應、由機械形變直接觸發的平行路徑。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.igf.i03
    - ch11.insulin-hgh.i05
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Acute Anabolic Hormone Responses
  - id: ch05.endocrine-adaptations.i04
    q: 胰島素與兒茶酚胺的角色
    a:
    - 胰島素分泌主要跟隨血糖與胺基酸濃度變化，受補充品攝取時機的影響大於無氧運動本身的刺激
    - 兒茶酚胺（腎上腺素、去甲腎上腺素、多巴胺）反映無氧運動的急性需求
    - 兒茶酚胺濃度上升對調節力量產生、肌肉收縮速率、能量可用性，以及強化其他激素（如睾固酮）的作用都很重要
    detail: 胰島素在這裡被排除在「運動誘發」的激素之外——它的變化主要由飲食時機驅動，這也是為何討論運動內分泌適應時，胰島素通常只在營養介入的脈絡下被提及。
    terms:
    - catecholamine
    - epinephrine
    - norepinephrine
    - dopamine
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.catecholamines.i02
    - ch11.insulin-hgh.i01
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Acute Anabolic Hormone Responses
  - id: ch05.endocrine-adaptations.i05
    q: 急性反應的慢性改變
    a:
    - 長期阻力訓練使身體能承受漸增的相對訓練強度，可產生更大肌肉力量
    - 隨之而來的是急性內分泌反應也會反映這種適應提升，此現象在 GH 上被最明顯地觀察到
    detail: 這裡的「慢性改變」指的是急性反應本身隨訓練資歷變得更強，而不是靜息濃度改變——兩者是本主題容易混淆的兩種不同時間尺度變化，下一條會處理靜息濃度的部分。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.growth-hormone.i07
    - ch04.testosterone.i08
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Chronic Changes in the Acute Hormonal Response
  - id: ch05.endocrine-adaptations.i06
    q: 靜息激素濃度多半不變
    a:
    - 長期無氧訓練後，睾固酮、GH、IGF-I、皮質醇的靜息濃度變化證據不一致，慢性改變的可能性不高
    - 運動中與運動後的短暫升高，被認為已足以刺激組織重塑，不需要靜息基準值長期偏高
    detail: 這條解釋為何「測靜息激素濃度」不是判斷訓練適應好壞的可靠指標——真正驅動組織重塑的是訓練當下與訓練後的急性波動，靜息值本身反而相對穩定。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.cortisol.i04
    - ch04.testosterone.i08
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Chronic Changes in Resting Hormonal Concentrations
  - id: ch05.endocrine-adaptations.i07
    q: 雄激素受器（AR）含量與上調時機
    a:
    - AR 含量（目標組織單位面積的受器數）取決於肌纖維類型、收縮活動量與睾固酮濃度
    - 阻力訓練後 48 至 72 小時內，AR 含量會上調
    - 訓練刺激的量似乎會調節 AR 變化的幅度
    detail: AR 含量不是固定值而是動態調控的變數，這條先建立「受什麼因素影響、多久後上調」的基準模式，下一條會說明高訓練量反而先讓 AR 下調的例外情況。
    terms:
    - androgen-receptor
    numbers:
    - v: 48-72
      unit: 小時
      of: 阻力訓練後 AR 含量開始上調所需的時間範圍
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.receptor-mechanisms.i01
    - ch04.receptor-mechanisms.i03
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Hormone Receptor Changes
  - id: ch05.endocrine-adaptations.i08
    q: AR 先下調現象與慢性高暴露的代價
    a:
    - Ratamess 等人比較 1 組與 6 組 × 10 下深蹲：單組無 AR 差異，6 組的高量課表在運動後 1 小時造成 AR 顯著下調，早於其他研究觀察到的上調
    - Kraemer 等人發現運動前後補充蛋白＋碳水可減緩這種 AR 下調
    - 慢性高激素暴露長期而言可能適得其反：受器會因持續高暴露而下調（如第二型糖尿病患者對胰島素的敏感度下降）
    - 這也是類固醇使用者採取週期性用藥而非持續高劑量的原因
    detail: 高量訓練先下調 AR 這個發現，與「訓練量越大合成反應越強」的直覺相反——書中把它跟慢性高激素暴露導致受器去敏感化歸為同一類機制：受器數量對「持續高濃度暴露」的反應是下調，不是上調。
    terms:
    - androgen-receptor
    numbers:
    - v: 1
      unit: 小時
      of: Ratamess 研究中 6 組深蹲課表造成 AR 顯著下調所需的運動後時間
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.receptor-mechanisms.i02
    - ch11.anabolic-steroids.i04
    locator: Endocrine Responses and Adaptations to Anaerobic Training > Hormone Receptor Changes
- id: fiber-type-transitions
  title: 肌纖維轉型 Fiber Type Transitions
  desc: ''
  tag: Fiber Type
  items:
  - id: ch05.fiber-type-transitions.i01
    q: 纖維類型連續體與轉型方向
    a:
    - 肌纖維理論上位於一個氧化能力連續體上：I、Ic、IIc、IIac、IIa、IIax、IIx，各自對應 MHC I、IIa、IIx 的表現量
    - Type I／II 大比例由遺傳決定，但各亞型之間會隨訓練轉型
    - 高閾值運動單位被活化後，訓練誘發的方向是 IIx → IIax → IIa（氧化能力提高）
    detail: 這條區分了「大類型（I vs II）由遺傳決定、訓練改不了」與「亞型（IIx/IIax/IIa 之間）會隨訓練轉型」——兩者常被混為一談，但書中明確只有後者是可訓練的。
    terms:
    - mhc
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch01.fiber-types.type-iia
    - ch01.fiber-types.type-iix
    locator: Muscular Adaptations > Fiber Type Transitions
  - id: ch05.fiber-type-transitions.i02
    q: Staron 研究：轉型速度與幅度
    a:
    - Staron 等人的研究：多組深蹲／腿推／膝伸展，採 6–12RM 負荷、組間休息 2 分鐘，每週 2 次共 8 週
    - 女性訓練 2 週（4 次訓練）後 IIx 比例即顯著下降，男性則在 4 週（8 次訓練）後才出現顯著下降
    - 整個 8 週課程中，兩性 IIx 比例皆從約 18% 降至約 7%，MHC 分析顯示 IIx MHC 被 IIa MHC 取代
    detail: 女性比男性更快出現顯著轉型，是這個研究少數明確報告的性別差異之一；但兩性最終的轉型幅度（18%→7%）相同，代表訓練終點是收斂的，只是抵達速度不同。
    terms:
    - mhc
    numbers:
    - v: 18-7
      unit: "%"
      of: Staron 研究 8 週課程中 IIx 纖維比例的下降區間（起點約 18%，終點約 7%）
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch01.fiber-types.type-iia
    - ch06.chronic-muscular.i04
    locator: Muscular Adaptations > Fiber Type Transitions
  - id: ch05.fiber-type-transitions.i03
    q: 荷爾蒙交互作用與去訓練反轉
    a:
    - Staron 研究同時發現，睾固酮與皮質醇濃度的變化與肌纖維類型改變相關
    - 去訓練造成相反效果：IIx 比例上升、IIa 比例下降
    - 去訓練後 IIx 比例可能出現「overshoot」，高於原本訓練前的水準
    detail: overshoot 現象提醒訓練與去訓練不是單純鏡像對稱——停止訓練後纖維組成不只是「退回原點」，某些情況下會超調到比訓練前更偏向 IIx 的狀態。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch05.detraining.i06
    - ch04.testosterone.i08
    locator: Muscular Adaptations > Fiber Type Transitions
  - id: ch05.fiber-type-transitions.i04
    q: Type I ↔ Type II 轉換的可能性
    a:
    - Type I 與 Type II 之間的直接轉換看似不太可能，主因是兩者 MHC 同型異構物與氧化酵素含量差異太大
    - 目前證據不足以確認或排除這種轉換是否可能發生
    detail: 書中對此保持開放但保守的立場——不是斷言「不可能」，而是說「證據不足」，並提出馬拉松選手做重阻力訓練、健力選手做長期有氧訓練這類極端情境仍待未來研究釐清。
    terms:
    - mhc
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch01.fiber-types.type-i
    - ch01.fiber-types.type-iix
    locator: Muscular Adaptations > Fiber Type Transitions
  - id: ch05.fiber-type-transitions.i05
    q: 阻力＋有氧併用的轉型效果
    a:
    - 高強度阻力訓練結合有氧耐力訓練，研究顯示可誘發近乎完全的 IIx → IIa 轉型
    detail: 這是全章唯一報告「近乎完全轉型」的訓練組合，代表結合兩種訓練刺激的效果大於單獨進行阻力訓練，但書中未進一步說明機轉細節。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch06.chronic-muscular.i04
    - ch20.special-issues.i05
    locator: Muscular Adaptations > Fiber Type Transitions
  - id: ch05.fiber-type-transitions.i06
    q: 結構與建築性改變：羽狀角與肌束長度
    a:
    - 羽狀肌的肌束以斜角附著於肌腱，羽狀角越大越能容納更多蛋白質沉積、允許 CSA 增加更多
    - 阻力訓練會增加羽狀角，力量型運動員的肱三頭肌與股外側肌羽狀角大於未訓練者
    - 力量型運動員的肌束長度也較長；短跑選手的腓腸肌與股外側肌肌束長度長於長跑選手
    - 阻力＋衝刺＋跳躍併用可增加股直肌肌束長度；衝刺＋跳躍可增加股外側肌肌束長度
    detail: 羽狀角與肌束長度是兩個獨立但常一起討論的建築參數——羽狀角影響出力與 CSA 容納空間，肌束長度則與收縮速度和活動範圍有關，這也是短跑選手與長跑選手肌肉外觀差異的結構基礎。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch01.muscle-structure.fiber-dimensions
    - ch19.neuromuscular-basis.i05
    locator: Muscular Adaptations > Structural and Architectural Changes
  - id: ch05.fiber-type-transitions.i07
    q: 衝刺訓練與鈣離子釋放
    a:
    - 衝刺訓練已被證實可強化鈣離子釋放
    - 鈣離子釋放增加有助於促進 actin/myosin 橋接形成，進而提升速度與爆發力表現
    detail: 這條把「結構性改變」（羽狀角、肌束長度）之外的另一種訓練適應獨立出來——鈣離子釋放是興奮收縮偶聯層級的功能性改變，不是肌肉外觀或體積的變化。
    terms:
    - actin
    - myosin
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch01.muscle-structure.sr-ttubule
    - ch19.neuromuscular-basis.i01
    locator: Muscular Adaptations > Other Muscular Adaptations
  - id: ch05.fiber-type-transitions.i08
    q: 酸鹼緩衝能力提升
    a:
    - 無氧運動使肌肉與血液 pH 大幅下降；持續訓練誘發的酸鹼變化可提升緩衝能力
    - 緩衝能力提升讓運動員更能耐受氫離子堆積，延緩疲勞、提升肌耐力
    - 超過乳酸閾值的高強度間歇訓練（衝刺、飛輪）可使緩衝能力提升 16% 至 38%
    - 無氧團隊運動選手的緩衝能力高於耐力型選手與未訓練者
    detail: 緩衝能力是無氧訓練特有的代謝適應，與有氧耐力訓練追求的粒線體／微血管適應方向不同，兩者甚至可能互相拮抗——這也是本章後段「有氧無氧相容性」議題的伏筆。
    terms:
    - lactate-threshold
    numbers:
    - v: 16-38
      unit: "%"
      of: 超過乳酸閾值的高強度間歇訓練後緩衝能力的提升幅度區間
    concepts:
    - adaptation
    - energy-supply
    related:
    - ch03.lactate.i02
    - ch11.muscle-buffering.i01
    locator: Muscular Adaptations > Other Muscular Adaptations
- id: hypertrophy
  title: 肌肉生長 Muscular Hypertrophy
  desc: ''
  tag: Hypertrophy
  items:
  - id: ch05.hypertrophy.i01
    q: 肥大的生物機轉：淨蛋白增生
    a:
    - 肌纖維橫截面積（CSA）擴大來自 myofibril 內 actin/myosin 淨累積（合成增加、分解減少，或兩者兼具）
    - myofibril 數量本身也增加
    - titin、nebulin 等結構蛋白依肌絲變化比例同步合成，新肌絲附加在 myofibril 周邊使其直徑增加
    detail: 「淨累積」是關鍵字——肥大不只是合成變多，分解減少同樣算數；兩者的相對比例決定淨效果，這也是為何恢復期營養與休息會直接影響肥大幅度。
    terms:
    - myofibril
    - myosin
    - actin
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch09.protein.i03
    - ch04.receptor-mechanisms.i07
    locator: Muscular Adaptations > Muscular Growth
  - id: ch05.hypertrophy.i02
    q: Akt/mTOR 路徑與肌生成訊號
    a:
    - 機械負荷（不依賴激素濃度）獨立激活 Akt/mTOR、AMPK、MAPK 三條訊號路徑，其中 Akt/mTOR 對阻力訓練適應的調控最直接
    - 肌纖維收縮時 Akt/mTOR 訊號大幅上升，驅動肌蛋白合成與肌生成（myogenesis）
    - 同時抑制性生長因子 myostatin 表現下調，兩者共同促成合成大於分解
    - 急性阻力運動後蛋白合成率上升，維持長達 48 小時
    detail: 這說明肥大訊號早在肌肉「看起來變大」之前就已啟動——機械形變本身（不靠激素）就足以觸發 Akt/mTOR，這也是為何肥大反應與急性合成激素反應是兩條可分開討論但會交互作用的機制。
    terms:
    - mtor
    - myostatin
    numbers:
    - v: 48
      unit: 小時
      of: 急性阻力運動後肌蛋白合成率維持上升的時間
    concepts:
    - adaptation
    - structure
    related:
    - ch04.receptor-mechanisms.i07
    - ch11.anabolic-supplements.i05
    locator: Muscular Adaptations > Muscular Growth
  - id: ch05.hypertrophy.i03
    q: EIMD：運動誘發肌肉損傷與修復
    a:
    - 高強度無氧訓練造成 myofibril 與肌節結構的破壞（EIMD），被認為會改變基因表現以強化組織、預防再損傷
    - 蛋白合成順序依序是（a）水分攝入、（b）非收縮性蛋白合成、（c）收縮性蛋白合成
    - 發炎反應與蛋白轉換增加共同促成長期肥大適應
    detail: 這條解釋為何「痠痛」與「肥大」常被連結——EIMD 觸發的修復重塑過程本身就是肥大訊號鏈的一部分，但痠痛程度不等於肥大幅度，兩者是相關的獨立現象。
    terms:
    - eimd
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch22.inflammatory-phase.i01
    - ch22.fibroblastic-phase.i01
    locator: Muscular Adaptations > Muscular Growth
  - id: ch05.hypertrophy.i04
    q: 機械刺激 vs 代謝刺激：兩條肥大路徑
    a:
    - 機械因子：重負荷、離心收縮、低至中訓練量，是力量訓練的特徵，促成最佳的肌纖維徵召、生長因子表現與肌節破壞
    - 代謝因子：低至中或中高強度、高訓練量、短休息，是健美式訓練的特徵，會刺激糖解系統累積代謝物，並引出最強的合成激素反應
    - 快縮肌蛋白（fast myosin heavy chain）的類型轉換在數次訓練內即開始，但 CSA 要顯著改變需 16 次以上訓練
    detail: 兩條路徑不是互斥選項，而是「肥大的最佳化」需要週期化整合兩種刺激；純機械或純代謝都各自解釋不了健美選手與力量選手不同的肥大特徵。
    terms: []
    numbers:
    - v: 16
      unit: 次
      of: 阻力訓練後肌纖維 CSA 出現顯著變化所需的最少訓練次數
    concepts:
    - adaptation
    - program-design
    related:
    - ch17.training-volume.i05
    - ch17.rest-periods.i03
    locator: Muscular Adaptations > Muscular Growth
  - id: ch05.hypertrophy.i05
    q: Hyperplasia：肌纖維數量增加的爭議
    a:
    - Hyperplasia 指高強度阻力訓練誘發肌纖維縱向分裂、使肌纖維數量增加
    - 動物模型已確認發生，但人體研究結果矛盾，部分支持、部分反對，爭議未解
    - 部分爭議源於訓練者與未訓練者的橫斷面比較無法排除遺傳差異
    - 即使人體確實發生，估計也僅佔受刺激組織不到 10%，不被視為主要肥大機制
    detail: 人體研究之所以難有定論，是因為動物研究可整條肌肉取出縱切分析，人體只能用針刺切片做橫切面推算，方法本身的解析力就不足以確認縱裂是否發生。
    terms:
    - hyperplasia
    numbers:
    - v: 10
      unit: "%"
      of: 若人體確實發生 hyperplasia，估計佔受刺激組織的上限比例
    concepts:
    - adaptation
    - structure
    related:
    - ch01.muscle-structure.fiber-dimensions
    - ch05.hypertrophy.i01
    locator: Muscular Adaptations > Muscular Growth
  - id: ch05.hypertrophy.i06
    q: Type II 纖維肥大幅度較大
    a:
    - 阻力訓練後 Type II 纖維的 CSA 增幅通常大於 Type I 纖維
    - 依大小原則，高閾值運動單位（多為 Type II）需先被徵召才能啟動肥大訊號
    - 運動員先天快縮纖維比例越高，肌肉量成長的潛力理論上越大
    detail: 這條把大小原則與肥大幅度連起來——不是「快縮纖維本身更會長」的獨立特性，而是快縮纖維需要更高徵召門檻才啟動訊號，一旦啟動其增生反應就比慢縮纖維更明顯。
    terms:
    - size-principle
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch01.fiber-types.recruitment-order
    - ch01.fiber-types.type-iix
    locator: Muscular Adaptations > Fiber Size Changes
  - id: ch05.hypertrophy.i07
    q: 粒線體與微血管密度相對下降
    a:
    - 重阻力訓練會降低粒線體密度；粒線體實際數量維持不變或略增，但因 CSA 增幅不成比例，單位體積的密度反而下降
    - 微血管密度以相同機制下降，但每條纖維的微血管數量其實略有增加
    - 舉重／健力選手的微血管密度明顯低於對照組，健美選手則與非運動員相近
    detail: 「密度下降」容易被誤讀成微血管或粒線體變少，實際上是分母（CSA）長得比分子快造成的稀釋效果——這也解釋為何純力量取向訓練者的有氧能力表現往往較弱，並非組織真的退化。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch06.chronic-muscular.i01
    - ch06.chronic-cardiovascular.i06
    locator: Muscular Adaptations > Other Muscular Adaptations
  - id: ch05.hypertrophy.i08
    q: 高能磷酸與肝糖超補償
    a:
    - ATP、CP 在反覆高強度間歇收縮後耗竭，其儲存容量會透過「超補償」效應增加
    - MacDougall 等人的研究：5 個月阻力訓練（3–5 組 × 8–10 下，組間休息 2 分鐘）後，靜態 CP 增加 28%、ATP 增加 18%
    - 同一研究中肝糖含量最多增加 112%，顯示強調無氧糖解的健美式課表對肝糖儲存也是強力刺激
    detail: 超補償效應說明高能磷酸系統本身也會「訓練適應」——不是只有肌肉大小或神經徵召在變，能量受質儲存容量的擴大同樣是肥大訓練累積數月後才顯現的長期效果。
    terms: []
    numbers:
    - v: 28
      unit: "%"
      of: 5 個月阻力訓練後靜態肌酸磷酸（CP）濃度的增加幅度
    - v: 18
      unit: "%"
      of: 同一研究中靜態 ATP 濃度的增加幅度
    - v: 112
      unit: "%"
      of: 同一研究中肌肝糖含量的最大增加幅度
    concepts:
    - adaptation
    - energy-supply
    related:
    - ch03.substrate.i07
    - ch10.post-competition.i01
    locator: Muscular Adaptations > Other Muscular Adaptations
- id: neural-adaptations
  title: 神經適應 Neural Adaptations
  desc: ''
  tag: Neural
  items:
  - id: ch05.neural-adaptations.i01
    q: 中樞驅動：未訓練者的徵召天花板
    a:
    - 未訓練者在最大自主收縮時，平均只能徵召約 71% 的肌肉
    - 阻力訓練提高大腦運動皮質的驅動輸出，經皮質脊髓徑傳遞，讓更大比例的肌肉可被徵召
    detail: 這是神經適應能在「肌肉大小還沒變」之前就先讓力量上升的原因——未訓練者留有徵召餘裕，訓練初期的力量增益主要來自把這段餘裕榨出來，而不是肌肥大。
    terms:
    - rate-coding
    numbers:
    - v: 71
      unit: "%"
