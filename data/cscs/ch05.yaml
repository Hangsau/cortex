  - id: ch05.neural-adaptations.i02
    q: 大小原則（Size Principle）
    a:
    - 運動單位依運動神經元大小由小到大依序徵召
    - 小運動單位（慢縮）閾值低，先被徵召；大運動單位（快縮）閾值高，需更大出力需求才被徵召
    detail: 這條原則說明為何低強度動作很難主動徵召快縮纖維——不是不能，是徵召順序把快縮排在後面，得先把小單位的力量榨盡、需求持續升高，快縮單位才會加入。
    terms:
    - size-principle
    - motor-unit
    numbers: []
    concepts:
    - adaptation
    - motor-control
    related:
    - ch01.fiber-types.recruitment-order
    - ch01.neuromuscular.unit-size
    locator: Neural Adaptations to Anaerobic Training > Motor Unit Recruitment, Firing Rate, and Synchronization
  - id: ch05.neural-adaptations.i03
    q: 選擇性徵召：彈道式動作的例外
    a:
    - 爆發性、彈道式動作（如奧林匹克舉重、增強式訓練、衝刺）可不依大小原則順序，優先徵召快縮運動單位
    - 這類選擇性徵召常發生在動作時間極短的情境，例如反向動作到起跳僅約 0.4 秒的跳躍
    detail: 選擇性徵召的意義是：訓練若只做慢速、低強度動作，就算做到力竭也不會誘發這種例外徵召模式；要練出快縮優先徵召的能力，需要動作本身具備爆發性/時間壓力。
    terms:
    - selective-recruitment
    numbers:
    - v: 0.4
      unit: 秒
      of: 誘發選擇性徵召快縮運動單位的反向動作到起跳最大時間窗
    concepts:
    - adaptation
    - motor-control
    related:
    - ch18.mechanical-models.i04
    - ch19.neuromuscular-basis.i01
    locator: Neural Adaptations to Anaerobic Training > Motor Unit Recruitment, Firing Rate, and Synchronization
  - id: ch05.neural-adaptations.i04
    q: 發火率與同步化：依肌肉大小分工
    a:
    - 提高運動神經元發火率（rate coding）讓單一運動單位的收縮疊加、產生更大力
    - 對小肌肉而言，發火率的貢獻比徵召更重要；對大肌肉而言，徵召更多運動單位的貢獻比發火率更重要
    - 多個運動單位同步發火（synchronization）可讓力量上升得更快、峰值更高
    detail: 這條把「發火率 vs 徵召」的相對重要性綁進肌肉大小——大肌肉本身運動單位數量多，靠多徵召幾個就能大幅增加力量；小肌肉運動單位少，能榨的主要是讓既有單位發得更快。
    terms:
    - rate-coding
    - motor-unit
    numbers: []
    concepts:
    - adaptation
    - motor-control
    related:
    - ch01.neuromuscular.rate-coding
    - ch19.rfd-impulse.i01
    locator: Neural Adaptations to Anaerobic Training > Motor Unit Recruitment, Firing Rate, and Synchronization
  - id: ch05.neural-adaptations.i05
    q: 神經肌肉接合處（NMJ）適應
    a:
    - Deschenes 等人的大鼠比目魚肌研究：高強度跑步機訓練使 NMJ 突觸面積增加，且突觸型態變得更分散、更不規則，效果大於低強度訓練
    - 人類研究：7 週阻力訓練後，運動終板（motor end plate）的周長與面積增加，乙醯膽鹼受體的分散範圍也擴大
    detail: 突觸面積擴大與受體分散範圍增加，代表神經衝動能更有效、更同步地傳遞給肌肉纖維，是神經適應中發生在「神經與肌肉交界處」而非大腦端的部分。
    terms:
    - neuromuscular-junction
    - motor-end-plate
    numbers:
    - v: 7
      unit: 週
      of: 人類研究中觀察到運動終板周長／面積與受體分散範圍增加所需的阻力訓練時間
    concepts:
    - adaptation
    - motor-control
    related:
    - ch01.neuromuscular.nmj
    - ch07.children-training-response.i07
    locator: Neural Adaptations to Anaerobic Training > Neuromuscular Junction Adaptations
  - id: ch05.neural-adaptations.i06
    q: 反射增益（reflex potentiation）
    a:
    - 阻力訓練可使反射性肌肉活化增益提升 19–55%
    - 舉重選手與健美選手的比目魚肌反射電位高於未訓練者
    detail: 反射增益是本體感覺回饋迴路的訓練效果——肌梭偵測到牽張時，引發的反射性收縮變得更強，代表脊髓層級的興奮性也隨阻力訓練提高，不只是大腦端的驅動增加。
    terms:
    - muscle-spindle
    numbers:
    - v: 19-55
      unit: "%"
      of: 阻力訓練後反射性肌肉活化增益的提升幅度
    concepts:
    - adaptation
