    - fiber-type
    related: []
    locator: ''
  - id: ch05.fiber-type-transitions.i02
    q: 轉型速度
    a:
    - 女性 2 週（4 次訓練）、男性 4 週即見顯著 IIx 減少
    - 8 週後 IIx 從 18% → 7%
    detail: ''
    terms: []
    numbers: []
    concepts:
