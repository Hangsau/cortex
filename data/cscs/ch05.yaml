    related:
    - ch01.proprioception.stretch-reflex
    - ch18.ssc.i06
    locator: Neural Adaptations to Anaerobic Training > Reflex Potentiation
  - id: ch05.neural-adaptations.i07
    q: 交叉教育效應（Cross-Education）
    a:
    - 單側肢體訓練可使對側（未訓練）肢體的肌力提升，最多達 22%，平均約 8%
    - 對側肢體的肌電圖（EMG）活性同步增加，顯示效應源自中樞神經適應而非肌肉本身
    detail: 交叉教育效應是神經適應「不需要肌肉受訓練」也能發生力量提升的直接證據——訓練效果透過中樞神經系統擴散到對側未受刺激的肢體，支持神經驅動先於肌肉結構改變的整體論述。
    terms:
    - cross-education
    numbers:
    - v: 22
      unit: "%"
      of: 單側訓練後對側肢體肌力提升的最大觀察值（平均約 8%）
    concepts:
    - adaptation
    - motor-control
    related:
    - ch22.resistance-training-systems.i07
    - ch01.neuromuscular.recruitment
    locator: Neural Adaptations to Anaerobic Training > Cross-Education
  - id: ch05.neural-adaptations.i08
    q: 拮抗肌協同收縮的調整
    a:
    - 阻力訓練降低拮抗肌的過度協同收縮，讓淨力輸出提高，而不需增加主動肌徵召
    - 雙側肢體同時出力時常出現「雙側缺失」（bilateral deficit），訓練後此缺失會減少，甚至轉為雙側促進（bilateral facilitation）
    - 衝刺與增強式訓練改變的是拮抗肌協同收縮的時機，而非單純降低其量；彈道式或不熟悉的動作反而可能增加拮抗肌活性以維持關節穩定
    detail: 協同收縮的調整不是單向「越少越好」——降低過度協同收縮能提升淨力輸出，但特定情境（不熟悉動作、需要關節穩定）下適度的拮抗肌活性是保護機制，訓練效果是讓時機與量都更貼合動作需求。
    terms: []
    numbers: []
    concepts:
    - adaptation
    - motor-control
    related:
    - ch07.aging-musculoskeletal.i06
    - ch19.agility-cod.i05
    locator: Neural Adaptations to Anaerobic Training > Coactivation of Agonist and Antagonist Muscle Groups
- id: overtraining
  title: 過度訓練 Overtraining
  desc: ''
  tag: Overtraining
  items:
  - id: ch05.overtraining.i01
    q: 過度訓練連續體：從急性疲勞到 OTS
    a:
    - 訓練目標是提供漸進式超負荷以誘發生理適應；但超負荷若未搭配足夠的恢復、休息與營養攝取，會累積訓練壓力，導致極度疲勞、疾病或傷害
    - 這種訓練壓力的累積若造成長期表現下降（可能伴隨也可能不伴隨生理與心理徵象），即稱為過度訓練
    - 依恢復所需時間可分四階段：急性疲勞（數天）→ 功能性過度撐 FOR（數天至數週）→ 非功能性過度撐 NFOR（數週至數月）→ 過度訓練症候群 OTS（數月至數年）
    - 過度訓練的程度不同，表現恢復可能需數週到數月不等
    detail: 這個連續體的重點是「過度撐」本身不是壞事——它是課表設計中刻意使用的短期超負荷工具，真正的問題出在恢復管理失當，導致短期反應演變成長期症候群
    terms: []
    numbers: []
    concepts:
    - adaptation
    - periodization
    related:
    - ch21.gas-theory.i03
    - ch06.overtraining.i01
    locator: Overtraining
  - id: ch05.overtraining.i02
    q: FOR（功能性過度撐）：計畫性短期策略
    a:
    - 運動員進行超額訓練造成短期表現下降時，稱為過度撐或功能性過度撐（FOR）
    - 通常數天至數週的休息即可恢復，因此 FOR 可作為許多訓練計畫中刻意安排的階段
    - 策略邏輯：先超量訓練壓低表現、建立耐受度，再減量（tapering），誘發「超補償」
    - 短期過度撐搭配適當減量期，已證實能帶來肌力與爆發力增益
    - 若管理不當，FOR 也可能產生不利效果
    detail: FOR 之所以能被刻意排進課表，關鍵在於它是連續體裡唯一可控、可預期恢復時程的階段——這也是它與 NFOR/OTS 最根本的差異：不是「有沒有超負荷」，而是「恢復是否在計畫內」
    terms:
    - overreaching
    numbers: []
    concepts:
    - adaptation
    - periodization
    related:
    - ch21.gas-theory.i02
    - ch21.fitness-fatigue.i02
    locator: Overtraining
  - id: ch05.overtraining.i03
    q: NFOR 與 OTS：停滯、慢性適應不良與職業生涯風險
    a:
    - 訓練刺激持續加強卻缺乏足夠恢復與再生時，運動員會演變成極端過度撐，即非功能性過度撐（NFOR）
    - NFOR 導致表現停滯或下降，且會持續數週至數月
    - 運動員未妥善拿捏訓練與恢復平衡時，最先出現的徵象是表現下降、疲勞增加、活力下降與荷爾蒙紊亂
    - 這些徵象出現時，NFOR 與過度訓練症候群（OTS）已難以區分；OTS 的核心定義是運動員本身及多個生理、神經化學與荷爾蒙調節機制的「長期適應不良」
    - OTS 也有多個替代名稱：burnout（倦怠）、慢性過勞、staleness、unexplained underperformance syndrome（不明原因表現不佳症候群）、overfatigue
    - OTS 可持續六個月以上，最壞情況足以終結運動生涯
    detail: NFOR 與 OTS 之間沒有清楚的判定線——書中直接承認兩者「難以區分」，這也是為什麼過度訓練的診斷長期依賴表現下降這種落後指標，而不是某個單一生化切點
    terms:
    - nonfunctional-overreaching
    - overtraining-syndrome
    numbers:
    - v: 6
      unit: 個月以上
      of: OTS 持續時間下限
    concepts:
    - adaptation
    - periodization
    related:
    - ch06.overtraining.i02
    - ch21.gas-theory.i06
    locator: Overtraining
  - id: ch05.overtraining.i04
    q: OTS 兩型：交感型與副交感型
    a:
    - 交感型 OTS：靜息時交感神經活性上升
    - 副交感型 OTS：靜息與運動時副交感神經活性都上升
    - 交感型通常先於副交感型發展，好發於訓練速度或力量的年輕運動員
    - 所有過度訓練狀態最終都會走向副交感型，伴隨全身多數生理系統的長期抑制
    - 因為反彈（rebound）是可能的，難以精確判定過度訓練何時轉為慢性；部分運動員對過度撐策略反應正向，對另一些人則可能成為誘發 OTS 的導火線
    detail: 兩型會「先交感、後副交感」依序發展，而不是二選一的分類——這代表交感型症狀出現時，若未介入處理，理論上就是朝副交感型（更難逆轉的終局狀態）前進的早期警訊
    terms: []
    numbers: []
    concepts:
    - adaptation
    - periodization
    related:
    - ch06.overtraining.i04
    - ch08.arousal-anxiety-stress.i06
    locator: Overtraining
  - id: ch05.overtraining.i05
    q: 無氧過度訓練的理論發展階段（表 5.3）
    a:
    - 急性疲勞（數天）：表現無影響或提升；神經功能改變
    - FOR（數天至數週）：表現暫時下降後回到基準；運動單位徵召改變；交感活性與下視丘控制改變
    - NFOR（數週至數月）：表現停滯或下降；運動協調下降；興奮收縮偶聯改變；肌肉肝醣下降；靜息心率與血壓上升；免疫功能改變；荷爾蒙濃度改變；情緒紊亂
    - OTS（數月至數年）：表現下降；力量產生下降；醣解能力下降；疾病與感染；情緒與睡眠紊亂
    detail: 此表整理自 Fry 等人 1993 年與 Meeusen 等人 2013 年的研究，說明過度訓練不只是單一系統的問題，而是神經、肌肉、代謝、心血管、免疫、內分泌與心理多系統隨階段依序惡化
    terms: []
    numbers: []
    concepts:
    - adaptation
    - periodization
    - measurement
    related:
    - ch21.fitness-fatigue.i01
    - ch21.sfra-theory.i01
    locator: Overtraining
  - id: ch05.overtraining.i06
    q: 無氧過度訓練實證：77% 統計與兩項 Fry 研究
    a:
    - 過度訓練研究多以耐力型運動員為對象，但一項調查顯示 77% 受調過度訓練者同時從事需要高度肌力、速度或協調的運動
    - 無氧型（交感型）過度訓練的症狀與有氧耐力型（副交感型）不同
    - Fry 等人研究一：8 組機械深蹲、95% 1RM、連續 6 天 → 等速力矩、衝刺時間、敏捷時間等呈現非特定性下降，但 1RM 肌力維持不變
    - Fry 等人研究二：10 組 1RM 深蹲、連續 7 天（中間休息一天）→ 73% 受試者 1RM 顯著下降超過 9.9 磅（4.5 公斤）；部分受試者仍持續進步、未進入 NFOR 狀態
    - 這顯示過度撐或過度訓練症狀的發生時程高度取決於個體反應、訓練狀態與基因稟賦
    detail: 兩項 Fry 研究的對照很關鍵——同樣是深蹲高負荷，研究一（95%1RM×8組×6天）只造成非特定性表現下降但 1RM 維持，研究二（1RM×10組×7天）卻讓多數人 1RM 顯著下降，顯示「強度是否達到 1RM 本身」比單純堆疊組數更決定是否誘發 NFOR
    terms: []
    numbers:
    - v: 77
      unit: '%'
      of: 過度訓練調查受訪者中同時從事高肌力/速度/協調型運動的比例
    - v: 9.9
      unit: 磅（4.5 公斤）
      of: Fry 第二項研究中 73% 受試者 1RM 顯著下降的幅度
    - v: 73
      unit: '%'
      of: Fry 第二項研究中 1RM 顯著下降的受試者比例
    concepts:
    - adaptation
    - measurement
    related:
    - ch13.max-strength.i01
    - ch13.agility-speed.i06
    locator: Overtraining
  - id: ch05.overtraining.i07
    q: OTS 判定清單與常見課程設計錯誤
    a:
    - 目前沒有明確的早期判定工具，教練與運動員需以表現下降作為過度訓練徵兆的佐證，可考量以下五類指標
    - 症狀：不明原因表現不佳、持續疲勞、自覺費力度升高、睡眠紊亂、食慾下降
    - 表現與生命徵象：最大測試、專項表現測試或生命徵象（心率、血壓）比先前測試或基準值差
    - 課程設計錯誤：訓練量顯著增加（<5%）、訓練強度顯著增加、訓練單調性、比賽次數或頻率過高
    - 干擾因子：心理徵象（POMS 惡化、RPE 高於正常）、社會因素（家庭、感情、財務、工作、教練、團隊）、近期或跨多時區旅行
    - 排除項：潛在疾病、貧血、感染性疾病、肌肉損傷（肌酸激酶偏高）、內分泌疾病、重度飲食疾患、生物指標異常（C 反應蛋白、肌酸酐、肌鐵蛋白下降）、骨骼肌傷害、心臟症狀、成人型氣喘、過敏
    - 沒有單一指標可視為即將發生 OTS 的判定依據；應規律監測表現、生理、生化、免疫與心理等多變項組合
    - 高動機運動員最常見的錯誤課程設計組合：高訓練量 + 重負荷 + 高訓練頻率 + 恢復時間不足；漸進超負荷速率過快也會提高風險
    detail: 這份清單本質上是排除法，不是判定法——沒有任何一項單獨出現就能斷定 OTS，教材也明講「沒有單一指標可視為判定依據」；「訓練量顯著增加（<5%）」這個數值教材原文如此，語意本身含糊，實務上應理解為「監測到量的變動」的提示，而非精確切點
    terms:
    - poms
    - creatine-kinase
    numbers:
    - v: 5
      unit: '%'
      of: 判定清單中「訓練量顯著增加」項目所附數值（教材原文如此）
    concepts:
    - adaptation
    - periodization
    - measurement
    related:
    - ch12.why-test.i04
    - ch08.arousal-anxiety-stress.i07
    locator: Overtraining > What Are the Markers of Anaerobic Overtraining?
  - id: ch05.overtraining.i08
    q: 荷爾蒙標記與心理因素
    a:
    - 靜息血漿睪固酮/皮質醇比值曾被視為過度訓練指標，會隨運動強度與時間下降；但現已證實它只反映訓練的實際生理負荷，不能作為診斷依據
    - 量型過度訓練（volume-related）已證實會使皮質醇上升，並使靜息 LH、總睪固酮與游離睪固酮下降
    - 強度型過度訓練（intensity-related）則不會改變靜息荷爾蒙濃度；Fry 等人的研究（10 組 1RM 深蹲、每天、連續兩週）並未觀察到睪固酮、游離睪固酮、皮質醇或生長激素的變化
    - Meeusen 等人發現運動員的訓練狀態會影響下視丘─腦下垂體反應性：高度訓練者初期對 NFOR 呈現放大的敏感交感激素反應，隨後轉為循環荷爾蒙濃度受抑制，反映腦下垂體敏感度下降與長期腦下垂體耗竭
    - 內分泌指標需要一週以上的監測才具參考價值；能及早偵測 NFOR 的生物指標，才最有助於預防 OTS
    - 心理層面：以情緒狀態量表（POMS）測得的情緒紊亂與心理徵象長年被認為與 OTS 相關；重度阻力訓練伴隨活力、動機與自信下降，緊張、憂鬱、憤怒、疲憊、混亂、焦慮與易怒升高，以及注意力減損
    - 心理層面的改變也與內分泌變化相關；許多運動員能藉由心理徵象察覺過度訓練，且這些徵象常先於實際表現下降出現
    detail: 量型與強度型過度訓練的荷爾蒙訊號不同，代表單看「有沒有荷爾蒙變化」不足以判斷是否過度訓練——強度型的 Fry 研究連續兩週操到 1RM 都測不出荷爾蒙變化，說明荷爾蒙指標本身不夠敏感；這也是為什麼教材把重點放回心理徵象（POMS）：它常先於表現下降出現，反而是更早的預警訊號
