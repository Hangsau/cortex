cards:
- q: 無氧訓練後，神經驅動增強的三個主要機制是什麼？
  a: ①激動肌徵召↑ ②發火率↑ ③同步化↑（加上：拮抗肌抑制↓）
  tag: Neural
- q: Size Principle（大小原則）的定義？
  a: 運動單位依閾值由小到大依序徵召；低閾值（Type I）先，高閾值（Type II）後
  tag: Neural
- q: 「選擇性徵召」在什麼情境下發生？為什麼重要？
  a: 爆發/彈道式動作（奧舉、增強式）可跳過低閾值直接徵召高閾值；確保在<0.4秒內產生最大爆發力
  tag: Neural
- q: Cross-Education 是什麼？數字為何？
  a: 單側訓練使對側未訓練肌力↑；最多22%，平均約8%；源自中樞神經適應
  tag: Neural
- q: 神經肌肉接合處（NMJ）在阻力訓練後的適應有哪些？
  a: 突觸面積↑、神經末梢分支↑、乙醯膽鹼受體分散範圍↑ → 傳導效率↑
  tag: Neural
- q: 訓練早期（6-10週）和後期（>10週）分別以哪種適應為主？
  a: 早期：神經適應為主（協調、徵召改善）；後期：肌肉肥大貢獻增加；肥大停滯後需新刺激再啟動神經適應
  tag: Neural
- q: Bilateral deficit 是什麼？訓練後如何改變？
  a: 雙側同時收縮力量＜兩側單獨收縮之和；訓練後deficit縮小，甚至出現bilateral facilitation（雙側增強）
  tag: Neural
- q: 阻力訓練後拮抗肌共同收縮如何改變？意義是什麼？
  a: 訓練後過多的拮抗肌共同收縮↓ → 淨力輸出↑；但一定程度共收縮仍保護關節穩定
  tag: Neural
- q: 肌肉肥大的分子機制——Akt/mTOR 通路的作用？
  a: 機械負荷激活Akt/mTOR → 蛋白質合成↑（myogenesis）；同時myostatin（抑制因子）下調
  tag: Hypertrophy
- q: 急性阻力訓練後蛋白質合成速率升高可持續多久？
  a: 最多持續48小時
  tag: Hypertrophy
- q: 肌纖維CSA顯著增加至少需要多少次訓練？
  a: 超過16次訓練後才開始出現明顯CSA變化
  tag: Hypertrophy
- q: 運動誘發肌肉損傷（EIMD）如何促進肥大？
  a: 結構破壞影響基因表現 → 修復/重塑過程（發炎反應+蛋白質周轉↑）→ 長期肥大適應
  tag: Hypertrophy
- q: Hyperplasia（肌纖維增生）在人類是否確定存在？
  a: 動物實驗有支持；人類證據有爭議，若存在也＜10%，非主要適應機制
  tag: Hypertrophy
- q: 機械因素 vs 代謝因素各對應哪種訓練方式促進肥大？
  a: 機械：大重量+離心+低中容量（力量訓練）；代謝：中低強度+高容量+短休息（健美訓練）
  tag: Hypertrophy
- q: 阻力訓練5個月後，ATP和CP靜息濃度分別增加多少？糖原呢？
  a: CP增加28%、ATP增加18%；糖原可增加高達112%（MacDougall et al.）
  tag: Hypertrophy
- q: 無氧訓練後肌纖維類型的轉換方向是什麼？
  a: IIx → IIax → IIa（更具氧化性）；I/II整體比例基因決定，但亞型間可轉換
  tag: Fiber Types
- q: 高強度阻力訓練8週後，IIx纖維比例如何變化？（Staron et al.）
  a: 從約18%降至約7%；男性在第4週（8次訓練）、女性在第2週（4次訓練）即出現顯著下降
  tag: Fiber Types
- q: 去訓練後肌纖維類型如何變化？
  a: IIx比例↑、IIa↓；甚至可能超射（IIx比訓練前更高）
  tag: Fiber Types
- q: 肌纖維羽角（pennation angle）如何因訓練改變？有何意義？
  a: 阻力訓練後↑；更大羽角可容納更多蛋白質沉積、增加CSA；力量訓練者triceps/vastus lateralis羽角大於未訓練者
  tag: Fiber Types
- q: Type II vs Type I 纖維對肥大的反應差異？
  a: Type II肥大幅度大於Type I；高比例IIx纖維的運動員理論上有更大增肌潛能
  tag: Fiber Types
- q: 緩衝能力（buffering capacity）在高強度訓練後如何改變？
  a: 高強度間歇訓練（超過乳酸閾值）可提升16-38%；使運動員更耐受H⁺積累、延遲疲勞
  tag: Fiber Types
- q: 骨骼對機械負荷的初始反應機制是什麼？
  a: 成骨細胞遷移到受力區 → 分泌膠原蛋白 → 礦化為磷酸鈣（hydroxyapatite）→ 主要在骨外膜（periosteum）增厚
  tag: Connective Tissue
- q: MES（最小必要應變）的定義及與骨折的關係？
  a: 觸發新骨形成的最低應變閾值；約為骨折所需力量的1/10；持續超過MES → 骨骼增厚
  tag: Connective Tissue
- q: 促進骨密度（BMD）增加的訓練設計原則有哪些？
  a: ①特異性負荷 ②多關節結構性動作 ③漸進超負荷 ④訓練變化（改變力向）⑤總次數30-35即足夠
  tag: Connective Tissue
- q: 深蹲 vs 腿舉機對骨密度的影響差異為何？
  a: 深蹲對股骨大轉子BMD增加更有效（Cussler et al.）；機械輔助動作由器械支撐體重，骨骼受力↓
  tag: Connective Tissue
- q: 阻力訓練後肌腱的結構變化有哪些？
  a: ①膠原纖維直徑↑ ②共價交聯↑ ③膠原纖維數↑ ④填充密度↑ → 整體張力承受能力↑
  tag: Connective Tissue
- q: 肌腱僵硬度（tendon stiffness）需要多大負荷才能提升？
  a: 需要80%1RM（Kubo et al.：8週後增加15-19%）；20%1RM無顯著效果
  tag: Connective Tissue
- q: 軟骨的營養供應特點及對訓練的含義？
  a: 軟骨無血管，靠滑液擴散；關節活動產生壓力變化幫助養分擴散；固定（immobilization）→ 軟骨萎縮
  tag: Connective Tissue
- q: 皮質骨 vs 骨小梁（trabecular）對機械刺激的反應速度差異？
  a: 骨小梁密度低、表面積大 → 反應更快；皮質骨密實 → 適應較慢
  tag: Connective Tissue
- q: 急性阻力訓練後，哪些激素升高？持續多久？
  a: 睾固酮、生長激素（多種分子型）、皮質醇；男性可維持30分鐘以上
  tag: Endocrine
- q: 何種訓練設計最能刺激急性合成代謝激素反應？
  a: 大肌群多關節動作 + 中高強度/容量 + 短休息（30-60秒）→ 最高血乳酸 = 最強GH/皮質醇反應
  tag: Endocrine
- q: 慢性阻力訓練後靜息激素濃度是否會長期改變？為什麼？
  a: 通常不會持久改變；運動後短暫升高已足以刺激受器重塑；長期高濃度反而使受器下調（如II型糖尿病胰島素抵抗）
  tag: Endocrine
- q: 雄激素受器（AR）在阻力訓練後如何變化？
  a: 訓練後48-72小時內upregulate；高容量訓練後1小時先downregulate再upregulate；蛋白+碳水補充可減輕downregulation
  tag: Endocrine
- q: IGF-I 和 mechano growth factor 的主要差異？
  a: IGF-I依賴GH（延遲反應）；Mechano growth factor對骨骼肌機械負荷立即反應，不依賴GH
  tag: Endocrine
- q: 兒茶酚胺（Catecholamines）在無氧訓練中的主要作用？
  a: 調節力量產生、肌肉收縮率、能量可用性；增強其他激素（如睾固酮）效果；反映急性訓練需求強度
  tag: Endocrine
- q: 高強度腿推（95%1RM）可產生的最大血壓和心率為何？
  a: 血壓峰值可達320/250 mmHg；心率約170次/分（Macdougall et al.）
  tag: Cardiovascular
- q: 為什麼重阻力訓練時血流向肌肉的輸送反而減少？
  a: 肌肉收縮超過20%MVC時夾壓毛細血管 → 局部缺血；休息時reactive hyperemia補償；缺血刺激也促進肌肉生長
  tag: Cardiovascular
- q: 阻力訓練對靜息血壓的長期影響（meta-analysis數據）？
  a: 系統性與舒張壓各下降2-4%；初始血壓偏高者效果最顯著
  tag: Cardiovascular
- q: Valsalva 手法如何影響心輸出量和每搏量？
  a: 胸腔內壓↑ → 靜脈回流↓ → 舒張末期容積↓ → 向心期心輸出量↓；離心期或組間休息後心輸出量反而升高
  tag: Cardiovascular
- q: 重阻力訓練 vs 高容量短休息訓練對心臟結構的差異？
  a: 重阻力：左心室壁增厚、室腔大小不變；高容量（健美式）：左右心室絕對體積↑（類似有氧訓練效果）
  tag: Cardiovascular
- q: 通氣速率在阻力訓練中的特徵？
  a: 訓練中顯著升高；恢復第1分鐘更高；短休息（30秒-1分）產生最大通氣升高；可達>60 L/min
  tag: Cardiovascular
- q: 長期阻力訓練後，同等絕對負荷下心臟反應如何改變？
  a: 心率、血壓、double product的急性升高被鈍化（blunted）；左心室後負荷↓、心肌耗氧↓
  tag: Cardiovascular
- q: 同時進行力量+有氧訓練對爆發力的影響？
  a: 爆發力比最大力量更容易受到干擾（interference effect）；同時訓練組的rate of force development增幅＜純力量組
  tag: Program Design
- q: 高強度有氧+阻力同時訓練的不相容效應（interference effect）在什麼條件下最明顯？
  a: 每週6天（交替）高強度訓練；同日訓練（每週3天有完整休息日）往往不顯著不相容
  tag: Program Design
- q: 肌肉耐力訓練後的主要肌肉纖維和代謝適應？
  a: IIx→IIa；粒線體↑、毛細血管↑、緩衝能力↑、抗疲勞性↑、代謝酶活性↑
  tag: Program Design
- q: 各動作峰值功率輸出對應的最佳負荷？
  a: Jump squat：0%1RM（體重）；訓練好的爆發力運動員squat 30-60%1RM；Power clean 80%1RM；Ballistic bench press throw 46-62%1RM
  tag: Program Design
- q: 不同訓練程度者的最大肌力增幅（文獻綜述）？
  a: 未訓練↑40%、中度訓練↑20%、訓練者↑16%、進階↑10%、精英↑2%（>100個研究）
  tag: Program Design
- q: FOR / NFOR / OTS 三者的時間軸和主要差別？
  a: FOR（功能性過度訓練）：天~週，計畫性，tapering後超補償；NFOR：週~月，停滯+多系統異常；OTS：月~年，長期表現下降
  tag: Overtraining
- q: 交感型 vs 副交感型 OTS 的差異？
  a: 交感型：靜息交感活性↑（速度/力量型年輕運動員先出現）；副交感型：靜息副交感↑，所有OTS最終走向副交感型
  tag: Overtraining
- q: 量型（volume）和強度型（intensity）過度訓練在激素上的差別？
  a: 量型：皮質醇↑、LH↓、靜息T↓；強度型：靜息激素多無顯著變化
  tag: Overtraining
- q: 去訓練（Detraining）後肌力可維持多久？最多流失多少？
  a: 一般可維持4週；8-12週流失7-12%力量；高訓練者快縮纖維CSA在14天內↓6.4%；不太會低於訓練前基準值
  tag: Detraining
- q: 去訓練後哪類肌纖維先萎縮？長期影響如何？
  a: 快縮纖維（Type IIa/IIx）先萎縮；慢縮纖維影響較慢；7個月後所有纖維類型平均萎縮37%
  tag: Detraining
