- id: fiber-type-transitions
  title: 肌纖維轉型 Fiber Type Transitions
  desc: ''
  tag: Fiber Type
  items:
  - id: ch05.fiber-type-transitions.i01
    q: 轉型方向
    a:
    - 無氧訓練：IIx → IIax → IIa（更有氧化能力）
    - 去訓練反向：IIa → IIx
    detail: ''
