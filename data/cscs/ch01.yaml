- id: neuromuscular
  title: 神經肌肉系統 Neuromuscular
  desc: 運動單位 · 全有全無律 · 單收縮到強直 · 力量分級兩途徑
  tag: Neuromuscular
  items:
  - id: ch01.neuromuscular.motor-unit
    q: 運動單位的定義
    a:
    - 一個運動神經元，加上它所支配的全部肌纖維
    - 同一個運動單位內的肌纖維類型完全相同
    detail: 「類型相同」這件事很關鍵：神經元決定了它底下纖維的性格，所以纖維類型不是纖維自己的屬性，而是神經支配的結果。這也是為什麼改變神經支配可以改變纖維類型。
    terms:
    - motor-unit
    - motor-neuron
    - muscle-fiber
    numbers: []
    concepts:
    - motor-control
    - structure
    related:
    - ch01.neuromuscular.all-or-none
    - ch01.fiber-types.recruitment-order
    locator: 第 1 章 · Neuromuscular System
  - id: ch01.neuromuscular.nmj
    q: 訊號怎麼從神經傳到肌肉
    a:
    - 動作電位抵達神經末梢
    - 末梢釋出乙醯膽鹼，擴散過突觸間隙
    - 乙醯膽鹼在肌膜上引發新的動作電位
    - 動作電位沿肌膜與橫小管傳遍整條纖維
    detail: 神經與肌肉並沒有實體相連，中間隔著一道間隙，訊號必須從電轉成化學再轉回電。這道化學轉換就是許多藥物與毒素（例如箭毒、肉毒桿菌毒素）的作用點。
    terms:
    - neuromuscular-junction
    - acetylcholine
    - action-potential
    - motor-end-plate
    - sarcolemma
    numbers: []
    concepts:
    - motor-control
    - force-production
    related:
    - ch01.muscle-structure.sr-ttubule
    - ch01.sliding-filament.crossbridge-formation
    locator: 第 1 章 · Neuromuscular System
  - id: ch01.neuromuscular.all-or-none
    q: 全有全無律是什麼
    a:
    - 運動單位一旦被刺激，其下所有肌纖維同時完全收縮
    - 把刺激加大，並不會讓單次收縮變得更強
    detail: 這條律說的是「單一運動單位」的行為，不是整塊肌肉。整塊肌肉當然能出不同大小的力——那是靠改變參與的運動單位數量與放電頻率做到的，不是靠讓每個單位用力一點。
    terms:
    - all-or-none
    - motor-unit
    numbers: []
    concepts:
    - motor-control
    - force-production
    related:
    - ch01.neuromuscular.recruitment
    - ch01.neuromuscular.rate-coding
    locator: 第 1 章 · Neuromuscular System
  - id: ch01.neuromuscular.twitch
    q: 單收縮是什麼
    a:
    - 單一動作電位引發的一次短暫力量峰值
    - 鈣離子在力量達到峰值前就已經開始被泵回肌漿網
    detail: 鈣「提早收回」是後面強直收縮的關鍵前提：因為一次刺激的鈣訊號來不及讓所有橫橋都動起來就退場，單收縮的力量遠低於該運動單位的能力上限。
    terms:
    - twitch
    - action-potential
    - sarcoplasmic-reticulum
    numbers: []
    concepts:
    - motor-control
    - force-production
    related:
    - ch01.neuromuscular.tetanus
    locator: 第 1 章 · Neuromuscular System
  - id: ch01.neuromuscular.tetanus
    q: 從單收縮到強直收縮怎麼疊上去
    a:
    - 提高刺激頻率，前一次還沒放鬆完下一次就來，力量疊加
    - 頻率再高會進入不完全強直，力量曲線仍有起伏
    - 頻率高到起伏消失就是完全強直，這是該運動單位的最大力量
    detail: 疊加之所以成立，是因為鈣還沒被完全收回、下一波又來了，肌漿內鈣濃度維持在高點，橫橋能持續循環。這是「同一個運動單位也能出不同力量」的唯一機制。
    terms:
    - tetanus
    - twitch
    numbers: []
    concepts:
    - motor-control
    - force-production
    related:
    - ch01.neuromuscular.twitch
    - ch01.neuromuscular.rate-coding
    locator: 第 1 章 · Neuromuscular System
  - id: ch01.neuromuscular.rate-coding
    q: 力量分級途徑一：頻率調節
    a:
    - 提高同一批運動單位的放電頻率
    - 小肌肉主要靠這條路
    detail: 眼外肌、手部小肌肉這類運動單位總數少的肌肉，能徵召的單位很快就用完，所以只能靠加快放電來繼續增加力量。
    terms:
    - rate-coding
    - motor-unit
    numbers: []
    concepts:
    - motor-control
    - force-production
    related:
    - ch01.neuromuscular.recruitment
    - ch01.neuromuscular.unit-size
    locator: 第 1 章 · Neuromuscular System
  - id: ch01.neuromuscular.recruitment
    q: 力量分級途徑二：運動單位徵召
    a:
    - 啟動更多運動單位參與
    - 大肌肉主要靠這條路，例如股四頭肌
    detail: 大肌肉底下有成千上百個運動單位可以陸續加入，所以徵召的空間遠大於加快頻率。這也是重量訓練提升力量的主要神經機制之一——訓練初期力量進步但肌肉沒變大，多半發生在這一層。
    terms:
    - recruitment
    - motor-unit
    numbers: []
    concepts:
    - motor-control
    - force-production
    - adaptation
    related:
    - ch01.neuromuscular.rate-coding
    - ch01.fiber-types.improve-force
    locator: 第 1 章 · Neuromuscular System
  - id: ch01.neuromuscular.unit-size
    q: 運動單位的大小如何決定精確度
    a:
    - 眼部肌肉：一個神經元大約只管一條纖維
    - 股四頭肌：一個神經元管數百條纖維
    detail: 神經元管的纖維越少，能做的力量微調越細——眼球要瞄準，代價是力量小。股四頭肌相反，一個訊號就啟動數百條纖維，力量大但無法做精細調節。精確度與力量在同一個結構參數上互斥。
    terms:
    - motor-unit
    - motor-neuron
    numbers:
    - v: 約 1
      unit: 條纖維 / 神經元
      of: 眼部肌肉的運動單位大小
    - v: 數百
      unit: 條纖維 / 神經元
      of: 股四頭肌的運動單位大小
    concepts:
