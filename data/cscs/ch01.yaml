  - id: ch01.proprioception.gto-location
    q: 高爾基肌腱器長在哪裡
    a:
    - 位於肌腱靠近肌腱接合處的位置
    - 與梭外纖維串聯排列
    detail: 串聯與肌梭的平行是決定性的差別：串聯代表肌肉出的力全部經過它，所以它讀到的是張力而不是長度。位置決定了功能，這一組對照值得記牢。
    terms:
    - gto
    - myotendinous-junction
    - extrafusal-fiber
    numbers: []
    concepts:
    - reflex
    - structure
    related:
    - ch01.proprioception.gto-function
    - ch01.proprioception.spindle
    locator: 第 1 章 · Proprioceptors
  - id: ch01.proprioception.gto-function
    q: 高爾基肌腱器怎麼運作
    a:
    - 張力升高時高爾基肌腱器被激活
    - 訊號經抑制性中間神經元
    - 支配該肌肉的運動神經元被抑制
    - 肌肉放鬆，張力下降
    detail: 它與肌梭的方向相反：肌梭促進收縮，它抑制收縮。存在的理由是保護——避免張力大到扯斷肌腱或撕裂肌肉。代價是它會在真正的力量上限之前就先踩煞車。
    terms:
    - gto
    - inhibitory-interneuron
    - motor-neuron
    numbers: []
    concepts:
    - reflex
    - force-production
    related:
    - ch01.proprioception.gto-adaptation
    - ch01.proprioception.spindle-vs-gto
    locator: 第 1 章 · Proprioceptors
  - id: ch01.proprioception.spindle-vs-gto
    q: 肌梭與高爾基肌腱器的對照
    a:
    - 肌梭：偵測長度，促進收縮
    - 高爾基肌腱器：偵測張力，抑制收縮
    - 兩者排列方式也相反，肌梭平行、高爾基肌腱器串聯
    detail: 三個維度（測什麼／作用方向／排列方式）一起記，比分開背可靠。它們是同一套安全系統的兩端：一個確保肌肉被拉長時立刻補上張力，一個確保張力不會高到出事。
    terms:
    - muscle-spindle
    - gto
    numbers: []
    concepts:
    - reflex
    - measurement
    related:
    - ch01.proprioception.stretch-reflex
    - ch01.proprioception.gto-function
    locator: 第 1 章 · Proprioceptors
  - id: ch01.proprioception.gto-adaptation
    q: 長期重量訓練如何改變高爾基肌腱器的作用
    a:
    - 大腦運動皮質能逐漸壓過高爾基肌腱器的抑制
    - 抑制減弱後可動用的力量增加
    - 這是最基本的神經適應之一
    detail: 訓練初期力量進步遠快於肌肉變大，這是原因之一：不是肌肉變強了，是原本被安全機制擋住的部分被釋放出來。也因此，這種進步依賴持續訓練維持，不像肌肥大那樣結構性。
    terms:
    - gto
    - cns
    numbers: []
    concepts:
    - adaptation
    - reflex
    - motor-control
    related:
    - ch01.proprioception.gto-function
    - ch01.neuromuscular.recruitment
    locator: 第 1 章 · Proprioceptors
  - id: ch01.proprioception.intrafusal
    q: 梭內纖維與梭外纖維的差別
    a:
    - 梭內纖維：肌梭內部經過改良的肌纖維，負責感測
    - 梭外纖維：一般的肌纖維，負責產生力量
    detail: 字面就是「梭之內」與「梭之外」。梭內纖維也會收縮，但目的是調整肌梭本身的敏感度，讓它在肌肉不同長度下都保持可用，而不是對外出力。
