    - ch01.neuromuscular.motor-unit
    locator: 第 1 章 · Neuromuscular System
- id: fiber-types
  title: 肌纖維類型 Fiber Types
  desc: Type I / IIa / IIx · 徵召順序 · 專項分布 · 分型方法
  tag: Fiber Types
  items:
  - id: ch01.fiber-types.type-i
    q: Type I 慢縮肌纖維的特徵
    a:
    - 運動神經元小、徵召閾值低
    - 收縮與放鬆速度慢
    - 抗疲勞能力高，有氧酵素多
    - 微血管密度高、肌紅蛋白多，外觀偏紅
    - 纖維直徑較細
    detail: 把這些特徵串成一句話：它是為了「長時間反覆使用」設計的。低閾值代表它最先被叫醒，高有氧能力與密集微血管代表它能持續拿氧氣做事——所以維持姿勢這種整天都在做的工作交給它。
    terms:
    - slow-twitch
    - motor-neuron
    - capillary
    numbers: []
    concepts:
    - fiber-type
    - energy-supply
    related:
    - ch01.fiber-types.type-iix
    - ch01.fiber-types.postural-vs-power
    locator: 第 1 章 · Muscle Fiber Types
  - id: ch01.fiber-types.type-iix
    q: Type IIx 快縮肌纖維的特徵
    a:
    - 運動神經元大、徵召閾值高
    - 收縮速度快
    - 容易疲勞，無氧酵素多
    - 微血管密度低、肌紅蛋白少，外觀偏白
    - 纖維直徑較粗，爆發力最強
    detail: 它是 Type I 的鏡像：高閾值代表平常叫不動，要夠大的努力才會參與；粗大加上快速收縮讓它輸出功率最高，但沒有氧氣支援系統，所以只能撐很短的時間。
    terms:
    - fast-twitch
    - motor-neuron
    numbers: []
    concepts:
    - fiber-type
    - energy-supply
    - force-production
    related:
    - ch01.fiber-types.type-i
    - ch01.fiber-types.recruitment-order
    locator: 第 1 章 · Muscle Fiber Types
  - id: ch01.fiber-types.type-iia
    q: Type IIa 與 Type IIx 差在哪
    a:
    - Type IIa 的有氧代謝能力高於 IIx
    - 微血管數量較多
    - 抗疲勞能力中等，介於 Type I 與 IIx 之間
    detail: IIa 是中間型：保有快縮的速度，又補上一部分有氧能力。拳擊、摔角這種「高強度但要撐好幾回合」的項目最依賴它。訓練也會讓 IIx 往 IIa 轉變，所以它同時是最容易被訓練改變的一群。
    terms:
    - fast-twitch
    - capillary
    numbers: []
    concepts:
    - fiber-type
    - adaptation
    - energy-supply
    related:
    - ch01.fiber-types.type-iix
    - ch01.fiber-types.sport-distribution
    locator: 第 1 章 · Muscle Fiber Types
  - id: ch01.fiber-types.recruitment-order
    q: 肌纖維被徵召的順序
    a:
    - 低強度：先用 Type I
    - 中強度：加入 Type IIa
    - 高強度或爆發性動作：再加入 Type IIx
    detail: 順序由運動神經元的大小決定（小的先被激發），不是由動作意圖決定。實務推論很直接：想練到 Type IIx，只能靠夠大的負荷或夠快的動作速度把徵召推到頂——輕重量慢慢做，再多下也叫不動它。
    terms:
    - recruitment
    - motor-neuron
    - motor-unit
    numbers: []
    concepts:
    - fiber-type
    - motor-control
    related:
    - ch01.neuromuscular.recruitment
    - ch01.fiber-types.improve-force
    locator: 第 1 章 · Muscle Fiber Types
  - id: ch01.fiber-types.sport-distribution
    q: 不同專項的纖維類型分布
    a:
    - 100 公尺衝刺：Type II 比例高
    - 馬拉松：Type I 比例高
    - 足球、籃球：Type I 與 Type II 都需要
    detail: 分布同時反映天賦與訓練後的表型。要注意因果不能反推——不能因為某人 Type I 多就斷定他不適合爆發項目，訓練狀態、技術與體型都在影響表現。
    terms:
    - slow-twitch
    - fast-twitch
    numbers: []
    concepts:
    - fiber-type
    - measurement
    related:
    - ch01.fiber-types.postural-vs-power
    - ch01.fiber-types.type-iia
    locator: 第 1 章 · Muscle Fiber Types
  - id: ch01.fiber-types.postural-vs-power
    q: 姿勢肌與動力肌的纖維差異
    a:
    - 比目魚肌屬姿勢肌，Type I 比例高
    - 股四頭肌屬混合，Type I 與 Type II 都多
    detail: 比目魚肌整天都在對抗重力維持站姿，需要的是永遠不累而不是爆發，所以 Type I 佔優。這組對照說明纖維分布是跟著肌肉的日常工作內容走的。
    terms:
    - slow-twitch
    numbers: []
    concepts:
    - fiber-type
    - structure
    related:
    - ch01.fiber-types.type-i
    - ch01.fiber-types.sport-distribution
    locator: 第 1 章 · Muscle Fiber Types
  - id: ch01.fiber-types.classification-method
    q: 怎麼判定一條纖維是哪一型
    a:
    - 常用做法是肌凝蛋白 ATP 水解酶染色，看深淺分型
    - 更精確的做法是定量肌凝蛋白重鏈
    detail: 兩種方法測的東西不同：染色看的是酵素活性（快慢縮的功能差異來源），定量重鏈看的是蛋白質亞型本身。後者能分辨出染色看不出的混合型纖維，所以研究文獻多半採用它。
    terms:
    - myosin-atpase
    - mhc
    numbers: []
    concepts:
    - measurement
    - fiber-type
    related:
    - ch01.fiber-types.type-iia
    locator: 第 1 章 · Muscle Fiber Types
  - id: ch01.fiber-types.improve-force
    q: 要提高力量輸出，可以動哪些變項
    a:
    - 用大負荷訓練改善神經徵召
    - 增加肌肉橫截面積，讓可用橫橋總數變多
    - 採用多關節爆發性動作
    detail: 這三條分別對應前面三個機制：徵召（神經層）、橫橋數量（結構層）、以及高閾值纖維的參與（動作速度層）。所以它不是三個並列的建議，而是同一個力量方程式的三個入口。
    terms:
    - recruitment
    - crossbridge
    numbers: []
    concepts:
    - adaptation
    - force-production
    - motor-control
    related:
    - ch01.sliding-filament.force-determinant
    - ch01.fiber-types.recruitment-order
    locator: 第 1 章 · Muscle Fiber Types
- id: proprioception
  title: 本體感覺器 Proprioception
  desc: 肌梭 · 高爾基肌腱器 · 牽張反射 · 反射性抑制
  tag: Proprioception
  items:
  - id: ch01.proprioception.definition
    q: 本體感覺受器是什麼
    a:
    - 位於關節、肌肉、肌腱的特化感覺受器
    - 偵測壓力與張力的變化
    - 把動覺資訊送回中樞神經系統
    detail: 動覺指的是「不用看也知道身體各部位在哪裡」的那種感知。閉眼摸鼻子做得到，靠的就是這套受器——它是所有動作控制與技術學習的輸入端。
    terms:
    - proprioceptor
    - kinesthetic-sense
    - cns
    numbers: []
    concepts:
    - reflex
    - motor-control
    related:
    - ch01.proprioception.spindle
    - ch01.proprioception.gto-function
    locator: 第 1 章 · Proprioceptors
  - id: ch01.proprioception.spindle
    q: 肌梭偵測什麼
    a:
    - 與梭外纖維平行排列
    - 偵測肌肉長度，以及長度改變的速率
    detail: 平行排列是關鍵：肌肉被拉長時肌梭跟著被拉長，所以它讀得到長度。「速率」這一項解釋了為什麼快速下放比慢速下放更能引出反射——反射強度跟拉長的速度有關，不只跟拉多長有關。
    terms:
    - muscle-spindle
    - extrafusal-fiber
    - intrafusal-fiber
    numbers: []
    concepts:
    - reflex
    - structure
    related:
    - ch01.proprioception.stretch-reflex
    - ch01.proprioception.gto-location
    locator: 第 1 章 · Proprioceptors
  - id: ch01.proprioception.stretch-reflex
    q: 牽張反射的迴路
    a:
    - 肌肉被拉長
    - 肌梭被激活，訊號進脊髓
    - 脊髓直接驅動運動神經元
    - 同一條肌肉反射性收縮
    detail: 訊號不必上到大腦就折返，所以極快——膝跳反射就是這條迴路。它在訓練上的直接應用是增強式訓練：落地時的快速拉長引出反射性收縮，疊加在自主用力之上。
    terms:
    - muscle-spindle
