id: ch01
weight: 1
title: Ch.1 Structure and Function of Body Systems
topics:
- id: skeleton
  title: 骨骼系統 Skeleton
  desc: 軸心／附肢骨骼 · 三類關節 · 脊椎區段 · 槓桿
  tag: Skeleton
  items:
  - id: ch01.skeleton.axial
    q: 軸心骨骼包含哪些骨頭
    a:
    - 頭顱
    - 脊椎（從第一頸椎到尾骨）
    - 肋骨與胸骨
    detail: 軸心骨骼是身體的中軸，功能偏保護與支撐（腦、脊髓、心肺都被它包起來）。全身 206 塊骨頭中約 80 塊屬於這裡。
    terms:
    - axial-skeleton
    - vertebral-column
    numbers:
    - v: 約 80
      unit: 塊
      of: 軸心骨骼的骨頭數
    concepts:
    - structure
    related:
    - ch01.skeleton.appendicular
    - ch01.skeleton.vertebral-segments
    locator: 第 1 章 · The Skeletal System
  - id: ch01.skeleton.appendicular
    q: 附肢骨骼包含哪些骨頭
    a:
    - 肩帶：肩胛骨與鎖骨
    - 上肢
    - 骨盆帶
    - 下肢
    detail: 附肢骨骼是「掛在中軸上的部分」，功能偏產生動作。約 126 塊，加上軸心骨骼的 80 塊，成人全身共 206 塊。
    terms:
    - appendicular-skeleton
    numbers:
    - v: 約 126
      unit: 塊
      of: 附肢骨骼的骨頭數
    - v: '206'
      unit: 塊
      of: 成人全身骨頭總數
    concepts:
    - structure
    related:
    - ch01.skeleton.axial
    locator: 第 1 章 · The Skeletal System
  - id: ch01.skeleton.fibrous-joint
    q: 纖維關節是什麼
    a:
    - 骨與骨之間以纖維結締組織直接相連
    - 幾乎不能動
    - 典型例子是頭顱的顱縫
    detail: 三類關節照活動度排序，纖維關節在最不能動的一端。它存在的理由就是「不要動」——顱縫若能活動，腦就失去剛性保護。
    terms:
    - fibrous-joint
    numbers: []
    concepts:
    - structure
    - measurement
    related:
    - ch01.skeleton.cartilaginous-joint
    - ch01.skeleton.synovial-joint
    locator: 第 1 章 · Joints
  - id: ch01.skeleton.cartilaginous-joint
    q: 軟骨關節是什麼
    a:
    - 骨與骨之間以軟骨相連
    - 可小幅活動
    - 典型例子是椎間盤
    detail: 介於纖維關節與滑液關節之間。單一椎間盤能動的幅度很小，但整條脊椎二十多節累加起來，就成為可觀的活動範圍——這是理解脊椎為何「節節都不大動、整體卻很靈活」的關鍵。
    terms:
    - cartilaginous-joint
    - vertebral-column
    numbers: []
    concepts:
    - structure
    - measurement
    related:
    - ch01.skeleton.fibrous-joint
    - ch01.skeleton.vertebral-segments
    locator: 第 1 章 · Joints
  - id: ch01.skeleton.synovial-joint
    q: 滑液關節為什麼活動度最大
    a:
    - 關節面覆有透明軟骨，摩擦極低
    - 關節囊內充滿滑液潤滑
    - 靠韌帶與軟骨提供穩定，而不是靠骨頭卡住
    detail: 運動訓練中幾乎所有動作都發生在滑液關節。它把「穩定」的工作外包給韌帶與肌肉，換來活動度——所以這類關節的傷害風險也最高，訓練上要同時顧活動度與主動穩定。
    terms:
    - synovial-joint
    - hyaline-cartilage
    - synovial-fluid
    numbers: []
    concepts:
    - structure
    related:
    - ch01.skeleton.joint-axes
    - ch01.skeleton.fibrous-joint
    locator: 第 1 章 · Joints
  - id: ch01.skeleton.joint-axes
    q: 單軸、雙軸、多軸關節怎麼分
    a:
    - 單軸：只繞一個軸轉，例如肘
    - 雙軸：可繞兩個互相垂直的軸轉，例如踝、腕
    - 多軸：可繞空間三個軸轉，例如肩、髖
    detail: 分類看的是「可繞幾個軸旋轉」，不是「感覺能動多少」。這個軸數直接決定動作選擇：多軸關節需要更多方向的訓練涵蓋，單軸關節則要留意鄰近關節代償。
    terms:
    - uniaxial-joint
    - biaxial-joint
    - multiaxial-joint
    numbers: []
    concepts:
    - structure
    - measurement
    related:
    - ch01.skeleton.synovial-joint
    locator: 第 1 章 · Joints
  - id: ch01.skeleton.vertebral-segments
    q: 脊椎各區段各有幾節
    a:
    - 頸椎 Cervical 7 節
    - 胸椎 Thoracic 12 節
    - 腰椎 Lumbar 5 節
    - 薦椎 Sacral 5 節（成年後融合成一塊）
    - 尾椎 Coccygeal 3 到 5 節（融合）
    detail: 編號慣例是 C1–C7、T1–T12、L1–L5，訓練與臨床文獻談「L4/L5 椎間盤」時就是用這套。薦椎與尾椎融合，所以脊椎「可動的」實際上是上面 24 節。
    terms:
    - vertebral-column
    numbers:
    - v: '7'
      unit: 節
      of: 頸椎
    - v: '12'
      unit: 節
      of: 胸椎
    - v: '5'
      unit: 節
      of: 腰椎
    - v: '5'
      unit: 節
      of: 薦椎（融合）
    - v: 3–5
      unit: 節
      of: 尾椎（融合）
    concepts:
    - structure
    - normal-values
    related:
    - ch01.skeleton.axial
    - ch01.skeleton.cartilaginous-joint
    locator: 第 1 章 · The Skeletal System
  - id: ch01.skeleton.lever-system
    q: 為什麼肌肉必須透過骨骼才能推東西
    a:
    - 肌肉只能拉，不能推
    - 骨頭當槓桿、關節當支點，把拉力轉成各種方向的動作
    - 肌腱把肌肉的張力傳到骨膜
    detail: 臥推看起來是「把槓鈴推出去」，但胸肌本身做的只是把肱骨拉向身體中線；推的動作是槓桿系統轉換出來的結果。這個觀念是後面所有生物力學章節的前提。
    terms:
    - periosteum
    numbers: []
    concepts:
    - structure
    - force-production
    related:
    - ch01.muscle-structure.epimysium
    - ch01.skeleton.synovial-joint
    locator: 第 1 章 · The Skeletal System
  - id: ch01.skeleton.bone-adaptation
    q: 阻力訓練怎麼改變骨骼
    a:
    - 重負荷會提高骨密度與骨礦物質含量
    - 高衝擊的爆發性動作有類似效果
    - 骨骼的適應速度比肌肉慢，刺激要持續變化
    detail: 骨頭是活組織，會照承受的負荷重塑。但它的改建週期以月為單位，遠慢於肌肉的數週——所以短期看不到骨密度變化不代表沒效，反過來說也不能用「肌力進步了」推論骨骼已經跟上。
    terms: []
    numbers: []
    concepts:
    - adaptation
    related:
    - ch01.skeleton.lever-system
    locator: 第 1 章 · The Skeletal System
- id: muscle-structure
  title: 肌肉結構 Muscle Structure
  desc: 三層結締組織 · 肌纖維 · 肌節與肌絲 · 橫小管與肌漿網
  tag: Muscle Structure
  items:
  - id: ch01.muscle-structure.epimysium
    q: 肌外膜在哪一層
    a:
    - 包住整塊肌肉的最外層纖維結締組織
    - 兩端與肌腱連續
    detail: 三層膜是同一套結締組織連續體的三個層級：肌外膜包全肌、肌束膜包肌束、肌內膜包單條纖維，最後全部匯進肌腱。所以肌纖維產生的張力不必逐條找路，會沿著這個網絡整體傳到骨頭。
    terms:
    - epimysium
    numbers: []
    concepts:
    - structure
    - force-production
    related:
    - ch01.muscle-structure.perimysium
    - ch01.muscle-structure.endomysium
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.perimysium
    q: 肌束膜包住的是什麼
    a:
    - 包住一束肌纖維，這一束叫肌束
    - 每束最多約 150 條肌纖維
    detail: 肉眼在生牛排上看到的「肉紋」就是肌束。肌束膜同時是血管與神經進入肌肉內部的通道。
    terms:
    - perimysium
    - fasciculus
    numbers:
    - v: 最多 150
      unit: 條
      of: 每個肌束內的肌纖維數
    concepts:
    - structure
    related:
    - ch01.muscle-structure.epimysium
    - ch01.muscle-structure.endomysium
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.endomysium
    q: 肌內膜包住的是什麼
    a:
    - 包住單一條肌纖維
    - 與該纖維的肌膜連續
    detail: 這是三層裡最內的一層，緊貼細胞膜。因為它與肌膜連續，單條纖維收縮的力量一離開細胞就已經在結締組織網絡上。
    terms:
    - endomysium
    - sarcolemma
    numbers: []
    concepts:
    - structure
    related:
    - ch01.muscle-structure.perimysium
    - ch01.muscle-structure.fiber-dimensions
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.fiber-dimensions
    q: 一條肌纖維長什麼樣
    a:
    - 直徑約 50 到 100 微米，大約一根頭髮的粗細
    - 多核，細胞核推在細胞周邊
    - 外觀有橫紋
    - 細胞質稱為肌漿，內含肌原纖維與粒線體
    detail: 肌纖維是少數多核的細胞——它由多個肌母細胞融合而成，所以一條纖維裡有很多核，各自負責鄰近區段的蛋白質合成。核被擠在細胞周邊，是因為中央空間全給了肌原纖維。
    terms:
    - muscle-fiber
    - sarcoplasm
    - myofibril
    - sarcolemma
    numbers:
    - v: 50–100
      unit: μm（微米）
      of: 肌纖維直徑
    concepts:
    - structure
    related:
    - ch01.muscle-structure.sarcomere
    - ch01.muscle-structure.endomysium
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.sarcomere
    q: 肌節是什麼，靜息時多長
    a:
    - 骨骼肌最小的收縮單位
    - 兩端以 Z 線為界
    - 靜息長度約 2.5 微米，一公分肌原纖維上串著約 4,500 個
    detail: 「最小收縮單位」的意思是：整塊肌肉縮短，其實是幾千個肌節各縮短一點點的總和。理解這點就知道為什麼肌肉能縮短很大幅度——每個肌節只要縮短不到一微米，串聯起來就很可觀。
    terms:
    - sarcomere
    - z-line
    - myofibril
    numbers:
    - v: 約 2.5
      unit: μm（微米）
      of: 肌節靜息長度
    - v: 約 4,500
      unit: 個 / 公分
      of: 肌原纖維上串聯的肌節數
    concepts:
    - structure
    - force-production
    related:
    - ch01.muscle-structure.bands
    - ch01.sliding-filament.band-changes
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.myosin
    q: 粗絲肌凝蛋白的構造
    a:
    - 直徑約 16 奈米
    - 由球形頭、鉸鏈點、纖維尾三段組成
    - 球形頭是能與細絲形成橫橋的部位
    - 一條粗絲最多含約 200 個肌凝蛋白分子
    detail: 球形頭同時是機械臂與酵素——它自己就有分解 ATP 的活性。鉸鏈點讓頭能彎折，這一彎就是動力衝程。
    terms:
    - myosin
    - myofilament
    - crossbridge
    - myosin-atpase
    numbers:
    - v: 約 16
      unit: nm（奈米）
      of: 粗絲直徑
    - v: 最多約 200
      unit: 個
      of: 每條粗絲含的肌凝蛋白分子數
    concepts:
    - structure
    - force-production
    related:
    - ch01.muscle-structure.actin
    - ch01.sliding-filament.power-stroke
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.actin
    q: 細絲肌動蛋白的構造
    a:
    - 直徑約 6 奈米，是粗絲的三分之一左右
    - 兩股呈雙螺旋纏繞
    - 上面附著旋光素（與鈣結合）與原肌凝蛋白（遮住結合位點）
    detail: 細絲上有兩個管制蛋白，是整條收縮鏈的開關所在。靜息時原肌凝蛋白蓋住肌凝蛋白頭要接的位置，所以就算 ATP 充足也接不上——收縮不是缺能量而是被鎖住。
    terms:
    - actin
    - troponin
    - tropomyosin
    - myofilament
    numbers:
    - v: 約 6
      unit: nm（奈米）
      of: 細絲直徑
    concepts:
    - structure
    - force-production
    related:
    - ch01.muscle-structure.myosin
    - ch01.sliding-filament.crossbridge-formation
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.bands
    q: A 帶、I 帶、H 區、Z 線、M 線各是什麼
    a:
    - A 帶：粗絲所在的區段，含與細絲重疊的部分
    - I 帶：只有細絲的區段
    - H 區：肌節中央只有粗絲的區段
    - Z 線：肌節邊界，細絲固定於此
    - M 線：肌節中央固定相鄰粗絲的構造
    detail: 這些名字全都是顯微鏡下明暗條紋的描述，不是不同的物質。記法：A 帶 = 有粗絲的地方（長度等於粗絲長度，永遠不變）；I 帶與 H 區都是「沒有重疊」的空隙，所以收縮時兩者都縮小。
    terms:
    - a-band
    - i-band
    - h-zone
    - z-line
    - m-bridge
    numbers: []
    concepts:
    - structure
    - measurement
    related:
    - ch01.muscle-structure.sarcomere
    - ch01.sliding-filament.band-changes
    locator: 第 1 章 · Muscular System
  - id: ch01.muscle-structure.sr-ttubule
    q: 橫小管與肌漿網各做什麼
    a:
    - 橫小管由肌膜向內延伸，把動作電位帶進肌纖維深處
    - 肌漿網包圍肌原纖維，儲存鈣離子並在受刺激時釋放
    detail: 沒有橫小管的話，訊號只到表面，纖維中心會慢半拍甚至不收縮。橫小管垂直穿進去，讓深淺各處幾乎同時去極化——這是整條纖維能一起發力的結構前提。
    terms:
    - t-tubule
    - sarcoplasmic-reticulum
    - sarcolemma
    - action-potential
    numbers: []
    concepts:
    - structure
    - force-production
    related:
    - ch01.sliding-filament.crossbridge-formation
    - ch01.neuromuscular.nmj
    locator: 第 1 章 · Muscular System
- id: sliding-filament
  title: 滑動絲理論 Sliding Filament
  desc: 橫橋循環四步 · 力量的即時決定因素 · 收縮與放鬆條件
  tag: Sliding Filament
  items:
  - id: ch01.sliding-filament.core
    q: 滑動絲理論的核心主張是什麼
    a:
    - 細絲從肌節兩端往中央滑動
    - 粗絲與細絲本身長度都不變
    - Z 線被拉近，肌節縮短
    detail: 最容易誤解的一點：肌肉縮短時，肌絲本身沒有變短，是兩組肌絲重疊得更多。這也是為什麼 A 帶（粗絲長度）在整個收縮過程都不變，可以拿來當判讀依據。
    terms:
    - actin
    - myosin
    - sarcomere
    - z-line
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch01.sliding-filament.band-changes
    - ch01.muscle-structure.sarcomere
    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.atp-cleavage
    q: 橫橋循環第一步：ATP 分解
    a:
    - 肌凝蛋白 ATP 水解酶把 ATP 分解成 ADP 與無機磷酸
    - 分解釋出的能量把肌凝蛋白頭「上膛」到就位角度
    detail: 注意能量是在這一步就取得的，不是在拉的那一刻。肌凝蛋白頭像被扳開的彈簧夾，能量已經儲存在構型裡，等待接上細絲後釋放。
    terms:
    - atp
    - adp
    - myosin-atpase
    - myosin
    numbers: []
    concepts:
    - force-production
    - energy-supply
    related:
    - ch01.sliding-filament.power-stroke
    - ch01.sliding-filament.requirements
    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.crossbridge-formation
    q: 橫橋循環第二步：橫橋形成
    a:
    - 肌漿網釋出的鈣離子與旋光素結合
    - 原肌凝蛋白位移，露出細絲上的結合位點
    - 上膛的肌凝蛋白頭接上細絲，形成橫橋
    detail: 這一步是整條因果鏈的開關。電訊號到此為止都還只是電，鈣離子是把電訊號翻譯成機械動作的中介——這就是「興奮收縮偶聯」這個名字的意思。
    terms:
    - troponin
    - tropomyosin
    - crossbridge
    - sarcoplasmic-reticulum
    numbers: []
    concepts:
    - force-production
    related:
    - ch01.muscle-structure.sr-ttubule
    - ch01.sliding-filament.relaxation
    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.power-stroke
    q: 橫橋循環第三步：動力衝程
    a:
    - 無機磷酸釋出，觸發肌凝蛋白頭彎折
    - 彎折把細絲拉向肌節中心
    - 隨後 ADP 釋出
    detail: 這一下就是肌肉實際做功的瞬間。整塊肌肉在任何時刻都有大量橫橋處在循環的不同階段，此起彼落，所以外觀上是平順出力而不是一抖一抖。
    terms:
    - power-stroke
    - adp
    - crossbridge
    - actin
    numbers: []
    concepts:
    - force-production
    related:
    - ch01.sliding-filament.force-determinant
    - ch01.sliding-filament.dissociation
    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.dissociation
    q: 橫橋循環第四步：解離
    a:
    - 新的一個 ATP 接上肌凝蛋白頭
    - 頭與細絲脫開，回復原本角度
    - 只要鈣離子還在，循環立刻重來一輪
    detail: ATP 在這裡的角色是「鬆開」而不是「出力」——這也解釋了屍僵：死亡後 ATP 耗盡，橫橋接上去卻沒有 ATP 可以讓它們脫開，肌肉就僵住。
    terms:
    - atp
    - crossbridge
    numbers: []
    concepts:
    - force-production
    - energy-supply
    related:
    - ch01.sliding-filament.atp-cleavage
    - ch01.sliding-filament.requirements
    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.force-determinant
    q: 肌肉當下的力量由什麼決定
    a:
    - 任一瞬間接在細絲上的橫橋數量
    detail: 這一句是整章往後所有訓練推論的地基。想提高力量，路徑只有兩條：讓更多橫橋同時接上（神經徵召、鈣釋放），或增加可用的橫橋總數（肌肥大增加肌絲數量）。
    terms:
    - crossbridge
    numbers: []
    concepts:
    - force-production
    related:
    - ch01.fiber-types.improve-force
    - ch01.neuromuscular.recruitment
    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.relaxation
    q: 肌肉要放鬆需要什麼條件
    a:
    - 運動神經停止發送刺激
    - 鈣離子被主動泵回肌漿網
    - 原肌凝蛋白重新蓋住結合位點，橫橋無法再接上
    detail: 放鬆是耗能的：把鈣泵回肌漿網要花 ATP。所以「放鬆」不是單純停止用力，而是另一個需要能量的主動過程——疲勞時放鬆變慢，原因之一就在這裡。
    terms:
    - tropomyosin
    - sarcoplasmic-reticulum
    - atp
    numbers: []
    concepts:
    - force-production
    - energy-supply
    related:
    - ch01.sliding-filament.crossbridge-formation
    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.requirements
    q: 收縮循環缺一不可的三樣東西
    a:
    - 鈣離子：解開細絲上的鎖
    - ATP：提供動力衝程能量，並讓橫橋解離
    - 肌凝蛋白 ATP 水解酶：催化 ATP 分解
    detail: 三者角色不同，不能互相替代。缺鈣＝鎖著打不開；缺 ATP＝接上了脫不開；缺酵素＝有燃料卻點不著。
    terms:
    - atp
    - myosin-atpase
    numbers: []
    concepts:
