    q: 呼吸肌需要另外訓練嗎
    a:
    - 耐力訓練與阻力訓練本身就會訓練到呼吸肌
    - 一般族群不需要額外的呼吸肌訓練
    - 術後或長期臥床者是例外
    detail: 理由很直接：只要訓練強度夠，換氣量自然大幅上升，呼吸肌就處在被訓練的狀態。專門的呼吸肌訓練適用的是「無法透過一般運動達到足夠換氣量」的族群。
