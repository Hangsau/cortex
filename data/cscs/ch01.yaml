    - ch01.cardiovascular.heart-rate
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.heart-rate
    q: 心率如何被神經調節，正常範圍多少
    a:
    - 交感神經活化：加快竇房結去極化，心率上升
    - 副交感神經活化：減慢竇房結放電，心率下降
    - 安靜心率正常約每分鐘 60 到 100 次
    - 低於 60 稱心搏徐緩，高於 100 稱心搏過速
    detail: 兩套神經的分布不對稱：心房同時受交感與副交感支配，心室幾乎只受交感支配。所以副交感（迷走神經）主要調的是速率，交感則同時調速率與收縮強度。另外要注意，耐力運動員安靜心率低於 60 是訓練適應，不是病態。
    terms:
    - sympathetic
    - parasympathetic
    - chronotropic
    - bradycardia
    - tachycardia
    - sa-node
    numbers:
    - v: 60–100
      unit: 次 / 分
      of: 成人安靜心率正常範圍
    - v: < 60
      unit: 次 / 分
      of: 心搏徐緩的判定門檻
    - v: '> 100'
      unit: 次 / 分
      of: 心搏過速的判定門檻
    concepts:
    - circulation
    - normal-values
    - adaptation
    related:
    - ch01.cardiovascular.pacemaker-hierarchy
    - ch01.cardiovascular.ecg
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.ecg
    q: 心電圖三個主要波形各代表什麼
    a:
    - P 波：心房去極化，隨後心房收縮
    - QRS 複合波：心室去極化，隨後心室收縮
    - T 波：心室再極化
    detail: 心電圖記錄的是電活動，不是機械收縮——電在前、收縮在後。心房再極化在圖上看不到，因為它剛好被振幅大得多的 QRS 複合波蓋過去了；不是沒發生，是被遮住。
    terms:
    - ecg
    - p-wave
    - qrs-complex
    - t-wave
    - depolarization
    - repolarization
    numbers: []
    concepts:
    - circulation
    - measurement
    related:
    - ch01.cardiovascular.conduction
    - ch01.cardiovascular.heart-rate
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.vessels
    q: 血管從心臟出發到回到心臟的順序
    a:
    - 動脈：高壓把血送離心臟
    - 小動脈：可開可關，調節送往各組織的血流
    - 微血管：管壁極薄，進行氣體與養分交換
    - 小靜脈：收集微血管的血
    - 靜脈：把血送回心臟，同時當作血液儲存庫
    detail: 整條路上只有微血管在做交換，其他都是運輸或調節。小動脈是「水龍頭」——運動時肌肉血流暴增，靠的就是小動脈擴張、同時內臟區的小動脈收縮，把有限的心輸出重新分配。
    terms:
    - artery
    - arteriole
    - capillary
    - venule
    - vein
    numbers: []
    concepts:
    - circulation
    - structure
    related:
    - ch01.cardiovascular.blood
    - ch01.cardiovascular.muscle-pump
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.blood
    q: 血液怎麼運送氧氣與二氧化碳
    a:
    - 氧氣由紅血球內的血紅素攜帶送到組織
    - 二氧化碳被帶回肺部排出
    - 紅血球內的碳酸酐酶協助二氧化碳的處理
    detail: 兩種氣體的運送方式不對稱：氧氣幾乎全靠血紅素攜帶，二氧化碳則大部分以碳酸氫根的形式溶在血漿裡運送，碳酸酐酶就是催化這個轉換的酵素。血紅素同時還是重要的酸鹼緩衝物。
    terms:
    - hemoglobin
    - carbonic-anhydrase
    numbers: []
    concepts:
    - circulation
    - gas-exchange
    related:
    - ch01.respiratory.gas-exchange
    - ch01.cardiovascular.vessels
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.muscle-pump
    q: 骨骼肌幫浦怎麼幫血液回心
    a:
    - 收縮的肌肉壓迫靜脈
    - 靜脈內的單向瓣膜只讓血往心臟方向走
    - 運動後保持輕度活動，避免血液積在下肢
    detail: 靜脈壓力低，光靠心臟的推力不足以把下肢的血送回來，所以需要肌肉幫忙。這解釋了兩件事：久站不動容易頭暈腳腫；以及衝刺結束後應該慢走收操，突然完全靜止會讓回心血量驟降。
    terms:
    - skeletal-muscle-pump
    - vein
    numbers: []
    concepts:
    - circulation
    related:
    - ch01.cardiovascular.vessels
    locator: 第 1 章 · Cardiovascular System
- id: respiratory
  title: 呼吸系統 Respiratory
  desc: 氣道路徑 · 吸氣與呼氣機制 · 氣體交換 · 壓力與耗能
  tag: Respiratory
  items:
  - id: ch01.respiratory.airway
    q: 空氣從鼻腔到肺泡的路徑
    a:
    - 鼻腔：暖化、濕化、過濾空氣
    - 氣管，是第一代呼吸道
    - 左右主支氣管，第二代
    - 細支氣管，逐代分支，全程約 23 代
    - 肺泡，氣體交換發生處
    detail: 「代」指的是分支的層數：每分一次算一代。逐代分支的意義是總截面積不斷放大，到肺泡時氣流速度已經幾乎為零，讓氣體有足夠時間擴散。
    terms:
    - trachea
    - bronchus
    - bronchiole
    - alveolus
    numbers:
    - v: 約 23
      unit: 代
      of: 從氣管到肺泡的分支代數
    concepts:
    - gas-exchange
    - structure
    related:
    - ch01.respiratory.gas-exchange
    - ch01.respiratory.inspiration
    locator: 第 1 章 · Respiratory System
  - id: ch01.respiratory.inspiration
    q: 吸氣是怎麼發生的
    a:
    - 橫膈膜收縮下降，胸腔容積變大
    - 肺內壓低於大氣壓，空氣被推進來
    - 用力吸氣時外肋間肌、胸鎖乳突肌、前鋸肌、斜角肌加入
    detail: 空氣不是被「吸」進來，是被大氣壓推進來的——身體做的事只是把胸腔撐大製造壓力差。安靜呼吸幾乎全靠橫膈膜，輔助肌只在需求上升時才加入，這也是為什麼看到頸部肌肉明顯參與呼吸代表呼吸負擔已經很大。
    terms:
    - diaphragm
    - alveolar-pressure
    numbers: []
    concepts:
    - gas-exchange
    - structure
    related:
    - ch01.respiratory.expiration
    - ch01.respiratory.alveolar-pressure
    locator: 第 1 章 · Respiratory System
  - id: ch01.respiratory.expiration
    q: 呼氣是怎麼發生的
    a:
    - 安靜時是被動的：橫膈膜放鬆，加上肺與腹部結構的彈性回縮
    - 用力呼氣時腹肌與內肋間肌主動收縮
    detail: 安靜呼氣不耗能，是彈性組織把撐開的胸腔拉回去。這個「被動」是相對的——訓練中的閉氣用力法就是刻意把腹肌與呼吸肌一起收緊，用腹內壓穩定軀幹，此時呼氣肌反而在做很大的等長工作。
    terms:
    - diaphragm
    - valsalva
    numbers: []
    concepts:
    - gas-exchange
    - force-production
    related:
    - ch01.respiratory.inspiration
    - ch01.respiratory.energy-cost
    locator: 第 1 章 · Respiratory System
  - id: ch01.respiratory.gas-exchange
    q: 氣體交換靠什麼驅動
    a:
    - 靠擴散：分子從分壓高的一側往分壓低的一側移動
    - 氧氣從肺泡（高）進入肺微血管（低）
    - 二氧化碳方向相反
    - 肺泡內氧分壓比肺微血管高出約 60 毫米汞柱
    detail: 整個過程不需要主動運輸，只靠濃度差。那 60 毫米汞柱的落差就是驅動力大小——落差越大擴散越快，這也是高海拔為什麼會影響運動表現：大氣氧分壓下降，落差變小，氧氣進血液的速度就跟著降。
    terms:
    - diffusion
    - partial-pressure
    - alveolus
    - capillary
    numbers:
    - v: 約 60
      unit: mmHg（毫米汞柱）
      of: 肺泡與肺微血管之間的氧分壓差
    concepts:
    - gas-exchange
    - circulation
    related:
    - ch01.cardiovascular.blood
    - ch01.respiratory.airway
    locator: 第 1 章 · Respiratory System
  - id: ch01.respiratory.alveolar-pressure
    q: 肺泡壓在呼吸週期中怎麼變
    a:
    - 吸氣時肺泡壓低於大氣壓，氣流進入
    - 呼氣時肺泡壓高於大氣壓，氣流排出
    - 聲門開啟且無氣流時，肺泡壓等於大氣壓
    detail: 氣流方向永遠只跟壓力差走。這個原則同時解釋了氣胸為什麼危險：胸壁破損後外界空氣直接灌進胸膜腔，壓力差被消除，肺就塌陷。
    terms:
    - alveolar-pressure
    - alveolus
    numbers: []
    concepts:
    - gas-exchange
    - normal-values
    related:
    - ch01.respiratory.pleural-pressure
    - ch01.respiratory.inspiration
    locator: 第 1 章 · Respiratory System
  - id: ch01.respiratory.pleural-pressure
    q: 胸膜腔壓為什麼是負的
    a:
    - 位於包覆肺的膜與襯在胸壁的膜之間
    - 正常狀態下略呈負值
    - 這個負壓把肺撐開貼住胸壁
    detail: 肺本身有彈性、傾向縮小，胸壁傾向擴張，兩股相反的拉力把中間的胸膜腔拉出負壓。所以肺是被「吸附」在胸壁上的，這也是它能跟著胸腔一起擴張的原因。
    terms:
    - pleura
    - pleural-pressure
    numbers: []
    concepts:
    - gas-exchange
    - normal-values
    related:
    - ch01.respiratory.alveolar-pressure
    locator: 第 1 章 · Respiratory System
  - id: ch01.respiratory.energy-cost
    q: 呼吸本身消耗多少能量
    a:
    - 安靜時約佔總能量消耗的 3 到 5 個百分點
    - 劇烈運動時可達 8 到 15 個百分點
    - 有氣道阻力問題的人比例更高
    detail: 這個數字提醒的是：呼吸肌也是肌肉，也會累、也會跟四肢搶血流。劇烈運動時呼吸肌耗掉的那一成能量，是運動表現的實際成本，不是可以忽略的背景值。
    terms: []
    numbers:
