    locator: 第 1 章 · Sliding-Filament Theory
  - id: ch01.sliding-filament.band-changes
    q: 收縮時肌節的哪些區段會改變
    a:
    - H 區縮小
    - I 帶縮小
    - Z 線互相靠近
    - A 帶長度不變
    detail: A 帶不變是判別「滑動」而非「縮短」的直接證據：如果粗絲自己縮短，A 帶就該跟著縮。考題常拿這一點來問。
