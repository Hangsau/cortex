- id: cardiovascular
  title: 心血管系統 Cardiovascular
  desc: 心臟腔室與瓣膜 · 傳導系統 · 心電圖 · 血管與血液
  tag: Cardiovascular
  items:
  - id: ch01.cardiovascular.heart-chambers
    q: 心臟的四個腔室怎麼分工
    a:
    - 右心房與右心室把血送去肺循環
    - 左心房與左心室把血送去體循環
    - 心房負責把血送進同側心室
    - 心室是推動血液前進的主要力量來源
    detail: 心臟其實是兩個並排的泵，共用同一套節律。心房只把血往下推一小段，真正的推進工作在心室——這是左心室壁遠比其他腔室厚的原因，它要把血送到全身。
    terms:
    - atrium
    - ventricle
    - myocardium
    numbers: []
    concepts:
    - circulation
    - structure
    related:
    - ch01.cardiovascular.valves
    - ch01.cardiovascular.vessels
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.valves
    q: 心臟瓣膜怎麼防止逆流
    a:
    - 房室瓣（右側三尖瓣、左側二尖瓣）防止心室收縮時血液倒回心房
    - 半月瓣（主動脈瓣、肺動脈瓣）防止心室舒張時血液倒灌回心室
    detail: 瓣膜沒有肌肉、不會主動開闔，完全被兩側的壓力差推開或壓上。心音就是瓣膜關閉時的聲音：第一心音是房室瓣關，第二心音是半月瓣關。
    terms:
    - av-valve
    - tricuspid-valve
    - mitral-valve
    - semilunar-valve
    - systole
    - diastole
    numbers: []
    concepts:
    - circulation
    - structure
    related:
    - ch01.cardiovascular.heart-chambers
    - ch01.cardiovascular.conduction
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.conduction
    q: 電訊號在心臟裡走的路徑
    a:
    - 竇房結起始
    - 經結間傳導路徑傳遍心房
    - 房室結（訊號在此延遲）
    - 房室束
    - 左右束支
    - 浦金氏纖維，遍布心室
    detail: 房室結的延遲不是缺陷而是設計：它給心房足夠時間把血完全擠進心室，心室才開始收縮。延遲之後訊號進入傳導極快的束支與浦金氏纖維，讓兩側心室幾乎同時收縮，把血一次擠出去。
    terms:
    - sa-node
    - internodal-pathway
    - av-node
    - av-bundle
    - bundle-branch
    - purkinje-fiber
    numbers: []
    concepts:
    - circulation
    - structure
    related:
    - ch01.cardiovascular.pacemaker-hierarchy
    - ch01.cardiovascular.ecg
    locator: 第 1 章 · Cardiovascular System
  - id: ch01.cardiovascular.pacemaker-hierarchy
    q: 為什麼是竇房結當節律點
    a:
    - 竇房結固有放電頻率最快：每分鐘 60 到 80 次
    - 房室結每分鐘 40 到 60 次
    - 心室纖維每分鐘 15 到 40 次
    detail: 下游組織其實都有自我激發的能力，但竇房結每次放電都提前把它們的膜電位放掉，讓它們來不及自發。誰快誰當家——這也是為什麼竇房結失效時心臟不會停，只會慢下來由下一層接手。
    terms:
    - sa-node
    - av-node
    - myocardium
    numbers:
    - v: 60–80
      unit: 次 / 分
      of: 竇房結固有放電頻率
    - v: 40–60
      unit: 次 / 分
      of: 房室結固有放電頻率
    - v: 15–40
      unit: 次 / 分
      of: 心室纖維固有放電頻率
    concepts:
