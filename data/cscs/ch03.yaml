cards:
- q: ATP水解的完整反應式及催化酶？
  a: ATP + H₂O → ADP + Pi + H⁺ + 能量；由ATPase催化；肌球蛋白ATPase負責橫橋循環
  tag: 磷酸原系統
- q: 肌酸激酶反應如何補充ATP？
  a: ADP + CP → ATP + 肌酸；CP分解釋磷與ADP結合；速率快但CP有限無法持久供能
  tag: 磷酸原系統
- q: 腺苷酸激酶（肌激酶）反應的意義？
  a: 2ADP → ATP + AMP；AMP為強力糖解促進劑，可啟動糖解系統接手供能
  tag: 磷酸原系統
- q: 靜息狀態下肌肉CP與ATP的濃度比值？
  a: CP為ATP的4-6倍；Type II纖維CP濃度高於Type I，爆發性運動時更依賴磷酸原系統
  tag: 磷酸原系統
- q: 磷酸原系統的ATP生成速率與容量排名？
  a: 速率第1（最快）；容量第5（最少）；適用0-10秒極高強度活動如衝刺、舉重
  tag: 磷酸原系統
- q: 糖解最終產物丙酮酸（pyruvate）有哪兩個去向？
  a: 1. 轉為乳酸（快速糖解）→速率快但短暫；2. 進入粒線體Krebs循環（慢速糖解）→速率慢但持久
  tag: 糖解作用
- q: 從血糖開始糖解淨得幾個ATP？從肌糖原呢？
  a: 血糖：耗2ATP得4ATP，淨2 ATP；肌糖原：耗1ATP得4ATP，淨3 ATP（已磷酸化毋需己糖激酶步驟）
  tag: 糖解作用
- q: 磷酸果糖激酶（PFK）在糖解中的角色？
  a: 速率限制酶（rate-limiting step）；ATP為抑制劑（ATP↑→抑制）；AMP、ADP、氨為活化劑（AMP↑→加速）
  tag: 糖解作用
- q: 糖解活化信號（ADP↑、AMP↑、Pi↑）代表什麼生理意義？
  a: 細胞能量耗竭信號；ATP水解增加→ADP/AMP/Pi↑→刺激糖解加速ATP再合成以滿足能量需求
  tag: 糖解作用
- q: 糖解的底物磷酸化（substrate-level phosphorylation）有幾步？
  a: 共2步：①磷酸甘油酸激酶（PGK）②丙酮酸激酶；每分子葡萄糖各生成2 ATP，共4 ATP（毛）
  tag: 糖解作用
- q: 乳酸是否導致代謝酸中毒（運動疲勞的灼燒感）？
  a: 否。乳酸脫氫酸反應本身消耗H⁺（皧化）；乳酸酸中毒（lactic acidosis）是誤稱
  tag: 乳酸與酸中毒
- q: 運動性代謝酸中毒的真正H⁺來源是什麼？
  a: ATP水解（ATP→ADP+Pi+H⁺）；粒線體外的ATP水解是H⁺堪積的主要來源，非乳酸產生
  tag: 乳酸與酸中毒
- q: 乳酸閾値（LT）定義？訓練者與未訓練者的比較？
  a: 血乳酸開始急劇上升的運動強度；未訓練者約50-60% VO₂max；有氧訓練者70-80% VO₂max
  tag: 乳酸與酸中毒
- q: OBLA（血乳酸累積起始點）的定義與數値？
  a: 血乳酸濃度達4 mmol/L的第二個轉折點；對應大運動單位（Type II纖維）大量被徵召
  tag: 乳酸與酸中毒
- q: Cori Cycle的作用是什麼？
  a: 乳酸→血液→肥臟→糖質新生（gluconeogenesis）→葡萄糖；長時間運動與恢復期的重要機制
  tag: 乳酸與酸中毒
- q: Krebs循環發生在哪裡？每分子葡萄糖循環幾圈各產生什麼？
  a: 粒線體基質；每分子葡萄糖循環2圈，共產生2 GTP（底物磷酸化）+ 8 NADH + 2 FADH₂
  tag: 氧化系統
- q: 電子傳遞鏈（ETC）中NADH和FADH₂各產多少ATP？
  a: NADH產3 ATP；FADH₂產2 ATP；ETC為氧化磷酸化，占4%以上總 ATP產量
  tag: 氧化系統
- q: 一分子血糖經完整氧化系統（糖解+Krebs+ETC）淨產多少ATP？
  a: 淨38 ATP（若起點為肌糖原則39 ATP）；ETC貢獶34 ATP，佔綕大多數
  tag: 氧化系統
- q: 脂肪如何透過β氧化提供能量？
  a: 三酸甘油酩→游離脂肪酸→進入粒線體β氧化→乙醟CoA→Krebs cycle；一個16砒棺榈酸可產逾100 ATP
  tag: 氧化系統
- q: Krebs循環的速率限制酵是哪個？受什麼調控？
  a: 異樹樹酸脫氫酵（isocitrate dehydrogenase）；ADP刺激（ADP↑→加速）、ATP抑制（ATP↑→減慢）
  tag: 氧化系統
- q: 0～6秒、6～30秒30秒～2分、2～3分、3分以上各對應主要能量系統？
  a: 0-6s磷酸原；6-30s磷酸原+快速糖解；30s-2min快速糖解；2-3min快速糖解+氧化；∆3min氧化系統
  tag: 能量容量
- q: 三大能量系統的速率排名（1最快）？
  a: 1磷酸原 2快速糖解 3慢速糖解 4碳水氧化 5脂肪/脂白質氧化；速率與容量成反比
  tag: 能量容量
- q: 三大能量系統的容量排名（1最大）？
  a: 1脂肪/脂白質氧化 2碳水氧化 3慢速糖解 4快速糖解 5磷酸原；容量與速率成反比
  tag: 能量容量
- q: 自行車最大努力60秒時，有氧與無氧各貢獼多少？
  a: 無氧50%，有氧50%；0-5秒無氧96%；90秒無氧35%；200秒無氧22%
  tag: 能量容量
- q: 能量系統的選用主要與次要取決因素？
  a: 主要：運動強度（intensity）；次要：持續時間（duration）；任何時刻三系統皆同時活化
  tag: 能量容量
- q: 高強度運動後CP和ATP各需多久完全恢復？
  a: ATP完全恢復約3-5分鐘；CP完全恢復約8分鐘；主要依賴有氧代謝進行恢復
  tag: 基質a補充
- q: 高強度運動中CP和ATP的下降幅度？
  a: CP可下降50-70%甚至幾乎耗盡；ATP最多下降50-60%（不能完全耗盡，需維持基本細胞功能）
  tag: 基質a補充
- q: 肌肉和肝臟的靜息糖原儲量各為多少？
  a: 肌肉糖原約300-400g；肝糖原約70-100g；訓練和飲食均可提高靜息濃度
  tag: 基質a補充
- q: 肌糖原最佳恢復的補碳方案？
  a: 每2小時攝取0.7-3.0 g/kg體重碳水化合物；可在4-6小時內最大化補充速率（5-6 mmol/g濕肌肉/時）
  tag: 基質a補充
- q: 阻力訓練對肌糖原的消耗幅度？高強度間歇訓練呢？
  a: 阻力訓練可造成20-60%糖原耗盡（即使組數不多）；高強度間歇類似；Type II纖維選擇性耗盡更明顯
  tag: 基質a補充
- q: 氧債（oxygen deficit）是什麼？
  a: 運動開始時有氧系統反應慢，由無氧系統補充的能量部分；等於穩定狀態需氧量與實際攝氧量之差
  tag: EPOC
- q: EPOC（運動後過量氧耗）的定義？
  a: 運動後攝氧量超過靜息値的部分；用於恢復磷酸原、補充血液/肌肉中O₂、升體溫/循環/換氣等
  tag: EPOC
- q: 有氧運動產生最大EPOC的條件？
  a: 強度>50-60% VO₂max且持續時間>40分鐘；或短暫超最大強度間歇（>100% VO₂max）
  tag: EPOC
- q: 重量訓練EPOC比較：大重量 vs 輕量循環訓練？
  a: 大重量（3約8動作至力竭，80-90% 1RM）EPOC > 輕量循環（4約8動作15次，50% 1RM）；EPOC亦具強度依賴性
  tag: EPOC
- q: EPOC的主要生理成因有哪些？
  a: 補充血液/肌肉中O₂儲量、ATP/CP再合成、體溫升高、循環/換氣增加、三酸甘油酩-脂肪酸循環、脂白質更新率↑
  tag: EPOC
- q: 間歇訓練（interval training）的核心優點？
  a: 以功休比允許在更高強度下完成更多訓練量；與同強度連續訓練相比疲勞更少、代謝刺激相同
  tag: 訓練設計
- q: 以磷酸原系統為主要訓練目標的建議功休比？
  a: 90-100%最大功率，5-10秒，功休比1:12至1:20；CP完全恢復需約8分鐘，休息需充分
  tag: 訓練設計
- q: HIIT祷9大可操控變數中最重要的兩項是？
  a: 工作期強度（intensity）與工作期持續時間（duration）；目標是使累積時間於>90% VO₂max
  tag: 訓練設計
- q: 組合訓練（combination training）對無氧運動員的潛在風険？
  a: 有氧耥力訓練可能抑制最大肌力增益（第7週後停滞甚至下降）、降低爆發力、肌纖維向慢縮轉型
  tag: 訓練設計
- q: 代謝專一性原則（metabolic specificity）的實際應用？
  a: 根據運動代謝特性選擇對應強度/持續時間；球類運動（間歇爆發）應以無氧為主，而非大量有氧耥力訓練
  tag: 訓練設計
- q: 血乳酸正常靜息値範圍？重度疲勞時可達多少？
  a: 靜息倦血濃度0.5-2.2 mmol/L；重度疲勞可達20-25 mmol/L；有研究記錄到>30 mmol/L（多輸動政試）
  tag: 乳酸與酸中毒
- q: Type II與Type I肌纖維的最大乳酸產生速率各為？
  a: Type II：0.5 mmol·g⁻¹·s⁻¹；Type I：0.25 mmol·g⁻¹·s⁻¹；Type II快密型纖維糖解酵活性高為主因
  tag: 乳酸與酸中毒
- q: 停止運動後血乳酸何時達峰値？幾時回到基線？
  a: 停止運動後約5分鐘達山峰（需時間從組織緩衝/傳輸到血液）；約1小時內回到運動前基線
  tag: 乳酸與酸中毒
- q: 主動恢復與被動恢復的乳酸清除效率差異？
  a: 主動恢復（輕度運動）乳酸清除速度明顯更快；有訓練者（有氧訓練外）和無氧訓練者清除均優於未訓練者
  tag: 乳酸與酸中毒
- q: 不同運動強度下肌糖原分解速率？（50%/75%/100% VO₂max）
  a: 50% VO₂max：0.7 mmol·kg⁻¹·min⁻¹；75%：1.4；100%：3.4 mmol·kg⁻¹·min⁻¹；強度越高，肌糖原分解越快
  tag: 基質a補充
- q: 訓練對靜息肌糖原濃度的影響？
  a: 無氧訓練（衝刺、阻力）和有氧訓練除很對應摄食均可提高靜息肌糖原濃度；訓練后光聰糖原網絡總量也可更大
  tag: 基質a補充
- q: 蛋白質在短期 vs 長期運動中各貢獼多少能量？
  a: 短期運動：極少；長期運動（>90分鐘）及長期禁食：可貢獼3-18%能量；號稱主要對象為支錨胺基酸
  tag: 氧化系統
- q: 骨骼肌中被氧化的主要胺基酸種類？
  a: 支錨胺基酸（BCAA）：白胺酸（leucine）、異白胺酸（isoleucine）、縬胺酸（valine）；另还有丙胺酸、天冬酸、谷氨酸
  tag: 氧化系統
- q: 己糖激酶（hexokinase）受什麼物質別構抑制？意義為何？
  a: 葡萄糖-6-磷酸（glucose-6-phosphate）濃度越高，抑制效果越強；防止糖解過快（負回饋機制）
  tag: 糖解作用
- q: 兒童 vs 成人在高強度間歇運動中CP恢復能力差異？
  a: 兒童有更強氧化能力，第一組CP耗盡就較低；連續多組CP水平較高；運動後肌肉pH幾乎不影響
  tag: 磷酸原系統
- q: 有氧訓練使LT右移的兩個主要生理機制？
  a: ①粒線體數量增加，專屬有氧代謝能力提升；②兒茶酸胺（catecholamine）在高強度下釋放減少，降低糖解激活
  tag: 乳酸與酸中毒
- q: 質量作用定律（law of mass action）在磷酸原系統的應用？
  a: 反應物（ADP、Pi）濃度↑→肌酸激酵加速；ATP↑→反應減慢或逆轉；磷酸原系統總傾向返回平衡狀態
  tag: 磷酸原系統
