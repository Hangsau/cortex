  - id: ch03.substrate.i02
    q: 磷酸原回補時間
    a:
    - ATP完全回補：約3-5分鐘
    - CP完全回補：約8分鐘
    - 主要靠有氧代謝完成（糖解也可貢獻高強度後的恢復）
    detail: 磷酸原的再合成主要依賴有氧代謝，這也是為何高強度訓練（磷酸原系統）需要充足的休息時間讓有氧機制完成 CP 再合成。8 分鐘的 CP 完全恢復時間，是設計功休比指引（Table 3.6，1:12-1:20）的生理依據之一。
    terms:
    - creatine-phosphate
    - atp
    numbers:
    - v: 3
      unit: 分鐘
      of: 運動後 ATP 完全再合成的大約時間下限
    - v: 5
      unit: 分鐘
      of: 運動後 ATP 完全再合成的大約時間上限
    - v: 8
      unit: 分鐘
      of: 運動後 CP 完全再合成的大約時間
    concepts:
