  - id: ch03.substrate.i08
    q: 兒童vs成人CP
    a:
    - 兒童氧化能力更強→第一組CP耗竭量較少
    - 多組訓練後兒童平均CP水準較高、恢復期CP水準也較高
    - 運動後兒童肌肉pH顯著較高
    detail: 書中引用 Kappenstein 等人的研究：9 歲兒童（n=16）與 26 歲成人（n=16）進行 10 次 30 秒動態跖屈運動（25% 1RM）。第一組 CP 分解在兒童顯著較低，整個運動和恢復期兒童 CP 水準均較高，兒童肌肉 pH 在運動結束時也較高。結論：兒童在高強度間歇運動中更依賴氧化代謝。
