    q: 血糖維持
    a:
    - '<50% VO₂max：肌肉葡萄糖攝取低，血糖相對穩定'
    - '>90分鐘低強度：血糖可能下降，但很少低於2.8 mmol/L'
    - '>90分鐘高強度（>50% VO₂max）：肝糖原耗竭可能造成血糖顯著下降'
    - '<2.5-3.0 mmol/L：某些人可能出現低血糖反應'
    detail: 長時間低強度（<50% VO₂max）運動下，血糖很少低於 2.8 mmol/L。當強度超過 50% VO₂max 且持續超過 90 分鐘，肝糖原耗竭可能導致血糖顯著下降。血糖降至 2.5-3.0 mmol/L 會降低碳水化合物氧化能力，最終導致力竭。
