    - ch18.program-design.i03
    locator: 第 3 章 · Phosphagens
  - id: ch03.substrate.i03
    q: 肌糖原儲量
    a:
    - 全身肌肉約300-400g糖原
    - 肝臟約70-100g糖原
    - 靜息濃度可受訓練（無氧與有氧）及飲食調控
    detail: 肌糖原是高強度與中強度運動的關鍵底物，肝糖原則在低強度和長時間運動中相對重要。兩種訓練方式（無氧訓練如衝刺/阻力訓練，以及有氧耐力訓練）加上適當營養，均能提升靜息肌糖原濃度。
    terms:
    - glycogen
    numbers:
    - v: 300
      unit: g
      of: 全身肌肉糖原靜息儲量的下限估計
    - v: 400
      unit: g
      of: 全身肌肉糖原靜息儲量的上限估計
    - v: 70
      unit: g
      of: 肝臟糖原靜息儲量的下限估計
    - v: 100
      unit: g
      of: 肝臟糖原靜息儲量的上限估計
