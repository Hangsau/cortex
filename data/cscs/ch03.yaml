    - ch17.training-volume.i01
    locator: 第 3 章 · Glycogen
  - id: ch03.substrate.i05
    q: 肌糖原回補策略
    a:
    - 運動後每2小時攝取0.7-3.0 g/kg體重碳水
    - 前4-6小時最大化回補速率（5-6 mmol/g濕肌肉/小時）
    - 充足碳水攝取下24小時可完全回補
    detail: 若運動含高度離心成分（伴隨運動誘發的肌肉損傷），糖原完全回補可能需要超過 24 小時。最佳碳水攝取量需在每 2 小時補充一次的頻率下維持 0.7-3.0 g/kg 的範圍，以最大化前 4-6 小時的加速回補窗口。
    terms:
    - glycogen
