  - id: ch03.substrate.i04
    q: 糖原耗竭與強度
    a:
    - '>60% VO₂max時肌糖原為日益重要的能量底物'
    - 阻力訓練可造成肌糖原下降20-60%（即使組數不多）
    - 耗竭速率：50% VO₂max = 0.7、75% = 1.4、100% = 3.4 mmol·kg⁻¹·min⁻¹
    detail: 書中指出肌糖原在 >60% VO₂max 時「成為日益重要的能量底物」，並非突然成為唯一來源。高強度阻力訓練可選擇性耗竭 Type II 纖維的糖原，進而限制後續表現。當總工作量相等時，阻力訓練的糖原耗竭總量不受強度影響。
    terms:
    - glycogen
    - vo2max
    numbers:
