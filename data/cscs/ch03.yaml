      of: 100% VO₂max 時的肌糖原分解速率
    - v: 20
      unit: '%（下降幅度）'
      of: 高強度間歇阻力訓練造成肌糖原耗竭的下限（少數組數即可造成）
    - v: 60
      unit: '%（下降幅度）'
      of: 高強度間歇阻力訓練造成肌糖原耗竭的上限
