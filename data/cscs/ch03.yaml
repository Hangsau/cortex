id: ch03
weight: 3
title: Ch.3 運動與訓練的生物能量學
topics:
- id: energy-capacity
  title: 能量產生與容量
  desc: ''
  tag: 概念核心
  items:
  - id: ch03.energy-capacity.i01
    q: 速率vs容量反比
    a:
    - 能量系統速率越高，總容量越低
    - 磷酸原最快但量最少
    - 脂肪氧化最慢但量最多
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.energy-capacity.i02
    q: 0-6秒活動
    a:
    - 極高強度
    - 主要系統：磷酸原
    - 例：鉛球、舉重抓舉
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.energy-capacity.i03
    q: 6-30秒活動
    a:
    - 非常高強度
    - 磷酸原＋快速糖解
    - 例：100m衝刺
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.energy-capacity.i04
    q: 30秒-2分鐘
    a:
    - 高強度
    - 快速糖解為主
    - 例：400m跑、200m游泳
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.energy-capacity.i05
    q: 2-3分鐘活動
    a:
    - 中強度
    - 快速糖解＋氧化系統
    - 例：1500m跑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.energy-capacity.i06
    q: '>3分鐘活動'
    a:
    - 低強度
    - 以氧化系統為主
    - 例：馬拉松、長跑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.energy-capacity.i07
    q: 速率排名
    a:
    - 1磷酸原 2快速糖解 3慢速糖解 4碳水氧化 5脂肪/蛋白氧化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.energy-capacity.i08
    q: 三系統同時作用
    a:
    - 任何時刻三系統皆同時活化
    - 由強度（主）和持續時間（次）決定各系統貢獻比例
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: epoc
  title: 攝氧量與EPOC
  desc: ''
  tag: 生理監測
  items:
  - id: ch03.epoc.i01
    q: 氧虧 Oxygen Deficit
    a:
    - 運動初期有氧系統反應慢→需無氧補充的能量量
    - 強度越高氧虧越大
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.epoc.i02
    q: 穩態 Steady State
    a:
    - 低強度持續運動數分鐘後，攝氧量等於需氧量
    - 高強度運動無法達到穩態
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.epoc.i03
    q: EPOC定義
    a:
    - 運動後超過靜息水準的額外攝氧量
    - 用於使身體恢復至運動前狀態
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.epoc.i04
    q: EPOC影響因素
    a:
    - 強度>持續時間
    - '>50-60% VO₂max且>40分鐘時EPOC最大'
    - 超極量間歇可最大化EPOC
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.epoc.i05
    q: EPOC生理機制
    a:
    - 血液/肌肉O₂補充、ATP/CP再合成、體溫↑、三酸甘油酯-脂肪酸循環、蛋白質更新
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.epoc.i06
    q: 無氧vs有氧貢獻
    a:
    - 0-5秒：96%無氧
    - 30秒：75%無氧
    - 60秒：50/50
    - 90秒：35%無氧
    - 逐漸轉向有氧
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.epoc.i07
    q: 阻力訓練EPOC
    a:
    - 大重量（80-90%1RM，3組）EPOC > 循環訓練（50%1RM）
    - 阻力訓練也具強度依賴性
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.epoc.i08
    q: 高強度EPOC特性
    a:
    - 超過VO₂max的高強度運動：整個運動期間持續存在氧虧
    - 無法達穩態
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: glycolysis
  title: 糖解作用
  desc: ''
  tag: 無氧/有氧
  items:
  - id: ch03.glycolysis.i01
    q: 定義
    a:
    - 碳水化合物（肌糖原或血糖）分解再合成ATP
    - 發生在肌漿（sarcoplasm）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.glycolysis.i02
    q: 快速糖解
    a:
    - 丙酮酸→乳酸
    - 快速再生NAD⁺
    - H⁺增加→pH下降
    - 無氧條件
    - 短時間
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.glycolysis.i03
    q: 慢速糖解
    a:
    - 丙酮酸→粒線體→Krebs cycle
    - 有氧條件
    - 速率慢但持續時間長
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.glycolysis.i04
    q: 淨ATP產量
    a:
    - 血糖起始：淨2 ATP
    - 肌糖原起始：淨3 ATP（不需hexokinase消耗ATP）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.glycolysis.i05
    q: 關鍵酶調控
    a:
    - PFK（限速步驟）：ATP抑制、AMP活化
    - Hexokinase：G-6-P抑制
    - Pyruvate kinase：ATP抑制
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.glycolysis.i06
    q: 磷酸化方式
    a:
    - 基質磷酸化（substrate-level）：4 ATP gross
    - 氧化磷酸化（oxidative）：via ETC
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.glycolysis.i07
    q: 糖解促進因子
    a:
    - ADP↑、Pi↑、AMP↑、NH₃↑、pH輕微下降→糖解加速
    - pH顯著下降→抑制糖解
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.glycolysis.i08
    q: 糖解終產物
    a:
    - →乳酸（無氧/能量需求高）or 丙酮酸進粒線體（有氧/能量需求低）
    - 由細胞能量狀態決定
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: lactate
  title: 乳酸與代謝酸中毒
  desc: ''
  tag: 高頻考點
  items:
  - id: ch03.lactate.i01
    q: 乳酸非疲勞原因
    a:
    - 乳酸≠疲勞成因
    - 乳酸脫氫酶反應本身消耗H⁺（鹼化）
    - 實為能量基質
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.lactate.i02
    q: 真正酸化來源
    a:
    - ATP水解（ATP→ADP+Pi+H⁺）才是H⁺主要來源
    - 非乳酸堆積
    - 乳酸酸中毒為誤稱
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.lactate.i03
    q: 代謝酸中毒效應
    a:
    - 抑制糖解酶、干擾興奮-收縮耦合（鈣離子與肌鈣蛋白結合受阻）、抑制橫橋循環
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.lactate.i04
    q: 乳酸閾值LT
    a:
    - 血乳酸開始急劇上升的運動強度
    - 未訓練者50-60% VO₂max
    - 訓練者70-80%
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.lactate.i05
    q: OBLA
    a:
    - 血乳酸達4 mmol/L的第二個轉折點
    - 對應大運動單位（Type II）大量徵召
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.lactate.i06
    q: 乳酸清除
    a:
    - 停止運動後約5分鐘達峰值
    - 1小時內回基線
    - 主動恢復優於被動
    - 有訓練者清除更快
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.lactate.i07
    q: Cori Cycle
    a:
    - 乳酸→血液→肝臟→糖質新生（glucose）
    - 長時間運動與恢復期的重要機制
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.lactate.i08
    q: 訓練對LT影響
    a:
    - LT/OBLA右移（更高強度才開始堆積）
    - 粒線體增加、兒茶酚胺分泌減少
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: metabolic-specificity
  title: 訓練代謝專一性
  desc: ''
  tag: 訓練設計
  items:
  - id: ch03.metabolic-specificity.i01
    q: 代謝專一性原則
    a:
    - 運動強度與休息間隔可「選擇」特定能量系統
    - 訓練設計需符合運動代謝需求
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.metabolic-specificity.i02
    q: 間歇訓練原理
    a:
    - 預設功休比允許更高強度完成更多訓練量
    - 同強度下比連續訓練疲勞更少
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.metabolic-specificity.i03
    q: 功休比指引
    a:
    - 90-100%max：1:12-1:20（磷酸原）
    - 75-90%：1:3-1:5（快速糖解）
    - '>3min：1:1-1:3（氧化）'
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.metabolic-specificity.i04
    q: HIIT定義與效益
    a:
    - 短暫高強度+間歇恢復
    - 改善VO₂max、緩衝能力、糖原含量、無氧閾值
    - 時間效率高
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.metabolic-specificity.i05
    q: HIIT 9大變數
    a:
    - 工作強度/持續時間、恢復強度/持續時間、每組重複次數、組數、組間休息、恢復強度、訓練模式
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.metabolic-specificity.i06
    q: HIIT最佳化
    a:
    - 累積時間於>90% VO₂max
    - 同時徵召大運動單位＋近最大心輸出量→氧化纖維+心肌適應
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.metabolic-specificity.i07
    q: 組合訓練風險
    a:
    - 有氧訓練可能降低無氧能力
    - 同時訓練可能抑制最大肌力增益（第7週後停滯甚至下降）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.metabolic-specificity.i08
    q: 組合訓練注意
    a:
    - 無氧訓練本身可提升有氧功率與恢復
    - 大量有氧耐力訓練對無氧運動員可能適得其反
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: oxidative
  title: 氧化系統
  desc: ''
  tag: 有氧
  items:
  - id: ch03.oxidative.i01
    q: Krebs Cycle
    a:
    - 丙酮酸→乙醯CoA（pyruvate dehydrogenase）→進入TCA
    - 每葡萄糖產2 ATP（GTP）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.oxidative.i02
    q: 電子傳遞鏈ETC
    a:
    - NADH→3 ATP
    - FADH₂→2 ATP
    - O₂為最終電子受體→形成H₂O
    - 氧化磷酸化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.oxidative.i03
    q: 葡萄糖總ATP產量
    a:
    - 血糖：38 ATP
    - 肌糖原：39 ATP
    - 氧化磷酸化佔>90%的ATP合成
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.oxidative.i04
    q: 脂肪氧化
    a:
    - 三酸甘油酯→游離脂肪酸→β氧化→乙醯CoA→Krebs
    - 1分子棕櫚酸(16C)可產>100 ATP
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.oxidative.i05
    q: 蛋白質氧化
    a:
    - 胺基酸→葡萄糖/丙酮酸/Krebs中間物
    - 貢獻3-18%（長時間運動）
    - BCAA為主要氧化胺基酸
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.oxidative.i06
    q: 基質偏好
    a:
    - 靜息：70%脂肪+30%碳水
    - 高強度：近100%碳水
    - 長時間次極量：逐漸轉向脂肪
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.oxidative.i07
    q: Krebs限速步驟
    a:
    - isocitrate→α-ketoglutarate（isocitrate dehydrogenase）
    - ADP活化、ATP抑制
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.oxidative.i08
    q: 容量最大
    a:
    - ATP生成速率最慢（#5）但總容量最大（#1）
    - 適合低強度長時間運動（>3分鐘）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: phosphagen
  title: 磷酸原系統
  desc: ''
  tag: 無氧
  items:
  - id: ch03.phosphagen.i01
    q: ATP水解
    a:
    - ATP+H₂O → ADP+Pi+H⁺+能量
    - 由ATPase催化
    - 肌肉儲量僅80-100g
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.phosphagen.i02
    q: 肌酸激酶反應
    a:
    - ADP+CP → ATP+肌酸
    - 快速提供能量，但CP有限，不能長時間供能
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.phosphagen.i03
    q: 腺苷酸激酶反應
    a:
    - 2ADP → ATP+AMP
    - AMP為強力糖解促進劑，啟動糖解加速能量產生
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.phosphagen.i04
    q: CP儲量
    a:
    - 靜息時CP為ATP的4-6倍
    - Type II纖維CP濃度 > Type I
    - 爆發性運動更有效
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.phosphagen.i05
    q: 質量作用定律
    a:
    - 反應物/產物濃度驅動反應方向
    - ADP↑ → 肌酸激酶加速
    - ATP↑ → 反應減緩
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.phosphagen.i06
    q: 適用活動
    a:
    - 0-10秒極高強度
    - 阻力訓練、衝刺
    - 所有運動初始皆高度活化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.phosphagen.i07
    q: ATP耗竭上限
    a:
    - 肌肉ATP最多下降50-60%（維持基本細胞功能需求）
    - CP可近乎完全耗竭
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.phosphagen.i08
    q: 能量速率
    a:
    - 三系統中ATP生成速率最快（速率排名#1）
    - 但總容量最小（容量排名#5）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: substrate
  title: 基質耗竭與補充
  desc: ''
  tag: 恢復策略
  items:
  - id: ch03.substrate.i01
    q: CP耗竭速率
    a:
    - 高強度運動5-30秒可下降50-70%
    - 極度衰竭可近乎耗盡
    - 有氧運動耗竭較慢
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.substrate.i02
    q: 磷酸原回補時間
    a:
    - ATP完全回補：3-5分鐘
    - CP完全回補：約8分鐘
    - 主要靠有氧代謝完成
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.substrate.i03
    q: 肌糖原儲量
    a:
    - 全身肌肉300-400g
    - 肝臟70-100g
    - 可受訓練與飲食影響
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.substrate.i04
    q: 糖原耗竭與強度
    a:
    - '>60% VO₂max肌糖原為關鍵能源'
    - 阻力訓練可使肌糖原下降20-60%（少數組數即可）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch03.substrate.i05
    q: 肌糖原回補策略
    a:
    - 運動後每2小時攝取0.7-3.0 g/kg碳水
