      unit: mmol·kg⁻¹·min⁻¹
      of: 50% VO₂max 時的肌糖原分解速率
    - v: 1.4
      unit: mmol·kg⁻¹·min⁻¹
      of: 75% VO₂max 時的肌糖原分解速率
    - v: 3.4
