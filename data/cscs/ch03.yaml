    q: 訓練對磷酸原影響
    a:
    - 訓練對磷酸原濃度的影響尚未充分研究
    - 有氧耐力訓練可能提升靜息磷酸原濃度、降低同絕對強度下的耗竭速率
    - 阻力訓練5週後三頭肌磷酸原靜息濃度增加
    - 短期衝刺與阻力/爆發訓練（6個月）研究未顯示靜息磷酸原改變
    detail: 書中明確說明「訓練對磷酸原濃度的影響尚未充分研究或了解」。不同研究結果不一致：有研究顯示有氧訓練可能提升靜息值，但短期（8 週）衝刺訓練及 6 個月阻力/爆發訓練研究未見靜息值改變。衝刺訓練後因肌肉肥大，總磷酸原含量可能增加。
