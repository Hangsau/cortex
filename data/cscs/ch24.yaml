cards:
- q: 使命聲明（mission statement）的定義與有效使命聲明的標準為何？
  a: 組織的目的聲明。有效使命聲明的標準（Drucker Foundation）：簡短聚焦、清晰易懂、說明組織存在原因、不規定執行方法、範圍充分廣泛、提供道德規範方向、符合組織實踐範圍、激勵承諾。
  tag: mission-goals
- q: 有效使命聲明應包含哪三個關鍵要素？
  a: 1. 目標客層（key market）。2. 提供的服務（contribution）。3. 服務的獨特性（distinction）。
  tag: mission-goals
- q: 訓練計畫目標（program goals）與計畫目標（program objectives）有何區別？
  a: 目標（goals）：廣泛表述期望結果（如提升運動表現、減少傷害）。目標（objectives）：具體達到目標的方法（如訓練計畫設計、指導運動員營養與禁藥知識）。
  tag: mission-goals
- q: 政策（policies）與程序（procedures）在訓練設施的區別為何？
  a: 政策：設施的規則和法規，反映計畫目標與目的。程序：描述如何執行政策的具體步驟。兩者共同確保安全與法律合規。
  tag: mission-goals
- q: S&C 表現團隊（performance team）概念的意義為何？
  a: 將具備不同專業領域知識的人員（解剖生理、生物力學、營養、運動教學、心理）組成合作團隊；透過共同領導整合各領域專業；讓人員在自身專長之外也能拓展知識，分工負責程序設計、動作技術、組織管理與測試評估。
  tag: program-management
- q: S&C 主任（director of strength and conditioning）的主要職責為何？
  a: 監督整體計畫、設施、設備與人員；負責預算、招募、示範、培育、政策的制定與執行；定期評估人員；負責排程安排與設施活動規劃。
  tag: program-management
- q: S&C 專業人員資格的最低要求為何？
  a: 持有獨立認證機構的認證（如 CSCS）；持有標準急救、CPR 和 AED 資格；持續進修教育；了解所屬機構的指導政策。NCAA 第一級於 2015 年立法，要求 S&C 專業人員持有全國認可的認證。
  tag: program-management
- q: 知情同意（informed consent）在法律上的定義為何？
  a: 對參與者詳細說明活動程序以及其固有風險和益處，讓其自行決定是否參與。進行阻力訓練前建議執行此步驟。
  tag: legal-issues
- q: 法律責任（liability）的定義為何？
  a: 法律上的責任、義務或法律上的負債。S&C 專業人員基於就業關係，有義務對所服務的運動員採取行動（傷害發生時）並預防傷害。
  tag: legal-issues
- q: 注意義務標準（standard of care）的定義為何？
  a: 一個理性、謹慎的人在相似情況下會做的事。S&C 專業人員應根據教育程度、訓練層級和認證狀態（CSCS、CPR、AED 等）行事。
  tag: legal-issues
- q: 過失（negligence）的定義與四個要素為何？
  a: '未能如一個理性謹慎的人在相似情況下所做的事。四個要素：

    1. 義務（duty）

    2. 違反義務（breach of duty）

    3. 近因（proximate cause）

    4. 損害（damages）。四者同時存在才可認定為過失。'
  tag: legal-issues
- q: 風险承擔（assumption of risk）的定義為何？
  a: 知道參與活動的固有風险且自願參與。所有運動員應被彻底告知風险，並簽署聲明確認了解；不管如何，固有風险不能完全免除責任。
  tag: legal-issues
- q: 參與前篩選與醫療清除（preparticipation screening and medical clearance）的要求為何？
  a: 運動員進入訓練設施前須展示醫療清除證明（一份簽字聲明即可，不需完整體檢資料）；正在傷後復健或有特殊需求者也須展示醫療清除證明。
  tag: legal-issues
- q: 醫療清除（medical clearance）屬於哪個專業人員的責任範圍？
  a: 許可運動員參與或回歸復健是運動醫學領域的責任（隊醫、運動防護員、物理治療師），而非 S&C 專業人員；診斷或評估醫療狀況不屬於 S&C 專業人員的實踐範圍（scope of practice）。
  tag: legal-issues
- q: 訓練設施需在檔案中保留哪些文件？
  a: 人員資格、專業標準與指引、政策與程序手冊、設備用戶手冊、設備和設施維護記錄、參與前醫療清除證明、知情同意書、訓練日誌和傷害報告表。
  tag: legal-issues
- q: 傷害報告表應保存多久？為何？
  a: 建議無限期保存，或諮詢法律專業人員；因為提起訴訟的時效（statute of limitations）因地區而異。建議永久保存以防訴訟時無檔可查。
  tag: legal-issues
- q: 責任保險（liability insurance）的定義為何？
  a: 保險人承諾在定義的責任風险範圍內，以保險人的費用為被保險人辦護和賞償。S&C 專業人員若沒有設施保險涵蓋應自购職業責任保險。
  tag: legal-issues
- q: 產品責任（product liability）是什麼？如何避免成為共同被告？
  a: 產品責任指製造商或販售商對使用產品導致傷害的法律責任。S&C 專業人員可能成為共同被告。避免方式：確保設備按原本用途使用、不擅自改裝、貼上警示標籤、定期檢查器材狀況。
  tag: legal-issues
- q: 警示標籤未貼在設備上會導致什麼法律風險？
  a: 若標籤未依規貼上且運動員因標籤警示的項目受傷，S&C 專業人員可能被認定有責任。所有新設備附帶的警示標籤應立即貼上。
  tag: legal-issues
- q: 訓練設施紀律裁處的分級制度（tiered penalty system）為何？
  a: 第一次：口頭警告。第二次：禁止入場一天且記錄在案。第三次：禁止入場一週。第四次：禁止入場剩餘學年。第五次：永久禁止入場。懲處應與違規行為成比例且記錄在案。
  tag: facility-rules
- q: 為什麼不應將運動和訓練活動用於懲罰？
  a: 根據特別任務小組指導原則：「不得在任何情況下對運動員施予額外身體負擔，以免增加傷害或突然死亡的風險」。使用運動作為懲罰不獲專業機構支持。
  tag: facility-rules
- q: 訓練設施的新生導入說明會（orientation meeting）應包含哪些內容？
  a: 工作人員聯絡方式與服務說明、訓練時間、設施規則和紀律程序、緊急處理程序、參與前篩選與資格要求、訓練設備正確使用（包含保護動作）、常見風險說明。
  tag: program-management
- q: HIPAA 如何影響 S&C 訓練設施的檔案管理？
  a: 根據 HIPAA，未經書面許可不得公開參與者的醫療資訊，包括運動醫學員工提供的傷害報告。檔案管理須保護醫療資訊的隱私性與機密性，並符合相關標準。
  tag: legal-issues
- q: 監督的九大原則有哪些？
  a: ①始終在場、②積極主動動手實踐、③謹慎且有準備、④具備資格、⑤保持警覺、⑥告知參與者安全與緊急程序、⑦了解參與者健康狀況、⑧監督並執行規則與規範、⑨監控與審視訓練環境。
  tag: supervision
- q: S&C 訓練設施建議的教練與運動員比例為何？
  a: 初中級：1:10；高中級：1:15；大學級：1:20。最小人均地板面積 100 ft²；監督比例較低時，訓練者肌力增益較大。
  tag: supervision
- q: 監督不足與傷害訴訟的關係為何？
  a: 約 80% 的運動傷害訴訟與監督不足有關；不足的指導或監督常是主要原因；所有運動員應持續受到監督，需有具資格的 S&C 專業人員實體在場。
  tag: supervision
- q: 訓練日誌（workout sheet）的要求為何？
  a: 運動員訓練時必須持有核准的訓練日誌並記錄訓練內容；額外訓練須經監督人員核准後方可執行。所有訓練計畫副本應預先在主任辦公室存檔。
  tag: program-management
- q: 訓練設施緊急行動計畫（emergency action plan）的定義為何？
  a: 詳諍處理傷害適當程序的文字文件；全體人員應了解緊急行動計畫並定期演練；緊急計畫應至少每季訓練一次。
  tag: emergency
- q: 緊急行動計畫包含哪些項目？
  a: EMS 啟動程序、設施專屬地址、電話位置、最近出口、緊急物資存放地點、負責處理傷害的人員名單與電話、救護車進出路線、各種緊急情況（火災、龍捲風、危及生命傷害等）的處理方案。
  tag: emergency
- q: 緊急團隊中的四個主要角色為何？
  a: 1. 立即提供傷害處理（時間最關鍵）。2. 緊急物資取得。3. 啟動緊急醫療服務系統（EMS）。4. 指導 EMS 至現場並擔接，提供清楚路線。
  tag: emergency
- q: 訓練設施風险管理（risk management）的定義為何？
  a: 運用策略減少和控制運動參與傷害風险，進而降低責任曝露。第一步是理解關鍵法律術語並識別潛在責任曝露區域。傷害風险無法完全消除，但可有效管理。
  tag: legal-issues
- q: NSCA 類固醒素、輔助品與禁用物質的立場聲明為何？
  a: NSCA 標準 9.1：S&C 專業人員不得處方、推薦或提供點非法、禁用或有害的藥物或補充品；僅可向 18 歲以上人員推薦已被科學證實有益的補充品。
  tag: legal-issues
- q: 實踐範圍（scope of practice）的概念為何？
  a: 專業對應的法律參數和專業責任範圍。S&C 專業人員的實踐範圍不包括診斷或評估醫療狀況；有需要時應賢事專業醫療人員。
  tag: legal-issues
- q: NSCA 職業守則對 S&C 專業人員的核心要求是什麼？
  a: 誠信、專業、對運動員福祉的承諾；避免利益衝突、保密客戶資料、在執業範圍內行事，並持續進修維持專業能力。
  tag: ethics
- q: 什麼是產品責任（product liability），S&C 人員如何降低器材相關訴訟風險？
  a: 製造商或販售商對有缺陷器材造成的傷害負法律責任；S&C 人員應：①定期檢查器材 ②發現缺陷立即下架並記錄 ③按製造商規範使用 ④保存完整維護紀錄。
  tag: legal
- q: 緊急準備（staff preparedness）的六大要素是什麼？
  a: ①持有 CPR/AED 認證 ②持有急救認證 ③熟記緊急行動計畫（EAP）④知道緊急設備位置 ⑤熟悉通訊系統 ⑥定期進行 EAP 演練。
  tag: emergency
- q: 訓練設施對緊急應變人員的最低資格要求是什麼？
  a: 所有設施開放時段至少一名工作人員須為受訓急救人員（first responder），建議具備 EMT 水準或同等訓練，確保能在 EMS 抵達前提供有效初步處置。
  tag: emergency
- q: 緊急通訊（emergency communication）在訓練設施中包含哪些要素？
  a: EAP 中須明確指定：①負責撥打緊急電話的人員 ②指定電話號碼（EMS、設施內線）③通訊廣播系統 ④負責向上報告的人員 ⑤確認通訊設備定期測試正常運作。
  tag: emergency
- q: 緊急設備（emergency equipment）訓練設施必須備有哪些？
  a: 必備：AED、急救箱、血壓帶、氧氣瓶（若適用）、擔架與搬運器具；所有設備須標示清晰、定期檢查，且所有人員都須知道存放位置。
  tag: emergency
- q: 纜線磨損（worn cable）造成運動員傷害，這屬於過失（negligence）的哪一要素？
  a: 屬於「違反義務」（breach of duty）：S&C 專業人員有責任定期檢查器材，未發現並修繕磨損纜線，構成在專業注意標準下的責任缺失。
  tag: legal
- q: 訓練設施使用資格標準（eligibility criteria）包括哪些項目？
  a: 常見標準：①完成參與前健康篩查 ②簽署知情同意書 ③未成年人須有家長或監護人入學同意書 ④參加新生訓練說明會 ⑤更新緊急聯絡資訊 ⑥由授權人員確認訓練資格。
  tag: administration
- q: 外部組織使用訓練設施需滿足哪些條件？
  a: 常見要求：①簽署正式協議書 ②持有責任保險證明 ③避免占用專項組隊訓練時間 ④遵守設施規則 ⑤確認參加者資格等。
  tag: administration
- q: 訓練排期（scheduling）的優先原則及常見解決方案是什麼？
  a: 訓練季組隊指定時間優先；非訓練季可彈性安排。常見衝突解決方案：採用週一／三／五（Mon-Wed-Fri）排期，讓賽季隊伍在週二／四使用設施；不同組隊輪流使用或錯開排程。
  tag: administration
- q: 新生訓練說明會（orientation meeting）應涵蓋哪些內容？
  a: ①設施規則和行為準則 ②緊急行動計畫（EAP）③知情同意與簽署程序 ④健康篩查和傷後回歸安排 ⑤目標設定和訓練期望 ⑥補充品政策和禁藥規定。
  tag: administration
- q: 訓練計畫寫入紀錄（program design on file）的要求是什麼？
  a: 所有員工設計的訓練計畫（即動作清單）應在隊伍開始執行前存檔於主任辦公室，內容包括目標、分期、負荷、量與次數；使管理人員能驗證計畫的針對性與特殊需求。
  tag: administration
- q: 訓練日誌（workout sheet）需記錄哪些資訊？
  a: 訓練日期、動作名稱、次數、組數、負荷重量、出席情況、傷病記錄和新觀察等；日誌是法律上的重要文件，展示了監督落實情形與特殊需求的回應。
  tag: administration
- q: 如何區分政策（policies）與程序（procedures）？兩者各有何作用？
  a: 政策是原則性指導方针（why/what），說明機構立場和行為標準；程序是操作指導步驟（how），說明具體如何執行政策。兩者相輔，同時有助於一致性和責任清晰。
  tag: administration
- q: HIPAA 對 S&C 專業人員的影響是什麼？
  a: HIPAA 要求保護運動員的個人健康資訊（PHI）；S&C 專業人員不得在未經授權下將傷病紀錄或醫療資訊分享給第三方，需遵循所屬機構內部指導原則。
  tag: legal
- q: S&C 專業人員的指導（instruction）在法律與安全面向有哪些要求？
  a: 指導涉及以安全方式教導運動員技能並在必要時糾正；應強調安全與正確技術而非重量多寡，以降低傷害發生率與法律風險；應採用符合專業指引與標準的教學方法、程序與進階原則。
  tag: instruction
- q: 主任訓練師（S&C director）的責任範圍涵蓋哪些頂層項目？
  a: ①設定領導方向和目標 ②招募、訓練和評估員工人員 ③制定政策和程序 ④監控預算和各類資源配置 ⑤傷害預防管理和風險控制 ⑥維護訓練設施和器材安全。
  tag: administration
- q: 參與前健康篩查及醫療授權是否屬於 S&C 專業服務範圍？
  a: 不屬於。參與前健康篩查（preparticipation screening）和醫療授權（medical clearance）是醫師和醫療專業人員的責任；S&C 專業人員需尊重該專業界限，不得逾越執業範圍行醫，否則將面臨法律訴訟責任。
  tag: legal
- q: 責任保險（liability insurance）對 S&C 專業人員的重要性是什麼？
  a: 責任保險對傷害訴訟提供法律辯護與賠償保障；專業人員應確保自身持有獨立保險，不能僅靠所屬高校或機構的團體保險，因為團體保險未必涵蓋個人所有行為。
  tag: legal
