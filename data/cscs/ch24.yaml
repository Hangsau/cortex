id: ch24
weight: 24
title: Ch.24 Facility Policies, Procedures & Legal Issues
topics:
- id: administration
  title: 任務與目標 Administration
  desc: ''
  tag: Administration
  items:
  - id: ch24.administration.i01
    q: 使命聲明（mission statement）的定義與有效條件
    a:
    - 是組織宗旨的聲明，為肌力與體能計畫提供焦點與方向
    - 應簡短聚焦、清楚易懂、說明組織存在的原因、不規定手段且範圍廣泛
    - 應為遵守倫理守則提供方向、符合組織的執業範圍，並激發承諾
    detail: 有效使命聲明是行政工作的基礎；書中強調先以預期結果為念，再形成聲明。
    terms:
    - mission-statement
    numbers: []
    concepts:
    - professional
    related:
    - ch23.four-phases.i07
    locator: Mission Statement and Program Goals
  - id: ch24.administration.i02
    q: 使命聲明（mission statement）的三項組成
    a:
    - 目標客群（key market）
    - 所提供的服務（contribution）
    - 使該服務具特色的部分（distinction）
    detail: 三項組成分別回答「服務誰、提供什麼、何以不同」，而非列出達成服務的操作手段。
    terms:
    - mission-statement
    - key-market
    - contribution
    - distinction
    numbers: []
    concepts:
    - professional
    related: []
    locator: Mission Statement and Program Goals
  - id: ch24.administration.i03
    q: 計畫目標（program goals）的意義
    a:
    - 是以廣泛、概括方式陳述的肌力與體能計畫預期終點
    - 有效計畫應以科學原理為據，提升表現與增加抗傷害能力
    - 預期結果應依運動種類及運動員在該運動中的位置而定
    detail: 計畫目標描述「要到哪裡」；書中把其運動專項性與運動員位置直接連在一起。
    terms:
    - program-goals
    numbers: []
    concepts:
    - professional
    related:
    - ch17.principles-exam-tips.i04
    locator: Mission Statement and Program Goals
  - id: ch24.administration.i04
    q: 計畫目的（program objectives）的角色與範圍
    a:
    - 是達成計畫目標的具體手段；若未說明達成途徑，運動員可能無法達到目標
    - 應涵蓋計畫的所有領域，例如訓練設計、個別差異、生理反應、營養及增強表現物質教育
    detail: 書中以「手段」界定目的，並把跨專業人員的資源運用視為達成這些目的的方法。
    terms:
    - program-objectives
    numbers: []
    concepts:
    - professional
    related:
    - ch17.principles-exam-tips.i04
    - ch09.sports-dietitian-role.i03
    locator: Program Objectives
  - id: ch24.administration.i05
    q: 政策（policies）與程序（procedures）如何區分
    a:
    - 政策是設施的規則與規範，反映計畫目標與目的
    - 程序說明如何符合或執行政策
    detail: 政策與程序的設計基礎是計畫目標與目的；書中亦要求納入降低訴訟風險的要素。
    terms:
    - policies
    - procedures
    numbers: []
    concepts:
    - professional
    related: []
    locator: Mission Statement and Program Goals
  - id: ch24.administration.i06
    q: 建立標準照護與計畫方向的協作責任
    a:
    - 建立標準照護（standard of care）是協作責任
    - 使命聲明與計畫目的應讓肌力與體能部門、機構行政及運動醫學部門共同參與
    detail: 廣泛參與可使各群體與個人產生主人翁意識並承諾實現使命、目標與目的。
    terms:
    - standard-of-care
    - mission-statement
    - program-objectives
    numbers: []
    concepts:
    - professional
    related:
    - ch22.sports-medicine-team.i08
    locator: Mission Statement and Program Goals
  - id: ch24.administration.i07
    q: 肌力與體能表現團隊（strength and conditioning performance team）的分工原則
    a:
    - 由具互補技能與特定專長的人員組成，以合作專業知識支援計畫目的
    - 主任依人員的科學基礎專長，分派課程設計、動作技術、組織行政、測試評估及聯絡工作
    detail: 團隊除整合專長，也提供成員學習自身專長以外知識的機會；共同領導角色是原文指引的一部分。
    terms:
    - strength-and-conditioning-performance-team
    numbers: []
    concepts:
    - professional
    related:
    - ch22.sports-medicine-team.i04
    locator: Strength and Conditioning Performance Team
  - id: ch24.administration.i08
    q: 目標、目的與定向說明會的檢討時機
    a:
    - 每學年或運動季開始時，應舉行年度定向說明會，使人員、運動教練與參與者熟悉既定的目標、目的、政策與程序
    - 應定期重新評估與檢討目標及目的
    detail: 這項定向安排出現在使用表現團隊達成計畫目的的脈絡中，不限於對運動員單獨說明。
    terms:
    - orientation-meeting
    - program-goals
    - program-objectives
    numbers: []
    concepts:
    - professional
    related:
    - ch20.periodization.i08
    locator: Program Objectives
- id: emergency
  title: 緊急應變計畫 Emergency EAP
  desc: ''
  tag: Emergency
  items:
  - id: ch24.emergency.i01
    q: 緊急行動計畫（emergency action plan, EAP）是什麼
    a:
    - 是詳述照護傷害正確程序的書面文件
    - 應涵蓋環境情境、危及生命與非危及生命情境的應變程序
    - 設施所有人員都必須知道計畫與處理緊急狀況的正確程序
    detail: 緊急狀況與運動傷害可隨時、隨地發生；事件發生時，生命安全永遠是首要優先。
    terms:
    - emergency-action-plan
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch12.safety.i01
    locator: Emergency Planning and Response
  - id: ch24.emergency.i02
    q: 緊急計畫的典型內容
    a:
    - 緊急醫療服務（emergency medical services, EMS）啟動程序，以及主要、次要與第三聯絡人的姓名和電話
    - 設施的明確地址、電話與最近出口的位置，以及救護車進入路線
    - 可照護傷害的指定合格人員、緊急用品與急救箱位置
    - 對火災、龍捲風、危及生命傷害、犯罪、恐怖攻擊等情況的行動計畫
    detail: 地址的用途是為 EMS 指路；計畫須寫明具體設施資訊，不只是一般性的聯絡指示。
    terms:
    - emergency-action-plan
    - emergency-medical-services
    - first-aid
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.layout.i08
    locator: Emergency Planning and Response > Components of an Emergency Action Plan
  - id: ch24.emergency.i03
    q: 緊急團隊的四個主要角色
    a:
    - 立即照護運動員
    - 取得緊急設備
    - 啟動緊急醫療服務系統（EMS）
    - 由已熟悉設施位置的人員引導 EMS 到現場，並保持供運輸車輛快速進出的淨空路線
    detail: 個別成員角色可不同；清楚理解角色才能讓緊急團隊有效運作，而立即照護以時間為最關鍵因素。
    terms:
    - emergency-medical-services
    - emergency-action-plan
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch22.sports-medicine-team.i08
    locator: Emergency Planning and Response > Roles Within the Emergency Team
  - id: ch24.emergency.i04
    q: 緊急應變人員與醫療涵蓋的要求
    a:
    - 應以協作方式建立計畫，決定所需且適切的醫療涵蓋
    - 計畫應確保能立即或經規劃取得醫師，以便及時評估情況
    - 肌力與體能專業人員及參與練習、技術指導與肌力體能活動的人員，應取得並維持專業認證、標準急救、心肺復甦術（cardiopulmonary resuscitation, CPR）與自動體外心臟去顫器（automated external defibrillator, AED）資格
    detail: 原文將肌力與體能專業人員定位為潛在的第一反應者，但未指定設施開放時必須有某一固定職級或人數。
    terms:
    - strength-and-conditioning-professional
    - first-aid
    - cardiopulmonary-resuscitation
    - automated-external-defibrillator
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch22.sports-medicine-team.i01
    - ch22.sports-medicine-team.i02
    locator: Emergency Planning and Response > Emergency Personnel
  - id: ch24.emergency.i05
    q: 緊急通訊（emergency communication）的安排
    a:
    - 建立直接通訊管道並制定備援計畫
    - 若醫療人員不在現場，可使用市內電話或行動電話
    - 參與者與督導者都應知道最近可用電話位於設施內或外的何處
    detail: 原文只要求直接通訊、備援與可用電話位置，未列指定通話人、廣播系統或定期設備測試等細節。
    terms:
    - emergency-action-plan
    - emergency-communication
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.design-elements.i08
    locator: Emergency Planning and Response > Emergency Communication
  - id: ch24.emergency.i06
    q: 緊急設備（emergency equipment）的可近性與準備
    a:
    - 緊急設備在緊急情況下應隨時可取得
    - 維持標準急救、CPR 與 AED 專業認證，表示人員已預先受過正確使用的訓練
    - 第一反應者應定期演練；醫療人員應能取得參與者的緊急資訊
    detail: 本節沒有列出 AED、氧氣、擔架或血壓計等固定設備清單；核心是可近性、事前訓練與資訊可取得性。
    terms:
    - first-aid
    - cardiopulmonary-resuscitation
    - automated-external-defibrillator
    - emergency-equipment
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.maintenance.i06
    locator: Emergency Planning and Response > Emergency Equipment
  - id: ch24.emergency.i07
    q: 緊急行動計畫的張貼、認證與演練頻率
    a:
    - 將緊急照護計畫張貼於清楚可見處
    - 所有肌力與體能專業人員維持有效的急救與 CPR 認證
    - 至少每季演練一次緊急行動計畫
    detail: 張貼不取代實作；原文把維持認證與至少每季演練並列為關鍵要求。
    terms:
    - emergency-action-plan
    - first-aid
    - cardiopulmonary-resuscitation
    numbers:
    - v: 至少每季 1
      unit: 次
      of: 緊急行動計畫演練頻率
    concepts:
    - safety
    - professional
    related:
    - ch23.maintenance.i01
    locator: Emergency Planning and Response > Components of an Emergency Action Plan
  - id: ch24.emergency.i08
    q: 緊急事件或傷害的通報與紀錄
    a:
    - 為風險管理建立指揮鏈，可包括運動教練、肌力與體能主任、運動醫學人員及運動部門主任
    - 發生傷害時，應完成事故－傷害報告表（incident–injury report form）並存檔
    - 應盡力保護參與者的隱私與機密性
    detail: 原文列舉指揮鏈可能成員，不是固定的逐級通報順序；健康資訊的揭露另受書面授權限制。
    terms:
    - risk-management
    - incident-injury-report-form
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch22.sports-medicine-team.i08
    locator: Staff Policies and Activities > Reporting and Documentation
- id: ethics-records
  title: 行政與職業規範 Ethics & Records
  desc: ''
  tag: Ethics & Records
  items:
  - id: ch24.ethics-records.i01
    q: 倫理守則（code of ethics）的作用
    a:
    - 是專業人員必須負責遵守的標準與原則
    - 專業組織通常有會員必須同意遵守並於實務採用的倫理或行為守則
    - 其目的在建立專業性與高倫理行為標準，並保護個人權利與尊嚴
    detail: 肌力與體能專業人員應熟悉 NSCA 及所屬機構的倫理守則；運動員福祉通常是主要焦點。
    terms:
    - code-of-ethics
    - national-strength-and-conditioning-association
    numbers: []
    concepts:
    - professional
    related:
    - ch09.sports-dietitian-role.i03
    locator: Staff Policies and Activities > Code of Ethics and Professionalism
  - id: ch24.ethics-records.i02
    q: 計畫與設施應保存的作業紀錄
    a:
    - 人員資格、專業標準與指引、書面緊急計畫及操作與安全政策、程序
    - 製造商提供的器材使用手冊，以及器材與設施的檢查、維護、清潔和修理紀錄
    - 參與前醫療放行、回歸參與放行、知情同意、放棄請求及個人契約等保護性法律文件
    - 訓練日誌、評估紀錄與指導註記
    detail: 這是「另應建立並保存」的營運紀錄；年度定向說明會中，參與者應完成並簽署其中的法律文件。
    terms:
    - policies
    - procedures
    - preparticipation-screening
    - medical-clearance
    - informed-consent
    - emergency-action-plan
    numbers: []
    concepts:
    - professional
    related:
    - ch23.maintenance.i04
    locator: Staff Policies and Activities > Reporting and Documentation
  - id: ch24.ethics-records.i03
    q: HIPAA 對參與者健康資訊的限制
    a:
    - 為保護參與者隱私與機密性應盡力而為
    - 依健康保險可攜與責任法案（Health Insurance Portability and Accountability Act, HIPAA），未獲書面授權不得揭露參與者的健康照護資訊
    - 此限制包括運動醫學人員提供的傷害報告
    detail: 原文只明示「書面授權」是健康資訊揭露的條件，沒有指定另行的系統存取管制做法。
    terms:
    - health-insurance-portability-and-accountability-act
    numbers: []
    concepts:
    - professional
    related:
    - ch09.sports-dietitian-role.i05
    locator: Staff Policies and Activities > Reporting and Documentation
  - id: ch24.ethics-records.i04
    q: 責任保險（liability insurance）的內容與適用情境
    a:
    - 因運動參與可能受傷，若不受設施保單保障，肌力與體能人員應購買專業責任保險
    - 保險人以保費為對價，承諾在定義的責任上限內、自費為被保險人辯護並補償特定責任風險
    detail: 原文建議向人力資源管理者、法律顧問或專業組織取得進一步資訊，並未保證任何團體保險一定不涵蓋個人行為。
    terms:
    - liability-insurance
    - liability
    numbers: []
    concepts:
    - professional
    related: []
    locator: Legal and Ethical Issues > Liability Insurance
  - id: ch24.ethics-records.i05
    q: 風險管理（risk management）的定義與起點
    a:
    - 是採取策略降低與控制運動參與造成的受傷風險，因而降低責任暴露
    - 首要步驟是理解關鍵術語，並找出可能致傷及引發訴訟的責任暴露區域
    detail: 傷害風險不能完全排除，但書中認為肌力與體能專業人員可以有效管理它。
    terms:
    - risk-management
    - liability
    numbers: []
    concepts:
    - professional
    related:
    - ch18.safety.i08
    locator: Legal and Ethical Issues
  - id: ch24.ethics-records.i06
    q: 政策與程序手冊的目的
    a:
    - 為實施安全且有效的計畫與服務提供藍圖
    - 應納入保護計畫及其員工免於訴訟風險的要素，例如指導與督導、設施管理、緊急行動計畫及應變
    detail: 原文的結論建議每個設施都有自身獨特的手冊，並就本章涵蓋的各主題提供指引。
    terms:
    - policies
    - procedures
    - emergency-action-plan
    numbers: []
    concepts:
    - professional
    related:
    - ch23.four-phases.i08
    locator: Mission Statement and Program Goals
  - id: ch24.ethics-records.i07
    q: 專業性政策可涵蓋的其他範圍
    a:
    - 可處理霸凌、霸凌入會儀式（hazing）與社群媒體指引
    - 可為儀容或服裝規範、電話使用、個人訓練、公司器材的個人使用設立特定政策
    - 可訂定教練－運動員、教練－實習生、教練－運動教練關係及重量室行為的標準
    detail: 這些書面原則旨在提升計畫效能並促進高度誠信，並非原文列出的強制且完整清單。
    terms:
    - code-of-ethics
    - policies
    numbers: []
    concepts:
    - professional
    related: []
    locator: Staff Policies and Activities > Code of Ethics and Professionalism
  - id: ch24.ethics-records.i08
    q: 課程設計（program design）的主任督導與存檔
    a:
    - 有效計畫應以科學原理為據，提升表現及增加抗傷害能力，且強度應在 NSCA 標準與指引內
    - 肌力與體能主任應督導及監測所有表現訓練計畫，包括再訓練（reconditioning）
    - 工作人員設計的每份計畫（即待執行動作清單）應在隊伍開始前經審查並存於主任辦公室
    detail: 原文未要求運動醫學人員為每一份再訓練計畫會簽；其要求是主任督導、監測、審查與存檔。
    terms:
    - program-design
    - strength-and-conditioning-professional
    - reconditioning
    - national-strength-and-conditioning-association
    numbers: []
    concepts:
    - professional
    related:
    - ch17.principles-exam-tips.i04
    - ch22.sports-medicine-team.i04
    locator: Staff Policies and Activities > Program Design
- id: facility
  title: 設施管理 Facility
  desc: ''
  tag: Facility
  items:
  - id: ch24.facility.i01
    q: 產品責任（product liability）的定義與對專業人員的風險
    a:
    - 指製造或販售產品者，因他人使用產品而受傷或受損時所負的法律責任
    - 即使肌力與體能專業人員不製造或販售產品，也可能在產品責任訴訟中被列為共同被告
    - 判斷製造商或賣方是否負責的兩項關鍵考量，是產品是否已改變原售狀態，以及是否依製造商意圖使用
    detail: 產品責任本身僅適用於從事製造或銷售的人，但某些行為可使製造商或賣方的責任失效，而使責任落到專業人員身上。
    terms:
    - product-liability
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch23.maintenance.i04
    locator: Legal and Ethical Issues > Product Liability
  - id: ch24.facility.i02
    q: 降低器材產品責任風險的使用與採購原則
    a:
    - 僅依製造商預定用途使用器材，並參考隨附說明資料中的使用者年齡及體型規格
    - 確認器材符合既有專業標準與指引，留意召回資訊並立即退還已召回的器材
    - 向信譽良好的製造商購買，並且只在產品資料明確指定且附有說明時改裝器材
    - 將新購器材隨附的所有警告標籤貼在清楚可見處
    detail: 產品若設計為可為特定需求調整，仍必須完全依其改裝指示操作；警示標籤未置於明顯處而發生相關傷害時，專業人員可能負責。
    terms:
    - product-liability
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch23.maintenance.i06
    locator: Legal and Ethical Issues > Product Liability
  - id: ch24.facility.i03
    q: 器材損壞與磨耗的檢查及處置
    a:
    - 持續檢查可能使運動員受傷的器材損壞與磨耗，且新購器材使用前必須檢查
    - 新器材到貨已損壞時，應立即通知製造商或賣方更換；既有器材損壞時，應移除以修理或更換
    - 器材過大無法移除或沒有儲放空間時，應貼上不得使用的標示
    - 不讓運動員在無督導下使用器材
    detail: 為辨識問題，專業人員必須了解器材的用途、能力與限制，以及器材可能致傷的方式；持續督導亦能確保依預定用途及正確技術使用。
    terms:
    - product-liability
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch23.maintenance.i04
    locator: Legal and Ethical Issues > Product Liability
  - id: ch24.facility.i04
    q: 設施排程的優先原則與例示方案
    a:
    - 排程時考量哪種訓練型態能影響最多運動員；在器材、時間及適當督導比例限制下，目標是讓專業人員服務最多運動員
    - 季內隊伍通常優先於季外隊伍，因其訓練排程往往須配合練習與比賽
    - 可將季外隊伍排在週一、三、五，使季內隊伍使用週二、四；若週五比賽衝突，可將不同季外隊伍分排週一、二、四及週二、四、五
    detail: 小型大專院校或高中可能無法同時容納多隊，季外隊伍因而可能需清晨訓練；也可在一般下午練習時段安排季外隊伍、把季內隊伍排在較早或較晚時段以減少擁擠。
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch23.needs-analysis.i05
    locator: Facility Administration
  - id: ch24.facility.i05
    q: 設施規則與指引的安全重點
    a:
    - 參與前完成篩查與放行、接受阻力訓練風險與正確動作定向說明、持有並遵循訓練單
    - 所有槓鈴兩端使用鎖扣；只在深蹲架或力量架內深蹲；所有爆發力動作在平台使用緩衝槓片
    - 使用背部或前肩承槓，以及槓鈴或啞鈴經過臉部或頭頂的動作時應有保護者；爆發力動作不保護
    - 立即向當班督導者通報設施相關傷害、設施或器材異常
    detail: 原文的完整規則清單還包含歸還重量、服裝、禁止飲酒與禁用物質等；規則與指引應張貼於訓練區的明顯處。
    terms:
    - preparticipation-screening
    - workout-sheet
    - spotting
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch15.power-exercises-technique.i01
    - ch15.spotting-when.i03
    locator: Facility Administration > Figure 24.6 Facility Rules and Guidelines
  - id: ch24.facility.i06
    q: 補充品（supplements）、增補劑與禁用物質的專業界線
    a:
    - 不得為任何目的處方、推薦或提供非法、禁止或對參與者有害的藥物、管制物質或補充品
    - 只可推薦或提供合法且經科學證實有益、或至少無害的物質
    - 此類推薦或提供只限年滿 18 歲者
    detail: 各運動管理機構的規則可能不同；專業人員有責任掌握相關規範及支持或反駁補充品效力的科學證據，並建議諮詢運動營養師或營養師。
    terms:
    - supplements
    - ergogenic-aids
    - banned-substances
    - strength-and-conditioning-professional
    numbers:
    - v: 18
      unit: 歲
      of: 可由肌力與體能專業人員推薦或提供合法補充品的參與者最低年齡
    concepts:
    - professional
    - safety
    - ergogenic
    related:
    - ch11.anabolic-supplements.i03
    - ch09.sports-dietitian-role.i02
    locator: Legal and Ethical Issues > Supplements, Ergogenic Aids, and Banned Substances
  - id: ch24.facility.i07
    q: 定向說明會（orientation meeting）應說明的事項
    a:
    - 通常在學年或運動季開始、運動員及運動教練首次使用設施前舉行
    - 說明設施及人員電話、工作人員服務、計畫目標、目的與使命、開放時間及隊伍訓練時程
    - 說明設施規則與紀律處置、緊急程序、參與前篩查與使用資格
    - 阻力訓練定向應涵蓋正確器材使用、適用時的保護技術、正確動作執行及錯誤或不專心技術的常見風險
    detail: 原文將說明會對象列為運動員與運動教練，並以首次使用設施為安排時機。
    terms:
    - orientation-meeting
    - preparticipation-screening
    - spotting
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch15.exercise-technique-fundamentals.i07
    locator: Staff Policies and Activities > Orientation Meeting
  - id: ch24.facility.i08
    q: 開館與閉館程序的涵蓋範圍
    a:
    - 通常依設施的日常營運、檢查及清潔建立政策
    - 可考慮為假日或學校學期行事曆、音響或音樂使用、辦公時間、儲放及員工置物室活動訂定特定操作程序
    detail: 書面原則的目的是提升設施效率並促進計畫效能；其具體應用須依各設施的獨特特性而定。
    terms:
    - policies
    - procedures
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch23.maintenance.i01
    locator: Facility Administration
- id: legal
  title: 法律術語 Legal
  desc: ''
  tag: Legal
  items:
  - id: ch24.legal.i01
    q: 知情同意（informed consent）的定義
    a:
    - 向參與者描述某項程序或活動
    - 說明其中的固有風險與益處，使個人可決定是否願意參與
    detail: 知情同意的重點是讓個人基於風險與益處資訊做參與決定；本節未規定阻力訓練前必須採用某一特定表單。
    terms:
    - informed-consent
    numbers: []
    concepts:
    - professional
    related:
    - ch12.administration.i06
    locator: Legal and Ethical Issues > Common Legal Terminology
  - id: ch24.legal.i02
    q: 法律責任（liability）的定義與專業義務
    a:
    - 是法律上的責任、職責或義務
    - 肌力與體能專業人員因受僱關係，對其服務的運動員負有義務
    - 此義務不只在傷害發生時採取行動，也包括預防傷害
    detail: 法律責任與實際受傷風險相連，因此本章將風險管理視為降低責任暴露的策略。
    terms:
    - liability
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    related:
    - ch18.safety.i08
    locator: Legal and Ethical Issues > Common Legal Terminology
  - id: ch24.legal.i03
    q: 標準照護（standard of care）的定義
    a:
    - 指合理且謹慎的人在相似情況下會做的事
    - 肌力與體能專業人員應依其教育、訓練程度與認證狀態行事
    detail: 原文以 CSCS、NSCA-CPT、EMT、CPR、AED 及急救等認證作為認證狀態的例子，而非將某一張證照定為所有情況的唯一標準。
    terms:
    - standard-of-care
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    related:
    - ch15.exercise-technique-fundamentals.i07
    locator: Legal and Ethical Issues > Common Legal Terminology
  - id: ch24.legal.i04
    q: 過失（negligence）的定義與成立要素
    a:
    - 是未如合理且謹慎的人在相似情況下行事
    - 要認定肌力與體能專業人員過失，必須同時有義務（duty）、違反義務（breach of duty）、近因（proximate cause）及損害（damages）
    detail: 原文將近因說明為可合理預見事件的自然、持續序列；損害可為對他人的身體或經濟傷害。
    terms:
    - negligence
    - duty
    - breach-of-duty
    - proximate-cause
    - damages
    numbers:
    - v: 4
      unit: 項
      of: 認定肌力與體能專業人員過失必須同時具備的要素
    concepts:
    - professional
    related:
    - ch24.facility.i03
    locator: Legal and Ethical Issues > Common Legal Terminology
  - id: ch24.legal.i05
    q: 風險承擔（assumption of risk）的定義
    a:
    - 知道參與活動具有固有風險，仍自願決定參與
    - 所有運動活動（包括肌力與體能訓練）都有一定程度的風險
    - 應徹底告知運動員風險，並請其簽署相應聲明
    detail: 本項說明參與者知悉風險並自願參加，不能取代專業人員採取適當安全預防措施的責任。
    terms:
    - assumption-of-risk
    numbers: []
    concepts:
    - professional
    related:
    - ch24.screening.i06
    locator: Legal and Ethical Issues > Common Legal Terminology
  - id: ch24.legal.i06
    q: 磨耗纜線的過失判例說明
    a:
    - 專業人員看見阻力訓練機器的纜線嚴重磨耗並注意到此事，卻未修理或張貼「停止使用」標示
    - 運動員使用該器材後受傷時，專業人員可能被認定有過失
    detail: 例中的義務是修理纜線或張貼標示；未採取行動是違反義務，傷害則發生於可預見的連續事件序列中。
    terms:
    - negligence
    - duty
    - breach-of-duty
    - out-of-order
    numbers: []
    concepts:
    - professional
    related:
    - ch23.maintenance.i04
    locator: Legal and Ethical Issues > Common Legal Terminology
  - id: ch24.legal.i07
    q: 執業範圍（scope of practice）與醫療放行的界線
    a:
    - 肌力與體能專業人員的執業範圍不包括診斷或評估個人的醫療或健康狀況
    - 僅運動醫學人員可提供醫療放行及其證明，並回答參與相關問題
    detail: 運動醫學人員包括認證運動防護員、醫師或物理治療師；此專業界線適用於新進者，也適用於傷病恢復中的運動員。
    terms:
    - scope-of-practice
    - medical-clearance
    - strength-and-conditioning-professional
    - athletic-trainer
    - physical-therapist
    numbers: []
    concepts:
    - professional
    related:
    - ch22.sports-medicine-team.i04
    locator: Legal and Ethical Issues > Preparticipation Screening and Medical Clearance
  - id: ch24.legal.i08
    q: 訴訟時效（statute of limitations）與傷害紀錄保存
    a:
    - 是個人可以提起訴訟的期間
    - 該期間在美國各州及世界各地不同
    - 傷害報告表應盡可能長久保存；良好作法是無限期保存檔案或諮詢法律權威
    detail: 保存建議源於時效因地而異，並非教材宣告所有地區都有同一固定年限。
    terms:
    - statute-of-limitations
    numbers: []
    concepts:
    - professional
    related: []
    locator: Legal and Ethical Issues > Record Keeping
- id: personnel
  title: 人員資格 Personnel
  desc: ''
  tag: Personnel
  items:
  - id: ch24.personnel.i01
    q: 肌力與體能主任（director of strength and conditioning）的整體職責
    a:
    - 對整體肌力與體能計畫、設施、器材、工作人員及預算等行政事務負責
    - 指揮人員、計畫與設施運作，設計或最終審查所有訓練計畫，並督導器材選擇、安裝、維護、清潔及修理
    - 安排人員工作與督導時程、分派工作並評估表現，且協調各隊及個別學生運動員的設施使用時間
    detail: 主任同時是實務工作者與行政管理者；原文的職務範例另包括遵守機構與管理組織規則、執行定向說明與持續維持專業認證。
    terms:
    - director-of-strength-and-conditioning
    - program-design
    numbers: []
    concepts:
    - professional
    related:
    - ch23.needs-analysis.i05
    locator: Strength and Conditioning Performance Team > Director of Strength and Conditioning (Head Strength and Conditioning Coach) > Figure 24.2 Responsibilities of the Strength and Conditioning Director
  - id: ch24.personnel.i02
    q: NCAA 第一級對肌力與體能教練的認證立法
    a:
    - 2015 年 8 月 1 日，NCAA 第一級採納立法
    - 該立法指定肌力與體能教練必須通過全國認可的肌力與體能認證計畫取得認證，並維持有效認證
    detail: 本節以此立法說明獨立認可組織的認證可建立標準照護。
    terms:
    - national-collegiate-athletic-association
    - standard-of-care
    numbers:
    - v: '2015-08-01'
      unit: 日期
      of: NCAA 第一級採納肌力與體能教練認證立法的日期
    concepts:
    - professional
    related:
    - ch23.safety-electrical.i06
    locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications)
  - id: ch24.personnel.i03
    q: 肌力與體能人員應維持的認證
    a:
    - 應持有獨立認可組織的專業認證，例如肌力與體能認證專家（Certified Strength and Conditioning Specialist, CSCS）
    - 助理肌力與體能專業人員也應取得並維持專業認證，以及標準急救、CPR 與 AED 認證
    detail: 書中以 CSCS 作為例示，並以「應」描述助理人員的資格；並非將所有人限縮為同一張認證。
    terms:
    - certified-strength-and-conditioning-specialist
    - first-aid
    - cardiopulmonary-resuscitation
    - automated-external-defibrillator
    numbers: []
    concepts:
    - professional
    related:
    - ch22.sports-medicine-team.i04
    locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications)
  - id: ch24.personnel.i04
    q: 繼續教育（continuing education）的專業意義
    a:
    - 是維持專業認證的必要部分
    - 有助於降低責任暴露，特別是在督導與指導領域
    - 訴訟常涉及「專業指導者資格」問題，而該資格包括繼續教育
    detail: 原文把繼續教育同時視為專業認證維護與降低督導、指導風險的措施。
    terms:
    - liability
    - strength-and-conditioning-professional
    - continuing-education
    numbers: []
    concepts:
    - professional
    related:
    - ch15.exercise-technique-fundamentals.i07
    locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications)
  - id: ch24.personnel.i05
    q: 人員準備（staff preparedness）的主要範圍
    a:
    - 維持專業認證以及標準急救、CPR、AED 認證，並檢討緊急應變程序
    - 了解計畫政策、程序、房間容量、安全督導比例及參與前篩查與放行程序
    - 了解個人與專業責任、過失、保險、管理組織規則、清潔維護需求，以及計畫理念與指導方法
    detail: 緊急應變程序的檢討包括每年基本急救程序、常見設施傷害及預防與建築疏散計畫；動機議題也包括避免將運動員推過生理極限。
    terms:
    - first-aid
    - cardiopulmonary-resuscitation
    - automated-external-defibrillator
    - emergency-action-plan
    - policies
    - procedures
    - liability
    - negligence
    - staff-preparedness
    numbers: []
    concepts:
    - professional
    related:
    - ch23.needs-analysis.i01
    locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications) > Figure 24.4 Points of Preparedness Required of Each Staff Member
  - id: ch24.personnel.i06
    q: 教材對 CSCS 專業角色的定義
    a:
    - CSCS 是實際運用基礎知識評估、激勵、教育及訓練運動員，以提升運動表現為主要目標的專業人員
    - 可進行運動專項測試、設計及執行安全有效的肌力與體能計畫，並提供營養與傷害預防指引
    - 其專業領域不同於醫療、營養、運動防護與運動教練；必要時應諮詢並轉介這些專業人員
    detail: 此定義出自《Strength and Conditioning Professional Standards and Guidelines》附錄 A，直接界定 CSCS 的專業邊界與轉介責任。
    terms:
    - certified-strength-and-conditioning-specialist
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    related:
    - ch22.sports-medicine-team.i04
    - ch09.sports-dietitian-role.i02
    locator: Strength and Conditioning Performance Team > Strength and Conditioning Staff (Personal Qualifications)
  - id: ch24.personnel.i07
    q: 主任對表現團隊的職務分派
    a:
    - 主任負責向肌力與體能人員清楚劃分適當職務與責任
    - 分派範圍包括課程設計、動作技術、組織與行政、測試與評估
    detail: 表現團隊的協作專長並不取消主任的分派責任；職務分派須考量人員的特定科學基礎專長。
    terms:
    - director-of-strength-and-conditioning
    - strength-and-conditioning-performance-team
    - program-design
    numbers: []
    concepts:
    - professional
    related:
    - ch17.principles-exam-tips.i04
    locator: Strength and Conditioning Performance Team
  - id: ch24.personnel.i08
    q: 學生工作人員評估表的用途與面向
    a:
    - 評估程序用以評量個別表現，凸顯學生工作人員的傑出貢獻或不足、改善工作表現、決定適當人事措施及促進個人發展
    - 範例表涵蓋溝通、承擔責任與領導、態度等面向
    - 可用於評估學生實習生，並調整為更適合表現團隊成員的評估工具
    detail: 主任應定期評估工作人員的專業表現及其專業目標達成情形；表格只是可調整使用的範例。
    terms:
    - director-of-strength-and-conditioning
    - strength-and-conditioning-performance-team
    numbers: []
    concepts:
    - professional
    related:
    - ch12.administration.i01
    locator: Strength and Conditioning Performance Team > Director of Strength and Conditioning (Head Strength and Conditioning Coach) > Figure 24.3 Student Staff Evaluation
- id: screening
  title: 參與前篩查 Screening
  desc: ''
  tag: Screening
  items:
  - id: ch24.screening.i01
    q: 參與前篩查（preparticipation screening）與醫療放行的基本要求
    a:
    - 運動員在獲准進入肌力與體能設施前，必須依相關管理組織完成篩查與放行
    - Standard 1.1 要求參與者在參加前先通過健康照護提供者的篩查與放行
    - 肌力與體能專業人員不必保有實體檢查副本，但應要求已簽署的聲明作為醫療放行參與的證明
    detail: 應在肌力與體能計畫主辦公室留存每名運動員已由運動醫學人員篩查與放行的文件，才允許參與。
    terms:
    - preparticipation-screening
    - medical-clearance
    - strength-and-conditioning-professional
    numbers:
    - v: '1.1'
      unit: Standard
      of: 要求參與者在參加前接受健康照護提供者篩查與放行的《Strength and Conditioning Professional Standards and Guidelines》標準
    concepts:
    - professional
    - measurement
    related:
    - ch12.safety.i01
    locator: Legal and Ethical Issues > Preparticipation Screening and Medical Clearance
  - id: ch24.screening.i02
    q: 誰有權准許運動員正式參與或回歸計畫
    a:
    - 運動醫學人員負責准許運動員正式參與肌力與體能計畫
    - 此類人員例如認證運動防護員、醫師或物理治療師
    - 肌力與體能專業人員不得診斷或評估醫療或健康狀況，因此不能提供醫療放行
    detail: 此規定適用於新到校或新加入計畫者，也適用於正從傷害或疾病恢復者。
    terms:
    - medical-clearance
    - scope-of-practice
    - athletic-trainer
    - physical-therapist
    numbers: []
    concepts:
    - professional
    - measurement
    related:
    - ch22.sports-medicine-team.i04
    locator: Legal and Ethical Issues > Preparticipation Screening and Medical Clearance
  - id: ch24.screening.i03
    q: 傷病恢復與特殊需求者的醫療放行
    a:
    - 正從傷害或疾病回歸者，開始或回到肌力與體能計畫前也應出示醫療放行證明
    - 有特殊需求者，例如糖尿病、氣喘、癲癇或高血壓者，也應出示醫療放行證明
    detail: 本節要求的是放行證明，不是由肌力與體能專業人員自行判定病況是否適合參與。
    terms:
    - medical-clearance
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    - measurement
    related:
    - ch22.maturation-phase.i04
    locator: Legal and Ethical Issues > Preparticipation Screening and Medical Clearance
  - id: ch24.screening.i04
    q: 設施使用資格的典型對象
    a:
    - 參加運動部門贊助運動的全日制或部分時間學生運動員，以及已註冊並由運動教練確認隊伍身分的新進或轉入學生運動員
    - 體育課學生、運動部門的全體教練及行政人員、全體運動醫學部門人員
    - 已完成資格的校友運動員，以及經運動部門主任或肌力與體能主任核准的個人或團體
    detail: 這是教材所列「通常允許」使用設施的對象；設立資格要求的目的是讓工作人員聚焦於目標訓練人口。
    terms:
    - director-of-strength-and-conditioning
    numbers: []
    concepts:
    - professional
    - measurement
    related:
    - ch23.needs-analysis.i01
    locator: Legal and Ethical Issues > Eligibility Criteria
  - id: ch24.screening.i05
    q: 外部個人或團體使用設施的條件
    a:
    - 須先獲運動部門主任或肌力與體能主任核准，並有預先安排的使用時段，才能提供適當督導
    - 教材列舉的常見條件包括：由運動部門主任或肌力與體能主任預先批准、由本部門人員督導、於運動員不在場的非尖峰時段使用
    - 也可要求提供額外責任保險書面證明、簽署放棄責任協議、遵守設施規則，並保留限制使用權
    detail: 後兩組是書中「常見判準」的例子，並非宣稱每一項均必須同時由兩位主任批准；先有政策比逐案決定更一致、客觀。
    terms:
    - liability-insurance
    - release-of-liability-form
    - director-of-strength-and-conditioning
    numbers: []
    concepts:
    - professional
    - measurement
    related:
    - ch23.needs-analysis.i05
    locator: Legal and Ethical Issues > Eligibility Criteria
  - id: ch24.screening.i06
    q: 放棄責任表（release of liability form）的使用
    a:
    - 設施所有參與者都必須簽署放棄責任協議表
    - 使用前應檢查該表是否符合現行地方與國家法律
    detail: 教材說明此表可依需要修改以符合地方與國家法律；降低設施內使用期間受傷的責任，是風險管理策略的重要一環。
    terms:
    - release-of-liability-form
    - risk-management
    numbers: []
    concepts:
    - professional
    - measurement
    related:
    - ch23.safety-electrical.i03
    locator: Legal and Ethical Issues > Eligibility Criteria
  - id: ch24.screening.i07
    q: 重複違規的分級懲戒範例
    a:
    - 第一次違規：工作人員口頭警告，說明違反規則或指引的性質與重要性，並提醒第二次處置
    - 第二次違規：逐出設施一天、由工作人員記錄違規並通知該運動員的運動教練
    - 第三次違規：逐出設施一週；第四次：逐出設施至該學年結束；第五次：永久逐出設施；每階段均須記錄並相應通知
    detail: 設施規則應執行，可能的紀律措施應張貼、記錄並與違規程度相稱；通常運動教練會處理第一次或第二次以後的紀律問題。
    terms:
    - policies
    - procedures
    numbers:
    - v: 1–5
      unit: 次違規
      of: 教材所舉重複違規分級懲戒的違規順序
    concepts:
    - professional
    - measurement
    related:
    - ch15.exercise-technique-fundamentals.i01
    locator: Legal and Ethical Issues > Discipline
  - id: ch24.screening.i08
    q: 為何不應以運動或體能活動作為懲罰
    a:
    - 不鼓勵將運動或體能活動作為處罰
    - 大專體能訓練猝死預防跨協會工作小組的最佳實務建議指出，不應在任何情況下對運動員增加會提高受傷或猝死身體風險的額外負荷
    detail: 這是對「以體能負荷處罰」的明確風險界線，不是禁止依違規比例實施其他張貼且記錄的紀律處置。
    terms:
    - risk-management
    numbers: []
    concepts:
    - professional
    - measurement
    related:
    - ch22.injury-prevention.i01
    locator: Legal and Ethical Issues > Discipline
- id: supervision
  title: 指導與監督 Supervision
  desc: ''
  tag: Supervision
  items:
  - id: ch24.supervision.i01
    q: 尖峰使用時的空間與專業人員－參與者比例指引
    a:
    - 尖峰使用時，每位參與者的最低平均允許地板空間為 100 ft²
    - 初中專業人員－參與者比例為 1:10；高中為 1:15；大學為 1:20
    detail: Guideline 3.1 要求活動事先規劃，並備有足夠合格工作人員，以達到空間、比例及每支槓鈴或訓練站參與者數的建議指引。
    terms:
    - strength-and-conditioning-professional
    numbers:
    - v: 100
      unit: ft²／人
      of: 尖峰使用時每位參與者最低平均允許地板空間
    - v: '1:10'
      unit: 專業人員：參與者
      of: 初中尖峰使用時的建議比例
    - v: '1:15'
      unit: 專業人員：參與者
      of: 高中尖峰使用時的建議比例
    - v: '1:20'
      unit: 專業人員：參與者
      of: 大學尖峰使用時的建議比例
    concepts:
    - professional
    - safety
    related:
    - ch23.key-numbers.i01
    locator: Staff Policies and Activities > Instruction and Supervision
  - id: ch24.supervision.i02
    q: 督導的原則
    a:
    - 始終在場、主動且親自參與、謹慎細心並有準備、具資格、保持警覺
    - 告知參與者安全與緊急程序，了解參與者健康狀況
    - 監測並執行規則與規範，且監控、檢視環境
    detail: 直接督導要能清楚溝通，並看見運動員及受督導區域（若非整個設施）。
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch23.design-elements.i02
    locator: Staff Policies and Activities > Instruction and Supervision
  - id: ch24.supervision.i03
    q: 督導不足與運動傷害法院案件的關聯
    a:
    - 在發生運動傷害的法院案件中，督導被引述於估計約 80% 的案件
    - 指導或督導不足往往是主要原因
    detail: 書中以「估計」表述此比例；其後要求全體運動員持續接受合格肌力與體能專業人員實體在場的督導。
    terms:
    - strength-and-conditioning-professional
    numbers:
    - v: 約 80
      unit: '%'
      of: 發生運動傷害的法院案件中引述督導的估計比例
    concepts:
    - professional
    - safety
    related:
    - ch18.safety.i08
    locator: Staff Policies and Activities > Instruction and Supervision
  - id: ch24.supervision.i04
    q: 指導（instruction）的安全與法律意義
    a:
    - 合格肌力與體能專業人員必須正確指導運動員採用安全、有效的肌力與體能技術
    - 指導是在安全方式下教導運動員技能，並在必要時加以糾正
    - 強調阻力訓練的安全與正確技術，而非舉起的重量，有助於降低傷害發生率與責任暴露
    detail: 教學方法、程序與進程應與專業指引及標準一致；原文沒有把「動作品質」設為獨立於安全與正確技術之外的術語。
    terms:
    - strength-and-conditioning-professional
    - liability
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch15.exercise-technique-fundamentals.i08
    locator: Staff Policies and Activities > Instruction and Supervision
  - id: ch24.supervision.i05
    q: 保護（spotting）與安全器材的督導要求
    a:
    - 保護應與適當安全器材共同使用，且對安全至關重要
    - 當自由重量支撐在軀幹上，或移過臉部與頭部時，工作人員應與運動員有效溝通以確保安全、正確、有效的保護
    - 設施規則指定背部或前肩承槓，以及槓鈴或啞鈴經過臉部或頭頂的動作使用保護者；爆發力動作不保護
    detail: 對特定動作的規則來自設施規則與指引的完整文字清單；本章未將「爆發力動作」的各種保護技術逐一展開。
    terms:
    - spotting
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch15.spotting-when.i01
    - ch15.power-exercises-technique.i06
    locator: Staff Policies and Activities > Instruction and Supervision；Facility Administration > Figure 24.6 Facility Rules and Guidelines
  - id: ch24.supervision.i06
    q: 督導站位置與所需督導程度
    a:
    - 督導站應位於可清楚看見設施與運動員之處
    - 建議的工作人員－運動員比例應遵守，但可依訓練類型改變
    - 進行器械循環訓練的運動員比使用自由重量者需要較少督導；訓練年齡低者比有重量室經驗者需要較多督導
    detail: 工作人員受邀出席練習、比賽或隨隊旅行時，只要不損及設施的教練－運動員比例，應受鼓勵出席。
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch23.design-elements.i02
    locator: Staff Policies and Activities > Instruction and Supervision
  - id: ch24.supervision.i07
    q: 督導比例對肌力進步的影響
    a:
    - 在較低督導比例下訓練的受試者，肌力增進較大
    - 雇主與實務工作者應理解人力配置對安全與表現增進的重要性
    detail: 若因各種因素暫時無法達到最佳比例，書中要求持續努力，盡快達到適當比例；它沒有在此提供肌力增進的量化差額。
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch18.safety.i08
    locator: Staff Policies and Activities > Instruction and Supervision
  - id: ch24.supervision.i08
    q: 訓練單（workout sheet／workout card）的核准與督導
    a:
    - 肌力與體能活動應預先安排，因此運動員訓練時必須持有已核准的訓練單
    - 額外訓練必須由督導的肌力與體能教練核准，以監測適當的強度及訓練量負荷
    - 工作人員必須熟悉每位運動員訓練單上的每項動作；除非主任或運動醫學人員建議，否則不可建議執行未列動作
    detail: 未列動作若獲建議，應在課後儘快以書面記錄；要求工作人員查看並勾選最後一組基礎動作，只是可考慮採取的額外督導措施，不是絕對要求。
    terms:
    - workout-sheet
    - program-design
    numbers: []
    concepts:
    - professional
    - safety
    related:
    - ch17.training-volume.i01
    - ch17.principles-exam-tips.i04
    locator: Staff Policies and Activities > Workout Sheet (Workout Card)
cards:
- q: 使命聲明（mission statement）是什麼？
  a: 組織宗旨的聲明，為肌力與體能計畫提供焦點與方向。
  tag: mission-goals
- q: 有效的使命聲明有哪些條件？
  a: 應簡短聚焦、清楚易懂、說明組織存在原因、不規定手段且範圍廣泛，並符合執業範圍、為倫理守則提供方向、激發承諾。
  tag: mission-goals
- q: 使命聲明包含哪三項組成？
  a: 目標客群（key market）、所提供服務（contribution）及服務的特色（distinction）。
  tag: mission-goals
- q: 計畫目標（program goals）與計畫目的（program objectives）如何區分？
  a: 目標是廣泛概括的預期終點；目的是達成目標的具體手段，且應涵蓋計畫全部領域。
  tag: mission-goals
- q: 肌力與體能表現團隊的分工依據是什麼？
  a: 組成具互補技能與特定專長的團隊，並依每位成員的科學基礎專長分派實作責任及聯絡工作。
  tag: program-management
- q: 肌力與體能主任的核心行政責任有哪些？
  a: 負責整體計畫、設施、器材、人員與行政事務，包含預算、器材採購、提案及與行政和媒體合作。
  tag: program-management
- q: 肌力與體能人員為何需要持續教育？
  a: 繼續教育是維持專業認證的必要部分，並有助降低特別是督導與指導方面的責任暴露。
  tag: program-management
- q: 知情同意（informed consent）是什麼？
  a: 向參與者描述程序或活動及其固有風險和益處，使其自行決定是否參與。
  tag: legal-issues
- q: 法律責任（liability）是什麼？
  a: 法律上的責任、職責或義務；專業人員對所服務運動員不只負有傷害發生時行動的義務，也有預防傷害的義務。
  tag: legal-issues
- q: 標準照護（standard of care）如何定義？
  a: 合理且謹慎的人在相似情況下會做的事；專業人員應依教育、訓練程度及認證狀態行事。
  tag: legal-issues
- q: 認定過失（negligence）須有哪些要素？
  a: 須同時具備義務、違反義務、近因及損害。
  tag: legal-issues
- q: 風險承擔（assumption of risk）是什麼？
  a: 知道活動有固有風險，仍自願決定參與；運動員應被徹底告知風險並簽署相應聲明。
  tag: legal-issues
- q: 運動員進設施前對篩查與放行有何要求？
  a: 須依相關管理組織完成健康照護提供者的篩查及放行；可要求已簽署聲明作為放行證明，不必持有實體檢查副本。
  tag: legal-issues
- q: 誰可以提供醫療放行（medical clearance）？
  a: 運動醫學人員，例如認證運動防護員、醫師或物理治療師；肌力與體能專業人員不可診斷或評估醫療狀況。
  tag: legal-issues
- q: 設施營運應保存哪些紀錄？
  a: 人員資格、標準與指引、書面緊急計畫、器材手冊與維護紀錄、醫療放行、保護性法律文件、訓練日誌、評估紀錄及指導註記。
  tag: legal-issues
- q: 傷害報告表應保存多久？
  a: 應盡可能久；良好作法是無限期保存或諮詢法律權威，因訴訟時效因地而異。
  tag: legal-issues
- q: 責任保險（liability insurance）的定義是什麼？
  a: 保險人以保費為對價，承諾在定義的責任上限內，自費為被保險人辯護並補償特定責任風險。
  tag: legal-issues
- q: 產品責任（product liability）的兩項關鍵判斷是什麼？
  a: 產品是否改變原售狀態，以及是否依製造商意圖使用。
  tag: legal-issues
- q: 為何必須貼上新器材的警告標籤？
  a: 若標籤未置於明顯處，且運動員因標籤所警告的情況受傷，肌力與體能專業人員可能負責。
  tag: legal-issues
- q: 重複違反設施規則的分級處置範例為何？
  a: 第一次口頭警告；第二次逐出一天；第三次一週；第四次至學年結束；第五次永久逐出，並記錄及相應通知。
  tag: facility-rules
- q: 為何不應以體能活動作為懲罰？
  a: 不應在任何情況下增加會提高運動員受傷或猝死身體風險的額外負荷。
  tag: facility-rules
- q: 定向說明會（orientation meeting）何時舉行？
  a: 通常在學年或運動季開始、運動員與運動教練首次使用設施前舉行。
  tag: program-management
- q: HIPAA 如何限制傷害資訊的揭露？
  a: 未獲書面授權不得釋出參與者的健康照護資訊，包括運動醫學人員提供的傷害報告。
  tag: legal-issues
- q: 督導的基本原則有哪些？
  a: 始終在場、主動參與、謹慎有準備、具資格、保持警覺、告知安全和緊急程序、了解健康狀況、執行規則並檢視環境。
  tag: supervision
- q: 尖峰使用時建議的專業人員－參與者比例為何？
  a: 初中 1:10、高中 1:15、大學 1:20；每位參與者最低平均允許地板空間為 100 ft²。
  tag: supervision
- q: 督導在運動傷害法院案件中被引述的比例為何？
  a: 估計約 80%；不足的指導或督導往往是主要原因。
  tag: supervision
- q: 訓練單（workout sheet）對運動員有何要求？
  a: 肌力與體能活動應預先安排，因此運動員訓練時必須持有已核准的訓練單；額外訓練須先取得督導教練核准。
  tag: program-management
- q: 緊急行動計畫（emergency action plan, EAP）是什麼？
  a: 詳述照護傷害正確程序的書面文件；所有設施人員必須知道該計畫及正確應變程序。
  tag: emergency
- q: EAP 至少多久演練一次？
  a: 至少每季一次；同時應將緊急照護計畫張貼於清楚可見處，並維持急救與 CPR 認證。
  tag: emergency
- q: 緊急計畫通常列出哪些內容？
  a: EMS 啟動程序、聯絡人、設施地址、電話與出口位置、救護車路線、合格照護人員、緊急用品及各類緊急情況的行動計畫。
  tag: emergency
- q: 風險管理（risk management）是什麼？
  a: 採取策略降低與控制運動參與的受傷風險，從而降低責任暴露；起點是理解關鍵術語並辨識責任風險區域。
  tag: legal-issues
- q: 補充品與禁用物質的專業界線為何？
  a: 不得處方、推薦或提供非法、禁止或有害的物質；只可對年滿 18 歲者推薦或提供合法且有益、或至少無害的物質。
  tag: legal-issues
- q: 執業範圍（scope of practice）對肌力與體能專業人員有何界線？
  a: 不包括診斷或評估個人醫療或健康狀況；只有運動醫學人員可提供醫療放行。
  tag: legal-issues
- q: 倫理守則（code of ethics）的目的是什麼？
  a: 建立專業性與高倫理行為標準，並保護個人權利與尊嚴；運動員福祉通常是主要焦點。
  tag: ethics
- q: 為降低產品責任風險，如何處理損壞器材？
  a: 持續檢查損壞與磨耗；新器材使用前檢查，既有器材損壞時移除修理或更換，無法移除時貼上不得使用標示。
  tag: legal
- q: 人員準備（staff preparedness）涵蓋哪些事項？
  a: 維持專業、急救、CPR、AED 認證，檢討緊急應變程序，並了解政策、督導比例、篩查放行、責任、規則、維護及指導方法。
  tag: emergency
- q: 緊急計畫對醫療涵蓋有何安排？
  a: 應以協作方式決定適切醫療涵蓋，並確保能立即或經規劃取得醫師及時評估情況。
  tag: emergency
- q: 緊急通訊的基本安排是什麼？
  a: 建立直接通訊管道與備援計畫；若醫療人員不在場，市內電話或行動電話可用，且參與者與督導者都應知道最近可用電話的位置。
  tag: emergency
- q: 緊急設備章節要求哪些重點？
  a: 設備應隨時可取得；人員應預先受過正確使用訓練，第一反應者定期演練，並讓醫療人員可取得參與者緊急資訊。
  tag: emergency
- q: 磨耗纜線的案例為何可能構成過失？
  a: 專業人員發現嚴重磨耗卻未修理或張貼停止使用標示，運動員後續受傷時，可能構成違反義務及過失。
  tag: legal
- q: 教材列出的典型設施使用對象有哪些？
  a: 運動部門贊助運動的學生運動員、新進或轉入運動員、體育課學生、相關教練行政及運動醫學人員、合格校友及獲核准者。
  tag: administration
- q: 外部個人或團體如何申請使用設施？
  a: 須先獲運動部門主任或肌力與體能主任核准並預排時段；常見條件還包括部門督導、非尖峰使用、保險證明、放棄責任表及遵守規則。
  tag: administration
- q: 設施排程的優先原則是什麼？
  a: 季內隊伍通常優先；可將季外隊伍排在週一、三、五，讓季內隊伍使用週二、四，或依比賽時程採替代安排。
  tag: administration
- q: 定向說明會應說明哪些內容？
  a: 設施和人員電話、服務、使命目標與目的、開放時間及隊伍時程、規則與紀律、緊急程序、篩查資格及正確器材使用與保護。
  tag: administration
- q: 工作人員設計的訓練計畫何時須存檔？
  a: 每份計畫（待執行動作清單）應在隊伍開始計畫前經審查並存於主任辦公室。
  tag: administration
- q: 訓練單未列的動作可否建議執行？
  a: 除非主任或運動醫學人員建議，否則不可；若獲建議，應在課後儘快以書面記錄。
  tag: administration
- q: 政策（policies）與程序（procedures）各自說明什麼？
  a: 政策是設施規則與規範並反映目標和目的；程序說明如何符合或執行政策。
  tag: administration
- q: 傷害發生後的紀錄與機密性要求為何？
  a: 應完成事故－傷害報告表並存檔，並盡力保護參與者隱私與機密性；健康資訊未經書面授權不得揭露。
  tag: legal
- q: 指導（instruction）如何降低受傷與責任暴露？
  a: 以安全方式教導技能並在必要時糾正，強調安全與正確技術而非舉起重量，且採用符合專業指引與標準的方法、程序和進程。
  tag: instruction
- q: 主任在日常人員管理上的責任為何？
  a: 發展、提出並執行工作人員及參與者的書面政策和程序，確保人員受適當訓練與準備，並定期評估專業表現與目標達成情形。
  tag: administration
- q: 傷病恢復或有特殊需求者何時須出示醫療放行？
  a: 在開始或回到肌力與體能計畫前；書中舉糖尿病、氣喘、癲癇及高血壓為特殊需求例子。
  tag: legal
- q: 肌力與體能人員何時應購買專業責任保險？
  a: 因運動參與可能受傷，若不受設施保單保障，應購買專業責任保險。
  tag: legal
