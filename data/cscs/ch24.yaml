id: ch24
weight: 24
title: Ch.24 Facility Policies, Procedures & Legal Issues
topics:
- id: administration
  title: 任務與目標 Administration
  desc: ''
  tag: Administration
  items:
  - id: ch24.administration.i01
    q: Mission Statement
    a:
    - 組織存在目的的聲明
    - 需短、清晰、廣泛、可激勵承諾，並符合倫理與業務範疇
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.administration.i02
    q: 三大核心要素
    a:
    - 目標客群（key market）· 提供的服務（contribution）· 服務的獨特性（distinction）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.administration.i03
    q: Program Goals
    a:
    - 廣泛陳述的預期成果
    - 以科學原則為基礎，提升運動表現並降低受傷風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.administration.i04
    q: Program Objectives
    a:
    - 達成目標的具體手段
    - 涵蓋訓練設計、個別差異、生理反應、營養教育、禁藥教育
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.administration.i05
    q: Policies vs Procedures
    a:
    - Policies = 設施規則與規範（反映目標）
    - Procedures = 執行 policy 的具體方式
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.administration.i06
    q: 協作建立
    a:
    - 任務與目標應由 S&C 部門、行政、運動醫學共同制定，取得各方承諾
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.administration.i07
    q: 績效團隊概念
    a:
    - 集合解剖、生理、營養、心理等專業人員
    - 依各人科學背景分配實作任務
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.administration.i08
    q: 定期檢討
    a:
    - 每學年或球季開始前召開 orientation
    - 定期重新評估目標與執行情況
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
- id: emergency
  title: 緊急應變計畫 Emergency EAP
  desc: ''
  tag: Emergency
  items:
  - id: ch24.emergency.i01
    q: EAP 定義
    a:
    - 詳述處理傷害正確程序的書面文件
    - 所有設施人員須熟知
    - 需定期練習（至少每季一次）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch24.emergency.i02
    q: EAP 必備內容
    a:
    - EMS 啟動程序 · 聯絡名單 · 設施地址 · 電話位置 · 最近出口 · 救護車動線 · 緊急物資位置
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch24.emergency.i03
    q: 緊急團隊四大角色
    a:
    - ①即時照護運動員 ②取得緊急設備 ③啟動 EMS ④引導 EMS 進入現場
    - 各角色功能清楚分工
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch24.emergency.i04
    q: 三類緊急情況
    a:
    - 生命威脅（call 911 + CPR/AED）· 環境緊急（撤離 + 清點人員）· 非生命威脅（急救 + 文件記錄）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch24.emergency.i05
    q: 緊急通訊
    a:
    - 建立直接通訊管道與備援計畫
    - 確保有線或行動電話可用
    - 所有人員知道最近電話位置
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch24.emergency.i06
    q: 緊急設備
    a:
    - 急救設備應隨時可取得
    - 人員需事先受訓（CPR/AED/急救認證）
    - 定期演練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch24.emergency.i07
    q: 火災程序
    a:
    - Step 1：啟動火警 → Step 2：疏散建築物（獨立列出，優先順序最高）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch24.emergency.i08
    q: 記錄原則
    a:
    - 緊急事件需完成 Incident-Injury Report Form 並存檔
    - 建立指揮鏈（教練→S&C Director→AT→AD）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
- id: ethics-records
  title: 行政與職業規範 Ethics & Records
  desc: ''
  tag: Ethics & Records
  items:
  - id: ch24.ethics-records.i01
    q: Code of Ethics
    a:
    - NSCA 倫理規範 + 機構倫理守則
    - 保護個人權利與尊嚴
    - 運動員福祉為首要關注
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.ethics-records.i02
    q: 文件記錄清單
    a:
    - 人員證書 · 設備手冊 · 維修紀錄 · 醫療放行 · 知情同意書 · 訓練日誌 · 緊急計畫（書面）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.ethics-records.i03
    q: HIPAA 合規
    a:
    - 未獲書面授權不得公開參與者健康資訊
    - 傷害報告受保護
    - 需有存取管制
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.ethics-records.i04
    q: Liability Insurance
    a:
    - 若未被設施保單涵蓋，S&C 人員應自購專業 liability insurance
    - 由保險人代為辯護並賠償
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.ethics-records.i05
    q: Risk Management
    a:
    - 運用策略降低並控制參與運動的受傷風險，進而降低 liability exposure
    - 風險不可完全消除但可管理
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.ethics-records.i06
    q: Policies & Procedures Manual
    a:
    - 每個設施需建立獨特的手冊
    - 涵蓋本章所有主題
    - 是安全有效計畫的藍圖
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.ethics-records.i07
    q: 職業倫理細節
    a:
    - 霸凌/社群媒體政策 · 服裝儀容 · 私人使用設備 · 教練-運動員關係規範
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.ethics-records.i08
    q: Program Design 監督
    a:
    - Director 審核並存檔所有訓練計畫
    - 依 NSCA 標準設定強度
    - 復健重訓計畫需運動醫學會簽
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
- id: facility
  title: 設施管理 Facility
  desc: ''
  tag: Facility
  items:
  - id: ch24.facility.i01
    q: Product Liability
    a:
    - 製造商或販售者的法律責任
    - S&C 人員可能被列為共同被告
    - 改裝或誤用設備可轉移責任
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
  - id: ch24.facility.i02
    q: 設備使用原則
    a:
    - 依製造商用途使用 · 符合專業標準 · 向信譽良好廠商購買 · 不隨意改裝 · 貼警告標籤
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
  - id: ch24.facility.i03
    q: 設備檢查
    a:
    - 持續檢查損耗
    - 新設備到貨即檢查
    - 損壞設備移除或標示「請勿使用」
    - 不讓運動員無監督使用
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
  - id: ch24.facility.i04
    q: 排程規劃
    a:
    - 季內球隊優先
    - 季外球隊可用 M/W/F
    - 彈性調整早晚時段
    - 目標讓最多運動員在適當比例下訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
  - id: ch24.facility.i05
    q: 設施規則重點
    a:
    - 鎖扣必備 · 蹲舉須在蹲舉架內 · 爆發力台需用 bumper plates · 回報設備異常 · 禁止菸酒毒品
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
  - id: ch24.facility.i06
    q: 補充品與禁藥
    a:
    - 不得推薦非法或有害物質（Standard 9.1）
    - 只推薦合法且有科學依據的補充品
    - 年滿 18 歲以上
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
  - id: ch24.facility.i07
    q: Orientation Meeting
    a:
    - 學年/球季開始前舉行
    - 說明服務目標、操作時間、規則、緊急程序、器材使用與 spotting 技術
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
  - id: ch24.facility.i08
    q: 開閉館程序
    a:
    - 包含日常操作、清潔維護、假日規定、音響使用、辦公室管理、儲存規範
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - safety
    related: []
    locator: ''
- id: legal
  title: 法律術語 Legal
  desc: ''
  tag: Legal
  items:
  - id: ch24.legal.i01
    q: Informed Consent
    a:
    - 向參與者說明活動內容、固有風險與益處，讓其自行決定是否參與
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.legal.i02
    q: Liability
    a:
    - 法律責任
    - S&C 專業人員因職務負有防止受傷及受傷時採取行動的義務
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.legal.i03
    q: Standard of Care
    a:
    - 合理謹慎的人在相似情境下應做的事
    - 以教育程度、訓練與認證（CSCS/CPR/AED）為依據
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.legal.i04
    q: Negligence 四要素
    a:
    - ①Duty（有義務）②Breach of Duty（違反義務）③Proximate Cause（近因）④Damages（損害）—— 四者皆備才成立
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.legal.i05
    q: Assumption of Risk
    a:
    - 參與者知悉活動存在固有風險並自願參與
    - 運動員應書面簽署聲明
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.legal.i06
    q: Negligence 案例
    a:
    - 教練發現器材纜線磨損未貼「故障」標示 → 運動員受傷 → 構成疏忽（duty存在但未履行）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.legal.i07
    q: Scope of Practice
    a:
    - S&C 專業人員不得診斷或評估醫療狀況
    - 醫療放行須由運動醫學人員（AT/MD/PT）提供
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.legal.i08
    q: Statute of Limitations
    a:
    - 提起訴訟的時效期限
    - 各地不同，建議無限期保存傷害報告或諮詢法律顧問
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
- id: personnel
  title: 人員資格 Personnel
  desc: ''
  tag: Personnel
  items:
  - id: ch24.personnel.i01
    q: Director 核心職責
    a:
    - 監督全程序、設施、設備與人員
    - 審核所有訓練計畫
    - 管理預算
    - 協調排程
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.personnel.i02
    q: NCAA 認證規定
    a:
    - 2015/8/1 起 Division I 規定：S&C coach 須持有全國認可的 S&C 認證並保持有效
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.personnel.i03
    q: 必備認證
    a:
    - CSCS（NSCA）+ 標準急救 + CPR + AED
    - 助理教練同樣需要維持上述認證
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.personnel.i04
    q: 繼續教育
    a:
    - 維持認證的必要條件
    - 可降低 liability exposure，尤其是「專業資格」相關訴訟
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.personnel.i05
    q: Staff 備戰清單
    a:
    - ①維持認證 ②急救/CPR/AED ③熟悉 EAP ④了解 policies ⑤法規知識 ⑥設備維護知識
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.personnel.i06
    q: CSCS 定義
    a:
    - 評估、激勵、教育、訓練運動員
    - 進行體能測試
    - 設計安全有效的訓練計畫
    - 提供營養與傷害預防指引
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.personnel.i07
    q: 職責分工
    a:
    - Director 負責劃分助理的職責：計畫設計、技術指導、組織行政、測試評估
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch24.personnel.i08
    q: 人員評估
    a:
    - 定期評估助理表現
    - 參考 Student Staff Evaluation 表（溝通、領導、態度三面向）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
- id: screening
  title: 參與前篩查 Screening
  desc: ''
  tag: Screening
  items:
  - id: ch24.screening.i01
    q: Medical Clearance 要求
    a:
    - 所有運動員進入設施前須完成健康篩查並獲醫療放行（Standard 1.1）
    - 需書面證明存檔
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
  - id: ch24.screening.i02
    q: 誰提供放行
    a:
    - 僅限運動醫學人員（AT、醫師、PT）
    - S&C 專業人員不在其 scope of practice 內
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
  - id: ch24.screening.i03
    q: 特殊族群
    a:
    - 傷病後復歸、糖尿病、氣喘、癲癇、高血壓等特殊需求者，須額外提供書面放行
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
  - id: ch24.screening.i04
    q: 資格使用者
    a:
    - 正式生/兼讀生運動員、教練行政人員、運動醫學人員、體育課學生、校友、特別獲批者
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
  - id: ch24.screening.i05
    q: 外部使用申請
    a:
    - 須 AD 及 S&C director 預先批准、自行安排監督人員、提供額外責任保險證明、簽署免責同意書
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
  - id: ch24.screening.i06
    q: Release Agreement
    a:
    - 外部使用者須簽署 Release of Liability Form
    - 需符合當地與國家法規
    - 降低設施內受傷的 liability
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
  - id: ch24.screening.i07
    q: Discipline（懲戒）
    a:
    - 規則需張貼
    - 懲戒按比例：1st口頭警告 → 2nd當日驅逐 → 3rd一週 → 4th全年 → 5th永久
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
  - id: ch24.screening.i08
    q: 禁止體罰
    a:
    - 不得以運動訓練作為懲罰
    - 跨機構特別工作組建議不增加任何額外體能負荷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - measurement
    related: []
    locator: ''
- id: supervision
  title: 指導與監督 Supervision
  desc: ''
  tag: Supervision
  items:
  - id: ch24.supervision.i01
    q: 監督比例（考點）
    a:
    - 初中 1:10 ／ 高中 1:15 ／ 大學 1:20
    - 每人最低空間 100 ft²（Guideline 3.1）
    detail: ''
    terms: []
    numbers: []
    concepts:
