# 全書術語表：知識單位的 terms 欄位只放 key，中英對照與說明集中在這裡。
# 一個術語補一次，全書所有引用同時修好。abbr 有值代表它是縮寫，網頁會展開全稱。
# 新增 key 後跑 tools/cscs_check.py，會列出「被引用但未定義」與「定義了沒人用」。

# --- 骨骼 ---
axial-skeleton:
  en: "Axial skeleton"
  zh: "軸心骨骼"
  note: "身體中軸的骨頭：頭顱、脊椎、肋骨、胸骨"
appendicular-skeleton:
  en: "Appendicular skeleton"
  zh: "附肢骨骼"
  note: "四肢與連接四肢的帶狀骨：肩帶、上肢、骨盆帶、下肢"
fibrous-joint:
  en: "Fibrous joint"
  zh: "纖維關節"
  note: "以纖維結締組織直接相連，幾乎不能動，例如顱縫"
cartilaginous-joint:
  en: "Cartilaginous joint"
  zh: "軟骨關節"
  note: "以軟骨相連，可小幅活動，例如椎間盤"
synovial-joint:
  en: "Synovial joint"
  zh: "滑液關節"
  note: "關節囊內含滑液、關節面覆軟骨，活動度最大，運動動作幾乎都發生在這類關節"
hyaline-cartilage:
  en: "Hyaline cartilage"
  zh: "透明軟骨"
  note: "覆蓋關節面的光滑軟骨，負責降低摩擦"
synovial-fluid:
  en: "Synovial fluid"
  zh: "滑液"
  note: "關節囊內的潤滑液"
uniaxial-joint:
  en: "Uniaxial joint"
  zh: "單軸關節"
  note: "只繞一個軸轉動的鉸鏈型關節，例如肘"
biaxial-joint:
  en: "Biaxial joint"
  zh: "雙軸關節"
  note: "可繞兩個互相垂直的軸轉動，例如踝、腕"
multiaxial-joint:
  en: "Multiaxial joint"
  zh: "多軸關節"
  note: "可繞空間三軸轉動的球窩關節，例如肩、髖"
vertebral-column:
  en: "Vertebral column"
  zh: "脊椎"
  note: "由椎骨與其間的椎間盤組成"
periosteum:
  en: "Bone periosteum"
  zh: "骨膜"
  note: "包覆骨頭表面的結締組織，肌腱附著於此"

# --- 肌肉結構 ---
epimysium:
  en: "Epimysium"
  zh: "肌外膜"
  note: "包住整塊肌肉的最外層結締組織，兩端與肌腱連續"
perimysium:
  en: "Perimysium"
  zh: "肌束膜"
  note: "包住一束肌纖維（肌束）的結締組織"
endomysium:
  en: "Endomysium"
  zh: "肌內膜"
  note: "包住單一條肌纖維的結締組織"
fasciculus:
  en: "Fasciculus"
  zh: "肌束"
  plural: "fasciculi"
  note: "一群被肌束膜包住的肌纖維"
muscle-fiber:
  en: "Muscle fiber"
  zh: "肌纖維"
  note: "肌肉細胞，長條圓柱形、多核"
sarcolemma:
  en: "Sarcolemma"
  zh: "肌膜"
  note: "肌纖維的細胞膜"
sarcoplasm:
  en: "Sarcoplasm"
  zh: "肌漿"
  note: "肌纖維的細胞質，含肝醣、脂肪顆粒、酵素與胞器"
myofibril:
  en: "Myofibril"
  zh: "肌原纖維"
  note: "肌漿內的收縮構造束，由肌絲排列而成"
myofilament:
  en: "Myofilament"
  zh: "肌絲"
  note: "肌原纖維的組成單位，分粗絲（肌凝蛋白）與細絲（肌動蛋白）"
myosin:
  en: "Myosin"
  zh: "肌凝蛋白"
  note: "粗絲，有球形頭可與肌動蛋白形成橫橋"
actin:
  en: "Actin"
  zh: "肌動蛋白"
  note: "細絲，雙螺旋排列，上面有肌凝蛋白的結合位點"
sarcomere:
  en: "Sarcomere"
  zh: "肌節"
  note: "骨骼肌最小的收縮單位，兩端以 Z 線為界"
crossbridge:
  en: "Crossbridge"
  zh: "橫橋"
  note: "肌凝蛋白頭與肌動蛋白接上後形成的連接"
z-line:
  en: "Z-line"
  zh: "Z 線"
  note: "肌節的邊界，細絲固定於此"
a-band:
  en: "A-band"
  zh: "A 帶（暗帶）"
  note: "粗絲所在區段，收縮時長度不變"
i-band:
  en: "I-band"
  zh: "I 帶（明帶）"
  note: "只有細絲的區段，收縮時縮短"
h-zone:
  en: "H-zone"
  zh: "H 區"
  note: "肌節中央只有粗絲的區段，收縮時縮短"
m-bridge:
  en: "M-bridge"
  zh: "M 線"
  note: "肌節中央固定相鄰粗絲的構造"
sarcoplasmic-reticulum:
  en: "Sarcoplasmic reticulum"
  abbr: "SR"
  zh: "肌漿網"
  note: "包圍肌原纖維的管道系統，儲存鈣離子"
t-tubule:
  en: "Transverse tubule"
  abbr: "T-tubule"
  zh: "橫小管"
  note: "由肌膜向內延伸的管道，讓動作電位同時抵達肌纖維深處"
troponin:
  en: "Troponin"
  zh: "旋光素／肌鈣蛋白"
  note: "位於細絲上、對鈣離子親和力高的蛋白，鈣結合於此觸發收縮"
tropomyosin:
  en: "Tropomyosin"
  zh: "原肌凝蛋白"
  note: "沿細絲雙螺旋溝槽分布，靜息時遮住結合位點"
motor-end-plate:
  en: "Motor end plate"
  zh: "運動終板"
  note: "運動神經元與肌纖維的接合處，即神經肌肉接合處"

# --- 神經肌肉 ---
motor-neuron:
  en: "Motor neuron"
  zh: "運動神經元"
  note: "從脊髓把電化學訊號送到肌肉的神經細胞"
motor-unit:
  en: "Motor unit"
  zh: "運動單位"
  note: "一個運動神經元加上它所支配的全部肌纖維"
neuromuscular-junction:
  en: "Neuromuscular junction"
  abbr: "NMJ"
  zh: "神經肌肉接合處"
  note: "運動神經末梢與肌纖維之間的化學傳遞介面"
acetylcholine:
  en: "Acetylcholine"
  abbr: "ACh"
  zh: "乙醯膽鹼"
  note: "在神經肌肉接合處釋放的神經傳導物質"
action-potential:
  en: "Action potential"
  zh: "動作電位"
  note: "沿神經或肌膜傳導的電訊號"
all-or-none:
  en: "All-or-none principle"
  zh: "全有全無律"
  note: "運動單位受刺激時全部纖維一起收縮，刺激加強不會讓單次收縮更強"
twitch:
  en: "Twitch"
  zh: "單收縮"
  note: "單一動作電位引發的短暫收縮"
tetanus:
  en: "Tetanus"
  zh: "強直收縮"
  note: "高頻刺激使單收縮融合，運動單位在此達到最大力量"
recruitment:
  en: "Recruitment"
  zh: "運動單位徵召"
  note: "藉由啟動更多運動單位來增加肌肉力量"
rate-coding:
  en: "Rate coding"
  zh: "頻率調節"
  note: "藉由提高運動單位的放電頻率來增加力量"
slow-twitch:
  en: "Slow-twitch fiber"
  zh: "慢縮肌纖維"
  note: "即 Type I，收縮與放鬆慢、抗疲勞"
fast-twitch:
  en: "Fast-twitch fiber"
  zh: "快縮肌纖維"
  note: "即 Type II，收縮與放鬆快、易疲勞"
myosin-atpase:
  en: "Myosin adenosine triphosphatase"
  abbr: "Myosin ATPase"
  zh: "肌凝蛋白 ATP 水解酶"
  note: "分解 ATP 供橫橋做功的酵素；其染色深淺也用來分辨快慢縮纖維"
mhc:
  en: "Myosin heavy chain"
  abbr: "MHC"
  zh: "肌凝蛋白重鏈"
  note: "肌凝蛋白的大分子次單元，定量它可更精確分型肌纖維"
atp:
  en: "Adenosine triphosphate"
  abbr: "ATP"
  zh: "三磷酸腺苷"
  note: "細胞的直接能量貨幣"
adp:
  en: "Adenosine diphosphate"
  abbr: "ADP"
  zh: "二磷酸腺苷"
  note: "ATP 去掉一個磷酸後的產物"
power-stroke:
  en: "Power stroke"
  zh: "動力衝程"
  note: "肌凝蛋白頭彎折、把細絲拉向肌節中心的那一下"

# --- 本體感覺 ---
proprioceptor:
  en: "Proprioceptor"
  zh: "本體感覺受器"
  note: "位於關節、肌肉、肌腱，感應壓力與張力的感覺受器"
muscle-spindle:
  en: "Muscle spindle"
  zh: "肌梭"
  note: "偵測肌肉長度與長度變化速率的本體感覺受器"
intrafusal-fiber:
  en: "Intrafusal fiber"
  zh: "梭內纖維"
  note: "肌梭內部經過改良的肌纖維"
extrafusal-fiber:
  en: "Extrafusal fiber"
  zh: "梭外纖維"
  note: "一般負責產生力量的肌纖維"
gto:
  en: "Golgi tendon organ"
  abbr: "GTO"
  zh: "高爾基肌腱器"
  note: "位於肌腱、與梭外纖維串聯的張力受器，張力過高時反射性抑制收縮"
myotendinous-junction:
  en: "Myotendinous junction"
  zh: "肌腱接合處"
  note: "肌肉與肌腱交界處"
cns:
  en: "Central nervous system"
  abbr: "CNS"
  zh: "中樞神經系統"
  note: "腦與脊髓"
inhibitory-interneuron:
  en: "Inhibitory interneuron"
  zh: "抑制性中間神經元"
  note: "脊髓內負責抑制運動神經元的中繼神經元"
kinesthetic-sense:
  en: "Kinesthetic sense"
  zh: "動覺"
  note: "對身體各部位相對於重力之位置的意識感知"

# --- 心血管 ---
atrium:
  en: "Atrium"
  zh: "心房"
  plural: "atria"
  note: "心臟上腔，接收回流血液後送入心室"
ventricle:
  en: "Ventricle"
  zh: "心室"
  note: "心臟下腔，是推動血液前進的主要力量來源"
tricuspid-valve:
  en: "Tricuspid valve"
  zh: "三尖瓣"
  note: "右心房與右心室之間的瓣膜"
mitral-valve:
  en: "Mitral valve (bicuspid valve)"
  zh: "二尖瓣"
  note: "左心房與左心室之間的瓣膜"
av-valve:
  en: "Atrioventricular valves"
  abbr: "AV valves"
  zh: "房室瓣"
  note: "三尖瓣與二尖瓣的合稱，防止心室收縮時血液逆流回心房"
semilunar-valve:
  en: "Semilunar valves"
  zh: "半月瓣"
  note: "主動脈瓣與肺動脈瓣的合稱，防止心室舒張時血液倒灌回心室"
systole:
  en: "Systole"
  zh: "收縮期"
  note: "心室收縮、把血打出去的階段"
diastole:
  en: "Diastole"
  zh: "舒張期"
  note: "心室放鬆、回充血液的階段"
sa-node:
  en: "Sinoatrial node"
  abbr: "SA node"
  zh: "竇房結"
  note: "位於右心房上外側壁的天然節律點"
av-node:
  en: "Atrioventricular node"
  abbr: "AV node"
  zh: "房室結"
  note: "位於右心房後隔壁，訊號在此稍作延遲再進入心室"
internodal-pathway:
  en: "Internodal pathways"
  zh: "結間傳導路徑"
  note: "把訊號從竇房結帶到房室結的傳導路徑"
av-bundle:
  en: "Atrioventricular bundle"
  abbr: "AV bundle"
  zh: "房室束"
  note: "把訊號帶進心室的傳導束"
bundle-branch:
  en: "Bundle branches"
  zh: "左右束支"
  note: "房室束分出的左右分支，傳導速度遠快於房室結纖維"
purkinje-fiber:
  en: "Purkinje fibers"
  zh: "浦金氏纖維"
  note: "束支末端遍布心室的傳導纖維，使兩心室幾乎同時收縮"
myocardium:
  en: "Myocardium"
  zh: "心肌"
  note: "心臟的肌肉層"
sympathetic:
  en: "Sympathetic nervous system"
  zh: "交感神經系統"
  note: "自律神經的一支，活化時加快竇房結去極化、心率上升"
parasympathetic:
  en: "Parasympathetic nervous system"
  zh: "副交感神經系統"
  note: "自律神經的一支，活化時減慢竇房結放電、心率下降"
chronotropic:
  en: "Chronotropic effect"
  zh: "變時性效應"
  note: "改變心跳速率的作用"
bradycardia:
  en: "Bradycardia"
  zh: "心搏徐緩"
  note: "安靜心率低於每分鐘 60 次"
tachycardia:
  en: "Tachycardia"
  zh: "心搏過速"
  note: "安靜心率高於每分鐘 100 次"
ecg:
  en: "Electrocardiogram"
  abbr: "ECG"
  zh: "心電圖"
  note: "從體表記錄心臟電活動的圖形"
depolarization:
  en: "Depolarization"
  zh: "去極化"
  note: "膜電位反轉，膜內由負轉正，是引發機械收縮的電刺激"
repolarization:
  en: "Repolarization"
  zh: "再極化"
  note: "去極化後膜電位回復的過程"
p-wave:
  en: "P-wave"
  zh: "P 波"
  note: "心房去極化，隨之心房收縮"
qrs-complex:
  en: "QRS complex"
  zh: "QRS 複合波"
  note: "心室去極化，常由 Q、R、S 三個分開的波組成"
t-wave:
  en: "T-wave"
  zh: "T 波"
  note: "心室再極化"
artery:
  en: "Artery"
  zh: "動脈"
  note: "把血從心臟快速送出的血管，管壁強韌多肌"
arteriole:
  en: "Arteriole"
  zh: "小動脈"
  note: "動脈末端的控制血管，可完全關閉或大幅擴張以調節微血管血流"
capillary:
  en: "Capillary"
  zh: "微血管"
  note: "管壁極薄，負責血液與組織間液的物質交換"
venule:
  en: "Venule"
  zh: "小靜脈"
  note: "收集微血管血液後匯入靜脈"
vein:
  en: "Vein"
  zh: "靜脈"
  note: "把血送回心臟的血管，管壁薄，可當血液儲存庫"
hemoglobin:
  en: "Hemoglobin"
  zh: "血紅素"
  note: "紅血球內的鐵蛋白分子，負責運送氧氣，同時是酸鹼緩衝物"
carbonic-anhydrase:
  en: "Carbonic anhydrase"
  zh: "碳酸酐酶"
  note: "催化二氧化碳與水反應的酵素，協助二氧化碳排除"
skeletal-muscle-pump:
  en: "Skeletal muscle pump"
  zh: "骨骼肌幫浦"
  note: "收縮的肌肉壓迫靜脈，配合單向瓣膜把血推回心臟"

# --- 呼吸 ---
trachea:
  en: "Trachea"
  zh: "氣管"
  note: "第一代呼吸道"
bronchus:
  en: "Bronchi"
  zh: "支氣管"
  note: "左右主支氣管為第二代呼吸道"
bronchiole:
  en: "Bronchiole"
  zh: "細支氣管"
  note: "支氣管之後逐代變細的氣道"
alveolus:
  en: "Alveoli"
  zh: "肺泡"
  note: "氣體交換發生的終端氣囊"
diaphragm:
  en: "Diaphragm"
  zh: "橫膈膜"
  note: "主要吸氣肌，安靜呼吸幾乎全靠它"
pleura:
  en: "Pleura"
  zh: "胸膜／肋膜"
  note: "包覆肺與襯在胸壁內側的膜"
pleural-pressure:
  en: "Pleural pressure"
  zh: "胸膜腔壓"
  note: "肺膜與胸壁膜之間的壓力，正常略呈負值"
alveolar-pressure:
  en: "Alveolar pressure"
  zh: "肺泡壓"
  note: "聲門開啟且無氣流時肺泡內的壓力，此時等於大氣壓"
diffusion:
  en: "Diffusion"
  zh: "擴散"
  note: "分子隨機運動造成的淨移動，由高濃度往低濃度"
partial-pressure:
  en: "Partial pressure"
  zh: "分壓"
  note: "混合氣體中單一氣體所佔的壓力，是氣體擴散的驅動力"
valsalva:
  en: "Valsalva maneuver"
  zh: "閉氣用力法"
  note: "閉住聲門用力，提高腹內壓以穩定軀幹"

# --- 生物力學（ch02）---
mechanical-advantage:
  en: "Mechanical advantage"
  zh: "機械利益"
  abbr: "MA"
  note: "肌肉力臂與阻力臂的比值；>1 省力，<1 費力（人體大多<1）"
moment-arm:
  en: "Moment arm"
  zh: "力矩臂"
  abbr: ""
  note: "力的作用線到旋轉軸的垂直距離；又稱力臂、槓桿臂或扭矩臂"
torque:
  en: "Torque"
  zh: "力矩"
  abbr: ""
  note: "使物體繞支點旋轉的傾向；定義為力的大小乘以力矩臂長度"
fulcrum:
  en: "Fulcrum"
  zh: "支點"
  abbr: ""
  note: "槓桿的旋轉軸心"
sagittal-plane:
  en: "Sagittal plane"
  zh: "矢狀面"
  abbr: ""
  note: "將身體分為左右兩半的平面；主要動作為屈曲和伸展"
frontal-plane:
  en: "Frontal plane"
  zh: "冠狀面"
  abbr: ""
  note: "將身體分為前後兩半的平面；主要動作為外展和內收"
transverse-plane:
  en: "Transverse plane"
  zh: "橫切面"
  abbr: ""
  note: "將身體分為上下兩半的平面；主要動作為旋轉"
anatomical-position:
  en: "Anatomical position"
  zh: "解剖姿勢"
  abbr: ""
  note: "直立、手臂垂放兩側、手掌朝前；所有方向與動作描述的基準姿勢"
angle-of-pennation:
  en: "Angle of pennation"
  zh: "羽狀角度"
  abbr: ""
  note: "肌纖維與肌肉起止點連線之間的夾角；角度越大，平行肌節越多，力量越強但速度越慢"
force-velocity:
  en: "Force–velocity relationship"
  zh: "力-速度關係"
  abbr: ""
  note: "向心收縮速度越快力量越低（反比），離心收縮在約90°/s達到峰值後緩降"
concentric-action:
  en: "Concentric muscle action"
  zh: "向心肌肉動作"
  abbr: ""
  note: "肌肉縮短：收縮力 > 阻力；如舉重的上舉相"
eccentric-action:
  en: "Eccentric muscle action"
  zh: "離心肌肉動作"
  abbr: ""
  note: "肌肉延長：收縮力 < 阻力；如放下重量；可產生三種動作中最大的力"
isometric-action:
  en: "Isometric muscle action"
  zh: "等長肌肉動作"
  abbr: ""
  note: "肌肉長度不變：收縮力 = 阻力；如棒式支撐時腹肌的作用"
fluid-resistance:
  en: "Fluid resistance"
  zh: "流體阻力"
  abbr: ""
  note: "物體在液體或氣體中移動時遇到的阻力；分表面阻力（摩擦）與形狀阻力（形狀）兩種"
inertial-force:
  en: "Inertial force"
  zh: "慣性力"
  abbr: ""
  note: "加速或減速質量時額外施加或釋放的力；F = m × a"
bracketing-technique:
  en: "Bracketing technique"
  zh: "括弧訓練法"
  abbr: ""
  note: "使用比正常輕和比正常重的器材練習同一運動動作，藉由力-速度關係擴展速度訓練範圍"
classic-formula:
  en: "Classic formula (for cross-weight-class comparison)"
  zh: "古典公式（跨量級比較）"
  abbr: ""
  note: "將舉起重量除以體重的2/3次方，修正體型對肌力/體重比的系統性影響"
positive-work:
  en: "Positive work"
  zh: "正功"
  abbr: ""
  note: "肌肉對外部物體做功（如上舉重量增加位能）；反之為負功（重量對肌肉做功）"
power-output:
  en: "Power output"
  zh: "功率輸出"
  abbr: ""
  note: "做功的時間速率：P = W/t = F × v（SI單位：瓦特 W）"

# --- 結締組織與骨骼適應（ch05）---
osteoblast:
  en: "Osteoblast"
  zh: "成骨細胞"
  note: "受機械負荷刺激後遷移到骨表面、分泌膠原並促成礦化的造骨細胞"
bone-modeling:
  en: "Bone modeling"
  zh: "骨骼建模"
  note: "骨頭因應機械負荷改變形狀與直徑的過程，與單純汰換舊骨的重塑不同"
minimal-essential-strain:
  en: "Minimal essential strain"
  abbr: "MES"
  zh: "最小必要應變"
  note: "啟動新骨生成的應變門檻；低於它的力不構成造骨刺激"
bone-mineral-density:
  en: "Bone mineral density"
  abbr: "BMD"
  zh: "骨質密度"
  note: "單位面積骨骼中沉積的礦物質量，是骨骼適應最常用的指標"
progressive-overload:
  en: "Progressive overload"
  zh: "漸進超負荷"
  note: "逐步施加高於身體已習慣的需求，組織才會持續適應"
structural-exercise:
  en: "Structural exercise"
  zh: "結構性動作"
  note: "力的向量沿軸向穿過脊椎與髖的多關節動作，例如深蹲、爆發上搏"
repetition-maximum:
  en: "Repetition maximum"
  abbr: "RM"
  zh: "最大反覆次數"
  note: "某重量最多能完成的反覆次數；1RM 即只能舉起一次的重量"
collagen:
  en: "Collagen"
  zh: "膠原蛋白"
  note: "結締組織的主要結構成分；骨、肌腱、韌帶為第一型，軟骨為第二型"
fibroblast:
  en: "Fibroblast"
  zh: "纖維母細胞"
  note: "結締組織中最常見的細胞，負責合成前膠原與細胞外基質，並參與傷口癒合"
cross-link:
  en: "Cross-link"
  zh: "交聯"
  note: "膠原分子之間的共價鍵結；纖維的實際強度來自交聯而非單純數量"
tendon-stiffness:
  en: "Tendon stiffness"
  zh: "肌腱剛度"
  note: "每單位伸長量所能傳遞的力；剛度越高，肌肉出力傳到骨頭的損耗越小"
fascia:
  en: "Fascia"
  zh: "筋膜"
  note: "包覆並分隔骨骼肌各層的纖維結締組織，膠原束朝不同平面排列以抵抗各方向的力"
chondrocyte:
  en: "Chondrocyte"
  zh: "軟骨細胞"
  note: "軟骨中的活細胞；關節被固定導致擴散受阻時會死亡，基質隨之被吸收"
range-of-motion:
  en: "Range of motion"
  abbr: "ROM"
  zh: "關節活動範圍"
  note: "關節能移動的角度範圍；結締組織適應要求力施加於完整範圍"

# --- 生物能量學（ch03）---
phosphagen-system:
  en: "Phosphagen system"
  abbr: ""
  zh: "磷酸原系統"
  note: "利用 ATP 與 CP 直接提供能量的無氧能量系統；速率最快但容量最小"
creatine-phosphate:
  en: "Creatine phosphate"
  abbr: "CP"
  zh: "磷酸肌酸"
  note: "又稱 phosphocreatine（PCr）；肌肉中的高能磷酸儲備，靜息時濃度為 ATP 的 4-6 倍"
creatine-kinase:
  en: "Creatine kinase"
  abbr: "CK"
  zh: "肌酸激酶"
  note: "催化 ADP + CP → ATP + 肌酸的酵素；磷酸原系統的核心反應酶"
glycolysis:
  en: "Glycolysis"
  abbr: ""
  zh: "糖解作用"
  note: "葡萄糖或肌糖原分解為丙酮酸並產生 ATP 的代謝路徑；發生在肌漿中，不需要氧氣"
fast-glycolysis:
  en: "Fast glycolysis"
  abbr: ""
  zh: "快速糖解"
  note: "丙酮酸轉為乳酸的糖解路徑；快速再生 NAD⁺，ATP 生成速率較快但 H⁺ 積累限制持續時間"
slow-glycolysis:
  en: "Slow glycolysis"
  abbr: ""
  zh: "慢速糖解"
  note: "丙酮酸進入粒線體的糖解路徑；速率較慢但可持續較長時間"
pyruvate:
  en: "Pyruvate"
  abbr: ""
  zh: "丙酮酸"
  note: "糖解的最終產物；可轉為乳酸（快速糖解）或進入粒線體（慢速糖解/氧化磷酸化）"
lactate-dehydrogenase:
  en: "Lactate dehydrogenase"
  abbr: "LDH"
  zh: "乳酸脫氫酶"
  note: "催化丙酮酸轉為乳酸的酵素；此反應消耗 H⁺，有輕微鹼化效果"
pfk:
  en: "Phosphofructokinase"
  abbr: "PFK"
  zh: "磷酸果糖激酶"
  note: "糖解的速率限制酶（rate-limiting step）；ATP 為別構抑制劑，AMP 為強力活化劑"
hexokinase:
  en: "Hexokinase"
  abbr: ""
  zh: "己糖激酶"
  note: "催化血糖磷酸化為葡萄糖-6-磷酸的酵素；受 G-6-P 別構抑制（負回饋）"
allosteric-regulation:
  en: "Allosteric regulation"
  abbr: ""
  zh: "別構調節"
  note: "代謝路徑的終產物回饋調節關鍵酵素活性；又稱 end product regulation 或 feedback regulation"
substrate-level-phosphorylation:
  en: "Substrate-level phosphorylation"
  abbr: ""
  zh: "基質磷酸化"
  note: "在單一代謝反應中直接由高能中間物將磷酸轉移給 ADP 生成 ATP；不需氧氣"
oxidative-phosphorylation:
  en: "Oxidative phosphorylation"
  abbr: ""
  zh: "氧化磷酸化"
  note: "在電子傳遞鏈（ETC）中利用 NADH/FADH₂ 的電子梯度驅動 ATP 合成；需要氧氣"
krebs-cycle:
  en: "Krebs cycle"
  abbr: ""
  zh: "Krebs 循環"
  note: "又稱 citric acid cycle 或 TCA cycle；粒線體內氧化乙醯 CoA 並產生 NADH/FADH₂ 的循環反應"
electron-transport-chain:
  en: "Electron transport chain"
  abbr: "ETC"
  zh: "電子傳遞鏈"
  note: "粒線體內利用 NADH/FADH₂ 驅動 ATP 合成的電子載體鏈；O₂ 為最終電子受體"
oxidative-system:
  en: "Oxidative (aerobic) system"
  abbr: ""
  zh: "氧化系統（有氧系統）"
  note: "包含糖解→Krebs 循環→ETC 的完整有氧代謝路徑；ATP 容量最大但速率最慢"
beta-oxidation:
  en: "Beta oxidation"
  abbr: "β-oxidation"
  zh: "β 氧化"
  note: "在粒線體中將游離脂肪酸逐步切割為乙醯 CoA 並產生 NADH/FADH₂ 的反應序列"
bcaa:
  en: "Branched-chain amino acids"
  abbr: "BCAA"
  zh: "支鏈胺基酸"
  note: "leucine（白胺酸）、isoleucine（異白胺酸）、valine（纈胺酸）；骨骼肌中被氧化的主要胺基酸"
gluconeogenesis:
  en: "Gluconeogenesis"
  abbr: ""
  zh: "糖質新生"
  note: "從非碳水化合物來源（如乳酸、胺基酸）合成葡萄糖的代謝過程；Cori 循環的肝臟端步驟"
isocitrate-dehydrogenase:
  en: "Isocitrate dehydrogenase"
  abbr: ""
  zh: "異檸檬酸脫氫酶"
  note: "催化 isocitrate → α-ketoglutarate 的 Krebs 循環限速酶；ADP 活化、ATP 別構抑制"
metabolic-acidosis:
  en: "Metabolic acidosis"
  abbr: ""
  zh: "代謝酸中毒"
  note: "高強度運動中胞內 pH 下降的過程；主要來源是粒線體外的 ATP 水解，非乳酸堆積；'lactic acidosis' 是誤稱"
lactate-threshold:
  en: "Lactate threshold"
  abbr: "LT"
  zh: "乳酸閾值"
  note: "血乳酸在基線以上急劇增加的運動強度；未訓練者約 50-60% VO₂max，有氧訓練者約 70-80%"
obla:
  en: "Onset of blood lactate accumulation"
  abbr: "OBLA"
  zh: "血乳酸積累起始點"
  note: "血乳酸達到 4 mmol/L 的第二個積累折點；對應大型運動單位（Type II 纖維）大量徵召"
cori-cycle:
  en: "Cori cycle"
  abbr: ""
  zh: "Cori 循環"
  note: "乳酸由血液運送至肝臟轉為葡萄糖（糖質新生），再釋放回血液的代謝循環"
oxygen-deficit:
  en: "Oxygen deficit"
  abbr: ""
  zh: "氧虧"
  note: "運動初期有氧系統未能即時滿足能量需求所產生的缺口；由無氧機制暫時補充"
epoc:
  en: "Excess postexercise oxygen consumption"
  abbr: "EPOC"
  zh: "運動後過量氧耗"
  note: "運動後攝氧量超過靜息值的部分；用於恢復磷酸原、補充氧氣儲量、散熱等多種目的；不等於氧虧"
vo2max:
  en: "Maximal oxygen uptake"
  abbr: "VO₂max"
  zh: "最大攝氧量"
  note: "個人能攝取、輸送並利用的最大氧氣量；常用於定義有氧能力上限與相對運動強度"
glycogen:
  en: "Glycogen"
  abbr: ""
  zh: "糖原"
  note: "碳水化合物的多聚體儲存形式；肌糖原（約 300-400g）與肝糖原（約 70-100g）是運動的主要糖類底物"
interval-training:
  en: "Interval training"
  abbr: ""
  zh: "間歇訓練"
  note: "使用預設功休比交替進行高強度運動與休息的訓練方法；允許以更高強度完成更多訓練量"
hiit:
  en: "High-intensity interval training"
  abbr: "HIIT"
  zh: "高強度間歇訓練"
  note: "短暫高強度工作期加間歇恢復期；目標使累積時間處於 >90% VO₂max；有 9 個可操控變數"
combination-training:
  en: "Combination training"
  abbr: ""
  zh: "組合訓練"
  note: "又稱 cross-training；將有氧耐力訓練加入無氧運動員計畫；可能抑制最大肌力、爆發力與肌肉圍度增益"
metabolic-specificity:
  en: "Metabolic specificity of training"
  abbr: ""
  zh: "訓練代謝專一性"
  note: "透過適當的運動強度與休息間隔『選擇』特定能量系統進行訓練；訓練設計需符合運動的實際代謝需求"

# --- 內分泌 ---
catecholamine:
  en: "Catecholamine"
  abbr: ""
  zh: "兒茶酚胺"
  note: "由腎上腺髓質分泌的胺類荷爾蒙群（腎上腺素、正腎上腺素、多巴胺），在神經系統直接刺激下快速釋放"
epinephrine:
  en: "Epinephrine"
  abbr: "E"
  zh: "腎上腺素"
  note: "兒茶酚胺主要成員；增加力量（中樞機制）、心跳、血壓、能量可用性與肌肉血流；與乳酸濃度相關"
norepinephrine:
  en: "Norepinephrine"
  abbr: "NE"
  zh: "正腎上腺素"
  note: "兒茶酚胺成員之一；具腎上腺素類似作用，另可收縮血管"
dopamine:
  en: "Dopamine"
  abbr: "DA"
  zh: "多巴胺"
  note: "兒茶酚胺成員；由腎上腺髓質與中樞神經系統分泌"
cortisol:
  en: "Cortisol"
  abbr: ""
  zh: "皮質醇"
  note: "腎上腺皮質分泌的主要糖皮質素；具強烈分解代謝作用；日夜節律明顯（早晨最高）"
glucocorticoid:
  en: "Glucocorticoid"
  abbr: ""
  zh: "糖皮質素"
  note: "腎上腺皮質分泌的類固醇荷爾蒙；調節醣類代謝（促進糖質新生），cortisol 為人體主要代表"
testosterone:
  en: "Testosterone"
  abbr: ""
  zh: "睾固酮"
  note: "男性主要雄性素，由睾丸分泌（女性來自卵巢與腎上腺）；促進蛋白質合成、抑制蛋白質分解"
SHBG:
  en: "Sex hormone–binding globulin"
  abbr: "SHBG"
  zh: "性荷爾蒙結合球蛋白"
  note: "睾固酮和雌激素的主要結合蛋白；不只是載體，本身可與膜受器結合啟動 cAMP 途徑"
androgen-receptor:
  en: "Androgen receptor"
  abbr: "AR"
  zh: "雄激素受器"
  note: "睾固酮的胞內受器；訓練主要影響受器最大數量（而非結合敏感性）；1-2 次重訓即可增加數量"
IGF:
  en: "Insulin-like growth factor"
  abbr: "IGF"
  zh: "類胰島素生長因子"
  note: "IGF-I（70 個胺基酸）是蛋白質合成的核心媒介；主要由肝臟在 GH 刺激後產生，需 8-24 小時；肌肉受機械刺激時也可局部合成"
IGFBP:
  en: "IGF-binding protein"
  abbr: "IGFBP"
  zh: "IGF 結合蛋白"
  note: "至少 6 種（IGFBP-1～IGFBP-6）；調節 IGF 受器可及性；IGFBP-1 和 IGFBP-3 研究最多，各有獨立生物活性"
ACTH:
  en: "Adrenocorticotropic hormone"
  abbr: "ACTH"
  zh: "促腎上腺皮質激素"
  note: "由前腦垂體分泌，刺激腎上腺皮質分泌糖皮質素（cortisol）"
GAS:
  en: "General Adaptation Syndrome"
  abbr: "GAS"
  zh: "一般適應症候群"
  note: "Selye 提出：壓力 → 警戒反應（功能暫時下降）→ 抵抗期（適應，功能超越基準）→ 耗竭期；週期化理論的理論基礎"
H-RC:
  en: "Hormone–receptor complex"
  abbr: "H-RC"
  zh: "荷爾蒙受器複合體"
  note: "類固醇荷爾蒙與胞質受器結合後形成的複合體；兩個 H-RC 二聚後移入細胞核，作用於 DNA 調控蛋白質合成"
secondary-messenger:
  en: "Secondary messenger"
  abbr: ""
  zh: "二級訊使"
  note: "胜肽荷爾蒙與膜受器結合後在細胞內傳遞訊號的分子，如 cAMP、JAK/STAT"
GHRH:
  en: "Growth hormone–releasing hormone"
  abbr: "GHRH"
  zh: "生長激素釋放激素"
  note: "下視丘分泌，促進前腦垂體釋放 GH；與生長激素抑制素（somatostatin）形成拮抗調節迴路"
somatostatin:
  en: "Somatostatin"
  abbr: ""
  zh: "生長激素抑制素"
  note: "下視丘分泌，抑制前腦垂體釋放 GH；與 GHRH 共同形成複雜神經內分泌回饋迴路"
proenkephalin:
  en: "Proenkephalin"
  abbr: ""
  zh: "前腦啡肽"
  note: "腎上腺髓質分泌的腦啡肽前驅物（如 Peptide F）；增強免疫細胞功能，對運動後恢復至關重要"
mTOR:
  en: "Mechanistic target of rapamycin"
  abbr: "mTOR"
  zh: "雷帕黴素靶蛋白"
  note: "Akt/mTOR 訊號通路控制 mRNA 翻譯起始（蛋白質合成）；可被皮質醇阻斷，被睾固酮對抗；兩者在 DNA 元件上競爭"
diurnal-variation:
  en: "Diurnal variation"
  abbr: ""
  zh: "日夜節律"
  note: "荷爾蒙濃度在一天內的規律性波動；皮質醇和睾固酮在早晨最高；跨研究比較時必須控制採血時間點"
mechano-growth-factor:
  en: "Mechano growth factor"
  abbr: "MGF"
  zh: "機械生長因子"
  note: "肌肉受機械負荷（過負荷、伸展）時局部大量合成的 IGF-I 形式；以自分泌方式作用；被認為是肌肉 IGF-I 最重要的作用途徑"
adrenergic-exhaustion:
  en: "Adrenergic exhaustion"
  abbr: ""
  zh: "腎上腺素能耗竭"
  note: "訓練不變化導致腎上腺髓質持續被刺激，最終使腎上腺素釋放能力下降；週期化訓練是預防關鍵"
lock-key-theory:
  en: "Lock-and-key theory"
  abbr: ""
  zh: "鎖鑰理論"
  note: "描述荷爾蒙（鑰匙）與特異受器（鎖）結合的基本概念；現知荷爾蒙受器互動比此理論更複雜（含異位結合、交叉反應）"
proteolytic-enzyme:
  en: "Proteolytic enzyme"
  abbr: ""
  zh: "蛋白水解酶"
  note: "分解蛋白質的酵素；皮質醇可提升其濃度，加速肌肉蛋白質降解"

# --- 心血管與呼吸（ch05）---
stroke-volume:
  en: "Stroke volume"
  abbr: "SV"
  zh: "心搏量"
  note: "心臟每跳一次搏出的血量；無氧運動時急性上升，且離心期上升幅度大於向心期"
cardiac-output:
  en: "Cardiac output"
  abbr: "CO"
  zh: "心輸出量"
  note: "心搏量 × 心跳率，每分鐘心臟輸出的總血量；無氧運動時急性上升，離心期／閉氣後期上升更明顯"
double-product:
  en: "Double product"
  abbr: ""
  zh: "雙乘積"
  note: "心跳率 × 收縮壓，估算心肌耗氧量的指標；長期訓練後在相同絕對強度下會鈍化（降低）"
afterload:
  en: "Afterload"
  abbr: ""
  zh: "後負荷"
  note: "心室收縮時必須克服的阻力（主要來自動脈壓）；健美選手心血管鈍化反應被認為與後負荷降低有關"
reactive-hyperemia:
  en: "Reactive hyperemia"
  abbr: ""
  zh: "反應性充血"
  note: "血流因阻斷而中斷後，恢復流通時的代償性血流暴增；發生在肌肉收縮阻斷血流之後的休息期"
mvc:
  en: "Maximal voluntary contraction"
  abbr: "MVC"
  zh: "最大自主收縮"
  note: "肌肉能產生的最大自主收縮力；收縮力超過約 20% MVC 時，血管會被夾閉造成局部血流阻斷"
tidal-volume:
  en: "Tidal volume"
  abbr: ""
  zh: "潮氣量"
  note: "每次呼吸進出肺部的氣體量；無氧訓練後在最大運動時潮氣量與呼吸頻率皆上升，次最大運動時潮氣量上升、頻率下降"
ventilatory-equivalent:
  en: "Ventilatory equivalent for oxygen"
  abbr: "VE/VO2"
  zh: "換氣當量"
  note: "每消耗一單位氧氣所需的換氣量，反映換氣效率；訓練者在此指標上通常優於未訓練者"

# --- 神經適應（ch05）---
size-principle:
  en: "Size principle"
  abbr: ""
  zh: "大小原則"
  note: "運動單位依運動神經元大小由小到大依序徵召；小（慢縮）單位閾值低先徵召，大（快縮）單位閾值高後徵召"
selective-recruitment:
  en: "Selective recruitment"
  abbr: ""
  zh: "選擇性徵召"
  note: "爆發性、彈道式動作可不依大小原則順序，優先徵召快縮運動單位"
cross-education:
  en: "Cross-education"
  abbr: ""
  zh: "交叉教育效應"
  note: "單側肢體訓練使對側未受訓練肢體肌力提升的現象，源自中樞神經適應而非肌肉本身改變"

# --- 肌肉肥大（ch05）---
mtor:
  en: "Mammalian target of rapamycin"
  abbr: "mTOR"
  zh: "哺乳動物雷帕黴素標靶蛋白"
  note: "Akt/mTOR 路徑是機械負荷觸發肌蛋白合成與肌生成的核心訊號路徑，肌纖維收縮時訊號大幅上升"
myostatin:
  en: "Myostatin"
  abbr: ""
  zh: "肌肉生長抑制素"
  note: "抑制性生長因子，阻力訓練後表現下調，與 Akt/mTOR 上調共同促成淨蛋白合成大於分解"
eimd:
  en: "Exercise-induced muscle damage"
  abbr: "EIMD"
  zh: "運動誘發肌肉損傷"
  note: "高強度無氧訓練造成 myofibril 與肌節結構破壞，觸發基因表現改變、發炎修復與蛋白轉換增加，是長期肥大訊號鏈的一部分"
hyperplasia:
  en: "Hyperplasia"
  abbr: ""
  zh: "肌纖維增生"
  note: "高強度阻力訓練誘發肌纖維縱向分裂、數量增加的假說；動物模型確認，人體證據矛盾且具爭議，若發生估計佔比不到 10%"

# --- 去訓練（ch05）---
reversibility:
  en: "Reversibility"
  abbr: ""
  zh: "可逆性原則"
  note: "訓練誘發的適應是暫時性的，訓練負荷不足或移除時會逐漸消失；損失幅度取決於去訓練期間長度與原本的訓練狀態"

# --- 過度訓練（ch05）---
overreaching:
  en: "Overreaching / functional overreaching"
  abbr: "FOR"
  zh: "過度撐／功能性過度撐"
  note: "訓練刺激加大造成短期表現下降的計畫性策略；數天至數週內可恢復，適當減量（tapering）後可誘發超補償"
nonfunctional-overreaching:
  en: "Nonfunctional overreaching"
  abbr: "NFOR"
  zh: "非功能性過度撐"
  note: "過度撐持續未獲足夠恢復，惡化為表現停滯或下降數週至數月的狀態，與 OTS 早期難以區分"
overtraining-syndrome:
  en: "Overtraining syndrome"
  abbr: "OTS"
  zh: "過度訓練症候群"
  note: "運動員及多個生理、神經化學、荷爾蒙調節機制的長期適應不良，可持續六個月以上，最壞情況足以終結運動生涯"
poms:
  en: "Profile of Mood States"
  abbr: "POMS"
  zh: "情緒狀態量表"
  note: "測量緊張、憂鬱、憤怒、活力、疲憊、困惑等心理向度的量表，用於偵測過度訓練相關的情緒紊亂，常先於表現下降出現"
