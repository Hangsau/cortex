# 全書術語表：知識單位的 terms 欄位只放 key，中英對照與說明集中在這裡。
# 一個術語補一次，全書所有引用同時修好。abbr 有值代表它是縮寫，網頁會展開全稱。
# 新增 key 後跑 tools/cscs_check.py，會列出「被引用但未定義」與「定義了沒人用」。

# --- 骨骼 ---
axial-skeleton:
  en: "Axial skeleton"
  zh: "軸心骨骼"
  note: "身體中軸的骨頭：頭顱、脊椎、肋骨、胸骨"
appendicular-skeleton:
  en: "Appendicular skeleton"
  zh: "附肢骨骼"
  note: "四肢與連接四肢的帶狀骨：肩帶、上肢、骨盆帶、下肢"
fibrous-joint:
  en: "Fibrous joint"
  zh: "纖維關節"
  note: "以纖維結締組織直接相連，幾乎不能動，例如顱縫"
cartilaginous-joint:
  en: "Cartilaginous joint"
  zh: "軟骨關節"
  note: "以軟骨相連，可小幅活動，例如椎間盤"
synovial-joint:
  en: "Synovial joint"
  zh: "滑液關節"
  note: "關節囊內含滑液、關節面覆軟骨，活動度最大，運動動作幾乎都發生在這類關節"
hyaline-cartilage:
  en: "Hyaline cartilage"
  zh: "透明軟骨"
  note: "覆蓋關節面的光滑軟骨，負責降低摩擦"
synovial-fluid:
  en: "Synovial fluid"
  zh: "滑液"
  note: "關節囊內的潤滑液"
uniaxial-joint:
  en: "Uniaxial joint"
  zh: "單軸關節"
  note: "只繞一個軸轉動的鉸鏈型關節，例如肘"
biaxial-joint:
  en: "Biaxial joint"
  zh: "雙軸關節"
  note: "可繞兩個互相垂直的軸轉動，例如踝、腕"
multiaxial-joint:
  en: "Multiaxial joint"
  zh: "多軸關節"
  note: "可繞空間三軸轉動的球窩關節，例如肩、髖"
vertebral-column:
  en: "Vertebral column"
  zh: "脊椎"
  note: "由椎骨與其間的椎間盤組成"
periosteum:
  en: "Bone periosteum"
  zh: "骨膜"
  note: "包覆骨頭表面的結締組織，肌腱附著於此"

# --- 肌肉結構 ---
epimysium:
  en: "Epimysium"
  zh: "肌外膜"
  note: "包住整塊肌肉的最外層結締組織，兩端與肌腱連續"
perimysium:
  en: "Perimysium"
  zh: "肌束膜"
  note: "包住一束肌纖維（肌束）的結締組織"
endomysium:
  en: "Endomysium"
  zh: "肌內膜"
  note: "包住單一條肌纖維的結締組織"
fasciculus:
  en: "Fasciculus"
  zh: "肌束"
  plural: "fasciculi"
  note: "一群被肌束膜包住的肌纖維"
muscle-fiber:
  en: "Muscle fiber"
  zh: "肌纖維"
  note: "肌肉細胞，長條圓柱形、多核"
sarcolemma:
  en: "Sarcolemma"
  zh: "肌膜"
  note: "肌纖維的細胞膜"
sarcoplasm:
  en: "Sarcoplasm"
  zh: "肌漿"
  note: "肌纖維的細胞質，含肝醣、脂肪顆粒、酵素與胞器"
myofibril:
  en: "Myofibril"
  zh: "肌原纖維"
  note: "肌漿內的收縮構造束，由肌絲排列而成"
myofilament:
  en: "Myofilament"
  zh: "肌絲"
  note: "肌原纖維的組成單位，分粗絲（肌凝蛋白）與細絲（肌動蛋白）"
myosin:
  en: "Myosin"
  zh: "肌凝蛋白"
  note: "粗絲，有球形頭可與肌動蛋白形成橫橋"
actin:
  en: "Actin"
  zh: "肌動蛋白"
  note: "細絲，雙螺旋排列，上面有肌凝蛋白的結合位點"
sarcomere:
  en: "Sarcomere"
  zh: "肌節"
  note: "骨骼肌最小的收縮單位，兩端以 Z 線為界"
crossbridge:
  en: "Crossbridge"
  zh: "橫橋"
  note: "肌凝蛋白頭與肌動蛋白接上後形成的連接"
z-line:
  en: "Z-line"
  zh: "Z 線"
  note: "肌節的邊界，細絲固定於此"
a-band:
  en: "A-band"
  zh: "A 帶（暗帶）"
  note: "粗絲所在區段，收縮時長度不變"
i-band:
  en: "I-band"
  zh: "I 帶（明帶）"
  note: "只有細絲的區段，收縮時縮短"
h-zone:
  en: "H-zone"
  zh: "H 區"
  note: "肌節中央只有粗絲的區段，收縮時縮短"
m-bridge:
  en: "M-bridge"
  zh: "M 線"
  note: "肌節中央固定相鄰粗絲的構造"
sarcoplasmic-reticulum:
  en: "Sarcoplasmic reticulum"
  abbr: "SR"
  zh: "肌漿網"
  note: "包圍肌原纖維的管道系統，儲存鈣離子"
t-tubule:
  en: "Transverse tubule"
  abbr: "T-tubule"
  zh: "橫小管"
  note: "由肌膜向內延伸的管道，讓動作電位同時抵達肌纖維深處"
troponin:
  en: "Troponin"
  zh: "旋光素／肌鈣蛋白"
  note: "位於細絲上、對鈣離子親和力高的蛋白，鈣結合於此觸發收縮"
tropomyosin:
  en: "Tropomyosin"
  zh: "原肌凝蛋白"
  note: "沿細絲雙螺旋溝槽分布，靜息時遮住結合位點"
motor-end-plate:
  en: "Motor end plate"
  zh: "運動終板"
  note: "運動神經元與肌纖維的接合處，即神經肌肉接合處"

# --- 神經肌肉 ---
motor-neuron:
  en: "Motor neuron"
  zh: "運動神經元"
  note: "從脊髓把電化學訊號送到肌肉的神經細胞"
motor-unit:
  en: "Motor unit"
  zh: "運動單位"
  note: "一個運動神經元加上它所支配的全部肌纖維"
neuromuscular-junction:
  en: "Neuromuscular junction"
  abbr: "NMJ"
  zh: "神經肌肉接合處"
  note: "運動神經末梢與肌纖維之間的化學傳遞介面"
acetylcholine:
  en: "Acetylcholine"
  abbr: "ACh"
  zh: "乙醯膽鹼"
  note: "在神經肌肉接合處釋放的神經傳導物質"
action-potential:
  en: "Action potential"
  zh: "動作電位"
  note: "沿神經或肌膜傳導的電訊號"
all-or-none:
  en: "All-or-none principle"
  zh: "全有全無律"
  note: "運動單位受刺激時全部纖維一起收縮，刺激加強不會讓單次收縮更強"
twitch:
  en: "Twitch"
  zh: "單收縮"
  note: "單一動作電位引發的短暫收縮"
tetanus:
  en: "Tetanus"
  zh: "強直收縮"
  note: "高頻刺激使單收縮融合，運動單位在此達到最大力量"
recruitment:
  en: "Recruitment"
  zh: "運動單位徵召"
  note: "藉由啟動更多運動單位來增加肌肉力量"
rate-coding:
  en: "Rate coding"
  zh: "頻率調節"
  note: "藉由提高運動單位的放電頻率來增加力量"
slow-twitch:
  en: "Slow-twitch fiber"
  zh: "慢縮肌纖維"
  note: "即 Type I，收縮與放鬆慢、抗疲勞"
fast-twitch:
  en: "Fast-twitch fiber"
  zh: "快縮肌纖維"
  note: "即 Type II，收縮與放鬆快、易疲勞"
myosin-atpase:
  en: "Myosin adenosine triphosphatase"
  abbr: "Myosin ATPase"
  zh: "肌凝蛋白 ATP 水解酶"
  note: "分解 ATP 供橫橋做功的酵素；其染色深淺也用來分辨快慢縮纖維"
mhc:
  en: "Myosin heavy chain"
  abbr: "MHC"
  zh: "肌凝蛋白重鏈"
  note: "肌凝蛋白的大分子次單元，定量它可更精確分型肌纖維"
atp:
  en: "Adenosine triphosphate"
  abbr: "ATP"
  zh: "三磷酸腺苷"
  note: "細胞的直接能量貨幣"
adp:
  en: "Adenosine diphosphate"
  abbr: "ADP"
  zh: "二磷酸腺苷"
  note: "ATP 去掉一個磷酸後的產物"
power-stroke:
  en: "Power stroke"
  zh: "動力衝程"
  note: "肌凝蛋白頭彎折、把細絲拉向肌節中心的那一下"

# --- 本體感覺 ---
proprioceptor:
  en: "Proprioceptor"
  zh: "本體感覺受器"
  note: "位於關節、肌肉、肌腱，感應壓力與張力的感覺受器"
muscle-spindle:
  en: "Muscle spindle"
  zh: "肌梭"
  note: "偵測肌肉長度與長度變化速率的本體感覺受器"
intrafusal-fiber:
  en: "Intrafusal fiber"
  zh: "梭內纖維"
  note: "肌梭內部經過改良的肌纖維"
extrafusal-fiber:
  en: "Extrafusal fiber"
  zh: "梭外纖維"
  note: "一般負責產生力量的肌纖維"
gto:
  en: "Golgi tendon organ"
  abbr: "GTO"
  zh: "高爾基肌腱器"
  note: "位於肌腱、與梭外纖維串聯的張力受器，張力過高時反射性抑制收縮"
myotendinous-junction:
  en: "Myotendinous junction"
  zh: "肌腱接合處"
  note: "肌肉與肌腱交界處"
cns:
  en: "Central nervous system"
  abbr: "CNS"
  zh: "中樞神經系統"
  note: "腦與脊髓"
inhibitory-interneuron:
  en: "Inhibitory interneuron"
  zh: "抑制性中間神經元"
  note: "脊髓內負責抑制運動神經元的中繼神經元"
kinesthetic-sense:
  en: "Kinesthetic sense"
  zh: "動覺"
  note: "對身體各部位相對於重力之位置的意識感知"

# --- 心血管 ---
atrium:
  en: "Atrium"
  zh: "心房"
  plural: "atria"
  note: "心臟上腔，接收回流血液後送入心室"
ventricle:
  en: "Ventricle"
  zh: "心室"
  note: "心臟下腔，是推動血液前進的主要力量來源"
tricuspid-valve:
  en: "Tricuspid valve"
  zh: "三尖瓣"
  note: "右心房與右心室之間的瓣膜"
mitral-valve:
  en: "Mitral valve (bicuspid valve)"
  zh: "二尖瓣"
  note: "左心房與左心室之間的瓣膜"
av-valve:
  en: "Atrioventricular valves"
  abbr: "AV valves"
  zh: "房室瓣"
  note: "三尖瓣與二尖瓣的合稱，防止心室收縮時血液逆流回心房"
semilunar-valve:
  en: "Semilunar valves"
  zh: "半月瓣"
  note: "主動脈瓣與肺動脈瓣的合稱，防止心室舒張時血液倒灌回心室"
systole:
  en: "Systole"
  zh: "收縮期"
  note: "心室收縮、把血打出去的階段"
diastole:
  en: "Diastole"
  zh: "舒張期"
  note: "心室放鬆、回充血液的階段"
sa-node:
  en: "Sinoatrial node"
  abbr: "SA node"
  zh: "竇房結"
  note: "位於右心房上外側壁的天然節律點"
av-node:
  en: "Atrioventricular node"
  abbr: "AV node"
  zh: "房室結"
  note: "位於右心房後隔壁，訊號在此稍作延遲再進入心室"
internodal-pathway:
  en: "Internodal pathways"
  zh: "結間傳導路徑"
  note: "把訊號從竇房結帶到房室結的傳導路徑"
av-bundle:
  en: "Atrioventricular bundle"
  abbr: "AV bundle"
  zh: "房室束"
  note: "把訊號帶進心室的傳導束"
bundle-branch:
  en: "Bundle branches"
  zh: "左右束支"
  note: "房室束分出的左右分支，傳導速度遠快於房室結纖維"
purkinje-fiber:
  en: "Purkinje fibers"
  zh: "浦金氏纖維"
  note: "束支末端遍布心室的傳導纖維，使兩心室幾乎同時收縮"
myocardium:
  en: "Myocardium"
  zh: "心肌"
  note: "心臟的肌肉層"
sympathetic:
  en: "Sympathetic nervous system"
  zh: "交感神經系統"
  note: "自律神經的一支，活化時加快竇房結去極化、心率上升"
parasympathetic:
  en: "Parasympathetic nervous system"
  zh: "副交感神經系統"
  note: "自律神經的一支，活化時減慢竇房結放電、心率下降"
chronotropic:
  en: "Chronotropic effect"
  zh: "變時性效應"
  note: "改變心跳速率的作用"
bradycardia:
  en: "Bradycardia"
  zh: "心搏徐緩"
  note: "安靜心率低於每分鐘 60 次"
tachycardia:
  en: "Tachycardia"
  zh: "心搏過速"
  note: "安靜心率高於每分鐘 100 次"
ecg:
  en: "Electrocardiogram"
  abbr: "ECG"
  zh: "心電圖"
  note: "從體表記錄心臟電活動的圖形"
depolarization:
  en: "Depolarization"
  zh: "去極化"
  note: "膜電位反轉，膜內由負轉正，是引發機械收縮的電刺激"
repolarization:
  en: "Repolarization"
  zh: "再極化"
  note: "去極化後膜電位回復的過程"
p-wave:
  en: "P-wave"
  zh: "P 波"
  note: "心房去極化，隨之心房收縮"
qrs-complex:
  en: "QRS complex"
  zh: "QRS 複合波"
  note: "心室去極化，常由 Q、R、S 三個分開的波組成"
t-wave:
  en: "T-wave"
  zh: "T 波"
  note: "心室再極化"
artery:
  en: "Artery"
  zh: "動脈"
  note: "把血從心臟快速送出的血管，管壁強韌多肌"
arteriole:
  en: "Arteriole"
  zh: "小動脈"
  note: "動脈末端的控制血管，可完全關閉或大幅擴張以調節微血管血流"
capillary:
  en: "Capillary"
  zh: "微血管"
  note: "管壁極薄，負責血液與組織間液的物質交換"
venule:
  en: "Venule"
  zh: "小靜脈"
  note: "收集微血管血液後匯入靜脈"
vein:
  en: "Vein"
  zh: "靜脈"
  note: "把血送回心臟的血管，管壁薄，可當血液儲存庫"
hemoglobin:
  en: "Hemoglobin"
  zh: "血紅素"
  note: "紅血球內的鐵蛋白分子，負責運送氧氣，同時是酸鹼緩衝物"
carbonic-anhydrase:
  en: "Carbonic anhydrase"
  zh: "碳酸酐酶"
  note: "催化二氧化碳與水反應的酵素，協助二氧化碳排除"
skeletal-muscle-pump:
  en: "Skeletal muscle pump"
  zh: "骨骼肌幫浦"
  note: "收縮的肌肉壓迫靜脈，配合單向瓣膜把血推回心臟"

# --- 呼吸 ---
trachea:
  en: "Trachea"
  zh: "氣管"
  note: "第一代呼吸道"
bronchus:
  en: "Bronchi"
  zh: "支氣管"
  note: "左右主支氣管為第二代呼吸道"
bronchiole:
  en: "Bronchiole"
  zh: "細支氣管"
  note: "支氣管之後逐代變細的氣道"
alveolus:
  en: "Alveoli"
  zh: "肺泡"
  note: "氣體交換發生的終端氣囊"
diaphragm:
  en: "Diaphragm"
  zh: "橫膈膜"
  note: "主要吸氣肌，安靜呼吸幾乎全靠它"
pleura:
  en: "Pleura"
  zh: "胸膜／肋膜"
  note: "包覆肺與襯在胸壁內側的膜"
pleural-pressure:
  en: "Pleural pressure"
  zh: "胸膜腔壓"
  note: "肺膜與胸壁膜之間的壓力，正常略呈負值"
alveolar-pressure:
  en: "Alveolar pressure"
  zh: "肺泡壓"
  note: "聲門開啟且無氣流時肺泡內的壓力，此時等於大氣壓"
diffusion:
  en: "Diffusion"
  zh: "擴散"
  note: "分子隨機運動造成的淨移動，由高濃度往低濃度"
partial-pressure:
  en: "Partial pressure"
  zh: "分壓"
  note: "混合氣體中單一氣體所佔的壓力，是氣體擴散的驅動力"
valsalva:
  en: "Valsalva maneuver"
  zh: "閉氣用力法"
  note: "閉住聲門用力，提高腹內壓以穩定軀幹"

# --- 生物力學（ch02）---
mechanical-advantage:
  en: "Mechanical advantage"
  zh: "機械利益"
  abbr: "MA"
  note: "肌肉力臂與阻力臂的比值；>1 省力，<1 費力（人體大多<1）"
moment-arm:
  en: "Moment arm"
  zh: "力矩臂"
  abbr: ""
  note: "力的作用線到旋轉軸的垂直距離；又稱力臂、槓桿臂或扭矩臂"
torque:
  en: "Torque"
  zh: "力矩"
  abbr: ""
  note: "使物體繞支點旋轉的傾向；定義為力的大小乘以力矩臂長度"
fulcrum:
  en: "Fulcrum"
  zh: "支點"
  abbr: ""
  note: "槓桿的旋轉軸心"
sagittal-plane:
  en: "Sagittal plane"
  zh: "矢狀面"
  abbr: ""
  note: "將身體分為左右兩半的平面；主要動作為屈曲和伸展"
frontal-plane:
  en: "Frontal plane"
  zh: "冠狀面"
  abbr: ""
  note: "將身體分為前後兩半的平面；主要動作為外展和內收"
transverse-plane:
  en: "Transverse plane"
  zh: "橫切面"
  abbr: ""
  note: "將身體分為上下兩半的平面；主要動作為旋轉"
anatomical-position:
  en: "Anatomical position"
  zh: "解剖姿勢"
  abbr: ""
  note: "直立、手臂垂放兩側、手掌朝前；所有方向與動作描述的基準姿勢"
angle-of-pennation:
  en: "Angle of pennation"
  zh: "羽狀角度"
  abbr: ""
  note: "肌纖維與肌肉起止點連線之間的夾角；角度越大，平行肌節越多，力量越強但速度越慢"
force-velocity:
  en: "Force–velocity relationship"
  zh: "力-速度關係"
  abbr: ""
  note: "向心收縮速度越快力量越低（反比），離心收縮在約90°/s達到峰值後緩降"
concentric-action:
  en: "Concentric muscle action"
  zh: "向心肌肉動作"
  abbr: ""
  note: "肌肉縮短：收縮力 > 阻力；如舉重的上舉相"
eccentric-action:
  en: "Eccentric muscle action"
  zh: "離心肌肉動作"
  abbr: ""
  note: "肌肉延長：收縮力 < 阻力；如放下重量；可產生三種動作中最大的力"
isometric-action:
  en: "Isometric muscle action"
  zh: "等長肌肉動作"
  abbr: ""
  note: "肌肉長度不變：收縮力 = 阻力；如棒式支撐時腹肌的作用"
fluid-resistance:
  en: "Fluid resistance"
  zh: "流體阻力"
  abbr: ""
  note: "物體在液體或氣體中移動時遇到的阻力；分表面阻力（摩擦）與形狀阻力（形狀）兩種"
inertial-force:
  en: "Inertial force"
  zh: "慣性力"
  abbr: ""
  note: "加速或減速質量時額外施加或釋放的力；F = m × a"
bracketing-technique:
  en: "Bracketing technique"
  zh: "括弧訓練法"
  abbr: ""
  note: "使用比正常輕和比正常重的器材練習同一運動動作，藉由力-速度關係擴展速度訓練範圍"
classic-formula:
  en: "Classic formula (for cross-weight-class comparison)"
  zh: "古典公式（跨量級比較）"
  abbr: ""
  note: "將舉起重量除以體重的2/3次方，修正體型對肌力/體重比的系統性影響"
positive-work:
  en: "Positive work"
  zh: "正功"
  abbr: ""
  note: "肌肉對外部物體做功（如上舉重量增加位能）；反之為負功（重量對肌肉做功）"
power-output:
  en: "Power output"
  zh: "功率輸出"
  abbr: ""
  note: "做功的時間速率：P = W/t = F × v（SI單位：瓦特 W）"

# --- 結締組織與骨骼適應（ch05）---
osteoblast:
  en: "Osteoblast"
  zh: "成骨細胞"
  note: "受機械負荷刺激後遷移到骨表面、分泌膠原並促成礦化的造骨細胞"
bone-modeling:
  en: "Bone modeling"
  zh: "骨骼建模"
  note: "骨頭因應機械負荷改變形狀與直徑的過程，與單純汰換舊骨的重塑不同"
minimal-essential-strain:
  en: "Minimal essential strain"
  abbr: "MES"
  zh: "最小必要應變"
  note: "啟動新骨生成的應變門檻；低於它的力不構成造骨刺激"
bone-mineral-density:
  en: "Bone mineral density"
  abbr: "BMD"
  zh: "骨質密度"
  note: "單位面積骨骼中沉積的礦物質量，是骨骼適應最常用的指標"
progressive-overload:
  en: "Progressive overload"
  zh: "漸進超負荷"
  note: "逐步施加高於身體已習慣的需求，組織才會持續適應"
structural-exercise:
  en: "Structural exercise"
  zh: "結構性動作"
  note: "力的向量沿軸向穿過脊椎與髖的多關節動作，例如深蹲、爆發上搏"
repetition-maximum:
  en: "Repetition maximum"
  abbr: "RM"
  zh: "最大反覆次數"
  note: "某重量最多能完成的反覆次數；1RM 即只能舉起一次的重量"
collagen:
  en: "Collagen"
  zh: "膠原蛋白"
  note: "結締組織的主要結構成分；骨、肌腱、韌帶為第一型，軟骨為第二型"
fibroblast:
  en: "Fibroblast"
  zh: "纖維母細胞"
  note: "結締組織中最常見的細胞，負責合成前膠原與細胞外基質，並參與傷口癒合"
cross-link:
  en: "Cross-link"
  zh: "交聯"
  note: "膠原分子之間的共價鍵結；纖維的實際強度來自交聯而非單純數量"
tendon-stiffness:
  en: "Tendon stiffness"
  zh: "肌腱剛度"
  note: "每單位伸長量所能傳遞的力；剛度越高，肌肉出力傳到骨頭的損耗越小"
fascia:
  en: "Fascia"
  zh: "筋膜"
  note: "包覆並分隔骨骼肌各層的纖維結締組織，膠原束朝不同平面排列以抵抗各方向的力"
chondrocyte:
  en: "Chondrocyte"
  zh: "軟骨細胞"
  note: "軟骨中的活細胞；關節被固定導致擴散受阻時會死亡，基質隨之被吸收"
range-of-motion:
  en: "Range of motion"
  abbr: "ROM"
  zh: "關節活動範圍"
  note: "關節能移動的角度範圍；結締組織適應要求力施加於完整範圍"

# --- 生物能量學（ch03）---
phosphagen-system:
  en: "Phosphagen system"
  abbr: ""
  zh: "磷酸原系統"
  note: "利用 ATP 與 CP 直接提供能量的無氧能量系統；速率最快但容量最小"
creatine-phosphate:
  en: "Creatine phosphate"
  abbr: "CP"
  zh: "磷酸肌酸"
  note: "又稱 phosphocreatine（PCr）；肌肉中的高能磷酸儲備，靜息時濃度為 ATP 的 4-6 倍"
creatine-kinase:
  en: "Creatine kinase"
  abbr: "CK"
  zh: "肌酸激酶"
  note: "催化 ADP + CP → ATP + 肌酸的酵素；磷酸原系統的核心反應酶"
glycolysis:
  en: "Glycolysis"
  abbr: ""
  zh: "糖解作用"
  note: "葡萄糖或肌糖原分解為丙酮酸並產生 ATP 的代謝路徑；發生在肌漿中，不需要氧氣"
fast-glycolysis:
  en: "Fast glycolysis"
  abbr: ""
  zh: "快速糖解"
  note: "丙酮酸轉為乳酸的糖解路徑；快速再生 NAD⁺，ATP 生成速率較快但 H⁺ 積累限制持續時間"
slow-glycolysis:
  en: "Slow glycolysis"
  abbr: ""
  zh: "慢速糖解"
  note: "丙酮酸進入粒線體的糖解路徑；速率較慢但可持續較長時間"
pyruvate:
  en: "Pyruvate"
  abbr: ""
  zh: "丙酮酸"
  note: "糖解的最終產物；可轉為乳酸（快速糖解）或進入粒線體（慢速糖解/氧化磷酸化）"
lactate-dehydrogenase:
  en: "Lactate dehydrogenase"
  abbr: "LDH"
  zh: "乳酸脫氫酶"
  note: "催化丙酮酸轉為乳酸的酵素；此反應消耗 H⁺，有輕微鹼化效果"
pfk:
  en: "Phosphofructokinase"
  abbr: "PFK"
  zh: "磷酸果糖激酶"
  note: "糖解的速率限制酶（rate-limiting step）；ATP 為別構抑制劑，AMP 為強力活化劑"
hexokinase:
  en: "Hexokinase"
  abbr: ""
  zh: "己糖激酶"
  note: "催化血糖磷酸化為葡萄糖-6-磷酸的酵素；受 G-6-P 別構抑制（負回饋）"
allosteric-regulation:
  en: "Allosteric regulation"
  abbr: ""
  zh: "別構調節"
  note: "代謝路徑的終產物回饋調節關鍵酵素活性；又稱 end product regulation 或 feedback regulation"
substrate-level-phosphorylation:
  en: "Substrate-level phosphorylation"
  abbr: ""
  zh: "基質磷酸化"
  note: "在單一代謝反應中直接由高能中間物將磷酸轉移給 ADP 生成 ATP；不需氧氣"
oxidative-phosphorylation:
  en: "Oxidative phosphorylation"
  abbr: ""
  zh: "氧化磷酸化"
  note: "在電子傳遞鏈（ETC）中利用 NADH/FADH₂ 的電子梯度驅動 ATP 合成；需要氧氣"
krebs-cycle:
  en: "Krebs cycle"
  abbr: ""
  zh: "Krebs 循環"
  note: "又稱 citric acid cycle 或 TCA cycle；粒線體內氧化乙醯 CoA 並產生 NADH/FADH₂ 的循環反應"
electron-transport-chain:
  en: "Electron transport chain"
  abbr: "ETC"
  zh: "電子傳遞鏈"
  note: "粒線體內利用 NADH/FADH₂ 驅動 ATP 合成的電子載體鏈；O₂ 為最終電子受體"
oxidative-system:
  en: "Oxidative (aerobic) system"
  abbr: ""
  zh: "氧化系統（有氧系統）"
  note: "包含糖解→Krebs 循環→ETC 的完整有氧代謝路徑；ATP 容量最大但速率最慢"
beta-oxidation:
  en: "Beta oxidation"
  abbr: "β-oxidation"
  zh: "β 氧化"
  note: "在粒線體中將游離脂肪酸逐步切割為乙醯 CoA 並產生 NADH/FADH₂ 的反應序列"
bcaa:
  en: "Branched-chain amino acids"
  abbr: "BCAA"
  zh: "支鏈胺基酸"
  note: "leucine（白胺酸）、isoleucine（異白胺酸）、valine（纈胺酸）；骨骼肌中被氧化的主要胺基酸"
gluconeogenesis:
  en: "Gluconeogenesis"
  abbr: ""
  zh: "糖質新生"
  note: "從非碳水化合物來源（如乳酸、胺基酸）合成葡萄糖的代謝過程；Cori 循環的肝臟端步驟"
isocitrate-dehydrogenase:
  en: "Isocitrate dehydrogenase"
  abbr: ""
  zh: "異檸檬酸脫氫酶"
  note: "催化 isocitrate → α-ketoglutarate 的 Krebs 循環限速酶；ADP 活化、ATP 別構抑制"
metabolic-acidosis:
  en: "Metabolic acidosis"
  abbr: ""
  zh: "代謝酸中毒"
  note: "高強度運動中胞內 pH 下降的過程；主要來源是粒線體外的 ATP 水解，非乳酸堆積；'lactic acidosis' 是誤稱"
lactate-threshold:
  en: "Lactate threshold"
  abbr: "LT"
  zh: "乳酸閾值"
  note: "血乳酸在基線以上急劇增加的運動強度；未訓練者約 50-60% VO₂max，有氧訓練者約 70-80%"
obla:
  en: "Onset of blood lactate accumulation"
  abbr: "OBLA"
  zh: "血乳酸積累起始點"
  note: "血乳酸達到 4 mmol/L 的第二個積累折點；對應大型運動單位（Type II 纖維）大量徵召"
cori-cycle:
  en: "Cori cycle"
  abbr: ""
  zh: "Cori 循環"
  note: "乳酸由血液運送至肝臟轉為葡萄糖（糖質新生），再釋放回血液的代謝循環"
oxygen-deficit:
  en: "Oxygen deficit"
  abbr: ""
  zh: "氧虧"
  note: "運動初期有氧系統未能即時滿足能量需求所產生的缺口；由無氧機制暫時補充"
epoc:
  en: "Excess postexercise oxygen consumption"
  abbr: "EPOC"
  zh: "運動後過量氧耗"
  note: "運動後攝氧量超過靜息值的部分；用於恢復磷酸原、補充氧氣儲量、散熱等多種目的；不等於氧虧"
vo2max:
  en: "Maximal oxygen uptake"
  abbr: "VO₂max"
  zh: "最大攝氧量"
  note: "個人能攝取、輸送並利用的最大氧氣量；常用於定義有氧能力上限與相對運動強度"
glycogen:
  en: "Glycogen"
  abbr: ""
  zh: "糖原"
  note: "碳水化合物的多聚體儲存形式；肌糖原（約 300-400g）與肝糖原（約 70-100g）是運動的主要糖類底物"
interval-training:
  en: "Interval training"
  abbr: ""
  zh: "間歇訓練"
  note: "使用預設功休比交替進行高強度運動與休息的訓練方法；允許以更高強度完成更多訓練量"
hiit:
  en: "High-intensity interval training"
  abbr: "HIIT"
  zh: "高強度間歇訓練"
  note: "短暫高強度工作期加間歇恢復期；目標使累積時間處於 >90% VO₂max；有 9 個可操控變數"
combination-training:
  en: "Combination training"
  abbr: ""
  zh: "組合訓練"
  note: "又稱 cross-training；將有氧耐力訓練加入無氧運動員計畫；可能抑制最大肌力、爆發力與肌肉圍度增益"
metabolic-specificity:
  en: "Metabolic specificity of training"
  abbr: ""
  zh: "訓練代謝專一性"
  note: "透過適當的運動強度與休息間隔『選擇』特定能量系統進行訓練；訓練設計需符合運動的實際代謝需求"

# --- 內分泌 ---
catecholamine:
  en: "Catecholamine"
  abbr: ""
  zh: "兒茶酚胺"
  note: "由腎上腺髓質分泌的胺類荷爾蒙群（腎上腺素、正腎上腺素、多巴胺），在神經系統直接刺激下快速釋放"
epinephrine:
  en: "Epinephrine"
  abbr: "E"
  zh: "腎上腺素"
  note: "兒茶酚胺主要成員；增加力量（中樞機制）、心跳、血壓、能量可用性與肌肉血流；與乳酸濃度相關"
norepinephrine:
  en: "Norepinephrine"
  abbr: "NE"
  zh: "正腎上腺素"
  note: "兒茶酚胺成員之一；具腎上腺素類似作用，另可收縮血管"
dopamine:
  en: "Dopamine"
  abbr: "DA"
  zh: "多巴胺"
  note: "兒茶酚胺成員；由腎上腺髓質與中樞神經系統分泌"
cortisol:
  en: "Cortisol"
  abbr: ""
  zh: "皮質醇"
  note: "腎上腺皮質分泌的主要糖皮質素；具強烈分解代謝作用；日夜節律明顯（早晨最高）"
glucocorticoid:
  en: "Glucocorticoid"
  abbr: ""
  zh: "糖皮質素"
  note: "腎上腺皮質分泌的類固醇荷爾蒙；調節醣類代謝（促進糖質新生），cortisol 為人體主要代表"
testosterone:
  en: "Testosterone"
  abbr: ""
  zh: "睾固酮"
  note: "男性主要雄性素，由睾丸分泌（女性來自卵巢與腎上腺）；促進蛋白質合成、抑制蛋白質分解"
SHBG:
  en: "Sex hormone–binding globulin"
  abbr: "SHBG"
  zh: "性荷爾蒙結合球蛋白"
  note: "睾固酮和雌激素的主要結合蛋白；不只是載體，本身可與膜受器結合啟動 cAMP 途徑"
androgen-receptor:
  en: "Androgen receptor"
  abbr: "AR"
  zh: "雄激素受器"
  note: "睾固酮的胞內受器；訓練主要影響受器最大數量（而非結合敏感性）；1-2 次重訓即可增加數量"
IGF:
  en: "Insulin-like growth factor"
  abbr: "IGF"
  zh: "類胰島素生長因子"
  note: "IGF-I（70 個胺基酸）是蛋白質合成的核心媒介；主要由肝臟在 GH 刺激後產生，需 8-24 小時；肌肉受機械刺激時也可局部合成"
IGFBP:
  en: "IGF-binding protein"
  abbr: "IGFBP"
  zh: "IGF 結合蛋白"
  note: "至少 6 種（IGFBP-1～IGFBP-6）；調節 IGF 受器可及性；IGFBP-1 和 IGFBP-3 研究最多，各有獨立生物活性"
ACTH:
  en: "Adrenocorticotropic hormone"
  abbr: "ACTH"
  zh: "促腎上腺皮質激素"
  note: "由前腦垂體分泌，刺激腎上腺皮質分泌糖皮質素（cortisol）"
GAS:
  en: "General Adaptation Syndrome"
  abbr: "GAS"
  zh: "一般適應症候群"
  note: "Selye 提出：壓力 → 警戒反應（功能暫時下降）→ 抵抗期（適應，功能超越基準）→ 耗竭期；週期化理論的理論基礎"
H-RC:
  en: "Hormone–receptor complex"
  abbr: "H-RC"
  zh: "荷爾蒙受器複合體"
  note: "類固醇荷爾蒙與胞質受器結合後形成的複合體；兩個 H-RC 二聚後移入細胞核，作用於 DNA 調控蛋白質合成"
secondary-messenger:
  en: "Secondary messenger"
  abbr: ""
  zh: "二級訊使"
  note: "胜肽荷爾蒙與膜受器結合後在細胞內傳遞訊號的分子，如 cAMP、JAK/STAT"
GHRH:
  en: "Growth hormone–releasing hormone"
  abbr: "GHRH"
  zh: "生長激素釋放激素"
  note: "下視丘分泌，促進前腦垂體釋放 GH；與生長激素抑制素（somatostatin）形成拮抗調節迴路"
somatostatin:
  en: "Somatostatin"
  abbr: ""
  zh: "生長激素抑制素"
  note: "下視丘分泌，抑制前腦垂體釋放 GH；與 GHRH 共同形成複雜神經內分泌回饋迴路"
proenkephalin:
  en: "Proenkephalin"
  abbr: ""
  zh: "前腦啡肽"
  note: "腎上腺髓質分泌的腦啡肽前驅物（如 Peptide F）；增強免疫細胞功能，對運動後恢復至關重要"
mTOR:
  en: "Mechanistic target of rapamycin"
  abbr: "mTOR"
  zh: "雷帕黴素靶蛋白"
  note: "Akt/mTOR 訊號通路控制 mRNA 翻譯起始（蛋白質合成）；可被皮質醇阻斷，被睾固酮對抗；兩者在 DNA 元件上競爭"
diurnal-variation:
  en: "Diurnal variation"
  abbr: ""
  zh: "日夜節律"
  note: "荷爾蒙濃度在一天內的規律性波動；皮質醇和睾固酮在早晨最高；跨研究比較時必須控制採血時間點"
mechano-growth-factor:
  en: "Mechano growth factor"
  abbr: "MGF"
  zh: "機械生長因子"
  note: "肌肉受機械負荷（過負荷、伸展）時局部大量合成的 IGF-I 形式；以自分泌方式作用；被認為是肌肉 IGF-I 最重要的作用途徑"
adrenergic-exhaustion:
  en: "Adrenergic exhaustion"
  abbr: ""
  zh: "腎上腺素能耗竭"
  note: "訓練不變化導致腎上腺髓質持續被刺激，最終使腎上腺素釋放能力下降；週期化訓練是預防關鍵"
lock-key-theory:
  en: "Lock-and-key theory"
  abbr: ""
  zh: "鎖鑰理論"
  note: "描述荷爾蒙（鑰匙）與特異受器（鎖）結合的基本概念；現知荷爾蒙受器互動比此理論更複雜（含異位結合、交叉反應）"
proteolytic-enzyme:
  en: "Proteolytic enzyme"
  abbr: ""
  zh: "蛋白水解酶"
  note: "分解蛋白質的酵素；皮質醇可提升其濃度，加速肌肉蛋白質降解"

# --- 心血管與呼吸（ch05）---
stroke-volume:
  en: "Stroke volume"
  abbr: "SV"
  zh: "心搏量"
  note: "心臟每跳一次搏出的血量；無氧運動時急性上升，且離心期上升幅度大於向心期"
cardiac-output:
  en: "Cardiac output"
  abbr: "CO"
  zh: "心輸出量"
  note: "心搏量 × 心跳率，每分鐘心臟輸出的總血量；無氧運動時急性上升，離心期／閉氣後期上升更明顯"
double-product:
  en: "Double product"
  abbr: ""
  zh: "雙乘積"
  note: "心跳率 × 收縮壓，估算心肌耗氧量的指標；長期訓練後在相同絕對強度下會鈍化（降低）"
afterload:
  en: "Afterload"
  abbr: ""
  zh: "後負荷"
  note: "心室收縮時必須克服的阻力（主要來自動脈壓）；健美選手心血管鈍化反應被認為與後負荷降低有關"
reactive-hyperemia:
  en: "Reactive hyperemia"
  abbr: ""
  zh: "反應性充血"
  note: "血流因阻斷而中斷後，恢復流通時的代償性血流暴增；發生在肌肉收縮阻斷血流之後的休息期"
mvc:
  en: "Maximal voluntary contraction"
  abbr: "MVC"
  zh: "最大自主收縮"
  note: "肌肉能產生的最大自主收縮力；收縮力超過約 20% MVC 時，血管會被夾閉造成局部血流阻斷"
tidal-volume:
  en: "Tidal volume"
  abbr: ""
  zh: "潮氣量"
  note: "每次呼吸進出肺部的氣體量；無氧訓練後在最大運動時潮氣量與呼吸頻率皆上升，次最大運動時潮氣量上升、頻率下降"
ventilatory-equivalent:
  en: "Ventilatory equivalent for oxygen"
  abbr: "VE/VO2"
  zh: "換氣當量"
  note: "每消耗一單位氧氣所需的換氣量，反映換氣效率；訓練者在此指標上通常優於未訓練者"

# --- 神經適應（ch05）---
size-principle:
  en: "Size principle"
  abbr: ""
  zh: "大小原則"
  note: "運動單位依運動神經元大小由小到大依序徵召；小（慢縮）單位閾值低先徵召，大（快縮）單位閾值高後徵召"
selective-recruitment:
  en: "Selective recruitment"
  abbr: ""
  zh: "選擇性徵召"
  note: "爆發性、彈道式動作可不依大小原則順序，優先徵召快縮運動單位"
cross-education:
  en: "Cross-education"
  abbr: ""
  zh: "交叉教育效應"
  note: "單側肢體訓練使對側未受訓練肢體肌力提升的現象，源自中樞神經適應而非肌肉本身改變"

# --- 肌肉肥大（ch05）---
mtor:
  en: "Mammalian target of rapamycin"
  abbr: "mTOR"
  zh: "哺乳動物雷帕黴素標靶蛋白"
  note: "Akt/mTOR 路徑是機械負荷觸發肌蛋白合成與肌生成的核心訊號路徑，肌纖維收縮時訊號大幅上升"
myostatin:
  en: "Myostatin"
  abbr: ""
  zh: "肌肉生長抑制素"
  note: "抑制性生長因子，阻力訓練後表現下調，與 Akt/mTOR 上調共同促成淨蛋白合成大於分解"
eimd:
  en: "Exercise-induced muscle damage"
  abbr: "EIMD"
  zh: "運動誘發肌肉損傷"
  note: "高強度無氧訓練造成 myofibril 與肌節結構破壞，觸發基因表現改變、發炎修復與蛋白轉換增加，是長期肥大訊號鏈的一部分"
hyperplasia:
  en: "Hyperplasia"
  abbr: ""
  zh: "肌纖維增生"
  note: "高強度阻力訓練誘發肌纖維縱向分裂、數量增加的假說；動物模型確認，人體證據矛盾且具爭議，若發生估計佔比不到 10%"

# --- 去訓練（ch05）---
reversibility:
  en: "Reversibility"
  abbr: ""
  zh: "可逆性原則"
  note: "訓練誘發的適應是暫時性的，訓練負荷不足或移除時會逐漸消失；損失幅度取決於去訓練期間長度與原本的訓練狀態"

# --- 過度訓練（ch05）---
overreaching:
  en: "Overreaching / functional overreaching"
  abbr: "FOR"
  zh: "過度撐／功能性過度撐"
  note: "訓練刺激加大造成短期表現下降的計畫性策略；數天至數週內可恢復，適當減量（tapering）後可誘發超補償"
nonfunctional-overreaching:
  en: "Nonfunctional overreaching"
  abbr: "NFOR"
  zh: "非功能性過度撐"
  note: "過度撐持續未獲足夠恢復，惡化為表現停滯或下降數週至數月的狀態，與 OTS 早期難以區分"
overtraining-syndrome:
  en: "Overtraining syndrome"
  abbr: "OTS"
  zh: "過度訓練症候群"
  note: "運動員及多個生理、神經化學、荷爾蒙調節機制的長期適應不良，可持續六個月以上，最壞情況足以終結運動生涯"
poms:
  en: "Profile of Mood States"
  abbr: "POMS"
  zh: "情緒狀態量表"
  note: "測量緊張、憂鬱、憤怒、活力、疲憊、困惑等心理向度的量表，用於偵測過度訓練相關的情緒紊亂，常先於表現下降出現"

# --- 有氧耐力訓練適應（ch06）---
heart-rate:
  en: "Heart rate"
  abbr: "HR"
  zh: "心率"
  note: "心臟每分鐘收縮的次數"
maximal-heart-rate:
  en: "Maximal heart rate"
  zh: "最大心率"
  note: "個人在最大運動時可達的最高心率；估算值仍有明顯個體差異"
oxygen-uptake:
  en: "Oxygen uptake"
  abbr: "V̇O₂"
  zh: "攝氧量"
  note: "身體組織所消耗的氧量"
fick-equation:
  en: "Fick equation"
  zh: "Fick 方程式"
  note: "以心輸出量乘以動靜脈氧差計算攝氧量的關係式"
arteriovenous-oxygen-difference:
  en: "Arteriovenous oxygen difference"
  abbr: "a-v̅O₂ difference"
  zh: "動靜脈氧差"
  note: "動脈血與靜脈血含氧量之差"
metabolic-equivalent:
  en: "Metabolic equivalent"
  abbr: "MET"
  zh: "代謝當量"
  note: "以一般人的估計靜息攝氧量 3.5 ml·kg⁻¹·min⁻¹ 定義的活動強度單位"
venous-return:
  en: "Venous return"
  zh: "靜脈回流"
  note: "經由靜脈回到心臟的血量"
respiratory-pump:
  en: "Respiratory pump"
  zh: "呼吸幫浦"
  note: "呼吸頻率與潮氣量改變胸腔壓力，促進血液回流心臟的機制"
end-diastolic-volume:
  en: "End-diastolic volume"
  abbr: "EDV"
  zh: "舒張末期容積"
  note: "心室在充填期末、可供左心室泵出的血液容積"
frank-starling-mechanism:
  en: "Frank-Starling mechanism"
  zh: "Frank–Starling 機制"
  note: "心肌纖維被舒張末期血量拉得更長時，後續收縮與射血更有力的機制"
systolic-blood-pressure:
  en: "Systolic blood pressure"
  abbr: "SBP"
  zh: "收縮壓"
  note: "心室收縮、血液被射出時對動脈壁施加壓力的估計值"
diastolic-blood-pressure:
  en: "Diastolic blood pressure"
  abbr: "DBP"
  zh: "舒張壓"
  note: "心室舒張、沒有血液被用力射出時對動脈壁施加壓力的估計值"
mean-arterial-pressure:
  en: "Mean arterial pressure"
  abbr: "MAP"
  zh: "平均動脈壓"
  note: "整個心動週期中的平均血壓，不是收縮壓與舒張壓的算術平均"
vasoconstriction:
  en: "Vasoconstriction"
  zh: "血管收縮"
  note: "血管口徑縮小，使局部血流阻力增加的調節作用"
vasodilation:
  en: "Vasodilation"
  zh: "血管擴張"
  note: "血管口徑增大，使局部血流阻力降低的調節作用"
minute-ventilation:
  en: "Minute ventilation"
  zh: "分鐘通氣量"
  note: "每分鐘吸入與呼出的空氣容積"
anatomical-dead-space:
  en: "Anatomical dead space"
  zh: "解剖死腔"
  note: "鼻、口、氣管、支氣管與細支氣管等不進行氣體交換的呼吸通道容積"
physiological-dead-space:
  en: "Physiological dead space"
  zh: "生理死腔"
  note: "因血流、通氣或肺泡表面問題而不能有效交換氣體的肺泡容積"
mitochondria:
  en: "Mitochondria"
  zh: "粒線體"
  note: "細胞內以糖原與游離脂肪酸氧化、有氧產生 ATP 的胞器"
myoglobin:
  en: "Myoglobin"
  zh: "肌紅蛋白"
  note: "在肌肉細胞內運送氧的蛋白質"
insulin-like-growth-factor-i:
  en: "Insulin-like growth factor I"
  abbr: "IGF-I"
  zh: "第一型類胰島素生長因子"
  note: "協助維持肌肉、骨與結締組織完整性，並參與合成性荷爾蒙反應的生長因子"
detraining:
  en: "Detraining"
  zh: "去訓練"
  note: "訓練刺激不足時，訓練誘發適應部分或完全喪失的過程"
tapering:
  en: "Tapering"
  zh: "減量訓練"
  note: "賽前或恢復微週期中有計畫地減少訓練量，通常降低持續時間與頻率但保留強度，以提升表現與適應"
exercise-economy:
  en: "Exercise economy"
  zh: "運動經濟性"
  note: "維持相同功率輸出所需的能量成本，主要受生物力學與技術影響"
hyperventilation:
  en: "Hyperventilation"
  zh: "過度換氣"
  note: "通氣量高於當下代謝需求的呼吸反應；急性海拔暴露初期主要由呼吸頻率增加造成"
hyperoxic-breathing:
  en: "Hyperoxic breathing"
  zh: "高氧呼吸"
  note: "吸入富氧混合氣體；休息期或運動後使用對表現的效益仍未完全釐清"
carboxyhemoglobin:
  en: "Carboxyhemoglobin"
  zh: "碳氧血紅素"
  note: "一氧化碳與血紅素結合形成的化合物，會減少血液可運送的氧量"
blood-doping:
  en: "Blood doping"
  zh: "血液摻假"
  note: "以紅血球輸注或促紅血球生成素人為增加紅血球量、企圖改善有氧表現的做法"
erythropoietin:
  en: "Erythropoietin"
  abbr: "EPO"
  zh: "促紅血球生成素"
  note: "刺激紅血球生成的物質；施用後需經數週產生變化"
sarcopenia:
  en: "Sarcopenia"
  zh: "肌少症"
  note: "隨老化出現的肌肉量與肌力下降"
heart-rate-variability:
  en: "Heart rate variability"
  abbr: "HRV"
  zh: "心率變異性"
  note: "連續心搏間隔的變動；過度訓練症候群出現時可能下降"
growth-hormone:
  en: "Growth hormone"
  abbr: "GH"
  zh: "生長激素"
  note: "參與組織生長與代謝調節的荷爾蒙；過度訓練時腦下垂體分泌可能下降"
osteopenia:
  en: "Osteopenia"
  zh: "骨質減少症"
  note: "骨礦物質密度低於年輕成人平均值、但尚未達骨質疏鬆症界線的狀態"
osteoporosis:
  en: "Osteoporosis"
  zh: "骨質疏鬆症"
  note: "骨礦物質密度顯著降低、骨骼脆弱且骨折風險提高的狀態"
cocontraction:
  en: "Cocontraction"
  zh: "共同收縮"
  note: "跨越同一關節的主動肌與拮抗肌同時活化，以動態穩定關節的運動控制策略"
chronological-age:
  en: "Chronological age"
  zh: "時序年齡"
  note: "以月或年計算的年齡，不直接代表個人的生長與成熟程度"
biological-age:
  en: "Biological age"
  zh: "生理年齡"
  note: "以骨骼、身體或性成熟度評估的成熟程度"
skeletal-age:
  en: "Skeletal age"
  zh: "骨骼年齡"
  note: "以骨骼骨化程度估計的生理成熟度"
tanner-classification:
  en: "Tanner classification"
  zh: "Tanner 分期"
  note: "以第二性徵發育狀況視覺分類性成熟度的五階段方法"
peak-height-velocity:
  en: "Peak height velocity"
  abbr: "PHV"
  zh: "峰值身高速度"
  note: "青春期生長突增中，身高生長速率最高時的年齡"
training-age:
  en: "Training age"
  zh: "訓練年齡"
  note: "持續遵循正式且受監督訓練計畫的時間長度"
muscle-hypertrophy:
  en: "Muscle hypertrophy"
  zh: "肌肉肥大"
  note: "肌肉或個別肌纖維體積增加的適應"
growth-cartilage:
  en: "Growth cartilage"
  zh: "生長軟骨"
  note: "兒童骨骼中與生長和次要骨化有關、易受創傷與過度使用傷害的軟骨組織"
epiphyseal-plate:
  en: "Epiphyseal plate"
  zh: "骨骺板（生長板）"
  note: "長骨末端的生長軟骨區域；完全骨化後長骨停止生長"
anterior-cruciate-ligament:
  en: "Anterior cruciate ligament"
  abbr: "ACL"
  zh: "前十字韌帶"
  note: "膝關節內連接股骨與脛骨、協助限制脛骨相對股骨前移與旋轉的韌帶"
dynamic-knee-valgus:
  en: "Dynamic knee valgus"
  zh: "動態膝外翻"
  note: "接觸地面或動作時膝關節向內塌陷的動態生物力學表現"
muscle-cross-sectional-area:
  en: "Muscle cross-sectional area"
  zh: "肌肉橫截面積"
  note: "垂直於肌肉長軸量得的面積，可用於相對化比較肌肉大小與力量"
female-athlete-triad:
  en: "Female athlete triad"
  zh: "女運動員三聯症"
  note: "女性運動員能量可用性、月經功能與骨礦物質密度之間的健康風險關係"
amenorrhea:
  en: "Amenorrhea"
  zh: "停經"
  note: "月經週期持續中斷的狀態；本章以超過三個月為定義"
luteinizing-hormone:
  en: "Luteinizing hormone"
  abbr: "LH"
  zh: "黃體生成素"
  note: "由腦下垂體分泌、參與調節生殖功能的荷爾蒙"
arousal:
  en: "Arousal"
  zh: "喚醒"
  note: "個體在某一時刻的生理與心理活化程度，也是當下動機強度的表現"
electroencephalography:
  en: "Electroencephalography"
  abbr: "EEG"
  zh: "腦電圖"
  note: "記錄腦部電活動的測量方法"
electromyography:
  en: "Electromyography"
  abbr: "EMG"
  zh: "肌電圖"
  note: "記錄肌肉電活動的測量方法"
activation-deactivation-checklist:
  en: "Activation–deactivation checklist"
  zh: "活化－去活化檢核表"
  note: "可用於自陳個人活化狀態的量表"
anxiety:
  en: "Anxiety"
  zh: "焦慮"
  note: "帶有緊張、擔憂、憂懼或恐懼等負面知覺的情緒狀態，並伴隨生理活化"
cognitive-anxiety:
  en: "Cognitive anxiety"
  zh: "認知焦慮"
  note: "焦慮中的認知成分，例如擔憂與負向評價"
somatic-anxiety:
  en: "Somatic anxiety"
  zh: "身體焦慮"
  note: "焦慮的身體反應成分，例如肌肉緊張、心搏過速與胃部不適"
state-anxiety:
  en: "State anxiety"
  zh: "狀態焦慮"
  note: "伴隨自主與隨意神經輸出及內分泌活動升高的短期憂懼與不確定感"
trait-anxiety:
  en: "Trait anxiety"
  zh: "特質焦慮"
  note: "個人傾向將環境知覺為威脅的相對穩定人格特質"
stress:
  en: "Stress"
  zh: "壓力"
  note: "在未能因應會造成重要後果的需求時，需求與因應能力間的重大失衡"
stressor:
  en: "Stressor"
  zh: "壓力源"
  note: "引發壓力反應的環境或認知事件"
distress:
  en: "Distress"
  zh: "負向壓力"
  note: "將壓力源知覺為負面時的壓力狀態，包含認知與身體焦慮"
eustress:
  en: "Eustress"
  zh: "正向壓力"
  note: "正面知覺壓力源所產生的正向心理能量與生理喚醒"
drive-theory:
  en: "Drive theory"
  zh: "驅力理論"
  note: "Hull 提出的喚醒或狀態焦慮越高、表現越高的線性理論"
inverted-u-theory:
  en: "Inverted-U theory"
  zh: "倒 U 理論"
  note: "Yerkes 與 Dodson 提出的喚醒增至最佳程度前有利表現、超過後表現下降的理論"
individual-zones-of-optimal-functioning:
  en: "Individual zones of optimal functioning"
  abbr: "IZOF"
  zh: "個人最佳功能區理論"
  note: "Hanin 提出每人及每種表現情境各有其最佳喚醒帶寬的理論"
catastrophe-theory:
  en: "Catastrophe theory"
  zh: "災難理論"
  note: "Hardy 的模型：認知焦慮存在時，生理喚醒提高可能使表現突然大幅下降"
reversal-theory:
  en: "Reversal theory"
  zh: "逆轉理論"
  note: "Kerr 的理論：喚醒與焦慮對表現的影響取決於個人如何詮釋該喚醒"
attention:
  en: "Attention"
  zh: "注意力"
  note: "進入意識後，對環境與內在線索進行處理的過程"
selective-attention:
  en: "Selective attention"
  zh: "選擇性注意"
  note: "抑制任務無關刺激與想法，以有限注意力空間處理任務相關線索的能力"
routine:
  en: "Routine"
  zh: "例行程序"
  note: "有意識地把想法導向任務相關且可控制事項的心理檢核或儀式"
attentional-styles:
  en: "Attentional styles"
  zh: "注意力風格"
  note: "Nideffer 以方向（內在－外在）與寬度（廣－窄）描述的注意力類型"
broad-external:
  en: "Broad external"
  zh: "廣外部注意"
  note: "藉由觀察環境及其元素來評估情境的注意力焦點"
broad-internal:
  en: "Broad internal"
  zh: "廣內部注意"
  note: "處理多項資訊並形成策略的注意力焦點"
narrow-internal:
  en: "Narrow internal"
  zh: "窄內部注意"
  note: "在心中預演即將進行動作的注意力焦點"
narrow-external:
  en: "Narrow external"
  zh: "窄外部注意"
  note: "聚焦一或兩個外在線索以產生動作的注意力焦點"
cognitive-stage:
  en: "Cognitive stage"
  zh: "認知階段"
  note: "新動作技能學習時，必須費力且有意識調節動作的階段"
associative-stage:
  en: "Associative stage"
  zh: "聯結階段"
  note: "仍須專注任務，但對動作細節較不費心的技能學習階段"
automaticity:
  en: "Automaticity"
  zh: "自動化"
  note: "心智放鬆、技能毋須刻意思考即可自動執行的學習階段"
goal-setting:
  en: "Goal setting"
  zh: "目標設定"
  note: "以逐步提高挑戰的表現標準與明確任務判準，增加知覺成功可能性的過程"
process-goals:
  en: "Process goals"
  zh: "過程目標"
  note: "運動員可控制、聚焦為良好執行技能而必須採取行動的目標"
outcome-goals:
  en: "Outcome goals"
  zh: "結果目標"
  note: "聚焦競賽結果的目標，其達成也取決於他人的能力與努力"
short-term-goals:
  en: "Short-term goals"
  zh: "短期目標"
  note: "與當前訓練或競賽直接相關、可在相對短時間內達成的目標"
long-term-goals:
  en: "Long-term goals"
  zh: "長期目標"
  note: "統整一系列短期目標，並由其達成所導向的上位目標"
feedback:
  en: "Feedback"
  zh: "回饋"
  note: "關於成功或失敗的資訊，可作為修正並朝長期成功前進的機制"
ideal-performance-state:
  en: "Ideal performance state"
  zh: "理想表現狀態"
  note: "運動員典型報告的最佳心理狀態，具有效率、任務相關焦點與自信等特徵"
self-confidence:
  en: "Self-confidence"
  zh: "自信"
  note: "相信自己能成功執行所欲行為的信念"
self-efficacy:
  en: "Self-efficacy"
  zh: "自我效能"
  note: "自信在特定情境下的形式，即知覺自己能在特定情境完成指定任務的能力"
motivation:
  en: "Motivation"
  zh: "動機"
  note: "努力的強度與方向"
intrinsic-motivation:
  en: "Intrinsic motivation"
  zh: "內在動機"
  note: "源自活動本身的喜愛與內在報酬，而非物質獎勵或懲罰的動機"
extrinsic-motivation:
  en: "Extrinsic motivation"
  zh: "外在動機"
  note: "源自外部而非內部來源，並建立在個人化獎賞上的動機"
achievement-motivation:
  en: "Achievement motivation"
  zh: "成就動機"
  note: "努力精通任務、追求卓越、克服障礙並投入競爭或社會比較的動機"
motive-to-achieve-success:
  en: "Motive to achieve success"
  abbr: "MAS"
  zh: "追求成功動機"
  note: "與因成就感到自豪、挑戰自己及評估自身能力有關的人格動機"
motive-to-avoid-failure:
  en: "Motive to avoid failure"
  abbr: "MAF"
  zh: "避免失敗動機"
  note: "與保護自我與自尊、避免失敗所伴隨羞恥感有關的人格動機"
operant:
  en: "Operant"
  zh: "操作行為"
  note: "在增強或懲罰脈絡中，被設定為欲增加或減少發生機率的目標行為"
positive-reinforcement:
  en: "Positive reinforcement"
  zh: "正增強"
  note: "在目標行為後給予正向行動、物件或事件，以增加該行為發生機率"
negative-reinforcement:
  en: "Negative reinforcement"
  zh: "負增強"
  note: "藉由移除通常令人厭惡的行動、物件或事件，以增加目標行為發生機率"
positive-punishment:
  en: "Positive punishment"
  zh: "正懲罰"
  note: "在行為後呈現可能降低該行為發生機率的行動、物件或事件"
negative-punishment:
  en: "Negative punishment"
  zh: "負懲罰"
  note: "移除有價值的事物以降低行為發生機率的懲罰"
self-controlled-practice:
  en: "Self-controlled practice"
  zh: "自我控制練習"
  note: "讓運動員參與練習結構決策，例如選擇何時接受回饋或練習何種技能"
autonomy:
  en: "Autonomy"
  zh: "自主性"
  note: "運動員對選擇與決策有自主感的基本心理需求"
competence:
  en: "Competence"
  zh: "勝任感"
  note: "感到自己能有效完成任務的基本心理需求"
social-relatedness:
  en: "Social relatedness"
  zh: "社會連結感"
  note: "在練習情境中感到與他人有關聯的基本心理需求"
learning:
  en: "Learning"
  zh: "學習"
  note: "導致動作技能能力相對永久改變的過程"
performance:
  en: "Performance"
  zh: "表現"
  note: "在目前環境中對技能的實際執行"
whole-practice:
  en: "Whole practice"
  zh: "整體練習"
  note: "以完整技能為單位進行練習的安排"
part-practice:
  en: "Part practice"
  zh: "部分練習"
  note: "把技能拆為多個子成分分別練習的安排"
segmentation:
  en: "Segmentation"
  zh: "分段法"
  note: "依清楚的動作間斷點，把任務拆為一連串子成分的方法"
fractionalization:
  en: "Fractionalization"
  zh: "分化法"
  note: "把同時發生的子成分拆開個別練習的方法"
simplification:
  en: "Simplification"
  zh: "簡化法"
  note: "藉由改變執行速度或器材等任務特性，降低任務難度的方法"
pure-part-training:
  en: "Pure-part training"
  zh: "純部分訓練"
  note: "各子成分先各自反覆練習，全部完成後再練習完整技能的整合方法"
progressive-part-training:
  en: "Progressive-part training"
  zh: "漸進部分訓練"
  note: "先分別練習前兩部分、再將其結合，依序增加部分直到重組完整技能的方法"
repetitive-part-training:
  en: "Repetitive part training"
  zh: "重複部分訓練"
  note: "先單獨練習第一部分，之後逐一加入每個後續部分直到重組完整技能的方法"
blocked-practice:
  en: "Blocked practice"
  zh: "區塊式練習"
  note: "同一技能連續練習多次後才轉換至另一技能的傳統練習安排"
random-practice:
  en: "Random practice"
  zh: "隨機練習"
  note: "在同一次練習中以隨機順序交替練習多項技能的安排"
variable-practice:
  en: "Variable practice"
  zh: "變化練習"
  note: "在同一次練習中改變同一技能的不同變化，而非反覆單一固定技能的安排"
observational-practice:
  en: "Observational practice"
  zh: "觀察練習"
  note: "藉由觀察將執行的任務或技能進行的練習，也稱動作觀察"
explicit-instructions:
  en: "Explicit instructions"
  zh: "明確指示"
  note: "給予運動員有效執行任務所需規則與具體處方資訊的指示方式"
guided-discovery:
  en: "Guided discovery"
  zh: "引導發現"
  note: "提供整體動作目標與重要提示，但不明說如何完成的指示方式"
discovery:
  en: "Discovery"
  zh: "發現法"
  note: "只交代任務整體目標、幾乎不給執行方向的指示方式"
intrinsic-feedback:
  en: "Intrinsic feedback"
  zh: "內在回饋"
  note: "運動員從自身感官取得、用以調整動作型態的回饋"
augmented-feedback:
  en: "Augmented feedback"
  zh: "擴增回饋"
  note: "由教練等觀察者或影片、實驗室器材等科技提供給運動員的回饋"
knowledge-of-results:
  en: "Knowledge of results"
  zh: "結果知識"
  note: "關於任務目標執行結果的擴增回饋"
knowledge-of-performance:
  en: "Knowledge of performance"
  zh: "表現知識"
  note: "關於運動員動作型態的擴增回饋"
concurrent-feedback:
  en: "Concurrent feedback"
  zh: "同步回饋"
  note: "在任務執行同時提供的回饋"
delayed-feedback:
  en: "Delayed feedback"
  zh: "延遲回饋"
  note: "在任務執行後提供的回饋"
relaxation-techniques:
  en: "Relaxation techniques"
  zh: "放鬆技巧"
  note: "設計用來降低生理喚醒並提高任務相關焦點的心理技巧"
diaphragmatic-breathing:
  en: "Diaphragmatic breathing"
  zh: "橫膈膜呼吸"
  note: "也稱腹式呼吸；以深而有節律的自然呼吸協助放鬆並集中注意力的基本壓力管理技巧"
autonomic-nervous-system:
  en: "Autonomic nervous system"
  abbr: "ANS"
  zh: "自主神經系統"
  note: "調控心臟、呼吸等非隨意生理功能的神經系統"
vagal-tone:
  en: "Vagal tone"
  zh: "迷走神經張力"
  note: "迷走神經對器官的副交感神經影響程度"
progressive-muscle-relaxation:
  en: "Progressive muscle relaxation"
  abbr: "PMR"
  zh: "漸進式肌肉放鬆"
  note: "交替收緊與放鬆各肌群，以辨識並自我調節骨骼肌張力的技巧"
autogenic-training:
  en: "Autogenic training"
  zh: "自律訓練"
  note: "以專注於肢體或肌群溫暖與沉重感，產生身體感受的放鬆練習"
systematic-desensitization:
  en: "Systematic desensitization"
  abbr: "SD"
  zh: "系統減敏感法"
  note: "以放鬆反應取代對恐懼線索的恐懼反應，並按恐懼階層逐步練習的技巧"
counterconditioning:
  en: "Counterconditioning"
  zh: "反制約"
  note: "以新學得的反應取代原先對刺激的制約反應之適應性學習過程"
imagery:
  en: "Imagery"
  zh: "意象"
  note: "運動員在心中創造或重建經驗、模擬運動表現的認知技能"
self-talk:
  en: "Self-talk"
  zh: "自我對話"
  note: "人對自己進行、可出聲或在心中的內在溝通"
acceptable-macronutrient-distribution-range:
  en: "Acceptable Macronutrient Distribution Range"
  abbr: "AMDR"
  zh: "可接受巨量營養素分布範圍"
  note: "在仍可攝取其他必需營養素的前提下，與降低慢性病風險相關的巨量營養素攝取範圍"
adequate-intake:
  en: "Adequate Intake"
  abbr: "AI"
  zh: "足夠攝取量"
  note: "無法建立建議膳食攝取量時所使用的平均每日營養素攝取建議量"
alpha-linolenic-acid:
  en: "Alpha-linolenic acid"
  abbr: "ALA"
  zh: "α-亞麻酸"
  note: "存在於亞麻籽、核桃及部分植物油的 omega-3 脂肪酸，可低效率轉換為 EPA 與 DHA"
amino-acid:
  en: "Amino acid"
  zh: "胺基酸"
  note: "含氮的小分子，是組成蛋白質的基本單位"
anemia:
  en: "Anemia"
  zh: "貧血"
  note: "因健康紅血球不足而影響氧運輸的狀態；本章以持續低鐵儲存造成者為缺鐵性貧血"
board-certified-specialist-in-sports-dietetics:
  en: "Board Certified Specialist in Sports Dietetics"
  abbr: "CSSD"
  zh: "運動營養專科認證"
  note: "Academy of Nutrition and Dietetics 用以區分具運動營養專長註冊營養師的認證"
calcium:
  en: "Calcium"
  zh: "鈣"
  note: "參與骨與牙形成、凝血、肌肉收縮與神經傳導的礦物質"
carbohydrate:
  en: "Carbohydrate"
  zh: "碳水化合物"
  note: "由碳、氫、氧組成，主要作為能量來源的巨量營養素"
cholesterol:
  en: "Cholesterol"
  zh: "膽固醇"
  note: "所有細胞膜的重要結構與功能成分，也是膽鹽、維生素 D 與多種荷爾蒙的前驅物"
conditionally-essential-amino-acid:
  en: "Conditionally essential amino acid"
  zh: "條件必需胺基酸"
  note: "平常可不必由飲食攝取、但在疾病或壓力時變為必需的胺基酸"
dehydration:
  en: "Dehydration"
  zh: "脫水"
  note: "體液流失造成的水分不足狀態；運動時常由流汗損失超過飲水引起"
dietary-reference-intakes:
  en: "Dietary Reference Intakes"
  abbr: "DRIs"
  zh: "飲食參考攝取量"
  note: "用於評估與規劃健康個人飲食的一組營養素攝取標準"
disaccharide:
  en: "Disaccharide"
  zh: "雙醣"
  note: "由兩個單醣組成的碳水化合物，如蔗糖、乳糖與麥芽糖"
docosahexaenoic-acid:
  en: "Docosahexaenoic acid"
  abbr: "DHA"
  zh: "二十二碳六烯酸"
  note: "富含於脂肪魚類的 omega-3 脂肪酸；由 ALA 轉換的比例很低"
eicosapentaenoic-acid:
  en: "Eicosapentaenoic acid"
  abbr: "EPA"
  zh: "二十碳五烯酸"
  note: "富含於脂肪魚類的 omega-3 脂肪酸"
electrolyte:
  en: "Electrolyte"
  zh: "電解質"
  note: "在體液中帶電、參與液體調節、肌肉收縮與神經傳導的礦物質離子"
essential-amino-acid:
  en: "Essential amino acid"
  zh: "必需胺基酸"
  note: "人體無法製造、必須由飲食取得的胺基酸"
estimated-average-requirement:
  en: "Estimated Average Requirement"
  abbr: "EAR"
  zh: "估計平均需要量"
  note: "被認為可滿足特定生命期與性別組中一半健康人口需要的平均每日營養素攝取量"
fat:
  en: "Fat"
  zh: "脂肪"
  note: "本章特指三酸甘油酯；是食物與人體中最常見的脂質形式"
fat-soluble-vitamin:
  en: "Fat-soluble vitamin"
  zh: "脂溶性維生素"
  note: "由脂肪在血中運輸、可儲存在體脂肪的維生素，包括 A、D、E、K"
fatty-acid:
  en: "Fatty acid"
  zh: "脂肪酸"
  note: "與甘油結合形成三酸甘油酯的碳氫鏈；可依雙鍵數分為飽和或不飽和"
fiber:
  en: "Dietary fiber"
  zh: "膳食纖維"
  note: "植物細胞壁成分中的碳水化合物及相關纖維性物質，部分抗人體消化酶作用"
glycemic-index:
  en: "Glycemic index"
  abbr: "GI"
  zh: "升糖指數"
  note: "將食物餐後血糖反應與等克數參考食物比較的排序指標"
glycemic-load:
  en: "Glycemic load"
  abbr: "GL"
  zh: "升糖負荷"
  note: "以升糖指數乘以每份食物的碳水化合物克數再除以一百所估計的升糖反應"
glycogenesis:
  en: "Glycogenesis"
  zh: "糖原合成"
  note: "將進入肌肉或肝臟、未立即供能的葡萄糖合成為糖原的過程"
health-insurance-portability-and-accountability-act:
  en: "Health Insurance Portability and Accountability Act"
  abbr: "HIPAA"
  zh: "健康保險可攜性與責任法案"
  note: "美國規範受保護健康資訊處理的法律"
heme-iron:
  en: "Heme iron"
  zh: "血基質鐵"
  note: "源自血紅素、存在於肉類、魚類與家禽等動物性食物，較不受同餐食物影響的鐵形式"
high-density-lipoprotein:
  en: "High-density lipoprotein"
  abbr: "HDL"
  zh: "高密度脂蛋白"
  note: "血液中運送膽固醇的脂蛋白類別；本章表 9.7 以低於 40 與高於 60 mg/dL 分類"
hydration:
  en: "Hydration"
  zh: "水合狀態"
  note: "身體水分供應與流失維持平衡的狀態與管理"
hypohydration:
  en: "Hypohydration"
  zh: "低水合狀態"
  note: "流汗等水分流失超過液體攝取所形成的體液不足狀態"
hyponatremia:
  en: "Hyponatremia"
  zh: "低血鈉症"
  note: "血鈉過低的狀態；運動中過度攝取無鈉或低鈉液體可使血鈉遭稀釋"
iron:
  en: "Iron"
  zh: "鐵"
  note: "血紅素與肌紅蛋白及部分能量代謝酶系統所需的礦物質"
iron-deficiency-anemia:
  en: "Iron-deficiency anemia"
  zh: "缺鐵性貧血"
  note: "低鐵儲存持續一段時間、使身體無法製造足夠健康紅血球的貧血"
low-density-lipoprotein:
  en: "Low-density lipoprotein"
  abbr: "LDL"
  zh: "低密度脂蛋白"
  note: "血液中運送膽固醇的脂蛋白類別；本章指出 LDL 膽固醇是治療主要目標"
medical-nutrition-therapy:
  en: "Medical nutrition therapy"
  abbr: "MNT"
  zh: "醫療營養治療"
  note: "以食物或營養治療或管理醫療狀況（包括營養素缺乏）的專業服務"
mineral:
  en: "Mineral"
  zh: "礦物質"
  note: "構成骨、牙、指甲或酶，並參與多種代謝功能的無機營養素"
monosaccharide:
  en: "Monosaccharide"
  zh: "單醣"
  note: "單一糖分子，如葡萄糖、果糖及半乳糖"
muscle-protein-synthesis:
  en: "Muscle protein synthesis"
  abbr: "MPS"
  zh: "肌肉蛋白合成"
  note: "肌肉利用胺基酸製造蛋白質的過程；運動後會提高"
myplate:
  en: "MyPlate"
  zh: "我的餐盤"
  note: "美國農業部依飲食指南建立、以用餐餐盤呈現食物群的食物指引系統"
nonheme-iron:
  en: "Nonheme iron"
  zh: "非血基質鐵"
  note: "存在於蔬菜、穀類及鐵強化食物等非肉類食物，吸收容易受同餐成分影響的鐵形式"
omega-3-fatty-acid:
  en: "Omega-3 fatty acid"
  zh: "omega-3 脂肪酸"
  note: "人體無法製造的必需多元不飽和脂肪酸類別，包括魚類的 EPA 與 DHA 及植物食物的 ALA"
omega-6-fatty-acid:
  en: "Omega-6 fatty acid"
  zh: "omega-6 脂肪酸"
  note: "人體無法製造的必需多元不飽和脂肪酸類別，在大豆油、玉米油與紅花油中常見"
polysaccharide:
  en: "Polysaccharide"
  zh: "多醣"
  note: "可含大量葡萄糖單位的碳水化合物，如澱粉、纖維與糖原"
protein:
  en: "Protein"
  zh: "蛋白質"
  note: "由胺基酸組成，是人體每個細胞主要的結構與功能成分之一"
protein-digestibility:
  en: "Protein digestibility"
  zh: "蛋白質消化率"
  note: "以消化時吸收的蛋白質氮量評估蛋白質可消化程度的概念"
protein-digestibility-corrected-amino-acid-score:
  en: "Protein Digestibility Corrected Amino Acid Score"
  abbr: "PDCAAS"
  zh: "蛋白質消化率校正胺基酸分數"
  note: "同時考量蛋白質可消化性與提供合成身體蛋白質所需必需胺基酸能力的品質評量"
recommended-dietary-allowance:
  en: "Recommended Dietary Allowance"
  abbr: "RDA"
  zh: "建議膳食攝取量"
  note: "足以滿足特定生命期與性別組中多數健康人需要的平均每日營養素需求量"
registered-dietitian:
  en: "Registered dietitian"
  abbr: "RD"
  zh: "註冊營養師"
  note: "具營養專業資格的飲食專業人員；本章以具運動營養教育與經驗者稱為運動營養師"
sports-dietitian:
  en: "Sports dietitian"
  zh: "運動營養師"
  note: "具運動營養特定教育與經驗的註冊營養師，提供個人化飲食建議"
sports-nutrition-coach:
  en: "Sports nutrition coach"
  zh: "運動營養教練"
  note: "非註冊營養師、受過基本營養與運動科學訓練，可提供基本營養教育與建議的專業人員"
sports-nutritionist:
  en: "Sports nutritionist"
  zh: "運動營養學家"
  note: "可能在運動營養產業工作或進行研究、可討論特定文獻的具進階學位專業人員"
sweat-rate:
  en: "Sweat rate"
  zh: "排汗率"
  note: "依運動前後體重、運動中飲水量及尿量估計的流汗量指標"
tolerable-upper-intake-level:
  en: "Tolerable Upper Intake Level"
  abbr: "UL"
  zh: "可容忍最高攝取量"
  note: "未被認為與不良健康效應相關的最高平均每日營養素攝取量，涵蓋食物、水與補充品來源"
triglyceride:
  en: "Triglyceride"
  zh: "三酸甘油酯"
  note: "由一個甘油與三個脂肪酸結合形成，是食物與人體中最常見的脂質形式"
urine-specific-gravity:
  en: "Urine specific gravity"
  abbr: "USG"
  zh: "尿液比重"
  note: "可攜且便宜的水合狀態測量法，較適合反映慢性而非急性水分改變"

# --- 第 10 章：運動營養與體重管理 ---
carbohydrate-loading:
  en: "Carbohydrate loading"
  zh: "碳水化合物超補"
  note: "在耐力賽前幾天提高碳水化合物攝取以最大化糖原儲存的策略"
concurrent-training:
  en: "Concurrent training"
  zh: "同時訓練"
  note: "將耐力運動與肌力訓練背靠背安排的訓練方式；書中指出可能減弱相較單獨肌力訓練的肌力增進，但改善耐力表現"
precompetition-meal:
  en: "Precompetition meal"
  zh: "賽前餐"
  note: "比賽前用以維持水合、提高血糖與糖原儲存並避免飢餓的餐食"
sugar-alcohol:
  en: "Sugar alcohol"
  zh: "糖醇"
  note: "化學結構兼具糖與醇特徵、腸道未必完全吸收的碳水化合物；可能造成脹氣、腹脹與痙攣"
creatine-monohydrate:
  en: "Creatine monohydrate"
  zh: "一水肌酸"
  note: "書中列為可安全且有效增加瘦體重的補充品"
basal-metabolic-rate:
  en: "Basal metabolic rate"
  abbr: "BMR"
  zh: "基礎代謝率"
  note: "在隔夜禁食、清醒且仰臥靜止條件下，維持正常身體功能所需的熱量"
resting-metabolic-rate:
  en: "Resting metabolic rate"
  abbr: "RMR"
  zh: "靜息代謝率"
  note: "較容易測量的靜息能量消耗；因先前進食或活動通常高於基礎代謝率"
cunningham-equation:
  en: "Cunningham equation"
  zh: "Cunningham 方程式"
  note: "以瘦體重估計靜息代謝率的預測方程式：RMR = 500 + 22 × LBM（kg）"
harris-benedict-equation:
  en: "Harris-Benedict equation"
  zh: "Harris-Benedict 方程式"
  note: "以性別、體重、身高與年齡預測靜息代謝率、但不納入肌肉量的預測方程式"
lean-body-mass:
  en: "Lean body mass"
  abbr: "LBM"
  zh: "瘦體重"
  note: "體重中非脂肪的部分；Cunningham 方程式以其估算靜息代謝率"
fat-free-mass:
  en: "Fat-free mass"
  abbr: "FFM"
  zh: "無脂體重"
  note: "不含脂肪的身體組成；可用於表達減脂期蛋白質攝取建議"
diet-induced-thermogenesis:
  en: "Diet-induced thermogenesis"
  zh: "飲食誘發性產熱"
  note: "進食後數小時高於靜息代謝率的能量消耗，含消化、吸收、代謝與儲存食物的成本"
body-mass-index:
  en: "Body mass index"
  abbr: "BMI"
  zh: "身體質量指數"
  note: "由身高與體重估計的超重篩檢指標；不能區分脂肪、肌肉與骨量"
waist-circumference:
  en: "Waist circumference"
  zh: "腰圍"
  note: "用於評估疾病相對風險的腹部尺寸指標"
low-carbohydrate-diet:
  en: "Low-carbohydrate diet"
  zh: "低碳水化合物飲食"
  note: "顯著限制碳水化合物的飲食型態；初期體重下降可來自糖原及其伴隨水分減少"
insulin-resistance:
  en: "Insulin resistance"
  zh: "胰島素阻抗"
  note: "身體無法有效利用胰島素、使葡萄糖累積於血液的狀態"
rapid-weight-loss:
  en: "Rapid weight loss"
  zh: "快速減重"
  note: "在短期內、以單靠降低熱量與增加運動無法達到的速度減重"
voluntary-dehydration:
  en: "Voluntary dehydration"
  zh: "主動脫水"
  note: "刻意以利尿劑、三溫暖、水鹽操控或多層衣物等方式流失水分以快速降體重"
anorexia-nervosa:
  en: "Anorexia nervosa"
  zh: "神經性厭食症"
  note: "以體像扭曲、害怕增重或變胖、過度限制熱量與嚴重減重為特徵的飲食疾患"
binge-eating-disorder:
  en: "Binge-eating disorder"
  zh: "暴食疾患"
  note: "反覆出現無法控制的暴食、但不伴隨清除行為的飲食疾患"
bulimia-nervosa:
  en: "Bulimia nervosa"
  zh: "神經性貪食症"
  note: "反覆暴食後以催吐、劇烈運動、瀉藥或利尿劑等方式清除的飲食疾患"
avoidant-restrictive-food-intake-disorder:
  en: "Avoidant/restrictive food intake disorder"
  abbr: "ARFID"
  zh: "迴避／限制性食物攝取疾患"
  note: "因缺乏進食興趣、食物感官特徵或進食不良後果的擔憂而持續無法滿足營養或能量需求的疾患"
rumination-disorder:
  en: "Rumination disorder"
  zh: "反芻疾患"
  note: "反覆咀嚼、再吞嚥或吐出逆流食物的進食疾患"
strength-and-conditioning-professional:
  en: "Strength and conditioning professional"
  zh: "肌力與體能專業人員"
  note: "本書對負責肌力與體能訓練專業角色的稱呼；面對疑似飲食疾患時應轉介，不負責診斷或治療"
very-low-density-lipoprotein:
  en: "Very low-density lipoprotein"
  abbr: "VLDL"
  zh: "極低密度脂蛋白"
  note: "血液中運送脂質的脂蛋白類別；本章以此稱呼較小且較緊密、較具動脈粥樣硬化性的顆粒"
vitamin:
  en: "Vitamin"
  zh: "維生素"
  note: "人體以很小量執行特定代謝功能所需的有機物質，通常作為輔酶"
vitamin-b12:
  en: "Vitamin B12 (cobalamin)"
  zh: "維生素 B12（鈷胺素）"
  note: "對造血與神經系統健康重要、可在肝臟儲存多年的水溶性維生素"
water-soluble-vitamin:
  en: "Water-soluble vitamin"
  zh: "水溶性維生素"
  note: "溶於水並由血液運輸的維生素，包括 B 群與維生素 C；B12 是儲存上的例外"
certified-sports-nutritionist:
  en: "Certified Sports Nutritionist"
  abbr: "CISSN"
  zh: "認證運動營養學家"
  note: "International Society of Sports Nutrition 面向健康、健身與醫療專業人員的資格，要求四年制大學學位或相關大學生身分"
euhydration:
  en: "Euhydration"
  zh: "正常水合狀態"
  note: "身體水分處於正常平衡的狀態；本章表 9.10 以 USG 低於 1.020 g/ml 為截點之一"
fitness-nutrition-specialist:
  en: "Fitness Nutrition Specialist"
  zh: "健身營養專員"
  note: "American Council on Exercise 為私人教練、健康教練、團體健身指導員與健康照護人員設計的認證"
institute-of-medicine:
  en: "Institute of Medicine"
  abbr: "IOM"
  zh: "醫學研究院"
  note: "美國國家科學院體系中提出本章運動飲料成分建議與 DRI 相關架構的機構"
ioc-diploma-in-sports-nutrition:
  en: "IOC Diploma in Sports Nutrition"
  zh: "IOC 運動營養文憑"
  note: "為期兩年、含課程、研討會、教學指導與實驗室實作的運動營養課程"
lipid:
  en: "Lipid"
  zh: "脂質"
  note: "比脂肪更廣的名稱，包含三酸甘油酯、固醇及磷脂質等脂肪相關化合物"
national-football-league:
  en: "National Football League"
  abbr: "NFL"
  zh: "國家美式足球聯盟"
  note: "美國職業美式足球聯盟；本章引用其中跑衛、接球員與線鋒的練習流汗量研究"
national-health-and-nutrition-examination-survey:
  en: "National Health and Nutrition Examination Survey"
  abbr: "NHANES"
  zh: "國民健康與營養檢查調查"
  note: "美國用於描述人口健康與營養狀況的調查；本章引用其女性鈣攝取資料"
pica:
  en: "Pica"
  zh: "異食癖"
  note: "渴望食用洗衣澱粉、泥土、黏土或冰等非食物物質的症狀，可見於缺鐵性貧血"
sports-nutrition-specialist-certification:
  en: "Sports Nutrition Specialist Certification"
  zh: "運動營養專員認證"
  note: "International Society of Sports Nutrition 面向未持四年制大學學位之私人教練或其他健身專業人員的認證"
bioavailability:
  en: "Bioavailability"
  zh: "生物可用性"
  note: "營養素在消化、吸收後可供身體使用的程度"
iron-deficiency:
  en: "Iron deficiency"
  zh: "鐵缺乏"
  note: "體內可用鐵不足的狀態，可依嚴重度由鐵儲存耗竭、邊際缺乏進展至貧血"
iron-depletion:
  en: "Iron depletion"
  zh: "鐵儲存耗竭"
  note: "鐵缺乏依嚴重度區分的第一階段"
marginal-iron-deficiency:
  en: "Marginal iron deficiency"
  zh: "邊際鐵缺乏"
  note: "鐵缺乏依嚴重度區分的第二階段；原文指出即使此階段也可能損害運動表現"
protein-quality:
  en: "Protein quality"
  zh: "蛋白質品質"
  note: "由胺基酸組成與可消化性共同決定、並反映提供生長、維持與修復所需胺基酸能力的特性"

anabolic-steroid:
  en: "Anabolic steroid"
  zh: "合成代謝類固醇"
  note: "睾固酮的人工合成衍生物，具有合成代謝與雄性素作用"
stacking:
  en: "Stacking"
  zh: "堆疊用藥"
  note: "同時使用多種藥物以期產生加成效果的用藥模式"
creatine:
  en: "Creatine"
  zh: "肌酸"
  note: "可由體內合成或飲食取得的含氮有機化合物，參與高強度運動的能量供應"
hmb:
  en: "β-Hydroxy-β-methylbutyrate"
  abbr: "HMB"
  zh: "β-羥基-β-甲基丁酸"
  note: "白胺酸代謝相關衍生物，研究用於減少蛋白質分解"
arginine:
  en: "Arginine"
  zh: "精胺酸"
  note: "參與蛋白質與肌酸合成的條件必需胺基酸"
nitric-oxide:
  en: "Nitric oxide"
  abbr: "NO"
  zh: "一氧化氮"
  note: "參與血管擴張與血流調節的訊號分子"
l-carnitine:
  en: "L-carnitine"
  zh: "L-肉鹼"
  note: "將脂肪酸送入粒線體進行氧化的化合物"
beta-agonist:
  en: "β-Adrenergic agonist"
  zh: "β-腎上腺素促效劑"
  note: "作用於 β-腎上腺素受體、化學上與腎上腺素相關的物質"
lipolysis:
  en: "Lipolysis"
  zh: "脂肪分解"
  note: "將儲存脂肪分解以釋放脂肪酸的代謝過程"
thermogenesis:
  en: "Thermogenesis"
  zh: "產熱"
  note: "能量消耗增加並產生熱的過程"
clenbuterol:
  en: "Clenbuterol"
  zh: "克倫特羅"
  note: "β2-腎上腺素促效劑與支氣管擴張劑"
ephedrine:
  en: "Ephedrine"
  zh: "麻黃素"
  note: "具刺激與產熱作用的 β-腎上腺素促效劑"
ephedra:
  en: "Ephedra"
  zh: "麻黃"
  note: "含麻黃素的植物，亦稱 ma huang"
beta-blocker:
  en: "β-Blocker"
  zh: "β-阻斷劑"
  note: "阻斷 β-腎上腺素受體、減弱兒茶酚胺作用的藥物"
ergolytic:
  en: "Ergolytic"
  zh: "減損表現"
  note: "降低運動或競技表現的作用"
caffeine:
  en: "Caffeine"
  zh: "咖啡因"
  note: "存在於咖啡、茶等食品的中樞神經刺激劑"
energy-drink:
  en: "Preworkout energy drink"
  zh: "運動前能量飲"
  note: "運動前飲用、通常含咖啡因與碳水化合物的液態飲品"
citrus-aurantium:
  en: "Citrus aurantium"
  zh: "苦橙"
  note: "常用於亞洲草藥的柑橘類植物，具有溫和刺激性"
synephrine:
  en: "Synephrine"
  zh: "辛弗林"
  note: "苦橙的已知活性成分，屬擬交感胺"
hematocrit:
  en: "Hematocrit"
  zh: "血比容"
  note: "全血中紅血球所占的體積比例"
blood-viscosity:
  en: "Blood viscosity"
  zh: "血液黏稠度"
  note: "血液流動時的內部阻力；紅血球增加時可能上升"
insulin:
  en: "Insulin"
  zh: "胰島素"
  note: "胰臟分泌、促進葡萄糖與胺基酸進入細胞的合成代謝激素"
human-growth-hormone:
  en: "Human growth hormone"
  abbr: "HGH"
  zh: "人類生長激素"
  note: "腦下垂體前葉分泌、參與生長與代謝調節的蛋白質激素"
gigantism:
  en: "Gigantism"
  zh: "巨人症"
  note: "兒童期生長激素過度分泌造成的異常身高增加"
acromegaly:
  en: "Acromegaly"
  zh: "肢端肥大症"
  note: "青春期後生長激素過度分泌造成的骨骼與器官異常生長疾病"
muscle-buffering-capacity:
  en: "Muscle buffering capacity"
  abbr: "MBC"
  zh: "肌肉緩衝容量"
  note: "高強度運動中調節骨骼肌氫離子濃度的能力"
beta-alanine:
  en: "β-Alanine"
  zh: "β-丙胺酸"
  note: "肌肽合成的速率限制受質，常見於肌肉緩衝補充研究"
carnosine:
  en: "Carnosine"
  zh: "肌肽"
  note: "骨骼肌內可協助緩衝氫離子的二胜肽"
paresthesia:
  en: "Paresthesia"
  zh: "感覺異常"
  note: "皮膚刺痛、刺癢或麻木感"
sodium-bicarbonate:
  en: "Sodium bicarbonate"
  zh: "碳酸氫鈉"
  note: "可提高血液 pH 的制酸劑，亦為小蘇打主要成分"
sodium-citrate:
  en: "Sodium citrate"
  zh: "檸檬酸鈉"
  note: "可提高血液 pH、用於肌肉緩衝研究的鈉鹽"
prohormone:
  en: "Prohormone"
  zh: "前驅激素"
  note: "可轉化或參與其他激素合成的前驅物質"
androstenedione:
  en: "Androstenedione"
  zh: "雄烯二酮"
  note: "睾固酮前驅激素之一"
dehydroepiandrosterone:
  en: "Dehydroepiandrosterone"
  abbr: "DHEA"
  zh: "脫氫表雄酮"
  note: "具較弱雄性素活性的睾固酮前驅激素"
human-chorionic-gonadotropin:
  en: "Human chorionic gonadotropin"
  abbr: "HCG"
  zh: "人類絨毛膜促性腺激素"
  note: "結構與功能接近黃體生成素的胎盤激素"
test-battery:
  en: "Test battery"
  zh: "測驗組合"
  note: "由多項測驗構成、用於評估多個能力面向的安排"
reliability:
  en: "Reliability"
  zh: "信度"
  note: "測驗結果的一致性或可重複程度"
interrater-reliability:
  en: "Interrater reliability"
  zh: "評分者間信度"
  note: "不同評分者在重複場合所得測驗結果的一致程度"
objectivity:
  en: "Objectivity"
  zh: "客觀性"
  note: "本章用作評分者間信度或評分者間一致性的別稱"
validity:
  en: "Validity"
  zh: "效度"
  note: "測驗或測驗項目測量其應測內容的程度"
test-retest-reliability:
  en: "Test–retest reliability"
  zh: "重測信度"
  note: "同一組受測者重複施行同一測驗時，分數的一致性"
typical-error-of-measurement:
  en: "Typical error of measurement"
  abbr: "TE"
  zh: "典型測量誤差"
  note: "包含器材誤差與運動員生物變異的測量誤差統計量"
intrasubject-variability:
  en: "Intrasubject variability"
  zh: "受試者內變異"
  note: "同一受測者未能維持一致表現"
interrater-agreement:
  en: "Interrater agreement"
  zh: "評分者間一致性"
  note: "不同評分者所得結果的一致程度；本章作為評分者間信度的別稱"
intrarater-variability:
  en: "Intrarater variability"
  zh: "評分者內變異"
  note: "同一評分者給出不一致分數的變異"
field-test:
  en: "Field test"
  zh: "場地測驗"
  note: "在實驗室外施行，且不需要大量訓練或昂貴設備的能力測驗"
test:
  en: "Test"
  zh: "測驗"
  note: "評估某一特定工作或活動能力的程序"
measurement:
  en: "Measurement"
  zh: "測量"
  note: "收集測驗資料的過程"
evaluation:
  en: "Evaluation"
  zh: "評估"
  note: "為做決策而分析測驗結果的過程"
pretest:
  en: "Pretest"
  zh: "前測"
  note: "訓練開始前用來判定初始基本能力水準的測驗"
midtest:
  en: "Midtest"
  zh: "中測"
  note: "訓練期間施行一次或多次、用來評估進步的測驗"
formative-evaluation:
  en: "Formative evaluation"
  zh: "形成性評估"
  note: "根據訓練期間中測，通常按規律間隔進行的定期再評估"
posttest:
  en: "Posttest"
  zh: "後測"
  note: "訓練期結束後用來判定訓練計畫是否達成目標的測驗"
construct-validity:
  en: "Construct validity"
  zh: "構念效度"
  note: "測驗代表其潛在構念，亦即整體上量到設計要測內容的能力"
face-validity:
  en: "Face validity"
  zh: "表面效度"
  note: "一般觀察者看來，測驗是否測到它聲稱要測內容的外觀"
content-validity:
  en: "Content validity"
  zh: "內容效度"
  note: "專家判斷測驗是否以適當比例涵蓋所有相關能力"
criterion-referenced-validity:
  en: "Criterion-referenced validity"
  zh: "效標參照效度"
  note: "測驗分數與同一能力另一種測量之間的關聯程度"
concurrent-validity:
  en: "Concurrent validity"
  zh: "同時效度"
  note: "測驗分數與其他已被接受、且測量同一能力測驗分數的關聯程度"
convergent-validity:
  en: "Convergent validity"
  zh: "聚合效度"
  note: "待評測驗與該構念公認標準結果之高度正相關"
predictive-validity:
  en: "Predictive validity"
  zh: "預測效度"
  note: "測驗分數與未來行為或表現相對應的程度"
discriminant-validity:
  en: "Discriminant validity"
  zh: "區辨效度"
  note: "測驗區分不同構念，並與不同構念測驗呈低相關的能力"
aerobic-capacity:
  en: "Aerobic capacity"
  zh: "有氧容量"
  note: "以氧化受質產生能量的最高速率"
agility:
  en: "Agility"
  zh: "敏捷"
  note: "回應運動專項刺激時快速改變全身方向或速度的能力"
anaerobic-capacity:
  en: "Anaerobic capacity"
  zh: "無氧容量"
  note: "磷酸原與無氧糖解系統合併產能的最高速率"
anthropometry:
  en: "Anthropometry"
  zh: "人體測量"
  note: "應用於人體的測量科學，含身高、體重與圍度"
athletic-profile:
  en: "Athletic profile"
  zh: "運動員剖析"
  note: "與運動或位置重要能力相關的一組測驗結果"
back-squat:
  en: "Back squat"
  zh: "後蹲舉"
  note: "槓鈴置於背部進行的深蹲動作"
balance:
  en: "Balance"
  zh: "平衡"
  note: "維持靜態或動態平衡，或使重心位於支撐基底上的能力"
balance-error-scoring-system:
  en: "Balance Error Scoring System"
  abbr: "BESS"
  zh: "平衡錯誤計分系統"
  note: "以多種站姿條件下錯誤數加總的平衡測驗"
bench-press:
  en: "Bench press"
  zh: "臥推"
  note: "平躺於長椅推舉槓鈴的阻力訓練動作"
bench-pull:
  en: "Bench pull"
  zh: "臥姿划船"
  note: "俯臥於長椅、由懸垂位置向下胸或上腹拉槓的動作"
body-composition:
  en: "Body composition"
  zh: "身體組成"
  note: "脂肪與瘦組織按體重所占的相對比例"
central-tendency:
  en: "Central tendency"
  zh: "集中趨勢"
  note: "資料傾向聚集的數值特徵"
descriptive-statistics:
  en: "Descriptive statistics"
  zh: "描述統計"
  note: "用於摘要或描述已知全體資料的統計方法"
difference-score:
  en: "Difference score"
  zh: "差異分數"
  note: "兩個不同測驗時間點成績之間的差"
eccentric-utilization-ratio:
  en: "Eccentric utilization ratio"
  zh: "離心利用比"
  note: "反向動作垂直跳高度與深蹲跳高度的比值"
effect-size:
  en: "Effect size"
  zh: "效果量"
  note: "以平均分數改變相對於前測標準差表示的統計量"
electronic-timing:
  en: "Electronic timing devices"
  zh: "電子計時裝置"
  note: "以電子方式量測衝刺或敏捷時間的計時設備"
five-zero-five-agility-test:
  en: "505 Agility Test"
  zh: "505 敏捷測驗"
  note: "先衝刺至轉折線、轉身後再次通過計時燈的變向測驗"
flexibility:
  en: "Flexibility"
  zh: "柔軟性"
  note: "身體關節的活動範圍"
girth-measurement:
  en: "Girth measurements"
  zh: "圍度測量"
  note: "以量尺在選定身體部位測量周徑的方法"
goniometer:
  en: "Goniometer"
  zh: "測角儀"
  note: "量測關節角度的手動或電子儀器"
hexagon-test:
  en: "Hexagon Test"
  zh: "六角形測驗"
  note: "在六角形各邊連續雙腳跳出的敏捷測驗"
high-speed-muscular-strength:
  en: "High-speed muscular strength"
  zh: "高速肌力"
  note: "肌肉高速收縮時施加高力量的能力"
inferential-statistics:
  en: "Inferential statistics"
  zh: "推論統計"
  note: "從樣本資訊推論母體的統計方法"
local-muscular-endurance:
  en: "Local muscular endurance"
  zh: "局部肌耐力"
  note: "特定肌肉或肌群對次最大阻力反覆收縮的能力"
low-speed-muscular-strength:
  en: "Low-speed muscular strength"
  zh: "低速肌力"
  note: "以相對低動作速度表現的最大肌力"
magnitude-statistics:
  en: "Magnitude statistics"
  zh: "量級統計"
  note: "用以解讀體能測驗改變量實務意義的統計取向"
margaria-kalamen-test:
  en: "Margaria-Kalamen Test"
  zh: "Margaria-Kalamen 測驗"
  note: "由第三階至第九階樓梯衝刺時間計算功率的測驗"
maximal-aerobic-speed:
  en: "Maximal aerobic speed"
  abbr: "MAS"
  zh: "最大有氧速度"
  note: "遞增跑速測驗中能維持的最後速度"
maximal-anaerobic-muscular-power:
  en: "Maximal anaerobic muscular power"
  zh: "最大無氧肌力功率"
  note: "肌肉以高速產生高功率的能力"
mean:
  en: "Mean"
  zh: "平均數"
  note: "分數總和除以分數數目"
median:
  en: "Median"
  zh: "中位數"
  note: "排序資料中位於最中間的分數"
mode:
  en: "Mode"
  zh: "眾數"
  note: "出現頻率最高的分數"
one-point-five-mile-run:
  en: "1.5-Mile (2.4 km) Run"
  zh: "1.5 英里（2.4 km）跑"
  note: "以完成平坦路線時間評估有氧容量的跑測"
one-repetition-maximum:
  en: "One-repetition maximum"
  abbr: "1RM"
  zh: "一次反覆最大重量"
  note: "維持正確形式時只能完成一次的最大重量"
overhead-squat:
  en: "Overhead squat"
  zh: "過頭深蹲"
  note: "持木棍或槓鈴於頭上進行的質性動作篩檢"
partial-curl-up:
  en: "Partial curl-up"
  zh: "部分捲腹"
  note: "用以測量腹肌肌耐力、減少髖屈肌使用的測驗"
percent-change:
  en: "Percent change"
  zh: "百分比改變"
  note: "以百分比表示兩個測驗時間點之間的成績改變"
percentile-rank:
  en: "Percentile rank"
  zh: "百分位名次"
  note: "分數低於某位個人的受測者百分比"
power-clean:
  en: "Power clean"
  zh: "爆發上搏"
  note: "由地面或懸垂位置將槓鈴快速提至肩前的爆發動作"
pro-agility-test:
  en: "Pro Agility Test"
  zh: "Pro 敏捷測驗"
  note: "又稱 20 碼折返跑的三段變向衝刺測驗"
push-up:
  en: "Push-up"
  zh: "伏地挺身"
  note: "以雙手撐地反覆屈伸上肢的局部肌耐力測驗"
range:
  en: "Range"
  zh: "全距"
  note: "一組分數中最低分至最高分的區間"
reactive-strength-index:
  en: "Reactive Strength Index"
  abbr: "RSI"
  zh: "反應力量指數"
  note: "跳躍高度除以接觸時間的指標"
sit-and-reach-test:
  en: "Sit-and-Reach Test"
  zh: "坐姿前彎測驗"
  note: "評估下背與髖部合併柔軟性的測驗"
skinfold-measurement:
  en: "Skinfold measurements"
  zh: "皮褶測量"
  note: "以卡尺量皮膚與皮下脂肪褶厚度的方法"
smallest-worthwhile-change:
  en: "Smallest worthwhile change"
  zh: "最小實質改變"
  note: "測驗可偵測的最小實務重要表現改變"
speed:
  en: "Speed"
  zh: "速度"
  note: "單位時間內的移動距離"
standard-deviation:
  en: "Standard deviation"
  abbr: "SD"
  zh: "標準差"
  note: "一組分數圍繞平均數的變異量"
standing-long-jump:
  en: "Standing Long Jump"
  zh: "立定跳遠"
  note: "由站立反向動作向前跳遠的功率測驗"
star-excursion-balance-test:
  en: "Star Excursion Balance Test"
  abbr: "SEBT"
  zh: "星形伸展平衡測驗"
  note: "單腳站立並以另一腳向多方向伸展觸及的平衡測驗"
static-vertical-jump:
  en: "Static Vertical Jump"
  zh: "靜態垂直跳"
  note: "去除反向動作、由維持下蹲姿勢起跳的垂直跳測驗"
straight-line-sprint-test:
  en: "Straight-Line Sprint Tests"
  zh: "直線衝刺測驗"
  note: "以固定距離最大衝刺時間評估速度的測驗"
t-test:
  en: "T-Test"
  zh: "T 測驗"
  note: "包含前衝、橫移與倒退跑的變向速度測驗"
three-hundred-yard-shuttle:
  en: "300-Yard (274 m) Shuttle"
  zh: "300 碼（274 m）折返跑"
  note: "在兩條相距 25 碼的線間完成六個來回的無氧容量測驗"
twelve-minute-run:
  en: "12-Minute Run"
  zh: "12 分鐘跑"
  note: "以固定 12 分鐘內完成距離計分的有氧跑測"
variability:
  en: "Variability"
  zh: "變異性"
  note: "群體中各分數的離散程度"
vertical-jump:
  en: "Vertical Jump"
  zh: "垂直跳"
  note: "以站立可及高度與跳躍最高高度差計分的跳躍測驗"
ymca-bench-press-test:
  en: "YMCA Bench Press Test"
  zh: "YMCA 臥推測驗"
  note: "以固定負荷與節拍完成最多反覆次數的局部肌耐力測驗"
yo-yo-intermittent-recovery-test:
  en: "Yo-Yo Intermittent Recovery Test"
  abbr: "IRT"
  zh: "Yo-Yo 間歇恢復測驗"
  note: "以漸增速度折返跑與恢復段組成的場地測驗"
z-score:
  en: "z score"
  zh: "z 分數"
  note: "以標準差單位表示個人分數距平均數的距離"
army-push-up-standard:
  en: "Army standard"
  zh: "美國陸軍伏地挺身標準"
  note: "本章用於伏地挺身低點與兩分鐘計時的 Army 協定"
acsm-push-up-standard:
  en: "American College of Sports Medicine standard"
  abbr: "ACSM"
  zh: "美國運動醫學會伏地挺身標準"
  note: "本章用於伏地挺身低點與做到失敗的 ACSM 協定"
dual-x-ray-absorptiometry:
  en: "Dual x-ray absorptiometry"
  abbr: "DEXA"
  zh: "雙能量 X 光吸收儀"
  note: "教材常稱為身體組成評估的黃金標準之一"
vertec:
  en: "Vertec"
  zh: "Vertec 垂直跳量測器"
  note: "以可撥動葉片量測站立與跳躍觸及高度差的商用裝置"
active-stretch:
  en: Active stretch
  zh: 主動拉伸
  note: 由拉伸者自行提供拉伸力的拉伸
autogenic-inhibition:
  en: Autogenic inhibition
  zh: 自身抑制
  note: 張力增加的同一肌肉發生反射性放鬆
ball-and-socket-joint:
  en: Ball-and-socket joint
  zh: 球窩關節
  note: 可在所有解剖平面活動的關節類型
ballistic-stretch:
  en: Ballistic stretch
  zh: 彈震式拉伸
  note: 使用彈跳式動作且不維持終點位置的拉伸
bohr-effect:
  en: Bohr effect
  zh: 波耳效應
  note: 溫度升高促進血紅素與肌紅蛋白釋放氧氣的效應
contract-relax:
  en: Contract-relax
  zh: 收縮－放鬆法
  note: PNF 中先以向心收縮被拉伸肌、再被動拉伸的技術
dynamic-stretch:
  en: Dynamic stretch
  zh: 動態拉伸
  note: 主動通過運動所需活動範圍的功能性拉伸
elasticity:
  en: Elasticity
  zh: 彈性
  note: 被動拉伸後回到原靜止長度的能力
ellipsoidal-joint:
  en: Ellipsoidal joint
  zh: 橢球關節
  note: 橢圓形髁嵌入橢圓形窩的關節類型
fibrosis:
  en: Fibrosis
  zh: 纖維化
  note: 纖維性結締組織取代退化肌纖維的過程
general-warm-up:
  en: General warm-up
  zh: 一般熱身
  note: 熱身中以提升生理參數為主的初始階段
golgi-tendon-organ:
  en: Golgi tendon organ
  zh: 高爾基腱器
  abbr: GTO
  note: 對肌肉張力增加敏感、位於肌腱肌肉交界附近的機械受器
hinge-joint:
  en: Hinge joint
  zh: 鉸鏈關節
  note: 主要在矢狀面活動的關節類型
hold-relax:
  en: Hold-relax
  zh: 保持－放鬆法
  note: PNF 中先以等長收縮被拉伸肌、再被動拉伸的技術
hold-relax-with-agonist-contraction:
  en: Hold-relax with agonist contraction
  zh: 保持－放鬆加主動肌收縮法
  note: PNF 中保持後加入主動肌向心收縮的技術
mobility-drills:
  en: Mobility drills
  zh: 活動度操練
  note: 以動作需求為重點的動態拉伸練習
passive-stretch:
  en: Passive stretch
  zh: 被動拉伸
  note: 由夥伴或器械提供外力的拉伸
plasticity:
  en: Plasticity
  zh: 塑性
  note: 被動拉伸後傾向維持新的較長長度的性質
postactivation-potentiation:
  en: Postactivation potentiation
  zh: 後活化增強
  note: 熱身的非溫度相關效應之一
potentiation:
  en: Potentiation
  zh: 增強
  note: RAMP 中逐漸提升專項活動強度的第三階段
proprioceptive-neuromuscular-facilitation:
  en: Proprioceptive neuromuscular facilitation
  zh: 本體感覺神經肌肉誘發
  abbr: PNF
  note: 結合被動拉伸與主動肌肉動作的拉伸方法
ramp:
  en: Raise, Activate and Mobilize, and Potentiate
  zh: RAMP 熱身架構
  abbr: RAMP
  note: 由提升、活化與活動度、增強三個階段組成的熱身架構
reciprocal-inhibition:
  en: Reciprocal inhibition
  zh: 交互抑制
  note: 主動肌張力增加時，對側受拉伸肌反射性放鬆
specific-warm-up:
  en: Specific warm-up
  zh: 專項熱身
  note: 採用與運動或技能相似動作的熱身階段
static-stretch:
  en: Static stretch
  zh: 靜態拉伸
  note: 緩慢進入並維持終點位置的拉伸
stretch-reflex:
  en: Stretch reflex
  zh: 牽張反射
  note: 快速牽拉刺激肌梭後使受拉伸肌反射性收縮
stretch-tolerance:
  en: Stretch tolerance
  zh: 拉伸耐受度
  note: 耐受拉伸不適感的能力

# --- 第 15 章：自由重量與器械訓練技術 ---
alternated-grip:
  en: Alternated grip
  zh: 交替握
  note: 一手正手握、另一手反手握的握法
clean-grip:
  en: Clean grip
  zh: 高翻握法
  note: 稍寬於肩寬、雙手位於膝外的正手閉合握
closed-grip:
  en: Closed grip
  zh: 閉合握
  note: 拇指環繞槓鈴的握法
false-grip:
  en: False grip
  zh: 開放握
  note: 拇指不環繞槓鈴的握法，又稱 open grip
five-point-body-contact-position:
  en: Five-point body contact position
  zh: 五點身體接觸姿勢
  note: 頭、肩背、臀部與左右腳都穩固接觸椅墊或地面的臥椅姿勢
forced-repetitions:
  en: Forced repetitions
  zh: 強迫反覆
  note: 保護者協助運動員完成反覆的訓練方式，又稱 partner-assisted reps
free-weight-exercises:
  en: Free weight exercises
  zh: 自由重量動作
  note: 使用槓鈴或啞鈴等自由重量進行的動作
grip-width:
  en: Grip width
  zh: 握距
  note: 雙手在槓或把手上的間距
hook-grip:
  en: Hook grip
  zh: 勾握
  note: 拇指置於食指和中指下方的正手握變式
liftoff:
  en: Liftoff
  zh: 起槓協助
  note: 將槓從直立支架移到運動員可開始動作的位置
neutral-grip:
  en: Neutral grip
  zh: 中立握
  note: 指節朝側方、如握手般的握法
neutral-spine:
  en: Neutral spine
  zh: 中立脊椎
  note: 維持脊椎自然對線的姿勢；書中亦以正常腰椎前凸說明腰部位置
out-of-the-rack-exercises:
  en: Out-of-the-rack exercises
  zh: 出架動作
  note: 將槓從架上取出後離開架位執行的動作
partner-assisted-reps:
  en: Partner-assisted reps
  zh: 搭檔輔助反覆
  note: 由搭檔提供協助完成的反覆；書中亦稱 forced repetitions
power-exercises:
  en: Power exercises
  zh: 爆發力動作
  note: 以快速、爆發性槓鈴動作發力的訓練動作
pronated-grip:
  en: Pronated grip
  zh: 正手握
  note: 掌心朝下、指節朝上的握法，又稱 overhand grip
romanian-deadlift:
  en: Romanian deadlift
  abbr: RDL
  zh: 羅馬尼亞硬舉
  note: 先由硬舉將槓離地，膝微屈並以屈髖讓槓貼著大腿下降的動作
front-squat:
  en: Front squat
  zh: 前蹲舉
  note: 將槓架在前肩位置進行的蹲舉
deadlift:
  en: Deadlift
  zh: 硬舉
  note: 從地面以髖與膝伸展將槓鈴舉起的動作
stiff-leg-deadlift:
  en: Stiff-leg deadlift
  zh: 直腿硬舉
  note: 膝維持略至中度屈曲、以屈髖控制槓鈴下放的硬舉變式
forward-step-lunge:
  en: Forward step lunge
  zh: 前跨弓步
  note: 向前跨步、屈前側髖膝並回推至起始位置的動作
step-up:
  en: Step-up
  zh: 踏台
  note: 以前導腳踏上箱頂、以前導腿伸展將身體帶上箱頂的動作
hip-sled:
  en: Hip sled
  zh: 髖部雪橇機
  note: 在靠背支撐下以雙腳推動踏板的器械動作
power-snatch:
  en: Power snatch
  zh: 力量抓舉
  note: 將槓鈴由地面快速連續拉至頭上，以伸肘接槓的爆發力動作
push-press:
  en: Push press
  zh: 推舉
  note: 先以髖膝驅動槓鈴，再由手臂完成過頭位置的爆發力動作
push-jerk:
  en: Push jerk
  zh: 挺舉推舉
  note: 以髖膝驅動槓鈴並在頭上屈髖屈膝接槓的爆發力動作
incline-dumbbell-bench-press:
  en: Incline dumbbell bench press
  zh: 上斜啞鈴臥推
  note: 在上斜臥椅以啞鈴進行的臥推動作
bent-over-row:
  en: Bent-over row
  zh: 俯身划船
  note: 屈髖維持軀幹位置、將槓鈴拉向軀幹的划船動作
lat-pulldown:
  en: Lat pulldown
  zh: 背闊肌下拉
  note: 坐姿將高位槓鈴下拉至鎖骨及上胸區的器械動作
seated-barbell-shoulder-press:
  en: Seated barbell shoulder press
  zh: 坐姿槓鈴肩推
  note: 坐在肩推椅上將槓鈴從鎖骨附近推至頭上的動作
upright-row:
  en: Upright row
  zh: 直立划船
  note: 將槓鈴沿身體拉向下巴的站姿拉動作
barbell-biceps-curl:
  en: Barbell biceps curl
  zh: 槓鈴二頭肌彎舉
  note: 以反手握屈肘將槓鈴由大腿前方舉向前三角肌的動作
triceps-pushdown:
  en: Triceps pushdown
  zh: 三頭肌下壓
  note: 在滑輪器械上固定上臂、伸肘下壓把手的動作
snatch-grip:
  en: Snatch grip
  zh: 抓舉握法
  note: 用於抓舉的寬正手閉合握，可依拳至對側肩或肘至肘距離估算
spotter:
  en: Spotter
  zh: 保護者
  note: 協助動作執行、首要責任為保護運動員安全的人員
sticking-point:
  en: Sticking point
  zh: 黏滯點
  note: 一次反覆中最費力的位置，通常在離心轉向心後不久
supinated-grip:
  en: Supinated grip
  zh: 反手握
  note: 掌心朝上、指節朝下的握法，又稱 underhand grip
weight-belt:
  en: Weight belt
  zh: 護腰帶
  note: 在舉重時協助維持腹內壓的腰帶
accommodating-resistance:
  en: Accommodating resistance
  zh: 適應性阻力
  note: 可在動作範圍中控制動作速度或等速阻力的阻力施加方式
amortization-phase:
  en: Amortization phase
  zh: 攤銷期
  note: 伸展—縮短循環中由離心動作轉換為向心動作的短暫階段
anatomical-core:
  en: Anatomical core
  zh: 解剖學核心
  note: 軸心骨骼及所有起點位於軸心骨骼的近端附著軟組織
anthropometrics:
  en: Anthropometrics
  zh: 人體測量特徵
  note: 個人的身體尺寸與比例特徵
back-squat-with-bands:
  en: Back squat with bands
  zh: 彈力帶背蹲舉
  note: 在背蹲舉槓鈴加掛彈力帶，使阻力隨動作位置改變的動作
bilateral-asymmetries:
  en: Bilateral asymmetries
  zh: 雙側不對稱
  note: 身體左右兩側在力量或動作表現上的差異
bilateral-deficit:
  en: Bilateral deficit
  zh: 雙側缺陷
  note: 單側與雙側動作之間的產力不對稱現象
bilateral-facilitation:
  en: Bilateral facilitation
  zh: 雙側促進
  note: 雙側動作時主動肌群自主活化增加的現象
bodyweight-training:
  en: Bodyweight training
  zh: 自體重量訓練
  note: 以個人的身體重量提供阻力的阻力訓練方法
cast-iron-kettlebell:
  en: Cast iron kettlebell
  zh: 鑄鐵壺鈴
  note: 以鐵鑄成、尺寸會隨重量改變的壺鈴
chains:
  en: Chains
  zh: 鍊條
  note: 加掛於自由重量動作，藉鍊節離地與接觸地面改變阻力的器材
closed-chain-based-exercises:
  en: Closed chain–based exercises
  zh: 閉鎖鏈動作
  note: 教材列為自體重量訓練常見特徵的動作類型
competition-kettlebell:
  en: Competition kettlebell
  zh: 競技壺鈴
  note: 鋼製且各重量尺寸相同、以顏色區分重量的壺鈴
constant-external-resistance:
  en: Constant external resistance
  zh: 恆定外部阻力
  note: 外部負荷在完整動作範圍維持不變的阻力施加方式
core:
  en: Core
  zh: 核心
  note: 常指軀幹或腰骨盆區域；教材指出科學文獻沒有精確一致的定義
farmers-walk:
  en: Farmer's walk
  zh: 農夫走
  note: 雙手各在身側持負荷向前行走的強人訓練動作
front-plank:
  en: Front plank
  zh: 前棒式
  note: 以前臂與腳趾支撐、等長維持軀幹剛性的核心隔離動作
ground-based-free-weight-exercises:
  en: Ground-based free weight exercises
  zh: 地面自由重量動作
  note: 在穩定地面以自由重量執行的多關節動作，例如深蹲與硬舉
hookes-law:
  en: Hooke's law
  zh: 虎克定律
  note: 彈力帶張力等於帶子剛性乘以形變量的關係
instability-devices:
  en: Instability devices
  zh: 不穩定裝置
  note: 以不穩定表面或器材製造姿勢失衡、要求較大穩定功能的裝置
integrated-electromyography:
  en: Integrated electromyography
  zh: 整合肌電圖
  note: 將肌電訊號隨時間整合，以量化肌肉電活動的測量方式
isolation-exercises:
  en: Isolation exercises
  zh: 隔離動作
  note: 不用上下肢參與、以動態或等長動作隔離特定核心肌群的動作
kettlebell-training:
  en: Kettlebell training
  zh: 壺鈴訓練
  note: 使用帶把手球狀負重器材進行的訓練方法
log-clean-and-press:
  en: Log clean and press
  zh: 原木翻舉推舉
  note: 將原木由地面翻舉至前肩，再推舉過頭的強人訓練動作
machine-based-training:
  en: Machine-based training
  zh: 器械訓練
  note: 利用阻力訓練器械所提供穩定性進行的訓練方式
muscle-activation:
  en: Muscle activation
  zh: 肌肉活化
  note: 肌肉在動作中產生的神經肌肉活動程度
rate-of-force-development:
  en: Rate of force development
  zh: 力量發展速率
  note: 產力隨時間增加的速度
relative-strength:
  en: Relative strength
  zh: 相對肌力
  note: 相對於個人體重所表現的力量水準
resistance-bands:
  en: Resistance bands
  zh: 彈力帶
  note: 以拉伸產生阻力、可與自由重量結合的彈性帶材
side-plank:
  en: Side plank
  zh: 側棒式
  note: 以單側前臂與腳支撐、等長維持軀幹剛性的核心隔離動作
single-leg-squat:
  en: Single-leg squat
  zh: 單腿深蹲
  note: 前腳承重、後腳腳背置於板凳或箱子的單側下肢動作；有時稱保加利亞分腿蹲
smith-machine:
  en: Smith machine
  zh: 史密斯機
  note: 槓鈴沿固定軌道移動的訓練器械
stability-ball-jackknife:
  en: Stability ball jackknife
  zh: 穩定球收腿
  note: 以腳部支撐穩定球、屈髖屈膝把球滾向胸部的核心動作
stability-ball-pike:
  en: Stability ball pike
  zh: 穩定球折刀
  note: 以腳部支撐穩定球、伸膝屈髖把球滾向胸部的核心動作
stability-ball-rollout:
  en: Stability ball rollout
  zh: 穩定球前滾
  note: 跪姿以手將穩定球向前滾動並等長維持軀幹剛性的核心動作
stabilizer-muscles:
  en: Stabilizer muscles
  zh: 穩定肌
  note: 協助穩定關節或身體部位、維持動作控制的肌群
stretch-shortening-cycle:
  en: Stretch–shortening cycle
  zh: 伸展—縮短循環
  note: 肌肉先離心伸展再迅速向心縮短的動作循環
strongman-training:
  en: Strongman training
  zh: 強人訓練
  note: 使用輪胎、原木等笨重或不規則器材的訓練方式
suspension-devices:
  en: Suspension devices
  zh: 懸吊裝置
  note: 利用懸吊系統讓身體重量動作增加不穩定與肌肉活化的器材
tire-flip:
  en: Tire flip
  zh: 輪胎翻轉
  note: 將大型輪胎由地面推起並向前翻倒的強人訓練動作
two-arm-kettlebell-swing:
  en: Two-arm kettlebell swing
  zh: 雙手壺鈴盪
  note: 雙手持壺鈴，以屈髖後擺並伸髖伸膝將壺鈴擺至眼睛高度的動作
unilateral-training:
  en: Unilateral training
  zh: 單側訓練
  note: 以單一上肢或下肢執行的訓練介入
variable-resistance:
  en: Variable resistance
  zh: 可變阻力
  note: 隨關節角度或動作位置改變施加阻力的方式

# --- 第 17 章：阻力訓練課程設計 ---
agonist:
  en: Agonist
  zh: 主動肌
  note: 主動造成某動作的肌肉或肌群
antagonist:
  en: Antagonist
  zh: 拮抗肌
  note: 位於肢段另一側、與主動肌相對的肌肉或肌群
assistance-exercise:
  en: Assistance exercise
  zh: 輔助動作
  note: 通常徵召較小肌群、涉及一個主要關節，重要性較核心動作低的阻力訓練動作
circuit-training:
  en: Circuit training
  zh: 循環訓練
  note: 以極短休息在一連串動作間輪替完成訓練的安排
compound-set:
  en: Compound set
  zh: 複合組
  note: 幾乎不休息地連續做兩個訓練同一肌群的不同動作
core-exercise:
  en: Core exercise
  zh: 核心動作
  note: 徵召一個或多個大肌群區域、涉及兩個或以上主要關節且直接應用於運動的動作
exercise-order:
  en: Exercise order
  zh: 動作順序
  note: 一次阻力訓練中各動作的執行次序
exercise-selection:
  en: Exercise selection
  zh: 動作選擇
  note: 依運動需求、技術、器材與時間等條件選定阻力訓練動作
exercise-technique-experience:
  en: Exercise technique experience
  zh: 動作技術經驗
  note: 正確執行阻力訓練動作所具備的知識與技能
goal-repetitions:
  en: Goal repetitions
  zh: 目標次數
  note: 課表中為某動作每組指定要完成的反覆次數
injury-analysis:
  en: Injury analysis
  zh: 傷害分析
  note: 辨識運動中常見關節與肌肉傷害部位及其原因的分析
interset-rest:
  en: Interset rest
  zh: 組間休息
  note: 組與組之間用於恢復的時間
load:
  en: Load
  zh: 負荷
  note: 指派給一組動作的重量
mechanical-work:
  en: Mechanical work
  zh: 機械功
  note: 力與位移的乘積
movement-analysis:
  en: Movement analysis
  zh: 動作分析
  note: 分析運動的身體與肢段動作模式及肌肉參與
multijoint-exercise:
  en: Multijoint exercise
  zh: 多關節動作
  note: 涉及兩個或以上主要關節的阻力訓練動作
muscle-balance:
  en: Muscle balance
  zh: 肌肉平衡
  note: 關節周圍與相對肌群之間適當的肌力、爆發力或肌耐力比率
needs-analysis:
  en: Needs analysis
  zh: 需求分析
  note: 評估運動需求與特徵、並評估運動員以設計課表的兩階段過程
overload:
  en: Overload
  zh: 超負荷
  note: 指派強度高於運動員已習慣程度的訓練刺激
physiological-analysis:
  en: Physiological analysis
  zh: 生理分析
  note: 排定運動對肌力、爆發力、肌肥大與肌耐力需求優先順序的分析
power-exercise:
  en: Power exercise
  zh: 爆發性動作
  note: 以非常快速或爆發方式執行的結構性動作
program-design:
  en: Program design
  zh: 課程設計
  note: 系統性協調訓練變項以促進適應與表現的過程
progression:
  en: Progression
  zh: 漸進
  note: 隨適應以系統且漸進方式提高訓練刺激
recovery-exercise:
  en: Recovery exercise
  zh: 恢復性動作
  note: 不造成高肌肉或神經壓力、用於促進恢復與還原的動作
repetition-volume:
  en: Repetition-volume
  zh: 次數訓練量
  note: 一次訓練中完成的總反覆次數
rest-period:
  en: Rest period
  zh: 休息期
  note: 組與組或動作與動作之間用於恢復的時間
said:
  en: Specific adaptation to imposed demands
  zh: 特定需求適應
  abbr: SAID
  note: 施加於身體的需求類型決定會發生的適應類型
set:
  en: Set
  zh: 組
  note: 連續完成若干反覆後才停下休息的一組動作
single-joint-exercise:
  en: Single-joint exercise
  zh: 單關節動作
  note: 只涉及一個主要關節的阻力訓練動作
specificity:
  en: Specificity
  zh: 特異性
  note: 以特定方式訓練，產生特定適應或訓練結果的原則
split-routine:
  en: Split routine
  zh: 分部位課表
  note: 在不同日訓練不同肌群的訓練安排
superset:
  en: Superset
  zh: 超級組
  note: 幾乎不休息地連續訓練相反作用肌肉或肌群的一對動作
training-background:
  en: Training background
  zh: 訓練背景
  note: 開始新課表或修訂課表前的訓練類型、時間、強度與技術經驗
training-frequency:
  en: Training frequency
  zh: 訓練頻率
  note: 在指定時間期間內完成的訓練節數，阻力訓練通常以每週計
training-status:
  en: Training status
  zh: 訓練狀態
  note: 運動員開始新課表或修訂課表時的當前體能準備程度
two-for-two-rule:
  en: 2-for-2 rule
  zh: 兩加二法則
  note: 最後一組連續兩次比目標多完成至少兩次時，下次增加負荷的規則
volume:
  en: Volume
  zh: 訓練量
  note: 一次訓練中舉起的總重量或所完成的工作總量
volume-load:
  en: Volume-load
  zh: 訓練量負荷
  note: 總組數乘每組次數，再乘每次舉起重量的量化值
bound:
  en: Bound
  zh: 跨步跳
  note: 以誇張跑步步態進行、強調水平移動的下肢增強式動作
box-drill:
  en: Box drill
  zh: 箱上動作
  note: 使用跳箱跳上或踏下，以增加多次跳與跳躍強度的增強式動作
complex-training:
  en: Complex training
  zh: 複合訓練
  note: 高強度阻力訓練後接續增強式訓練的組合方式
concentric-phase:
  en: Concentric phase
  zh: 向心期
  note: 拉伸－縮短週期中主動肌纖維縮短的第三階段
contractile-component:
  en: Contractile component
  zh: 收縮成分
  note: 由肌動蛋白、肌球蛋白與交叉橋組成，為向心肌肉動作主要力量來源的成分
depth-jump:
  en: Depth jump
  zh: 深跳
  note: 由箱上踏下、落地後立即再跳的高強度下肢增強式動作
dynamic-valgus:
  en: Dynamic valgus
  zh: 動態膝外翻
  note: 下肢動作時膝蓋向內移動的排列，為膝傷風險因子
eccentric-phase:
  en: Eccentric phase
  zh: 離心期
  note: 拉伸－縮短週期中預先負載主動肌群、儲存彈性能的第一階段
foot-contact:
  en: Foot contact
  zh: 足部接觸
  note: 下肢增強式訓練中單腳或雙腳同時接觸表面的一次接觸
ground-reaction-force:
  en: Ground reaction force
  zh: 地面反作用力
  note: 地面對運動員足部施加的反作用力
jumps-in-place:
  en: Jumps in place
  zh: 原地跳
  note: 在同一位置反覆跳躍與落地、強調垂直成分的下肢增強式動作
landing-surface:
  en: Landing surface
  zh: 落地面
  note: 進行下肢增強式動作時用以接觸與吸收衝擊的表面
medicine-ball:
  en: Medicine ball
  zh: 藥球
  note: 用於投擲、接球與上肢增強式動作的加重球
multiple-hops-and-jumps:
  en: Multiple hops and jumps
  zh: 多次跳與跳躍
  note: 包含重複移動、可視為原地跳與立定跳結合的下肢增強式動作
parallel-elastic-component:
  en: Parallel elastic component
  zh: 並聯彈性成分
  note: 由肌外膜、肌束膜、肌內膜與肌膜組成，未受刺激肌肉拉伸時產生被動力量
plyometric-exercise:
  en: Plyometric exercise
  zh: 增強式運動
  note: 利用預先拉伸與拉伸－縮短週期，使肌肉在最短時間達到最大力量的快速有力活動
power:
  en: Power
  zh: 功率
  note: 力量被運用的速度所界定的力量－速度關係
series-elastic-component:
  en: Series elastic component
  abbr: SEC
  zh: 串聯彈性成分
  note: 主要由肌腱構成，拉伸時儲存彈性能並在隨後向心動作時釋放的成分
standing-jump:
  en: Standing jump
  zh: 立定跳
  note: 強調水平或垂直成分、各反覆之間有恢復時間的最大努力跳躍動作
acceleration:
  en: Acceleration
  zh: 加速度
  note: 物體速度隨時間改變的速率
braking-impulse:
  en: Braking impulse
  zh: 煞車衝量
  note: 減速與變向時在一定時間內產生的煞車力量所形成的衝量
change-of-direction:
  en: Change of direction
  abbr: COD
  zh: 方向改變
  note: 爆發性改變移動方向、速度或移動模式所需的技能與能力
change-of-direction-deficit:
  en: Change-of-direction deficit
  abbr: COD deficit
  zh: 方向改變缺額
  note: 等長直線衝刺與方向改變測驗完成時間的差，用於表示變向額外所需時間
decision-making-time:
  en: Decision-making time
  zh: 決策時間
  note: 敏捷動作中兩個事件間的時間，可用刺激與第一個明確變向植地之間的時間量測
drop-landing:
  en: Drop landing
  zh: 落下著地
  note: 自高度落下後著地以承受離心負荷的動作
entry-velocity:
  en: Entry velocity
  zh: 入速
  note: 進入方向改變植地相前的運動速度
exit-velocity:
  en: Exit velocity
  zh: 出速
  note: 方向改變植地推離後再加速第一步的水平速度
flight-time:
  en: Flight time
  zh: 騰空時間
  note: 一步結束到下一步開始之間未接觸地面的時間
force:
  en: Force
  zh: 力量
  note: 兩個物體之間的作用；具大小與方向的向量量
ground-contact-time:
  en: Ground contact time
  zh: 接地時間
  note: 衝刺支撐期或方向改變植地期中力量施加到地面的時間
illinois-agility-test:
  en: Illinois agility test
  zh: Illinois 敏捷測驗
  note: 含多次彎繞的路徑測驗；本章將其視為較著重機動性且代謝需求較高的測驗
impulse:
  en: Impulse
  zh: 衝量
  note: 力量與施力時間的乘積，等於力量—時間曲線下的面積
l-run:
  en: L-run
  zh: L 型跑測驗
  note: 含彎繞與多種移動模式、較著重機動性的測驗
maneuverability:
  en: Maneuverability
  zh: 機動性
  note: 在繞過物體或彎繞路徑時盡量維持速度的移動能力
mid-thigh-pull:
  en: Midthigh pull
  zh: 大腿中段拉
  note: 在大腿中段位置進行的舉重衍生拉動作
momentum:
  en: Momentum
  zh: 動量
  note: 物體質量與移動速度的關係；衝量改變會造成動量改變
muscle-stiffness:
  en: Muscle stiffness
  zh: 肌肉剛度
  note: 肌肉系統抵抗變形的特性，在衝刺的腿部彈簧作用中扮演角色
neural-drive:
  en: Neural drive
  zh: 神經驅動
  note: 神經系統送往目標肌肉之衝動的速率與振幅
overstriding:
  en: Overstriding
  zh: 過度跨步
  note: 為求較大步幅而使接地時間增加、干擾正常衝刺步態的技術錯誤
overspeed-training:
  en: Overspeed training
  zh: 超速訓練
  note: 以牽引或下坡等方式讓運動員高於無輔助衝刺速度跑動的訓練
perceptual-cognitive-ability:
  en: Perceptual–cognitive ability
  zh: 知覺—認知能力
  note: 視覺掃描、預期、模式辨識、情境知識、決策與反應等能力
reactive-agility-test:
  en: Reactive agility test
  zh: 反應式敏捷測驗
  note: 含反應刺激、同時測量方向改變速度與知覺—認知能力的測驗
set-position:
  en: Set position
  zh: 預備姿勢
  note: 起跑前以適當肢段角度分配體重、準備爆發施力的姿勢
short-to-long-method:
  en: Short to long method
  zh: 短到長訓練法
  note: 先發展短距離加速，再漸進加入較長衝刺以發展最大速度的概念性模型
small-sided-games:
  en: Small-sided games
  zh: 小場比賽
  note: 以較少參與者與較小場地進行、可加入運動專項刺激的比賽式活動
spring-mass-model:
  en: Spring–mass model
  abbr: SMM
  zh: 彈簧—質量模型
  note: 將跑步描述為身體質量藉肌肉系統類彈簧壓縮與伸展而位移的數學模型
sprinting:
  en: Sprinting
  zh: 衝刺
  note: 通常在短距離與短時間內進行的快速、非配速、最大努力跑動
stride-length:
  en: Stride length
  zh: 步幅
  note: 同一隻腳連續兩次接地的足跟間距
stride-rate:
  en: Stride rate
  zh: 步頻
  note: 每秒完成的步數；本章以此表示衝刺的步態頻率
velocity:
  en: Velocity
  zh: 速度向量
  note: 同時包含移動快慢與方向的向量量
periodization:
  en: Periodization
  zh: 週期化
  note: 以週期與階段安排、策略性調整訓練負荷以改變運動員準備狀態的過程
maximal-aerobic-capacity:
  en: Maximal aerobic capacity
  abbr: V̇O₂max
  zh: 最大有氧能力
  note: 有氧耐力賽中以最大攝氧量表示的最高有氧能力；與表現高度相關但不是唯一決定因素
maximal-lactate-steady-state:
  en: Maximal lactate steady state
  zh: 最大乳酸穩態
  note: 體內最大乳酸產生量與最大乳酸清除量相等時的運動強度
type-i-muscle-fiber:
  en: Type I muscle fiber
  zh: 第一型肌纖維
  note: 本章列為有氧耐力表現相關因素之一的肌纖維類型
type-iix-muscle-fiber:
  en: Type IIx muscle fiber
  zh: 第二型 IIx 肌纖維
  note: 長期 LSD 訓練所涉及肌肉中，教材描述可最終轉變為 Type I 的肌纖維類型
altitude:
  en: Altitude
  zh: 海拔高度
  note: 高於海平面的高度；增加時大氣壓與氧分壓下降
acclimatization:
  en: Acclimatization
  zh: 高度適應
  note: 人體對高海拔低氧環境產生代償性生理調整的過程
live-high-train-low:
  en: Live high, train low
  abbr: LHTL
  zh: 高住低練
  note: 居住於中度高度、在近海平面處訓練的高地訓練方法
age-predicted-maximal-heart-rate:
  en: Age-predicted maximal heart rate
  abbr: APMHR
  zh: 年齡預測最大心率
  note: 以 220 減年齡估計的最大心率，用於無實驗室測試時的強度處方
heart-rate-reserve:
  en: Heart rate reserve
  abbr: HRR
  zh: 心率儲備
  note: 最大心率減安靜心率的差值，用於 Karvonen 目標心率計算
resting-heart-rate:
  en: Resting heart rate
  abbr: RHR
  zh: 安靜心率
  note: 身體靜息狀態下的心率；Karvonen 法的計算輸入值
target-heart-rate:
  en: Target heart rate
  abbr: THR
  zh: 目標心率
  note: 為達指定運動強度所處方的心率；上下限合稱目標心率範圍
karvonen-method:
  en: Karvonen method
  zh: Karvonen 法
  note: 以心率儲備乘指定強度後加上安靜心率，計算目標心率的處方方法
functional-capacity:
  en: Functional capacity
  zh: 功能能力
  note: 本章以 V̇O₂max 表示的最大有氧運動能力
ratings-of-perceived-exertion:
  en: Ratings of perceived exertion
  abbr: RPE
  zh: 自覺用力程度量表
  note: 由運動者主觀評定運動努力程度、可用於調節訓練強度的量表
oxygen-consumption:
  en: Oxygen consumption
  zh: 攝氧量
  note: 身體在單位時間內使用的氧氣量；可用於判定相對於 V̇O₂max 的運動強度
power-measurement:
  en: Power measurement
  zh: 功率量測
  note: 以自行車曲柄或花鼓等裝置量測機械功率、監測訓練強度的方法
off-season:
  en: Off-season
  zh: 休季
  note: 有氧耐力年度計畫中建立體能基礎的賽季階段
base-training:
  en: Base training
  zh: 基礎訓練
  note: 休季的另一名稱，優先建立心肺適能基礎
preseason:
  en: Preseason
  zh: 季前
  note: 在競賽季前提高強度並改善有氧耐力表現相關因素的階段
in-season:
  en: In-season
  zh: 賽季
  note: 將競賽納入訓練安排並維持或改善運動員強弱項的階段
postseason:
  en: Postseason
  zh: 賽後
  note: 競賽季後以恢復、維持基本體能與復健為主的階段
active-rest:
  en: Active rest
  zh: 主動休息
  note: 以低強度、低持續時間活動支持恢復與基本體能維持的時期
exercise-mode:
  en: Exercise mode
  zh: 運動模式
  note: 運動員實際進行的活動形式，如騎車、跑步或游泳
cross-training:
  en: Cross-training
  zh: 交叉訓練
  note: 以主要運動模式以外的活動維持一般體能或分散訓練壓力的訓練方式
training-intensity:
  en: Training intensity
  zh: 訓練強度
  note: 訓練時投入的努力程度，是與持續時間共同決定適應的處方變項
exercise-duration:
  en: Exercise duration
  zh: 運動持續時間
  note: 單次訓練課的長度，通常與可承受的運動強度呈反向關係
type-ii-muscle-fiber:
  en: Type II muscle fiber
  zh: 第二型肌纖維
  note: 隨運動強度提高而增加徵召、可能接受較多有氧訓練刺激的肌纖維類型
exercise-progression:
  en: Exercise progression
  zh: 運動進展
  note: 逐步操弄訓練頻率、強度或持續時間以維持或提升有氧適能的過程
overtraining:
  en: Overtraining
  zh: 過度訓練
  note: 訓練負荷與恢復失衡而造成表現與生理適應受損的狀態
recovery:
  en: Recovery
  zh: 恢復
  note: 訓練後藉休息、補液與恢復燃料來源，為後續訓練重建準備狀態的過程
resistance-training:
  en: Resistance training
  zh: 阻力訓練
  note: 以外加阻力訓練肌肉與力量的訓練方式；耐力運動員可能從中獲得表現與傷害預防效益
long-slow-distance-training:
  en: Long, slow distance training
  abbr: LSD
  zh: 長距離慢速訓練
  note: 以低於競賽配速的中低強度進行長距離或長時間耐力訓練的方法
pace-tempo-training:
  en: Pace/tempo training
  zh: 配速／節奏訓練
  note: 在乳酸閾值、競賽配速或略高於競賽配速進行的耐力訓練方法
work-rest-ratio:
  en: Work:rest ratio
  abbr: W:R
  zh: 工作與休息比
  note: 間歇訓練中工作段持續時間相對於休息或恢復段持續時間的比例
fartlek-training:
  en: Fartlek training
  zh: 法特雷克訓練
  note: 將輕鬆耐力活動與短快衝刺等不同強度交替的速度遊戲訓練
stimulus-fatigue-recovery-adaptation-theory:
  en: Stimulus-fatigue-recovery-adaptation theory
  zh: 刺激—疲勞—恢復—適應理論
  note: 以訓練刺激引發疲勞、經恢復後產生適應的週期化理論
fitness-fatigue-paradigm:
  en: Fitness–fatigue paradigm
  zh: 適能—疲勞典範
  note: 訓練同時產生適能與疲勞後效，兩者合計影響準備狀態的模型
preparedness:
  en: Preparedness
  zh: 準備狀態
  note: 運動員在某一時點可供競賽或訓練的整體表現準備程度
residual-training-effects:
  en: Residual training effects
  zh: 殘留訓練效應
  note: 前一訓練期形成並能影響後續訓練期準備狀態的適能、疲勞與準備狀態後效
multiyear-plan:
  en: Multiyear plan
  zh: 多年計畫
  note: 涵蓋多年的週期化最高層次計畫，設定各訓練年度的發展目標
annual-training-plan:
  en: Annual training plan
  zh: 年度訓練計畫
  note: 一年期的整體訓練藍圖，可含一個或多個大週期
macrocycle:
  en: Macrocycle
  zh: 大週期
  note: 持續數月至一年的訓練週期，由備賽、競賽與轉換期構成
mesocycle:
  en: Mesocycle
  zh: 中週期
  note: 由相連小週期構成、通常持續二至六週的中型訓練區塊
microcycle:
  en: Microcycle
  zh: 小週期
  note: 由多個訓練日構成、通常持續數日至二週的小型訓練週期
training-day:
  en: Training day
  zh: 訓練日
  note: 在某一小週期脈絡下設計的一日訓練，可包含多個訓練節次
training-session:
  en: Training session
  zh: 訓練節次
  note: 一段通常持續數小時的訓練；各訓練段間休息超過三十分鐘時視為不同節次
preparatory-period:
  en: Preparatory period
  zh: 備賽期
  note: 無競賽且技術、戰術或專項工作有限的時期，目標是建立較高強度訓練的耐受基礎
general-preparatory-phase:
  en: General preparatory phase
  zh: 一般備賽相
  note: 備賽期初段，以高訓練量、低強度及多樣手段建立一般身體基礎
specific-preparatory-phase:
  en: Specific preparatory phase
  zh: 特殊備賽相
  note: 一般備賽相之後，提高運動專項訓練比重以準備競賽期的階段
hypertrophy-strength-endurance-phase:
  en: Hypertrophy/strength endurance phase
  zh: 肌肥大／肌力耐力相
  note: 備賽初期以低至中強度與高訓練量，發展瘦體重或肌肉與代謝耐力基礎的階段
basic-strength-phase:
  en: Basic strength phase
  zh: 基礎肌力相
  note: 特殊備賽相中的阻力訓練階段，以較高強度發展主要運動動作所需肌群的肌力
first-transition-period:
  en: First transition period
  zh: 第一轉換期
  note: 連接備賽期與競賽期、將訓練重點轉向肌力及爆發力發展的時期
strength-power-phase:
  en: Strength/power phase
  zh: 肌力／爆發力相
  note: 第一轉換期中的主要階段，以低訓練量和依動作決定的低至很高負荷發展肌力與爆發力
competitive-period:
  en: Competitive period
  zh: 競賽期
  note: 以競賽準備為中心，兼顧維持適能與降低疲勞的訓練時期
peaking:
  en: Peaking
  zh: 巔峰調整
  note: 以很低訓練量調整疲勞，使運動員在約一至二週的重要競賽期間達到巔峰狀態的策略
maintenance:
  en: Maintenance
  zh: 維持計畫
  note: 長賽季中以中至高強度及低至中訓練量維持肌力與爆發力的競賽期安排
second-transition-period:
  en: Second transition period
  zh: 第二轉換期
  note: 競賽期後、下一年度計畫或大週期備賽期前，供恢復與銜接的時期
daily-undulating-periodization:
  en: Daily undulating periodization
  abbr: DUP
  zh: 每日波動週期化
  note: 在同一小週期內大幅改變核心阻力動作負荷、訓練量與訓練焦點的週期化模型
traditional-periodization:
  en: Traditional periodization
  zh: 傳統週期化
  note: 在中週期逐步提高強度的週期化模型；其小週期及中週期內仍有非線性負荷波動
linear-periodization:
  en: Linear periodization
  zh: 線性週期化
  note: 對傳統週期化模型常見但教材認為不精確的稱呼
supercompensation:
  en: Supercompensation
  zh: 超補償
  note: 訓練壓力適當且未過量時，適應所造成的調整進一步提高運動員表現能力的現象
quadrennial-plan:
  en: Quadrennial plan
  zh: 四年期計畫
  note: 持續四年的多年訓練計畫
athletic-trainer:
  en: Athletic trainer
  zh: 運動防護員
  abbr: ATC
  note: 在隊醫督導下，負責運動員日常健康、傷害評估、治療與復健協調的專業人員
bradykinin:
  en: Bradykinin
  zh: 緩激肽
  note: 組織受傷後可釋出、增加局部血流與微血管通透性的化學介質
closed-kinetic-chain:
  en: Closed kinetic chain exercise
  zh: 閉鎖動力鏈運動
  note: 末端關節受相當阻力限制而遠端節段固定的運動
contraindication:
  en: Contraindication
  zh: 禁忌症
  note: 因特定傷勢而不宜或禁止的活動、做法或治療
contusion:
  en: Contusion
  zh: 挫傷
  note: 直接創傷造成的組織傷害；肌肉挫傷可使周圍組織血液與液體過度累積
counselor:
  en: Counselor
  zh: 諮商師
  note: 可協助受傷運動員因應傷害伴隨心理壓力的合格心理專業人員
dapre:
  en: Daily adjustable progressive resistive exercise
  zh: 每日可調整漸進阻力運動
  abbr: DAPRE
  note: 依第三組完成次數調整第四組與下次訓練阻力的四組阻力訓練系統
de-lorme:
  en: De Lorme program
  zh: 德洛姆訓練系統
  note: 三組十下、由 10RM 的 50%、75% 至 100% 遞增阻力的金字塔系統
dislocation:
  en: Dislocation
  zh: 脫臼
  note: 關節面完全移位的關節創傷
edema:
  en: Edema
  zh: 水腫
  note: 液體逸入周圍組織造成的腫脹；可抑制收縮組織並限制功能
exercise-physiologist:
  en: Exercise physiologist
  zh: 運動生理學家
  note: 以運動科學訓練背景協助設計考量代謝反應的體能計畫者
fibroblastic-repair:
  en: Fibroblastic repair phase
  zh: 纖維母細胞修復期
  note: 發炎期後形成新毛細血管、結締組織與第三型膠原蛋白的組織修復階段
fracture:
  en: Fracture
  zh: 骨折
  note: 骨創傷造成的骨完整性中斷，可分閉鎖性、開放性、撕脫性或不完全性
glenohumeral-joint:
  en: Glenohumeral joint
  zh: 盂肱關節
  note: 肩胛骨關節盂與肱骨頭形成的肩關節
histamine:
  en: Histamine
  zh: 組織胺
  note: 受傷後局部組織可釋出、增加血流與微血管通透性的化學介質
indication:
  en: Indication
  zh: 適應症
  note: 復健中受傷運動員需要的治療或運動形式
inflammation:
  en: Inflammation
  zh: 發炎
  note: 傷害的初始反應，也是正常組織癒合所必需的一環
inflammatory-response:
  en: Inflammatory response phase
  zh: 發炎反應期
  note: 傷後最初的癒合階段，特徵為疼痛、腫脹與發紅
isokinetic-exercise:
  en: Isokinetic exercise
  zh: 等速運動
  note: 器械在指定動作速度下提供阻力的運動形式
isometric-exercise:
  en: Isometric exercise
  zh: 等長運動
  note: 肌肉長度不改變的肌肉動作；肌力增益具關節角度特異性
isotonic-exercise:
  en: Isotonic exercise
  zh: 等張運動
  note: 以固定外部阻力完成向心與離心動作的運動形式
kinetic-chain:
  en: Kinetic chain
  zh: 動力鏈
  note: 兩個或更多依序相連關節共同參與以產生動作
macrophage:
  en: Macrophage
  zh: 巨噬細胞
  note: 在傷區搜尋並移除可能拖慢癒合之細胞碎屑的免疫細胞
macrotrauma:
  en: Macrotrauma
  zh: 宏觀創傷
  note: 特定、突發的組織過載事件，造成組織完整性受破壞
maturation-remodeling:
  en: Maturation-remodeling phase
  zh: 成熟重塑期
  note: 新組織在漸進負荷下以第一型膠原蛋白改善排列、強度與功能的癒合階段
microtrauma:
  en: Microtrauma
  zh: 微觀創傷
  note: 連續訓練或恢復不足下反覆異常應力造成的過度使用傷害
neuromuscular-control:
  en: Neuromuscular control
  zh: 神經肌肉控制
  note: 肌肉回應傳入感覺資訊以維持關節穩定性的能力
nutritionist:
  en: Nutritionist
  zh: 營養師
  note: 可提供促進傷後組織恢復之食物選擇指引的營養專業人員
open-kinetic-chain:
  en: Open kinetic chain exercise
  zh: 開放動力鏈運動
  note: 末端關節可自由活動、可集中於特定關節或肌肉的運動
oxford:
  en: Oxford program
  zh: 牛津訓練系統
  note: 三組十下、由 10RM 的 100%、75% 至 50% 遞減阻力的金字塔系統
patient-reported-outcome:
  en: Patient-reported outcome
  zh: 病人自評結果
  note: 由運動員以既定結果表單回報的功能狀態
pep:
  en: Prevent Injury and Enhance Performance
  zh: 傷害預防與表現提升計畫
  abbr: PEP
  note: 以處理傷害風險因子的運動與動作降低下肢傷害風險的結構化計畫
phagocytosis:
  en: Phagocytosis
  zh: 吞噬作用
  note: 清除受傷組織碎屑與病原體的過程
physical-agent:
  en: Physical agent
  zh: 物理因子
  note: 復健中可使用的冰敷、加壓、抬高、電刺激或超音波等處置
physical-therapist:
  en: Physical therapist
  zh: 物理治療師
  note: 協助減痛、恢復功能、制定治療策略或管理長期復健的醫療專業人員
previous-injury:
  en: Previous injury
  zh: 先前受傷
  note: 活動者未來受傷最重要的風險因子之一
proprioception:
  en: Proprioception
  zh: 本體感覺
  note: 由皮膚、肌肉、肌腱、韌帶與關節囊受器產生的傳入感覺資訊
psychiatrist:
  en: Psychiatrist
  zh: 精神科醫師
  note: 可協助受傷運動員因應心理壓力的醫師
psychologist:
  en: Psychologist
  zh: 心理學家
  note: 可協助受傷運動員因應心理壓力的心理專業人員
scapular-dyskinesis:
  en: Scapular dyskinesis
  zh: 肩胛骨運動異常
  note: 上肢傷害的風險因子之一
sports-certified-specialist:
  en: Sports Certified Specialist
  zh: 運動專科認證
  abbr: SCS
  note: 美國具運動傷害管理專長物理治療師可取得的專科資格
sportsmetrics:
  en: Sportsmetrics
  zh: Sportsmetrics 傷害預防計畫
  note: 處理下肢傷害風險因子的結構化預防計畫
sprain:
  en: Sprain
  zh: 韌帶扭傷
  note: 韌帶創傷，依撕裂程度與關節不穩定性分三級
strain:
  en: Strain
  zh: 肌肉拉傷
  note: 間接創傷造成的肌肉肌腱傷害，依肌纖維撕裂程度分三級
stress-fracture:
  en: Stress fracture
  zh: 疲勞性骨折
  note: 最常見的骨過度使用傷害
subluxation:
  en: Subluxation
  zh: 半脫臼
  note: 關節面部分移位的關節創傷
team-physician:
  en: Team physician
  zh: 隊醫
  note: 為團隊提供醫療照護，通常最終判定運動員是否可回歸比賽的醫師
tendinitis:
  en: Tendinitis
  zh: 肌腱炎
  note: 肌腱的發炎狀況
tendinopathy:
  en: Tendinopathy
  zh: 肌腱病變
  note: 發炎極少且有新血管生成特徵的退化性肌腱狀況
throwers-ten:
  en: Throwers Ten
  zh: Throwers Ten 肩部訓練計畫
  note: 常與關節活動範圍運動一起用於降低上肢傷害風險的結構化計畫
type-i-collagen:
  en: Type I collagen
  zh: 第一型膠原蛋白
  note: 成熟重塑期產生、較強並可改善新生組織結構與功能的膠原蛋白
type-iii-collagen:
  en: Type III collagen
  zh: 第三型膠原蛋白
  note: 修復期沿受傷結構隨機沉積、作為組織再生架構的膠原蛋白
indoor-turf:
  en: Indoor turf
  zh: 室內草皮
  note: 可用於增強式、敏捷、體能、地面動作與雪橇推的室內訓練地面
weightlifting-platform:
  en: Weightlifting platform
  zh: 舉重平台
  note: 理想上中央為木材、外側為橡膠的舉重動作地面
heating-ventilation-and-air-conditioning:
  en: Heating, ventilation, and air conditioning
  zh: 暖氣、通風與空調系統
  abbr: HVAC
  note: 可為設施各區提供加熱、冷卻與空氣循環的系統
predesign-phase:
  en: Predesign phase
  zh: 前設計期
  note: 新設施設計的第一階段，包含需求分析、可行性研究與主計畫形成
design-phase:
  en: Design phase
  zh: 設計期
  note: 將委員會構想整合為設計與藍圖、考量法規及器材規格的階段
construction-phase:
  en: Construction phase
  zh: 施工期
  note: 從開工到完工、持續依主計畫管理目標與期限的階段
preoperation-phase:
  en: Preoperation phase
  zh: 前營運期
  note: 設施開放前完成裝潢、人員、維護排程及行政作業的階段
feasibility-study:
  en: Feasibility study
  zh: 可行性研究
  note: 評估投資、位置、市場、競爭與成長潛力以判定設施可行性的研究
swot-analysis:
  en: SWOT analysis
  zh: 優劣機威分析
  abbr: SWOT
  note: 分析優勢、弱點、機會與威脅的可行性研究工具
master-plan:
  en: Master plan
  zh: 主計畫
  note: 涵蓋設施建築、施工、設計、預算與營運的整體規劃
safety-cushion:
  en: Safety cushion
  zh: 安全緩衝
  note: 為安全移動或防止碰撞而在器材周邊預留的額外空間
germicidal-cleaner:
  en: Germicidal cleaner
  zh: 殺菌清潔劑
  note: 可用於擦拭設施表面、抑制微生物生長並防止 HIV 與肝炎傳播的清潔劑
out-of-order:
  en: Out of Order
  zh: 停止使用
  note: 標示無法正常運作器材的警示文字
nsca-safety-checklist:
  en: NSCA’s Safety Checklist for Exercise Facility and Equipment Maintenance
  zh: NSCA 設施與器材安全檢查表
  note: 用以檢查設施、器材與清潔維護頻率的 NSCA 安全清單
ground-fault-circuit:
  en: Ground-fault circuit
  zh: 接地故障電路
  note: 在電路短路時用以保護運動員安全的電路安全措施
americans-with-disabilities-act:
  en: Americans with Disabilities Act
  zh: 美國身心障礙者法案
  abbr: ADA
  note: 本章用於要求設施至少提供一支輪椅使用者可及電話的法案
bumper-rail:
  en: Bumper rail
  zh: 防撞軌
  note: 用以保護鏡子、石膏板等表面免受人或物碰撞的軌條或護墊
national-collegiate-athletic-association:
  en: National Collegiate Athletic Association
  zh: 國家大學體育協會
  abbr: NCAA
  note: 教材所述當時正執行肌力與體能專業人員 CSCS 資格立法的組織
certified-strength-and-conditioning-specialist:
  en: Certified Strength and Conditioning Specialist
  zh: 肌力與體能認證專家
  abbr: CSCS
  note: 肌力與體能專業人員可取得的認證資格
