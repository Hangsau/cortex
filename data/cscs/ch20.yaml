cards:
- q: 有氧耐力表現的四大關鍵生理因素是什麼？
  a: 最大有氧攝取量（VO2max）、乳酸閾值（lactate threshold）、運動經濟性（exercise economy）、高比例I型肌纖維；四者綜合決定耐力表現。
  tag: aerobic-endurance-factors
- q: VO2max 的定義及其對有氧耐力表現的重要性為何？
  a: VO2max 為最大有氧攝取量，反映有氧得營系統最大輸出能力；與有氧耐力表現高度相關，但對訓練良好選手，提高乳酸閾值可能比進一步提升 VO2max 更有意義。
  tag: vo2max-endurance
- q: 乳酸閾值（lactate threshold）的定義為何？
  a: 乳酸閾值：運動速度或 VO2max 百分比達到血液乳酸濃度高於安靜水平的起點；有研究顯示，乳酸閾值對有氧耐力表現的預測力優於 VO2max。
  tag: lactate-threshold-definition
- q: 最大乳酸穩態（maximal lactate steady state）的定義為何？
  a: 乳酸產生等於乳酸清除的運動強度；被認為比 VO2max 與乳酸閾值更能預測有氧耐力表現，代表可持續操行的上限耐力強度。
  tag: maximal-lactate-steady-state
- q: 運動經濟性（exercise economy）的定義與重要性為何？
  a: 經濟性：給定速度下維持運動所需的能量成本；經濟性越高，同速度下消耗的氧氣越少，可間接提升 VO2max 與乳酸閾值的功能性表現。
  tag: exercise-economy
- q: 影響跑步經濟性的技術因素是什麼？
  a: 菁英跑者比一般跑者步幅略短、步頻較高，以此維持較低氧耗；游泳則受划水技術影響最明顯，技術改善對經濟性提升貢獻最大。
  tag: running-economy-technique
- q: 有氧耐力訓練充分利用 HIIT 的平台狀況為何？
  a: 對已訓練良好的選手，HIIT 可提升峰值功率輸出、通氣閾值、氫離子緩衝能力以及脂肪依賴率；是 VO2max 提升空間有限時提升比賽速度的替代策略。
  tag: hiit-well-trained-athletes
- q: 有氧耐力訓練計畫安排的五個步驟正確順序為何？
  a: Step 1 運動模式 → Step 2 訓練頻率 → Step 3 訓練強度 → Step 4 運動時間 → Step 5 訓練進階；五個變數相互影響，這順序有助於系統化設計。
  tag: aerobic-program-design-steps
- q: 運動模式（exercise mode）選擇的原則是什麼？
  a: 模式應盡可能模擬比賽動作型態，以刺激比賽中實際使用的肌群與能量系統；模式越接近比賽，訓練轉移效果越大；多項目選手可領取交叉訓練。
  tag: exercise-mode-selection
- q: 訓練頻率的決定因素有哪些？
  a: 訓練強度與持續時間、選手訓練程度、對抗期；訓練較少的選手需更多恢復日；測試發現每週訓練 > 2 次才能有效提升 VO2max。
  tag: aerobic-training-frequency
- q: Karvonen 公式計算目標心率的步驟為何？
  a: APMHR = 220 - 年齡；HRR = APMHR - 安靜心率（RHR）；THR = (HRR × 目標強度) + RHR；公式中納入心率儲備，比簡單 % 最大心率法更精確。
  tag: karvonen-method
- q: 心率儲備（HRR）與 VO2max 百分比的關係為何？
  a: '% HRR 和 % VO2max 在 50-90% 功能能力範圍內實質上相等（如 70% HRR ≈ 70% VO2max）；而 % 最大心率（MHR）則偏高約 4-6 個百分點（如 70% VO2max ≈ 81% MHR）。'
  tag: hrr-vo2max-relationship
- q: 代謝當量（MET）的定義與應用是什麼？
  a: 1 MET = 3.5 ml/kg/min O2，代表人體安靜時的耗氧量；MET 值越高代表運動強度越高（如跑步 9.8 MET vs. 步行 2.5 MET）；需知道選手 VO2max 才能指定目標 MET。
  tag: met-definition
- q: 自覺努力程度（RPE）量表在有氧訓練中的應用與限制為何？
  a: RPE 1-10 量表可有效監控強度，適合無心率監控器的情境；但 RPE 受音樂、溫度、年齡、訓練程度等外部因素影響，無法提供乳酸閾值資訊。
  tag: rpe-scale
- q: 踏車功率監控（power measurement）在自行車選手中的優勢為何？
  a: 功率直接反映機械輸出，與代謝率高度相關；不像心率受熱天、風速等環境因素影響，可提供可復現的訓練刺激；成本高，主要適用於職業和頂級業餘選手。
  tag: cycling-power-measurement
- q: 訓練持續時間與訓練強度的互動關係為何？
  a: 強度越高，可持續時間越短；維持在最大乳酸穩態之上（85% VO2max）的運動，大約只能維持 20-30 分鐘；70% VO2max 則可近幾小時。
  tag: intensity-duration-interaction
- q: 有氧訓練進階的建議原則為何？
  a: 每週頻率、強度或時間三者不應任一增加超過 10%；初期以頻率與持續時間推進，高程度訓練者最終僅靠調高強度邊繼進步。
  tag: aerobic-progression
- q: 長距慢跑訓練（LSD）的定義、強度與主要效益為何？
  a: LSD = 約 70% VO2max（80% MHR），距離長於比賽距離或至少 30-120 分鐘；效益包括提升心血管功能、粒線體高氣產生能力、增加脂肪依賴率。
  tag: lsd-training
- q: LSD 訓練的主要缺點是什麼？
  a: 強度低於比賽配速，無法刺激比賽所需的神經肌肉徵召模式；長期使用可能導致比賽不需用的肌纖維適應，降低競賽表現。
  tag: lsd-limitations
- q: 配速／節奏訓練（pace/tempo training）的定義與強度為何？
  a: 強度等於或略高於乳酸閾值，相當於比賽配速；可連續操行（20-30 分鐘）或分段間歇式（tempo intervals）；主要目的為強化有氧與無氧能量系統在比賽配速下的持續能力。
  tag: pace-tempo-training
- q: 間歇訓練（interval training）的強度、持續時間與休息比建議為何？
  a: 強度接近 VO2max；工作組持續 3-5 分鐘；工作：休息 = 1:1；需建立紮實有氧耐力基礎後才進行；效益：提升 VO2max 與增強無氧代謝。
  tag: interval-training
- q: HIIT（高強度間歇訓練）的定義與訓練視窗是什麼？
  a: HIIT 強度高於 VO2max（90%+）；對最佳刺激，選手必須在每次間歇訓練中累積數分鐘維持 > 90% VO2max；長組 HIIT：>= 2-3 分鐘工作 / <2 分鐘休息；短組：<45 秒 / 1:5 工作休息比。
  tag: hiit-definition
- q: Fartlek 訓練的定義與強度對比為何？
  a: Fartlek（瑞典文「速度遊戲」）：結合 LSD、pace/tempo 與 interval 的混合式訓練；強度由約 70% VO2max 多變至 85-90%；可創造訓練趣味性，全面刺激所有有氧系統。
  tag: fartlek-training
- q: 五種有氧訓練類型的強度由低至高正確排序為何？
  a: LSD（~70% VO2max）→ Fartlek（70-90%變動）→ Pace/Tempo（乳酸閾值）→ Interval（接近 VO2max）→ HIIT（> VO2max）；強度越高，每週訓練次數越少。
  tag: training-types-intensity-order
- q: 淡季期訓練（off-season / base training）的主要目標與建議為何？
  a: 建立心肺功能基礎；每週 5-6 次訓練，長持續時間、低至中等強度；持續時間增加不超過每週 5-10%；階段性加入強度刺激。
  tag: off-season-base-training
- q: 賽前期有氧訓練的特徵與重點為何？
  a: 每週 6-7 次訓練（或每日訓練）；強度提升為中等至高強，持續時間經度縮短；對個別弱點（如乳酸閾值、經濟性）進行針對性訓練。
  tag: preseason-aerobic-training
- q: 賽季期有氧訓練的設計原則為何？
  a: 包含比賽日程；比賽前配置低強度短時間訓練，確保充分恢復；繼續針對個別弱點改善、維持強項；訓練每週 5-6 次。
  tag: in-season-aerobic-training
- q: 後賽期（postseason / active rest）有氧訓練的主要內容為何？
  a: 從競賽季復原；低強度、短持續時間，每週 3-5 次；復健傷害，加強較弱肌群；維持足夠的心肺功能、肌力與假脏外貓體重。
  tag: postseason-aerobic
- q: 交叉訓練（cross-training）的定義與效益為何？
  a: 以不同運動模式輔助訓練，分散激烈訓練的指定肌群壓力；可減少過度使用損傷風險，在傷復期維持穩健狀態；要有效維持 VO2max，訓練強度與持續時間必須相同。
  tag: cross-training
- q: 去訓練（detraining）的定義與最小化策略為何？
  a: 停止或減少訓練導致適應縮回至訓練前水準；最小化對策：繼續使用主要模式訓練但減少頻率與強度；訓練頻率保持可維持 VO2max 至多五週。
  tag: detraining
- q: 锚筆（tapering）的定義與典型期間為何？
  a: 賽前系統性減少訓練量與強度，加強技術訓練與營養介入；稃筆期間典型為 7-28 天；幫助恢復、補水和肌肉糖原存量回升，達到峰展狀態。
  tag: tapering-definition
- q: 三種稃筆模型（linear、step、progressive）的差異為何？
  a: 線性稃筆：訓練量小幅度逐漸減少；階段稃筆：一次性驟降 >= 50% 訓練量；漸進稃筆：結合兩者，先即減 10-15% 再漸進小幅減少；三種模型皆維持強度與頻率。
  tag: tapering-models
- q: 阻力訓練對有氧訓練選手的可能效益為何？
  a: VO2max 提升限度有限，但短時間運動表現（騎車、跑步）可有所改善；其他效益：加山力量、突居追趕與衝刺绝o量、預防過度使用損傷。
  tag: resistance-training-endurance
- q: 高度的分類定義與各類對高度訓練的影響為何？
  a: 海平面 < 500 m、低高度 > 500-2000 m、中高度 > 2000-3000 m、高度 > 3000-5500 m、極高 > 5500 m；耐力表現降低可從小於 700 m 開始；大氣壓降低導致氧分壓降低。
  tag: altitude-classification
- q: 高度適應時間與高度訓練的最佳建議為何？
  a: 中高度（2300 m）適應大約 12-14 天，但可長達數個月；顯著效益需 >= 12 小時/日、>= 3 週在中高度 (2100-2500 m)；最佳健強時間建議為比賽前 24-48 小時或提前 12 週到高度。
  tag: altitude-acclimatization
- q: 「锏高訓低」（LHTL）法的原理與應用為何？
  a: LHTL：繼續居住於 2000-3000 m 高度以獲得高度適應，在接近海平面訓練以維持高輸出質量；綜合血液學與代謝適應和神經肌肉發展的共同效益。
  tag: lhtl-altitude-training
- q: 有氧訓練強度監測工具的優先順序為何？
  a: 最佳：實驗室 VO2max + 乳酸閾值測定；實務替代：心率監控（Karvonen）> RPE > MET 處方；自行車可加入功率計为最佳工具；所有方法皆無法從強度判斷乳酸閾值。
  tag: intensity-monitoring-hierarchy
- q: 有氧訓練中提升乳酸閾值的訓練策略是什麼？
  a: 在乳酸閾值或略高乳酸閾值強度下操行的 pace/tempo 訓練；提升乳酸清除與粒線體氧化能力；高強度間歇訓練將乳酸緩衝酵素和輸送能力提升。
  tag: improving-lactate-threshold
- q: 心率儲備法（HRR）與最大心率百分比法的差異為何？
  a: HRR 法納入安靜心率，使計算結果與 % VO2max 吧對應，對訓練者更準確；簡單 % MHR 法不考慮安靜心率，指定相同 % VO2max 所對應心率偏高（如 70% VO2max ≈ 81% MHR）。
  tag: hrr-vs-mhr-method
- q: 全年有氧訓練的建護週期安排稺型為何？
  a: 全年分四階段：淡季（基礎）→ 賽前（強度提升）→ 賽季（維持）→ 後賽（休經）；各階段訓練模式比重不同，逸步提升訓練強度。
  tag: aerobic-annual-periodization
- q: 有氧訓練的特殊性原則對模式選擇的影響是什麼？
  a: 訓練轉移主要為模式特殊性，跑訓練最能提升跑步成績，弱點可用交叉訓練輔助；交叉訓練要有效維持 VO2max，強度與持續時間必須與專項訓練相同。
  tag: aerobic-training-specificity
- q: 高強度有氧訓練對肌纖維徵召的影響為何？
  a: 強度提升時引入更多 II 型肌纖維，使這些肌纖維獲得有氧訓練刺激與適應；LSD 長期操行則可使 IIx 型肌纖維轉變為 I 型。
  tag: fiber-type-aerobic
- q: 有氧訓練的安全注意事項有哪些？
  a: 充分熱身冷却；熱環境下謹慎脑血流失水；訓練前中後適時補充水分；每週訓練 > 5 次增加損傷風險，處方會課法到強度增加；傷復後循序漸進回強度訓練。
  tag: aerobic-training-safety
- q: 有氧訓練的成效驗證方法有哪些？
  a: 定期 VO2max 測定（最實際）、配速測試（閾値經度）、訓練心率監控趨勢、RPE 變化、比賽成績；乳酸測定可直接評估閾値改孤。
  tag: aerobic-monitoring-methods
- q: 參與有氧訓練的跨歐訓練如何有效維持 VO2max？
  a: 交叉訓練強度與持續時間必須與選手主要訓練模式相等才能維持 VO2max；强度不足的交叉訓練只能減少部分去訓練損失，無法完全維持讓適應。
  tag: cross-training-vo2max
- q: 有氧訓練的回復訓練首要原則為何？
  a: 充分休息、補水和補充營養從很院待；高強度或長時間訓練後需要讓張和避免剤烈活動；高強度訓練後粗糖重要性提升（証術糖原回充）。
  tag: aerobic-recovery-principles
- q: 有氧訓練的進階設計范例季瞭為何？
  a: 範例 A：第 1 週 40 分鐘× 4 次，強度 70-85% THR；逆進增加頻率至 5 次 + 延長持續時間；範例 B：第 1 週 30 分鐘× 3 次，強度 60-70% THR，強度與頻率這週驟增。
  tag: aerobic-progression-examples
- q: 高強度有氧訓練的心血管適應為何？
  a: 改善心血管與呼吸功能，增加工作肌肉的氧氣運輸能力；高強度有氧訓練可增加 II 型肌纖維的有氧潟力，使整體有氧訓練表現提升。
  tag: aerobic-cardiovascular-adaptations
- q: LSD 訓練對肌肉纖維的長期適應為何？
  a: 長期 LSD 可使 IIx 型肌纖維轉變為 I 型，提升有氧潟力；同時增加脂肪依賴率，節省肌肉糖原；但高比例 LSD 可能導致比賽所需肌纖維變弱，應均衡安排。
  tag: lsd-fiber-adaptation
- q: 訓練指定課願区間會決定最適訓練強度的組合是什麼？
  a: 屬於相同 VO2max 的選手，込誓閾值最高者通常有更好的耐力表現；訓練最終必須同時體現 VO2max、乳酸閾值、經濟性等指標的平衡進階。
  tag: multi-factor-aerobic-prescription
- q: 有氧訓練的運動層面應如何與阻力訓練整合？
  a: 阻力訓練建議降在有氧訓練日之後或分開日，避免兩者區間疲勞累積；淡季期強調力量層面，賽前期轉向有氧層面；阻力訓練不應取代專項有氧訓練。
  tag: aerobic-strength-integration
- q: 有氧訓練的最佳訓練成效瀏小差異原則為何？
  a: 每一位選手強弱點不同，訓練計畫應針對其個別影響最大的因素。經濟性差的選手強調技術訓練，乳酸閾值低的選手則需更多高強度訓練；對照測試引導訓練重點。
  tag: individual-aerobic-prescription
