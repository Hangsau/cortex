cards:
- q: 有氧耐力表現的相關因素有哪些？
  a: 高最大有氧能力（V̇O₂max）必要且與表現高度相關；教材另列高乳酸閾值、良好運動經濟性、脂肪作為燃料的高效率使用與高比例 Type I 肌纖維。這些因素不只四項，也不是單一因素決定表現。
  tag: aerobic-endurance-factors
- q: 最大有氧能力（V̇O₂max）對耐力表現的重要性為何？
  a: 賽事愈久，有氧代謝須滿足的總能量比例愈高，因此高 V̇O₂max 是成功必要條件。訓練良好耐力選手的 V̇O₂max 已高時，維持較高競賽速度可能比追求小幅容量增長更重要。
  tag: vo2max-endurance
- q: 乳酸閾值（lactate threshold）的定義為何？
  a: LT 是出現特定血乳酸濃度的移動速度或 V̇O₂max 百分比，或血乳酸開始高於靜息值的點。多項研究顯示它似乎比 V̇O₂max 更能指示有氧耐力表現。
  tag: lactate-threshold-definition
- q: 最大乳酸穩態（maximal lactate steady state）的定義為何？
  a: 是體內最大乳酸產生量等於最大乳酸清除量時的運動強度。許多人認為它比 V̇O₂max 或 LT 更能指示有氧耐力表現；教材以此保留語氣呈現。
  tag: maximal-lactate-steady-state
- q: 運動經濟性（exercise economy）的定義與重要性為何？
  a: 是給定運動速度下的能量成本。經濟性高者用較少能量維持同一速度；教材指出改善經濟性可提升 V̇O₂max 與乳酸閾值。
  tag: exercise-economy
- q: 教材對跑步、騎車與游泳經濟性各舉了什麼例子？
  a: 較佳跑者的步幅略短、步頻較高；自由車經濟性受體重、車速與空氣動力姿勢影響；菁英游泳者在任一游速耗氧較少，改善划水力學能降低同一游速的能量需求。
  tag: running-economy-technique
- q: HIIT 對訓練良好耐力選手可能如何有助表現？
  a: 對 V̇O₂max 已優異者，HIIT 可能經由峰值功率輸出、通氣閾值、氫離子緩衝與脂肪利用的改善而有助表現。此機制尚未充分了解，不能改寫成保證效果。
  tag: hiit-well-trained-athletes
- q: 有氧耐力訓練計畫的五個設計步驟為何？
  a: 依序為運動模式、訓練頻率、訓練強度、運動持續時間與運動進展。這些是教材列出的主要課表設計變項。
  tag: aerobic-program-design-steps
- q: 運動模式（exercise mode）選擇的原則是什麼？
  a: 活動要盡可能模仿競賽動作模式，讓競賽所用肌纖維徵召及能量系統受到挑戰。模式愈專項，表現改善愈大；多項耐力運動員或一般適能者可採交叉訓練。
  tag: exercise-mode-selection
- q: 訓練頻率的決定因素有哪些？
  a: 強度與持續時間的互動、訓練狀態及賽季都會影響頻率；強度更高或時間更久需要更多恢復，低訓練者起初也需更多恢復日。研究顯示每週多於兩次訓練才會提高 V̇O₂max。
  tag: aerobic-training-frequency
- q: Karvonen 法如何計算目標心率？
  a: APMHR = 220 − 年齡；HRR = APMHR − RHR；THR =（HRR × 運動強度）+ RHR。以強度區間上下限各算一次可得 THRR；它仍受年齡預測最大心率誤差限制。
  tag: karvonen-method
- q: 表 20.1 中 HRR、V̇O₂max 與 MHR 百分比的關係為何？
  a: 表中 V̇O₂max 百分比與 HRR 百分比逐列相同；未達最大值時，相對應的 MHR 百分比較高。因此不能把相同數值直接當作 HRR 與 MHR 百分比。
  tag: hrr-vo2max-relationship
- q: 代謝當量（MET）的定義與應用是什麼？
  a: 一 MET 等於 3.5 ml·kg⁻¹·min⁻¹ 攝氧量，是靜息所需氧氣量。十 MET 的活動需十倍靜息攝氧量；處方 MET 前須知道或估計運動員的最大攝氧量。
  tag: met-definition
- q: 自覺用力程度（RPE）量表如何解讀？
  a: RPE 可調節有氧強度；表 20.2 從一分的完全沒有用力到十分的最大努力。年齡、性別、訓練狀態、音樂、影片、溫度、海拔、營養與外部回饋都可能影響它，但教材仍認為它是有效監測工具。
  tag: rpe-scale
- q: 自行車功率量測（power measurement）的優勢為何？
  a: 功率量測曲柄與花鼓可監測自行車強度；代謝率與機械功率產生密切相關，且可在影響心率與速度的環境下重複相同強度。由於成本，教材認為可能較適合職業及頂尖業餘選手。
  tag: cycling-power-measurement
- q: 訓練持續時間與強度的互動關係為何？
  a: 通常強度愈高，持續時間愈短。教材舉例，高於最大乳酸穩態的 85% V̇O₂max 約能持續二十至三十分鐘；70% V̇O₂max 則可在疲勞前進行數小時。
  tag: intensity-duration-interaction
- q: 有氧訓練進展的建議原則為何？
  a: 起初可提高頻率、強度及持續時間，但任一變項每週一般不增加超過百分之十。較高適能時頻率或時間可能無法再加，此時只操弄強度；強度進展要仔細監測以避免過度訓練。
  tag: aerobic-progression
- q: 長距離慢速訓練（LSD）的處方與效益為何？
  a: 常見為每週一至兩次、競賽距離或更長、約三十至一百二十分鐘、約 70% V̇O₂max；傳統也以約 80% 最大心率描述。它提升心血管與體溫調節、粒線體氧化能力及脂肪利用。
  tag: lsd-training
- q: 過度使用 LSD 訓練的限制是什麼？
  a: LSD 強度低於競賽強度；做得過多可能不利。它不刺激競賽所需的肌纖維徵召神經模式，也可能使未在競賽中使用的肌纖維產生適應。
  tag: lsd-limitations
- q: 配速／節奏訓練（pace/tempo training）如何進行？
  a: 強度在乳酸閾值、競賽配速或略高於競賽配速；常見每週一至兩次、約二十至三十分鐘。可連續進行，或用較短工作段和短暫恢復；感覺容易時教材建議加距離而非加強度。
  tag: pace-tempo-training
- q: 間歇訓練（interval training）的處方與注意事項為何？
  a: 常見每週一至兩次、工作段三至五分鐘、工作與休息比一比一、強度接近 V̇O₂max。它可提高 V̇O₂max 與無氧代謝，但必須先有紮實有氧基礎，且應節制使用。
  tag: interval-training
- q: HIIT（高強度間歇訓練）的定義與處方為何？
  a: HIIT 是重複高強度工作段穿插短暫恢復。表 20.4 的常見處方為每週一次、三十至九十秒、工作與休息比一比五、強度大於 V̇O₂max；最佳刺激須在課中累積數分鐘高於 90% V̇O₂max。
  tag: hiit-definition
- q: Fartlek 訓練的定義與強度對比為何？
  a: Fartlek 是瑞典語「速度遊戲」，可混合 LSD、配速／節奏及間歇內容；常見每週一次、約二十至六十分鐘，強度在 LSD 與配速／節奏間變化。範例以約 70% V̇O₂max 輕鬆跑穿插約 85–90% 的短快衝刺。
  tag: fartlek-training
- q: 表 20.4 是否提供五種訓練由低到高的單一強度排序？
  a: 沒有。表中 LSD 約 70% V̇O₂max、配速／節奏在 LT、間歇接近 V̇O₂max、HIIT 大於 V̇O₂max；Fartlek 則在 LSD 與配速／節奏間變動。因此教材未給出五種固定的總排序。
  tag: training-types-intensity-order
- q: 休季（off-season／base training）的目標與建議為何？
  a: 目標是建立體能基礎；典型每週五至六次、長持續時間、低至中等強度。初期長時間低強度，之後提高強度並較少增加時間；時間每週不增加超過百分之五至十。
  tag: off-season-base-training
- q: 季前（preseason）有氧訓練的特徵與重點為何？
  a: 典型每週六至七次、中至長持續時間與中至高強度，目標是改善有氧耐力表現因素。季前提高強度、維持或降低時間、納入所有訓練類型；比例由個人強弱項決定。
  tag: preseason-aerobic-training
- q: 賽季（in-season）有氧訓練的設計原則為何？
  a: 典型是訓練與競賽每週合計五至六次；訓練日短且低強度，競賽距離日高強度。計畫應納入競賽日，並在賽前安排低強度短訓練以利充分恢復。
  tag: in-season-aerobic-training
- q: 賽後（postseason／active rest）有氧訓練的主要內容為何？
  a: 目標是由競賽季恢復；典型每週三至五次、短持續時間、低強度。仍要維持足夠心肺適能、肌力與瘦體重，並復健傷害及改善無力或體能不足的肌群。
  tag: postseason-aerobic
- q: 交叉訓練（cross-training）的用途與效益為何？
  a: 可在受傷而減少訓練或訓練週期恢復時維持一般體能；它將壓力分散至不同肌群，可能降低過度使用傷害。要維持 V̇O₂max，強度與持續時間必須等同主要模式。
  tag: cross-training
- q: 去訓練（detraining）的定義與最小化策略為何？
  a: 去訓練指因中斷、受傷或疾病而減少時間、降低強度或停止訓練；適應會迅速朝訓練前水準退回。可行時應保留主要模式、降低頻率與強度；交叉訓練只能減緩部分完全停訓的流失。
  tag: detraining
- q: 減量訓練（tapering）的定義與典型期間為何？
  a: 是賽前系統性降低訓練持續時間與強度，並增加技術工作與營養介入，以在競賽時達巔峰。典型可持續七至二十八天，並有助恢復、再水化及增加肌肉與肝臟肝醣儲存。
  tag: tapering-definition
- q: 三種減量模型（linear、step、progressive）有何差異？
  a: 線性減量逐步降低每日總訓練量；階梯減量通常突然降低至少 50% 並維持不變；漸進減量先立即降 10–15%，再分層小幅下降。三者都在系統性減量時維持強度與頻率。
  tag: tapering-models
- q: 阻力訓練對耐力運動員的可能效益為何？
  a: 研究有限；一項高度訓練有氧運動員研究中，阻力訓練未提高 V̇O₂max，卻改善騎車和跑步短時間表現。可能還有助於傷害恢復、預防過度使用傷害、減少肌肉失衡與爬坡、突圍、衝刺。
  tag: resistance-training-endurance
- q: 教材如何列出高度分類與高地影響？
  a: 原文列海平面（>500 m）、低度（>500–2,000 m）、中度（>2,000–3,000 m）、高度（>3,000–5,500 m）與極高度（>5,500 m）；海平面符號看似衝突，教材原文如此。高度增加使大氣壓與 PO₂ 降低，急性表現下降可能從 700 m 開始。
  tag: altitude-classification
- q: 高度適應時間與高地暴露建議為何？
  a: 在最高 2,300 m 的中度高度，適應可能在十二至十四天發生，也可能長達數月。報告的訓練條件為約 2,100–2,500 m、每天至少十二小時、至少三週；賽前抵達建議則從二十四至四十八小時到提前十二週皆有，分歧很大。
  tag: altitude-acclimatization
- q: 「高住低練」（live high, train low, LHTL）如何進行？
  a: 運動員住在 2,000–3,000 m 中度高度，並在接近海平面處訓練。教材認為這可能結合高地居住的代謝及血液學適應，與較低高度的神經肌肉發展，但未保證增能效果。
  tag: lhtl-altitude-training
- q: 有氧強度監測方法在教材中如何區分？
  a: 最精確的是運動中量攝氧以得 V̇O₂max 百分比，以及定期量血乳酸以判定與 LT 的關係。若沒有 V̇O₂max 測試，可用心率、RPE、MET 或運動速度；自行車也常用功率裝置。教材未給這些替代法的排序。
  tag: intensity-monitoring-hierarchy
- q: 教材對提高乳酸閾值或最大乳酸穩態提出何種訓練要求？
  a: 運動員須有部分訓練在較高血液與肌肉乳酸濃度下進行。配速／節奏訓練在 LT 強度進行；LSD 的適應可能藉提升清除乳酸能力而提高 LT 強度。
  tag: improving-lactate-threshold
- q: 心率儲備法（HRR）與最大心率百分比法的公式差異為何？
  a: Karvonen 法以 HRR 乘運動強度後加 RHR；MHR 法則以 APMHR 乘運動強度，未使用 RHR。表 20.1 顯示對同一 V̇O₂max 百分比，HRR 百分比相同而 MHR 百分比較高。
  tag: hrr-vs-mhr-method
- q: 全年有氧耐力訓練如何依賽季安排？
  a: 年度通常分休季（基礎訓練）、季前、賽季（競賽）及賽後（主動休息）。健全全年計畫應按賽季分段、各有特定目標與任務，以漸進提升表現。
  tag: aerobic-annual-periodization
- q: 有氧訓練特異性如何影響模式選擇？
  a: 訓練效果只限於實際使用並受超負荷的系統；活動應盡量模仿競賽動作模式，讓所需肌纖維徵召與能量系統受到挑戰。模式愈專項，表現改善愈大。
  tag: aerobic-training-specificity
- q: 有氧訓練強度如何影響肌纖維徵召與適應？
  a: 強度提高時，為滿足更高功率需求會徵召更多 Type II 肌纖維，可能讓它們獲得更多有氧訓練。長期 LSD 則可最終使參與訓練肌肉的 Type IIx 肌纖維轉為 Type I。
  tag: fiber-type-aerobic
- q: 本章對有氧訓練負荷與恢復的安全提醒為何？
  a: 強度太低無法超負荷、太高會造成疲勞並過早結束；高強度進展須仔細監測以避免過度訓練。每週多於五次訓練與較高傷害率有關，但該研究受試者是廣泛年齡的活動者。
  tag: aerobic-training-safety
- q: 本章列出的有氧訓練強度監測方法有哪些？
  a: 可在運動中量攝氧判定 V̇O₂max 百分比，並定期量血乳酸判定 LT 關係；若無 V̇O₂max 測試，可使用心率、RPE、MET 或運動速度，自行車選手也常使用功率裝置。
  tag: aerobic-monitoring-methods
- q: 交叉訓練如何有效維持 V̇O₂max？
  a: 交叉訓練須與主要運動模式有相同強度和持續時間，才能有效維持 V̇O₂max。否則它至多減輕完全停訓時通常出現的部分適應流失。
  tag: cross-training-vo2max
- q: 困難有氧訓練後的恢復原則為何？
  a: 須充分休息、再水化及恢復燃料來源；高強度或長時間日後，放鬆並避免費力活動特別重要。長或強的課後，碳水化合物有助補回可能耗竭的肌肉與肝臟肝醣。
  tag: aerobic-recovery-principles
- q: 教材的有氧進展範例說明什麼？
  a: 範例 A 在五週內，從每週四次、四十分鐘、70–85% THR，進展為四次四十五分鐘同強度加一次五十五分鐘、60–75% THR；範例 B 以頻率、強度或持續時間的不同組合逐週操弄。兩例都示範變項組合，而非同時無限制增加所有變項。
  tag: aerobic-progression-examples
- q: 高強度有氧運動可帶來哪些適應？
  a: 可提高心血管與呼吸功能，改善工作肌肉的氧氣運送。強度增加也會徵召更多 Type II 肌纖維，可能使這些肌纖維得到更多有氧訓練並改善整體有氧表現。
  tag: aerobic-cardiovascular-adaptations
- q: LSD 訓練對肌纖維與燃料使用的長期適應為何？
  a: 長期 LSD 可使參與訓練肌肉的 Type IIx 纖維最終轉為 Type I，並增加脂肪利用，可能節省肌肉肝醣。這些效益仍須與其低於競賽強度、未刺激競賽徵召模式的限制一併考量。
  tag: lsd-fiber-adaptation
- q: 如何依個別有氧表現因素設計處方？
  a: 應先評估表現因素，再針對個人強弱點設計。經濟性差者可做著重技術的間歇訓練並用較長休息；需要提高 LT 者可考慮更多高強度訓練。
  tag: multi-factor-aerobic-prescription
- q: 本章如何定位耐力運動員的阻力訓練？
  a: 阻力訓練是重要但常被忽略的耐力表現因素；可能改善短時間騎車與跑步表現、傷害恢復、過度使用傷害與肌肉失衡。教材指向第 17 章的設計指引與高中越野跑者範例，未規定同日排程規則。
  tag: aerobic-strength-integration
- q: 個別化有氧耐力處方的原則為何？
  a: 最佳做法是先評估影響表現的因素，再依運動員個別強弱點產生計畫。教材舉例：經濟性差者著重技術間歇與較長休息；欲提高 LT 者可考慮較多高強度訓練。
  tag: individual-aerobic-prescription
