id: ch20
weight: 20
title: Ch.20 有氧耐力訓練
topics:
- id: aerobic-performance-factors
  title: 有氧表現關鍵因素 Aerobic Performance Factors
  desc: ''
  tag: 基礎理論
  items:
  - id: ch20.aerobic-performance-factors.i01
    q: VO₂max
    a:
    - 最大攝氧量
    - 與有氧表現高度相關，但不是唯一決定因素
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.aerobic-performance-factors.i02
    q: 乳酸閾值 LT
    a:
    - 血乳酸開始上升的速度/強度
    - 比VO₂max更能預測表現
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.aerobic-performance-factors.i03
    q: 最大乳酸穩態 MLSS
    a:
    - 乳酸產生 = 乳酸清除的最高強度
    - 被認為是最佳表現指標
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.aerobic-performance-factors.i04
    q: 運動經濟性
    a:
    - 固定速度下能量消耗越少越好
    - 跑步步頻↑、步幅略短表現較佳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.aerobic-performance-factors.i05
    q: 脂肪利用率
    a:
    - 高效使用脂肪為燃料 → 節省肌糖原 → 延後疲勞
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.aerobic-performance-factors.i06
    q: Type I 肌纖維
    a:
    - 慢縮肌比例高 → 有氧耐力更強
    - 可透過LSD訓練促進IIx→I轉換
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.aerobic-performance-factors.i07
    q: HIIT對精英選手
    a:
    - VO₂max已到頂後，HIIT可透過峰值功率、緩衝能力進一步提升表現
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.aerobic-performance-factors.i08
    q: 訓練特異性
    a:
    - 未被訓練的生理系統不會適應
    - 必須針對競賽動作模式訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related: []
    locator: ''
- id: altitude-training
  title: 高地訓練 Altitude Training
  desc: ''
  tag: Altitude
  items:
  - id: ch20.altitude-training.i01
    q: 高度分類
    a:
    - 海平面 <500m / 低度 500-2000m / 中度 2000-3000m / 高度 3000-5500m / 極高 >5500m
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.altitude-training.i02
    q: 高度影響機制
    a:
    - 氧氣比例不變，但大氣壓降低 → PO₂↓ → 肺部氣體交換驅動力下降 → 有氧表現下降
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.altitude-training.i03
    q: 表現下降起點
    a:
    - 急性暴露高度低至700m即可能出現有氧表現下降
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.altitude-training.i04
    q: 高度適應時間
    a:
    - 中度高度（~2300m）需12-14天
    - 完全適應可能需數個月
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.altitude-training.i05
    q: LHTL 策略
    a:
    - 「高住低練」：居住2000-3000m + 在接近海平面處訓練
    - 同時獲得適應效益與訓練質量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.altitude-training.i06
    q: 低氧劑量要求
    a:
    - 效果需≥12小時/天暴露，持續最少3週，中度高度約2100-2500m
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.altitude-training.i07
    q: 賽前抵達時機
    a:
    - 建議在比賽前24-48小時抵達，或提前12週進行高地暴露（建議差異大）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
  - id: ch20.altitude-training.i08
    q: LHTL機制
    a:
    - 高地促進血液/代謝適應 + 低地確保神經肌肉發展品質 → 複合性增能效果
    detail: ''
    terms: []
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: ''
- id: hr-calculations
  title: 心跳率計算 HR Calculations
  desc: ''
  tag: HR Calculations
  items:
  - id: ch20.hr-calculations.i01
    q: APMHR公式
    a:
    - APMHR = 220 − 年齡（估算最大心率）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
  - id: ch20.hr-calculations.i02
    q: HRR定義
    a:
    - HRR = APMHR − 安靜心率（RHR）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
  - id: ch20.hr-calculations.i03
    q: Karvonen公式
    a:
    - THR = (HRR × 強度%) + RHR
    - 計算兩次得THRR範圍
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
  - id: ch20.hr-calculations.i04
    q: Karvonen範例
    a:
    - 30歲、RHR 60、60-70%：THR = 138-151 bpm
    - ÷6 = 23-25次/10秒
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
  - id: ch20.hr-calculations.i05
    q: '%MHR公式'
    a:
    - THR = APMHR × 強度%
    - 計算兩次得THRR
    - 無需RHR
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
  - id: ch20.hr-calculations.i06
    q: '%MHR範例'
    a:
    - 20歲、70-85%MHR：THR = 140-170 bpm
    - ÷6 = 23-28次/10秒
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
  - id: ch20.hr-calculations.i07
    q: '%HRR ≈ %VO₂max'
    a:
    - HRR百分比數值等同VO₂max百分比
    - '%MHR對應值則較高（見Table 20.1）'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
  - id: ch20.hr-calculations.i08
    q: 10秒換算法
    a:
    - 運動中THRR ÷ 6 = 10秒心跳數
    - 方便現場快速監測
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - normal-values
    related: []
    locator: ''
- id: intensity-monitoring
  title: 強度監控方法 Intensity Monitoring
  desc: ''
  tag: Intensity
  items:
  - id: ch20.intensity-monitoring.i01
    q: VO₂max% 直測
    a:
    - 最精準
    - 需實驗室測試
    - 同時可得乳酸閾值對應強度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
  - id: ch20.intensity-monitoring.i02
    q: 心跳率 HR
    a:
    - 最常用
    - 50-90% VO₂max範圍內與攝氧量相關性高
    - 需搭配HRR或%MHR公式
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
  - id: ch20.intensity-monitoring.i03
    q: RPE 自覺用力度
    a:
    - 1-10量表
    - 受音樂/溫度/年齡/性別影響，但仍為有效監控工具
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
  - id: ch20.intensity-monitoring.i04
    q: MET 代謝當量
    a:
    - 1 MET = 3.5 ml·kg⁻¹·min⁻¹（安靜耗氧）
    - 需知道VO₂max才能換算目標MET
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
  - id: ch20.intensity-monitoring.i05
    q: 功率計 Power
    a:
    - 自行車專用
    - 直接反映機械功率，不受環境（熱/風/坡）影響
    - 最具再現性
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
  - id: ch20.intensity-monitoring.i06
    q: APMHR公式限制
    a:
    - 220-年齡僅為估算
    - 年齡貢獻75%變異
    - 無法反映乳酸閾值對應強度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
  - id: ch20.intensity-monitoring.i07
    q: HRR定義
    a:
    - HRR = 最大心率 − 安靜心率
    - HRR% ≈ VO₂max%（數值相等）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
  - id: ch20.intensity-monitoring.i08
    q: '%MHR vs %HRR'
    a:
    - 相同VO₂max%下，%MHR數值高於%HRR
    - 見Table 20.1對照
    detail: ''
    terms: []
    numbers: []
    concepts:
    - measurement
    - program-design
    related: []
    locator: ''
- id: periodization
  title: 賽季週期化 Periodization
  desc: ''
  tag: Periodization
  items:
  - id: ch20.periodization.i01
    q: Off-season 休季
    a:
    - 建立有氧基礎
    - 5-6次/週
    - 長時間低至中強度
    - 時長增幅≤5-10%/週
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
  - id: ch20.periodization.i02
    q: Preseason 季前
    a:
    - 提升強度、維持或縮短時長
    - 6-7次/週
    - 融入所有訓練類型
    - 強調個人弱點
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
  - id: ch20.periodization.i03
    q: In-season 競賽季
    a:
    - 訓練+比賽共5-6次/週
    - 訓練日短時間低強度
    - 賽前充分恢復
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
  - id: ch20.periodization.i04
    q: Postseason 賽後
    a:
    - 主動休息
    - 3-5次/週
    - 短時間低強度
    - 復健傷病、強化弱肌群
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
  - id: ch20.periodization.i05
    q: 競賽季訓練原則
    a:
    - 賽前安排低強度短時長訓練日，確保完全恢復
    - 繼續補強弱點、維持強項
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
  - id: ch20.periodization.i06
    q: 休季→季前轉換
    a:
    - 強度逐步提高
    - 時長可略縮
    - 導入間歇與HIIT
    - 持續評估生理指標
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
  - id: ch20.periodization.i07
    q: 賽後目標
    a:
    - 恢復心肺適能、肌力、肌肉量
    - 避免過度失訓（detraining）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
  - id: ch20.periodization.i08
    q: 年度計畫概念
    a:
    - 全年訓練應有目標與彈性
    - 逐步提升表現，同時避免過用傷害與過訓
    detail: ''
    terms: []
    numbers: []
    concepts:
    - periodization
    related: []
    locator: ''
- id: program-design
  title: 訓練設計5步驟 Program Design
  desc: ''
  tag: Program Design
  items:
  - id: ch20.program-design.i01
    q: Step 1 · Mode 模式
    a:
    - 選擇最接近競賽動作的訓練模式
    - 模式越專項，進步幅度越大
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch20.program-design.i02
    q: Step 2 · Frequency 頻率
    a:
    - 受強度×時長×訓練狀態×賽季影響
    - '>2次/週才能提升VO₂max'
    - '>5次/週傷害風險升高'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch20.program-design.i03
    q: Step 3 · Intensity 強度
    a:
    - 最核心變項
    - 強度不足→無適應，強度過高→早期疲勞
    - 需監控確保在目標區間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch20.program-design.i04
    q: Step 4 · Duration 時長
    a:
    - 與強度反向關係
    - 85% VO₂max → 約20-30分鐘
    - 70% VO₂max → 可持續數小時
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch20.program-design.i05
    q: Step 5 · Progression 進展
    a:
    - 頻率/強度/時長每週增幅≤10%
    - 高訓練水平後僅能靠強度繼續進步
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch20.program-design.i06
    q: 恢復原則
    a:
    - 每週至少1天休息/主動恢復
    - 高強度後補液、補碳水，恢復肝醣
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch20.program-design.i07
    q: 維持 vs 提升
    a:
    - 維持有氧適能：強度不減、頻率可降至2次/週，可維持長達5週
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
  - id: ch20.program-design.i08
    q: 性別差異
    a:
    - 男女對訓練的反應相似，無需設計不同訓練計畫（參考Ch.7）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    related: []
    locator: ''
- id: special-issues
  title: 特殊訓練議題 Special Issues
  desc: ''
  tag: Special Issues
  items:
  - id: ch20.special-issues.i01
    q: Cross-training 交叉訓練
    a:
    - 傷後或恢復期維持體能
    - 分散壓力降低過用傷風險
    - 維持VO₂max需等同主項強度/時長
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
  - id: ch20.special-issues.i02
    q: Detraining 去訓練
    a:
    - 停訓後生理適應迅速退回訓練前水準
    - 可用主項降頻降強維持，或交叉訓練減緩退化
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
  - id: ch20.special-issues.i03
    q: Tapering 減量
    a:
    - 賽前7-28天
    - 系統性降低時長與強度
    - 促進恢復、補液、肝醣超補
    - 維持頻率與強度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
  - id: ch20.special-issues.i04
    q: 3種減量模式
    a:
    - 線性taper（漸降）/ 階梯taper（≥50%突降）/ 進階taper（先快降10-15%再緩降）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
  - id: ch20.special-issues.i05
    q: 阻力訓練效益
    a:
    - 不提升VO₂max，但改善短期運動表現、預防過用傷、減少肌肉不平衡
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
  - id: ch20.special-issues.i06
    q: 阻力訓練研究
    a:
    - 'Hickson: 阻力訓練→騎車/跑步短期表現↑'
    - 'Mikkola: 肌耐力/爆發力訓練→跑步表現↑'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
  - id: ch20.special-issues.i07
    q: Cross-training 限制
    a:
    - 無法取代專項訓練
    - 對單項運動員表現提升幅度不如專項訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
  - id: ch20.special-issues.i08
    q: Tapering 目標
    a:
    - 競賽當天達到表現巔峰
    - 保持技術訓練與營養介入
    - 研究多針對游泳員
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - safety
    related: []
    locator: ''
- id: training-types
  title: 訓練類型 Training Types
  desc: ''
  tag: Training Types
  items:
  - id: ch20.training-types.i01
    q: LSD 長慢距離
    a:
    - ~70% VO₂max
    - 30分-2小時
    - 增粒線體、脂肪利用、心血管功能
    - Type IIx→I
    detail: ''
    terms: []
    numbers: []
    concepts:
    - program-design
    - energy-supply
    related: []
    locator: ''
  - id: ch20.training-types.i02
    q: Pace/Tempo 配速
    a:
    - 等於乳酸閾值強度
    - 穩態20-30分 或 間歇巡航
    - 改善跑步經濟性與LT
    detail: ''
    terms: []
    numbers: []
