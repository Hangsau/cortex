id: ch20
weight: 20
title: Ch.20 有氧耐力訓練
topics:
- id: aerobic-performance-factors
  title: 有氧表現關鍵因素 Aerobic Performance Factors
  desc: ''
  tag: 基礎理論
  items:
  - id: ch20.aerobic-performance-factors.i01
    q: 最大有氧能力（maximal aerobic capacity, V̇O₂max）為何重要？
    a:
    - 賽事時間愈長，總能量需求中必須由有氧代謝滿足的比例愈高；高 V̇O₂max 是有氧耐力賽成功的必要條件。
    - V̇O₂max 與有氧耐力賽表現高度相關，但乳酸閾值、運動經濟性、脂肪作為燃料的使用效率及 Type I 肌纖維比例也可能同樣或更重要。
    detail: 對訓練良好的耐力運動員，V̇O₂max 通常已很高；與其追求微小的容量增幅，能否在競賽與訓練時維持較高速度，可能更影響表現。
    terms:
    - maximal-aerobic-capacity
    - vo2max
    numbers: []
    concepts:
    - energy-supply
    - gas-exchange
    related:
    - ch06.detraining.i06
    - ch13.aerobic-capacity.i01
    locator: Factors Related to Aerobic Endurance Performance > Maximal Aerobic Capacity
  - id: ch20.aerobic-performance-factors.i02
    q: 乳酸閾值（lactate threshold, LT）如何界定？
    a:
    - 是出現特定血乳酸濃度的移動速度或 V̇O₂max 百分比，或血乳酸濃度開始高於靜息值的點。
    - 在 V̇O₂max 相近的選手中，能在不使肌肉與血液累積大量乳酸下、以最高 V̇O₂max 百分比維持有氧供能者，通常表現較佳。
    detail: 多項研究顯示 LT「似乎」比 V̇O₂max 更能指示有氧耐力表現；這是文獻趨勢，不是教材下的絕對判定。
    terms:
    - lactate-threshold
    - vo2max
    numbers: []
    concepts:
    - energy-supply
    related:
    - ch03.lactate.i04
    locator: Factors Related to Aerobic Endurance Performance > Lactate Threshold
  - id: ch20.aerobic-performance-factors.i03
    q: 最大乳酸穩態（maximal lactate steady state）是什麼？
    a:
    - 是體內最大乳酸產生量等於最大乳酸清除量時的運動強度。
    - 有氧耐力運動員須提高 LT 或最大乳酸穩態；這要求部分訓練在較高的血液與肌肉乳酸濃度下進行。
    detail: 許多人認為最大乳酸穩態比 V̇O₂max 或 LT 更能指示有氧耐力表現；教材以「considered by many」保留此判斷。
    terms:
    - maximal-lactate-steady-state
    - lactate-threshold
    - vo2max
    numbers: []
    concepts:
    - energy-supply
    related:
    - ch03.lactate.i06
    locator: Factors Related to Aerobic Endurance Performance > Lactate Threshold
  - id: ch20.aerobic-performance-factors.i04
    q: 運動經濟性（exercise economy）代表什麼？
    a:
    - 是在給定運動速度下，該活動的能量成本。
    - 經濟性高的運動員以同一運動速度運動時耗能較少；較佳跑者的步幅略短、步頻較高，菁英游泳選手在任一游速的耗氧也較少。
    detail: 自由車經濟性還受體重、車速與空氣動力姿勢影響；游泳則以改善划水力學、降低同一游速的能量需求最為顯著。改善經濟性可提升 V̇O₂max 與 LT。
    terms:
    - exercise-economy
    - vo2max
    - lactate-threshold
    numbers: []
    concepts:
    - energy-supply
    related:
    - ch06.chronic-muscular.i05
    - ch19.sprint-speed-components.i01
    locator: Factors Related to Aerobic Endurance Performance > Exercise Economy
  - id: ch20.aerobic-performance-factors.i05
    q: 脂肪作為燃料的使用效率在本章的定位為何？
    a:
    - 高效率使用脂肪作為燃料，是除 V̇O₂max、LT、運動經濟性與 Type I 肌纖維比例外，教材列出的有氧耐力表現因素。
    - LSD 訓練增加脂肪利用，可能節省肌肉肝醣。
    detail: 教材僅將脂肪利用效率列為重要因素，並在 LSD 段落說明可能節省肌肉肝醣；未在此將它量化為特定的疲勞延後幅度。
    terms:
    - vo2max
    - lactate-threshold
    - long-slow-distance-training
    numbers: []
    concepts:
    - energy-supply
    related:
    - ch03.substrate.i04
    - ch09.fat.i06
    locator: Factors Related to Aerobic Endurance Performance > Maximal Aerobic Capacity
  - id: ch20.aerobic-performance-factors.i06
    q: Type I 肌纖維與 LSD 訓練的關係為何？
    a:
    - 高比例的 Type I 肌纖維是教材列出的有氧耐力表現相關因素之一。
    - 長期使用 LSD 訓練最終可使參與訓練肌肉的 Type IIx 肌纖維轉變為 Type I 肌纖維。
    detail: IIx 轉 I 的敘述出現在 LSD 訓練的慢性代謝適應脈絡，不能延伸為任何有氧訓練都必然造成這項轉換。
    terms:
    - type-i-muscle-fiber
    - type-iix-muscle-fiber
    - long-slow-distance-training
    numbers: []
    concepts:
    - fiber-type
    - adaptation
    related:
    - ch01.fiber-types.type-i
    - ch06.chronic-muscular.i04
    locator: Types of Aerobic Endurance Training Programs > Long, Slow Distance Training
  - id: ch20.aerobic-performance-factors.i07
    q: HIIT 對訓練良好耐力運動員可能如何有助表現？
    a:
    - 對 V̇O₂max 已很優異的耐力運動員，HIIT 可能藉由提高峰值功率輸出、通氣閾值、氫離子緩衝能力及脂肪作為燃料的利用而有助表現。
    - 較能在競賽與訓練維持高速度，可能比追求 V̇O₂max 的邊際增幅更重要。
    detail: 教材明說這個議題尚未充分了解，故使用「可能有助」而非保證的因果語氣。
    terms:
    - hiit
    - vo2max
    numbers: []
    concepts:
    - energy-supply
    - adaptation
    related:
    - ch03.metabolic-specificity.i04
    locator: Factors Related to Aerobic Endurance Performance > Maximal Aerobic Capacity
  - id: ch20.aerobic-performance-factors.i08
    q: 訓練特異性（training specificity）如何限制有氧適應？
    a:
    - 訓練效果侷限於訓練時實際使用並受超負荷的生理系統；未參與或未受足夠壓力的系統，適應很有限或可能沒有。
    - 提升有氧耐力表現的計畫必須增進呼吸、心血管與肌肉骨骼系統的功能。
    detail: 特異性不是只指活動名稱相同，而是訓練必須讓競賽所需的生理系統承受超負荷；這也是模式愈貼近運動、表現改善愈大的原因。
    terms:
    - specificity
    numbers: []
    concepts:
    - program-design
    - adaptation
    related:
    - ch17.principles-exam-tips.i01
    locator: Factors Related to Aerobic Endurance Performance
- id: altitude-training
  title: 高地訓練 Altitude Training
  desc: ''
  tag: Altitude
  items:
  - id: ch20.altitude-training.i01
    q: 教材如何分類海拔高度（altitude）？
    a:
    - 教材列為：海平面（>500 m）、低度（>500–2,000 m）、中度（>2,000–3,000 m）、高度（>3,000–5,500 m）及極高度（>5,500 m）。
    detail: 海平面與低度分類的符號在轉出原文中看似互相衝突；教材原文如此，故不以其他高度分類慣例改寫。
    terms:
    - altitude
    numbers:
    - v: '>500'
      unit: m
      of: 教材列出的海平面分類值
    - v: '>500–2,000'
      unit: m
      of: 教材列出的低度分類範圍
    - v: '>2,000–3,000'
      unit: m
      of: 教材列出的中度分類範圍
    - v: '>3,000–5,500'
      unit: m
      of: 教材列出的高度分類範圍
    - v: '>5,500'
      unit: m
      of: 教材列出的極高度分類值
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch06.external-factors.i01
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
  - id: ch20.altitude-training.i02
    q: 高度增加為何會影響氣體交換與有氧表現？
    a:
    - 不同高度的氧氣百分比相同；隨高度增加，大氣壓下降，使氧分壓（partial pressure of oxygen, PO₂）下降。
    - PO₂ 是肺部氣體交換的驅動力；其下降會引發一連串代償性生理反應。
    detail: 教材特別反駁「高處氧氣百分比比較低」的常見說法；關鍵是總大氣壓與 PO₂ 下降，而不是氧氣比例改變。
    terms:
    - altitude
    - partial-pressure
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch01.respiratory.gas-exchange
    - ch06.external-factors.i01
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
  - id: ch20.altitude-training.i03
    q: 急性高地暴露何時可能開始降低有氧耐力表現？
    a:
    - 急性暴露於高度時，有氧耐力表現下降可能早在 700 m 就開始出現。
    detail: 這是「may begin to occur」的可能起點，不是 700 m 以上所有運動員必然出現同等幅度下降的門檻。
    terms:
    - altitude
    numbers:
    - v: '700'
      unit: m
      of: 急性高地暴露可能開始使有氧耐力表現下降的高度
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch06.external-factors.i01
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
  - id: ch20.altitude-training.i04
    q: 中度高度的適應（acclimatization）時間範圍為何？
    a:
    - 在最高至 2,300 m 的中度高度，適應可能在 12–14 天間發生。
    - 此過程也可能長達數個月。
    detail: 教材提供的是可能範圍而非單一固定天數；個人與暴露條件會影響所需時間。
    terms:
    - acclimatization
    - altitude
    numbers:
    - v: '2,300'
      unit: m
      of: 教材所述中度高度適應範圍的最高高度
    - v: '12–14'
      unit: days
      of: 中度高度可能發生適應的時間
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch06.external-factors.i03
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
  - id: ch20.altitude-training.i05
    q: 「高住低練」（live high, train low, LHTL）如何執行？
    a:
    - 運動員住在 2,000–3,000 m 的中度高度，並在接近海平面處訓練。
    - 此作法使運動員同時經歷高度適應與海平面訓練。
    detail: LHTL 是書中「常用」的高地訓練方法；教材並未宣稱它對每位運動員都必定產生表現增益。
    terms:
    - live-high-train-low
    - altitude
    numbers:
    - v: '2,000–3,000'
      unit: m
      of: LHTL 居住的中度高度範圍
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch06.external-factors.i02
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
  - id: ch20.altitude-training.i06
    q: 教材報告的高地訓練低氧劑量為何？
    a:
    - 報告指出，要從此類訓練獲益，運動員必須在約 2,100–2,500 m 的中度高度接受每天至少 12 小時、至少 3 週的低氧暴露。
    detail: 這是教材引用研究所報告的條件，不應改寫成普遍保證或唯一有效劑量。
    terms:
    - altitude
    numbers:
    - v: '2,100–2,500'
      unit: m
      of: 報告的高地訓練中度高度範圍
    - v: '≥12'
      unit: hours/day
      of: 報告的每日低氧暴露時間
    - v: '≥3'
      unit: weeks
      of: 報告的最低低氧暴露期間
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch20.altitude-training.i04
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
  - id: ch20.altitude-training.i07
    q: 教材如何描述高地比賽前的抵達建議？
    a:
    - 對於最佳化高地表現的建議差異很大，從比賽前立即抵達（24–48 小時）到在高地暴露 12 週都有。
    detail: 這一段是在呈現建議分歧，不是在指定其中一個時點為「最佳」抵達策略。
    terms:
    - altitude
    numbers:
    - v: '24–48'
      unit: hours
      of: 教材列出的比賽前立即抵達時段
    - v: '12'
      unit: weeks
      of: 教材列出的高地暴露最長建議提前時間
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch06.external-factors.i03
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
  - id: ch20.altitude-training.i08
    q: LHTL 可能產生增能效果的理由為何？
    a:
    - LHTL 可能讓運動員利用居住高地時的代謝與血液學適應，並在較低高度增進神經肌肉發展。
    detail: 教材用「may potentially provide」描述此增能效果，並未把血液學、代謝與神經肌肉變化列為已保證的結果。
    terms:
    - live-high-train-low
    - altitude
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch06.external-factors.i02
    locator: Special Issues Related to Aerobic Endurance Training > Altitude
- id: hr-calculations
  title: 心跳率計算 HR Calculations
  desc: ''
  tag: HR Calculations
  items:
  - id: ch20.hr-calculations.i01
    q: 年齡預測最大心率（age-predicted maximal heart rate, APMHR）公式為何？
    a:
    - APMHR = 220 − 年齡。
    detail: APMHR 是無法進行實驗室測試時，用來作為處方強度基礎的估計最大心率，而不是個別運動員實測的最大心率。
    terms:
    - age-predicted-maximal-heart-rate
    numbers:
    - v: '220'
      unit: beats/min
      of: APMHR 公式的起始常數
    concepts:
    - measurement
    - normal-values
    related:
    - ch06.acute-cardiovascular.i03
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.hr-calculations.i02
    q: 心率儲備（heart rate reserve, HRR）如何計算？
    a:
    - HRR = APMHR − 安靜心率（resting heart rate, RHR）。
    detail: 本章把 HRR 定義為最大心率與安靜心率的差；Karvonen 法將這個個人化差值納入目標心率計算。
    terms:
    - heart-rate-reserve
    - age-predicted-maximal-heart-rate
    - resting-heart-rate
    numbers: []
    concepts:
    - measurement
    - normal-values
    related:
    - ch01.cardiovascular.heart-rate
    - ch20.hr-calculations.i01
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.hr-calculations.i03
    q: Karvonen 法如何計算目標心率範圍（target heart rate range, THRR）？
    a:
    - 目標心率（target heart rate, THR）=（HRR × 運動強度）+ RHR。
    - 分別以強度範圍的下限與上限計算一次，即得 THRR。
    detail: 這是書中提供的實務處方公式；其準確性仍受 APMHR 為估計值的限制。
    terms:
    - karvonen-method
    - target-heart-rate
    - heart-rate-reserve
    - resting-heart-rate
    numbers: []
    concepts:
    - measurement
    - normal-values
    related:
    - ch20.hr-calculations.i02
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.hr-calculations.i04
    q: Karvonen 法的教材範例結果為何？
    a:
    - 30 歲、RHR 為 60 beats/min 的運動員，若指定功能能力 60–70%，其 THRR 為 138–151 beats/min。
    - 以每 10 秒心跳監測時，該範圍是 23–25 下。
    detail: 這是由教材的 APMHR 190 beats/min、HRR 130 beats/min 範例算出；它示範計算法，不能作為其他年齡或安靜心率者的通用處方。
    terms:
    - karvonen-method
    - resting-heart-rate
    - functional-capacity
    - target-heart-rate
    numbers:
    - v: '30'
      unit: years
      of: Karvonen 教材範例的運動員年齡
    - v: '60'
      unit: beats/min
      of: Karvonen 教材範例的安靜心率
    - v: '60–70'
      unit: '% functional capacity'
      of: Karvonen 教材範例指定的運動強度範圍
    - v: '138–151'
      unit: beats/min
      of: Karvonen 教材範例算得的目標心率範圍
    - v: '10'
      unit: seconds
      of: Karvonen 教材範例的心跳監測時間窗
    - v: '23–25'
      unit: beats
      of: Karvonen 教材範例每十秒的目標心跳範圍
    concepts:
    - measurement
    - normal-values
    related:
    - ch20.hr-calculations.i03
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.hr-calculations.i05
    q: 最大心率百分比（percentage of maximal heart rate, MHR）法公式為何？
    a:
    - THR = APMHR × 運動強度。
    - 分別以強度範圍的下限與上限計算一次，即得 THRR；這個公式不使用 RHR。
    detail: MHR 法同樣以年齡預測的最大心率為基礎，因此是實務估計，而非個別的實驗室測定。
    terms:
    - maximal-heart-rate
    - age-predicted-maximal-heart-rate
    - target-heart-rate
    numbers: []
    concepts:
    - measurement
    - normal-values
    related:
    - ch20.hr-calculations.i01
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.hr-calculations.i06
    q: 最大心率百分比法的教材範例結果為何？
    a:
    - 20 歲運動員指定為最大心率 70–85% 時，THRR 為 140–170 beats/min。
    - 以每 10 秒心跳監測時，該範圍是 23–28 下。
    detail: 此例的 APMHR 為 200 beats/min；教材以它示範只需 APMHR 與強度的 MHR 計算法。
    terms:
    - maximal-heart-rate
    - age-predicted-maximal-heart-rate
    - target-heart-rate
    numbers:
    - v: '20'
      unit: years
      of: 最大心率百分比法教材範例的運動員年齡
    - v: '70–85'
      unit: '% MHR'
      of: 最大心率百分比法教材範例指定的運動強度範圍
    - v: '140–170'
      unit: beats/min
      of: 最大心率百分比法教材範例算得的目標心率範圍
    - v: '10'
      unit: seconds
      of: 最大心率百分比法教材範例的心跳監測時間窗
    - v: '23–28'
      unit: beats
      of: 最大心率百分比法教材範例每十秒的目標心跳範圍
    concepts:
    - measurement
