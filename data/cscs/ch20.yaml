    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.hr-calculations.i07
    q: 表 20.1 中 V̇O₂max、HRR 與 MHR 百分比的關係為何？
    a:
    - 表中的 V̇O₂max 百分比與 HRR 百分比逐列相同。
    - 在未達最大值的各列，相對應的 MHR 百分比較高。
    detail: 這是表 20.1 的對照關係；它不表示任何以 MHR 估計的個別心率都等於實驗室測得的強度。
    terms:
    - vo2max
    - heart-rate-reserve
    - maximal-heart-rate
    numbers: []
    concepts:
    - measurement
    - normal-values
    related:
    - ch06.acute-cardiovascular.i04
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate > Table 20.1 Relationship between VO2max, HRR, and MHR"
  - id: ch20.hr-calculations.i08
    q: 如何將 THRR 換成每 10 秒心跳數？
    a:
    - 將以 beats/min 表示的 THRR 除以 6，即得每 10 秒的目標心跳數。
    detail: 書中的兩個計算範例都使用此換算，目的在於運動中以短時間計數監測心率範圍。
    terms:
    - target-heart-rate
    numbers:
    - v: '6'
      unit: ratio
      of: 將每分鐘目標心率換算為每十秒心跳數的除數
    - v: '10'
      unit: seconds
      of: 目標心率換算後的心跳計數時間窗
    concepts:
    - measurement
    - normal-values
    related:
    - ch01.cardiovascular.heart-rate
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
- id: intensity-monitoring
  title: 強度監控方法 Intensity Monitoring
  desc: ''
  tag: Intensity
  items:
  - id: ch20.intensity-monitoring.i01
    q: 哪些是教材列出的最精確強度監測方法？
    a:
    - 運動中監測攝氧量，以判定其占 V̇O₂max 的百分比。
    - 定期測量血乳酸濃度，以判定其與乳酸閾值的關係。
    detail: 心率、RPE、MET 或運動速度是在無法進行 V̇O₂max 測試時可用的處方替代方法；自行車選手也常用功率量測裝置。
    terms:
    - oxygen-consumption
    - vo2max
    - lactate-threshold
    numbers: []
    concepts:
    - measurement
    - program-design
    related:
    - ch13.aerobic-capacity.i06
    - ch12.why-test.i04
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity"
  - id: ch20.intensity-monitoring.i02
    q: 心率（heart rate）何時適合用來處方有氧強度？
    a:
    - 心率是最常用的有氧運動強度處方方法，尤其在功能能力（V̇O₂max）的 50–90% 強度間，心率與攝氧量關係密切。
    - HRR 是最大心率與安靜心率之差；可依目標 V̇O₂max 百分比或乳酸閾值對應的特定心率調節強度。
    detail: 若要最精確，仍須用實驗室測試找出個人的目標 V̇O₂max 百分比或 LT 心率，而不是只依年齡推估。
    terms:
    - heart-rate
    - heart-rate-reserve
    - vo2max
    - lactate-threshold
    numbers:
    - v: '50–90'
      unit: '% V̇O₂max'
      of: 教材指心率與攝氧量關係密切的功能能力強度範圍
    concepts:
    - measurement
    - program-design
    related:
    - ch06.acute-cardiovascular.i03
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.intensity-monitoring.i03
    q: 自覺用力程度量表（ratings of perceived exertion, RPE）如何使用與解讀？
    a:
    - RPE 可用來調節有氧耐力訓練強度；教材表 20.2 的量表從 1「完全沒有用力（躺下）」到 10「最大努力（無法再繼續）」。
    - 年齡、性別、訓練狀態與適能，以及音樂、影片、環境溫度、海拔、營養與外部回饋都可能影響 RPE；但教材引用作者仍認為它是有效監測工具。
    detail: RPE 與強度的關係會受到被動干擾物及環境溫度影響；因此它是有效但具情境敏感性的量測，而非不受外界影響的固定讀值。
    terms:
    - ratings-of-perceived-exertion
    numbers:
    - v: '1'
      unit: RPE scale point
      of: 表 20.2 的完全沒有用力評分
    - v: '10'
      unit: RPE scale point
      of: 表 20.2 的最大努力評分
    concepts:
    - measurement
    - program-design
    related:
    - ch13.test-administration.i03
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Ratings of Perceived Exertion Scales > Table 20.2 Rating of Perceived Exertion (RPE) Scale"
  - id: ch20.intensity-monitoring.i04
    q: 代謝當量（metabolic equivalent, MET）如何用於強度處方？
    a:
    - 1 MET 等於 3.5 ml·kg⁻¹·min⁻¹ 的攝氧量，並被視為身體靜息時所需的氧氣量。
    - 例如 10.0 MET 的活動，需為靜息時的 10 倍攝氧量；要把 MET 納入有氧處方，專業人員須知道或估計運動員的最大攝氧量。
    detail: MET 值已為多種活動建立，表 20.3 只列出其中一部分；處方的前提是能將活動 MET 與個別運動員的最大攝氧量對照。
    terms:
    - metabolic-equivalent
    - vo2max
    numbers:
    - v: '1'
      unit: MET
      of: 靜息攝氧量的代謝當量
    - v: '3.5'
      unit: ml·kg⁻¹·min⁻¹
      of: 一個 MET 所代表的攝氧量
    - v: '10.0'
      unit: MET
      of: 教材用來說明十倍靜息攝氧量的活動範例
    - v: '10'
      unit: times resting oxygen uptake
      of: 十 MET 活動相對於靜息的攝氧量
    concepts:
    - measurement
    - program-design
    related:
    - ch06.acute-cardiovascular.i04
    - ch13.aerobic-capacity.i01
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Metabolic Equivalents"
  - id: ch20.intensity-monitoring.i05
    q: 自行車功率量測（power measurement）的優勢與限制為何？
    a:
    - 自行車選手可用功率量測曲柄與花鼓監測強度；至少兩種裝置已被研究證實具有有效且可靠的功率量測。
    - 代謝率與機械功率產生密切相關，且功率可讓運動員在可能影響心率與訓練速度的環境條件下重複相同強度。
    detail: 由於成本，教材認為這類裝置可能只適合職業選手與頂尖業餘選手；它描述的是可重複的強度努力，並非聲稱功率不受所有訓練條件影響。
    terms:
    - power-measurement
    - heart-rate
    numbers: []
    concepts:
    - measurement
    - program-design
    related:
    - ch12.reliability.i01
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Power Measurement"
  - id: ch20.intensity-monitoring.i06
    q: 以 APMHR 監測強度有哪些限制？
    a:
    - Karvonen 與最大心率百分比公式雖實用，但在自行車或跑步中，依年齡預測最大心率處方可能不如實驗室測得最大心率準確。
    - 年齡解釋心率變異的 75%；運動模式與適能水準等其他因素也須納入考量。估計最大心率方程式也無法提供乳酸閾值對應的強度資訊。
    detail: 教材的限制不是否定這兩種公式可用，而是提醒它們是沒有實驗室測試時的實用估計；若不知道個人的 LT，就無法發展高度有效的有氧耐力計畫。
    terms:
    - age-predicted-maximal-heart-rate
    - lactate-threshold
    numbers:
    - v: '75'
      unit: '%'
      of: 教材所述年齡對心率變異的貢獻
    concepts:
    - measurement
    - program-design
    related:
    - ch06.acute-cardiovascular.i03
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.intensity-monitoring.i07
    q: 何時需要以實驗室測試設定心率強度？
    a:
    - 以心率調節強度最精確的方法，是找出目標 V̇O₂max 百分比或乳酸閾值對應的特定心率。
    - 若要達到這個精確度，須以實驗室測試辨識這些運動強度。
    detail: 這條與 APMHR 公式是精確度上的取捨：前者以個人實測的生理對應為基礎，後者在實驗室不可用時以年齡估算。
    terms:
    - heart-rate
    - vo2max
    - lactate-threshold
    numbers: []
    concepts:
    - measurement
    - program-design
    related:
    - ch13.aerobic-capacity.i06
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate"
  - id: ch20.intensity-monitoring.i08
    q: 為何使用表 20.1 比只看相同百分比更合適？
    a:
    - 表 20.1 顯示相同 V̇O₂max 百分比時，HRR 百分比相同，而 MHR 百分比較高。
    - 因此以 V̇O₂max 或 HRR 百分比處方時，不能把同一數值直接當成 MHR 百分比。
    detail: 這是表格的對照用途；它協助選擇相應的 MHR 值，不將 MHR 與 HRR 當成可互換的標示。
    terms:
    - vo2max
    - heart-rate-reserve
    - maximal-heart-rate
    numbers: []
    concepts:
    - measurement
    - program-design
    related:
    - ch06.acute-cardiovascular.i04
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity > Heart Rate > Table 20.1 Relationship between VO2max, HRR, and MHR"
- id: periodization
  title: 賽季週期化 Periodization
  desc: ''
  tag: Periodization
  items:
  - id: ch20.periodization.i01
    q: 休季（off-season／base training）的目標與處方為何？
    a:
    - 目標是建立良好體能基礎；表 20.5 的典型處方為每週 5–6 次、長持續時間、低至中等強度。
    - 初期應以長時間低強度訓練組成；隨休季進行，提高強度並較少地增加持續時間，但持續時間每週增加不得超過 5–10%。
    detail: 持續時間增加過多反而可能降低有氧耐力表現；當運動員已適應刺激時，才週期性提高強度以提供新的超負荷。
    terms:
    - off-season
    - base-training
    numbers:
    - v: '5–6'
      unit: sessions/week
      of: 表 20.5 的休季典型訓練頻率
    - v: '5–10'
      unit: '%/week'
      of: 休季訓練持續時間的最高建議增幅
    concepts:
    - periodization
    - program-design
    related:
    - ch21.preparatory-period.i02
    locator: Application of Program Design to Training Seasons > Off-Season (Base Training) > Table 20.5 Sport Season Objectives and Program Design Assignments
  - id: ch20.periodization.i02
    q: 季前（preseason）有氧訓練的重點為何？
    a:
    - 表 20.5 的典型處方為每週 6–7 次、中至長持續時間及中至高強度，目標是改善有氧耐力表現的重要因素。
    - 應提高強度、維持或降低持續時間，並把所有訓練類型納入計畫。
    detail: 各訓練類型的數量與頻率由個別運動員的強項與弱項決定；教材沒有規定每類訓練固定比例。
    terms:
    - preseason
    numbers:
    - v: '6–7'
      unit: sessions/week
      of: 表 20.5 的季前典型訓練頻率
    concepts:
    - periodization
    - program-design
    related:
    - ch21.preparatory-period.i03
    locator: Application of Program Design to Training Seasons > Preseason > Table 20.5 Sport Season Objectives and Program Design Assignments
  - id: ch20.periodization.i03
    q: 賽季（in-season／competition）有氧訓練如何安排？
    a:
    - 表 20.5 將訓練與比賽合計為每週 5–6 次；訓練日短且低強度，競賽距離日則為高強度。
    - 計畫必須納入競賽日；排定競賽前的訓練日應低強度、短持續時間，使運動員充分恢復與休息。
    detail: 賽季中的訓練類型仍依持續改善弱項、維持強項的目標選擇，不是只有維持而完全停止改善。
    terms:
    - in-season
    numbers:
    - v: '5–6'
      unit: sessions/week
      of: 表 20.5 的賽季訓練與競賽合計頻率
    concepts:
    - periodization
    - program-design
    related:
    - ch21.competition-period.i04
    locator: Application of Program Design to Training Seasons > In-Season (Competition) > Table 20.5 Sport Season Objectives and Program Design Assignments
  - id: ch20.periodization.i04
    q: 賽後（postseason／active rest）的目標與處方為何？
    a:
    - 目標是從競賽季恢復；表 20.5 的典型處方為每週 3–5 次、短持續時間、低強度。
    - 仍應有足夠活動維持心肺適能、肌力與瘦體重，並著重復健競賽季受傷與改善無力或體能不足的肌群。
    detail: 賽後是主動休息，不是完全停止活動；低量低強度與維持基本體能同時存在。
    terms:
    - postseason
    - active-rest
    numbers:
    - v: '3–5'
      unit: sessions/week
      of: 表 20.5 的賽後典型訓練頻率
    concepts:
    - periodization
    - adaptation
    related:
    - ch21.active-rest.i03
    locator: Application of Program Design to Training Seasons > Postseason (Active Rest) > Table 20.5 Sport Season Objectives and Program Design Assignments
  - id: ch20.periodization.i05
    q: 為何賽前安排短時間、低強度訓練？
    a:
    - 在已排定競賽前，低強度、短持續時間的訓練日可使運動員充分恢復與休息。
    - 賽季訓練仍以改善弱項與維持強項為依據。
    detail: 這是賽季設計同時容納競賽與訓練的原則；教材沒有把所有賽前訓練一律刪除。
    terms:
    - in-season
    numbers: []
    concepts:
    - periodization
    related:
    - ch21.competition-period.i06
    locator: Application of Program Design to Training Seasons > In-Season (Competition)
  - id: ch20.periodization.i06
    q: 從休季轉入季前時，教材要求如何改變訓練？
    a:
    - 季前應提高強度、維持或減少持續時間，並把所有有氧耐力訓練類型納入計畫。
    - 每一類訓練的量與頻率依運動員的個別強弱項決定。
    detail: 原文要求的是納入所有訓練類型，沒有指定此轉換必定以哪一種間歇訓練開始，也沒有在這一節要求持續評估生理指標。
    terms:
    - off-season
    - preseason
    numbers: []
    concepts:
    - periodization
    - program-design
    related:
    - ch21.preparatory-period.i01
    locator: Application of Program Design to Training Seasons > Preseason
  - id: ch20.periodization.i07
    q: 賽後主動休息還要保留哪些工作？
    a:
    - 維持足夠的心肺適能、肌力與瘦體重。
    - 復健競賽季遭受的傷害，並改善無力或體能不足的肌群。
    detail: 這段談的是主動休息期維持與復健的內容；教材沒有在此以「避免去訓練」作為明列目標。
    terms:
    - active-rest
    numbers: []
    concepts:
    - periodization
    - injury
    related:
    - ch22.sports-medicine-team.i04
    locator: Application of Program Design to Training Seasons > Postseason (Active Rest)
  - id: ch20.periodization.i08
    q: 教材如何總結全年有氧耐力訓練計畫？
    a:
    - 年度通常分為休季（基礎訓練）、季前、賽季（競賽）與賽後（主動休息）等階段。
    - 健全的全年計畫應依賽季分段，對每段設定特定目標與任務，使表現漸進提升。
    detail: 結論要求計畫及早建立且有足夠結構來增進表現，也保留足夠彈性以避免過度使用傷害與過度訓練。
    terms:
    - off-season
    - preseason
    - in-season
    - postseason
    numbers: []
    concepts:
    - periodization
    - program-design
    related:
    - ch21.periodization-hierarchy.i02
    locator: Application of Program Design to Training Seasons
- id: program-design
  title: 訓練設計5步驟 Program Design
  desc: ''
  tag: Program Design
  items:
  - id: ch20.program-design.i01
    q: 步驟 1：運動模式（exercise mode）如何選擇？
    a:
    - 選擇盡可能模仿競賽動作模式的活動，例如騎車、跑步或游泳。
    - 模式愈符合運動項目，表現改善愈大；多項耐力運動員或一般有氧適能計畫可採交叉訓練或多種耐力活動。
    detail: 模式選擇的目的在於讓競賽所需的特定肌纖維徵召與其能量系統受到挑戰，不只是選擇任一會讓心率上升的活動。
    terms:
    - exercise-mode
    - cross-training
    numbers: []
    concepts:
    - program-design
    related:
    - ch17.exercise-selection.i05
    locator: "Designing an Aerobic Endurance Program > Step 1: Exercise Mode"
  - id: ch20.program-design.i02
    q: 步驟 2：哪些因素決定訓練頻率（training frequency）？
    a:
    - 頻率取決於強度與持續時間的互動、運動員訓練狀態及所處賽季；強度更高或持續更久時，可能需要較低頻率以恢復。
    - 訓練較少者在週期開始時比高訓練者需要更多恢復日；休季可為每週 5 日，季前可進展到每日訓練，三鐵選手甚至每天多次。
    - 研究顯示，每週訓練多於 2 次才會提高 V̇O₂max；每週多於 5 次的訓練與較高傷害率有關。
    detail: 傷害率研究的受試者是廣泛年齡層的活動者，而非僅年輕健康運動員，故不能把此關聯直接當成每位耐力選手的固定上限。
    terms:
    - training-frequency
    - training-status
    - vo2max
    numbers:
    - v: '5'
      unit: sessions/week
      of: 教材舉例的休季訓練日數
    - v: '>2'
      unit: sessions/week
      of: 研究顯示能提高 V̇O₂max 的最低訓練頻率條件
    - v: '>5'
      unit: sessions/week
      of: 研究中與較高傷害率有關的訓練頻率
    concepts:
    - program-design
    - periodization
    related:
    - ch17.training-frequency.i01
    locator: "Designing an Aerobic Endurance Program > Step 2: Training Frequency"
  - id: ch20.program-design.i03
    q: 步驟 3：訓練強度（training intensity）為何須與持續時間一起處方？
    a:
    - 強度與持續時間的互動是造成訓練適應的核心；通常強度愈高，持續時間愈短。
    - 強度過低無法使系統超負荷並誘發目標適應，過高則造成疲勞並過早結束訓練；兩者都使課表效果不佳。
    detail: 高強度有氧運動改善心血管與呼吸功能、提升工作肌肉氧氣運送；強度提高也會徵召更多 Type II 肌纖維，使其可能獲得較多有氧訓練。
    terms:
    - training-intensity
    - exercise-duration
    - type-ii-muscle-fiber
    numbers: []
    concepts:
    - program-design
    - adaptation
    related:
    - ch17.principles-exam-tips.i02
    locator: "Designing an Aerobic Endurance Program > Step 3: Training Intensity"
  - id: ch20.program-design.i04
    q: 步驟 4：運動持續時間（exercise duration）與強度的例子為何？
    a:
    - 訓練課的持續時間受強度影響：持續時間愈長，強度通常愈低。
    - 高於最大乳酸穩態的強度，例如 85% V̇O₂max，因肌肉乳酸累積導致疲勞，持續時間相對短，約為 20–30 分鐘；例如 70% V̇O₂max 的較低強度可持續數小時才疲勞。
    detail: 這是課表內強度與時間的反向關係，不是將所有運動員在同一 V̇O₂max 百分比下的可持續時間定為固定值。
    terms:
    - exercise-duration
    - training-intensity
    - maximal-lactate-steady-state
    - vo2max
    numbers:
    - v: '85'
      unit: '% V̇O₂max'
      of: 教材舉例高於最大乳酸穩態的運動強度
    - v: '20–30'
      unit: minutes
      of: 教材舉例在 85% V̇O₂max 時的相對短持續時間
    - v: '70'
      unit: '% V̇O₂max'
      of: 教材舉例可持續數小時的較低運動強度
    concepts:
    - program-design
    related:
    - ch03.lactate.i03
    locator: "Designing an Aerobic Endurance Program > Step 4: Exercise Duration"
  - id: ch20.program-design.i05
    q: 步驟 5：有氧訓練進展（exercise progression）原則為何？
    a:
    - 進展起初會提高頻率、強度與持續時間；一般建議任一變項每週增加不超過 10%。
    - 到較高適能水準後，頻率或持續時間可能已無法再增加；此時只透過操弄強度進展。
    detail: 頻率、強度和持續時間的組合可被不同方式操弄，但強度進展必須特別仔細監測以避免過度訓練。
    terms:
    - exercise-progression
    - training-frequency
    - training-intensity
    - exercise-duration
    - overtraining
    numbers:
    - v: '10'
      unit: '%/week'
      of: 頻率、強度或持續時間任一變項的最高一般建議增幅
    concepts:
    - program-design
    - periodization
    related:
    - ch17.principles-exam-tips.i03
    locator: "Designing an Aerobic Endurance Program > Step 5: Exercise Progression"
  - id: ch20.program-design.i06
    q: 有氧訓練課之間的恢復原則為何？
    a:
    - 每週訓練應至少安排 1 天恢復或主動休息；困難訓練後的相對休息可改善隨後的運動表現。
    - 恢復時須充分休息、補充水分並恢復燃料來源；特別長或強度高的訓練後，運動後碳水化合物攝取有助補回可能耗竭的肌肉與肝臟肝醣。
    detail: 高強度或長時間訓練日後，放鬆並避免費力活動特別重要；補液是取代訓練中流失的液體，不是可由碳水化合物取代的步驟。
    terms:
    - recovery
    numbers:
    - v: '1'
      unit: day/week
      of: 每週至少安排的恢復或主動休息日
    concepts:
    - program-design
    - nutrition
    related:
    - ch10.post-competition.i03
    - ch09.hydration.i06
    locator: "Designing an Aerobic Endurance Program > Step 2: Training Frequency"
  - id: ch20.program-design.i07
    q: 降低頻率時，有氧適能可維持多久？
    a:
    - 維持訓練強度而將頻率降至每週至少 2 次時，有氧適能可在最多 5 週內不下降。
    detail: 這一研究結果談的是維持強度、減少頻率的條件；它不是完全停止訓練時也能維持適能五週的結論。
    terms:
    - training-frequency
    - training-intensity
    numbers:
    - v: '2'
      unit: sessions/week
      of: 維持有氧適能時可降至的訓練頻率
    - v: '5'
      unit: weeks
      of: 維持強度且每週兩次訓練下，有氧適能可不下降的最長期間
    concepts:
    - program-design
    - adaptation
    related:
    - ch06.detraining.i03
    locator: "Designing an Aerobic Endurance Program > Step 5: Exercise Progression"
  - id: ch20.program-design.i08
    q: 本章對女性與男性的有氧訓練計畫有何說明？
    a:
    - 女性運動員的訓練計畫不必與男性不同；證據顯示男女對訓練計畫的反應相似。
    detail: 本章僅作此一般性說明，並指向第 7 章討論性別相關差異及其對運動的意涵；沒有把所有個別處方差異排除。
    terms: []
    numbers: []
    concepts:
    - program-design
    - population
    related:
    - ch07.program-design-populations.i01
    locator: Designing an Aerobic Endurance Program > Aerobic Training Program Design Variables
- id: special-issues
  title: 特殊訓練議題 Special Issues
  desc: ''
  tag: Special Issues
  items:
  - id: ch20.special-issues.i01
    q: 交叉訓練（cross-training）可用於哪些情境？
    a:
    - 可在受傷而減少訓練或一個訓練週期恢復期間，協助運動員維持一般體能。
    - 它把訓練的物理壓力分散到與主要訓練不同的肌群，可能降低過度使用傷害的機率。
    - 要有效維持 V̇O₂max，交叉訓練的強度與持續時間必須等同主要運動模式。
    detail: 多項目運動員也可用交叉訓練追求游泳、騎車與跑步表現；但「維持 V̇O₂max」的前提是強度和時間相等，不能只更換活動類型。
    terms:
    - cross-training
    - vo2max
    numbers: []
    concepts:
    - program-design
    - safety
    related:
    - ch06.detraining.i03
    locator: Special Issues Related to Aerobic Endurance Training > Cross-Training
  - id: ch20.special-issues.i02
    q: 去訓練（detraining）是什麼，如何減少其影響？
    a:
    - 去訓練是因訓練中斷、受傷或疾病而減少持續時間、降低強度或完全停止訓練；缺乏適當刺激時，訓練誘發的生理適應會迅速朝訓練前水準退回。
    - 若可行，持續以主要運動模式、但降低頻率與強度，可將去訓練影響降至最低；其他模式可減緩完全停止訓練時部分適應流失。
    detail: 交叉訓練只能減輕完全停訓時通常出現的部分適應流失，不能取代主要模式的特異性刺激。
    terms:
    - detraining
    - cross-training
    numbers: []
    concepts:
    - program-design
    - adaptation
    related:
    - ch06.detraining.i03
    locator: Special Issues Related to Aerobic Endurance Training > Detraining
  - id: ch20.special-issues.i03
    q: 減量訓練（tapering）的定義、期間與目標為何？
    a:
    - 減量訓練是賽前系統性降低訓練持續時間與強度，同時更著重技術工作與營養介入，以在競賽時達到巔峰表現。
    - 典型減量期可能為 7–28 天；賽前減量有助恢復與再水化，並促進肌肉和肝臟肝醣儲存增加。
    detail: 這一段沒有將肝醣增加稱為「超補」，也沒有說減量一律維持頻率與強度；那些條件只在後面的特定減量模型說明。
    terms:
    - tapering
    numbers:
    - v: '7–28'
      unit: days
      of: 教材所述典型減量訓練期間
    concepts:
    - program-design
    - periodization
    related:
    - ch06.detraining.i08
    - ch10.carb-loading.i01
    - ch09.hydration.i06
    locator: Special Issues Related to Aerobic Endurance Training > Tapering
  - id: ch20.special-issues.i04
    q: 三種減量訓練模型如何區分？
    a:
    - 線性減量（linear taper）是在全期逐步降低每日總訓練量；階梯減量（step taper）則是突然且顯著地降低訓練量，通常至少 50%，並在整個減量期不再波動。
    - 漸進減量（progressive taper）結合兩者：先立即降低訓練量 10–15%，再於每一層級以較小、較漸進的幅度降低；三種模型都在系統性降低訓練量時維持強度與頻率。
    detail: 「progressive」不是單純緩慢下降，而是有一次快速起始降量後，再分層小幅下降；教材原文如此。
    terms:
    - tapering
    numbers:
    - v: '≥50'
      unit: '% training volume'
      of: 階梯減量通常突然降低的訓練量
    - v: '10–15'
      unit: '% training volume'
      of: 漸進減量一開始立即降低的訓練量
    concepts:
    - program-design
    - periodization
    related:
    - ch21.fitness-fatigue.i04
    locator: Special Issues Related to Aerobic Endurance Training > Tapering
  - id: ch20.special-issues.i05
    q: 阻力訓練（resistance training）對耐力運動員可能有哪些效益？
    a:
    - 阻力訓練是常被忽略、但可能改善耐力選手表現的因素；現有對訓練良好耐力選手的研究有限。
    - 在一項高度訓練有氧運動員研究中，阻力訓練沒有提高 V̇O₂max，卻改善騎車與跑步的短時間運動表現。
    - 可能效益還包括較快從傷害恢復、預防過度使用傷害、降低肌肉失衡；力量也有助爬坡、突圍追趕與最後衝刺。
    detail: 「不提高 V̇O₂max」是教材引述的特定研究結果，不能概括成所有耐力選手做阻力訓練都不會改變 V̇O₂max。
    terms:
    - resistance-training
    - vo2max
    numbers: []
    concepts:
    - program-design
    - safety
    related:
    - ch17.needs-analysis.i06
    - ch05.cardiovascular-adaptations.i08
    locator: Special Issues Related to Aerobic Endurance Training > Resistance Training
  - id: ch20.special-issues.i06
    q: Mikkola 等人研究對不同阻力訓練方式的發現為何？
    a:
    - 在休閒跑者中，肌耐力訓練、爆發性阻力訓練與重阻力訓練計畫皆改善跑步機上的跑步表現。
    detail: 這一條的受試者是休閒跑者，與前一條高度訓練有氧運動員的研究不同；不能把兩項研究的受試者與結果混為同一個普遍結論。
    terms:
    - resistance-training
    numbers: []
    concepts:
    - program-design
    - adaptation
    related:
    - ch17.load-repetitions.i04
    locator: Special Issues Related to Aerobic Endurance Training > Resistance Training
  - id: ch20.special-issues.i07
    q: 交叉訓練對單項運動員的限制為何？
    a:
    - 交叉訓練無法像只做模式特異訓練那樣，大幅提升單項運動員的表現。
    detail: 因此交叉訓練可維持部分體能或分散壓力，但它不是以改善單項成績為目的時的等效替代方案。
    terms:
    - cross-training
    - specificity
    numbers: []
    concepts:
    - program-design
    - adaptation
    related:
    - ch17.principles-exam-tips.i05
    locator: Special Issues Related to Aerobic Endurance Training > Cross-Training
  - id: ch20.special-issues.i08
    q: 教材對減量訓練研究證據的適用範圍如何說明？
    a:
    - 減量的目標是在競賽時達到巔峰表現，並且更著重技術工作與營養介入。
    - 多數可得減量研究是在游泳選手進行，但跑者與自行車選手的研究也顯示可從良好規畫的減量方案獲益。
    detail: 教材沒有把游泳研究直接推論成只限游泳者可用；它以跑者與自行車證據補充減量的適用範圍。
    terms:
    - tapering
    numbers: []
    concepts:
    - program-design
    - periodization
    related:
    - ch21.competition-period.i05
    locator: Special Issues Related to Aerobic Endurance Training > Tapering
- id: training-types
  title: 訓練類型 Training Types
  desc: ''
  tag: Training Types
  items:
  - id: ch20.training-types.i01
    q: 長距離慢速訓練（long, slow distance training, LSD）的處方與效益為何？
    a:
    - 表 20.4 的常見處方是每週 1–2 次、競賽距離或更長（約 30–120 分鐘）、約 70% V̇O₂max；傳統上也描述為約 80% 最大心率，且「慢」是比典型競賽配速慢。
    - 效益主要包括提升心血管與體溫調節功能、肌肉粒線體能量產生與氧化能力，以及脂肪作為燃料的利用；長期使用也最終使 Type IIx 纖維轉為 Type I。
    detail: LSD 可提高身體清除乳酸的能力，因而可能提高 LT 強度；但教材也提醒，過度安排 LSD 有其競賽特異性限制。
    terms:
    - long-slow-distance-training
    - vo2max
    - maximal-heart-rate
    - type-iix-muscle-fiber
    - type-i-muscle-fiber
    numbers:
    - v: '1–2'
      unit: sessions/week
      of: 表 20.4 的 LSD 常見訓練頻率
    - v: '30–120'
      unit: minutes
      of: 表 20.4 的 LSD 工作段典型持續時間
    - v: '~70'
      unit: '% V̇O₂max'
      of: 表 20.4 的 LSD 常見強度
    - v: '~80'
      unit: '% maximal heart rate'
      of: 內文所述 LSD 傳統強度對應
    concepts:
    - program-design
    - energy-supply
    - adaptation
    related:
    - ch06.chronic-muscular.i01
    - ch06.chronic-muscular.i04
    - ch10.during-event.i04
    locator: Types of Aerobic Endurance Training Programs > Long, Slow Distance Training > Table 20.4 Types of Aerobic Endurance Training
  - id: ch20.training-types.i02
    q: 配速／節奏訓練（pace/tempo training）如何進行？
    a:
    - 表 20.4 的常見處方是每週 1–2 次、約 20–30 分鐘，強度在乳酸閾值、競賽配速或略高於競賽配速。
    - 可採連續的穩態方式，或採較短工作間隔與短暫恢復的間歇方式；其目的在壓力下改善有氧與無氧代謝供能，建立競賽配速感。
    detail: 若訓練感覺相對容易，教材建議增加距離而非增加強度；其訓練的肌纖維徵召型態與競賽所需者相同。
    terms:
    - pace-tempo-training
    - lactate-threshold
    numbers:
    - v: '1–2'
      unit: sessions/week
      of: 表 20.4 的配速／節奏訓練常見頻率
    - v: '20–30'
      unit: minutes
      of: 表 20.4 的配速／節奏訓練工作段典型持續時間
    concepts:
    - program-design
    - energy-supply
    related:
    - ch03.lactate.i04
    locator: Types of Aerobic Endurance Training Programs > Pace/Tempo Training > Table 20.4 Types of Aerobic Endurance Training
  - id: ch20.training-types.i03
    q: 間歇訓練（interval training）的處方與效益為何？
    a:
    - 表 20.4 的常見處方是每週 1–2 次，工作段 3–5 分鐘、工作與休息比（W:R）為 1:1，強度接近 V̇O₂max。
    - 它讓運動員能以接近 V̇O₂max 的強度累積比單次連續高強度運動更久的訓練時間；效益包括提高 V̇O₂max 與增進無氧代謝。
    detail: 工作段也可短至 30 秒，但教材對 3–5 分鐘工作段的休息要求為等長；這不是所有間歇格式都可隨意套用的統一功休比。
    terms:
    - interval-training
    - vo2max
    - work-rest-ratio
    numbers:
    - v: '1–2'
      unit: sessions/week
      of: 表 20.4 的間歇訓練常見頻率
    - v: '3–5'
      unit: minutes
      of: 表 20.4 的間歇訓練工作段典型持續時間
    - v: '1:1'
      unit: work:rest ratio
      of: 三至五分鐘間歇工作段的工作與休息比
    - v: '30'
      unit: seconds
      of: 內文所述間歇工作段可短至的時間
    concepts:
    - program-design
    - energy-supply
    related:
    - ch03.metabolic-specificity.i02
    - ch14.ramp-protocol.i08
    locator: Types of Aerobic Endurance Training Programs > Interval Training > Table 20.4 Types of Aerobic Endurance Training
  - id: ch20.training-types.i04
    q: 高強度間歇訓練（high-intensity interval training, HIIT）如何處方？
    a:
    - HIIT 是重複的高強度運動段，穿插短暫恢復；表 20.4 的常見處方為每週 1 次、工作段 30–90 秒、W:R 為 1:5，強度大於 V̇O₂max。
    - 為取得最佳刺激，運動員需在 HIIT 課中累積數分鐘高於 90% V̇O₂max；短於 45 秒與 2–4 分鐘的間歇都能造成不同訓練反應。
    - 長間歇範例為工作至少 2–3 分鐘、強度在或高於 90% V̇O₂max，恢復段不超過 2 分鐘。
    detail: 休息過短會使後續工作段無法維持品質並增加受傷風險；過長則可能減少挑戰無氧糖解系統的效益。
    terms:
    - hiit
    - vo2max
    - work-rest-ratio
    numbers:
    - v: '1'
      unit: session/week
      of: 表 20.4 的 HIIT 常見頻率
    - v: '30–90'
      unit: seconds
      of: 表 20.4 的 HIIT 工作段典型持續時間
    - v: '1:5'
      unit: work:rest ratio
      of: 表 20.4 的 HIIT 工作與休息比
    - v: '>90'
      unit: '% V̇O₂max'
      of: HIIT 最佳刺激所需累積達到的強度
    - v: '<45'
      unit: seconds
      of: 教材所述短 HIIT 間歇的時長
    - v: '2–4'
      unit: minutes
      of: 教材所述長 HIIT 間歇的時長
    - v: '≥2–3'
      unit: minutes
      of: 長間歇 HIIT 範例的工作段時間
    - v: '≤2'
      unit: minutes
      of: 長間歇 HIIT 範例的恢復段時間上限
    concepts:
    - program-design
    - energy-supply
    related:
    - ch03.metabolic-specificity.i05
    locator: Types of Aerobic Endurance Training Programs > High-Intensity Interval Training > Table 20.4 Types of Aerobic Endurance Training
  - id: ch20.training-types.i05
    q: 法特雷克訓練（Fartlek training）是什麼？
    a:
    - Fartlek 源自瑞典語「速度遊戲」，結合先前的多種訓練；雖常與跑步連結，也可用於騎車和游泳。
    - 表 20.4 的常見處方為每週 1 次、約 20–60 分鐘，強度在 LSD 與配速／節奏訓練之間變化。
    - 範例為約 70% V̇O₂max 的輕鬆跑，穿插上坡或約 85–90% V̇O₂max 的短而快衝刺。
    detail: 此格式可挑戰全身系統並減少日常訓練的無聊與單調；教材說它「可能」提升 V̇O₂max、LT、跑步經濟性與燃料使用。
    terms:
    - fartlek-training
    - long-slow-distance-training
    - pace-tempo-training
    - vo2max
    numbers:
    - v: '1'
