  - id: ch23.key-numbers.i08
    q: 非一樓樓板與室內環境有哪些數值標準？
    a:
    - 非一樓設施的樓板承重至少為 100 lb/ft²（488 kg/m²）。
    - 照明應介於 50–100 lumens，並依天花板高度與自然光量調整。
    - 多數來源建議溫度為 68–78 °F（20–25 °C）；許多來源認為 72–78 °F（22–25 °C）最適合運作。
    - 有身體活動空間的相對濕度不應超過 60%；空氣每小時應交換 8–12 次。
    - 若使用風扇，一般指引是每 1,200 ft²（111.5 m²）配置 2–4 台；音響聲音應低於 90 dB。
    detail: 樓板承重只適用於非一樓位置；溫度範圍以「多數／許多來源」限定。照明單位與數值依教材原文保留。
