cards:
- q: 新訓練設施設計的四個階段依序為何？
  a: 1. 預設計期（Predesign）。2. 設計期（Design）。3. 建造期（Construction）。4. 預運群期（Preoperation）。
  tag: facility-design
- q: 預設計期（predesign phase）包含哪三個主要步驟？
  a: '1. 需求分析（needs analysis）——確定運動計畫需求。

    2. 可行性研究（feasibility study）——SWOT 分析，確保財務可行性。

    3. 總體規劃（master plan）——包含建築、設計、預算、運營計畫。'
  tag: facility-design
- q: 可行性研究（feasibility study）中 SWOT 分析包含哪四個向度？
  a: 優勢（Strengths）、弱點（Weaknesses）、機會（Opportunities）、威脅（Threats）；目標是確保財務投資可產生可持續的回報，並分析競爭對手與成長潛力。
  tag: facility-design
- q: 總體規劃（master plan）應包含哪些內容？
  a: 建築與建造計畫、設施設計、預算資訊、運營計畫（含短期與長期目標、員工發展及岐用流程）。
  tag: facility-design
- q: 設計期（design phase）的重點為何？
  a: 委員會想法結合，產出設施藍圖；考慮設施動線、遵守城市法規；設備規格影響平面配置；矮設備與啞鈴架置於中央以利監督視線。
  tag: facility-design
- q: 建造期（construction phase）的主要任務是什麼？
  a: 持續參照總體規劃確保進度符合目標；監控進度與截止期限；建造方若未按時完工可能面臨訴訟賠償。
  tag: facility-design
- q: 前營運期（preoperation phase）最重要的準備工作有哪些？
  a: 完成內部裝潢（美觀設計可提升使用者體驗）；聘用具備資格的員工（如 CSCS）；制定清潔與維護排程；建立行政管理流程（責任分工、排程、預算）。
  tag: facility-design
- q: 評估運動計畫需求時，应回答哪六個關鍵問題？
  a: '1. 使用人數？

    2. 訓練目標？

    3. 運動員人口統計（年齡、性別、組別）？

    4. 訓練經驗？

    5. 排程方式？

    6. 哪些設備需要修護或升級？'
  tag: needs-assessment
- q: 每位運動員的最低建議空間為多少？
  a: 每位運動員至少 100 平方英尺（9.3 m²）；空間不足對訓練環境和排程的影響大於缺乏特定設備。
  tag: needs-assessment
- q: 訓練設施的位置應如何選擇？
  a: 理想位置於一樓，遠離辦公室和教室以防噪音穿透。若非一樓，地板承載能力至少需為 100 磅/平方英尺（488 kg/m²）。
  tag: facility-features
- q: 監督站設置的原則為何？
  a: 應位於中央位置，具備清楚的全場視線及鏡子輔助視角；辦公室可高於地板設置，以獲得更佳的俯瞰角度。
  tag: facility-features
- q: 天花板高度的建議標準為何？
  a: 建議高度為 12–14 英尺（3.66–4.27 m），以確保運動員進行跳躍、箱跳及舉重動作時有足夠的淨空高度。
  tag: facility-features
- q: 訓練設施常見的地板類型有哪些，各有何用途？
  a: 橡膠地板（捲式、磚式、灌注面）——最常見，防真菌生長；室內草皮（indoor turf）——適合增強式、敏捷度、體能訓練和雪橇推；舉重平台中央木質部分——防滑且安全。
  tag: facility-features
- q: 舉重平台的地板設計標準為何？
  a: 平台中心部分應為木質（防止鞋子滑動，提供安全的舉重表面），外側區域為橡膠材質（緩衝放下槓鈴的衝擊）。
  tag: facility-features
- q: 訓練設施的照明標準為何？
  a: 應同時提供人工光與自然光，照度為 50–100 流明（lumens）（視天花板高度與自然光量而定）；窗戶增加自然光，鏡子可將光線反射至光線不足的角落。
  tag: environmental-factors
- q: 訓練設施的建議溫度範圍為何？
  a: 大多數資料建議 68–78 °F（20–25 °C），最佳操作溫度範圍為 72–78 °F（22–25 °C）；HVAC 系統應能分區控溫。
  tag: environmental-factors
- q: 訓練設施的相對濕度標準為何？為什麼重要？
  a: 有身體活動的空間相對濕度不應超過 60%，以防止細菌和微生物生長，避免感染和疾病傳播。
  tag: environmental-factors
- q: 設施的空氣流通標準為何？
  a: 空氣應每小時交換 8–12 次，防止因停滯空氣產生異味；風扇配置建議：每 1,200 平方英尺（111.5 m²）配置 2–4 台風扇。
  tag: environmental-factors
- q: 訓練設施音響系統的標準為何？
  a: 音量應低於 90 分貝，以確保運動員聽得到指導語音；揚聲器應抬高並置於角落，將聲音投射向房間中央使分布均勻。
  tag: environmental-factors
- q: 訓練設施電氣設備的特殊要求為何？
  a: 需要提供比一般建築更多的插座；部分插座需較高電壓（階梯機、橢圓機、跑步機）；需正確接地以防雷擊或突波；需安裝漏電斷路器（GFI）保護運動員安全。
  tag: environmental-factors
- q: 鏡子安裝的標準為何？
  a: 鏡子底部至少離地面 20 英寸（51 cm）以上；至少距設備 6 英寸（15 cm）；標準槓片直徑 18 英寸（46 cm），鏡子高度預留 2 英寸安全間隙。
  tag: facility-features
- q: 訓練設施的無障礙推動指引方針為何？
  a: 為身障人士提供坡道或機械升降機；坡道比例：每上升 1 英尺防距需 12 英尺（30.5 cm）；雙門設計以便大型設備携入。
  tag: facility-features
- q: 訓練設備分組配置的原則為何？
  a: 分區：搖身/熱身區、敏捷度/增強式區、自由重量區、有氧區、機械區。自由重量和架子沿牆排列；中間設置通道以利流通。
  tag: equipment-placement
- q: 設備之間的通道寬度應至少多寬？
  a: 主要通道至少 36 英寸（91 cm）寬；機械訓練區的輔助通道建議 4–7 英尺（1.2–2.1 m）。
  tag: equipment-placement
- q: 槓鈴與啞鈴端之間的最小間距為何？
  a: 不同槓鈴或啞鈴的端部之間至少需保留 36 英寸（91 cm）；架子末端到周邊設備距離也至少 36 英寸；若需要保護員站立協助，應預留更寬的空間。
  tag: equipment-placement
- q: 擇舉區平台間应保持多少距離？
  a: 架子和平台間距至少 3–4 英尺（0.9–1.2 m），防止倒下時傷及附近人員；架子应鎖拴到地面。
  tag: equipment-placement
- q: 有氧訓練設備的空間需求為何？
  a: 跑步機：45 ft²（4.2 m²）；划船機：40 ft²（3.7 m²）；腳踏車／階梯機：24 ft²（2.2 m²）；滑雪機：6 ft²（0.6 m²）。
  tag: equipment-placement
- q: 設備清潔與維護最重要的原則為何？
  a: 定期清潔確保設備安全可用；清潔材料的成本遠低於更換護墊、地板等的費用；若不定期清潔，微生物將開始生長。設備清潔頻率應依使用頻率決定。
  tag: maintenance
- q: 清潔劑需符合哪些要求？
  a: 清潔劑必須具備防止 HIV 和肝炎傳播的能力；接觸皮膚的設備（護墊、訓練凳）應每日或隔日清潔一次。
  tag: maintenance
- q: 訓練設施清潔計畫的建議頻率為何？
  a: 每日：地板、護墊面、接觸皮膚的設備表面、鏡子、窗戶。每週：牆面、天花板燈具除塵。每週 2–3 次：潤滑有氧機器和選負荷導桿。
  tag: maintenance
- q: 舉重平台木質部分需哪些維護？
  a: 檢查是否有裂縫或碎裂；用適當清潔劑去除灰塵與髒污，防止腳部滑動。橡膠地板應檢查縫間間隙是否有黏膠外漏。
  tag: maintenance
- q: 機器線纜和滑輪的維護要求為何？
  a: 定期檢查線纜和滑輪是否鬆弛或磨損；功能異常的設備應標示「停用（Out of Order）」並移至儲存區；每週 2–3 次清潔有氧機器及導桿。
  tag: maintenance
- q: NSCA 安全檢查表的用途為何？
  a: 確定設施設備的維護需求；覆蓋地板、牆面、天花板、搖身區、阻力訓練區、擇舉區、有氣區等全面維護驗查；同時包含設施布局安全議題。
  tag: maintenance
- q: 訓練設施設備空間計算方式：槓鈴課堂訓練（如深蹲）需要多少空間？
  a: 公式：（杆長 + 6 ft 安全空間）×（10 ft 使用寬度）。例：7 ft 奧林匹克槓 = （7+6）× 10 = 130 ft²。舉重平台：（8+4）×（8+4）= 144 ft²。
  tag: equipment-placement
- q: 設備配置時，高型與矮型設備的位置原則為何？
  a: 矮型設備（啞鈴架、槓鈴架）置於中央，便於教練或訓練師總覽全場；高型設備螺栓固定於牆邊，建議置於無窗戶或鏡子的牆邊。
  tag: equipment-placement
- q: 機械訓練區的機器間距標準為何？
  a: 機器之間至少 24 英寸（61 cm），建議 36 英寸（91 cm）；輔助通道 4–7 英尺（1.2–2.1 m）寬；受傷運動員從機器區移動時應確保通行方便。
  tag: equipment-placement
- q: 伸展與熱身區的最少空間要求為何？
  a: 至少 49 平方英尺（4.6 m²）的開放空間，以便運動員進行動態熱身，且允許多人同時使用；區域內可配置泡棉滾筒、彈力帶、PVC 管、網球與壘球等軟組織工具。
  tag: equipment-placement
- q: 清潔劑應具備哪些要求？
  a: 必須能防止 HIV 和肝炎傳播；接觸皮膚的設備（護墊、訓練凳）應每日或隔日清潔一次。
  tag: maintenance
- q: 新訓練設施的設計委員會應包含哪些成員？
  a: 承包商、建築師、設計師、法律專業人員，以及未來使用者（教練、訓練師、S&C 專業人員）；委員會也需討論經濟面向；建議選擇有訓練設施設計經驗的建築師。
  tag: facility-design
- q: 修改現有訓練設施與新建設施有何不同？
  a: 修改現有設施不需建造階段，但仍需需求評估、計畫調整；工作人員可能繼續工作；仍需注重標準、教育、專業主義和員工發展。
  tag: facility-design
- q: 運動員人口統計如何影響訓練設施設計？
  a: 同時使用人數和每日總使用人數影響場地大小；若多組同時訓練應將設施分區；訓練排程應讓運動員分散到達，避免人潮集中湧入。
  tag: needs-assessment
- q: 非一樓地板承載能力標準為何？
  a: 訓練設施不位於一樓時，地板承載能力至少需為 100 磅/平方英尺（488 kg/m²）以支撐重型設備。
  tag: facility-features
- q: 有氧訓練區的電氣設備配置要求為何？
  a: 需用電的機器應靠牆放置，除非地面或地板有電插座；設備應遠離通道，降低被電線絆倒的風險。
  tag: equipment-placement
- q: 訓練設施中，運動員人口統計（年齡、性別、組別）如何影響設備選擇？
  a: 較年長人口為主的設施可能不需大量自由重量設備，機器訓練比例較高；團隊／學院環境中分區配置可允許多組同時訓練。
  tag: needs-assessment
- q: 訓練設施中，使用者的訓練經驗程度如何影響設備選擇？
  a: 初學者比例較高時，自體重動作和機器訓練需求較大；進階運動員更傾向自由重量；需考慮訓練需求是否隨賽季變化。
  tag: needs-assessment
- q: 訓練設施中，飲水機的配置原則為何？
  a: 應遠離訓練區且不干擾交通動線；通常置於設施入口旁或洗手間／更衣室旁邊；應每日清潔消毒。
  tag: facility-features
- q: 訓練設施的儲存室需求為何？
  a: 需要空間存放額外設備、清潔用品、工具、護具等設備；設施越大儲存室需求越大；清潔用品應上鎖保管、工具應收納並定期盤點。
  tag: facility-features
- q: 訓練設施員工資格的最低要求為何？
  a: 員工至少需具備相應資格（如 CSCS）；美國大學體育協會（NCAA）現正執行立法，要求體能訓練專業人員持有 CSCS 認證。
  tag: facility-design
- q: 訓練設施牆面等表面的清潔頻率為何？
  a: 牆面清潔每週 2–3 次（或更多）；高活動區域牆面應特別注意（飲水機旁、門道附近）。窗戶和鏡子應定期清潔。
  tag: maintenance
- q: 臥推等俯仰臥動作（prone/supine exercises）的空間計算方式為何？
  a: 公式：（訓練凳實際長度 + 3 ft 安全緩衝）×（凳寬使用空間 7 ft + 3 ft 安全緩衝）。例：6 ft 長臥推凳 = （6+3）×（7+3）= 90 ft²。
  tag: equipment-placement
- q: 站立動作（如彎舉）的空間公式為何？
  a: 公式：（實際槓鈴長度 + 6 ft 安全空間）×（使用寬度 4 ft）。例：4 ft 彎舉槓 = （4+6）× 4 = 40 ft²。
  tag: equipment-placement
- q: 肌力訓練設施的交通流動計畫如何促進訓練安全？
  a: 設備排列形成自然通道，架子和機器沿長邊排成行建立 2–3 條主要通道；低矮設備置於中心方便監督；高型設備螺栓固定於牆邊以防傾倒；清楚的視線有助提高安全性。
  tag: equipment-placement
