- id: layout
  title: 設備配置區域 Layout
  desc: ''
  tag: Layout
  items:
  - id: ch23.layout.i01
    q: 伸展與暖身區應提供哪些器材與空間？
    a:
    - 這是一個配置軟組織工具、墊子或彈力帶的開放區域。
    - 可包括泡棉滾筒、彈力帶、PVC 管、網球、高爾夫球、壘球，以及可能的跳繩。
    - 可使用墊子，讓運動員不必躺在硬地板上，但書中指出墊子不是必要條件。
    detail: 此區的用途是讓運動員進行動態暖身；空間數值與多人同時使用的考量另見本章空間標準。
    terms:
    - resistance-bands
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i01
    - ch14.ramp-protocol.i02
    locator: Arranging Equipment in the Strength and Conditioning Facility > Stretching and Warm-Up Area
  - id: ch23.layout.i02
    q: 循環訓練區（circuit training area）應如何配置？
    a:
    - 將器械排成或分成可讓使用者容易從一台換到下一台的組合。
    - 可按上、下肢、推拉動作或不同身體部位分組。
    - 許多設施讓受傷運動員用循環器械訓練仍健康的部位，因此要保留器械間易於移動的通路。
    detail: 此區的「容易切換」同時服務一般循環安排與受傷運動員的可近性；器械與走道間距另見本章空間標準。
    terms:
    - circuit-training
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i04
    - ch23.key-numbers.i05
    - ch17.exercise-order.i06
    - ch22.sports-medicine-team.i04
    locator: Arranging Equipment in the Strength and Conditioning Facility > Circuit Training Area
  - id: ch23.layout.i03
    q: 自由重量區應如何安排器材？
    a:
    - 自由重量器材包括啞鈴、槓鈴、臥椅、壺鈴、農夫走把手、六角槓、深蹲架及使用這些器材所需的其他設備。
    - 架與啞鈴宜沿牆排列，並保留牆面與重量器材間的步行空間。
    - 壺鈴可放在啞鈴架下方或獨立分區；因壺鈴活動常具動態性且占用較多空間，該區應較大。
    detail: 書中指出沿牆配置還可增加清潔空間，並降低重量撞到牆面或鏡子的機會；相關間距另見本章空間標準。
    terms:
    - kettlebell-training
    - farmers-walk
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i04
    - ch16.kettlebell-unilateral.i01
    - ch15.spotting-when.i01
    locator: Arranging Equipment in the Strength and Conditioning Facility > Free Weights
  - id: ch23.layout.i04
    q: 重量訓練區應如何安排架、平台與收納？
    a:
    - 重量訓練區通常有附平台的架、獨立平台，或不用平台的開放舉重區；後者通常是在混凝土基礎上的橡膠地板進行。
    - 器材未使用時，可用重量樹、架與槓鈴架收納。
    - 架應固定於地面；可移動的架在不用時應移至指定儲藏區。
    detail: 架與平台的間距是為了避免跌倒時傷及附近的人，詳見本章空間標準；固定式與可移動式架的收納要求不同。
    terms:
    - weightlifting-platform
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i06
    - ch15.power-exercises-technique.i04
    - ch24.facility.i03
    locator: Arranging Equipment in the Strength and Conditioning Facility > Weightlifting Area
  - id: ch23.layout.i05
    q: 有氧區應如何配置器材與電源？
    a:
    - 心肺訓練器材應獨立分區，將跑步機、橢圓機、階梯機與腳踏車等整齊分組。
    - 需要電力的器材通常必須靠牆，除非地面或柱子有插座。
    - 器材應遠離走道，以降低被器材或其電線絆倒的機會。
    detail: 電源位置會直接限制有氧器材的擺放；「靠牆」不是絕對條件，地面或柱上插座是書中明列的例外。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.safety-electrical.i01
    - ch23.key-numbers.i05
    - ch20.program-design.i01
    locator: Arranging Equipment in the Strength and Conditioning Facility > Equipment Placement；Arranging Equipment in the Strength and Conditioning Facility > Aerobic Area
  - id: ch23.layout.i06
    q: 有氧器材的配置空間數值應如何使用？
    a:
    - 表 23.1 依器材種類列出每台腳踏車、階梯踏步機、滑雪機、划船機與跑步機所需的地板空間。
    - 這些空間要求除了配置器材，也用來保留移動空間並避免跌入器材造成意外。
    - 各器材的面積數值另見本章空間標準。
    detail: 表 23.1 的數值是每件有氧器材的空間要求，不是整個有氧區或每位使用者的總面積。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i01
    - ch13.aerobic-capacity.i08
    locator: Arranging Equipment in the Strength and Conditioning Facility > Aerobic Area > Table 23.1 Aerobic Equipment Space Requirements
  - id: ch23.layout.i07
    q: 設備分組與固定的基本原則是什麼？
    a:
    - 器材應分為伸展與暖身、敏捷與增強式、自由重量、有氧與阻力器械等區域。
    - 自由重量與架宜沿牆配置並在自由重量與器械間設走道；器械可排在重量室中央，使房間兩側各有走道。
    - 高器材應固定於地面、柱子或牆面，避免傾倒。
    detail: 先分區再規劃器材排列，讓設備可被組成循環使用並改善動線；高器材固定是防傾倒的安全要求。
    terms:
    - plyometric-exercise
    numbers: []
    concepts:
    - safety
    related:
    - ch23.design-elements.i08
    - ch23.layout.i02
    - ch24.facility.i03
    locator: Arranging Equipment in the Strength and Conditioning Facility > Equipment Placement
  - id: ch23.layout.i08
    q: 整體設備配置如何形成安全且有效率的動線？
    a:
    - 多數設施是一個大房間，可透過器材排列形成走道；架與器械常沿設施長度排成一列。
    - 低矮器材放在中央可讓教練或訓練師看過整個設施，高器材則宜沿牆固定。
    - 選擇器材位置時，安全與功能是最優先的考量；走道寬度數值另見本章空間標準。
    detail: 書中將設備排列視為創造走道的手段，而非先有既定走道再把器材塞入剩餘空間。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i05
    - ch24.supervision.i06
    - ch17.exercise-order.i06
    locator: Arranging Equipment in the Strength and Conditioning Facility > Traffic Flow
- id: maintenance
  title: 維護與清潔 Maintenance
  desc: ''
  tag: Maintenance
  items:
  - id: ch23.maintenance.i01
    q: 清潔設施表面與器材的頻率原則是什麼？
    a:
    - 應持續清潔表面，以確保器材安全且可正常使用；未以殺菌清潔劑（germicidal cleaner）擦拭時，微生物會開始生長。
    - 使用頻率較高、較可能滋生細菌的器材，例如護墊與乙烯基，應每天或隔天清潔。
    - 設施使用的殺菌清潔劑應能防止 HIV 與肝炎傳播。
    detail: 清潔頻率的判準不是所有器材一律相同，而是優先處理使用頻率高且較易有細菌生長的表面。
    terms:
    - germicidal-cleaner
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.maintenance.i05
    - ch24.facility.i03
    locator: Maintaining and Cleaning Surfaces and Equipment
  - id: ch23.maintenance.i02
    q: 各種地板與固定器材應如何維護？
    a:
    - 非吸收性地板應定期拖除灰塵與髒污；木製舉重平台要檢查碎裂與裂縫，並用適當清潔劑去除會造成腳部滑動的灰塵與髒污。
    - 清潔架與器械周圍時，也應定期檢查或鎖緊固定於地面的螺栓與螺絲。
    - 磚式或捲材橡膠地板的拼接處應只有極小縫隙且無可見膠水外溢；地毯要定期吸塵與清潔，以防黴菌、霉菌或真菌生長。
    detail: 地板維護同時處理行走安全、固定器材與微生物問題；木質平台特別連到足部滑動風險。
    terms:
    - weightlifting-platform
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.design-elements.i05
    - ch23.maintenance.i06
    locator: Maintaining and Cleaning Surfaces and Equipment
  - id: ch23.maintenance.i03
    q: 牆面、天花板、窗戶與鏡子應如何清潔檢查？
    a:
    - 牆面與天花板至少每一至兩週清潔一次，清除髒污、角落灰塵與牆頂交界的蜘蛛網。
    - 窗戶與鏡子要定期檢查裂痕，發現裂痕即更換；可用玻璃清潔劑與超細纖維毛巾清潔至無條痕。
    - 窗台、架子與天花板懸掛物要定期除塵；若天花板吊有運動器材，必須檢查其固定牢靠、不會掉落。
    detail: 這一段的「每一至兩週」來自正文；圖 23.6 對牆面另列每週兩到三次或視需要，屬於安全檢查表的較細排程。
    terms: []
    numbers:
    - v: 1–2
      unit: 週
      of: 正文建議牆面與天花板至少清潔一次的間隔
    concepts:
    - safety
    - professional
    related:
    - ch23.maintenance.i05
    - ch23.maintenance.i06
    locator: Maintaining and Cleaning Surfaces and Equipment
  - id: ch23.maintenance.i04
    q: 如何處理故障或磨損的訓練器材？
    a:
    - 應定期檢查破損或受損零件，尤其是影響功能的部分；纜線與滑輪鬆脫或磨損時應維修。
    - 使用頻繁卻未充分清潔的器材可能累積殘留物，造成功能或衛生問題。
    - 無法使用的器材應標示「停止使用」（Out of Order）；若修理需要一段時間，應移離訓練場地並放入儲藏區。
    detail: 原文把「標示」與「移離場地」分開：暫時不能用的器材需要可見警示；修理時間長時再移至儲藏區。
    terms:
    - out-of-order
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.needs-analysis.i06
    - ch24.facility.i03
    locator: Maintaining and Cleaning Surfaces and Equipment
  - id: ch23.maintenance.i05
    q: NSCA 安全檢查表建議如何安排清潔與維護頻率？
    a:
    - 每日檢查與清潔地板、護墊、飲水機、接觸皮膚的器材表面、鏡子與窗戶，並檢查器材、保護墊、止滑材料及固定連結。
    - 每週兩到三次清潔與潤滑有氧器材及選擇式阻力訓練器材的導桿。
    - 每週清潔天花板固定物與天花板磚；依需要更換燈泡、清潔牆面與開放式天花板、處理故障器材、補粉筆、清潔槓鈴滾花與除鏽。
    detail: 本項是圖 23.6 的明列排程；「依需要」項目不能擅自改成固定頻率。
    terms:
    - nsca-safety-checklist
    numbers:
    - v: 2–3
      unit: 次/週
      of: 有氧器材及選擇式阻力訓練器材導桿的清潔與潤滑頻率
    concepts:
    - safety
    - professional
    related:
    - ch23.maintenance.i01
    - ch24.facility.i03
    locator: Maintaining and Cleaning Surfaces and Equipment > Figure 23.6 NSCA’s Safety Checklist for Exercise Facility and Equipment Maintenance
  - id: ch23.maintenance.i06
    q: NSCA 設施與器材安全檢查表涵蓋哪些範圍？
    a:
    - 檢查表涵蓋設施地板、牆面、天花板，以及伸展與自體重運動、阻力器械、自由重量、舉重與有氧運動等區域。
    - 各區項目包括地面、固定、損壞、清潔、潤滑、器材收納與安全通行等；也列出清潔與維護任務的頻率。
    - 其用途是協助判定器材維護需求，並作為清潔排程與設施安全布局的參考。
    detail: 這是轉出的完整文字檢查表，而不只是圖說，因此可作為本章內容；清單同時涵蓋場地布局安全，不只器材保養。
    terms:
    - nsca-safety-checklist
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.maintenance.i05
    - ch24.facility.i03
    locator: Maintaining and Cleaning Surfaces and Equipment > Figure 23.6 NSCA’s Safety Checklist for Exercise Facility and Equipment Maintenance
  - id: ch23.maintenance.i07
    q: 清潔與維護材料應如何存放管理？
    a:
    - 清潔與維護材料應放在儲藏區或壁櫥；若可行，應上鎖並只在需要時使用。
    - 工具應放在工具箱並收好，避免留在重量訓練室視線內。
    - 工具與清潔材料要定期盤點及補充；表 23.3 列出維修工具與清潔用品的例子。
    detail: 收納的目的不只是整齊：書中明確要求工具離開重量訓練室視線，並把上鎖表述為「若可行」。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.safety-electrical.i05
    - ch24.facility.i05
    locator: Maintaining and Cleaning Surfaces and Equipment > Table 23.3 Equipment and Supplies for Maintenance and Cleaning
  - id: ch23.maintenance.i08
    q: 為什麼定期清潔與維護是設施管理的一部分？
    a:
    - 清潔材料比更換護墊、地板等成本低，妥善維護可長期節省費用。
    - 經常安排維護與清潔可確保訓練安全、保護投資並維持設施外觀。
    - 總結段落強調，應最重視使用最頻繁的器材，以延長設施壽命並降低感染傳播風險。
    detail: 原文把成本、訓練安全、衛生與外觀並列；這不是只為了讓設施看起來整潔的工作。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.maintenance.i01
    - ch24.facility.i03
    locator: Maintaining and Cleaning Surfaces and Equipment；Conclusion
- id: needs-analysis
  title: 運動需求評估 Needs Analysis
  desc: ''
  tag: Needs Analysis
  items:
  - id: ch23.needs-analysis.i01
    q: 需求分析時，為什麼要先確認有多少運動員使用設施？
    a:
    - 同時使用的人數及每日、每週、每季的總使用人數會大幅影響設施大小。
    - 若兩組以上同時訓練，人數也會影響排程與動線。
    - 城市規劃部門依消防或職業健康安全等規範，會規定同一時間可使用設施的人數。
    detail: 本項不只是在計算總人數；書中特別區分同時使用者與不同期間的總使用量，前者直接影響同時訓練時的排程和動線。
    terms:
    - needs-analysis
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch23.key-numbers.i01
    - ch23.needs-analysis.i05
    - ch24.supervision.i01
    locator: Assessing Athletic Program Needs
  - id: ch23.needs-analysis.i02
    q: 運動員、教練與行政人員的訓練目標如何影響器材選擇？
    a:
    - 教練或運動員的訓練目標會影響設施應選擇的器材；肌力與體能專業人員也應依自身理念作為訂購器材的指引。
    - 若教練重視增強式與敏捷，設施需要保留草皮或場地區域；若安排阻力訓練，舉重架與平台比只供單一用途的平板或上斜臥推設置更省空間。
    detail: 原文的重點是讓設施設計配合實際課表；它以架與平台的空間效率，對比只能做單一用途的臥推設置。
    terms:
    - needs-analysis
    - plyometric-exercise
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch17.needs-analysis.i01
    - ch18.program-design.i01
    - ch23.design-elements.i05
    locator: Assessing Athletic Program Needs
  - id: ch23.needs-analysis.i03
    q: 運動員的人口特性如何影響設施的器材需求？
    a:
    - 使用者主要是年長或年輕、男性或女性、高中、大學或職業運動員等人口特性，都會影響器材需求。
    - 以年長者為主的設施，可能不需要大量自由重量器材，而更需要器械。
    - 在大學或團隊環境，把器材分區可讓多組同時訓練且互不干擾。
    detail: 教材將年齡、性別與運動層級列為要問的使用者特性；對年長者的器材比例採「可能」而非絕對規定。
    terms:
    - needs-analysis
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch07.older-adults-training.i06
    - ch23.layout.i07
    locator: Assessing Athletic Program Needs
  - id: ch23.needs-analysis.i04
    q: 運動員的訓練經驗如何影響設施與課表需求？
    a:
    - 對訓練經驗的回答有助於肌力與體能專業人員制定訓練計畫，進而決定所需器材。
    - 沒有舉重經驗的運動員可能做較多自體重動作；進階運動員可能做較多舉重動作。
    - 應評估需求會否隨時間與賽季改變；例如高中或大學每學年開始時，可能有缺乏舉重經驗的新運動員進入設施。
    detail: 書中以訓練經驗連結「訓練計畫」再連到「器材」，不是直接把初學者或進階者限定為單一訓練方式。
    terms:
    - training-background
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch17.needs-analysis.i04
    - ch07.program-design-populations.i01
    locator: Assessing Athletic Program Needs
  - id: ch23.needs-analysis.i05
    q: 運動員排程會如何影響設施的設計與運作？
    a:
    - 排程是設施營運中較困難的面向之一；人員數、平面配置與設施設計都可能受它影響。
    - 若多組可能同時進入設施，應把設施分區，以限制彼此重疊。
    - 運動員應分散於全天到達，避免同時湧入，藉此維持建議的人員與運動員比率並確保器材足夠。
    detail: 本章把排程問題直接指向第 24 章；這裡提出的是分散到達與分區的設計方向，沒有自行指定人員比率數值。
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch24.facility.i04
    - ch24.supervision.i01
    - ch23.layout.i08
    locator: Assessing Athletic Program Needs
  - id: ch23.needs-analysis.i06
    q: 需求分析時應如何處理需要修理或修改的器材？
    a:
    - 設施中不應有破洞、切口或缺件等問題；若纜線磨損或損壞，應停止使用纜線柱，直到更換纜線。
    - 所有破損器材都應修理或更換；既有器材應定期清潔、及時修理，或出售以取得新器材資金。
    - 有些器材本身狀況良好但需要附件升級，例如纜線柱需加裝新附件才能完整使用。
    detail: 書中區分「故障」與「需要升級」：前者要修理或更換，後者可能只需新增附件即可恢復完整功能。
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch23.maintenance.i04
    - ch24.facility.i03
    locator: Assessing Athletic Program Needs
  - id: ch23.needs-analysis.i07
    q: 預算與空間受限時，設施設計應如何排定優先順序？
    a:
    - 理想上設施設計者應能為每個問題找到解方，但實際上常受預算與空間限制。
    - 應先聚焦對設施影響最大的事項；書中指出，空間不足對訓練環境與排程的影響，大於缺少一件專門器材。
    - 每位參與者的建議最低面積另見本章空間標準。
    detail: 這不是要求完全不採購專門器材，而是在資源受限時，把空間與排程視為比單一專門器材更優先的限制。
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch23.key-numbers.i01
    - ch23.needs-analysis.i01
    - ch24.administration.i03
    locator: Assessing Athletic Program Needs
  - id: ch23.needs-analysis.i08
    q: 改造既有設施時，應依什麼基準評估現有器材？
    a:
    - 肌力與體能專業人員應依所有使用設施的運動員與隊伍需求評估既有器材。
    - 評估結果要回到器材是否仍符合使用者與團隊的需求，而不只是器材是否仍在運作。
    - 個別損壞、維修與升級的處置另見本章需求分析的器材維修項目。
    detail: 這段出自既有設施改造的段落，主詞是肌力與體能專業人員，評估範圍是「所有」使用該設施的運動員與隊伍。
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    - program-design
    related:
    - ch23.four-phases.i08
    - ch23.needs-analysis.i06
    - ch24.facility.i03
    locator: Existing Strength and Conditioning Facilities
- id: safety-electrical
  title: 電力、安全與其他規範 Safety & Electrical
  desc: ''
  tag: Safety
  items:
  - id: ch23.safety-electrical.i01
    q: 為什麼肌力與體能設施需要特別規劃電力服務？
    a:
    - 設施通常比其他建築需要更多插座。
    - 階梯攀爬機、橢圓機與跑步機等較強力器材，有些插座可能需要較高電壓。
    - 電力服務必須正確接地，以保護系統免於雷擊或電力突波。
    detail: 電力需求與器材配置相連：需要電力的器材若沒有地面或柱上插座，通常會被限制在牆邊。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.layout.i05
    - ch24.facility.i03
    locator: Designing the Strength and Conditioning Facility > Electrical Service
  - id: ch23.safety-electrical.i02
    q: 接地故障電路（ground-fault circuit）有何安全用途？
    a:
    - 接地故障電路是電力服務的必要安全措施。
    - 在發生電路短路時，它用以確保運動員的安全。
    detail: 教材在此只說明接地故障電路對「電路短路」情境的安全必要性，沒有說所有設備區都必須設置。
    terms:
    - ground-fault-circuit
    numbers: []
    concepts:
    - safety
    related:
    - ch23.safety-electrical.i01
    - ch24.emergency.i06
    locator: Designing the Strength and Conditioning Facility > Electrical Service
  - id: ch23.safety-electrical.i03
    q: 為什麼設施至少需要一支輪椅使用者可及的電話？
    a:
    - 至少一支電話應讓輪椅使用者可及，以符合《美國身心障礙者法案》（Americans with Disabilities Act, ADA）。
    - 若唯一能協助的人是輪椅使用者，這支電話可在緊急情況下提供求助能力。
    - 理想上電話設在設施前方的辦公室內或外，使督導者在事故後能盡快聯絡緊急服務。
    detail: 這是本章明確提到 ADA 的地方；它同時是無障礙要求與事故後緊急通訊的安排。
    terms:
    - americans-with-disabilities-act
    numbers: []
    concepts:
    - safety
    related:
    - ch23.design-elements.i07
    - ch24.emergency.i05
    locator: Designing the Strength and Conditioning Facility > Other Considerations
  - id: ch23.safety-electrical.i04
    q: 防撞軌（bumper rails）或護墊可用在何處？
    a:
    - 可設於需要保護的地方，例如鏡子或石膏板牆面。
    - 防撞軌可預防人或物品跌落、碰撞造成的損壞。
    - 也可用在舞蹈或瑜珈教室，讓使用者需要時握住以維持平衡。
    detail: 在舞蹈或瑜珈空間，防撞軌另具平衡支撐用途；本章沒有把它稱作一般重量訓練區的扶手規範。
    terms:
    - bumper-rail
    numbers: []
    concepts:
    - safety
    related:
    - ch23.design-elements.i07
    - ch24.facility.i05
    locator: Designing the Strength and Conditioning Facility > Other Considerations
  - id: ch23.safety-electrical.i05
    q: 設施為什麼需要儲藏空間？
    a:
    - 應有空間存放額外器材、清潔用品、工具與故障器材。
    - 器材較多的大型設施，所需儲藏室也比小型設施大。
    - 書中指出，儲藏室最大的空間很可能由未使用的器材占據。
    detail: 儲藏室容量應隨器材量調整；教材特別提醒未使用器材往往是主要的空間占用者。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.maintenance.i07
    - ch24.facility.i03
    locator: Designing the Strength and Conditioning Facility > Other Considerations
  - id: ch23.safety-electrical.i06
    q: 教材如何描述 NCAA 對肌力與體能專業人員資格的要求？
    a:
    - 前營運期應聘用至少具備最低必要認證與教育的人員。
    - 教材寫道，國家大學體育協會（National Collegiate Athletic Association, NCAA）當時正執行要求肌力與體能專業人員成為肌力與體能認證專家（Certified Strength and Conditioning Specialist, CSCS）的立法。
    detail: 「當時正執行」反映教材原文的時間語氣，不能把它改寫成對現行 NCAA 規定的未經查證斷言。
    terms:
    - national-collegiate-athletic-association
    - certified-strength-and-conditioning-specialist
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.four-phases.i04
    - ch24.personnel.i02
    - ch24.personnel.i03
    locator: General Aspects of New Facility Design > Preoperation Phase
  - id: ch23.safety-electrical.i07
    q: 飲水機應設在何處？
    a:
    - 飲水機應遠離訓練區，且不應中斷動線。
    - 常設在設施入口旁，或盥洗室與置物櫃旁。
    detail: 設置位置的判準是補水便利與動線不受阻；每日清潔消毒則列在圖 23.6 的維護排程中。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.maintenance.i05
    - ch23.design-elements.i07
    locator: Designing the Strength and Conditioning Facility > Other Considerations
  - id: ch23.safety-electrical.i08
    q: 更衣室與淋浴在設施中可提供什麼價值？
    a:
    - 更衣室可成為設施的良好附加設施；至少在建築物某處有淋浴，可讓訓練後清潔更方便。
    - 良好衛生有助於預防感染與疾病傳播。
    - 雖然不是每個人都會使用淋浴或置物櫃，但書中指出，對行程緊湊的運動員而言，這些設備可能提升士氣並促使其投入訓練。
    detail: 教材稱更衣室為「良好附加設施」，並非要求每一座設施都必須有完整更衣室；它對淋浴的最低描述是建築物某處有淋浴。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.design-elements.i07
    - ch24.facility.i05
    locator: Designing the Strength and Conditioning Facility > Other Considerations
cards:
- q: 新訓練設施設計的四個階段依序為何？
  a: 前設計期、設計期、施工期、前營運期。
  tag: facility-design
- q: 前設計期（predesign phase）包含哪些核心工作？
  a: 需求分析、可行性研究、形成主計畫，並在期末聘請建築師開始製作基本藍圖。
  tag: facility-design
- q: 可行性研究中的 SWOT 分析包括哪四項？
  a: 優勢、弱點、機會與威脅；可行性研究也檢視投資回報、位置、市場、競爭與成長潛力。
  tag: facility-design
- q: 主計畫（master plan）應包含哪些內容？
  a: 建築與施工計畫、設施設計、預算，以及完工後的營運計畫；營運計畫涵蓋短長期目標、人員發展與聘僱流程。
  tag: facility-design
- q: 設計期（design phase）的重點為何？
  a: 整合委員會構想、遵守相關法規、與建築師製作藍圖，並依器材規格規劃動線與督導視線。
  tag: facility-design
- q: 施工期（construction phase）應如何管理？
  a: 持續對照主計畫，確認目標與設計不偏離，並優先管理進度與期限；延誤可能造成賠償或訴訟。
  tag: facility-design
- q: 前營運期（preoperation phase）要完成哪些開館準備？
  a: 完成室內裝潢、聘用合格人員、建立人員發展與清潔維護排程，並安排保險、排程、預算及文書工作的行政分工。
  tag: facility-design
- q: 評估運動計畫需求時應回答哪六個問題？
  a: 使用人數、訓練目標、運動員人口特性、訓練經驗、排程方式，以及哪些器材需要修理或修改。
  tag: needs-assessment
- q: 每位參與者的最低建議空間為多少？
  a: 每位參與者建議至少 100 ft²（9.3 m²）；空間不足對訓練環境與排程的影響，大於少一件專門器材。
  tag: needs-assessment
- q: 肌力與體能設施的位置應如何選擇？
  a: 理想上設在一樓且遠離辦公室與教室；非一樓時，樓板必須穩定並足以支撐重型及可能落下的器材。
  tag: facility-features
- q: 督導站或辦公室的設置原則為何？
  a: 設在中央，具清楚全場視線並可利用鏡子；辦公室可設在重量訓練區地面以上以改善視野。
  tag: facility-features
- q: 天花板高度的建議標準為何？
  a: 建議為 12–14 ft（3.66–4.27 m），以容納跳躍、箱跳、垂直跳與奧林匹克舉重動作；安全檢查表的過頭動作最低淨高為 12 ft（3.7 m）。
  tag: facility-features
- q: 訓練設施的地板如何依活動選擇？
  a: 常見選項是橡膠地板與抗真菌地毯；室內草皮適合增強式、敏捷、體能、地面動作與雪橇推；平台中央木材可避免鞋子卡住或滑動。
  tag: facility-features
- q: 理想的舉重平台地板設計為何？
  a: 中央為木材、外側為橡膠；木材可避免鞋子卡住或滑動，提供安全的舉重表面。
  tag: facility-features
- q: 訓練設施的照明原則為何？
  a: 同時採用人工與自然光；照明建議為 50–100 lumens，且依天花板高度與自然光量調整。窗戶與鏡子可把光線帶到較暗的區域。
  tag: environmental-factors
- q: 訓練設施的建議溫度範圍為何？
  a: 多數來源建議 68–78 °F（20–25 °C），許多來源認為 72–78 °F（22–25 °C）最適合運作；HVAC 最好能分區控制。
  tag: environmental-factors
- q: 訓練設施的相對濕度為何不應超過 60%？
  a: 在有身體活動的空間，控制濕度可防止細菌與微生物生長，避免感染與疾病傳播。
  tag: environmental-factors
- q: 設施的空氣循環可如何維持？
  a: 可結合 HVAC、新鮮空氣交換系統及天花板或箱型風扇；空氣每小時交換 8–12 次可避免停滯空氣的異味，風扇一般為每 1,200 ft² 配置 2–4 台。
  tag: environmental-factors
- q: 訓練設施音響系統應如何安裝？
  a: 音量應低於 90 dB，讓運動員聽得見指令與提示；揚聲器宜抬高、置於角落並朝房間中央投射。
  tag: environmental-factors
- q: 訓練設施的電力服務有哪些特殊要求？
  a: 需要較多插座，階梯攀爬機、橢圓機與跑步機等有些需較高電壓；電力服務要正確接地，並設接地故障電路以應對短路安全。
  tag: environmental-factors
- q: 鏡子安裝的安全標準為何？
  a: 鏡子離任何器材至少 6 in（15 cm）、離地至少 20 in（51 cm）。標準槓片直徑 18 in（46 cm），可在鏡子下保留 2 in（5 cm）淨空。
  tag: facility-features
- q: 訓練設施無障礙進出的指引為何？
  a: 高度改變超過 0.5 in（13 mm）時設坡道或輪椅升降設備；坡道每上升 1 in，應有 12 in 的水平長度。重量訓練室宜有雙門搬運大型器材。
  tag: facility-features
- q: 訓練設備分組配置的原則為何？
  a: 可分為伸展暖身、敏捷與增強式、自由重量、有氧及阻力器械區；自由重量與架宜沿牆，並在自由重量和器械間留出走道。
  tag: equipment-placement
- q: 設施主走道與循環訓練區走道各要多寬？
  a: 主走道至少 36 in（91 cm）；循環訓練區指定走道為 4–7 ft（1.2–2.1 m）。
  tag: equipment-placement
- q: 自由重量器材間應保留多少間距？
  a: 槓鈴與啞鈴和其他同類器材間至少 36 in（91 cm）；架的四周也至少留 36 in（91 cm），若需保護者則預留更大空間。
  tag: equipment-placement
- q: 重量訓練區的架與平台應相距多少？
  a: 架與平台相距 3–4 ft（0.9–1.2 m），避免跌倒時傷及附近人員；架應固定在地面，可移動的架在不用時移到指定儲藏區。
  tag: equipment-placement
- q: 有氧器材的表列配置空間為何？
  a: 腳踏車與階梯踏步機各 24 ft²（2.2 m²）、滑雪機 6 ft²（0.6 m²）、划船機 40 ft²（3.7 m²）、跑步機 45 ft²（4.2 m²）。
  tag: equipment-placement
- q: 設備清潔與維護的核心原則為何？
  a: 持續清潔可維持安全與功能，且清潔材料比更換護墊或地板便宜；清潔優先順序依器材使用頻率與細菌生長風險決定。
  tag: maintenance
- q: 設施使用的殺菌清潔劑應符合什麼要求？
  a: 應能防止 HIV 與肝炎傳播；護墊和乙烯基等較易滋生細菌、使用頻繁的表面應每天或隔天清潔。
  tag: maintenance
- q: NSCA 安全檢查表的清潔排程如何安排？
  a: 每日清潔檢查地板、護墊、飲水機、鏡窗與接觸皮膚的表面；每週兩到三次清潔潤滑有氧器材及選擇式阻力器材導桿；每週清潔天花板固定物與天花板磚。
  tag: maintenance
- q: 木製舉重平台與橡膠地板需要哪些維護？
  a: 木製平台要檢查碎裂與裂縫，清除可能造成腳部滑動的灰塵髒污；磚式或捲材橡膠地板應無大縫隙和可見膠水外溢。
  tag: maintenance
- q: 機器纜線與滑輪出現問題時應如何處理？
  a: 定期檢查是否鬆脫或磨損並維修；無法使用的器材標示 Out of Order，若修理需要一段時間則移離訓練場地放入儲藏區。
  tag: maintenance
- q: NSCA 設施與器材安全檢查表的用途為何？
  a: 協助判定設施與器材維護需求及清潔排程；涵蓋地板、牆面、天花板、伸展自體重、阻力器械、自由重量、舉重與有氧區，也包含布局安全。
  tag: maintenance
- q: 表 23.2 如何計算四類動作的空間需求？
  a: 臥姿：凳長加 3 ft 安全緩衝，乘以 7 ft 凳寬使用空間加 3 ft 緩衝；站姿：槓長加 6 ft 緩衝，乘以 4 ft 使用寬度；架內站姿：槓長加 6 ft 緩衝，乘以 8–10 ft 使用寬度；奧林匹克舉重區：(8+4)×(8+4)=144 ft²。
  tag: equipment-placement
- q: 高矮器材的位置原則為何？
  a: 較低的器材可放中央以利教練或訓練師看過全場；較高的器材可固定在牆邊，最好是沒有窗戶或鏡子的牆段。
  tag: equipment-placement
- q: 循環訓練區的器械間距與走道標準為何？
  a: 器械間至少 24 in（61 cm），以 36 in（91 cm）為佳；指定走道 4–7 ft（1.2–2.1 m），並讓受傷運動員可在器械間自由移動。
  tag: equipment-placement
- q: 伸展與暖身區應如何配置？
  a: 至少有 49 ft²（4.6 m²）開放空間供動態暖身；可配泡棉滾筒、彈力帶、PVC 管、網球、高爾夫球、壘球與跳繩，墊子可用但非必要。
  tag: equipment-placement
- q: 牆面、天花板與懸掛器材應如何維護？
  a: 牆面與天花板至少每一至兩週清潔，清除角落灰塵與蜘蛛網；定期檢查鏡窗裂痕及天花板懸掛器材是否牢靠。
  tag: maintenance
- q: 新設施設計委員會應包括哪些成員？
  a: 承包商、建築師、設計師、律師及與使用設施有關的人；至少考慮納入一名日後在設施工作的教練、肌力與體能專業人員或其他專家。
  tag: facility-design
- q: 改造既有設施與新建設施有何不同？
  a: 改造不包含從零建造的流程，委員會未必需要承包商或建築師，聘僱流程也可能不同；但仍應重視標準、教育、專業性與人員發展。
  tag: facility-design
- q: 使用人數與排程如何影響訓練設施設計？
  a: 同時使用人數及每日、每週、每季總使用量影響場地大小；多組同時訓練時宜分區，並讓運動員分散到達以免設施同時湧入人潮。
  tag: needs-assessment
- q: 非一樓設施的樓板承重標準為何？
  a: 至少 100 lb/ft²（488 kg/m²），並須能支撐重型器材及可能落下的器材。
  tag: facility-features
- q: 有氧區需要電力的器材應如何配置？
  a: 通常靠牆放置，除非地面或柱子設有插座；器材應遠離走道，降低被器材或電線絆倒的風險。
  tag: equipment-placement
- q: 運動員人口特性如何影響設備選擇？
  a: 年齡、性別、運動層級等會影響需求；以年長者為主的設施可能較少需要大量自由重量，大學或團隊環境可用分區讓多組同時訓練。
  tag: needs-assessment
- q: 使用者訓練經驗如何影響設備需求？
  a: 訓練經驗會影響訓練計畫與器材需求；無舉重經驗者可能做較多自體重動作，進階者可能做較多舉重動作，也要考慮賽季與年度的變化。
  tag: needs-assessment
- q: 訓練設施中飲水機的配置原則為何？
  a: 遠離訓練區且不妨礙動線；常設在入口旁，或盥洗室與置物櫃旁。安全檢查表則列出每日清潔與消毒飲水機。
  tag: facility-features
- q: 訓練設施的儲藏室需求為何？
  a: 存放額外器材、清潔用品、工具與故障器材；器材較多的設施需要較大儲藏室，且未使用器材往往占最多空間。清潔材料可行時應上鎖，工具收進工具箱。
  tag: facility-features
- q: 教材如何描述訓練設施人員資格？
  a: 應聘用至少具備必要認證與教育的人員；教材寫道 NCAA 當時正執行要求肌力與體能專業人員成為 CSCS 的立法。
  tag: facility-design
- q: NSCA 安全檢查表對牆面與鏡窗有何要求？
  a: 牆面每週清潔兩到三次，必要時更頻繁；高活動區尤其要避免突出物，鏡子與窗戶要定期清潔，鏡子若損壞應立即更換。
  tag: maintenance
- q: 臥姿動作的空間如何計算？
  a: （實際臥椅長度 6–8 ft 加 3 ft 安全緩衝）乘以（建議臥椅使用寬度 7 ft 加 3 ft 安全緩衝）；6 ft 臥椅的範例為 90 ft²。
  tag: equipment-placement
- q: 站姿動作的空間如何計算？
  a: （實際槓長 4–7 ft 加雙倍寬度 6 ft 安全緩衝）乘以建議 4 ft 站姿使用寬度；4 ft 彎舉槓的範例為 40 ft²。
  tag: equipment-placement
- q: 設備配置形成的動線如何促進安全？
  a: 設備排列可形成走道，架與器械常沿設施長度排成列；低矮器材置中有利督導，高器材沿牆固定。設備位置的首要考量是安全與功能。
  tag: equipment-placement
