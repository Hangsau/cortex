  - id: ch23.key-numbers.i04
    q: 自由重量與循環訓練器械之間應保留多少間距？
    a:
    - 槓鈴與啞鈴和其他槓鈴、啞鈴之間至少留 36 in（91 cm），使運動員與保護者能在架間安全移動。
    - 重量樹應靠近板片加載器材，而兩者距離為 36 in（91 cm）。每個架的四周也應至少留 36 in（91 cm）步行空間。
    - 循環訓練器械彼此至少相距 24 in（61 cm），以 36 in（91 cm）為較佳距離。
    detail: 書中把器械較佳間距稱為安全緩衝（safety cushion）；需要保護者的架還應比一般值預留更多空間。
