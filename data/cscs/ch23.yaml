  - id: ch23.key-numbers.i05
    q: 設施主走道與循環訓練區走道應有多寬？
    a:
    - 由沿設施長度排列的架或器械形成的兩至三條主走道，至少應寬 36 in（91 cm）。
    - 循環訓練區指定走道應寬 4–7 ft（1.2–2.1 m），讓使用者可自由移動。
    detail: 主走道與循環訓練區指定走道的用途不同，因此書中給出不同的寬度指引。
