  - id: ch23.key-numbers.i06
    q: 重量訓練區的架、平台與奧林匹克舉重區需要多少安全空間？
    a:
    - 架與平台彼此應相距 3–4 ft（0.9–1.2 m），使一人跌倒時不致傷及附近的人。
    - 表 23.2 的奧林匹克舉重區計算，以通常 8 ft（2.4 m）的「舉重平台高度」加上周邊 4 ft（1.2 m）的步行安全緩衝，得出 (8 + 4) × (8 + 4) = 144 ft²。
    - 同表的公制近似範例是 (2.5 m + 1 m) × (2.5 m + 1 m) = 12.25 m²。
    detail: 表 23.2 原文將 8 ft 的平台尺寸寫為「lifting platform height」；教材原文如此。該表的空間公式另有臥姿、站姿與架內站姿動作，不能只用這個舉重區例子套用全部器材。
