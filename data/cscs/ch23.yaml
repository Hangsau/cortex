id: ch23
weight: 23
title: Ch.23 設施設計、配置與管理
topics:
- id: design-elements
  title: 設施設計要素 Design Elements
  desc: ''
  tag: Design
  items:
  - id: ch23.design-elements.i01
    q: 位置 Location
    a:
    - 優先選一樓
    - 避免干擾辦公室/教室
    - 非一樓需確認地板承重 ≥ 100 lb/ft²（488 kg/m²）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.design-elements.i02
    q: 督導站位置
    a:
    - 位於中央、視線可及全場
    - 可搭配鏡子
    - 建議高於地板以利俯瞰
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.design-elements.i03
    q: 無障礙入口
    a:
    - 高差 >0.5 吋需坡道（12:1 比例）或機械升降
    - 設雙門方便大型設備進出
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.design-elements.i04
    q: 天花板高度
    a:
    - 建議 12–14 ft（3.66–4.27 m）
    - 需容納跳躍、Olympic lifting 等動作
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.design-elements.i05
    q: 地板類型
    a:
    - 橡膠地板（捲/磚/灌）最常見
    - 室內草皮適合增強式/敏捷
    - 舉重平台中央木材+外側橡膠
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.design-elements.i06
    q: 鏡子規格
    a:
    - 距地面 ≥ 20 吋（51 cm）
    - 距設備 ≥ 6 吋（15 cm）
    - 標準槓片 18 吋 → 預留 2 吋保護空間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.design-elements.i07
    q: 其他配備
    a:
    - 飲水機（遠離訓練區）
    - 更衣室/淋浴
    - ADA 合規電話
    - 防撞護欄
    - 儲藏室
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.design-elements.i08
    q: 動線規劃
    a:
    - 矮器材置中央方便視線
    - 高器材靠牆（避免窗/鏡）
    - 主要走道 ≥ 36 吋
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
- id: environment
  title: 環境因素 Environment
  desc: ''
  tag: Environment
  items:
  - id: ch23.environment.i01
    q: 照明 Lighting
    a:
    - 人工 + 自然光並用
    - 50–100 流明（依天花板高度與自然光量）
    - 窗戶讓空間感更開放
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.environment.i02
    q: 溫度 Temperature
    a:
    - 適合範圍：68–78°F（20–25°C）
    - 最佳：72–78°F（22–25°C）
    - HVAC 可分區控制最佳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.environment.i03
    q: 相對濕度
    a:
    - 不超過 60%
    - 防止細菌與微生物生長
    - 避免感染傳播
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.environment.i04
    q: 通風換氣
    a:
    - 空氣每小時換 8–12 次
    - 每 1,200 ft² 建議 2–4 台風扇
    - 防止悶熱與異味
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.environment.i05
    q: 音響系統
    a:
    - 音量 <90 分貝（確保聽到指令）
    - 喇叭抬高置角落
    - 朝向房間中央投射聲音
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.environment.i06
    q: 噪音隔離
    a:
    - 瑜珈/舞蹈教室用吸音材料
    - 橡膠地板可降低跳躍/落重衝擊音
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.environment.i07
    q: 鏡子採光效果
    a:
    - 鏡子反射窗戶光線，補足自然光不足的角落
    - 兼具視覺美化效果
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.environment.i08
    q: HVAC 系統
    a:
    - 暖氣+冷氣+新鮮空氣交換系統三合一
    - 搭配天花板/箱型風扇輔助循環
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
- id: four-phases
  title: 新設施四階段 Four Phases
  desc: ''
  tag: 流程
  items:
  - id: ch23.four-phases.i01
    q: ① Predesign 前設計
    a:
    - 需求分析 + 可行性研究（SWOT）+ 主計畫 + 聘建築師（競標）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch23.four-phases.i02
    q: ② Design 設計
    a:
    - 確認委員會 → 與建築師製作藍圖 → 考慮設備規格與動線
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch23.four-phases.i03
    q: ③ Construction 施工
    a:
    - 最長階段
    - 定期對照 master plan
    - 延誤可能導致訴訟
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch23.four-phases.i04
    q: ④ Preoperation 前營運
    a:
    - 完成裝潢
    - 聘有 CSCS 認證人員
    - 建立清潔排班
    - 行政規劃
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch23.four-phases.i05
    q: 可行性研究 SWOT
    a:
    - S/W/O/T 分析
    - 確認財務可行性、競爭分析、市場評估
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch23.four-phases.i06
    q: 委員會組成
    a:
    - 承包商、建築師、設計師、律師、使用者（含至少一位 S&C 專家）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch23.four-phases.i07
    q: Master Plan 主計畫
    a:
    - 含建築計畫、設施設計、預算、短/長期營運目標、人員發展計畫
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
  - id: ch23.four-phases.i08
    q: 既有設施改造
    a:
    - 步驟相似但少施工流程
    - 可能不需建築師
    - 仍需 SWOT 與委員會
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    related: []
    locator: ''
- id: key-numbers
  title: 間距規格數字 Key Numbers
  desc: ''
  tag: ⭐ 考試重點
  items:
  - id: ch23.key-numbers.i01
    q: 每人最低空間
    a:
    - 100 ft²（9.3 m²）/ 人
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
  - id: ch23.key-numbers.i02
    q: 天花板高度
    a:
    - 建議 12–14 ft（3.66–4.27 m）
    - 最低 12 ft（NSCA checklist）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
  - id: ch23.key-numbers.i03
    q: 鏡子離地高度
    a:
    - 最低 20 吋（51 cm）離地
    - 距設備 ≥6 吋（15 cm）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
  - id: ch23.key-numbers.i04
    q: 啞鈴/槓鈴間距
    a:
    - 槓端間 ≥36 吋（91 cm）
    - 器械間最低 24 吋（61 cm），建議 36 吋
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
  - id: ch23.key-numbers.i05
    q: 走道寬度
    a:
    - 主走道 ≥36 吋（91 cm）
    - 循環訓練走道 4–7 ft（1.2–2.1 m）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
  - id: ch23.key-numbers.i06
    q: 舉重平台間距
    a:
    - 平台間 3–4 ft（0.9–1.2 m）
    - Olympic lifting 區需 (8+4)×(8+4)=144 ft²
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
  - id: ch23.key-numbers.i07
    q: 坡道比例
    a:
    - 每 1 吋高差需 12 吋長度
    - 高差 >0.5 吋即需坡道或升降設施（ADA）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
  - id: ch23.key-numbers.i08
    q: 承重/濕度/溫度
    a:
    - 地板承重 ≥100 lb/ft²
    - 濕度 ≤60%
    - 溫度 68–78°F
    - 最佳 72–78°F
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - normal-values
    related: []
    locator: ''
- id: layout
  title: 設備配置區域 Layout
  desc: ''
  tag: Layout
  items:
  - id: ch23.layout.i01
    q: 暖身伸展區
    a:
    - 開放空間 ≥49 ft²（4.6 m²）
    - 泡棉滾筒、彈力帶、PVC管、跳繩、軟球
    - 可鋪墊子
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.layout.i02
    q: 循環訓練區
    a:
    - 器械排列成易切換迴路
    - 分組方式：上/下肢、推/拉、各部位
    - 考慮受傷運動員動線
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.layout.i03
    q: 自由重量區
    a:
    - 啞鈴架+架子沿牆排列
    - 確保走道空間
    - 壺鈴區需較大空間（動態動作）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.layout.i04
    q: 舉重區
    a:
    - rack + platform
    - 平台間距 3–4 ft（0.9–1.2 m）
    - rack 需螺栓固定地板
    - 無平台則需橡膠地板+混凝土基礎
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.layout.i05
    q: 有氧區
    a:
    - 腳踏車/階梯機/橢圓機/跑步機/划船機分組
    - 靠牆（電源）或地板/柱子有插座
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.layout.i06
    q: 有氧設備空間需求
    a:
    - 腳踏車 24 ft²
    - 階梯機 24 ft²
    - 划船機 40 ft²
    - 跑步機 45 ft²
    - 滑雪機 6 ft²
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.layout.i07
    q: 器械排列原則
    a:
    - 機器可排房間中央形成兩側走道
    - 高機器螺栓固定地板/柱/牆
    - 電器設備遠離走道
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
  - id: ch23.layout.i08
    q: 整體動線
    a:
    - 主走道 ≥36 吋（91 cm）
    - 矮設備置中易監看
    - 分區可讓多組同時訓練不干擾
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    related: []
    locator: ''
- id: maintenance
  title: 維護與清潔 Maintenance
  desc: ''
  tag: Maintenance
  items:
  - id: ch23.maintenance.i01
    q: 清潔頻率原則
    a:
    - 使用越頻繁的設備清潔頻率越高
    - 護墊/乙烯基材質每日或隔日
    - 清潔劑需可防 HIV 和肝炎傳播
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.maintenance.i02
    q: 地板維護
    a:
    - 非吸收地板定期拖地
    - 木製平台查裂縫
    - 螺栓定期鎖緊
    - 地毯需吸塵防黴菌
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.maintenance.i03
    q: 牆面與天花板
    a:
    - 每1–2週清潔一次
    - 無積塵
    - 清除蜘蛛網
    - 裂掉的鏡子立即更換
    - 用微纖布+玻璃清潔劑
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.maintenance.i04
    q: 設備維護
    a:
    - 纜線/滑輪定期檢查
    - 故障設備貼「停用」標示或移入儲藏室
    - 積垢影響功能與衛生
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.maintenance.i05
    q: 清潔排班建議
    a:
    - 每日：地板/軟墊/飲水機/設備接觸面/鏡子
    - 每週2–3次：有氧機/selectorized machine guide rod
    - 每週：天花板燈具除塵
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.maintenance.i06
    q: NSCA Safety Checklist
    a:
    - 涵蓋地板/牆/天花板/各設備區
    - 需作為制定清潔排班的參考依據
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.maintenance.i07
    q: 清潔工具儲放
    a:
    - 清潔材料應上鎖儲存
    - 工具放工具箱收好
    - 定期盤點補充清潔與維修耗材
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
  - id: ch23.maintenance.i08
    q: 成本效益
    a:
    - 定期清潔 < 更換護墊/地板
    - 預防性維護保護設施投資
    - 維持環境美觀也是重點
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related: []
    locator: ''
- id: needs-analysis
  title: 運動需求評估 Needs Analysis
  desc: ''
  tag: Needs Analysis
  items:
  - id: ch23.needs-analysis.i01
    q: ① 使用人數
    a:
    - 決定場地大小與排班
    - 消防法規限制最大容納人數
    - 建議每人最低 100 ft²（9.3 m²）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
    locator: ''
  - id: ch23.needs-analysis.i02
    q: ② 訓練目標
    a:
    - 教練哲學決定設備選擇
    - 例：強調增強式訓練 → 需人工草皮區
    - 舉重 → rack + platform 比 bench 更省空間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
    locator: ''
  - id: ch23.needs-analysis.i03
    q: ③ 運動員人口特性
    a:
    - 年齡/性別/程度影響設備需求
    - 年長者 → 器械多
    - 大學團體 → 分區同時訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
    locator: ''
  - id: ch23.needs-analysis.i04
    q: ④ 訓練經驗
    a:
    - 初學者較多徒手
    - 進階者需自由重量
    - 需評估季節性與年度需求變化
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
    locator: ''
  - id: ch23.needs-analysis.i05
    q: ⑤ 排班方式
    a:
    - 多組同時使用 → 分區設計
    - 錯開到館時間
    - '維持建議 staff : athlete 比例'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
    locator: ''
  - id: ch23.needs-analysis.i06
    q: ⑥ 設備維修狀況
    a:
    - 纜線磨損 → 立即停用
    - 破損設備修復或販售
    - 附件升級（如 cable column 加 attachment）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
    locator: ''
  - id: ch23.needs-analysis.i07
    q: 最低空間標準
    a:
    - 每位運動員最少 100 ft²（9.3 m²）
    - 空間不足對訓練環境影響 > 缺少特殊設備
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
    locator: ''
  - id: ch23.needs-analysis.i08
    q: 既有設備評估
    a:
    - 無破洞/裂痕/缺件
    - 纜線磨損立即下架
    - 定期清潔、及時維修或出售換新
    detail: ''
    terms: []
    numbers: []
    concepts:
    - professional
    - program-design
    related: []
