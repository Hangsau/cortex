title: Ch.23 設施設計、配置與管理
topics:
- id: design-elements
  title: 設施設計要素 Design Elements
  desc: ''
  tag: Design
  items:
  - id: ch23.design-elements.i01
    q: 肌力與體能設施的位置應如何選擇？
    a:
    - 理想上設在一樓，並遠離辦公室與教室，以免落下重量、音樂或其他噪音干擾建築內其他空間。
    - 若不在一樓，樓板必須穩定，足以支撐重型器材與落下的器材。
    detail: 一樓的建議是在降低對其他空間的干擾；非一樓時則不能只看器材靜態重量，還必須考量器材落下的情境。
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.key-numbers.i08
    - ch24.facility.i04
    locator: Designing the Strength and Conditioning Facility > Location
  - id: ch23.design-elements.i02
    q: 設施督導站或辦公室應設在何處？
    a:
    - 設在中央位置，讓督導者有清楚的視線，並可利用鏡子看見所有使用者。
    - 可把辦公室設在重量訓練區地面以上，以取得較佳視野。
    detail: 本段的核心是全場可視性；高度是可採用的選項，不是唯一的辦公室配置方式。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch24.supervision.i06
    locator: Designing the Strength and Conditioning Facility > Supervision Location
  - id: ch23.design-elements.i03
    q: 設施進出與無障礙使用應考量哪些事項？
    a:
    - 應讓身心障礙者可進出；高度改變時可設坡道或輪椅升降設備。
    - 重量訓練室宜設雙門以搬運大型器材；但走廊過窄時，門的尺寸本身無法解決搬運問題。
    detail: 無障礙設計與大型器材搬運是兩個不同的進出需求；書中也指出，狹窄走廊可能迫使搬運時暫時拆除外牆或開啟車庫門。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.key-numbers.i07
    - ch24.facility.i02
    locator: Designing the Strength and Conditioning Facility > Access
  - id: ch23.design-elements.i04
    q: 為什麼設施的天花板必須為跳躍與爆發力活動預留淨空？
    a:
    - 淨空必須容納運動員身高，以及箱跳、垂直跳與奧林匹克舉重動作所需的空間。
    - 天花板的數值建議另見本章的空間標準。
    detail: 評估高度時不能只量站立身高；書中明確把箱跳、垂直跳與奧林匹克舉重都列為必須容納的活動。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.key-numbers.i02
    - ch15.power-exercises-technique.i04
    - ch18.equipment-facility.i03
    locator: Designing the Strength and Conditioning Facility > Ceiling Height
  - id: ch23.design-elements.i05
    q: 肌力與體能設施的地板可如何依活動選擇？
    a:
    - 常見選項是橡膠地板與抗真菌地毯；橡膠地板可為捲材、嵌入式磚材或灌注式表面，且通常比地毯容易清潔。
    - 室內草皮（indoor turf）適合增強式、敏捷與體能活動，也適合地面動作及雪橇推。
    - 舉重平台（weightlifting platform）理想上中央為木材、外側為橡膠；木材可避免鞋子卡住或滑動。
    detail: 地板不是單純的裝潢選擇：書中分別把草皮連到動態活動，把木質平台中央連到舉重動作的足部安全。
    terms:
    - indoor-turf
    - plyometric-exercise
    - weightlifting-platform
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch18.equipment-facility.i01
    - ch18.equipment-facility.i07
    locator: Designing the Strength and Conditioning Facility > Flooring
  - id: ch23.design-elements.i06
    q: 鏡子在訓練設施中可發揮哪些作用？
    a:
    - 若架與平台位置適當，鏡子可作為教練工具，為運動員提供立即的視覺回饋。
    - 鏡子也能反射窗戶或人工照明，使空間顯得較大。
    - 安裝的離地與離器材距離規格另見本章的空間標準。
    detail: 鏡子的回饋功能取決於架與平台的相對位置；它不是自動適用於所有器材擺法的教學工具。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.key-numbers.i03
    - ch15.exercise-technique-fundamentals.i08
    locator: Designing the Strength and Conditioning Facility > Mirrors
  - id: ch23.design-elements.i07
    q: 除了訓練器材外，設施還應考量哪些附屬空間與設備？
    a:
    - 飲水機應遠離訓練區且不妨礙動線；更衣室與淋浴可便利訓練後清潔。
    - 至少應有一支輪椅使用者可及的電話，以符合《美國身心障礙者法案》並支援緊急通訊。
    - 可在鏡子或石膏板等易受損處使用防撞軌或護墊，並預留存放備用器材、清潔用品、工具及故障器材的空間。
    detail: 書中把飲水、更衣、緊急通訊、防撞與儲藏都放在「其他考量」；它們共同影響設施能否安全且順暢地日常運作。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
    - ch23.safety-electrical.i03
    - ch24.emergency.i05
    locator: Designing the Strength and Conditioning Facility > Other Considerations
  - id: ch23.design-elements.i08
    q: 設備位置如何同時支援動線與督導視線？
    a:
    - 為方便督導者看過整個設施，中央可放置低矮器材與啞鈴架。
    - 高器材可沿牆固定，最好選擇沒有窗戶或鏡子的牆面。
    - 自由重量、架與其他器材的走道與間距數值另見本章的空間標準。
    detail: 動線和督導視線不是獨立問題：書中以低矮器材置中、高器材沿牆的組合，同時處理兩者。
    terms: []
    numbers: []
    concepts:
    - safety
    - professional
    related:
