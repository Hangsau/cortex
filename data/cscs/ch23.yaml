  - id: ch23.key-numbers.i07
    q: 無障礙高度改變何時需要坡道，其比例為何？
    a:
    - 高度改變超過 0.5 in（13 mm）時，應設坡道或輪椅升降設備。
    - 坡道每上升 1 in，應有 12 in 的水平長度；公制為每上升 2.5 cm，有 30.5 cm 的水平長度。
    detail: 原文在 Access 段落提出坡道與升降設備，並未把這一段的坡道比例標成 ADA 比例；ADA 在本章明確提及的是可及電話。
