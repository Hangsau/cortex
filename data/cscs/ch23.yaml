- id: environment
  title: 環境因素 Environment
  desc: ''
  tag: Environment
  items:
  - id: ch23.environment.i01
    q: 訓練設施的照明應如何規劃？
    a:
    - 應同時採用人工與自然光。
    - 窗戶可使設施顯得更開放、現代；鏡子可把自然光反射到原本沒有自然光的區域。
    - 照度數值應依天花板高度與自然光量判定，詳見本章的空間與環境標準。
    detail: 書中對照度的建議不是單一固定值，而是明確以天花板高度與可得自然光作為條件。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i08
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
  - id: ch23.environment.i02
    q: 為什麼訓練設施必須維持舒適的訓練溫度？
    a:
    - 暖氣、通風與空調系統（heating, ventilation, and air conditioning, HVAC）最好能分別加熱或冷卻設施的各區。
    - 過熱或過冷都會使運動員不舒適並影響訓練品質；書中列出的溫度範圍詳見本章的空間與環境標準。
    detail: 分區控制是書中對 HVAC 的理想能力，而非僅要求整棟建築維持同一設定溫度。
    terms:
    - heating-ventilation-and-air-conditioning
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i08
    - ch12.selection-factors.i06
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
  - id: ch23.environment.i03
    q: 為什麼必須監測設施的相對濕度？
    a:
    - 有身體活動的空間應監測相對濕度，且不應超過書中列出的上限。
    - 控制濕度有助於防止細菌與微生物生長，避免感染與疾病傳播。
    detail: 本段的適用情境是「有身體活動的空間」，並把濕度控制直接連到微生物生長與感染傳播。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i08
    - ch12.safety.i03
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
  - id: ch23.environment.i04
    q: 設施的空氣循環應如何維持？
    a:
    - 可用 HVAC、新鮮空氣交換系統及天花板或箱型風扇提供循環。
    - 空氣交換與風扇配置的數值指引是為了避免停滯空氣造成異味；詳見本章的空間與環境標準。
    detail: 風扇在書中的作用是讓空氣不致感覺停滯和悶濕；它被列為循環系統的輔助手段。
    terms:
    - heating-ventilation-and-air-conditioning
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i08
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
  - id: ch23.environment.i05
    q: 安裝音響系統時應注意哪些事項？
    a:
    - 音樂雖非必要，書中指出它可協助運動員獲得動機與節奏。
    - 音量應維持在能聽見指令與提示的標準以下；揚聲器宜抬高、放在角落，朝房間中央投射以均勻分布聲音。
    detail: 音響的設計取捨不只在氣氛；書中以「仍聽得到指令與提示」作為音量上限的安全理由。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.key-numbers.i08
    - ch24.supervision.i04
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
  - id: ch23.environment.i06
    q: 如何降低設施內外的背景噪音？
    a:
    - 背景或外部噪音可能來自 HVAC 系統或相鄰建築。
    - 若設施包含瑜珈或舞蹈課，地板與牆面可用吸音材料，避免多餘噪音傳到設施內其他人。
    - 吸音橡膠地板可減弱跳躍、跑步或物品落下的聲音。
    detail: 書中不是泛指所有空間都必須隔音，而是特別舉有瑜珈或舞蹈課的設施作為吸音材料的情境。
    terms:
    - heating-ventilation-and-air-conditioning
    numbers: []
    concepts:
    - safety
    related:
    - ch23.design-elements.i05
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
  - id: ch23.environment.i07
    q: 鏡子如何改善室內採光與空間感？
    a:
    - 鏡子可反射窗戶的自然光，照亮原本沒有自然光的區域。
    - 鏡子也能反射人工光，使空間顯得比實際更大。
    detail: 此處的鏡子功能是採光與美觀，和作為教練即時視覺回饋工具的用途不同。
    terms: []
    numbers: []
    concepts:
    - safety
    related:
    - ch23.design-elements.i06
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
  - id: ch23.environment.i08
    q: HVAC 與風扇在設施設計中如何分工？
    a:
    - HVAC 系統可提供加熱、冷卻與循環；新鮮空氣交換系統也可協助循環。
    - 天花板或箱型風扇可作為輔助，改善停滯、悶濕的空氣感。
    detail: 書中把 HVAC、空氣交換與風扇列為可組合的循環手段，並未把它們描述成必然整合在同一套設備內。
    terms:
    - heating-ventilation-and-air-conditioning
    numbers: []
    concepts:
    - safety
    related:
    - ch23.environment.i02
    - ch23.environment.i04
    locator: Designing the Strength and Conditioning Facility > Environmental Factors
- id: four-phases
  title: 新設施四階段 Four Phases
  desc: ''
  tag: 流程
  items:
  - id: ch23.four-phases.i01
    q: 新設施的前設計期（predesign phase）包括哪些工作？
    a:
    - 前設計期是新設施建造的第一步，包括需求分析（needs analysis）、可行性研究（feasibility study）與主計畫（master plan）的形成。
    - 此期結束時應聘請信譽良好的建築師，通常透過競標程序，由其開始製作基本藍圖。
    detail: 原文把聘請建築師列為前設計期的最後一步，而非把建築師加入委員會就等同完成這一步。
    terms:
    - predesign-phase
    - needs-analysis
    - feasibility-study
    - master-plan
    numbers: []
    concepts:
    - professional
    related:
    - ch23.four-phases.i05
    - ch23.four-phases.i07
    - ch24.administration.i06
    locator: General Aspects of New Facility Design > Predesign Phase
  - id: ch23.four-phases.i02
    q: 新設施設計期（design phase）的重點是什麼？
    a:
    - 將委員會的構想整合為設施結構與設計要素，並規劃動線、遵守相關法規與規範。
    - 確定設計委員會後，設計者與建築師密切合作製作藍圖。
    - 藍圖須考量器材規格，因為它們會影響使用者在設施各區移動的流暢性與督導視線。
    detail: 原文特別提醒城市規範通常很具體，應向城市規劃部門取得當地指引與規範。
    terms:
    - design-phase
    numbers: []
    concepts:
    - professional
    related:
    - ch23.design-elements.i08
    - ch24.facility.i04
    locator: General Aspects of New Facility Design > Design Phase
  - id: ch23.four-phases.i03
    q: 新設施施工期（construction phase）應如何管理？
    a:
    - 施工期自開工至完工，通常是流程中最長的階段。
    - 委員會應持續對照主計畫，確認專案符合已建立的目標與設計，並把進度與期限列為優先。
    - 若未依期限完工而使業主失去潛在營收，延誤成本可能由建造者或建築師負擔，並可能引發訴訟或初始競標價格調減。
    detail: 「通常最長」是教材的限定語；延誤後的法律與賠償情況以可能性表述，不能改寫成必然訴訟。
    terms:
    - construction-phase
    - master-plan
    numbers: []
    concepts:
    - professional
    related:
    - ch23.four-phases.i07
    - ch24.legal.i02
    locator: General Aspects of New Facility Design > Construction Phase
  - id: ch23.four-phases.i04
    q: 新設施前營運期（preoperation phase）要完成哪些開館準備？
    a:
    - 完成室內裝潢並聘用合格人員；人員至少應具備必要的認證與教育。
    - 建立人員發展計畫，並把每週清潔與維護工作分派給人員，依已建立的排程執行。
    - 開館前安排責任保險、排程、預算、排程軟體與文書工作的行政分工。
    detail: 書中以室內美感能提升使用者經驗作為裝潢的理由，也把清潔維護排程定位為一開始營運就要遵循的制度。
    terms:
    - preoperation-phase
    numbers: []
    concepts:
    - professional
    related:
    - ch23.maintenance.i05
    - ch24.personnel.i03
    - ch24.ethics-records.i04
    locator: General Aspects of New Facility Design > Preoperation Phase
  - id: ch23.four-phases.i05
    q: 可行性研究（feasibility study）中的 SWOT 分析要評估什麼？
    a:
    - 分析優勢、弱點、機會與威脅（strengths, weaknesses, opportunities, and threats, SWOT）。
    - 目標是確認財務投資能否產生可行且可持續的回報。
    - 還要評估位置、構想的優弱點、體育與肌力體能計畫的成長潛力、市場機會與競爭設施的目標市場及成長潛力。
    detail: 書中把市場評估具體連到「最有效率地訓練更多運動員」的機會，以及對競爭設施的比較，不只是內部財務試算。
    terms:
    - feasibility-study
    - swot-analysis
    numbers: []
    concepts:
    - professional
    related:
    - ch23.four-phases.i01
    - ch24.administration.i01
    locator: General Aspects of New Facility Design > Predesign Phase
  - id: ch23.four-phases.i06
    q: 新設施設計委員會應包含哪些人員？
    a:
    - 委員會應包括承包商、建築師、設計師、律師與設施使用相關人員。
    - 至少應考慮納入一名日後在設施工作的教練、肌力與體能專業人員或其他專家，以增加空間實用性與安全性的觀點。
    - 委員會也協助考量設施設計與開館的經濟面。
    detail: 使用者端專業人員的角色是補足實際使用情境；原文不是只列出外部設計與建造專業。
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    related:
    - ch23.four-phases.i02
    - ch24.administration.i06
    locator: General Aspects of New Facility Design
  - id: ch23.four-phases.i07
    q: 主計畫（master plan）應包含哪些內容？
    a:
    - 主計畫是涵蓋新設施所有階段的一般計畫，應包括建築與施工計畫、設施設計、預算資訊，以及完工後使用的營運計畫。
    - 營運計畫應包含促進近期與長期成功的短期與長期目標、人員發展及聘僱流程計畫。
    detail: 主計畫不是只在施工期使用；前設計、施工與開館後的營運都以它作為共同的規劃架構。
    terms:
    - master-plan
    numbers: []
    concepts:
    - professional
    related:
    - ch23.four-phases.i01
    - ch23.four-phases.i03
    - ch24.administration.i03
    locator: General Aspects of New Facility Design > Predesign Phase
  - id: ch23.four-phases.i08
    q: 改造既有肌力與體能設施與新建設施有何異同？
    a:
    - 改造既有設施與新建設施相似，但不包含從零開始建造的流程，且在某些情況下可能耗時很久。
    - 仍可成立委員會，但承包商與建築師等成員未必必要；聘僱流程也可能不同。
    - 不論所有權或管理是否改變，都應持續重視標準、教育、專業性與人員發展，並依所有使用設施的運動員與隊伍需求評估既有器材。
    detail: 原文沒有說既有設施必須再做 SWOT 分析；該段重點是改造時的流程與人員條件可能不同。
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - professional
    related:
    - ch23.needs-analysis.i08
    - ch24.facility.i03
    locator: Existing Strength and Conditioning Facilities
- id: key-numbers
  title: 間距規格數字 Key Numbers
  desc: ''
  tag: ⭐ 考試重點
  items:
  - id: ch23.key-numbers.i01
    q: 每位參與者、動態暖身區與有氧器材各需多少空間？
    a:
    - 建議每位參與者至少有 100 ft²（9.3 m²）的空間。
    - 伸展與暖身區若可提供至少 49 ft²（4.6 m²）的開放空間，運動員即可進行動態暖身。
    - 有氧器材的空間需求為：腳踏車與階梯踏步機各 24 ft²（2.2 m²）、滑雪機 6 ft²（0.6 m²）、划船機 40 ft²（3.7 m²）、跑步機 45 ft²（4.2 m²）。
    detail: 每位參與者的建議值是評估整體設施規模的起點；有氧器材的表列值則是每一項器材的配置空間，不能混為同一種面積標準。
