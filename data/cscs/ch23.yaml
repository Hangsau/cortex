  - id: ch23.key-numbers.i02
    q: 天花板為跳躍與過頭動作應提供多少淨空高度？
    a:
    - 建議天花板高度為 12–14 ft（3.66–4.27 m），以容納跳躍、箱跳、垂直跳與奧林匹克舉重動作。
    - NSCA 的安全檢查表把過頭動作的天花板淨高列為至少 12 ft（3.7 m），並要求沒有梁、管線、照明、標誌等低垂物。
    detail: 建議範圍與安全檢查表的最低值來自不同段落；兩者都以過頭活動的淨空為適用邊界。
