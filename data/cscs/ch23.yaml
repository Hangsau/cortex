  - id: ch23.key-numbers.i03
    q: 鏡子應離地面及器材多遠，為什麼？
    a:
    - 鏡子距任何器材至少 6 in（15 cm），距地面至少 20 in（51 cm）。
    - 標準槓片直徑是 18 in（46 cm）；此離地高度讓槓片落下、反彈或滑向鏡子時保有 2 in（5 cm）淨空。
    detail: 離地高度的目的不是美觀，而是避免槓片撞破鏡子；書中以標準槓片直徑說明這個保護淨空。
