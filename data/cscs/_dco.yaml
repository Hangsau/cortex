# 官方 DCO 任務層級座標
#
# _domains.yaml 給的是 domain 層（7 個 domain、各自的計分題數與認知配題）。
# 本檔往下一層：每個 domain 的 task（A/B/C…）與 knowledge statement（1/2/3…）。
#
# 為什麼需要這一層：domain 層只能保證「運動科學出 48 題」，不能保證那 48 題
# 沒有全部擠在肌肉解剖而漏掉生物力學。task id（sf1.C.2）是出題覆蓋率的檢查
# 單位，題庫每題帶 dco 欄位，缺口就算得出來。
#
# 逐字抄錄自 Appendix F，只做換行合併，不改寫、不翻譯、不補充。e.g. 清單原文
# 保留，因為那是官方對該 knowledge statement 範圍的界定，改寫就失去效力。

meta:
  source: NSCA Certification Handbook, Appendix F（CSCS Detailed Content Outline）
  source_file: resources/raw/pdf/inbox/nsca-certification-handbook.pdf
  source_pages: 41-47
  mirror: resources/raw/pdf/inbox/certified-strength-and-conditioning-specialist-job-task-analysis-summary-2025.pdf（p.2-8 為同一份 DCO）
  dco_effective: 2025-07-01
  retrieved: 2026-09-14
  verification: verified
  section_totals:
    sf: {recall: 24, application: 44, analysis: 12, total: 80}
    pa: {recall: 21, application: 53, analysis: 36, total: 110}

domains:
  - id: sf1-exercise-science
    cognitive: {recall: 15, application: 26, analysis: 7}
    total: 48
    tasks:
      - id: sf1.A
        text: Apply Knowledge of Muscle Anatomy and Physiology
        knowledge:
          - {id: sf1.A.1, text: "Muscle anatomy (e.g., muscle group names, specific muscle names, muscle fiber/cell structure)"}
          - {id: sf1.A.2, text: "Muscular dynamics involved during movement patterns (e.g., sliding filament theory, type of muscle action)"}
          - {id: sf1.A.3, text: "Individual differences among various types of athlete (biological age, training age, biological sex)"}
      - id: sf1.B
        text: Apply Knowledge of Neuromuscular Anatomy and Physiology
        knowledge:
          - {id: sf1.B.1, text: "Neuromuscular anatomy (e.g., motor unit, muscle fiber type, muscle spindle, Golgi tendon organ)"}
          - {id: sf1.B.2, text: "Neuromuscular responses to exercise (e.g., motor unit recruitment patterns, nerve conduction, summation)"}
          - {id: sf1.B.3, text: "Individual differences among various types of athletes (biological age, training age, biological sex)"}
      - id: sf1.C
        text: Apply Knowledge of Basic Principles of Biomechanics Regarding Exercise Selection, Execution, and Sport Performance
        knowledge:
          - {id: sf1.C.1, text: "Kinematic principles of movement (e.g., anatomical planes of movement, joint angles, velocity)"}
          - {id: sf1.C.2, text: "Kinetic laws and principles of movement (e.g., momentum, torque, power, work, force, center of gravity, impulse, center of pressure, force-velocity curve, force-time curve, isometric/isotonic/isokinetic, lever systems)"}
          - {id: sf1.C.3, text: "Role of muscles in movement (e.g., agonist, antagonist, synergist, neutralizer, stabilizer)"}
          - {id: sf1.C.4, text: "Individual differences among various types of athletes (biological age, training age, biological sex)"}
      - id: sf1.D
        text: Apply Knowledge of Bone and Connective Tissue (tendons and ligaments) Anatomy and Physiology
        knowledge:
          - {id: sf1.D.1, text: "Bone and connective tissue anatomy"}
          - {id: sf1.D.2, text: "Bone and connective tissue responses to exercise and training"}
          - {id: sf1.D.3, text: "Individual differences among various types of athletes (biological age, training age, biological sex)"}
      - id: sf1.E
        text: Apply Knowledge of Bioenergetics and Metabolism
        knowledge:
          - {id: sf1.E.1, text: "Characteristics of the energy systems"}
          - {id: sf1.E.2, text: "Effects of manipulating training variables (e.g., mode, intensity, duration, volume and work:rest ratio) to target specific energy systems"}
          - {id: sf1.E.3, text: "Individual differences among various types of athletes (biological age, training age, biological sex)"}
      - id: sf1.F
        text: Apply Knowledge of Neuroendocrine Physiology
        knowledge:
          - {id: sf1.F.1, text: "Functions of hormones (e.g., testosterone, growth hormone)"}
          - {id: sf1.F.2, text: "Neuroendocrine responses to exercise and training"}
          - {id: sf1.F.3, text: "Individual differences among various types of athletes (biological age, training age, biological sex)"}
      - id: sf1.G
        text: Apply Knowledge of Cardiopulmonary Anatomy and Physiology
        knowledge:
          - {id: sf1.G.1, text: "Cardiopulmonary anatomy (e.g., structure of the heart, vascular system, lungs)"}
          - {id: sf1.G.2, text: "Cardiopulmonary responses to exercise and training"}
          - {id: sf1.G.3, text: "Individual differences among various types of athletes (biological age, training age, biological sex)"}
      - id: sf1.H
        text: Apply Knowledge of Physiological Adaptations
        knowledge:
          - {id: sf1.H.1, text: "Impact of resistance training on physiological systems (e.g., nervous system, skeletal muscle, energy systems)"}
          - {id: sf1.H.2, text: "Impact of conditioning on physiological systems (e.g., energy systems, skeletal muscle, nervous system)"}
      - id: sf1.I
        text: Apply Knowledge of Integrated/Network Physiology
        knowledge:
          - {id: sf1.I.1, text: "Interplay among the physiological systems"}
          - {id: sf1.I.2, text: "Performance planning and performance management (training, sport science, recovery, sleep, travel, mental performance, nutrition)"}
          - {id: sf1.I.3, text: "Impact of fatigue (e.g., neuromuscular, metabolic) on performance"}
          - {id: sf1.I.4, text: "Techniques and strategies for restoration"}
      - id: sf1.J
        text: Apply Knowledge of Scientific Research and Statistics in the Exercise Sciences
        knowledge:
          - {id: sf1.J.1, text: "Scientific research process (e.g., research design and basic statistics)"}
          - {id: sf1.J.2, text: "PICOT approach (Population, intervention, comparison, outcome, time) to asking answerable questions"}
          - {id: sf1.J.3, text: "Research evaluation criteria (e.g., reliability and validity of testing techniques and research design)"}
          - {id: sf1.J.4, text: "Practical applications of research"}

  - id: sf2-sport-psychology
    cognitive: {recall: 6, application: 12, analysis: 2}
    total: 20
    tasks:
      - id: sf2.A
        text: Apply Knowledge of the Psycho-physiological factors of performance
        knowledge:
          - {id: sf2.A.1, text: "Motivational theories (e.g., Self-determination, goal-orientation, achievement motivation)"}
          - {id: sf2.A.2, text: "Mental skills (e.g., arousal/emotional regulation, attentional control, visualization/imagery, reinforcement strategies, confidence building, and self-talk)"}
          - {id: sf2.A.3, text: "The alignment of psychological and physiological factors"}
          - {id: sf2.A.4, text: "Interpersonal relationships (e.g., coach-athlete relationship, team dynamics/cohesion, leadership)"}
      - id: sf2.B
        text: Apply Knowledge of Athlete Mental Health and Wellness
        knowledge:
          - {id: sf2.B.1, text: "The psychological impact of setbacks (e.g., injury, athlete identity/transitions, re-evaluation) and know when to refer"}
          - {id: sf2.B.2, text: "The signs and symptoms of common mental health concerns (e.g., anxiety, stress, depression) and know when to refer"}
          - {id: sf2.B.3, text: "The signs and symptoms associated with eating disorders and disordered eating and know when to refer"}

  - id: sf3-nutrition
    cognitive: {recall: 3, application: 6, analysis: 3}
    total: 12
    tasks:
      - id: sf3.A
        text: Apply Basic Knowledge of Nutritional Factors Affecting Health and Performance
        knowledge:
          - {id: sf3.A.1, text: "Nutrition related topics that are within scope of practice and when referral is needed"}
          - {id: sf3.A.2, text: "Basic nutritional factors that affect muscular endurance, hypertrophy, strength, power, and aerobic endurance (e.g., hydration/fluid intake, energy balance, macronutrient timing and quality, supplementation)"}
          - {id: sf3.A.3, text: "Impact of alcohol and drugs"}
          - {id: sf3.A.4, text: "Differences between evidenced-based and unsupported approaches for altering body composition (e.g., Plate approach vs fad diets)"}
      - id: sf3.B
        text: Apply Basic Knowledge of Supplement Efficacy and Safety
        knowledge:
          - {id: sf3.B.1, text: "Lack of regulation of dietary supplements and third-party testing"}
          - {id: sf3.B.2, text: "Benefits and risks of dietary supplement, ergogenic aids, and performance-enhancing drugs"}

  - id: pa1-program-design
    cognitive: {recall: 2, application: 21, analysis: 21}
    total: 44
    tasks:
      - id: pa1.A
        text: Conduct Needs Analysis
        knowledge:
          - {id: pa1.A.1, text: "Evaluate the sport (movement, physiological, injury analysis)"}
          - {id: pa1.A.2, text: "Review the athlete's history (injury history, training status) and primary training goals"}
          - {id: pa1.A.3, text: "Select assessments (screening, performance testing, and monitoring)"}
          - {id: pa1.A.4, text: "Analyze and benchmark assessment results"}
          - {id: pa1.A.5, text: "Communicate recommendations based on the needs analysis to stakeholders"}
      - id: pa1.B
        text: Incorporate Various Training Methods and Modes
        knowledge:
          - {id: pa1.B.1, text: "Different types of physical preparation goals or outcomes (e.g., muscular endurance, hypertrophy, strength, power, energy system development)"}
          - {id: pa1.B.2, text: "Different types of training methods and modes (e.g., resistance training, plyometric, speed/sprint, agility, mobility/flexibility)"}
      - id: pa1.C
        text: Select Exercises
        knowledge:
          - {id: pa1.C.1, text: "Exercises relevant to the qualities and capacities desired within the training period"}
          - {id: pa1.C.2, text: "Exercises to minimize injury potential (e.g., tendon loading, collision preparation)"}
          - {id: pa1.C.3, text: "Exercises relevant to available facility, equipment, and staff"}
          - {id: pa1.C.4, text: "Exercises relevant to individual injured athlete adjustments"}
      - id: pa1.D
        text: Determine Exercise Order
        knowledge:
          - {id: pa1.D.1, text: "Order of exercises based on the session goals"}
          - {id: pa1.D.2, text: "Order of exercises based on mechanical or metabolic interference (e.g., large to small muscle groups, speed of movement, alternating upper body exercises with lower body exercises)"}
      - id: pa1.E
        text: Determine Exercise Intensities
        knowledge:
          - {id: pa1.E.1, text: "Methods for assigning mechanical (external) load (e.g., a percent of the 1RM or the athlete's body weight, RM loads, RPE) based on training and session goals"}
          - {id: pa1.E.2, text: "Methods for assigning metabolic (internal) load (e.g., Karvonen method)"}
      - id: pa1.F
        text: Determine Training Volumes (defined as sets x reps)
        knowledge: []
      - id: pa1.G
        text: Determine Work:Rest Periods, Recovery and Unloading, and Training
        knowledge:
          - {id: pa1.G.1, text: "Determine work:rest periods between reps, sets, and exercises based on session goals"}
          - {id: pa1.G.2, text: "Determine recovery periods between sessions (e.g., daily, weekly)"}
          - {id: pa1.G.3, text: "Determine training frequency within a microcycle (e.g., training week)"}
          - {id: pa1.G.4, text: "Determine recovery and unloading phases within the macrocycle (e.g., training year)"}
      - id: pa1.H
        text: Determine Exercise Progression (e.g., mode, intensity, duration, frequency, complexity)
        knowledge: []
      - id: pa1.I
        text: Identify Periodization Strategies
        knowledge:
          - {id: pa1.I.1, text: "Determine strategy based on demands of sport, athlete/team needs, training age, and training goals (e.g., linear, nonlinear)"}
          - {id: pa1.I.2, text: "Determine strategy based on phase/period/cycle goals (e.g., off season, pre-season, in season)"}
      - id: pa1.J
        text: Design Programs for Athletes During the Injury/Reconditioning/Return to Play Period in Collaboration with the Interdisciplinary Team
        knowledge: []
      - id: pa1.K
        text: Communicate and discuss the program goals, design, and expected outcomes to stakeholders
        knowledge: []

  - id: pa2-exercise-technique
    cognitive: {recall: 5, application: 15, analysis: 8}
    total: 28
    tasks:
      - id: pa2.A
        text: Teach and Evaluate Movement Preparation (soft tissue and flexibility/mobility, PNF, CNS prep, dynamic stretching)
        knowledge:
          - {id: pa2.A.1, text: "Provide a demonstration or explanation of movement patterns and technique (e.g., body and limb positions, movement mechanics, breathing)"}
          - {id: pa2.A.2, text: "Assess, cue, and modify based on arousal, focus, competency, and safety"}
      - id: pa2.B
        text: Teach and Evaluate Resistance Training Technique
        equipment_classes:
          - {id: pa2.B.1, text: "Free weight training equipment (e.g., barbells, dumbbells, kettlebells)"}
          - {id: pa2.B.2, text: "Resistance machine (e.g., pulley, cam, hydraulic)"}
          - {id: pa2.B.3, text: "Alternative resistance equipment (e.g., sleds, logs, tires, flywheels, ropes, sandbags, medicine balls, resistance bands)"}
          - {id: pa2.B.4, text: "Olympic Weightlifting and Derivatives (e.g., high pull, push jerk, power pull)"}
        # 每個器材類別底下官方都掛同樣三項 a/b/c；展開成 pa2.B.1.a 這種 id。
        knowledge:
          - {id: pa2.B.*.a, text: "Demonstrate or explain movement patterns and technique (e.g., body and limb positions, movement mechanics, breathing)"}
          - {id: pa2.B.*.b, text: "Engage safety protocol based on athlete and equipment needs (e.g., spotting for free weights, set up)"}
          - {id: pa2.B.*.c, text: "Assess, cue, and modify based on arousal, focus, competency, and safety"}
      - id: pa2.C
        text: Teach and Evaluate Speed, Agility, and Plyometric Technique (e.g., linear and multidirectional sprints, change of direction, hops, jumps, bounds)
        knowledge:
          - {id: pa2.C.1, text: "Demonstrate or explain movement patterns and technique (e.g., acceleration, deceleration, change of direction)"}
          - {id: pa2.C.2, text: "Engage safety protocol based on athlete, environment, and equipment needs (e.g., set up)"}
          - {id: pa2.C.3, text: "Assess, cue, and modify based on arousal, focus, competency, and safety"}
      - id: pa2.D
        text: Teach and Evaluate Energy System Development (Bioenergetics)
        knowledge:
          - {id: pa2.D.1, text: "Explain the purpose and the goals of the conditioning session including intensity and duration"}
          - {id: pa2.D.2, text: "Observe individual athlete responses and adjust accordingly (e.g., modify recovery periods/modalities based on athlete competency and safety concerns)"}
      - id: pa2.E
        text: Teach and Evaluate Restoration Techniques (e.g., breathing, stretching, active recovery)
        knowledge:
          - {id: pa2.E.1, text: "Explain the purpose and goals of the restoration technique"}
          - {id: pa2.E.2, text: "Facilitate the restoration activity"}

  - id: pa3-program-implementation
    cognitive: {recall: 3, application: 12, analysis: 7}
    total: 22
    tasks:
      - id: pa3.A
        text: Coach athletes through training sessions
        knowledge:
          - {id: pa3.A.1, text: "Prepare for sessions, define roles and responsibilities, set expectations"}
          - {id: pa3.A.2, text: "Apply knowledge of motor learning and skill development (e.g., internal/external cues, progression/regression, demonstrations)"}
          - {id: pa3.A.3, text: "Use active observation and data collection to provide feedback and evaluate progress toward expectations"}
          - {id: pa3.A.4, text: "Reflect on the session through debrief and evaluation of coaching effectiveness"}
      - id: pa3.B
        text: Administer Testing and Implement Monitoring Procedures
        knowledge:
          - {id: pa3.B.1, text: "Determine equipment and protocols to assess physical characteristics (e.g., strength, power, speed, aerobic capacity) and monitor readiness (e.g., practice loads, game loads, HRV)"}
          - {id: pa3.B.2, text: "Conduct testing and monitoring procedures (e.g., data collection and organization, warm-up, how to test, rest between trials, athlete readiness)"}
      - id: pa3.C
        text: Evaluate, Interpret, and Communicate Assessment Results
        knowledge:
          - {id: pa3.C.1, text: "Evaluate the validity of test implementation and results"}
          - {id: pa3.C.2, text: "Analyze the results in accordance with program plan (e.g., trend analysis, descriptive statistics)"}
          - {id: pa3.C.3, text: "Synthesize, communicate, and discuss results with stakeholders while maintaining information privacy"}
          - {id: pa3.C.4, text: "Adjust the training program based on results and feedback from stakeholders"}

  - id: pa4-organization
    cognitive: {recall: 11, application: 5, analysis: 0}
    total: 16
    tasks:
      - id: pa4.A
        text: Work within the strength and conditioning scope of practice following the NSCA Codes, Policies, and Procedures, collaborate with allied health professionals, and recognize when to refer.
        knowledge: []
      - id: pa4.B
        text: Implement organizational environment policies and procedures that are associated with the safe operation of the strength and conditioning facility (e.g., facility/equipment cleaning and maintenance, rules, staff responsibilities, scheduling, emergency procedures)
        knowledge: []
      - id: pa4.C
        text: Identify risks associated with safety, standard of care, professional practice and ways to reduce or minimize the risk of liability within the facility
        knowledge: []
      - id: pa4.D
        text: Recognize and respond to symptoms of unsafe training practices (e.g., overuse, overtraining and temperature-induced illness)
        knowledge: []

# 官方公布的五道樣題，逐字保留。這是「CSCS 出題邏輯」的第一手證據，
# _quiz_spec.md 的每條規則都要指得回這裡的某一題。
sample_items:
  - n: 1
    stem: "Which of the following shoulder movements and planes of motion are associated with the upward movement phase of the side lateral shoulder raise exercise?"
    options: ["flexion/transverse", "abduction/sagittal", "abduction/frontal"]
    answer: C
  - n: 2
    stem: "An untrained college-aged athlete begins a resistance training program. After training for three weeks, her strength increases dramatically. Which of the following is the most influential factor responsible for this improvement?"
    options: ["decreased cross-sectional area of Type I fibers", "increased number of muscle fibers", "improved neuromuscular efficiency"]
    answer: C
  - n: 3
    stem: "What is the minimum amount of carbohydrates that a 132-lb (60-kg) competitive Olympic triathlete should consume on a daily basis?"
    options: ["120 g", "480 g", "960 g"]
    answer: B
  - n: 4
    stem: "When running, which of the following contributes the most to minimizing the braking effect of a heel foot strike?"
    options: ["eccentric hip flexion", "concentric hip extension", "eccentric knee extension"]
    answer: B
  - n: 5
    stem: "Which of the following components of mechanical load is the least important for stimulating new bone formation?"
    options: ["rest period", "magnitude", "rate of loading"]
    answer: A
