    q: 最大化 GH（22kDa）
    a:
    - ① 高強度（10RM）＋ 每動作 3 組
    - ② 短休息（1 分鐘）→ 關鍵：產生高乳酸＋低 pH
    - ③ 訓練前後補充蛋白質＋碳水化合物
    detail: 短休息的效果不是強度本身，而是累積的乳酸與 H⁺：酸性環境刺激下視丘 GHRH 釋放，同時抑制 Somatostatin；1 分鐘比 3 分鐘的研究顯示此差異顯著
