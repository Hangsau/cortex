    - 重阻訓（如 6 組 10RM 深蹲）可急性增加游離睾固酮
    - 年齡↑ → 游離睾固酮反應↓（年長男性生物潛能較小）
    detail: 年輕男性擁有更高的總睾固酮絕對值，因此有更多游離睾固酮可與靶組織互動
