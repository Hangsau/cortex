cards:
- q: 荷爾蒙的定義與基本功能？
  a: 化學訊號分子，由內分泌腺合成、儲存、分泌入血液，作用於含有特異性受器的目標組織
  tag: Endocrinology
- q: 荷爾蒙三大分類與各自特性？
  a: ①類固醇（脂溶性，直接穿透細胞膜）②胜肽/多肽（水溶性，作用於膜受器）③胺類（酪氨酸/色氨酸衍生，作用於膜受器）
  tag: Endocrinology
- q: 荷爾蒙的四種分泌途徑？
  a: ①內分泌（入血循環）②旁分泌（作用鄰近細胞）③自分泌（作用自身細胞）④胞內分泌（細胞內作用）
  tag: Endocrinology
- q: 血液中結合蛋白的功能？
  a: 攜帶荷爾蒙運輸；延長半衰期；防止降解；多數荷爾蒙需「游離」才有活性（free hormone hypothesis）
  tag: Endocrinology
- q: 類固醇荷爾蒙的作用機制步驟？
  a: 擴散穿細胞膜→與細胞質受器結合→形成H-RC→移入細胞核→與DNA結合→轉錄mRNA→蛋白質合成
  tag: Endocrinology
- q: 胜肽荷爾蒙為何無法直接進入細胞核？如何傳訊？
  a: 水溶性，無法穿透細胞膜；與膜受器結合後活化二級訊使（如cAMP、JAK/STAT）→訊號傳導至核或代謝途徑
  tag: Endocrinology
- q: 一般適應症候群（GAS）的三個階段與對週期化的意義？
  a: ①警戒反應（功能暫時下降）②抵抗期（功能超越基準＝適應）③耗竭期；週期化理論的基礎——適時移除壓力才能適應
  tag: Endocrinology
- q: 睾固酮的來源（男性 vs 女性）？
  a: 男性：主要來自睾丸；女性：卵巢＋腎上腺；女性濃度為男性 1/15~1/20
  tag: Anabolic
- q: 游離睾固酮（free testosterone）的特性？
  a: 僅佔總睾固酮 0.5~2%；未與結合蛋白結合；重阻訓可急性增加；年齡↑則游離T反應↓
  tag: Anabolic
- q: SHBG（性荷爾蒙結合球蛋白）的特殊功能？
  a: 不只是載體，可與膜受器結合啟動cAMP途徑；本身具有生物活性；對睾固酮和雌激素的結合各有影響
  tag: Anabolic
- q: 哪些訓練條件可急性升高男性血中睾固酮？
  a: ①大肌群動作（深蹲/硬舉/爆發上舉）②重負荷（85~95% 1RM）③多組數或多動作（高容量）④短休息（30~60秒）
  tag: Anabolic
- q: 女性對阻力訓練的睾固酮反應有何特點？
  a: 血中濃度增加幅度極小或無顯著增加；但雄激素受器上調速度更快（約1小時）→對少量睾固酮高度敏感利用
  tag: Anabolic
- q: 睾固酮對神經系統有哪些影響？
  a: 與神經元受器結合→增加神經傳導物質→改變結構蛋白→提升神經肌肉力量潛力；長期訓練可增強神經適應
  tag: Anabolic
- q: 高強度阻力訓練後睾固酮增加是適應的必要條件嗎？
  a: 並非必要條件——低量高強度訓練可上調受器數量而不改變血中T，同樣產生適應；增加代表合成代謝訊號更強
  tag: Anabolic
- q: 睾固酮長期訓練適應：靜息值 vs 運動誘發反應？
  a: 長期重訓可小幅↑靜息睾固酮（LH/FSH同步上升）；菁英舉重選手2年訓練後靜息T有小幅增加
  tag: Anabolic
- q: 22 kDa GH 的來源與主要特性？
  a: 191胺基酸多肽；由前腦垂體somatotroph產生；血中最常被測量（RIA/ELISA）；但非生物活性GH的主體
  tag: GH Superfamily
- q: 生物活性GH（bioactive GH）vs 22kDa GH的差異？
  a: 生物活性GH為聚合體（aggregates）形式，濃度遠高於22kDa單體；才是真正作用主體；無明顯日夜節律
  tag: GH Superfamily
- q: GH超家族的主要生理功能（列出6個以上）？
  a: ↑蛋白合成、↑胺基酸轉運、↑脂解、↓葡萄糖利用、↓糖原合成、↑膠原蛋白合成、促軟骨生長、增強免疫細胞功能
  tag: GH Superfamily
- q: 哪種訓練條件可最大化22kDa GH反應？
  a: 高強度（10RM）＋多組（3組）＋短休息（1分鐘）；關鍵驅動因素：高乳酸＋低pH（氫離子濃度增加）
  tag: GH Superfamily
- q: 22kDa GH 的分泌模式？
  a: 脈衝式（pulsatile）分泌；夜間睡眠時濃度最高；運動可增加脈衝振幅與次數；受下視丘GhRH(+)/Somatostatin(-)調節
  tag: GH Superfamily
- q: 女性22kDa GH的特點？
  a: 靜息濃度高於男性（分泌頻率與振幅更高）；月經週期各期反應不同；生物活性GH隨阻力訓練增加靜息值
  tag: GH Superfamily
- q: 訓練適應對22kDa GH運動反應的影響？
  a: 訓練後對同等絕對強度的22kDa GH急性反應↓（效率提升）；生物活性GH靜息值可能↑；長期適應仍在研究
  tag: GH Superfamily
- q: GH如何與IGF互動促進肌肉合成？
  a: GH刺激肝臟產生IGF-I；也可直接刺激肌肉細胞自分泌IGF-I；兩者協同促進蛋白質合成與組織修復
  tag: GH Superfamily
- q: IGF-I的結構與主要來源？
  a: 70胺基酸多肽；主要由肝臟在GH刺激後產生（需8~24h）；也由肌肉細胞在機械刺激下局部合成
  tag: IGF Axis
- q: IGF結合蛋白（IGFBPs）的功能？
  a: 至少6種（IGFBP-1~IGFBP-6）；調節IGF受器可及性；延長IGF半衰期；各IGFBP對運動反應獨立
  tag: IGF Axis
- q: Mechano Growth Factor (MGF) 是什麼？
  a: 機械刺激（過負荷/伸展）→肌肉細胞大量合成局部IGF-I；以自分泌方式作用於肌肉；可能是肌肉IGF最重要途徑
  tag: IGF Axis
- q: IGF-I的運動反應與初始濃度的關係？
  a: 初始濃度低→運動後IGF↑；初始濃度高→變化不明顯或無增加；說明個體起始狀態影響反應模式
  tag: IGF Axis
- q: 為何循環IGF-I不能完全代表肌肉局部IGF信號？
  a: 循環IGF-I增加不一定與間質液（ISF）或肌肉內IGF-I相關；局部自分泌/旁分泌可能才是最關鍵作用途徑
  tag: IGF Axis
- q: 哪些因素影響IGF-I的調控與分泌？
  a: ①GH（主要刺激）②甲狀腺素和睾固酮③營養狀態（蛋白質攝入、正氮平衡）④訓練前後補充蛋白質+碳水化合物
  tag: IGF Axis
- q: 皮質醇的來源與分泌調節？
  a: 腎上腺皮質分泌的糖皮質素；由前腦垂體釋放的ACTH刺激分泌；有強烈日夜節律（早晨最高）
  tag: Catabolic
- q: 皮質醇的五大分解代謝作用？
  a: ①胺基酸→糖質新生②↑蛋白水解酶③↓蛋白質合成④抑制糖原合成⑤抑制B/T免疫細胞功能
  tag: Catabolic
- q: 急性皮質醇升高 vs 慢性高皮質醇的差異？
  a: 急性：協助去除受損蛋白，促進肌肉重塑（有益）；慢性高濃度：肌肉萎縮、力量↓、免疫抑制（有害）
  tag: Catabolic
- q: 皮質醇的日夜節律對研究的影響？
  a: 早晨濃度最高，全天下降；比較不同研究時必須控制採血時間點；否則數據無可比性
  tag: Catabolic
- q: T/C比值（睾固酮/皮質醇）的意義與限制？
  a: 理論上反映合成/分解代謝平衡；皮質醇>800 nmol/L提示可能過度訓練；但實際預測力有限，受多種因素干擾
  tag: Catabolic
- q: 皮質醇對不同肌纖維的影響差異？
  a: Type II纖維：蛋白質含量多→分解代謝效果更強；Type I纖維：主要靠減少降解（非增加合成）來達到肥大
  tag: Catabolic
- q: 哪種訓練條件會顯著升高皮質醇？
  a: 大訓練量＋大肌群＋短休息；與GH升高的訓練條件相似（高代謝壓力）；過高持續負荷導致慢性升高
  tag: Catabolic
- q: 兒茶酚胺的主要成員及來源？
  a: 腎上腺素（主）＋正腎上腺素＋多巴胺；由腎上腺髓質（medulla）在神經系統直接刺激下快速分泌
  tag: Fight-or-Flight
- q: 兒茶酚胺在阻力訓練中的六大生理功能？
  a: ↑力量（中樞機制）·↑肌肉收縮速率·↑血壓·↑能量可用性·↑肌肉血流（血管擴張）·促進睾固酮等荷爾蒙分泌
  tag: Fight-or-Flight
- q: 腎上腺素與乳酸的關係？
  a: 腎上腺素濃度與乳酸濃度相關；高強度短休息訓練後NE/E/多巴胺可維持升高至恢復期後5分鐘
  tag: Fight-or-Flight
- q: 什麼是腎上腺素能耗竭（adrenergic exhaustion）？
  a: 訓練不變化→持續高應激→腎上腺髓質持續參與→腎上腺素釋放能力下降；週期化訓練是預防關鍵
  tag: Fight-or-Flight
- q: Proenkephalins/Peptide F 的功能？
  a: 腎上腺髓質分泌的前腦啡肽片段；增強免疫細胞功能；對運動後恢復至關重要；不同於腎上腺素的分解代謝角色
  tag: Fight-or-Flight
- q: 兒茶酚胺的長期訓練適應？
  a: 長期重訓→最大運動時腎上腺素分泌能力↑；對單次特定訓練的腎上腺素急性反應可能↓（效率提升）
  tag: Fight-or-Flight
- q: 受器上調（upregulation）vs 下調（downregulation）的定義？
  a: 上調：受器數量↑或結合敏感性↑（如1~2次重訓即可↑雄激素受器）；下調：過度刺激或功能已達上限→受器反應性↓
  tag: Receptor
- q: 雄激素受器的運動相關特性？
  a: 睾固酮的受器；訓練影響受器最大數量（非結合敏感性）；女性受器上調速度更快（約1小時）；對現有T更充分利用
  tag: Receptor
- q: 為何血中睾固酮濃度不等於細胞內效果？
  a: 血中濃度只代表一個曝露機率指標；真正效果取決於受器狀態（數量、敏感性、親和力）；受器才是關鍵
  tag: Receptor
- q: mTOR途徑與皮質醇/睾固酮的競爭關係？
  a: 皮質醇可阻斷Akt/mTOR信號通路（mRNA翻譯起始）；睾固酮反效果，兩者在DNA元件競爭結合；合成/分解代謝平衡
  tag: Receptor
- q: 訓練前攝取蛋白質+碳水化合物對受器有何影響？
  a: 可上調骨骼肌雄激素受器含量；強化睾固酮利用效率；也可提升IGF-I；建議訓練前後補充
  tag: Receptor
- q: 最大化22kDa GH的訓練處方要素？
  a: ①高強度（10RM）②三組以上③短休息（1分鐘）④訓練前後補充蛋白質+碳水化合物；目標：產生高乳酸＋低pH
  tag: Program Design
- q: 週期化訓練對荷爾蒙系統的重要性？
  a: 不變化訓練→持續高應激→腎上腺耗竭+慢性高皮質醇→過度訓練；週期化（輕重交替、完全休息）是保護機制
  tag: Program Design
- q: 急性訓練變項對荷爾蒙反應的影響為何重要？
  a: 強度、組數、動作順序、休息時間、動作選擇→決定荷爾蒙分泌模式；不同組合產生不同合成/分解代謝環境
  tag: Program Design
- q: 募集原則在荷爾蒙適應中的意義？
  a: 只有被神經活化的肌纖維才接受荷爾蒙適應；募集越多運動單位→全肌肉重塑範圍越大→全身性荷爾蒙反應更強
  tag: Program Design
- q: 過度訓練的荷爾蒙警示指標有哪些？
  a: ①皮質醇持續>800 nmol/L②T/C比↓③靜息睾固酮↓④IGF-I無增加⑤免疫抑制⑥肌肉持續萎縮/力量↓
  tag: Program Design
