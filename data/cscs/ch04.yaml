  - id: ch04.receptor-mechanisms.i05
    q: 神經活化影響
    a:
    - 神經活化肌纖維 → 增加肌肉受器結合親和力
    - 訓練水平影響神經-內分泌整合方式
    detail: 神經活化「打開」了受器對荷爾蒙的敏感性；這說明只有被神經系統主動徵召的肌纖維才能受益於荷爾蒙信號，輕度訓練無法觸及 Type II 纖維，荷爾蒙適應的範圍也因此受限
