  - id: ch04.program-design.i08
    q: 營養時機
    a:
    - 訓練前後補充蛋白質＋碳水化合物可：① 提升 IGF-I ② 上調骨骼肌雄激素受器 ③ 優化合成代謝環境
    detail: 訓練前後補充的作用機制是多層的：碳水化合物↓皮質醇（維持血糖，減少糖質新生需求）、蛋白質提供胺基酸底物（IGF-I 合成原料）、兩者共同放大訓練誘發的合成代謝視窗
