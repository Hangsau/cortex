  - id: ch04.program-design.i04
    q: 週期化原則
    a:
    - 訓練必須變化（週期化）才能讓腎上腺恢復
    - 避免慢性高皮質醇
    - 防止非功能性超量訓練（nonfunctional overreaching）
    detail: GAS 三階段直接支撐週期化邏輯：適應發生在「壓力→移除壓力→超補償」的循環中；永遠在「警戒期」的訓練者永遠無法到達抵抗期的正向適應
    terms:
