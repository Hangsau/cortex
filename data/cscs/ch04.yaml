  - id: ch04.program-design.i03
    q: 優化腎上腺反應
    a:
    - 大訓練量＋大肌群＋短休息 → 腎上腺應激
    - 但必須週期化：輪換長短休息、低量日、完全休息日
    - 目的：防止腎上腺枯竭，降低腎上腺皮質的慢性皮質醇分泌
    detail: 腎上腺系統存在「使用後必須恢復」的機制：皮質（皮質醇）和髓質（兒茶酚胺）都有容量上限；持續高應激不給恢復，兩套系統都會耗竭，進入非功能性超量訓練
