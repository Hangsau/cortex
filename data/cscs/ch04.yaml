    q: 上調 Upregulation
    a:
    - 受器數量↑ 或 結合敏感性↑
    - 僅 1-2 次重訓即可增加雄激素受器數量
    - 使現有睾固酮可被更充分利用
    detail: 只需 1-2 次訓練即可上調受器，說明受器適應比肌肉結構適應快得多；這可能是「初次訓練者快速反應」的機制之一——相同的睾固酮濃度在更多受器的條件下效果被放大
    terms:
