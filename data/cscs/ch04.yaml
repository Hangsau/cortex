    - ch05.hypertrophy.i02
    locator: Primary Anabolic Hormones > Insulin-Like Growth Factors
  - id: ch04.igf.i02
    q: IGF 結合蛋白
    a:
    - 至少 6 種（IGFBP-1 ～ IGFBP-6）
    - IGFBP-1 和 IGFBP-3 研究最多
    - 調節 IGF 受器可及性；各有獨立生物活性，且對運動的反應各自獨立
    detail: IGFBP 也作為 IGF 在循環中的儲存庫，受器有位置時才釋放 IGF，延長 IGF 的有效時間
    terms:
    - IGF
    - IGFBP
    numbers:
    - v: 6
      unit: 種
      of: 已知 IGF 結合蛋白（IGFBP）的最少種數
    concepts:
    - hormone
    - structure
    related: []
    locator: Primary Anabolic Hormones > Insulin-Like Growth Factors
  - id: ch04.igf.i03
    q: Mechano Growth Factor
    a:
    - 機械刺激（過負荷、伸展）→ 肌肉細胞大量合成 IGF-I
    - 以自分泌方式作用（不進血液）
    - 被認為是肌肉 IGF 最重要的作用途徑
    detail: MGF 的自分泌模式意義深遠：肌肉細胞既是應激感測器也是促合成訊號的製造者，不需等待遠端肝臟訊號；這解釋了為何局部肌肉過負荷比全身代謝壓力對肌肥大更重要
    terms:
    - IGF
    - mechano-growth-factor
    numbers: []
    concepts:
    - hormone
    related:
    - ch05.endocrine-adaptations.i03
    - ch05.hypertrophy.i04
    locator: Primary Anabolic Hormones > Insulin-Like Growth Factors > Exercise Responses of Insulin-Like Growth Factors
  - id: ch04.igf.i04
    q: IGF 運動反應
    a:
    - 初始濃度低（約 10-20 nmol/L）→ 運動後 IGF-I 更容易升高
    - 初始濃度高（約 35-45 nmol/L）→ 變化不明顯或不升高
    - 肝臟在 GH 刺激後需 8-24 小時才產生並釋放 IGF-I
    - 急性增加可能來自脂肪細胞及肌肉細胞的破壞（非肝臟釋放）
    detail: 初始濃度的天花板效應（ceiling effect）對訓練處方有直接意義：靜息 IGF-I 已高的運動員，透過訓練進一步拉高循環 IGF-I 的空間有限，局部 MGF 途徑更可能是其適應動力
    terms:
    - IGF
    numbers:
    - v: 8-24
      unit: 小時
      of: 肝臟在 GH 刺激後產生並釋放 IGF-I 所需時間
    - v: 10-20
      unit: nmol/L
      of: IGF-I 靜息濃度低值（低於此值則運動後更易升高）
    - v: 35-45
      unit: nmol/L
      of: IGF-I 靜息濃度高值（達此值則運動後不易再升高）
    concepts:
    - hormone
    - measurement
    related:
    - ch05.endocrine-adaptations.i05
    locator: Primary Anabolic Hormones > Insulin-Like Growth Factors > Exercise Responses of Insulin-Like Growth Factors
  - id: ch04.igf.i05
    q: 營養的重要性
    a:
    - IGF-I 對急性熱量攝入極敏感
    - 訓練前後補充蛋白質＋碳水化合物可顯著提升 IGF-I
    detail: IGF-I 對熱量狀態的敏感性強調了「訓練後補充的時機窗」：若不在訓練後及時補充，即使訓練刺激充分，肝臟也可能因缺乏底物而降低 IGF-I 的產出
    terms:
    - IGF
    numbers: []
    concepts:
    - hormone
    - nutrition
    related:
    - ch09.protein.i03
    - ch10.post-competition.i04
    locator: Primary Anabolic Hormones > Insulin-Like Growth Factors > Exercise Responses of Insulin-Like Growth Factors
  - id: ch04.igf.i06
    q: 局部 vs 循環 IGF
    a:
    - 循環中 IGF-I 增加不一定反映肌肉間質液（ISF）或肌内 IGF-I 信號
    - 局部自分泌/旁分泌途徑（mechano growth factor）可能才是肌肉 IGF 最關鍵的作用途徑
    detail: 研究方法論限制：抽血只能測循環 IGF，但最重要的 IGF 訊號（MGF）完全不進血液；用血液指標評估訓練後肌肉 IGF 狀態，可能完全誤讀局部的合成代謝信號強度
    terms:
    - IGF
    - mechano-growth-factor
    numbers: []
