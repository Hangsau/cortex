    - measurement
    related:
    - ch12.validity.i01
    locator: Primary Anabolic Hormones > Insulin-Like Growth Factors > Exercise Responses of Insulin-Like Growth Factors
  - id: ch04.igf.i07
    q: 女性 IGF 適應
    a:
    - 阻力訓練可增加女性總 IGF-I
    - 降低 IGFBP-1 → 更多游離 IGF 可與受器結合
    - 顯示運動模式特異性適應
    detail: IGFBP-1 下降是隱藏的合成代謝放大機制：總 IGF-I 即使只增加少量，游離（活性）IGF-I 因 IGFBP-1 減少而大幅增加；女性透過此途徑彌補了睾固酮不足的部分
    terms:
    - IGF
    - IGFBP
    numbers: []
    concepts:
    - hormone
    - adaptation
    - population
    related:
    - ch07.female-physiology.i08
    locator: Primary Anabolic Hormones > Insulin-Like Growth Factors > Training Adaptations of Insulin-Like Growth Factors
  - id: ch04.igf.i08
    q: 調控因子
    a:
    - GH 為主要刺激（刺激肝臟合成 IGF-I）
    - 甲狀腺素和睾固酮也參與 IGF 合成調節
    - 營養狀態（蛋白質攝入、正氮平衡、急性熱量攝取）是關鍵調節變項
    detail: IGF-I 是多種合成代謝信號的交匯點：GH、睾固酮、甲狀腺素各自獨立調控 IGF-I；任何一條路徑受阻（如能量不足抑制 GH 效果）都會降低整體 IGF-I 輸出
