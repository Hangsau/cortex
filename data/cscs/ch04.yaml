    - ch05.hypertrophy.i01
    - ch09.fat.i06
    locator: Primary Anabolic Hormones > Growth Hormone
  - id: ch04.growth-hormone.i04
    q: 刺激 22 kDa GH 分泌的訓練條件
    a:
    - 高乳酸＋低 pH（氫離子濃度↑）是主要代謝刺激
    - 10RM（重）＋ 3 組每動作＋短休息（1 分鐘）= 最大 GH 反應
    - 長休息（>3 分鐘）GH 反應↓
    detail: 1 分鐘 vs 3 分鐘休息差異顯著；不達強度閾值（如使用 28% 7RM 的低強度）GH 不增加
    terms:
    - growth-hormone
    - repetition-maximum
    numbers:
    - v: 1
      unit: 分鐘
      of: 最大化 22 kDa GH 反應的組間休息時間（研究比較 1 分鐘 vs 3 分鐘）
