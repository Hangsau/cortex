    - 結合蛋白本身具有生物活性
    - 不只是運送工具
    detail: SHBG 打破了「結合=不活躍、游離=活躍」的簡單二分法；SHBG 結合的睾固酮可透過 SHBG-膜受器-cAMP 路徑發揮效應，說明「有效睾固酮」量比「游離睾固酮」量更難單純用一個數字衡量
