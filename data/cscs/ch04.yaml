    - ch17.rest-periods.i03
    - ch17.training-volume.i05
    locator: Primary Anabolic Hormones > Growth Hormone > Growth Hormone Responses to Stress
  - id: ch04.growth-hormone.i05
    q: 女性 GH
    a:
    - 女性 22 kDa GH 靜息濃度高於男性（分泌頻率與振幅更高）
    - 月經週期各期反應不同；使用荷爾蒙避孕藥可增加 GH 反應
    - 生物活性 GH 隨阻力訓練增加靜息值（不同於 22 kDa 形式）
    detail: 女性 22 kDa GH 靜息值更高，顯示其下視丘-垂體軸的脈衝模式不同於男性；對訓練的適應（生物活性 GH 靜息值↑）也可能是女性肌肉恢復與肌肥大的重要機制
    terms:
    - diurnal-variation
    numbers: []
    concepts:
    - hormone
    - population
    related:
    - ch07.female-physiology.i08
    locator: Primary Anabolic Hormones > Growth Hormone > Growth Hormone Responses in Women
  - id: ch04.growth-hormone.i06
    q: 分泌模式
    a:
    - 脈衝式分泌（pulsatile）；夜間睡眠時 22 kDa 最高
    - 運動可增加脈衝振幅與次數
    - 生物活性 GH 無明顯日夜節律
    detail: 脈衝式分泌的意義：受器長期暴露於連續信號會發生下調（desensitization），脈衝模式可維持受器敏感性；睡眠品質不佳直接壓制夜間 GH 脈衝，影響恢復
    terms:
    - diurnal-variation
    numbers: []
    concepts:
    - hormone
    related: []
    locator: Primary Anabolic Hormones > Growth Hormone
  - id: ch04.growth-hormone.i07
    q: 訓練適應
    a:
    - 訓練後對同等絕對強度的 22 kDa GH 運動誘發反應↓（效率提升）
    - 生物活性 GH 靜息值可能因訓練↑（尤其女性）
    - 長期適應機制仍在研究中
    detail: 22 kDa 急性反應↓是效率的標誌，不是適應變差；訓練者的相對強度對 GH 刺激更小，需提高絕對強度才能維持同等 GH 反應——週期化增加負荷的部分依據在此
    terms:
