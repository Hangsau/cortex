  - id: ch04.testosterone.i04
    q: 男性反應
    a:
    - 大肌群運動（如硬舉，非臥推）後血中睾固酮顯著↑
    - 早晨濃度最高，但運動可在日夜節律任一時點誘發增加
    - 需多組、重負荷、足夠肌肉量才觀察到明顯增加
    detail: 硬舉 vs 臥推的差異說明肌肉量是荷爾蒙反應的重要決定因素：更大的肌肉量→更大的代謝需求→更強的荷爾蒙訊號；上肢孤立動作難以觸發足夠的全身荷爾蒙反應
