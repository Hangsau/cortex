  - id: ch04.growth-hormone.i03
    q: 主要生理功能
    a:
    - ↑蛋白質合成·↑胺基酸轉運·↑脂肪酸利用（脂解）
    - ↓葡萄糖利用·↓糖原合成
    - ↑膠原蛋白合成·促軟骨生長
    - ↑腎臟血漿流量·↑氮/鈉/鉀/磷留存
    - 增強免疫細胞功能
    detail: GH 的代謝邏輯是「以脂肪為燃料、保存蛋白質與糖」：同時促進脂解（↑游離脂肪酸作為燃料）與抑制葡萄糖利用，為肌肉蛋白質合成創造正氮平衡環境
    terms:
    - growth-hormone
    numbers: []
    concepts:
    - hormone
    related:
