id: ch04
weight: 4
title: Ch.4 內分泌對阻力訓練的反應
topics:
- id: catecholamines
  title: 兒茶酚胺 Catecholamines
  desc: ''
  tag: Fight-or-Flight
  items:
  - id: ch04.catecholamines.i01
    q: 來源
    a:
    - 腎上腺髓質（medulla）直接由神經系統刺激後分泌
    - 主要成員：腎上腺素（Epinephrine）為主，加正腎上腺素、多巴胺
    detail: 腎上腺髓質屬於交感神經節後細胞，受神經直接支配，因此兒茶酚胺的分泌不需要荷爾蒙中繼——這使其成為最快速的內分泌反應之一，可在運動開始後數秒內升高
    terms:
    - catecholamine
    - epinephrine
    - norepinephrine
    - dopamine
    numbers: []
    concepts:
    - hormone
    related: []
    locator: Adrenal Hormones > Catecholamines
  - id: ch04.catecholamines.i02
    q: 生理功能
    a:
    - ↑力量輸出（中樞機制）
    - ↑肌肉收縮速率
    - ↑血壓
    - ↑能量可用性
    - ↑肌肉血流（血管擴張）
    - 促進其他合成荷爾蒙（如睾固酮）的分泌
    detail: 腎上腺素是最早響應阻力訓練的內分泌機制之一；刺激其他合成荷爾蒙分泌，形成協同合成代謝環境
    terms:
    - catecholamine
    - epinephrine
    - norepinephrine
    numbers: []
    concepts:
    - hormone
    related:
    - ch03.glycolysis.i07
    - ch06.acute-cardiovascular.i08
    - ch19.core-concepts.i06
    locator: Adrenal Hormones > Catecholamines > Role of Catecholamines
  - id: ch04.catecholamines.i03
    q: 腎上腺素與乳酸
    a:
    - 腎上腺素濃度與乳酸濃度相關
    - 高強度短休息（10RM，10-60 秒休息，10 個動作，3 組）後，NE/E/多巴胺維持升高至恢復後 5 分鐘
    detail: 乳酸（以及伴隨的 H⁺ 升高）可能透過代謝感應神經刺激腎上腺髓質；因此高乳酸訓練（短休息、高容量）是最有效的兒茶酚胺刺激模式
    terms:
    - catecholamine
    - epinephrine
    - norepinephrine
    - dopamine
    numbers:
    - v: 5
      unit: 分鐘
      of: 高強度短休息訓練後兒茶酚胺維持升高的恢復期時間
    concepts:
    - hormone
    related:
    - ch03.lactate.i02
    - ch05.endocrine-adaptations.i02
    - ch17.rest-periods.i04
    locator: Adrenal Hormones > Catecholamines > Role of Catecholamines
  - id: ch04.catecholamines.i04
    q: 力量維持
    a:
    - 訓練前更高的兒茶酚胺釋放（預期性反應）→ 整個訓練過程中更能維持力量輸出
    detail: 心理備戰會觸發預期性腎上腺素反應，是訓練前暖身程序能增強表現的生理基礎
    terms:
    - catecholamine
    - epinephrine
    numbers: []
    concepts:
    - hormone
    related:
    - ch14.ramp-protocol.i03
    - ch18.program-design.i07
    - ch08.arousal-anxiety-stress.i01
    locator: Adrenal Hormones > Catecholamines > Role of Catecholamines
  - id: ch04.catecholamines.i05
    q: 腎上腺素能耗竭
    a:
    - 訓練不變化 → 持續高應激 → 腎上腺髓質持續參與 → 最終導致腎上腺素能耗竭（adrenergic exhaustion）
    - 週期化訓練（長休息、低量日、完全休息日）是預防關鍵
    detail: 同樣的持續壓力也會導致慢性皮質醇升高，雙重傷害免疫系統與蛋白質代謝
    terms:
    - catecholamine
    - adrenergic-exhaustion
    numbers: []
    concepts:
    - hormone
    - periodization
    related:
    - ch05.overtraining.i01
    - ch21.gas-theory.i06
    locator: Adrenal Hormones > Catecholamines > Role of Catecholamines
  - id: ch04.catecholamines.i06
    q: Proenkephalins
    a:
    - 腎上腺髓質也分泌前腦啡肽片段（Proenkephalin fragments），如 Peptide F
    - 增強免疫細胞功能
    - 對運動後恢復至關重要
    detail: Peptide F 是腎上腺髓質分泌的恢復機制，與兒茶酚胺的壓力/分解代謝角色不同，說明腎上腺髓質同時支援即時壓力反應與後續恢復
    terms:
    - proenkephalin
    numbers: []
    concepts:
    - hormone
    related:
    - ch05.hypertrophy.i03
    locator: Adrenal Hormones > Catecholamines
  - id: ch04.catecholamines.i07
    q: 訓練適應
    a:
    - 長期重訓 → 最大運動時腎上腺素分泌能力↑
    - 對特定次最大訓練（如單次臥推）的腎上腺素急性反應可能↓（效率提升）
    detail: 兩種方向並存：最大能力擴大，但習慣化後日常訓練刺激需求減少，反映系統效率提升
    terms:
    - catecholamine
    - epinephrine
    numbers: []
    concepts:
    - hormone
    - adaptation
    related:
    - ch05.endocrine-adaptations.i05
    locator: Adrenal Hormones > Catecholamines > Training Adaptations of Catecholamines
  - id: ch04.catecholamines.i08
    q: 胺類特性
    a:
    - 由酪氨酸（tyrosine）衍生合成
    - 與胜肽荷爾蒙類似：與膜受器結合，透過二級訊使傳遞訊號
    - 但不受直接負回饋調節（與胜肽荷爾蒙的關鍵區別）
    detail: 不受負回饋調節使兒茶酚胺能快速且大量釋放，適合緊急「戰或逃」情境
    terms:
    - catecholamine
    - secondary-messenger
    numbers: []
    concepts:
    - hormone
    - structure
    related:
    - ch04.endocrinology-basics.i07
    locator: Categories of Hormones > Amine Hormone Interactions

- id: cortisol
  title: 皮質醇 Cortisol
  desc: ''
  tag: Catabolic
  items:
  - id: ch04.cortisol.i01
    q: 來源與分類
    a:
    - 腎上腺皮質分泌的糖皮質素（glucocorticoid）
    - 由前腦垂體釋放的 ACTH 刺激分泌
    - 人體主要糖皮質素
    detail: 皮質醇是 HPA 軸（下視丘→垂體→腎上腺皮質）的最終效應激素；ACTH 分泌受 CRH 調控、又受皮質醇負回饋抑制，形成穩定的調節迴路
    terms:
    - cortisol
    - glucocorticoid
    - ACTH
    numbers: []
    concepts:
    - hormone
    related:
    - ch05.overtraining.i08
    - ch08.arousal-anxiety-stress.i07
    locator: Adrenal Hormones > Cortisol
  - id: ch04.cortisol.i02
    q: 分解代謝作用
    a:
    - ① 胺基酸→碳水化合物（糖質新生）
    - ② ↑蛋白水解酶（加速蛋白質降解）
    - ③ ↓蛋白質合成
    - ④ 抑制糖原合成
    - ⑤ 抑制免疫細胞（B/T cells）功能
    detail: 皮質醇本質是醣類代謝訊號激素：肌糖原偏低時，蛋白質（胺基酸）成為維持血糖的替代原料
    terms:
    - cortisol
    - glucocorticoid
    - proteolytic-enzyme
    numbers: []
    concepts:
    - hormone
    related:
    - ch03.substrate.i06
    - ch05.hypertrophy.i01
    - ch06.connective-endocrine.i06
    locator: Adrenal Hormones > Cortisol > Role of Cortisol
  - id: ch04.cortisol.i03
    q: 日夜節律
    a:
    - 早晨濃度最高，全天下降
    - 測量時必須記錄採血時間點
    - 比較不同研究需控制日夜節律這個混淆變項
    detail: 皮質醇的日夜振幅可達 2-3 倍，遠大於一般訓練誘發的急性變化；若不控制採血時間，訓練效應會淹沒在自然波動中
    terms:
    - cortisol
    - diurnal-variation
    numbers: []
    concepts:
    - hormone
    - measurement
    related:
    - ch13.test-administration.i02
    locator: Adrenal Hormones > Cortisol
  - id: ch04.cortisol.i04
    q: 急性 vs 慢性
    a:
    - 急性↑：協助去除受損蛋白質，是肌肉重塑過程的一部分（有益）
    - 慢性高濃度：負面，導致氮流失、肌肉萎縮、力量↓
    detail: 急性皮質醇的分解作用清除受損蛋白，為新蛋白的合成騰出空間；但持續高濃度意味著清除超過合成
    terms:
    - cortisol
    numbers: []
    concepts:
    - hormone
    - adaptation
    related:
    - ch05.hypertrophy.i03
    - ch05.overtraining.i03
    - ch22.fibroblastic-phase.i01
    locator: Adrenal Hormones > Cortisol > Resistance Exercise Responses of Cortisol
  - id: ch04.cortisol.i05
    q: T/C 比值
    a:
    - 睾固酮/皮質醇比值：評估合成/分解代謝狀態的指標
    - 皮質醇>800 nmol/L 可能提示過度訓練問題
    detail: T/C 比值在概念上吸引人，但實際預測力有限：皮質醇有多重生理角色，單一指標難以全面反映訓練狀態
    terms:
    - cortisol
    - testosterone
    numbers:
    - v: 800
      unit: nmol/L
      of: 皮質醇過度訓練警示門檻（大於此值提示可能過度訓練）
    concepts:
    - hormone
    - measurement
    related:
    - ch05.overtraining.i08
    - ch06.overtraining.i06
    locator: Adrenal Hormones > Cortisol > Resistance Exercise Responses of Cortisol
  - id: ch04.cortisol.i06
    q: 升高皮質醇的訓練條件
    a:
    - 大訓練量＋大肌群＋短休息 → 皮質醇↑
    - 與 GH 升高的訓練條件相似（高代謝壓力）；急性升高有助重塑，慢性升高有害
    detail: 大訓練量的代謝壓力最大化了 HPA 軸的啟動，皮質醇分泌量與 ACTH 釋放量正相關；GH 和皮質醇共享相同訓練刺激，說明身體對應激反應並非單一路徑
    terms:
    - cortisol
    numbers: []
    concepts:
    - hormone
    - program-design
    related:
    - ch05.endocrine-adaptations.i02
    - ch17.training-volume.i05
    - ch17.rest-periods.i03
    locator: Adrenal Hormones > Cortisol > Resistance Exercise Responses of Cortisol
  - id: ch04.cortisol.i07
    q: 肌纖維差異
    a:
    - 對 Type II 纖維分解代謝效果更強（Type II 纖維蛋白質含量更多）
    - Type I 纖維達到肥大主要靠減少降解（而非大幅增加合成）
    detail: 力量訓練的肌肥大主要發生在 Type II 纖維，而這些纖維恰好對皮質醇的分解代謝更敏感，因此控制慢性皮質醇對力量增益尤為關鍵
    terms:
    - cortisol
    numbers: []
    concepts:
    - hormone
    - fiber-type
    related:
    - ch05.hypertrophy.i06
    - ch06.chronic-muscular.i03
    locator: Adrenal Hormones > Cortisol > Role of Cortisol
  - id: ch04.cortisol.i08
    q: 免疫系統影響
    a:
    - 使免疫細胞（B/T cells）失活
    - 運動後免疫抑制的重要原因之一
    - B 細胞的皮質醇受器在運動前即已上調（預期性反應）；男性效果強於女性
    detail: 皮質醇對免疫系統的抑制作用影響骨骼肌的恢復與重塑，因為 T/B cells 參與組織修復的炎症反應
    terms:
    - cortisol
    numbers: []
    concepts:
    - hormone
    - adaptation
    related:
    - ch05.hypertrophy.i03
    - ch22.inflammatory-phase.i03
    locator: Adrenal Hormones > Cortisol > Role of Cortisol

- id: endocrinology-basics
  title: 荷爾蒙基礎概念 Endocrinology
  desc: ''
  tag: Endocrinology
  items:
  - id: ch04.endocrinology-basics.i01
    q: 荷爾蒙定義
    a:
    - 化學訊號分子
    - 由內分泌腺合成、儲存、分泌入血液
    - 作用於含有特異性受器的目標組織
    detail: 「含有特異性受器」是荷爾蒙作用的前提——同樣的荷爾蒙對沒有受器的細胞毫無作用；受器的存在與數量決定了哪些組織能「聽到」訊號
    terms: []
    numbers: []
    concepts:
    - hormone
    related:
    - ch04.receptor-mechanisms.i01
    locator: Synthesis, Storage, and Secretion of Hormones
  - id: ch04.endocrinology-basics.i02
    q: 三大類別
    a:
    - ① 類固醇（脂溶性，擴散進細胞，作用於胞質受器）
    - ② 胜肽/多肽（水溶性，作用於膜受器，透過二級訊使）
    - ③ 胺類（酪氨酸或色氨酸衍生，作用於膜受器，不受直接負回饋）
    detail: 分類決定了作用速度與持久性：胜肽（分鐘級）快於類固醇（小時至天級）；類固醇直接改變基因表達，持效更長，但不可逆程度也更高
    terms:
    - secondary-messenger
    numbers: []
    concepts:
    - hormone
    - structure
    related:
    - ch04.endocrinology-basics.i06
    - ch04.endocrinology-basics.i07
    locator: Categories of Hormones
  - id: ch04.endocrinology-basics.i03
    q: 分泌途徑
    a:
    - 內分泌（入血循環，作用遠端組織）
    - 胞內分泌（intracrine，細胞內自身作用，不入血）
    - 自分泌（autocrine，作用自身細胞膜受器）
    - 旁分泌（paracrine，作用鄰近細胞）
    detail: IGF-I 可在機械刺激後於肌肉細胞局部合成並自分泌，無須進入血液循環，是肌肉 IGF 的主要作用途徑
    terms:
    - insulin-like-growth-factor-i
    - intracrine
    - autocrine
    - paracrine
    numbers: []
    concepts:
    - hormone
    related:
    - ch04.igf.i03
    locator: Synthesis, Storage, and Secretion of Hormones
  - id: ch04.endocrinology-basics.i04
    q: 結合蛋白
    a:
    - 血液中攜帶荷爾蒙（同時攜帶胜肽與類固醇）
    - 延長半衰期；防止降解
    - 多數荷爾蒙必須「游離」才有活性（free hormone hypothesis）
    detail: SHBG 是特例：本身可與膜受器結合啟動 cAMP 途徑，說明部分結合蛋白自身即具生物活性，不只是運送工具
    terms:
    - SHBG
    numbers: []
    concepts:
    - hormone
    - structure
    related:
    - ch04.testosterone.i03
    locator: Synthesis, Storage, and Secretion of Hormones
  - id: ch04.endocrinology-basics.i05
    q: 鎖鑰理論
    a:
    - 受器＝鎖；荷爾蒙＝鑰匙；每種荷爾蒙對應特異受器
    - 但現知互動比鎖鑰更複雜：交叉反應（cross-reactivity）、異位結合（allosteric binding）
    detail: 鎖鑰理論的訓練意義：每種荷爾蒙只能作用於有相應受器的細胞；受器不足時即使荷爾蒙充足也無效，說明增加受器數量（upregulation）本身就是重要的適應目標
    terms:
    - lock-key-theory
    numbers: []
    concepts:
    - hormone
    - structure
    related:
    - ch04.receptor-mechanisms.i01
    locator: Role of Receptors in Mediating Hormonal Changes
  - id: ch04.endocrinology-basics.i06
    q: 類固醇作用機制
    a:
    - 擴散穿過肌膜（sarcolemma）→ 與細胞質受器結合形成 H-RC
    - 兩個 H-RC 二聚（dimerize）→ 移入細胞核 → 作用於 DNA 上特定強化子（enhancer）
    - 轉錄特定 mRNA → 核糖體翻譯成蛋白質
    detail: 二聚是類固醇基因調控的關鍵步驟；mRNA 製造只是第一步，翻譯完成才有蛋白質
    terms:
    - H-RC
    numbers: []
    concepts:
    - hormone
    - structure
    related:
    - ch11.anabolic-steroids.i01
    locator: Categories of Hormones > Steroid Hormone Interactions
  - id: ch04.endocrinology-basics.i07
    q: 胜肽作用機制
    a:
    - 水溶性，無法穿透細胞膜 → 與膜受器結合
    - 活化二級訊使（如 cAMP、JAK/STAT）→ 訊號傳導至細胞核或代謝途徑
    detail: 二級訊使機制的優點是訊號放大：一個荷爾蒙-受器結合可活化數百至數千個 cAMP 分子，產生遠大於刺激量的效應，使微量荷爾蒙即可觸發顯著細胞反應
    terms:
    - secondary-messenger
    numbers: []
    concepts:
    - hormone
    - structure
    related:
    - ch04.catecholamines.i08
    locator: Categories of Hormones > Polypeptide Hormone Interactions
  - id: ch04.endocrinology-basics.i08
    q: 一般適應症候群（GAS）
    a:
    - Selye 提出；以腎上腺對壓力的反應為基礎
    - ① 警戒反應（功能暫時下降）→ ② 抵抗期（適應，功能超越基準）→ ③ 耗竭期（壓力未移除持續下去）
    - 及時移除訓練刺激（週期化）是避免耗竭、實現適應的關鍵
    detail: 前東歐運動科學家發現運動員的訓練反應模式與 GAS 相似，進而建立週期化訓練的理論框架
    terms:
    - GAS
    numbers: []
    concepts:
    - hormone
    - periodization
    related:
    - ch21.gas-theory.i01
    - ch21.gas-theory.i06
    - ch05.overtraining.i01
    locator: Introduction

- id: growth-hormone
  title: 生長激素 Growth Hormone
  desc: ''
  tag: GH Superfamily
  items:
  - id: ch04.growth-hormone.i01
    q: 22 kDa 單體
    a:
    - 191 胺基酸多肽
    - 由前腦垂體 somatotroph 產生（Band 1：較小分子量形式）
    - 最常被 RIA/ELISA 測量的形式
    - 但非生物活性 GH 的主體（聚合體才是）
    detail: 測量技術長期只能偵測 22 kDa 形式（最穩定、最豐富），導致文獻低估了真實 GH 生物活性；高分子量聚合體才是訓練後肌肉合成代謝的主要訊號載體
    terms:
    - growth-hormone
    - radioimmunoassay
    - enzyme-linked-immunosorbent-assay
    numbers:
    - v: 191
      unit: 胺基酸
      of: 22 kDa GH 單體（monomer）的胜肽鏈長度
    concepts:
    - hormone
    - structure
    related: []
    locator: Primary Anabolic Hormones > Growth Hormone
  - id: ch04.growth-hormone.i02
    q: GH 超家族
    a:
    - 含多種 splice variants 及聚合體（aggregates，多個 GH 單體以二硫鍵相連）
    - 生物活性 GH（aggregate forms）濃度遠高於 22 kDa 單體
    - 聚合體才是真正的生物功能主體；無明顯日夜節律
    detail: RIA/ELISA 只偵測 22 kDa，長期低估了真實 GH 的生物活性；高分子量聚合體與不同受器結合，靶組織也不同
    terms:
    - growth-hormone
    - radioimmunoassay
    - enzyme-linked-immunosorbent-assay
