    q: 來源與功能
    a:
    - 男：主要來自睾丸；女：卵巢＋腎上腺
    - 促進蛋白質合成（胺基酸併入蛋白質）
    - 抑制蛋白質分解
    - 主要合成代謝荷爾蒙
    detail: 睾固酮的核心功能是氮留存：促進合成＋抑制分解雙管齊下，使蛋白質淨積累；女性儘管濃度低得多，但透過更快的受器上調仍能充分利用有限的睾固酮
