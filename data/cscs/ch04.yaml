  - id: ch04.receptor-mechanisms.i02
    q: 下調 Downregulation
    a:
    - 過度刺激（如胰島素抵抗）或已達肌肉最大尺寸 → 受器反應性↓
    - 荷爾蒙無法有效與受器結合，細胞代謝無法被改變
    detail: 下調是身體對過度刺激的自我保護：當細胞已達生長上限，繼續接受合成代謝信號只是浪費資源；這也說明為何極端肥大的肌肉對進一步的訓練反應遞減
