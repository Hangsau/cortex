  - id: ch04.program-design.i05
    q: 急性變項的重要性
    a:
    - 強度·組數·動作順序·休息時間·動作選擇 → 決定荷爾蒙反應的樣式與幅度
    - 不同組合產生不同合成/分解代謝環境
    detail: 每個急性變項都是一個可調節的「荷爾蒙旋鈕」：長休息偏向神經適應（低代謝壓力），短休息偏向代謝適應（高 GH/皮質醇）；目標不同，旋鈕設定不同
    terms:
