    - 進一步強化睾固酮利用效率
    detail: 訓練前補充的作用不只是能量：蛋白質提供胺基酸底物（促受器蛋白合成），碳水化合物穩定血糖（降低皮質醇需求）；兩者共同為受器創造有利的上調環境
