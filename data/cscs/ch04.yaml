    - 睾固酮效果相反（對抗皮質醇）
    - 兩者在 DNA 元件上競爭結合位點
    detail: mTOR 是蛋白質合成的主開關；皮質醇與睾固酮在 DNA 同一位點的競爭說明，T/C 比值不只是一個監測指標，而是反映了細胞核內真實的合成/分解代謝力量競爭
