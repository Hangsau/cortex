    locator: Primary Anabolic Hormones > Growth Hormone > Training Adaptations of Growth Hormone
  - id: ch04.growth-hormone.i08
    q: 調節機制
    a:
    - 下視丘 GHRH（+）→ 促進前腦垂體釋放 GH
    - 生長激素抑制素 Somatostatin（−）→ 抑制 GH 釋放
    - 複雜神經內分泌回饋迴路
    detail: 運動時 GHRH 釋放增加而 Somatostatin 減少，雙重機制共同放大 GH 脈衝；訓練強度、睡眠、營養狀態都能改變這個推-拉平衡
