- id: igf
  title: 類胰島素生長因子 IGF
  desc: ''
  tag: IGF Axis
  items:
  - id: ch04.igf.i01
    q: IGF-I 基本
    a:
    - 70 胺基酸多肽（IGF-II 為 67 胺基酸）
    - 主要由肝臟在 GH 刺激後產生（需 8-24 小時）
    - 促進蛋白質合成的核心角色
    - 肌肉受機械刺激（過負荷、伸展）時也可局部合成
    detail: 肝臟合成需 8-24 小時的延遲說明：運動後立即出現的血液 IGF-I 急性增加不可能來自肝臟，而是來自脂肪細胞與肌肉細胞破壞釋放；局部肌肉 IGF（機械刺激）才是即時合成代謝訊號
    terms:
    - IGF
    numbers:
    - v: 70
      unit: 胺基酸
      of: IGF-I 的胜肽鏈長度
    concepts:
    - hormone
