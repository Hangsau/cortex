    q: 雄激素受器
    a:
    - 睾固酮的胞內受器
    - 訓練主要影響受器最大數量（非結合敏感性）
    - 女性受器上調速度更快（約 1 小時）→ 對少量睾固酮高度敏感利用
    detail: 女性更快的受器上調速度（~1 小時）補償了較低的睾固酮絕對量；受器效率的差異說明訓練適應並非單純靠荷爾蒙濃度決定，受器側的適應同等重要
