    - T/C 比↓；負向蛋白代謝平衡；免疫抑制；肌肉萎縮/力量↓
    detail: 沒有單一指標足以確診過度訓練；皮質醇 800 nmol/L 只是輔助門檻，需結合 T/C 比值趨勢、表現退步、主觀疲勞感等多指標評估才能做出判斷
