    locator: Introduction
  - id: ch04.program-design.i06
    q: 募集原則
    a:
    - 只有被神經活化的肌纖維才接受荷爾蒙適應（size principle）
    - 募集越多運動單位 → 全肌肉重塑範圍越大 → 生理系統支援需求越高
    detail: 這是深蹲/硬舉產生更大全身荷爾蒙反應的機制基礎：大肌群動作招募更多運動單位，相應地需要更強的合成代謝支援，因此誘發更大的睾固酮與 GH 分泌
