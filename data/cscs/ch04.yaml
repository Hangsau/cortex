    q: 受器 vs 血中濃度
    a:
    - 血中荷爾蒙濃度 ≠ 細胞效果
    - 真正效果取決於受器狀態（數量、敏感性、親和力）
    - 低量高強度訓練（1-2RM，5-7 分鐘休息）可不改變血中 T 但增加受器數量
    detail: 這是對「必須讓睾固酮大幅升高才有效」直觀假設的挑戰：低量高強度（神經為主的訓練）可不改變循環 T 但依然產生合成代謝適應，受器上調是關鍵機制
