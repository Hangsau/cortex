    - 多數研究無顯著急性血中↑；若增加也很小，有時只見於游離睾固酮
    - 雄激素受器上調速度更快（約 1 小時）→ 對少量睾固酮高度敏感利用
    detail: 女性的睾固酮策略是「精打細算」而非「大量堆積」：更快的受器上調（約 1 小時）意味著有限的睾固酮可被更高效地利用；加上 IGF-I 與生長激素途徑的補充，女性肌肥大潛力不因低 T 而大幅受限
