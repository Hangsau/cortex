id: ch04
weight: 4
title: Ch.4 內分泌對阻力訓練的反應
topics:
- id: catecholamines
  title: 兒茶酚胺 Catecholamines
  desc: ''
  tag: Fight-or-Flight
  items:
  - id: ch04.catecholamines.i01
    q: 來源
    a:
    - 腎上腺髓質（medulla）直接由神經刺激分泌
    - 腎上腺素（Epinephrine）為主 + 正腎上腺素 + 多巴胺
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.catecholamines.i02
    q: 生理功能
    a:
    - ↑力量輸出（中樞）·↑肌肉收縮速率·↑血壓·↑能量可用性·↑肌肉血流（血管擴張）·促進其他合成荷爾蒙分泌
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.catecholamines.i03
    q: 腎上腺素與乳酸
    a:
    - 腎上腺素濃度與乳酸相關
    - 高強度短休息訓練後 NE/E/DA 維持升高 5 分鐘進入恢復期
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.catecholamines.i04
    q: 力量維持
    a:
    - 賽前/訓練前更高兒茶酚胺釋放 → 整個訓練過程中更能維持力量輸出
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.catecholamines.i05
    q: 腎上腺素枯竭
    a:
    - 訓練不變化 → 持續應激 → 腎上腺髓質持續參與 → 最終導致腎上腺素能耗竭（adrenergic exhaustion）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.catecholamines.i06
    q: Proenkephalins
    a:
    - 腎上腺髓質也分泌 Peptide F 等前腦啡肽片段
    - 增強免疫細胞功能
    - 對運動後恢復至關重要
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.catecholamines.i07
    q: 訓練適應
    a:
    - 長期重訓 → 最大運動時腎上腺素分泌能力↑
    - 對單次訓練的腎上腺素反應可能↓（效率提升）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.catecholamines.i08
    q: 胺類特性
    a:
    - 由酪氨酸（tyrosine）合成
    - 與胜肽荷爾蒙類似與膜受器結合作用
    - 但不像胜肽荷爾蒙受到直接負回饋調節
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: cortisol
  title: 皮質醇 Cortisol
  desc: ''
  tag: Catabolic
  items:
  - id: ch04.cortisol.i01
    q: 來源與分類
    a:
    - 腎上腺皮質分泌的糖皮質素（glucocorticoid）
    - 由 ACTH（前腦垂體）刺激分泌
    - 人體主要糖皮質素
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.cortisol.i02
    q: 分解代謝作用
    a:
    - ① 胺基酸→碳水化合物（糖質新生）② ↑蛋白水解酶 ③ ↓蛋白質合成 ④ 抑制糖原合成 ⑤ 抑制免疫細胞功能
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.cortisol.i03
    q: 日夜節律
    a:
    - 早晨濃度最高，全天下降
    - 測量時必須記錄採血時間點
    - 比較研究需控制日夜節律變數
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.cortisol.i04
    q: 急性 vs 慢性
    a:
    - 急性↑：協助去除受損蛋白質，是肌肉重塑過程的一部分
    - 慢性高濃度：負面，導致肌肉萎縮、力量↓
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.cortisol.i05
    q: T/C 比值
    a:
    - 睾固酮/皮質醇比值：評估合成/分解代謝狀態的指標
    - 皮質醇>800 nmol/L 可能代表過度訓練
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.cortisol.i06
    q: 升高皮質醇的訓練條件
    a:
    - 大訓練量 + 大肌群 + 短休息 → 皮質醇↑
    - 與 GH 升高的訓練條件相似（高代謝壓力）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.cortisol.i07
    q: 肌纖維差異
    a:
    - 對 Type II 纖維分解代謝效果更強（蛋白質含量更多）
    - Type I 纖維主要靠減少降解來達到肥大
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.cortisol.i08
    q: 免疫系統影響
    a:
    - 使免疫細胞（B/T cells）失活
    - 運動後免疫抑制的部分原因
    - 影響骨骼肌的恢復與重塑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: endocrinology-basics
  title: 荷爾蒙基礎概念 Endocrinology
  desc: ''
  tag: Endocrinology
  items:
  - id: ch04.endocrinology-basics.i01
    q: 荷爾蒙定義
    a:
    - 化學訊號分子
    - 由內分泌腺合成、儲存、分泌入血液
    - 作用於含有特異性受器的目標組織
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.endocrinology-basics.i02
    q: 三大類別
    a:
    - ① 類固醇（脂溶性，擴散進細胞）② 胜肽/多肽（水溶性，作用於膜受器）③ 胺類（酪氨酸或色氨酸衍生）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.endocrinology-basics.i03
    q: 分泌途徑
    a:
    - 內分泌（入血）· 旁分泌（鄰近細胞）· 自分泌（作用自身）· 胞內分泌（細胞內）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.endocrinology-basics.i04
    q: 結合蛋白
    a:
    - 血液中攜帶荷爾蒙
    - 延長半衰期
    - 防止降解
    - 多數荷爾蒙必須「游離」才有活性（free hormone hypothesis）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.endocrinology-basics.i05
    q: 鎖鑰理論
    a:
    - 受器=鎖
    - 荷爾蒙=鑰匙
    - 每種荷爾蒙對應特異受器
    - 但現知互動比鎖鑰更複雜（交叉反應、異位結合）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.endocrinology-basics.i06
    q: 類固醇作用機制
    a:
    - 擴散穿過細胞膜 → 與細胞質受器結合 → H-RC 移入細胞核 → 與 DNA 結合 → 轉錄 mRNA → 蛋白質合成
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.endocrinology-basics.i07
    q: 胜肽作用機制
    a:
    - 與膜受器結合 → 活化二級訊使（cAMP、JAK/STAT 等）→ 訊號傳導至細胞核或代謝途徑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.endocrinology-basics.i08
    q: 一般適應症候群
    a:
    - Selye 提出
    - 壓力 → 警戒反應（功能下降）→ 抵抗期（適應，功能超越基準）→ 週期化理論基礎
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: growth-hormone
  title: 生長激素 Growth Hormone
  desc: ''
  tag: GH Superfamily
  items:
  - id: ch04.growth-hormone.i01
    q: 22 kDa 單體
    a:
    - 191 胺基酸多肽
    - 由前腦垂體 somatotroph 產生
    - 最常被測量的形式（RIA/ELISA）
    - 但非唯一形式
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.growth-hormone.i02
    q: GH 超家族
    a:
    - 含多種 splice variants 及聚合體（aggregates）
    - 生物活性 GH 濃度遠高於 22kDa 單體
    - 超家族才是真正作用主體
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.growth-hormone.i03
    q: 主要生理功能
    a:
    - ↑蛋白合成·↑胺基酸轉運·↑脂肪利用(脂解)·↓葡萄糖利用·↓糖原合成·↑膠原蛋白合成·促軟骨生長
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.growth-hormone.i04
    q: 刺激 GH 分泌的訓練條件
    a:
    - 高乳酸 + 低 pH 是主要刺激
    - 10RM（重）+ 短休息（1分鐘）+ 多組數 = 最大 GH 反應
    - 長休息（>3分）GH 反應↓
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.growth-hormone.i05
    q: 女性 GH
    a:
    - 女性 22kDa GH 靜息濃度高於男性（分泌頻率與振幅更高）
    - 月經週期各期反應不同
    - 生物活性GH隨訓練增加靜息值
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.growth-hormone.i06
    q: 分泌模式
    a:
    - 脈衝式分泌（pulsatile）
    - 夜間睡眠時 22kDa 最高
    - 運動可增加脈衝振幅與次數
    - 生物活性 GH 無明顯日夜節律
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.growth-hormone.i07
    q: 訓練適應
    a:
    - 訓練後對同等絕對強度的 22kDa GH 反應↓（效率提升）
    - 生物活性GH靜息值可能↑
    - 長期適應仍在研究中
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.growth-hormone.i08
    q: 調節機制
    a:
    - 下視丘 GhRH（+）→ 促進 GH
    - 生長激素抑制素 Somatostatin（−）→ 抑制 GH
    - 複雜神經內分泌回饋迴路
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: igf
  title: 類胰島素生長因子 IGF
  desc: ''
  tag: IGF Axis
  items:
  - id: ch04.igf.i01
    q: IGF-I 基本
    a:
    - 70 胺基酸多肽
    - 主要由肝臟在 GH 刺激後產生
    - 促進蛋白質合成的核心角色
    - 也存在肌肉局部合成
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.igf.i02
    q: IGF 結合蛋白
    a:
    - 至少 6 種（IGFBP-1 ~ IGFBP-6）
    - IGFBP-1 和 IGFBP-3 研究最多
    - 調節 IGF 的受器可及性
    - 各有獨立生物活性
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.igf.i03
    q: Mechano Growth Factor
    a:
    - 機械刺激（過負荷、伸展）→ 肌肉細胞大量合成 IGF-I
    - 以自分泌方式作用
    - 可能是肌肉 IGF 最重要作用途徑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.igf.i04
    q: IGF 運動反應
    a:
    - 初始濃度低 → 運動後 IGF↑
    - 初始濃度高 → 變化不明顯
    - 需 8~24h 才從肝臟產生
    - 急性增加可能來自細胞破壞
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.igf.i05
    q: 營養的重要性
    a:
    - IGF-I 對急性熱量攝入極敏感
    - 訓練前後補充蛋白質+碳水化合物可顯著提升 IGF-I
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.igf.i06
    q: 局部 vs 循環 IGF
    a:
    - 循環中 IGF-I 增加不一定反映肌肉局部 IGF 信號
    - 間質液（ISF）中的 IGF 可能更直接影響肌肉
    - 不同生物隔室
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.igf.i07
    q: 女性 IGF 適應
    a:
    - 阻力訓練可增加女性總 IGF-I
    - 降低 IGFBP-1 → 更多 IGF 可與受器結合
    - 顯示運動模式特異性適應
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.igf.i08
    q: 調控因子
    a:
    - GH 為主要刺激
    - 甲狀腺素和睾固酮也參與
    - 營養狀態（正氮平衡、蛋白質攝入）是關鍵調節變項
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: program-design
  title: 訓練處方操控策略 Program Design
  desc: ''
  tag: Program Design
  items:
  - id: ch04.program-design.i01
    q: 最大化睾固酮
    a:
    - ① 大肌群動作（深蹲/硬舉/爆發上舉）② 85~95% 1RM ③ 多組數 or 多動作（高容量）④ 短休息 30~60秒
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.program-design.i02
    q: 最大化 GH（22kDa）
    a:
    - ① 高強度（10RM）+ 三組 ② 短休息（1分鐘）③ 訓練前後補充蛋白質+碳水化合物
    - 關鍵：產生高乳酸+低pH
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.program-design.i03
    q: 優化腎上腺反應
    a:
    - 大訓練量+大肌群+短休息 → 腎上腺應激
    - 但必須週期化：長休息/低量/完全休息日 → 預防腎上腺枯竭
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.program-design.i04
    q: 週期化原則
    a:
    - 訓練必須變化（週期化）才能讓腎上腺恢復
    - 避免慢性高皮質醇
    - 防止非功能性超量訓練（overreaching）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.program-design.i05
    q: 急性變項的重要性
    a:
    - 強度·組數·動作順序·休息時間·動作選擇 → 決定荷爾蒙反應模式
    - 不同組合產生不同合成/分解代謝環境
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.program-design.i06
    q: 募集原則
    a:
    - 只有被活化的肌纖維才接受荷爾蒙適應
    - 募集越多運動單位 → 全肌肉重塑範圍越大
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.program-design.i07
    q: 過度訓練警示
    a:
    - 皮質醇持續>800 nmol/L → 過度訓練警示
    - T/C比↓
    - 負向蛋白代謝平衡
    - 免疫抑制
    - 肌肉萎縮
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.program-design.i08
    q: 營養時機
    a:
    - 訓練前後補充蛋白質+碳水化合物可：① 提升 IGF-I ② 上調雄激素受器 ③ 優化合成代謝環境
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: receptor-mechanisms
  title: 受器機制與調節 Receptor Mechanisms
  desc: ''
  tag: Receptor
  items:
  - id: ch04.receptor-mechanisms.i01
    q: 上調 Upregulation
    a:
    - 受器數量↑ 或 結合敏感性↑
    - 1~2 次重訓即可增加雄激素受器數量
    - 使現有睾固酮可被更充分利用
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.receptor-mechanisms.i02
    q: 下調 Downregulation
    a:
    - 過度刺激（如胰島素抵抗）或已達肌肉最大尺寸 → 受器反應性↓
    - 荷爾蒙無法有效與受器結合
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.receptor-mechanisms.i03
    q: 雄激素受器
    a:
    - 睾固酮的受器
    - 訓練影響最大數量（非結合敏感性）
    - 女性受器上調速度更快（約1小時）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch04.receptor-mechanisms.i04
    q: 受器 vs 血中濃度
    a:
    - 血中荷爾蒙濃度 ≠ 細胞效果
    - 重要的是受器狀態
    - 低量訓練可能不改變血中T但增加受器數量
