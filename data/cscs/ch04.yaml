- id: program-design
  title: 訓練處方操控策略 Program Design
  desc: ''
  tag: Program Design
  items:
  - id: ch04.program-design.i01
    q: 最大化睾固酮
    a:
    - ① 大肌群動作（深蹲/硬舉/爆發上舉）
    - ② 重負荷（85-95% 1RM）
    - ③ 多組數 or 多動作（中至高容量）
    - ④ 短休息（30-60 秒）
    detail: 四項條件的機制邏輯：大肌群→大量肌纖維募集；重負荷→最大化神經-內分泌整合；高容量＋短休息→代謝壓力＋乳酸↑→刺激睾丸 Leydig 細胞分泌睾固酮
    terms:
    - testosterone
