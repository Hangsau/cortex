# 考點軸：CSCS 考試的 domain 與章節對映
#
# 這是第三條閱讀動線的座標（章節軸 → 概念軸 → 考點軸）。用途是讓複習與出題
# 能照真實考試權重配比，而不是照章節數平均分配。
#
# 不放章節標題：標題的真相源是 chNN.yaml，這裡只放 id。同「分類標籤一律從
# 資料讀」那條鐵則——抄一份副本，章節改名這裡就無聲漂移。
#
# id 用 section 前綴（sf1 / pa1）而不是連號 d1–d7：官方 DCO 的 domain 編號在
# 兩個 section 各自從 1 起算，拉平成 d1–d7 是本檔前一版自己發明的，對照官方
# 文件時會錯位。2026-09-11 一手核對時一併改掉。

meta:
  source: NSCA CSCS Detailed Content Outline（2023 年 JTA 產出）
  dco_effective: 2025-07-01
  retrieved: 2026-09-11
  verification: verified
  source_files:
    - resources/raw/pdf/inbox/nsca-certification-handbook.pdf（p.7 權重表、p.41–47 DCO）
    - resources/raw/pdf/inbox/certified-strength-and-conditioning-specialist-job-task-analysis-summary-2025.pdf
  passing: 兩個 section 分開計，各需 scaled score 70 以上
  note: >-
    2025-07-01 起生效的新版 DCO，與舊版的差異是 domain 重排，加上 PA 的
    「Testing, Ongoing Monitoring, and Data Evaluation」改名為「Program
    Implementation」並新增 3.A「教練帶訓練課」這項任務。本檔已是新版。

sections:
  - id: sf
    name_en: Scientific Foundations
    name_zh: 科學基礎
    scored: 80
    unscored: 15
    minutes: 90
  - id: pa
    name_en: Practical/Applied
    name_zh: 實務應用
    scored: 110
    unscored: 15
    minutes: 150

# cognitive 是官方 DCO 直接給的認知層級配題，不是估計值。它比 scored 更能決定
# 怎麼讀：pa1 只有 2 題純記憶、42 題要應用或分析，把 ch17–ch22 的事實背熟只值
# 2 分；pa4 反過來是 11/16 記憶題，背了就拿得到。
domains:
  - id: sf1-exercise-science
    section: sf
    name_en: Exercise Science
    name_zh: 運動科學
    weight_pct: 60
    scored: 48
    cognitive: {recall: 15, application: 26, analysis: 7}
    chapters: [ch01, ch02, ch03, ch04, ch05, ch06, ch07]

  - id: sf2-sport-psychology
    section: sf
    name_en: Sports Psychology
    name_zh: 運動心理學
    weight_pct: 25
    scored: 20
    cognitive: {recall: 6, application: 12, analysis: 2}
    chapters: [ch08]

  - id: sf3-nutrition
    section: sf
    name_en: Nutrition
    name_zh: 營養
    weight_pct: 15
    scored: 12
    cognitive: {recall: 3, application: 6, analysis: 3}
    chapters: [ch09, ch10, ch11]

  - id: pa1-program-design
    section: pa
    name_en: Program Design
    name_zh: 課程設計
    weight_pct: 40
    scored: 44
    cognitive: {recall: 2, application: 21, analysis: 21}
    chapters: [ch17, ch18, ch19, ch20, ch21, ch22]
    also: [ch12, ch13]
    also_note: >-
      1.A 需求分析含「選擇評估項目」與「分析並對標評估結果」，那是 ch12／ch13 的
      內容；但它在這裡是課表設計的上游步驟，不是測驗實施本身。

  - id: pa2-exercise-technique
    section: pa
    name_en: Exercise Technique
    name_zh: 動作技術
    weight_pct: 25
    scored: 28
    cognitive: {recall: 5, application: 15, analysis: 8}
    chapters: [ch14, ch15, ch16]
    also: [ch18, ch19, ch20]
    also_note: >-
      2.A 動作準備＝ch14；2.C 速度敏捷與增強式技術＝ch18／ch19；2.D 能量系統
      發展的帶課＝ch20。這三章的技術段歸此 domain，課程設計段歸 pa1。

  - id: pa3-program-implementation
    section: pa
    name_en: Program Implementation
    name_zh: 課表執行
    weight_pct: 20
    scored: 22
    cognitive: {recall: 3, application: 12, analysis: 7}
    chapters: [ch12, ch13]
    also: [ch08]
    also_note: >-
      新版 3.A「教練帶訓練課」考動作學習與回饋（內在／外在提示、示範、進階與
      退階、課後 debrief），那段內容在 ch08 而不在 ch12／ch13。舊版這個 domain
      叫 Testing and Evaluation，只有測驗；換名之後 ch08 是必讀的一半。

  - id: pa4-organization
    section: pa
    name_en: Organization and Administration
    name_zh: 組織與行政
    weight_pct: 15
    scored: 16
    cognitive: {recall: 11, application: 5, analysis: 0}
    chapters: [ch23, ch24]

# 讀法：content_share 是該 domain 佔 1557 條知識單位的比例，exam_share 是佔
# 190 題計分題的比例。兩者落差就是讀書時間該往哪邊挪的訊號——內容多但考得少
# 的章節不必逐條精讀，反之要加練。實際數字由 cscs_check.py 現算，不寫死在這裡。
