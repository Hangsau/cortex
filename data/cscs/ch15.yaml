id: ch15
weight: 15
title: Ch.15 自由重量與器械訓練技術
topics:
- id: body-positioning
  title: 穩定身體與肢體姿勢
  desc: ''
  tag: 技術基礎
  items:
  - id: ch15.body-positioning.i01
    q: 站姿動作的穩定基準
    a:
    - 雙腳通常略寬於髖寬，腳跟與前腳掌都接觸地面。
    detail: 這是站姿動作「通常」需要的穩定位置，不是適用每一項動作的唯一站距。
    terms: []
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch17.exercise-selection.i08
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
  - id: ch15.body-positioning.i02
    q: 五點身體接觸姿勢（five-point body contact position）包含什麼？
    a:
    - 頭部穩固接觸椅面或靠墊；肩膀與上背穩固且均勻接觸椅面或靠墊。
    - 臀部均勻坐在椅面或座椅；左右腳都平放地面。
    detail: 適用於在臥椅上做的坐姿或仰臥動作，並須在開始及整個動作過程維持。
    terms: [five-point-body-contact-position]
    numbers:
    - v: 5
      unit: 點
      of: 臥椅坐姿或仰臥動作的身體接觸點
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch13.max-strength.i02
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
  - id: ch15.body-positioning.i03
    q: 五點身體接觸的作用
    a:
    - 從起始到各動作階段維持五點身體接觸，可促進最大穩定性與脊椎支撐。
    detail: 書中將其列為穩定與脊椎支撐的做法，未把它說成保證避免受傷。
    terms: [five-point-body-contact-position]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch13.max-strength.i07
    - ch15.body-positioning.i02
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
  - id: ch15.body-positioning.i04
    q: 有旋轉軸的器械如何對位？
    a:
    - 凸輪、滑輪或槓桿式器械要讓主要關節與器械旋轉軸對齊。
    - 可藉由調整座椅、踝部或手臂滾墊、腿部、胸部或背部靠墊達成。
    detail: 對位是為了安全及最佳執行；不同器械所需調整的部件不同。
    terms: []
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.resistance-sources.i07
    - ch16.machine-vs-freeweight.i02
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
  - id: ch15.body-positioning.i05
    q: 腿伸展器械的對位範例
    a:
    - 做腿（膝）伸展前，調整踝部滾墊上下位置與靠背前後位置，使膝關節對齊器械軸。
    detail: 這是書中用來說明「主要關節對齊器械軸」的具體範例。
    terms: []
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i05
    - ch22.kinetic-chain.i06
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
  - id: ch15.body-positioning.i06
    q: 全關節活動範圍（range of motion, ROM）的原則與界線
    a:
    - 完成全 ROM 可最大化動作價值，並維持或改善柔軟度。
    - 理想上應模擬參與關節的全 ROM；但弓步的後腳膝關節未必可達成，深蹲也不建議用椎間關節追求全 ROM。
    detail: 「全範圍」不是不分關節地做到極限；書中明列無法達成與不建議的例外。
    terms: [range-of-motion]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch14.flexibility-factors.i01
    - ch22.kinetic-chain.i08
    locator: 'Fundamentals of Exercise Technique > Range of Motion and Speed'
  - id: ch15.body-positioning.i07
    q: 一般與爆發力動作的速度原則
    a:
    - 緩慢而受控的反覆較可能做到全 ROM。
    - 做高爆發或快速舉重動作時，應在全程保持控制與正確姿勢下，盡力將槓鈴加速到最大速度。
    detail: 書中把最大加速限定在爆發或快速舉重動作，並沒有要求所有阻力訓練都快速執行。
    terms: [range-of-motion, power-exercises]
    numbers: []
    concepts: [technique]
    related:
    - ch02.size-strength.i06
    - ch17.exercise-selection.i04
    - ch15.body-positioning.i06
    locator: 'Fundamentals of Exercise Technique > Range of Motion and Speed'
  - id: ch15.body-positioning.i08
    q: 為何先建立穩定姿勢？
    a:
    - 穩定位置有助於在動作中維持正確身體排列，使肌肉與關節承受適當應力。
    detail: 此處的效果同時指向安全與最佳表現，不是僅為了讓動作看起來整齊。
    terms: []
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch16.general-guidelines.i01
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
- id: breathing
  title: 呼吸技術
  desc: ''
  tag: 呼吸
  items:
  - id: ch15.breathing.i01
    q: 黏滯點（sticking point）是什麼？
    a:
    - 指一次反覆中最費力的動作位置，通常在離心階段轉為向心階段後不久。
    detail: 「通常」是書中的限定，並非每個動作的黏滯點都發生在相同關節角度。
    terms: [sticking-point]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.strength-factors.i05
    - ch17.load-repetitions.i04
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.breathing.i02
    q: 多數阻力動作的呼吸時機
    a:
    - 通常應在通過向心階段的黏滯點時吐氣，並在反覆中較不費力的階段吸氣。
    detail: 書中以「通常」表述，接著把這個策略套用於大多數阻力訓練動作。
    terms: [sticking-point]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch16.general-guidelines.i02
    - ch15.breathing.i01
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.breathing.i03
    q: 二頭肌彎舉的呼吸範例
    a:
    - 二頭肌彎舉的黏滯點約在上舉階段中途，亦即向心肘屈曲時；此處吐氣。
    - 槓鈴降回起始位置時吸氣。
    detail: 此例是用來說明呼吸策略，不是把所有動作的黏滯點定為「上舉中途」。
    terms: [sticking-point]
    numbers: []
    concepts: [technique]
    related:
    - ch02.levers.i06
    - ch17.exercise-selection.i02
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.breathing.i04
    q: 瓦氏動作（Valsalva maneuver）在書中的定義
    a:
    - 對閉合聲門呼氣，並收縮腹部與肋廓肌肉。
    - 此組合在下軀幹形成液體剛性區、在上軀幹形成空氣剛性區；書中稱為「液體球」。
    detail: 這是教材對瓦氏動作的機制描述；它不是一般反覆的預設呼吸方式。
    terms: [valsalva]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i03
    - ch01.respiratory.expiration
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.breathing.i05
    q: 瓦氏動作的潛在益處
    a:
    - 可增加整個軀幹剛性，協助支撐脊椎並降低舉重時椎間盤相關的壓縮力。
    - 可協助維持正常腰椎前凸（亦稱中立脊椎）與直立上軀幹位置。
    detail: 教材把益處連結到脊椎排列與支撐，並非宣稱瓦氏動作在任何負荷下都適合。
    terms: [valsalva, neutral-spine]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch15.breathing.i04
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.breathing.i06
    q: 何時可考慮瓦氏動作？
    a:
    - 有阻力訓練經驗的運動員做高負荷結構性動作（structural exercises）時，可用它協助維持脊椎排列與支撐。
    detail: 結構性動作是指對脊椎加載並對其施加壓力的動作；書中限定為有經驗、阻力訓練良好的運動員與高負荷情境。
    terms: [valsalva, structural-exercise]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch17.exercise-selection.i03
    - ch07.older-adults-training.i07
    - ch15.breathing.i05
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.breathing.i07
    q: 瓦氏動作的副作用與憋氣上限
    a:
    - 腹內壓升高可能造成暈眩、定向感混亂、過高血壓及昏厥。
    - 憋氣應非常短暫，至多約一到二秒。
    detail: 即使為了脊椎支撐使用瓦氏動作，書中仍明確不建議延長憋氣期。
    terms: [valsalva]
    numbers:
    - v: 1–2
      unit: 秒
      of: 瓦氏動作的憋氣期上限
    concepts: [technique, safety]
    related:
    - ch07.older-adults-training.i07
    - ch12.safety.i02
    - ch15.breathing.i06
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.breathing.i08
    q: 為何不可延長瓦氏動作的憋氣？
    a:
    - 即使訓練良好的人，血壓也可能很快升到靜止值的三倍。
    detail: 這是教材對延長憋氣的警示，不代表每位運動員都必然達到這個值。
    terms: [valsalva]
    numbers:
    - v: 3
      unit: 倍
      of: 延長瓦氏動作憋氣時血壓可能相對於靜止值的程度
    concepts: [technique, safety]
    related:
    - ch01.cardiovascular.heart-rate
    - ch12.safety.i02
    - ch15.breathing.i07
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
- id: exercise-technique-fundamentals
  title: 動作技術基本原則
  desc: ''
  tag: 技術基礎
  items:
  - id: ch15.exercise-technique-fundamentals.i01
    q: 本章所稱安全有效的阻力訓練核心是什麼？
    a:
    - 核心是正確執行動作；正確執行與保護可促進免於傷害的訓練成果，且具時間效率。
    detail: 教材說的是促進免於傷害的成果，並沒有保證任何正確動作都不會受傷。
    terms: []
    numbers: []
    concepts: [technique, safety]
    related:
    - ch24.supervision.i04
    - ch17.exercise-selection.i08
    locator: 'Fundamentals of Exercise Technique'
  - id: ch15.exercise-technique-fundamentals.i02
    q: 阻力動作技術的共同構成
    a:
    - 多數自由重量與器械動作都涉及手部握法，以及最佳身體或肢體位置、動作範圍與速度、呼吸方式。
    - 有些動作另可能需要護腰帶或從地面舉起槓鈴的程序。
    detail: 這是章節對常見共同要素的總結，並不代表每項動作都使用全部要素。
    terms: [free-weight-exercises]
    numbers: []
    concepts: [technique]
    related:
    - ch17.exercise-selection.i08
    - ch02.resistance-sources.i02
    locator: 'Fundamentals of Exercise Technique'
  - id: ch15.exercise-technique-fundamentals.i03
    q: 本章動作清單的適用範圍
    a:
    - 清單呈現的是最常被接受的執行方式之指引。
    - 教材並未嘗試說明本章每個動作的所有正確變化。
    detail: 因此，清單應作為指引使用；不能據此推論未列出的變化必然錯誤。
    terms: []
    numbers: []
    concepts: [technique]
    related:
    - ch17.needs-analysis.i01
    - ch16.machine-vs-freeweight.i02
    locator: 'Fundamentals of Exercise Technique'
  - id: ch15.exercise-technique-fundamentals.i04
    q: 正確身體排列的功能
    a:
    - 建立穩定位置後，運動員較能在動作中維持正確身體排列，讓肌肉與關節承受適當應力。
    detail: 這條將「穩定位置」連到身體排列與受力，與單純追求姿勢外觀不同。
    terms: []
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch15.body-positioning.i08
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
  - id: ch15.exercise-technique-fundamentals.i05
    q: 器械與臥椅動作的技術起點
    a:
    - 器械上有時須調整座椅或阻力臂並扣緊束帶；臥椅坐姿或仰臥動作則須建立五點身體接觸。
    detail: 起始設定因器材不同而異；教材沒有把同一套設定套用到所有器械。
    terms: [five-point-body-contact-position]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch23.layout.i03
    - ch16.machine-vs-freeweight.i01
    locator: 'Fundamentals of Exercise Technique > Stable Body and Limb Positioning'
  - id: ch15.exercise-technique-fundamentals.i06
    q: 強迫反覆（forced repetitions）的安全定位
    a:
    - 保護者可協助完成強迫反覆（亦稱搭檔輔助反覆），也可激勵運動員。
    - 但保護者的首要責任仍是被保護運動員的安全。
    detail: 教材承認搭檔輔助的訓練價值，但特別強調它不能凌駕安全。
    terms: [forced-repetitions, partner-assisted-reps, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch24.supervision.i05
    - ch15.spotter-communication.i08
    locator: 'Spotting Free Weight Exercises'
  - id: ch15.exercise-technique-fundamentals.i07
    q: 強度與體能專業人員的技術教學責任
    a:
    - 應教導運動員阻力訓練動作技術、呼吸基本原則、護腰帶使用，以及何時、如何保護動作。
    detail: 教材把呼吸、護腰帶與保護都列為技術教學的一部分。
    terms: [weight-belt, spotter]
    numbers: []
    concepts: [technique, safety, professional]
    related:
    - ch24.personnel.i06
    - ch24.supervision.i04
    locator: 'Conclusion'
  - id: ch15.exercise-technique-fundamentals.i08
    q: 正確指導、監督與回饋的訓練效果
    a:
    - 正確指導配合品質良好的監督與持續回饋，可形成安全訓練環境及有效、適切的訓練刺激。
    detail: 教材把這三者合併描述；沒有把任一單獨因素說成足夠。
    terms: []
    numbers: []
    concepts: [technique, safety, professional]
    related:
    - ch24.supervision.i02
    - ch12.administration.i06
    locator: 'Conclusion'
- id: grips
  title: 握法類型與寬度
  desc: ''
  tag: 技術基礎
  items:
  - id: ch15.grips.i01
    q: 正手握（pronated grip）如何定位？
    a:
    - 掌心朝下、指節朝上，又稱 overhand grip。
    detail: 這是教材列出的兩種常見握法之一。
    terms: [pronated-grip]
    numbers: []
    concepts: [technique]
    related:
    - ch16.general-guidelines.i03
    - ch02.planes.i03
    locator: 'Fundamentals of Exercise Technique > Handgrips'
  - id: ch15.grips.i02
    q: 反手握（supinated grip）如何定位？
    a:
    - 掌心朝上、指節朝下，又稱 underhand grip。
    detail: 這是教材列出的兩種常見握法之一。
    terms: [supinated-grip]
    numbers: []
    concepts: [technique]
    related:
    - ch16.general-guidelines.i03
    - ch02.planes.i03
    locator: 'Fundamentals of Exercise Technique > Handgrips'
  - id: ch15.grips.i03
    q: 交替握（alternated grip）是什麼？
    a:
    - 一手採正手握，另一手採反手握。
    detail: 本章定義交替握，但沒有把它限定為或宣稱用於防止任何特定動作的槓鈴滾動。
    terms: [alternated-grip, pronated-grip, supinated-grip]
    numbers: []
    concepts: [technique]
    related:
    - ch16.general-guidelines.i03
    - ch17.exercise-selection.i01
    locator: 'Fundamentals of Exercise Technique > Handgrips'
  - id: ch15.grips.i04
    q: 勾握（hook grip）的結構與用途
    a:
    - 與正手握相似，但拇指位於食指和中指下方。
    - 通常用於需要較強握力的動作，例如抓舉等爆發力動作。
    detail: 教材以「通常」描述用途，未說它是所有爆發力動作的唯一握法。
    terms: [hook-grip, pronated-grip, power-exercises]
    numbers: []
    concepts: [technique]
    related:
    - ch16.general-guidelines.i03
    - ch17.exercise-selection.i04
    locator: 'Fundamentals of Exercise Technique > Handgrips'
  - id: ch15.grips.i05
    q: 閉合握與開放／假握（closed vs. open or false grip）的差異
    a:
    - 教材圖示中的各種握法，拇指環繞槓鈴時稱閉合握。
    - 拇指不環繞槓鈴時稱開放握或假握。
    detail: 原文在此只定義兩者，未對假握作出「危險」或「不建議」的判定。
    terms: [closed-grip, false-grip]
    numbers: []
    concepts: [technique]
    related:
    - ch16.general-guidelines.i03
    - ch24.facility.i05
    locator: 'Fundamentals of Exercise Technique > Handgrips'
  - id: ch15.grips.i06
    q: 中立握（neutral grip）如何定位？
    a:
    - 指節朝側方，類似握手的方向。
    - 可作為正手握或反手握的變式。
    detail: 教材以指節的方向描述中立握，而非以某一特定動作來定義它。
    terms: [neutral-grip, pronated-grip, supinated-grip]
    numbers: []
    concepts: [technique]
    related:
    - ch16.general-guidelines.i03
    - ch02.joint-biomechanics.i04
    locator: 'Fundamentals of Exercise Technique > Handgrips'
  - id: ch15.grips.i07
    q: 高翻握法（clean grip）與抓舉握法（snatch grip）
    a:
    - 兩者都是正手閉合握；高翻握略寬於肩寬，雙手位於膝外。
    - 抓舉握為寬握，可用握拳至對側肩，或肘至肘的距離估算。
    detail: 兩種握法常搭配勾握，以協助運動員取得更強的握力。
    terms: [clean-grip, snatch-grip, pronated-grip, closed-grip, hook-grip]
    numbers: []
    concepts: [technique]
    related:
    - ch17.exercise-selection.i04
    - ch15.grips.i04
    locator: 'Fundamentals of Exercise Technique > Handgrips'
  - id: ch15.grips.i08
    q: 握距（grip width）的類型與一般原則
    a:
    - 握距分為一般、寬與窄三類；對多數動作，雙手約置於肩寬。
    - 手的位置還應讓槓鈴保持平衡、均勻。
    detail: 「約肩寬」是多數動作的一般原則；實際握距仍依動作而定。
    terms: [grip-width]
    numbers:
    - v: 3
      unit: 類
      of: 教材列出的握距類型
    concepts: [technique]
    related:
    - ch02.levers.i06
    - ch17.exercise-selection.i05
    locator: 'Fundamentals of Exercise Technique > Handgrips'
- id: lower-body
  title: 下肢動作 Lower Body
  desc: ''
  tag: Lower Body
  items:
  - id: ch15.lower-body.i01
    q: 背蹲舉（Back Squat）的槓位與下蹲原則
    a:
    - 槓可採低槓位（橫在後三角肌、斜方肌中段）或高槓位（後三角肌上方、頸根處）。
    - 下蹲時保持中立脊椎、肘抬高、胸抬起，腳跟留地並讓膝蓋對齊腳。
    detail: 書中將下蹲終點設為大腿上緣平行地面、軀幹開始圓背或向前屈、或腳跟開始離地三者之一先出現時。
    terms: [back-squat, closed-grip, pronated-grip, neutral-spine]
    numbers:
    - v: 2
      unit: 種位置
      of: 背蹲舉槓鈴可採用的平衡槓位
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i07
    - ch17.exercise-selection.i01
    - ch13.max-strength.i04
    locator: 'Back Squat'
  - id: ch15.lower-body.i02
    q: 前蹲舉（Front Squat）的動作原則
    a:
    - 下蹲與起身都保持背部中立、肘抬高、胸抬起，腳跟留地並讓膝蓋對齊腳。
    - 起身時髖與膝以相同速度伸展，避免軀幹前屈或圓背。
    detail: 下降在大腿上緣平行地面、軀幹開始圓背或前屈、或腳跟離地三者之一先發生時停止；這是教材列出的深度界線。
    terms: [front-squat, neutral-spine]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i07
    - ch17.exercise-selection.i01
    - ch15.lower-body.i01
    locator: 'Front Squat'
  - id: ch15.lower-body.i03
    q: 硬舉（Deadlift）的起始與上拉
    a:
    - 雙腳平放、介於髖寬與肩寬，槓約在脛骨前方一英吋、位於前腳掌上方；背部保持中立或微拱。
    - 以髖、膝伸展把槓離地，保持軀幹與地面角度，勿讓髖先於肩上升；槓盡量貼近脛骨。
    detail: 若正手閉合握無法承受負荷，教材允許改用閉合交替握。
    terms: [deadlift, closed-grip, pronated-grip, alternated-grip, neutral-spine]
    numbers:
    - v: 1
      unit: 英吋
      of: 硬舉起始時槓鈴在脛骨前方的約略距離
    - v: 3
      unit: 公分
      of: 硬舉起始時槓鈴在脛骨前方的約略距離
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch17.exercise-selection.i03
    - ch23.layout.i04
    locator: 'Deadlift'
  - id: ch15.lower-body.i04
    q: 羅馬尼亞硬舉（Romanian Deadlift, RDL）的下降與上升
    a:
    - 先以硬舉將槓離地，膝略至中度屈曲並在全程維持；屈髖、將髖向後推，讓槓持續貼著大腿。
    - 槓與髕腱對齊且軀幹平行地面時，伸髖回到站姿；勿過度伸展背部或屈肘。
    detail: 使用抓舉握時，教材指出軀幹會依運動員人體測量特徵而略低於平行。
    terms: [romanian-deadlift, clean-grip, snatch-grip, neutral-spine]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.levers.i05
    - ch22.injury-prevention.i07
    - ch17.exercise-selection.i02
    locator: 'Romanian Deadlift (RDL)'
  - id: ch15.lower-body.i05
    q: 直腿硬舉（Stiff-Leg Deadlift）的範圍界線
    a:
    - 先以硬舉把槓離地，膝略至中度屈曲並全程維持；再以屈髖緩慢、完全受控地下槓。
    - 當槓片碰地、無法維持中立脊椎、膝完全伸直或腳跟離地時，即停止下降。
    detail: 名稱雖為直腿硬舉，教材實際要求膝維持略至中度屈曲，不能寫成膝完全打直。
    terms: [stiff-leg-deadlift, neutral-spine]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch22.injury-prevention.i07
    locator: 'Stiff-Leg Deadlift'
  - id: ch15.lower-body.i06
    q: 前跨弓步（Forward Step Lunge）的前腳與軀幹控制
    a:
    - 以前腿直接向前跨一大步，前腳平放並朝正前或微向內，軀幹保持直立。
    - 下降時前膝直接對齊前腳，重量平均分在後腳前腳掌與前腳全腳掌；回程用前側髖與膝伸展推離地面。
    detail: 教材的保護者只在必要時協助維持平衡，不是每次反覆都施力。
    terms: [forward-step-lunge, closed-grip, pronated-grip, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch22.kinetic-chain.i03
    - ch18.safety.i02
    - ch17.exercise-selection.i02
    locator: 'Forward Step Lunge'
  - id: ch15.lower-body.i07
    q: 踏台（Step-Up）的腳步順序與避免事項
    a:
    - 前導腳整隻腳放上箱頂，將體重移到前導腿，以前導髖與膝有力伸展站上箱頂。
    - 下來時先用同一隻後隨腳落地，再下前導腳；不可用後隨腿或腳推離地面，也不可跳上箱。
    detail: 教材要求每次反覆後暫停並交替前導腿。
    terms: [step-up, closed-grip, pronated-grip, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch22.kinetic-chain.i03
    - ch18.training-modes.i07
    locator: 'Step-Up'
  - id: ch15.lower-body.i08
    q: 髖部雪橇機（Hip Sled）的下降控制
    a:
    - 背、髖與臀部貼緊墊，雙腳平放踏板、約髖寬且腳尖微向外；膝蓋在屈伸時都對齊腳。
    - 緩慢屈髖、屈膝使大腿平行踏板，且不可讓臀部離座、髖滾離背墊或腳跟離開踏板。
    detail: 動作終點以身體接觸與對位維持為界，教材沒有依腳的位置宣稱可改變目標肌肉。
    terms: [hip-sled]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch16.machine-vs-freeweight.i02
    - ch22.kinetic-chain.i08
    locator: 'Hip Sled (Machine)'
- id: power-exercises-technique
  title: 爆發力動作技術要點
  desc: ''
  tag: 爆發力
  items:
  - id: ch15.power-exercises-technique.i01
    q: 爆發力動作的保護規則
    a:
    - 爆發力動作不建議保護。
    detail: 教材的理由是保護此類動作對保護者與運動員都過於危險，而非因為它們不需要安全教學。
    terms: [power-exercises, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch24.supervision.i05
    - ch23.key-numbers.i06
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises'
  - id: ch15.power-exercises-technique.i02
    q: 爆發力動作在槓前方失控時如何處理？
    a:
    - 應將槓推離身體，或直接放下槓鈴。
    detail: 這是教材要求事先教會運動員的「如何避開無法掌控的槓」方法。
    terms: [power-exercises]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch23.key-numbers.i06
    - ch18.equipment-facility.i03
    - ch15.power-exercises-technique.i01
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises'
  - id: ch15.power-exercises-technique.i03
    q: 爆發力動作在槓於頭後失控時如何處理？
    a:
    - 放開槓鈴並向前跳開。
    detail: 教材以槓在頭後失去控制為例，並未要求保護者攔接槓鈴。
    terms: [power-exercises]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch23.key-numbers.i06
    - ch18.equipment-facility.i03
    - ch15.power-exercises-technique.i01
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises'
  - id: ch15.power-exercises-technique.i04
    q: 做爆發力動作前的場地處理
    a:
    - 執行前應清除周邊其他運動員與器材。
    detail: 此要求是讓運動員能安全避開無法控制的槓鈴所必需的空間準備。
    terms: [power-exercises]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch23.key-numbers.i06
    - ch24.facility.i05
    - ch15.power-exercises-technique.i02
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises'
  - id: ch15.power-exercises-technique.i05
    q: 爆發或快速舉重動作的槓鈴速度目標
    a:
    - 在全程維持控制與正確姿勢下，盡力將槓加速到最大速度。
    detail: 速度要求不解除控制與姿勢的條件。
    terms: [power-exercises]
    numbers: []
    concepts: [technique]
    related:
    - ch02.size-strength.i06
    - ch17.exercise-selection.i04
    - ch18.mechanical-models.i07
    locator: 'Fundamentals of Exercise Technique > Range of Motion and Speed'
  - id: ch15.power-exercises-technique.i06
    q: 爆發力動作與一般需要保護的自由重量動作差異
    a:
    - 槓在頭上、背上、前肩架槓或過臉的自由重量動作通常需要一名以上保護者；爆發力動作是例外。
    detail: 教材把「爆發力動作不保護」明列為前述一般保護原則的例外。
    terms: [power-exercises, free-weight-exercises, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch24.supervision.i05
    - ch17.exercise-selection.i04
    - ch15.power-exercises-technique.i01
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved'
  - id: ch15.power-exercises-technique.i07
    q: 保護指引如何表述爆發力動作？
    a:
    - 保護指引指出，爆發力動作因運動員與保護者的安全因素而不予保護，並應教導運動員正確「如何失誤」。
    detail: 這是教材在總結保護指引時再次重申的規則。
    terms: [power-exercises, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch24.supervision.i05
    - ch18.safety.i08
    - ch15.power-exercises-technique.i01
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Amount and Timing of Spotting Assistance > Guidelines for Spotting'
  - id: ch15.power-exercises-technique.i08
    q: 爆發力動作安全教學的重點
    a:
    - 與其保護，不如教導運動員如何避開無法掌控的槓鈴。
    detail: 教材的替代作法是「如何失誤」教學與場地淨空；未要求從輕重量漸進或設定特定教學階段。
    terms: [power-exercises]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch24.supervision.i04
    - ch13.power-tests.i02
    - ch15.power-exercises-technique.i04
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises'
- id: power-exercises
  title: 爆發力動作 Power Exercises
  desc: ''
  tag: Power
  items:
  - id: ch15.power-exercises.i01
    q: 高翻（Power Clean）的起始與第一拉
    a:
    - 雙腳介於髖寬與肩寬，髖低於肩；用正手握，必要時可用勾握，槓在脛骨前方約一英吋。
    - 第一拉以髖、膝強力伸展離地，維持軀幹角度與中立脊椎，肘全伸、槓盡量貼近脛骨。
    detail: 第一拉時不可讓髖先於肩上升。
    terms: [power-clean, power-exercises, pronated-grip, hook-grip, neutral-spine]
    numbers:
    - v: 1
      unit: 英吋
      of: 高翻起始時槓鈴在脛骨前方的約略距離
    - v: 3
      unit: 公分
      of: 高翻起始時槓鈴在脛骨前方的約略距離
    concepts: [technique, safety]
    related:
    - ch02.levers.i05
    - ch17.exercise-selection.i04
    - ch13.power-tests.i02
    locator: 'Power Clean (and Hang Power Clean Variation)'
  - id: ch15.power-exercises.i02
    q: 高翻（Power Clean）的轉換階段
    a:
    - 槓超過膝時，將髖向前推並略屈膝，讓大腿碰槓、膝移到槓下。
    - 保持背部中立或微拱，肘全伸並朝側方。
    detail: 教材說明此轉換階段類似羅馬尼亞硬舉，舉重選手會用 RDL 強化此動作模式。
    terms: [power-clean, power-exercises, neutral-spine, romanian-deadlift]
    numbers: []
    concepts: [technique]
    related:
    - ch02.size-strength.i06
    - ch18.ssc.i01
    - ch15.power-exercises.i01
    locator: 'Power Clean (and Hang Power Clean Variation)'
  - id: ch15.power-exercises.i03
    q: 高翻（Power Clean）的第二拉
    a:
    - 快速伸展髖、膝與踝，盡可能久地讓腳跟接觸地面；下肢完全伸展後快速聳肩。
    - 肩到最高時才屈肘，開始把身體拉到槓下。
    detail: 教材說爆發性的第二拉可能使腳暫時離地，不能把「腳跟接地」解讀為全程絕對不離地。
    terms: [power-clean, power-exercises]
    numbers: []
    concepts: [technique]
    related:
    - ch02.work-power.i02
    - ch17.exercise-selection.i04
    - ch18.mechanical-models.i07
    locator: 'Power Clean (and Hang Power Clean Variation)'
  - id: ch15.power-exercises.i04
    q: 高翻（Power Clean）的接槓
    a:
    - 在槓下旋轉手臂並同時屈髖、屈膝至四分之一蹲；上臂抬至平行地面。
    - 槓架在鎖骨與前三角肌前方；控制平衡後伸髖、伸膝站直。
    detail: 接槓時教材要求軀幹近乎直立、肩略在髖前、頭中立且雙腳平放。
    terms: [power-clean, power-exercises]
    numbers:
    - v: 1/4
      unit: 蹲
      of: 高翻接槓時髖膝屈曲的深度
    concepts: [technique, safety]
    related:
    - ch18.safety.i01
    - ch02.joint-biomechanics.i04
    - ch15.power-exercises.i03
    locator: 'Power Clean (and Hang Power Clean Variation)'
  - id: ch15.power-exercises.i05
    q: 力量抓舉（Power Snatch）的抓握與接槓
    a:
    - 用比其他動作寬的正手抓舉握；可依握拳至對側肩或肘至肘距離估算。
    - 在槓下旋轉雙手並屈髖、屈膝至四分之一蹲，以全伸肘、直立穩定軀幹、平腳與身體中足上方承重接槓。
    detail: 槓接在耳朵上方且略在耳後，控制平衡後再站直並穩定槓鈴過頭。
    terms: [power-snatch, power-exercises, snatch-grip, pronated-grip, hook-grip]
    numbers:
    - v: 1/4
      unit: 蹲
      of: 力量抓舉接槓時髖膝屈曲的深度
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i04
    - ch17.exercise-selection.i04
    - ch13.power-tests.i02
    locator: 'Power Snatch (and Hang Power Snatch Variation)'
  - id: ch15.power-exercises.i06
    q: 懸垂高翻（Hang Power Clean）的起始差異
    a:
    - 懸垂高翻從大腿中段、略低於膝或略高於膝的位置開始，反覆間不從地面開始或回到地面。
    detail: 教材描述的是起始與反覆間槓的位置，沒有宣稱這個變式比較適合初學者或技術門檻較低。
    terms: [power-clean, power-exercises]
    numbers: []
    concepts: [technique]
    related:
    - ch17.exercise-selection.i04
    - ch13.power-tests.i02
    - ch15.power-exercises.i01
    locator: 'Power Clean (and Hang Power Clean Variation)'
  - id: ch15.power-exercises.i07
    q: 推舉（Push Press）的驅動與完成
    a:
    - 先受控屈髖、屈膝下沉，隨即快速有力地伸髖、伸膝、伸踝，再伸肘將槓驅至過頭。
    - 驅動後髖、膝已全伸，剩餘行程以手臂推至肘全伸。
    detail: 教材說腿部驅動只將槓推至過頭行程的一部分，最後由手臂完成，且並未比較它可使用的重量。
    terms: [push-press, power-exercises, clean-grip]
    numbers: []
    concepts: [technique]
    related:
    - ch02.size-strength.i06
    - ch17.exercise-selection.i04
    - ch18.training-modes.i04
    locator: 'Push Press'
  - id: ch15.power-exercises.i08
    q: 挺舉推舉（Push Jerk）的接槓與恢復
    a:
    - 驅動後迅速屈髖、屈膝下沉，同時全伸肘，在槓到最高點時於頭上接槓。
    - 接槓後取得控制和平衡，再伸髖、伸膝站至完全直立，並保持肘鎖定、槓穩定於頭上。
    detail: 教材寫的是髖膝略屈的接槓，未寫成跳步分腿或蹲舉接槓。
    terms: [push-jerk, power-exercises, clean-grip]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch18.safety.i01
    - ch17.exercise-selection.i04
    - ch15.power-exercises.i07
    locator: 'Push Jerk'
- id: spotter-communication
  title: 運動員與保護者溝通
  desc: ''
  tag: 保護
  items:
  - id: ch15.spotter-communication.i01
    q: 組開始前運動員應告知保護者什麼？
    a:
    - 槓一開始會如何處理、預計做幾次反覆，以及何時準備好把槓移入位置。
    detail: 溝通是運動員與保護者共同的責任。
    terms: [spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch13.test-administration.i04
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter'
  - id: ch15.spotter-communication.i02
    q: 未先溝通可能造成什麼問題？
    a:
    - 保護者可能不當、過早或過晚接管槓鈴，因而干擾動作或傷害運動員。
    detail: 教材特別把時機錯誤與不當控制槓鈴連在一起。
    terms: [spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.legal.i04
    - ch15.spotter-communication.i01
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter'
  - id: ch15.spotter-communication.i03
    q: 起槓協助（liftoff）的定義
    a:
    - 指將槓從直立支架移到運動員可開始動作的位置。
    detail: 通常由保護者協助把槓鈴或啞鈴放到運動員手中並移至正確起始位置。
    terms: [liftoff, spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch13.max-strength.i02
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Use of a Liftoff'
  - id: ch15.spotter-communication.i04
    q: 通常在哪些動作使用起槓協助？
    a:
    - 臥推從支架起槓、肩推從支架或肩部起槓，以及支架太低又不可調的蹲舉動作。
    detail: 是否需要起槓協助取決於運動員是否需要或提出要求，並非每次都必須。
    terms: [liftoff, spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch13.max-strength.i02
    - ch24.supervision.i05
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Use of a Liftoff'
  - id: ch15.spotter-communication.i05
    q: 起槓協助如何事先協調訊號？
    a:
    - 運動員與保護者要預先同意口頭訊號，例如「up」或由保護者倒數後把槓移到位。
    detail: 關鍵在於預先約定並由運動員表示準備好，不是指定全員使用同一句口令。
    terms: [liftoff, spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i04
    - ch15.spotter-communication.i03
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Use of a Liftoff'
  - id: ch15.spotter-communication.i06
    q: 兩名保護者的起槓與入架分工
    a:
    - 起槓者協助後要迅速移到槓的一端保護；另一人已在另一端。
    - 動作完成時，兩人都應協助運動員把槓放回支架。
    detail: 教材以臥推為例說明此分工；它是兩人保護且運動員需要起槓協助時的安排。
    terms: [liftoff, spotter]
    numbers:
    - v: 2
      unit: 名
      of: 本條所述起槓與入架分工的保護者人數
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch13.max-strength.i02
    - ch15.spotter-communication.i03
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Use of a Liftoff'
  - id: ch15.spotter-communication.i07
    q: 起槓結束時保護者要確認什麼？
    a:
    - 必須確認運動員已完全控制槓鈴，才完成起槓協助。
    detail: 這個確認防止起槓者過早放手。
    terms: [liftoff, spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i02
    - ch13.max-strength.i02
    - ch15.spotter-communication.i03
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Use of a Liftoff'
  - id: ch15.spotter-communication.i08
    q: 強迫反覆時如何請求與提供協助？
    a:
    - 運動員一有可能失敗的跡象，就應迅速請求或示意協助；保護者立即提供所需程度的協助。
    - 若運動員無法再出力，應立刻說出預先約定的話，例如「take it」。
    detail: 教材要求協助量依運動員當下能力調整，從剛好通過黏滯點到接管全負荷都有可能。
    terms: [forced-repetitions, partner-assisted-reps, spotter, sticking-point]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch17.training-volume.i03
    - ch15.exercise-technique-fundamentals.i06
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Amount and Timing of Spotting Assistance'
- id: spotting-how
  title: 如何執行保護
  desc: ''
  tag: 保護
  items:
  - id: ch15.spotting-how.i01
    q: 過臉槓鈴動作的保護握法
    a:
    - 保護者以通常比運動員握距窄的交替握握槓。
    - 若動作軌跡彎曲，可用交替握把槓拿起或放回地面；保護時也可改用反手握，但不是必要條件。
    detail: 教材提出此握法是為避免槓從保護者手中滾出並落向運動員的臉或頸部。
    terms: [spotter, alternated-grip, supinated-grip, grip-width]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch13.max-strength.i02
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Over-the-Face Exercises'
  - id: ch15.spotting-how.i02
    q: 啞鈴動作應在哪裡保護？
    a:
    - 應盡量靠近啞鈴保護；許多動作可在前臂接近手腕處保護。
    - 不應在上臂或肘部保護：若肘屈曲塌陷，保護者無法阻止啞鈴撞到臉或胸。
    detail: 部分動作需要直接保護啞鈴本身，而非手臂。
    terms: [spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch16.machine-vs-freeweight.i01
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Over-the-Face Exercises'
  - id: ch15.spotting-how.i03
    q: 哪些啞鈴動作須直接保護啞鈴？
    a:
    - 啞鈴上拉與過頭啞鈴三頭肌伸展等動作，必須將手放在啞鈴本身保護。
    detail: 教材只舉例說明「某些動作」需要這麼做，沒有把所有啞鈴動作都歸為同一方法。
    terms: [spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch15.spotting-how.i02
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Over-the-Face Exercises'
  - id: ch15.spotting-how.i04
    q: 過臉動作保護者的身體位置
    a:
    - 建立腳部寬而穩固的支撐基底，並維持中立脊椎。
    detail: 因保護者可能須從較高位置接住或協助舉起中至重負荷，教材把此姿勢列為關鍵。
    terms: [spotter, neutral-spine]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch23.layout.i03
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Over-the-Face Exercises'
  - id: ch15.spotting-how.i05
    q: 如何決定保護者人數？
    a:
    - 主要取決於負荷、運動員與保護者的經驗和能力，以及保護者的身體力量。
    - 負荷超出一名保護者能有效保護運動員與自身的能力時，必須加入另一名保護者。
    detail: 重負荷會提高傷害的機率與嚴重性，這是人數判斷的背景。
    terms: [spotter]
    numbers:
    - v: 1
      unit: 名
      of: 負荷仍在單一保護者可有效保護範圍內時的保護者人數
    concepts: [safety, technique]
    related:
    - ch24.supervision.i01
    - ch23.key-numbers.i06
    locator: 'Spotting Free Weight Exercises > Number of Spotters'
  - id: ch15.spotting-how.i06
    q: 為何能單人保護時偏好單人？
    a:
    - 若單一保護者可輕易處理負荷，優先單人保護。
    - 兩名以上保護者須與運動員協調；人數增加也增加時機或技術錯誤的機會。
    detail: 教材不是一律偏好人越多越安全，而是要求負荷能力與協調風險一併判斷。
    terms: [spotter]
    numbers:
    - v: 2
      unit: 名以上
      of: 需與運動員協調的多名保護者情境
    concepts: [safety, technique]
    related:
    - ch24.supervision.i01
    - ch24.supervision.i05
    locator: 'Spotting Free Weight Exercises > Number of Spotters'
  - id: ch15.spotting-how.i07
    q: 保護介入的時機與協助量
    a:
    - 多數情況只須幫運動員剛好通過黏滯點；有時則須由保護者接管全負荷。
    - 一出現反覆會失敗的跡象，運動員應立即請求或示意，保護者也應立即嘗試提供所需協助。
    detail: 這要求保護者熟悉正確保護技術，才能判斷何時及提供多少協助。
    terms: [spotter, sticking-point, partner-assisted-reps]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch15.spotter-communication.i08
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Amount and Timing of Spotting Assistance'
  - id: ch15.spotting-how.i08
    q: 保護者接管槓鈴與運動員的配合
    a:
    - 保護者應快速、平順地接過槓，避免運動員承擔的負荷突然改變。
    - 運動員應盡量跟著槓，直到槓入架或安全放到地面。
    detail: 教材把這種配合定位為同時保護運動員與保護者的做法。
    terms: [spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch24.emergency.i03
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Amount and Timing of Spotting Assistance'
- id: spotting-when
  title: 何時需要保護（Spotting）
  desc: ''
  tag: 保護
  items:
  - id: ch15.spotting-when.i01
    q: 哪些自由重量動作通常需要一名以上保護者？
    a:
    - 槓在頭上、在背上、架在前肩或鎖骨，或槓通過臉部上方的動作，通常需要一名以上保護者。
    detail: 此原則明確排除爆發力動作。
    terms: [free-weight-exercises, spotter, power-exercises]
    numbers:
    - v: 1
      unit: 名以上
      of: 前述自由重量動作通常需要的保護者人數
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch13.max-strength.i04
    - ch13.max-strength.i02
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved'
  - id: ch15.spotting-when.i02
    q: 保護者的首要責任
    a:
    - 保護者是在動作執行時協助、以保護運動員免於受傷的人。
    - 雖可激勵運動員或協助強迫反覆，首要責任是安全。
    detail: 不當執行保護可能嚴重傷害運動員、保護者及周邊的人員。
    terms: [spotter, forced-repetitions]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.emergency.i03
    - ch24.supervision.i02
    locator: 'Spotting Free Weight Exercises'
  - id: ch15.spotting-when.i03
    q: 爆發力動作是否保護？
    a:
    - 不保護爆發力動作；應教導運動員避開無法掌控的槓鈴。
    detail: 這是本章明示的例外規則，不能依一般過頭動作的保護原則反推為應保護。
    terms: [power-exercises, spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch23.key-numbers.i06
    - ch15.power-exercises-technique.i01
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Do Not Spot Power Exercises'
  - id: ch15.spotting-when.i04
    q: 為何啞鈴動作的保護通常比槓鈴更難？
    a:
    - 啞鈴動作多一件器材需要觀察與保護，因此通常需要更高的保護技巧。
    detail: 教材以「通常」表述，並未把所有啞鈴動作一概視為高風險。
    terms: [spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch16.machine-vs-freeweight.i01
    - ch24.supervision.i05
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved'
  - id: ch15.spotting-when.i05
    q: 過頭、背槓與前肩架槓動作的環境與保護者條件
    a:
    - 理想上在有適當高度橫桿的深蹲架內進行，並清除舉重區所有槓片、槓鈴、鎖扣與槓片架；未舉重者要遠離。
    - 保護者應至少與舉重者一樣強壯且一樣高，以施加足夠槓桿力。
    detail: 書中此要求針對負荷可能很大的過頭、背槓及前肩架槓動作。
    terms: [spotter]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch23.layout.i04
    - ch24.supervision.i05
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Overhead Exercises and Those With the Bar on the Back or Front Shoulders'
  - id: ch15.spotting-when.i06
    q: 重負荷出架動作的保護條件
    a:
    - 前跨弓步、踏台等重負荷出架動作，可能造成嚴重傷害。
    - 僅應由訓練良好且技術熟練的運動員執行，並由有經驗的專業人員保護。
    detail: 教材不是禁止這些動作，而是對重負荷出架情境提出資格與保護條件。
    terms: [out-of-the-rack-exercises, spotter]
    numbers: []
    concepts: [safety, technique, professional]
    related:
    - ch13.max-strength.i04
    - ch24.supervision.i05
    locator: 'Spotting Free Weight Exercises > Types of Exercises Performed and Equipment Involved > Spotting Overhead Exercises and Those With the Bar on the Back or Front Shoulders'
  - id: ch15.spotting-when.i07
    q: 保護不當的傷害範圍
    a:
    - 保護責任若執行不當，可能嚴重傷害被保護的運動員、保護者及近處的其他人。
    detail: 因此教材將安全置於搭檔輔助訓練效益之前。
    terms: [spotter]
    numbers: []
    concepts: [safety]
    related:
    - ch24.legal.i04
    - ch24.supervision.i03
    locator: 'Spotting Free Weight Exercises'
  - id: ch15.spotting-when.i08
    q: 保護指引對高風險動作的總結
    a:
    - 技術性多關節動作若以槓鈴或啞鈴舉過頭、放在背部、前肩或越過臉部，應使用保護。
    - 過頭或前後肩架槓可能需要多名保護者，且必須教會他們如何與在哪裡保護。
    detail: 這段總結同時重申爆發力動作不保護，並要求雙方在開始前清楚溝通動作與反覆次數。
    terms: [spotter, power-exercises]
    numbers: []
    concepts: [safety, technique]
    related:
    - ch24.supervision.i05
    - ch12.safety.i02
    - ch15.spotting-when.i01
    locator: 'Spotting Free Weight Exercises > Communication Between Athlete and Spotter > Amount and Timing of Spotting Assistance > Guidelines for Spotting'
- id: upper-body
  title: 上肢推拉 Upper Body
  desc: ''
  tag: Upper Body
  items:
  - id: ch15.upper-body.i01
    q: 平槓臥推（Flat Barbell Bench Press）的運動員要點
    a:
    - 以五點身體接觸姿勢躺在臥椅上，眼睛位於架槓下方；採略寬於肩的閉合正手握。
    - 槓降至約乳頭高度的胸部；上推時肘全伸並微微向後，手腕僵硬、前臂垂直地面。
    detail: 教材要求不拱背或抬胸迎槓，組末並持續握槓直到入架。
    terms: [bench-press, five-point-body-contact-position, closed-grip, pronated-grip, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch13.max-strength.i02
    - ch02.joint-biomechanics.i04
    - ch15.body-positioning.i02
    locator: 'Flat Barbell Bench Press (and Dumbbell Variation)'
  - id: ch15.upper-body.i02
    q: 上斜啞鈴臥推（Incline Dumbbell Bench Press）的運動員與保護者要點
    a:
    - 運動員採閉合正手握與五點身體接觸，將啞鈴同步推至頭與臉上方的伸肘、雙臂平行位置。
    - 下放至腋下附近、胸部上三分之一對線；保護者在靠近手腕的前臂處保護。
    detail: 教材將下放位置限定於腋下附近且與胸部上三分之一對線。
    terms: [incline-dumbbell-bench-press, closed-grip, pronated-grip, five-point-body-contact-position, spotter]
    numbers:
    - v: 1/3
      unit: 胸部區域
      of: 上斜啞鈴臥推下放時對線的胸部區域
    concepts: [technique, safety]
    related:
    - ch16.machine-vs-freeweight.i01
    - ch24.supervision.i05
    - ch15.spotting-how.i02
    locator: 'Incline Dumbbell Bench Press (and Barbell Variation)'
  - id: ch15.upper-body.i03
    q: 俯身划船（Bent-Over Row）的起始與拉槓控制
    a:
    - 用較肩寬的閉合正手握，先以硬舉方式將槓離地；站距肩寬、膝微屈、屈髖使軀幹略高於平行地面。
    - 拉槓時軀幹僵硬、背部中立，槓碰下胸或上腹；不可向上猛拉軀幹。
    detail: 教材明定起槓時用正手握而非交替握。
    terms: [bent-over-row, closed-grip, pronated-grip, alternated-grip, neutral-spine]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i02
    - ch17.exercise-order.i07
    - ch15.lower-body.i03
    locator: 'Bent-Over Row'
  - id: ch15.upper-body.i04
    q: 背闊肌下拉（Lat Pulldown）的軀幹與槓鈴路徑
    a:
    - 用較肩寬的閉合正手握，坐向器械，腳平放、腿固定在墊下，軀幹略向後傾。
    - 將槓下拉到鎖骨及上胸區，保持略向後傾且不可猛然後拉軀幹；再讓肘緩慢伸回起始位置。
    detail: 下拉過程維持軀幹略向後傾，不可用突然向後拉軀幹來完成動作。
    terms: [lat-pulldown, closed-grip, pronated-grip, weight-belt]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i04
    - ch17.exercise-selection.i02
    locator: 'Lat Pulldown (Machine)'
  - id: ch15.upper-body.i05
    q: 坐姿槓鈴肩推（Seated Barbell Shoulder Press）的槓鈴路徑
    a:
    - 採五點身體接觸與略寬於肩的閉合正手握；保護者協助將槓移離支架至頭上。
    - 下放時略伸頸讓槓從臉旁通過，降至鎖骨與前三角肌；上推時同樣略伸頸讓槓通過臉旁。
    detail: 教材此清單說的是從身體前方路徑推舉，未列出「從頸後」版本。
    terms: [seated-barbell-shoulder-press, five-point-body-contact-position, closed-grip, pronated-grip, alternated-grip, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i04
    - ch17.exercise-selection.i02
    locator: 'Seated Barbell Shoulder Press (and Dumbbell Variation)'
  - id: ch15.upper-body.i06
    q: 直立划船（Upright Row）的手肘與槓鈴路徑
    a:
    - 用約肩寬或略寬的閉合正手握，將槓沿腹部與胸部拉向下巴。
    - 手肘向側方，最高點與手腕同高或略高於肩；不可踮腳或甩槓上拉。
    detail: 教材沒有要求窄握；允許約肩寬或略寬的握距。
    terms: [upright-row, closed-grip, pronated-grip, grip-width]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i04
    - ch17.exercise-selection.i02
    locator: 'Upright Row'
  - id: ch15.upper-body.i07
    q: 槓鈴二頭肌彎舉（Barbell Biceps Curl）的控制要點
    a:
    - 用肩寬閉合反手握，站直、膝微屈；上舉至槓接近前三角肌。
    - 軀幹直立、上臂固定，不可甩身或甩槓；下放至肘全伸，反覆間不可讓槓彈碰大腿。
    detail: 呼吸範例指出此動作的黏滯點約在上舉中段。
    terms: [barbell-biceps-curl, closed-grip, supinated-grip, sticking-point]
    numbers: []
    concepts: [technique]
    related:
    - ch02.levers.i06
    - ch17.exercise-selection.i02
    - ch15.breathing.i03
    locator: 'Barbell Biceps Curl'
  - id: ch15.upper-body.i08
    q: 三頭肌下壓（Triceps Pushdown）的起始與下壓
    a:
    - 用寬約六至十二英吋的閉合正手握；身體站得夠靠近器械，使纜線在起始位置垂直下垂。
    - 上臂貼身固定，伸肘將槓下推；不可強力鎖死肘，回程讓肘緩慢屈曲。
    detail: 教材只有列閉合正手握，未列中立握作為本動作的握法。
    terms: [triceps-pushdown, closed-grip, pronated-grip]
    numbers:
