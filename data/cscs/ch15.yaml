- id: weight-belt
  title: 護腰帶使用指引
  desc: ''
  tag: 護腰帶
  items:
  - id: ch15.weight-belt.i01
    q: 護腰帶（weight belt）的作用
    a:
    - 舉重時可能有助於維持腹內壓。
    detail: 教材使用「可能有助於」，沒有說護腰帶本身必然提供脊椎保護。
    terms: [weight-belt]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch02.joint-biomechanics.i03
    - ch16.general-guidelines.i04
    locator: 'Fundamentals of Exercise Technique > Weight Belts'
  - id: ch15.weight-belt.i02
    q: 建議使用護腰帶的條件
    a:
    - 對下背施加壓力的動作，以及使用接近最大或最大負荷的組次，建議穿戴護腰帶。
    detail: 是否適合還取決於所做動作的類型與相對負荷。
    terms: [weight-belt]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch17.exercise-selection.i03
    - ch02.joint-biomechanics.i03
    locator: 'Fundamentals of Exercise Technique > Weight Belts'
  - id: ch15.weight-belt.i03
    q: 哪些情況不需要護腰帶？
    a:
    - 不對下背施壓的動作，例如二頭肌彎舉、背闊肌下拉，不需要。
    - 雖對下背施壓但使用輕負荷的動作，例如背蹲舉或硬舉，也不需要。
    detail: 教材以動作是否對下背施壓及負荷輕重為兩個判斷條件。
    terms: [weight-belt]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch16.general-guidelines.i01
    - ch02.joint-biomechanics.i02
    locator: 'Fundamentals of Exercise Technique > Weight Belts'
  - id: ch15.weight-belt.i04
    q: 太常使用護腰帶的缺點
    a:
    - 過於頻繁穿戴會減少腹肌獲得訓練的機會。
    detail: 教材只說減少腹肌訓練機會，未斷言會造成核心無力。
    terms: [weight-belt]
    numbers: []
    concepts: [technique]
    related:
    - ch17.principles-exam-tips.i03
    - ch16.machine-vs-freeweight.i03
    locator: 'Fundamentals of Exercise Technique > Weight Belts'
  - id: ch15.weight-belt.i05
    q: 護腰帶使用的判斷原則
    a:
    - 護腰帶的適切性取決於動作類型與相對負荷；對下背施壓且接近最大或最大負荷的組次，通常應穿戴。
    detail: 此條是教材的使用準則，不是教材以外的「考試重點」評註。
    terms: [weight-belt]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch17.needs-analysis.i03
    - ch02.joint-biomechanics.i03
    locator: 'Fundamentals of Exercise Technique > Weight Belts'
  - id: ch15.weight-belt.i06
    q: 護腰帶與安全技術的關係
    a:
    - 護腰帶與正確舉重及保護技術結合時，可能降低下背受傷風險。
    detail: 教材把降低風險的說法限定為結合正確舉重與保護技術時。
    terms: [weight-belt, spotter]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch24.supervision.i04
    - ch02.joint-biomechanics.i02
    locator: 'Fundamentals of Exercise Technique > Weight Belts'
  - id: ch15.weight-belt.i07
    q: 結構性動作（structural exercises）的定義
    a:
    - 指對脊椎加載、因此對其施加壓力的動作。
    detail: 這是本章在討論高負荷呼吸策略時的定義；教材沒有在此以「孤立動作」作對比定義。
    terms: [structural-exercise]
    numbers: []
    concepts: [technique, safety]
    related:
    - ch17.exercise-selection.i03
    - ch02.joint-biomechanics.i03
    - ch15.breathing.i06
    locator: 'Fundamentals of Exercise Technique > Breathing Considerations'
  - id: ch15.weight-belt.i08
    q: 護腰帶使用的總結
    a:
    - 通常在對下背施壓且使用接近最大或最大負荷的組次穿戴；不對下背施壓或雖施壓但負荷輕時不需要。
    detail: 此總結保留教材的「通常」語氣，而非將它改寫成絕對規則。
    terms: [weight-belt]
    numbers: []
