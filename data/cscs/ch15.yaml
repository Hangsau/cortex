    related: []
    locator: ''
- id: body-positioning
  title: 穩定身體與肢體姿勢
  desc: ''
  tag: 技術基礎
  items:
  - id: ch15.body-positioning.i01
    q: 站姿基準
    a:
    - 雙腳略寬於髖寬
    - 腳跟與前腳掌都接觸地面
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-positioning.i02
    q: 五點身體接觸（Five-Point Body Contact）
    a:
    - '仰臥或坐姿在臥推椅上必須達到：

      1. 頭部緊靠椅墊或靠背

      2. 肩膀與上背均勻貼合椅墊

      3. 臀部均勻坐在椅座上

      4. 右腳掌平放地板

      5. 左腳掌平放地板'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-positioning.i03
    q: 五點接觸的目的
    a:
    - 維持最大穩定性、提供脊椎支撐、確保動作過程姿勢不偏移
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-positioning.i04
    q: 機器訓練的對位原則
    a:
    - Cam/Pulley/Lever 機器有旋轉軸
    - 需調整座椅、踝墊或手臂墊，使主要關節對齊機器旋轉軸
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-positioning.i05
    q: 機器對位範例
    a:
    - Leg Extension：調整踝墊高度與靠背前後位置，使膝關節對齊機器旋轉軸
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-positioning.i06
    q: 全動作範圍（Full ROM）
    a:
    - 全 ROM 最大化訓練效益並維持/改善柔軟度
    - 需符合關節解剖 ROM
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-positioning.i07
    q: 爆發力動作的速度控制
    a:
    - 一般動作：緩慢控制
    - 爆發力動作（Power Clean/Push Jerk/Snatch）：盡量加速至最快，但維持控制與正確動作型態
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-positioning.i08
    q: 穩定姿勢的意義
    a:
    - 使肌肉與關節受到適當應力，防止代償動作與受傷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
- id: breathing
  title: 呼吸技術
  desc: ''
  tag: 呼吸
  items:
  - id: ch15.breathing.i01
    q: 黏滯點（Sticking Point）
    a:
    - 每次反覆中最費力的位置，通常在離心→向心轉換後不久
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
  - id: ch15.breathing.i02
    q: 標準呼吸規則
    a:
    - 向心（用力）通過黏滯點時吐氣
    - 離心（放鬆）時吸氣
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
  - id: ch15.breathing.i03
    q: 範例：二頭彎舉
    a:
    - 上舉中途（向心彎曲肘關節）= 黏滯點 → 吐氣
    - 下放 = 吸氣
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
  - id: ch15.breathing.i04
    q: Valsalva Maneuver（閉聲門憋氣）
    a:
    - 對著閉合聲門呼氣 + 腹部與肋廓肌肉收縮 → 下軀幹液體柱 + 上軀幹氣體柱（「液體球」效果）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
  - id: ch15.breathing.i05
    q: Valsalva 的優點
    a:
    - 增加整個軀幹剛性，支撐脊椎，降低椎間盤壓縮力
    - 協助維持腰椎正常前彎（中立脊椎）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
  - id: ch15.breathing.i06
    q: Valsalva 的適用對象與時機
    a:
    - 有訓練基礎的運動員執行結構性動作（脊椎負重類：深蹲、硬舉、肩推）且重量接近最大時
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
  - id: ch15.breathing.i07
    q: Valsalva 的副作用
    a:
    - 腹內壓↑→暈眩、定向障礙、血壓過高、暈厥
    - 憋氣只應持續 1–2 秒，不應延長
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
  - id: ch15.breathing.i08
    q: Valsalva 血壓警示
    a:
    - 即使訓練有素者長時間憋氣，血壓可快速升至靜止水平三倍
    - 故必須短暫憋氣
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related: []
    locator: ''
- id: exercise-technique-fundamentals
  title: 動作技術基本原則
  desc: ''
  tag: 技術基礎
  items:
  - id: ch15.exercise-technique-fundamentals.i01
    q: 正確動作技術的核心價值
    a:
    - 安全且有效的舉重是所有阻力訓練的基礎
    - 動作正確 → 避免傷害 + 時間效率
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.exercise-technique-fundamentals.i02
    q: 全動作範圍（Full ROM）的重要性
    a:
    - 全 ROM 最大化訓練效益並維持或改善柔軟度
    - ROM 應符合關節的解剖範圍
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.exercise-technique-fundamentals.i03
    q: 動作速度原則
    a:
    - 一般阻力訓練：緩慢控制（增加全 ROM 到達的可能性）
    - 爆發力動作：最大加速（但仍維持控制）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.exercise-technique-fundamentals.i04
    q: 機器訓練的對位重要性
    a:
    - 旋轉軸型機器（Cam/Pulley/Lever）需使主要關節對齊機器旋轉軸，才能安全且有效執行
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.exercise-technique-fundamentals.i05
    q: 常見動作技術失誤
    a:
    - 弓腰（失去中立脊椎）、五點接觸不完整、握法不當、呼吸時機錯誤
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.exercise-technique-fundamentals.i06
    q: 強迫次數（Forced/Partner-Assisted Reps）的定位
    a:
    - 有助訓練，但首要目的是安全
    - 保護者需能判斷運動員真正需要多少協助
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.exercise-technique-fundamentals.i07
    q: 技術指導的責任歸屬
    a:
    - 強與體能訓練師必須教導運動員正確技術、呼吸、護腰帶使用和保護程序
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.exercise-technique-fundamentals.i08
    q: 技術 × 監督 × 回饋的組合
    a:
    - 持續監督 + 即時回饋 + 正確技術指導 = 安全且有效的訓練環境
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
- id: grips
  title: 握法類型與寬度
  desc: ''
  tag: 技術基礎
  items:
  - id: ch15.grips.i01
    q: 正手握（Pronated / Overhand Grip）
    a:
    - 掌心朝下、指節朝上
    - 最常見握法
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.grips.i02
    q: 反手握（Supinated / Underhand Grip）
    a:
    - 掌心朝上、指節朝下
    - 如二頭彎舉下拉動作
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.grips.i03
    q: 交替握（Alternated Grip）
    a:
    - 一手正手、一手反手
    - 用於硬舉防止槓鈴滾動
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.grips.i04
    q: 勾握（Hook Grip）
    a:
    - 類正手握，但拇指壓在食指、中指下方
    - 爆發力動作（抓舉）用，握力更強
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.grips.i05
    q: 閉合握 vs 開放握（False Grip）
    a:
    - 拇指繞過槓鈴 = Closed Grip（安全）
    - 拇指不繞過 = Open/False Grip（危險，不建議）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.grips.i06
    q: 中立握（Neutral Grip）
    a:
    - 指節朝外（類似握手）
    - 正手或反手的變體
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.grips.i07
    q: Clean Grip vs Snatch Grip
    a:
    - Clean：略寬於肩寬，膝蓋外側
    - Snatch：寬握（可用拳頭到對側肩 或 肘到肘 測量）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.grips.i08
    q: 握寬三類
    a:
    - Common：約肩寬
    - Wide：寬握
    - Narrow：窄握
    - 多數訓練動作手距約肩寬
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
