cards:
- q: 正手握（Pronated Grip）的定義？
  a: 掌心朝下、指節朝上；又稱 Overhand Grip；最常見的阻力訓練握法
  tag: grips
- q: 反手握（Supinated Grip）的定義？
  a: 掌心朝上、指節朝下；又稱 Underhand Grip；如二頭彎舉或搜背下拉常用
  tag: grips
- q: 交替握（Alternated Grip）的用途？
  a: 一手正手握、一手反手握；防止槓鈴滾動；常用於硬舉
  tag: grips
- q: 勾握（Hook Grip）的特徵與用途？
  a: 類正手握，但姆指壓在食指和中指下方；握力更強；用於爭舉等爆發力動作
  tag: grips
- q: 閉合握（Closed Grip）vs 開放握（False Grip）的安全差異？
  a: 閉合握：姆指繞住槓鈴，安全；開放握：姆指不繞住槓鈴，有滴落風險，不建議使用
  tag: grips
- q: Clean Grip vs Snatch Grip 的寬度差異？
  a: Clean Grip：略寬於肩寬，雙手在膝蓋外側； Snatch Grip：寬握，可用拳頭到對側肩或股等股測量
  tag: grips
- q: 中立握（Neutral Grip）的姿勢？
  a: 指節朝外（類似握手）；正手握或反手握的變體；常用於哈馤彎舉和部分拉背動作
  tag: grips
- q: 阻力訓練的三種握寬？
  a: Common（約肩寬，最常用）、Wide（寬握）、Narrow（窄握）
  tag: grips
- q: 五點身體接觸（Five-Point Body Contact）的內容？
  a: 座接至臥推廉接：頭部谼滚常、肩背谼滚常、臀部坐滚常、右腳蹏地、左腳蹏地
  tag: body-positioning
- q: 五點身體接觸的目的？
  a: 提供最大穩定性和脊椐支機；全程防止姿勢偏移
  tag: body-positioning
- q: 站姿訓練動作的足部位置基準？
  a: 雙腳略寬於髖寬；腳跟與前腳掌同時接觸地面
  tag: body-positioning
- q: 旋轉軸型機器的對位原則？
  a: 需調整座椅、踝墊或手臂墊，使主要關節對齊機器旋轉軸，才能安全且有效執行
  tag: body-positioning
- q: 繩慢控制與爆發力動作的速度差異？
  a: 一般阻力訓練：緩慢控制利於達到全 ROM；爆發力動作（Power Clean/Push Jerk/Snatch）：目標最大加速同時保持控制
  tag: body-positioning
- q: 吸吐氣的基本原則（大多數動作）？
  a: 向心過黏滁點時吐氣；離心（放下）時吸氣；最費力階段就是吐氣時機
  tag: breathing
- q: 黏滁點（Sticking Point）的定義？
  a: 每次反覆中最費力的位置；通常在離心轉向心階段之後不久出現
  tag: breathing
- q: Valsalva Maneuver 是什麼？
  a: 對發射的耸門呼氣 + 腔部和肋框肌肉收縮；造成下身體液體丹和上身體氣體丹（「液體球」）
  tag: breathing
- q: Valsalva Maneuver 的優點？
  a: 增加整個身體干性 → 支檔脊椐 → 降低渎間盤壓縮力；协助維持腰椨正常前彎和上身直立姿勢
  tag: breathing
- q: Valsalva Maneuver 的適用對象與時機？
  a: 有訓練基礎的運動員執行結構性動作（脊椐承載類）且重量接近最大時
  tag: breathing
- q: Valsalva Maneuver 的副作用？
  a: 腹內壓↑→暈眩、定向障礙、血壓過高、暈厥；憋氣只應持續 1–2 秒，不應延長
  tag: breathing
- q: 即使訓練有素者長時間 Valsalva 的風險？
  a: 血壓可快速升至靜止水平三倍；故必須短暫應用，不可延長憋氣時間
  tag: breathing
- q: 護腰帶的主要功能？
  a: 輔助維持腹內壓，支撐脊椎；搭配正確技術可減少下背受傷風險
  tag: weight-belt
- q: 應穿戴護腰帶的條件？
  a: 執行對下背造成壓力的動作（如深蹲、硬舉）+ 重量接近最大負荷時
  tag: weight-belt
- q: 不需要護腰帶的情況？
  a: ①動作本身不對下背施壓（如二頭彎舉、背闊下拉）；②有下背壓力但負荷輕（如空槓深蹲）
  tag: weight-belt
- q: 過度依賴護腰帶的缺點？
  a: 減少腹背肌肉自主訓練機會，長期可能導致核心肌肉衢弱
  tag: weight-belt
- q: 結構性動作（Structural Exercise）的定義？
  a: 脊椎直接承載重量的動作（如背蹲舉、硬舉、肩推）；與孤立性動作相對
  tag: weight-belt
- q: 第一優先需要保護的動作類型？
  a: 過頭動作、槓鈴背直動作（背蹲舉）、前肩架槓（前蹲舉）、過臉動作（座推、什炎三頭延伸）
  tag: spotting-when
- q: 保護的主要目的？
  a: 保護運動員安全為第一優先；激勵和協助強迫次數為次要目的
  tag: spotting-when
- q: 爆發力動作絕對不保護的原因？
  a: 速度快、軍跡難預測，保護對保護者和運動員都太危險；應代之以教導「如何失敗」
  tag: spotting-when
- q: 啊鈴動作保護的適用環境要求？
  a: 最好在 Power Rack 內執行；清除周圍器材；旁觀者遠離；保護者身高和力量至少與運動員相當
  tag: spotting-when
- q: 啊鈴保護者必須符合的身體條件？
  a: 至少與運動員同等身高和力量；才能在需要時施加足夠拀杆力以保護運動員
  tag: spotting-when
- q: 和鈴動作的保護握法？
  a: 保護者用交替握（窄於運動員握距）握住槓鈴；封為槓鈴不會滾出手掌凳對胉部或蠸部
  tag: spotting-how
- q: 啊鈴過臉動作的保護位置？正確 vs 錯誤？
  a: 正確：靠近腕關節處保護（前臂近手腕）；錯誤：放在上臂或肘部（肘部塍降時無法止擋啊鈴柸臉）
  tag: spotting-how
- q: 保護者的基本站姿要求？
  a: 寬底面支撐（足距寬）、中立脊椎姿勢；準備承接中度至重負荷
  tag: spotting-how
- q: 保護人數的決定因素？
  a: 負荷大小（最重要）、運動員與保護者的技術和能力、保護者的身體力量
  tag: spotting-how
- q: 多人保護的風險？
  a: 保護者越多，協調時機錯誤的風險越高；展如單人可安全處理則優先單人保護
  tag: spotting-how
- q: 保護介入的時機和分量原則？
  a: 運動員顯示動作將失敗時立即介入；只給對通過黏滁點最少的力量；運動員完全失管時就說「take it」
  tag: spotting-how
- q: 保護接手的流暢度要求？
  a: 平滑接手槓鈴，避免突然改變運動員承擔的負荷量；運動員應盡量持續動作直到槓鈴入架或落地
  tag: spotting-how
- q: 開始前保護溝通的必要內容？
  a: 運動員告知保護者：槓鈴起始處理方式、預計反覆次數、何時準備好的訊號
  tag: spotter-communication
- q: 溝通不足對保護的影響？
  a: 保護者可能太早或太晓介入，打亂動作程序或造成傷害
  tag: spotter-communication
- q: Liftoff（起槓協助）的定義？
  a: 保護者協助運動員將槓鈴從支架移到起始動作位置的動作
  tag: spotter-communication
- q: 常用 Liftoff 的動作？
  a: 臥推（從支架）、肩推（從支架或肩上）、深蹲舉（支架過低且不可調整時）
  tag: spotter-communication
- q: Liftoff 的標準口令流程？
  a: 運動員示意準備好→保護者數「One, two, three」→三聲後移槓到位；保護者確認運動員完全控制槓鈴後才鬆手
  tag: spotter-communication
- q: 雙保護者 Liftoff 的程序？
  a: 一人負責起槓後立即移到槓鈴一端保護；另一人已在另一端就位；完成後雙人合力入架
  tag: spotter-communication
- q: 爆發力動作前方失敗時如何處理？
  a: 推開槓鈴或直接放槓；場地必須已清除其他運動員和器材
  tag: power-exercises-technique
- q: 爆發力動作後方失敗（如頸後抓舉）如何處理？
  a: 鬆手、向前跳離槓鈴；不應嘗試控制已失決的槓鈴
  tag: power-exercises-technique
- q: 爆發力動作附近必須做什麼準備？
  a: 清除周圍所有其他運動員和器材；環境必須足夠安全空間才執行
  tag: power-exercises-technique
- q: 爆發力動作的速度目標？
  a: 盡全加速至最快速度，同時全程維持控制和正確動作型態
  tag: power-exercises-technique
- q: 對不保護爆發力動作的教學替代方案？
  a: 加強技術指導、從輕重量開始、熟練後漸進到重負荷；不需保護但需训練分析
  tag: power-exercises-technique
- q: 正確動作技術、呼吸、護腰帶、保護指導的整體目標？
  a: 建立安全訓練環境；持續監督 + 即時回饵 = 安全且有效的訓練刺激
  tag: exercise-technique-fundamentals
- q: 保護與不保護的判斷邏輯？
  a: 動作速度快、軍跡難預測 = 不保護（爆發力）；動作緩慢、軍跡可預測 = 可保護
  tag: exercise-technique-fundamentals
- q: 啊鈴動作的保護者握法為何用交替握？
  a: 防止槓鈴從保護者手中滾落；確保在需要時可收回槓鈴或協助入架
  tag: spotting-how
- q: 結構性動作 + 近最大負荷時的呼吸建議？
  a: 可使用 Valsalva Maneuver 以支機脊椎敏對正對局；但憋氣持續時間不得超過 1–2 秒
  tag: breathing
