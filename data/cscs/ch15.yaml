cards:
- q: 正手握（pronated grip）如何定位？
  a: 掌心朝下、指節朝上；又稱 overhand grip。
  tag: grips
- q: 反手握（supinated grip）如何定位？
  a: 掌心朝上、指節朝下；又稱 underhand grip。
  tag: grips
- q: 交替握（alternated grip）是什麼？
  a: 一手正手握、另一手反手握。
  tag: grips
- q: 勾握（hook grip）的結構與用途？
  a: 拇指位在食指與中指下方的正手握變式；通常用於需要較強握力的動作，例如抓舉。
  tag: grips
- q: 閉合握與假握的差異？
  a: 拇指環繞槓鈴是閉合握；拇指不環繞槓鈴是開放或假握。本章只定義兩者，未評定假握危險性。
  tag: grips
- q: 高翻握法與抓舉握法的差異？
  a: 都是正手閉合握；高翻握略寬於肩寬、在膝外，抓舉握為寬握，可按拳至對側肩或肘至肘估算。
  tag: grips
- q: 中立握（neutral grip）的方向？
  a: 指節朝側方，如握手；它是正手或反手握的變式。
  tag: grips
- q: 握距的三類與一般原則？
  a: 一般、寬、窄三類；多數動作雙手約肩寬，且應使槓鈴平衡、均勻。
  tag: grips
- q: 五點身體接觸姿勢包含哪些接觸點？
  a: 頭部、肩與上背、臀部，以及左右腳都穩固接觸椅墊或地面。
  tag: body-positioning
- q: 五點身體接觸有何作用？
  a: 從起始到動作過程維持，可促進最大穩定性與脊椎支撐。
  tag: body-positioning
- q: 站姿動作的足部基準？
  a: 雙腳通常略寬於髖寬，腳跟與前腳掌都接觸地面。
  tag: body-positioning
- q: 有旋轉軸的器械如何對位？
  a: 調整座椅或墊件，讓主要關節對齊器械旋轉軸。
  tag: body-positioning
- q: 一般與爆發力動作的速度原則？
  a: 緩慢受控的反覆較可能做到全 ROM；爆發或快速舉重動作則在控制與正確姿勢下盡力加速槓鈴。
  tag: body-positioning
- q: 多數阻力動作的呼吸時機？
  a: 通常通過向心階段的黏滯點時吐氣，在較不費力的階段吸氣。
  tag: breathing
- q: 黏滯點（sticking point）是什麼？
  a: 一次反覆中最費力的位置，通常在離心轉向心後不久。
  tag: breathing
- q: 瓦氏動作（Valsalva maneuver）是什麼？
  a: 對閉合聲門呼氣並收縮腹部與肋廓肌肉；教材描述其形成下軀幹液體與上軀幹空氣的剛性區。
  tag: breathing
- q: 瓦氏動作的潛在益處？
  a: 增加軀幹剛性以支撐脊椎、降低椎間盤相關壓縮力，並協助維持中立脊椎。
  tag: breathing
- q: 何時可考慮瓦氏動作？
  a: 有阻力訓練經驗的運動員做高負荷結構性動作時，可用以協助維持脊椎排列與支撐。
  tag: breathing
- q: 瓦氏動作的副作用與憋氣上限？
  a: 腹內壓升高可能暈眩、定向感混亂、血壓過高或昏厥；憋氣應非常短暫，至多約一到二秒。
  tag: breathing
- q: 為何不可延長瓦氏動作憋氣？
  a: 即使訓練良好的人，血壓也可能很快升到靜止值的三倍。
  tag: breathing
- q: 護腰帶的作用？
  a: 舉重時可能有助於維持腹內壓。
  tag: weight-belt
- q: 何時建議使用護腰帶？
  a: 對下背施壓的動作，以及使用接近最大或最大負荷的組次。
  tag: weight-belt
- q: 哪些情況不需要護腰帶？
  a: 不對下背施壓的動作，以及雖對下背施壓但使用輕負荷的動作。
  tag: weight-belt
- q: 太常使用護腰帶的缺點？
  a: 會減少腹肌獲得訓練的機會；教材未斷言必然造成核心無力。
  tag: weight-belt
- q: 結構性動作（structural exercises）是什麼？
  a: 對脊椎加載、因此對其施加壓力的動作。
  tag: weight-belt
- q: 哪些自由重量動作通常需要保護？
  a: 槓在頭上、背上、前肩或鎖骨，或槓通過臉部上方的動作；爆發力動作除外。
  tag: spotting-when
- q: 保護者的首要責任？
  a: 協助動作執行以保護運動員免於受傷；激勵與強迫反覆是次要工作。
  tag: spotting-when
- q: 爆發力動作為何不保護？
  a: 對保護者與運動員都過於危險；應教導運動員避開無法掌控的槓鈴。
  tag: spotting-when
- q: 過頭、背槓與前肩架槓動作的環境要求？
  a: 理想上在有適當橫桿高度的深蹲架內進行，並清空舉重區、讓未舉重者遠離。
  tag: spotting-when
- q: 此類動作的保護者體格條件？
  a: 應至少與運動員一樣強壯且一樣高，以施加足夠槓桿力。
  tag: spotting-when
- q: 重負荷出架動作的條件？
  a: 僅由訓練良好、技術熟練的運動員執行，並由有經驗的專業人員保護。
  tag: spotting-when
- q: 過臉槓鈴動作如何握槓保護？
  a: 保護者通常用較運動員窄的交替握；彎曲軌跡動作可用交替握拿起或放回槓，保護時可用反手握但非必要。
  tag: spotting-how
- q: 啞鈴動作如何保護？
  a: 盡量靠近啞鈴，通常在前臂近手腕處；不可在上臂或肘部保護，以免肘塌陷時無法阻止啞鈴碰臉或胸。
  tag: spotting-how
- q: 哪些啞鈴動作須直接保護啞鈴？
  a: 啞鈴上拉與過頭啞鈴三頭肌伸展等動作。
  tag: spotting-how
- q: 過臉動作保護者的站姿？
  a: 建立寬而穩的支撐基底，保持中立脊椎，以準備承接或協助中至重負荷。
  tag: spotting-how
- q: 保護者人數由什麼決定？
  a: 負荷、運動員與保護者的經驗與能力，以及保護者的身體力量；超出單人能力時必須增加保護者。
  tag: spotting-how
- q: 為何單人能安全保護時優先單人？
  a: 多人須協調運動員與彼此，人數增加也增加時機或技術錯誤機會。
  tag: spotting-how
- q: 保護何時介入、協助多少？
  a: 反覆一有可能失敗的跡象即介入；從剛好通過黏滯點到接管全負荷，依運動員當下能力而定。
  tag: spotting-how
- q: 保護者接管槓鈴時的流暢度？
  a: 快速、平順接過槓，避免突然改變運動員承擔的負荷；運動員盡量跟到槓入架或安全落地。
  tag: spotting-how
- q: 組開始前要如何溝通？
  a: 運動員告知槓的初始處理方式、預計反覆次數及何時準備好移槓；雙方共同負責溝通。
  tag: spotter-communication
- q: 未先溝通會怎樣？
  a: 保護者可能不當、過早或過晚接管槓，干擾動作或傷害運動員。
  tag: spotter-communication
- q: 起槓協助（liftoff）是什麼？
  a: 將槓從直立支架移到運動員可開始動作的位置。
  tag: spotter-communication
- q: 通常在哪些動作使用起槓協助？
  a: 臥推、肩推，以及支架太低又不可調的蹲舉動作；是否使用仍看運動員是否需要或要求。
  tag: spotter-communication
- q: 起槓協助如何協調訊號？
  a: 先同意口頭訊號，例如「up」或倒數後移槓；由運動員表示準備好。
  tag: spotter-communication
- q: 兩名保護者的起槓與入架分工？
  a: 起槓者隨即移至槓的一端，另一人已在另一端；結束時兩人一起協助將槓放回支架。
  tag: spotter-communication
- q: 爆發力動作在槓前方失控時怎麼做？
  a: 將槓推離身體或直接放下槓鈴；開始前要清除周邊其他運動員與器材。
  tag: power-exercises-technique
- q: 爆發力動作在槓於頭後失控時怎麼做？
  a: 放開槓鈴並向前跳開。
  tag: power-exercises-technique
- q: 爆發或快速舉重動作的速度目標？
  a: 在全程維持控制與正確姿勢下，盡力將槓加速到最大速度。
  tag: power-exercises-technique
- q: 高翻第二拉的動作順序？
  a: 快速伸髖、膝、踝，盡量久地讓腳跟接地；下肢全伸後聳肩，肩最高時才屈肘把身體拉到槓下。
  tag: power-exercises-technique
- q: 高翻如何接槓？
  a: 槓下旋轉手臂並屈髖屈膝至四分之一蹲，上臂平行地面，槓架在鎖骨與前三角肌前方。
  tag: power-exercises-technique
- q: 推舉與挺舉推舉的接槓差異？
  a: 推舉在髖膝全伸後用手臂完成過頭；挺舉推舉則迅速再屈髖屈膝下沉，同時全伸肘在最高點接槓。
  tag: power-exercises-technique
- q: 正確技術、呼吸、護腰帶與保護教學的整體目標？
  a: 配合品質良好的監督與持續回饋，形成安全訓練環境及有效、適切的訓練刺激。
  tag: exercise-technique-fundamentals
