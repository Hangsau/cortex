  - id: ch15.body-position.i02
    q: 五點接觸 5-Point Contact
    a:
    - 頭、肩背、臀（bench）
    - 左腳掌、右腳掌均平放地面
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-position.i03
    q: Point 1：頭部
    a:
    - 頭部穩固貼於椅背或背墊（head on bench/back pad）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-position.i04
    q: Point 2 & 3：肩臀
    a:
    - 肩膀上背均勻貼墊
    - 臀部均勻貼坐墊
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-position.i05
    q: Point 4 & 5：雙腳
    a:
    - 左腳掌與右腳掌均平放地面
    - 促進最大穩定性
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-position.i06
    q: Machine Alignment
    a:
    - 關節軸心需與機器旋轉軸對齊（axis of rotation）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-position.i07
    q: 中立脊椎
    a:
    - 維持自然腰椎前凸（neutral/lordotic）
    - 結構性動作必備
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.body-position.i08
    q: ROM & Speed
    a:
    - 全關節活動度
    - 慢速控制可達完整 ROM
    - power 動作求最大加速
    detail: ''
    terms: []
    numbers: []
    concepts:
