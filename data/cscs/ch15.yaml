- id: spotter-communication
  title: 運動員與保護者溝通
  desc: ''
  tag: 保護
  items:
  - id: ch15.spotter-communication.i01
    q: 開始前的必要溝通
    a:
    - 運動員告知保護者：①槓鈴初始處理方式
    - ②預計反覆次數
    - ③準備好時的訊號
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotter-communication.i02
    q: 溝通不足的後果
    a:
    - 保護者可能提早/過晚介入或錯誤接手，打亂動作或造成傷害
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotter-communication.i03
    q: Liftoff（起槓協助）的定義
    a:
    - 保護者協助運動員將槓鈴從支架移到起始動作位置
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotter-communication.i04
    q: 需要 Liftoff 的動作
    a:
    - 臥推（從支架起）、肩推（從支架或肩部起）、深蹲（支架過低時）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotter-communication.i05
    q: Liftoff 的口令標準流程
    a:
    - 運動員示意準備好 → 保護者數「One, two, three」→ 三聲後移槓到位
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotter-communication.i06
    q: 雙保護者 Liftoff 的程序
    a:
    - 一人協助起槓後立即移到槓鈴端保護
    - 另一人已就位在另一端
    - 完成動作後兩人合力入架
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotter-communication.i07
    q: Liftoff 結束確認
    a:
    - 保護者確認運動員已完全控制槓鈴後才可鬆手
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotter-communication.i08
    q: 強迫次數（Forced/Partner-Assisted Reps）
    a:
    - 保護者在運動員接近力竭時給予最少力量協助完成次數
    - 有訓練價值，但安全第一
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
- id: spotting-how
  title: 如何執行保護
  desc: ''
  tag: 保護
  items:
  - id: ch15.spotting-how.i01
    q: 過臉槓鈴動作的保護握法
    a:
    - 保護者使用交替握（Alternated Grip），握距窄於運動員
    - 確保槓鈴不會滾出手掌
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-how.i02
    q: 啞鈴過臉動作的保護位置
    a:
    - 正確：靠近腕關節處保護（前臂近手腕）
    - 錯誤：放在上臂或肘部（若肘部塌陷，無法阻止啞鈴砸臉）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-how.i03
    q: 特殊啞鈴動作（如啞鈴飛鳥、仰臥三頭延伸）
    a:
    - 部分動作需直接保護啞鈴本身，而非手臂
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-how.i04
    q: 保護者的站姿要求
    a:
    - 寬底面支撐（腳距夠寬）、中立脊椎姿勢
    - 準備承接中等至重量負荷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-how.i05
    q: 保護人數的決定因素
    a:
    - 負荷大小（最重要）、運動員與保護者的技術和能力
    - 負荷超過單一保護者能力時，需增加人手
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-how.i06
    q: 雙人保護的協調問題
    a:
    - 保護者越多，時機協調錯誤的風險越高
    - 若單人能處理，優先單人保護
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-how.i07
    q: 保護時機與介入量
    a:
    - 在運動員顯示動作將失敗時立即介入
    - 只給通過黏滯點的最少力量
    - 運動員若無法繼續，請其說「take it」
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-how.i08
    q: 保護的流暢度
    a:
    - 平滑接手槓鈴，避免突然改變負荷
    - 運動員應盡量持續維持到槓入架或落地
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
- id: spotting-when
  title: 何時需要保護（Spotting）
  desc: ''
  tag: 保護
  items:
  - id: ch15.spotting-when.i01
    q: 需要保護的動作類型
    a:
    - ①過頭動作（Overhead）
    - ②槓鈴背放（Back Squat）
    - ③前肩架槓（Front Squat）
    - ④過臉動作（Bench Press、仰臥三頭延伸）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-when.i02
    q: 保護的主要目的
    a:
    - 保護運動員安全為第一優先
    - 其次才是鼓勵、協助強迫次數
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-when.i03
    q: 不需要保護的動作
    a:
    - 爆發力動作（Power Exercises）—不論何種情況，絕對不保護
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-when.i04
    q: 啞鈴 vs 槓鈴保護難度
    a:
    - 啞鈴動作保護難度高於槓鈴（多一件器材需觀察）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-when.i05
    q: 過頭及背槓動作的環境要求
    a:
    - 最好在 Power Rack 內執行
    - 清除器材、槓片、槓片架
    - 旁觀者遠離舉重區
    - 保護者需與運動員同等身高和力量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-when.i06
    q: 過重負荷的高風險動作
    a:
    - 出架弓步或踏台（Forward Lunge/Step-Up）使用重負荷 → 僅適合訓練有素的運動員，且需有經驗的專業人員保護
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-when.i07
    q: 保護者的優先責任
    a:
    - 安全！疏忽保護責任可能造成運動員、保護者、周遭人員的嚴重傷害
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
  - id: ch15.spotting-when.i08
    q: 爆發力動作替代方案
    a:
    - 教導運動員「如何失誤」（How to Miss）：前方失誤→推槓或放槓
    - 後方失誤→鬆手跳前
    detail: ''
    terms: []
    numbers: []
    concepts:
    - safety
    - technique
    related: []
    locator: ''
