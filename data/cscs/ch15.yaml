- id: power-exercises-technique
  title: 爆發力動作技術要點
  desc: ''
  tag: 爆發力
  items:
  - id: ch15.power-exercises-technique.i01
    q: 爆發力動作絕對不保護
    a:
    - 原因：保護對保護者和運動員都太危險
    - 速度快、重量重，無法安全介入
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.power-exercises-technique.i02
    q: 教導「如何失誤」（How to Miss）
    a:
    - '爆發力動作必須預先教導失誤處理：

      - 前方失誤：推開槓鈴或直接放槓

      - 後方失誤（如頸後抓舉）：鬆手、向前跳離'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.power-exercises-technique.i03
    q: 爆發力動作的區域清理
    a:
    - 執行前必須清除周遭所有運動員和器材，確保有足夠安全空間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch15.power-exercises-technique.i04
    q: 爆發力動作的速度目標
    a:
    - 以最快速度驅動槓鈴，同時全程維持控制和正確動作型態
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
