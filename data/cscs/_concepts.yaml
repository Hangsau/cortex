energy-supply:
  zh: "能量供應"
  desc: "ATP 的來源、消耗與有氧無氧途徑"
adaptation:
  zh: "訓練適應"
  desc: "組織與神經系統對訓練刺激的長期改變"
normal-values:
  zh: "正常值與判讀"
  desc: "生理數值的正常範圍與偏離時的名稱"
methodology:
  zh: "測量與分類方法"
  desc: "用什麼方法判定、分型或量化"
