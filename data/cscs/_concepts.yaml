# 受控概念詞彙：跨章節閱讀用的軸。刻意維持小而封閉——概念只能從這裡挑，不能臨時發明，
# 否則「用相同概念讀」會退化成自由標籤，同一件事散成好幾個近義詞而永遠聚不起來。
# 要新增一條，先確認現有 12 條都不合適；新增後跑 tools/cscs_check.py。

structure:
  zh: "構造與解剖"
  desc: "組織、器官、細胞層級的組成與空間關係"
concentric-mechanism:
  zh: "興奮收縮偶聯"
  desc: "從電訊號到機械收縮之間的因果鏈"
force-production:
  zh: "力量產生"
  desc: "力量的來源、上限與影響因子"
fiber-type:
  zh: "肌纖維類型"
  desc: "快慢縮分型及其形態與生理差異"
motor-control:
  zh: "神經控制"
  desc: "運動單位徵召、放電頻率與力量分級"
reflex:
  zh: "反射與本體感覺"
  desc: "受器偵測、脊髓迴路與反射性促進或抑制"
circulation:
  zh: "循環運輸"
  desc: "血液流動路徑、血管功能與物質運送"
gas-exchange:
  zh: "氣體交換"
