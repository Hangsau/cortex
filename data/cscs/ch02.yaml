cards:
- q: 第一/二/三類槓桿各舉一個人體例子？
  a: 第一類=肘伸（三頭肌，支點在肘關節中間）；第二類=踮腳尖（腓腸肌，阻力在中間）；第三類=肘屈（二頭肌彎舉，最常見）
  tag: 槓桿系統
- q: 機械利益（Mechanical Advantage）的公式？
  a: MA = 肌肉力臂 / 阻力臂。MA > 1 省力；MA < 1 費力（人體大多為後者）
  tag: 槓桿系統
- q: 人體肌肉為何幾乎都處於機械不利（MA < 1）？
  a: 肌腱附著點非常靠近關節，肌肉力臂遠短於阻力臂→肌肉力需遠大於外部阻力→肌腱內力極高→受傷主因
  tag: 槓桿系統
- q: 髕骨在膝伸展的生物力學作用？
  a: 防止股四頭肌肌腱靠近膝關節旋轉軸，維持較大力臂，使機械利益在關節活動過程中相對穩定
  tag: 槓桿系統
- q: 自由重量訓練中阻力矩臂如何計算？
  a: 重量到關節的「水平距離」。動作過程中此距離持續變化→阻力矩也隨之改變（非恆定）
  tag: 槓桿系統
- q: 主動肌/拮抗肌/協同肌的定義？
  a: 主動肌（agonist）：直接執行動作；拮抗肌（antagonist）：減速/停止動作並保護關節；協同肌（synergist）：間接輔助動作
  tag: 骨骼肌肉
- q: 拮抗肌有哪兩個功能？
  a: ①穩定關節；②在快速動作末端煞車，保護韌帶與軟骨免受衝擊（例：投擲末期肱二頭肌煞住肘伸）
  tag: 骨骼肌肉
- q: 雙關節肌（如股直肌）為何需要協同肌？
  a: 股直肌同時跨越髖（屈）和膝（伸），起蹲時若無臀大肌等協同肌抵消髖屈效果，動作無法正確完成
  tag: 骨骼肌肉
- q: Origin（起點）與 Insertion（止點）的傳統定義？
  a: 起點=近端附著點（通常較固定）；止點=遠端附著點（通常較活動）；反轉現象：動作改變時固定端可互換
  tag: 骨骼肌肉
- q: 三個解剖平面的方向與動作各是什麼？
  a: 矢狀面（左右分）=屈/伸；冠狀面（前後分）=外展/內收；橫切面（上下分）=旋轉
  tag: 解剖平面
- q: 垂直跳、側向啞鈴舉、啞鈴飛鳥各在哪個平面？
  a: 垂直跳=矢狀面；側向啞鈴舉=冠狀面；啞鈴飛鳥=橫切面
  tag: 解剖平面
- q: 標準重訓常忽略但運動中重要的身體動作有哪些？
  a: 肩內/外旋（投擲、網球）、膝屈（衝刺）、踝背屈（跑步）、髖內外旋（轉向切入）、軀幹旋轉（揮擊）
  tag: 解剖平面
- q: Work（功）的公式與單位？
  a: W = F × d × cosθ（N·m = Joules）；θ為力與位移方向夾角。只有與位移同向的力分量才做功
  tag: 功與功率
- q: Power（功率）的公式與單位？
  a: P = W/t（Joules/s = Watts）= F × v。科學定義的power ≠ 日常俗稱的「爆發力」
  tag: 功與功率
- q: 旋轉功的公式？
  a: W = Torque × 角位移（弧度）；功率仍用 P = W/t。扭矩單位 N·m 不可與功混淆
  tag: 功與功率
- q: 舉100kg槓鈴2m高×10次（上舉加速度2m/s²），正功與平均功率各為多少（40秒完成）？
  a: 重力=980N，慣性力=200N；正功=(980+200)×2×10=23,600J；功率=23,600÷40=590W
  tag: 功與功率
- q: 為何說powerlifting（健力）的命名有誤導性？
  a: Olympic lifting（大重量高速）功率遠高於powerlifting（極重但低速）。從物理定義看，健力產生的power反而較小
  tag: 功與功率
- q: 肌力（Strength）與Power（功率）的關係？
  a: P = F × v，兩者都描述「在特定速度下產生力的能力」；知道力與速度其中兩個即可求第三
  tag: 功與功率
- q: 訓練初期肌力進步的主因是什麼？
  a: 神經適應（neural adaptation）：更多運動單元被招募、放電頻率↑；而非肌肥大，肌肥大效果較慢
  tag: 肌力因素
- q: 力量與肌肉哪個特性相關：橫截面積還是體積？
  a: 橫截面積（cross-sectional area），而非體積。相同粗細的肌肉，不論長短，力量相近
  tag: 肌力因素
- q: 羽狀肌（pennate）與平行肌纖維的差異？
  a: 羽狀肌：肌纖維斜向排列，平行肌節數多→力量↑但收縮速度↓。羽狀角度可透過訓練改變
  tag: 肌力因素
- q: 肌肉在哪個長度產生最大力量？為什麼？
  a: 靜息長度（resting length）：actin與myosin最大重疊，橫橋結合點最多→力量最大；過短或過長均下降
  tag: 肌力因素
- q: 向心收縮與離心收縮的力量比較？
  a: 離心 > 等長 > 向心。離心力量最大，這也是「作弊動作」（如靠慣性繼續動）利用的原理
  tag: 肌力因素
- q: 肌腱附著點遠離關節的利弊？
  a: 利：力臂長→扭矩↑→慢速力量更大（有利健力）；弊：相同肌肉縮短量的角位移↓→速度慢（不利快速運動）
  tag: 肌力因素
- q: 為何體型越大的運動員磅磅肌力通常越低？
  a: 肌力 ∝ CSA（尺寸²），體重 ∝ 體積（尺寸³）。體型↑1倍，體重↑8倍，力量↑4倍→磅磅比下降
  tag: 體型與肌力
- q: 跨量級比較的「古典公式」是什麼？
  a: 舉起重量 ÷ 體重^(2/3)。修正了大體型選手的不利，但研究顯示中等體重選手仍通常最佳
  tag: 體型與肌力
- q: 精英體操選手通常身材矮小的原因？
  a: 身材越大，需舉起更多自身體重，肌力/體重比下降；體操動作高度依賴此比值，矮小者有先天優勢
  tag: 體型與肌力
- q: 衝刺/跳躍訓練中，哪個指標最能反映爆發力表現？
  a: 肌力/體重比（strength-to-mass ratio）。體重增加幅度超過肌力增加幅度會降低表現
  tag: 體型與肌力
- q: 五種主要阻力來源各舉一種器材例子？
  a: 重力=自由重量/器械；慣性=槓鈴加速動作；摩擦=制動腳踏車；流體=液壓/氣壓機；彈性=彈力帶
  tag: 阻力來源
- q: 流體阻力器械（液壓/氣壓機）為何沒有離心相？
  a: 阻力只抵抗推/拉方向，回程由拮抗肌向心收縮完成；肌群輪流作功，缺乏離心訓練刺激
  tag: 阻力來源
- q: 彈性阻力（如彈力帶）最主要的缺點是什麼？
  a: 動作起始阻力最小、結束阻力最大，與人體肌力曲線相反（多數肌群在終末ROM力量最弱）
  tag: 阻力來源
- q: 爆發性動作（acceleration-based）為何有訓練特殊性？
  a: 加速/減速是多數運動動作的特徵，訓練相同加速模式可使神經肌肉系統適應特定力-速組合
  tag: 阻力來源
- q: 自由重量 vs 器械各有什麼主要優點？
  a: 器械：更安全、設計靈活、易上手；自由重量：需穩定肌、重量承重促進骨密度、模擬真實運動協調
  tag: 阻力來源
- q: 85-90%椎間盤突出發生在哪個位置？原因？
  a: L4/L5 或 L5/S1。腰部是上肢力量傳至下肢的必經路徑，且脊旁肌機械利益極低（力臂僅約5cm），內力可達外力10倍
  tag: 關節安全
- q: 深蹲時腰椎應保持何種姿勢？圓背有何風險？
  a: 中立腰椎（自然前凸）。圓背→前側椎間盤受壓→突出風險；過度弓背→後側受壓。兩者都增加傷害
  tag: 關節安全
- q: 腰帶的使用原則（三條建議）？
  a: ①不影響腰背的動作不需要；②影響腰背的動作：輕組不戴，接近最大重量才戴；③始終不戴也可（需系統性建立核心）
  tag: 關節安全
- q: 瓦氏呼吸法（Valsalva maneuver）的利與弊？
  a: 利：增加全軀幹剛性，支撐重載深蹲等；弊：胸腔壓力壓迫心臟，血液回流↓，血壓短暫升高
  tag: 關節安全
- q: 旋轉肌群（rotator cuff）由哪四條肌肉組成？
  a: 岡上肌（supraspinatus）、岡下肌（infraspinatus）、肩胛下肌（subscapularis）、小圓肌（teres minor）
  tag: 關節安全
- q: 阻力訓練的傷害率與其他運動比較？
  a: 約4次/1000小時，低於跑步/有氧/多數球類運動。大學美式足球員：每百人每球季僅0.35次
  tag: 關節安全
- q: 低槓深蹲 vs 高槓深蹲的力矩分布差異？
  a: 低槓：軀幹前傾，槓遠離膝近髖→髖力矩大、膝力矩小；高槓：軀幹較直→膝力矩大、髖力矩小
  tag: 關節安全
- q: 扭矩（Torque）的完整公式？力矩臂的精確定義？
  a: T = F × 力矩臂（moment arm）；力矩臂 = 力的作用線到旋轉軸的「垂直距離」，非力到關節的直線距離
  tag: 力學概念
- q: 肌肉拉力的兩個分力是什麼？對訓練有何含義？
  a: 旋轉分力（rotary component，產生扭矩）+ 穩定分力（stabilizing/dislocating component，壓或拉關節）；關節角度改變時兩者比例不斷變化
  tag: 力學概念
- q: 力-速度曲線（force-velocity curve）的核心規律？
  a: 向心：速度↑則力量↓（反比）；等長在中間；離心：速度↑力量微升後趨於穩定，始終高於等長
  tag: 力學概念
- q: 惰性點（sticking point）的生物力學成因？
  a: 特定關節角度下肌肉拉力角或力臂最不利，力量最小；通常在動作中段，如深蹲剛站起10-20° 的弱點區
  tag: 力學概念
- q: 等速肌力測定器（isokinetic dynamometer）的定義與特點？
  a: 使關節以恆定角速度運動；阻力自動配合肌力變化（全ROM皆接近最大收縮）；臨床常用但成本高、不模擬真實動作
  tag: 力學概念
- q: 可變阻力器械（variable resistance / cam-based machines）的原理？
  a: 凸輪（cam）形狀設計使阻力矩隨關節角度改變，試圖匹配肌力曲線；目的是讓全ROM都有足夠刺激
  tag: 阻力來源
- q: 肢體長度（如股骨長）對深蹲生物力學的影響？
  a: 股骨越長→軀幹前傾角度越大→脊椎力矩↑；高個子深蹲腰椎負擔通常高於矮個子
  tag: 力學概念
- q: 質量（mass）與重量（weight）的區別？
  a: 質量（kg）= 物質含量，不隨重力改變；重量（N）= 質量 × 重力加速度（9.81 m/s²）；自由重量訓練的阻力來自重量（重力）
  tag: 力學概念
- q: 脊旁肌的機械利益為何極低？臨床意義？
  a: 肌腱附著點距脊椎旋轉軸僅約5cm（力臂極短）→肌肉需產生巨大內力（可達外部負荷10倍）→椎間盤和肌腱承受極大壓力
  tag: 關節安全
- q: SI常用單位換算：1 lb = ? N；1 ft = ? m；1° = ? rad？
  a: 1 lb = 4.448 N；1 ft = 0.3048 m；1° = 0.01745 rad；訓練中磅/公斤→牛頓需乘以重力加速度
  tag: 力學概念
- q: 離心收縮為何能產生最大力量？
  a: 彈性元件（肌腱+結締組織）被拉伸儲能，加上橫橋在最適重疊長度下被動延長→比向心最大收縮力高20-50%
  tag: 肌力因素
- q: 淨肌肉扭矩（net muscle torque）如何決定動作方向？
  a: 同一關節所有肌群扭矩的合計；若屈肌群扭矩 > 伸肌群扭矩 → 關節屈曲；重訓中通常設計主動肌產生最大淨扭矩以克服阻力矩
  tag: 力學概念
