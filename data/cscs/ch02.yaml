id: ch02
weight: 2
title: Ch.2 阻力運動生物力學
topics:
- id: joint-biomechanics
  title: 關節生物力學 Joint Biomechanics
  desc: ''
  tag: Joint Biomechanics
  items:
  - id: ch02.joint-biomechanics.i01
    q: 背部傷害風險
    a:
    - 85-90%椎間盤突出發生於L4/L5或L5/S1
    - 脊旁肌力臂極短（約2英吋，5cm），內力可達舉起重量的10倍以上
    detail: 脊旁肌力臂之所以短，是因為豎脊肌到椎間盤的垂直距離遠小於外部重量到椎間盤的水平距離。這種機械不利代表椎間盤與肌腱在提重時承受巨大壓迫力，是背部最脆弱的根本原因。
    terms:
    - vertebral-column
    numbers:
    - v: 85-90
      unit: '%'
      of: 椎間盤突出發生於L4/L5或L5/S1的比例
    - v: 約5
      unit: cm
      of: 脊旁肌（豎脊肌）到椎間盤旋轉軸的力臂長度（書中原文）
    - v: 超過10
      unit: 倍
      of: 背肌內力相對於舉起重量的比值（書中寫 frequently exceed 10 times）
    concepts:
    - structure
    - injury
    related:
    - ch02.joint-biomechanics.i02
    - ch02.joint-biomechanics.i03
    locator: '第 2 章 · Back Injury'
  - id: ch02.joint-biomechanics.i02
    q: 腰椎中立姿勢
    a:
    - 中立腰椎（自然前凸）整體優於圓背，可減少L5/S1壓迫力與韌帶應力
    - 圓背→前側椎間盤受壓；過度弓背→後側受壓
    detail: 脊椎自然呈S形：胸椎後凸、腰椎前凸，此姿勢下椎間盤受力最均勻。圓背或過度弓背都使椎間盤受力不均，可能導致破裂。書中同時指出，背肌在腰椎前凸時可產生較高的力量輸出。
    terms:
    - vertebral-column
    numbers: []
    concepts:
    - structure
    - technique
    related:
    - ch02.joint-biomechanics.i01
    - ch02.joint-biomechanics.i03
    locator: '第 2 章 · Back Injury'
  - id: ch02.joint-biomechanics.i03
    q: 腹內壓 & 腰帶
    a:
    - 腹肌與橫膈膜收縮產生「流體球」，可輔助支撐脊椎
    - 瓦氏呼吸法增加全軀幹剛性，但有壓迫心臟、升高血壓的副作用
    - 保持氣道開放的腹肌收縮更安全（不加胸腔壓力）；腰帶不宜每組都戴
    detail: 書中區分兩種腹內壓產生方式：（1）閉聲門（瓦氏法）同時增加腹腔與胸腔壓力；（2）保持氣道開放只加腹腔壓力。第二種對一般訓練更安全。腰帶雖可提高腹內壓，但若每組都戴，深層腹肌可能因缺乏刺激而不能獨立產生足夠壓力。
    terms:
    - valsalva
    numbers: []
    concepts:
    - structure
    - technique
    - safety
    related:
    - ch02.joint-biomechanics.i01
    - ch02.joint-biomechanics.i02
    locator: '第 2 章 · Intra-Abdominal Pressure and Lifting Belts'
  - id: ch02.joint-biomechanics.i04
    q: 肩關節
    a:
    - 肩關節是全身活動度最大的關節，但關節窩（glenoid cavity）不如髖的球窩深，穩定性相對低
    - 旋轉肌群（岡上肌、岡下肌、肩胛下肌、小圓肌）對維持穩定最關鍵
    - 需均衡訓練肩部所有主要動作方向
    detail: 肩部高活動度帶來高傷害風險：骨骼、肌肉、肌腱、韌帶與滑液囊距離極近，容易互相夾擠引發肌腱炎。重訓的臥推與肩推對肩部壓力特別大，暖身與全方向均衡訓練是預防的核心。
    terms:
    - multiaxial-joint
    numbers: []
    concepts:
    - structure
    - safety
    related:
    - ch02.joint-biomechanics.i01
    locator: '第 2 章 · Shoulders'
  - id: ch02.joint-biomechanics.i05
    q: 膝關節
    a:
    - 膝關節位於上下腿兩根長槓桿之間，容易受傷
    - 髕骨主要功能：把股四頭肌肌腱維持在遠離旋轉軸的位置，保持較大的力臂與機械利益
    - 不適當的負荷、訓練量或恢復，可導致髕腱炎
    detail: 書中強調髕腱炎並非深蹲等動作「本身的風險」，而是訓練量與強度過度堆積、缺乏適當漸進所致。額狀面與橫切面的扭矩在訓練中幾乎不存在，主要由韌帶與軟骨結構保護。
    terms:
    - cartilaginous-joint
    numbers: []
    concepts:
    - structure
    - injury
    related:
    - ch02.levers.i07
    - ch02.joint-biomechanics.i06
    locator: '第 2 章 · Knees'
  - id: ch02.joint-biomechanics.i06
    q: 膝蓋護具
    a:
    - 重型護具透過彈性效果，平均可對深蹲增加25磅（110N）的助力，而非僅靠穩定或心理安慰
    - 建議若要使用，限於最大重量組；相關副作用包括皮膚損傷與髕骨軟骨磨損
    detail: 書中引用研究指出，護具真正的機械作用是在伸膝時直接給予助力。這意味著使用護具訓練的重量不等於個人真實的伸膝力量，競技場合需評估是否允許使用。
    terms: []
    numbers:
    - v: 25
      unit: 磅（110 N）
      of: 重型護具透過彈性效果對深蹲增加的平均助力
    concepts:
    - structure
    - technique
    related:
    - ch02.joint-biomechanics.i05
    locator: '第 2 章 · Knees'
  - id: ch02.joint-biomechanics.i07
    q: 深蹲軀幹角度
    a:
    - 低槓深蹲：槓鈴水平位置遠離膝、靠近髖→髖伸肌力矩大、膝伸肌力矩小
    - 高槓深蹲：槓鈴位置較高且靠近頸→膝伸肌力矩大、髖伸肌力矩相對小
    detail: 阻力的力矩臂等於重量到關節的水平距離。低槓迫使軀幹前傾以維持重心平衡，使槓鈴水平上更靠近髖關節而遠離膝；高槓允許軀幹較直立，把更多力矩分配給股四頭肌。這說明槓鈴位置決定肌群受力分配。
    terms:
    - moment-arm
    numbers: []
    concepts:
    - structure
    - technique
    related:
    - ch02.resistance-sources.i01
    - ch02.levers.i05
    locator: '第 2 章 · Applications to Resistance Training'
  - id: ch02.joint-biomechanics.i08
    q: 阻力訓練傷害率
    a:
    - 約4次/1000小時，低於跑步、有氧與多數球類運動
    - 大學美式足球員：每100人每球季僅0.35次阻力訓練相關傷害
    - 傷害僅佔賽季傷害失能時間的0.74%
    detail: 書中強調阻力訓練是各類體能活動中相對安全的。最高傷害率出現在團隊運動；居中的是跑步與有氧；最低的是自行車、走路與阻力訓練。低風險並非零風險，謹慎的風險管理仍有必要。
    terms: []
    numbers:
    - v: 約4
      unit: 次/1000小時
      of: 阻力訓練的傷害發生率
    - v: 0.35
      unit: 次/每100人每球季
      of: 大學美式足球員阻力訓練相關傷害率
    - v: 0.74
      unit: '%'
      of: 阻力訓練傷害佔賽季傷害失能時間的比例
    concepts:
    - structure
    - safety
    related: []
    locator: '第 2 章 · Joint Biomechanics: Concerns in Resistance Training'
- id: levers
  title: 槓桿系統 Levers
  desc: ''
  tag: Levers
  items:
  - id: ch02.levers.i01
    q: 第一類槓桿
    a:
    - 支點在中間，肌肉力與阻力在兩側
    - 例：肱三頭肌伸肘（肘關節為支點，三頭肌在一側，外部阻力在另一側）
    detail: 書中以前臂為第一類槓桿的例子（圖2.2），計算機械利益 = 5cm（肌肉力臂）÷ 40cm（阻力臂）= 0.125，明顯小於1，是機械不利的配置。第一類槓桿並不一定機械不利，但人體中的第一類槓桿案例確實大多如此。
    terms:
    - mechanical-advantage
    - moment-arm
    numbers:
    - v: 0.125
      unit: 無單位（比值）
      of: 肘關節伸展（三頭肌）的機械利益（書中圖2.2範例：5cm÷40cm）
    concepts:
    - force-production
    - structure
    related:
    - ch02.levers.i04
    locator: '第 2 章 · Levers of the Musculoskeletal System'
  - id: ch02.levers.i02
    q: 第二類槓桿
    a:
    - 肌肉力與阻力在支點同側，且肌肉力臂 > 阻力臂
    - 例：踮腳尖（腓腸肌）：腳球為支點，體重在中間，腓腸肌力臂更長
    - 機械利益 > 1，肌肉力小於阻力
    detail: 踮腳尖時，前腳掌為支點（fulcrum），體重向下的阻力落在腳掌中段，而腓腸肌透過跟腱在更後方拉，使力臂更長。這是人體少數機械利益大於1的例子，可以相對省力地抵抗體重。
    terms:
    - mechanical-advantage
    - moment-arm
    - fulcrum
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.levers.i04
    locator: '第 2 章 · Levers of the Musculoskeletal System'
  - id: ch02.levers.i03
    q: 第三類槓桿
    a:
    - 肌肉力與阻力在支點同側，且肌肉力臂 < 阻力臂
    - 例：肱二頭肌彎舉（肌力在肘靠近側，阻力在遠端）
    - 機械利益 < 1，是人體最常見的槓桿類型
    detail: 第三類槓桿代表肌肉必須產生遠大於外部阻力的力，才能產生相同的扭矩。這雖然「費力」，但換來的好處是速度：肌肉很小的縮短量可讓遠端肢段移動很大的弧長，適合需要大幅度快速動作的人體設計。
    terms:
    - mechanical-advantage
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.levers.i04
    locator: '第 2 章 · Levers of the Musculoskeletal System'
  - id: ch02.levers.i04
    q: 機械利益 MA
    a:
    - MA = 肌肉力臂 ÷ 阻力臂
    - 人體大多數肌肉 MA < 1，處於機械不利；因此肌肉內力遠大於外部阻力
    - 理解機械利益原理比槓桿分類更重要
    detail: 機械不利是人體設計的必然結果（肌腱附著點距關節很近），代價是肌肉與肌腱承受的力遠大於手腳施加在外物上的力，這是肌腱受傷的主要結構性原因。書中明確指出：「understanding the principle of mechanical advantage is of much greater importance than being able to classify levers.」
    terms:
    - mechanical-advantage
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.levers.i01
    - ch02.levers.i02
    - ch02.levers.i03
    locator: '第 2 章 · Levers of the Musculoskeletal System'
  - id: ch02.levers.i05
    q: 力矩 Torque
    a:
    - Torque = 力 × 力臂（力的作用線到旋轉軸的垂直距離）
    - 肌肉以力矩形式作用於關節，而非純直線力
    detail: 力臂的定義是力的作用線到支點的「垂直距離」，不是力到支點的直線距離——這個區別很重要：手持重量時，重量產生的力矩臂等於重量到關節的水平距離（因為重力永遠垂直向下，其力臂必然是水平方向量到關節）。
    terms:
    - torque
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.levers.i06
    - ch02.work-power.i04
    locator: '第 2 章 · Levers of the Musculoskeletal System'
  - id: ch02.levers.i06
    q: 動態力臂變化
    a:
    - 動作過程中力臂持續改變（關節並非真正的鉸鏈，旋轉軸也會移動）
    - 自由重量的阻力矩臂 = 重量到關節的水平距離，隨動作角度不斷變化
    detail: 舉例：手臂彎舉時，前臂水平時槓鈴到肘關節的水平距離最長，此時阻力力矩最大；前臂垂直（向上或向下）時水平距離接近零，阻力力矩接近零。這解釋了自由重量動作在不同角度難易程度不同的原因。
    terms:
    - moment-arm
    - torque
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.levers.i05
    - ch02.resistance-sources.i01
    locator: '第 2 章 · Levers of the Musculoskeletal System'
  - id: ch02.levers.i07
    q: 髕骨的作用
    a:
    - 髕骨維持股四頭肌肌腱與膝關節旋轉軸的距離，防止肌腱靠近旋轉軸
    - 這使股四頭肌在整個活動範圍內維持較大的力臂與相對穩定的機械利益
    detail: 書中圖2.5比較有無髕骨的差異：缺乏髕骨時，肌腱會靠近旋轉軸，力臂縮短，機械利益下降。髕骨是人體為補償膝關節幾何不利而演化出的特殊結構，說明骨骼形狀直接影響肌肉效能。
    terms:
    - mechanical-advantage
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.joint-biomechanics.i05
    - ch02.levers.i06
    locator: '第 2 章 · Levers of the Musculoskeletal System'
  - id: ch02.levers.i08
    q: 人體機械不利的後果
    a:
    - 人體大多數肌肉 MA < 1，使肌肉與肌腱承受的力遠大於外部阻力
    - 這種高內力是肌肉與肌腱受傷的主要結構原因
    detail: 以圖2.2的肘伸為例，阻力臂是肌肉力臂的8倍，因此肌肉需產生外部阻力8倍的力。這種設計換來的代價就是肌腱長期處於高應力，是慢性過用傷害的根本解剖原因。書中強調此原理的重要性高於槓桿類型分類。
    terms:
    - mechanical-advantage
    numbers: []
    concepts:
    - force-production
    - injury
    related:
    - ch02.levers.i04
    - ch02.joint-biomechanics.i01
    locator: '第 2 章 · Levers of the Musculoskeletal System'
- id: musculature
  title: 骨骼肌肉組織 Musculature
  desc: ''
  tag: Musculature
  items:
  - id: ch02.musculature.i01
    q: 起點 Origin
    a:
    - 傳統定義：近端（靠近身體中心）附著點，通常是較固定的一端
    detail: 「近端＝起點」是解剖傳統，但書中指出這個定義會在動作改變時產生令人困惑的角色互換（見 musculature.i08 的髂腰肌例子）。傳統定義的好處是一致性：不管動作怎麼做，起止點的名稱不變。
    terms:
    - periosteum
    numbers: []
    concepts:
    - structure
    related:
    - ch02.musculature.i02
    - ch02.musculature.i08
    locator: '第 2 章 · Skeletal Musculature'
  - id: ch02.musculature.i02
    q: 止點 Insertion
    a:
    - 傳統定義：遠端（遠離身體中心）附著點，通常是較活動的一端
    detail: 書中同時提到另一種定義方式：以「較固定的一側為起點、較活動的一側為止點」。這種定義在動作改變時起止點會互換，反而容易混淆，因此傳統的近端/遠端定義提供更高的一致性。
    terms:
    - periosteum
    numbers: []
    concepts:
    - structure
    related:
    - ch02.musculature.i01
    locator: '第 2 章 · Skeletal Musculature'
  - id: ch02.musculature.i03
    q: 附著方式
    a:
    - 肉質附著（fleshy attachment）：肌纖維直接固定在骨頭上，常見於近端，力量分散在較大面積
    - 纖維附著（fibrous attachment）：透過肌腱，纖維延伸入骨膜甚至骨頭本身，強度高
    detail: 兩種附著方式各有功能邏輯：肉質附著分散力、降低局部骨骼壓力；纖維附著（肌腱）集中且傳導力，適合需要精確施力點的動作。肌腱的纖維延伸入骨頭，使這個接合介面非常堅韌。
    terms:
    - collagen
    numbers: []
    concepts:
    - structure
    related:
    - ch02.musculature.i01
    - ch02.musculature.i02
    locator: '第 2 章 · Skeletal Musculature'
  - id: ch02.musculature.i04
    q: 主動肌 Agonist
    a:
    - 直接完成動作的主要肌肉，又稱 prime mover
    - 例：投擲時肱三頭肌伸肘加速前臂
    detail: 主動肌是動作的「主力執行者」，但幾乎所有動作都同時需要拮抗肌和協同肌配合。孤立地訓練主動肌而忽視其他角色，可能造成關節穩定性不足。
    terms:
    - motor-unit
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.musculature.i05
    - ch02.musculature.i06
    locator: '第 2 章 · Skeletal Musculature'
  - id: ch02.musculature.i05
    q: 拮抗肌 Antagonist
    a:
    - 減速或停止動作，同時協助關節穩定，保護韌帶與軟骨免受衝擊
    - 例：投擲末期肱二頭肌煞住肘伸，防止肘關節過伸
    detail: 書中明確指出拮抗肌有兩個功能：（1）協助關節穩定；（2）在快速動作末段煞車，保護韌帶與軟骨免受「內部衝擊」。若拮抗肌無力，這兩項保護功能都會下降，提高關節受傷的風險。
    terms:
    - motor-unit
    numbers: []
    concepts:
    - force-production
    - structure
    - injury
    related:
    - ch02.musculature.i04
    locator: '第 2 章 · Skeletal Musculature'
  - id: ch02.musculature.i06
    q: 協同肌 Synergist
    a:
    - 間接協助動作完成的肌肉
    - 例：穩定肩胛骨的肌肉，是上臂動作的協同肌（上臂許多肌肉起點在肩胛骨，需要穩定基座）
    detail: 書中以肩胛骨為例說明：上臂的主動肌起點在肩胛骨，若沒有協同肌穩定肩胛骨這個「基座」，主動肌的拉力方向就不固定，動作效能大幅下降。這解釋了為何下斜方肌、前鋸肌等「不起眼」的肩胛穩定肌對上肢表現至關重要。
    terms:
    - motor-unit
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.musculature.i04
    - ch02.musculature.i07
    locator: '第 2 章 · Skeletal Musculature'
  - id: ch02.musculature.i07
    q: 雙關節肌注意
    a:
    - 股直肌同時跨越髖（屈）與膝（伸），進行蹲起時需要臀大肌等協同肌抵消其在髖部的屈曲效果
    detail: 這是協同肌不可或缺的典型案例：股直肌在膝伸展的同時，它的張力也會屈曲髖部。若沒有髖伸肌（如臀大肌）同步作用，蹲起時人會自動前傾。這也說明訓練動作的整體協調性，不能只看單一肌肉。
    terms:
    - motor-unit
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.musculature.i06
    locator: '第 2 章 · Skeletal Musculature'
  - id: ch02.musculature.i08
    q: 實例：髂腰肌的起止點互換
    a:
    - 直腿仰臥起：髂腰肌中的髂肌（iliacus）起點是股骨（較固定），骨盆為止點
    - 抬腿動作：骨盆固定，股骨變為較活動端，角色互換——但傳統定義不改變起止點名稱
    detail: 書中用這個例子說明「以較活動端為止點」定義的缺陷：同一塊肌肉在不同動作下起止點對調，容易造成混淆。注意：書中用的是髂肌（iliacus），不是整個髂腰肌複合體（iliopsoas）——兩者有所不同，髂腰肌是髂肌加腰大肌的合稱。
    terms:
    - periosteum
    numbers: []
    concepts:
    - structure
    related:
    - ch02.musculature.i01
    - ch02.musculature.i02
    locator: '第 2 章 · Skeletal Musculature'
- id: planes
  title: 解剖平面與動作 Planes
  desc: ''
  tag: Planes
  items:
  - id: ch02.planes.i01
    q: 矢狀面 Sagittal
    a:
    - 將身體分左右的平面；主要動作：屈曲/伸展
    - 書中例子：站立槓鈴彎舉（standing barbell curl）
    detail: 矢狀面是日常最常用的平面（走路、跑步、深蹲、硬舉幾乎都在矢狀面）。屈曲/伸展在書中圖2.10有完整列表，包含髖屈、膝伸等。
    terms:
    - sagittal-plane
    numbers: []
    concepts:
    - structure
    - technique
    related:
    - ch02.planes.i02
    - ch02.planes.i03
    locator: '第 2 章 · Anatomical Planes and Major Body Movements'
  - id: ch02.planes.i02
    q: 冠狀面 Frontal
    a:
    - 將身體分前後的平面；主要動作：外展/內收
    - 書中例子：站立側向啞鈴舉（standing lateral dumbbell raise）
    detail: 冠狀面的訓練在標準計畫中常被忽略，但對側向切入（cutting）、游泳（划臂外展）、體操等側向動作的運動特殊性訓練有重要價值。
    terms:
    - frontal-plane
    numbers: []
    concepts:
    - structure
    - technique
    related:
    - ch02.planes.i01
    - ch02.planes.i03
    locator: '第 2 章 · Anatomical Planes and Major Body Movements'
  - id: ch02.planes.i03
    q: 橫切面 Transverse
    a:
    - 將身體分上下的平面；主要動作：旋轉
    - 書中例子：啞鈴飛鳥（dumbbell fly）
    detail: 橫切面的旋轉動作在投擲、揮棒、網球等項目中極為關鍵，但在標準阻力訓練計畫中最常被忽略。軀幹旋轉、髖內外旋都屬於此平面。
    terms:
    - transverse-plane
    numbers: []
    concepts:
    - structure
    - technique
    related:
    - ch02.planes.i01
    - ch02.planes.i02
    locator: '第 2 章 · Anatomical Planes and Major Body Movements'
  - id: ch02.planes.i04
    q: 解剖姿勢
    a:
    - 直立、手臂垂放兩側、手掌朝前
    - 所有平面方位與動作方向描述的基準姿勢
    detail: 解剖姿勢是一套命名協定的基準，確保「向前」「向上」「外展」等方向描述不因人的朝向而歧義。沒有這個基準，解剖學描述就會因個人站姿不同而混亂。
    terms:
    - anatomical-position
    numbers: []
    concepts:
    - structure
    related:
    - ch02.planes.i01
    - ch02.planes.i02
    - ch02.planes.i03
    locator: '第 2 章 · Anatomical Planes and Major Body Movements'
  - id: ch02.planes.i05
    q: 常被忽略的動作
    a:
    - 肩內/外旋（投擲、網球）
    - 膝屈（衝刺）
    - 髖屈（踢球、衝刺）
    - 踝背屈（跑步）
    - 髖內/外旋（轉向切入）
    - 髖外展/內收（側向切入）
    - 軀幹旋轉（投擲、揮棒）
    detail: 書中明確列出這些動作「常被標準阻力訓練計畫忽略」。它們在場上動作中很關鍵，若選手在這些方向上力量不足，成為傷害的薄弱環節。
    terms: []
    numbers: []
    concepts:
    - structure
    - technique
    - program-design
    related:
    - ch02.planes.i06
    locator: '第 2 章 · Anatomical Planes and Major Body Movements'
  - id: ch02.planes.i06
    q: 訓練特殊性
    a:
    - 選擇與目標運動相同關節動作的訓練動作（specificity of training）
    - 慢動作影片可輔助分析運動動作，市售軟體可做更詳細的數位影片分析
    detail: 動作特殊性原則的前提是先「正確識別運動所需的動作平面與關節動作」，這需要生物力學分析能力或借助影片工具。分析完目標運動後，才能選擇有效的阻力訓練替代動作。
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch02.planes.i05
    locator: '第 2 章 · Anatomical Planes and Major Body Movements'
  - id: ch02.planes.i07
    q: 平面間遷移
    a:
    - 雖然動作很少只發生在單一平面，在主要平面訓練的效果足以遷移到跨平面動作
    - 因此在三個主要平面內訓練肌肉即可，不需要對每一個斜向動作都設計特定訓練
    detail: 書中明確指出：「exercising muscles within the planes also strengthens them for movements between the planes.」這為「以平面為框架設計訓練」提供了理論依據，說明不必對每個特定角度的運動動作都設計精確的模擬訓練。
    terms: []
    numbers: []
    concepts:
    - program-design
    - technique
    related:
    - ch02.planes.i06
    locator: '第 2 章 · Anatomical Planes and Major Body Movements'
  - id: ch02.planes.i08
    q: 三個平面各的書中舉例動作
    a:
    - 矢狀面：站立槓鈴彎舉（standing barbell curl）
    - 冠狀面：站立側向啞鈴舉（standing lateral dumbbell raise）
    - 橫切面：啞鈴飛鳥（dumbbell fly）
    detail: 書中正文僅明確列出這三個例子對應三個平面（圖2.9附近）。圖2.10是一張各動作的完整圖表，但內容是圖片格式，無法直接引用。書中同時舉了衝刺、投擲、游泳等運動的特定動作，但它們在圖中，非正文文字。
    terms:
