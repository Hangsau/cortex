id: ch02
weight: 2
title: Ch.2 阻力運動生物力學
topics:
- id: joint-biomechanics
  title: 關節生物力學 Joint Biomechanics
  desc: ''
  tag: Joint Biomechanics
  items:
  - id: ch02.joint-biomechanics.i01
    q: 背部傷害風險
    a:
    - 85-90%椎間盤突出發生於L4/L5或L5/S1。脊旁肌機械利益極低，內力可達外力10倍
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.joint-biomechanics.i02
    q: 腰椎中立姿勢
    a:
    - 自然S形（腰椎前凸）優於圓背。圓背=前側椎間盤受壓
    - 過度弓背=後側受壓
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.joint-biomechanics.i03
    q: 腹內壓 & 腰帶
    a:
    - 「流體球」支撐脊椎。瓦氏呼吸法增加全軀幹剛性，但有血壓風險。腰帶不宜每組都戴
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.joint-biomechanics.i04
    q: 肩關節
    a:
    - 活動度最大=最不穩定。旋轉肌群（岡上/下、肩胛下、小圓）維持穩定。需均衡訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.joint-biomechanics.i05
    q: 膝關節
    a:
    - 位於兩長槓桿之間→易受傷。髕骨功能=增加股四頭肌力臂。過度訓練量→髕腱炎
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.joint-biomechanics.i06
    q: 膝蓋護具
    a:
    - 重型護具可平均增加25磅舉起力（彈性效果），而非僅心理作用。建議限用最重組
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.joint-biomechanics.i07
    q: 深蹲軀幹角度
    a:
    - 低槓：軀幹前傾→髖力矩大、膝力矩小。高槓：軀幹直立→膝力矩大、髖力矩小
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.joint-biomechanics.i08
    q: 阻力訓練傷害率
    a:
    - 約4次/1000小時，低於多數運動。大學美式足球員：每100人每球季僅0.35次
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
- id: levers
  title: 槓桿系統 Levers
  desc: ''
  tag: Levers
  items:
  - id: ch02.levers.i01
    q: 第一類槓桿
    a:
    - 支點在中間，肌肉力與阻力在兩側。例：肱三頭肌伸肘。機械利益通常 <1
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.levers.i02
    q: 第二類槓桿
    a:
    - 阻力在中間，肌肉力臂 > 阻力臂。例：踮腳尖（腓腸肌）。機械利益 >1，省力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.levers.i03
    q: 第三類槓桿
    a:
    - 肌肉力在中間，肌肉力臂 < 阻力臂。例：肱二頭肌彎舉。最常見，需較大肌力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.levers.i04
    q: 機械利益 MA
    a:
    - MA = 肌肉力臂 / 阻力臂。人體大多 <1（機械不利），因此肌肉力遠大於外部阻力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.levers.i05
    q: 力矩 Torque
    a:
    - Torque = 力 × 力臂（垂直距離）。肌肉以力矩形式作用於關節，而非直線力
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.levers.i06
    q: 動態力臂變化
    a:
    - 動作過程中力臂持續改變。自由重量的阻力矩臂 = 重量與關節的「水平距離」
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.levers.i07
    q: 髕骨的作用
    a:
    - 防止股四頭肌肌腱靠近膝關節旋轉軸，維持較大力臂，保持機械利益相對穩定
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.levers.i08
    q: 考試重點
    a:
    - 理解機械利益原理比分類槓桿更重要。人體高內力→肌腱受傷風險主因
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
- id: musculature
  title: 骨骼肌肉組織 Musculature
  desc: ''
  tag: Musculature
  items:
  - id: ch02.musculature.i01
    q: 起點 Origin
    a:
    - 傳統定義：近端（靠近身體中心）附著點。通常較固定的一端。
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.musculature.i02
    q: 止點 Insertion
    a:
    - 遠端（遠離身體中心）附著點。通常較活動的一端。
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.musculature.i03
    q: 附著方式
    a:
    - 肉質附著（近端，分散力量）
    - 纖維附著（肌腱，延伸入骨骼，強度高）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.musculature.i04
    q: 主動肌 Agonist
    a:
    - 直接執行動作的主要肌肉（prime mover）。例：肱三頭肌於投擲動作中
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.musculature.i05
    q: 拮抗肌 Antagonist
    a:
    - 減速或停止動作，保護關節結構。例：肱二頭肌於肘伸末期煞車
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.musculature.i06
    q: 協同肌 Synergist
    a:
    - 間接協助動作。例：穩定肩胛骨的肌肉 = 上臂動作的協同肌
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.musculature.i07
    q: 雙關節肌注意
    a:
    - 股直肌跨越髖與膝，需要臀大肌等協同肌抵消副作用以維持正確動作
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
  - id: ch02.musculature.i08
    q: 實例：直腿仰臥起
    a:
    - 髂腰肌起點=股骨（較固定），骨盆為止點
    - 但抬腿時骨盆固定，角色互換
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    - force-production
    related: []
    locator: ''
- id: planes
  title: 解剖平面與動作 Planes
  desc: ''
  tag: Planes
  items:
  - id: ch02.planes.i01
    q: 矢狀面 Sagittal
    a:
    - 將身體分左右。屈/伸動作。例：槓鈴彎舉、深蹲、垂直跳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
  - id: ch02.planes.i02
    q: 冠狀面 Frontal
    a:
    - 將身體分前後。外展/內收動作。例：側向啞鈴舉、游泳蛙式
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
  - id: ch02.planes.i03
    q: 橫切面 Transverse
    a:
    - 將身體分上下。旋轉動作。例：啞鈴飛鳥、棒球揮擊軀幹旋轉
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
  - id: ch02.planes.i04
    q: 解剖姿勢
    a:
    - 直立、手臂垂放兩側、手掌朝前。所有平面與動作描述的基準姿勢
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
  - id: ch02.planes.i05
    q: 常被忽略的動作
    a:
    - 肩內/外旋（投擲）、膝屈（衝刺）、踝背屈（跑步）、髖內外旋（轉向）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
  - id: ch02.planes.i06
    q: 訓練特殊性
    a:
    - 選擇與目標運動相同關節動作的訓練動作。慢動作影片可輔助分析
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
  - id: ch02.planes.i07
    q: 平面間遷移
    a:
    - 在主要平面訓練的效果會遷移到平面之間的動作，足夠全面訓練即可
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
  - id: ch02.planes.i08
    q: 常見運動動作
    a:
    - 游泳自由式=肩伸展（矢狀）
    - 籃球轉身=髖橫切面
    - 溜冰=踝外翻（冠狀）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - structure
    related: []
    locator: ''
- id: resistance-sources
  title: 阻力來源 Resistance Sources
  desc: ''
  tag: Resistance Sources
  items:
  - id: ch02.resistance-sources.i01
    q: 重力 Gravity
    a:
    - Fg = m × ag。自由重量/器械皆以重力為阻力。阻力矩臂 = 水平距離（到關節）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
  - id: ch02.resistance-sources.i02
    q: 自由重量 vs 器械
    a:
    - 器械：更安全、設計靈活
    - 自由重量：全身訓練、更接近真實動作、需穩定肌參與
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
  - id: ch02.resistance-sources.i03
    q: 慣性 Inertia
    a:
    - 加速時：阻力 = 重量+慣性力
    - 減速時：阻力 < 重量。爆發性動作=特殊性訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
  - id: ch02.resistance-sources.i04
    q: 摩擦力 Friction
    a:
    - FR = k × FN。啟動摩擦 > 滑動摩擦。速度不影響阻力大小，但功率隨速度增加
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
  - id: ch02.resistance-sources.i05
    q: 流體阻力 Fluid
    a:
    - FR = k × v（速度越快阻力越大）。液壓/氣壓器械：無離心相
    - 拮抗肌輪流作功
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
  - id: ch02.resistance-sources.i06
    q: 彈性 Elasticity
    a:
    - FR = k × x（拉伸越多阻力越大）。與肌肉力量曲線相反→動作結束時最難
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
  - id: ch02.resistance-sources.i07
    q: Cam器械原理
    a:
    - 可變半徑凸輪改變力矩臂，試圖匹配人體扭矩曲線，但需恆速移動才有效
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
  - id: ch02.resistance-sources.i08
    q: 括弧訓練法
    a:
    - 用比正常輕或重的器材練習同一動作（bracketing）。利用力-速度關係增加速度範圍
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related: []
    locator: ''
- id: size-strength
  title: 肌力與體型比例 Size & Strength
  desc: ''
  tag: Size & Strength
  items:
  - id: ch02.size-strength.i01
    q: 肌力/體重比
    a:
    - 衝刺/跳躍：肌力/體重比是關鍵指標。體重增15%但肌力只增10%→比值下降→表現退步
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.size-strength.i02
    q: 體型 vs 肌力關係
    a:
    - 力量 ∝ 橫截面積（線性尺寸²）
    - 體重 ∝ 體積（線性尺寸³）。體型越大，磅磅比越低
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.size-strength.i03
    q: 跨量級比較公式
    a:
    - 古典公式：舉起重量 ÷ 體重^(2/3)，修正體型影響。中等體重選手通常表現最佳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.size-strength.i04
    q: 量級策略
    a:
    - 找到自身肌力相對其他選手最高的量級。確定後：盡可能增強，不超重限
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.size-strength.i05
    q: 肌腱遠附著點
    a:
    - 遠離關節→力矩臂長→力量大，但同樣肌肉縮短量產生的角位移較小→速度↓
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.size-strength.i06
    q: 力-速度關係
    a:
    - Hill曲線：速度↑→向心力量↓。遠附著點在高速時需更快收縮，但力量也隨之下降
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.size-strength.i07
    q: 結構不可修改
    a:
    - 骨骼排列先天決定，但羽狀角度可透過訓練修改，部分解釋訓練後的力量與速度差異
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
  - id: ch02.size-strength.i08
    q: 精英體操選手
    a:
    - 通常身材不高，因為體型越大，需要移動更多自身體重，肌力/體重比相對更差
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related: []
    locator: ''
- id: strength-factors
  title: 肌力生物力學因素 Strength Factors
  desc: ''
  tag: Strength Factors
  items:
  - id: ch02.strength-factors.i01
    q: 神經控制
    a:
    - 運動單元徵召數量、大小、放電頻率（rate coding）。訓練初期進步主因=神經適應
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
  - id: ch02.strength-factors.i02
    q: 肌肉橫截面積
    a:
    - 力量∝橫截面積（非體積）。相同圍度的高個與矮個力量相近，但高個體重更大
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
  - id: ch02.strength-factors.i03
    q: 肌纖維排列
    a:
    - 羽狀肌（pennate）：更多平行肌節→更大力量但速度較低。角度越大，力量越強
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
  - id: ch02.strength-factors.i04
    q: 肌肉長度
    a:
    - 靜息長度（actin-myosin最大重疊）= 最大力量。過短或過長都會降低橋接點數量
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
  - id: ch02.strength-factors.i05
    q: 關節角度
    a:
    - 扭矩隨關節角度變化（非線性）。受肌肉長度-力量關係+動態幾何共同影響
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
  - id: ch02.strength-factors.i06
    q: 收縮速度 Hill曲線
    a:
    - 速度↑→向心力量↓（非線性）。離心力量隨速度↑先升後降，峰值約90°/s
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
  - id: ch02.strength-factors.i07
    q: 三種肌肉動作
    a:
    - 向心（縮短）、離心（延長）、等長（不變）。離心可產生最大力量→作弊動作原理
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
  - id: ch02.strength-factors.i08
    q: 肌腱附著點變異
    a:
    - 附著點遠離關節→扭矩↑力量↑，但速度↓。慢速（健力）有利，快速（網球）不利
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
    related: []
    locator: ''
- id: work-power
  title: 功與功率 Work & Power
  desc: ''
  tag: Work & Power
  items:
  - id: ch02.work-power.i01
    q: 功 Work
    a:
    - W = 力 × 位移（N·m = Joules）。方向需與位移一致（cos θ）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - force-production
