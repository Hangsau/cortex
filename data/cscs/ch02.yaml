- id: resistance-sources
  title: 阻力來源 Resistance Sources
  desc: ''
  tag: Resistance Sources
  items:
  - id: ch02.resistance-sources.i01
    q: 重力 Gravity
    a:
    - Fg = m × ag（重力 = 質量 × 重力加速度）
    - 自由重量與重量堆疊器械的阻力都來自重力
    - 阻力力矩臂 = 重量到關節的水平距離（重力垂直向下，力臂必然是水平量測）
    detail: 書中強調「磅」是力的單位，「公斤」是質量的單位，兩者不應混用。體重計顯示的公斤值實際是質量，重量（Fg）需乘以重力加速度才得到牛頓值。地理位置不同，重力加速度略有差異，因此嚴格說同一槓鈴在不同地點重量不同。
    terms:
    - torque
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.levers.i06
    - ch02.joint-biomechanics.i07
    locator: '第 2 章 · Gravity'
  - id: ch02.resistance-sources.i02
    q: 自由重量 vs 器械
    a:
    - 器械優勢：更安全（不會被壓）、設計靈活（可阻抗自由重量難以訓練的方向）、容易使用
    - 自由重量優勢：全身性訓練（站姿負重促進骨密度）、需要穩定肌群參與、更貼近真實動作協調
    detail: 書中指出自由重量的「重量承重促進骨礦化」效益，是器械難以完全複製的。「結構性動作」（如爆發上搏、抓舉）對大範圍肌肉骨骼系統的刺激是器械訓練所欠缺的。兩種工具各有特定使用情境，非二選一。
    terms:
    - structural-exercise
    numbers: []
    concepts:
    - technique
    - program-design
    related:
    - ch02.resistance-sources.i01
    - ch02.resistance-sources.i07
    locator: '第 2 章 · Weight-Stack Machines'
  - id: ch02.resistance-sources.i03
    q: 慣性 Inertia
    a:
    - 動作初始加速：運動員需施加的力 = 槓鈴重量 + 慣性力（F = m × a）
    - 動作末段減速：阻力 < 槓鈴重量（減速代表拮抗肌在作用，或主動肌給力少於重量）
    - 爆發性加速動作對神經肌肉系統有特殊性訓練效果
    detail: 書中說明：加速型動作讓主動肌在關節活動範圍前段受到更大阻力，末段則較小。對於奧林匹克舉重（如爆發上搏），慣性允許較弱的上肢肌群在下肢完成加速後繼續「搭順風車」讓槓鈴上升。這種慣性利用是特定訓練的設計邏輯，不是副作用。
    terms:
    - inertial-force
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.resistance-sources.i01
    - ch02.resistance-sources.i08
    locator: '第 2 章 · Inertia'
  - id: ch02.resistance-sources.i04
    q: 摩擦力 Friction
    a:
    - FR = k × FN（摩擦力 = 摩擦係數 × 法向力）
    - 啟動摩擦力 > 滑動摩擦力：物體從靜止開始移動需要更大的力
    - 速度不影響滑動摩擦力的大小；但功率隨速度提高而增加
    detail: 書中舉制動式腳踏車測功計為例。使用制動設計器械時，調整的是接觸面法向力（壓緊力）而非速度本身。戶外雪橇因地面（草地/砂地/濕地）不同，摩擦係數會變，導致阻力不可精確重複，這是其訓練監控的主要缺點。
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.resistance-sources.i01
    locator: '第 2 章 · Friction'
  - id: ch02.resistance-sources.i05
    q: 流體阻力 Fluid
    a:
    - FR ≈ k × v（流體阻力大致與速度成正比）
    - 液壓/氣壓器械：阻力隨速度增加而增加，允許快速加速後自動受限
    - 一般不提供離心收縮相：回程由拮抗肌向心收縮完成，兩側肌群輪流作功
    detail: 書中明確指出流體器械「並非等速（isokinetic）」，雖然它能限制速度範圍，但並非全程恆定。缺乏離心訓練是其主要限制：書中說明離心收縮是跑步、跳躍、投擲的核心動作特徵，流體器械難以提供這類特殊性刺激。
    terms:
    - fluid-resistance
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.strength-factors.i07
    locator: '第 2 章 · Fluid Resistance'
  - id: ch02.resistance-sources.i06
    q: 彈性 Elasticity
    a:
    - FR = k × x（阻力與拉伸距離成正比）
    - 動作起始阻力最低，動作末端阻力最高
    - 這與人體肌力曲線相反：大多數肌群在動作末端ROM時力量最弱
    detail: 書中明確指出彈性阻力的缺點：「every exercise movement begins with low resistance and ends with high resistance. This is contrary to the force capability patterns of virtually all human muscle groups.」此外，彈性阻力可調整性有限，且跳躍助力帶產品可能在空中施予最大阻力，反而增加落地衝擊傷害風險。
    terms: []
    numbers: []
    concepts:
    - force-production
    - technique
    - safety
    related:
    - ch02.resistance-sources.i01
    locator: '第 2 章 · Elasticity'
  - id: ch02.resistance-sources.i07
    q: Cam器械原理
    a:
    - 可變半徑凸輪改變重量堆疊的力矩臂長度，使阻力力矩隨關節角度改變
    - 設計目標是讓阻力力矩匹配人體的肌力曲線，全ROM都能達到接近最大刺激
    - 缺點：需要以恆定、緩慢的角速度移動才能如設計作用；且器械常無法準確匹配人體真實扭矩曲線
    detail: Nautilus 是最早商業化此概念的品牌。書中指出這類器械「frequently fail to match normal human torque capability patterns」，說明理論上的匹配在實際訓練中難以實現，因為人體扭矩曲線個體差異大，且動作速度很少真正恆定。
    terms:
    - torque
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.resistance-sources.i01
    - ch02.levers.i05
    locator: '第 2 章 · Weight-Stack Machines'
  - id: ch02.resistance-sources.i08
    q: 括弧訓練法 Bracketing
    a:
    - 以比正常輕和比正常重的器材分別練習同一運動動作（bracketing technique）
    - 利用力-速度關係：重器材→低速高力；輕器材→高速低力
    - 增加神經肌肉系統在更廣速度範圍的適應，但需注意改變負荷對技術動作模式的影響
    detail: 書中以鉛球為例：使用較重的鉛球讓肌肉在低速下產生更大力；使用較輕的鉛球則讓肌肉達到更高速度。書中同時提醒：改變器材負荷可能對技術動作產生負面影響，因為身體需要時間調整特定負荷下的動作模式。
    terms:
    - bracketing-technique
    numbers: []
    concepts:
    - force-production
    - technique
    - program-design
    related:
    - ch02.strength-factors.i06
    - ch02.resistance-sources.i03
    locator: '第 2 章 · Inertia'
- id: size-strength
  title: 肌力與體型比例 Size & Strength
  desc: ''
  tag: Size & Strength
  items:
  - id: ch02.size-strength.i01
    q: 肌力/體重比
    a:
    - 衝刺與跳躍等依賴自身體重加速的運動，肌力對體重之比（strength-to-mass ratio）是關鍵
    - 若體重增加15%但肌力只增加10%，肌力/體重比下降，加速能力退步
    detail: 書中以體型大小的反比例說明這一點：相同體型比例下，體型較大者的體重比力量增長更快（體重 ∝ 尺寸³，肌力 ∝ 尺寸²），導致磅磅肌力下降。衝刺與跳躍選手需特別留意增肌是否同步帶來等比例的力量提升。
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    - program-design
    related:
    - ch02.size-strength.i02
    locator: '第 2 章 · Strength-to-Mass Ratio'
  - id: ch02.size-strength.i02
    q: 體型 vs 肌力關係
    a:
    - 肌力 ∝ 肌肉橫截面積（與線性體型尺寸的平方成正比）
    - 體重 ∝ 體積（與線性體型尺寸的立方成正比）
    - 因此體型增大時，體重的增長比肌力更快，磅磅比下降
    detail: 書中以「尺寸²對尺寸³」說明這個比例關係。這是純幾何定律，不需要生理假設。它解釋了為何大體型運動員雖然絕對肌力更高，但相對體重的肌力（磅磅比）往往低於小體型選手。
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.size-strength.i01
    - ch02.size-strength.i03
    locator: '第 2 章 · Body Size'
  - id: ch02.size-strength.i03
    q: 跨量級比較公式
    a:
    - 古典公式：舉起重量 ÷ 體重^(2/3)，修正體型增大導致的力量/體重比下降
    - 此公式看似對中等體重選手最有利，但書中認為這可能確實反映了中等體重選手的優勢
    detail: 書中指出這個古典公式後又有其他公式被提出，因為古典公式「seemed to favor athletes of middle body weight」，但書中同時表示，中等體重選手表現最優「may indeed be unbiased」（可能不是公式偏差，而是真實現象），因為人口中體重的正態分布使中等體重群體競爭最密集。
    terms:
    - classic-formula
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.size-strength.i02
    - ch02.size-strength.i04
    locator: '第 2 章 · Body Size'
  - id: ch02.size-strength.i04
    q: 量級策略
    a:
    - 找到自身肌力相對同量級選手最高的量級（試錯過程）
    - 確定目標量級後：盡可能增強，不超過體重上限
    detail: 書中以「trial and error」描述找到最佳量級的過程，說明沒有公式能直接算出每個選手的最佳量級。目標是找到自己的相對優勢位置，而非追求最大絕對重量。
    terms: []
    numbers: []
    concepts:
    - program-design
    - force-production
    related:
    - ch02.size-strength.i01
    - ch02.size-strength.i03
    locator: '第 2 章 · Strength-to-Mass Ratio'
  - id: ch02.size-strength.i05
    q: 肌腱遠附著點的利弊
    a:
    - 利：附著點遠離關節→力臂長→相同肌力可產生更大扭矩→慢速動作力量優勢
    - 弊：相同肌肉縮短量產生的關節角位移更小→速度下降
    detail: 書中以圖2.8說明：附著點較遠時，同樣的肌肉縮短量（例如肌肉縮短相同長度），關節旋轉角度反而更少（37° vs 34°），因為幾何三角的關係。因此遠附著點有利於低速高力（如健力），不利於高速動作（如網球揮拍）。
    terms:
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.levers.i04
    - ch02.strength-factors.i08
    locator: '第 2 章 · Variations in Tendon Insertion'
  - id: ch02.size-strength.i06
    q: 力-速度關係
    a:
    - 向心收縮：速度越快，力量越低（非線性反比關係，低速段下降最陡）
    - 遠附著點者在需要高速動作時，因幾何關係需要更快的肌肉縮短速度，在高速收縮下力量更低
    detail: 書中說明：以較遠附著點產生特定關節角速度，肌肉必須以更高收縮速度完成，而由力-速度曲線可知高速時力量更低。這把「幾何利弊」和「力-速度生理」兩個概念連結起來，解釋為何解剖結構直接影響適合的運動項目。
    terms:
    - force-velocity
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.size-strength.i05
    - ch02.strength-factors.i06
    locator: '第 2 章 · Variations in Tendon Insertion'
  - id: ch02.size-strength.i07
    q: 結構的可修改性
    a:
    - 骨骼排列（肌腱附著點位置）先天決定，無法透過訓練改變
    - 羽狀角度（angle of pennation）可透過訓練改變，部分解釋訓練帶來的力量與速度差異
    detail: 書中明確區分：骨骼幾何（附著點）是「nonmodifiable」，但羽狀角度不固定，訓練可改變它——這使同樣體型的人在訓練後產生不同的力量與速度表現。了解哪些結構因素可改、哪些不可改，是制定現實訓練期望的基礎。
    terms:
    - angle-of-pennation
    numbers: []
    concepts:
    - force-production
    - structure
    - adaptation
    related:
    - ch02.strength-factors.i03
    - ch02.size-strength.i05
    locator: '第 2 章 · Variations in Tendon Insertion'
  - id: ch02.size-strength.i08
    q: 精英體操選手的身材特徵
    a:
    - 精英體操選手通常身材較矮小，因為體型增大時體重增加比肌力快，肌力/體重比下降
    - 體操動作高度依賴支撐自身體重的能力（單槓、吊環、自由式）
    detail: 書中明確提到這個例子以說明肌力/體重比的實際意義：「This is why most elite gymnasts are not very tall.」這是「body size」一節的應用例。矮小體型使肌力/體重比維持較高，在無法藉外部重量分散成本的動作中有先天優勢。
    terms: []
    numbers: []
    concepts:
    - force-production
    - structure
    - population
    related:
    - ch02.size-strength.i01
    - ch02.size-strength.i02
    locator: '第 2 章 · Body Size'
- id: strength-factors
  title: 肌力生物力學因素 Strength Factors
  desc: ''
  tag: Strength Factors
  items:
  - id: ch02.strength-factors.i01
    q: 神經控制
    a:
    - 影響力量的神經因素：（1）運動單位徵召數量；（2）運動單位大小；（3）放電頻率（rate coding）
    - 訓練初期的力量進步主要來自神經適應，而非肌肥大（肌肥大發生較慢）
    detail: 書中指出初學者常因為幾週後進步速度下降而沮喪，但書中說明：持續訓練仍會進步，只是機制從神經適應切換到較慢的肌肥大。這是設定正確訓練期望的重要概念。
    terms:
    - recruitment
    - rate-coding
    - motor-unit
    numbers: []
    concepts:
    - force-production
    - adaptation
    related:
    - ch02.strength-factors.i02
    locator: '第 2 章 · Neural Control'
  - id: ch02.strength-factors.i02
    q: 肌肉橫截面積
    a:
    - 肌肉力量與橫截面積（CSA）相關，而非與體積（或長度）相關
    - 相同肱二頭肌圍度的高個與矮個，力量相近，但高個體重更大→磅磅比更低
    detail: 書中以兩位肌肉圍度相同但身高不同的選手為例說明：「their upper arm muscle cross-sectional areas are about the same... the strength of the two athletes' biceps should be about the same」。這解釋了為何長肌肉（高個子的肌肉）不等於更強的肌肉，強度取決於粗細（CSA），不是長短。
    terms:
    - crossbridge
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.strength-factors.i01
    - ch02.size-strength.i02
    locator: '第 2 章 · Muscle Cross-Sectional Area'
  - id: ch02.strength-factors.i03
    q: 肌纖維排列
    a:
    - 最大收縮時肌肉可產生 16–100 N/cm² 的力（23–145 psi），範圍因肌纖維排列差異而大
    - 羽狀肌（pennate muscle）：肌纖維斜向排列，平行肌節數多→力量強；但串聯肌節少→收縮速度低
    - 羽狀角度可因訓練改變，且不保持固定（肌肉縮短時角度增大）
    detail: 書中說明羽狀角度在人體中大多不超過15°，且肌肉縮短時角度增大。羽狀肌的「更多平行肌節」意味著可同時有更多橫橋同時產力，但「更少串聯肌節」意味著縮短速度上限較低。這是力量與速度在肌肉纖維排列層面的基礎取捨。
    terms:
    - angle-of-pennation
    - sarcomere
    numbers:
    - v: 16-100
      unit: N/cm²
      of: 最大收縮時肌肉可產生的力量範圍（書中原文 23-145 psi 換算，因肌纖維排列差異）
    concepts:
    - force-production
    - structure
    related:
    - ch02.strength-factors.i04
    - ch02.size-strength.i07
    locator: '第 2 章 · Arrangement of Muscle Fibers'
  - id: ch02.strength-factors.i04
    q: 肌肉長度
    a:
    - 靜息長度（resting length）下，肌動蛋白與肌凝蛋白重疊最大，可用橫橋位點最多，力量最大
    - 過短或過長都會減少橫橋接合位點，降低力量輸出
    detail: 這是長度-張力關係（length-tension relationship）的生理基礎。對訓練的應用是：某些動作在特定ROM起始或末端時肌肉不在最適長度，這是inertia-based和cam-based器械嘗試解決的問題（讓阻力在肌肉力量最弱時最低）。
    terms:
    - actin
    - myosin
    - crossbridge
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.strength-factors.i03
    - ch02.strength-factors.i05
    locator: '第 2 章 · Muscle Length'
  - id: ch02.strength-factors.i05
    q: 關節角度
    a:
    - 關節可產生的扭矩隨角度非線性變化
    - 影響因素：（1）肌肉長度-力量關係；（2）動態幾何（力臂隨角度改變）；（3）收縮類型；（4）收縮速度
    detail: 書中指出「the amount of torque that can be exerted about a given body joint varies throughout the joint's range of motion」，並列出四個影響因素。關節角度-扭矩曲線的形狀因動作（等長/等速/等張）不同而異，不能一概而論。
    terms:
    - torque
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.strength-factors.i04
    - ch02.strength-factors.i06
    locator: '第 2 章 · Joint Angle'
  - id: ch02.strength-factors.i06
    q: 收縮速度 力-速度曲線
    a:
    - 向心收縮：速度↑則力量↓（非線性，低速段下降最陡，由 A.V. Hill 的古典實驗建立）
    - 離心收縮：速度↑則力量↑，直到約 90°/s（1.57 rad/s）後開始緩慢下降
    - 因此離心收縮可產生最大力量
    detail: 書中以垂直跳為例說明如何利用此曲線：起跳時手臂向上擺動，對身體向下施加力，迫使髖膝伸肌在更低速度下收縮，使其在較高力量的區段工作。書中引用 Jorgensen（1976）的圖。
    terms:
    - force-velocity
    numbers:
    - v: 約90
      unit: °/s（1.57 rad/s）
      of: 離心收縮峰值扭矩的速度（超過此速度後扭矩緩慢下降）
    concepts:
    - force-production
    - technique
    related:
    - ch02.strength-factors.i07
    - ch02.size-strength.i06
    locator: '第 2 章 · Muscle Contraction Velocity'
  - id: ch02.strength-factors.i07
    q: 三種肌肉動作
    a:
    - 向心動作（concentric）：肌肉縮短，收縮力 > 阻力；例：舉重的上舉相
    - 離心動作（eccentric）：肌肉延長，收縮力 < 阻力；例：放下重量；風險包括更高的延遲性肌肉酸痛
    - 等長動作（isometric）：長度不變，收縮力 = 阻力；例：棒式支撐時腹肌維持軀幹剛性
    detail: 書中偏好用「muscle action」而非「contraction」，因為「contraction」的字義是縮短，不適用於離心與等長。離心動作產生最大力量，這是「作弊動作」的機制：靠慣性超過向心極限後，肌肉切換到離心/等長模式繼續承受重量。
    terms:
    - concentric-action
    - eccentric-action
    - isometric-action
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch02.strength-factors.i06
    - ch02.resistance-sources.i05
    locator: '第 2 章 · Joint Angular Velocity'
  - id: ch02.strength-factors.i08
    q: 肌腱附著點變異對表現的影響
    a:
    - 附著點遠離關節→力臂長→可產生更大扭矩，有利於慢速（健力）
    - 同時，相同縮短量帶來更小的角位移，且需要更高收縮速度→不利於快速動作（如打網球）
    detail: 書中明確舉健力與網球為對比例子，說明同一解剖特徵在不同速度要求的運動中是優勢還是劣勢。這些骨骼幾何差異是「subtle individual differences in structure」，相對微小卻對運動表現有實質影響。
    terms:
    - moment-arm
    numbers: []
    concepts:
    - force-production
    - structure
    related:
    - ch02.size-strength.i05
    - ch02.size-strength.i06
    - ch02.levers.i04
    locator: '第 2 章 · Variations in Tendon Insertion'
- id: work-power
  title: 功與功率 Work & Power
  desc: ''
  tag: Work & Power
  items:
  - id: ch02.work-power.i01
    q: 功 Work
    a:
    - W = 力 × 位移（力與位移方向一致的分量）
    - SI單位：牛頓·公尺（N·m）= 焦耳（J）
    detail: 功的關鍵是力與位移的方向必須一致（cos θ 分量）。若力垂直於位移方向（如搬重物走路時向上托的力，位移是水平的），則不做功。這個定義讓「功」成為精確的能量轉換量測，而非日常語言中的「工作量」。
    terms:
    - positive-work
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.work-power.i02
    locator: '第 2 章 · Positive Work and Power'
  - id: ch02.work-power.i02
    q: 功率 Power
    a:
    - P = 功 ÷ 時間（J/s = W，瓦特）
    - 也可表示為 P = 力 × 速度
    - 科學定義的 power ≠ 日常語言的「爆發力」
    detail: 書中強調：「power」在物理學中有精確定義，是「做功的時間速率」。而日常口語中的「爆發力」（explosive strength）是不精確的說法，可能造成混淆。此外，力量（strength）和功率（power）都反映「在特定速度下產力的能力」，不應把前者只和慢速、後者只和高速聯繫。
    terms:
    - power-output
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.work-power.i01
    - ch02.work-power.i06
    locator: '第 2 章 · Positive Work and Power'
  - id: ch02.work-power.i03
    q: 正功 vs 負功
    a:
    - 正功：肌肉對外部物體做功（上舉重量，增加其位能）
    - 負功：外部物體對肌肉做功（放下重量，肌肉離心控制）
    - 書中說明：「負功」嚴格說並不存在，只是功由誰對誰做的問題；反覆動作中，運動員與重量交替互相做功
    detail: 書中明確指出「負功」概念雖然被廣泛使用，但實際上是說重量對肌肉施功，而非肌肉做了「負的」功。這個區別影響能量計算：下放重量時，重量的位能轉移給了肌肉（以熱與機械形式散逸），不是「肌肉在回收能量」。
    terms: []
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.work-power.i01
    - ch02.strength-factors.i07
    locator: '第 2 章 · Negative Work and Power'
  - id: ch02.work-power.i04
    q: 旋轉功
    a:
    - W = 扭矩 × 角位移（以弧度表示）
    - 功率計算仍用 P = W/t
    - 扭矩單位 N·m 與功單位 N·m（焦耳）相同，但含義不同：扭矩的距離是力臂，功的距離是沿力方向的位移
    detail: 旋轉功公式是線性功公式的角度版本。書中提醒扭矩（N·m）和功（N·m = J）雖然單位相同，語義不同：前者描述力的旋轉效果（力 × 垂直力臂），後者描述能量轉換（力 × 位移方向距離）。混淆這兩個量是常見錯誤。
    terms:
    - torque
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.work-power.i01
    - ch02.levers.i05
    locator: '第 2 章 · Angular Work and Power'
  - id: ch02.work-power.i05
    q: SI 單位換算
    a:
    - 1 磅（lb）= 4.448 牛頓（N）
    - 1 英呎（ft）= 0.3048 公尺（m）
    - 1 英吋（in.）= 0.02540 公尺（m）
    - 1 度（°）= 0.01745 弧度（rad）
    - 公斤力（kgf）× 9.807 = 牛頓（N）
    detail: 書中以表2.1列出換算係數。注意：重量盤上標示的「公斤」是質量（kg），要得到實際重力（N）需乘以當地重力加速度（約9.8 m/s²）。「磅（lb）」是力的單位，不是質量單位——這在生物力學計算中是常見概念混淆點。
    terms: []
    numbers:
    - v: 4.448
      unit: N
      of: 1磅（lb）換算成牛頓的係數
    - v: 0.3048
      unit: m
      of: 1英呎（ft）換算成公尺的係數
    - v: 0.01745
      unit: rad
      of: 1度換算成弧度的係數
    concepts:
    - measurement
    related: []
    locator: '第 2 章 · Positive Work and Power'
  - id: ch02.work-power.i06
    q: 肌力 vs 功率的關係
    a:
    - P = F × v，因此若已知力與速度中的任兩個，即可求第三個
    - 肌力（strength）和功率（power）都反映「在特定速度下產力的能力」，不應把肌力只聯繫低速、功率只聯繫高速
    - 要克服高阻力的低速動作，低速肌力重要；要應對低阻力的高速動作，高速肌力重要
    detail: 書中明確說：「it is not correct to associate strength with low speed and power with high speed.」強調肌力是在任意速度下產力的能力，功率是力與速度的乘積——兩者都是速度相關量，只是描述角度不同。這個澄清對選擇正確的訓練和測試方法至關重要。
    terms:
    - power-output
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.work-power.i02
    - ch02.strength-factors.i06
    locator: '第 2 章 · Strength Versus Power'
  - id: ch02.work-power.i07
    q: 舉重 vs 健力的功率比較
    a:
    - 奧林匹克舉重（高速+重量）產生的物理功率高於健力（極重但低速）
    - 「powerlifting」的命名在物理學定義上具有誤導性，產生的 power 反而更低
    detail: 書中明確指出：「in the sport of powerlifting, which involves high forces but relatively low movement speeds, less mechanical power is produced than in several other sports, including Olympic lifting.」這是一個幫助記憶功率公式（P = F×v）的有效例子。
    terms:
    - power-output
    numbers: []
    concepts:
    - force-production
    - measurement
    related:
    - ch02.work-power.i02
    - ch02.work-power.i06
    locator: '第 2 章 · Strength Versus Power'
  - id: ch02.work-power.i08
    q: 計算實例
    a:
    - 舉100 kg槓鈴2公尺高、10次、加速度2 m/s²
    - 重力 F1 = 100 × 9.8 = 980 N；加速力 F2 = 100 × 2 = 200 N
    - 正功 = (980 + 200) × 2 × 10 = 23,600 J
    - 若40秒完成→平均功率 = 23,600 ÷ 40 = 590 W
    detail: 這是書中正文提供的完整計算範例（表2.1附近）。注意：慣性力（F2 = m×a）要加進去是因為槓鈴在加速，所以需要比重量更多的力；完整訓練量可用同樣方法計算每組的功後累加，得出總訓練功（total training work）。
    terms:
    - power-output
    numbers:
    - v: 23600
      unit: J
      of: 舉100kg槓鈴2m高10次（加速度2m/s²）的正功
    - v: 590
      unit: W
      of: 上述動作在40秒內完成的平均功率
    concepts:
    - force-production
    - measurement
    related:
    - ch02.work-power.i01
    - ch02.work-power.i02
    - ch02.resistance-sources.i03
    locator: '第 2 章 · Positive Work and Power'
cards:
- q: 第一/二/三類槓桿各舉一個人體例子？
  a: 第一類=肘伸（三頭肌，支點在肘關節中間）；第二類=踮腳尖（腓腸肌，阻力在中間）；第三類=肘屈（二頭肌彎舉，最常見）
  tag: 槓桿系統
- q: 機械利益（Mechanical Advantage）的公式？
  a: MA = 肌肉力臂 / 阻力臂。MA > 1 省力；MA < 1 費力（人體大多為後者）
  tag: 槓桿系統
- q: 人體肌肉為何幾乎都處於機械不利（MA < 1）？
  a: 肌腱附著點非常靠近關節，肌肉力臂遠短於阻力臂→肌肉力需遠大於外部阻力→肌腱內力極高→受傷主因
  tag: 槓桿系統
- q: 髕骨在膝伸展的生物力學作用？
  a: 防止股四頭肌肌腱靠近膝關節旋轉軸，維持較大力臂，使機械利益在關節活動過程中相對穩定
  tag: 槓桿系統
- q: 自由重量訓練中阻力矩臂如何計算？
  a: 重量到關節的「水平距離」。動作過程中此距離持續變化→阻力矩也隨之改變（非恆定）
  tag: 槓桿系統
- q: 主動肌/拮抗肌/協同肌的定義？
  a: 主動肌（agonist）：直接執行動作；拮抗肌（antagonist）：減速/停止動作並保護關節；協同肌（synergist）：間接輔助動作
  tag: 骨骼肌肉
- q: 拮抗肌有哪兩個功能？
  a: ①穩定關節；②在快速動作末端煞車，保護韌帶與軟骨免受衝擊（例：投擲末期肱二頭肌煞住肘伸）
  tag: 骨骼肌肉
- q: 雙關節肌（如股直肌）為何需要協同肌？
  a: 股直肌同時跨越髖（屈）和膝（伸），起蹲時若無臀大肌等協同肌抵消髖屈效果，動作無法正確完成
  tag: 骨骼肌肉
- q: Origin（起點）與 Insertion（止點）的傳統定義？
  a: 起點=近端附著點（通常較固定）；止點=遠端附著點（通常較活動）；反轉現象：動作改變時固定端可互換
  tag: 骨骼肌肉
- q: 三個解剖平面的方向與動作各是什麼？
  a: 矢狀面（左右分）=屈/伸；冠狀面（前後分）=外展/內收；橫切面（上下分）=旋轉
  tag: 解剖平面
- q: 垂直跳、側向啞鈴舉、啞鈴飛鳥各在哪個平面？
  a: 垂直跳=矢狀面；側向啞鈴舉=冠狀面；啞鈴飛鳥=橫切面
  tag: 解剖平面
- q: 標準重訓常忽略但運動中重要的身體動作有哪些？
  a: 肩內/外旋（投擲、網球）、膝屈（衝刺）、踝背屈（跑步）、髖內外旋（轉向切入）、軀幹旋轉（揮擊）
  tag: 解剖平面
- q: Work（功）的公式與單位？
  a: W = F × d × cosθ（N·m = Joules）；θ為力與位移方向夾角。只有與位移同向的力分量才做功
  tag: 功與功率
- q: Power（功率）的公式與單位？
  a: P = W/t（Joules/s = Watts）= F × v。科學定義的power ≠ 日常俗稱的「爆發力」
  tag: 功與功率
- q: 旋轉功的公式？
  a: W = Torque × 角位移（弧度）；功率仍用 P = W/t。扭矩單位 N·m 不可與功混淆
  tag: 功與功率
- q: 舉100kg槓鈴2m高×10次（上舉加速度2m/s²），正功與平均功率各為多少（40秒完成）？
  a: 重力=980N，慣性力=200N；正功=(980+200)×2×10=23,600J；功率=23,600÷40=590W
  tag: 功與功率
- q: 為何說powerlifting（健力）的命名有誤導性？
  a: Olympic lifting（大重量高速）功率遠高於powerlifting（極重但低速）。從物理定義看，健力產生的power反而較小
  tag: 功與功率
- q: 肌力（Strength）與Power（功率）的關係？
  a: P = F × v，兩者都描述「在特定速度下產生力的能力」；知道力與速度其中兩個即可求第三
  tag: 功與功率
- q: 訓練初期肌力進步的主因是什麼？
  a: 神經適應（neural adaptation）：更多運動單元被招募、放電頻率↑；而非肌肥大，肌肥大效果較慢
  tag: 肌力因素
- q: 力量與肌肉哪個特性相關：橫截面積還是體積？
  a: 橫截面積（cross-sectional area），而非體積。相同粗細的肌肉，不論長短，力量相近
  tag: 肌力因素
- q: 羽狀肌（pennate）與平行肌纖維的差異？
  a: 羽狀肌：肌纖維斜向排列，平行肌節數多→力量↑但收縮速度↓。羽狀角度可透過訓練改變
  tag: 肌力因素
- q: 肌肉在哪個長度產生最大力量？為什麼？
  a: 靜息長度（resting length）：actin與myosin最大重疊，橫橋結合點最多→力量最大；過短或過長均下降
  tag: 肌力因素
- q: 向心收縮與離心收縮的力量比較？
  a: 離心 > 等長 > 向心。離心力量最大，這也是「作弊動作」（如靠慣性繼續動）利用的原理
  tag: 肌力因素
- q: 肌腱附著點遠離關節的利弊？
  a: 利：力臂長→扭矩↑→慢速力量更大（有利健力）；弊：相同肌肉縮短量的角位移↓→速度慢（不利快速運動）
  tag: 肌力因素
- q: 為何體型越大的運動員磅磅肌力通常越低？
  a: 肌力 ∝ CSA（尺寸²），體重 ∝ 體積（尺寸³）。體型↑1倍，體重↑8倍，力量↑4倍→磅磅比下降
  tag: 體型與肌力
- q: 跨量級比較的「古典公式」是什麼？
  a: 舉起重量 ÷ 體重^(2/3)。修正了大體型選手的不利，但研究顯示中等體重選手仍通常最佳
  tag: 體型與肌力
- q: 精英體操選手通常身材矮小的原因？
  a: 身材越大，需舉起更多自身體重，肌力/體重比下降；體操動作高度依賴此比值，矮小者有先天優勢
  tag: 體型與肌力
- q: 衝刺/跳躍訓練中，哪個指標最能反映爆發力表現？
  a: 肌力/體重比（strength-to-mass ratio）。體重增加幅度超過肌力增加幅度會降低表現
  tag: 體型與肌力
- q: 五種主要阻力來源各舉一種器材例子？
  a: 重力=自由重量/器械；慣性=槓鈴加速動作；摩擦=制動腳踏車；流體=液壓/氣壓機；彈性=彈力帶
  tag: 阻力來源
- q: 流體阻力器械（液壓/氣壓機）為何沒有離心相？
  a: 阻力只抵抗推/拉方向，回程由拮抗肌向心收縮完成；肌群輪流作功，缺乏離心訓練刺激
  tag: 阻力來源
- q: 彈性阻力（如彈力帶）最主要的缺點是什麼？
  a: 動作起始阻力最小、結束阻力最大，與人體肌力曲線相反（多數肌群在終末ROM力量最弱）
  tag: 阻力來源
- q: 爆發性動作（acceleration-based）為何有訓練特殊性？
  a: 加速/減速是多數運動動作的特徵，訓練相同加速模式可使神經肌肉系統適應特定力-速組合
  tag: 阻力來源
- q: 自由重量 vs 器械各有什麼主要優點？
  a: 器械：更安全、設計靈活、易上手；自由重量：需穩定肌、重量承重促進骨密度、模擬真實運動協調
  tag: 阻力來源
- q: 85-90%椎間盤突出發生在哪個位置？原因？
  a: L4/L5 或 L5/S1。腰部是上肢力量傳至下肢的必經路徑，且脊旁肌機械利益極低（力臂僅約5cm），內力可達外力10倍
  tag: 關節安全
- q: 深蹲時腰椎應保持何種姿勢？圓背有何風險？
  a: 中立腰椎（自然前凸）。圓背→前側椎間盤受壓→突出風險；過度弓背→後側受壓。兩者都增加傷害
  tag: 關節安全
- q: 腰帶的使用原則（三條建議）？
  a: ①不影響腰背的動作不需要；②影響腰背的動作：輕組不戴，接近最大重量才戴；③始終不戴也可（需系統性建立核心）
  tag: 關節安全
- q: 瓦氏呼吸法（Valsalva maneuver）的利與弊？
  a: 利：增加全軀幹剛性，支撐重載深蹲等；弊：胸腔壓力壓迫心臟，血液回流↓，血壓短暫升高
  tag: 關節安全
- q: 旋轉肌群（rotator cuff）由哪四條肌肉組成？
  a: 岡上肌（supraspinatus）、岡下肌（infraspinatus）、肩胛下肌（subscapularis）、小圓肌（teres minor）
  tag: 關節安全
- q: 阻力訓練的傷害率與其他運動比較？
  a: 約4次/1000小時，低於跑步/有氧/多數球類運動。大學美式足球員：每百人每球季僅0.35次
  tag: 關節安全
- q: 低槓深蹲 vs 高槓深蹲的力矩分布差異？
  a: 低槓：軀幹前傾，槓遠離膝近髖→髖力矩大、膝力矩小；高槓：軀幹較直→膝力矩大、髖力矩小
  tag: 關節安全
- q: 扭矩（Torque）的完整公式？力矩臂的精確定義？
  a: T = F × 力矩臂（moment arm）；力矩臂 = 力的作用線到旋轉軸的「垂直距離」，非力到關節的直線距離
  tag: 力學概念
- q: 肌肉拉力的兩個分力是什麼？對訓練有何含義？
  a: 旋轉分力（rotary component，產生扭矩）+ 穩定分力（stabilizing/dislocating component，壓或拉關節）；關節角度改變時兩者比例不斷變化
  tag: 力學概念
- q: 力-速度曲線（force-velocity curve）的核心規律？
  a: 向心：速度↑則力量↓（反比）；等長在中間；離心：速度↑力量微升後趨於穩定，始終高於等長
  tag: 力學概念
- q: 惰性點（sticking point）的生物力學成因？
  a: 特定關節角度下肌肉拉力角或力臂最不利，力量最小；通常在動作中段，如深蹲剛站起10-20° 的弱點區
  tag: 力學概念
- q: 等速肌力測定器（isokinetic dynamometer）的定義與特點？
  a: 使關節以恆定角速度運動；阻力自動配合肌力變化（全ROM皆接近最大收縮）；臨床常用但成本高、不模擬真實動作
  tag: 力學概念
- q: 可變阻力器械（variable resistance / cam-based machines）的原理？
  a: 凸輪（cam）形狀設計使阻力矩隨關節角度改變，試圖匹配肌力曲線；目的是讓全ROM都有足夠刺激
  tag: 阻力來源
- q: 肢體長度（如股骨長）對深蹲生物力學的影響？
  a: 股骨越長→軀幹前傾角度越大→脊椎力矩↑；高個子深蹲腰椎負擔通常高於矮個子
  tag: 力學概念
- q: 質量（mass）與重量（weight）的區別？
  a: 質量（kg）= 物質含量，不隨重力改變；重量（N）= 質量 × 重力加速度（9.81 m/s²）；自由重量訓練的阻力來自重量（重力）
  tag: 力學概念
- q: 脊旁肌的機械利益為何極低？臨床意義？
  a: 肌腱附著點距脊椎旋轉軸僅約5cm（力臂極短）→肌肉需產生巨大內力（可達外部負荷10倍）→椎間盤和肌腱承受極大壓力
  tag: 關節安全
- q: SI常用單位換算：1 lb = ? N；1 ft = ? m；1° = ? rad？
  a: 1 lb = 4.448 N；1 ft = 0.3048 m；1° = 0.01745 rad；訓練中磅/公斤→牛頓需乘以重力加速度
  tag: 力學概念
- q: 離心收縮為何能產生最大力量？
  a: 彈性元件（肌腱+結締組織）被拉伸儲能，加上橫橋在最適重疊長度下被動延長→比向心最大收縮力高20-50%
  tag: 肌力因素
- q: 淨肌肉扭矩（net muscle torque）如何決定動作方向？
  a: 同一關節所有肌群扭矩的合計；若屈肌群扭矩 > 伸肌群扭矩 → 關節屈曲；重訓中通常設計主動肌產生最大淨扭矩以克服阻力矩
  tag: 力學概念
