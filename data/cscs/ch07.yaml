id: ch07
weight: 7
title: Ch.7 年齡與性別差異及阻力訓練
topics:
- id: aging-musculoskeletal
  title: 老年人肌骨變化 Aging Musculoskeletal Changes
  desc: ''
  tag: Aging
  items:
  - id: ch07.aging-musculoskeletal.i01
    q: 肌少症（Sarcopenia）
    a:
    - 肌少症是隨老化出現的肌肉量與肌力流失
    - 30 歲後，個別肌肉的橫截面積與肌肉密度下降，肌腱順應性下降，肌內脂肪增加
    detail: 教材將此改變歸因於身體活動不足與肌纖維逐漸、選擇性去神經支配；並指出這些變化在女性似乎最明顯。
    terms:
    - sarcopenia
    numbers:
    - v: 30
      unit: 歲後
      of: 電腦斷層所見個別肌肉橫截面積等變化開始出現的年齡
    concepts:
    - population
    - structure
    related:
    - ch05.hypertrophy.i01
    locator: Older Adults > Age-Related Changes in Musculoskeletal Health
  - id: ch07.aging-musculoskeletal.i02
    q: 肌力流失數據
    a:
    - 一份報告中，55–64 歲女性有 40% 無法舉起約 4.5 kg
    - 65–74 歲女性為 45%，75–84 歲女性為 65%
    detail: 這是特定報告的女性年齡組結果，不是本章提供給所有高齡者的通用舉重能力標準；教材用它說明肌肉量下降如何連帶影響肌力。
    terms: []
    numbers:
    - v: 55–64
      unit: 歲
      of: 無法舉起約 4.5 kg 的女性年齡組
    - v: 40
      unit: '%'
      of: 55–64 歲女性無法舉起約 4.5 kg 的比例
    - v: 65–74
      unit: 歲
      of: 無法舉起約 4.5 kg 的女性年齡組
    - v: 45
      unit: '%'
      of: 65–74 歲女性無法舉起約 4.5 kg 的比例
    - v: 75–84
      unit: 歲
      of: 無法舉起約 4.5 kg 的女性年齡組
    - v: 65
      unit: '%'
      of: 75–84 歲女性無法舉起約 4.5 kg 的比例
    - v: 4.5
      unit: kg
      of: 該報告用來測試女性舉起能力的約略重量
    concepts:
    - population
    - structure
    locator: Older Adults > Age-Related Changes in Musculoskeletal Health
  - id: ch07.aging-musculoskeletal.i03
    q: 爆發力衰退更快
    a:
    - 老化時，爆發力（快速產生力量的能力）衰退速度比肌力更快
    - 爬樓梯與步行等日常活動需要一定爆發力；快速出力能力下降會不利於安全執行這些活動
    detail: 教材連結的機制是肌纖維的大小與數量減少，以及逐漸去神經支配；它沒有把爆發力衰退歸結為單一肌纖維類型的流失。
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related:
    - ch19.rfd-impulse.i01
    locator: Older Adults > Age-Related Changes in Musculoskeletal Health
  - id: ch07.aging-musculoskeletal.i04
    q: 骨質疏鬆症
    a:
    - 骨質減少症（osteopenia）是骨礦物質密度介於年輕成人平均值的 −1 至 −2.5 個標準差（SD）
    - 骨質疏鬆症（osteoporosis）是骨礦物質密度低於年輕成人平均值 −2.5 個標準差
    detail: 教材指出這些狀態使骨密度與強度下降，特別增加高齡者（尤其女性）骨折與骨骼健康不佳的風險。
    terms:
    - osteopenia
    - osteoporosis
    numbers:
    - v: −1 至 −2.5
      unit: SD
      of: 骨質減少症相對於年輕成人平均骨礦物質密度的範圍
    - v: −2.5
      unit: SD
      of: 骨質疏鬆症低於年輕成人平均骨礦物質密度的界線
    concepts:
    - population
    - structure
    related:
    - ch05.connective-tissue.i04
    - ch09.vitamins-minerals.i04
    locator: Older Adults > Age-Related Changes in Musculoskeletal Health
  - id: ch07.aging-musculoskeletal.i05
    q: 跌倒風險因子
    a:
    - 高齡者跌倒的內在風險因子包括肌力與爆發力下降、反應時間變慢、平衡與姿勢穩定性受損
    detail: 教材列出的跌倒後果包括疼痛症候群、關節脫位、骨折、日常功能受限與自信降低，也可能造成永久失能、機構安置或死亡。
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related:
    - ch18.special-populations.i04
    locator: Older Adults > Age-Related Changes in Neuromotor Function
  - id: ch07.aging-musculoskeletal.i06
    q: 共同收縮（Cocontraction）
    a:
    - 共同收縮（cocontraction）是跨越同一關節的主動肌與拮抗肌同時活化，以動態穩定關節
    - 高齡者會提高共同收縮作為平衡困難的代償，以減少姿勢搖擺
    - 代價是淨關節力矩與主動肌力量輸出降低
    detail: 教材把共同收縮放在落地接觸後的肌肉活動，與接觸前的預活化（preactivation）並列；兩者都參與煞車與動態穩定。
    terms:
    - cocontraction
    numbers: []
    concepts:
    - population
    - structure
    related:
    - ch05.neural-adaptations.i08
    locator: Older Adults > Age-Related Changes in Neuromotor Function
  - id: ch07.aging-musculoskeletal.i07
    q: 舉重能力下降率
    a:
    - 競技舉重能力隨年齡約每年下降 1%–1.5%，約至 70 歲為止
    - 70 歲後下降更明顯；不從事身體活動的高齡運動員，許多身體表現指標通常退步更多
    detail: 此數據談的是競技舉重能力與高齡運動員，不能直接當作一般人每年肌力流失的百分比。
    terms: []
    numbers:
    - v: 1–1.5
      unit: '%／年'
      of: 競技舉重能力至約 70 歲前的年齡相關下降率
    - v: 70
      unit: 歲
      of: 競技舉重能力下降轉為更明顯的約略年齡
    concepts:
    - population
    - structure
    locator: Older Adults
  - id: ch07.aging-musculoskeletal.i08
    q: 老化變化彙整（Table 7.1）
    a:
    - 表 7.1 中，老化使肌力、爆發力、肌耐力、肌肉量、肌纖維大小、肌肉代謝能力、靜息代謝率、骨礦物質密度與身體功能下降，體脂增加
    - 表中相對列出的阻力訓練效果為前述各項增加、體脂下降
    detail: 這是教材將兩種作用方向並列的摘要表；表格本身沒有宣稱每位高齡者都會完全逆轉全部老化改變。
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    locator: Older Adults > Age-Related Changes in Musculoskeletal Health
- id: children-growth
  title: 兒童生長發育 Children's Growth & Development
  desc: ''
  tag: Children
  items:
  - id: ch07.children-growth.i01
    q: 時序年齡 vs 生理年齡
    a:
    - 時序年齡（chronological age）是以月或年定義的年齡；兒童生長並非等速，同一時序年齡的身體發展差異很大
    - 14 歲兒童群體的身高差可達 23 cm、體重差可達 18 kg
    - 生理年齡（biological age）可用骨骼年齡、身體成熟度或性成熟度評估，較能用來配對體適能測驗與運動競賽的成熟度
    detail: 教材不是主張時序年齡毫無用途，而是指出成熟程度與肌力、動作技能表現有關；只按時序年齡分組可能把成熟度相差數年的孩子放在一起。
    terms:
    - chronological-age
    - biological-age
    numbers:
    - v: 14
      unit: 歲
      of: 原文用來示範同齡兒童體格差異的年齡
    - v: 23
      unit: cm
      of: 一群 14 歲兒童可能出現的最大身高差
    - v: 18
      unit: kg
      of: 一群 14 歲兒童可能出現的最大體重差
    concepts:
    - population
    - measurement
    related:
    - ch12.selection-factors.i05
    - ch18.special-populations.i08
    locator: Children > The Growing Child > Chronological Age Versus Biological Age
  - id: ch07.children-growth.i02
    q: 骨骼年齡（Gold Standard）
    a:
    - 骨骼年齡評估是判定生理成熟的黃金標準：受過訓練的放射線人員將兒童左腕 X 光片與標準參考片比較，判定骨化程度
    - 雖最準確、可靠，但成本、專用設備、時間與放射攝影專業需求，使多數青少年工作者難以採用
    detail: 骨化是成骨細胞沉積新骨材料的過程；教材把這項方法定位為精確的成熟度評估，不是一般肌力與體能教練可自行操作的現場篩檢。
    terms:
    - skeletal-age
    numbers: []
    concepts:
    - population
    - measurement
    related:
    - ch18.special-populations.i08
    locator: Children > The Growing Child > Chronological Age Versus Biological Age
  - id: ch07.children-growth.i03
    q: Tanner 分期（限臨床）
    a:
    - Tanner 分期以可辨識的第二性徵視覺評估成熟度：女孩乳房、男孩生殖器、兩性陰毛的發展
    - 分為 5 期：第 1 期是未成熟的青春期前狀態，第 5 期是完全性成熟
    - 此法具侵入性，肌力與體能教練不應使用；僅在必要時由合格臨床人員施作
    detail: 教材同時提到 Tanner 分期存在方法學限制；對多數實務工作者，身體測量是較可行的生理年齡估計方式。
    terms:
    - tanner-classification
    numbers:
    - v: 5
      unit: 期
      of: Tanner 第二性徵成熟度分類的階段數
    concepts:
    - population
    - measurement
    - professional
    related:
    - ch24.legal.i07
    locator: Children > The Growing Child > Chronological Age Versus Biological Age
  - id: ch07.children-growth.i04
    q: PHV（峰值身高速度）
    a:
    - 峰值身高速度（peak height velocity, PHV）是青春期生長突增中生長速率最大的年齡
    - PHV 通常約在女性 12 歲、男性 14 歲出現；這段期間年輕運動員可能有較高受傷風險
    detail: 教材列出的可能過度使用傷害風險因子是重心改變、肌肉失衡，以及跨越快速生長骨骼的肌腱－肌肉單位相對變緊；這時可能須調整訓練量或強度並處理動作與柔軟度限制。
    terms:
    - peak-height-velocity
    numbers:
    - v: 12
      unit: 歲
      of: 女性通常達到 PHV 的約略年齡
    - v: 14
      unit: 歲
      of: 男性通常達到 PHV 的約略年齡
    concepts:
    - population
    - injury
    related:
    - ch18.special-populations.i08
    locator: Children > The Growing Child > Chronological Age Versus Biological Age
  - id: ch07.children-growth.i05
    q: 訓練年齡（Training Age）
    a:
    - 訓練年齡（training age）是兒童持續遵循正式且受監督阻力訓練計畫的時間長度
    - 既有適應程度會影響後續肌力相關增益幅度，因此訓練年齡不同於時序年齡
    detail: 兩名訓練年齡相同的兒童，技術熟練度仍可能不同、進步速度也不同；教材因此要求依技術能力、訓練年齡與成熟度個別設計課程。
    terms:
    - training-age
    numbers: []
    concepts:
    - population
    - program-design
    related:
    - ch17.needs-analysis.i04
    - ch17.training-volume.i08
    locator: Children > The Growing Child > Chronological Age Versus Biological Age
  - id: ch07.children-growth.i06
    q: 肌肉與骨骼生長
    a:
    - 出生時肌肉量約占體重 25%，到成年約為 40%
    - 發育期間兩性肌肉量增加來自個別肌纖維肥大，不是肌纖維增生（hyperplasia）
    - 抵抗訓練與飲食未介入時，女性肌肉量高峰在 16–20 歲，男性在 18–25 歲
    detail: 青春期的荷爾蒙變化使男孩肌肉量與肩寬顯著增加；女孩的肌肉量也持續增加，但因荷爾蒙差異而較慢，並增加脂肪沉積與髖部寬度。
    terms:
    - muscle-hypertrophy
    numbers:
    - v: 25
      unit: '% 體重'
      of: 出生時肌肉量約占體重的比例
    - v: 40
      unit: '% 體重'
      of: 成年時肌肉量約占體重的比例
    - v: 16–20
      unit: 歲
      of: 未受阻力訓練或飲食影響時女性肌肉量高峰年齡範圍
    - v: 18–25
      unit: 歲
      of: 未受阻力訓練或飲食影響時男性肌肉量高峰年齡範圍
    concepts:
    - population
    - structure
    related:
    - ch05.connective-tissue.i01
    locator: Children > The Growing Child > Muscle and Bone Growth
  - id: ch07.children-growth.i07
    q: 骨骺板（生長板）
    a:
    - 兒童的生長軟骨位於三處：骨骺板（epiphyseal plate）、關節面，以及肌腱－肌肉單位的骨突附著處
    - 骨骺板完全骨化後，長骨停止生長
    - 骨頭通常在青春期早期開始融合；女孩完全骨成熟通常比男孩早約 2–3 年，多數骨頭在 20 歲出頭前已融合
    detail: 原文區分長骨中央幹的骨幹（diaphysis，主要骨化中心）與生長軟骨的次要骨化中心；題目中的「位於」是生長軟骨的位置，不是指骨骺板本身位於三處。
    terms:
    - growth-cartilage
    - epiphyseal-plate
    numbers:
    - v: 2–3
      unit: 年
      of: 女孩通常比男孩早達完全骨成熟的時間
    - v: 20
      unit: 歲出頭
      of: 多數骨頭已融合的約略年齡
    concepts:
    - population
    - structure
    related:
    - ch18.special-populations.i01
    locator: Children > The Growing Child > Muscle and Bone Growth
  - id: ch07.children-growth.i08
    q: 生長軟骨受傷風險
    a:
    - 生長軟骨易受創傷與過度使用傷害；損傷可能破壞骨骼血液與營養供應，造成永久生長異常
    - 成人可能造成韌帶撕裂的跌倒或過度反覆壓力，在兒童可能造成骨骺板骨折
    - 骨骺板骨折的發生高峰約在 PHV；青春期生長突增中的青少年，風險看來高於青春期前兒童
    detail: 教材指出，以適當動作技術、合理遞增訓練負荷並由合格肌力與體能專業人員指導，可降低生長軟骨受損風險。
    terms:
    - growth-cartilage
    - epiphyseal-plate
    numbers: []
    concepts:
    - population
    - injury
    - safety
    related:
    - ch22.injury-types.i02
    locator: Children > The Growing Child > Muscle and Bone Growth
- id: children-risk-benefits
  title: 兒童訓練風險與益處 Children's Training Risk & Benefits
  desc: ''
  tag: Children
  items:
  - id: ch07.children-risk-benefits.i01
    q: 骨骺板骨折風險
    a:
    - 青少年阻力訓練的骨骺板骨折病例報告，通常是無監督情境下進行重負荷過頭舉
    - 遵循既定訓練指引的前瞻性兒童阻力訓練研究，尚未報告骨骺板骨折
    detail: 原文是比較病例報告與遵循指引的前瞻研究，不能據此解讀為骨骺板絕無受傷風險；教材的結論是正確教學與遵循程序時，風險極低。
    terms:
    - epiphyseal-plate
    numbers: []
    concepts:
    - population
    - safety
    related:
    - ch22.injury-types.i02
    - ch18.special-populations.i01
    locator: Children > Youth Resistance Training > Potential Risks and Concerns
  - id: ch07.children-risk-benefits.i02
    q: 傷害多為意外非固有風險
    a:
    - 兒童確實可能在重量訓練室受傷，但傷害較可能屬意外
    - 通常發生在監督與教學、技術能力或訓練負荷不適當時
    detail: 教材將適當處方的兒童阻力訓練描述為相較於其他兒童與青少年常做運動「相對安全」；這不是把安全歸因於器材本身，而是指課程品質與監督條件。
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related:
    - ch15.exercise-technique-fundamentals.i08
    locator: Children > Youth Resistance Training > Potential Risks and Concerns
  - id: ch07.children-risk-benefits.i03
    q: 過度使用傷害預防
    a:
    - 據估計，兒童發生的過度使用傷害有超過 50% 可透過教練教育、預備體能訓練與延後專項化等簡單方法預防
    detail: 原文將這個估計置於美國兒童與青少年運動傷害的脈絡，並沒有說所有受傷都能消除；它主張阻力訓練加入季前體能計畫可使年輕運動員較能承受練習與比賽的非預期外力。
    terms: []
    numbers:
    - v: 50
      unit: '%以上'
      of: 估計可用教練教育、預備訓練與延後專項化預防的兒童過度使用傷害比例
    concepts:
    - population
    - safety
    related:
    - ch22.injury-types.i07
    - ch21.preparatory-period.i07
    locator: Children > Youth Resistance Training > Potential Benefits
  - id: ch07.children-risk-benefits.i04
    q: 1RM 測試安全性
    a:
    - 兒童與青少年的 1RM 測試，在充分暖身、負荷個別漸進與密切監督的指引下已證實安全
    detail: 本章也提醒，若用多次次最大反覆來預測 1RM，累積疲勞可能使技術動作品質變差、增加風險；不論採用何種測試，需能全程維持正確技術並由合格專業人員監看。
    terms:
    - repetition-maximum
    numbers: []
    concepts:
    - population
    - safety
    related:
    - ch12.safety.i02
    - ch13.max-strength.i05
    locator: Children > Youth Resistance Training > Potential Risks and Concerns
  - id: ch07.children-risk-benefits.i05
    q: 早期運動專項化風險
    a:
    - 年紀很小時只參與單一運動或單一位置的專項化，較可能增加肌肉失衡、過度使用傷害、過度訓練與倦怠的風險
    - 晚期專項化，以及年幼時參與多種運動與活動，似乎與日後運動成功較有關
    detail: 「似乎較有關」是原文的關聯性語氣，不是保證晚期專項化必定帶來較佳表現；教材也建議可行時把早期專項化延至青春期。
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related:
    - ch21.periodization-hierarchy.i01
    - ch05.overtraining.i01
    locator: Children > Youth Resistance Training > Potential Benefits
  - id: ch07.children-risk-benefits.i06
    q: 骨密度效益
    a:
    - 包含阻力訓練與負重身體活動的規律運動計畫，已顯示可提升兒童與青少年的骨礦物質密度（BMD）
    - 規律進行重負荷多關節訓練的菁英青少年舉重選手，骨密度遠高於同齡對照組
    detail: 教材同時說明阻力訓練不會改變遺傳決定的最終上限，但在遵循適當指引時，可能對任何發育階段的生長有正面影響。
    terms:
    - bone-mineral-density
    numbers: []
    concepts:
    - population
    - structure
    - adaptation
    related:
    - ch05.connective-tissue.i03
    locator: Children > Youth Resistance Training > Potential Benefits
  - id: ch07.children-risk-benefits.i07
    q: 肥胖兒童的特殊效益
    a:
    - 肥胖兒童與青少年規律參與阻力訓練，曾被報告有體脂下降、胰島素敏感性改善與心臟功能提升
    - 教材指出肥胖青少年似乎喜歡阻力訓練，因為它不會造成高有氧負荷，並讓每位參與者有成功與良好表現感受的機會
    detail: 這裡的「似乎喜歡」是教材的審慎描述，不能延伸為已量化的較高參與率；原文也指出久坐或肥胖兒童未必已準備好每週四、五天、每次 1–2 小時的運動訓練。
    terms: []
    numbers:
    - v: 1–2
      unit: 小時／次
      of: 教材舉例久坐或肥胖兒童尚未準備承受的運動訓練單次時長
    - v: 4–5
      unit: 天／週
      of: 教材舉例久坐或肥胖兒童尚未準備承受的運動訓練每週頻率
