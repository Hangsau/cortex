- id: children-training-response
  title: 兒童肌力訓練反應 Children's Strength Training Response
  desc: ''
  tag: Children
  items:
  - id: ch07.children-training-response.i01
    q: 神經適應為主要機制
    a:
    - 青春期前兒童的阻力訓練肌力增益，主要看來與神經因素有關：運動單位活化與同步增加、徵召與放電頻率提升
    - 至少在 20 週內，肌肉肥大不太可能是青春期前訓練誘發肌力增益的主要原因
    detail: 教材同時提出肌肉內在適應、動作技能與相關肌群協調也可能部分參與，並提醒不能毫無保留地說青春期前訓練不會造成肌肉肥大；較長研究、更高訓練量或精確測量才可能發現它。
    terms:
    - motor-unit
    - muscle-hypertrophy
    numbers:
    - v: 20
      unit: 週內
      of: 教材認為青春期前肌力增益不太可能主要由肌肉肥大造成的訓練期間
    concepts:
    - population
    - adaptation
    related:
    - ch05.neural-adaptations.i01
    - ch01.neuromuscular.recruitment
    locator: Children > Youth Resistance Training > Responsiveness to Resistance Training in Children
  - id: ch07.children-training-response.i02
    q: 荷爾蒙限制肌肥大
    a:
    - 青春期前男孩與女孩的睪固酮（testosterone）濃度為 20–60 ng/100 ml
    - 青春期時男性約升至 600 ng/100 ml，女性濃度維持不變；青春期前的循環荷爾蒙不足，似乎使兒童較難藉阻力訓練增加肌肉量
    detail: 教材列出睪固酮、生長激素與類胰島素生長因子為可能不足的循環荷爾蒙，並用「似乎」限定這項解釋；它不是絕對否定青春期前的肌肉肥大。
    terms:
    - testosterone
    - muscle-hypertrophy
    numbers:
    - v: 20–60
      unit: ng/100 ml
      of: 青春期前男孩與女孩的睪固酮濃度範圍
    - v: 600
      unit: ng/100 ml
      of: 青春期男性睪固酮濃度約略值
    concepts:
    - population
    - adaptation
    related:
    - ch04.testosterone.i01
    - ch05.hypertrophy.i01
    locator: Children > Youth Resistance Training > Responsiveness to Resistance Training in Children
  - id: ch07.children-training-response.i03
    q: 肌力增幅範圍
    a:
    - 文獻報告的最大肌力增幅約為 10%–90%
    - 未訓練青春期前兒童完成短期 8–20 週阻力訓練後，典型肌力增幅約為 30%–40%
    detail: 初期適應後，隨青少年逐漸適應課程，肌力增益速率會減弱；教材以此強調持續且漸進的訓練需要。差異可能與生理年齡、課程設計、教學品質與原有身體活動量有關。
    terms: []
    numbers:
    - v: 10–90
      unit: '%'
      of: 文獻報告的兒童最大肌力增幅範圍
    - v: 30–40
      unit: '%'
      of: 未訓練青春期前兒童短期阻力訓練後典型肌力增幅
    - v: 8–20
      unit: 週
      of: 典型肌力增幅所指短期阻力訓練計畫的期間
    concepts:
    - population
    - adaptation
    related:
    - ch13.max-strength.i01
    - ch05.neural-adaptations.i04
    locator: Children > Youth Resistance Training > Responsiveness to Resistance Training in Children
  - id: ch07.children-training-response.i04
    q: 青少年 vs 兒童
    a:
    - 一項統合分析顯示，青少年可達到的肌力增加幾乎比兒童高 50%
    detail: 這個結果出現在教材討論正常發育中的肌力曲線，原文沒有把這個統合分析的差異明確歸因於「青春期後荷爾蒙較充足」；它僅在另一段說明青春期後訓練誘發肌力增益通常與荷爾蒙影響下的肌肉肥大有關。
    terms: []
    numbers:
    - v: 50
      unit: '%近於'
      of: 統合分析中青少年相較於兒童可達肌力增加的差異
    concepts:
    - population
    - adaptation
    related:
    - ch04.testosterone.i01
    - ch05.hypertrophy.i06
    locator: Children > The Growing Child > Developmental Changes in Muscular Strength
  - id: ch07.children-training-response.i05
    q: 去訓練效應（Detraining）
    a:
    - 兒童在暫時減少或停止訓練刺激時會發生去訓練（detraining）
    - 訓練誘發的肌力增益不持久，去訓練期間傾向回到未訓練對照組的數值
    - 一項報告中，青春期前兒童在去訓練期間雖參與體育課與有組織運動，仍未維持阻力訓練誘發的肌力增益
    detail: 兒童在去訓練期仍會隨成長增加肌力，因而比成人更難判讀去訓練造成的變化；教材也說精確機制未明，但神經肌肉功能改變可能至少部分參與。
    terms:
    - detraining
    numbers: []
    concepts:
    - population
    - adaptation
    related:
    - ch05.detraining.i01
    locator: Children > Youth Resistance Training > Responsiveness to Resistance Training in Children
  - id: ch07.children-training-response.i06
    q: 訓練頻率影響
    a:
    - 比較每週 1 與 2 天阻力訓練的研究中，每週只訓練 1 天者，平均得到每週 2 天者肌力增益的 67%
    detail: 教材的表述是單一研究中的平均比例，不是所有兒童固定的 1.5 倍法則；增加頻率也要與競賽賽程、課業和同儕互動等承諾一起考量。
    terms: []
    numbers:
    - v: 1
      unit: 天／週
      of: 比較研究中較低頻率的阻力訓練安排
    - v: 2
      unit: 天／週
      of: 比較研究中較高頻率的阻力訓練安排
    - v: 67
      unit: '%'
      of: 每週訓練 1 天者相對於每週訓練 2 天者的平均肌力增益比例
    concepts:
    - population
    - adaptation
    related:
    - ch17.training-frequency.i01
    - ch21.sfra-theory.i02
    locator: Children > Youth Resistance Training > Responsiveness to Resistance Training in Children
  - id: ch07.children-training-response.i07
    q: 神經系統發展
    a:
    - 若運動神經元的神經纖維髓鞘化缺乏或未完成，快速反應與熟練動作無法成功完成，也不可能有高水準的肌力與爆發力
    - 許多運動神經元直到性成熟才完成髓鞘化；兒童在完全神經成熟前，不應被期望像成人般回應訓練或達到相同技能水準
    detail: 原文講的是神經成熟對表現與訓練反應的發展限制，並非以「高技術動作」作為唯一分類，也沒有提供可用年齡判定成熟度。
    terms:
    - motor-neuron
    numbers: []
    concepts:
    - population
    - motor-control
    related:
    - ch01.neuromuscular.nmj
    - ch05.neural-adaptations.i05
    locator: Children > The Growing Child > Developmental Changes in Muscular Strength
  - id: ch07.children-training-response.i08
    q: 早熟 vs 晚熟影響
    a:
    - 在同一時點，早熟兒童相較於同性交、肌肉量較少的晚熟兒童，絕對肌力可能較有優勢
    - 青春期末，早熟者傾向為中胚型或內胚型，晚熟者傾向為外胚型（ectomorphic）；晚熟者隨青春期進展通常會趕上早熟者
    detail: 這些是「傾向」而非對單一兒童的體型診斷。教材也提醒身體比例會影響動作，例如短手臂與較大胸腔有利上肢推舉，而長腿與長軀幹不利深蹲。
    terms:
    - biological-age
    numbers: []
    concepts:
    - population
    - adaptation
    related:
    - ch12.selection-factors.i05
    locator: Children > The Growing Child > Developmental Changes in Muscular Strength
- id: female-acl
  title: 女性 ACL 傷害 Female ACL Injury
  desc: ''
  tag: Female
  items:
  - id: ch07.female-acl.i01
    q: 發生率：6 倍風險
    a:
    - 多份報告指出，女性運動員發生前十字韌帶（anterior cruciate ligament, ACL）撕裂的可能性是男性選手的 6 倍；足球與籃球等運動特別值得留意膝傷害
    - 有些觀察者據此推估，每年女性大專運動員會出現超過 15,000 件嚴重膝傷害
    detail: 「超過 15,000」的原文是嚴重膝傷害，不是已確認的 ACL 撕裂數；教材也指出女性膝傷增加有可能部分反映參與有組織運動的人數增加。
    terms:
    - anterior-cruciate-ligament
    numbers:
    - v: 6
      unit: 倍
      of: 報告中女性運動員相較男性選手發生 ACL 撕裂的可能性
    - v: 15000
      unit: 件／年以上
      of: 有些觀察者估計女性大專運動員發生的嚴重膝傷害數量
    concepts:
    - population
    - injury
    related:
    - ch22.injury-prevention.i03
    - ch22.injury-prevention.i06
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
  - id: ch07.female-acl.i02
    q: 最主要因素：神經肌肉缺陷
    a:
    - 解剖與荷爾蒙因素可能使女性 ACL 傷害風險較高，但教材認為最重要的成因是神經肌肉缺陷
    - 此缺陷最終造成異常生物力學：腳接觸地面時動態膝外翻（dynamic knee valgus）增加
    detail: 「教材認為」保留原文的 believed 語氣；它不是宣稱這個成因已排除所有其他因素，反而在前段列出多種可能的共同因素。
    terms:
    - anterior-cruciate-ligament
    - dynamic-knee-valgus
    numbers: []
    concepts:
    - population
    - injury
    related:
    - ch18.safety.i02
    - ch19.neuromuscular-basis.i07
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
  - id: ch07.female-acl.i03
    q: 非接觸性受傷機制
    a:
    - 女性運動員多數 ACL 傷害發生於非接觸機制，例如減速、側向轉向或落地
    - 規律參與旨在強化支撐結構並增加膝關節神經肌肉控制的體能計畫，可能降低運動相關傷害風險
    detail: 教材提出的是「可能降低」風險的條件性主張，並非保證訓練能排除 ACL 傷害。
    terms:
    - anterior-cruciate-ligament
    numbers: []
    concepts:
    - population
    - injury
    related:
    - ch19.agility-cod.i05
    - ch18.safety.i01
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
  - id: ch07.female-acl.i04
    q: 其他可能因素
    a:
    - 教材列為可能因素者包括關節鬆弛度、肢段排列、髁間窩尺寸、韌帶大小、身體動作、鞋－地表互動、技術水準、荷爾蒙變化、使用踝關節護具與訓練不足
    detail: 原文把這些列為可能促成男女膝傷數量差異的因素，沒有排序或確認任何單一因素為女性 ACL 傷害的充分原因。
    terms:
    - anterior-cruciate-ligament
    numbers: []
    concepts:
    - population
    - injury
    related:
    - ch22.injury-prevention.i03
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
  - id: ch07.female-acl.i05
    q: 青春期前介入最佳
    a:
    - 證據顯示，青少年若在青春期前參與預備體能訓練，可能有助於最佳化訓練適應並降低 ACL 傷害風險
    - 教材的 ACL 傷害預防計畫建議中也指出，早期介入看來有助於提升這類計畫的效果
    detail: 這是早期介入「可能／看來有助」的證據陳述；原文沒有稱青春期前是唯一有效或對所有人都最佳的開始年齡。
    terms:
    - anterior-cruciate-ligament
    numbers: []
    concepts:
    - population
    - injury
    related:
    - ch18.special-populations.i08
    - ch21.periodization-hierarchy.i01
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
  - id: ch07.female-acl.i06
    q: 預防：多模式訓練
    a:
    - 建議女性運動員參與全年體能計畫，包含阻力、增強式、速度與敏捷、平衡及柔軟度訓練
    - 計畫應由合格專業人員依個別需求設計與執行，並以週期化方式漸進，讓訓練適應持續出現
    detail: 在正文中，教材特別把阻力、增強式、敏捷與平衡訓練放在「強化肌肉與結締組織、增進膝關節神經肌肉控制」的脈絡，而不是把所有成分視為可任意互換。
    terms:
    - anterior-cruciate-ligament
    numbers: []
    concepts:
    - population
    - injury
    related:
    - ch18.program-design.i08
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
  - id: ch07.female-acl.i07
    q: 動作力學教育
    a:
    - 應確認女性運動員學會並能在不同環境中反覆示範正確動作力學，例如跳躍、落地、扭轉與切入
    - 訓練中應提供增強回饋，以最佳化技能轉移並改善與 ACL 傷害有關的生物力學
    detail: 原文的側欄還要求每次運動前安排一般動態暖身與特定暖身，特定暖身的動作應類似活動內容並針對關鍵肌群（如後側鏈）活化。
    terms:
    - anterior-cruciate-ligament
    numbers: []
    concepts:
    - population
    - injury
    related:
    - ch18.safety.i01
    - ch19.agility-cod.i06
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
  - id: ch07.female-acl.i08
    q: 營養支持
    a:
    - 女性運動員應攝取足夠能量，並在均衡飲食中強調優質蛋白質與健康脂肪，以最佳化訓練適應
    detail: 本段原文說的是最佳化訓練適應，未直接宣稱這項飲食建議會降低女性運動員三聯症風險；三聯症的能量可用性與骨健康風險在前一小節另有說明。
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    - nutrition
    related:
    - ch09.protein.i02
    locator: Female Athletes > Program Design Considerations for Women > Anterior Cruciate Ligament Injury in Females
- id: female-physiology
  title: 女性生理差異 Female Physiological Differences
  desc: ''
  tag: Female
  items:
  - id: ch07.female-physiology.i01
    q: 絕對肌力差異
    a:
    - 女性的絕對肌力一般約為男性的 2/3
    - 女性下肢絕對肌力通常比上肢絕對肌力更接近男性數值；部分原因是女性腰部以上的肌肉量較少，以及身體組成、人體測量特徵與去脂體重分布的性別差異
    detail: 教材提醒，個體之間的肌力能力範圍很大；兩位女性（或兩位男性）之間的差異，在某些情況下可能比一男一女之間的差異更大。
    terms: []
    numbers:
    - v: 2/3
      unit: 比例
      of: 女性一般絕對肌力相對於男性絕對肌力的約略比例
    concepts:
    - population
    - force-production
    related:
    - ch02.strength-factors.i02
    locator: Female Athletes > Sex Differences > Strength and Power Output
  - id: ch07.female-physiology.i02
    q: 相對肌力：體重標準化
    a:
    - 以體重表示時，女性下肢肌力與男性相近，但女性上肢肌力仍略低
    - 以去脂體重表示時，男女肌力差異傾向消失
    detail: 有限資料顯示，以去脂體重比較時，男女的離心肌力可能比向心肌力更相近；教材仍以「有限資料」限定這項觀察。
    terms: []
    numbers: []
    concepts:
    - population
    - force-production
    related:
    - ch02.size-strength.i01
    - ch13.power-tests.i08
    locator: Female Athletes > Sex Differences > Strength and Power Output
  - id: ch07.female-physiology.i03
    q: 肌肉橫截面積品質相同
    a:
    - 以肌肉橫截面積（muscle cross-sectional area）表示肌力時，男女無顯著差異
    - 此結果表示肌肉品質，即每單位橫截面積的峰值力量，並非性別特異
    detail: 教材同時指出男女肌纖維類型分布與組織化學特徵相似，但男性肌纖維橫截面積傾向較大；這與「每單位面積品質相同」並不矛盾。
    terms:
    - muscle-cross-sectional-area
    numbers: []
    concepts:
    - population
    - force-production
    related:
    - ch02.strength-factors.i02
    locator: Female Athletes > Sex Differences > Strength and Power Output
  - id: ch07.female-physiology.i04
    q: 體組成差異
    a:
    - 平均而言，成年女性比成年男性有較高體脂、較少肌肉量、較低骨礦物質密度與較低總體重
    - 男性相對髖部的肩膀較寬；女性相對腰部與肩膀的髖部較寬
    detail: 教材將這些成人差異與青春期荷爾蒙變化連結：女性雌激素增加脂肪沉積與乳房發育，男性睪固酮增加骨形成與蛋白質合成；極低女性體脂也可能伴隨不良健康後果。
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    locator: Female Athletes > Sex Differences > Body Size and Composition
  - id: ch07.female-physiology.i05
    q: 爆發力輸出差異
    a:
    - 競技舉重選手完成整個抓舉或翻舉拉起動作時，女性相對總體重的爆發力輸出約為男性的 63%
    - 垂直跳與立定跳遠成績也傾向女性較低；以去脂體重表示時，男女差距傾向縮小
    detail: 去脂體重差異並不能完全解釋爆發力差距。教材說資料尚無定論，但力量發展速率與肌肉活化的徵召策略差異可能部分參與。
    terms: []
    numbers:
    - v: 63
      unit: '%'
      of: 競技女性舉重選手在抓舉或翻舉拉起動作中相對體重爆發力輸出，與男性相比的比例
    concepts:
    - population
    - force-production
    related:
    - ch13.power-tests.i01
    - ch05.neural-adaptations.i03
    locator: Female Athletes > Sex Differences > Strength and Power Output
  - id: ch07.female-physiology.i06
    q: 女運動員三聯症（Triad）
    a:
    - 女運動員三聯症（female athlete triad）是能量可用性、月經功能與骨礦物質密度三者的相互關係
    - 長時間高訓練量或高訓練強度而飲食熱量不足的女性運動員，會有健康風險；低能量可用性時較可能出現骨質疏鬆症
    detail: 教材沒有把三聯症寫成三個彼此獨立、必須同時出現的症狀清單，而是強調三項健康面向的相互關係與訓練能量支出的失衡。
    terms:
    - female-athlete-triad
    - bone-mineral-density
    numbers: []
    concepts:
    - population
    - hormone
    - nutrition
    related:
    - ch10.eating-disorders.i06
    - ch09.vitamins-minerals.i04
    locator: Female Athletes > Resistance Training for Female Athletes > Female Athlete Triad
  - id: ch07.female-physiology.i07
    q: 停經（Amenorrhea）
    a:
    - 停經（amenorrhea）定義為月經週期中斷超過 3 個月
    - 原文將其歸因於腦下垂體降低黃體生成素（luteinizing hormone, LH）的分泌頻率
    - 長期生殖抑制女性較常出現骨應力性骨折、內分泌與腸胃併發症，以及運動表現下降
    detail: 教材談的是長期生殖抑制族群中相關問題較常發生，並非說每一位停經女性一定會出現所有併發症。
    terms:
    - amenorrhea
    - luteinizing-hormone
    numbers:
