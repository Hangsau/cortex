      unit: 個月以上
      of: 停經定義所指月經週期中斷的時間
    concepts:
    - population
    - hormone
    - injury
    related:
    - ch10.eating-disorders.i06
    - ch05.connective-tissue.i03
    locator: Female Athletes > Resistance Training for Female Athletes > Female Athlete Triad
  - id: ch07.female-physiology.i08
    q: 女性訓練反應
    a:
    - 女性阻力訓練後肌力增加速率看來可與男性相同或更快；男性的絕對肌力增益常較大，但女性的相對（百分比）增益約相同或較大
    - 以電腦斷層等精確技術測量時，短期至 16 週的肌肉肥大相對增益在兩性間相似
    detail: 教材說女性較大的相對肌力增益可能反映其平均訓練前神經肌肉水準較低。長期、高量或高強度訓練中女性也能肌肉肥大，但可能小於男性。
    terms:
    - muscle-hypertrophy
    numbers:
    - v: 16
      unit: 週內
      of: 精確測量下女性與男性肌肉肥大相對增益相似的短期訓練上限
    concepts:
    - population
    - adaptation
    related:
    - ch04.testosterone.i05
    locator: Female Athletes > Resistance Training for Female Athletes > Responsiveness to Resistance Training in Women
- id: older-adults-training
  title: 老年人訓練反應 Older Adults Training Response
  desc: ''
  tag: Aging
  items:
  - id: ch07.older-adults-training.i01
    q: 顯著肌力增加（含高齡）
    a:
    - 先前久坐的高齡男性完成 12 週阻力訓練後，膝伸肌力增加超過一倍、膝屈肌力增加為三倍；高齡女性完成 12 週訓練也有相似觀察
    - 一項研究顯示，87–96 歲男女只進行 8 週阻力訓練便能改善肌力
    detail: 教材將前幾週的明顯改變連結到許多高齡者原本去體能化的狀態；這些數字不是所有高齡者的保證性增幅。
    terms: []
    numbers:
    - v: 12
      unit: 週
      of: 先前久坐高齡男性與高齡女性獲得所述肌力改善的阻力訓練期間
    - v: 2
      unit: 倍以上
      of: 先前久坐高齡男性 12 週訓練後膝伸肌力的增加幅度
    - v: 3
      unit: 倍
      of: 先前久坐高齡男性 12 週訓練後膝屈肌力的增加幅度
    - v: 87–96
      unit: 歲
      of: 僅進行 8 週阻力訓練而顯示可改善肌力的高齡男女年齡範圍
    - v: 8
      unit: 週
      of: 87–96 歲高齡男女改善肌力的阻力訓練期間
    concepts:
    - population
    - adaptation
    related:
    - ch05.neural-adaptations.i01
    - ch17.principles-exam-tips.i03
    locator: Older Adults > Resistance Training for Older Adults > Responsiveness to Resistance Training in Older Adults
  - id: ch07.older-adults-training.i02
    q: 高速度訓練優勢
    a:
    - 有些研究指出，高速度爆發力訓練對爆發性出力的影響可能大於傳統漸進阻力訓練
    - 一項 16 週比較中，高速度阻力訓練的高齡者峰值爆發力增加較多、最大肌力增益與慢速度組相似
    - 肌力與爆發力的最佳高齡訓練處方尚未確定；教材說訓練強度與兩者改善之間似乎存在劑量反應，高強度較中、低強度更有效發展最大肌力
    detail: 教材分別以「有些情況被建議」「似乎有劑量反應」來限定證據；這不是所有高齡者都應立刻採用高速訓練的處方。
    terms: []
    numbers:
    - v: 16
      unit: 週
      of: 高速度與慢速度阻力訓練比較峰值爆發力與最大肌力的研究期間
    concepts:
    - population
    - adaptation
    related:
    - ch17.principles-exam-tips.i08
    - ch19.rfd-impulse.i01
    locator: Older Adults > Resistance Training for Older Adults > Responsiveness to Resistance Training in Older Adults
  - id: ch07.older-adults-training.i03
    q: 骨密度效益
    a:
    - 規律阻力訓練可藉維持或提高骨礦物質密度，抵銷與年齡相關的骨骼健康下降
    - 也可能透過改善動態平衡、肌肉量與整體身體活動量，降低骨質疏鬆性骨折風險
    - 骨骼只在持續訓練期間保留運動的有益效果；不活動時，骨密度傾向回到運動前水準
    detail: 教材強調骨骼反應同時受到荷爾蒙狀態、活動史與營養等複雜交互作用影響，因此運動的實際受益程度不只取決於是否阻力訓練。
    terms:
    - bone-mineral-density
    numbers: []
    concepts:
    - population
    - adaptation
    related:
    - ch05.connective-tissue.i04
    locator: Older Adults > Resistance Training for Older Adults > Responsiveness to Resistance Training in Older Adults
  - id: ch07.older-adults-training.i04
    q: 功能性改善
    a:
    - 高齡族群的訓練誘發肌力增益，也與步行速度、爬樓梯能力、平衡與整體自發性活動改善有關
    detail: 教材還指出，針對爆發力的阻力訓練可能有助最佳化功能能力；高齡者的功能改善是肌力、爆發力、肌肉量、骨密度與訓練情境共同作用的結果，不能只以單一力量測驗推定。
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related:
    - ch05.neural-adaptations.i08
    locator: Older Adults > Resistance Training for Older Adults > Responsiveness to Resistance Training in Older Adults
  - id: ch07.older-adults-training.i05
    q: 訓練頻率建議
    a:
    - 因高齡者恢復可能較久，至少在初始適應期建議每週訓練 2 次
    - 從每個動作 1 組、8–12 次、相對低強度（40%–50% 1RM）起步，再依個別需求、目標與能力漸進至每個動作 3 組、60%–80% 1RM
    detail: 這段處方是在參與者先掌握基本阻力動作之後；未訓練高齡者起初應個別化、低強度低訓練量，重點在學習技術並降低痠痛與傷害可能。
    terms:
    - repetition-maximum
    numbers:
