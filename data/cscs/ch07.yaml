    locator: Children > Youth Resistance Training > Potential Benefits
  - id: ch07.children-risk-benefits.i08
    q: 運動表現提升
    a:
    - 參與 8–20 週阻力訓練的兒童，曾觀察到立定跳遠、垂直跳、30 m 衝刺與敏捷跑等選定動作表現改善
    - 直接評估青少年阻力訓練對實際運動表現的研究很少；教材認為漸進阻力訓練「很可能」讓年輕運動員的運動表現有某種程度改善
    detail: 動作測驗進步不等同於已在特定運動競賽中證實成效；教材明確區分已觀察到的動作表現與較少的直接運動表現研究。
    terms: []
