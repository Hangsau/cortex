    q: 營養配合訓練
    a:
    - 高齡者食物攝取的品質與量可能決定肌肉量是流失或增加；足夠蛋白質似乎是高齡者肌肉肥大所必需
    - 巨量營養素或微量營養素攝取不足，與疲勞、免疫功能受損及傷害恢復延遲等負面健康後果有關；改善飲食也可能最佳化阻力訓練適應
