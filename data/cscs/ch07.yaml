cards:
- q: PHV（峰值身高速度）分別在女性和男性幾歲達到？
  a: 女：約 12 歲；男：約 14 歲
  tag: Children
- q: 為何評估兒童運動員應使用生理年齡而非時序年齡？
  a: 同齡兒童身高差可達 23cm、體重差達 18kg，生理年齡更能反映發展程度
  tag: Children
- q: 評估生理年齡的黃金標準是什麼？
  a: 左腕 X 光骨化程度比對（骨骼年齡）
  tag: Children
- q: Tanner 分期為何不適合由肌力教練使用？
  a: 具侵入性，應只限合格臨床人員使用，不適合教練現場評估
  tag: Children
- q: 骨骺板（Epiphyseal plate）完全骨化後有何結果？
  a: 長骨停止生長；女性比男性早 2–3 年完成骨化
  tag: Children
- q: PHV 期間骨骺板的受傷風險如何改變？
  a: PHV 期間骨骺板骨折發生率最高；成人造成韌帶撕裂的力道可在兒童造成骨骺板骨折
  tag: Children
- q: 訓練年齡（Training Age）的定義是什麼？
  a: 正式參與有監督訓練的時間長度；與時序年齡不同，影響訓練適應幅度
  tag: Children
- q: 兒童重訓傷害大多發生於什麼情境？
  a: 監督不足、技術不當或負荷不適合的情況；骨骺板骨折案例均在無監督情境下
  tag: Children
- q: 美國每年有多少比例的兒童過度使用傷害是可預防的？
  a: 超過 50%，可透過教練教育、預備訓練、延後專項化來預防
  tag: Children
- q: 在適當條件下 1RM 測試對兒童是否安全？
  a: 是，在適當暖身、負荷逐漸增加、嚴密監督下已被證明安全
  tag: Children
- q: 早期運動專項化有哪些風險？
  a: 肌肉失衡、過度使用傷害、過度訓練及倦怠風險；晚期專項化更有利長期運動表現
  tag: Children
- q: 阻力訓練對兒童骨密度有何效益？
  a: 可提升兒童及青少年骨礦密度；青少年舉重選手骨密度顯著高於同齡對照組
  tag: Children
- q: 阻力訓練後兒童有哪些運動表現改善？
  a: 8–20 週後：立定跳遠、垂直跳、30m 衝刺及敏捷跑均有改善
  tag: Children
- q: 阻力訓練為何特別適合肥胖兒童？
  a: 可改善體脂、胰島素敏感性及心臟功能；不需高有氧負荷，參與度較高
  tag: Children
- q: 青春期前兒童肌力增加的主要機制是什麼？
  a: 運動單位活化與同步、招募頻率提升（神經適應），非肌肥大
  tag: Children
- q: 青春期前男性的睪固酮水平為何？青春期男性呢？
  a: 青春期前：20–60 ng/100ml；青春期男性升至約 600 ng/100ml
  tag: Children
- q: 未訓練青春期前兒童在 8–20 週訓練後典型肌力增幅是多少？
  a: 通常可增加約 30%–40%，文獻報告範圍 10%–90%
  tag: Children
- q: Meta 分析中青少年相比兒童的肌力增幅差異為何？
  a: 青少年肌力增幅比兒童高約 50%，因青春期後荷爾蒙充足、肌肥大可貢獻更多
  tag: Children
- q: 兒童停止訓練後肌力增益會發生什麼？
  a: 訓練誘導的肌力增益不持久，停練後趨向回到未訓練對照組水準
  tag: Children
- q: 每週 2 次訓練的兒童肌力增益大約是每週 1 次的幾倍？
  a: 約 1.5 倍
  tag: Children
- q: 兒童為何在髓鞘化完成前無法執行高技術動作？
  a: 神經傳導的精確控制需要髓鞘化完整，不完整時無法安全執行複雜技術動作
  tag: Children
- q: 女性絕對肌力約為男性的幾分之幾？
  a: 約 2/3
  tag: Female
- q: 以去脂體重標準化後，男女肌力差距如何？
  a: 差距幾乎消失，代表每單位肌肉橫截面積產生的力量無顯著性別差異
  tag: Female
- q: 女運動員三聯症（Triad）的三個組成是什麼？
  a: 能量可用性↓ + 月經功能異常 + 骨密度↓
  tag: Female
- q: 停經（Amenorrhea）的定義是什麼？
  a: 月經中斷超過 3 個月，由腦垂體 LH 分泌頻率降低引起
  tag: Female
- q: 女性的訓練誘導肌力增幅（%）與男性相比如何？
  a: 女性增幅比例 ≥ 男性，或至少相同；短期（≤16 週）肌肥大增幅與男性相似
  tag: Female
- q: 為何女性下肢肌力比上肢更接近男性數值？
  a: 體脂肪在下肢的分布差異較小，下肢肌肉量差距比上肢小
  tag: Female
- q: 女性的爆發力輸出（以體重標準化）大約是男性的幾成？
  a: 約 63%；以去脂體重標準化後差距縮小
  tag: Female
- q: 女性 ACL 撕裂發生率相比男性是多少倍？
  a: 6 倍，在足球、籃球尤為顯著
  tag: ACL
- q: 女性 ACL 傷害中最重要的可改變風險因素是什麼？
  a: 神經肌肉缺陷，導致動態膝外翻（dynamic knee valgus）
  tag: ACL
- q: 大多數女性 ACL 傷害發生在什麼情境？
  a: 非接觸情境：減速、側向旋轉或落地動作
  tag: ACL
- q: 何時開始 ACL 預防訓練效果最佳？
  a: 青春期前開始預備性訓練效果最佳
  tag: ACL
- q: 完整的 ACL 預防訓練計畫應包含哪些成分？
  a: 阻力訓練 + 增強式訓練 + 敏捷與平衡訓練 + 柔軟度訓練，全年度計畫
  tag: ACL
- q: 在 ACL 預防訓練中應對女性運動員提供哪種教育？
  a: 確保學會並能反覆示範正確的跳躍、落地、扭轉、切入動作力學
  tag: ACL
- q: 87–96 歲受試者在 8 週阻力訓練後有何效果？
  a: 肌力顯著提升；先前久坐老人 12 週後膝伸肌力增倍，膝屈肌力增為 3 倍
  tag: Aging
- q: 高速爆發力訓練對老年人的優勢是什麼？
  a: 對爆發力的改善優於傳統低速訓練，且在肌力增幅上相似
  tag: Aging
- q: 老年人初期的建議訓練頻率和強度是什麼？
  a: 每週 2 次；初始強度 40%–50% 1RM，漸進至 60%–80% 1RM
  tag: Aging
- q: 健康老年人的爆發力訓練處方是什麼？
  a: 1–3 組/動作，40%–60% 1RM，每組 6–10 次，以高速度執行
  tag: Aging
- q: 為何老年人應避免 Valsalva 動作？
  a: 造成收縮壓與舒張壓急遽上升，心血管疾病患者風險更高
  tag: Aging
- q: 單獨阻力訓練能否有效預防老年人跌倒？
  a: 不能；需結合平衡訓練與柔軟度訓練才能有效降低跌倒風險
  tag: Aging
- q: 什麼功能性指標與老年人的訓練誘導肌力增益有關？
  a: 步行速度、爬樓梯能力、平衡感及自發性活動
  tag: Aging
- q: 肌少症（Sarcopenia）的定義是什麼？
  a: 老化相關的肌肉量與肌力流失；30 歲後肌肉橫截面積開始下降
  tag: Aging
- q: 55–64 歲、65–74 歲、75–84 歲女性無法舉起 4.5 kg 的比例各是多少？
  a: 55–64 歲：40%；65–74 歲：45%；75–84 歲：65%
  tag: Aging
- q: 為何爆發力比肌力隨年齡衰退得更快？
  a: Ⅱ型肌纖維衰退更早更快，爆發力對爬樓梯等日常活動影響更大
  tag: Aging
- q: 骨質疏鬆症和骨質減少症的骨礦密度標準是什麼？
  a: 骨質疏鬆：低於年輕成人平均 2.5 SD；骨質減少：-1 至 -2.5 SD
  tag: Aging
- q: 老年人的共同收縮（Cocontraction）是什麼？它有何代價？
  a: 拮抗肌共同收縮以穩定關節、減少姿勢搖擺，但會降低淨關節力矩
  tag: Aging
- q: 老年人跌倒的主要風險因子有哪些？
  a: 肌力與爆發力下降、反應時間延長、平衡與姿勢穩定性受損
  tag: Aging
- q: 競技舉重能力每年大約下降多少？70 歲後有何變化？
  a: 每年約 1%–1.5% 直至 70 歲，之後下降更明顯；不運動者衰退更快
  tag: Aging
- q: 教兒童阻力訓練時第一優先原則是什麼？
  a: 技術優先：從無負重（木棒/PVC 管）開始，技術無法維持時必須降低阻力
  tag: Program Design
- q: 兒童的訓練量建議是什麼？
  a: 1–3 組，每組 6–15 次；每週 2–3 次非連續日；多種單/多關節動作
  tag: Program Design
- q: 女性訓練計畫在哪裡應做特別調整？計畫原則有何不同？
  a: 可增加 1–2 個上肢動作或組數；整體計畫設計原則與男性相同，主要差異在絕對阻力大小
  tag: Program Design
- q: 老年人開始訓練前應先完成什麼？
  a: 病史與危險因子問卷；可能需要醫師許可（心臟復健、癌症倖存者等）
  tag: Program Design
- q: 兒童、女性、老年人三族群的訓練核心共同原則是什麼？
  a: 不可以增加強度或負荷為代價犧牲技術品質
  tag: Program Design
