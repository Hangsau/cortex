cards:
- q: 教材中 PHV 通常在女性與男性各約幾歲出現？
  a: 女性約 12 歲，男性約 14 歲；PHV 是青春期生長突增中生長速率最大的年齡。
  tag: Children
- q: 為何成熟度評估不能只按兒童的時序年齡？
  a: 兒童生長不等速；一群 14 歲兒童的身高差可達 23 cm、體重差可達 18 kg，成熟度也與體適能表現相關。
  tag: Children
- q: 判定生理成熟的黃金標準是什麼？
  a: 骨骼年齡評估，由受訓放射線人員將左腕 X 光片與標準參考片比較骨化程度。
  tag: Children
- q: Tanner 分期為何不應由肌力與體能教練施作？
  a: 它以第二性徵視覺評估、具侵入性且有方法學限制；僅在必要時由合格臨床人員施作。
  tag: Children
- q: 骨骺板完全骨化後有何結果？
  a: 長骨停止生長。女孩通常比男孩早約 2–3 年達完全骨成熟，多數骨頭在 20 歲出頭已融合。
  tag: Children
- q: 為何青春期生長突增期要特別注意兒童的生長軟骨？
  a: 骨骺板骨折的發生高峰約在 PHV；成人可能造成韌帶撕裂的跌倒或反覆壓力，在兒童可能造成骨骺板骨折。
  tag: Children
- q: 訓練年齡（training age）是什麼？
  a: 兒童持續遵循正式、受監督阻力訓練計畫的時間長度；既有適應程度會影響後續肌力增益。
  tag: Children
- q: 兒童重量訓練室傷害通常在哪些條件下發生？
  a: 傷害較可能屬意外，常見於監督與教學、技術能力或訓練負荷不適當；骨骺板病例報告通常涉及無監督重負荷過頭舉。
  tag: Children
- q: 教材估計多少兒童過度使用傷害可用簡單策略預防？
  a: 超過 50%；可採教練教育、預備體能訓練與延後專項化等方式。
  tag: Children
- q: 兒童與青少年的 1RM 測試在何種條件下已證實安全？
  a: 充分暖身、負荷個別漸進，且全程密切監督時。
  tag: Children
- q: 年幼時只做單一運動或單一位置專項化有何風險？
  a: 較可能出現肌肉失衡、過度使用傷害、過度訓練與倦怠；晚期專項化及早年參與多種活動似乎與日後運動成功較有關。
  tag: Children
- q: 包含阻力訓練的負重活動對兒童與青少年的骨骼有何效益？
  a: 已顯示可提升骨礦物質密度；規律重負荷多關節訓練的菁英青少年舉重選手骨密度遠高於同齡對照組。
  tag: Children
- q: 兒童完成 8–20 週阻力訓練後，教材列出哪些已改善的動作表現？
  a: 立定跳遠、垂直跳、30 m 衝刺與敏捷跑；但直接評估實際運動表現的研究仍少。
  tag: Children
- q: 教材如何解釋肥胖青少年似乎喜歡阻力訓練？
  a: 阻力訓練不會造成高有氧負荷，並提供每位參與者成功與良好表現感受的機會；研究也報告體脂、胰島素敏感性與心臟功能改善。
  tag: Children
- q: 青春期前兒童的訓練誘發肌力增益主要看來與哪些因素有關？
  a: 神經因素，例如運動單位活化與同步增加、徵召與放電頻率提升；至少 20 週內，肌肉肥大不太可能是主要原因。
  tag: Children
- q: 青春期前與青春期男性的睪固酮濃度，教材各列為多少？
  a: 青春期前男孩與女孩為 20–60 ng/100 ml；青春期男性約為 600 ng/100 ml，女性濃度維持不變。
  tag: Children
- q: 未訓練青春期前兒童短期阻力訓練後的典型肌力增幅為何？
  a: 8–20 週後約 30%–40%；文獻報告的最大肌力增幅範圍為約 10%–90%。
  tag: Children
- q: 教材引用的統合分析中，青少年可達到的肌力增加與兒童相差多少？
  a: 青少年幾乎比兒童高 50%；原文未把這個統合分析的差異明確歸因於單一原因。
  tag: Children
- q: 兒童去訓練後，訓練誘發的肌力增益通常如何變化？
  a: 不持久，傾向回到未訓練對照組數值；一項報告中，體育課與有組織運動也未能維持該增益。
  tag: Children
- q: 比較每週 1 天與 2 天阻力訓練的研究中，低頻率組的平均肌力增益為何？
  a: 每週訓練 1 天者，平均得到每週訓練 2 天者肌力增益的 67%。
  tag: Children
- q: 運動神經元髓鞘化未完成，對兒童表現有何意義？
  a: 快速反應與熟練動作無法成功完成，也不可能有高水準肌力與爆發力；許多運動神經元直到性成熟才完成髓鞘化。
  tag: Children
- q: 女性的一般絕對肌力約為男性的多少？
  a: 約 2/3；女性下肢絕對肌力通常比上肢絕對肌力更接近男性數值。
  tag: Female
- q: 以去脂體重比較時，男女肌力差異如何？
  a: 差異傾向消失；以肌肉橫截面積比較時也無顯著差異，表示每單位面積的峰值力量並非性別特異。
  tag: Female
- q: 女運動員三聯症（female athlete triad）指的是哪三項健康面向的相互關係？
  a: 能量可用性、月經功能與骨礦物質密度；長期高訓練支出而飲食熱量不足的女性運動員有健康風險。
  tag: Female
- q: 教材如何定義停經（amenorrhea）？
  a: 月經週期中斷超過 3 個月；原文將其歸因於腦下垂體黃體生成素分泌頻率降低。
  tag: Female
- q: 女性與男性的阻力訓練肌力與短期肌肉肥大反應如何比較？
  a: 女性肌力增加速率看來可相同或更快；男性絕對增益常較大、女性相對增益約相同或較大，至 16 週的相對肌肉肥大增益相似。
  tag: Female
- q: 教材如何部分解釋女性下肢絕對肌力較接近男性、上肢差異較大的現象？
  a: 與身體組成、人體測量特徵及去脂體重分布有關；女性腰部以上的肌肉量傾向較少。
  tag: Female
- q: 競技女性舉重選手在抓舉或翻舉拉起動作中的相對體重爆發力，約為男性的多少？
  a: 約 63%；以去脂體重表示時差距傾向縮小，但去脂體重並不能完全解釋差異。
  tag: Female
- q: 多份報告中，女性運動員發生 ACL 撕裂的可能性約為男性的多少？
  a: 約 6 倍；教材特別提醒足球與籃球等運動的膝傷害。
  tag: ACL
- q: 教材認為女性 ACL 傷害最重要的成因是什麼？
  a: 神經肌肉缺陷，最終造成腳接觸地面時動態膝外翻增加；此為教材的 believed 語氣，非排除其他可能因素。
  tag: ACL
- q: 女性運動員多數 ACL 傷害的機制是什麼？
  a: 非接觸機制，例如減速、側向轉向或落地。
  tag: ACL
- q: 教材對 ACL 風險的早期預備體能訓練如何表述？
  a: 證據顯示青春期前參與可能有助最佳化訓練適應並降低風險；早期介入看來有助提升預防計畫效果。
  tag: ACL
- q: 教材建議女性運動員全年體能計畫包含哪些訓練成分？
  a: 阻力、增強式、速度與敏捷、平衡及柔軟度訓練；須依個別需求由合格專業人員週期化漸進。
  tag: ACL
- q: ACL 傷害風險計畫中的動作教學與回饋重點是什麼？
  a: 確認女性能在不同環境中反覆示範正確跳躍、落地、扭轉與切入動作，並提供增強回饋以改善相關生物力學。
  tag: ACL
- q: 87–96 歲男女進行 8 週阻力訓練的研究顯示什麼？
  a: 顯示極高齡男女仍能改善肌力；另一項 12 週研究中，先前久坐高齡男性膝伸肌力增加超過一倍、膝屈肌力增加為三倍。
  tag: Aging
- q: 一項 16 週高速度與慢速度訓練比較，對高齡者的結果為何？
  a: 高速度組峰值爆發力增加較多，最大肌力增益相似；教材仍說最佳處方尚未確定。
  tag: Aging
- q: 高齡者掌握基本動作後，教材舉例的阻力訓練漸進處方為何？
  a: 初始適應期建議每週 2 次；由每動作 1 組、8–12 次、40%–50% 1RM，漸進至每動作 3 組、60%–80% 1RM。
  tag: Aging
- q: 健康高齡者成功完成一般阻力訓練後，可採何種爆發力處方？
  a: 每動作 1–3 組，以 40%–60% 1RM 做 6–10 次，每次反覆以高速度完成。
  tag: Aging
- q: 為何 Valsalva 動作一般不建議高齡者使用？
  a: 雖可穩定軀幹與脊柱，卻會突然提高收縮壓與舒張壓；有心血管或腦部病史者尤其應避免。
  tag: Aging
- q: 單獨阻力訓練是否看來能預防高齡者跌倒？
  a: 看來不能；需搭配平衡與柔軟度訓練，並遵從包含阻力與平衡訓練的多面向計畫。
  tag: Aging
- q: 高齡者的訓練誘發肌力增益與哪些功能改善有關？
  a: 步行速度、爬樓梯能力、平衡與整體自發性活動。
  tag: Aging
- q: 肌少症（sarcopenia）在本章指什麼？
  a: 隨老化出現的肌肉量與肌力流失；30 歲後個別肌肉橫截面積與密度下降，肌內脂肪增加。
  tag: Aging
- q: 一份報告中，無法舉起約 4.5 kg 的女性比例隨年齡組如何變化？
  a: 55–64 歲為 40%，65–74 歲為 45%，75–84 歲為 65%；這是特定報告的女性資料。
  tag: Aging
- q: 教材如何說明老化時爆發力衰退比肌力更快？
  a: 肌纖維大小與數量減少及逐漸去神經支配，會降低快速產生力量的能力；這會不利於爬樓梯與步行等日常活動。
  tag: Aging
- q: 教材對骨質減少症與骨質疏鬆症的骨礦物質密度界線為何？
  a: 骨質減少症介於年輕成人平均的 −1 至 −2.5 SD；骨質疏鬆症低於年輕成人平均 −2.5 SD。
  tag: Aging
- q: 高齡者的共同收縮（cocontraction）如何代償平衡困難？代價是什麼？
  a: 跨同一關節的主動肌與拮抗肌同時活化，以動態穩定關節並減少姿勢搖擺；代價是淨關節力矩與主動肌力量輸出降低。
  tag: Aging
- q: 教材列出的高齡者跌倒內在風險因子有哪些？
  a: 肌力與爆發力下降、反應時間變慢，以及平衡與姿勢穩定性受損。
  tag: Aging
- q: 競技舉重能力隨年齡的下降率及轉折年齡為何？
  a: 約每年 1%–1.5%，至約 70 歲；之後下降更明顯。這談的是競技舉重能力，非一般人固定肌力流失率。
  tag: Aging
- q: 兒童學習新阻力動作時，教材的技術優先原則是什麼？
  a: 從無負重槓鈴、長木棒或 PVC 管學習；無法維持正確技術時必須降低阻力。
  tag: Program Design
- q: 教材對兒童阻力訓練的組數、次數與頻率建議為何？
  a: 多種單關節與多關節動作各 1–3 組、每組 6–15 次；每週 2 或 3 次非連續訓練，高訓練年齡者可更多次。
  tag: Program Design
- q: 女性若上肢力量限制多關節自由重量動作，可如何調整？整體課程原則是否不同？
  a: 可增加 1–2 個上肢動作或額外 1–2 組；兩性課程原則相同，通常只依個人肌力能力調整絕對阻力。
  tag: Program Design
- q: 高齡者開始運動計畫前，教材要求先完成什麼？
  a: 病史與風險因子問卷；部分人開始中等或劇烈運動前需要醫師核可，例如心臟復健病人或癌症倖存者。
  tag: Program Design
- q: 高齡者課程設計中，教材說與青少年及女性相同的技術原則是什麼？
  a: 不可為提高訓練刺激而犧牲技術熟練度；休息不足、技術難度過高或提高強度都會增加傷害可能。
  tag: Program Design
