  - id: ch07.older-adults-training.i07
    q: Valsalva 動作注意事項
    a:
    - Valsalva 動作在阻力訓練中可協助穩定軀幹與脊柱，但會突然提高收縮壓與舒張壓，因此一般不建議高齡者使用
    - 有心血管疾病史（如心律不整、心絞痛）或腦部狀況（如中風、頭暈）的成人尤其應避免
    detail: 教材用「一般不建議」而非絕對禁忌；不過它明確要求肌力與體能專業人員注意此動作對高齡者的風險。
    terms:
    - valsalva
    numbers: []
    concepts:
    - population
    - adaptation
    related:
    - ch15.breathing.i04
    - ch15.breathing.i07
    locator: Older Adults > Resistance Training for Older Adults > Program Design Considerations for Older Adults
  - id: ch07.older-adults-training.i08
    q: 阻力訓練≠預防跌倒（單獨）
    a:
    - 單獨阻力訓練看來無法預防高齡者跌倒風險
    - 要降低跌倒風險，阻力訓練須搭配平衡與柔軟度訓練；教材也主張高齡者需遵從包含阻力與平衡訓練的多面向計畫
    detail: 教材的區分是「單純增加身體活動」不足以預防跌倒，重點在遵從多面向計畫；這不否定阻力訓練對肌力、爆發力與骨礦物質密度的其他重要效益。
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    locator: Older Adults > Age-Related Changes in Neuromotor Function
- id: program-design-populations
  title: 各族群處方設計整合 Program Design by Population
  desc: ''
  tag: Program Design
  items:
  - id: ch07.program-design-populations.i01
    q: 兒童：技術優先原則
    a:
    - 兒童學習新動作時，應從無負重槓鈴、長木棒或 PVC 管開始，先學正確技術
    - 若無法維持正確動作技術，必須降低阻力
    detail: 教材強調此階段回饋的正確時機與方式很重要，且應由受訓觀察者規律評等動作技術，而非只評估舉起重量或動作速度。
    terms: []
    numbers: []
    concepts:
    - population
    - program-design
    related:
    - ch15.exercise-technique-fundamentals.i08
    - ch17.exercise-selection.i08
    locator: Children > Program Design Considerations for Children
  - id: ch07.program-design-populations.i02
    q: 兒童：訓練量設計
    a:
    - 依個別需求與目標，可做多種單關節與多關節動作，每個動作 1–3 組、每組 6–15 次
    - 建議每週 2 或 3 次非連續阻力訓練；訓練年齡較高的青少年可每週更多次
    - 計畫應全年系統性週期化，以序列、變化的刺激及足夠訓練週期間恢復為目標
    detail: 原文把反覆次數與 1RM 百分比的關係描述為動作特異，故這不是可從單一百分比 1RM 套到所有兒童動作的固定負荷換算表。
    terms:
    - repetition-maximum
    numbers:
    - v: 1–3
      unit: 組／動作
      of: 兒童依個別需求與目標進行阻力訓練的建議組數
    - v: 6–15
      unit: 次／組
      of: 兒童阻力訓練每組的建議反覆次數範圍
    - v: 2–3
      unit: 次／週
      of: 兒童建議的非連續阻力訓練頻率
    concepts:
    - population
    - program-design
    related:
    - ch17.training-volume.i08
    - ch17.training-frequency.i01
    locator: Children > Program Design Considerations for Children > Youth Resistance Training Guidelines
  - id: ch07.program-design-populations.i03
    q: 女性：上肢強化重點
    a:
    - 女性上肢絕對肌力通常較低；對因上肢力量限制而難以完成多關節自由重量動作的女性，可增加 1–2 個上肢動作或額外 1–2 組
    - 女性運動員可把多種抓舉、翻舉及衍生舉重動作納入計畫；這些大肌肉量多關節動作的適應可良好轉移到休閒與運動活動表現
    detail: 這是針對有上肢力量限制、難以完成特定多關節自由重量動作的調整，教材沒有要求所有女性一律增加上肢訓練量。
    terms: []
    numbers:
    - v: 1–2
      unit: 個動作或組
      of: 上肢力量受限女性可額外加入的上肢訓練量
    concepts:
    - population
    - program-design
    related:
    - ch17.exercise-selection.i02
    - ch17.training-volume.i03
    locator: Female Athletes > Program Design Considerations for Women > Upper Body Strength Development
  - id: ch07.program-design-populations.i04
    q: 女性：訓練計畫原則
    a:
    - 兩性肌肉的生理特性相同；男性與女性在特定運動或日常活動所需的肌群也相同，因此女性阻力訓練計畫不需要與男性不同
    - 計畫通常唯一的實際差異是某動作所用的絕對阻力，須依個人的肌力能力決定
    detail: 「不需要不同」不是忽略個別能力，而是反對只因性別就另訂一套課程；教材也特別指出年輕女性應規律從事阻力運動以接近成人肌骨肌力與爆發力的遺傳潛能。
    terms: []
    numbers: []
    concepts:
    - population
    - program-design
    related:
    - ch17.needs-analysis.i08
    - ch17.load-repetitions.i04
    locator: Female Athletes > Program Design Considerations for Women
  - id: ch07.program-design-populations.i05
    q: 老年人：醫療史優先
    a:
    - 高齡者開始運動計畫前應完成病史與風險因子問卷，以辨識身體活動限制與可能禁忌
    - 部分人開始中等或劇烈運動前需要醫師核可，例如心臟復健病人或癌症倖存者
    detail: 取得資訊後，教材建議進行前測以記錄基準值和特定運動反應，並以（最好使用訓練器材的）肌力測試協助阻力運動處方，而非只用跑步機測試。
