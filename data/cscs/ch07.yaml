  - id: ch07.older-adults-training.i06
    q: 爆發力訓練處方
    a:
    - 健康高齡者若已成功完成一般阻力訓練計畫，可逐步把高速度爆發力動作納入整體課程
    - 現行建議為每個動作 1–3 組，以輕至中負荷（40%–60% 1RM）做 6–10 次，且每次反覆以高速度完成
    detail: 前提是已完成一般阻力訓練，並非適用於所有剛開始訓練的高齡者；教材用「現行建議」呈現處方，而非宣稱是唯一最適方案。
    terms:
    - repetition-maximum
    numbers:
    - v: 1–3
      unit: 組／動作
      of: 健康高齡者爆發力訓練每個動作的建議組數
    - v: 40–60
      unit: '% 1RM'
      of: 健康高齡者爆發力訓練的輕至中負荷範圍
    - v: 6–10
      unit: 次／組
      of: 健康高齡者爆發力訓練每組的反覆次數範圍
