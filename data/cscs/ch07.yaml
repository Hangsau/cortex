  - id: ch07.program-design-populations.i06
    q: 老年人：安全注意事項
    a:
    - 每次運動前暖身 5–10 分鐘，可用低至中強度有氧活動與徒手體操；靜態伸展可在阻力訓練前、後或前後都做
    - 使用不會過度負荷肌骨系統的阻力，避免 Valsalva 動作，並在無痛關節活動範圍內完成動作
    - 運動課之間應有 48–72 小時恢復，並由合格指導員教學
    detail: 這些是教材側欄列出的安全建議；它先要求高齡者篩檢並視需要徵求醫療建議，並非用固定暖身或恢復時數取代個別醫療評估。
