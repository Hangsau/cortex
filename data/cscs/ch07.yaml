id: ch07
weight: 7
title: Ch.7 年齡與性別差異及阻力訓練
topics:
- id: aging-musculoskeletal
  title: 老年人肌骨變化 Aging Musculoskeletal Changes
  desc: ''
  tag: Aging
  items:
  - id: ch07.aging-musculoskeletal.i01
    q: 肌少症（Sarcopenia）
    a:
    - 老化相關的肌肉量與肌力流失。30 歲後肌肉橫截面積開始下降，同時肌肉密度降低、肌內脂肪增加
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.aging-musculoskeletal.i02
    q: 肌力流失數據
    a:
    - 55–64 歲女性 40% 無法舉起 4.5kg
    - 65–74 歲 45%
    - 75–84 歲 65%。肌力下降嚴重影響日常功能
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.aging-musculoskeletal.i03
    q: 爆發力衰退更快
    a:
    - 爆發力比肌力衰退更快。爬樓梯、步行等日常活動需要一定爆發力，爆發力下降影響功能獨立性
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.aging-musculoskeletal.i04
    q: 骨質疏鬆症
    a:
    - 骨礦密度低於年輕成人平均值 2.5 SD 以下。骨質減少症（Osteopenia）：-1 至 -2.5 SD 之間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.aging-musculoskeletal.i05
    q: 跌倒風險因子
    a:
    - 肌力與爆發力下降、反應時間延長、平衡與姿勢穩定性受損，均增加跌倒風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.aging-musculoskeletal.i06
    q: 共同收縮（Cocontraction）
    a:
    - 老年人增加拮抗肌共同收縮作為代償機制，以穩定關節、減少姿勢搖擺，但會降低淨關節力矩
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.aging-musculoskeletal.i07
    q: 舉重能力下降率
    a:
    - 競技舉重能力每年下降約 1%–1.5% 直至 70 歲，之後下降更明顯。不運動者衰退更快
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.aging-musculoskeletal.i08
    q: 老化變化彙整（Table 7.1）
    a:
    - 老化使：肌力、爆發力、肌耐力、肌肉量、骨密度、代謝率均↓，體脂↑。阻力訓練可逆轉上述所有變化
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
- id: children-growth
  title: 兒童生長發育 Children's Growth & Development
  desc: ''
  tag: Children
  items:
  - id: ch07.children-growth.i01
    q: 時序年齡 vs 生理年齡
    a:
    - 同齡兒童身高差可達 23cm、體重差達 18kg。生理年齡更能反映發展程度，不應只用時序年齡分組
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.children-growth.i02
    q: 骨骼年齡（Gold Standard）
    a:
    - X 光比對左腕骨化程度，最精確但耗時耗費，一般執行者難以使用
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.children-growth.i03
    q: Tanner 分期（限臨床）
    a:
    - 分 5 期評估第二性徵。具侵入性，不應由肌力教練使用，僅限合格臨床人員
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.children-growth.i04
    q: PHV（峰值身高速度）
    a:
    - 青春期最大生長速率的年齡。女：約 12 歲
    - 男：約 14 歲。PHV 期間受傷風險升高
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.children-growth.i05
    q: 訓練年齡（Training Age）
    a:
    - 正式參與有監督訓練的時間長度。影響訓練適應幅度，與時序年齡不同
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.children-growth.i06
    q: 肌肉與骨骼生長
    a:
    - 出生時肌肉佔體重約 25%，成人升至 40%。增加來自肌纖維肥大，非增生（hyperplasia）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.children-growth.i07
    q: 骨骺板（生長板）
    a:
    - 位於骨骺板、關節面、肌腱附著點。完全骨化後長骨停止生長
    - 女性比男性早 2–3 年完成
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.children-growth.i08
    q: 生長軟骨受傷風險
    a:
    - PHV 期間骨骺板骨折發生率最高。成人造成韌帶撕裂的力道可在兒童造成骨骺板骨折
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
- id: children-risk-benefits
  title: 兒童訓練風險與益處 Children's Training Risk & Benefits
  desc: ''
  tag: Children
  items:
  - id: ch07.children-risk-benefits.i01
    q: 骨骺板骨折風險
    a:
    - 病例報告多發生在無監督情境下的重量過頭舉。有遵循訓練指引的前瞻研究中無此案例
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch07.children-risk-benefits.i02
    q: 傷害多為意外非固有風險
    a:
    - 兒童在重訓室受傷多屬意外，且通常發生在監督不足、技術不當或負荷不適合的情況
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch07.children-risk-benefits.i03
    q: 過度使用傷害預防
    a:
    - 每年美國超過 50% 的兒童過度使用傷害可透過教練教育、預備訓練、延後專項化來預防
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch07.children-risk-benefits.i04
    q: 1RM 測試安全性
    a:
    - 在適當暖身、負荷逐漸增加、嚴密監督下，1RM 測試在兒童和青少年中已被證明是安全的
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch07.children-risk-benefits.i05
    q: 早期運動專項化風險
    a:
    - 早期單一運動專項化增加肌肉失衡、過度使用傷害、過度訓練及倦怠風險。晚期專項化反而更有利長期運動表現
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch07.children-risk-benefits.i06
    q: 骨密度效益
    a:
    - 規律訓練可提升兒童及青少年骨礦密度。青少年舉重選手骨密度顯著高於同齡對照組
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch07.children-risk-benefits.i07
    q: 肥胖兒童的特殊效益
    a:
    - 阻力訓練對肥胖兒童可改善體脂、胰島素敏感性及心臟功能。因不需高有氧負荷，參與度較高
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
  - id: ch07.children-risk-benefits.i08
    q: 運動表現提升
    a:
    - 8–20 週訓練後，立定跳遠、垂直跳、30m 衝刺及敏捷跑均有改善。運動表現提升具合理依據
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - safety
    related: []
    locator: ''
- id: children-training-response
  title: 兒童肌力訓練反應 Children's Strength Training Response
  desc: ''
  tag: Children
  items:
  - id: ch07.children-training-response.i01
    q: 神經適應為主要機制
    a:
    - 青春期前主要透過運動單位活化與同步、招募頻率提升來增加肌力，而非肌肥大
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.children-training-response.i02
    q: 荷爾蒙限制肌肥大
    a:
    - 青春期前睪固酮僅 20–60 ng/100ml
    - 青春期男性升至 600 ng/100ml。荷爾蒙不足限制肌肥大
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.children-training-response.i03
    q: 肌力增幅範圍
    a:
    - 短期（8–20 週）訓練後未訓練青春期前兒童通常可增加約 30%–40% 肌力，文獻報告範圍 10%–90%
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.children-training-response.i04
    q: 青少年 vs 兒童
    a:
    - meta 分析顯示青少年肌力增幅比兒童高約 50%，因青春期後荷爾蒙更充足、肌肥大可貢獻更多
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.children-training-response.i05
    q: 去訓練效應（Detraining）
    a:
    - 訓練誘導的肌力增益不持久，停練後趨向回到未訓練對照組水準。體育課與運動無法維持訓練增益
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.children-training-response.i06
    q: 訓練頻率影響
    a:
    - 每週 2 次訓練者肌力增益約為每週 1 次的 1.5 倍。但需考量學業、競賽等多重承諾
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.children-training-response.i07
    q: 神經系統發展
    a:
    - 髓鞘化未完成前無法執行高技術動作。性成熟前兒童不應被期望達到成人表現水準
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.children-training-response.i08
    q: 早熟 vs 晚熟影響
    a:
    - 早熟兒童在絕對肌力佔優勢（肌肉量更多）。晚熟者通常偏 ectomorphic 體型，追趕需時間
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
- id: female-acl
  title: 女性 ACL 傷害 Female ACL Injury
  desc: ''
  tag: Female
  items:
  - id: ch07.female-acl.i01
    q: 發生率：6 倍風險
    a:
    - 女性運動員 ACL 撕裂發生率為男性的 6 倍，在足球、籃球尤為顯著。每年預估超過 15,000 名大學女運動員受傷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
  - id: ch07.female-acl.i02
    q: 最主要因素：神經肌肉缺陷
    a:
    - 雖解剖與荷爾蒙因素有影響，但最重要的可改變因素是神經肌肉缺陷，導致動態膝外翻（dynamic knee valgus）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
  - id: ch07.female-acl.i03
    q: 非接觸性受傷機制
    a:
    - 大多數女性 ACL 傷害發生於非接觸情境：減速、側向旋轉或落地動作。可透過訓練改善
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
  - id: ch07.female-acl.i04
    q: 其他可能因素
    a:
    - 關節鬆弛度、肢體排列、髁間窩尺寸、韌帶大小、荷爾蒙變化、鞋面交互作用、技術水準
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
  - id: ch07.female-acl.i05
    q: 青春期前介入最佳
    a:
    - 證據顯示青春期前開始預備性訓練，可優化訓練適應效果，早期介入對預防計畫效果更佳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
  - id: ch07.female-acl.i06
    q: 預防：多模式訓練
    a:
    - 阻力訓練 + 增強式訓練 + 敏捷與平衡訓練 + 柔軟度訓練。全年度計畫，由合格專業人員設計
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
  - id: ch07.female-acl.i07
    q: 動作力學教育
    a:
    - 確保女性學會並能反覆示範正確動作力學（跳躍、落地、扭轉、切入），並於訓練中給予增強回饋
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
  - id: ch07.female-acl.i08
    q: 營養支持
    a:
    - 女性運動員需攝取足夠能量，並強調優質蛋白質與健康脂肪，以優化訓練適應並降低三聯症風險
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - injury
    related: []
    locator: ''
- id: female-physiology
  title: 女性生理差異 Female Physiological Differences
  desc: ''
  tag: Female
  items:
  - id: ch07.female-physiology.i01
    q: 絕對肌力差異
    a:
    - 女性絕對肌力約為男性的 2/3。下肢絕對肌力比上肢更接近男性數值，因體脂分布差異
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.female-physiology.i02
    q: 相對肌力：體重標準化
    a:
    - 以體重標準化時，下肢肌力男女相近
    - 上肢仍有差距。以去脂體重標準化後差距幾乎消失
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.female-physiology.i03
    q: 肌肉橫截面積品質相同
    a:
    - 以肌肉橫截面積標準化後，肌力無顯著性別差異，代表肌肉品質（單位面積力量）並無性別差異
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.female-physiology.i04
    q: 體組成差異
    a:
    - 成年女性體脂較高、肌肉量與骨密度較低。腰上肌肉量分布較男性少（肩膀較窄）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.female-physiology.i05
    q: 爆發力輸出差異
    a:
    - 抓舉/上搏動作中，女性相對體重的爆發力輸出約為男性 63%。以去脂體重標準化後差距縮小
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.female-physiology.i06
    q: 女運動員三聯症（Triad）
    a:
    - 能量可用性↓ + 月經功能異常 + 骨密度↓。三者相互關聯，高訓練量＋攝食不足易誘發
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.female-physiology.i07
    q: 停經（Amenorrhea）
    a:
    - 定義：月經中斷超過 3 個月。由腦垂體 LH 分泌頻率降低引起。可導致骨應力骨折與內分泌問題
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
  - id: ch07.female-physiology.i08
    q: 女性訓練反應
    a:
    - 女性肌力增幅比例（%）≥ 男性，或至少相同。短期（≤16 週）肌肥大增幅與男性相似（CT 測量）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - structure
    related: []
    locator: ''
- id: older-adults-training
  title: 老年人訓練反應 Older Adults Training Response
  desc: ''
  tag: Aging
  items:
  - id: ch07.older-adults-training.i01
    q: 顯著肌力增加（含高齡）
    a:
    - 87–96 歲受試者僅 8 週訓練後肌力即顯著提升。先前久坐老人 12 週後膝伸肌力增倍，膝屈肌力增為 3 倍
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.older-adults-training.i02
    q: 高速度訓練優勢
    a:
    - 高速度爆發力訓練對爆發力的改善優於傳統低速訓練，且在肌力增幅上相似。劑量反應關係存在
    detail: ''
    terms: []
    numbers: []
    concepts:
    - population
    - adaptation
    related: []
    locator: ''
  - id: ch07.older-adults-training.i03
    q: 骨密度效益
    a:
    - 規律阻力訓練可維持或增加骨密度，降低骨質疏鬆骨折風險。惟停練後骨密度會回到訓練前水準
    detail: ''
    terms: []
