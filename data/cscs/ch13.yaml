- id: test-administration
  title: 測試條件標準化 Test Administration
  desc: ''
  tag: Test Administration
  items:
  - id: ch13.test-administration.i01
    q: 測試環境與器材的一致性
    a:
    - 為提高信度，同批運動員及同一運動員重測時，條件應盡可能相同
    - 地面測驗每次應用相同表面，且不可一次乾、一次濕
    - 最大肌力測驗的架子與同一運動員的支撐高度要一致；跳躍測驗器材也要一致
    detail: 教材要求的是測試間的一致性，並未列出固定溫度或濕度數字；不能自行補上未載的環境門檻。
    terms: [reliability, test-retest-reliability]
    numbers: []
    concepts: [measurement]
    related:
    - ch12.reliability.i02
    - ch12.administration.i02
    locator: Measuring Parameters of Athletic Performance > Testing Conditions
  - id: ch13.test-administration.i02
    q: 測試時間的標準化
    a:
    - 最好在大致相同的每日時段進行測試與重測
    - 人體測量後續比較也應在同一時間量體重，穿著相似衣物
    - 早晨起床、排泄後、攝取食物或飲料前的體重測量最可靠
    detail: 時間標準化是降低可變條件的措施；教材沒有把它歸因為特定的日夜節律機制。
    terms: [anthropometry, reliability]
    numbers: []
    concepts: [measurement]
    related:
    - ch12.reliability.i04
    locator: Measuring Parameters of Athletic Performance > Testing Conditions
  - id: ch13.test-administration.i03
    q: 受測前的疲勞、補水與營養控制
    a:
    - 不可在疲勞性運動活動或訓練後測試
    - 開始測試前，運動員應以正常補水狀態與標準營養到場
    - 不要在測驗前服用補充品；教材舉例肌酸一水合物可能提高某些測驗表現
    detail: 這些控制的目的在前後測可比較性；「不服用補充品」是測試前標準化，而非教材對補充品的一般禁令。
    terms: [creatine-monohydrate, hydration, reliability]
    numbers: []
    concepts: [measurement, nutrition]
    related:
    - ch12.safety.i06
    - ch09.hydration.i04
    locator: Measuring Parameters of Athletic Performance > Testing Conditions
  - id: ch13.test-administration.i04
    q: 測試暖身與熟悉化的要求
    a:
    - 暖身應標準化，包含慢跑或輕體操等一般動態暖身
    - 另做與測試動作相似的專項暖身，例如次最大強度練習
    - 柔軟性測驗可進行伸展；運動員熟悉和練習將施行的測驗是關鍵
    detail: 教材把熟悉化與練習直接列為關鍵面向；未先練習的結果可能混入不熟悉協定的影響。
    terms: [reliability, validity]
    numbers: []
    concepts: [measurement, technique]
    related:
    - ch12.administration.i04
    - ch14.ramp-protocol.i02
    - ch08.motor-skill-acquisition.i01
    locator: Measuring Parameters of Athletic Performance > Testing Conditions
  - id: ch13.test-administration.i05
    q: 運動專項測驗組合（test battery）的選擇
    a:
    - 選測最貼近該運動或位置身體特徵的參數
    - 選用有效且可靠的測驗，以適當順序並安排充足休息，促進測試信度
    - 例：摔角可包含拉力、推力與局部肌耐力；兩個最大反覆次數測驗至少相隔 5 分鐘
    detail: 本章建議在採用標準程序時儲存結果並建立自己的常模；不是要求所有運動都套用同一組測驗。
    terms: [test-battery, validity, reliability, local-muscular-endurance]
    numbers:
    - v: '5'
      unit: 分鐘
      of: 教材摔角測驗組合中兩項最大反覆次數測驗間至少休息時間
    concepts: [measurement, program-design]
    related:
    - ch12.test-sequence.i01
    - ch17.needs-analysis.i05
    locator: Statistical Evaluation of Test Data > Developing an Athletic Profile
  - id: ch13.test-administration.i06
    q: 圍度與身體組成測量的可比性
    a:
    - 圍度宜在訓練期開始時量，供後續比較；最可靠的量尺有彈簧拉力裝置以固定張力
    - 皮褶在運動前、皮膚乾燥時量，以提高效度與信度
    - 皮褶方程式與測點數應按受測族群選擇
    detail: 身體組成的不同方程式適用不同族群；即使程序一致，也應報告估計標準誤造成的範圍。
    terms: [girth-measurement, skinfold-measurement, validity, reliability]
    numbers: []
    concepts: [measurement]
    related:
    - ch12.reliability.i05
    locator: Measuring Parameters of Athletic Performance > Anthropometry
  - id: ch13.test-administration.i07
    q: 重複表現測驗如何解讀？
    a:
    - 可分析個人或群體在訓練週、月或年間的改變
    - 也可與過去受測的相似個人或群體、團體內成績，以及地方到國際常模比較
    - 差異分數是兩個測驗時間點成績的差；百分比改變也是可用量數
    detail: 只以進步幅度評估訓練有兩個限制：訓練程度較高者通常進步較少，且前測可故意不盡力；前後測都應鼓勵最大努力。
    terms: [difference-score, percent-change, pretest, posttest]
    numbers: []
    concepts: [measurement, normal-values]
    related:
    - ch12.why-test.i04
    - ch21.fitness-fatigue.i01
    locator: Statistical Evaluation of Test Data
  - id: ch13.test-administration.i08
    q: 測試結果最後應如何使用？
    a:
    - 盡量讓更多運動員完成測驗組合
    - 決定各測驗的最小實質改變，適當時與常模資料比較
    - 做重複測驗，例如訓練計畫前後測，並以圖形呈現結果
    - 將結果用來找出強弱項，作為訓練計畫設計依據
    detail: 教材以「有意義地使用結果」作為評估流程終點；蒐集分數而未影響訓練決策，不構成完整的運動員剖析。
    terms: [athletic-profile, smallest-worthwhile-change, pretest, posttest]
    numbers: []
    concepts: [measurement, program-design]
