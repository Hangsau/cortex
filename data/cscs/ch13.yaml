    locator: Statistical Evaluation of Test Data > Developing an Athletic Profile
cards:
- q: 1RM 最大肌力測驗為何是常用選擇？
  a: 1RM 是維持正確形式時可舉起一次的最大重量；它反映低速肌力、不需昂貴設備，且與運動所需的動態能力相關。
  tag: max-strength
- q: 一般 1RM 測試第一個正式嘗試與休息如何安排？
  a: 第一個正式嘗試通常約為估計 1RM 的 50%；每次後依難度休息至恢復，通常 1–5 分鐘，再調整負荷。
  tag: max-strength
- q: 1RM 臥姿划船的有效反覆必須符合什麼？
  a: 槓鈴須碰觸長椅底部，再受控下降至手肘全伸的懸垂位置且不碰地；頭接觸長椅、腳全程離地。
  tag: max-strength
- q: 高速肌力測驗有哪些例子？
  a: 教材列出爆發動作 1RM、垂直跳高度與 Margaria-Kalamen 階梯衝刺時間；這些測驗短暫且以最大速度完成。
  tag: power-tests
- q: 垂直跳用牆與粉筆如何計分？
  a: 先標站立可及高度，再不做預備或碎步而反向動作跳起標第二點；兩點的垂直距離為成績，三次取最佳。
  tag: power-tests
- q: 靜態垂直跳與一般垂直跳最主要差異？
  a: 靜態垂直跳去除反向動作；運動員在約 110° 膝角的下蹲姿勢維持 2–3 秒後才起跳。
  tag: power-tests
- q: 反應力量指數（RSI）怎麼算？
  a: RSI = 跳躍高度 ÷ 接觸時間；協定中由跳箱踏下，落地後以盡量短的接觸時間跳高。
  tag: power-tests
- q: Margaria-Kalamen 測驗的功率公式？
  a: P（W）= 體重 w（N）× 第三階至第九階高度 h（m）÷ 該段時間 t（s）。
  tag: power-tests
- q: 體重增加而跳高不變時，功率如何判讀？
  a: 功率仍增加；相同跳高表示相同起跳速度，但推動更重身體需要更高功率。
  tag: power-tests
- q: 1RM 爆發上搏為何有判讀限制？
  a: 動作技術需求很高，肌力功率能力相同的運動員仍可能測得很不同的 1RM，降低預測運動表現的價值。
  tag: power-tests
- q: 無氧容量如何定義？
  a: 是磷酸原與無氧糖解系統合併產能的最高速率，通常量化為持續 30–90 秒活動的最高功率輸出。
  tag: anaerobic-endurance
- q: 300 碼折返跑如何施測與計分？
  a: 在相距 25 碼的兩線間做六個來回，總距離 300 碼；兩次試驗相隔 5 分鐘，記錄兩次平均時間。
  tag: anaerobic-endurance
- q: 局部肌耐力的定義？
  a: 特定肌肉或肌群在次最大阻力下反覆收縮的能力；測驗須連續進行，不能利用休息或額外動作代償。
  tag: anaerobic-endurance
- q: 部分捲腹的節奏與最大次數？
  a: 節拍器 40 拍／分，完成每分鐘 20 次受控捲腹；不停頓最多做到 75 次。
  tag: anaerobic-endurance
- q: Army 與 ACSM 伏地挺身協定的終止方式差別？
  a: Army 在 2 分鐘內盡量完成，僅能在上撐姿勢暫停；ACSM 連續做到失敗。
  tag: anaerobic-endurance
- q: YMCA 臥推測驗的固定負荷與節奏？
  a: 男性 80 磅（36 kg）、女性 35 磅（16 kg）；節拍器 60 拍／分，形成每分鐘 30 次上下動作。
  tag: anaerobic-endurance
- q: 有氧容量（aerobic capacity）如何表示？
  a: 是以氧化碳水化合物、脂肪與蛋白質產能的最高速率，通常以每公斤體重每分鐘耗氧量表示。
  tag: aerobic-capacity
- q: 1.5 英里跑的成績怎麼記錄？
  a: 在平坦、標記路線上盡快以穩定配速跑完全程，於終點以分鐘與秒記錄時間；也可用 1.86 英里（3 km）替代路線。
  tag: aerobic-capacity
- q: 12 分鐘跑的分數代表什麼？
  a: 代表固定 12 分鐘內完成的總距離；時間到原地停止，再以圈數乘每圈距離計算。
  tag: aerobic-capacity
- q: Yo-Yo IRT1 與 IRT2 有何差別？
  a: 都是漸增速的 2 × 20 m 折返跑加 10 秒恢復；IRT1 從 10 km/h 起，IRT2 從 13 km/h 起，教材建議使用 IRT1。
  tag: aerobic-capacity
- q: MAS 測驗怎麼決定最大有氧速度？
  a: 每 2 分鐘加速 1 km/h，最後能至少維持 2 分鐘的速度即 MAS；教材以 V̇O2max = 3.5 × MAS 估算。
  tag: aerobic-capacity
- q: Yo-Yo 測驗的停止規則？
  a: 受測者兩次無法在提示音前抵達起跑線或轉折線即終止，記錄最後等級與該等級完成的折返次數。
  tag: aerobic-capacity
- q: 敏捷的新定義是什麼？
  a: 回應運動專項刺激時，快速改變全身方向或速度的能力；包含變向速度與認知因素。
  tag: agility-speed
- q: T 測驗中哪些行為會取消試驗資格？
  a: 未觸錐筒底部、橫移時交叉腳，或未全程面向前方都會取消該次試驗。
  tag: agility-speed
- q: 六角形測驗的跳躍安排？
  a: 雙腳越過每一邊再回中心，順時針完成三圈，共 18 跳；踩線、失衡或改變面向須停止並在恢復後重做。
  tag: agility-speed
- q: Pro 敏捷測驗為何也稱 20 碼折返？
  a: 它依序跑左方 5 碼、右方 10 碼、回中線 5 碼，三段相加為 20 碼，且每條指定線都要手觸。
  tag: agility-speed
- q: 505 敏捷測驗的計時區間？
  a: 從第一次通過 10 m 處計時燈開始，跑至 5 m 外轉折線再轉身，第二次通過計時燈後結束。
  tag: agility-speed
- q: 短距離與較長衝刺各反映什麼？
  a: 靜止起跑的短距離如 10 碼反映加速度；較長距離如 40 碼反映最高速度。
  tag: agility-speed
- q: 手持碼錶相對電子計時可有多大誤差？
  a: 即使理想條件下，碼錶衝刺時間最多可快 0.24 秒，源於起跑反應延遲與終點前預期性提早按錶。
  tag: agility-speed
- q: 速度與敏捷測驗的基本場地安全要求？
  a: 穿適當鞋類、使用不滑表面；直線衝刺終點後至少留 20 碼（18 m）減速距離。
  tag: agility-speed
- q: 平衡與穩定性怎麼區分？
  a: 平衡是維持靜態與動態平衡、或重心在支撐基底上的能力；穩定性是受擾動後回到期望位置的能力。
  tag: balance-flexibility-bc
- q: BESS 的六種測驗條件如何構成？
  a: 雙腳、單腳與串聯三種站姿，各在硬面和軟面進行；每種閉眼、雙手放髖維持 20 秒。
  tag: balance-flexibility-bc
- q: SEBT 的成績如何取得？
  a: 單腳站在八向格網中央，以另一腳沿各線觸及最遠點；每條件三次取平均，量中心至觸點距離。
  tag: balance-flexibility-bc
- q: 坐姿前彎重測時最重要的標準化？
  a: 初測若用量尺或尺棒，後續必須繼續用同一方法，不能改成坐姿前彎箱；三次取最佳。
  tag: balance-flexibility-bc
- q: 過頭深蹲在本章如何評分？
  a: 至少做五次，由側面做通過／不通過的質性評估；過程中腳跟不離地、髖折痕低於膝頂。
  tag: balance-flexibility-bc
- q: 皮褶法的 r = 0.99 代表什麼？
  a: 由受過訓練且勝任測試者操作時，皮褶法是一般體能訓練專業人員可用方法中最有效度、最可靠者之一，相關係數 r = 0.99。
  tag: balance-flexibility-bc
- q: 皮褶讀值何時讀取與何時可平均？
  a: 放開卡尺後 1–2 秒讀至最近 0.5 mm；兩次讀值差異不超過 10% 時，才平均。
  tag: balance-flexibility-bc
- q: 人體測量與體重最可靠的時間點？
  a: 體重穿最少乾燥衣物量測；最可靠時點為早晨起床、排泄後、攝取食物或飲料前。
  tag: balance-flexibility-bc
- q: 平均數、中位數、眾數的差異？
  a: 平均數是總和除以筆數；中位數是排序後中間值；眾數為最常出現值，教材一般認為最不實用。
  tag: statistics
- q: 全距與標準差的差異？
  a: 全距是最低到最高的區間，只用兩端分數；標準差則量整組分數圍繞平均數的變異性。
  tag: statistics
- q: 本章 z 分數如何解讀？
  a: 以 SD 單位表示個人分數離平均數的距離；40 碼衝刺例中 z = −1.2 表示比群體平均快 1.2 個 SD。
  tag: statistics
- q: 百分位名次第 75 百分位表示什麼？
  a: 將成績由低至高排列後，表示有 75% 的受測者分數低於該運動員。
  tag: statistics
- q: 推論統計的基本前提？
  a: 用樣本資訊推論母體時，樣本必須真正代表母體。
  tag: statistics
- q: 最小實質改變通常怎麼算？
  a: 通常為受試者間標準差的 0.2；例如垂直跳 SD 為 10 cm 時，最小實質改變為 2 cm。
  tag: statistics
- q: 效果量怎麼計算訓練成效？
  a: 以平均分數的改變量除以前測標準差；可用於團體訓練後表現或比較群體。
  tag: statistics
- q: 運動員剖析的目的？
  a: 整合與運動或位置相關的測驗結果，辨識強弱項，並據此設計訓練計畫。
  tag: statistics
- q: 為提高重測信度，哪些測試條件要一致？
  a: 地面表面及乾濕、肌力架與支撐高度、跳躍器材等應保持一致。
  tag: test-administration
- q: 受測者測試前不應處於何種狀態？
  a: 不應剛完成疲勞性運動或訓練；應正常補水和採標準營養，且避免在測驗前服用補充品。
  tag: test-administration
- q: 測試暖身應包含什麼？
  a: 一般動態暖身，如慢跑或輕體操，加上與測試動作相似的次最大強度專項暖身。
  tag: test-administration
- q: 測驗組合如何安排休息？
  a: 應依運動專項需求選有效、可靠測驗，按適當順序安排充足休息；教材例中兩項最大反覆次數測驗至少相隔 5 分鐘。
  tag: test-administration
- q: 重複測驗可做哪些比較？
  a: 可比較訓練期間的個人或群體改變、過去相似群體、隊內成績與各層級常模；差異分數和百分比改變皆可用。
  tag: test-administration
- q: 完整測試流程的最後一步？
  a: 將結果有意義地用於辨識運動員強弱項，並作為訓練計畫設計依據。
  tag: test-administration
