id: ch13
weight: 13
title: Ch.13 測試管理、計分與解讀
topics:
- id: aerobic-capacity
  title: 有氧容量測試 Aerobic Capacity
  desc: ''
  tag: Aerobic Capacity
  items:
  - id: ch13.aerobic-capacity.i01
    q: 有氧容量定義
    a:
    - VO₂max：最大攝氧量，ml·kg⁻¹·min⁻¹
    - 氧化碳水化合物、脂肪、蛋白質產生能量的最大速率
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.aerobic-capacity.i02
    q: 1.5英里跑（13.14）
    a:
    - 2.4公里
    - 記錄時間後換算VO₂max
    - 需平坦跑道
    - 有年齡性別常模表
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.aerobic-capacity.i03
    q: 12分鐘跑（13.15）
    a:
    - Cooper Test
    - 記錄12分鐘內跑距離
    - 估算VO₂max
    - 簡單易施測，適合團隊
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.aerobic-capacity.i04
    q: Yo-Yo 測試（13.16）
    a:
    - 間歇性恢復測試
    - 20公尺來回+10秒休息
    - 速度逐漸增加至力竭
    - 適合間歇性運動項目
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.aerobic-capacity.i05
    q: MAS測試（13.17）
    a:
    - 最大有氧速度（Maximal Aerobic Speed）
    - 確定訓練區間
    - 遞增速度直到力竭
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.aerobic-capacity.i06
    q: VO₂max 估算
    a:
    - 多數力量訓練師無直接量測設備
    - 用跑步表現間接估算
    - 跑距或跑時代入公式
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.aerobic-capacity.i07
    q: Yo-Yo vs 12分鐘跑
    a:
    - Yo-Yo：反映間歇恢復能力，更近似球類運動
    - 12分鐘跑：持續穩定配速，更適合耐力項目
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.aerobic-capacity.i08
    q: CSCS 考點
    a:
    - VO₂max單位ml·kg⁻¹·min⁻¹
    - Cooper=12分鐘跑
    - Yo-Yo適合間歇型運動
    - MAS用於訓練區間設定
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: agility-speed
  title: 敏捷與速度 Agility & Speed
  desc: ''
  tag: Agility / Speed
  items:
  - id: ch13.agility-speed.i01
    q: 敏捷定義
    a:
    - 對運動特定刺激的快速全身方向或速度改變
    - 含身體成分（變向速度）與認知成分（預判）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.agility-speed.i02
    q: T測試（13.18）
    a:
    - 前衝9.14m→左橫移4.57m→右橫移9.14m→後退
    - 男<9.5秒優秀
    - 有描述性常模
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.agility-speed.i03
    q: 六角形測試（13.19）
    a:
    - 六角形路線連續跳躍
    - 雙腳同時起落
    - 記錄完成3圈時間
    - 評估多方向移動能力
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.agility-speed.i04
    q: Pro敏捷（13.20）
    a:
    - 又稱5-10-5
    - 從中心出發5碼→折返10碼→再折返5碼
    - 記錄總時間
    - NFL常用
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.agility-speed.i05
    q: 505敏捷（13.21）
    a:
    - 15m直線衝刺+在5m處急速180°轉向返回
    - 評估單方向變向能力
    - 有描述性常模
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.agility-speed.i06
    q: 直線衝刺（13.22）
    a:
    - 10m→加速
    - 40m/40碼→最大速度
    - 建議電子計時
    - 手動計時偏快最多0.24秒
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.agility-speed.i07
    q: 計時誤差
    a:
    - 手動碼錶因反應時間延遲，比電子計時快最多0.24秒
    - 應優先使用電子計時裝置
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.agility-speed.i08
    q: CSCS 考點
    a:
    - Pro敏捷=5-10-5
    - 手動計時誤差最多0.24秒快於電子
    - T測試包含前後左右4方向移動
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: anaerobic-endurance
  title: 無氧容量與肌耐力 Anaerobic & Muscular Endurance
  desc: ''
  tag: Anaerobic / Endurance
  items:
  - id: ch13.anaerobic-endurance.i01
    q: 無氧容量定義
    a:
    - 磷酸原系統+無氧糖解的最大能量產生速率
    - 持續時間30-90秒
    - 介於爆發力與有氧測試之間
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.anaerobic-endurance.i02
    q: 300碼折返（13.10）
    a:
    - 25碼來回×6次（共300碼）
    - 記錄完成時間
    - 休息5分鐘後重複一次，取平均或最佳值
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.anaerobic-endurance.i03
    q: 局部肌耐力定義
    a:
    - 特定肌群對次最大阻力的重複收縮能力
    - 持續數秒至數分鐘
    - 無休息、無代償動作
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.anaerobic-endurance.i04
    q: 捲腹（13.11）
    a:
    - 部分捲腹（Partial Curl-Up）
    - 固定節奏（25次/分鐘）
    - 記錄最大次數
    - 評估核心耐力
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.anaerobic-endurance.i05
    q: 伏地挺身（13.12）
    a:
    - 完整動作範圍
    - 腹部不落地
    - 固定節奏計次
    - 評估上肢推力耐力
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.anaerobic-endurance.i06
    q: YMCA臥推（13.13）
    a:
    - 固定重量（男36kg/女16kg）
    - 固定節奏（60bpm節拍器）
    - 記錄最大次數
    - 有常模表
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.anaerobic-endurance.i07
    q: 肌耐力 vs 無氧容量
    a:
    - 肌耐力：次最大負荷多次重複
    - 無氧容量：全力衝刺30-90秒
    - 能量系統不同，勿混淆
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.anaerobic-endurance.i08
    q: CSCS 考點
    a:
    - 300碼折返→無氧容量
    - YMCA臥推固定重量（男36kg）
    - 肌耐力測試無休息、無代償
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: balance-flexibility-bc
  title: 平衡・柔軟性・身體組成 Balance / Flexibility / Body Composition
  desc: ''
  tag: Balance / Flexibility / BC
  items:
  - id: ch13.balance-flexibility-bc.i01
    q: BESS（13.23）
    a:
    - 平衡錯誤計分系統
    - 6個站姿(雙腳/單腳/串聯步) × 2種面(地面/泡棉)
    - 錯誤次數越少越好
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.balance-flexibility-bc.i02
    q: SEBT（13.24）
    a:
    - 星形伸展平衡測試
    - 單腳站立，另腳向8方向伸展
    - 以腿長%標準化
    - 評估動態平衡
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.balance-flexibility-bc.i03
    q: 坐姿前彎（13.25）
    a:
    - 評估下背+髖部柔軟性
    - 腳頂箱子邊緣
    - 膝蓋伸直
    - 緩慢推移不反彈
    - 有年齡常模
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.balance-flexibility-bc.i04
    q: 過頭深蹲（13.26）
    a:
    - 評估髖/膝/踝雙側活動度+肩/胸椎活動度
    - 常見動作篩查
    - 注意足跟離地、軀幹前傾
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.balance-flexibility-bc.i05
    q: 皮褶測量（13.27）
    a:
    - 最有效率的體脂估算法（r=0.99）
    - 2室模型（脂肪+瘦體重）
    - 優於圍度法
    - DEXA為黃金標準
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.balance-flexibility-bc.i06
    q: 圍度測量（13.28）
    a:
    - 腰圍→腹部脂肪風險（糖尿病/高血壓/心臟病）
    - 需捲尺+助手
    - 測量點需標準化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.balance-flexibility-bc.i07
    q: 柔軟性測量工具
    a:
    - 測角儀（Goniometer）：量關節角度
    - 坐姿前彎箱：量下背+髖部
    - 需標準化熱身+靜態拉伸
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.balance-flexibility-bc.i08
    q: CSCS 考點
    a:
    - 皮褶r=0.99
    - BESS錯誤次數越少越好
    - 腰圍高→代謝疾病風險
    - 坐姿前彎禁止彈振伸展
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: max-strength
  title: 最大肌力測試 Low-Speed Strength
  desc: ''
  tag: Low-Speed Strength
  items:
  - id: ch13.max-strength.i01
    q: 1RM 定義
    a:
    - 最大重量只完成一次完整動作
    - 反映低速肌力，主要能量來源為 PCr + ATP（2-4 秒）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.max-strength.i02
    q: 臥推（13.1）
    a:
    - 仰臥·雙腳平踩·握距略寬於肩
    - 需1名保護員
    - 熱身後3-5次嘗試找到1RM
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.max-strength.i03
    q: 划船（13.2）
    a:
    - 臥姿划船（Bench Pull）
    - 測量上背拉力
    - 注意胸部固定於板上
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.max-strength.i04
    q: 後蹲舉（13.3）
    a:
    - 背槓位置一致
    - 深度至大腿平行地面
    - 高技術需求，須充分熟悉
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.max-strength.i05
    q: 1RM 熱身流程
    a:
    - ①輕至中等負荷5-10次 → ②2組次最大2-5次 → ③約50%估計1RM → ④逐步加重，3-5次找到
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.max-strength.i06
    q: 休息時間
    a:
    - 每次嘗試間休息1-5分鐘，依難度調整
    - 確保充分恢復再加重
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.max-strength.i07
    q: 測試類型比較
    a:
    - 動態（1RM）最常用
    - 等長（力量計）
    - 等速（特定速度下最大力）
    - 1RM最實際且不需昂貴儀器
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.max-strength.i08
    q: CSCS 考點
    a:
    - 1RM是低速肌力的首選測試
    - 3-5次嘗試為建議次數
    - 保護員為必要人員
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: power-tests
  title: 爆發力測試 High-Speed Power
  desc: ''
  tag: High-Speed Power
  items:
  - id: ch13.power-tests.i01
    q: 爆發上搏（13.4）
    a:
    - 1RM爆發上搏
    - 高技術需求，需充分熟悉
    - 能量來源PCr+ATP（<1秒）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.power-tests.i02
    q: 立定跳（13.5）
    a:
    - 水平跳遠距離
    - 雙腳起跳落地
    - 測下肢水平爆發力
    - 以cm或inch記錄
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.power-tests.i03
    q: 垂直跳（13.6）
    a:
    - 助跑起跳最高點與站立伸手差值
    - 反映腿部垂直爆發力
    - jump mat或Vertec測量
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.power-tests.i04
    q: 靜態垂直跳（13.7）
    a:
    - 無預備動作（無蹲降）
    - 純同心收縮
    - 與一般垂直跳比較可評估拉伸縮短循環（SSC）效率
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.power-tests.i05
    q: RSI（13.8）
    a:
    - Reactive Strength Index = 跳躍高度 / 地面接觸時間
    - 評估SSC反應效率
    - 需力板或接觸墊
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.power-tests.i06
    q: Margaria-Kalamen（13.9）
    a:
    - 跑樓梯測無氧功率
    - 功率 = 體重×樓梯高度÷時間
    - 適合場地限制場合
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.power-tests.i07
    q: 功率計算
    a:
    - P = F × v
    - 體重增加但跳高度不變 → 功率仍增加（需考慮體重）
    - CSCS常考概念
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.power-tests.i08
    q: CSCS 考點
    a:
    - 爆發力測試<1秒
    - 能量來自PCr+ATP
    - 靜態vs動態垂直跳差異評估SSC
    - RSI=高度/接觸時間
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: statistics
  title: 統計與數據解讀 Statistics & Interpretation
  desc: ''
  tag: Statistics & Interpretation
  items:
  - id: ch13.statistics.i01
    q: 集中趨勢
    a:
    - 平均數（最常用）·中位數（極端值影響小）·眾數（最少用）
    - 偏態分布時中位數優於平均數
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.statistics.i02
    q: 變異數
    a:
    - 全距：最高-最低（易受極端值影響）
    - 標準差SD：各分數對平均數離散程度
    - SD小=分數集中
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.statistics.i03
    q: z 分數
    a:
    - z = (x − x̄) / SD
    - 將個別分數轉換為標準差單位
    - 可跨不同測試比較
    - 負值=低於平均
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.statistics.i04
    q: 百分位排名
    a:
    - 該運動員分數高於多少%受測者
    - 第75百分位→75%的人分數低於他
    - 需由低至高排列
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.statistics.i05
    q: 常態分布
    a:
    - 鐘形曲線
    - ±1SD≈68%
    - ±2SD≈95%
    - ±3SD≈99.7%
    - SD最有用於常態分布資料
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.statistics.i06
    q: 描述統計 vs 推論統計
    a:
    - 描述統計：已知全體資料時使用（整隊測試）
    - 推論統計：從樣本推估母體
    - magnitude-based為新興方法
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.statistics.i07
    q: 運動員能力剖析
    a:
    - 將多項測試z分數繪成柱狀圖
    - 零線=隊伍平均
    - 視覺化弱點（如耐力、柔軟性）→ 決定訓練優先序
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch13.statistics.i08
    q: CSCS 考點
    a:
