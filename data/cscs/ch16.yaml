    locator: General Guidelines > General Guidelines for Alternative Modes and Nontraditional Implement Exercises
- id: instability-devices
  title: 不穩定裝置訓練 Instability Devices
  desc: ''
  tag: Instability
  items:
  - id: ch16.instability-devices.i01
    q: 何謂不穩定裝置（instability devices）？教材列舉哪些例子？
    a:
    - 不穩定動作是在肌力體能設施常見的不穩定表面或裝置上完成的動作；裝置藉由姿勢失衡，要求核心肌群有較大的穩定功能。
    - 常見者是瑞士球、物理治療球與佩齊體操球；其他選項有一面充氣圓頂、一面平橡膠的半球體、充氣圓盤、搖擺板、平衡板、泡棉管、各類泡棉平台與沙地。
    detail: 教材也說，若在使用裝置時施加擾動，必須藉核心活化調整姿勢才能維持站立。
    terms:
    - instability-devices
    - muscle-activation
    numbers: []
    concepts:
