    a:
    - Baker 建議：技術穩定的中進階至菁英運動員
    - 新手因技術不穩定，加鍊可能影響動作品質
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.chain-training.i07
    q: 科學支持現況
    a:
    - 流行度雖高（尤其健力界），但大多數效益尚未獲充分科學驗證
    - 部分研究（如 bench press）顯示有效，但整體文獻仍不足
