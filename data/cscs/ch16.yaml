- id: kettlebell-unilateral
  title: 壺鈴與單側訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.kettlebell-unilateral.i01
    q: 教材如何定位壺鈴訓練（kettlebell training）的用途與效果？
    a:
    - 現有證據多指向壺鈴可作為一般體能或健身發展工具；壺鈴盪對心肺適能似有正面影響，但不及跑步機跑步或傳統有氧運動。
    - 在休閒訓練男性的六週介入中，舉重訓練的垂直跳增加 4%，壺鈴訓練增加 0.8%；背蹲舉力量分別增加 13.6% 與 4.5%。
    detail: 教材據此認為壺鈴「可能」最適合作為一般準備運動；傳統舉重對最大肌力與跳躍表現看似更有效，但仍需更多研究。
    terms:
    - kettlebell-training
    numbers:
    - v: '6'
      unit: 週
      of: 休閒訓練男性的壺鈴與舉重訓練介入期
    - v: '4'
      unit: '%'
      of: 舉重訓練後垂直跳表現增加幅度
    - v: '0.8'
      unit: '%'
      of: 壺鈴訓練後跳躍表現增加幅度
    - v: '13.6'
      unit: '%'
      of: 舉重訓練後背蹲舉力量增加幅度
    - v: '4.5'
      unit: '%'
      of: 壺鈴訓練後背蹲舉力量增加幅度
    concepts:
    - adaptation
    related:
    - ch17.exercise-selection.i05
    - ch13.aerobic-capacity.i01
    locator: Nontraditional Implement Training Methods > Kettlebell Training
  - id: ch16.kettlebell-unilateral.i02
    q: 鑄鐵與競技壺鈴有何差異？
    a:
    - 鑄鐵（或健身）壺鈴以鐵鑄成，尺寸隨重量改變；競技壺鈴以鋼製成，無論重量尺寸均相同，並以不同顏色表示重量。
    - 競技壺鈴的高度為 228 mm、直徑為 210 mm、把手直徑為 35 mm。
    detail: 教材另指出鑄鐵壺鈴較便宜，也可能在肌力體能設施中較常見；這是相對普及性而非性能優劣判定。
    terms:
    - cast-iron-kettlebell
    - competition-kettlebell
    numbers:
    - v: '228'
      unit: mm
      of: 競技壺鈴高度
    - v: '210'
      unit: mm
      of: 競技壺鈴直徑
    - v: '35'
      unit: mm
      of: 競技壺鈴把手直徑
    concepts:
    - technique
    related:
    - ch23.needs-analysis.i02
    locator: Nontraditional Implement Training Methods > Kettlebell Training > Types of Kettlebells
  - id: ch16.kettlebell-unilateral.i03
    q: 雙手壺鈴盪（two-arm kettlebell swing）的技術要點是什麼？
    a:
    - 雙腳平放、站距介於髖寬與肩寬之間；髖與膝屈至約四分之一蹲，壺鈴在大腿間垂下，背部保持中立或正常前凸。
    - 先屈髖把壺鈴擺到兩腿間後方，膝適度彎曲、肘伸直；軀幹接近與地面平行、壺鈴越過身體垂直線後，再藉伸髖與伸膝反轉動作。
    - 讓動量把壺鈴舉至眼睛高度，保持肘伸直與中立脊椎；下擺時屈髖、屈膝吸收重量。
    detail: 教材的終點是「眼睛高度」，不是胸高或肩高；它列的是動作技術，未稱此動作為特定程度的入門或進階動作。
    terms:
    - two-arm-kettlebell-swing
    numbers: []
    concepts:
    - technique
    related:
    - ch15.lower-body.i03
    locator: Two-Arm Kettlebell Swing
  - id: ch16.kettlebell-unilateral.i04
    q: 雙側缺陷（bilateral deficit）與雙側促進（bilateral facilitation）在教材中如何用於訓練判斷？
    a:
    - 雙側缺陷是單側與雙側動作的產力不對稱；雙側促進則是雙側動作時主動肌群自主活化增加。
    - 訓練有素或較強者傾向出現雙側促進；未訓練、受傷或較弱的運動員傾向出現雙側缺陷。
    - 教材因此認為，訓練有素者不應以單側方法發展肌力；單側方法則可能有助未訓練、較弱與受傷者的肌力發展。
    detail: 教材沒有給雙側缺陷的百分比標準，也沒有說雙側訓練會使兩側「相互抑制」。
    terms:
    - bilateral-deficit
    - bilateral-facilitation
    numbers: []
    concepts:
    - force-production
    - population
    related:
    - ch05.neural-adaptations.i07
    - ch17.exercise-selection.i06
    locator: Unilateral Training
  - id: ch16.kettlebell-unilateral.i05
    q: 教材列舉單側訓練（unilateral training）的哪些動作與用途？
    a:
    - 下肢常見單側動作包括弓步蹲、登階與單腿深蹲；書中稱單腿深蹲有時也稱為保加利亞分腿蹲。
    - 單側動作可在不同程度上納入課表，以減少雙側不對稱，或作為復健工具。
    detail: 教材未列出「弱側相差 10–15%」的介入門檻，也未主張跑步、投擲與踢球幾乎皆為單側發力。
    terms:
    - unilateral-training
    - bilateral-asymmetries
    - single-leg-squat
    numbers: []
    concepts:
    - program-design
    - injury
    related:
    - ch22.resistance-training-systems.i07
    locator: Unilateral Training
- id: machine-vs-freeweight
  title: 器械 vs 自由重量
  desc: ''
  tag: ''
  items:
  - id: ch16.machine-vs-freeweight.i01
    q: 器械與自由重量在穩定肌活化上有何差異？
    a:
    - 一般認為，自由重量訓練時穩定肌的活化高於器械訓練。
    - Anderson 與 Behm 的結果部分支持此看法：史密斯機深蹲時，背部穩定肌活性比自由重量深蹲低 30%。
    detail: 這個數字來自史密斯機「深蹲」，不是臥推；教材以「部分支持」描述該項證據，未將它推廣為每個肌群、每種器械皆有固定差距。
    terms:
    - machine-based-training
    - free-weight-exercises
    - stabilizer-muscles
    - smith-machine
    numbers:
    - v: '30'
      unit: '%'
      of: 史密斯機深蹲時背部穩定肌活動相對自由重量深蹲的較低幅度
    concepts:
    - motor-control
    related:
    - ch02.musculature.i06
    locator: Core Stability and Balance Training Methods > Machines Versus Free Weight Exercises
  - id: ch16.machine-vs-freeweight.i02
    q: 教材如何描述器械訓練的優勢與運動情境限制？
    a:
    - 器械提供的穩定性可能使訓練者更能針對特定肌群。
    - 但在運動表現情境，肌肉很少（即使有）以如此孤立的方式運作。
    detail: 教材沒有列出「初學者、復健、疲勞末段」等器械適用清單；此處只比較器械穩定性對特定肌群瞄準與運動情境的含義。
    terms:
    - machine-based-training
    numbers: []
    concepts:
    - technique
    related:
    - ch17.exercise-selection.i02
    - ch22.kinetic-chain.i08
    locator: Core Stability and Balance Training Methods > Machines Versus Free Weight Exercises
  - id: ch16.machine-vs-freeweight.i03
    q: 為何教材在肌力與功率發展時偏向地面自由重量動作？
    a:
    - 教材認為，地面自由重量動作（ground-based free weight exercises）提供特異性與不穩定性的理想組合，尤其在發展肌力與功率時。
    - 傳統地面自由重量肌力訓練已足以產生運動專項適應所需的不穩定性，無須再額外增加不穩定。
    detail: 這是依教材所引資料作出的訓練判斷；它不是對所有訓練目標都宣稱自由重量絕對優於器械。
    terms:
    - ground-based-free-weight-exercises
    numbers: []
    concepts:
    - force-production
    - technique
    related:
    - ch17.exercise-selection.i01
    - ch02.resistance-sources.i02
    locator: Core Stability and Balance Training Methods > Machines Versus Free Weight Exercises
  - id: ch16.machine-vs-freeweight.i04
    q: 為何不應把地面自由重量動作再放到不穩定表面？
    a:
    - 若把地面自由重量訓練放在不穩定表面或裝置上，力量產生、力量發展速率與功率輸出的下降會更大。
    - 因此，傳統地面自由重量訓練已能提供足夠不穩定刺激，沒有必要再增加這類不穩定。
    detail: 教材的結論特別針對以肌力與功率為焦點的訓練，不是說不穩定裝置在復健中毫無用途。
    terms:
    - ground-based-free-weight-exercises
    - instability-devices
    - rate-of-force-development
    numbers: []
    concepts:
    - force-production
    - safety
    related:
    - ch19.rfd-impulse.i01
    locator: Core Stability and Balance Training Methods > Machines Versus Free Weight Exercises
- id: resistance-bands
  title: 彈力帶訓練 Resistance Bands
  desc: ''
  tag: Bands
  items:
  - id: ch16.resistance-bands.i01
    q: 彈力帶（resistance bands）的張力如何依虎克定律（Hooke's law）決定？
    a:
    - 張力等於彈力帶剛性（k）乘以形變量（d）。
    - 帶子拉得愈長、形變愈大，張力會線性增加；但研究也指出彈力帶可同時呈現曲線與線性形變區域。
    detail: 教材說明的是帶子材料特性與拉伸量如何影響張力，並未把每個品牌或型號的力—長度關係視為相同。
    terms:
    - resistance-bands
    - hookes-law
    numbers: []
    concepts:
    - force-production
    related:
    - ch02.resistance-sources.i06
    - ch02.strength-factors.i05
    locator: Variable-Resistance Training Methods > Resistance Band Exercises > Determining Resistance With Resistance Bands
  - id: ch16.resistance-bands.i02
    q: 哪些材料特徵與量測資訊會影響彈力帶阻力？
    a:
    - 彈力帶使用的熱塑性材料或彈性體不同，會影響其剛性、密度、降伏特性與抗拉強度。
    - 阻力取決於帶子的整體剛性及拉伸程度；教練須估計完整動作範圍中頂端與底端的帶子負荷，並取兩者平均。
    detail: 轉檔表 16.2 的個別數字存在明顯轉寫錯誤，故不以該表格數字或預測方程式建立本站資料；此項保留教材可用帶長預測張力的原理。
    terms:
    - resistance-bands
    numbers: []
    concepts:
    - measurement
    locator: Variable-Resistance Training Methods > Resistance Band Exercises > Determining Resistance With Resistance Bands
  - id: ch16.resistance-bands.i03
    q: 教材的彈力帶負荷計算範例是什麼？
    a:
    - 若目標是 150 kg 的 5RM，先以動作頂端與底端帶子阻力的平均值，從無帶時的槓鈴負荷扣除。
    - 範例的底端帶子阻力為 0 kg、頂端為 26.6 kg，平均為 13.3 kg；因此槓鈴負荷為 136 至 137 kg。
    detail: 這個平均值用來調整槓鈴與帶子的整體負荷；不代表每個動作位置的總阻力都相同。
    terms:
    - resistance-bands
    numbers:
    - v: '150'
      unit: kg
      of: 範例中無帶時的目標 5RM 負荷
    - v: '5'
      unit: RM
      of: 範例中目標反覆最大負荷
    - v: '0'
      unit: kg
      of: 範例中動作底端的彈力帶阻力
    - v: '26.6'
      unit: kg
      of: 範例中動作頂端的彈力帶阻力
    - v: '13.3'
      unit: kg
      of: 範例中彈力帶頂端與底端阻力的平均值
    - v: 136-137
      unit: kg
      of: 範例中加到槓鈴的調整後負荷
    concepts:
    - technique
    - measurement
    locator: Variable-Resistance Training Methods > Resistance Band Exercises > Determining Resistance With Resistance Bands
  - id: ch16.resistance-bands.i04
    q: 如何把彈力帶施加在自由重量動作？
    a:
    - 可將帶子接到槓鈴，另一端固定在深蹲架的專用固定點，或接到不會移動的重啞鈴。
    - 最高張力與總阻力在動作頂端；底端帶子不再被拉伸，施加負荷較低。
    detail: 安裝的關鍵是全動作範圍的帶子長度與張力；不是僅把帶子套在槓鈴兩端便能決定負荷。
    terms:
    - resistance-bands
    - free-weight-exercises
    numbers: []
    concepts:
    - technique
    - safety
    related:
    - ch15.lower-body.i01
    - ch16.variable-resistance.i02
    locator: Variable-Resistance Training Methods > Resistance Band Exercises > Applying Resistance Bands to Free Weight Exercises
  - id: ch16.resistance-bands.i05
    q: 教材對彈力帶改善功率與力量發展速率的急性證據如何描述？
    a:
    - Wallace 等人指出，以帶子替代背蹲舉總負荷的 35% 時，峰值功率急性增加約 13%。
    - Stevenson 等人發現，以帶子提供訓練負荷的 20% 時，相比恆定負荷條件，向心力量發展速率急性增加；另有作者提出反覆內後活化增強的可能。
    detail: 教材同段緊接著列出反對研究，因此這些是部分研究的急性發現，並非已證實的長期效果。
    terms:
    - resistance-bands
    - rate-of-force-development
    - postactivation-potentiation
    numbers:
    - v: '35'
      unit: '% 總負荷'
      of: Wallace 等人背蹲舉中由彈力帶替代的負荷比例
    - v: '13'
      unit: '%'
      of: Wallace 等人以彈力帶替代部分背蹲舉負荷時的急性峰值功率增加幅度
    - v: '20'
      unit: '% 訓練負荷'
      of: Stevenson 等人由彈力帶提供的訓練負荷比例
    concepts:
    - force-production
    related:
    - ch02.work-power.i02
    - ch19.rfd-impulse.i01
    locator: Variable-Resistance Training Methods > Resistance Band Exercises
  - id: ch16.resistance-bands.i06
    q: 看似相同的彈力帶可能有多大張力差異？
    a:
    - 兩條看似相同的帶子之間可有 3.2% 至 5.2% 的差異。
    - 這可造成兩條帶子平均張力相差 8% 至 19%。
    detail: 教材提醒教練，帶子間差異會影響自由重量動作的實際負荷，不能只以名稱或外觀假定其阻力相同。
    terms:
    - resistance-bands
    numbers:
    - v: 3.2-5.2
      unit: '%'
      of: 兩條看似相同彈力帶之間的差異範圍
    - v: 8-19
      unit: '% 平均張力'
      of: 帶子間差異可能造成的平均張力差距範圍
    concepts:
    - measurement
    locator: Variable-Resistance Training Methods > Resistance Band Exercises > Determining Resistance With Resistance Bands
  - id: ch16.resistance-bands.i07
    q: 彈力帶背蹲舉（back squat with bands）在底端與頂端的負荷安排為何？
    a:
    - 帶子應鬆到在深蹲底端沒有張力，因而不對槓鈴增加負荷。
    - 自底端上升至鎖定位置時，帶子的伸展負荷逐漸增加；下降時則逐漸減少。
    detail: 此安排確保底端為帶子鬆弛狀態；教材的動作圖鑑並未宣稱背蹲舉技術與傳統深蹲「完全相同」。
    terms:
    - back-squat-with-bands
    - resistance-bands
    numbers: []
    concepts:
    - technique
    related:
    - ch15.lower-body.i01
    - ch02.resistance-sources.i06
    locator: Back Squat With Bands
  - id: ch16.resistance-bands.i08
    q: 彈力帶訓練的證據有哪些限制與相反結果？
    a:
    - Ebben 與 Jensen 報告，帶子占深蹲總負荷 10% 時，整合肌電圖與平均地面反作用力和恆定負荷條件沒有差異。
    - 尤其缺少縱向研究，尚無法確認部分作者發現的急性效果是否會轉成較佳的長期肌力與功率增益，也仍需找出最佳方法。
    detail: 教材同時保留正、反急性結果與長期資料不足，不能把帶子宣稱為已證實優於恆定負荷的訓練法。
    terms:
    - resistance-bands
    - integrated-electromyography
    numbers:
    - v: '10'
      unit: '% 總負荷'
      of: Ebben 與 Jensen 深蹲中由彈力帶提供的負荷比例
    concepts:
    - measurement
    locator: Variable-Resistance Training Methods > Resistance Band Exercises
- id: strongman-training
  title: 強人訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.strongman-training.i01
    q: 輪胎翻轉（tire flip）的選胎與技術要點是什麼？
    a:
    - 輪胎高度不應高於運動員直立時的身高；胎紋磨損會較難握持，明顯胎紋也可能有割痕、碎屑或外露金屬而增加受傷風險。
    - 教材列有相撲式、背抬式與肩靠輪胎式三種翻法。肩靠輪胎式時，下巴與前三角肌靠胎、以反握抓胎；伸膝、伸髖、蹠屈踝向前上推，再換正握、向前移腳並伸臂翻倒輪胎。
    detail: 教材指出沒有研究直接檢驗任一翻胎技術的整體安全性；有人認為相撲式較安全，而實務文獻近來偏好肩靠輪胎式，兩者均非定論。
    terms:
    - tire-flip
    numbers: []
    concepts:
    - technique
    - safety
    related:
    - ch23.design-elements.i05
    - ch24.facility.i03
    locator: Nontraditional Implement Training Methods > Strongman Training > Tire Flipping
  - id: ch16.strongman-training.i02
    q: 原木翻舉推舉（log clean and press）的動作與負荷考量是什麼？
    a:
    - 動作是迅速有力地把原木由地面提到前肩，再推舉過頭；原木翻舉有三個階段、分兩個動作，中間在肩部暫停。
    - 起始時原木在脛前、腳掌前段正上方，背部中立、肩胛下沉後收；拉起時髖與膝伸展，接槓時髖膝屈至四分之一或半蹲，原木架在鎖骨與前三角肌前方。
    - 原木訓練負荷可參考傳統動作；一項研究採用傳統挺舉 1RM 的 70%，但機械困難可能使運動員無法舉起相同負荷。
    detail: 原木可每次反覆都翻舉推舉，或先翻舉一次再多次推舉；教材不把兩種安排判定為哪一種較優。
    terms:
    - log-clean-and-press
    numbers:
    - v: '70'
      unit: '% 1RM'
      of: 一項原木訓練研究以傳統挺舉 1RM 為基準的訓練負荷
    concepts:
    - technique
    - force-production
    related:
    - ch15.power-exercises.i07
    - ch23.key-numbers.i02
    locator: Log Clean and Press
  - id: ch16.strongman-training.i03
    q: 農夫走（farmer's walk）的用途與安全邊界為何？
    a:
    - 農夫走是雙手各在身側持負荷向前行走；可用靜態負荷（如重啞鈴）或可變負荷（如盛水物）。
    - 有人認為它可發展全身無氧耐力、背部耐力與握力，並以不同於傳統阻力訓練的方式挑戰身體連結與穩定系統。
    - 可用文獻支持其作為肌力體能工具的研究非常有限；未見安全性研究，因此教材只說應由具高肌力的進階運動員嘗試並遵循一般安全原則。
    detail: 效益多以「有人認為」或「看起來」表述；教材未提供小步快走、抗旋轉或農夫走架等技術規則。
    terms:
    - farmers-walk
    numbers: []
    concepts:
    - technique
    - safety
    related:
    - ch23.layout.i08
    - ch24.supervision.i02
    locator: Nontraditional Implement Training Methods > Strongman Training > Farmer’s Walk
  - id: ch16.strongman-training.i04
    q: 教材對強人訓練（strongman training）的整體證據結論是什麼？
    a:
    - 常見強人動作包括翻胎、原木（或桶）舉與農夫走；部分證據顯示這些動作可帶來高強度刺激與升高的血乳酸反應。
    - 也有人認為其不穩定、笨重的阻力會以不同方式挑戰運動員；但直接探究這類訓練成效的研究目前仍相對少。
    detail: 教材沒有把強人訓練定位為有氧訓練替代品或爆發力補充的既定用途；採用時應保留其整體有效性研究不足的限制。
    terms:
    - strongman-training
    numbers: []
    concepts:
    - measurement
    related:
    - ch13.anaerobic-endurance.i01
    locator: Nontraditional Implement Training Methods > Strongman Training
- id: variable-resistance
  title: 可變阻力訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.variable-resistance.i01
    q: 教材區分哪三種阻力施加方式？
    a:
    - 恆定外部阻力（constant external resistance）的外部負荷在全動作範圍維持不變，以傳統自由重量最具代表性。
    - 適應性阻力（accommodating resistance）可控制動作速度或等速阻力；教材認為這類裝置的外部效度不佳，尤其難以與多關節恆定負荷自由重量相比。
    - 可變阻力（variable resistance）會配合關節角度變化而改變施加阻力；鏈條與橡膠帶是現代肌力體能設施常見作法。
    detail: 三類名稱描述的是阻力的施加方式，不能把適應性阻力誤寫成單純「隨關節角度配合力量曲線」的裝置。
    terms:
    - constant-external-resistance
    - accommodating-resistance
    - variable-resistance
    - free-weight-exercises
    - chains
    - resistance-bands
    numbers: []
    concepts:
    - technique
    - force-production
    related:
    - ch02.resistance-sources.i02
    locator: Variable-Resistance Training Methods
  - id: ch16.variable-resistance.i02
    q: 為何教材認為可變阻力可能有用？
    a:
    - 傳統阻力訓練的外部負荷不變，但肌肉施力會隨參與關節的機械優勢改變。
    - 可變阻力方法試圖依關節角度調整阻力，使肌肉在完整動作範圍最大化施力。
    - 以背蹲舉為例，肌肉最大施力在動作中點、最小施力在底端；因此作法是在底端減阻，並在由底端上升時加阻。
    detail: 這是教材用來說明方法原理的背蹲舉例子，不能泛化成所有推、拉動作皆必然「末段最重」。
    terms:
    - variable-resistance
    - constant-external-resistance
    numbers: []
    concepts:
    - force-production
    related:
    - ch02.levers.i06
    - ch02.strength-factors.i05
    locator: Variable-Resistance Training Methods
  - id: ch16.variable-resistance.i03
    q: 教材對可變阻力的速度與關節力學效果使用何種限定語？
    a:
    - 向心努力中有相當大部分時間用於減速。
    - 教材指出，可變阻力方法「可能」配合關節槓桿的變化、克服特定關節角度的機械劣勢，並提供補償性加速。
    detail: 上述效果均以「may」或「it has been suggested」表達，是可能機制而非保證的爆發力訓練結果。
    terms:
    - variable-resistance
    numbers: []
    concepts:
    - force-production
    related:
    - ch02.size-strength.i06
    locator: Variable-Resistance Training Methods
  - id: ch16.variable-resistance.i04
    q: 鏈條或橡膠帶與傳統自由重量結合時，教材的結論是什麼？
    a:
    - 鏈條或橡膠帶加到傳統自由重量，已被發現會改變原本恆定負荷動作的負荷曲線，讓阻力隨動作範圍變化。
    - 教材在結論指出，對進階運動員，可變阻力可能讓傳統訓練方法承受較大的訓練刺激。
    detail: 「可能」是教材的限定語；這段沒有說可變阻力可以取代傳統阻力，也沒有建立所有人都必須先符合特定技術門檻的通則。
    terms:
    - variable-resistance
    - chains
    - resistance-bands
    - free-weight-exercises
    numbers: []
    concepts:
    - program-design
    related:
    - ch17.needs-analysis.i04
    - ch17.principles-exam-tips.i02
    locator: Variable-Resistance Training Methods；Conclusion
cards:
- q: "替代模式與非傳統器材動作的首要姿勢原則是什麼？"
  a: "選擇能在動作中維持安全、正確身體排列的穩定姿勢；自由站立的地面動作通常採雙腳略寬於肩、腳掌平放。"
  tag: general-guidelines
- q: "替代模式動作的呼吸時機通常為何？"
  a: "通常在黏滯點的向心動作呼氣，在壓力較小的離心動作吸氣。"
  tag: general-guidelines
- q: "何時瓦爾薩爾瓦操作可能難以避免？"
  a: "負荷大於最大自主收縮的 80%，或以較輕負荷做到力竭時；它會提高腹內壓以增進脊椎穩定。"
  tag: general-guidelines
- q: "替代模式與非傳統器材動作如何選擇握法？"
  a: "通常採第 15 章的傳統握法，並依個別動作需求選擇；許多非傳統器材中，握力可能成為限制因素。"
  tag: general-guidelines
- q: "原木翻舉時何時可使用瓦爾薩爾瓦操作？"
  a: "可在拉起與接槓階段使用，待身體站直後再呼氣。"
  tag: general-guidelines
- q: "自體重量訓練是什麼？"
  a: "以個人的身體重量提供阻力的阻力訓練方法。"
  tag: bodyweight-training
- q: "教材列舉自體重量訓練的三項特色為何？"
  a: "符合個人人體測量特徵、常含閉鎖鏈動作、可同時強化數個肌群；也可發展相對肌力與身體控制。"
  tag: bodyweight-training
- q: "自體重量訓練的低成本優點是什麼？"
  a: "教材將它列為低成本的訓練替代方案。"
  tag: bodyweight-training
- q: "自體重量訓練的主要限制是什麼？"
  a: "阻力受限於個人身體重量，因此通常不會顯著影響絕對肌力。"
  tag: bodyweight-training
- q: "如何提高自體重量動作的強度？"
  a: "可改變動作模式；例如伏地挺身抬高腿部會增加阻力。也可用懸吊裝置，教材指出其伏地挺身肌肉活化較高。"
  tag: bodyweight-training
- q: "教材列舉哪些自體重量訓練活動？"
  a: "伏地挺身、引體向上、反手引體向上、仰臥起坐與蹲撐（squat thrust）；徒手體操、競技體操與瑜伽也可歸類。"
  tag: bodyweight-training
- q: "解剖學核心包含什麼？"
  a: "軸心骨骼，以及所有起點位於軸心骨骼的近端附著軟組織。"
  tag: core-training
- q: "教材對「核心」定義有何保留？"
  a: "科學文獻中沒有精確一致的核心定義；解剖學核心是教材所述通常採用的定義。"
  tag: core-training
- q: "何謂隔離核心動作？"
  a: "不用上下肢參與、以動態或等長肌肉動作隔離特定核心肌群；俯臥棒式與側棒式是教材例子。"
  tag: core-training
- q: "隔離核心動作與地面自由重量動作的運動表現證據如何比較？"
  a: "隔離動作對未訓練者或傷後恢復者有支持，但對運動表現遷移支持有限；地面自由重量動作的益處較大。"
  tag: core-training
- q: "前棒式的結束姿勢要點是什麼？"
  a: "抬髖使踝、膝、髖、肩與頭成一直線；肘在肩正下方，軀幹等長維持剛性，頭保持中立。"
  tag: core-training
- q: "側棒式的結束姿勢要點是什麼？"
  a: "抬髖使支撐側的踝、膝、髖與肩成一直線；肘在肩正下方，軀幹剛性維持，頭保持中立。"
  tag: core-training
- q: "穩定球前滾的核心技術邊界是什麼？"
  a: "膝與腳趾留地，伸膝、屈肩把球滾向前；軀幹等長保持剛性，髖不可下沉。"
  tag: core-training
- q: "史密斯機深蹲的背部穩定肌活性比自由重量深蹲低多少？"
  a: "低 30%。"
  tag: machine-vs-freeweight
- q: "器械訓練提供的主要優勢是什麼？"
  a: "器械提供的穩定性可能使訓練者更能針對特定肌群。"
  tag: machine-vs-freeweight
- q: "為何教材認為器械的肌肉隔離不完全符合運動表現？"
  a: "在運動表現情境，肌肉很少以如此孤立的方式運作。"
  tag: machine-vs-freeweight
- q: "為何教材在肌力與功率發展時偏向地面自由重量？"
  a: "它提供特異性與不穩定性的理想組合，且傳統地面自由重量已足以產生運動專項適應所需的不穩定性。"
  tag: machine-vs-freeweight
- q: "把地面自由重量放在不穩定表面會如何？"
  a: "力量產生、力量發展速率與功率輸出的下降會更大。"
  tag: machine-vs-freeweight
- q: "教材是否認為所有不穩定裝置都不該使用？"
  a: "不是；其結論是以肌力與功率為焦點時無須額外增加不穩定，不否定不穩定裝置在復健中的用途。"
  tag: machine-vs-freeweight
- q: "教材區分的三種阻力施加方式是什麼？"
  a: "恆定外部阻力、適應性阻力與可變阻力。"
  tag: variable-resistance
- q: "傳統恆定外部負荷下，為何肌肉施力仍會改變？"
  a: "因參與關節的機械優勢會隨動作位置改變。"
  tag: variable-resistance
- q: "背蹲舉中，可變阻力如何配合教材所述的施力變化？"
  a: "教材指出最大施力在動作中點、最小在底端；因此可在底端減阻，並在由底端上升時加阻。"
  tag: variable-resistance
- q: "教材如何限定可變阻力對速度的說法？"
  a: "它可能配合關節槓桿變化、克服特定關節角度的機械劣勢，並提供補償性加速；不是保證的結果。"
  tag: variable-resistance
- q: "現代肌力體能設施最常用何種可變阻力作法？"
  a: "把鏈條或橡膠帶加到傳統自由重量動作。"
  tag: variable-resistance
- q: "教材對進階運動員採用可變阻力的結論是什麼？"
  a: "可變阻力可能使傳統訓練方法承受較大的訓練刺激。"
  tag: variable-resistance
- q: "鍊條如何改變動作中的阻力？"
  a: "在底端較多鍊節接觸地面而減重；向上時鍊節離地，阻力增加。"
  tag: chains-bands
- q: "鍊條負荷如何用頂端與底端計算？"
  a: "將頂端與底端的絕對鍊條阻力相加後取平均，再由目標負荷扣除該平均值。"
  tag: chains-bands
- q: "教材的鍊條臥推範例為何？"
  a: "無鍊條 5RM 為 120 kg；底端鍊條 0 kg、頂端 11.1 kg，平均 5.55 kg，因此槓鈴加 114 至 115 kg。"
  tag: chains-bands
- q: "彈力帶的張力遵循什麼原理？"
  a: "虎克定律：張力等於帶子剛性乘以形變量；拉得愈長，張力愈大。"
  tag: chains-bands
- q: "彈力帶加在自由重量時，頂端與底端阻力如何變化？"
  a: "最高張力與總阻力在頂端；底端帶子較少拉伸，施加負荷較低。"
  tag: chains-bands
- q: "看似相同的彈力帶可造成多大的平均張力差距？"
  a: "帶子本身可相差 3.2% 至 5.2%，造成平均張力相差 8% 至 19%。"
  tag: chains-bands
- q: "彈力帶訓練的證據為何不能視為定論？"
  a: "有部分急性正向結果，也有研究發現帶子占總負荷 10% 時整合肌電圖與平均地面反作用力沒有差異；縱向研究仍不足。"
  tag: chains-bands
- q: "教材列舉哪些常見強人動作？"
  a: "翻胎、原木或桶舉，以及農夫走。"
  tag: strongman-training
- q: "翻胎選胎時，教材如何限制輪胎高度？"
  a: "輪胎高度不應高於運動員直立時的身高。"
  tag: strongman-training
- q: "翻胎時若髖部上升快於肩部，應如何修正？"
  a: "保持髖低，向前推輪胎而不是把它舉起；並讓髖略低於肩。"
  tag: strongman-training
- q: "原木翻舉推舉的接槓位置是什麼？"
  a: "在髖膝屈至四分之一或半蹲時，將原木架在鎖骨與前三角肌前方。"
  tag: strongman-training
- q: "農夫走是什麼？"
  a: "雙手各在身側持負荷向前行走；可用靜態負荷如重啞鈴，或可變負荷如盛水物。"
  tag: strongman-training
- q: "教材對農夫走的安全邊界是什麼？"
  a: "沒有可用研究檢驗其安全性；應遵循一般安全原則，且只有具高肌力的進階運動員應嘗試。"
  tag: strongman-training
- q: "教材對強人訓練的整體證據結論是什麼？"
  a: "部分證據顯示可帶來高強度刺激與血乳酸升高，但直接探究訓練成效的研究仍相對少。"
  tag: strongman-training
- q: "鑄鐵與競技壺鈴有何差異？"
  a: "鑄鐵壺鈴尺寸隨重量改變；鋼製競技壺鈴無論重量尺寸均相同，並用不同顏色表示重量。"
  tag: kettlebell-unilateral
- q: "競技壺鈴的尺寸為何？"
  a: "高度 228 mm、直徑 210 mm、把手直徑 35 mm。"
  tag: kettlebell-unilateral
- q: "教材如何定位壺鈴訓練？"
  a: "現有證據多指向它可作一般體能或健身發展工具；壺鈴盪對心肺適能似有正面影響，但不及跑步機跑步或傳統有氧運動。"
  tag: kettlebell-unilateral
- q: "雙手壺鈴盪向上時，壺鈴應到哪裡？"
  a: "讓動量把壺鈴舉至眼睛高度，保持肘伸直與中立脊椎。"
  tag: kettlebell-unilateral
- q: "教材列舉單側訓練的哪些用途？"
  a: "可在不同程度上納入課表，以減少雙側不對稱，或作為復健工具。"
  tag: kettlebell-unilateral
- q: "訓練有素者與未訓練、受傷或較弱者，分別傾向何種雙側反應？"
  a: "前者傾向雙側促進；後者傾向雙側缺陷。"
  tag: kettlebell-unilateral
- q: "教材如何依雙側反應判斷單側肌力訓練？"
  a: "訓練有素者不應以單側方法發展肌力；單側方法可能有助未訓練、較弱與受傷者。"
  tag: kettlebell-unilateral
- q: "單腿深蹲在教材中的別稱與位置安排是什麼？"
  a: "有時稱保加利亞分腿蹲；面背板凳或箱子，前腳向前跨適中一步，後腳腳背放在板凳或箱子上。"
  tag: kettlebell-unilateral
