- id: strongman-training
  title: 強人訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.strongman-training.i01
    q: 輪胎翻轉（Tire Flip）
    a:
    - '### 動作模式


      分三階段：**拉起 → 推過 → 翻轉**


      ### 起始位置（兩種）


      | 方式 | 描述 |

      |------|------|

      | 相撲式（Sumo） | 雙腳寬站、雙手伸入輪胎底部 |

      | 背抬式（Backlift） | 雙腳窄站、肩膀頂著輪胎 |


      ### 執行要點


      1. **拉起**：膝蓋彎曲、脊柱中立，以臀腿力量拉起輪胎至膝部高度

      2. **過渡**：膝蓋推入輪胎底部，將輪胎推至肩膀高度（轉移力點）

      3. **推翻**：雙手換握輪胎上緣，全力向前推倒


      ### 常見錯誤


      - 起始時圓背（腰椎屈曲）→ 應保持脊柱中立

      - 過渡期未充分使用膝蓋頂撐


      ---'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.strongman-training.i02
    q: 原木舉（Log Lifting）
    a:
    - '- 使用粗圓形原木（直徑大，握距固定）

      - 動作類似蹲舉翻、上膊：從地面清起至胸口，再肩推過頭

      - 挑戰點：圓形截面使重心難以控制，比傳統槓鈴需要更多穩定力


      ---'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.strongman-training.i03
    q: 農夫走（Farmer's Walk）
    a:
    - '### 訓練效益


      | 能力 | 說明 |

      |------|------|

      | **握力** | 持續握持重物行走，高度刺激前臂與手部 |

      | **背部耐力** | 脊柱在負荷下維持直立（抗彎矩） |

      | **無氧耐力** | 高代謝需求，心肺與肌肉耐力並重 |

      | **核心穩定** | 行走中持續對抗側傾與旋轉力矩 |


      ### 執行要點


      - 挺胸收腹，脊柱中立

      - 小步快走，維持節奏

      - 器材：農夫走架（Farmer''s Walk handles）或重型啞鈴/壺鈴


      ---'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.strongman-training.i04
    q: 整合建議
    a:
    - '- 適合進階運動員，需有扎實的傳統力量基礎再導入

      - 可作為有氧替代訓練（農夫走）或爆發力補充（輪胎翻）

      - 確保訓練區域安全空曠（特別是輪胎翻）'
