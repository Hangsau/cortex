title: Ch.16 替代模式與非傳統器材訓練技術
topics:
- id: bodyweight-training
  title: 自體重量訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.bodyweight-training.i01
    q: 定義
    a:
    - 以自身體重作為唯一阻力的訓練模式，無需任何器材。
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.bodyweight-training.i02
    q: 主要優點
    a:
    - '| 優點 | 說明 |

      |------|------|

      | **閉鎖運動鏈（closed-chain）** | 肢體末端接觸固定表面，更符合運動功能需求 |

      | **相對肌力發展** | 訓練體重與力量的比值，對需快速移動的運動員尤為重要 |

      | **低成本、高可及性** | 無需器材，任何地點皆可執行 |

      | **多平面動作** | 自然整合多關節、多平面的動作模式 |

      | **傷害風險低** | 相對低衝擊，適合入門與復健階段 |'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.bodyweight-training.i03
    q: 主要限制
    a:
    - '- **阻力上限固定**：一旦訓練者能輕鬆完成動作，只能以增加重複次數、減少穩定支撐點（如單臂/單腿）、或提高槓桿難度（如漸進伏地挺身角度）等方式增加難度

      - 對高度進階力量運動員，純自體重量訓練的力量刺激可能不足'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.bodyweight-training.i04
    q: 常見動作範例
    a:
    - '- 伏地挺身（Push-up）、引體向上（Pull-up/Chin-up）

      - 深蹲（Bodyweight Squat）、弓步蹲（Lunge）

      - 雙槓撐體（Dip）、倒立伏地挺身（Handstand Push-up）'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.bodyweight-training.i05
    q: 與其他模式整合
    a:
    - '- 可作為熱身或動態伸展的一部分

      - 與自由重量結合：先建立自體重量模式，再負重

      - 適合旅行或戶外訓練時的替代方案'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
- id: chain-training
  title: 鍊條訓練 Chain-Supplemented Exercises
  desc: ''
  tag: Chains
  items:
  - id: ch16.chain-training.i01
    q: Variable Resistance 概念
    a:
    - 傳統訓練外部負荷恆定，但肌肉力量隨關節角度改變（機械優勢不同）
    - 鍊條可讓阻力隨動作範圍變化，與肌力曲線更匹配
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.chain-training.i02
    q: 鍊條質量決定因素
    a:
    - 結構、密度、長度、直徑
    - Table 16.1 提供直徑 × 長度對應重量（如 12.7mm × 100cm = 7.4kg）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.chain-training.i03
    q: 負荷計算公式
    a:
    - 鍊條頂部負荷 + 底部負荷 ÷ 2 = 平均鍊條重量
    - 從目標負荷（如 5RM = 120kg）減去平均鍊條重量（5.55kg）→ 槓鈴放 114~115kg
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.chain-training.i04
    q: 懸掛方式（推薦）
    a:
    - 以較細的輔助鍊懸掛主鍊，使主鍊僅在最低位（深蹲底部/臥推觸胸）才完全接觸地面
    - 頂部為完全負荷，底部為減重
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.chain-training.i05
    q: Baker 三效應假說
    a:
    - ① 頂部完整負荷提供最大刺激
    - ② 底部鍊條堆地產生 within-rep PAP（神經活化↑）
    - ③ 底部卸載→更快 SSC 償還期（amortization phase 縮短）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
