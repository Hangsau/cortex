- id: chains-bands
  title: 鏈條與彈力帶
  desc: ''
  tag: ''
  items:
  - id: ch16.chains-bands.i01
    q: 鏈條訓練（Chain Training）
    a:
    - '### 工作原理


      鏈條懸掛在槓鈴兩端，底部堆疊於地面：

      - **底部（起始）**：鏈條大部分在地面，實際負荷較輕

      - **頂部（lockout）**：鏈條全數懸空，實際負荷最重


      ### 負荷計算


      **平均有效重量** = (底部重量 + 頂部重量) ÷ 2


      > 範例：若一對鏈條各 10 kg，底部每側 3 kg 在空中、頂部 10 kg 全懸空，槓鈴本重 100 kg

      > → 底部有效重 = 100 + 2×3 = 106 kg

      > → 頂部有效重 = 100 + 2×10 = 120 kg

      > → 平均有效重 = (106 + 120) ÷ 2 = 113 kg


      ### 應用


      - 主要用於：臥推、蹲舉

      - 訓練目標：鎖定末段（lockout）力量不足的弱點區間


      ---'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.chains-bands.i02
    q: 彈力帶訓練（Elastic Band Training）
    a:
    - '### 工作原理（虎克定律）


      **T = k × d**（T = 張力，k = 彈力係數，d = 拉伸距離）


      - 彈力帶拉伸越多，阻力越大

      - 綁於槓鈴兩端：底部阻力最小，頂部阻力最大


      ### 與鏈條的比較


      | 特性 | 鏈條 | 彈力帶 |

      |------|------|--------|

      | 阻力曲線 | 線性增加（重力） | 非線性增加（彈性） |

      | 動作感受 | 較穩定、可預測 | 較不穩定，需更多控制 |

      | 便攜性 | 重、不易攜帶 | 輕、易攜帶 |

      | 費用 | 較高 | 較低 |


      ### 應用


      - 主要用於：臥推、蹲舉、硬舉

      - 也可單獨使用（無槓鈴），訓練特定動作模式

      - 注意：彈力帶老化後彈力係數改變，需定期更換


      ---'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.chains-bands.i03
    q: 安全注意事項
    a:
    - '- 彈力帶或鏈條必須牢固固定，防止滑落

      - 先以輕重量確認固定方式再加大負荷

      - 鏈條相碰的聲音正常，但過度晃動代表固定不穩'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
- id: core-training
  title: 核心與不穩定訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.core-training.i01
    q: 核心的定義
    a:
    - '**核心（Core）** = 軸向骨骼（脊椎、骨盆、肋骨）+ 周邊軟組織（肌肉、韌帶、筋膜）


      - 核心提供動力鏈（kinetic chain）的穩定基礎，讓力量從地面傳導至四肢

      - 弱核心 → 力量外漏、姿勢代償、傷害風險上升'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.core-training.i02
    q: 核心訓練分類
    a:
    - '### 1. 核心隔離訓練（Isolation）

      - 動作：仰臥起坐、捲腹、背伸展

      - 優點：針對性強

      - 缺點：不符合運動情境，功能遷移有限


      ### 2. 地面基礎訓練（Ground-based）

      - 動作：深蹲、硬舉、奧舉（Olympic lifts）

      - **優於隔離訓練**：核心在整合功能動作中自然激活，與運動情境高度相關

      - 研究支持：核心在複合動作中的激活方式更接近實際運動需求'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.core-training.i03
    q: 不穩定裝置（Instability Devices）
    a:
    - '常見裝置：BOSU ball、平衡板（balance board）、瑞士球（stability ball）


      ### 使用原則

      - 應用於**上肢/核心**訓練時有效果（如在瑞士球上做啞鈴臥推）

      - 用於下肢最大肌力訓練時效果**不如穩定地面**（難以負荷高重量）

      - 適合：復健、本體感覺訓練、低負荷功能性訓練

      - 不適合：以最大力量為目標的訓練


      ### 研究發現

      - 不穩定表面訓練可提升本體感覺，但最大力量增益不如穩定表面

      - 運動員訓練應以穩定表面為主，不穩定裝置為輔助'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
- id: general-guidelines
  title: 一般指導原則
  desc: ''
  tag: ''
  items:
  - id: ch16.general-guidelines.i01
    q: 穩定姿勢
    a:
    - '- **軸向穩定（axial stability）**：執行任何非傳統器材動作前，先建立脊柱中立位

      - 重心低、寬底面積原則適用於大多數非傳統訓練器材

      - 不穩定器材（如壺鈴、鏈條）需更高本體感覺警覺性'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch16.general-guidelines.i02
    q: 呼吸控制
    a:
    - '- 呼氣 → 向心收縮（用力）'
    - "吸氣 → 離心伸長（放鬆）\n- **Valsalva 操作**（閉氣）：適用於近最大負荷的核心結構性動作，可暫時提升脊柱穩定\n  - 限制在 1–2 秒內\n  - 有心血管疾病者慎用"
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch16.general-guidelines.i03
    q: 學習順序
    a:
    - '1. 先從自由重量、器械建立動作模式

      2. 再導入替代模式（自體重量、核心訓練、不穩定器材）

      3. 最後加入非傳統器材（壺鈴、強人訓練、鏈條/彈力帶）'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
  - id: ch16.general-guidelines.i04
    q: 技術監督
    a:
    - '- 替代模式器材的技術失誤往往比傳統器材更難察覺

      - 初學者必須在有資格的 S&C 教練監督下進行

      - 動作品質優先於負荷量'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - program-design
    related: []
    locator: ''
