- id: variable-resistance
  title: 可變阻力訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.variable-resistance.i01
    q: 阻力類型分類
    a:
    - '| 類型 | 說明 | 範例 |

      |------|------|------|

      | **恆定阻力（Constant）** | 整個動作範圍阻力不變 | 傳統槓鈴、啞鈴 |

      | **可調阻力（Accommodating）** | 阻力隨關節角度調整，配合力量曲線 | 液壓器械、等速器械 |

      | **可變阻力（Variable）** | 阻力隨動作位置改變（通常末段增大） | 彈力帶、鏈條 |'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.variable-resistance.i02
    q: 為什麼需要可變阻力？
    a:
    - '人體的**力量曲線（strength curve）**不是線性的：


      - 在特定關節角度（機械優勢最佳點）能產生最大力量

      - 傳統恆定阻力在動作終端（lockout）常出現「輕」的感覺

      - 可變阻力讓整個動作範圍都有適當挑戰'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.variable-resistance.i03
    q: 應用原則
    a:
    - '- **末段加壓**：鏈條或彈力帶使重量在動作最頂端最重，符合多數推/拉動作的強度分布

      - **速度與加速**：在有力角度加速推進，末段阻力增大仍需持續用力，訓練爆發力連續性

      - **力量曲線匹配**：理論上可更完整訓練整個動作範圍的肌力'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    - force-production
    related: []
    locator: ''
  - id: ch16.variable-resistance.i04
    q: 注意事項
    a:
    - '- 可變阻力不能完全取代傳統阻力，應作為補充

      - 技術要求較高，建議先有紮實的傳統動作基礎再導入

      - 負荷計算需考量底部重量 + 額外阻力（見鏈條/彈力帶章節）'
