cards:
- q: 在替代模式訓練中，「軸向穩定」指什麼？
  a: 建立脊柱中立位作為所有動作的基礎，確保力量能有效傳導
  tag: general-guidelines
- q: Valsalva 操作在替代模式訓練中適用於何種情境？
  a: 近最大負荷的核心結構性動作；閉氣限制在 1–2 秒內
  tag: general-guidelines
- q: 替代模式與非傳統器材訓練的技術學習順序為何？
  a: 1.自由重量/器械建立動作 → 2.替代模式（自體重、核心）→ 3.非傳統器材（壺鈴、強人）
  tag: general-guidelines
- q: 動作品質與負荷量，在替代模式訓練中哪個優先？
  a: 動作品質優先；技術失誤在非傳統器材中更難察覺且傷害風險更高
  tag: general-guidelines
- q: 替代模式訓練為何需要更高本體感覺警覺性？
  a: 壺鈴、鏈條等非傳統器材重心不固定，動作控制需求更高
  tag: general-guidelines
- q: 自體重量訓練屬於哪種運動鏈類型？有何意義？
  a: 閉鎖運動鏈（closed-chain）；肢體末端接觸固定表面，更符合功能性運動需求
  tag: bodyweight-training
- q: 自體重量訓練主要發展哪種肌力指標？
  a: 相對肌力（體重與力量的比值），對需快速移動的運動員尤為重要
  tag: bodyweight-training
- q: 自體重量訓練的主要優點有哪些？（至少三點）
  a: 閉鎖運動鏈、相對肌力發展、低成本高可及性、多平面動作、傷害風險低
  tag: bodyweight-training
- q: 自體重量訓練的主要限制是什麼？
  a: 阻力上限固定於體重，進階運動員難以獲得足夠的力量刺激
  tag: bodyweight-training
- q: 自體重量訓練如何在不增加負重的情況下提高難度？
  a: 增加重複次數、減少支撑點（單臂/單腑）、提高槓桿難度（改變角度）
  tag: bodyweight-training
- q: 舉出三個常見的自體重量訓練動作
  a: 伏地挙身（Push-up）、引體向上（Pull-up）、弓步蹲（Lunge）
  tag: bodyweight-training
- q: CSCS 定義的「核心」包含哪些結構？
  a: 軸向骨骼（脊椎、骨盆、胋骨）加上周邊軟組織（肌肉、韌帶、筋膜）
  tag: core-training
- q: 核心在動力鏈中的主要功能為何？
  a: 提供穩定基礎，讓力量從地面傳導至四肢；弱核心會導致力量外漏與傷害
  tag: core-training
- q: 核心雔離訓練（捲腓）與地面基礎訓練（深蹲）在功能遷移上有何差異？
  a: 地面基礎訓練的核心激活更接近運動情境，功能遷移優於雔離訓練
  tag: core-training
- q: 哪種核心訓練對運動員更有價値？原因為何？
  a: 複合動作（深蹲、硬舉、奧舉）；核心在整合功能動作中自然激活，更符合運動需求
  tag: core-training
- q: 常見的不穩定訓練裝置有哪些？
  a: BOSU ball、平衡板（balance board）、瑞士球（stability ball）
  tag: core-training
- q: 不穩定器材對上肢/核心訓練 vs 下肢最大肌力訓練的效果差異為何？
  a: 上肢/核心有效果；下肢最大肌力不如穩定地面（難以負荷足夠重量）
  tag: core-training
- q: 不穩定訓練裝置最適合哪種應用情境？
  a: 復健、本體感覺訓練、低負荷功能性訓練；不適合最大肌力目標的訓練
  tag: core-training
- q: 史密斯機臥按與自由重量臥按相比，背部穩定肌激活差多少？
  a: 史密斯機背部穩定肌激活約低 30%
  tag: machine-vs-freeweight
- q: 為何自由重量比器械更能激活穩定肌？
  a: 自由重量需訓練者主動控制平衡；器械固定軌跡替代了穩定需求
  tag: machine-vs-freeweight
- q: 器械訓練在哪些情況下有其優勢？
  a: 初學動作學習、復健族群、特定肌肉雔離、疲勞末尾的安全補充訓練
  tag: machine-vs-freeweight
- q: 過度依賴器械訓練可能造成什麼問題？
  a: 穩定肌發展不足，動態情境中的穩定能力下降，運動表現受限
  tag: machine-vs-freeweight
- q: S&C 教練對器械與自由重量的建議整合方式為何？
  a: 以自由重量為主軸，器械作為補充（初學過渡、雔離訓練、復健）
  tag: machine-vs-freeweight
- q: 自由重量訓練在運動表現轉移上為何優於器械？
  a: 多平面動作、更高穩定肌激活、神經協調需求更接近真實運動情境
  tag: machine-vs-freeweight
- q: 阻力訓練的三種阻力類型是什麼？各舉一個例子
  a: 恆定（槓鈴/啞鈴）、可調/等速（液壓/等速器械）、可變（彈力帶/鏈條）
  tag: variable-resistance
- q: 為什麼需要可變阻力訓練？
  a: 人體力量曲線非線性；恆定阻力在某些關節角度過輕，可變阻力讓全程都有適當挑戰
  tag: variable-resistance
- q: 「末段加壓」在可變阻力訓練中指什麼？
  a: 鏈條或彈力帶使動作頂端（lockout）重量最大，配合多數推/拉動作的強度分布
  tag: variable-resistance
- q: 可變阻力訓練如何訓練爆發力連續性？
  a: 在有力角度加速推進後，末段阻力增大要求繼續用力而非放鬆，訓練全程爆發力輸出
  tag: variable-resistance
- q: 導入可變阻力訓練前的先決條件是什麼？
  a: 需有札實的傳統阻力訓練基礎，技術成熟後再導入
  tag: variable-resistance
- q: 可變阻力訓練能否取代傳統阻力訓練？
  a: 不能；應作為補充，與傳統阻力並用
  tag: variable-resistance
- q: 鏈條訓練的工作原理是什麼？
  a: 鏈條底部堆疊於地面；底部輕，動作頂端鏈條全懸空時最重
  tag: chains-bands
- q: 鏈條訓練的平均有效重量如何計算？
  a: 平均有效重量 = (底部重量 + 頂部重量) ÷ 2
  tag: chains-bands
- q: 鏈條訓練主要用於哪些動作？主要訓練什麼能力？
  a: 臥按、蹲舉；訓練鎖定末段（lockout）的弱點區間力量
  tag: chains-bands
- q: 彈力帶產生阻力的物理原理（虎克定律）是什麼？
  a: T = k × d（張力 = 彈力係數 × 拉伸距離），拉伸越多阻力越大
  tag: chains-bands
- q: 彈力帶綁在槓鈴時，哪個位置阻力最小？哪個最大？
  a: 底部（起始位置）阻力最小；頂部（完全拉伸）阻力最大
  tag: chains-bands
- q: 鏈條與彈力帶的阻力曲線有何本質不同？
  a: 鏈條線性增加（重力）；彈力帶非線性增加（彈性，越拉增量越陶）
  tag: chains-bands
- q: 使用鏈條或彈力帶訓練的安全注意事項為何？
  a: 器材必須牢固固定；先以輕重量確認固定方式；鏈條過度晉動代表固定不穩
  tag: chains-bands
- q: 輪胎翻轉（Tire Flip）動作分哪三個階段？
  a: 拉起（從地面至膝高）→ 推過（膝頂輪胎至肘高）→ 翻轉（推倒）
  tag: strongman-training
- q: 輪胎翻轉的兩種起始站姿是什麼？
  a: 相撝式（寬站、雙手伸入底部）和背抬式（窄站、肘肩頂著輪胎）
  tag: strongman-training
- q: 輪胎翻轉起始拉起時最常見的技術錯誤是什麼？如何修正？
  a: 圓背（腰椎屈曲）；應保持脊柱中立，以臀腿力量主導拉起
  tag: strongman-training
- q: 原木舉（Log Lifting）與傳統槓鈴上推的主要技術差異為何？
  a: 原木圓形截面使重心難以控制，需更多穩定力；動作流程類似奧舉（清起→肘推）
  tag: strongman-training
- q: 農夫走（Farmer's Walk）能訓練哪些能力？
  a: 握力、背部耐力（抗彎矩）、無氧耐力、核心穩定（抗側傾/旋轉力矩）
  tag: strongman-training
- q: 農夫走的執行要點為何？
  a: 挺胸收腹脊柱中立；小步快走、維持穩定節奏
  tag: strongman-training
- q: 強人訓練適合哪個階段的運動員？原因是什麼？
  a: 進階運動員；需有札實傳統力量基礎才能安全且有效地執行強人訓練動作
  tag: strongman-training
- q: 鑄鐵壺鈴與競技壺鈴的主要外型差異為何？
  a: 鑄鐵：重量越大體積越大；競技：各重量體積相同，把手尺寸標準化
  tag: kettlebell-unilateral
- q: 壺鈴盪（Kettlebell Swing）的核心驅動機制是什麼？
  a: 體鉸鏈（Hip Hinge）驅動，不是蹲，是體關節主導的前傾後推
  tag: kettlebell-unilateral
- q: 壺鈴盪的研究顯示可提升哪些體能指標？
  a: 最大力量、爆發力、有氧體能（有氧容量）
  tag: kettlebell-unilateral
- q: 壺鈴盪頂部的正確姿勢是什麼？
  a: 臀部完全鎖定（臀肌收緊），壺鈴漂浮至胸/肘高度
  tag: kettlebell-unilateral
- q: 什麼是「雙側訓練缺陥（Bilateral Deficit）」？
  a: 未訓練者雙手合力小於兩手單獨最大力之和，雙側同步訓練產生相互抑制
  tag: kettlebell-unilateral
- q: 什麼是「雙側促進（Bilateral Facilitation）」？
  a: 訓練者雙側同步訓練獲得更高神經激活效率，合力接近或超過單側之和
  tag: kettlebell-unilateral
- q: 單側訓練在修正肌力不對稱上的應用標準為何？
  a: 弱側力量差距超過強側 10–15% 時應介入單側訓練修正
  tag: kettlebell-unilateral
- q: 單側訓練在功能性上的優勢是什麼？
  a: 模擬跑步、投擲、踢球等單假發力的運動情境；同時訓練核心抗旋轉能力
  tag: kettlebell-unilateral
