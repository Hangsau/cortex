- id: kettlebell-unilateral
  title: 壺鈴與單側訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.kettlebell-unilateral.i01
    q: 壺鈴類型
    a:
    - '| 類型 | 特徵 |

      |------|------|

      | **鑄鐵壺鈴（Cast Iron）** | 傳統款，重量越大體積越大，把手粗 |

      | **競技壺鈴（Sport/Competition）** | 各重量體積相同（方便技術一致性），把手尺寸標準化 |'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.kettlebell-unilateral.i02
    q: 壺鈴盪（Kettlebell Swing）
    a:
    - '### 動作要點


      - **髖鉸鏈（Hip Hinge）驅動**：不是蹲，是髖關節主導的前傾後推

      - 頂部：臀部完全鎖定，壺鈴漂浮至胸/肩高度

      - 底部：壺鈴向後擺至兩腿之間，膝蓋微屈，背部平直


      ### 研究支持


      - 壺鈴盪研究顯示可提升最大力量（max strength）、爆發力（power）、有氧體能（aerobic capacity）

      - 對腰椎（lumbar spine）適應良好


      ### 常見款式


      - **雙手盪（Two-hand swing）**：入門標準動作

      - **單手盪（One-hand swing）**：增加旋轉穩定需求

      - **抓舉（Snatch）**：進階爆發力動作


      ---


      # 單側訓練（Unilateral Training）'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.kettlebell-unilateral.i03
    q: 雙側訓練缺陷（Bilateral Deficit / Facilitation）
    a:
    - '| 情況 | 說明 |

      |------|------|

      | **雙側缺陷（Bilateral Deficit）** | 未訓練者：雙手合力 < 兩手單獨最大力之和'
    - '雙側訓練相互抑制 |

      | **雙側促進（Bilateral Facilitation）** | 訓練者：雙側同步訓練可能帶來更高的神經激活效率 |


      > 結論：訓練初期可能存在雙側缺陷，隨訓練程度提升，效應減弱甚至反轉。'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
    related: []
    locator: ''
  - id: ch16.kettlebell-unilateral.i04
    q: 單側訓練的應用
    a:
    - '- **肌力不對稱修正**：識別並修正兩側力量差異（一般標準：弱側 ≤ 強側的 10–15%）

      - **功能特異性**：跑步、投擲、踢球等運動幾乎都是單側發力

      - **核心旋轉訓練**：單側負荷會產生旋轉力矩，核心需主動抵抗

      - **範例**：單腿深蹲（Bulgarian Split Squat）、單臂啞鈴划船、單臂臥推'
    detail: ''
    terms: []
    numbers: []
    concepts:
    - technique
