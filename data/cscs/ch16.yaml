  - id: ch16.instability-devices.i02
    q: 不穩定訓練如何影響力量、功率與力量發展速率？
    a:
    - 不穩定動作雖可能提高核心肌肉活化，卻伴隨主動肌的力量生成下降。
    - 主動肌整體產力與整體功率輸出可能低於穩定條件所能達到的 70%，力量發展速率也可能顯著下降。
    detail: 教材以「可能低於」描述兩項輸出，不是宣稱每次訓練的力量與功率都精確降至同一百分比。
    terms:
    - instability-devices
    - muscle-activation
    - rate-of-force-development
    numbers:
    - v: <70
      unit: '%'
      of: 不穩定條件下主動肌整體產力與整體功率相對穩定條件可達水準的可能上限
    concepts:
    - force-production
    related:
    - ch02.work-power.i02
    - ch19.rfd-impulse.i01
    locator: Core Stability and Balance Training Methods > Instability Devices
  - id: ch16.instability-devices.i03
    q: 教材如何定位不穩定裝置在訓練進程中的角色？
    a:
    - 在動態或爆發性的穩定地面自由重量動作（如奧運舉重）之前，靜態平衡活動可視為改善平衡與核心穩定的入門步驟。
    - 對訓練有素的運動員，裝置能提供的力量、速度與力量發展速率刺激可能不足以帶來表現增益。
    detail: 這個推論建立於邊際報酬遞減原則：訓練有素的運動員需要較大的適應刺激；教材不是把所有初學者都描述成「平衡能力不佳」。
    terms:
    - instability-devices
    - ground-based-free-weight-exercises
    - rate-of-force-development
    numbers: []
    concepts:
    - program-design
    related:
    - ch17.exercise-selection.i02
    - ch17.needs-analysis.i04
    locator: Core Stability and Balance Training Methods > Instability Devices
  - id: ch16.instability-devices.i04
    q: 教材如何描述不穩定裝置在復健與前十字韌帶傷害上的證據？
    a:
    - 復健情境中，不穩定裝置已被發現可減少下背痛，並改善穩定膝、踝關節軟組織的效率。
    - Fitzgerald 等人報告，使用傾斜板、滾輪板等裝置所引發的擾動挑戰，會使復健運動員成功重返競技的機率高出五倍。
    - 亦有研究認為，在傳統訓練加入平衡訓練可降低業餘足球員的前十字韌帶傷害；但此結論另有系統性回顧提出異議。
    detail: 「五倍」是成功重返競技的可能性，不是受傷率或成功率本身變成五倍。
    terms:
    - instability-devices
    - anterior-cruciate-ligament
    numbers:
    - v: '5'
      unit: 倍
      of: 擾動挑戰下復健運動員成功重返競技的可能性相對增幅
    concepts:
    - injury
    related:
    - ch22.injury-prevention.i06
    locator: Core Stability and Balance Training Methods > Instability Devices
  - id: ch16.instability-devices.i05
    q: 為何不穩定裝置不一定有利於運動員表現？
    a:
    - 針對運動員在不穩定裝置上做阻力訓練，顯示能顯著改善表現的研究有限。
    - 因訓練時力量、功率與力量發展速率下降，這種方式未必最有利於準備運動員。
    detail: 教材的結論是「研究有限」與「未必最有利」，不是不穩定訓練對已訓練運動員完全無效。
    terms:
    - instability-devices
    - rate-of-force-development
    numbers: []
    concepts:
    - force-production
    related:
    - ch17.principles-exam-tips.i01
    locator: Core Stability and Balance Training Methods > Instability Devices
  - id: ch16.instability-devices.i06
    q: 不穩定裝置訓練為何在肌力體能領域普及？
    a:
    - 其日益流行似乎源自物理治療師在復健過程中的使用。
    - 裝置用來製造姿勢失衡，因而需要較大的核心穩定功能。
    detail: 教材寫的是「seems to have stemmed」，因此只能視為對普及背景的推測，而非確定的歷史因果。
    terms:
    - instability-devices
    numbers: []
    concepts:
    - injury
    locator: Core Stability and Balance Training Methods > Instability Devices
  - id: ch16.instability-devices.i07
    q: 教材如何比較地面自由重量與不穩定裝置？
    a:
    - 深蹲、硬舉與奧運舉重等地面自由重量動作本身帶有一定不穩定性，可同時發展動力鏈全部環節。
    - 教材認為，與不穩定裝置動作相比，這些動作對核心穩定與運動表現提供更好的訓練刺激。
    detail: 這項比較著眼於運動表現與核心穩定的刺激；不否定不穩定裝置在受傷運動員復健中的用途。
    terms:
    - ground-based-free-weight-exercises
    - instability-devices
    numbers: []
    concepts:
    - technique
    - force-production
    related:
    - ch15.body-positioning.i08
    locator: Core Stability and Balance Training Methods > Instability Devices
  - id: ch16.instability-devices.i08
    q: 關於平衡訓練降低前十字韌帶傷害，教材保留什麼爭議？
    a:
    - Caraffa 等人認為，在傳統訓練加入平衡訓練可降低業餘足球員的前十字韌帶傷害。
    - Grimm 等人的系統性回顧則提出異議，認為這類介入未降低前十字韌帶傷害風險。
    detail: 教材並列相反研究結論，不能將其中一方寫成定論。
    terms:
