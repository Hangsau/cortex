title: Ch.16 替代模式與非傳統器材訓練技術
topics:
- id: bodyweight-training
  title: 自體重量訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.bodyweight-training.i01
    q: 自體重量訓練（bodyweight training）是什麼？
    a:
    - 以個人的身體重量提供阻力的阻力訓練方法。
    detail: 書中將其列為最基本的阻力訓練方法之一；「身體重量」是阻力來源，並非表示完全不使用器材。
    terms:
    - bodyweight-training
    numbers: []
    concepts:
    - technique
    related:
    - ch02.resistance-sources.i01
    - ch02.size-strength.i01
    locator: Bodyweight Training Methods
  - id: ch16.bodyweight-training.i02
    q: 自體重量訓練的教材列舉優點為何？
    a:
    - 符合個人的人體測量特徵（anthropometrics）。
    - 常包含閉鎖鏈動作（closed chain–based exercises），可同時強化數個肌群。
    - 可發展相對肌力（relative strength）與身體控制。
    - 是低成本的訓練替代方案。
    detail: 這是教材的六項列點；教材未主張自體重量訓練天然具低傷害風險、必然是多平面動作，或比其他模式更符合功能需求。
    terms:
    - anthropometrics
    - closed-chain-based-exercises
    - relative-strength
    numbers: []
    concepts:
    - technique
    related:
    - ch22.kinetic-chain.i02
    - ch02.size-strength.i01
    locator: Bodyweight Training Methods > Benefits of Bodyweight Training
  - id: ch16.bodyweight-training.i03
    q: 自體重量訓練的主要限制與增加強度的代價是什麼？
    a:
    - 阻力受限於個人的身體重量，因此通常不會顯著影響絕對肌力。
    - 增加反覆次數會提高工作量，但訓練目標會由肌力轉向肌力耐力。
    detail: 這項限制說的是阻力上限與訓練目標，不是教材對所有進階運動員下的絕對禁令。
    terms:
    - bodyweight-training
    numbers: []
    concepts:
    - force-production
    related:
    - ch16.bodyweight-training.i05
    locator: Bodyweight Training Methods
  - id: ch16.bodyweight-training.i04
    q: 教材列舉哪些自體重量訓練活動？
    a:
    - 伏地挺身、引體向上、反手引體向上、仰臥起坐與蹲撐（squat thrust）。
    - 徒手體操（calisthenics）、競技體操（gymnastics）與瑜伽也可歸為自體重量訓練方法。
    detail: 教材的例子止於這些活動；未列出徒手深蹲、弓步蹲、雙槓撐體或倒立伏地挺身。
    terms:
    - bodyweight-training
    numbers: []
    concepts:
    - technique
    locator: Bodyweight Training Methods
  - id: ch16.bodyweight-training.i05
    q: 教材如何在不外加負重下提高自體重量動作強度？
    a:
    - 可改變動作模式；例如伏地挺身時抬高腿部會增加所遇阻力。
    - 可使用懸吊裝置（suspension devices）；教材指出懸吊裝置伏地挺身的肌肉活化高於穩定地面的傳統伏地挺身。
    detail: 增加反覆次數雖會改變工作量，卻會把目標轉向肌力耐力；因此教材也提出改變動作模式與使用懸吊裝置。
    terms:
    - bodyweight-training
    - suspension-devices
    - muscle-activation
    numbers: []
    concepts:
    - technique
    related:
    - ch02.levers.i06
    locator: Bodyweight Training Methods
- id: chain-training
  title: 鍊條訓練 Chain-Supplemented Exercises
  desc: ''
  tag: Chains
  items:
  - id: ch16.chain-training.i01
    q: 鍊條如何提供可變阻力（variable resistance）？
    a:
    - 傳統阻力訓練的外部負荷雖維持不變，但肌肉施力會隨關節的機械優勢而改變。
    - 將鍊條（chains）加到槓鈴等傳統自由重量動作，可改變原本恆定負荷的負荷曲線，使阻力隨動作範圍變化。
    detail: 可變阻力的目標是讓肌肉在完整動作範圍盡可能最大化施力；教材使用的是「試圖」調整阻力，未斷言必然精準配合每個人的力量曲線。
    terms:
    - variable-resistance
    - chains
    - free-weight-exercises
    numbers: []
    concepts:
    - technique
    - force-production
    related:
    - ch16.variable-resistance.i02
    - ch02.levers.i06
    locator: Variable-Resistance Training Methods > Chain-Supplemented Exercises
  - id: ch16.chain-training.i02
    q: 使用鍊條前，哪些特徵決定其阻力？
    a:
    - 鍊條的結構、密度、長度與直徑決定其阻力。
    - 鍊節數也會改變鍊條提供的阻力，因此必須先量化後再用於阻力訓練。
    - 教材的表 16.1（Berning 等人製作、McMaster 等人修訂）以直徑 6.4–25.4 mm、長度 10–200 cm 對應鍊條質量 0.3–56.0 kg。
    detail: 表 16.1 的用途是「先秤清楚再上槓」，而不是直接照抄某一格當處方；鍊條阻力隨動作高度連續改變，表上的值是該長度鍊條的總質量。註：教材電子版此表有三格印刷缺陷（9.5 mm×200 cm 與 12.7 mm×100 cm 印成 74 kg、19.1 mm×50 cm 印成 70 kg，皆為小數點遺失，由並列的磅值與同列線性關係可知真值為 7.4／7.4／7.0 kg；22.2 mm×100 cm 的磅值 475 應為 47.5）。本站數字取自未受影響的格位。
    terms:
    - chains
    numbers:
    - v: 6.4-25.4
      unit: mm
      of: 表 16.1 涵蓋的鍊條直徑範圍
    - v: 10-200
      unit: cm
      of: 表 16.1 涵蓋的鍊條長度範圍
    - v: 0.3-56.0
      unit: kg
      of: 表 16.1 對應的鍊條質量範圍（最細最短至最粗最長）
    concepts:
    - technique
    - measurement
    locator: Variable-Resistance Training Methods > Chain-Supplemented Exercises > Determining Resistance With Chains
  - id: ch16.chain-training.i03
    q: 教材的鍊條負荷計算範例是什麼？
    a:
    - 將動作頂端與底端的絕對鍊條阻力相加後取平均，再由目標負荷扣除該平均值。
    - 範例中，臥推無鍊條的 5RM 為 120 kg；底端鍊條負荷為 0 kg、頂端為 11.1 kg，平均為 5.55 kg，因此槓鈴加 114 至 115 kg。
    detail: 平均鍊條阻力用來調整槓鈴負荷，使整體負荷仍落在原先處方範圍；它不是把任一位置的瞬時阻力改為固定值。
    terms:
    - chains
    numbers:
    - v: '5'
      unit: RM
      of: 範例中無鍊條臥推的反覆最大負荷
    - v: '120'
      unit: kg
      of: 範例中無鍊條臥推的 5RM 負荷
    - v: '0'
      unit: kg
      of: 範例中動作底端的鍊條負荷
    - v: '11.1'
      unit: kg
      of: 範例中動作頂端的鍊條負荷
    - v: '5.55'
      unit: kg
      of: 範例中鍊條頂端與底端負荷的平均值
    - v: 114-115
      unit: kg
      of: 範例中為達目標 5RM 而加到槓鈴的負荷
    concepts:
    - technique
    - measurement
    locator: Variable-Resistance Training Methods > Chain-Supplemented Exercises > Determining Resistance With Chains
  - id: ch16.chain-training.i04
    q: 如何把鍊條施加於自由重量動作？
    a:
    - 可讓鍊條在完全伸展位置接觸地面，或以較細鍊條懸掛，使主鍊只在動作最低位置接觸地面。
    - 採後者時，深蹲底部或臥推槓到胸前時鍊節接觸地面而減少負荷；向上動作時鍊節離地，阻力線性增加。
    detail: 教材描述兩種作法，並提到部分顯示益處的研究使用第二種；它不是對所有動作與訓練者的通用「推薦」方式。
    terms:
    - chains
    - free-weight-exercises
    numbers: []
    concepts:
    - technique
    related:
    - ch15.lower-body.i01
    - ch15.upper-body.i01
    locator: Variable-Resistance Training Methods > Chain-Supplemented Exercises > Applying Chains to Free Weight Exercises
  - id: ch16.chain-training.i05
    q: Baker 對鍊條懸掛方式提出哪三項可能的速度機制？
    a:
    - 鍊節在底端接觸地面而減重，可讓運動員更快加速槓鈴；完整槓鈴—鍊條系統主要在頂端才發揮負荷。
    - 鍊節堆在地面、槓鈴質量下降時，可能因較大的神經肌肉活化出現反覆內後活化增強（within-repetition postactivation potentiation）。
    - 底端的離心卸載可能使伸展—縮短循環（stretch–shortening cycle）的攤銷期（amortization phase）更快。
    detail: 三者均是 Baker 所說的「可能」效應，非已被教材確認的因果結果。
    terms:
    - chains
    - postactivation-potentiation
    - stretch-shortening-cycle
    - amortization-phase
    numbers: []
    concepts:
    - technique
    - motor-control
    locator: Variable-Resistance Training Methods > Chain-Supplemented Exercises > Applying Chains to Free Weight Exercises
  - id: ch16.chain-training.i06
    q: 教材對鍊條訓練的適用對象有何建議？
    a:
    - Baker 建議，鍊條應保留給技術穩定、已有經驗的中階與菁英運動員。
    - 加入鍊條會帶來可能影響動作技術的負荷挑戰。
    detail: 教材的判準是既有動作技術是否穩定，不是僅以訓練年資或負荷大小分級。
    terms:
    - chains
    numbers: []
    concepts:
    - technique
    - safety
    related:
    - ch17.needs-analysis.i04
    - ch15.exercise-technique-fundamentals.i02
    locator: Variable-Resistance Training Methods > Chain-Supplemented Exercises > Determining Resistance With Chains
  - id: ch16.chain-training.i07
    q: 鍊條訓練的科學支持現況為何？
    a:
    - 鍊條訓練雖在健力選手與肌力體能專業人員間愈來愈流行，但相關訓練優勢大多尚未獲科學文獻充分證實。
    - 部分研究顯示，在臥推等傳統動作加入鍊條可能有利；鍊條如何施加會影響其效果，仍需要更多研究。
    detail: 教材沒有把「部分臥推研究」推論成所有鍊條訓練皆有效。
    terms:
    - chains
    numbers: []
    concepts:
    - measurement
    locator: Variable-Resistance Training Methods > Chain-Supplemented Exercises
  - id: ch16.chain-training.i08
    q: 教材區分的三種阻力施加方法是什麼？
    a:
    - 恆定外部阻力（constant external resistance）在完整動作範圍維持外部負荷不變，傳統自由重量是常見例子。
    - 適應性阻力（accommodating resistance）可控制整個動作範圍的動作速度或等速阻力；教材指出這類裝置的外部效度不佳。
    - 可變阻力（variable resistance）隨關節角度改變施加阻力；現代肌力體能場域最常見的作法是鏈條或橡膠帶。
    detail: 外部負荷恆定不等於肌肉施力恆定，因為關節的機械優勢會隨動作位置變化。
    terms:
    - constant-external-resistance
    - accommodating-resistance
    - variable-resistance
    - free-weight-exercises
    - chains
    - resistance-bands
    numbers: []
    concepts:
    - technique
    - force-production
    related:
    - ch02.resistance-sources.i02
    - ch02.resistance-sources.i06
    locator: Variable-Resistance Training Methods
- id: core-training
  title: 核心與不穩定訓練
  desc: ''
  tag: ''
  items:
  - id: ch16.core-training.i01
    q: 教材如何界定解剖學核心（anatomical core）？
    a:
    - 解剖學核心是軸心骨骼（axial skeleton），以及所有起點位於軸心骨骼的近端附著軟組織。
    - 軸心骨骼包含骨盆帶與肩帶；軟組織包含關節軟骨、纖維軟骨、韌帶、肌腱、肌肉與筋膜。
    detail: 教材先指出科學文獻對「核心」沒有精確一致的定義；此處是「通常」採用的解剖學定義，不能擴寫成核心無力必然導致傷害等因果論。
    terms:
    - core
    - anatomical-core
    - axial-skeleton
    numbers: []
    concepts:
    - structure
    related:
    - ch01.skeleton.axial
    - ch01.skeleton.vertebral-segments
    locator: Core Stability and Balance Training Methods > Anatomical Focus
  - id: ch16.core-training.i02
    q: 隔離核心動作與地面自由重量動作，教材如何比較？
    a:
    - 隔離動作（isolation exercises）是不用上下肢參與、以動態或等長肌肉動作隔離特定核心肌群；俯臥棒式與側棒式是教材例子。
    - 對未訓練者或傷後恢復者，隔離動作的表現改善有證據支持；但對運動表現的遷移支持有限。
    - 地面自由重量動作（ground-based free weight exercises），例如深蹲、硬舉、推舉、抓舉與軀幹旋轉動作，對實際運動表現的益處較大，核心活化相近或多數情況更高。
    detail: 對無法充分負荷傳統地面自由重量動作的受傷運動員，隔離動作可能最有價值；這是教材給隔離動作的適用邊界。
    terms:
    - isolation-exercises
    - front-plank
    - side-plank
    - ground-based-free-weight-exercises
    - muscle-activation
    numbers: []
    concepts:
    - technique
    - injury
    locator: Core Stability and Balance Training Methods > Isolation Exercises
  - id: ch16.core-training.i03
    q: 三種穩定球核心動作的主要技術重點是什麼？
    a:
    - 穩定球前滾（stability ball rollout）時，膝與腳趾留在地面，伸膝、屈肩把球向前滾至接近臉部；軀幹等長維持剛性，髖不可下沉。
    - 穩定球折刀（stability ball pike）維持膝、肘伸直與剛性軀幹，屈髖把球滾向胸部，直到腳趾在球頂、髖在肩正上方。
    - 穩定球收腿（stability ball jackknife）由剛性軀幹開始，微抬髖並屈髖、屈膝把球滾向胸部；回程以控制方式伸髖、伸膝。
    detail: 三個動作均以軀幹剛性、肘伸直與頭部中立為技術邊界；教材列出的主要肌肉為腹直肌與髂腰肌。
    terms:
    - stability-ball-rollout
    - stability-ball-pike
    - stability-ball-jackknife
    numbers: []
    concepts:
    - technique
    related:
    - ch15.body-positioning.i08
    - ch01.proprioception.definition
    locator: Stability Ball Rollout；Stability Ball Pike；Stability Ball Jackknife
- id: general-guidelines
  title: 一般指導原則
  desc: ''
  tag: ''
  items:
  - id: ch16.general-guidelines.i01
    q: 替代模式與非傳統器材動作的穩定姿勢原則是什麼？
    a:
    - 選擇能在動作時達成並維持安全、正確身體排列的穩定姿勢，以適當刺激骨骼肌系統。
    - 自由站立的地面動作通常採雙腳略寬於肩、且腳掌平放地面的站姿。
    - 使用不穩定裝置時，可能必須調整身體位置以確保穩定。
    detail: 教材沒有提出「所有非傳統器材均須低重心、寬底面」或「壺鈴與鍊條特別需要本體感覺警覺性」等規則；其準則是是否能維持安全排列與穩定。
    terms: []
    numbers: []
    concepts:
    - technique
    - safety
    related:
    - ch15.body-positioning.i01
    locator: General Guidelines > General Guidelines for Alternative Modes and Nontraditional Implement Exercises
  - id: ch16.general-guidelines.i02
    q: 替代模式動作的呼吸時機為何？
    a:
    - 通常在黏滯點（sticking point）的向心肌肉動作（concentric muscle action）呼氣。
    - 在壓力較小的離心肌肉動作（eccentric muscle action）吸氣。
    detail: 這是教材說「通常建議」的呼吸模式；不是將離心相等同於完全放鬆。
    terms:
    - sticking-point
    - concentric-action
    - eccentric-action
    numbers: []
    concepts:
    - technique
    related:
    - ch15.breathing.i01
    - ch15.breathing.i02
    locator: General Guidelines
  - id: ch16.general-guidelines.i03
    q: 替代模式與非傳統器材動作如何選擇握法？
    a:
    - 通常使用第 15 章所述的傳統握法；選擇取決於個別動作的需求。
    - 對許多非傳統器材而言，握力可能是完成動作的限制因素。
    detail: 教材沒有給出由自由重量、替代模式到非傳統器材的固定學習順序。
    terms: []
    numbers: []
    concepts:
    - technique
    related:
    - ch15.grips.i08
    - ch15.grips.i06
    locator: General Guidelines
  - id: ch16.general-guidelines.i04
    q: 何時可能使用瓦爾薩爾瓦操作（Valsalva maneuver）？
    a:
    - 對軸心骨骼加載的結構性動作，可能需要閉氣；當負荷大於最大自主收縮的 80%，或以較輕負荷做到力竭時，瓦爾薩爾瓦操作可能難以避免。
    - 此操作是對閉合聲門強制呼氣，會提高腹內壓並增進脊椎穩定性；原木翻舉可在拉起與接槓階段使用，站直後再呼氣。
    detail: 教材使用「可能需要」與「可能難以避免」，不是規定所有重訓都必須閉氣；也未列出閉氣秒數或特定疾病禁忌。
    terms:
    - valsalva
    numbers:
    - v: '80'
      unit: '% MVC'
      of: 教材所述可能難以避免瓦爾薩爾瓦操作的負荷門檻
    concepts:
    - technique
    - safety
    related:
