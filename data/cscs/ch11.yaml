      unit: g/kg 體重
      of: 教材所述可改善短時間高強度表現的碳酸氫鈉攝取量
    - v: 60–90
      unit: 分鐘
      of: 該碳酸氫鈉量於活動前攝取的時間範圍
    - v: 0.2
