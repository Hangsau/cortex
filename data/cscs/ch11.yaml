- id: beta-agonists-stimulants
  title: β-促效劑 & 興奮劑 Beta-Agonists & Stimulants
  desc: ''
  tag: 部分禁 / 激素相關
  items:
  - id: ch11.beta-agonists-stimulants.i01
    q: β-腎上腺素促效劑（β-adrenergic agonists）是什麼？
    a:
    - 在化學上與腎上腺素（epinephrine）相關，後者可調節脂肪分解與產熱。
    - 原為治療氣喘及其他危及生命疾病而開發。
    - 部分化合物會增加瘦體重、減少儲存脂肪，因此有時稱為分配劑（partitioning agents）。
    detail: 教材以「部分化合物」限定體組成效果，未主張所有 β-促效劑都能使健康運動員增肌減脂。
    terms: [beta-agonist, epinephrine, lipolysis, thermogenesis]
    numbers: []
    concepts:
    - ergogenic
    related:
    - ch04.catecholamines.i02
    locator: Hormones > β-Adrenergic Agonists
  - id: ch11.beta-agonists-stimulants.i02
    q: Clenbuterol 的使用模式與效力證據為何？
    a:
    - 是 β2-促效劑和支氣管擴張劑；運動員使用它以期增加瘦肌肉、減少皮下脂肪。
    - 教材描述使用者採臨床建議量的兩倍，3 週用藥、3 週停藥；用藥週內 2 天用、2 天停。
    - 人體資料有限，主要證據來自心衰竭、肌肉耗損病人與動物模型；少數人體結果顯示改善力量的潛力。
    detail: 週期模式「被認為」可避免 β2 受體下調，並未獲得證明；病人或動物的效果不能外推為健康運動員效果。
    terms: [clenbuterol, beta-agonist]
    numbers:
    - v: 2
      unit: 倍
      of: 教材描述運動員用量相對於臨床建議量的倍數
