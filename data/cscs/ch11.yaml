    locator: Hormones > Anabolic Steroids > Dosing
  - id: ch11.anabolic-steroids.i04
    q: 合成代謝類固醇的肌肉、力量與表現效果為何？
    a:
    - 在超生理劑量下，常被宣稱的肌肉量、力量與運動表現效益確實會出現，但改變程度與發生率會受訓練狀態等因素影響。
    - 使用接近休閒訓練者與競技選手所用劑量時，會觀察到肌肉蛋白質合成及除脂體重增加。
    - 有經驗的阻力訓練者使用後，力量增益可能是未補充、訓練相仿者通常增益的 2–3 倍。
    detail: 早期未發現表現效果的研究多用生理劑量、非特異性的力量測試或訓練經驗很少的受試者；因此不能把後來在有經驗訓練者的結果直接外推給所有人。
    terms:
    - anabolic-steroid
    - muscle-protein-synthesis
    - fat-free-mass
    numbers:
    - v: 2–3
      unit: 倍
      of: 有經驗阻力訓練者使用類固醇後的力量增益，相對於訓練相仿未補充者通常的增益
    concepts:
