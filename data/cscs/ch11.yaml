  - id: ch11.anabolic-supplements.i08
    q: L-肉鹼（L-carnitine）的用途、效果與安全邊界為何？
    a:
    - L-肉鹼由離胺酸與甲硫胺酸合成，負責將脂肪酸自細胞質送進粒線體氧化供能。
    - 對脂質氧化的增補效果，在人類與大鼠模型都未顯示明確效力；多數研究也未能發現口服後肌肉肉鹼量升高。
    - 有數項研究顯示，未受訓或休閒訓練者補充後可能改善高強度阻力運動的恢復；每日 3 g、連續 3 週在健康志願者中看來耐受良好。
    detail: 教材把恢復效益寫成「may」，所提機制（血管擴張、雄性素受體上調與維持 IGF-I）仍是被提出的解釋；3 週安全資料也不能外推到更高劑量或更長期使用。
    terms:
