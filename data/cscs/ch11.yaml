- id: prohormones-hcg
  title: 前驅激素 & HCG Prohormones & HCG
  desc: ''
  tag: 禁藥 / 激素前驅
  items:
  - id: ch11.prohormones-hcg.i01
    q: 睾固酮前驅激素（prohormones）是什麼？
    a:
    - 前驅激素是其他激素合成的前驅物，理論上可提高身體製造特定激素的能力。
    - 運動員補充 androstenedione、androstenediol 與 dehydroepiandrosterone（DHEA），是期待提高睾固酮、力量、肌肉大小與訓練意願。
    - androstenedione 與 DHEA 本身的雄性素生物活性分別只有睾固酮的 1/5 與 1/10。
    detail: 這些是使用前提與理論，而非已證實效力；教材以「likely」描述運動員的期待。
    terms: [prohormone, androstenedione, dehydroepiandrosterone, testosterone]
    numbers:
    - v: 1/5
      unit: 睾固酮生物活性
      of: androstenedione 相對於睾固酮的生物活性
    - v: 1/10
      unit: 睾固酮生物活性
      of: DHEA 相對於睾固酮的生物活性
    concepts:
    - ergogenic
    - hormone
