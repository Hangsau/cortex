  - id: ch11.muscle-buffering.i08
    q: 檸檬酸鈉（sodium citrate）的機制、效力與副作用為何？
    a:
    - 檸檬酸鈉不是鹼，但可提高血液 pH，且常比碳酸氫鈉少見腸胃不適；教材認為它進入血液後會分解成碳酸氫鹽、提高細胞外 pH。
    - 短時間高強度表現的增補資料不一致：有些研究無益，有些觀察到效益。
    - 0.44 g/kg、運動前 60–90 分鐘的單一研究，發現最大等長膝伸展的腿部肌耐力約多 20%；仍需更多研究才能推薦。
    detail: 這一個正向研究不推翻整體「equivocal」結論；0.4–0.6 g/kg 仍可能造成腸胃不適，反應也因人而異。
    terms: [sodium-citrate, sodium-bicarbonate, muscle-buffering-capacity]
