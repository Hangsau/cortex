  - id: ch11.caffeine-energy-drinks.i05
    q: 運動前能量飲（preworkout energy drinks）常見成分為何？
    a:
    - 常見成分包括咖啡因、碳水化合物、B 群維生素、tyrosine 與 gingko biloba 等。
    - 在這些成分中，教材將咖啡因與碳水化合物視為主要的增補營養素。
    - 能量飲被年輕美國人廣泛使用，常見目的為提升訓練、運動表現或加快訓練適應。
    detail: 教材沒有把其他成分列為已證實有效；也不能把碳水化合物誤寫成「麥角原」。
    terms: [energy-drink, caffeine, carbohydrate]
    numbers: []
    concepts:
    - ergogenic
    locator: Dietary Supplements > Stimulants > Preworkout Energy Drinks
  - id: ch11.caffeine-energy-drinks.i06
    q: 能量飲對阻力、無氧與耐力運動的效果為何？
    a:
    - 一項研究讓 15 名身體活躍的大學生在運動前 60 分鐘攝取含 2 mg/kg 咖啡因的能量飲；在 70% 1RM 臥推三組至力竭時，表現顯著高於等熱量、無咖啡因安慰劑。
    - 其他研究也報告上下肢總舉重量改善；但 Wingate 與速度／敏捷表現對能量飲的反應較差。
    - 多數（非全部）研究發現，於運動前一小時內攝取約 2 mg/kg 咖啡因的能量飲，能改善受訓練自行車選手與休閒活動者的騎車、跑步表現。
    detail: 2 mg/kg 低於教材列出的咖啡因有效範圍，作者只提出各成分協同可能解釋結果；不是已證實的協同機制。
    terms: [energy-drink, caffeine, repetition-maximum]
