    locator: Hormones > HCG (Human Chorionic Gonadotropin) > Adverse Effects
  - id: ch11.prohormones-hcg.i08
    q: 教材所述前驅激素的美國管制身分為何？
    a:
    - 教材說睾固酮前驅物在美國國會通過的 2004 年《Anabolic Steroid Control Act》中，正式列為管制物質。
    - 該法要求這些物質須有醫師處方。
    - 教材的例示清單並非完整清單。
    detail: 這一段的法規主詞是前驅激素，不能把它混寫為 HCG 或其他組織的現行禁用清單；時間與國家範圍都限定在教材所載美國法規。
    terms: [prohormone, androstenedione, dehydroepiandrosterone]
    numbers:
    - v: 2004
      unit: 年
      of: 教材所述美國 Anabolic Steroid Control Act 通過並列管前驅激素的年份
    concepts:
