  - id: ch11.muscle-buffering.i04
    q: β-丙胺酸副作用
    a:
    - 唯一已知副作用：皮膚刺麻感（paresthesia）
    - 單次劑量過高觸發
    - 約 1 小時消退
    - 建議分 2–4 次服用以避免
    - 目前無禁藥爭議
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.muscle-buffering.i05
    q: 碳酸氫鈉機制
    a:
    - 小蘇打（NaHCO₃）
    - 鹼化劑
    - 提升血液 pH → 肌肉細胞內外 pH 差 → 加速 H⁺ 移出細胞 → 緩解酸中毒
    - 建議劑量 0.3 g/kg，運動前 60–90 分鐘服用
