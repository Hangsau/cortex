  - id: ch11.beta-agonists-stimulants.i03
    q: Clenbuterol 的不良反應證據有何限制？
    a:
    - 教材列出的可能反應有暫時性心搏過速、高熱、顫抖、頭暈、心悸與失眠。
    - 實際有文件記錄的事件相當有限；人體增補潛力資料稀少，也難判定效力。
    detail: 本段只列「suggested」症狀，且特別說明實際記錄事件有限，不能改成確定的發生率或因果。
    terms: [clenbuterol, tachycardia]
    numbers: []
    concepts:
    - ergogenic
    locator: Hormones > β-Adrenergic Agonists > Adverse Effects
  - id: ch11.beta-agonists-stimulants.i04
    q: 麻黃素（ephedrine）何時可能具增補效果？
    a:
    - 是另一 β-促效劑，因強烈產熱性質而受健美者使用。
    - 麻黃素只有與咖啡因合併時才顯示增補效果；改善有氧耐力的結果相當一致。
    - 對無氧表現，咖啡因－麻黃素組合的研究結果不一致。
    detail: 產熱是提高基礎代謝率、增加能量消耗的作用；它不是教材證實的單獨耐力效果，合併效果也不適用所有運動型態。
    terms: [ephedrine, beta-agonist, caffeine, thermogenesis]
    numbers: []
    concepts:
    - ergogenic
    related:
    - ch04.catecholamines.i02
    locator: Dietary Supplements > Stimulants > Ephedrine > Efficacy
  - id: ch11.beta-agonists-stimulants.i05
    q: 教材所述含麻黃（ephedra）產品的管制與不良反應為何？
    a:
    - 麻黃（又稱 ma huang）是含麻黃素的植物；教材指出 FDA 在 2004 年 4 月禁止所有含麻黃產品，因判定其造成不合理風險。
    - 教材引述的報告連結 16,000 件與含麻黃膳食補充品相關的不良事件。
    - 含麻黃補充品或麻黃素加咖啡因，與噁心、嘔吐、焦慮與情緒改變、心悸及少數死亡案例有關；多數運動組織（包括 IOC）禁用麻黃素。
    detail: FDA 禁的是含麻黃產品；16,000 是報告所連結的事件數，不能誤寫成麻黃單獨且確定造成的病例數。
    terms: [ephedra, ephedrine, caffeine]
    numbers:
    - v: 2004
      unit: 年
      of: FDA 禁止含麻黃產品的年份
    - v: 16,000
      unit: 件不良事件
