  - id: ch11.anabolic-supplements.i04
    q: 必需胺基酸（essential amino acids, EAAs）對阻力運動後蛋白質合成的證據為何？
    a:
    - EAAs 無法由體內製造，必須由飲食取得；研究顯示，刺激肌肉蛋白質合成所需的是 EAAs，而不是非必需胺基酸。
    - 一項後續研究中，阻力運動後不久攝取 6 g EAA 與 35 g 糖的受試者，合成代謝驅動力高於安慰劑。
    - 以 6 g EAA 加 36 g 糖比較時，訓練前 30 分鐘攝取的 3 小時急性合成代謝反應，比訓練後攝取高 158%。
    detail: 教材明說非必需胺基酸不必然是無關緊要：它們是新肌肉蛋白的原料，也能節省把必需胺基酸轉換成這些原料的需要。急性反應不能直接等同數週後的肌肉量增幅，後者在教材中仍是研究者的推論。
    terms:
    - essential-amino-acid
    - muscle-protein-synthesis
    numbers:
    - v: 6
      unit: g
      of: 訓練前後比較研究中每次攝取的 EAA 量
    - v: 36
      unit: g
