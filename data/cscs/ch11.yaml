  title: 合成代謝類固醇 Anabolic Steroids
  desc: ''
  tag: 禁藥 / 激素類
  items:
  - id: ch11.anabolic-steroids.i01
    q: 合成代謝類固醇（anabolic steroids）是什麼？
    a:
    - 是男性性激素睾固酮（testosterone）的人工合成衍生物。
    - 睾固酮濃度升高會刺激肌肉蛋白質合成，並伴隨肌肉大小、體重與力量的改善。
    - 因這些衍生物也涉及男性的第二性徵與主要性徵發育，教材認為「合成代謝－雄性素類固醇」是較精確的名稱。
    detail: 本條是物質的定義；教材另列睾固酮本身主要由睪丸的 Leydig 細胞分泌，不能把該內源性分泌來源誤寫成合成衍生物的來源。
    terms:
    - anabolic-steroid
    - testosterone
    - muscle-protein-synthesis
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
    - ch04.testosterone.i01
    locator: Hormones > Anabolic Steroids
  - id: ch11.anabolic-steroids.i02
    q: 堆疊（stacking）與週期使用的描述是什麼？
    a:
    - 堆疊是同時使用數種不同藥物，使用者的理由是期望各藥效力相加。
    - 此領域研究有限，堆疊是否有效尚未被證明。
    - 一項研究中的典型療程平均使用 3.1 種藥物，週期為 5–10 週；回報的劑量為生理替代劑量的 5–29 倍。
    detail: 這些是使用者回報的模式與研究描述，不是教材的安全或醫療處方；書中也指出使用者通常在數週或數月的用藥週期之間穿插停用期。
    terms:
    - anabolic-steroid
    - stacking
    numbers:
    - v: 3.1
      unit: 種藥物
      of: 一項研究所述典型類固醇療程平均同用的藥物數
    - v: 5–10
