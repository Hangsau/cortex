  - id: ch11.muscle-buffering.i03
    q: β-丙胺酸的表現效力與適用運動條件為何？
    a:
    - β-丙胺酸似乎不改善最大力量或有氧功率，但支持資料顯示可改善無氧閾值。
    - 一項未訓練男性研究中，第一週每日 4.0 g、後續九週最多每日 6.4 g；第 4 週與第 10 週的肌肽平均分別增加 58% 與再增加 15%，總作功則分別增加 13% 與 16%。
    - 教材引用的綜述結論是：它可改善造成極端肌內酸性環境的運動，例如超過 60 秒的多次高強度運動，或已疲勞時的一次運動；酸中毒較低的高強度運動不太可能受益。
    detail: 研究的運動是循環測功儀力竭測試，不能自行替換為任何特定田徑或格鬥項目；適用條件是酸中毒程度與疲勞狀態。
