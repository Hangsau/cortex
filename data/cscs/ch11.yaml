  - id: ch11.anabolic-supplements.i02
    q: 教材所述肌酸補充的典型方案與肌肉飽和上限為何？
    a:
    - 肌酸補充約可使肌肉肌酸含量增加 20%；肌肉濃度達 150–160 mmol/kg 乾重後，繼續補充似乎無法再提高濃度。
    - 典型方案是先連續 5 天每日 20–25 g，或依體重每日 0.3 g/kg，之後每日維持 2 g。
    - 未先負荷也能達相似肌肉濃度，但約需 30 天而非 5 天；維持量可用每日 2 g 或 0.03 g/kg。停用後約 4 週回到基線。
    detail: 這是教材報告的典型補充研究方案與肌肉濃度反應，不表示更高攝取量會帶來更多效果；飽和限制正是否定「越多越好」的理由。
    terms:
