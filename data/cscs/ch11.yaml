  - id: ch11.anabolic-supplements.i05
    q: 支鏈胺基酸與白胺酸（leucine）在蛋白質合成中的角色為何？
    a:
    - 支鏈胺基酸（branched-chain amino acids, BCAAs）是異白胺酸、白胺酸與纈胺酸；動物模型先指出這三者與肌肉蛋白質合成增加有關。
    - 在 BCAAs 中，白胺酸似乎是刺激肌肉蛋白質合成的關鍵胺基酸，並透過 Akt／mTOR 路徑作用。
    - 教材引述的研究支持「白胺酸閾值」概念；不過該概念與速率限制的結論是研究者據此發展的理論。
    detail: 白胺酸的重要性不能被改寫成「只要補白胺酸就必定增肌」：教材的實驗測量是運動後 3 小時的蛋白質合成，且白胺酸閾值先由囓齒動物模型辨識。
    terms:
    - bcaa
    - mTOR
    - muscle-protein-synthesis
    numbers: []
    concepts:
    - ergogenic
    - nutrition
    related:
    - ch05.hypertrophy.i02
