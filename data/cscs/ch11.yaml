  - id: ch11.anabolic-supplements.i01
    q: 肌酸（creatine）在高強度運動中的作用為何？
    a:
    - 磷酸肌酸（creatine phosphate, CP；亦稱 phosphocreatine, PCr）可藉由肌酸激酶使二磷酸腺苷重新磷酸化為三磷酸腺苷，尤其在短時間高強度運動中供能。
    - 6 秒最大運動時，肌肉 CP 會比休息值低 35–57%；30 秒時約低 64–80%。
    - 反覆的高強度運動中，肌肉 CP 幾乎完全耗盡；隨 CP 濃度下降，最大運動能力也下降。
    detail: 教材將高強度運動時肌肉 CP 耗竭稱為疲勞的主要機制，這也是補充肌酸的理論基礎；它談的是 CP 儲量與再磷酸化，不是把所有短衝能量都簡化成單一來源。
    terms:
    - creatine
    - creatine-phosphate
    - creatine-kinase
    - atp
    - adp
    numbers:
