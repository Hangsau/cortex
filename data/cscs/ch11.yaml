  - id: ch11.muscle-buffering.i05
    q: 碳酸氫鈉（sodium bicarbonate）如何作用？
    a:
    - 碳酸氫鈉是中和酸的制酸劑，也存在於小蘇打中；補充會提高血液 pH。
    - 這造成肌細胞內外 pH 差，加速 H+ 離開收縮肌，協助調節肌內 pH。
    - 教材因此說它能改善 MBC，進而改善高強度運動表現。
    detail: 這是細胞內外 pH 梯度的機制描述，並非直接「中和肌肉裡的所有酸」；是否改善表現仍取決於運動型態與耐受性。
    terms: [sodium-bicarbonate, muscle-buffering-capacity]
    numbers: []
    concepts:
    - ergogenic
    - energy-supply
    related:
    - ch03.lactate.i02
    - ch05.fiber-type-transitions.i08
    locator: Dietary Supplements > Nutritional Muscle Buffers > Sodium Bicarbonate
  - id: ch11.muscle-buffering.i06
    q: 碳酸氫鈉的高強度運動效力證據為何？
    a:
    - 大多數研究聚焦 60 秒至 6 分鐘的短時間高強度運動；急性補充曾改善男女的總作功量、峰值功率、峰值扭矩與力量。
    - 經驗豐富男性划船選手以 0.3 g/kg 體重補充後，2,000 m 總完成時間沒有顯著差異，但第三及最後 500 m 分段顯著改善。
    - 部分研究（非全部）也在 0.3 g/kg 後發現高強度運動改善。
    detail: 划船研究不支持「2,000 m 整體成績改善」或「耐力尾段必定有效」；它只有特定分段改善，且整體時間無顯著差異。
    terms: [sodium-bicarbonate]
    numbers:
    - v: 60
      unit: 秒
      of: 多數碳酸氫鈉表現研究所涵蓋高強度運動時間的下限
    - v: 6
      unit: 分鐘
      of: 多數碳酸氫鈉表現研究所涵蓋高強度運動時間的上限
    - v: 0.3
      unit: g/kg 體重
      of: 2,000 m 划船與部分高強度運動研究中的碳酸氫鈉攝取量
