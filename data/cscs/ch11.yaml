    - ch08.attention-concentration.i05
    locator: Hormones > β-Blockers > Efficacy
  - id: ch11.beta-agonists-stimulants.i08
    q: β-阻斷劑的減損表現與不良反應為何？
    a:
    - 可能有減損表現（ergolytic）效果：會降低最大心率、氧氣攝取量與 10 km 賽跑表現，並提高自覺運動強度。
    - 風險包括支氣管痙攣、心臟衰竭、低血糖延長、心搏過緩、心臟傳導阻滯與間歇性跛行。
    detail: 射擊準確度的潛在好處和耐力運動的心血管限制可以同時存在，不能只保留前者。
    terms: [beta-blocker, ergolytic, maximal-heart-rate, oxygen-uptake, bradycardia]
    numbers:
    - v: 10
      unit: km
      of: 教材引述 β-阻斷劑會降低表現的賽跑距離
    concepts:
