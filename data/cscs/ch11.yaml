  - id: ch11.anabolic-steroids.i03
    q: 金字塔式劑量模式是什麼？
    a:
    - 使用者可能在數週內逐漸提高劑量，形成金字塔式（step-up）模式。
    - 週期末會逐步降低劑量，目的在降低負面副作用發生的可能性。
    - 此時有些人停藥，或開啟另一種藥物週期，以避免停用藥物後內源性睾固酮濃度的不良下降。
    detail: 教材是在描述使用者慣行，沒有證明金字塔模式能降低副作用，也沒有在此段指定任何末期藥物名稱。
    terms:
    - anabolic-steroid
    - testosterone
    numbers: []
    concepts:
