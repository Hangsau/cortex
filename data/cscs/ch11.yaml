  - id: ch11.anabolic-steroids.i06
    q: 合成代謝類固醇濫用的心血管不良反應有哪些？
    a:
    - 教材的濫用徵候表列出脂質概況改變、血壓升高與心肌功能下降。
    - 個案研究中，高密度脂蛋白（high-density lipoprotein, HDL）膽固醇明顯下降，教材將此視為動脈粥樣硬化風險較高的指標。
    detail: 教材區分醫療監督下使用與高劑量、多藥併用的濫用；多數不良醫學事件資料來自運動員自行用藥，不能將表列結果誤作每位使用者的必然結果。
    terms:
    - anabolic-steroid
    - high-density-lipoprotein
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
    - ch09.fat.i04
    locator: Hormones > Anabolic Steroids > Adverse Effects
  - id: ch11.anabolic-steroids.i07
    q: 合成代謝類固醇濫用的生殖與性徵不良反應有哪些？
    a:
    - 內分泌方面可見男性女乳症、精子數減少、睪丸萎縮、陽痿與暫時性不孕。
    - 生殖泌尿方面，男性可見精子數與睪丸大小下降；女性可見月經週期不規則、陰蒂肥大、嗓音變低與男性化。
    - 男女皆可能出現男性女乳症與性慾改變。
    detail: 這是教材表列的「增補劑濫用」徵候；它的組織方式同時列出內分泌與生殖泌尿系統，不能只保留女性化或只保留男性症狀。
    terms:
    - anabolic-steroid
    numbers: []
    concepts:
