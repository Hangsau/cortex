- id: caffeine-energy-drinks
  title: 咖啡因 & 能量飲 Caffeine & Energy Drinks
  desc: ''
  tag: 合法 / 刺激劑
  items:
  - id: ch11.caffeine-energy-drinks.i01
    q: 咖啡因（caffeine）可能如何影響運動表現？
    a:
    - 是中樞神經刺激劑；教材提出的耐力機制是動員脂肪組織或肌內脂肪的游離脂肪酸，使肝醣耗竭變慢、疲勞延後。
    - 短時間高強度運動的主要推測機制是增強功率產生，可能涉及興奮－收縮耦聯、神經肌肉傳遞與肌漿網鈣離子動員。
    - 教材也說糖解調節酶（如 phosphorylase）動力學可能增強。
    detail: 耐力改善機制「不清楚」，其餘均為被提出或「被認為」的機制，不能改寫為已證實的單一路徑。
    terms: [caffeine, glycogen, epinephrine]
    numbers: []
    concepts:
    - ergogenic
    related:
    - ch03.oxidative.i04
    locator: Dietary Supplements > Stimulants > Caffeine
  - id: ch11.caffeine-energy-drinks.i02
    q: 咖啡因對有氧耐力的效果、劑量與水分結論為何？
    a:
    - 攝取 3–9 mg/kg 體重、約於運動前 60 分鐘或長時間運動中使用時，咖啡因具有增補效果；≥9 mg/kg 沒有額外效益。
    - 初期研究中，以 80% V̇O2max 騎乘的力竭時間從安慰劑 75 分鐘增至咖啡因 96 分鐘。
    - 教材不支持「運動中咖啡因利尿」或其造成傷害表現的體液平衡改變。
    detail: 3–9 mg/kg 是教材所述具效力的研究劑量範圍，而不是個別風險評估後的建議；高於 9 mg/kg 副作用風險更高。
    terms: [caffeine, vo2max]
