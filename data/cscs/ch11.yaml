id: ch11
weight: 11
title: Ch.11 增強表現物質與方法
topics:
- id: anabolic-steroids
  title: 合成代謝類固醇 Anabolic Steroids
  desc: ''
  tag: 禁藥 / 激素類
  items:
  - id: ch11.anabolic-steroids.i01
    q: 定義與來源
    a:
    - 睾固酮（testosterone）的合成衍生物
    - 主要在睪丸 Leydig 細胞分泌
    - 口服或注射兩大類型
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-steroids.i02
    q: 堆疊用法 (Stacking)
    a:
    - 同時使用多種藥物以加乘效果
    - 常見週期 5–10 週
    - 劑量為生理替代量的 5–29 倍
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-steroids.i03
    q: 金字塔用法 (Pyramid)
    a:
    - 劑量逐週遞增後再遞減
    - 末期加用促內生睪固酮藥物（如 HCG）以避免睪固酮崩落
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-steroids.i04
    q: 肌肉／肌力效果
    a:
    - 增加蛋白質合成 → 增加淨體重
    - 訓練有素運動員肌力增幅可達未使用者的 2–3 倍
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-steroids.i05
    q: 心理效果
    a:
    - 60% 使用者出現攻擊性與易怒
    - 可能提升激勵感與自信
    - 但有情緒波動與精神病發作風險
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-steroids.i06
    q: 心血管副作用
    a:
    - HDL↓（心臟病風險↑）
    - 血壓升高
    - 心肌功能下降
    - 脂質異常
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-steroids.i07
    q: 生殖系統副作用
    a:
    - 男：睪丸萎縮、精子數↓、不孕
    - 女：月經不規則、陰蒂肥大、聲音低沉、男性化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-steroids.i08
    q: 法律地位
    a:
    - 美國第三級管制物質（Schedule III）
    - 首次違規最高 1 年監禁＋,000 罰款
    - 販運最高 5 年＋,000
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: anabolic-supplements
  title: 合成代謝補充品 Anabolic Supplements
  desc: ''
  tag: 合法 / 肌力增長
  items:
  - id: ch11.anabolic-supplements.i01
    q: 肌酸機制 (Creatine)
    a:
    - 磷酸肌酸（PCr）為 ATP 再合成底物
    - 短時高強度運動的主要能量來源
    - 6 秒衝刺 PCr 減少 35–57%
    - 30 秒減少 64–80%
    - 補充可提升肌肉肌酸含量 ~20%
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-supplements.i02
    q: 肌酸劑量方案
    a:
    - 負荷期：20–25 g/day × 5 天（或 0.3 g/kg）
    - 維持期：2 g/day（0.03 g/kg）
    - 不負荷：約 30 天達相同肌酸量
    - 停用後約 4 週回到基線
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-supplements.i03
    q: 肌酸功效
    a:
    - 訓練有素運動員臥推、深蹲、爆發上舉肌力增幅可達未補充者的 2–3 倍
    - 增加淨體重 0.5–2 kg
    - 以訓練補充品效果優於單次表現增強
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-supplements.i04
    q: EAAs & BCAAs
    a:
    - 必需胺基酸（EAAs）才足以刺激肌肉蛋白合成（非必需胺基酸非必要）
    - 支鏈胺基酸（BCAAs）中白胺酸（leucine）是關鍵——透過 Akt/mTOR 路徑啟動蛋白合成
    - 訓練前 6g EAA 反應比訓練後高 158%
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-supplements.i05
    q: HMB 機制
    a:
    - β-羥基-β-甲基丁酸（HMB）為白胺酸代謝物
    - 刺激蛋白合成＋抑制蛋白分解（ubiquitin-proteasome 路徑）
    - 抗分解代謝效果在高訓練刺激時最顯著
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-supplements.i06
    q: HMB 功效
    a:
    - 未訓練者：顯著增加肌力與淨體重
    - 床位休息 10 天：HMB 3g 組只失去 0.17 kg vs 安慰劑 2.05 kg
    - 訓練有素者需高強度週期化訓練才有效果
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-supplements.i07
    q: Arginine（精胺酸）
    a:
    - 條件必需胺基酸
    - 一氧化氮（NO）的前驅物
    - 常見宣稱：增加 NO、肌肉血流、改善表現
    - 但研究顯示在健康人身上以上功效均無顯著支持
    - 不建議健康運動員使用
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.anabolic-supplements.i08
    q: L-肉鹼 (L-Carnitine)
    a:
    - 由離胺酸＋甲硫胺酸合成
    - 負責將脂肪酸運進線粒體氧化
    - 不直接增強脂肪利用
    - 但可能改善高強度訓練後的恢復（2g/day × 3 週）
    - 上調雄激素受體並保存 IGF-1
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: beta-agonists-stimulants
  title: β-促效劑 & 興奮劑 Beta-Agonists & Stimulants
  desc: ''
  tag: 部分禁 / 激素相關
  items:
  - id: ch11.beta-agonists-stimulants.i01
    q: β-促效劑機制
    a:
    - 化學上與腎上腺素（epinephrine）相關
    - 調節脂肪分解（lipolysis）與產熱（thermogenesis）
    - 原為氣喘治療藥物
    - 部分具分配劑效果（增肌減脂）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.beta-agonists-stimulants.i02
    q: Clenbuterol
    a:
    - β₂-促效劑
    - 支氣管擴張劑
    - 運動員用於增加淨肌肉量、減少皮下脂肪
    - 週期：3 週開/3 週關，開期採 2 天開/2 天關
    - 避免 β₂-受體下調
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.beta-agonists-stimulants.i03
    q: Clenbuterol 副作用
    a:
    - 心跳過速（tachycardia）、高熱（hyperthermia）、震顫、頭暈、心悸、失眠
    - 多數文獻僅限動物模型，人體數據有限
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.beta-agonists-stimulants.i04
    q: Ephedrine 機制
    a:
    - 另一 β-促效劑
    - 強效生熱作用
    - 常與咖啡因堆疊使用
    - 單獨使用效果不佳，需搭配咖啡因才顯著改善耐力
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.beta-agonists-stimulants.i05
    q: Ephedrine 禁用史
    a:
    - 2004 年 FDA 禁止所有含麻黃素（ephedra/ma huang）產品
    - Rand 研究所報告 16,000 起不良事件
    - IOC、大多數運動組織禁用
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.beta-agonists-stimulants.i06
    q: β-阻斷劑機制
    a:
    - 阻斷 β-腎上腺素受體 → 阻止兒茶酚胺結合
    - 降低心率與焦慮
    - 適合精準型運動（射擊、射箭）
    - NCAA 僅限步槍項目禁用
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.beta-agonists-stimulants.i07
    q: β-阻斷劑功效
    a:
    - 研究顯示可改善慢速與快速射擊精準度
    - 80 mg 效果優於 40 mg
    - 但對需要心血管輸出的耐力運動有負面影響（ergolytic）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.beta-agonists-stimulants.i08
    q: β-阻斷劑副作用
    a:
    - 支氣管痙攣、心臟衰竭、低血糖延長、心搏過緩（bradycardia）、心臟傳導阻滯、間歇性跛行
    - 降低 VO2max 與 10km 賽跑表現
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: caffeine-energy-drinks
  title: 咖啡因 & 能量飲 Caffeine & Energy Drinks
  desc: ''
  tag: 合法 / 刺激劑
  items:
  - id: ch11.caffeine-energy-drinks.i01
    q: 咖啡因機制
    a:
    - 中樞神經刺激劑
    - 耐力機制：促進游離脂肪酸動員 → 節省肝醣、延遲疲勞
    - 高強度機制：增強興奮收縮耦合、神經肌肉傳導、SR 鈣離子釋放、磷酸化酶活性
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.caffeine-energy-drinks.i02
    q: 咖啡因耐力功效
    a:
    - 3–9 mg/kg，運動前 ~60 分鐘服用
    - 初始研究：80% VO2max 騎車至力竭時間從 75 → 96 分鐘（+21 min）
    - 有氧耐力增益 28–43%（純錠劑形式）
    - 咖啡中可能有拮抗成分
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.caffeine-energy-drinks.i03
    q: 咖啡因爆發功效
    a:
    - 對衝刺／爆發力效果較不確定
    - 精英柔道選手（5 mg/kg）峰值功率顯著改善
    - 競技游泳（250 mg）100m 重複衝刺改善 3%
    - 效果可能只在訓練有素運動員出現
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.caffeine-energy-drinks.i04
    q: 咖啡因副作用
    a:
    - 焦慮、腸胃不適、失眠、震顫、心律不整
    - 具生理成癮性，戒斷症狀：頭痛、疲勞、情緒低落
    - 致死劑量 >5g（約 42 杯咖啡）
    - ≥9 mg/kg 副作用風險顯著上升
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.caffeine-energy-drinks.i05
    q: 能量飲成分
    a:
    - 主要成分：咖啡因＋碳水化合物（主要麥角原）
    - 其他常見：B 群維生素、酪胺酸（tyrosine）、銀杏（ginkgo biloba）
    - 協同作用可能解釋為何 2 mg/kg（低於建議量）仍有效
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.caffeine-energy-drinks.i06
    q: 能量飲功效
    a:
    - 運動前 60 分鐘攝入 2 mg/kg 咖啡因：顯著增加臥推總量
    - 改善上下肢訓練總量
    - 改善騎車與跑步耐力
    - 但 Wingate 無氧測試與速度敏捷性無顯著改善
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.caffeine-energy-drinks.i07
    q: 能量飲安全疑慮
    a:
    - 與酒精混合使用風險高（掩蓋醉意）
    - 大量攝入仍可能咖啡因過量
    - 多數含 <300 mg 咖啡因（屬中等量）
    - 其他刺激劑的加乘效應尚待研究
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.caffeine-energy-drinks.i08
    q: Citrus Aurantium（苦橙）
    a:
    - 含辛弗林（synephrine）
    - 適度興奮劑
    - 抑制食慾、增加代謝率與脂肪分解
    - 單獨效果不足
    - 與咖啡因＋草本混合可改善耐疲勞時間
    - NCAA 禁用（列於刺激劑類）
    - 可能升高收縮壓
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: epo-blood-doping
  title: EPO & 血液興奮劑 EPO & Blood Doping
  desc: ''
  tag: 禁藥 / 血液類
  items:
  - id: ch11.epo-blood-doping.i01
    q: EPO 定義
    a:
    - 紅血球生成素（Erythropoietin）
    - 由腎臟分泌
    - 刺激紅血球新生
    - 可用重組 DNA 技術製造（rEPO）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.epo-blood-doping.i02
    q: EPO 功效數據
    a:
    - 6 週治療後：血容比（hematocrit）44.5% → 50%
    - 血紅素↑ 10%
    - 最大攝氧量↑ 6–8%
    - 力竭時間↑ 17%
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.epo-blood-doping.i03
    q: 血液輸注類型
    a:
    - 自體（autologous）：輸自己預存血
    - 異體（homologous）：輸相同血型他人血液
    - 1980 年代後 EPO 漸取代輸血
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.epo-blood-doping.i04
    q: 適用運動類型
    a:
    - 耐力型運動員（自行車、長跑、鐵人三項）最大受益
    - EPO 提升攜氧能力 → 延遲疲勞
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.epo-blood-doping.i05
    q: EPO 主要風險
    a:
    - 紅血球數↑ → 血液黏稠度↑ → 血栓風險↑、收縮壓↑、中風、肺/腦栓塞
    - 脫水時風險更高
    - 不可預測性是最大危險
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.epo-blood-doping.i06
    q: 不可預測性問題
    a:
    - 注射 EPO 後紅血球生成不再受身體控制（不像輸血可量化）→ 過量不可逆 → 已有多名職業自行車選手死亡
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.epo-blood-doping.i07
    q: 偵測與禁用
    a:
    - WADA 禁用
    - 血液與尿液均可偵測
    - Lance Armstrong 承認整個職業生涯使用 EPO
    - 屬 NCAA F 類（肽激素）禁藥
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.epo-blood-doping.i08
    q: 合法應用
    a:
    - 腎臟病患者貧血的醫療治療
    - 腎臟無法充分製造 EPO 的患者使用可改善生活品質
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: insulin-hgh
  title: 胰島素 & 生長激素 Insulin & HGH
  desc: ''
  tag: 禁藥 / 合成激素
  items:
  - id: ch11.insulin-hgh.i01
    q: 胰島素機制
    a:
    - 胰臟分泌
    - 促進葡萄糖與胺基酸進入細胞
    - 增加蛋白質合成 → 合成代謝激素
    - 訓練後碳水化合物攝入可透過胰島素抑制肌肉蛋白分解
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.insulin-hgh.i02
    q: 胰島素濫用風險
    a:
    - 部分健美選手注射胰島素以增肌
    - 風險極高：可能立即死亡、昏迷或發展為胰島素依賴型糖尿病
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.insulin-hgh.i03
    q: HGH 來源與機制
    a:
    - 前腦垂體（anterior pituitary）分泌的蛋白質激素
    - 促進骨骼與肌肉生長（合成代謝）
    - 維持血糖、促進脂肪分解
    - 現以重組 DNA 技術合成
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.insulin-hgh.i04
    q: HGH 體組成效果
    a:
    - 缺乏症成人：6 個月注射後淨體重 +5.4 kg、體脂 -5.4 kg
    - 但運動員族群研究有倫理限制，缺乏直接證據
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.insulin-hgh.i05
    q: IGF-1 關聯
    a:
    - HGH 的許多作用透過胰島素樣生長因子-1（IGF-1）介導
    - 由肝臟回應 HGH 刺激分泌
    - 重組 IGF-1 已可商業製造
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.insulin-hgh.i06
    q: HGH 副作用
    a:
    - 童年期過多：巨人症（gigantism）
    - 成人期過多：肢端肥大症（acromegaly）——骨骼變寬、關節炎、器官肥大
    - 高劑量風險：糖尿病、高血壓、心血管功能異常
