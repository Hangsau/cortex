    locator: Dietary Supplements > β-Hydroxy-β-Methylbutyrate > Efficacy
  - id: ch11.anabolic-supplements.i07
    q: 精胺酸（arginine）對健康運動員的效果與耐受性為何？
    a:
    - 精胺酸是條件必需胺基酸，參與蛋白質與肌酸合成，代謝時會產生一氧化氮（nitric oxide）。
    - 對健康者而言，絕大多數研究不支持口服精胺酸使一氧化氮生成高於運動本身、增加肌肉血流，或改善力竭時間、局部肌耐力與間歇無氧表現。
    - 因此教材不建議健康運動員使用；但有心血管疾病風險因子或糖尿病者可能受益於一氧化氮生成增加，不能把健康者的結論外推給該族群。
    detail: 多數運動表現研究使用 6 g，該劑量耐受良好但無效；口服最高 13 g 通常耐受良好，而 13–30 g 的較高劑量常見噁心、腹部絞痛與腹瀉。這些是耐受性報告，不是運動表現建議。
    terms:
    - arginine
    - conditionally-essential-amino-acid
    - nitric-oxide
    - creatine
    numbers:
    - v: 6
      unit: g
      of: 多數精胺酸運動表現研究使用的單次劑量
    - v: 13
      unit: g
      of: 教材所述一般仍可良好耐受的口服精胺酸上限
    - v: 13–30
      unit: g
      of: 較常出現腸胃不適的口服精胺酸較高劑量範圍
