  - id: ch11.anabolic-steroids.i05
    q: 合成代謝類固醇與心理變化有何關聯？
    a:
    - 使用與攻擊性、喚醒程度及易怒改變有關聯；喚醒與自尊提高可能被使用者視為正向副作用。
    - 研究顯示近 60% 使用者出現易怒與攻擊性增加；也與情緒擺盪及精神病性發作有關。
    - 因果關係尚未確認；教材指出，出現心理或行為改變者在停用後似乎會恢復。
    detail: 12 週睾固酮環戊丙酸酯的雙盲交叉研究中，明顯心理效應只出現在少數受試者，反應並不一致；因此「可能」與「有關聯」不能改寫成人人都會發生的因果斷言。
    terms:
    - anabolic-steroid
    - arousal
    numbers:
    - v: 60
      unit: '%'
      of: 研究中出現易怒與攻擊性增加的類固醇使用者比例（近似值）
    concepts:
