- id: muscle-buffering
  title: 肌肉緩衝補充品 Muscle Buffering Supplements
  desc: ''
  tag: 合法 / 無氧表現
  items:
  - id: ch11.muscle-buffering.i01
    q: 肌肉緩衝容量 MBC
    a:
    - 高強度無氧運動 → H⁺ 大量累積 → pH↓ → 影響表現
    - 肌肉緩衝容量（Muscle Buffering Capacity）可透過訓練或補充品提升
    - 與反覆衝刺、無氧閾值等呈正相關
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.muscle-buffering.i02
    q: β-丙胺酸機制
    a:
    - β-Alanine 為肌肽（carnosine）合成的速率限制底物
    - 4–6 g/day × 4 週 → 骨骼肌 β-丙胺酸↑ 64%
    - 肌肽主要在 Type II（快縮）肌纖維，貢獻最多 40% 的 H⁺ 緩衝
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch11.muscle-buffering.i03
    q: β-丙胺酸功效
    a:
    - 不改善最大肌力或有氧功率
    - 但改善無氧閾值
    - 適用於超過 60 秒的多組高強度間歇（如 400m 衝刺、格鬥運動）
    - 第 10 週總功增加 16%
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
