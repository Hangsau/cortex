    locator: Hormones > Testosterone Precursors (Prohormones)
  - id: ch11.prohormones-hcg.i04
    q: 人類絨毛膜促性腺激素（human chorionic gonadotropin, HCG）是什麼？
    a:
    - HCG 是從孕婦胎盤取得的激素，在結構與功能上很接近黃體生成素（luteinizing hormone, LH）。
    - 因一般只有懷孕時才可在體內發現，它是市售驗孕試劑使用的懷孕指標。
    - HCG 可皮下注射或肌肉注射。
    detail: 它與 LH 類似，不表示它就是 LH；教材以孕婦來源及驗孕指標說明其生理背景。
    terms: [human-chorionic-gonadotropin, luteinizing-hormone]
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
    - ch04.endocrinology-basics.i07
    - ch04.testosterone.i01
    locator: Hormones > HCG (Human Chorionic Gonadotropin)
  - id: ch11.prohormones-hcg.i05
    q: HCG 為何可能被男性類固醇使用者採用？
    a:
    - 注射到男性時，HCG 可提高睪丸睾固酮生成；大劑量肌肉注射後四天內，睾固酮濃度可接近加倍。
    - 原因是 HCG 模擬 LH，刺激睪丸 Leydig 細胞製造睾固酮。
    - 教材推測，運動員若使用 HCG，可能是在類固醇週期結束、內源性睾固酮受抑制時，企圖恢復自身睾固酮生成。
    detail: 最後一點是教材的「likely」推測，不是已調查確認的使用模式；四天數字也限定為大劑量肌肉注射。
    terms: [human-chorionic-gonadotropin, luteinizing-hormone, testosterone, anabolic-steroid]
    numbers:
    - v: 4
      unit: 天
      of: 大劑量 HCG 肌肉注射後睾固酮濃度可接近加倍的時間
    concepts:
