  - id: ch11.beta-agonists-stimulants.i06
    q: β-阻斷劑（β-blockers）的作用與可能適用情境為何？
    a:
    - 阻斷 β-腎上腺素受體，防止兒茶酚胺（去甲腎上腺素與腎上腺素）結合；常用於治療心血管疾病。
    - 可能藉降低焦慮與顫抖，使依賴穩定受控動作的射箭或射擊選手受益。
    - 教材也提出未確定的可能性：若補充使 β 受體上調，停用後激烈運動的交感神經反應可能加強。
    detail: 「可能」「看似」與「若為真」是教材的證據強度，不能改成已證實的運動適應或把降心率當作直接表現機制。
    terms: [beta-blocker, catecholamine, norepinephrine, epinephrine, anxiety]
    numbers: []
    concepts:
    - ergogenic
    related:
    - ch04.catecholamines.i02
    - ch01.cardiovascular.heart-rate
    locator: Hormones > β-Blockers
  - id: ch11.beta-agonists-stimulants.i07
    q: β-阻斷劑對射擊準確度的研究結果為何？
    a:
    - 多項研究顯示 β-阻斷劑可改善慢速與快速射擊的準確度。
    - 射手使用兩種 oxprenolol 劑量時，80 mg 組比 40 mg 組更準。
    - 教材提醒某些運動需要部分焦慮；保齡球選手並非都會在阻斷下進步。
    detail: 劑量比較是特定射手與 oxprenolol 的結果，不能普遍化為其他 β-阻斷劑或全部精準任務的劑量反應。
    terms: [beta-blocker]
    numbers:
    - v: 80
      unit: mg
      of: 射手研究中較高的 oxprenolol 劑量
    - v: 40
      unit: mg
      of: 射手研究中較低的 oxprenolol 劑量
    concepts:
    - ergogenic
    related:
