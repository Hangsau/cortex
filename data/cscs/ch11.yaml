  - id: ch11.muscle-buffering.i04
    q: β-丙胺酸的已報告不良反應與劑量安排為何？
    a:
    - 發表文獻的每日攝取量為 2.4–6.4 g，常分成 2–4 小劑量。
    - 唯一已報告不良反應是感覺異常（paresthesia），即皮膚刺痛、刺癢或麻木感。
    - 它由高的急性單次劑量觸發，攝取後約 1 小時內消失；分次策略用於預防此反應。
    detail: 教材稱其為唯一「reported」不良反應，不代表已證實長期使用完全沒有風險；原文也沒有在此宣告它的禁藥身分。
