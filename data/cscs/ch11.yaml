    locator: Dietary Supplements > Essential Amino Acids, Branched-Chain Amino Acids > Efficacy
  - id: ch11.anabolic-supplements.i06
    q: β-羥基-β-甲基丁酸（β-hydroxy-β-methylbutyrate, HMB）的效果有何條件？
    a:
    - HMB 是 EAA 白胺酸及其代謝物 α-ketoisocaproic acid 的衍生物；證據顯示它刺激蛋白質合成，並藉由抑制 ubiquitin–proteasome 路徑降低蛋白質分解。
    - 未受訓者開始 4–8 週阻力訓練時，HMB 相對安慰劑曾顯示較大的力量與除脂體重改善；臥床 10 天研究中，每日 3 g 組減少 0.17 kg 除脂體重，安慰劑組減少 2.05 kg。
    - 受訓者的增補效果較不確定；教材認為對受訓者，可能必須有高強度、高訓練量且週期化的阻力訓練，才會顯現效益。
    detail: 「最適用於受訓者」不是教材原意。它的結論是未受訓者的結果較一致；在受訓者，短期、未提供充分刺激的研究未複製結果，而有適當訓練刺激的研究才報告改善。
    terms:
    - hmb
    - muscle-protein-synthesis
    - fat-free-mass
    numbers:
    - v: 4–8
      unit: 週
      of: 未受訓者開始阻力訓練、HMB 顯示較大力量與除脂體重改善的研究期間
