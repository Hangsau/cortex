  - id: ch11.prohormones-hcg.i03
    q: 前驅激素的生理風險與證據邊界為何？
    a:
    - androstenedione 補充曾提高血清 estradiol 與 estrone，並與較低 HDL 有關。
    - Andro Project 的結論是：依製造商建議量攝取前驅激素不增強阻力訓練適應，卻會提高雌激素相關化合物與 DHEA sulfate、下調睾固酮合成，並使男性血脂及冠心病風險概況惡化。
    - 科學研究主要只涵蓋少數前驅激素，未臨床檢驗的產品很多；高度訓練運動員與非口服途徑仍未充分研究。
    detail: 前驅激素「遠不及雄性素的合成代謝效果」是教材依現有證據的結論，但它同時明確保留產品種類、受試族群與口服途徑的研究缺口。
    terms: [prohormone, androstenedione, dehydroepiandrosterone, high-density-lipoprotein, testosterone]
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
