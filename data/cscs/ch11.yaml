  - id: ch11.anabolic-steroids.i08
    q: 教材所述美國合成代謝類固醇的法律身分與刑罰為何？
    a:
    - 合成代謝類固醇是 Class III（第三級）物質；非醫療用途持有，首次違規最高可判 1 年監禁，最低罰鍰為 US$1,000。
    - 首次重罪販運最高可判 5 年監禁及 US$250,000 罰鍰；第二次重罪時，最高監禁期與最高罰鍰皆加倍。
    - 以上是聯邦違規的刑罰；各州另有非法使用的罰鍰與處罰。
    detail: 這是教材所載的美國聯邦法規敘述，不可套用其他國家、州或後續更新的法規；「最高 1 年」與「最低 US$1,000」分別是不同的刑罰界線。
    terms:
    - anabolic-steroid
