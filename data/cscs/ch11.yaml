    locator: Dietary Supplements > Stimulants > Preworkout Energy Drinks > Efficacy
  - id: ch11.caffeine-energy-drinks.i07
    q: 能量飲的安全疑慮與未解問題為何？
    a:
    - 安全問題似乎與過量咖啡因及能量飲與酒精混用的有害效果有關。
    - 多數能量飲的咖啡因量低於 300 mg，但仍可能因飲用而咖啡因過量。
    - 其他成分與刺激劑會如何改變副作用閾值，仍未知；慣常於運動前飲用的長期效果仍需研究。
    detail: 教材沒有說能量飲「掩蓋醉意」；它只指出混酒的有害效果，以及在含其他成分時尚無法下定論。
    terms: [energy-drink, caffeine]
    numbers:
    - v: 300
      unit: mg
      of: 教材所述多數能量飲咖啡因含量低於的量
    concepts:
    - ergogenic
    locator: Dietary Supplements > Stimulants > Preworkout Energy Drinks > Adverse Effects
  - id: ch11.caffeine-energy-drinks.i08
    q: 苦橙（Citrus aurantium）的效力與安全證據為何？
    a:
    - 苦橙是常用於治療消化問題的亞洲草藥，也是一種溫和刺激劑；它被認為有助於抑制食慾、提高代謝率與脂肪分解。
    - 與咖啡因及其他草藥合用時，曾報告疲勞時間改善；單獨使用的發表資料不足，教材不建議作為增補品。
    - 活性成分辛弗林（synephrine）被認為作用於 β3 受體；單獨攝取未見血壓效果，但與其他草藥併用可能明顯提高收縮壓。辛弗林在 NCAA 禁藥清單中。
    detail: 受體選擇性、脂肪分解和心血管效應都保留教材的「被認為」或研究衝突；組合產品的結果不能當成苦橙單獨效果。
    terms: [citrus-aurantium, synephrine, caffeine, lipolysis]
    numbers: []
    concepts:
    - ergogenic
    related:
    - ch04.catecholamines.i02
    locator: Dietary Supplements > Stimulants > Citrus Aurantium > Efficacy
- id: epo-blood-doping
  title: EPO & 血液興奮劑 EPO & Blood Doping
  desc: ''
  tag: 禁藥 / 血液類
  items:
  - id: ch11.epo-blood-doping.i01
    q: 促紅血球生成素（erythropoietin, EPO）與血液摻假是什麼？
    a:
    - EPO 由腎臟產生，會刺激新的紅血球生成；可用重組 DNA 技術製造。
    - 血液摻假（blood doping）以人工方式提高血液攜氧能力，包括輸血與施用 EPO。
    - EPO 血中濃度會因長期有氧耐力運動而升高；腎臟病患者若 EPO 製造不足，重組人類 EPO 可改善生活品質。
    detail: 教材同時列出耐力訓練的自然變化與藥物施用，不能將運動本身造成的 EPO 反應當成血液摻假。
    terms: [erythropoietin, blood-doping]
    numbers: []
    concepts:
    - ergogenic
    - circulation
    related:
    - ch01.cardiovascular.blood
    - ch06.external-factors.i06
    locator: Hormones > Erythropoietin
  - id: ch11.epo-blood-doping.i02
    q: EPO 在正常男性六週研究的效果數據為何？
    a:
    - 六週治療後，血比容（hematocrit）由 44.5% 上升至 50%，血紅素濃度上升 10%。
    - 有氧能力上升 6–8%，力竭時間最多改善 17%。
    - 教材因此稱其增強血液攜氧能力，對有氧耐力運動員是有效的增補劑。
    detail: 這些是正常男性接受 EPO 六週的研究結果；「最多 17%」不能寫成所有人都固定增加 17%。
    terms: [erythropoietin, hematocrit, hemoglobin]
    numbers:
    - v: 6
      unit: 週
      of: 正常男性 EPO 治療研究的期間
    - v: 44.5
      unit: '%'
      of: 該研究治療前血比容
    - v: 50
      unit: '%'
      of: 該研究 EPO 治療後血比容
    - v: 10
      unit: '%'
      of: 該研究 EPO 治療後血紅素濃度增加幅度
    - v: 6–8
      unit: '%'
      of: 該研究 EPO 治療後有氧能力增加幅度
    - v: 17
      unit: '%'
      of: 該研究 EPO 治療後力竭時間最多改善幅度
    concepts:
    - ergogenic
    - circulation
    related:
    - ch06.acute-cardiovascular.i04
    - ch13.aerobic-capacity.i01
    locator: Hormones > Erythropoietin > Efficacy
  - id: ch11.epo-blood-doping.i03
    q: 自體與異體血液摻假的定義為何？
    a:
    - 自體血液摻假（autologous blood doping）是輸回自己預先冷藏或冷凍保存的血液。
    - 異體血液摻假（homologous blood doping）是輸入同血型他人的血液。
    - 1980 年代末期以後，自體輸血逐漸讓位給較常使用的重組人類 EPO。
    detail: 兩者的差異是血液來源，不是採血或保存方法；教材只說自體輸血在 1980 年代末後相對退居次要地位。
    terms: [blood-doping, erythropoietin]
    numbers: []
    concepts:
    - ergogenic
    - circulation
    related:
    - ch06.external-factors.i06
    - ch01.cardiovascular.blood
    locator: Hormones > Erythropoietin
  - id: ch11.epo-blood-doping.i04
    q: EPO 的增補作用適用於何種運動需求？
    a:
    - EPO 增加紅血球數與血液攜氧能力。
    - 教材將它定位為有氧耐力運動員的有效增補劑。
    - 這與需要將氧氣送到收縮骨骼肌的耐力表現限制因素相對應。
    detail: 教材沒有在此段列出特定運動項目或宣稱所有運動都受益；效益的生理前提是有氧耐力需求。
    terms: [erythropoietin, hemoglobin]
    numbers: []
    concepts:
    - ergogenic
    - circulation
    related:
    - ch20.aerobic-performance-factors.i01
    locator: Hormones > Erythropoietin > Efficacy
  - id: ch11.epo-blood-doping.i05
    q: EPO 增加血比容的主要風險機制為何？
    a:
    - 紅血球增加會使血液黏稠度增加，導致血栓風險、收縮壓、中風及腦部或肺部栓塞風險上升。
    - 有氧耐力賽事的脫水，會使血比容升高帶來的心血管風險更加嚴重。
    - 教材把可能死亡的顯著心血管風險列為耐力選手應避免此藥的理由。
    detail: 對腎病貧血的醫療監督使用與為競爭優勢的濫用不同；本條的風險敘述針對後者。
    terms: [erythropoietin, hematocrit, blood-viscosity, dehydration]
    numbers: []
    concepts:
    - ergogenic
    - circulation
    related:
    - ch01.cardiovascular.blood
    - ch09.hydration.i02
    locator: Hormones > Erythropoietin > Adverse Effects
  - id: ch11.epo-blood-doping.i06
    q: 為何教材說 EPO 比紅血球輸注更不可預測？
    a:
    - EPO 注入後，刺激紅血球生成的訊號不再可控制。
    - 教材以此對比紅血球輸注，稱 EPO 的主要風險是缺乏可預測性。
    - 教材提到多名競技自行車選手的死亡與 EPO 施用有關。
    detail: 原文是「related to」而非宣告個案死因已完全確定；也沒有說「過量不可逆」。
    terms: [erythropoietin, blood-doping]
    numbers: []
    concepts:
    - ergogenic
    - circulation
    related:
    - ch06.external-factors.i06
    locator: Hormones > Erythropoietin > Adverse Effects
  - id: ch11.epo-blood-doping.i07
    q: 教材列出的 NCAA 禁藥分類如何處理 EPO？
    a:
    - 教材的 2013–2014 NCAA 禁藥類別表，將 EPO 列在 F 類「胜肽激素及其類似物」。
    - 教材並提到 Lance Armstrong 承認在其自行車生涯中使用 EPO。
    - 各組織的禁用清單會不同且會更新，運動員與支持人員應遵循所屬組織。
    detail: 原文在 EPO 段沒有宣稱「血液與尿液都可偵測」；此表是 2013–2014 NCAA 表格，不應當作所有年度或組織的清單。
    terms: [erythropoietin]
    numbers: []
    concepts:
    - ergogenic
    - circulation
    related:
    - ch24.facility.i06
    locator: Types of Performance-Enhancing Substances > Definition of Products That Can Be Sold as Dietary Supplements
  - id: ch11.epo-blood-doping.i08
    q: EPO 的醫療用途為何？
    a:
    - 腎臟病患者若因 EPO 製造不足而有特定類型的貧血，重組人類 EPO 可改善生活品質。
    - 教材以此醫療用途對照為競賽優勢而濫用的情境。
    detail: 教材只指出此類腎病相關貧血的治療益處，不能延伸成對所有貧血或健康者的適應症。
    terms: [erythropoietin, anemia]
    numbers: []
    concepts:
    - ergogenic
    - circulation
    related:
    - ch01.cardiovascular.blood
    - ch24.legal.i07
    locator: Hormones > Erythropoietin
- id: insulin-hgh
  title: 胰島素 & 生長激素 Insulin & HGH
  desc: ''
  tag: 禁藥 / 合成激素
  items:
  - id: ch11.insulin-hgh.i01
    q: 胰島素（insulin）的作用與運動後意義為何？
    a:
    - 胰島素是胰臟對血糖或特定胺基酸（如白胺酸）升高的分泌反應，會促進葡萄糖與胺基酸進入細胞。
    - 因增加蛋白質合成而被視為強力合成代謝激素。
    - 健康者自然升高的胰島素沒有安全疑慮；運動後攝取碳水化合物可藉其抗分解作用抑制肌肉蛋白分解。
    detail: 教材只提出：若數週到數月持續抑制蛋白分解，理論上可能增加瘦肌肉量；這不是對外源注射或長期結果的實證斷言。
    terms: [insulin, bcaa, muscle-protein-synthesis]
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
    - ch04.endocrinology-basics.i07
    - ch10.post-competition.i01
    locator: Hormones > Insulin > Efficacy
  - id: ch11.insulin-hgh.i02
    q: 健康運動員注射胰島素的風險為何？
    a:
    - 部分人（主要是健美者）會因胰島素的合成代謝性質及其據傳可增強生長激素與類胰島素生長因子效果而注射。
    - 原本健康的運動員可能立即死亡、昏迷或發展為胰島素依賴型糖尿病。
    detail: 教材將這些列為嚴重可能後果；不能以自然胰島素反應安全，就推論自行注射安全。
    terms: [insulin, growth-hormone, insulin-like-growth-factor-i]
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
    - ch12.safety.i01
    - ch24.legal.i07
    locator: Hormones > Insulin > Adverse Effects
  - id: ch11.insulin-hgh.i03
    q: 人類生長激素（human growth hormone, HGH）的來源與作用為何？
    a:
    - HGH 是腦下垂體前葉分泌的蛋白質激素，可刺激骨與骨骼肌生長。
    - 其代謝功能包括維持血糖、促進葡萄糖與胺基酸進入肌肉細胞，以及刺激脂肪細胞釋放脂肪酸。
    - 藥理性 HGH 現可用重組 DNA 技術合成；1986 年前只能取自人類遺體的腦下垂體。
    detail: 重組 HGH 的出現讓臨床取得量增加且相較遺體來源風險較低；教材不因此判定運動員濫用安全。
    terms: [human-growth-hormone, fatty-acid]
    numbers:
    - v: 1986
      unit: 年
      of: 教材所述 HGH 來源由人類遺體轉為可重組製造前的界線年份
    concepts:
    - ergogenic
    - hormone
    related:
    - ch04.growth-hormone.i03
    - ch04.igf.i01
    locator: Hormones > Human Growth Hormone
  - id: ch11.insulin-hgh.i04
    q: HGH 對運動員的效力證據與替代治療結果為何？
    a:
    - 專業運動員使用 HGH 的效力似乎沒有研究；多數研究是缺乏生長激素的成人、兒童或健康高齡者。
    - 替代治療研究一貫顯示體組成改善；缺乏生長激素的男性每晚注射六個月，平均增加 5.4 kg 瘦體重並有相似量的脂肪減少。
    - 多數研究沒有測量力量與表現；一項 12 個月治療研究未見等速肌力改變，且受試者未阻力訓練。
    detail: 替代治療與健康運動員濫用不是同一族群或劑量。教材的結論是科學文獻不支持運動員族群的 HGH 效力，倫理限制也使此問題難以研究。
    terms: [human-growth-hormone, lean-body-mass]
    numbers:
    - v: 6
      unit: 個月
      of: 生長激素缺乏男性每晚接受重組 HGH 替代治療的期間
    - v: 5.4
      unit: kg
      of: 該替代治療研究平均增加的瘦體重，也是相似脂肪減少量
    - v: 12
      unit: 個月
      of: 未見等速肌力改變的 HGH 治療研究期間
    concepts:
    - ergogenic
    - hormone
    related:
    - ch04.growth-hormone.i07
    locator: Hormones > Human Growth Hormone > Efficacy
  - id: ch11.insulin-hgh.i05
    q: HGH 與第一型類胰島素生長因子（IGF-I）的關聯為何？
    a:
    - 許多生長激素作用由 IGF-I 介導。
    - IGF-I 是肝臟回應 HGH 刺激後產生與分泌的另一種胜肽激素。
    - IGF-I 也已可用重組 DNA 技術合成，教材說它可能會有與 HGH 相同的效果。
    detail: 「可能」是教材對重組 IGF-I 效果的限定；本段沒有提供運動員效力研究。
    terms: [human-growth-hormone, insulin-like-growth-factor-i]
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
    - ch04.igf.i01
    - ch04.growth-hormone.i03
    locator: Hormones > Human Growth Hormone > Efficacy
  - id: ch11.insulin-hgh.i06
    q: HGH 過度分泌與濫用的風險為何？
    a:
    - 兒童期過量分泌會造成巨人症；青春期後線性生長停止時，過量分泌會造成肢端肥大症。
    - 肢端肥大症以骨骼變寬、關節炎、器官肥大與代謝異常為特徵。
    - 教材列出的濫用副作用包括易感者糖尿病、心血管功能異常、肌肉／關節／骨疼痛、高血壓、器官異常生長與加速性骨關節炎。
    detail: 缺乏 HGH 的成人接受最多兩年替代治療時副作用似乎很少，但運動員通常用量遠高於替代劑量；不能以替代治療安全性外推運動員。
    terms: [human-growth-hormone, gigantism, acromegaly]
    numbers:
    - v: 2
      unit: 年
      of: 教材所述 HGH 缺乏成人替代治療副作用似乎仍很少的最長期間
    concepts:
    - ergogenic
    - hormone
    related:
    - ch07.children-growth.i07
    locator: Hormones > Human Growth Hormone > Adverse Effects
  - id: ch11.insulin-hgh.i07
    q: 教材如何描述 HGH 的檢測限制？
    a:
    - 教材指出 HGH 無法透過尿液藥檢檢出，並推測這可能是運動員選用的原因之一。
    - HGH 血液檢測於 2004 年希臘雅典夏季奧運首次引入。
    - 這一段沒有說所有運動員都使用 HGH，只指出過去某些職業運動可能因其被認為有效且當時難以檢測而流行。
    detail: 「可能」「被推測」是關鍵限定；不能把尿液檢測限制延伸成血液也無法檢出。
    terms: [human-growth-hormone]
    numbers:
    - v: 2004
      unit: 年
      of: HGH 血液檢測首次於雅典夏季奧運引入的年份
    concepts:
    - ergogenic
    - hormone
    locator: Hormones > Human Growth Hormone > Efficacy
  - id: ch11.insulin-hgh.i08
    q: 教材所述 HGH 的取得、醫療用途與費用為何？
    a:
    - 臨床醫師可開立重組 HGH，以增加生長激素缺乏且身材矮小兒童的身高，並改變成人的體組成。
    - 即使重組技術提高可得性，黑市每月費用仍極高，為數百至數千美元。
    - 教材說專業運動員使用被認為廣泛，可能單獨使用或與合成代謝類固醇堆疊。
    detail: 「被認為廣泛」不是盛行率估計，也不等於效力已確立。原文此處沒有把 WADA 的現行禁用身分作為事實主張。
    terms: [human-growth-hormone, anabolic-steroid, stacking]
    numbers:
    - v: 數百至數千
      unit: 美元/月
      of: 教材所述 HGH 黑市每月費用範圍
    concepts:
    - ergogenic
    - hormone
    related:
    - ch24.legal.i07
    locator: Hormones > Human Growth Hormone
- id: muscle-buffering
  title: 肌肉緩衝補充品 Muscle Buffering Supplements
  desc: ''
  tag: 合法 / 無氧表現
  items:
  - id: ch11.muscle-buffering.i01
    q: 肌肉緩衝容量（muscle buffering capacity, MBC）為何重要？
    a:
    - 高強度無氧運動會累積氫離子（H+）、降低骨骼肌 pH，並被證實會不利於表現。
    - 調節高強度運動中肌肉 H+ 濃度的能力稱為 MBC。
    - MBC 與反覆衝刺能力、高強度運動容量、無氧閾值與訓練量呈強正相關。
    detail: 教材說透過訓練或 β-丙胺酸、碳酸氫鈉、檸檬酸鈉改善 MBC「理論上」可改善受 H+ 累積限制的活動表現，並非每種運動皆有效。
    terms: [muscle-buffering-capacity]
    numbers: []
    concepts:
    - ergogenic
    - energy-supply
    related:
    - ch03.lactate.i02
    - ch05.fiber-type-transitions.i08
    locator: Dietary Supplements > Nutritional Muscle Buffers
  - id: ch11.muscle-buffering.i02
    q: β-丙胺酸（β-alanine）如何影響肌肉緩衝？
    a:
    - β-丙胺酸是非必需胺基酸，本身增補特性有限，但在肌細胞是肌肽（carnosine）合成的速率限制受質。
    - 補充 4 週、每日 4–6 g 時，骨骼肌 β-丙胺酸濃度平均增加 64%。
    - 人體肌肽主要位於第二型肌纖維，估計可貢獻激烈無氧運動產生 H+ 的骨骼肌 MBC 最多 40%。
    detail: 增加肌肽、提升 MBC 與改善無氧表現是教材的理論鏈結；較高肌肽濃度也只是「似乎」見於短跑和健美選手，不是因果證明。
    terms: [beta-alanine, carnosine, muscle-buffering-capacity, fast-twitch]
