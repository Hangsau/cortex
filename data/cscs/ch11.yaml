  - id: ch11.anabolic-supplements.i03
    q: 肌酸補充的效力、體重改變與副作用證據為何？
    a:
    - 多數研究相當一致地發現肌酸能帶來力量表現的增補效果；訓練者的臥推、深蹲與 power clean 力量增益可能為安慰劑組的 2–3 倍。
    - 長期補充通常與除脂體重增加有關；訓練數週到數月時，體重或除脂體重通常多增加 0.5–2 kg。肌酸較像促進訓練適應的補充品，而非一次爆發動作的直接增強物。
    - 受控研究未能記錄顯著副作用；短期 5 天至長期最長 5 年的使用，皆未報告腎功能異常。
    detail: 五天負荷研究多未發現單次衝刺或跳躍進步，延長至 28–84 天的研究才看到跳躍與爆發力改善，支持教材的「訓練補充品」定位。體重增加可能部分涉及細胞內水分，也可能涉及收縮蛋白合成，不能只歸因於水分。
    terms:
