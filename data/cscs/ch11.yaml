  - id: ch11.caffeine-energy-drinks.i04
    q: 咖啡因的副作用、戒斷與過量風險為何？
    a:
    - 可能有焦慮、腸胃不適、不安、失眠、顫抖與心律不整；停止後可有頭痛、疲勞、情緒低落、難以專注及類流感症狀。
    - 咖啡因具生理成癮性；攝取超過 9 mg/kg 時副作用風險看來較高。
    - 教材所述典型致死量超過 5 g，約等於每杯含 120 mg 時的 42 杯咖啡，或 25 錠每錠 200 mg 的咖啡因錠。
    detail: 致死量是教材的典型估計，不可當作個人安全界線；錠劑與飲品的咖啡因濃度、累積攝取與個人狀況皆不同。
