    locator: Hormones > HCG (Human Chorionic Gonadotropin) > Efficacy
  - id: ch11.prohormones-hcg.i06
    q: HCG 用於女性體重減輕的研究結論為何？
    a:
    - 教材說 HCG 對女性沒有增補表現能力。
    - 在一般人口中，有時會由醫療監督為過重女性注射 HCG 並搭配低熱量飲食減重。
    - 研究顯示 HCG 對誘發體重減輕無效；相關減重主要來自同時進行的熱量限制。
    detail: 此結論是特定體重減輕用途的研究，不能延伸成其他醫療適應症或競技用途的效果研究。
    terms: [human-chorionic-gonadotropin]
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
    - ch10.weight-loss.i01
    - ch10.obesity-assessment.i05
    locator: Hormones > HCG (Human Chorionic Gonadotropin)
  - id: ch11.prohormones-hcg.i07
    q: HCG 注射的不良反應證據為何？
    a:
    - 皮下或肌肉注射常見反應為注射處疼痛、腫脹與壓痛。
    - HCG 注射副作用的研究很少。
    - 一項在肥胖女性注射 HCG 的研究，未報告與血壓或常規血液檢查相關的不良反應。
    detail: 這一項女性研究的有限安全資料，不能證明不同劑量、不同族群或類固醇週期後使用的安全性；原文沒有在此段宣稱 WADA 現行身分。
    terms: [human-chorionic-gonadotropin]
    numbers: []
    concepts:
    - ergogenic
    - hormone
    related:
