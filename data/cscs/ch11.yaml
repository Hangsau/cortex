cards:
- q: 教材所述 DSHEA（1994）對膳食補充品的規範為何？
  a: 製造商與經銷商須在上市前評估安全性與標示；可提出真實且不誤導的結構／功能主張，此要求比藥品療效主張寬鬆。
  tag: 法規框架
- q: 教材所述 WADA 的角色為何？
  a: WADA 監督世界反禁藥管制並為國際奧委會訂定禁用物質清單；其清單每年更新，各運動組織仍可能採不同清單與處罰。
  tag: 法規框架
- q: 2013–2014 NCAA 表中僅限步槍禁用的是哪一類？
  a: C 類酒精與 β-阻斷劑；這是教材列出的 2013–2014 表，須向所屬機構確認當年度規則。
  tag: 法規框架
- q: 教材所述合成代謝類固醇的美國聯邦法律地位？
  a: Class III 物質；首次非醫療持有最高 1 年監禁、最低 US$1,000 罰鍰；首次重罪販運最高 5 年及 US$250,000。
  tag: 合成代謝類固醇
- q: 類固醇「堆疊」與週期使用的教材描述？
  a: 同時使用多種藥物以期效力相加，但研究有限且未證實有效；一項研究典型為 3.1 種藥物、5–10 週與替代量的 5–29 倍。
  tag: 合成代謝類固醇
- q: 類固醇金字塔式用藥模式的教材描述？
  a: 使用者可能逐週加量、週期末再減量以降低副作用可能性；有些人停藥或另起週期，教材沒有在此指定末期藥物。
  tag: 合成代謝類固醇
- q: 類固醇對有經驗阻力訓練者的力量效果？
  a: 在超生理劑量下，力量增益可能為訓練相仿未補充者通常增益的 2–3 倍；改變程度受訓練狀態等因素影響。
  tag: 合成代謝類固醇
- q: 教材表列類固醇濫用的心血管不良反應？
  a: 脂質概況改變、血壓升高與心肌功能下降；個案中 HDL 降低被視為動脈粥樣硬化風險指標。
  tag: 合成代謝類固醇
- q: 教材表列類固醇濫用的男性生殖不良反應？
  a: 精子數與睪丸大小降低、睪丸萎縮、陽痿與暫時性不孕；教材未在此保證每項停藥後皆可逆。
  tag: 合成代謝類固醇
- q: 教材表列類固醇濫用的女性不良反應？
  a: 月經週期不規則、陰蒂肥大、嗓音變低與男性化；男女皆可能有男性女乳症與性慾改變。
  tag: 合成代謝類固醇
- q: 肌肉體相障礙（muscle dysmorphia）的教材描述？
  a: 又稱 reverse anorexia nervosa；部分健美者雖大且肌肉發達，仍認為自己小而弱，並以增補物與重量訓練增大體型。
  tag: 合成代謝類固醇
- q: 雄烯二酮與 DHEA 相對睪固酮的生物活性？
  a: androstenedione 約為 1/5、DHEA 約為 1/10；教材列出的前驅激素研究未見力量、瘦組織或睪固酮增加。
  tag: 前驅激素
- q: 前驅激素補充的教材所述風險？
  a: androstenedione 曾提高 estradiol 與 estrone、降低 HDL；研究亦報告睪固酮合成下調與血脂及冠心病風險概況惡化。
  tag: 前驅激素
- q: HCG 對男性類固醇使用者可能的作用？
  a: HCG 模擬 LH、刺激 Leydig 細胞製造睪固酮；大劑量肌肉注射後四天內可接近加倍。教材只推測使用者可能在週期末採用。
  tag: 前驅激素
- q: 健康運動員注射胰島素的主要風險？
  a: 可能立即死亡、昏迷或發展為胰島素依賴型糖尿病；自然升高的胰島素安全，不能外推到自行注射。
  tag: 胰島素/HGH
- q: HGH 與 IGF-I 的教材關聯？
  a: 多數 HGH 作用由 IGF-I 介導；IGF-I 由肝臟回應 HGH 刺激而產生，也可重組製造，教材僅說可能有相同效果。
  tag: 胰島素/HGH
- q: 成人期 HGH 過度分泌的疾病與特徵？
  a: 肢端肥大症：骨骼變寬、關節炎、器官肥大與代謝異常；兒童期過度分泌則為巨人症。
  tag: 胰島素/HGH
- q: 教材所述 HGH 檢測限制與歷史？
  a: 尿液藥檢無法檢出 HGH；血液檢測於 2004 年雅典夏季奧運首次引入，不能因此推論血液也無法檢出。
  tag: 胰島素/HGH
- q: EPO 注射六週的研究數據？
  a: 正常男性的血比容 44.5% 至 50%、血紅素增 10%、有氧能力增 6–8%，力竭時間最多改善 17%。
  tag: EPO/血液
- q: EPO 對耐力運動員的主要風險機制？
  a: 紅血球增加使血液黏稠，增加血栓、收縮壓、中風與腦／肺栓塞風險；脫水會加劇風險，且 EPO 刺激的生成無法控制。
  tag: EPO/血液
- q: 自體與異體血液摻假的定義？
  a: 自體為輸回自己冷藏或冷凍保存的血；異體為輸入同血型他人的血。1980 年代末後自體輸血相對讓位給重組人類 EPO。
  tag: EPO/血液
- q: 教材所述 clenbuterol 使用模式？
  a: 使用者被描述為臨床建議量兩倍、三週用三週停、用藥週二天用二天停；避免 β2 受體下調只是被認為的理由。
  tag: β 藥物
- q: β-阻斷劑對射擊表現的教材證據？
  a: 多項研究顯示慢速與快速射擊準確度改善；特定 oxprenolol 射手研究中 80 mg 優於 40 mg，不能外推所有藥物或任務。
  tag: β 藥物
- q: β-阻斷劑的減損表現作用？
  a: 會降低最大心率、氧氣攝取量與 10 km 賽跑表現，並提高自覺運動強度；因此精準運動的潛在好處不等於耐力效益。
  tag: β 藥物
- q: 刺激肌肉蛋白合成所需的胺基酸類型？
  a: 研究顯示需要 EAAs，非必需胺基酸不是刺激所必需；但它們仍是新肌肉蛋白的原料，也能節省必需胺基酸的轉換。
  tag: 胺基酸補充品
- q: 白胺酸在肌肉蛋白合成中的教材角色？
  a: 白胺酸似乎是 BCAAs 中的關鍵胺基酸，透過 Akt／mTOR 路徑作用；白胺酸閾值是由動物模型發展的理論。
  tag: 胺基酸補充品
- q: 訓練前後 EAA 攝取的急性反應差異？
  a: 6 g EAA 加 36 g 糖於訓練前 30 分鐘攝取，三小時急性合成代謝反應比訓練後攝取高 158%；不能直接等同長期增肌。
  tag: 胺基酸補充品
- q: HMB 的機制與效果條件？
  a: HMB 刺激蛋白合成並抑制 ubiquitin–proteasome 分解；未受訓者結果較一致，受訓者可能要高強度、高量且週期化的刺激才有益。
  tag: 胺基酸補充品
- q: HMB 在十天臥床研究的結果？
  a: 每日 3 g HMB 組少了 0.17 kg 除脂體重，安慰劑組少了 2.05 kg；這是臥床分解代謝狀態，不是訓練者增肌結果。
  tag: 胺基酸補充品
- q: 精胺酸對健康運動員的教材結論？
  a: 口服不會使一氧化氮生成高於運動本身、不增加肌肉血流，也未改善多種耐力表現；教材不建議健康運動員使用。
  tag: 胺基酸補充品
- q: β-丙胺酸改善表現的教材機制？
  a: 它是肌肽合成的速率限制受質；提高肌肽理論上可提高 MBC，協助調節高強度運動的 H+。
  tag: 肌肉緩衝劑
- q: β-丙胺酸試驗劑量與已報告不良反應？
  a: 文獻每日 2.4–6.4 g，常分 2–4 次；唯一已報告反應是高單次劑量引發的感覺異常，約一小時消失。
  tag: 肌肉緩衝劑
- q: β-丙胺酸可能改善與不改善的運動條件？
  a: 似乎不改善最大力量或有氧功率，可能改善無氧閾值；對超過 60 秒、多次且極端肌內酸性的高強度運動較可能有益。
  tag: 肌肉緩衝劑
- q: 碳酸氫鈉的教材所述劑量、時機與效力？
  a: 0.3 g/kg 體重於活動前 60–90 分鐘，與 60 秒至 6 分鐘高強度運動的總作功量、峰值功率等改善有關。
  tag: 肌肉緩衝劑
- q: 為何教材說碳酸氫鈉應先在練習測試？
  a: 0.3 g/kg 即可能造成腹瀉、痙攣、噁心、嘔吐；0.2 g/kg 較能耐受但未改善表現，個體反應不同。
  tag: 肌肉緩衝劑
- q: 磷酸肌酸在高強度運動中的耗竭數據？
  a: 六秒最大運動時低於靜息值 35–57%，三十秒時低 64–80%，反覆高強度運動時幾乎完全耗盡。
  tag: 肌酸
- q: 肌肉肌酸濃度的教材所述飽和上限？
  a: 約 150–160 mmol/kg 乾重；達到後繼續補充似乎無法使肌肉肌酸再提高。
  tag: 肌酸
- q: 肌酸的教材所述典型負荷與維持方案？
  a: 五天每日 20–25 g 或 0.3 g/kg，之後每日 2 g 或 0.03 g/kg 維持；停用約四週回到基線。
  tag: 肌酸
- q: 未經肌酸負荷期的效果差異？
  a: 最終可達與負荷期相似的肌肉濃度，但約需 30 天而非五天。
  tag: 肌酸
- q: 肌酸對訓練者力量增益的教材結果？
  a: 臥推、深蹲和 power clean 的力量增益可能是安慰劑組的 2–3 倍；教材定位其較像提升訓練品質的補充品。
  tag: 肌酸
- q: 肌酸補充的體重增加如何解釋？
  a: 數週至數月通常多增加 0.5–2 kg 體重或除脂體重；可能部分來自細胞內水分，也與收縮蛋白合成增加有關。
  tag: 肌酸
- q: 肌酸副作用與腎功能的教材證據？
  a: 受控研究未記錄顯著副作用；最長五年使用未報告腎功能異常，另有研究僅在負荷期見偶發腸胃不適。
  tag: 肌酸
- q: 咖啡因對耐力的教材所述有效劑量與時機？
  a: 3–9 mg/kg 體重，約運動前 60 分鐘或長時間運動中使用；≥9 mg/kg 沒有額外效益且副作用風險較高。
  tag: 咖啡因/刺激劑
- q: 咖啡因改善耐力的教材所提機制？
  a: 提出的機制是增加脂肪酸動員以減慢肝醣耗竭；教材說整體機制仍不清楚，短時間功率則可能涉及興奮－收縮耦聯。
  tag: 咖啡因/刺激劑
- q: 純咖啡因與咖啡的耐力效果差異？
  a: 兩者都曾有顯著效果，但錠劑改善看來較大；咖啡的效益可較低或不出現，教材引述咖啡中可能有拮抗化合物的推測。
  tag: 咖啡因/刺激劑
- q: 咖啡因對衝刺與功率表現的教材結論？
  a: 結果不充分；精英柔道 5 mg/kg、游泳 250 mg 的研究有正向結果，但休閒運動員研究也有無效結果，益處可能限於訓練者。
  tag: 咖啡因/刺激劑
- q: 咖啡因的副作用、戒斷與過量風險？
  a: 可能焦慮、腸胃不適、失眠、顫抖與心律不整；戒斷可頭痛、疲勞與難專注。教材典型致死量超過五克，非個人安全界線。
  tag: 咖啡因/刺激劑
- q: 能量飲對阻力與其他運動型態的教材結果？
  a: 15 名活動者於運動前一小時攝取含 2 mg/kg 咖啡因能量飲，70% 1RM 臥推三組至力竭表現改善；Wingate 與速度敏捷較不反應。
  tag: 咖啡因/刺激劑
- q: 麻黃素可能提升耐力的條件與管制背景？
  a: 只有與咖啡因合併時才顯示一致的有氧耐力效益；2004 年 FDA 禁止含麻黃產品，教材引述 16,000 件相關不良事件。
  tag: 咖啡因/刺激劑
- q: 教材如何比較肌酸、精胺酸、β-丙胺酸與 HMB？
  a: 肌酸對力量、功率與除脂體重有效；精胺酸不建議健康運動員；β-丙胺酸適用極端酸性運動；HMB 效果受訓練狀態與刺激條件限制。
  tag: 補充品總結
- q: 教材如何比較類固醇、EPO 與 HGH 的效力證據？
  a: 類固醇在超生理劑量可增肌力；EPO 提升血液攜氧能力並有耐力效益；HGH 運動員效力沒有研究支持，替代治療結果不可外推。
  tag: 補充品總結
- q: 咖啡因與肌酸的教材表現定位差異？
  a: 咖啡因有氧耐力證據較強、功率證據不充分；肌酸增加最大力量、功率與除脂體重，教材未把它列為耐力增補品。
  tag: 補充品總結
