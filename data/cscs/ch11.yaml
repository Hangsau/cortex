cards:
- q: DSHEA（1994）對膳食補充品的規範要求？
  a: 製造商自行評估安全性與標籤；FDA 不需預先批准新品；只需聲明對結構/功能的影響（非療效）且陳述真實不誤導
  tag: 法規框架
- q: WADA 是什麼機構，負責哪些工作？
  a: 世界反興奮劑機構；監管奧委會興奮劑控制；每年更新禁藥清單；各國有附屬機構（如美國 USADA）
  tag: 法規框架
- q: NCAA 禁藥中僅限步槍項目的是哪一類？
  a: C 類：酒精與 β-阻斷劑（Beta-Blockers）；其他所有運動員均不受此限制
  tag: 法規框架
- q: 合成代謝類固醇（AAS）在美國的法律地位？
  a: 第三級管制物質（Schedule III）；持有非醫療用途最高 1 年監禁＋$1,000 罰款；販運最高 5 年＋$250,000
  tag: 合成代謝類固醇
- q: 類固醇的「堆疊」（Stacking）用法是什麼？
  a: 同時使用多種藥物（口服＋注射）以產生加乘效果；典型週期 5–10 週；劑量為生理替代量的 5–29 倍
  tag: 合成代謝類固醇
- q: 類固醇的「金字塔」（Pyramid）用藥模式？
  a: 劑量逐週遞增至高峰後再逐週遞減，減少副作用；末期加用 HCG 等以恢復內生睪固酮
  tag: 合成代謝類固醇
- q: 類固醇對訓練有素運動員的肌力增幅效果？
  a: 可達未使用者的 2–3 倍；Forbes 研究：1 年間淨體重增加約 7 kg，肌纖維面積增加 11%
  tag: 合成代謝類固醇
- q: 類固醇的主要心血管副作用有哪些？
  a: HDL↓（動脈粥樣硬化風險↑）；血壓升高；心肌功能下降；脂質異常
  tag: 合成代謝類固醇
- q: 類固醇在男性的生殖系統副作用？
  a: 睪丸萎縮、精子數下降、暫時性不孕；停藥後通常可逆
  tag: 合成代謝類固醇
- q: 類固醇在女性的副作用（男性化效應）？
  a: 月經不規則、陰蒂肥大（clitoromegaly）、聲音低沉、男性化
  tag: 合成代謝類固醇
- q: 肌肉體相障礙（Muscle Dysmorphia）的定義？
  a: 又稱「逆向厭食症」；患者雖肌肉發達仍認為自己瘦弱；使用大量類固醇的驅動因素，最嚴重副作用幾乎全在健美族群
  tag: 合成代謝類固醇
- q: 雄烯二酮與 DHEA 的生物活性相較睪固酮如何？
  a: 雄烯二酮約為睪固酮的 1/5；DHEA 約為 1/10；大多數研究顯示對肌力、體組成無顯著效果
  tag: 前驅激素
- q: 前驅激素（prohormone）補充的主要副作用？
  a: 雌激素相關化合物↑（女性化）；HDL↓；內生睪固酮合成下調；2004 年起列為管制物質
  tag: 前驅激素
- q: HCG 對男性類固醇使用者的作用？
  a: 週期末期睪固酮受抑制→注射 HCG 模擬 LH→刺激 Leydig 細胞重新分泌睪固酮；4 天內睪固酮接近翻倍
  tag: 前驅激素
- q: 胰島素注射作為增肌藥物的主要風險？
  a: 可能立即死亡、昏迷或永久發展為胰島素依賴型糖尿病
  tag: 胰島素/HGH
- q: HGH 的多數合成代謝作用透過什麼介導？
  a: 胰島素樣生長因子-1（IGF-1）；由肝臟回應 HGH 刺激而分泌；IGF-1 現可重組 DNA 技術商業製造
  tag: 胰島素/HGH
- q: 成人期 HGH 過多導致何種疾病？其特徵？
  a: 肢端肥大症（Acromegaly）——骨骼變寬、關節炎、器官肥大、代謝異常
  tag: 胰島素/HGH
- q: HGH 的偵測方法與歷史？
  a: 尿液無法偵測；2004 年雅典奧運首次引入血液檢測
  tag: 胰島素/HGH
- q: EPO 注射 6 週後的生理變化數據？
  a: 血容比 44.5%→50%；血紅素↑ 10%；VO2max↑ 6–8%；力竭時間↑ 17%
  tag: EPO/血液
- q: EPO 對耐力運動員的主要死亡風險機制？
  a: 紅血球↑→血液黏稠度↑→血栓、中風、肺/腦栓塞；脫水時更危險；不可預測性——紅血球生成無法控制
  tag: EPO/血液
- q: 自體（autologous）vs 異體（homologous）血液輸注的定義？
  a: 自體：輸自己預存的血；異體：輸相同血型他人的血；EPO 1980 年代後漸取代輸血
  tag: EPO/血液
- q: Clenbuterol 的用法週期？
  a: β₂-促效劑；3 週開/3 週關，開期採 2 天開/2 天關；避免 β₂-受體下調；劑量為臨床建議量的兩倍
  tag: β 藥物
- q: β-阻斷劑對精準型運動員的表現效益？
  a: 降低焦慮與震顫→改善射擊精準度；80 mg 效果優於 40 mg；NCAA 僅限步槍項目禁用
  tag: β 藥物
- q: β-阻斷劑對耐力運動員的負面影響（ergolytic）？
  a: 降低最大心率、VO2max 和 10 km 賽跑表現；增加自感運動強度（RPE）
  tag: β 藥物
- q: 刺激肌肉蛋白合成必需的胺基酸類型？
  a: 必需胺基酸（EAAs）；非必需胺基酸不必要但可作為底物；BCAAs 中白胺酸是關鍵調節因子
  tag: 胺基酸補充品
- q: 白胺酸（Leucine）如何刺激肌肉蛋白合成？
  a: 直接啟動 Akt/mTOR 路徑→肌肉蛋白合成；BCAAs 中的速率限制因子；閾值概念：白胺酸濃度決定合成速率
  tag: 胺基酸補充品
- q: 訓練前 vs 訓練後 EAA 攝取，急性蛋白合成反應差異？
  a: 訓練前 30 分鐘比訓練後的急性反應高 158%（6g EAA + 36g 糖）
  tag: 胺基酸補充品
- q: HMB 的機制與最適用族群？
  a: 白胺酸代謝物；刺激蛋白合成＋抑制 ubiquitin-proteasome 蛋白分解路徑；未訓練者效果最佳；訓練者需高強度週期化訓練才有效
  tag: 胺基酸補充品
- q: HMB 在床位休息（catabolic state）的研究結果？
  a: 10 天臥床：HMB 3g 組失去 0.17 kg vs 安慰劑組失去 2.05 kg（顯著差異）
  tag: 胺基酸補充品
- q: Arginine 對健康運動員的研究結論？
  a: 不增加 NO 生成；不改善肌肉血流；不提升耐力表現；不建議健康運動員使用
  tag: 胺基酸補充品
- q: β-丙胺酸（β-Alanine）改善表現的機制？
  a: 肌肽（carnosine）合成的速率限制底物；↑肌肽→↑肌肉緩衝容量（MBC）→延緩 H⁺ 堆積與酸中毒
  tag: 肌肉緩衝劑
- q: β-丙胺酸的每日建議劑量與唯一已知副作用？
  a: 4–6 g/day；皮膚刺麻感（paresthesia）；分 2–4 次服用可避免；約 1 小時自然消退
  tag: 肌肉緩衝劑
- q: β-丙胺酸改善哪類運動，不改善哪類？
  a: 改善：>60 秒多組高強度間歇（如 400m、格鬥）；無氧閾值↑；不改善最大肌力或有氧功率
  tag: 肌肉緩衝劑
- q: 碳酸氫鈉（NaHCO₃）的建議劑量與服用時機？
  a: 0.3 g/kg BW，運動前 60–90 分鐘；改善 60 秒–6 分鐘高強度運動的峰值功率與總功
  tag: 肌肉緩衝劑
- q: 碳酸氫鈉為何不建議賽前首次使用？
  a: 常見腹瀉、痙攣、噁心、嘔吐；0.2 g/kg 副作用少但無功效；必須在訓練中先行測試
  tag: 肌肉緩衝劑
- q: 磷酸肌酸（PCr）在高強度運動中的消耗率？
  a: 6 秒衝刺：消耗 35–57%；30 秒：消耗 64–80%；反覆高強度運動幾乎完全耗盡
  tag: 肌酸
- q: 肌酸補充後肌肉肌酸含量的飽和上限？
  a: 150–160 mmol/kg 乾重；超過此量再補充無法進一步提升
  tag: 肌酸
- q: 肌酸的標準負荷期與維持期方案？
  a: 負荷期：20–25 g/day（0.3 g/kg）× 5 天；維持期：2 g/day（0.03 g/kg）；停用後 4 週回基線
  tag: 肌酸
- q: 不使用負荷期補充肌酸的效果差異？
  a: 最終肌酸含量與負荷期相同，但達到需約 30 天（vs 5 天）
  tag: 肌酸
- q: 肌酸對訓練有素運動員的肌力增幅？
  a: 臥推、深蹲、爆發上舉增幅可達未補充者的 2–3 倍；也增加訓練品質（減少疲勞、加速恢復）
  tag: 肌酸
- q: 肌酸補充引起的體重增加主要原因？
  a: 淨體重增加 0.5–2 kg；部分為細胞內水分增加（肌酸↑細胞內滲透梯度→水分流入）＋肌肉收縮蛋白合成↑
  tag: 肌酸
- q: 肌酸有無已知嚴重副作用？
  a: 無顯著副作用；腎功能在短期（5天）到長期（5年）均無異常；僅偶有輕微腸胃不適（裝載期）
  tag: 肌酸
- q: 咖啡因對耐力表現的建議劑量與時機？
  a: 3–9 mg/kg BW，運動前 ~60 分鐘；>9 mg/kg 無額外效益且副作用顯著增加
  tag: 咖啡因/刺激劑
- q: 咖啡因改善耐力的主要機制（兩個）？
  a: ①促進脂肪酸動員→節省肝醣延遲疲勞；②增強興奮收縮耦合、SR 鈣離子釋放、磷酸化酶活性→提升功率
  tag: 咖啡因/刺激劑
- q: 純咖啡因錠劑 vs 咖啡在耐力表現的差異？
  a: 純錠劑耐力改善 28–43%；咖啡效果較弱或無效（研究提示咖啡中含拮抗成分）
  tag: 咖啡因/刺激劑
- q: 咖啡因對爆發力/衝刺表現的研究結論？
  a: 效果不確定；精英運動員（柔道 5 mg/kg 峰值功率↑；游泳 250 mg 百米↑3%）；休閒運動員通常無效
  tag: 咖啡因/刺激劑
- q: 咖啡因的已知副作用與戒斷症狀？
  a: 焦慮、失眠、震顫、心律不整、腸胃不適；生理成癮；戒斷：頭痛、疲勞、難集中、類流感症狀；致死量 >5g
  tag: 咖啡因/刺激劑
- q: 能量飲在抵抗訓練中的效果？
  a: 2 mg/kg 咖啡因能量飲：顯著增加臥推訓練總量；也改善上下肢訓練量；但 Wingate 無氧和速度敏捷性無效
  tag: 咖啡因/刺激劑
- q: Ephedrine 有效提升耐力的條件？
  a: 單獨使用無效；必須與咖啡因搭配才有耐力效果；2004 年 FDA 禁止含麻黃素產品（Rand 報告 16,000 起不良事件）
  tag: 咖啡因/刺激劑
- q: 以下哪些補充品對健康運動員「有效」vs「無效」：肌酸/精胺酸/β-丙胺酸/HMB？
  a: 有效：肌酸（肌力/爆發力）、β-丙胺酸（高強度間歇）、HMB（未訓練者/高強度訓練者）；無效：精胺酸（不增加 NO/血流/耐力）
  tag: 補充品總結
- q: 以下激素類禁藥哪些對耐力有效：睪固酮/EPO/HGH？
  a: 睪固酮：主要增肌肌力；EPO：最強耐力效益（血容比↑→VO2max↑6–8%）；HGH：體組成改善但直接肌力/耐力效益未確立
  tag: 補充品總結
- q: 咖啡因與肌酸的主要表現差異（適用運動類型）？
  a: 咖啡因：有氧耐力最有效（3–9 mg/kg），爆發力效果不確定；肌酸：肌力/爆發力有效，耐力無效
  tag: 補充品總結
