  - id: ch11.muscle-buffering.i07
    q: 碳酸氫鈉的劑量、時機與耐受性界線為何？
    a:
    - 教材指出活動前約 60–90 分鐘攝取 0.3 g/kg 體重，可改善短時間高強度表現。
    - 高於此量與腹瀉、痙攣、噁心、嘔吐有關；0.2 g/kg 可減少副作用，但研究未見表現改善。
    - 因有些運動員在 0.3 g/kg 仍可能出現嚴重副作用，教材說許多運動科學家建議先在練習時測試。
    detail: 這是教材轉述研究與運動科學家實務建議，不應省略「有些人即使 0.3 g/kg 也會不適」的個體差異。
    terms: [sodium-bicarbonate]
    numbers:
