  - id: ch11.prohormones-hcg.i02
    q: 前驅激素補充對力量、體組成與睾固酮的研究結果為何？
    a:
    - 中年男性阻力訓練三個月，補充 DHEA、100 mg androstenedione 或安慰劑者，力量與體組成沒有顯著差異。
    - 19–29 歲男性以兩週用、一週停、共八週補充 150 mg DHEA，力量、瘦組織與血清睾固酮均未增加。
    - 同樣週期、八週補充 300 mg androstenedione，也未見力量、肌肉大小或睾固酮濃度的顯著效果。
    detail: 教材說研究結果有變異，但列出的這些研究都沒有正向表現結果；不能把 100–300 mg 當成一個可泛化的統一劑量範圍。
    terms: [prohormone, dehydroepiandrosterone, androstenedione, testosterone]
    numbers:
