  - id: ch11.caffeine-energy-drinks.i03
    q: 咖啡因對衝刺或功率表現的證據為何？
    a:
    - 若檢視衝刺或功率，增補效益較不明確；部分使用休閒運動員的研究未見功率改善。
    - 精英柔道選手攝取 5 mg/kg 後，峰值功率相較安慰劑顯著改善；競技游泳選手攝取 250 mg 後，重複 100 m 衝刺時間平均改善 3%。
    - 教材的結論是證據不充分；若有益處，可能發生於受過訓練的運動員。
    detail: 兩個正向例子不能覆蓋休閒運動員的無效研究；教材特別指出功率研究數量遠少於耐力研究。
