id: ch06
weight: 6
title: Ch.6 有氧耐力訓練的適應
topics:
- id: acute-cardiovascular
  title: 急性心血管反應 Acute Cardiovascular Response
  desc: ''
  tag: Cardiovascular
  items:
  - id: ch06.acute-cardiovascular.i01
    q: 心輸出量（cardiac output, Q̇）如何隨有氧運動改變？
    a:
    - 心輸出量是心臟每分鐘泵出的血量，等於每搏量乘以心率
    - 從靜息進入穩定狀態有氧運動時，心輸出量先快速、再逐漸增加，之後進入平臺
    - 最大運動時可由靜息約 5 L/min 增至 20–22 L/min，約為四倍
    detail: 20–22 L/min 是教材所述的最大值範圍，不是所有人的固定上限；個人的反應還會受訓練狀態影響。
    terms:
    - cardiac-output
    - stroke-volume
    - heart-rate
    numbers:
    - v: 5
      unit: L/min
      of: 教材所述的約略靜息心輸出量
    - v: 20–22
      unit: L/min
      of: 最大運動時心輸出量可達的範圍
    - v: 4
      unit: 倍
      of: 最大運動心輸出量相對於靜息值的約略倍數
    concepts:
    - circulation
    - normal-values
    related:
    - ch20.aerobic-performance-factors.i01
    locator: Acute Responses to Aerobic Exercise > Cardiovascular Responses > Cardiac Output
  - id: ch06.acute-cardiovascular.i02
    q: 有氧運動時每搏量（stroke volume, SV）何時進入平臺？
    a:
    - 每搏量在運動開始時上升，直到攝氧量約達最大攝氧量的 40–50% 後開始進入平臺
    - 久坐的大學年齡男性，最大每搏量平均為 100–120 ml/beat；同齡女性約低 25%
    - 經訓練後，同齡男性可達 150–160 ml/beat，女性約 100–110 ml/beat
    detail: 教材把女性較低的平均值歸因於平均體型與心肌較小；這些數字限定於大學年齡族群，不能直接當成所有年齡與體型的標準值。
    terms:
    - stroke-volume
    - vo2max
    numbers:
