      unit: mmHg
      of: 靜息時動脈血氧分壓
    - v: 最低約 40
      unit: mmHg
      of: 靜息時組織間液氧分壓
    - v: 約 46
      unit: mmHg
      of: 靜息時組織間液二氧化碳分壓
