  - id: ch06.acute-respiratory.i08
    q: 低、中與高強度運動時，乳酸生成與移除如何改變？
    a:
    - 低至中等強度時，工作肌肉有足夠氧氣，乳酸移除率大於或等於生成率，因此不會累積
    - 移除途徑包括 Cori 循環：肌肉產生的乳酸經血液送到肝臟，進行糖質新生
    - 工作強度更高、單靠有氧代謝不足以跟上乳酸形成時，血乳酸開始上升；這個運動水準稱為血乳酸積累起始點（onset of blood lactate accumulation, OBLA）
    detail: 教材把 OBLA 定義為血乳酸開始呈現上升的有氧運動水準，沒有在本章為它指定固定濃度門檻；因此此處不額外加入其他章或通說常見的 mmol/L 數字。
    terms:
    - cori-cycle
    - gluconeogenesis
    - obla
