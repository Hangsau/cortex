id: ch06
weight: 6
title: Ch.6 有氧耐力訓練的適應
topics:
- id: acute-cardiovascular
  title: 急性心血管反應 Acute Cardiovascular Response
  desc: ''
  tag: Cardiovascular
  items:
  - id: ch06.acute-cardiovascular.i01
    q: 心輸出量 (Q̇)
    a:
    - Q̇ = 搏出量 × 心跳率
    - 最大時可達靜止的 4 倍（約 20–22 L/min）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-cardiovascular.i02
    q: 搏出量 (SV)
    a:
    - Frank-Starling 機制：靜脈回流↑ → 心室末期舒張容積↑ → 收縮力↑
    - VO2 40–50% 時 SV 達到高原
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-cardiovascular.i03
    q: 心跳率 (HR)
    a:
    - 與強度線性上升
    - 最大心跳估算：220－年齡 或 208－(0.7×年齡)
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-cardiovascular.i04
    q: 攝氧量 (VO2)
    a:
    - Fick 方程式：VO2 = Q̇ × a-vO2 difference
    - 靜止 ≈ 3.5 ml/kg/min（1 MET）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-cardiovascular.i05
    q: 靜脈回流機制
    a:
    - 靜脈收縮＋骨骼肌幫浦＋呼吸幫浦 → 靜脈回流增加 → 搏出量增加
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-cardiovascular.i06
    q: 收縮壓 (SBP)
    a:
    - 最大有氧運動可升至 220–260 mmHg
    - Rate-Pressure Product = HR × SBP
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-cardiovascular.i07
    q: 舒張壓 (DBP)
    a:
    - 有氧運動時因血管擴張而維持不變或略降
    - 平均動脈壓 = (SBP-DBP)/3 + DBP
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-cardiovascular.i08
    q: 局部血流調節
    a:
    - 活動肌肉微動脈擴張
    - 靜止時 15–20% 心輸出量 → 運動時可達 90% 流向骨骼肌
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: acute-respiratory
  title: 急性呼吸反應 Acute Respiratory Response
  desc: ''
  tag: Respiratory
  items:
  - id: ch06.acute-respiratory.i01
    q: 每分鐘換氣量 (VE)
    a:
    - 靜止→最大運動可增加 15–25 倍，達 90–150 L/min
    - = 潮氣容積 × 呼吸頻率
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-respiratory.i02
    q: 潮氣容積 (TV)
    a:
    - 靜止 0.4–1 L → 最大可達 3 L+
    - 深呼吸比加快頻率更有效率
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-respiratory.i03
    q: 呼吸頻率
    a:
    - 靜止 12–15 次/min → 劇烈運動 35–45 次/min
    - 高強度時比例更大
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-respiratory.i04
    q: 解剖死腔
    a:
    - 鼻/口/氣管等非氣體交換區域 ≈ 150 ml
    - 深呼吸時死腔增加但比例小於 TV 增加
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-respiratory.i05
    q: 換氣當量
    a:
    - 低中強度時 VE/VO2 ≈ 20–25 L/L
    - 高強度時可升至 35–40 L/L（乳酸急劇上升時）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-respiratory.i06
    q: 氣體擴散
    a:
    - 運動時 O2 在組織的分壓從 100 降至 ≈ 3 mmHg
    - CO2 從 46 升至 ≈ 90 mmHg，促進擴散
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-respiratory.i07
    q: 血液攜氧
    a:
    - 血漿僅攜帶 3 ml/L
    - 大部分由血紅素攜帶
    - 男性 ≈ 20 ml O2/100 ml 血液
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.acute-respiratory.i08
    q: 乳酸代謝 (OBLA)
    a:
    - 低中強度時乳酸產生=移除
    - 高強度時乳酸開始累積（OBLA）
    - Cori cycle 將乳酸運至肝臟
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: chronic-cardiovascular
  title: 慢性心血管適應 Chronic Cardiovascular Adaptations
  desc: ''
  tag: Cardiovascular
  items:
  - id: ch06.chronic-cardiovascular.i01
    q: 最大心輸出量↑
    a:
    - 長期訓練（6–12 個月）最顯著改變
    - 主要來自搏出量增加，非心跳率
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-cardiovascular.i02
    q: 搏出量↑
    a:
    - 左心室腔室容積↑、壁厚↑、收縮力↑
    - 訓練後男性可達 150–160 ml/beat
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-cardiovascular.i03
    q: 靜止心跳率↓
    a:
    - 副交感神經張力↑
    - 訓練有素的耐力選手靜止 HR 常為 40–60 次/min（心搏過緩）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-cardiovascular.i04
    q: 次最大 HR↓
    a:
    - 相同次最大運動強度下 HR 更低
    - 有訓練的選手 HR 上升速度更慢
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-cardiovascular.i05
    q: 最大 HR
    a:
    - 最大 HR 可能略微下降（副交感張力↑）
    - 不影響最大搏出量增加的效益
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-cardiovascular.i06
    q: 微血管密度↑
    a:
    - 毛細血管網絡增加 → 擴散距離縮短 → O2 與代謝基質輸送效率提升
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-cardiovascular.i07
    q: 呼吸系統適應
    a:
    - 次最大運動時 TV↑、呼吸頻率↓
    - 最大運動時 TV 與頻率皆↑
    - 通氣不是有氧運動的限制因素
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-cardiovascular.i08
    q: 神經系統適應
    a:
    - 訓練初期：動作效率↑、疲勞延後
    - 協同肌輪流活化 → 維持低強度收縮的能量消耗降低
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: chronic-muscular
  title: 慢性肌肉適應 Chronic Muscular Adaptations
  desc: ''
  tag: Muscular
  items:
  - id: ch06.chronic-muscular.i01
    q: 粒線體↑
    a:
    - 粒線體數量與體積均增加（增加有氧 ATP 生產能力）
    - 配合肌紅素↑更有效利用 O2
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-muscular.i02
    q: 肌紅素 (myoglobin)↑
    a:
    - 細胞內 O2 運輸蛋白
    - 量增加 → 細胞攝取並利用 O2 能力↑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-muscular.i03
    q: Type I 纖維肥大
    a:
    - 選擇性肥大但截面積不如 Type II 明顯
    - 氧化能力提升（粒線體密度↑）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-muscular.i04
    q: Type IIx→IIa 轉變
    a:
    - Type II 纖維之間可轉換
    - IIa 氧化能力優於 IIx，功能特性更接近 Type I
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-muscular.i05
    q: OBLA 上升
    a:
    - 訓練後 OBLA 可達 VO2max 的 80–90%
    - 因脂肪利用↑、乳酸生成↓、移除↑、糖原節省
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-muscular.i06
    q: 酶活性↑
    a:
    - 檸檬酸合酶、琥珀酸脫氫酶等有氧酶↑
    - 糖解酶（如 LDH）可能不變或↓
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-muscular.i07
    q: 能源儲存↑
    a:
    - 肌肉 glycogen↑、三酸甘油酯↑
    - ATP 及磷酸肌酸儲量略增
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.chronic-muscular.i08
    q: Type I vs II 比較
    a:
    - 有氧訓練對 Type I 和 Type II 的有氧潛力相對增加幅度相似
    - 但 Type I 起點更高
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: connective-endocrine
  title: 骨骼結締組織 & 內分泌適應 Bone, Connective Tissue & Endocrine
  desc: ''
  tag: Bone / CT
  items:
  - id: ch06.connective-endocrine.i01
    q: 骨密度
    a:
    - 跑步/高強度有氧最有效
    - 強度須超過最低閾值且週期性負荷
    - 不變或略增
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.connective-endocrine.i02
    q: 韌帶與肌腱
    a:
    - 強度與運動刺激成正比（尤其負重活動）
    - 訓練強度需持續超過日常活動負荷
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.connective-endocrine.i03
    q: 軟骨
    a:
    - 負重表面較非負重表面厚
    - 適度跑步（1 小時/天 × 5 天 × 15 週）可增加軟骨厚度
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.connective-endocrine.i04
    q: 荷爾蒙 — 次最大
    a:
    - 訓練後次最大運動時荷爾蒙反應降低
    - 相同相對強度時與未訓練者相當
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.connective-endocrine.i05
    q: 荷爾蒙 — 最大運動
    a:
    - 高強度訓練↑最大運動時荷爾蒙分泌（增強耐受高強度能力）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.connective-endocrine.i06
    q: 皮質醇 (cortisol)
    a:
    - 跑步訓練相關蛋白質分解↑
    - 身體嘗試以睪固酮和 IGF-1 抵消分解效果
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.connective-endocrine.i07
    q: 睪固酮 / IGF-1
    a:
    - 訓練後有氧選手肌肉確實有淨蛋白合成（多為粒線體蛋白，非收縮蛋白）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.connective-endocrine.i08
    q: 體組成
    a:
    - 體脂率↓
    - 去脂體重不變
    - 長期訓練效果更顯著
    - 過度訓練會使合成/分解失衡
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: detraining
  title: 去訓練 & 有氧表現提升 Detraining & Performance
  desc: ''
  tag: Detraining
  items:
  - id: ch06.detraining.i01
    q: 去訓練定義
    a:
    - 訓練刺激不足導致訓練適應部分或完全喪失
    - 遵循訓練可逆性原則
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.detraining.i02
    q: 短期去訓練 (<4週)
    a:
    - 精英選手 VO2max↓ 4–14%
    - 主因：血量↓、搏出量↓、最大心輸出量↓、次最大 HR↑
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.detraining.i03
    q: 長期去訓練 (>4週)
    a:
    - VO2max↓ 6–20%
    - 有氧酶活性對停訓最敏感（酶基礎的細胞機制）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.detraining.i04
    q: VO2max 提升
    a:
    - 有氧訓練可提升 5–30%（取決於起始體能）
    - 6–12 個月內達大部分最大攝氧量提升
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.detraining.i05
    q: 乳酸閾值 (LT)
    a:
    - 訓練後 OBLA 提升（可至 80–90% VO2max）
    - 相同 VO2max 的選手，LT 較高者表現更佳
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.detraining.i06
    q: 跑步經濟性
    a:
    - 6–12 個月後 VO2max 增益趨緩，之後改善主要來自跑步效率↑和 LT↑
    - 精英選手更明顯
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.detraining.i07
    q: 間歇訓練效益
    a:
    - 短休息間歇訓練可提升 VO2max
    - 長休息改善衝刺速度而非有氧能力
    - 恢復期長短關鍵
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.detraining.i08
    q: Tapering vs 去訓練
    a:
    - Tapering：賽前計畫性降低訓練量（維持強度）→ 提升表現
    - 去訓練：無計畫停訓 → 適應喪失
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: external-factors
  title: 外部因素影響 External Factors
  desc: ''
  tag: External Factors
  items:
  - id: ch06.external-factors.i01
    q: 高海拔 — 急性反應
    a:
    - '>1200 m 時開始：過度換氣（呼吸頻率↑）'
    - 次最大 HR 與心輸出量↑ 30–50%
    - 動脈 O2 飽和度↓
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.external-factors.i02
    q: 高海拔 — 慢性適應
    a:
    - RBC 增加 30–50%
    - 血紅素↑ 5–15%
    - 微血管密度↑
    - 粒線體↑
    - 適應後 VO2max 可接近海平面
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.external-factors.i03
    q: 高海拔注意事項
    a:
    - 適應需至少 3–6 週（中海拔 2200–3000 m）
    - 回到海平面後 1 個月恢復
    - 高度愈高效益愈小
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.external-factors.i04
    q: 高氧呼吸
    a:
    - 爭議性做法
    - 海平面健康者 Hb 已 95–98% 飽和
    - 對運動表現的效益尚未明確
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.external-factors.i05
    q: 吸菸影響
    a:
    - 氣道阻力↑
    - 纖毛麻痺
    - CO 與 Hb 結合（碳氧血紅素）→ 攜氧能力↓
    - 最大運動能力↓
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.external-factors.i06
    q: 血液禁藥 (EPO/輸血)
    a:
    - 增加 RBC 質量 → VO2max 可↑ 11%
    - 次最大運動時 HR↓、血乳酸↓
    - 高 hematocrit 增加血栓風險
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.external-factors.i07
    q: 遺傳潛能
    a:
    - 決定適應上限
    - 越接近上限，每次訓練的邊際增益越小
    - 精英選手程式設計更重要
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.external-factors.i08
    q: 年齡與性別
    a:
    - 最大有氧功率隨年齡↓（肌肉量↓、體脂↑）
    - 女性為男性 73–85%（體脂%↑、Hb↓、心臟較小）
    - 訓練反應相似
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: overtraining
  title: 過度訓練症候群 Overtraining Syndrome
  desc: ''
  tag: Overtraining
  items:
  - id: ch06.overtraining.i01
    q: 定義連續體
    a:
    - 功能性過度負荷（FOR）→ 非功能性過度負荷（NFOR，需數週/月恢復）→ OTS（需數月恢復）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch06.overtraining.i02
    q: 主要原因
    a:
    - 高強度訓練 + 恢復不足
