  - id: ch06.acute-respiratory.i04
    q: 解剖死腔與生理死腔有何不同？
    a:
    - 解剖死腔（anatomical dead space）是鼻、口、氣管、支氣管與細支氣管等不進行氣體交換的呼吸通道，年輕成人約為 150 ml，並隨年齡增加
    - 生理死腔（physiological dead space）是因血流差、通氣差或肺泡表面問題而無法有效交換氣體的肺泡
    - 健康人的生理死腔通常可忽略，因為全部或幾乎全部肺泡都可運作
    detail: 慢性阻塞性肺病或肺炎可使肺泡功能明顯下降；教材指出生理死腔可增至解剖死腔容積的十倍，因此「通常可忽略」只適用於健康肺部。
    terms:
    - anatomical-dead-space
    - physiological-dead-space
    - alveolus
    numbers:
