  - id: ch06.acute-respiratory.i05
    q: 靜息與高強度有氧運動時，組織氣體分壓如何改變？
    a:
    - 靜息時，氧分壓由動脈血的 100 mmHg 迅速降至組織間液最低約 40 mmHg；組織間液二氧化碳分壓約為 46 mmHg，高於動脈血
    - 高強度有氧運動時，組織氧分壓約為 3 mmHg，二氧化碳分壓約為 90 mmHg
    - 這些濃度與分壓梯度使氧與二氧化碳由高處向低處跨膜擴散
    detail: 原摘要把「靜息動脈血的 100 mmHg」直接對到「運動組織的 3 mmHg」，漏掉靜息組織間液約 40 mmHg 的比較基準。教材也指出運動時兩種氣體的擴散能力都大幅增加，尤以二氧化碳為甚。
    terms:
    - diffusion
    - partial-pressure
    numbers:
