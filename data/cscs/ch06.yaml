  - id: ch06.acute-cardiovascular.i03
    q: 有氧運動時心率（heart rate, HR）如何上升，又如何估算最大心率？
    a:
    - 運動前與剛開始時，反射性或預期性的交感神經刺激會使心率上升；之後心率隨有氧運動強度線性增加
    - 簡易最大心率估算式為 220－年齡；教材也引用健康成人較準確的 208－0.7×年齡
    detail: 心率的上升速率、實際反應與可達最大值還受體適能、年齡及工作負荷影響。220－年齡只是估計式，教材範例所示的標準差為 ±10–12 beats/min。
    terms:
    - heart-rate
    - maximal-heart-rate
    - sympathetic
    numbers:
    - v: 220－年齡
      unit: beats/min
      of: 傳統最大心率估算式
    - v: 208－0.7×年齡
      unit: beats/min
      of: 教材引用、適用於健康成人的最大心率估算式
    - v: ±10–12
