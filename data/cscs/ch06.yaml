  - id: ch06.acute-respiratory.i02
    q: 為什麼增加潮氣量比只增加呼吸頻率更有效率？
    a:
    - 吸氣時，空氣除了進入可交換氣體的肺泡，也會留在鼻、口、氣管、支氣管與細支氣管等解剖死腔
    - 深呼吸會使呼吸道伸展、解剖死腔增加，但潮氣量增加的比例更大
    - 因此增加潮氣量所提供的有效通氣，比只提高呼吸頻率更有效率
    detail: 關鍵不在於深呼吸完全消除死腔，而是新增的潮氣量中，可到達氣體交換區的比例高於快而淺的呼吸。
    terms:
    - tidal-volume
    - anatomical-dead-space
    - alveolus
    numbers: []
    concepts:
    - gas-exchange
    related:
    - ch01.respiratory.airway
    locator: Acute Responses to Aerobic Exercise > Respiratory Responses
  - id: ch06.acute-respiratory.i03
    q: 換氣當量何時會隨運動強度不成比例地上升？
    a:
    - 換氣當量（ventilatory equivalent）是分鐘通氣量與攝氧量的比值，低至中等強度時為每消耗 1 L 氧需 20–25 L 空氣
    - 更高強度時，呼吸頻率的作用加大，分鐘通氣量相對攝氧量不成比例地上升，並開始與血乳酸的突然上升平行
    - 此時換氣當量可增至每消耗 1 L 氧需 35–40 L 空氣
    detail: 這個轉折的強度因訓練狀態而異：教材列未訓練者約在 45–65% VO₂max 以上，受訓運動員約在 70–90% VO₂max 以上。
    terms:
    - ventilatory-equivalent
    - minute-ventilation
    - oxygen-uptake
    - vo2max
    numbers:
    - v: 20–25
      unit: L air/L O₂
      of: 低至中等強度運動時的換氣當量
    - v: 35–40
      unit: L air/L O₂
      of: 高強度運動時換氣當量可達的範圍
    - v: 45–65
      unit: '% VO₂max'
      of: 未訓練者分鐘通氣量開始不成比例上升的一般強度範圍
    - v: 70–90
      unit: '% VO₂max'
      of: 受訓運動員分鐘通氣量開始不成比例上升的一般強度範圍
