    - energy-supply
    related:
    - ch03.lactate.i08
    locator: Chronic Adaptations to Aerobic Exercise > Muscular Adaptations
  - id: ch06.chronic-muscular.i06
    q: 有氧耐力訓練會如何改變肌肉酵素？
    a:
    - 葡萄糖有氧代謝相關酵素的含量與活性增加
    - 若長期有氧耐力訓練大量動用快縮纖維，這些纖維的糖解酵素濃度可能降低
    - 教材總表把磷酸果糖激酶與乳酸去氫酶的反應列為「不一」而非一致上升或下降
    detail: 原摘要指定檸檬酸合酶、琥珀酸去氫酶上升，雖然 Table 6.2 列出個別研究數值，但正文的一般結論較窄；此處保留正文與總表能共同支持的方向，不把單一表格數值外推成普遍定律。
    terms:
    - pfk
    - lactate-dehydrogenase
    numbers: []
    concepts:
    - adaptation
    - energy-supply
    related:
    - ch03.oxidative.i01
    locator: Chronic Adaptations to Aerobic Exercise > Muscular Adaptations
  - id: ch06.chronic-muscular.i07
    q: 有氧耐力訓練後，肌肉內的能量儲存如何改變？
    a:
    - 教材總表列出：儲存的 ATP、磷酸肌酸、糖原與三酸甘油酯均增加
    - 肌肉適應正文也明確指出，糖原與三酸甘油酯儲存增加
    detail: Table 6.1 只標示「增加」，沒有提供 ATP 或磷酸肌酸的增加幅度；因此刪除原摘要自行加入的「略增」。
    terms:
    - atp
    - creatine-phosphate
    - glycogen
    numbers: []
    concepts:
