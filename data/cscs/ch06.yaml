      unit: breaths/min
      of: 健康年輕成人的靜息呼吸頻率
    - v: 35–45
      unit: breaths/min
      of: 健康年輕成人劇烈運動時的呼吸頻率
    - v: 0.4–1
      unit: L
      of: 靜息潮氣量範圍
    - v: 3 或更高
      unit: L
      of: 劇烈運動時潮氣量可達的容積
    - v: 15–25
      unit: 倍
      of: 劇烈運動分鐘通氣量相對靜息值的增幅
    - v: 90–150
      unit: L/min
