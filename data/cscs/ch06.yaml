- id: connective-endocrine
  title: 骨骼結締組織 & 內分泌適應 Bone, Connective Tissue & Endocrine
  desc: ''
  tag: Bone / CT
  items:
  - id: ch06.connective-endocrine.i01
    q: 哪些有氧運動條件較能刺激骨形成？
    a:
    - 較強烈的活動，如跑步與高強度有氧運動，較能刺激骨生長
    - 刺激必須明顯高於個人的日常活動，超過骨生長的最低強度與週期性應變頻率門檻
    - 強度須有系統地增加，持續對骨骼造成超負荷；教材總表將骨密度反應列為「不變或增加」
    detail: 骨對外力的幅度與加載速率都有反應，因此也要提高肢體移動速率；高強度間歇訓練是兼顧有氧效益與較大成骨刺激的方法之一。當進階強度先受氧輸送系統限制時，只靠有氧運動可能難以繼續增加骨骼超負荷。
    terms:
    - bone-mineral-density
    - progressive-overload
    - hiit
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch05.connective-tissue.i04
    locator: Chronic Adaptations to Aerobic Exercise > Bone and Connective Tissue Adaptations
  - id: ch06.connective-endocrine.i02
    q: 成熟成人的肌腱、韌帶與軟骨如何回應有氧運動刺激？
    a:
    - 這些組織生長與增強的程度，與運動刺激強度成比例，尤其是負重活動
    - 運動強度必須持續超過日常活動對結締組織施加的應變，才會造成改變
    detail: 這項陳述限定於成熟成人；教材把結締組織與骨、肌肉放在同一超負荷原則下，重點是刺激相對於個人日常負荷是否足夠。
    terms:
    - collagen
    numbers: []
    concepts:
    - adaptation
    - structure
    related:
    - ch05.connective-tissue.i05
    - ch05.connective-tissue.i06
    locator: Chronic Adaptations to Aerobic Exercise > Bone and Connective Tissue Adaptations
  - id: ch06.connective-endocrine.i03
    q: 負重與跑步對關節軟骨的證據顯示什麼？
    a:
    - 一般膝關節中，承受最多負重的關節面比不負重的表面厚；負重時完成完整活動範圍，很可能是維持組織存活所必需
    - 動物研究結果並非單一方向：每次 12.5 miles（20 km）的劇烈跑步使軟骨變薄
    - 以狗為對象的適度跑步計畫，每天 1 小時、每週 5 天、共 15 週，則增加軟骨厚度並促進骨組織正向重塑
    detail: 原摘要漏掉「動物研究／狗」這個決定性範圍，容易被誤讀成人體訓練處方。教材同段還列出更長或加重跑步未造成退化性關節病的動物研究，整體證據不能簡化為跑得越多一定越好或越壞。
    terms:
    - range-of-motion
