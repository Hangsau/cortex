    locator: Chronic Adaptations to Aerobic Exercise > Bone and Connective Tissue Adaptations
  - id: ch06.connective-endocrine.i04
    q: 受訓運動員在次最大運動時的荷爾蒙反應如何改變？
    a:
    - 對固定的次最大絕對工作量，受訓運動員的荷爾蒙反應較弱
    - 若比較相同的相對次最大強度，受訓者與未訓練者的荷爾蒙濃度相同
    detail: 「訓練後反應降低」只成立於相同絕對工作量；改以各自能力的相同比例比較時，差異消失。兩種比較基準不可混用。
    terms:
    - catecholamine
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.catecholamines.i07
    - ch05.endocrine-adaptations.i05
    locator: Chronic Adaptations to Aerobic Exercise > Endocrine Adaptations
  - id: ch06.connective-endocrine.i05
    q: 高強度有氧訓練如何影響最大運動時的荷爾蒙分泌？
    a:
    - 高強度有氧訓練會提高最大運動時許多荷爾蒙的絕對分泌速率
    - 這種較大的最大運動荷爾蒙反應，似乎會增強運動員耐受並維持長時間高強度有氧運動的能力
    - 若運動強度很高但只持續 5–10 秒，周邊血液只出現戰或逃反應，例如腎上腺素與正腎上腺素上升
    detail: 教材對較大荷爾蒙反應的功能使用「appear to augment」，因此保留「似乎」而不改寫為已證實的單一因果機制。
    terms:
    - catecholamine
    - epinephrine
    - norepinephrine
    numbers:
    - v: 5–10
      unit: 秒
      of: 極高強度、極短運動只出現戰或逃周邊荷爾蒙變化的持續時間
    concepts:
    - adaptation
    - hormone
    related:
    - ch04.growth-hormone.i04
    locator: Chronic Adaptations to Aerobic Exercise > Endocrine Adaptations
  - id: ch06.connective-endocrine.i06
    q: 跑步訓練為何常與肌肉淨蛋白分解增加相關？
    a:
    - 有氧訓練、尤其跑步，常與肌肉淨蛋白分解增加相關
    - 壓力引起的皮質醇分泌是其中一部分原因
    - 身體會嘗試增加睪固酮與第一型類胰島素生長因子（insulin-like growth factor I, IGF-I）的合成性荷爾蒙反應加以抵銷
    detail: 原文說皮質醇「部分」促成分解，並沒有把所有蛋白質分解都歸因於皮質醇；抵銷反應也不代表分解一定完全被消除。
    terms:
    - cortisol
    - testosterone
    - insulin-like-growth-factor-i
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch09.protein.i02
    locator: Chronic Adaptations to Aerobic Exercise > Endocrine Adaptations
  - id: ch06.connective-endocrine.i07
    q: 耐力訓練肌肉是否仍可能出現淨蛋白合成？
    a:
    - 教材引用的較新證據指出，耐力訓練運動員的骨骼肌可能出現淨蛋白合成，並可能導致肌肥大
    - 這些新生蛋白最可能以粒線體蛋白為主，而非收縮蛋白
    detail: 原文使用「suggests」「may」與「most likely」三層保留語氣；因此不能改寫成「確實合成、一定肥大、完全不是收縮蛋白」的斷言。
    terms:
    - mitochondria
    numbers: []
    concepts:
    - adaptation
    - hormone
    related:
    - ch09.protein.i03
    - ch05.hypertrophy.i01
    locator: Chronic Adaptations to Aerobic Exercise > Endocrine Adaptations
  - id: ch06.connective-endocrine.i08
    q: 有氧耐力訓練通常如何改變體組成？
    a:
    - 在營養攝取適當的前提下，體脂百分比通常下降，去脂體重幾乎沒有或沒有顯著改變
    - 較長期的訓練計畫可使體脂百分比下降更多
    - 過量訓練可能使分解代謝占優勢，造成分解與合成過程失衡
    detail: 體組成變化以「營養攝取適當」為前提；原文對過量訓練使用「may」，並未主張任何高訓練量都必然造成分解失衡。
    terms:
    - cortisol
    numbers: []
    concepts:
    - adaptation
    - nutrition
    related:
    - ch10.obesity-assessment.i05
    locator: Adaptations to Aerobic Endurance Training
- id: detraining
  title: 去訓練 & 有氧表現提升 Detraining & Performance
  desc: ''
  tag: Detraining
  items:
  - id: ch06.detraining.i01
    q: 什麼是去訓練（detraining）？
    a:
    - 去訓練是因訓練刺激不足，造成訓練誘發適應部分或完全喪失
    - 它遵循訓練可逆性原則：停止或大幅減少訓練，會使適應部分或完全逆轉並損害運動表現
    detail: 定義的關鍵是刺激「不足」，不要求一定完全停訓，也不以訓練是否有計畫作區分。
    terms:
    - detraining
    - reversibility
    numbers: []
    concepts:
    - adaptation
    - periodization
    related:
    - ch20.special-issues.i02
    - ch05.detraining.i01
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Detraining'
  - id: ch06.detraining.i02
    q: 高度訓練運動員短期去訓練時，最大攝氧量下降多少？
    a:
    - 教材把短期去訓練界定為 4 週；高度訓練運動員的最大攝氧量下降 4–14%
    - 下降主要來自血容量、每搏量與最大心輸出量降低，以及次最大運動心率上升
    detail: 教材明確把短期去訓練界定為四週；下降範圍也限定於高度訓練運動員，不能外推成所有人的固定幅度。
    terms:
    - detraining
    - vo2max
    - stroke-volume
    - cardiac-output
    - heart-rate
    numbers:
    - v: 4
      unit: 週
      of: 教材所界定的短期去訓練期間
    - v: 4–14
      unit: '%'
      of: 高度訓練運動員短期去訓練後最大攝氧量的下降幅度
    concepts:
    - adaptation
    - periodization
    related:
    - ch06.chronic-cardiovascular.i02
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Detraining'
  - id: ch06.detraining.i03
    q: 長期去訓練對最大攝氧量有何影響？
    a:
    - 教材把長期去訓練界定為超過 4 週；高度訓練運動員的最大攝氧量下降 6–20%
    - 有氧耐力適應因具有酵素基礎，對不活動期間特別敏感
    detail: 教材明確說明造成去訓練變化的確切細胞機制仍未知，需要更多研究；「具有酵素基礎」不是已釐清的完整細胞機制。
    terms:
    - detraining
    - vo2max
    numbers:
    - v: '>4'
      unit: 週
      of: 教材所界定的長期去訓練期間
    - v: 6–20
      unit: '%'
      of: 高度訓練運動員長期去訓練後最大攝氧量的下降幅度
    concepts:
    - adaptation
    - periodization
    related:
    - ch05.detraining.i08
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Detraining'
  - id: ch06.detraining.i04
    q: 有氧耐力訓練可使最大攝氧量提高多少？
    a:
    - 有氧耐力訓練可使有氧功率提高 5–30%
    - 幅度部分取決於起始體適能與個人的遺傳潛能；大部分最大攝氧量適應可在 6–12 個月內達成
    detail: 這是教材給出的整體範圍，不代表每個人都能達到上限；起點越接近個人生物上限，後續增益通常越小。
    terms:
    - vo2max
    numbers:
    - v: 5–30
      unit: '%'
      of: 有氧耐力訓練可提高有氧功率的範圍
    - v: 6–12
      unit: 個月
      of: 可達成大部分最大攝氧量適應的訓練期間
    concepts:
    - adaptation
    related:
    - ch20.program-design.i05
    locator: Adaptations to Aerobic Endurance Training
  - id: ch06.detraining.i05
    q: 乳酸閾值提高為何能改善表現？
    a:
    - 有氧訓練提高絕對乳酸閾值，使高度訓練者能在更高的相對與絕對最大攝氧量百分比下工作
    - 教材例題中，兩人的 VO₂max 同為 50 ml·kg⁻¹·min⁻¹；若閾值分別為 80% 與 70%，閾值即為 40 與 35 ml·kg⁻¹·min⁻¹
    - 在其他條件如動作經濟性相同時，前者可維持高出 5 ml·kg⁻¹·min⁻¹ 的功率輸出，因而有較高移動速度與較佳表現
    detail: 「乳酸閾值較高者表現較佳」在教材中以其他條件相同為前提；若動作經濟性等條件不同，不能只靠閾值預測結果。
    terms:
    - lactate-threshold
    - vo2max
    - exercise-economy
    numbers:
    - v: 50
      unit: ml·kg⁻¹·min⁻¹
      of: 教材比較例中兩人的相同最大攝氧量
    - v: 80/70
      unit: '% VO₂max'
      of: 教材比較例中兩人的乳酸閾值比例
    - v: 40/35
      unit: ml·kg⁻¹·min⁻¹
      of: 教材比較例中兩人對應的乳酸閾值攝氧量
    - v: 5
      unit: ml·kg⁻¹·min⁻¹
      of: 較高乳酸閾值者可維持的額外功率輸出等值差
    concepts:
    - adaptation
    - measurement
    related:
    - ch03.lactate.i08
    locator: Adaptations to Aerobic Endurance Training > What Are the Improvements in Performance From Aerobic Exercise?
  - id: ch06.detraining.i06
    q: 最大攝氧量趨於平臺後，耐力表現還能如何改善？
    a:
    - 大部分最大攝氧量適應在 6–12 個月內完成後，後續表現改善可來自跑步經濟性與乳酸閾值提高
    - 有經驗跑者的最大攝氧量可能不再因長期耐力訓練提高，但表現仍可能因跑步經濟性改善而進步
    detail: 運動經濟性主要取決於生物力學與技術；即使兩位運動員的 VO₂max 與乳酸閾值相同，維持同一功率輸出所需能量較少者仍能維持更久。
    terms:
    - vo2max
    - lactate-threshold
    - exercise-economy
    numbers:
    - v: 6–12
      unit: 個月
      of: 可達成大部分最大攝氧量適應的訓練期間
    concepts:
    - adaptation
    - technique
    related:
    - ch20.aerobic-performance-factors.i04
    - ch20.aerobic-performance-factors.i07
    locator: Adaptations to Aerobic Endurance Training > What Are the Improvements in Performance From Aerobic Exercise?
  - id: ch06.detraining.i07
    q: 高強度間歇的休息長短如何影響適應？
    a:
    - 短時間高強度間歇衝刺若搭配短休息，可改善最大攝氧量
    - 衝刺間使用長休息可改善衝刺速度，卻未顯著提高最大有氧功率
    - 高強度間歇之間採較短恢復期，可改善多項骨骼肌代謝過程與耐力表現
    detail: 教材的比較重點是工作與恢復的組合；不能只看到「高強度衝刺」就推論一定會改善有氧能力。
    terms:
    - interval-training
    - vo2max
    numbers: []
    concepts:
    - adaptation
    - program-design
    related:
    - ch03.metabolic-specificity.i02
    - ch20.training-types.i04
    locator: Adaptations to Aerobic Endurance Training
  - id: ch06.detraining.i08
    q: 減量訓練（tapering）與去訓練有何不同？
    a:
    - 減量訓練是賽前或計畫恢復微週期中，有計畫地降低訓練量，通常減少持續時間與頻率，但不降低強度，目的是提升表現與適應
    - 去訓練則是刺激不足造成適應部分或完全喪失，可能來自停止或大幅減少訓練
    - 適當的運動變化、強度、維持計畫與主動恢復，可防止嚴重去訓練效應
    detail: 兩者不是以「有計畫／無計畫」單獨區分；真正差別在於減量仍保留足以維持適應的強度與設計目的，而去訓練的刺激已不足。
    terms:
    - tapering
    - detraining
    - reversibility
    numbers: []
    concepts:
    - adaptation
    - periodization
    related:
    - ch20.special-issues.i03
    - ch21.active-rest.i07
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Detraining'
- id: external-factors
  title: 外部因素影響 External Factors
  desc: ''
  tag: External Factors
  items:
  - id: ch06.external-factors.i01
    q: 海拔多高開始出現急性生理調整，反應有哪些？
    a:
    - 高於 3,900 feet（約 1,200 m）時，身體開始因大氣氧分壓降低而出現急性調整
    - 靜息與運動時過度換氣，初期主要靠呼吸頻率增加；較久後潮氣量也會參與
    - 早期靜息與次最大運動的心輸出量主要因心率上升而增加；次最大心率與心輸出量可比海平面高 30–50%，每搏量不變或略降
    detail: 即使有過度換氣與心輸出量增加，急性暴露期的動脈血氧飽和度仍會下降，使最大攝氧量與有氧表現在此高度以上降低。
    terms:
    - hyperventilation
    - partial-pressure
    - heart-rate
    - cardiac-output
    - stroke-volume
    - vo2max
    numbers:
    - v: '>3,900'
      unit: feet
      of: 教材所述開始出現急性海拔生理調整的高度
    - v: 約 >1,200
      unit: m
      of: 上述海拔門檻的公制換算
    - v: 30–50
      unit: '% above sea-level values'
      of: 急性海拔暴露時次最大心率與心輸出量相對海平面的增幅
    concepts:
