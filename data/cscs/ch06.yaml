  - id: ch06.acute-cardiovascular.i05
    q: 有氧運動如何增加靜脈回流與每搏量？
    a:
    - 交感神經活化引起的靜脈收縮、骨骼肌幫浦與呼吸幫浦共同增加靜脈回流
    - 回心血量增加使舒張末期容積上升，心肌纖維比靜息時拉得更長，收縮與收縮期射血更有力
    - 這項「收縮力取決於心肌壁纖維長度」的原理稱為 Frank–Starling 機制
    detail: 教材另列出第二條每搏量調節途徑：腎上腺素與正腎上腺素提高心肌收縮力，使心室收縮更強、收縮期排空更多；因此每搏量不只由回心血量決定。
    terms:
    - venous-return
    - skeletal-muscle-pump
    - respiratory-pump
    - end-diastolic-volume
    - frank-starling-mechanism
    - epinephrine
    - norepinephrine
    numbers: []
    concepts:
    - circulation
    related:
    - ch01.cardiovascular.muscle-pump
    locator: Acute Responses to Aerobic Exercise > Cardiovascular Responses > Stroke Volume
  - id: ch06.acute-cardiovascular.i06
    q: 收縮壓（systolic blood pressure, SBP）與雙乘積如何反映心臟工作？
    a:
    - 收縮壓估計心室收縮、血液被用力射出時對動脈壁施加的壓力
    - 心率乘以收縮壓稱為率壓乘積或雙乘積（rate–pressure product／double product），用來估計心肌耗氧量與心臟做功
    - 最大有氧運動時，收縮壓通常可升至 220–260 mmHg
    detail: 220–260 mmHg 描述最大有氧運動可正常出現的收縮壓範圍，不是靜息血壓標準；判讀時必須保留運動強度情境。
    terms:
    - systolic-blood-pressure
    - double-product
    - heart-rate
    numbers:
    - v: 220–260
      unit: mmHg
      of: 最大有氧運動時收縮壓通常可達的範圍
    concepts:
    - circulation
    - measurement
    - normal-values
    related:
    - ch05.cardiovascular-adaptations.i02
    locator: Acute Responses to Aerobic Exercise > Blood Pressure
  - id: ch06.acute-cardiovascular.i07
    q: 舒張壓與平均動脈壓在有氧運動中如何判讀？
    a:
    - 舒張壓（diastolic blood pressure, DBP）估計心室舒張、沒有血液被用力射出時動脈壁承受的壓力，並可反映周邊阻力
    - 有氧運動造成血管擴張，舒張壓可下降；最大有氧運動時通常維持靜息水準或略降
    - 平均動脈壓（mean arterial pressure, MAP）＝［（SBP－DBP）÷3］＋DBP
    detail: 平均動脈壓不是收縮壓與舒張壓的算術平均，因為一個心動週期中，動脈壓停留在接近舒張壓的時間較長。
    terms:
    - diastolic-blood-pressure
    - mean-arterial-pressure
    - vasodilation
    numbers:
    - v: 3
      unit: 除數
      of: 平均動脈壓公式中收縮壓與舒張壓差值的除數
    concepts:
    - circulation
    - measurement
    related:
    - ch01.cardiovascular.vessels
    locator: Acute Responses to Aerobic Exercise > Blood Pressure
  - id: ch06.acute-cardiovascular.i08
    q: 劇烈有氧運動如何重新分配局部血流？
    a:
    - 活動肌肉的局部微動脈擴張，使流入活動肌肉的血量大幅增加；其他器官系統的微動脈同時收縮，血流因而減少
    - 靜息時骨骼肌獲得 15–20% 的心輸出量，劇烈運動時可升至 90%
    detail: 血液黏度與血管長度也會影響阻力，但教材指出它們在多數情況下相對固定，因此局部血流主要由血管收縮與擴張調節。
    terms:
    - arteriole
    - vasoconstriction
    - vasodilation
    - cardiac-output
    numbers:
    - v: 15–20
      unit: '% cardiac output'
      of: 靜息時分配至骨骼肌的心輸出量比例
    - v: 90
      unit: '% cardiac output'
      of: 劇烈運動時分配至骨骼肌的心輸出量比例上限
    concepts:
    - circulation
    related:
    - ch01.cardiovascular.vessels
    locator: Acute Responses to Aerobic Exercise > Control of Local Circulation
- id: acute-respiratory
  title: 急性呼吸反應 Acute Respiratory Response
  desc: ''
  tag: Respiratory
  items:
  - id: ch06.acute-respiratory.i01
    q: 劇烈有氧運動時分鐘通氣量如何增加？
    a:
    - 分鐘通氣量（minute ventilation）是每分鐘呼吸的空氣容積，會隨呼吸深度、頻率或兩者增加而上升
    - 健康年輕成人的呼吸頻率通常由靜息 12–15 breaths/min 增至劇烈運動時 35–45 breaths/min
    - 潮氣量由靜息 0.4–1 L 增至最多 3 L 或更高，使分鐘通氣量可達靜息值的 15–25 倍，即 90–150 L/min
    detail: 這些範圍描述健康年輕成人在劇烈運動時的典型反應；增加可來自呼吸更深、呼吸更快或兩者並行，不能只用單一變項解釋。
    terms:
    - minute-ventilation
    - tidal-volume
    numbers:
