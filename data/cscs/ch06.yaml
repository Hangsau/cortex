    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Altitude
  - id: ch06.external-factors.i02
    q: 較長期的高海拔適應包括哪些變化？
    a:
    - 在同一海拔 10–14 天內，因紅血球生成增加，心率與心輸出量開始回到正常值
    - 長期調整包括血紅素形成通常增加 5–15%、紅血球增加 30–50%、肺膜氧擴散能力提高，以及微血管化增加
    - 腎臟排出 HCO₃⁻ 並配合過度換氣，協助維持體液酸鹼平衡
    detail: 教材說這些適應可提高對中、高海拔相對缺氧的耐受，充分適應後運動能力「可能」接近海平面；它不是保證最大攝氧量完全恢復。
    terms:
    - hemoglobin
    - hyperventilation
    - diffusion
    - capillary
    numbers:
    - v: 10–14
      unit: 天
      of: 在同一海拔下心率與心輸出量開始回到正常值的時間
    - v: 5–15
      unit: '%'
      of: 長期海拔適應時血紅素形成的一般增加幅度
    - v: 30–50
      unit: '%'
      of: 長期海拔適應時紅血球增加幅度
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch20.altitude-training.i05
    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Altitude
  - id: ch06.external-factors.i03
    q: 中等海拔適應需要多久，回到海平面後又如何？
    a:
    - 在 2,200–3,000 m 的中等海拔，至少需要 3–6 週適應
    - 回到海平面後，海拔適應變化約在 1 個月內逆轉
    - 無論適應多久，海拔暴露時的表現一般仍預期低於海平面
    detail: 原文同時說充分適應後運動能力「可能接近」海平面，又說表現「一般仍預期較低」；教材原文如此。這反映可能接近不等於通常可完全恢復。
    terms:
    - detraining
    numbers:
    - v: 2,200–3,000
      unit: m
      of: 教材所稱需要至少三至六週適應的中等海拔範圍
    - v: 3–6
      unit: 週
      of: 中等海拔所需的最低適應時間
    - v: 約 1
      unit: 個月
      of: 回到海平面後海拔適應變化逆轉的時間
    concepts:
    - adaptation
    - safety
    related:
    - ch20.altitude-training.i07
    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Altitude
  - id: ch06.external-factors.i04
    q: 高氧呼吸是否確定能改善運動表現？
    a:
    - 在休息期或運動後吸入富氧混合氣體，被提議可改善某些運動表現，但研究結果分歧、做法仍具爭議
    - 它可能增加血液攜氧量與工作肌肉的氧供應，但機制尚未充分了解
    - 健康人在海平面呼吸環境空氣時，動脈血紅素氧飽和度已達 95–98%，因此休息期或運動後高氧呼吸的潛在效益仍未完全釐清
    detail: 原文沒有下「有效」或「無效」的定論；現階段可肯定的是生理提升空間有限，而研究尚未解決這項做法是否穩定改善表現。
    terms:
    - hyperoxic-breathing
    - hemoglobin
    numbers:
    - v: 95–98
      unit: '% saturation'
      of: 健康人在海平面呼吸環境空氣時的動脈血紅素氧飽和度
    concepts:
    - ergogenic
    - safety
    related:
    - ch20.altitude-training.i02
    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Hyperoxic Breathing
  - id: ch06.external-factors.i05
    q: 吸菸如何損害運動時的呼吸與攜氧？
    a:
    - 尼古丁相關的細支氣管收縮，或煙霧刺激造成的分泌液增加與支氣管樹腫脹，會提高氣道阻力
    - 尼古丁使呼吸道表面纖毛麻痺，限制清除多餘液體與異物，讓碎屑堆積並增加呼吸困難
    - 一氧化碳對血紅素的親和力高於氧，形成碳氧血紅素並減少可送到工作肌肉的氧
    detail: 攜氧能力下降「可能」降低最大運動能力，次最大心血管反應也可能為維持供氧而增加；一氧化碳相關的兒茶酚胺釋放則會提高心率與血壓。教材未把表現下降幅度量化。
    terms:
    - bronchiole
    - hemoglobin
    - carboxyhemoglobin
    - catecholamine
    numbers: []
    concepts:
    - gas-exchange
    - safety
    related:
    - ch01.respiratory.gas-exchange
    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Smoking
  - id: ch06.external-factors.i06
    q: 血液摻假如何進行、可能帶來哪些效果與風險？
    a:
    - 可輸注自己的或他人的紅血球，或施用促紅血球生成素（erythropoietin, EPO）刺激紅血球生成
    - 兩種方式都被證明可使最大攝氧量提高最多 11%；固定次最大工作量下也與心率、血乳酸下降及 pH 較高相關
    - 高血比容「理論上可能」增加中風、心肌梗塞、深層靜脈栓塞與肺栓塞等栓塞事件風險
    detail: 血液摻假被批評為不道德且有嚴重健康風險。輸注可快速增加紅血球量但只維持數週；EPO 要經數週產生變化，並在持續用藥時維持。教材也列出 EPO 可能造成動脈壓升高、類流感症狀與血漿鉀上升。
    terms:
    - blood-doping
    - erythropoietin
    - vo2max
    - heart-rate
    numbers:
    - v: 最多 11
      unit: '%'
      of: 紅血球輸注或 EPO 施用後最大攝氧量的已證實增幅
    concepts:
    - ergogenic
    - safety
    related:
    - ch11.epo-blood-doping.i01
    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Blood Doping
  - id: ch06.external-factors.i07
    q: 遺傳潛能與目前訓練狀態如何限制適應幅度？
    a:
    - 個人的遺傳上限會影響訓練適應的絕對幅度，目前訓練狀態也會影響可改變多少
    - 每個生物系統都有上限；越接近上限，觀察到的增益越小
    - 菁英運動員可能只剩極小增益，因此訓練計畫設計與監控更為關鍵
    detail: 教材以某些菁英競賽為例，0.05% 的進步仍可能改變名次；這不是一般訓練可保證的增幅，而是說明上限附近的小差異仍具競賽價值。
    terms: []
    numbers:
    - v: 0.05
      unit: '%'
      of: 教材示例中菁英運動員可能值得投入額外訓練爭取的表現增幅
    concepts:
    - adaptation
    - population
    related:
    - ch20.program-design.i05
    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Genetic Potential
  - id: ch06.external-factors.i08
    q: 年齡與性別如何影響有氧功率與訓練反應？
    a:
    - 成人最大有氧功率會隨年齡下降，教材列出的伴隨變化包括肌肉量與肌力下降（肌少症）及脂肪量增加
    - 年齡配對時，女性的平均有氧功率為男性的 73–85%
    - 可能因素包括女性體脂百分比較高、血紅素較低，以及男性心臟較大、血容量較高；但男女對訓練的一般生理反應相似
    detail: 73–85% 是按年齡配對後的平均性別比較，不是用來預測任何單一個體；訓練反應相似也不代表兩組起始絕對值相同。
    terms:
    - sarcopenia
    - hemoglobin
    numbers:
    - v: 73–85
      unit: "% of men's values"
      of: 年齡配對時女性平均有氧功率相對男性的範圍
    concepts:
    - adaptation
    - population
    related:
    - ch07.female-physiology.i08
    - ch20.program-design.i08
    locator: External and Individual Factors Influencing Adaptations to Aerobic Endurance Training > Age and Sex
- id: overtraining
  title: 過度訓練症候群 Overtraining Syndrome
  desc: ''
  tag: Overtraining
  items:
  - id: ch06.overtraining.i01
    q: 過度訓練過程如何從功能性過度負荷進展到 OTS？
    a:
    - 過度訓練在共識定義中是一個過程，可在短期造成過度負荷，也可長期發展成過度訓練症候群（overtraining syndrome, OTS）
    - 功能性過度負荷（functional overreaching, FOR）是刻意加劇訓練，先短暫降低表現，經數天至數週恢復後產生超補償改善
    - 非功能性過度負荷（nonfunctional overreaching, NFOR）使表現停滯或下降，需數週至數月恢復；若仍持續加劇訓練且恢復不足，可進展為需數月恢復的 OTS
    detail: 三者共同特徵都是表現下降，不能只憑是否「練很累」分類；教材以恢復所需時間與恢復後是否出現超補償區分這條連續體。
    terms:
    - overreaching
    - nonfunctional-overreaching
    - overtraining-syndrome
    numbers: []
    concepts:
    - adaptation
    - periodization
    related:
    - ch05.overtraining.i01
    - ch21.gas-theory.i03
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers'
  - id: ch06.overtraining.i02
    q: OTS 最常見的原因與其他壓力來源是什麼？
    a:
    - 最常見、也是主要原因，是訓練加劇而沒有足夠恢復
    - OTS 是壓力源的累積總和；其他促成因素包括睡眠不足、熱、冷、海拔與污染等環境因素、人際困難及旅行
    detail: 原文是 intensified training，不等於只指「高強度」；訓練量、強度或整體負荷加劇，只要恢復不足，都可能推動連續體惡化。
    terms:
    - overtraining-syndrome
    numbers: []
    concepts:
    - adaptation
    - periodization
    related:
    - ch05.overtraining.i07
    - ch21.fitness-fatigue.i01
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Strategies for Prevention of Overtraining Syndrome'
  - id: ch06.overtraining.i03
    q: NFOR 或 OTS 在大學游泳與其他耐力運動員中有多常見？
    a:
    - 教材引用的一項研究估計，約 10% 的大學游泳選手與其他有氧耐力運動員曾經歷 NFOR 或 OTS，範圍為 7–21%
    detail: 教材先指出 OTS 盛行率難以測量，再引用這項研究；因此此數字是特定研究的估計，不是所有運動員的確定盛行率。
    terms:
    - nonfunctional-overreaching
    - overtraining-syndrome
    numbers:
    - v: 約 10
      unit: '%'
      of: 研究估計曾經歷 NFOR 或 OTS 的大學游泳與其他有氧耐力運動員比例
    - v: 7–21
      unit: '%'
      of: 上述 NFOR 或 OTS 盛行率估計的範圍
    concepts:
    - adaptation
    - periodization
    related:
    - ch05.overtraining.i06
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers'
  - id: ch06.overtraining.i04
    q: OTS 可能出現哪些心血管反應？
    a:
    - 靜息心率可能下降或上升；心率變異性可能下降，代表副交感輸入減少或交感刺激過度
    - 過度訓練會降低運動誘發的最大心率，也有研究觀察到固定絕對次最大強度下的心率下降
    - 訓練量增加通常不影響靜息血壓；訓練強度增加則可提高靜息舒張壓，而不影響靜息收縮壓
    detail: 同章後面的潛在標記清單又列出「次最大運動心率增加」，與本小節的下降方向並存；教材原文如此。這也支持不能用單一心率方向診斷 OTS。
    terms:
    - heart-rate
    - heart-rate-variability
    - parasympathetic
    - sympathetic
    - systolic-blood-pressure
    - diastolic-blood-pressure
    numbers: []
    concepts:
    - adaptation
    - measurement
    related:
    - ch05.overtraining.i04
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Cardiovascular Responses'
  - id: ch06.overtraining.i05
    q: 訓練量過高時，肌酸激酶、乳酸與肌糖原如何改變？
    a:
    - 異常高訓練量可使肌酸激酶（creatine kinase, CK）升高，表示肌肉損傷
    - 訓練量增加時，乳酸濃度下降或維持不變；血脂與脂蛋白不變
    - 長期過度訓練時肌糖原下降，但可能主要受飲食影響；糖原降低也可能促成較低的乳酸反應
    detail: 肌酸激酶與荷爾蒙等變項往往只反映訓練量，並非 OTS 的專一診斷；飲食又會混淆肌糖原與乳酸，因此需要和表現及其他脈絡一起判讀。
    terms:
    - creatine-kinase
    - glycogen
    numbers: []
    concepts:
    - adaptation
    - measurement
    related:
    - ch03.substrate.i03
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Biochemical Responses'
  - id: ch06.overtraining.i06
    q: 睪固酮與皮質醇比值能單獨診斷 OTS 嗎？
    a:
    - 訓練量增加時，睪固酮／皮質醇比值會下降或不變；游離睪固酮／皮質醇比值曾被報告下降 5–50%
    - 游離睪固酮／皮質醇比值下降至少 30%，是「可能」的 OTS 標記
    - 過度訓練時生長激素的腦下垂體分泌下降，這類內分泌反應看來主要源於下視丘功能受損，而非腦下垂體本身
    detail: 男性總睪固酮在初期上升後可能下降，但教材提醒這是壓力刺激反應，不應直接視為過度訓練指標；原文也沒有說皮質醇一定上升。這些內分泌改變是否造成表現下降仍有爭議。
    terms:
    - testosterone
    - cortisol
    - growth-hormone
    - overtraining-syndrome
    numbers:
    - v: 5–50
      unit: '%'
      of: 訓練量增加時游離睪固酮／皮質醇比值的已報告下降幅度
    - v: ≥30
      unit: '%'
      of: 游離睪固酮／皮質醇比值被提出作為可能 OTS 標記的下降門檻
    concepts:
    - adaptation
    - hormone
    - measurement
    related:
    - ch04.cortisol.i05
    - ch05.overtraining.i08
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Endocrine Responses'
  - id: ch06.overtraining.i07
    q: 過度訓練時兒茶酚胺反應呈現什麼模式？
    a:
    - 過度訓練跑者的腎上腺素、正腎上腺素與多巴胺基礎值變化，與自陳抱怨嚴重程度顯著相關
    - 嚴重訓練量過高可降低夜間腎上腺素；運動前或靜息腎上腺素與正腎上腺素則可不變或升高
    - 基礎多巴胺與相同絕對工作量下的多巴胺濃度下降；次最大運動的多巴胺反應則不一
    - 嚴重的有氧耐力訓練量過高可能形成副交感型 OTS，兒茶酚胺敏感性降低，並在進階個案中發展成嚴重 OTS
    detail: 不同採樣時點、工作量與嚴重度會得到不同方向，因此「兒茶酚胺改變」不是單一上升或下降模式；教材也說這類嚴重狀態常難以記錄。
    terms:
    - catecholamine
    - epinephrine
    - norepinephrine
    - dopamine
    - overtraining-syndrome
    numbers: []
    concepts:
    - adaptation
    - hormone
    - measurement
    related:
    - ch04.catecholamines.i05
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Endocrine Responses'
  - id: ch06.overtraining.i08
    q: 教練與運動員可如何預防 OTS？
    a:
    - 遵守良好營養原則，並確保充足睡眠與恢復時間
    - 追蹤訓練計畫與表現紀錄，讓強度與訓練量具有變化，以便及早發現變化並調整
    - 讓運動員可向教練、醫師、營養師與心理師組成的跨專業健康團隊討論生活與訓練問題
    detail: OTS 的確定辨識仍有爭議；教材列出的潛在標記沒有任何一項符合敏感、專一、先於症候群、易精確測量、低侵入且低成本的全部條件，因此預防要依靠持續監控與多面向資訊，而不是等待單一檢驗值越界。
    terms:
    - overtraining-syndrome
    numbers: []
    concepts:
    - periodization
    - program-design
    related:
    - ch21.sfra-theory.i01
    locator: 'Overtraining: Definition, Prevalence, Diagnosis, and Potential Markers > Strategies for Prevention of Overtraining Syndrome > What Are the Markers of Aerobic Overtraining?'
cards:
- q: 心輸出量（Q̇）如何計算，最大運動時可達多少？
  a: Q̇＝每搏量×心率；由靜息約 5 L/min 增至最大運動 20–22 L/min，約為四倍，過程是先快速、再逐漸增加，最後進入平臺。
  tag: 急性心血管
- q: 有氧運動時每搏量何時進入平臺，教材的族群數值是多少？
  a: 攝氧量約達 40–50% VO₂max 後開始進入平臺；久坐大學年齡男性最大值平均 100–120 ml/beat，同齡女性約低 25%。
  tag: 急性心血管
- q: Frank–Starling 機制如何提高每搏量？
  a: 靜脈回流增加使舒張末期容積上升，心肌纖維拉得更長，接著產生更有力的收縮與收縮期射血。
  tag: 急性心血管
- q: 有氧運動增加靜脈回流的三項機制是什麼？
  a: 交感神經引起的靜脈收縮、肌肉收縮配合單向靜脈瓣形成的骨骼肌幫浦，以及呼吸頻率與潮氣量增加形成的呼吸幫浦。
  tag: 急性心血管
- q: 教材列出的兩種最大心率估算式與誤差邊界是什麼？
  a: 傳統式為 220－年齡，估計值周圍標準差為 ±10–12 beats/min；健康成人可用 208－0.7×年齡，教材稱其較準確。
  tag: 急性心血管
- q: Fick 方程式如何連結攝氧量與循環功能？
  a: V̇O₂＝心輸出量×動靜脈氧差，也可展開為心率×每搏量×動靜脈氧差；若要表示為 ml·kg⁻¹·min⁻¹，再除以體重公斤數。
  tag: 急性心血管
- q: 1 MET 如何定義，正常健康者的 VO₂max 一般範圍為何？
  a: 1 MET 是一般人的估計靜息攝氧量 3.5 ml·kg⁻¹·min⁻¹；正常健康者的 VO₂max 一般為 25–80 ml·kg⁻¹·min⁻¹，即 7.1–22.9 METs。
  tag: 急性心血管
- q: 率壓乘積（rate–pressure product）如何計算，有何用途？
  a: 心率×收縮壓；又稱雙乘積，用來估計心肌耗氧量與心臟做功。
  tag: 急性心血管
- q: 最大有氧運動時收縮壓與舒張壓通常如何變化？
  a: 收縮壓通常可升至 220–260 mmHg；舒張壓因血管擴張維持靜息水準或略降。
  tag: 急性心血管
- q: 平均動脈壓公式為何，為什麼不是收縮壓與舒張壓的平均？
  a: MAP＝［（SBP－DBP）÷3］＋DBP；因心動週期中動脈壓停留在接近舒張壓的時間較長，所以不是兩者的算術平均。
  tag: 急性心血管
- q: 健康年輕成人劇烈運動時，呼吸頻率與潮氣量如何改變？
  a: 呼吸頻率由靜息 12–15 增至 35–45 breaths/min；潮氣量由 0.4–1 L 增至最多 3 L 或更高。
  tag: 急性呼吸
- q: 劇烈運動時分鐘通氣量可增加多少？
  a: 可達靜息值的 15–25 倍，即 90–150 L/min；增幅可來自呼吸深度、頻率或兩者提高。
  tag: 急性呼吸
- q: 換氣當量如何定義，低中強度與高強度時各是多少？
  a: 它是分鐘通氣量與攝氧量的比值；低中強度為 20–25 L air/L O₂，高強度時可升至 35–40 L air/L O₂，並與血乳酸突然上升平行。
  tag: 急性呼吸
- q: 解剖死腔與生理死腔有何差異？
  a: 解剖死腔是鼻、口與傳導氣道等不交換氣體的區域，年輕成人約 150 ml；生理死腔是血流、通氣或肺泡表面有問題的肺泡，健康人通常可忽略，特定肺病時可達解剖死腔的十倍。
  tag: 急性呼吸
- q: 為什麼增加潮氣量比只加快呼吸更有效率？
  a: 深呼吸雖也使解剖死腔增加，但潮氣量的增加比例更大，因此新增空氣中能到達氣體交換區的比例較高。
  tag: 急性呼吸
- q: 靜息與高強度運動時，組織氧與二氧化碳分壓如何比較？
  a: 靜息組織間液 PO₂ 最低約 40 mmHg、PCO₂ 約 46 mmHg；高強度運動時約為 3 與 90 mmHg。靜息動脈血 PO₂ 約 100 mmHg，不可誤當成靜息組織值。
  tag: 急性呼吸
- q: 血漿與血紅素各自如何運送氧？
  a: 每公升血漿只能攜帶約 3 ml 氧，血中大部分氧由血紅素運送；男性每 100 ml 血液的攜氧容量約 20 ml 氧，女性略低。
  tag: 血液運輸
- q: 二氧化碳最主要以什麼形式經血液運輸？
  a: 約 70% 以碳酸氫根形式送往肺部；紅血球內的碳酸酐酶加速反應，血紅素結合氫離子協助緩衝，碳酸氫根則擴散到血漿。
  tag: 血液運輸
- q: 本章如何定義 OBLA，Cori 循環又負責什麼？
  a: OBLA 是血乳酸開始上升的有氧運動水準，本章沒有指定固定 mmol/L 門檻；Cori 循環把肌肉乳酸經血液送到肝臟進行糖質新生。
  tag: 血液運輸
- q: 長期 6–12 個月有氧耐力訓練最顯著的心血管改變是什麼？
  a: 最大心輸出量增加，主因是每搏量改善；左心室腔室容積、壁厚與收縮力增加都是關鍵。
  tag: 慢性心血管
- q: 有氧訓練後靜息與固定次最大工作量下的心率如何變化？
  a: 靜息心率因副交感張力與每搏量增加而下降；固定絕對次最大工作量下，心率較低且上升較慢。最大心率則可能略降。
  tag: 慢性心血管
- q: 高度訓練有氧耐力選手常見的靜息心率範圍與原因是什麼？
  a: 常見 40–60 beats/min；副交感張力使竇房結放電變慢，加上每搏量提高，同一心輸出量可用較少次收縮維持。
  tag: 慢性心血管
- q: 長期有氧訓練一定會提高最大心率嗎？
  a: 不一定；教材說最大心率可能略微下降，且可能與副交感張力增加有關。此時提高最大心輸出量更依賴左心室大小、收縮力與每搏量。
  tag: 慢性心血管
- q: 有氧訓練增加肌肉微血管密度有何意義？
  a: 縮短氧與代謝底物的擴散距離，並支援氧、營養與荷爾蒙輸送，以及熱與代謝副產物移除；增幅受訓練量與強度影響。
  tag: 慢性心血管
- q: 有氧耐力訓練後粒線體如何適應？
  a: 數量與大小都增加，擴大以糖原與游離脂肪酸氧化、有氧製造 ATP 的能力；配合肌紅蛋白增加，肌肉提取與使用氧的能力提高。
  tag: 慢性肌肉
- q: 肌紅蛋白的功能與有氧訓練適應是什麼？
  a: 它在肌肉細胞內運送氧；訓練後含量增加，使更多氧可送至粒線體。它不同於在血液中攜氧的血紅素。
  tag: 慢性肌肉
- q: 教材對 VO₂max 訓練增幅列出哪些不同範圍？
  a: 表現小節列菁英運動員約 5–10%、未訓練者最多 20%；另一總述列整體有氧功率可提高 5–30%，取決於起始體適能與遺傳潛能，兩者不是同一族群估計。
  tag: 慢性肌肉
- q: 同樣 VO₂max 的兩人，乳酸閾值較高者為何可能表現較佳？
  a: 教材例中兩人 VO₂max 都是 50 ml·kg⁻¹·min⁻¹，閾值 80% 者可到 40，閾值 70% 者只有 35；在運動經濟性等條件相同時，前者可維持高出 5 ml·kg⁻¹·min⁻¹ 的輸出。
  tag: 慢性肌肉
- q: 脂肪利用增加與糖原節省如何延長耐力表現？
  a: 訓練後在相同強度下使用較多脂肪、較少糖原，可延長表現；這組機制與教材另列的 OBLA 位移可能原因不可合併成單一因果鏈。
  tag: 慢性肌肉
- q: 有氧訓練後 Type IIx 一定會轉成 Type IIa 嗎？
  a: 原文只說「可能」逐漸由 IIx 轉為 IIa；IIa 氧化能力較高、特性更接近 Type I，但這不等於第二型纖維轉成第一型。
  tag: 慢性肌肉
- q: 有氧耐力訓練對第一型肌纖維的肥大效果如何？
  a: 因徵召增加而出現選擇性肥大，但橫截面直徑不及經阻力訓練適應的第二型纖維，且變化小於健美式阻力訓練造成的第一型纖維肥大。
  tag: 慢性肌肉
- q: 有氧耐力訓練通常如何改變體組成？
  a: 在營養攝取適當的前提下，體脂百分比通常下降，去脂體重幾乎沒有或沒有顯著改變；較長期計畫可讓體脂降得更多，過量訓練則可能造成分解與合成失衡。
  tag: 慢性肌肉
- q: 有氧運動要刺激骨形成，必須符合哪些條件？
  a: 強度明顯高於日常活動、超過最低強度與週期性應變頻率門檻，並有系統地提高強度；提高肢體移動速率或採高強度間歇可增加成骨刺激。
  tag: 骨骼結締組織
- q: 教材如何描述耐力訓練的蛋白質分解與合成？
  a: 跑步常與淨蛋白分解增加相關，皮質醇是部分原因，身體嘗試以睪固酮與 IGF-I 反應抵銷；較新證據僅「指出可能」有淨合成與肌肥大，且最可能以粒線體蛋白為主。
  tag: 內分泌
- q: 海拔多高開始出現急性調整，主要反應是什麼？
  a: 高於 3,900 feet（約 1,200 m）開始；過度換氣初期以呼吸頻率增加為主，心率使靜息與次最大心輸出量上升，次最大心率與心輸出量可比海平面高 30–50%。
  tag: 外在因素
- q: 長期海拔適應時紅血球與血紅素各增加多少？
  a: 紅血球增加 30–50%，血紅素形成通常增加 5–15%；另有肺膜氧擴散能力與微血管化提高，以及腎臟排出 HCO₃⁻ 協助酸鹼平衡。
  tag: 外在因素
- q: 中等海拔適應與回海平面後逆轉各需多久？
  a: 在 2,200–3,000 m 至少需 3–6 週適應；回到海平面後約一個月逆轉。充分適應後能力可能接近海平面，但表現一般仍預期較低，教材原文如此。
  tag: 外在因素
- q: 吸菸如何直接增加呼吸困難？
  a: 尼古丁相關的細支氣管收縮，或煙霧刺激造成分泌液增加與支氣管樹腫脹，會提高氣道阻力；尼古丁也使呼吸道纖毛麻痺，讓液體、異物與碎屑堆積。
  tag: 外在因素
- q: 香菸中的一氧化碳如何影響運動供氧？
  a: 一氧化碳對血紅素的親和力高於氧，形成碳氧血紅素並降低攜氧量；這可能降低最大運動能力，次最大心血管反應也可能代償性增加，兒茶酚胺釋放則使心率與血壓上升。
  tag: 外在因素
- q: 血液摻假的方式與已觀察到的效果是什麼？
  a: 輸注自己或他人的紅血球，或施用 EPO 刺激紅血球生成；兩者可使 VO₂max 提高最多 11%，固定次最大工作量下與心率、血乳酸下降及 pH 較高相關，但伴隨倫理與健康風險。
  tag: 外在因素
- q: FOR、NFOR 與 OTS 如何以表現及恢復時間區分？
  a: FOR 是刻意加劇訓練後短暫表現下降，數天至數週恢復並超補償；NFOR 表現停滯或下降，需數週至數月；持續加劇且恢復不足可進展為 OTS，需數月恢復。
  tag: 過度訓練
- q: 大學游泳與其他耐力運動員的 NFOR／OTS 盛行率估計是多少？
  a: 一項研究估計約 10%，範圍 7–21%；教材先提醒 OTS 盛行率難以測量，因此這不是所有運動員的固定比率。
  tag: 過度訓練
- q: OTS 的心率方向能作為單一診斷嗎？
  a: 不能。靜息心率可升或降，HRV 可能下降，最大心率下降；心血管小節說固定絕對次最大強度心率下降，但標記清單又列增加，教材原文如此，必須結合其他證據。
  tag: 過度訓練
- q: 游離睪固酮／皮質醇比值下降多少被提出為可能的 OTS 標記？
  a: 至少下降 30%；研究報告的下降範圍為 5–50%。它只是可能標記，總睪固酮下降也可能只是壓力反應，教材沒有說皮質醇一定上升。
  tag: 過度訓練
- q: 預防 OTS 的實務策略有哪些？
  a: 確保營養、睡眠與恢復；追蹤訓練計畫及表現，讓強度與訓練量有變化；讓運動員能向教練、醫師、營養師與心理師組成的跨專業團隊求助。沒有任何單一標記符合全部理想條件。
  tag: 過度訓練
- q: 去訓練如何定義，短期與長期對高度訓練者 VO₂max 的影響為何？
  a: 刺激不足造成適應部分或完全喪失；教材的短期是 4 週，VO₂max 下降 4–14%，長期是超過 4 週，下降 6–20%。
  tag: 去訓練
- q: 減量訓練與去訓練真正的差別是什麼？
  a: 減量是賽前或恢復微週期中有計畫地減少持續時間與頻率、通常保留強度以提升表現；去訓練則是任何使刺激不足並喪失適應的停止或大幅減量，不以是否有計畫單獨區分。
  tag: 去訓練
- q: 有氧耐力訓練可透過哪些不同途徑改善表現？
  a: 提高 VO₂max 與乳酸閾值、增加脂肪利用並節省糖原、改善運動經濟性，以及降低固定次最大工作量下的心率與呼吸頻率；各途徑不是同一項指標的重複說法。
  tag: 綜合
- q: 有氧訓練的慢性通氣適應是否能跨運動模式轉移？
  a: 不一定。最大運動時潮氣量與呼吸頻率增加，次最大時常見頻率下降、潮氣量增加；但適應高度活動特異，下肢訓練不太可能讓上肢活動出現同樣改善。
  tag: 慢性心血管
- q: 協同肌與運動單位輪替活化如何改善有氧動作效率？
  a: 協同肌及單一肌肉內的運動單位在活動與不活動間交替，不必持續恆定活化，仍可維持低程度肌力並降低能量消耗，使訓練初期效率提高、疲勞延後。
  tag: 慢性神經肌肉
- q: 年齡與性別如何影響最大有氧功率？
  a: 成人最大有氧功率隨年齡下降；年齡配對時，女性平均為男性的 73–85%，可能與體脂、血紅素、心臟大小及血容量差異有關，但男女對訓練的一般生理反應相似。
  tag: 外在因素
- q: 單次有氧運動的主要急性心血管與呼吸反應是什麼？
  a: 心輸出量、每搏量、心率、攝氧量、收縮壓與活動肌血流增加，舒張壓維持或略降；呼吸頻率、潮氣量與分鐘通氣量增加，劇烈運動時分鐘通氣量可達靜息的 15–25 倍。
  tag: 急性心血管
