  - id: ch06.acute-respiratory.i06
    q: 氧在血漿與血紅素中各能運送多少？
    a:
    - 氧不易溶於液體，因此每公升血漿只能攜帶約 3 ml 氧；血中大部分氧由血紅素運送
    - 男性每 100 ml 血液約有 15–16 g 血紅素，女性約 14 g；每克血紅素可攜帶 1.34 ml 氧
    - 因此男性每 100 ml 血液的攜氧容量約為 20 ml 氧，女性略低
    detail: 血漿中的溶氧量雖少，仍會形成血液與體液中的氧分壓，參與呼吸調節及氧向肺泡血液與組織細胞擴散的機制。
    terms:
    - hemoglobin
    - partial-pressure
    numbers:
    - v: 約 3
      unit: ml O₂/L plasma
      of: 血漿可攜帶的溶解氧量
    - v: 15–16
      unit: g hemoglobin/100 ml blood
      of: 男性血液的約略血紅素含量
    - v: 約 14
      unit: g hemoglobin/100 ml blood
      of: 女性血液的約略血紅素含量
    - v: 1.34
      unit: ml O₂/g hemoglobin
      of: 每克血紅素的攜氧量
    - v: 約 20
