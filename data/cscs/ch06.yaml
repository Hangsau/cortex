    - ch10.carb-loading.i01
    locator: Chronic Adaptations to Aerobic Exercise > Table 6.1 Physiological Adaptations to Aerobic Endurance Training
  - id: ch06.chronic-muscular.i08
    q: 有氧耐力訓練對第一型與第二型肌纖維的有氧潛力有何差異？
    a:
    - 第一型與第二型纖維的有氧潛力可出現相近的相對增幅
    - 第一型纖維訓練前的有氧能力本來就較高，因此訓練前後的氧化能力都高於第二型纖維
    - 強度足夠時，快縮纖維、尤其 Type IIx 也會大量參與，其有氧能力也會隨訓練增加
    detail: 快縮纖維是否適應取決於運動強度是否足以徵召它們；教材以反覆 800 m 間歇跑為例，而不是主張所有低強度耐力活動都同等刺激 Type IIx。
    terms:
    - slow-twitch
    - fast-twitch
    numbers:
