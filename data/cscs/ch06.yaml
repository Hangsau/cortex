  - id: ch06.acute-respiratory.i07
    q: 二氧化碳主要如何經血液運到肺部？
    a:
    - 代謝產生的二氧化碳約有 5% 直接由血漿運送，另有少量經血紅素運送
    - 最大宗約 70% 與水結合，最後以碳酸氫根（HCO₃⁻）形式送往肺部
    - 紅血球內的碳酸酐酶會大幅加快二氧化碳與水形成碳酸的反應；碳酸再解離成氫離子與碳酸氫根
    detail: 血紅素會結合氫離子、協助維持血液 pH；碳酸氫根由紅血球擴散到血漿時，氯離子則進入紅血球補位。
    terms:
    - hemoglobin
    - carbonic-anhydrase
    numbers:
    - v: 約 5
      unit: '% produced CO₂'
      of: 代謝所產二氧化碳中直接由血漿運送的比例
    - v: 約 70
      unit: '% produced CO₂'
      of: 代謝所產二氧化碳中以碳酸氫根形式移除的比例
