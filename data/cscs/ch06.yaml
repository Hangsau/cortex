  - id: ch06.acute-cardiovascular.i04
    q: 攝氧量（oxygen uptake, V̇O₂）與 Fick 方程式是什麼？
    a:
    - 攝氧量是身體組織消耗的氧量；Fick 方程式為 V̇O₂＝心輸出量×動靜脈氧差
    - 一般人的估計靜息攝氧量為 3.5 ml·kg⁻¹·min⁻¹，定義為 1 代謝當量（metabolic equivalent, MET）
    - 正常健康者的最大攝氧量一般為 25–80 ml·kg⁻¹·min⁻¹，即 7.1–22.9 METs
    detail: 最大攝氧量代表全身細胞層級可利用的最大氧量，主要取決於心臟與循環系統運氧的能力，以及組織利用氧的能力；教材將它列為最廣泛接受的心肺適能指標。
    terms:
    - oxygen-uptake
    - fick-equation
    - arteriovenous-oxygen-difference
    - cardiac-output
    - vo2max
    - metabolic-equivalent
    numbers:
    - v: 3.5
      unit: ml·kg⁻¹·min⁻¹
      of: 一般人的估計靜息攝氧量
    - v: 1
      unit: MET
      of: 3.5 ml·kg⁻¹·min⁻¹ 靜息攝氧量所定義的代謝當量
    - v: 25–80
