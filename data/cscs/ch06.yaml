cards:
- q: 心輸出量（Q̇）的公式與最大值？
  a: Q̇ = 搏出量 × 心跳率；靜止約 5 L/min；最大有氧運動可達 20–22 L/min（約靜止的 4 倍）
  tag: 急性心血管
- q: 搏出量在有氧運動中何時達到高原？
  a: VO2 達到 40–50% VO2max 時 SV 開始停滯；訓練前一般男性最大 SV 100–120 ml/beat，女性約少 25%
  tag: 急性心血管
- q: Frank-Starling 機制是什麼？
  a: 靜脈回流↑ → 心室末期舒張容積（EDV）↑ → 心肌纖維伸展↑ → 收縮力↑ → 搏出量↑（類似橡皮筋拉越長彈力越大）
  tag: 急性心血管
- q: 有氧運動中增加靜脈回流的三個機制？
  a: 靜脈收縮（交感神經）＋骨骼肌幫浦（肌肉收縮配合靜脈瓣）＋呼吸幫浦（呼吸頻率/潮氣量↑改變胸腔壓力）
  tag: 急性心血管
- q: 最大心跳率的兩種估算公式？
  a: 傳統：220 − 年齡（標準差 ±10–12 bpm）；更精確：208 − 0.7 × 年齡（適用健康成人）
  tag: 急性心血管
- q: Fick 方程式的完整展開式？
  a: VO2 = HR × SV × a-vO2 difference；單位：beats/min × ml/beat × ml O2/100 ml blood；結果除以體重(kg)得 ml·kg⁻¹·min⁻¹
  tag: 急性心血管
- q: 1 MET 的定義，以及 VO2max 的正常範圍？
  a: 1 MET = 靜止攝氧量 ≈ 3.5 ml·kg⁻¹·min⁻¹；健康成人 VO2max 一般為 25–80 ml·kg⁻¹·min⁻¹（7.1–22.9 METs）
  tag: 急性心血管
- q: Rate-Pressure Product（雙乘積）的定義與意義？
  a: 心跳率 × 收縮壓；用來估算心肌耗氧量（心臟做功）；反映心臟的工作負荷
  tag: 急性心血管
- q: 有氧運動時收縮壓（SBP）與舒張壓（DBP）如何變化？
  a: 最大有氧運動 SBP 可升至 220–260 mmHg；DBP 因血管擴張維持不變或略降；血流大量導向活動肌肉
  tag: 急性心血管
- q: 平均動脈壓（MAP）公式，以及骨骼肌在運動時獲得的心輸出量比例？
  a: MAP = (SBP − DBP) ÷ 3 + DBP；靜止時骨骼肌接收 15–20% Q̇；劇烈運動時可達 90%
  tag: 急性心血管
- q: 有氧運動時呼吸頻率與潮氣量（TV）如何變化？
  a: 靜止呼吸頻率 12–15 次/min → 劇烈運動 35–45 次/min；TV 從 0.4–1 L → 可達 3 L 以上
  tag: 急性呼吸
- q: 分鐘通氣量（minute ventilation）的運動增幅？
  a: 靜止的 15–25 倍；可達 90–150 L/min；低中強度時 TV 增加為主；高強度時呼吸頻率也顯著↑
  tag: 急性呼吸
- q: 通氣當量（ventilatory equivalent）的定義與數值？
  a: 每升 O2 所需的空氣量（L/L O2）；低中強度約 20–25 L/L；高強度時可升至 35–40 L/L（乳酸急增點以上）
  tag: 急性呼吸
- q: 解剖死腔 vs 生理死腔的差異？
  a: 解剖死腔：鼻/口/氣管/支氣管（無氣體交換），年輕成人約 150 ml；生理死腔：通氣/灌流不良的肺泡，健康人幾乎可忽略；肺疾病（COPD）時生理死腔可增至解剖的 10 倍
  tag: 急性呼吸
- q: 為何深呼吸比快淺呼吸更有效率？
  a: 增加 TV 時，解剖死腔的增加比例小於 TV 增加比例，因此有效肺泡通氣量的比例更高
  tag: 急性呼吸
- q: 靜止 vs 高強度運動時的組織 PO2 與 PCO2 比較？
  a: 靜止：間質液 PO2 約 40 mmHg、PCO2 約 46 mmHg；高強度運動：PO2 約 3 mmHg、PCO2 約 90 mmHg → 壓力梯度更大加速氣體交換
  tag: 急性呼吸
- q: 血漿攜氧量 vs 血紅素攜氧量？
  a: 血漿僅攜帶約 3 ml O2/L；大部分由血紅素攜帶；男性約 20 ml O2/100 ml 血液，女性略少（Hb 較低）
  tag: 血液運輸
- q: CO2 最主要的血液運輸方式？
  a: 約 70% 以碳酸氫根（HCO3⁻）形式運輸：CO2 + H2O → H2CO3（碳酸酐酶催化）→ H⁺ + HCO3⁻；H⁺ 由血紅素緩衝，HCO3⁻ 擴散至血漿
  tag: 血液運輸
- q: OBLA 定義與 Cori cycle 的功能？
  a: OBLA（Onset of Blood Lactate Accumulation）：血乳酸開始累積的強度點；Cori cycle：肌肉乳酸 → 血液 → 肝臟 → 糖異生（gluconeogenesis）轉回葡萄糖
  tag: 血液運輸
- q: 有氧訓練最重要的長期心血管適應是什麼？
  a: 最大心輸出量↑（主因：最大搏出量↑）；通常在 6–12 個月長期訓練後達到；心室腔容積↑、壁厚↑、收縮性↑
  tag: 慢性心血管
- q: 有氧訓練後靜止與次最大心跳率的變化？
  a: 靜止心跳率↓（副交感張力↑ + SV↑）；次最大運動時在相同絕對強度下 HR↓；最大 HR 可能略↓
  tag: 慢性心血管
- q: 精英有氧耐力運動員的靜止心跳率範圍（bradycardia）？
  a: 常見 40–60 bpm；原因：副交感神經張力↑（SA 節放電率↓）+ 每跳搏出量↑ → 同樣輸出只需更少次跳動
  tag: 慢性心血管
- q: 訓練後最大搏出量的數值比較？
  a: 未訓練男性最大 SV 約 100–120 ml；訓練後可達 150–160 ml；精英運動員可達 187 ml（Table 6.2）
  tag: 慢性心血管
- q: 有氧訓練後肌肉毛細血管密度增加的意義？
  a: O2 擴散距離↓ → O2 與代謝基質的輸送效率↑；CO2 與廢物移除↑；受訓練量與強度影響
  tag: 慢性心血管
- q: 有氧訓練後粒線體如何適應？
  a: 粒線體數量↑、大小↑ → 有氧 ATP 生產能力↑；結合肌紅蛋白濃度↑ → 肌肉組織提取與利用 O2 的能力↑
  tag: 慢性肌肉
- q: 肌紅蛋白（myoglobin）的功能，以及訓練後的變化？
  a: 在細胞內運輸 O2 至粒線體；有氧訓練後肌紅蛋白含量↑ → O2 利用能力↑
  tag: 慢性肌肉
- q: VO2max 的訓練改善幅度因訓練狀態而有何差異？
  a: 未訓練者可改善最多 20%；精英運動員僅 5–10%（已接近基因上限）；有氧能力可提升 5–30%（6–12 個月訓練）
  tag: 慢性肌肉
- q: 乳酸閾值的訓練適應如何影響比賽表現？
  a: 訓練後 OBLA 在更高的 VO2max % 出現（可達 80–90%）；舉例：同樣 VO2max 50 的兩人，乳酸閾 80% vs 70% → 前者可維持高 5 ml·kg⁻¹·min⁻¹
    的強度
  tag: 慢性肌肉
- q: 有氧訓練後脂肪利用↑與糖原節省（glycogen sparing）的意義？
  a: 訓練後相同強度下脂肪利用率↑、糖原使用↓ → 可在更高強度維持更長時間；跑馬拉松的 75% VO2max 配速可提升至 80%
  tag: 慢性肌肉
- q: Type IIx → IIa 纖維轉換的訓練意義？
  a: 有氧耐力訓練可促使 Type IIx 轉為 Type IIa；IIa 有更高氧化能力且特性更接近 Type I → 更多纖維可參與有氧代謝
  tag: 慢性肌肉
- q: 有氧訓練後 Type I 纖維的形態變化？
  a: 選擇性肥大（因徵召頻率↑）；但增幅小於阻力訓練所致的 Type II 肥大；Type II 纖維面積在有氧訓練後無顯著增加或僅略增
  tag: 慢性肌肉
- q: 有氧訓練後體組成的典型變化？
  a: 體脂率↓；去脂體重無顯著變化；長期計畫體脂降低效果更佳；過度訓練可使合成/分解失衡，反而促進分解
  tag: 慢性肌肉
- q: 有氧訓練刺激骨生長的關鍵條件？
  a: 強度必須超過每日正常活動的最低閾值；需週期性應力（cyclical strain）；強度必須系統性漸進；高強度間歇訓練可提供更強的成骨刺激
  tag: 骨骼結締組織
- q: 有氧訓練後睪固酮/皮質醇動態，以及蛋白質合成的類型？
  a: 有氧訓練（尤其跑步）引發皮質醇↑ → 淨蛋白分解；身體嘗試以 T & IGF-1↑ 補償；但近期研究顯示耐力運動員確有淨蛋白合成，主要是粒線體蛋白，非收縮蛋白
  tag: 內分泌
- q: 高度影響從哪個海拔開始？最主要的急性生理補償反應？
  a: '>3,900 英尺（約 1,200 m）開始影響；主要急性反應：①肺通氣過度（hyperventilation，以呼吸頻率↑為主）；②心輸出量↑（心跳率↑，次最大 HR 可升 30–50%）'
  tag: 外在因素
- q: 高度慢性適應中 RBC 與血紅素的增幅？
  a: RBC 增加 30–50%；血紅素增加約 5–15%（最高可更多）；腎臟排出 HCO3⁻ 維持酸鹼平衡；毛細血管密度↑
  tag: 外在因素
- q: 在中等高度（2,200–3,000 m）適應所需最短時間？回海平面後多久恢復？
  a: 至少 3–6 週完全適應；即使適應後，表現仍通常低於海平面；回到海平面後約 1 個月恢復
  tag: 外在因素
- q: 吸菸影響有氧運動表現的兩個主要機制？
  a: ①尼古丁導致支氣管收縮或黏膜腫脹 → 呼吸道阻力↑；②尼古丁麻痺呼吸道纖毛 → 無法清除分泌物與異物
  tag: 外在因素
- q: 一氧化碳（CO）如何影響運動表現？
  a: CO（香菸成分）與 Hb 親和力高於 O2 → 形成 carboxyhemoglobin → O2 攜帶量↓；同時促使兒茶酚胺釋放 → HR↑、BP↑
  tag: 外在因素
- q: 血液摻假（blood doping）的方式與對 VO2max 的影響？
  a: 方式：①輸注自身或他人 RBC；②注射 EPO 刺激 RBC 生成；VO2max 可提升最多 11%；次最大運動下 HR↓、血乳酸↓、pH↑
  tag: 外在因素
- q: OTS（過度訓練症候群）三個階段的定義與恢復時間？
  a: 功能性過度訓練（FOR）：表現略降，恢復數天至週，帶來超補償；非功能性過度訓練（NFOR）：表現停滯/下降，恢復週至月；OTS：嚴重表現下降，恢復需數月
  tag: 過度訓練
- q: OTS 在大學游泳選手等耐力運動員的發生率？
  a: 約 10%（範圍 7–21%）經歷 NFOR 或 OTS
  tag: 過度訓練
- q: OTS 時心跳率與心跳率變異性（HRV）如何變化？
  a: 靜止心跳率可↑或↓；HRV↓（副交感輸入↓或過度交感刺激）；最大 HR↓；次最大運動 HR↓；訓練量↑通常不影響靜止血壓，但訓練強度↑可使靜止 DBP↑
  tag: 過度訓練
- q: 睪固酮/皮質醇比值作為 OTS 標記的閾值，以及兒茶酚胺的指標意義？
  a: 游離睪固酮/皮質醇比值下降 ≥30% 可能是 OTS 標記；嚴重量型 OTS 中夜間腎上腺素↓（反映基礎交感張力↓）；多巴胺基礎值↓
  tag: 過度訓練
- q: OTS 的預防策略有哪些？
  a: 監控訓練記錄＋定期測量表現；多樣化訓練量/強度；充足睡眠與營養；多學科健康團隊（教練、醫師、營養師、心理師）；早期發現 OTS 標記並調整計畫
  tag: 過度訓練
- q: 去訓練的定義，以及 VO2max 在短期與長期去訓練後的下降幅度？
  a: 去訓練：訓練刺激不足引起的適應逆轉；短期（<4 週）VO2max 下降 4–14%；長期（>4 週）下降 6–20%；主因：血量↓、SV↓、最大心輸出量↓、次最大 HR↑
  tag: 去訓練
- q: Tapering（減量）與去訓練的區別？
  a: Tapering：賽前計畫性降低訓練量（通常維持強度）→ 目的是提升表現；去訓練：無計畫停訓 → 引起適應喪失；適當的訓練多樣性、強度維持與主動恢復可防止去訓練效應
  tag: 去訓練
- q: 有氧耐力訓練後整體表現改善的複合指標（複合題）？
  a: ①VO2max↑（未訓練最多 20%，精英 5–10%）；②乳酸閾值↑（OBLA 在更高%VO2max）；③脂肪利用↑（糖原節省）；④跑步效率↑（運動經濟性）；⑤次最大 HR 與呼吸率↓
  tag: 綜合
- q: 有氧訓練對呼吸系統的慢性適應，以及適應是否具運動特異性？
  a: 呼吸系統通常不是有氧運動的限制因素；訓練適應包括：最大運動時 TV↑、頻率↑；次最大運動時頻率↓、TV↑；適應具運動特異性（下肢訓練不一定改善上肢運動）
  tag: 慢性心血管
- q: 有氧訓練對神經系統的慢性適應：協同肌輪流活化是什麼？
  a: 訓練早期：動作效率↑、疲勞延後；協同肌輪流活化 = 协同肌之間輪流從主動變為靜止，維持低強度收縮的能量消耗↓ → 運動經濟性↑
  tag: 慢性神經肌肉
- q: 年齡與性別對有氧像力（VO2max）的影響？
  a: 最大有氧功率隨年齡↓（肌肉量↓、體脂↑）；男女匹配年齡時，女性 VO2max 為男性 73–85%（體脂%高、Hb低、心臟較小）；訓練生理反應男女相似
  tag: 外在因素
- q: 有氧運動的急性反應總結（複合題）？
  a: 心輸出量↑、SV↑、HR↑、VO2↑、SBP↑、骨骼肌血流↑（可達 90% Q̇）；DBP 不變或略降；呼吸頻率↑、TV↑、分鐘通氣量↑ 15–25 倍
  tag: 急性心血管
