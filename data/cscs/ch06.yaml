- id: chronic-cardiovascular
  title: 慢性心血管適應 Chronic Cardiovascular Adaptations
  desc: ''
  tag: Cardiovascular
  items:
  - id: ch06.chronic-cardiovascular.i01
    q: 長期有氧耐力訓練最顯著的心血管改變是什麼？
    a:
    - 長期 6–12 個月有氧耐力訓練最顯著的心血管改變，是最大心輸出量增加
    - 增加主要來自每搏量改善
    detail: 最大心率經長期訓練可能略降，因此最大心輸出量的提升關鍵不是把心跳推得更快，而是讓每次收縮送出更多血液。
    terms:
    - cardiac-output
    - stroke-volume
    - maximal-heart-rate
    numbers:
    - v: 6–12
      unit: 個月
      of: 教材所述出現最顯著心血管功能改變的長期有氧耐力訓練期
    concepts:
    - adaptation
    - circulation
    related:
    - ch20.aerobic-performance-factors.i01
    locator: Chronic Adaptations to Aerobic Exercise > Cardiovascular Adaptations
  - id: ch06.chronic-cardiovascular.i02
    q: 有氧耐力訓練如何提高次最大與最大運動時的每搏量？
    a:
    - 左心室腔室容積與心室壁厚度增加，使心室可容納並泵出更多血液
    - 心肌收縮力提高，使次最大與最大運動時的每搏量上升
    detail: 這兩項結構與功能改變，是在最大心率未必增加的情況下，仍能提高最大心輸出量的核心機制。
    terms:
    - stroke-volume
    - cardiac-output
    - ventricle
    - myocardium
    numbers: []
    concepts:
    - adaptation
    - circulation
    related: []
    locator: Chronic Adaptations to Aerobic Exercise > Cardiovascular Adaptations
  - id: ch06.chronic-cardiovascular.i03
    q: 為什麼高度訓練的有氧耐力選手常出現靜息心搏徐緩？
    a:
    - 有氧耐力訓練增加副交感神經張力，使竇房結放電速率顯著變慢
    - 每搏量增加後，心臟以較少收縮次數即可維持相同心輸出量
    - 高度訓練的有氧耐力選手，靜息心率常為 40–60 beats/min
    detail: 正常竇房結放電速率為每分鐘 60–80 次；教材將訓練者的心搏徐緩同時連到自主神經調節與每搏量提升，而非只歸因於其中一項。
    terms:
    - bradycardia
    - parasympathetic
    - sa-node
    - stroke-volume
    - cardiac-output
    numbers:
    - v: 40–60
      unit: beats/min
      of: 高度訓練有氧耐力選手常見的靜息心率範圍
    - v: 60–80
      unit: discharges/min
      of: 正常竇房結放電速率範圍
    concepts:
    - adaptation
    - circulation
    related:
    - ch01.cardiovascular.heart-rate
    locator: Chronic Adaptations to Aerobic Exercise > Cardiovascular Adaptations
  - id: ch06.chronic-cardiovascular.i04
    q: 訓練後，固定次最大工作量下的心率如何改變？
    a:
    - 對同一個標準化次最大工作量，訓練後的心率顯著較低
    - 在相同工作量下，受訓運動員的心率上升也比久坐者慢
    detail: 這裡比較的是固定的絕對工作量，不是兩人各自相同百分比的最大能力；訓練提高每搏量後，完成同一份工作不需相同的心率反應。
    terms:
    - heart-rate
    - stroke-volume
    numbers: []
    concepts:
    - adaptation
    - circulation
    related:
    - ch06.connective-endocrine.i04
    locator: Chronic Adaptations to Aerobic Exercise > Cardiovascular Adaptations
  - id: ch06.chronic-cardiovascular.i05
    q: 長期有氧耐力訓練一定會提高最大心率嗎？
    a:
    - 不一定；教材指出最大心率經長期訓練後實際上可能略微下降
    - 這項下降可能與副交感神經張力增加有關
    detail: 原文對機制使用「perhaps」而非確定因果；最大心率的些微下降也使左心室大小與收縮力對提高每搏量更加關鍵。
    terms:
    - maximal-heart-rate
    - parasympathetic
    - stroke-volume
    numbers: []
    concepts:
    - adaptation
    - circulation
    related:
    - ch20.intensity-monitoring.i06
    locator: Chronic Adaptations to Aerobic Exercise > Cardiovascular Adaptations
  - id: ch06.chronic-cardiovascular.i06
    q: 肌纖維微血管密度增加有何作用？
    a:
    - 有氧耐力訓練會增加肌纖維微血管密度，反應幅度取決於訓練量與強度
    - 微血管密度增加會縮短氧與代謝底物的擴散距離
    detail: 微血管除了輸送氧、營養與荷爾蒙，也負責移除熱與代謝副產物；因此密度增加同時支援供應與清除。
    terms:
    - capillary
    - diffusion
    numbers: []
    concepts:
    - adaptation
    - circulation
    related:
    - ch05.hypertrophy.i07
    locator: Chronic Adaptations to Aerobic Exercise > Cardiovascular Adaptations
  - id: ch06.chronic-cardiovascular.i07
    q: 有氧耐力訓練會如何改變通氣反應？
    a:
    - 通氣一般不會限制有氧運動，且訓練後可能不變或只出現中度改變
    - 最大運動時，訓練適應包括潮氣量與呼吸頻率增加；次最大運動時則常見呼吸頻率下降、潮氣量增加
    - 通氣適應對訓練活動高度特異；下肢訓練造成的適應，不太可能在上肢活動中同樣出現
    detail: 教材將這種活動特異性歸於受訓肌肉的局部、神經或化學適應；不能把某一運動模式的通氣改善直接外推到所有運動。
    terms:
    - tidal-volume
    - minute-ventilation
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related: []
    locator: Chronic Adaptations to Aerobic Exercise > Respiratory Adaptations
  - id: ch06.chronic-cardiovascular.i08
    q: 有氧耐力訓練初期有哪些神經系統適應？
    a:
    - 訓練初期，收縮機制的效率提高，疲勞發生延後
    - 協同肌之間及單一肌肉的運動單位之間，可輪替神經活動
    - 協同肌不維持恆定活化，而是在活動與不活動之間交替，以維持低程度肌力並降低移動的能量消耗
    detail: 這項適應描述的是神經活動的分配更有效率，不是肌肉完全停止工作；結果是相同活動可用較少能量完成。
    terms:
    - motor-unit
    numbers: []
    concepts:
    - adaptation
    - motor-control
    related:
