    locator: Chronic Adaptations to Aerobic Exercise > Neural Adaptations
- id: chronic-muscular
  title: 慢性肌肉適應 Chronic Muscular Adaptations
  desc: ''
  tag: Muscular
  items:
  - id: ch06.chronic-muscular.i01
    q: 有氧耐力訓練如何改變粒線體？
    a:
    - 受訓肌肉的粒線體數量與大小都會增加
    - 粒線體以糖原與游離脂肪酸氧化、有氧產生三磷酸腺苷（ATP）；數量與大小增加會提高這項能力
    detail: 粒線體適應與肌紅蛋白增加共同作用：前者擴大利用氧製造 ATP 的場所，後者增加可送到粒線體的氧量，使肌肉提取與使用氧的能力提高。
    terms:
    - mitochondria
    - atp
    - glycogen
    numbers: []
    concepts:
    - adaptation
    - energy-supply
    related:
    - ch03.oxidative.i02
    locator: Chronic Adaptations to Aerobic Exercise > Muscular Adaptations
  - id: ch06.chronic-muscular.i02
    q: 肌紅蛋白（myoglobin）在有氧訓練適應中扮演什麼角色？
    a:
    - 肌紅蛋白是在細胞內運送氧的蛋白質
    - 有氧耐力訓練會增加肌紅蛋白含量，使更多氧可送達粒線體
    detail: 肌紅蛋白處理的是細胞內的氧運送，不能與血液中負責主要攜氧工作的血紅素混為一談。
    terms:
    - myoglobin
    - mitochondria
    - hemoglobin
    numbers: []
    concepts:
    - adaptation
    - gas-exchange
    related:
    - ch01.cardiovascular.blood
    locator: Chronic Adaptations to Aerobic Exercise > Muscular Adaptations
  - id: ch06.chronic-muscular.i03
    q: 有氧耐力訓練會使第一型肌纖維肥大嗎？
    a:
    - 會；第一型（Type I）肌纖維因在有氧活動中徵召增加而出現選擇性肥大
    - 但其橫截面直徑不及經阻力訓練適應的第二型（Type II）肌纖維
    - 這項變化也小於健美式阻力訓練造成的第一型肌纖維肥大
    detail: 此處比較的是不同訓練刺激造成的肥大程度；教材沒有把有氧訓練的第一型纖維肥大等同於阻力訓練的肌肥大效果。
    terms:
    - slow-twitch
    - fast-twitch
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch05.hypertrophy.i06
    locator: Chronic Adaptations to Aerobic Exercise > Muscular Adaptations
  - id: ch06.chronic-muscular.i04
    q: 有氧耐力訓練會把第二型肌纖維轉成第一型嗎？
    a:
    - 幾乎沒有證據顯示有氧耐力訓練會使第二型纖維轉成第一型纖維
    - 第二型纖維的兩個主要亞型之間則可能逐漸由 Type IIx 轉為 Type IIa
    - Type IIa 的氧化能力高於 Type IIx，功能特性也更接近 Type I，因此可參與有氧耐力表現的纖維變多
    detail: 原文對 IIx→IIa 使用「may be」而非必然轉換；這項亞型變化不等於 Type II 已轉成 Type I。
    terms:
    - fast-twitch
    - slow-twitch
    numbers: []
    concepts:
    - adaptation
    - fiber-type
    related:
    - ch05.fiber-type-transitions.i01
    locator: Chronic Adaptations to Aerobic Exercise > Muscular Adaptations
  - id: ch06.chronic-muscular.i05
    q: 訓練後為何能在更高相對強度下延續有氧表現？
    a:
    - 訓練後在相同強度下糖原使用較少、脂肪利用增加，可延長表現；運動員也可能維持更高比例的新最大有氧功率
    - 血乳酸積累起始點可移到受訓運動員有氧能力的 80–90%
    - 教材列出的可能原因包括肌纖維類型、降低乳酸生成的局部訓練適應、高強度運動時的荷爾蒙釋放變化，以及乳酸移除加快
    detail: 糖原節省與脂肪利用用來解釋同強度表現為何延長；教材另列四項可能因素解釋 OBLA 位移。原摘要把兩組機制串成單一因果鏈，會超出原文。
    terms:
    - glycogen
    - obla
    - vo2max
    - catecholamine
    numbers:
