  - id: ch22.resistance-training-systems.i04
    q: DAPRE 第三組完成次數如何決定第四組與下次訓練的阻力？
    a:
    - 0–2 下：第四組減 5–10 lb（2.3–4.5 kg）後重做；表中未列下次訓練阻力
    - 3–4 下：第四組減 0–5 lb（0–2.3 kg）；下次同一阻力
    - 5–7 下：第四組同一阻力；下次加 5–10 lb（2.3–4.5 kg）
    - 8–12 下：第四組加 5–10 lb（2.3–4.5 kg）；下次加 5–15 lb（2.3–6.8 kg）
    - 13 下以上：第四組加 10–15 lb（4.5–6.8 kg）；下次加 10–20 lb（4.5–9 kg）
    detail: '此表依第三組的實際完成次數調整阻力；0–2 下的下次訓練欄在教材表格中留白。'
