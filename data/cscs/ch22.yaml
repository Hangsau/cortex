id: ch22
weight: 22
title: Ch.22 Rehabilitation and Reconditioning
topics:
- id: fibroblastic-phase
  title: 修復期 Fibroblastic Repair Phase
  desc: ''
  tag: Phase 2
  items:
  - id: ch22.fibroblastic-phase.i01
    q: 時間
    a:
    - 傷後2天起，持續至約2個月
    - 適當應力縮短時程
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.fibroblastic-phase.i02
    q: Type III 膠原
    a:
    - 隨機沉積
    - 新生組織比原始弱
    - 橫向排列→傳力效率差
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.fibroblastic-phase.i03
    q: 治療目標
    a:
    - 防止過度肌萎縮＆關節退化
    - 低負荷應力促進膠原排列
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.fibroblastic-phase.i04
    q: 等長訓練 Isometric
    a:
    - 無痛下進行
    - 關節角度特異性→多角度操作
    - 維持神經肌肉功能
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.fibroblastic-phase.i05
    q: 等速/等張訓練
    a:
    - Isokinetic（固定速度，功能性有限）
    - Isotonic（concentric+eccentric，可漸增負荷）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.fibroblastic-phase.i06
    q: Neuromuscular Control
    a:
    - 本體感覺（proprioception）訓練
    - 迷你彈簧床/平衡板/閉眼/不穩地面
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.fibroblastic-phase.i07
    q: Eccentric 優勢
    a:
    - 力量產生＞向心
    - 能量消耗＜向心
    - 適合早期組織強化
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.fibroblastic-phase.i08
    q: 物理因子
    a:
    - 超音波、電刺激、冰敷→促進膠原合成與疼痛管理
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
- id: inflammatory-phase
  title: 發炎期 Inflammatory Response Phase
  desc: ''
  tag: Phase 1
  items:
  - id: ch22.inflammatory-phase.i01
    q: 時間
    a:
    - 急性傷後2–3天，通常＜1週
    - 血流供應差或傷害嚴重可延長
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.inflammatory-phase.i02
    q: 生理事件
    a:
    - 血管通透性↑ → 組織胺/緩激肽釋放 → 水腫(edema) → 抑制收縮組織
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.inflammatory-phase.i03
    q: Phagocytosis
    a:
    - 巨噬細胞清除細胞碎片
    - 發炎過長→後續phases無法進行
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.inflammatory-phase.i04
    q: 治療目標
    a:
    - 最大保護傷區
    - 防止新組織被破壞
    - 維持未傷區域功能
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.inflammatory-phase.i05
    q: 物理因子
    a:
    - 冰敷、加壓、抬高、電刺激
    - 減少急性疼痛與組織損傷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.inflammatory-phase.i06
    q: CSCS 任務
    a:
    - 諮詢ATC確認適應症
    - 設計未傷部位有氧/無氧/阻力訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.inflammatory-phase.i07
    q: 可做的運動
    a:
    - 上肢傷→下肢訓練
    - 膝傷→髖外展/旋轉
    - 肩傷→肩胛穩定
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.inflammatory-phase.i08
    q: 禁止
    a:
    - 直接涉及或施壓傷區的主動運動
    - 勿過早主動使用患部
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
- id: injury-prevention
  title: 傷害預防與再傷風險 Injury Prevention
  desc: ''
  tag: Prevention
  items:
  - id: ch22.injury-prevention.i01
    q: 最大風險因子
    a:
    - 先前受傷史（previous injury）是未來傷害最重要的預測因子
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
  - id: ch22.injury-prevention.i02
    q: 上肢風險因子
    a:
    - 肩關節ROM減少、肩胛運動障礙、肩部肌力不足
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
  - id: ch22.injury-prevention.i03
    q: 下肢風險因子
    a:
    - 平衡↓、落地神經肌肉控制↓、下肢肌力↓
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
  - id: ch22.injury-prevention.i04
    q: Sportsmetrics
    a:
    - ACL傷害預防計畫
    - 改善落地/切位動作
    - 降低下肢傷害率
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
  - id: ch22.injury-prevention.i05
    q: PEP Program
    a:
    - Prevent Injury & Enhance Performance
    - 降低ACL與踝扭傷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
  - id: ch22.injury-prevention.i06
    q: 偏心訓練
    a:
    - 顯著降低腿後肌傷害風險
    - 早期介入效果佳
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
  - id: ch22.injury-prevention.i07
    q: 回場後監控
    a:
    - 雙側差異＜10%視為可接受
    - 與對側或常模比較
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
  - id: ch22.injury-prevention.i08
    q: Throwers Ten
    a:
    - 上肢傷害預防結構化計畫
    - 含ROM訓練
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - safety
    related: []
    locator: ''
- id: injury-types
  title: 傷害類型 Injury Types
  desc: ''
  tag: Injury
  items:
  - id: ch22.injury-types.i01
    q: Macrotrauma
    a:
    - 單次突發過載傷害
    - 破壞組織完整性（骨折、脫臼、扭傷、拉傷）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.injury-types.i02
    q: Sprain 扭傷
    a:
    - 韌帶傷害：1度（部分撕裂無不穩）、2度（部分+輕微不穩）、3度（完全撕裂）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.injury-types.i03
    q: Strain 拉傷
    a:
    - 肌肉撕裂：1度（強但痛）、2度（弱且痛）、3度（完全撕裂，極弱無痛）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.injury-types.i04
    q: 骨骼傷害
    a:
    - Contusion（直接撞擊）或Fracture
    - 可分closed/open/avulsed/incomplete
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.injury-types.i05
    q: 關節傷害
    a:
    - Dislocation（完全位移）vs Subluxation（部分位移）→ 不穩定
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.injury-types.i06
    q: Microtrauma
    a:
    - 反覆異常壓力
    - 訓練錯誤/表面/生物力學/柔軟度不足/骨骼排列異常
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.injury-types.i07
    q: Stress Fracture
    a:
    - 最常見骨骼過用傷害
    - 訓練量急增或硬地訓練所致
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.injury-types.i08
    q: Tendinitis vs Tendinopathy
    a:
    - -itis = 發炎
    - tendinopathy = 退化+新血管生成，慢性化
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
- id: kinetic-chain
  title: 動力鏈 OKC / CKC
  desc: ''
  tag: Kinetic
  items:
  - id: ch22.kinetic-chain.i01
    q: Kinetic Chain 定義
    a:
    - 兩個以上連續關節共同產生動作的集體作用
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
  - id: ch22.kinetic-chain.i02
    q: CKC（閉鎖）
    a:
    - 末端關節受固定阻力不能自由移動
    - 下肢以「足固定於地面」為主
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
  - id: ch22.kinetic-chain.i03
    q: CKC 優點
    a:
    - 關節穩定性↑
    - 功能性動作模式
    - 多關節協同（髖膝踝）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
  - id: ch22.kinetic-chain.i04
    q: OKC（開放）
    a:
    - 末端關節可自由移動
    - 針對單關節/單肌群強化（例：leg extension）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
  - id: ch22.kinetic-chain.i05
    q: OKC 優點
    a:
    - 可集中強化特定肌群
    - 適合某些復健情境
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
  - id: ch22.kinetic-chain.i06
    q: 上肢也有CKC
    a:
    - 伏地挺身為上肢CKC範例
    - 不僅限於下肢
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
  - id: ch22.kinetic-chain.i07
    q: 衝刺的例子
    a:
    - 接地腳=CKC
    - 騰空腳=OKC
    - 兩者同時存在，都有實用性
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
  - id: ch22.kinetic-chain.i08
    q: CSCS考試重點
    a:
    - Squat=CKC
    - Leg Extension=OKC
    - Push-up=上肢CKC
    - 兩者互補
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - technique
    related: []
    locator: ''
- id: maturation-phase
  title: 重塑期 Maturation-Remodeling Phase
  desc: ''
  tag: Phase 3
  items:
  - id: ch22.maturation-phase.i01
    q: 時間
    a:
    - 可持續數月至數年
    - 痊癒後組織仍弱於原始組織
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.maturation-phase.i02
    q: Type I 膠原
    a:
    - 比Type III更強
    - 沿應力方向排列、肥大→強度↑
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.maturation-phase.i03
    q: 治療目標
    a:
    - 優化組織功能
    - 漸進施加運動特異性應力
    - 準備回場
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.maturation-phase.i04
    q: 回場標準
    a:
    - ROM、肌力、功能測試、Patient-Reported Outcome
    - 不能只靠疼痛消失判斷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.maturation-phase.i05
    q: 注意陷阱
    a:
    - 疼痛消失≠癒合完成（Fig.22.3）
    - 過早恢復全量訓練易再傷
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.maturation-phase.i06
    q: 訓練方向
    a:
    - 由一般→運動特異性
    - 角度特異性強化
    - 速度特異性（漸增至比賽速）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.maturation-phase.i07
    q: CKC優先
    a:
    - 功能性更高
    - 關節穩定性佳
    - 仍需OKC補充單關節強化
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
  - id: ch22.maturation-phase.i08
    q: Neuromuscular 進階
    a:
    - 繼續本體感覺訓練
    - 增加增強式訓練、速度訓練（Ch.18,19）
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    related: []
    locator: ''
- id: resistance-training-systems
  title: 阻力訓練系統 Resistance Training Systems
  desc: ''
  tag: Program
  items:
  - id: ch22.resistance-training-systems.i01
    q: De Lorme
    a:
    - 3×10
    - 由輕到重：50%→75%→100% 10RM
    - 漸進抗阻
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
  - id: ch22.resistance-training-systems.i02
    q: Oxford
    a:
    - 3×10
    - 由重到輕：100%→75%→50% 10RM
    - 與De Lorme相反
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
  - id: ch22.resistance-training-systems.i03
    q: DAPRE（Knight）
    a:
    - 4組
    - 基準為6RM：50%×10→75%×6→100%×最多→調整重量×最多
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
  - id: ch22.resistance-training-systems.i04
    q: DAPRE 第3組調整表
    a:
    - 0-2次→降重複做
    - 3-4→不變
    - 5-7→同重
    - 8-12→+5-10lb
    - 13+→+10-15lb
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
  - id: ch22.resistance-training-systems.i05
    q: SAID 原則
    a:
    - 身體適應所施加的需求
    - 訓練目標決定訓練設計
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
  - id: ch22.resistance-training-systems.i06
    q: 馬拉松選手 vs 舉重選手
    a:
    - 同樣髕骨傷：馬拉松→2-3×15-20 低強度
    - 舉重→4-5×3-8 高強度
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
  - id: ch22.resistance-training-systems.i07
    q: 有氧訓練選擇
    a:
    - UBE、深水跑步、腳踏車、橢圓機
    - 依傷部位選擇
    - 儘早介入
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
  - id: ch22.resistance-training-systems.i08
    q: 代謝需求匹配
    a:
    - 馬拉松→有氧為主
    - 摔角→間歇
    - 舉重→無氧為主
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - program-design
    related: []
    locator: ''
