- id: sports-medicine-team
  title: 運動醫學團隊 Sports Medicine Team
  desc: ''
  tag: Team
  items:
  - id: ch22.sports-medicine-team.i01
    q: 隊醫（team physician）的角色與責任為何？
    a:
    - 隊醫通常是醫學博士或骨病醫學博士，為組織、學校或球隊提供醫療照護
    - 職責可包括賽前檢查、場上緊急照護、傷病評估與診斷，以及需要時轉介其他醫療人員
    - 雖不負責每日復健，通常最終判定運動員是否可回歸比賽，並可開立所需藥物
    detail: '隊醫可具家庭醫學、內科、兒科或骨科等訓練背景，但本章強調其應熟悉肌肉骨骼傷害與運動相關醫療狀況。'
    terms:
    - team-physician
    numbers: []
    concepts:
    - injury
    - professional
    related:
    - ch12.safety.i01
    - ch22.maturation-phase.i04
    locator: Sports Medicine Team > Sports Medicine Team Members
  - id: ch22.sports-medicine-team.i02
    q: 運動防護員（athletic trainer, ATC）的主要職責為何？
    a:
    - 通常負責運動員每日身體健康，並在隊醫督導下工作
    - 職責包括評估傷害、給予治療性運動加速復健、以治療性物理因子處理傷害，以及管理運動醫學團隊
    - 也透過與運動員的頻繁接觸，促進團隊、教練與運動員之間的溝通
    detail: '美國的 ATC 是經 National Athletic Trainers’ Association Board of Certification 認證的 Certified Athletic Trainer；本章同時使用 athletic trainer 或 athletic therapist 的稱呼。'
    terms:
    - athletic-trainer
    - physical-agent
    numbers: []
    concepts:
    - injury
    - professional
    locator: Sports Medicine Team > Sports Medicine Team Members
  - id: ch22.sports-medicine-team.i03
    q: 物理治療師（physical therapist）在運動醫學團隊中的角色為何？
    a:
    - 具骨科或運動醫學專長者可協助受傷運動員減痛與恢復功能，並可制定特定治療策略或管理長期復健
    - 在美國，具運動傷害管理專長者可經 American Board of Physical Therapy Specialties 取得運動專科認證（Sports Certified Specialist, SCS）
    detail: '教材提到這類人員日益參與急性傷害的評估、治療與復健，也可能兼任團隊運動防護員及運動物理治療師。'
    terms:
    - physical-therapist
    - sports-certified-specialist
    numbers: []
    concepts:
    - injury
    - professional
    related:
    - ch12.safety.i01
    locator: Sports Medicine Team > Sports Medicine Team Members
  - id: ch22.sports-medicine-team.i04
    q: 肌力與體能專業人員在復健與體能調整中扮演何種角色？
    a:
    - 此人通常著重肌力、爆發力與運動表現提升，也在復健與體能調整中扮演重要角色
    - 在運動防護員或運動物理治療師諮詢下，可運用阻力、增強式與有氧運動的技術與處方，設計讓運動員準備回歸比賽的體能調整計畫
    detail: '教材理想上建議此人具 NSCA 的 Certified Strength and Conditioning Specialist（CSCS）資格；本章不把其定位為診斷、開藥或最終放行的人員。'
    terms:
    - strength-and-conditioning-professional
    - plyometric-exercise
    numbers: []
    concepts:
    - injury
    - professional
    related:
    - ch17.exercise-selection.i05
    - ch18.program-design.i01
    - ch20.program-design.i01
    locator: Sports Medicine Team > Sports Medicine Team Members
  - id: ch22.sports-medicine-team.i05
    q: 運動醫學團隊還可能包括哪些專業成員？
    a:
    - 運動生理學家可協助設計考量運動代謝反應及其對癒合幫助的體能計畫
    - 具運動營養背景的營養師或註冊營養師可提供促進組織恢復的飲食選擇指引
    - 運動背景的合格諮商師、心理學家或精神科醫師可協助運動員因應傷害伴隨的心理壓力
    detail: '這些成員協助急性期後的復健與體能調整；不同角色處理的是代謝、營養或心理需求，不能互相取代。'
    terms:
    - exercise-physiologist
    - nutritionist
    - counselor
    - psychologist
    - psychiatrist
    numbers: []
    concepts:
    - injury
    - professional
    locator: Sports Medicine Team > Sports Medicine Team Members
  - id: ch22.sports-medicine-team.i06
    q: 運動醫學團隊為何必須維持溝通？
    a:
    - 受傷運動員常最常接觸教練、運動防護員與肌力與體能專業人員；有時也會先向教練或肌力與體能專業人員透露受傷
    - 團隊可藉每週會議討論運動員目前參與狀態、正在做的活動、限制或調整、進展，以及是否須改變計畫
    detail: '頻率較低的隊醫、物理治療師、營養師與運動心理人員仍須保持溝通；有效溝通是確保安全與和諧環境的團隊責任。'
    terms:
    - athletic-trainer
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - injury
    - professional
    related:
    - ch12.administration.i03
    locator: Sports Medicine Team > Communication
  - id: ch22.sports-medicine-team.i07
    q: 適應症（indication）與禁忌症（contraindication）分別是什麼？
    a:
    - 適應症是復健中運動員需要的治療形式；例如肩夾擠的壘球外野手須維持下肢功能，因此下肢肌力、速度、敏捷與爆發力訓練可被列為適應症
    - 禁忌症是因特定傷勢而不宜或被禁止的活動或做法
    detail: '肌力與體能專業人員須理解診斷及運動的適應症、禁忌症，才能安全設計受傷運動員的訓練。'
    terms:
    - indication
    - contraindication
    numbers: []
    concepts:
    - injury
    - professional
    related:
    - ch17.needs-analysis.i03
    locator: Sports Medicine Team > Communication
  - id: ch22.sports-medicine-team.i08
    q: 禁忌症與溝通表單如何用於安全體能調整？
    a:
    - 例如前肩脫臼復健後期可能需要上肢強化，但臥推可能因讓不穩定的前肩處於脆弱位置而成為禁忌症
    - 復健轉介表可向團隊成員傳達運動的適應症與禁忌症；肌力與體能摘要表可記錄目前活動及運動員對活動的反應
    detail: '教材將這些表單定位為溝通工具，用來安全有效地安排體能調整，並非由表單本身取代臨床判斷。'
    terms:
    - contraindication
    numbers: []
    concepts:
    - injury
    - professional
    related:
    - ch12.administration.i03
    locator: Sports Medicine Team > Communication
cards_legacy:
- q: 運動醫學團隊中，隊醫（team physician）的主要職責是什麼？
  a: MD/DO 背景，負責備賽前檢查、場邊急救、傷病診斷與轉介、藥物處方；最終決定運動員是否可復出競賽。
  tag: sports-medicine-team
- q: 運動防護員（athletic trainer, ATC）的主要職責為何？
  a: 日常身體健康管理、傷害評估、治療性運動、治療儀器使用；運動員與醫療團隊的溝通橋梁；在隊醫監督下工作。
  tag: sports-medicine-team
- q: 物理治療師（physical therapist）在運動醫學團隊中的角色為何？
  a: 減輕疼痛、恢復功能；發展特定治療策略或管理長期復健計畫；可獲 ABPTS 的 SCS（Sports Certified Specialist）認證。
  tag: sports-medicine-team
- q: S&C 專業人員（CSCS）在運動傷害復健中扮演什麼角色？
  a: 運用阻力、增強式、有氧訓練知識設計回歸競賽調整計畫；了解生物力學，建議進階復健動作；與運動防護員或物理治療師協作。
  tag: sports-medicine-team
- q: indication（適應症）與 contraindication（禁忌症）在復健中分別指什麼？
  a: Indication：受傷運動員必須執行的訓練形式（如肩傷時繼續進行下肢訓練）。Contraindication：因傷勢禁止執行的動作（如前肩關節脫臼後禁止臥推）。
  tag: communication
- q: 宏觀創傷（macrotrauma）的定義為何？
  a: 特定、突然的超載傷害，導致組織完整性受損；常見於骨骼（挫傷/骨折）、關節（脫臼/半脫臼）、韌帶（扭傷）、肌肉肌腱（挫傷/拉傷）。
  tag: injury-types
- q: 韌帶扭傷（sprain）的三級分類為何？
  a: 一度：部分撕裂，關節穩定性正常。二度：部分撕裂，輕微關節不穩定。三度：完全撕裂，全關節不穩定。
  tag: injury-types
- q: 肌肉拉傷（muscle strain）的三度分類為何？
  a: 一度：部分纖維撕裂，強力但疼痛的肌肉收縮。二度：部分撕裂，微弱且疼痛的收縮。三度：完全撕裂，非常微弱且無痛感的收縮。
  tag: injury-types
- q: 關節脫臼（dislocation）與半脫臼（subluxation）的區別為何？
  a: 脫臼：關節面完全移位。半脫臼：關節面部分移位。兩者均可導致關節鬆弛或不穩定。
  tag: injury-types
- q: 為什麼肌腱斷裂通常發生在肌肉腹或肌腱交界處，而非肌腱本身？
  a: 肌腱膠原纖維強度遠高於肌肉纖維，受力超過極限時，更可能在肌肉腹、肌腱交界處或肌腱附著骨骼處斷裂，而非在肌腱內部。
  tag: injury-types
- q: 微觀創傷（microtrauma）/ 過度使用傷害（overuse injury）的常見成因有哪些？
  a: 訓練錯誤（設計不良、過大量）、訓練地面不佳、生物力學或技術缺失、動作控制不足、柔軟度不足、骨骼排列異常。
  tag: injury-types
- q: 肌腱炎（tendinitis）與肌腱病變（tendinopathy）的區別為何？
  a: 肌腱炎：肌腱發炎（-itis 後綴代表發炎）。肌腱病變：退化性狀況，特徵是極少發炎但有新血管生成（neovascularization）；由慢性肌腱炎轉化而來。
  tag: injury-types
- q: 疲勞性骨折（stress fracture）的主要成因為何？
  a: 訓練量快速增加或在過硬表面上訓練量過大；體型、營養、代謝因素也有影響。屬最常見的骨骼過度使用傷害。
  tag: injury-types
- q: 組織癒合的三個階段為何？
  a: 1. 發炎反應期（Inflammatory response phase）。2. 纖維母細胞修復期（Fibroblastic repair phase）。3. 成熟重塑期（Maturation-remodeling phase）。
  tag: tissue-healing
- q: 發炎反應期的持續時間與主要事件是什麼？
  a: 通常持續 2–3 天，最多不超過 1 週。事件：血管擴張、毛細血管通透性增加、組織水舃（edema）、化學介質釋放（組織胺、緩激脓）、吞噬作用清除壞死組織。
  tag: tissue-healing
- q: 發炎期中，edema（組織水舃）是如何形成的，有何影響？
  a: 受傷 → 局部低氧環境 → 組織壞死 → 組織胺/緩激脓釋放 → 毛細血管通透性增加 → 液體滲出到周圍組織。水舃抓制收縮性組織，顯著限制功能。
  tag: tissue-healing
- q: 吞噬作用（phagocytosis）在組織癒合中的作用為何？
  a: 發炎期中，增加的血流和吞噬作用促使巨噻細胞（macrophages）釋放並清除細胞碎屑，防止碎屑延緩癒合過程。
  tag: tissue-healing
- q: 纖維母細胞修復期（fibroblastic repair phase）的時間範圍與特徵為何？
  a: 傷後 2 天開始，可持續至 2 個月。特徵：第三型膠原蛋白（Type III collagen）隨機沉積、新毛細血管形成、瘘痕組織形成；新組織強度低於原始組織。
  tag: tissue-healing
- q: 為什麼修復期新形成的膠原纖維強度低於正常組織？
  a: Type III 膠原蛋白是橫向排列（而非決復應力線縱向排列），傳力效率低；且尚未轉換為較強的 Type I 膠原蛋白，因此強度低於原始組織。
  tag: tissue-healing
- q: 成熟重塑期（maturation-remodeling phase）的主要特徵為何？
  a: 開始於修復期後，可持續數月至數年。Type III 膠原轉換為更強的 Type I 膠原；纖維沿應力線排列並肥大，組織強度提升，但仍不如原始組織強。
  tag: tissue-healing
- q: 發炎期中 Type I 與 Type III 膠原蛋白各幔演什麼角色？
  a: 修復期：Type III 膠原隨機沈積，機械強度低、決復方向欠佳。成熟重塑期：Type I 膠原取代 Type III，強度提升，沿應力線排列；但最終強度仍低於原始組織。
  tag: tissue-healing
- q: 發炎反應期的復健治療目標是什麼？
  a: 防止新生組織受損；相對休息 + 物理治療儀器（冰敦、壓縮、抬高、電刺激）；維持未受傷區域的心肺及神經肌肉骨骼功能。受傷部位不做主動運動。
  tag: rehab-goals
- q: 發炎期中，S&C 專業人員可安排哪些訓練？
  a: 未受傷肢體的有氧/無氧/阻力訓練；若受傷肢體可移動，可做受傷部位近端/遠端的孤立動作（前提：不對受傷部位施壓）。例：膝傷後的髓内外轉、肩傷後的肩胛穩定動作。
  tag: rehab-goals
- q: 纖維母細胞修復期的治療目標是什麼？
  a: 防止過度肌肉蒒縮和關節退化；平衡保護新膠原纖維（避免過載）與逐漸引入低負荷（促進膠原合成）之間的分徚；早期保護性動作可加速膠原纖維最佳排列。
  tag: rehab-goals
- q: 修復期中，太少活動對組織癒合有何負面影響？
  a: 新形成的膠原纖維無法最佳排列，且可能形成沿黨（adhesions），阻礙完整關節活動度；因此需要低負荷的早期保護性動作（early protected motion），而非完全休息。
  tag: tissue-healing
- q: 成熟重塑期的治療目標與復出標準為何？
  a: 最佳化組織功能並轉向回歸運動；復出標準：關節活動度、肌力測試（側邊差異 <10% 可接受）、功能性測試、患者自評量表；對比健側或常模值。
  tag: rehab-goals
- q: 修復期中等長運動（isometric exercise）有何限制？
  a: 等長訓練具關節角度特異性（只在訓練角度產生增益），若有適應症可在多個角度進行；應為次最大強度且無痛，以維持神經肌肉功能同時不破壞新生膠原纖維。
  tag: rehab-exercise
- q: 等速遍訓練（isokinetic exercise）在復健中的限制為何？
  a: 在固定速度下提供阻力（如 60°/s），但運動不在單一恒定速度進行；多數設備只允許單關節訓練，功能轉移有限。
  tag: rehab-exercise
- q: 復健中，離心（eccentric）與向心（concentric）肌肉收縮各有何優點？
  a: 離心：產力更大、能量消耗更少；可在組織癒合進展時加大負荷。兩者均可組合用於強化受傷組織，速度可作為設計變數。
  tag: rehab-exercise
- q: 神經肌肉控制（neuromuscular control）的定義與受損原因為何？
  a: 肌肉對傳入感覺訊息做出反應以維持關節穩定性的能力。受傷後本體感覺（proprioception）受損，影響姿勢、平衡、穩定性與位置感，需要特定訓練恢復。
  tag: neuromuscular
- q: 本體感覺（proprioception）的定義與來源為何？
  a: 對皮膚、肌肉、肌腱、韌帶、關節囊中感覺受器刺激的傳入感覺訊息；貢獻於有意識與無意識的姿勢、平衡、穩定性與位置感控制。
  tag: neuromuscular
- q: 用於改善神經肌肉控制的訓練方法有哪些？
  a: 不穩定表面（远小彈跳床、平衡板、穩定球）、閉眼動作（移除視覺輸入）、漸增速度；可操控表面穩定性、視覺、速度三個變數；深蹲、伏地挨伏於不穩定表面都可應用。
  tag: neuromuscular
- q: 閉鎖性動力鏈（closed kinetic chain, CKC）運動的定義與優點為何？
  a: 遠端關節（末端節段）固定不動的運動（如深蹲、伏地挨伏）。優點：增加關節穩定性、模擬功能性動作模式、多關節協同工作；常用於功能性復健。
  tag: kinetic-chain
- q: 開放性動力鏈（open kinetic chain, OKC）運動的定義與特點為何？
  a: 末端關節可自由移動的運動（如腿伸展機）；允許孤立针對特定關節或肌群集中訓練。術科中雙腿同時具有 CKC（著地腿）和 OKC（空中腿）两種尋動。
  tag: kinetic-chain
- q: De Lorme 阻力訓練計畫（復健用）的結構為何？
  a: 3 組 × 10 下，由輕到重遞增：第 1 組 = 10RM 的 50%；第 2 組 = 10RM 的 75%；第 3 組 = 10RM 的 100%（金字塔正向）。
  tag: resistance-training-rehab
- q: Oxford 阻力訓練計畫的結構為何，與 De Lorme 有何不同？
  a: 3 組 × 10 下，由重到輕遞減：第 1 組 = 10RM 的 100%；第 2 組 = 10RM 的 75%；第 3 組 = 10RM 的 50%（金字塔反向）。
  tag: resistance-training-rehab
- q: DAPRE（每日可調整漸進阻力訓練）的結構為何？
  a: 4 組計畫，以估計 6RM 為基準：第 1 組 = 6RM × 50% × 10 下；第 2 組 = 6RM × 75% × 6 下；第 3 組 = 6RM × 100% × 最大下數；第 4 組根據第 3 組下數調整重量。
  tag: resistance-training-rehab
- q: DAPRE 計畫中，第三組完成次數與第四組/下次訓練的重量調整關係為何？
  a: 0–2次：減 5–10 lb，重做第 3 組；3–4次：減 0–5 lb / 下次同重；5–7次：同重 / 下次 +5–10 lb；8–12次：+5–10 lb / 下次 +5–15 lb；13+次：+10–15 lb / 下次 +10–20 lb。
  tag: resistance-training-rehab
- q: 復健阻力訓練應如何應用 SAID 原則？
  a: 訓練目標（適應）應決定訓練設計（施加的要求）。例：馬拉松選手復健強調肌耒力（多組高次數）；舉重選手同張傷復健強調爆發力（少組高強度）。
  tag: resistance-training-rehab
- q: 復健中有氧/無氧訓練的目標是什麼，如何選擇訓練模式？
  a: 模擬項目代賭需求；選擇不對受傷部位施壓的訓練設備。常用選項：上肢測功機、深水跑步、下肢單車、橢圓機。即使在發炎期也可對未受傷部位維持心肺適能。
  tag: aerobic-anaerobic-rehab
- q: 訓練未受傷肢體對受傷肢體有何幫助（交叉訓練效果）？
  a: 研究顯示訓練未受傷肢體可改善受傷肢體的肌力（cross-education 效果）；因此受傷後繼續對未受傷側進行訓練具有重要意義。
  tag: aerobic-anaerobic-rehab
- q: 復健的五大基本原則為何？
  a: '1. 癒合組織不可過載。

    2. 運動員需達特定標準才能進展到下一期。

    3. 計畫須基於當前臨床與科學研究。

    4. 計畫須能個別化。

    5. 復健是以回歸競賽為目標的團隊協作過程。'
  tag: rehab-principles
- q: 回歸運動的標準（return-to-play criteria）通常包含哪些項目？
  a: 關節活動度、肌力測試（與側強力差異 <10% 可接受）、功能性測試、患者自評量表（patient-reported outcome forms）；由隊醫最終決定。
  tag: rehab-goals
- q: 受傷後「疼痛降低」是否等同於「組織已癒合」？
  a: 否。疼痛常在組織完全癒合前就消退（見組織癒合曲線圖）；過早回歸完全活動可能進一步損傷仍未癒合的組織，應以客觀標準而非主觀疼痛作為進展依據。
  tag: tissue-healing
- q: 成熟重塑期的功能性訓練原則是什麼？
  a: 訓練動作要模擬運動需求（特異性）：關節角度特異性強化、速度特異性肌肉活動、閉/開鎖動力鏈動作、神經肌肉控制訓練；從一般性動作逐步進階至項目特異性動作。
  tag: rehab-goals
- q: 既往傷病是未來受傷的最大風险因素之一。回歸運動後持續存在哪些缺陥？
  a: 回歸運動後個體可能持續表現出肌力、生物力學和功能表現的缺陥；側邊肌力差異 <10% 可接受；示能期間需持續監控和訓練修正。
  tag: injury-prevention
- q: 上肢傷害的主要風险因素有哪些？
  a: 盂肱關節活動度減少、肩胛骨運動障磙（scapular dyskinesis）、肩部肌力下降；常用 Throwers Ten 訓練計畫降低上肢傷害風险。
  tag: injury-prevention
- q: 下肢傷害（尤其是 ACL）的主要風险因素有哪些？
  a: 平衡感下降、跨落地時神經肌肉控制不良、下肢肌力不足；有针對跨落地技術和切入動作的結構性訓練計畫（如 Sportsmetrics、PEP）可降低風险。
  tag: injury-prevention
- q: Sportsmetrics 和 PEP 計畫的目的是什麼？
  a: 結構性下肢傷害風险降低計畫；透過针對傷害風险因素的動作與訓練，顯著降低下肢傷害率（尤其是 ACL 傷害與踝關節扭傷）。
  tag: injury-prevention
- q: 離心訓練對降低肌肉傷害風险的作用為何？
  a: 研究顯示離心訓練可顯著降低腿後肌拉傷風险（hamstring injury risk reduction）；應納入傷害預防計畫中。
  tag: injury-prevention
- q: S&C 專業人員如何透過溝通表格有效參與復健？
  a: 使用復健轉介表（rehabilitation referral form）了解適應症/禁忌症；使用 S&C 訓練摘要表（summary form）記錄訓練內容和運動員的主客觀反應，促進醫療團隊溝通。
  tag: communication
- q: 復健中，治療儀器（modalities）在各期的使用目的有何不同？
  a: 發炎期：冰敦、壓縮、抬高、電刺激 → 減少疼痛和組織損傷。修復期：超音波、電刺激、冰敦 → 促進膠原合成（目標不同於發炎期）。
  tag: rehab-exercise
cards:
- q: 隊醫的最終復健權責？
  a: 通常最終判定是否可回歸比賽。
  tag: sports-medicine-team
- q: 隊醫可負責哪些工作？
  a: 賽前檢查、場上急救、評估診斷、轉介與藥物處方。
  tag: sports-medicine-team
- q: 運動防護員的日常角色？
  a: 評估與復健傷害、使用治療性物理因子，並促進溝通。
  tag: sports-medicine-team
- q: 物理治療師可提供什麼？
  a: 減痛、恢復功能、治療策略與長期復健管理。
  tag: sports-medicine-team
- q: 適應症與禁忌症的意義？
  a: 前者是需要的治療；後者是因傷不宜或禁止的活動。
  tag: communication
- q: 宏觀創傷是什麼？
  a: 一次突發過載造成組織完整性受破壞。
  tag: injury-types
- q: 第一度韌帶扭傷？
  a: 韌帶部分撕裂，但未增加關節不穩定性。
  tag: injury-types
- q: 第三度肌肉拉傷？
  a: 肌纖維完全撕裂，肌肉活動非常無力且無痛。
  tag: injury-types
- q: 脫臼與半脫臼？
  a: 分別是關節面完全與部分移位。
  tag: injury-types
- q: 肌腱常在哪裡斷裂？
  a: 較可能在肌腹、肌腱交界或附著骨處，而非腱實質。
  tag: injury-types
- q: 微觀創傷的成因？
  a: 反覆異常應力、連續訓練或恢復不足。
  tag: injury-types
- q: 疲勞性骨折常見誘因？
  a: 訓練量快速增加或硬表面上過量訓練。
  tag: injury-types
- q: 肌腱炎與肌腱病變？
  a: 前者是發炎；後者是發炎極少的新血管退化性狀況。
  tag: injury-types
- q: 組織癒合三期？
  a: 發炎反應、纖維母細胞修復、成熟重塑。
  tag: tissue-healing
- q: 發炎期通常多久？
  a: 急性傷後 2 至 3 天，通常少於 1 週。
  tag: tissue-healing
- q: 水腫如何形成？
  a: 化學介質增加血流與微血管通透性，液體逸入周圍組織。
  tag: tissue-healing
- q: 水腫的功能影響？
  a: 抑制收縮組織並顯著限制功能。
  tag: tissue-healing
- q: 修復期何時開始？
  a: 最早可在傷後 2 天開始，最久可至 2 個月。
  tag: tissue-healing
- q: 修復期的膠原蛋白？
  a: 第三型膠原隨機沉積，為組織再生提供架構。
  tag: tissue-healing
- q: 重塑期的膠原蛋白？
  a: 轉為較強的第一型膠原並沿受力線排列。
  tag: tissue-healing
- q: 重塑期可維持多久？
  a: 數月至數年，且組織仍弱於原組織。
  tag: tissue-healing
- q: 發炎期首要目標？
  a: 最大保護受傷結構並防止新組織受破壞。
  tag: rehab-goals
- q: 發炎期傷區運動原則？
  a: 不建議直接涉及或施壓傷區的運動。
  tag: rehab-goals
- q: 修復期目標？
  a: 防止過度萎縮與關節退化，同時漸進加入低負荷。
  tag: rehab-goals
- q: 太少活動的後果？
  a: 新生纖維排列不佳並可能形成沾黏。
  tag: tissue-healing
- q: 重塑期回歸決策依據？
  a: 癒合時程、標準導向進程、活動度、肌力、功能測試與自評功能。
  tag: rehab-goals
- q: 修復期等長運動條件？
  a: 須無痛、有適應症並在醫療團隊諮詢後施用。
  tag: rehab-exercise
- q: 等速運動限制？
  a: 運動並非固定速度，且多數設備只做單關節運動。
  tag: rehab-exercise
- q: 離心與向心比較？
  a: 離心可產生較大力量且耗能較少。
  tag: rehab-exercise
- q: 神經肌肉控制是什麼？
  a: 肌肉回應傳入感覺資訊以維持關節穩定的能力。
  tag: neuromuscular
- q: 本體感覺來源？
  a: 皮膚、肌肉、肌腱、韌帶與關節囊的感覺受器。
  tag: neuromuscular
- q: 如何挑戰神經肌肉控制？
  a: 改變表面穩定性、視覺或動作速度。
  tag: neuromuscular
- q: 閉鎖動力鏈定義？
  a: 末端關節受阻力限制，遠端節段固定。
  tag: kinetic-chain
- q: 開放動力鏈例子？
  a: 腿伸展；末端關節可自由移動。
  tag: kinetic-chain
- q: De Lorme 結構？
  a: 三組十下，由 10RM 的 50%、75% 至 100%。
  tag: resistance-training-rehab
- q: Oxford 結構？
  a: 三組十下，由 10RM 的 100%、75% 至 50%。
  tag: resistance-training-rehab
- q: DAPRE 的第三組用途？
  a: 以估計 6RM 的 100% 做最多次數，決定第四組調整。
  tag: resistance-training-rehab
- q: DAPRE 0–2 下怎麼調整？
  a: 減 5–10 lb（2.3–4.5 kg）後重做第四組。
  tag: resistance-training-rehab
- q: SAID 原則？
  a: 系統會適應所施加的需求，目標決定訓練設計。
  tag: resistance-training-rehab
- q: 復健有氧訓練原則？
  a: 盡可能模擬運動與代謝需求，同時避開傷勢禁忌。
  tag: aerobic-anaerobic-rehab
- q: 未受傷肢體訓練效益？
  a: 可改善受傷肢體的肌力。
  tag: aerobic-anaerobic-rehab
- q: 復健五原則之一？
  a: 癒合組織不得過度受壓。
  tag: rehab-principles
- q: 為何疼痛較少仍不可完全活動？
  a: 受傷組織可能尚未完全癒合。
  tag: tissue-healing
- q: 重塑期訓練的特異性？
  a: 從一般運動轉為反映運動需求的功能性活動。
  tag: rehab-goals
- q: 既往受傷的風險意義？
  a: 是未來受傷最重要的風險因子之一。
  tag: injury-prevention
- q: 上肢傷害風險因子？
  a: 盂肱關節活動度下降、肩胛骨運動異常、肩肌力下降。
  tag: injury-prevention
- q: 下肢預防計畫焦點？
  a: 運動專項的落地與切入神經肌肉控制。
  tag: injury-prevention
- q: Sportsmetrics 與 PEP？
  a: 處理下肢傷害風險因子的結構化計畫。
  tag: injury-prevention
- q: 偏心運動的預防效果？
  a: 已被證明可大幅降低腿後肌傷害風險。
  tag: injury-prevention
- q: 復健轉介表的用途？
  a: 向團隊傳達運動適應症與禁忌症。
  tag: communication
- q: 發炎與修復期物理因子差異？
  a: 前期減少傷害與急性疼痛；修復期支持新組織形成並管理疼痛。
  tag: rehab-exercise
- q: 吞噬作用在發炎期的功能？
  a: 與增加的血流一起清除組織碎屑與病原體。
  tag: tissue-healing
