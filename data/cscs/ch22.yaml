id: ch22
weight: 22
title: Ch.22 Rehabilitation and Reconditioning
topics:
- id: fibroblastic-phase
  title: 修復期 Fibroblastic Repair Phase
  desc: ''
  tag: Phase 2
  items:
  - id: ch22.fibroblastic-phase.i01
    q: 纖維母細胞修復期（fibroblastic repair phase）的時程與主要過程為何？
    a:
    - 發炎期結束後開始修復；最早可在受傷後 2 天開始，最久可持續至 2 個月
    - 此期會分解並替換傷後已失去活性的組織，並在傷處形成新毛細血管與結締組織（疤痕組織）
    detail: '開始與持續時間會隨組織類型與受傷條件而變化；新生組織尚未達到原組織的最佳強度。'
    terms:
    - fibroblastic-repair
    numbers:
    - v: '2'
      unit: 天
      of: 受傷後修復期最早可開始的時間
    - v: '2'
      unit: 個月
      of: 修復期可能持續的最長時間
    concepts:
    - injury
    locator: Tissue Healing > Fibroblastic Repair Phase
  - id: ch22.fibroblastic-phase.i02
    q: 修復期的第三型膠原蛋白（Type III collagen）有何特徵？
    a:
    - 第三型膠原蛋白會沿受傷結構隨機沉積，作為組織再生的架構
    - 膠原纖維若沿主要受力線縱向排列最強，但許多新纖維是橫向排列，傳力效率受限
    detail: '隨機且常為橫向的排列，說明新組織比原組織弱，不能將此期視為已恢復完整承載能力。'
    terms:
    - type-iii-collagen
    - collagen
    numbers: []
    concepts:
    - injury
    related:
    - ch05.connective-tissue.i08
    locator: Tissue Healing > Fibroblastic Repair Phase
  - id: ch22.fibroblastic-phase.i03
    q: 修復期的治療目標如何兼顧保護與活動？
    a:
    - 防止受傷區域過度肌肉萎縮與關節退化
    - 避免破壞新生膠原纖維，同時逐漸加入低負荷應力以增加膠原合成並避免關節活動度流失
    detail: '太少活動同樣有害：新生纖維可能無法最佳排列並形成沾黏；早期保護性活動可促進纖維排列與組織活動度。'
    terms:
    - collagen
    numbers: []
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Fibroblastic Repair Phase > Treatment Goal
  - id: ch22.fibroblastic-phase.i04
    q: 修復期何時可使用等長運動（isometric exercise）？
    a:
    - 須在隊醫、運動防護員或物理治療師諮詢後，且無痛並有適應症時才可進行
    - 次最大等長運動可在不破壞新生膠原纖維的低強度下，維持神經肌肉功能並增進肌力
    - 肌力增益具關節角度特異性；若有適應症，可在多個角度訓練
    detail: '等長訓練不是對所有受傷部位都自動適用；是否採用先取決於該傷勢的適應症與禁忌症。'
    terms:
    - isometric-exercise
    - neuromuscular-control
    - collagen
    numbers: []
    concepts:
    - injury
    related:
    - ch02.strength-factors.i07
    locator: Goals of Rehabilitation and Reconditioning > Fibroblastic Repair Phase > Exercise Strategies
  - id: ch22.fibroblastic-phase.i05
    q: 等速運動（isokinetic exercise）的復健限制是什麼？
    a:
    - 等速設備在指定速度下提供動作阻力，例如 60°/秒或 120°/秒
    - 運動並非在單一固定速度進行，且多數等速設備僅能做單關節運動
    detail: '這些特性讓等速運動能集中在特定關節或肌肉，卻不一定是最具功能性的強化方式。'
    terms:
    - isokinetic-exercise
    numbers:
    - v: '60'
      unit: °/秒
      of: 書中舉例的等速運動設定速度
    - v: '120'
      unit: °/秒
      of: 書中舉例的等速運動設定速度
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Fibroblastic Repair Phase > Exercise Strategies
  - id: ch22.fibroblastic-phase.i06
    q: 等張運動（isotonic exercise）在修復期如何施用？
    a:
    - 等張運動包含向心與離心肌肉動作，外部阻力固定，但移動阻力所需力量會隨關節角度與主動肌長度改變
    - 可利用重力、啞鈴、槓鈴或插銷式器械；隨組織癒合進展可增加負荷
    - 較急性的傷勢宜採較慢速度，較後期才可採更快、較具運動特異性的動作
    detail: '離心運動能比向心運動產生更大力量且耗能較少；這是兩者的比較，不是教材對修復早期的優先處方。'
    terms:
    - isotonic-exercise
    - concentric-action
    - eccentric-action
    numbers: []
    concepts:
    - injury
    related:
    - ch02.strength-factors.i07
    - ch17.principles-exam-tips.i01
    locator: Goals of Rehabilitation and Reconditioning > Fibroblastic Repair Phase > Exercise Strategies
  - id: ch22.fibroblastic-phase.i07
    q: 何謂神經肌肉控制（neuromuscular control），修復期如何訓練？
    a:
    - 神經肌肉控制是肌肉回應傳入感覺資訊、維持關節穩定性的能力；受傷後通常會與肌力、柔軟度一起受損
    - 可藉由改變表面穩定性、視覺與速度進行訓練，例如迷你彈簧床、平衡板、穩定球或閉眼動作
    detail: '本體感覺是來自皮膚、肌肉、肌腱、韌帶與關節囊受器的傳入資訊；漸進操控三項變數，是為下一期更具挑戰性的動作做準備。'
    terms:
    - neuromuscular-control
    - proprioception
    numbers: []
    concepts:
    - injury
    related:
    - ch01.proprioception.definition
    locator: Goals of Rehabilitation and Reconditioning > Fibroblastic Repair Phase > Exercise Strategies
  - id: ch22.fibroblastic-phase.i08
    q: 修復期的物理因子（physical agents）用途為何？
    a:
    - 可使用超音波、電刺激與冰敷
    - 此期使用的目標是支持並加速新組織形成、促進膠原合成及管理疼痛
    detail: '教材將物理因子列為可使用的選項；是否採用及其具體作法仍須由醫療團隊判定。'
    terms:
    - physical-agent
    - collagen
    numbers: []
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Fibroblastic Repair Phase > Treatment Goal
- id: inflammatory-phase
  title: 發炎期 Inflammatory Response Phase
  desc: ''
  tag: Phase 1
  items:
  - id: ch22.inflammatory-phase.i01
    q: 發炎反應期（inflammatory response phase）通常持續多久？
    a:
    - 急性受傷後通常持續 2 至 3 天，典型情況少於 1 週
    - 血液供應受損或結構性傷害較嚴重時，可能持續更久
    detail: '時間不是固定處方；若發炎未在合理時間內結束，後續階段可能無法進行，因而延後復健。'
    terms:
    - inflammatory-response
    numbers:
    - v: '2-3'
      unit: 天
      of: 急性傷後發炎期的典型持續時間
    - v: '<1'
      unit: 週
      of: 發炎期通常持續的時間
    concepts:
    - injury
    locator: Tissue Healing > Inflammatory Response Phase
  - id: ch22.inflammatory-phase.i02
    q: 發炎期如何形成局部紅、腫與水腫（edema）？
    a:
    - 血管狀態、血流與微血管通透性改變，讓受傷區域出現發紅與腫脹
    - 局部低氧造成一定程度的組織死亡，釋出組織胺（histamine）與緩激肽（bradykinin）
    - 這些化學介質進一步增加局部血流與微血管通透性，使液體逸入周圍組織形成水腫
    detail: '原文的順序是局部低氧與組織死亡後釋出化學介質，再進一步提高血流與通透性；不是由水腫引發介質釋出。'
    terms:
    - inflammation
    - edema
    - histamine
    - bradykinin
    numbers: []
    concepts:
    - injury
    locator: Tissue Healing > Inflammatory Response Phase
  - id: ch22.inflammatory-phase.i03
    q: 水腫與吞噬作用（phagocytosis）如何影響功能與清除傷區？
    a:
    - 水腫會抑制收縮組織，顯著限制功能
    - 增加的血流與吞噬作用會移除組織碎屑與病原體；吞噬作用使巨噬細胞（macrophages）搜尋並移除可能拖慢癒合的細胞碎屑
    detail: '教材原文將巨噬細胞的釋出連結到吞噬作用；此處按原文保留，不將其延伸為其他未在本章說明的免疫機制。'
    terms:
    - edema
    - phagocytosis
    - macrophage
    numbers: []
    concepts:
    - injury
    locator: Tissue Healing > Inflammatory Response Phase
  - id: ch22.inflammatory-phase.i04
    q: 發炎期的首要治療目標是什麼？
    a:
    - 防止新生組織受破壞，並營造有利新組織再生與形成的環境
    - 最大程度保護受傷結構，同時維持其他身體組織與心肺系統的功能
    detail: '控制性治療應力在組織癒合中有其角色，但發炎期的優先事項是避免對受傷組織施加額外壓力。'
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Inflammatory Response Phase > Treatment Goal
  - id: ch22.inflammatory-phase.i05
    q: 發炎期可採用哪些物理因子（physical agents）？其證據界線為何？
    a:
    - 相對休息及冰敷、加壓、抬高、電刺激等物理因子，常是用來減少組織傷害與急性疼痛的主要選項
    - 這些物理因子的效能研究結果不一致
    detail: '教材沒有把任何一項物理因子列為保證有效的處置；其使用須放在保護受傷結構的整體目標下。'
    terms:
    - physical-agent
    numbers: []
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Inflammatory Response Phase > Treatment Goal
  - id: ch22.inflammatory-phase.i06
    q: 發炎期肌力與體能專業人員可如何維持整體功能？
    a:
    - 先與運動防護員確認特定傷勢的適應症（indication）與禁忌症（contraindication）
    - 在最大保護受傷結構的前提下，可安排未受傷肢體的一般有氧、無氧與阻力訓練
    detail: '若受傷肢體活動沒有禁忌症，才可考慮不會使受傷區受壓的近端或遠端孤立運動。'
    terms:
    - strength-and-conditioning-professional
    - indication
    - contraindication
    numbers: []
    concepts:
    - injury
    related:
    - ch20.program-design.i01
    - ch17.needs-analysis.i03
    locator: Goals of Rehabilitation and Reconditioning > Inflammatory Response Phase > Treatment Goal
  - id: ch22.inflammatory-phase.i07
    q: 發炎期有哪些不直接施壓傷區的運動例子？
    a:
    - 下肢受傷時可做上肢運動；可對未受傷肢體進行單腳運動
    - 若傷肢活動沒有禁忌症，膝傷後可做髖外展與旋轉；盂肱關節傷後可做肩胛穩定運動
    detail: '例子成立的共同條件是動作不直接涉及或施壓受傷區域，不是以受傷部位名稱自動決定可做的運動。'
    terms:
    - contraindication
    - glenohumeral-joint
    numbers: []
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Inflammatory Response Phase > Treatment Goal
  - id: ch22.inflammatory-phase.i08
    q: 發炎期對受傷區直接運動的原則為何？
    a:
    - 初期需要讓受傷區相對休息，以保護已受損的組織免於額外傷害
    - 不建議做直接涉及或施壓受傷區的運動
    detail: '這是發炎期的原則；不等於整個復健歷程都不活動，後續進展仍取決於癒合期與個別標準。'
    terms:
    - inflammatory-response
    numbers: []
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Inflammatory Response Phase > Exercise Strategies
- id: injury-prevention
  title: 傷害預防與再傷風險 Injury Prevention
  desc: ''
  tag: Prevention
  items:
  - id: ch22.injury-prevention.i01
    q: 先前受傷（previous injury）與未來傷害有何關係？
    a:
    - 對活動者而言，先前受傷是未來受傷最重要的風險因子之一
    detail: '教材的表述是「最重要的風險因子之一」，不是唯一或絕對最大的預測因子。'
    terms:
    - previous-injury
    numbers: []
    concepts:
    - injury
    - safety
    related:
    - ch17.needs-analysis.i03
    locator: Reducing Risk of Injury and Reinjury
  - id: ch22.injury-prevention.i02
    q: 上肢傷害的風險因子有哪些？
    a:
    - 盂肱關節活動範圍（range of motion, ROM）減少
    - 肩胛骨運動異常（scapular dyskinesis）
    - 肩部肌力下降
    detail: '本項列的是上肢傷害的風險因子；教材沒有把它們寫成足以單獨診斷或預測每一種上肢傷害的測驗門檻。'
    terms:
    - glenohumeral-joint
    - range-of-motion
    - scapular-dyskinesis
    numbers: []
    concepts:
    - injury
    - safety
    locator: Reducing Risk of Injury and Reinjury
  - id: ch22.injury-prevention.i03
    q: 下肢傷害的風險因子有哪些？
    a:
    - 平衡能力下降
    - 跳躍落地時神經肌肉控制下降
    - 下肢肌力下降
    detail: '這些因素是下肢結構化傷害預防計畫應處理的風險因子；計畫也應符合該運動的需求。'
    terms:
    - neuromuscular-control
    numbers: []
    concepts:
    - injury
    - safety
    related:
    - ch13.balance-flexibility-bc.i01
    - ch18.safety.i01
    locator: Reducing Risk of Injury and Reinjury
  - id: ch22.injury-prevention.i04
    q: 下肢傷害風險降低計畫應如何設計？
    a:
    - 應依運動專項設計
    - 應著重跳躍落地、切入等活動所需的神經肌肉控制
    - 教材列舉的可用練習包括增強式運動中的正確跳躍與落地技術，以及強調單側肌力的單腳深蹲
    detail: '教材將上述動作列為「可用」於降低下肢傷害風險的兩種練習，沒有宣稱這兩個動作單獨構成完整預防計畫。'
    terms:
    - neuromuscular-control
    - plyometric-exercise
    numbers: []
    concepts:
    - injury
    - safety
    related:
    - ch18.safety.i01
    - ch19.agility-cod.i05
    - ch15.lower-body.i01
    locator: Reducing Risk of Injury and Reinjury
  - id: ch22.injury-prevention.i05
    q: Throwers Ten 在上肢傷害預防中的定位為何？
    a:
    - 關節活動範圍運動與 Throwers Ten 常被用作降低上肢傷害風險的結構化計畫
    detail: '教材使用「常被使用」的表述；沒有在本章列出 Throwers Ten 的完整動作內容或量化成效。'
    terms:
    - range-of-motion
    - throwers-ten
    numbers: []
    concepts:
    - injury
    - safety
    locator: Reducing Risk of Injury and Reinjury
  - id: ch22.injury-prevention.i06
    q: Sportsmetrics 與 PEP 計畫在教材中的用途為何？
    a:
    - Sportsmetrics 與 PEP（Prevent Injury and Enhance Performance）是兩項降低傷害風險的結構化計畫
    - 兩者著重面向不同，但都導入可處理傷害風險因子的運動與動作
    - 教材指出這類計畫可降低下肢傷害率，尤其是前十字韌帶傷害與踝關節扭傷
    detail: '教材沒有說兩項計畫使用完全相同的方法；共同點是針對風險因子安排動作與訓練。'
    terms:
    - sportsmetrics
    - pep
    - anterior-cruciate-ligament
    - sprain
    numbers: []
    concepts:
    - injury
    - safety
    locator: Reducing Risk of Injury and Reinjury
  - id: ch22.injury-prevention.i07
    q: 離心運動（eccentric exercise）與腿後肌傷害風險有何關係？
    a:
    - 使用離心運動已被證明可大幅降低腿後肌傷害風險
    detail: '本章只報告離心運動與腿後肌傷害風險降低的結果，沒有指派開始時期、負荷、組數或特定動作。'
    terms:
    - eccentric-action
    numbers: []
    concepts:
    - injury
    - safety
    related:
    - ch19.training-methods.i06
    - ch02.strength-factors.i07
    locator: Reducing Risk of Injury and Reinjury
  - id: ch22.injury-prevention.i08
    q: 回歸運動後應如何檢視殘存缺損？
    a:
    - 回歸運動後仍可能有肌力、生物力學與功能表現的缺損
    - 可與對側肢體或既有常模值比較；肌力與功能表現的左右差異小於 10% 可視為可接受
    detail: '從受監督復健轉為不受限制活動是關鍵時期，團隊必須溝通如何處理仍存在的肌力與表現缺損。'
    terms:
    - range-of-motion
    numbers:
    - v: '<10'
      unit: '%'
      of: 可視為可接受的左右肌力與功能表現差異
    concepts:
    - injury
    - safety
    related:
    - ch13.test-administration.i08
    - ch12.why-test.i04
    - ch22.maturation-phase.i04
    locator: Reducing Risk of Injury and Reinjury
- id: injury-types
  title: 傷害類型 Injury Types
  desc: ''
  tag: Injury
  items:
  - id: ch22.injury-types.i01
    q: 宏觀創傷（macrotrauma）是什麼？
    a:
    - 它是一次特定、突發的組織過載事件，造成組織完整性受破壞
    detail: '宏觀創傷按受傷組織可表現為不同傷害類型；不能把後述的每一種傷害都當成宏觀創傷的必然結果。'
    terms:
    - macrotrauma
    numbers: []
    concepts:
    - injury
    locator: Types of Injury
  - id: ch22.injury-types.i02
    q: 骨與關節的創傷可如何分類？
    a:
    - 骨創傷可造成挫傷（contusion）或骨折（fracture）；骨折可分類為閉鎖性、開放性、撕脫性或不完全性
    - 關節創傷可表現為脫臼（dislocation，關節面完全移位）或半脫臼（subluxation，關節面部分移位），並可能造成關節鬆弛或不穩定
    detail: '本章列出骨折的分類示例，但沒有提供這些分類的進一步診斷規則。'
    terms:
    - contusion
    - fracture
    - dislocation
    - subluxation
    numbers: []
    concepts:
    - injury
    related:
    - ch01.skeleton.synovial-joint
    locator: Types of Injury
  - id: ch22.injury-types.i03
    q: 韌帶扭傷（sprain）的三級分類為何？
    a:
    - 第一度：韌帶部分撕裂，但關節不穩定性未增加
    - 第二度：部分撕裂，伴隨輕微關節不穩定
    - 第三度：完全撕裂，伴隨完全關節不穩定
    detail: '分級的判別重點包含撕裂程度與關節不穩定性，不能只以疼痛程度代替分級。'
    terms:
    - sprain
    numbers:
    - v: '1'
      unit: 度
      of: 關節不穩定性未增加的韌帶部分撕裂
    - v: '2'
      unit: 度
      of: 伴隨輕微關節不穩定的韌帶部分撕裂
    - v: '3'
      unit: 度
      of: 伴隨完全關節不穩定的韌帶完全撕裂
    concepts:
    - injury
    locator: Types of Injury
  - id: ch22.injury-types.i04
    q: 肌肉肌腱創傷如何區分挫傷（contusion）與拉傷（strain）？
    a:
    - 直接創傷造成的肌肉肌腱創傷稱為挫傷
    - 間接創傷造成的肌肉肌腱創傷稱為拉傷
    - 肌肉挫傷是受傷肌肉周圍組織中血液與液體過度累積的區域，可能嚴重限制受傷肌肉功能
    detail: '分類依直接或間接創傷的機制，而不是依當下功能限制的嚴重程度。'
    terms:
    - contusion
    - strain
    numbers: []
    concepts:
    - injury
    locator: Types of Injury
  - id: ch22.injury-types.i05
    q: 肌肉拉傷（muscle strain）的三級分類為何？
    a:
    - 第一度：個別纖維部分撕裂，肌肉活動強但疼痛
    - 第二度：部分撕裂，肌肉活動無力且疼痛
    - 第三度：纖維完全撕裂，肌肉活動非常無力且無痛
    detail: '「無痛」是本章對第三度拉傷肌肉活動的原文描述，不能因此推論傷勢較輕。'
    terms:
    - strain
    numbers:
    - v: '1'
      unit: 度
      of: 個別肌纖維部分撕裂且活動強但疼痛的肌肉拉傷
    - v: '2'
      unit: 度
      of: 部分撕裂且活動無力疼痛的肌肉拉傷
    - v: '3'
      unit: 度
      of: 肌纖維完全撕裂且活動非常無力無痛的肌肉拉傷
    concepts:
    - injury
    locator: Types of Injury
  - id: ch22.injury-types.i06
    q: 為何肌腱較少在腱實質內斷裂？
    a:
    - 當施加於肌腱的張力負荷超過極限，肌腱也可能斷裂
    - 肌腱膠原纖維通常顯著強於其連接的肌肉纖維，因此失敗較可能發生在肌腹、肌肉肌腱交界或肌腱附著骨處，而非腱實質
    detail: '這是教材對典型相對強度與常見失敗位置的說明，並非每一次肌腱受傷的絕對位置規則。'
    terms:
    - collagen
    numbers: []
    concepts:
    - injury
    related:
    - ch05.connective-tissue.i05
    locator: Types of Injury
  - id: ch22.injury-types.i07
    q: 微觀創傷（microtrauma）或過度使用傷害的成因與疲勞性骨折為何？
    a:
    - 微觀創傷源於連續訓練或恢復不足時，反覆異常應力作用於組織
    - 可能與訓練錯誤、訓練表面不佳、動作生物力學或技術問題、動作控制不足、柔軟度不足、骨骼排列或易感性有關
    - 疲勞性骨折（stress fracture）是最常見的骨過度使用傷害；雖也受體型、營養與代謝影響，常見於訓練量快速增加或硬表面上訓練量過大
    detail: '教材列出多項可能因素，並未把疲勞性骨折歸因於單一訓練錯誤。'
    terms:
    - microtrauma
    - stress-fracture
    numbers: []
    concepts:
    - injury
    related:
    - ch17.training-volume.i01
    - ch18.equipment-facility.i01
    locator: Types of Injury
  - id: ch22.injury-types.i08
    q: 肌腱炎（tendinitis）與肌腱病變（tendinopathy）有何差異？
    a:
    - 肌腱炎是肌腱的發炎；字尾 -itis 指發炎狀況
    - 若未矯正發炎原因，可能發展為慢性肌腱炎或肌腱病變
    - 肌腱病變是退化性狀況，特徵為發炎極少與新血管生成
    detail: '「慢性化」的前提是發炎原因未被矯正；教材沒有把兩個名詞寫成可任意互換。'
    terms:
    - tendinitis
    - tendinopathy
    numbers: []
    concepts:
    - injury
    related:
    - ch05.connective-tissue.i05
    locator: Types of Injury
- id: kinetic-chain
  title: 動力鏈 OKC / CKC
  desc: ''
  tag: Kinetic
  items:
  - id: ch22.kinetic-chain.i01
    q: 動力鏈（kinetic chain）是什麼？
    a:
    - 動力鏈是兩個或更多依序相連的關節共同參與以產生動作
    detail: '定義的重點在連續關節的集體參與，不是單一關節或單一肌肉的孤立作用。'
    terms:
    - kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.kinetic-chain.i02
    q: 閉鎖動力鏈運動（closed kinetic chain exercise）如何定義？
    a:
    - 末端關節遭遇相當阻力，使其自由活動受到禁止或限制
    - 也就是遠端關節節段保持固定
    detail: '下肢閉鎖動力鏈常以雙腳「固定」於地面為例；定義本身不是只有下肢才適用。'
    terms:
    - closed-kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.kinetic-chain.i03
    q: 為何下肢閉鎖動力鏈運動常被視為較具功能性？
    a:
    - 多數運動相關活動是在雙腳固定於地面時進行
    - 閉鎖動力鏈運動的優點包括增加關節穩定性與建立功能性動作模式
    - 運動中關節通常不會孤立使用，而會和鄰近關節及周圍肌肉協同工作
    detail: '「常被分類為較具功能性」不是宣稱閉鎖動力鏈在任何情況都比開放動力鏈更適當。'
    terms:
    - closed-kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    related:
    - ch15.lower-body.i01
    - ch02.joint-biomechanics.i05
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.kinetic-chain.i04
    q: 閉鎖動力鏈運動有哪些上下肢例子？
    a:
    - 深蹲時雙腳固定於地面，提供動作進行的基礎
    - 伏地挺身是上肢閉鎖動力鏈運動的例子
    detail: '閉鎖動力鏈雖常被視為下肢運動，也存在上肢版本。'
    terms:
    - closed-kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    related:
    - ch15.lower-body.i01
    - ch16.bodyweight-training.i01
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.kinetic-chain.i05
    q: 開放動力鏈運動（open kinetic chain exercise）如何定義？
    a:
    - 由依序排列的關節組成，但末端關節可自由活動
    - 可更集中於某一個關節或肌肉
    detail: '開放動力鏈的集中性是其用途，不表示它完全沒有多關節動作或功能轉移的限制。'
    terms:
    - open-kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.kinetic-chain.i06
    q: 腿伸展與深蹲如何說明開放、閉鎖動力鏈的差異？
    a:
    - 腿伸展時足部與小腿可自由移動，可集中在膝關節的股四頭肌，屬開放動力鏈例子
    - 深蹲同樣使用股四頭肌與膝關節，也仰賴髖與踝關節的肌肉活動，屬閉鎖動力鏈例子
    detail: '比較的重點是末端節段與相鄰關節的參與方式，並非兩個動作使用完全不同的肌肉。'
    terms:
    - open-kinetic-chain
    - closed-kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    related:
    - ch15.body-positioning.i05
    - ch15.lower-body.i01
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.kinetic-chain.i07
    q: 衝刺如何同時包含開放與閉鎖動力鏈動作？
    a:
    - 衝刺時，接觸地面的下肢是閉鎖動力鏈，空中的另一肢則是開放動力鏈
    - 兩種動作可同時存在
    detail: '因此大多數活動同時涉及開放與閉鎖動力鏈；在某些情況，開放動力鏈也可以是同樣合適的選擇。'
    terms:
    - sprinting
    - open-kinetic-chain
    - closed-kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    related:
    - ch19.sprint-technique.i04
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.kinetic-chain.i08
    q: 復健中如何選擇開放或閉鎖動力鏈運動？
    a:
    - 成熟重塑期可採用閉鎖與開放動力鏈運動
    - 選擇應依運動員的功能需求與個別傷勢限制，而不是把任一動力鏈類型視為一律優先
    detail: '教材將兩種動力鏈都列為此期可用選項，且明說有些情況開放動力鏈同樣合適。'
    terms:
    - open-kinetic-chain
    - closed-kinetic-chain
    numbers: []
    concepts:
    - injury
    - technique
    related:
    - ch17.exercise-selection.i05
    - ch22.sports-medicine-team.i07
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies > Rehabilitation and Reconditioning Goals and Strategies
- id: maturation-phase
  title: 重塑期 Maturation-Remodeling Phase
  desc: ''
  tag: Phase 3
  items:
  - id: ch22.maturation-phase.i01
    q: 成熟重塑期（maturation–remodeling phase）的時程與組織強度為何？
    a:
    - 修復期形成的較弱組織會在此期持續被強化
    - 組織重塑可在受傷後持續數月至數年
    - 即使膠原纖維與癒合組織的強度改善，仍不及其替代的原組織
    detail: '時程取決於受傷組織與個別條件；「進入重塑期」不代表組織已恢復原有強度。'
    terms:
    - maturation-remodeling
    - collagen
    numbers: []
    concepts:
    - injury
    related:
    - ch05.connective-tissue.i08
    locator: Tissue Healing > Maturation–Remodeling Phase
  - id: ch22.maturation-phase.i02
    q: 成熟重塑期的第一型膠原蛋白（Type I collagen）如何改變組織？
    a:
    - 膠原蛋白產生會轉為較強的第一型膠原蛋白，使新生組織有機會改善結構、強度與功能
    - 增加負荷時，疤痕組織的膠原纖維會肥大並沿受力線排列
    detail: '較粗且排列較佳的纖維會更強；這是漸進組織負荷的基礎，但不支持超過癒合狀態的過度負荷。'
    terms:
    - type-i-collagen
    - collagen
    numbers: []
    concepts:
    - injury
    related:
    - ch05.connective-tissue.i08
    locator: Tissue Healing > Maturation–Remodeling Phase
  - id: ch22.maturation-phase.i03
    q: 成熟重塑期的主要治療目標是什麼？
    a:
    - 最主要目標是最佳化組織功能，並轉銜至回歸比賽或活動
    - 應持續並進展修復期的運動，再加入較進階、運動專項的運動，讓受傷組織承受漸進應力
    detail: '運動員可能想「做得太多、太快」；雖然活動時疼痛較少，受傷組織仍未完全癒合。'
    terms:
    - maturation-remodeling
    numbers: []
    concepts:
    - injury
    related:
    - ch17.principles-exam-tips.i03
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Treatment Goal
  - id: ch22.maturation-phase.i04
    q: 回歸比賽或活動的決策應依據哪些標準？
    a:
    - 決策應同時理解正常組織癒合的時間範圍，並採用具預定目標的標準導向進程
    - 目標通常包括關節活動範圍、肌力、功能測試，以及運動員以既定結果表單回報的功能
    detail: '安全回歸也需要運動醫學團隊溝通、清楚分工與使用回歸指標；此處並非只以疼痛或日曆時間判定。'
    terms:
    - range-of-motion
    - patient-reported-outcome
    numbers: []
    concepts:
    - injury
    related:
    - ch12.why-test.i04
    - ch13.test-administration.i08
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Treatment Goal
  - id: ch22.maturation-phase.i05
    q: 為何成熟重塑期不能因疼痛較少就完全恢復活動？
    a:
    - 此期活動時可能較不痛，但受傷組織尚未完全癒合，仍需要進一步照護以達完整恢復
    - 過早做太多可能再次損傷受傷組織
    detail: '教材將漸進組織負荷連結到膠原纖維排列與肥大；因此保護與逐步增加負荷必須並行。'
    terms:
    - collagen
    numbers: []
    concepts:
    - injury
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Treatment Goal
  - id: ch22.maturation-phase.i06
    q: 成熟重塑期的功能性與運動特異性訓練原則為何？
    a:
    - 復健與體能調整運動必須具功能性，並反映活動需求
    - 可使用關節角度特異性強化、速度特異性肌肉活動、閉鎖動力鏈運動，以及進一步增進神經肌肉控制的運動
    - 強化應從一般運動轉為複製該運動常見動作的運動專項活動
    detail: '「功能性」在教材中以反映需求來界定，並非限定某一種器械、單關節或多關節動作。'
    terms:
    - closed-kinetic-chain
    - neuromuscular-control
    numbers: []
    concepts:
    - injury
    related:
    - ch17.exercise-selection.i05
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.maturation-phase.i07
    q: 速度特異性訓練如何隨重塑期進展？
    a:
    - 強化動作也應模擬運動速度需求；需較高速度的活動，例如衝刺，應納入較高速度的練習
    - 以腿後肌拉傷的短跑選手為例，可從柔軟度、離心肌力、向心肌力、動態拉伸，進展至快速等張強化
    detail: '教材的範例呈現可能的進展順序；實際選擇與進展仍須符合傷勢狀態與運動需求。'
    terms:
    - sprinting
    - eccentric-action
    - concentric-action
    - isotonic-exercise
    numbers: []
    concepts:
    - injury
    related:
    - ch19.sprint-technique.i02
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
  - id: ch22.maturation-phase.i08
    q: 成熟重塑期如何處理神經肌肉控制訓練？
    a:
    - 修復期引入的神經肌肉控制運動，應在成熟重塑期依需要持續並進展
    - 教材將增強式與速度訓練分別交由第 18 與第 19 章進一步說明
    detail: '本章沒有為增強式或速度訓練指定重塑期的固定起始時間或劑量。'
    terms:
    - neuromuscular-control
    - plyometric-exercise
    - sprinting
    numbers: []
    concepts:
    - injury
    related:
    - ch18.program-design.i05
    - ch19.program-design-monitoring.i06
    locator: Goals of Rehabilitation and Reconditioning > Maturation–Remodeling Phase > Exercise Strategies
- id: resistance-training-systems
  title: 阻力訓練系統 Resistance Training Systems
  desc: ''
  tag: Program
  items:
