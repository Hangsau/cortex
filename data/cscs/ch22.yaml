    - ch17.exercise-selection.i05
    locator: Program Design > Resistance Training
  - id: ch22.resistance-training-systems.i06
    q: SAID 原則如何用於復健阻力訓練？
    a:
    - 特定需求適應（SAID）原則指出，系統會適應所施加的需求
    - 因此訓練目標應決定阻力訓練設計
    - 髕股關節復健的馬拉松選手應著重股四頭肌耐力、做較多次數；同傷勢的奧運舉重選手在重塑後期則需較少次高強度運動來準備爆發力需求
    detail: '比較的是同一傷勢但運動需求不同的設計邏輯，不是給所有跑者或舉重選手的固定組數、次數與強度。'
    terms:
    - said
    numbers: []
    concepts:
    - injury
    - program-design
    related:
    - ch17.principles-exam-tips.i01
    - ch17.load-repetitions.i04
    locator: Program Design > Resistance Training
  - id: ch22.resistance-training-systems.i07
    q: 復健期訓練未受傷肢體有何意義？
    a:
    - 為了最佳癒合，初期應最小化對癒合組織的壓力，但可對未受傷區域施加相關訓練壓力
    - 訓練未受傷肢體可改善受傷肢體的肌力
    detail: '教材以急性右膝傷的足球員為例：可訓練上肢與未受傷左下肢，但左下肢動作仍可能需要調整以保護右下肢。'
    terms:
    - strength-and-conditioning-professional
    numbers: []
    concepts:
    - injury
    - program-design
    related:
    - ch05.neural-adaptations.i07
    - ch20.special-issues.i01
    locator: Program Design > Aerobic and Anaerobic Training
  - id: ch22.resistance-training-systems.i08
    q: 復健期的有氧與無氧訓練如何對應運動需求與傷勢？
    a:
    - 雖尚未確定復健用最佳有氧訓練計畫，通常應盡可能模擬運動專項與代謝需求
    - 馬拉松選手須立即處理有氧適能；摔角的有氧與無氧需求結合，較適合間歇訓練；奧運舉重選手著重維持無氧適能
    - 器材選擇取決於受傷部位；可選上肢測功機、深水跑、下肢單車與橢圓機等方式
    detail: '專項性很重要，但教材也指出可透過其他身體區域的運動增加運動能力，例如以上肢運動改善氧耗。'
    terms:
    - interval-training
    numbers: []
    concepts:
    - injury
    - program-design
    related:
    - ch20.program-design.i01
    - ch20.training-types.i03
