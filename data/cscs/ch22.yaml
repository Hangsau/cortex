  - id: ch22.resistance-training-systems.i05
    q: 為何既有阻力訓練系統仍須為個別運動員調整？
    a:
    - De Lorme、Oxford 與 Knight 系統已證實可增加肌力，也可用於設計復健阻力訓練
    - 但它們可能過於嚴格，無法讓不同運動項目的運動員充分個別化
    detail: '教材沒有否定這些系統的強化效果；限制在於固定協定未必符合每位運動員的運動需求。'
    terms:
    - de-lorme
    - oxford
    - dapre
    numbers: []
    concepts:
