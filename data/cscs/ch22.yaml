  - id: ch22.resistance-training-systems.i03
    q: Knight 的每日可調整漸進阻力運動（DAPRE）結構為何？
    a:
    - DAPRE 為四組系統，可比 De Lorme 或 Oxford 調整更多強度與訓練量
    - 第一組以估計 6RM 的 50% 做 10 下；第二組以 75% 做 6 下
    - 第三組以估計 6RM 的 100% 做最多次數，並依此決定第四組的阻力調整
    detail: '教材指出最後一組的反覆次數可從 10 下至可能僅 1 下；第四組不是預先固定的重量。'
    terms:
    - dapre
    - repetition-maximum
    numbers:
