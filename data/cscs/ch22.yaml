    q: Oxford 阻力訓練系統與 De Lorme 有何差異？
    a:
    - 同樣採三組、每組 10 下的金字塔設計
    - 它是 De Lorme 的反向設計：第一組用 10RM 的 100%，第二組 75%，第三組 50%，由重到輕
