  - id: ch22.sports-medicine-team.i05
    q: 其他成員
    a:
    - Exercise Physiologist、Nutritionist/RD、Sport Psychologist
    detail: ''
    terms: []
    numbers: []
    concepts:
    - injury
    - professional
    related: []
