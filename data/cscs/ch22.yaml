cards:
- q: 運動醫學團隊中，隊醫（team physician）的主要職責是什麼？
  a: MD/DO 背景，負責備賽前檢查、場邊急救、傷病診斷與轉介、藥物處方；最終決定運動員是否可復出競賽。
  tag: sports-medicine-team
- q: 運動防護員（athletic trainer, ATC）的主要職責為何？
  a: 日常身體健康管理、傷害評估、治療性運動、治療儀器使用；運動員與醫療團隊的溝通橋梁；在隊醫監督下工作。
  tag: sports-medicine-team
- q: 物理治療師（physical therapist）在運動醫學團隊中的角色為何？
  a: 減輕疼痛、恢復功能；發展特定治療策略或管理長期復健計畫；可獲 ABPTS 的 SCS（Sports Certified Specialist）認證。
  tag: sports-medicine-team
- q: S&C 專業人員（CSCS）在運動傷害復健中扮演什麼角色？
  a: 運用阻力、增強式、有氧訓練知識設計回歸競賽調整計畫；了解生物力學，建議進階復健動作；與運動防護員或物理治療師協作。
  tag: sports-medicine-team
- q: indication（適應症）與 contraindication（禁忌症）在復健中分別指什麼？
  a: Indication：受傷運動員必須執行的訓練形式（如肩傷時繼續進行下肢訓練）。Contraindication：因傷勢禁止執行的動作（如前肩關節脫臼後禁止臥推）。
  tag: communication
- q: 宏觀創傷（macrotrauma）的定義為何？
  a: 特定、突然的超載傷害，導致組織完整性受損；常見於骨骼（挫傷/骨折）、關節（脫臼/半脫臼）、韌帶（扭傷）、肌肉肌腱（挫傷/拉傷）。
  tag: injury-types
- q: 韌帶扭傷（sprain）的三級分類為何？
  a: 一度：部分撕裂，關節穩定性正常。二度：部分撕裂，輕微關節不穩定。三度：完全撕裂，全關節不穩定。
  tag: injury-types
- q: 肌肉拉傷（muscle strain）的三度分類為何？
  a: 一度：部分纖維撕裂，強力但疼痛的肌肉收縮。二度：部分撕裂，微弱且疼痛的收縮。三度：完全撕裂，非常微弱且無痛感的收縮。
  tag: injury-types
- q: 關節脫臼（dislocation）與半脫臼（subluxation）的區別為何？
  a: 脫臼：關節面完全移位。半脫臼：關節面部分移位。兩者均可導致關節鬆弛或不穩定。
  tag: injury-types
- q: 為什麼肌腱斷裂通常發生在肌肉腹或肌腱交界處，而非肌腱本身？
  a: 肌腱膠原纖維強度遠高於肌肉纖維，受力超過極限時，更可能在肌肉腹、肌腱交界處或肌腱附著骨骼處斷裂，而非在肌腱內部。
  tag: injury-types
- q: 微觀創傷（microtrauma）/ 過度使用傷害（overuse injury）的常見成因有哪些？
  a: 訓練錯誤（設計不良、過大量）、訓練地面不佳、生物力學或技術缺失、動作控制不足、柔軟度不足、骨骼排列異常。
  tag: injury-types
- q: 肌腱炎（tendinitis）與肌腱病變（tendinopathy）的區別為何？
  a: 肌腱炎：肌腱發炎（-itis 後綴代表發炎）。肌腱病變：退化性狀況，特徵是極少發炎但有新血管生成（neovascularization）；由慢性肌腱炎轉化而來。
  tag: injury-types
- q: 疲勞性骨折（stress fracture）的主要成因為何？
  a: 訓練量快速增加或在過硬表面上訓練量過大；體型、營養、代謝因素也有影響。屬最常見的骨骼過度使用傷害。
  tag: injury-types
- q: 組織癒合的三個階段為何？
  a: 1. 發炎反應期（Inflammatory response phase）。2. 纖維母細胞修復期（Fibroblastic repair phase）。3. 成熟重塑期（Maturation-remodeling phase）。
  tag: tissue-healing
- q: 發炎反應期的持續時間與主要事件是什麼？
  a: 通常持續 2–3 天，最多不超過 1 週。事件：血管擴張、毛細血管通透性增加、組織水舃（edema）、化學介質釋放（組織胺、緩激脓）、吞噬作用清除壞死組織。
  tag: tissue-healing
- q: 發炎期中，edema（組織水舃）是如何形成的，有何影響？
  a: 受傷 → 局部低氧環境 → 組織壞死 → 組織胺/緩激脓釋放 → 毛細血管通透性增加 → 液體滲出到周圍組織。水舃抓制收縮性組織，顯著限制功能。
  tag: tissue-healing
- q: 吞噬作用（phagocytosis）在組織癒合中的作用為何？
  a: 發炎期中，增加的血流和吞噬作用促使巨噻細胞（macrophages）釋放並清除細胞碎屑，防止碎屑延緩癒合過程。
  tag: tissue-healing
- q: 纖維母細胞修復期（fibroblastic repair phase）的時間範圍與特徵為何？
  a: 傷後 2 天開始，可持續至 2 個月。特徵：第三型膠原蛋白（Type III collagen）隨機沉積、新毛細血管形成、瘘痕組織形成；新組織強度低於原始組織。
  tag: tissue-healing
- q: 為什麼修復期新形成的膠原纖維強度低於正常組織？
  a: Type III 膠原蛋白是橫向排列（而非決復應力線縱向排列），傳力效率低；且尚未轉換為較強的 Type I 膠原蛋白，因此強度低於原始組織。
  tag: tissue-healing
- q: 成熟重塑期（maturation-remodeling phase）的主要特徵為何？
  a: 開始於修復期後，可持續數月至數年。Type III 膠原轉換為更強的 Type I 膠原；纖維沿應力線排列並肥大，組織強度提升，但仍不如原始組織強。
  tag: tissue-healing
- q: 發炎期中 Type I 與 Type III 膠原蛋白各幔演什麼角色？
  a: 修復期：Type III 膠原隨機沈積，機械強度低、決復方向欠佳。成熟重塑期：Type I 膠原取代 Type III，強度提升，沿應力線排列；但最終強度仍低於原始組織。
  tag: tissue-healing
- q: 發炎反應期的復健治療目標是什麼？
  a: 防止新生組織受損；相對休息 + 物理治療儀器（冰敦、壓縮、抬高、電刺激）；維持未受傷區域的心肺及神經肌肉骨骼功能。受傷部位不做主動運動。
  tag: rehab-goals
- q: 發炎期中，S&C 專業人員可安排哪些訓練？
  a: 未受傷肢體的有氧/無氧/阻力訓練；若受傷肢體可移動，可做受傷部位近端/遠端的孤立動作（前提：不對受傷部位施壓）。例：膝傷後的髓内外轉、肩傷後的肩胛穩定動作。
  tag: rehab-goals
- q: 纖維母細胞修復期的治療目標是什麼？
  a: 防止過度肌肉蒒縮和關節退化；平衡保護新膠原纖維（避免過載）與逐漸引入低負荷（促進膠原合成）之間的分徚；早期保護性動作可加速膠原纖維最佳排列。
  tag: rehab-goals
- q: 修復期中，太少活動對組織癒合有何負面影響？
  a: 新形成的膠原纖維無法最佳排列，且可能形成沿黨（adhesions），阻礙完整關節活動度；因此需要低負荷的早期保護性動作（early protected motion），而非完全休息。
  tag: tissue-healing
- q: 成熟重塑期的治療目標與復出標準為何？
  a: 最佳化組織功能並轉向回歸運動；復出標準：關節活動度、肌力測試（側邊差異 <10% 可接受）、功能性測試、患者自評量表；對比健側或常模值。
  tag: rehab-goals
- q: 修復期中等長運動（isometric exercise）有何限制？
  a: 等長訓練具關節角度特異性（只在訓練角度產生增益），若有適應症可在多個角度進行；應為次最大強度且無痛，以維持神經肌肉功能同時不破壞新生膠原纖維。
  tag: rehab-exercise
- q: 等速遍訓練（isokinetic exercise）在復健中的限制為何？
  a: 在固定速度下提供阻力（如 60°/s），但運動不在單一恒定速度進行；多數設備只允許單關節訓練，功能轉移有限。
  tag: rehab-exercise
- q: 復健中，離心（eccentric）與向心（concentric）肌肉收縮各有何優點？
  a: 離心：產力更大、能量消耗更少；可在組織癒合進展時加大負荷。兩者均可組合用於強化受傷組織，速度可作為設計變數。
  tag: rehab-exercise
- q: 神經肌肉控制（neuromuscular control）的定義與受損原因為何？
  a: 肌肉對傳入感覺訊息做出反應以維持關節穩定性的能力。受傷後本體感覺（proprioception）受損，影響姿勢、平衡、穩定性與位置感，需要特定訓練恢復。
  tag: neuromuscular
- q: 本體感覺（proprioception）的定義與來源為何？
  a: 對皮膚、肌肉、肌腱、韌帶、關節囊中感覺受器刺激的傳入感覺訊息；貢獻於有意識與無意識的姿勢、平衡、穩定性與位置感控制。
  tag: neuromuscular
- q: 用於改善神經肌肉控制的訓練方法有哪些？
  a: 不穩定表面（远小彈跳床、平衡板、穩定球）、閉眼動作（移除視覺輸入）、漸增速度；可操控表面穩定性、視覺、速度三個變數；深蹲、伏地挨伏於不穩定表面都可應用。
  tag: neuromuscular
- q: 閉鎖性動力鏈（closed kinetic chain, CKC）運動的定義與優點為何？
  a: 遠端關節（末端節段）固定不動的運動（如深蹲、伏地挨伏）。優點：增加關節穩定性、模擬功能性動作模式、多關節協同工作；常用於功能性復健。
  tag: kinetic-chain
- q: 開放性動力鏈（open kinetic chain, OKC）運動的定義與特點為何？
  a: 末端關節可自由移動的運動（如腿伸展機）；允許孤立针對特定關節或肌群集中訓練。術科中雙腿同時具有 CKC（著地腿）和 OKC（空中腿）两種尋動。
  tag: kinetic-chain
- q: De Lorme 阻力訓練計畫（復健用）的結構為何？
  a: 3 組 × 10 下，由輕到重遞增：第 1 組 = 10RM 的 50%；第 2 組 = 10RM 的 75%；第 3 組 = 10RM 的 100%（金字塔正向）。
  tag: resistance-training-rehab
- q: Oxford 阻力訓練計畫的結構為何，與 De Lorme 有何不同？
  a: 3 組 × 10 下，由重到輕遞減：第 1 組 = 10RM 的 100%；第 2 組 = 10RM 的 75%；第 3 組 = 10RM 的 50%（金字塔反向）。
  tag: resistance-training-rehab
- q: DAPRE（每日可調整漸進阻力訓練）的結構為何？
  a: 4 組計畫，以估計 6RM 為基準：第 1 組 = 6RM × 50% × 10 下；第 2 組 = 6RM × 75% × 6 下；第 3 組 = 6RM × 100% × 最大下數；第 4 組根據第 3 組下數調整重量。
  tag: resistance-training-rehab
- q: DAPRE 計畫中，第三組完成次數與第四組/下次訓練的重量調整關係為何？
  a: 0–2次：減 5–10 lb，重做第 3 組；3–4次：減 0–5 lb / 下次同重；5–7次：同重 / 下次 +5–10 lb；8–12次：+5–10 lb / 下次 +5–15 lb；13+次：+10–15 lb / 下次 +10–20 lb。
  tag: resistance-training-rehab
- q: 復健阻力訓練應如何應用 SAID 原則？
  a: 訓練目標（適應）應決定訓練設計（施加的要求）。例：馬拉松選手復健強調肌耒力（多組高次數）；舉重選手同張傷復健強調爆發力（少組高強度）。
  tag: resistance-training-rehab
- q: 復健中有氧/無氧訓練的目標是什麼，如何選擇訓練模式？
  a: 模擬項目代賭需求；選擇不對受傷部位施壓的訓練設備。常用選項：上肢測功機、深水跑步、下肢單車、橢圓機。即使在發炎期也可對未受傷部位維持心肺適能。
  tag: aerobic-anaerobic-rehab
- q: 訓練未受傷肢體對受傷肢體有何幫助（交叉訓練效果）？
  a: 研究顯示訓練未受傷肢體可改善受傷肢體的肌力（cross-education 效果）；因此受傷後繼續對未受傷側進行訓練具有重要意義。
  tag: aerobic-anaerobic-rehab
- q: 復健的五大基本原則為何？
  a: '1. 癒合組織不可過載。

    2. 運動員需達特定標準才能進展到下一期。

    3. 計畫須基於當前臨床與科學研究。

    4. 計畫須能個別化。

    5. 復健是以回歸競賽為目標的團隊協作過程。'
  tag: rehab-principles
- q: 回歸運動的標準（return-to-play criteria）通常包含哪些項目？
  a: 關節活動度、肌力測試（與側強力差異 <10% 可接受）、功能性測試、患者自評量表（patient-reported outcome forms）；由隊醫最終決定。
  tag: rehab-goals
- q: 受傷後「疼痛降低」是否等同於「組織已癒合」？
  a: 否。疼痛常在組織完全癒合前就消退（見組織癒合曲線圖）；過早回歸完全活動可能進一步損傷仍未癒合的組織，應以客觀標準而非主觀疼痛作為進展依據。
  tag: tissue-healing
- q: 成熟重塑期的功能性訓練原則是什麼？
  a: 訓練動作要模擬運動需求（特異性）：關節角度特異性強化、速度特異性肌肉活動、閉/開鎖動力鏈動作、神經肌肉控制訓練；從一般性動作逐步進階至項目特異性動作。
  tag: rehab-goals
- q: 既往傷病是未來受傷的最大風险因素之一。回歸運動後持續存在哪些缺陥？
  a: 回歸運動後個體可能持續表現出肌力、生物力學和功能表現的缺陥；側邊肌力差異 <10% 可接受；示能期間需持續監控和訓練修正。
  tag: injury-prevention
- q: 上肢傷害的主要風险因素有哪些？
  a: 盂肱關節活動度減少、肩胛骨運動障磙（scapular dyskinesis）、肩部肌力下降；常用 Throwers Ten 訓練計畫降低上肢傷害風险。
  tag: injury-prevention
- q: 下肢傷害（尤其是 ACL）的主要風险因素有哪些？
  a: 平衡感下降、跨落地時神經肌肉控制不良、下肢肌力不足；有针對跨落地技術和切入動作的結構性訓練計畫（如 Sportsmetrics、PEP）可降低風险。
  tag: injury-prevention
- q: Sportsmetrics 和 PEP 計畫的目的是什麼？
  a: 結構性下肢傷害風险降低計畫；透過针對傷害風险因素的動作與訓練，顯著降低下肢傷害率（尤其是 ACL 傷害與踝關節扭傷）。
  tag: injury-prevention
- q: 離心訓練對降低肌肉傷害風险的作用為何？
  a: 研究顯示離心訓練可顯著降低腿後肌拉傷風险（hamstring injury risk reduction）；應納入傷害預防計畫中。
  tag: injury-prevention
- q: S&C 專業人員如何透過溝通表格有效參與復健？
  a: 使用復健轉介表（rehabilitation referral form）了解適應症/禁忌症；使用 S&C 訓練摘要表（summary form）記錄訓練內容和運動員的主客觀反應，促進醫療團隊溝通。
  tag: communication
- q: 復健中，治療儀器（modalities）在各期的使用目的有何不同？
  a: 發炎期：冰敦、壓縮、抬高、電刺激 → 減少疼痛和組織損傷。修復期：超音波、電刺激、冰敦 → 促進膠原合成（目標不同於發炎期）。
  tag: rehab-exercise
