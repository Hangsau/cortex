  - id: ch08.motor-skill-acquisition.i08
    q: 回饋的種類、時機與頻率如何影響學習？
    a:
    - 內在回饋來自運動員自己的感官；擴增回饋來自教練等觀察者或影片、實驗室器材等科技
    - 擴增回饋可分結果知識（關於任務目標結果）與表現知識（關於動作型態）；動作結果本身為目標時，兩者可重疊
    - 同步回饋可增進當下表現但損害學習，適合競賽；任務後提供的延遲回饋可促進技能學習
    - 練習中較低頻率會損害表現，但比每次嘗試後都回饋更能增進技能習得；複雜技能為例外，初學時宜較頻繁，隨技能提升而遞減
    detail: 回饋的最佳安排取決於目標是競賽當下表現或長期學習；不能把競賽用的同步回饋直接當成促進學習的處方。
