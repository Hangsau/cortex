- id: motivation
  title: 動機 Motivation
  desc: ''
  tag: Motivation
  items:
  - id: ch08.motivation.i01
    q: 動機（motivation）與內在動機（intrinsic motivation）如何定義？
    a:
    - 動機是努力的強度與方向
    - Deci 將內在動機定義為想要勝任與自我決定；運動員因喜愛活動及參與本身的內在報酬而受驅動
    - 它來自運動員內部，即使沒有物質獎勵或懲罰仍會展現
    detail: 書中指出，適當的目標（特別是過程或表現目標）可提高知覺勝任感；讓運動員有部分決策空間可提高知覺自主性。
    terms:
    - motivation
    - intrinsic-motivation
    - competence
    - autonomy
    - process-goals
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Motivation > Intrinsic and Extrinsic Motivation
  - id: ch08.motivation.i02
    q: 外在動機（extrinsic motivation）有何特徵？
    a:
    - 它來自外部而非內部來源，建立在個人化的獎賞建構上
    - 運動中常見外在獎賞包括獎項、獎盃、教練或隊友的讚美、社會認可，以及對懲罰的恐懼
    detail: 運動員很少是完全內在或完全外在動機，而是依活動、勝任感知覺、活動重要性等變項落在此連續帶的不同位置。
    terms:
    - extrinsic-motivation
    - intrinsic-motivation
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Motivation > Intrinsic and Extrinsic Motivation
  - id: ch08.motivation.i03
    q: 成就動機（achievement motivation）及其兩種動機為何？
    a:
    - 成就動機是精通任務、追求卓越、克服障礙及投入競爭或社會比較的努力
    - McClelland 等人提出每個人都有相對立的追求成功動機（MAS）與避免失敗動機（MAF）
    - MAS 與成就自豪、挑戰及評估能力相關；MAF 與保護自我和自尊、避免失敗帶來的羞恥知覺相關
    detail: MAF 名稱雖作「避免失敗」，書中強調其核心不是避免失敗事件本身，而是避免失敗所伴隨的羞恥感。
    terms:
    - achievement-motivation
    - motive-to-achieve-success
    - motive-to-avoid-failure
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Motivation > Achievement Motivation
  - id: ch08.motivation.i04
    q: 追求成功動機（motive to achieve success, MAS）與避免失敗動機（motive to avoid failure, MAF）主導者傾向選擇何種挑戰？
    a:
    - MAS 主導者通常最受不確定或具挑戰、成功機率約五成的情境吸引，因為可評估自身能力
    - MAF 主導者較自在於極易成功或極難、不會被期待獲勝的情境，以減少感到羞恥的可能
    detail: 書中將 MAS 主導者偏好的成功機率表述為「約」五成，不是精確的普遍選擇法則；在較高運動參與層級，運動員不太可能完全由 MAF 主導。
    terms:
    - motive-to-achieve-success
    - motive-to-avoid-failure
    numbers:
    - v: 約50
      unit: '% 成功機率'
      of: MAS 主導者通常最感興趣的挑戰情境
    concepts:
    - psychology
    related: []
    locator: Motivation > Achievement Motivation
  - id: ch08.motivation.i05
    q: 正增強與負增強如何改變操作行為（operant）？
    a:
    - 正增強是在目標行為後給予正向行動、物件或事件（如讚美、頭盔貼紙、獎品），以增加其發生機率
    - 負增強同樣增加目標行為機率，但方法是移除通常令人厭惡的事物；例如全隊努力練習後免做衝刺
    detail: 「正／負」在此分別指添加／移除結果，不是好／壞評價；兩種增強都旨在增加行為。
    terms:
    - operant
    - positive-reinforcement
    - negative-reinforcement
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Motivation > Positive and Negative Reinforcement in Coaching
  - id: ch08.motivation.i06
    q: 正懲罰與負懲罰如何改變操作行為（operant）？
    a:
    - 懲罰旨在降低錯誤或缺乏努力等目標行為的發生機率
    - 正懲罰是在行為後呈現可能降低該行為的事物，例如責備失誤、失誤後做伏地挺身或衝刺
    - 負懲罰是移除有價值的事物，例如取消特權或上場時間
    detail: 書中主張一般應採增強策略以聚焦做對的事；可懲罰不當缺乏努力，但對已努力正確執行時的失誤施罰似乎無效。
    terms:
    - operant
    - positive-punishment
    - negative-punishment
    - positive-reinforcement
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Motivation > Positive and Negative Reinforcement in Coaching
  - id: ch08.motivation.i07
    q: 教練採用增強而非懲罰的注意力理由為何？
    a:
    - 增強把焦點放在運動員做對的事，並增加任務相關焦點
    - 懲罰增加運動員注意自己做錯之處的可能，並可能讓注意力容量被任務無關線索占滿
    - 增強有助反應時間與決策、成功的長期記憶、自尊、自我效能與自信
    detail: 教材以「可說是較佳」的語氣偏好正向取向，而非宣稱任何情況都絕對不可使用懲罰。
    terms:
    - positive-reinforcement
    - negative-reinforcement
    - positive-punishment
    - negative-punishment
    - self-efficacy
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Motivation > Positive and Negative Reinforcement in Coaching > How Should Positive and Negative Reinforcement Be Applied?
  - id: ch08.motivation.i08
    q: 自我控制練習（self-controlled practice）如何影響動機與學習？
    a:
    - 練習、指示與回饋除提供技能習得資訊，也能作為動機因素
    - 自我控制練習讓運動員參與練習結構決策，例如選擇何時接受回饋、練習何種技能，或說明自覺表現
    - 此做法促進更主動參與，提升勝任感與自主性；隨動機提高，表現與學習也會改善
    detail: 書中將自主性、勝任感與社會連結感列為練習安排應照顧的基本心理需求；效果仍應依運動員、任務與環境調整。
    terms:
    - self-controlled-practice
    - autonomy
    - competence
    - social-relatedness
    - feedback
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Motivation > Motivational Aspects of Skill Learning (Self-Controlled Practice)
- id: motor-skill-acquisition
  title: 動作技能學習 Motor Skill Acquisition
  desc: ''
  tag: Motor Learning
  items:
  - id: ch08.motor-skill-acquisition.i01
    q: 學習（learning）與表現（performance）為何必須區分？
    a:
    - 學習是使動作技能能力發生相對永久改變的過程
    - 表現是目前環境中實際執行技能
    - 喚醒、動機等許多因素會影響表現，因此單次練習表現未必反映個人的技能能力
    detail: 有些促進技能學習的技巧在練習當下反而可能使表現下降；不能把一次練習的執行結果直接當成是否學會的判準。
    terms:
    - learning
    - performance
    - arousal
    - motivation
    numbers: []
    concepts:
    - psychology
    - motor-control
    related: []
    locator: Enhancing Motor Skill Acquisition and Learning > Learning–Performance Distinction
  - id: ch08.motor-skill-acquisition.i02
    q: 何時宜用整體練習（whole practice）或部分練習（part practice）？
    a:
    - 整體練習處理完整技能；部分練習則把技能拆成子成分
    - 有挑戰但子成分相互關聯低的任務，通常較適合部分練習
    - 子成分高度相互關聯的任務較適合整體練習，因為分開練習可能妨礙重新組合；整體學習有危險或代價太高時則宜用部分練習
    detail: 書中以抓舉可拆解、弓箭步兩腿動作高度連結為例；選擇取決於子成分關聯性及完整學習的風險或成本。
    terms:
    - whole-practice
    - part-practice
    numbers: []
    concepts:
    - psychology
    - motor-control
    related: []
    locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Whole Versus Part Practice
  - id: ch08.motor-skill-acquisition.i03
    q: 部分練習可如何拆解與重新整合技能？
    a:
    - 分段法（segmentation）依清楚間斷點拆成連續子成分；分化法（fractionalization）拆開同時發生的子成分；簡化法（simplification）藉改變速度或器材降低難度
    - 純部分訓練先反覆各自練習所有子成分再合練；漸進部分訓練先分練前幾部分、再逐步合併；重複部分訓練從第一部分起逐一加入後續部分
    - 簡化法可逐步加回任務特性以提高難度
    detail: 重新整合的順序沒有單一最佳方式；書中明定應依任務及當次訓練目標選擇。
    terms:
    - segmentation
    - fractionalization
    - simplification
    - pure-part-training
    - progressive-part-training
    - repetitive-part-training
    numbers: []
    concepts:
    - psychology
    - motor-control
    related: []
    locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Whole Versus Part Practice
  - id: ch08.motor-skill-acquisition.i04
    q: 隨機練習（random practice）的效果為何？
    a:
    - 區塊式練習會連續練同一技能再換另一技能；隨機練習則在同一次練習中隨機交替多項技能
    - 隨機練習時，各單一技能的當下表現起初會下降，但此安排可促進學習
    - 在運動情境中，少量重複後再轉換技能的區塊式與隨機練習結合，可兼收兩種安排的益處
    detail: 「練習中表現下降」是教材明列的短期代價，因此不可把隨機練習初期的成績下滑誤判為未學會。
    terms:
    - random-practice
    - blocked-practice
    - learning
    - performance
    numbers: []
    concepts:
    - psychology
    - motor-control
    related: []
    locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Random Practice
  - id: ch08.motor-skill-acquisition.i05
    q: 變化練習（variable practice）的效果為何？
    a:
    - 它在單次練習中改變同一技能的不同變化，而非重複固定的一種技能
    - 如同隨機練習，它可能損害練習當下表現，卻能提升面對未曾練過的新技能變化時的表現
    - 結合特定與變化練習，可同時發展運動專項技能與在陌生脈絡表現的彈性
    detail: 書中以不同高度的箱子為例，重點是能調整已練技能以回應未熟悉的情境與對手，而不是宣稱變化愈多愈好。
    terms:
