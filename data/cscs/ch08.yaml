title: Ch.8 運動心理學：準備與表現
topics:
- id: arousal-anxiety-stress
  title: 喚醒·焦慮·壓力 Arousal, Anxiety & Stress
  desc: ''
  tag: Energy
  items:
  - id: ch08.arousal-anxiety-stress.i01
    q: 喚醒（arousal）如何定義與測量？
    a:
    - 喚醒是個人生理與心理活化的混合，也是某一時刻動機的強度
    - 它持續存在於一條連續帶上，從深睡或昏迷到高度興奮
    - 可由心率、血壓、腦電圖（EEG）、肌電圖（EMG）、兒茶酚胺濃度或自陳量表作為指標
    detail: 喚醒本身不帶愉快或不愉快的價值；有效表現所需的最佳喚醒程度仍取決於後述的個人與任務因素。
    terms:
    - arousal
    - heart-rate
    - electroencephalography
    - electromyography
    - catecholamine
    - activation-deactivation-checklist
    numbers: []
    concepts:
    - psychology
    related: []
    locator: "Energy Management: Arousal, Anxiety, and Stress > Arousal"
  - id: ch08.arousal-anxiety-stress.i02
    q: 焦慮（anxiety）的性質與兩個成分為何？
    a:
    - 焦慮是帶有緊張、擔憂、憂懼或恐懼的負面知覺情緒狀態，並伴隨身體生理活化
    - 認知焦慮（cognitive anxiety）是對情境的負面知覺與擔憂
    - 身體焦慮（somatic anxiety）是身體反應，例如肌肉緊張、心搏過速與胃部不適
    detail: 焦慮是喚醒的子類，但必須有對情境的負面知覺才成立；單純活化不等於焦慮。
    terms:
    - anxiety
    - cognitive-anxiety
    - somatic-anxiety
    numbers: []
    concepts:
    - psychology
    related: []
    locator: "Energy Management: Arousal, Anxiety, and Stress > Anxiety"
  - id: ch08.arousal-anxiety-stress.i03
    q: 狀態焦慮（state anxiety）如何影響表現？
    a:
    - 狀態焦慮是主觀的憂懼與不確定感，伴隨自主與隨意神經輸出及內分泌活動升高
    - 它通常是負面經驗，但對運動表現可能有正面、負面或無影響
    - 影響方向取決於運動員技能程度、人格與所執行任務的複雜性等因素
    detail: 書中沒有把狀態焦慮直接等同於表現變差；這是受個人與任務調節的關係。
    terms:
    - state-anxiety
    numbers: []
    concepts:
    - psychology
    related: []
    locator: "Energy Management: Arousal, Anxiety, and Stress > Anxiety"
  - id: ch08.arousal-anxiety-stress.i04
    q: 特質焦慮（trait anxiety）與狀態焦慮有何關係？
    a:
    - 特質焦慮是個人將環境知覺為威脅的穩定傾向
    - 它會使運動員較可能經驗狀態焦慮，因而像是狀態焦慮的觸發準備因素
    - 高特質焦慮者容易讓失敗、災難或自我導向的想法塞滿注意力容量
    detail: 在需要複雜決策時，這些與任務無關的認知會妨礙選擇性注意；低特質焦慮者因較不易災難化，可承受較高壓力。
    terms:
    - trait-anxiety
    - state-anxiety
    - selective-attention
    numbers: []
    concepts:
    - psychology
    related:
    - ch08.attention-concentration.i01
    locator: "Energy Management: Arousal, Anxiety, and Stress > Anxiety"
  - id: ch08.arousal-anxiety-stress.i05
    q: 焦慮狀態下的喚醒與哪些不確定性因素有關？
    a:
    - 非焦慮狀態時，運動員可依需要提高或降低喚醒；焦慮時的喚醒則相對失控，通常過高
    - 無效的狀態焦慮常見骨骼肌緊張、心跳加速與負面想法侵入
    - 其不確定性通常包含高度自我涉入、能力與成功要求的落差，以及害怕失去他人認可等失敗後果
    detail: 這裡的問題不只是活化量高，而是身心效率都被不確定感干擾。
    terms:
    - arousal
    - state-anxiety
    numbers: []
    concepts:
    - psychology
    related:
    - ch08.arousal-anxiety-stress.i03
    locator: "Energy Management: Arousal, Anxiety, and Stress > Anxiety"
  - id: ch08.arousal-anxiety-stress.i06
    q: 壓力（stress）與壓力源（stressor）如何定義？
    a:
    - 壓力是需求（身體、心理或兩者）與因應能力間的重大失衡，且未滿足需求會有重要後果
    - 壓力源是引發壓力反應的環境或認知事件
    detail: 書中把壓力描述為可能是負向或正向狀態；是否產生焦慮取決於對壓力源的知覺。
    terms:
    - stress
    - stressor
    numbers: []
    concepts:
    - psychology
    related: []
    locator: "Energy Management: Arousal, Anxiety, and Stress > Stress"
  - id: ch08.arousal-anxiety-stress.i07
    q: 負向壓力（distress）會產生什麼反應？
    a:
    - 負向壓力是將壓力源知覺為負面時的壓力狀態
    - 它會產生喚醒，也會產生焦慮
    - 因此包含認知焦慮與身體焦慮
    detail: 壓力與焦慮不是同義詞：焦慮只在壓力源被負面知覺時才加入壓力反應。
    terms:
    - distress
    - cognitive-anxiety
    - somatic-anxiety
    numbers: []
    concepts:
    - psychology
    related:
    - ch08.arousal-anxiety-stress.i06
    locator: "Energy Management: Arousal, Anxiety, and Stress > Stress"
  - id: ch08.arousal-anxiety-stress.i08
    q: 正向壓力（eustress）會產生什麼反應？
    a:
    - 正向壓力是將壓力源知覺為正面時的壓力狀態
    - 它會產生正向心理能量與生理喚醒
    - 書中將其與焦慮區分，未列入認知或身體焦慮
    detail: 同樣的壓力事件可因知覺不同而成為正向壓力或負向壓力，這也是後續逆轉理論所強調的解釋面向。
    terms:
    - eustress
    - arousal
    numbers: []
    concepts:
    - psychology
    related:
