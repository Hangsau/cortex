  - id: ch08.ideal-performance-state.i02
    q: 理想表現狀態中「不思考或分析表現」指什麼？
    a:
    - 運動員不思考或分析自己的表現
    - 此特徵與動作自動化有關
    detail: 這裡不是否定學習階段所需的有意識思考；它描述的是理想表現狀態中已自動化技能的經驗。
