    locator: "Energy Management: Arousal, Anxiety, and Stress > Stress"
- id: arousal-theories
  title: 喚醒理論 Arousal Theories
  desc: ''
  tag: Theories
  items:
  - id: ch08.arousal-theories.i01
    q: 驅力理論（drive theory）主張什麼？其限制為何？
    a:
    - Hull 主張個人的喚醒或狀態焦慮提高時，表現也隨之提高
    - 從較低喚醒升至較高一些時，這種線性關係可能成立
    - 但喚醒不是越高越好；依技能與經驗、活動複雜性而定，較高喚醒也可能有害
    detail: 本章以此作為最簡單的起點，並明確否定它可無限外推到所有喚醒程度與所有運動員。
    terms:
    - drive-theory
    - arousal
    - state-anxiety
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Drive Theory
  - id: ch08.arousal-theories.i02
    q: 技能程度如何改變適當的喚醒程度？
    a:
    - 技能愈成熟，運動員在低於或高於最佳喚醒時仍能表現的容許範圍愈大
    - 剛學習技能者必須有意識地分析動作，擔憂想法會與已被動作細節占用的注意力容量競爭
    - 技能較低者的最佳喚醒點較低
    detail: 「較有技能」在書中是擴大可容許的喚醒範圍，不是宣稱高喚醒對所有熟練者都必然最好。
    terms:
    - arousal
    - attention
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Skill Level
  - id: ch08.arousal-theories.i03
    q: 任務複雜度如何改變適當的喚醒程度？
    a:
    - 關鍵的複雜度是有意識決策的負荷，不只是動作控制或功能解剖本身複雜
    - 簡單或已熟練的技能需要監控的任務相關線索較少，較高喚醒較不易干擾，生理喚醒甚至可能有益
    - 需要有意識決策的技能必須維持相對較低喚醒，以保留較寬的注意力焦點辨識相關線索
    detail: 例如跑步雖然在動作控制上複雜，卻通常不需有意識處理；書中不把所有生物力學複雜的動作一概歸為低喚醒需求。
    terms:
    - arousal
    - attention
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Task Complexity
  - id: ch08.arousal-theories.i04
    q: 倒 U 理論（inverted-U theory）的主張與書中保留為何？
    a:
    - Yerkes 與 Dodson 主張喚醒提高至最佳程度前有利表現，超過後繼續提高則與表現降低相關
    - 此概念可協助教練與運動員理解為何「太平」與「失控」都可能表現不佳
    - 書中指出，曲線的通用形狀已受到批評，因為技能、能力、經驗與任務複雜性各有個別影響
    detail: 教材不是把「中等喚醒最佳」當成普遍定律，而是將其當作需要受個體與任務因素修正的假說。
    terms:
    - inverted-u-theory
    - arousal
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Inverted-U Theory
  - id: ch08.arousal-theories.i05
    q: 個人最佳功能區理論（individual zones of optimal functioning, IZOF）如何修正倒 U 概念？
    a:
    - Hanin 認為不同的人在不同表現類型中，最佳表現所需的喚醒程度可很不一樣
    - 最佳表現不一定位於喚醒連續帶的中點
    - 最佳表現可落在一小段喚醒帶寬，而非一個單一固定點
    detail: 此理論也容許同一情緒被不同運動員正向或負向知覺；實務上可回顧不同品質表現的喚醒與情緒，於賽前加以監測調整。
    terms:
    - individual-zones-of-optimal-functioning
    - arousal
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Individual Zones of Optimal Functioning Theory
  - id: ch08.arousal-theories.i06
    q: 災難理論（catastrophe theory）如何描述喚醒、焦慮與表現？
    a:
    - 此模型中，身體喚醒與運動表現呈曲線型的倒 U 關係，認知焦慮則與表現穩定負相關
    - 生理喚醒在認知焦慮存在時升高，可能造成表現突然下跌，而非逐漸下降
    - 恢復一些平靜不一定能讓表現回到下跌前的水準
    detail: 它反對早期倒 U 模型所假設的漸進、等比例衰退，並要求更清楚區分認知焦慮、生理喚醒與身體焦慮。
    terms:
    - catastrophe-theory
    - cognitive-anxiety
    - somatic-anxiety
    - arousal
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Catastrophe Theory
  - id: ch08.arousal-theories.i07
    q: 逆轉理論（reversal theory）如何解釋相同喚醒的不同效果？
    a:
    - Kerr 認為喚醒與焦慮對表現的影響，取決於個人如何詮釋該喚醒
    - 同樣的高喚醒，一名運動員可視為興奮與準備就緒，另一人可視為不愉快與缺乏信心
    - 運動員可將高喚醒從害怕、擔憂的知覺，轉為興奮與期待的知覺
    detail: 這個理論的重點不只是喚醒的量，也包括個人的詮釋；書中將這種詮釋逆轉視為個人可掌控的部分。
    terms:
    - reversal-theory
    - arousal
    - anxiety
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Reversal Theory
  - id: ch08.arousal-theories.i08
    q: 教練如何為新手調整高壓情境下的喚醒需求？
    a:
    - 降低喚醒與決策責任，並安排簡單的任務，以避免注意力超載
    - 對重要比賽中的初學者，指示應簡單、清楚、直接
    - 成功經驗帶來的自信可減少負面自我對話與不確定感
    detail: 本章沒有提出「內向者最佳喚醒低於外向者」的說法；本條改以正文實際給出的新手教練策略為準。
    terms:
    - arousal
    - self-talk
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Influence of Arousal and Anxiety on Performance > Drive Theory > Skill Level
- id: attention-concentration
  title: 注意力與專注 Attention & Concentration
  desc: ''
  tag: Attention
  items:
  - id: ch08.attention-concentration.i01
    q: 注意力（attention）與選擇性注意（selective attention）是什麼？
    a:
    - 注意力是處理進入意識的環境與內在線索
    - 選擇性注意是抑制部分刺激的意識，以有限的注意力空間處理其他線索
    - 它抑制旁觀者、雜念等任務無關線索，讓運動員處理任務相關線索；運動員常稱此能力為專注程度
    detail: 因工作記憶容量有限，主動想著一組任務相關想法，本身就會排除其他擔憂想法。
    terms:
    - attention
    - selective-attention
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus
  - id: ch08.attention-concentration.i02
    q: 廣外部注意（broad external）的用途為何？
    a:
    - 運動員透過觀察環境及其中多個元素來評估情境
    - 這是 Nideffer 注意力風格的其中一個焦點象限
    detail: 此分類描述注意力的寬度與方向，而非為每名運動員規定固定的注意力順序。
    terms:
    - attentional-styles
    - broad-external
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus > Attentional Styles
  - id: ch08.attention-concentration.i03
    q: 廣內部注意（broad internal）的用途為何？
    a:
    - 運動員在內心處理資訊並形成策略
    - 這是 Nideffer 注意力風格的其中一個焦點象限
    detail: 它是廣而內在的整合取向，與只鎖定單一線索的窄注意不同。
    terms:
    - attentional-styles
    - broad-internal
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus > Attentional Styles
  - id: ch08.attention-concentration.i04
    q: 窄內部注意（narrow internal）的用途為何？
    a:
    - 運動員在心中預演即將進行的動作
    - 這是 Nideffer 注意力風格的其中一個焦點象限
    detail: 此焦點是內在且高度選擇性的；它不同於用廣內部注意整合多項資訊來發展策略。
    terms:
    - attentional-styles
    - narrow-internal
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus > Attentional Styles
  - id: ch08.attention-concentration.i05
    q: 窄外部注意（narrow external）的用途為何？
    a:
    - 運動員專門聚焦一或兩個外在線索以產生動作
    - 這是 Nideffer 注意力風格的其中一個焦點象限
    detail: 對易被外部刺激淹沒的運動員，教練可用一個重要線索（如對手步法）協助把焦點縮窄。
    terms:
    - attentional-styles
    - narrow-external
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus > Attentional Styles
  - id: ch08.attention-concentration.i06
    q: 認知階段（cognitive stage）的注意力特徵為何？
    a:
    - Fitts 與 Posner 的此階段以費力且有意識地調節動作為特徵
    - 運動員必須思考任務的動作細節
    detail: 此階段說明為何初學者較容易因焦慮或新情境而超載：可用的注意力已被動作細節占用。
    terms:
    - cognitive-stage
    - attention
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus
  - id: ch08.attention-concentration.i07
    q: 聯結階段（associative stage）的注意力特徵為何？
    a:
    - 運動員仍須把注意力放在任務上
    - 但相較認知階段，較不會被動作細節占住
    detail: 此階段位於有意識調節與自動化之間；書中沒有將它說成完全不需要專注。
    terms:
    - associative-stage
    - attention
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus
  - id: ch08.attention-concentration.i08
    q: 自動化（automaticity）階段的注意力特徵為何？
    a:
    - 心智放鬆，技能不必思考即可自動執行
    - 在正確指導與教練下，心智只聚焦當下任務相關線索，並自動濾除不相關線索
    detail: 獲得自動化動作及隨之而來的清晰思考，是許多運動員的目標；它不是在動作中完全停止處理所有線索。
    terms:
    - automaticity
    - attention
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Attention and Focus
- id: goal-setting
  title: 目標設定 Goal Setting
  desc: ''
  tag: Goal Setting
  items:
  - id: ch08.goal-setting.i01
    q: 過程目標（process goals）有何特徵？
    a:
    - 達成與否在運動員控制之內，聚焦於良好執行技能時必須採取的行動
    - 技能領域的例子包括姿勢與技術；個人設定的游泳或田徑時間也可算過程目標
    - 付出努力時，成功有相對高的機率；其成功與努力高度相關
    detail: 書中以減重為例，應聚焦每天的有氧活動與飲食調整等策略，而非只盯著體重結果，以增加對行動的控制感。
    terms:
    - process-goals
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting > Process Goals
  - id: ch08.goal-setting.i02
    q: 結果目標（outcome goals）有何特徵與限制？
    a:
    - 聚焦競賽結果，例如勝利、獎牌、得分或排名，通常不在運動員完全控制之內
    - 達成不只取決於個人努力，也取決於他人的努力與能力
    - 只強調勝利可能占滿固定的注意力容量，漏掉任務相關線索，拖慢反應並破壞協調與自動化
    detail: 教材認為勝利可帶來高動機，但同時採取過程與結果取向，比只追求勝利更可能達成結果；極有信心且明顯實力占優時是例外。
    terms:
    - outcome-goals
    - attention
    - automaticity
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting > Outcome Goals
  - id: ch08.goal-setting.i03
    q: 短期目標（short-term goals）有何作用？
    a:
    - 直接連結當前訓練或競賽，且可在相對短時間達成
    - 雖有挑戰，仍相對接近運動員目前能力，因此提高成功的可能性
    - 成功機率能提高自信、自我效能與動機，並減少長期艱苦訓練可能帶來的無聊與挫折
    detail: 書中把短期目標視為通往長期目標的一串可達成標準，而不是獨立於整體方向的零散待辦。
    terms:
    - short-term-goals
    - self-efficacy
    - motivation
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting > Short-Term Goals
  - id: ch08.goal-setting.i04
    q: 長期目標（long-term goals）如何與短期目標連結？
    a:
    - 長期目標統整一系列彼此連結的短期目標
    - 短期目標的達成應導向相關長期目標的完成
    - 看見每日練習如何通往最終表現，可讓運動員感到日常練習更有意義
    detail: 與短期目標相比，長期目標提供的是方向與意義；書中以此解釋為何運動員會對看似平凡的重量訓練更投入。
    terms:
    - long-term-goals
    - short-term-goals
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  - id: ch08.goal-setting.i05
    q: 系統性目標設定（goal setting）為何能影響表現？
    a:
    - 目標藉由排序努力優先次序，引導運動員的注意力
    - 目標因成功取決於目標達成而提高努力
    - 目標藉由給運動員的回饋增加正向強化
    detail: 書中把經周詳擬定、具有挑戰但可達成的目標所提供的資訊，視為促成行為改變的重要成分；正文列出的是三項理由，不是四項。
    terms:
    - goal-setting
    - attention
    - feedback
    - positive-reinforcement
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting
  - id: ch08.goal-setting.i06
    q: 為何目標必須具體且可量化？
    a:
    - 成功與失敗的回饋，在具體、可量化的目標下比模糊表現標準更有效
    - 書中例子是連續跑步 25 分鐘，心率維持在每分鐘 160 至 170 次，而非籠統地「去跑步」
    detail: 回饋在此是校正機制：成功與失敗都可讓運動員朝長期成功保持在軌道上，並非只有成功才有資訊價值。
    terms:
    - feedback
    - heart-rate
    numbers:
    - v: 25
      unit: 分鐘
      of: 書中具體目標的連續跑步時長
    - v: 160-170
      unit: beats/min
      of: 同一目標設定的心率範圍
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  - id: ch08.goal-setting.i07
    q: 長、短期目標的使用準則為何？
    a:
    - 長期目標與短期目標相互依存
    - 長期目標提供追求短期目標的意義與方向
    - 短期目標的達成建立階層式的精熟感與成功感，進而建立自信
    detail: 指引還要求運動員用過程目標聚焦自己可控制的表現元素，避免把全部注意力交給不可控的競賽結果。
    terms:
    - long-term-goals
    - short-term-goals
    - process-goals
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
  - id: ch08.goal-setting.i08
    q: 為何運動表現的目標設定需要整合運動科學？
    a:
    - 有效目標須與運動員的身體需求相關，其設計需要生物物理與行為領域的運動科學知識
    - 例如為四百公尺跑者縮短時間所設定的一系列目標，必須了解其身體概況、代謝途徑與待發展的生物力學技術
    - 最完整的方案可納入生理、代謝、生物力學、營養與心理等子領域
    detail: 純心理目標（如整堂練習維持正向情緒）也可能很有用，但書中強調完整方案可跨越多個運動科學子領域。
    terms:
    - goal-setting
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Goal Setting > Long-Term Goals
