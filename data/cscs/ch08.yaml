cards:
- q: 喚醒（Arousal）是什麼？它是正向還是負向的概念？
  a: 生理＋心理激活程度；中性概念，與好壞無關；可用 HR、EEG、EMG 測量
  tag: Energy
- q: 狀態焦慮（State Anxiety）與特質焦慮（Trait Anxiety）有何區別？
  a: 狀態焦慮：當下短暫、受情境影響；特質焦慮：穩定人格傾向，高者易將情境視為威脅
  tag: Anxiety
- q: 認知焦慮和身體焦慮各指什麼？
  a: 認知焦慮：擔憂、負面思考（心理層面）；身體焦慮：肌肉緊張、心跳加速（生理層面）
  tag: Anxiety
- q: Distress 和 Eustress 的差別是什麼？
  a: Distress：負面感知壓力源 → 產生焦慮；Eustress：正面感知壓力源 → 正向心理能量＋生理喚醒
  tag: Energy
- q: 壓力（Stress）的定義是什麼？
  a: 需求與應對能力間的重大失衡；失敗有重要後果
  tag: Anxiety
- q: 高特質焦慮者的行為傾向是什麼？
  a: 易將情境視為威脅，影響適合喚醒區間，通常需要較低的喚醒水平
  tag: Anxiety
- q: 哪三種生理指標可以測量喚醒程度？
  a: HR（心率）、EEG（腦電波）、EMG（肌電圖）
  tag: Energy
- q: 驅力理論（Drive Theory）的主要主張及其局限是什麼？
  a: Hull：喚醒↑ → 表現↑（線性）；適用於簡單/熟練技能；忽略過度激活現象
  tag: Theories
- q: 倒 U 理論（Inverted-U）的核心主張是什麼？
  a: Yerkes & Dodson：適度喚醒時表現最佳；過高或過低均降低表現
  tag: Theories
- q: IZOF（個人最佳功能區）的概念是什麼？
  a: Hanin：最佳表現不一定在中間點；每人有一個最適喚醒帶寬，個人差異顯著
  tag: Theories
- q: 災難理論（Catastrophe Theory）與倒 U 理論有何不同？
  a: Hardy：認知焦慮高時，生理喚醒超過臨界點 → 表現急劇崩潰（非漸進）；難以恢復
  tag: Theories
- q: 逆轉理論（Reversal Theory）的核心主張是什麼？
  a: Kerr：對喚醒的詮釋決定效果；高喚醒可解讀為興奮或恐懼；詮釋在個人掌控之中
  tag: Theories
- q: 技能水平如何影響最佳喚醒區間？
  a: 技術越高，最佳喚醒區間越寬；新手需較低喚醒；複雜任務需較低喚醒
  tag: Theories
- q: 人格（內/外向）如何影響最佳喚醒水平？
  a: 內向者最佳喚醒低於外向者；特質焦慮高者更容易進入負面喚醒狀態
  tag: Theories
- q: 廣外部（Broad External）注意力的功能和例子是什麼？
  a: 評估環境全局；例：四分衛閱讀防守陣形
  tag: Attention
- q: 廣內部（Broad Internal）注意力的功能和例子是什麼？
  a: 分析策略；例：比賽前制定戰術計畫
  tag: Attention
- q: 窄內部（Narrow Internal）注意力的功能和例子是什麼？
  a: 心理預演；例：舉重前在腦中演練動作
  tag: Attention
- q: 窄外部（Narrow External）注意力的功能和例子是什麼？
  a: 聚焦單一外部線索；例：踢球時只看目標點
  tag: Attention
- q: Fitts & Posner 的三個學習階段依序是什麼？
  a: 認知階段（刻意思考細節）→ 聯結階段（負擔減少）→ 自動化階段（動作自動執行）
  tag: Attention
- q: 選擇性注意（Selective Attention）的定義是什麼？
  a: 抑制不相關刺激，聚焦任務相關線索；即「專注力」
  tag: Attention
- q: 過程目標和結果目標的主要差別是什麼？
  a: 過程目標：選手可控、聚焦技術執行；結果目標：聚焦勝負排名，受他人能力影響
  tag: Goal Setting
- q: 短期目標的心理作用是什麼？
  a: 建立信心與動力；接近現有能力水準；對抗長訓練期的無聊感
  tag: Goal Setting
- q: 長期目標的功能是什麼？
  a: 統領所有短期目標的大方向；賦予每日訓練意義；增加練習投入度
  tag: Goal Setting
- q: 目標設定的四大功能是什麼？
  a: 引導注意力、提高努力程度、增加回饋正強化、促進行為改變
  tag: Goal Setting
- q: 量化目標為何比模糊目標更有效？
  a: 具體性使進度可測量，提供更明確回饋；例：「以 165 bpm 跑 25 分鐘」優於「去跑步」
  tag: Goal Setting
- q: 短期和長期目標如何相互連結？
  a: 短期目標累積成功 → 建立精熟感 → 支持長期目標達成；互依互利
  tag: Goal Setting
- q: 最完整的目標設定應涵蓋哪些面向？
  a: 生理、生物力學、營養、心理等多面向的整合
  tag: Goal Setting
- q: 理想表現狀態（IPS）共有哪些特徵？（說出 4 個以上）
  a: 無恐懼、窄化注意力、自動化、自我控制感、時間扭曲、輕鬆感、無負面自我對話
  tag: IPS
- q: IPS 中的「自動化」指什麼？
  a: 動作不需刻意思考，流暢執行；心智放鬆
  tag: IPS
- q: IPS 中的「時間扭曲」指什麼？
  a: Distortion of time/space：時間感覺變慢
  tag: IPS
- q: 建立 IPS 的前提條件是什麼？
  a: 建立在紮實體能訓練與成功表現歷史上
  tag: IPS
- q: IPS 中「無恐懼感」（Absence of fear）指什麼？
  a: 不害怕失敗，不分析表現，專注在表現本身
  tag: IPS
- q: IPS 中「輕鬆感」（Effortlessness）指什麼？
  a: 感覺不費力、自然發生，動作自然流出
  tag: IPS
- q: 內在動機和外在動機的來源分別是什麼？
  a: 內在：運動本身樂趣與自我決定；外在：獎盃、獎賞、社會認同、懲罰恐懼
  tag: Motivation
- q: MAS（追求成功動機）和 MAF（避免失敗動機）的區別是什麼？
  a: MAS：享受挑戰、偏好 50% 成功率的情境；MAF：保護自我形象、選擇極易或極難任務
  tag: Motivation
- q: 正強化和負強化的定義與區別是什麼？
  a: 正強化：給予獎勵 → 增加行為；負強化：移除厭惡刺激 → 增加行為（兩者都增加行為頻率）
  tag: Motivation
- q: 正懲罰和負懲罰的定義是什麼？
  a: 正懲罰：給予不愉快刺激；負懲罰：移除獎勵（如剝奪上場時間）；兩者均降低行為率
  tag: Motivation
- q: 自控練習（Self-control practice）如何影響學習效果？
  a: 讓選手參與練習決策 → 提升自主感、勝任感，進而提升學習效果
  tag: Motivation
- q: Deci 的內在動機理論中兩個核心心理需求是什麼？
  a: 勝任感（Competence）＋ 自主性（Autonomy）
  tag: Motivation
- q: 高 MAS 者傾向選擇什麼樣的挑戰情境？
  a: 偏好約 50% 成功率的中等難度挑戰，因為最能展示自身能力
  tag: Motivation
- q: 何時應使用全部練習法 vs 部分練習法？
  a: 子成分高度相關 → 全部練習；低相關或危險 → 部分練習
  tag: Motor Learning
- q: 三種部分整合法是什麼？
  a: 純部分法（各分練後整合）、漸進部分法（逐步疊加）、重複部分法（從第一段累加）
  tag: Motor Learning
- q: 隨機練習的短期 vs 長期效果是什麼？
  a: 短期：練習表現暫降；長期：學習效果更佳
  tag: Motor Learning
- q: 變化練習（Variable practice）的目的是什麼？
  a: 強化應對陌生情境的能力（如不同高度跳箱）；增加運動適應彈性
  tag: Motor Learning
- q: 三種指示風格（Instructional style）分別是什麼？
  a: 明確指示（給規則）、引導探索（給目標＋提示）、發現法（只給目標）
  tag: Motor Learning
- q: 擴增回饋的兩種類型是什麼？各指什麼？
  a: KR（結果知識）：時間/成績；KP（表現知識）：動作型態
  tag: Motor Learning
- q: 回饋頻率應如何隨技術水平調整？
  a: 初期頻繁給予，隨技術進步遞減；複雜技能可維持較高頻率
  tag: Motor Learning
- q: 腹式呼吸的生理效果是什麼？在心理訓練中的角色是什麼？
  a: 激活副交感神經；降低心率與肌肉張力；所有心理訓練技巧的前置步驟
  tag: Techniques
- q: 漸進式肌肉放鬆（PMR）如何執行？有什麼使用注意事項？
  a: 逐一肌群張緊（10–15 秒）再放鬆；初期可能疲倦，避免比賽當天使用
  tag: Techniques
- q: 系統脫敏（SD）的步驟是什麼？
  a: 建立恐懼層級 → 結合 PMR＋意象 → 將恐懼反應替換為放鬆反應（反向制約）
  tag: Techniques
- q: 自我效能（Self-Efficacy）的五大來源是什麼？
  a: 表現成就、替代經驗、口語說服、意象、生理/情緒狀態（Bandura）
  tag: Techniques
- q: 自律訓練（Autogenic）與 PMR 有何不同？
  a: 專注溫暖與沉重感取代肌肉張緊；適合受傷選手或老年選手
  tag: Techniques
- q: 賽前例行程序（Pre-performance Routine）的功能是什麼？
  a: 引導注意力至任務相關線索；對抗外部干擾（如對手喊暫停）；建立穩定心理狀態
  tag: Techniques
