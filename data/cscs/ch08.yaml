  - id: ch08.ideal-performance-state.i04
    q: 理想表現狀態中的輕鬆感為何？
    a:
    - 運動員感到不費力
    - 這是一種非自願發生的經驗
    detail: 書中以「非自願」限定這種感受，不宜將它改寫成運動員可隨意命令自己進入的狀態。
