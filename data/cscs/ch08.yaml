  - id: ch08.psychological-techniques.i04
    q: 系統減敏感法（systematic desensitization, SD）如何處理恐懼？
    a:
    - 它結合心理與身體技巧，以放鬆反應取代對各種線索的恐懼反應；此替代原理稱為反制約
    - 運動員應已相當熟練 PMR 與心理意象，並建立自己覺得恐懼的事件與情境層級
    - 在放鬆情境中依序想像層級場景，同時使用腹式呼吸、PMR 或其他放鬆法；理論上強烈放鬆反應可克服較弱的戰或逃反應
    detail: 運動員在可控制的小劑量中經驗制約恐懼並以放鬆克服，可防止認知逃避，逐步對原先引發恐懼的刺激形成新反應。
    terms:
    - systematic-desensitization
    - counterconditioning
    - progressive-muscle-relaxation
    - diaphragmatic-breathing
    - imagery
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Systematic Desensitization
  - id: ch08.psychological-techniques.i05
    q: 意象（imagery）應如何使用？研究與書中的保留為何？
    a:
    - 意象是運動員在心中創造或重建經驗的認知技能；理想上使用所有感官模擬運動表現
    - 初學可從熟悉的靜態影像開始，再增加影像清晰度、動態控制與觸覺或動覺等多感官複雜度
    - 視角可為內在第一人稱或外在第三人稱；文獻未能確定何者較優，較投入且自然的視角較合適
    detail: 書中引用統合分析支持心理意象增進運動技能，但也指出它不如實際成功那麼強地決定自我效能；建議想像的成功應有挑戰、仍在個人可能範圍內。
    terms:
    - imagery
    - self-efficacy
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Imagery
  - id: ch08.psychological-techniques.i06
    q: 自我效能（self-efficacy）如何定義？其來源有哪些？
    a:
    - 自信是相信能成功執行所欲行為；自我效能是特定情境下、對完成指定任務能力的知覺
    - Bandura 所列來源是過去成功或失敗的表現成就、觀察他人的替代經驗、自己或他人的口語說服、以意象看見自己表現、生理狀態，以及情緒狀態
    - 高自我效能者即使經驗失敗，仍不懷疑自己能在該任務成功
    detail: 教材以「有人主張」自我效能比喚醒或焦慮更能預測任務執行，又以「被認為」說在具備技能與可接受動機時，表現很大程度由自我效能決定；此處保留原文語氣。
    terms:
    - self-confidence
    - self-efficacy
    - imagery
    - arousal
    - anxiety
    - motivation
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Self-Efficacy
  - id: ch08.psychological-techniques.i07
    q: 自我對話（self-talk）的類型、可能效果與限制為何？
    a:
    - 自我對話是對自己的內在溝通，可出聲或在心中進行；可自發出現，也可刻意用來改變情緒或行為
    - 正向自我對話可帶來鼓勵、動機或增強；負向自我對話反映憤怒、沮喪、懷疑或負面評斷；指導性自我對話提供特定表現線索
    - 負向自我對話通常與表現不佳相關，因為會把焦點導向不適當線索、觸發負面情緒能量並降低自信
    detail: 正向與指導性自我對話在實驗室中曾改善表現，但實際情境會受顯著個人與環境差異改變；對專家，指導性線索可能干擾自動化，部分人正向自我對話還可能降低自我效能。
    terms:
    - self-talk
    - automaticity
    - self-efficacy
    numbers: []
    concepts:
    - psychology
    related: []
    locator: Psychological Techniques for Improved Performance > Self-Talk
  - id: ch08.psychological-techniques.i08
    q: 例行程序（routine）如何保護選擇性注意？
    a:
    - 例行程序是有意識把想法導向任務相關、可控制事項的心理檢核
    - 例如踢球員可把注意力放在呼吸、檢查草皮與伸展腿後肌
    - 它可在對手於射門前喊暫停等干擾下，避免自我懷疑與失敗想法搶走焦點
    detail: 例行程序的作用是利用工作記憶有限：把心思放在可控制的任務線索，就減少擔憂想法可占用的空間。
