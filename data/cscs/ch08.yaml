  - id: ch08.ideal-performance-state.i01
    q: 理想表現狀態（ideal performance state）的「無恐懼」指什麼？
    a:
    - 運動員沒有失敗的恐懼
    detail: 這是 Williams 與 Krane 列出的典型報告特徵之一；書中沒有把它擴寫成對所有競賽風險都毫無感受。
    terms:
