cards:
- q: 喚醒（arousal）是什麼？
  a: 是個人生理與心理活化的混合，也是某一時刻動機的強度；它從深睡或昏迷到高度興奮持續存在，且本身不帶好壞價值。
  tag: Energy
- q: 狀態焦慮（state anxiety）與特質焦慮（trait anxiety）有何區別？
  a: 狀態焦慮是短期的憂懼與不確定感；特質焦慮是將環境知覺為威脅的穩定傾向，會提高經驗狀態焦慮的可能性。
  tag: Anxiety
- q: 認知焦慮與身體焦慮各指什麼？
  a: 認知焦慮是對情境的負面知覺與擔憂；身體焦慮是肌肉緊張、心搏過速、胃部不適等身體反應。
  tag: Anxiety
- q: 負向壓力（distress）與正向壓力（eustress）有何差別？
  a: 兩者都會產生喚醒；只有負向知覺的壓力源會產生焦慮，包含認知與身體焦慮。正向壓力則帶來正向心理能量與生理喚醒。
  tag: Energy
- q: 壓力（stress）與壓力源（stressor）如何定義？
  a: 壓力是在未能因應會造成重要後果的身體或心理需求時，需求與因應能力間的重大失衡；壓力源是引發壓力反應的環境或認知事件。
  tag: Anxiety
- q: 狀態焦慮一定使運動表現變差嗎？
  a: 不一定。狀態焦慮通常是負面經驗，但對表現可能有正面、負面或無影響；受技能程度、人格與任務複雜性等因素調節。
  tag: Anxiety
- q: 可用哪些指標測量喚醒程度？
  a: 書中列舉心率、血壓、腦電圖（EEG）、肌電圖（EMG）、兒茶酚胺濃度，以及活化－去活化自陳檢核表。
  tag: Energy
- q: 驅力理論（drive theory）的主張與限制為何？
  a: Hull 主張喚醒或狀態焦慮提高時表現也提高；此關係可能只適用於從低喚醒升到較高一些，因為更高喚醒也可能傷害表現。
  tag: Theories
- q: 倒 U 理論（inverted-U theory）主張什麼？教材的保留為何？
  a: Yerkes 與 Dodson 認為喚醒升至最佳程度前有利表現，超過後與表現降低相關；教材指出其通用曲線因技能、能力、經驗與任務複雜性差異而受批評。
  tag: Theories
- q: 個人最佳功能區（IZOF）理論如何修正倒 U 概念？
  a: Hanin 認為不同人在不同表現中有不同最佳喚醒程度；最佳表現不一定在中點，也可落在小段帶寬而非單一固定點。
  tag: Theories
- q: 災難理論（catastrophe theory）與倒 U 理論有何不同？
  a: 認知焦慮存在時，生理喚醒提高可使表現突然大幅下跌，而非逐漸下降；恢復一些平靜也未必回到下跌前水準。
  tag: Theories
- q: 逆轉理論（reversal theory）的核心主張是什麼？
  a: Kerr 認為喚醒效果取決於個人詮釋；同樣高喚醒可被看作興奮與準備就緒，或不愉快與缺乏信心，運動員可嘗試逆轉此知覺。
  tag: Theories
- q: 技能程度如何影響最佳喚醒程度？
  a: 技能愈成熟，可在低於或高於最佳喚醒時仍能表現的容許範圍愈大；較不熟練者的最佳喚醒點較低。
  tag: Theories
- q: 任務複雜度如何改變適當的喚醒程度？
  a: 關鍵是有意識決策負荷。簡單或已熟練技能的任務相關線索較少，較高喚醒較不易干擾；需要決策的技能應保持相對較低喚醒以維持較寬焦點。
  tag: Theories
- q: 廣外部注意（broad external）的功能為何？
  a: 透過觀察環境及其中多個元素來評估情境。
  tag: Attention
- q: 廣內部注意（broad internal）的功能為何？
  a: 在內心處理多項資訊並形成策略。
  tag: Attention
- q: 窄內部注意（narrow internal）的功能為何？
  a: 在心中預演即將進行的動作。
  tag: Attention
- q: 窄外部注意（narrow external）的功能為何？
  a: 專門聚焦一或兩個外在線索以產生動作。
  tag: Attention
- q: Fitts 與 Posner 的技能學習階段依序為何？
  a: 認知階段是費力且有意識調節動作；聯結階段仍專注任務但較少費心細節；自動化階段則心智放鬆、技能無須思考即可執行。
  tag: Attention
- q: 選擇性注意（selective attention）是什麼？
  a: 在有限注意力空間中，抑制任務無關的刺激與想法，轉而處理任務相關線索；運動員常稱它為專注程度。
  tag: Attention
- q: 過程目標與結果目標的主要差別是什麼？
  a: 過程目標聚焦運動員可控制、為良好執行所做的行動；結果目標聚焦勝利、獎牌、得分或排名，達成也取決於他人的能力與努力。
  tag: Goal Setting
- q: 短期目標有何心理作用？
  a: 它雖有挑戰但接近目前能力，成功可能性較高，因此可提高自信、自我效能與動機，並緩解長期艱苦訓練的無聊與挫折。
  tag: Goal Setting
- q: 長期目標的功能是什麼？
  a: 它統整一系列短期目標，提供方向與意義；看見每日練習如何通往最終表現，可使日常訓練更有意義。
  tag: Goal Setting
- q: 系統性目標設定影響表現的三個理由為何？
  a: 目標會排序努力優先次序以引導注意力、因成功取決於達標而提高努力，並透過給運動員的回饋增加正向增強。
  tag: Goal Setting
- q: 為何具體、量化的目標較有效？
  a: 成功與失敗的回饋在具體目標下較有效；例如連續跑步 25 分鐘且心率維持每分鐘 160 至 170 次，比籠統說「去跑步」更具體。
  tag: Goal Setting
- q: 短期與長期目標如何相互連結？
  a: 兩者相互依存：長期目標提供追求短期目標的方向，短期目標達成則建立階層式精熟感、成功感與自信。
  tag: Goal Setting
- q: 運動表現的完整目標設定為何需要整合運動科學？
  a: 目標必須符合身體需求，其設計可涉及生理、代謝、生物力學、營養與心理等子領域，而不只是心理口號。
  tag: Goal Setting
- q: 理想表現狀態（ideal performance state）的典型特徵為何？
  a: 無失敗恐懼、不思考或分析表現、狹窄而集中於活動的注意力、不費力的非自願經驗、個人控制感，以及時間似乎變慢的時間與空間扭曲。
  tag: IPS
- q: 理想表現狀態中的「不思考或分析表現」如何理解？
  a: 它與動作自動化有關，描述已熟練時讓技能自然執行；不是否定初學階段所需的有意識學習。
  tag: IPS
- q: 理想表現狀態中的時間與空間扭曲指什麼？
  a: 運動員主觀感到時間似乎變慢；教材未量化此感受或說明其機制。
  tag: IPS
- q: 書中以 Kobe Bryant 說明理想表現狀態的何種基礎？
  a: 他的聚焦與自信心理狀態很大程度建立於紮實的身體訓練計畫，以及過去成功表現的歷史。
  tag: IPS
- q: 理想表現狀態中的無恐懼指什麼？
  a: 沒有失敗的恐懼；它是典型報告特徵之一。
  tag: IPS
- q: 理想表現狀態中的輕鬆感指什麼？
  a: 感到不費力，而且是非自願發生的經驗，不是可隨意命令自己產生的狀態。
  tag: IPS
- q: 內在動機與外在動機的來源分別是什麼？
  a: 內在動機來自對活動的喜愛、內在報酬、勝任與自我決定；外在動機來自獎項、讚美、社會認可或對懲罰的恐懼等外部來源。
  tag: Motivation
- q: 追求成功動機（MAS）與避免失敗動機（MAF）的核心差異是什麼？
  a: 追求成功動機（MAS）關乎成就自豪、挑戰自己與評估能力；避免失敗動機（MAF）關乎保護自我與自尊，尤其避免失敗帶來的羞恥知覺。
  tag: Motivation
- q: 正增強與負增強有何差別？
  a: 兩者都增加目標操作行為的發生機率；正增強是在行為後給予正向事件，負增強則移除通常令人厭惡的事件。
  tag: Motivation
- q: 正懲罰與負懲罰有何差別？
  a: 兩者都旨在降低目標操作行為；正懲罰是在行為後呈現可能降低行為的事件，負懲罰則移除有價值的事物，例如特權或上場時間。
  tag: Motivation
- q: 自我控制練習（self-controlled practice）如何影響動機與學習？
  a: 讓運動員選擇何時接受回饋、練習何種技能或說明自覺表現，可提升主動參與、勝任感與自主性；隨動機提高，表現與學習也會改善。
  tag: Motivation
- q: Deci 對內在動機強調的兩項要素為何？
  a: 勝任感與自我決定；適當目標可提高知覺勝任感，讓運動員有部分決策空間可提高知覺自我決定。
  tag: Motivation
- q: 追求成功動機（MAS）主導者傾向選擇什麼樣的挑戰？
  a: 通常最感興趣於不確定或具挑戰、成功機率約五成的情境，因為能藉此評估自身能力。
  tag: Motivation
- q: 何時宜用整體練習或部分練習？
  a: 有挑戰但子成分關聯低的任務通常較適合部分練習；高度關聯者較適合整體練習，但完整學習若有危險或代價太高仍宜用部分練習。
  tag: Motor Learning
- q: 三種部分練習的重新整合方式為何？
  a: 純部分訓練先各自練完所有部分再合練；漸進部分訓練逐步把已分練的部分合併；重複部分訓練從第一部分開始，逐一加入後續部分。
  tag: Motor Learning
- q: 隨機練習的練習中表現與學習效果為何？
  a: 單一技能的當下表現起初會下降，但此安排可促進學習；因此初期下滑不能直接視為沒有學會。
  tag: Motor Learning
- q: 變化練習（variable practice）的目的為何？
  a: 在同一次練習中改變同一技能的不同變化，可提升面對未曾練過的新變化時的表現，並培養在陌生脈絡調整技能的彈性。
  tag: Motor Learning
- q: 三種指示風格分別為何？
  a: 明確指示給予規則與具體資訊；引導發現給整體目標與重要提示、但不明說如何完成；發現法只交代整體目標。
  tag: Motor Learning
- q: 擴增回饋的兩種形式為何？
  a: 結果知識提供任務目標執行結果的資訊；表現知識提供運動員動作型態的資訊。若目標本身就是動作結果，兩者可重疊。
  tag: Motor Learning
- q: 回饋時機與頻率如何影響學習？
  a: 同步回饋可提升當下表現但損害學習，延遲回饋可促進學習；初學複雜技能時宜較頻繁，隨技能提升遞減，因較低頻率通常較能增進技能習得。
  tag: Motor Learning
- q: 橫膈膜呼吸（diaphragmatic breathing）的生理效果與心理訓練角色為何？
  a: 深吸氣配合控制吐氣可增加迷走神經張力或副交感活動，降低骨骼肌與器官的神經刺激；它是基本壓力管理技巧與幾乎所有其他心理訓練技巧的前置步驟。
  tag: Techniques
- q: 漸進式肌肉放鬆（progressive muscle relaxation, PMR）如何執行？有何注意事項？
  a: 逐一肌群最大收緊 10 至 15 秒後有意識完全放鬆；初次使用可能有一段倦怠期，應在賽前幾天而非比賽日先練習以了解個別反應。
  tag: Techniques
- q: 系統減敏感法（systematic desensitization, SD）如何進行？
  a: 先建立個人恐懼事件的階層；在放鬆情境中依序想像場景，同時用腹式呼吸、PMR 等放鬆法，以反制約逐步用放鬆取代恐懼反應。
  tag: Techniques
- q: Bandura 所列自我效能的六項來源為何？
  a: 過去成功或失敗的表現成就、觀察他人的替代經驗、自己或他人的口語說服、以意象看見自己表現、生理狀態，以及情緒狀態。
  tag: Techniques
- q: 自律訓練（autogenic training）與 PMR 有何不同？
  a: 它以專注肢體或肌群的溫暖與沉重感，取代 PMR 的收緊－放鬆循環；不需承受高肌肉張力，受傷復健或年長運動員可能較適合。
  tag: Techniques
- q: 例行程序（routine）如何保護注意力？
  a: 它有意識地把心思導向呼吸、場地等任務相關且可控制的事項；利用工作記憶有限，減少自我懷疑與失敗想法占用焦點。
  tag: Techniques
