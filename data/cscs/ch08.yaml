    locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Progressive Muscular Relaxation
  - id: ch08.psychological-techniques.i03
    q: 自律訓練（autogenic training）與 PMR 有何差異？
    a:
    - 它以專注某一肢體或肌群的溫暖與沉重感，取代 PMR 的收緊－放鬆循環
    - 這是一系列用以產生身體感受（通常是溫暖與沉重）的練習
    detail: 因不必承受不舒服的高肌肉張力，受傷復健中的運動員或年長運動員可能較適合此替代法。
    terms:
    - autogenic-training
