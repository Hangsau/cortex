  - id: ch08.ideal-performance-state.i03
    q: 理想表現狀態中的注意力焦點為何？
    a:
    - 注意力範圍狹窄，集中於正在進行的活動本身
    detail: 此任務相關焦點是心理效率的一部分；它與浪費注意力在擔憂、災難化或觀眾、教練評價等無關處理相對。
