  - id: ch08.motor-skill-acquisition.i06
    q: 觀察練習（observational practice）可如何促進技能學習？
    a:
    - 觀察練習（也稱動作觀察）是觀察將執行的任務或技能，可用預錄影片或現場示範
    - 供觀察者可為新手、合格者或專家；與身體練習結合時會增進學習
    - 重量與體能情境可讓兩名運動員輪流，一人動作時另一人在休息期觀察
    detail: 本章所引研究發現觀察與身體練習結合，比單獨身體練習更能改善高翻技術；書中將此連到安全與更快進展至較重負荷。
    terms:
    - observational-practice
    - learning
    numbers: []
    concepts:
    - psychology
    - motor-control
    related: []
    locator: Enhancing Motor Skill Acquisition and Learning > Practice Schedule > Observational Learning
  - id: ch08.motor-skill-acquisition.i07
    q: 三種指示風格（instructional styles）有何差異？
    a:
    - 明確指示提供有效執行任務的規則與具體處方資訊
    - 引導發現提供整體動作目標與重要提示，但不直接告訴運動員怎麼做到
    - 發現法只交代整體任務目標，幾乎不提供方向，讓運動員探索完成方法
    detail: 發現式指示可能放慢學習，明確指示則可能損害壓力環境中的表現；引導發現與發現法較低的注意力需求，可增加任務相關焦點。
    terms:
