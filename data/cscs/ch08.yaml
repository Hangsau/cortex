- id: psychological-techniques
  title: 心理技巧 Psychological Techniques
  desc: ''
  tag: Techniques
  items:
  - id: ch08.psychological-techniques.i01
    q: 放鬆技巧與橫膈膜呼吸（diaphragmatic breathing）如何控制喚醒？
    a:
    - 放鬆技巧旨在降低生理喚醒並提高任務相關焦點；腹式呼吸是基本壓力管理技巧，也是幾乎所有其他心理訓練技巧的前置步驟
    - 它將注意力放在呼吸以清空心思、提高專注；運動員應以放鬆自然的方式深且有節律地呼吸
    - 較深吸氣配合控制吐氣會改變自主神經系統平衡，增加迷走神經張力或副交感活動，進而降低骨骼肌與器官的神經刺激
    detail: 放鬆技巧特別適合執行複雜或新任務、面對壓力情境，或需要刻意專注時；不是所有技能或情境都一律要降低喚醒。
    terms:
    - relaxation-techniques
    - diaphragmatic-breathing
    - autonomic-nervous-system
    - vagal-tone
    - parasympathetic
    - arousal
    numbers: []
    concepts:
