- id: motivation
  title: 動機 Motivation
  desc: ''
  tag: Motivation
  items:
  - id: ch08.motivation.i01
    q: 內在動機 Intrinsic
    a:
    - 來自運動本身的樂趣與自我決定
    - Deci：勝任感＋自主性
    - 較穩定持久
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motivation.i02
    q: 外在動機 Extrinsic
    a:
    - 獎盃、獎賞、教練讚美、社會認同、懲罰恐懼
    - 從外部來源驅動
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motivation.i03
    q: MAS 追求成功動機
    a:
    - 享受挑戰、評估自我能力
    - 偏好 50% 成功率的挑戰性情境
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motivation.i04
    q: MAF 避免失敗動機
    a:
    - 保護自我形象
    - 選擇極易或極難任務以避免羞恥感
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motivation.i05
    q: 正強化 Positive Reinforcement
    a:
    - 跟隨行為給予獎勵 → 增加該行為
    - 例：讚美、頭盔貼紙
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motivation.i06
    q: 負強化 Negative Reinforcement
    a:
    - 移除厭惡刺激 → 增加該行為
    - 例：表現好則免做衝刺
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motivation.i07
    q: 懲罰 Punishment
    a:
    - 正懲罰：給予不愉快刺激
    - 負懲罰：移除獎勵（如剝奪上場時間）
    - 降低行為發生率
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motivation.i08
    q: 自控練習
    a:
    - 讓選手參與練習決策（何時回饋、選擇動作）→ 提升自主感、勝任感、學習效果
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: motor-skill-acquisition
  title: 動作技能學習 Motor Skill Acquisition
  desc: ''
  tag: Motor Learning
  items:
  - id: ch08.motor-skill-acquisition.i01
    q: 全部 vs 部分練習
    a:
    - 子成分高度相關→全部練習
    - 低相關或危險→部分練習
    - 部分法：分段/分化/簡化
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motor-skill-acquisition.i02
    q: 部分整合法
    a:
    - 純部分法（part-whole）：各分練後整合
    - 漸進部分法：逐步疊加
    - 重複部分法：從第一段開始累加
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motor-skill-acquisition.i03
    q: 隨機練習 Random
    a:
    - 多技能隨機交替
    - 練習時表現暫降但學習效果佳
    - 建議：塊狀＋隨機混合
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motor-skill-acquisition.i04
    q: 變化練習 Variable
    a:
    - 同技能多種變化
    - 強化應對陌生情境能力（如不同高度的跳箱）
    - 增加運動適應彈性
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motor-skill-acquisition.i05
    q: 觀察學習
    a:
    - 結合實體練習
    - 夥伴輪流觀察彼此
    - 研究：觀察＋實體 > 單獨實體（power clean 研究）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motor-skill-acquisition.i06
    q: 指示風格
    a:
    - 明確指示（Explicit）：給規則
    - 引導探索（Guided Discovery）：給目標＋提示
    - 發現法（Discovery）：只給目標
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motor-skill-acquisition.i07
    q: 回饋種類
    a:
    - 內在回饋（感覺）
    - 擴增回饋＝結果知識（KR，時間/成績）＋表現知識（KP，動作型態）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.motor-skill-acquisition.i08
    q: 回饋時機與頻率
    a:
    - 同步回饋→提升當下表現
    - 延遲回饋→促進學習
    - 初期頻繁→隨技術進步遞減
    - 複雜技能可維持較高頻率
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: psychological-techniques
  title: 心理技巧 Psychological Techniques
  desc: ''
  tag: Techniques
  items:
  - id: ch08.psychological-techniques.i01
    q: 腹式呼吸
    a:
    - Diaphragmatic Breathing
    - 激活副交感神經
    - 降低心率與肌肉張力
    - 所有心理訓練技巧的前置步驟
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.psychological-techniques.i02
    q: 漸進式肌肉放鬆 PMR
    a:
    - 逐一肌群張緊（10–15 秒）再放鬆
    - 學習辨別緊張與放鬆
    - 注意：初期可能有疲倦感，避免比賽當天使用
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.psychological-techniques.i03
    q: 自律訓練 Autogenic
    a:
    - 專注溫暖與沉重感取代肌肉張緊
    - 適合受傷選手或老年選手
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.psychological-techniques.i04
    q: 系統脫敏 SD
    a:
    - Systematic Desensitization
    - 結合 PMR＋意象
    - 將恐懼反應替換為放鬆反應（反向制約）
    - 建立恐懼層級逐步處理
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.psychological-techniques.i05
    q: 意象 Imagery
    a:
    - 多感官心理排練
    - 第一/第三人稱視角
    - 從靜態→動態
    - 增加自信與熟悉感
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.psychological-techniques.i06
    q: 自我效能 Self-Efficacy
