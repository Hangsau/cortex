title: Ch.8 運動心理學：準備與表現
topics:
- id: arousal-anxiety-stress
  title: 喚醒·焦慮·壓力 Arousal, Anxiety & Stress
  desc: ''
  tag: Energy
  items:
  - id: ch08.arousal-anxiety-stress.i01
    q: 喚醒 Arousal
    a:
    - 生理＋心理激活程度
    - 中性概念，與好壞無關
    - 可用 HR、EEG、EMG 測量
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-anxiety-stress.i02
    q: 狀態焦慮 State Anxiety
    a:
    - 當下短暫的焦慮體驗
    - 受情境影響
    - 可正/負向影響表現
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-anxiety-stress.i03
    q: 特質焦慮 Trait Anxiety
    a:
    - 穩定人格傾向
    - 高特質焦慮者易將情境視為威脅
    - 影響適合喚醒區間
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-anxiety-stress.i04
    q: 認知焦慮 Cognitive Anxiety
    a:
    - 擔憂、負面思考
    - 主觀心理成分
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-anxiety-stress.i05
    q: 身體焦慮 Somatic Anxiety
    a:
    - 肌肉緊張、心跳加速、胃部不適等生理反應
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-anxiety-stress.i06
    q: 壓力 Stress
    a:
    - 需求與應對能力間的重大失衡
    - 失敗有重要後果
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-anxiety-stress.i07
    q: Distress 負向壓力
    a:
    - 負面感知壓力源 → 產生焦慮（認知＋身體）
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-anxiety-stress.i08
    q: Eustress 正向壓力
    a:
    - 正面感知壓力源 → 產生正向心理能量＋生理喚醒，無焦慮
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: arousal-theories
  title: 喚醒理論 Arousal Theories
  desc: ''
  tag: Theories
  items:
  - id: ch08.arousal-theories.i01
    q: 驅力理論 Drive Theory
    a:
    - Hull：喚醒↑ → 表現↑（線性）
    - 簡單/熟練技能適用
    - 忽略「過度激活」現象
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-theories.i02
    q: 倒 U 理論 Inverted-U
    a:
    - Yerkes & Dodson：適度喚醒表現最佳
    - 過高或過低均降低表現
    - 最常考！
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-theories.i03
    q: 技能水平調節
    a:
    - 技術越高，最佳喚醒區間越寬
    - 新手需較低喚醒
    - 複雜任務需較低喚醒
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-theories.i04
    q: IZOF 個人最佳區
    a:
    - Hanin：最佳表現不一定在中間點
    - 有一個喚醒「帶寬」
    - 個人差異顯著
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-theories.i05
    q: 災難理論 Catastrophe
    a:
    - Hardy：認知焦慮高時，生理喚醒超過臨界點 → 表現急劇崩潰（非漸進）
    - 難以恢復
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-theories.i06
    q: 逆轉理論 Reversal
    a:
    - Kerr：對喚醒的詮釋決定效果
    - 高喚醒可解讀為興奮或恐懼
    - 詮釋在個人掌控之中
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-theories.i07
    q: 任務複雜度
    a:
    - 需要決策的複雜任務（如足球守門員）需維持較低喚醒
    - 簡單熟練技能可忍受較高喚醒
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.arousal-theories.i08
    q: 人格影響
    a:
    - 內向者最佳喚醒低於外向者
    - 特質焦慮高者更容易進入負面喚醒狀態
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: attention-concentration
  title: 注意力與專注 Attention & Concentration
  desc: ''
  tag: Attention
  items:
  - id: ch08.attention-concentration.i01
    q: 選擇性注意
    a:
    - Selective Attention：抑制不相關刺激，聚焦任務相關線索
    - 即「專注力」
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.attention-concentration.i02
    q: 廣外部 Broad External
    a:
    - 評估環境全局（Assess）
    - 例：QB 閱讀防守陣形
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.attention-concentration.i03
    q: 廣內部 Broad Internal
    a:
    - 分析策略（Analyze）
    - 例：比賽前制定戰術計畫
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.attention-concentration.i04
    q: 窄內部 Narrow Internal
    a:
    - 心理預演（Prepare）
    - 例：舉重前在腦中演練動作
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.attention-concentration.i05
    q: 窄外部 Narrow External
    a:
    - 聚焦單一外部線索（Act）
    - 例：踢球時只看目標點
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.attention-concentration.i06
    q: 認知階段
    a:
    - Fitts & Posner 第一階段：需刻意思考動作細節
    - 新手特徵
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.attention-concentration.i07
    q: 聯結階段
    a:
    - 第二階段：仍需專注任務但細節負擔減少
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.attention-concentration.i08
    q: 自動化階段
    a:
    - 第三階段：動作自動執行
    - 心智放鬆
    - 只需處理最相關線索
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
- id: goal-setting
  title: 目標設定 Goal Setting
  desc: ''
  tag: Goal Setting
  items:
  - id: ch08.goal-setting.i01
    q: 過程目標 Process Goals
    a:
    - 選手可控制
    - 聚焦技術動作與執行細節
    - 成功高度取決於努力程度
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.goal-setting.i02
    q: 結果目標 Outcome Goals
    a:
    - 聚焦競賽結果（勝負、排名）
    - 受他人能力影響
    - 過度強調可能佔用注意力資源
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.goal-setting.i03
    q: 短期目標
    a:
    - 接近現有能力水準
    - 較易達成
    - 建立信心與動力
    - 對抗長訓練期的無聊感
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.goal-setting.i04
    q: 長期目標
    a:
    - 統領所有短期目標的大方向
    - 賦予每日訓練意義
    - 增加練習投入度
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.goal-setting.i05
    q: 目標設定功能
    a:
    - ①引導注意力 ②提高努力程度 ③增加回饋正強化 ④促進行為改變
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.goal-setting.i06
    q: 具體性原則
    a:
    - 量化目標比模糊目標更有效
    - 例：「160–170 bpm 跑 25 分鐘」優於「去跑步」
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.goal-setting.i07
    q: 互依性
    a:
    - 短期目標與長期目標相互連結
    - 短期的成功累積產生精熟感，建立自信
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
  - id: ch08.goal-setting.i08
    q: 整合運動科學
    a:
    - 最完整的目標設定涵蓋生理、生物力學、營養、心理等多面向
    - 此為運動心理學的獨特性
    detail: ''
    terms: []
    numbers: []
    concepts: []
    related: []
    locator: ''
