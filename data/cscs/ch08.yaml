    q: 理想表現狀態的心理效率還包括什麼？
    a:
    - 沒有負向自我對話
    - 有強烈的自我效能感
    - 注意力能適應性地聚焦任務相關線索
    detail: 書中將這些視為應用運動心理學計畫所要促進的狀態，並提到運動員信任自己的技能與體能、讓表現自然發生。
