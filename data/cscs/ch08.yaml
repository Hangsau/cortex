    related: []
    locator: Psychological Techniques for Improved Performance > Relaxation Techniques to Control Elevated Arousal and Anxiety > Diaphragmatic Breathing
  - id: ch08.psychological-techniques.i02
    q: 漸進式肌肉放鬆（progressive muscle relaxation, PMR）如何進行？
    a:
    - 以控制骨骼肌張力來自我調節心理與身體喚醒，交替進行肌肉收緊與放鬆
    - 每個肌群先最大收緊 10 至 15 秒，再有意識地完全放鬆，逐一進行到所有肌群獲得適當放鬆
    - 經練可讓運動員迅速辨別緊張與放鬆肌肉的差異，並主動產生所需放鬆
    detail: 肌肉張力下降可能帶來更流暢有效的動作與較大關節活動範圍；但剛開始使用可能暫時倦怠，應於賽前幾天而非比賽日先試其個別影響。
    terms:
    - progressive-muscle-relaxation
    - arousal
    numbers:
