- id: breaststrokers-knee
  zh: 蛙泳膝
  en: Breaststroker's knee
  category: B-lower-spine-strokespecific
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - 內側副韌帶應力症(MCL)
  - 髕股疼痛症候群(PFPS)
  - 鵝足滑囊炎(pes anserine)
  - 內側皺襞症候群(medial plica)
  structures:
  - 內側副韌帶(MCL)
  - 髕股關節
  - 鵝足滑囊
  - 內側皺襞
  mechanism:
    summary: 蛙式踢腿(whip kick)外翻+外旋負荷重複施於膝內側→內側副韌帶反覆應力(最常見子型)；另有髕股關節壓力(PFPS)、鵝足滑囊炎、內側皺襞夾擠。是傘狀總稱，子型機制與處置不同，須先分型。**但須注意：關節鏡研究至今未能找出對應本症候群的特定結構異常，子型分類是臨床分型不是已確立的病理分類。**
    driver: 踢腿外翻角偏離常態範圍(過小或過大皆然)、髖旋轉活動度受限、蛙式訓練距離增加、暖身距離不足、訓練量驟增
    trigger_phase: 蛙式踢腿蹬夾動作相關，膝在外翻位承受高扭轉負荷。**時相歸屬有文獻分歧**：早期研究歸咎踢腿終末期，但 Vizsolyi 1987 指出選手主訴疼痛多發生在向後推蹬的**起始期**，本項不指定單一時相。
    who: null
  epidemiology:
    prevalence: Vizsolyi 1987 問卷 n=391：蛙式專項者膝痛 73%、**非蛙式專項者亦有 48%**（兩數字必須成對引用，差距是 73 vs 48 而非有 vs 無）。Rovere & Nichols 1985 n=36 蛙式選手：86% 曾有至少一次蛙式相關膝痛，47.2% 每週至少發作一次。
    certainty: 🟡
    evidence_grade: B
    caveat: 「蛙泳膝」常被當單一診斷統計，未分子型→盛行率混雜不同病理。兩篇主要流病文獻皆為 1980 年代、樣本為競技族群、以自陳問卷為主，不可外推到成人初學或休閒族群。
    sources:
    - Vizsolyi P, Taunton J, Robertson G, et al. (1987). Breaststroker's knee. Am J Sports Med 15(1):63–71. (PMID 3812862，已驗證)
    - Rovere GD, Nichols AW. (1985). Frequency, associated factors, and treatment of breaststroker's knee in competitive swimmers. Am J Sports Med 13(2):99–104. (PMID 3985267，已驗證)
    - Cheng KY, Chambers H, Dwek JR. (2022). MRI appearance of breaststroker's knee. Pediatr Radiol 52(13):2645–2647. (PMID 35672477，已驗證；n=1 病例，僅供結構層無定論之佐證)
    source_ids:
    - src.vizsolyi-1987
    - src.rovere-nichols
    - src.cheng-2022-breaststrokers-knee-mri
  risk_factors:
  - text: 蛙式為主項 + 高週踢腿量／蛙式訓練距離增加
    grade: B
  - text: 競賽年數與年齡增加
    grade: B
  - text: 暖身距離不足
    grade: B
  - text: 起踢時髖外展角偏離 37°–42° 區間（過小或過大皆然，呈雙峰）——**但同研究的運動學影片分析未達統計顯著，這是待驗證型態，不是實證閾值，不得當作教學角度標準**
    grade: C
  - text: 髖關節**內旋**活動度降低（Rovere 1985 在頻繁膝痛者身上觀察到的是內旋受限，不是外旋不足）
    grade: C
  - text: 訓練量/踢腿量急性跳升
    grade: B
  - text: 既往膝內側疼痛史
    grade: C
  prevention:
  - text: 先減蛙式訓練距離——這是 Rovere 1985 明列的第一順位處置，優先於技術矯正
    grade: B
  - text: 確保暖身距離足夠（暖身距離減少與膝痛頻率顯著相關）
    grade: B
  - text: 髖旋轉活動度訓練（原文為概括的 hip rotation，內旋受限是已觀察到的方向）
    grade: C
  - text: 技術矯正：踢腿外翻角避免走極端；髖帶動以減膝扭轉
    grade: C
  - text: 踢腿量漸進管理，賽季初期尤其緩慢增加
    grade: B
  - text: 賽季高蛙量期分散踢腿負荷、混入其他泳式
    grade: C
  management:
    red_flags:
    - 膝鎖死/卡住/打軟(giving way) → 排除半月板/游離體損傷
    - 明顯腫脹積液 + 不穩 → 排除韌帶斷裂，影像評估
    - 夜間痛/休息痛/發燒紅熱 → 排除感染性關節炎或其他病理
    acute: 相對休息(減踢腿、非全停)；急性期冰敷/相對卸載；分型後對因處理
    pain_rules: 復健期踢腿疼痛 ≤3/10、不改踢腿型態、24h 不惡化
    rehab: 依子型：MCL 應力→漸進負荷+技術；PFPS→髖膝控制與股四頭/臀肌；鵝足滑囊→離心+負荷管理
    functional_progression_criteria:
    - 全活動度無痛
    - 髖旋轉活動度（內旋與外旋皆量）與臀肌力左右對稱
    - 陸上單腿控制測試無代償性外翻
    swim_modifications_in_rehab:
    - 暫以自由式/仰式踢腿替代蛙式蹬夾，卸載膝內側
    - 蛙式回歸初期用浮板控制踢腿量、縮小外翻角
    - 避免蛙泳大力蹬牆轉身的瞬間外翻負荷
    return_to_train: 踢腿無痛 + 髖外旋/臀肌對稱 + 技術外翻角矯正 → 漸進回蛙踢，技術優先於量
    return_to_compete: 全蛙量無痛訓練穩定 + 技術型態維持 → 復賽
    prognosis: 多數保守處理+技術矯正可改善；結構性損傷(半月板/韌帶斷裂)另評估
  population_notes:
    age:
      youth: 青少年蛙泳專項化早+踢腿量高，外翻技術未定型易累積
      adult_beginner: 成人蛙式技術未熟、外翻角過大，常見膝內側痛
      masters: 既有膝退化(內側室骨關節炎)疊加蛙踢負荷
    sex: null
    ability: null
    lifecycle: null
  links:
    mechanism_link: 踢腿外翻負荷與髖旋轉活動度可接『硬體邊界 vs 感知缺陷』判斷(髖活動度=硬體)
    mechanism_link_ids: []
    technical_link: 蛙式翻腳的四關節拆解——教練說的『腳尖朝外』其實橫跨髖外旋、膝軸旋、距下與橫跗關節，把它當單一關節指令是膝扭轉負荷的來源之一
    technical_link_ids:
    - breast.tech.36
    - breast.tech.37
    perception_link: L2–L4 腳感層(踢腿節律與蹬夾感知)
    perception_link_ids: []
  references:
  - citation: Vizsolyi P, Taunton J, Robertson G, et al. (1987). Breaststroker's knee. An analysis of epidemiological and biomechanical factors. Am J Sports Med 15(1):63–71. PMID 3812862
    certainty: 🟡
    verified: true
    source_ids:
    - src.vizsolyi-1987
  - citation: Rovere GD, Nichols AW. (1985). Frequency, associated factors, and treatment of breaststroker's knee in competitive swimmers. Am J Sports Med 13(2):99–104. PMID 3985267
    certainty: 🟡
    verified: true
    source_ids:
    - src.rovere-nichols
  - citation: Cheng KY, Chambers H, Dwek JR. (2022). Magnetic resonance imaging appearance of breaststroker's knee. Pediatr Radiol 52(13):2645–2647. PMID 35672477
    certainty: 🟡
    verified: true
    source_ids:
    - src.cheng-2022-breaststrokers-knee-mri
  flags:
    contested:
    - claim: 蛙泳膝主要病理是 MCL 應力還是髕股/內側皺襞
      consensus_source: 臨床定位一致指向內側結構——Vizsolyi 1987 指出內側副韌帶與髕骨內下緣受累；Rovere 1985 在每週膝痛者中有 47% 觸及壓痛增厚的內側滑膜皺襞
      dissent_source: Cheng 2022 指出**關節鏡研究至今未能證實對應本症候群的特定結構異常**。因此這不是資料不足的暫時分歧，而是結構層面尚無定論；任一子型都不得寫成已確立病理
    - claim: 疼痛發生在踢腿的哪一時相
      consensus_source: 早期研究歸咎踢腿終末期(terminal phase)
      dissent_source: Vizsolyi 1987 開宗明義指出選手主訴多發生在向後推蹬的起始期(initial phase of rearward thrust)，此分歧至今未解
    vintage_warning: true
- id: extension-low-back-pain
  zh: 伸展型下背痛（蝶泳）
  en: Extension-type low back pain (butterfly)
  category: B-lower-spine-strokespecific
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 腰椎關節突關節
  - 腰椎旁肌
  - 髂腰肌
  - 腰椎韌帶
  mechanism:
    summary: 機制導向的「伸展型」腰痛，主要由蝶/蛙反覆腰椎過伸引起，不一定有影像可見的椎弓解離或椎間盤病變(與椎弓解離條目重疊，此處聚焦關節突關節炎性/肌肉韌帶型負荷痛)。蝴蝶踢腰椎過伸+骨盆前傾壓迫關節突關節；核心不足或髖屈肌緊縮則波動幅度加大。俗稱「蝶泳下背症候群」。
    trigger_phase: 蝴蝶踢下踢、蛙泳回腿、水中伸展姿勢、腳踢板
    who: 蝶/蛙高量者、髂腰肌緊縮者、核心不足者
  epidemiology:
    prevalence: 蝶式下背痛 33.3–50%、蛙泳 22.2–47%；有下背痛者蝴蝶踢時腰椎過伸角度顯著較大、髂腰肌彈性模量更高；精英泳者脊椎退化率 68% vs 休閒 29%
    certainty: 🟡
    evidence_grade: B
    caveat: 橫斷面為主，因果方向不明；機制證據來自 Kitamura 等人（2020）的單一小樣本研究，68% 退化率的原始研究仍為摘要/二手
    sources:
    - Swimming low back pain by stroke, PMC11531034 (已驗證)
    - Competitive swimmers spine degeneration, PMC3435931 (已驗證)
    - Kitamura, G., Tateuchi, H., & Ichihashi, N. (2020). Greater Lumbar Extension During Dolphin Kick and Psoas Major Tightness in Swimmers With Low Back Pain. Journal of Sport Rehabilitation, 29(6), 716-722.
    source_ids:
    - src.pmc11531034
    - src.pmc3435931
    - src.kitamura-2020-dolphin-kick-lumbar-extension
  risk_factors:
  - text: 髂腰肌緊縮
    grade: B
  - text: 腰椎過伸角度過大
    grade: B
  - text: 核心不足
    grade: B
  - text: 腳踢板過度使用
    grade: Expert
  - text: 高量蝶/蛙
    grade: B
  - text: 骨盆前傾
    grade: Expert
  - text: 蝴蝶踢偏全身性波浪(vs 膝為主)
    grade: Expert
  prevention:
  - text: 核心強化(抗伸展方向)
    grade: B
  - text: 髂腰肌拉伸
    grade: B
  - text: 技術:較小波動、膝為主蝴蝶踢
    grade: Expert
  - text: 減少腳踢板
    grade: Expert
  - text: 分散筆畫避免長時間單一蝶/蛙
    grade: Expert
  management:
    red_flags:
    - 下肢放射痛/神經症狀 → 就醫(排除椎間盤突出)
    - 伸展位劇痛 → 就醫(排除椎弓解離)
    - 夜間痛 → 就醫(排除腫瘤/感染)
    acute: 訓練調整(停蝶/蛙/腳踢板)、關節鬆動、軟組織治療、NSAIDs
    pain_rules: 輕度訓練後痠痛 24 小時消退 → 續但分散蝶式；過伸即痛 → 停蝶/蛙評估；有下肢症狀 → 立即評估(red flag)
    rehab: 核心抗伸展穩定(plank/dead bug/bird-dog)+髂腰肌拉伸+腰椎中立位動作控制；關節突關節痛者關節鬆動+短期貼紮
    functional_progression_criteria:
    - 腰椎中立位全 ROM 無痛
    - 核心耐力測試通過
    - 漸進蝴蝶踢無症狀
    swim_modifications_in_rehab:
    - 自由式/背泳替代(旋轉為主非過伸)
    - 水中核心練習、漸引窄幅蝴蝶踢
    return_to_train: 輕症 4–8 週；與椎弓解離共存按椎弓解離條目(更長)
    return_to_compete: 核心與蝴蝶踢無症狀達標後回賽
    prognosis: 多數保守反應良好；無構造病變者佳；高量蝶式者需長期核心維持
  population_notes:
    age:
      youth: 核心族群
      adult_beginner: 核心控制不足風險不低
      masters: 退化性椎間盤+關節突關節炎共存，機制更複雜
    sex:
      female: 蝶/蛙下背痛略高於男性(待查)
      male: null
    ability:
      para: 脊椎損傷者特殊腰椎狀況，不可套用一般評估(DATA GAP)
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Low back pain in swimmers by stroke, PMC11531034
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11531034
  - citation: Spine degeneration in competitive swimmers, PMC3435931
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc3435931
  flags:
    contested:
    - claim: 伸展型下背痛 vs 椎弓解離鑑別
      consensus_source: 影像前難鑑別，處理相近
      dissent_source: 椎弓解離需更謹慎；抗伸展 vs 屈曲導向核心訓練相對效益缺高品質 RCT
    vintage_warning: false
- id: femoroacetabular-impingement
  zh: 股骨髖臼撞擊（FAI）
  en: Femoroacetabular impingement in swimmers
  category: B-lower-spine-strokespecific
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - Cam 型
  - Pincer 型
  - 混合型
  structures:
  - 股骨頭頸交界
  - 髖臼緣
  - 髖盂唇
  - 髖關節軟骨
  mechanism:
    summary: 股骨頭(Cam)或髖臼(Pincer)骨性異常致髖屈曲/內旋時骨性接觸夾擊盂唇與軟骨。蛙泳踢腿需大幅外旋屈曲後內收內旋的組合反覆動作為主要誘發；蝴蝶踢反覆髖屈伸亦可。水上運動員在骨骼發育期反覆對股骨頭施加旋轉應力，可能促進 Cam 形態發育。
    trigger_phase: 蛙泳踢腿加速相、蝴蝶踢下踢
    who: 青少年期大量水上運動者、蛙泳專項、既有骨性異常者
  epidemiology:
    prevalence: 水上項目(水球/同步游泳)Cam 形態 67.5%(27/40 髖)、與足球(64.2%)相當；Pincer 22.5%；蛙泳特定無獨立研究
    certainty: 🟡
    evidence_grade: B
    caveat: 流行率數據來自水球/同步游泳(蛋踢)，非蛙泳特定；alpha angle 與蛋踢時數無統計相關，習得 vs 先天未定
    sources:
    - Cam morphology in aquatic athletes, PMC7605769 (已驗證)
    - FAI rehabilitation & RTS, PMC11642080 (已驗證)
    source_ids:
    - src.pmc7605769
    - src.pmc11642080
  risk_factors:
  - text: 青少年期大量水上運動(骨骺敏感)
    grade: B
