    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11954903
  - citation: 'Dezfulian C, et al. (2024). 2024 American Heart Association and American Academy of Pediatrics Focused Update on Special Circumstances: Resuscitation Following Drowning. Circulation 150(23):e501-e516. PMID 39530204 / doi:10.1161/CIR.0000000000001274'
    certainty: 🟢
    verified: true
    source_ids:
    - src.dezfulian-2024
  - citation: 'Davis CA, et al. (2024). Wilderness Medical Society Clinical Practice Guidelines for the Treatment and Prevention of Drowning: 2024 Update. Wilderness Environ Med 35(1_suppl):94S-111S. PMID 38379489'
    certainty: 🟢
    verified: true
    source_ids:
    - src.davis-2024-wms-drowning
  - citation: 'Gianfrancesco H, Sternard BT. Drowning: Clinical Management. In: StatPearls. NCBI Bookshelf NBK430833（最後更新 2025-09-15；2026-09-04 更正：章名不是「Drowning」）'
