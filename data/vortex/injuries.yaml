- id: groin-adductor-strain
  zh: 腹股溝/內收肌損傷（蛙泳）
  en: Groin / adductor strain (breaststroke)
  category: B-lower-spine-strokespecific
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 內收肌群
  - 股薄肌
  - 恥骨聯合
  - 髖內收肌腱起點
  mechanism:
    summary: 蛙泳踢腿推進期需大力髖內收(內收肌群+股薄肌)，膝足外開幅度越大、內收肌牽張負荷越高。急性傷害見於負荷突增或疲勞後失衡；慢性來自反覆超載致腱病或恥骨聯合過載(運動性恥骨痛)。與一般定義「腹股溝痛」涵蓋 adductor strain / 運動性恥骨痛 / 疝氣多有重疊。
    trigger_phase: 蛙泳鞭踢的外展→內收轉換相
    who: 蛙泳專項、踢腿幅度大者、內收肌相對弱者
  epidemiology:
    prevalence: 蛙泳者 42.7% 過去一年因腹股溝傷無法完成蛙泳訓練(vs 個人混合式 21.5%、非蛙泳 5.8%)；當前腹股溝痛蛙泳 6.92% vs 個人混合式 0%(p=0.015)
    certainty: 🟡
    evidence_grade: B
    caveat: 主要數字來自 2004 年單一研究（Grote 等，AJSM，n = 296），現代訓練模式不同。 2026-08-17 已取回摘要**逐字比對，六個統計數字全部相符**，數字不再屬待查——但仍是**摘要層級**驗證（全文未開啟），且為單一橫斷研究。同時解除本欄原掛的另一筆「內收肌負荷與重返運動實務」引用：它標著「已驗證」卻無作者、無年份、無識別碼，指向一家診所的實務做法而非可重取文獻；它沒有支撐本條任何數字，解除不影響內容。
    sources:
    - Grote K, Lincoln TL, Gamble JG (2004). Hip adductor injury in competitive swimmers. Am J Sports Med. PMID 14754731（摘要層級已逐字比對）
    source_ids:
    - src.grote-2004
  risk_factors:
  - text: 蛙泳踢腿幅度過大
    grade: B
  - text: 訓練量急增(急/慢性負荷比 >150%)
    grade: B
  - text: 熱身不足(<900 m)
    grade: B
  - text: 髖內旋 ROM 不足(<40°)
    grade: B
  - text: 核心/臀肌薄弱
    grade: Expert
  - text: 年齡 ≥16
    grade: B
  - text: 競技年資 ≥9 年
    grade: B
  prevention:
  - text: 技術:縮小踢腿幅度、窄鞭踢
    grade: B
  - text: Copenhagen 內收肌離心訓練(顯著提升肌力；唯一的預防試驗做在男性足球員身上——賽季腹股溝問題盛行率 13.5% vs 對照 21.3%、風險低 41%，泳者無同級證據)
    grade: B
  - text: 充足熱身 ≥900 m
    grade: B
  - text: 負荷漸進管理
    grade: B
  management:
    red_flags:
    - 恥骨結節嚴重觸痛 → 就醫(排除恥骨骨炎/應力骨折)
    - 腹股溝膨出/疝氣徵象 → 就醫
    - 神經症狀 → 就醫
    - 不明消瘦+持續痛 → 就醫(排除腫瘤)
    acute: 休息、冰敷、停蛙泳
    pain_rules: 等長收縮無痛 → 開始等長訓練；NRS ≤3 且消退 → 調整續練(非蛙泳)；蛙泳期間任何痛 → 停蛙泳改自由/背泳
    rehab: ①等長 ②同心/離心漸進(Copenhagen) ③功能性(模擬踢腿路徑) ④專項(窄幅蛙踢)
    functional_progression_criteria:
    - 內收肌力 ≥90% 對側
    - 窄幅踢腿無痛
    - 蛙泳全速無痛再現
    swim_modifications_in_rehab:
    - 停蛙泳；可自由式/背泳/蝴蝶腳(腹股溝負荷低)
    - 監督下漸引窄幅蛙踢
    return_to_train: 輕症 2–12 週；慢性腱病 3–6 月
    return_to_compete: 肌力與蛙泳全速無痛達標後回賽
    prognosis: 主動復健佳；慢性(含恥骨骨炎)延長；避免帶痛蛙泳為關鍵
  population_notes:
    age:
      youth: 16 歲後顯著增加
      adult_beginner: null
      masters: 累積軟組織退化，數據缺
    sex:
      female: 女性蛙泳者骨盆寬度生物力學差異(DATA GAP)
      male: null
    ability:
      para: 蛙泳部分分級受限，文獻缺
    lifecycle: null
  links:
    mechanism_link: null
    mechanism_link_ids: []
    technical_link: breast.tech.13 膝距窄的雙重效益（對應預防「縮小踢腿幅度、窄鞭踢」）、breast.tech.15 髖關節內旋（對應風險因子「髖內旋 ROM 不足(<40°)」）
    technical_link_ids:
    - breast.tech.13
    - breast.tech.15
    perception_link: null
    perception_link_ids: []
  references:
  - citation: Breaststroke groin injury (Grote 2004), AJSM PMID 14754731
    certainty: 🟡
    verified: false
    source_ids:
    - src.grote-2004
  - citation: 'Thorborg K. (2023). Current Clinical Concepts: Exercise and Load Management of Adductor Strains, Adductor Ruptures, and Long-Standing Adductor-Related Groin Pain. J Athl Train 58(7-8):589-601. PMID 35834724 / PMC10569248（2026-09-04 取代原「Adductor strengthening / load management (Coast Sport)」——後者為診所網頁、無 URL 無作者無年份、不可重取）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.thorborg-2023-adductor-exercise-load-management
  - citation: 'Harøy J, Clarsen B, Wiger EG, et al. (2019). The Adductor Strengthening Programme prevents groin problems among male football players: a cluster-randomised controlled trial. Br J Sports Med 53(3):150-157. PMID 29891614（族群為男性足球員，非泳者；終點為 OSTRC 自述問題盛行率，非失訓傷害發生率）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.haroy-2019-adductor-strengthening-programme
  flags:
    contested:
    - claim: Copenhagen 是否足以預防蛙泳者傷害
      consensus_source: Copenhagen 顯著提升內收肌力
      dissent_source: 季節性傷害預防統計不顯著，依從性為關鍵(PMC12363431 2025 摘要)。且唯一的高品質預防試驗(Harøy 2019, PMID 29891614)族群為男性足球員、終點為自述問題盛行率而非失訓傷害，蛙泳的水中閉鏈內收肌負荷型態與足球差異大，不得直接外推
