- id: spondylolysis
  zh: 椎弓解離/脊椎滑脫
  en: Spondylolysis / spondylolisthesis
  category: B-lower-spine-strokespecific
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 腰椎椎弓根峽部(pars interarticularis)
  - 腰椎關節突關節
  - 椎間盤
  mechanism:
    summary: 腰椎椎弓根峽部(pars interarticularis)應力骨折，由反覆腰椎過伸+旋轉+剪切造成。蝶式/蛙泳波浪動作要求腰椎反覆過伸對抗水阻，每次訓練可重複 1,000 次以上。雙側峽部不癒合可進展為脊椎滑脫。是青少年運動員最常見的下背痛結構性病因之一。
    trigger_phase: 蝴蝶踢下推、蛙泳回腿過伸、水中標準化伸展姿勢
    who: 蝶/蛙專項青少年、髂腰肌緊縮/核心不足者、習慣性腰椎過伸者
  epidemiology:
    prevalence: 蝶式下背痛 33.3–50%、蛙泳 22.2–47%；青少年運動員為最常見下背痛原因；運動員椎弓解離約一般人群(5–10%)的 2 倍，游泳特定比例屬二手
    certainty: 🟡
    evidence_grade: B
    caveat: 下背痛盛行率有游泳數據，但椎弓解離游泳特定比例為二手綜述；返回運動時間數字多為摘要層級
    sources:
    - Swimming low back pain by stroke, PMC11531034 (已驗證)
    - Competitive swimmers spine degeneration, PMC3435931 (已驗證)
    source_ids:
    - src.pmc11531034
    - src.pmc3435931
  risk_factors:
  - text: 蝶/蛙反覆腰椎過伸
    grade: B
  - text: 核心薄弱
    grade: B
  - text: 髂腰肌緊縮/骨盆前傾
    grade: B
  - text: 腳踢板過多(強迫過伸)
    grade: Expert
  - text: 青少年骨骼發育期
    grade: B
  - text: 蝶/蛙訓練量高
    grade: Expert
  prevention:
  - text: dryland 核心強化
    grade: B
  - text: 技術:減少蝴蝶踢波動、改以膝為主踢腿
    grade: Expert
  - text: 減少腳踢板使用
    grade: Expert
  - text: 平衡過伸與屈曲訓練
    grade: Expert
  - text: 髂腰肌拉伸
    grade: B
  management:
    red_flags:
    - 急性嚴重下背痛 → 就醫
    - 下肢神經症狀(麻/無力) → 就醫(滑脫進展)
    - 大小便失禁 → 急診(罕見急症)
    - 伸展位劇痛+影像確認 → 骨科/脊椎評估
    acute: 停蝶/蛙；視情況硬式胸腰薦支架(TLSO/Boston)23 小時/天×3 月；電骨刺激(臨床常用但 RCT 證據不足)
    pain_rules: 有症狀+影像確認 → 停蝶/蛙改自由/背泳；無症狀偶然發現 → 仍考慮保護性調整
    rehab: 3 期:①ROM 恢復(髂腰肌拉伸、腰椎中立) ②穩定化(dead bug/bird-dog/腹部等長) ③功能性(區分髖屈 vs 腰椎屈)
    functional_progression_criteria:
    - 靜息/活動無痛
    - 核心肌力測試通過
    - 影像穩定(症狀消失可接受，不一定要骨癒合)
    swim_modifications_in_rehab:
    - 停蝶/蛙，初期自由/背泳
    - 監督下漸引蝴蝶腿(無症狀)，不帶痛蝶式或腳踢板
    return_to_train: 保守平均 3.7–4.6 月
    return_to_compete: 青少年保守約 95% 恢復傷前無需手術
    prognosis: 總體良好；滑脫 >50% 可能需椎弓融合；長期核心維持防復發
  population_notes:
    age:
      youth: 核心風險群，峽部更脆弱
      adult_beginner: null
      masters: 退化性改變共存需鑑別
    sex:
      female: 蝶/蛙下背痛略增；椎弓解離性別差異游泳特定數據缺
      male: null
    ability:
      para: 脊椎損傷者腰椎風險不同，需個案評估(DATA GAP)
    lifecycle: null
  links:
    mechanism_link: null
    mechanism_link_ids: []
    technical_link: fly.tech.29「腰部彎曲代替胸部起波」——該技術錯誤即本症的腰椎過伸機轉本身；fly.tech.26 胸椎活動度是波動觸發的解剖前提，胸椎不足時由腰椎代償
    technical_link_ids:
    - fly.tech.29
    - fly.tech.26
    perception_link: null
    perception_link_ids: []
  references:
  - citation: Low back pain in swimmers by stroke, PMC11531034
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11531034
  - citation: Spine degeneration in competitive swimmers, PMC3435931
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc3435931
  flags:
    contested:
    - claim: 骨癒合是否治療成功必要條件
      consensus_source: 近年趨向症狀消失+功能恢復即可 RTS
      dissent_source: 支架種類(硬式 TLSO vs 半硬式)比較證據不足
    vintage_warning: false
- id: swimmer-ankle-foot-overuse
  zh: 游泳者踝/足過度使用傷
  en: Swimmer's ankle & foot overuse
  category: B-lower-spine-strokespecific
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - 趾伸肌腱病
  - 外/後側踝應力
  - 蹠骨應力/足底筋膜問題
  structures:
  - 趾伸肌腱
  - 尺側/外側踝韌帶
  - 蹠骨
  - 足底筋膜
  mechanism:
    summary: 三條路徑——①趾伸肌腱病:蛙/自由式踢腿反覆踝背屈、腳踢板及蛙鞋使用對前足踝背側趾伸肌腱牽拉(蛙鞋槓桿加大前掌受力為催化)；②外/後側踝應力:翻滾轉身腳板接觸不準致踝扭傷、蛙鞋過用致外側踝骨髓水腫；③蹠骨應力骨折/足底筋膜問題:罕見個案，與推蹬牆及高頻踢腿有關。游泳屬非承重運動，踝足傷害最不常見(約佔整體傷害 1%)。
    trigger_phase: 蛙鞋訓練、腳踢板、蛙泳踢腿
    who: 過用蛙鞋者、快速增量者、翻滾轉身技術不良者
  epidemiology:
    prevalence: 游泳踝足的專項發生率**目前沒有可引用的來源**。可對照的是 Trikha 等 2022（NCAA D1 泳者 641 人、1030 件健康事件）：足／踝／小腿佔肌肉骨骼傷害 **15.0%（81/540）**，排名第三。蛙鞋相關僅有個案報告（外側踝骨髓水腫、趾伸支持帶水腫，皆為青少年女性精英個案）。
    certainty: 🔵
    evidence_grade: C
    caveat: 2026-08-18 更正（來源解除）：原引「踝部佔游泳整體傷害約 1%」出自 radiologykey.com，該站是教科書章節的未授權轉載、無作者／年份／書名，**不可引用，已解除**；該 1% 數字因此成為孤兒數字，且與 Trikha 2022 的 15.0% 相差一個量級（分組定義不同，不構成嚴格反證，但足以說明不可再引用）。另：Vasiliadis 等 2018 的游泳應力性骨折回顧**主題是肋骨，不是踝足**，不能拿來支撐本條目的踝足流行率。幾乎全靠個案報告與推斷，無控制研究；公開呈現須明標證據等級低；蛙鞋安全劑量無 RCT。
    sources:
    - Trikha R, et al. (2022). Characterizing Health Events and Return to Sport in Collegiate Swimmers. Orthop J Sports Med 10(4):23259671221083588. PMID 35400141
    source_ids:
    - src.trikha-2022-collegiate-swimmer-health-events
  risk_factors:
  - text: 蛙鞋過用/尺寸不合
    grade: Expert
  - text: 快速增加踢腿量
    grade: Expert
  - text: 腳踢板強迫踝背屈
    grade: Expert
