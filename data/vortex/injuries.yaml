    pain_rules: 蛙鞋訓練後前足背輕痛隔日消退 → 減蛙鞋量、評估合適度；持續痛或骨壓痛 → 停蛙鞋、影像排除應力骨折
    rehab: 趾伸肌腱病以踝趾屈/背屈漸進阻力；足底問題以足內在肌強化+小腿拉伸；翻滾轉身技術重建
