- id: exercise-amenorrhea
  zh: 運動性月經功能障礙
  en: Exercise-associated menstrual dysfunction
  category: D-endocrine
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 下視丘-腦垂體-性腺軸
  - 卵巢
  - 腎上腺(雄激素)
  mechanism:
    summary: 運動誘發月經失調(無月經、稀發月經)主要由低能量可及性(LEA)抑制下視丘 GnRH 脈衝 → LH/FSH 下降 → 雌激素合成減少(功能性下視丘性無月經 FHA)。但游泳族群存在另一路徑——高雄激素症(類 PCOS)，不透過下視丘抑制:游泳員雌二醇可維持正常、伴 DHEA-S/雄烯二酮升高，與跑者的低雌激素型不同。臨床意義:高雄激素型骨骼影響可能較小，但 PCOS 相關代謝風險需另評。
    trigger_phase: 長期高訓練量、能量赤字、低體脂、心理壓力
    who: 長期高量訓練者、能量赤字者、低體脂者、可能既有高雄激素傾向者
  epidemiology:
    prevalence: 游泳族群原發性無月經最高 19%、繼發性無月經 0–23.8%、稀發月經 9.5–38.9%；系統性回顧游泳員月經失調平均約 41%；部分小樣本研究指游泳員停經後月經不規則率偏高(一研究達 82%、對照 40%，樣本小且為橫斷面)、雌二醇維持正常伴輕度高雄激素症
    certainty: 🟡
    evidence_grade: B
    caveat: 多為橫斷面，樣本小；高雄激素型 vs 下視丘型非互斥；PCOS 先天 vs 訓練誘發因果方向無法確定；近年無大型前瞻性游泳員月經研究
    sources:
    - Menstrual dysfunction in swimmers, PMID 36361122 / PMC9658102 (已驗證)
    - Swimmer menstrual dysfunction as distinct entity (hyperandrogenism), PMID 7673417 (已驗證)
    source_ids:
    - src.pmc9658102
    - src.pmid-7673417
  risk_factors:
  - text: 能量可及性 <30 kcal/kg FFM/天
    grade: A
  - text: 高訓練量
    grade: B
  - text: 低體脂率
    grade: B
  - text: 心理壓力/飲食失調
    grade: B
  - text: 早期專項化
    grade: B
  prevention:
  - text: 能量攝取監測
    grade: B
  - text: 月經週期紀錄
    grade: C
  - text: 教練知識教育
    grade: Expert
  management:
    red_flags:
    - 原發性無月經(15 歲未初潮) → 就醫
    - 繼發性無月經 >3 月 → 就醫
    - 骨折/飲食失調 → 多科介入
    acute: 排除妊娠及器質病因；評估能量狀態；多科介入
    pain_rules: null
    rehab: 增加能量 → 月經恢復(中位 3–6 月)；疑 PCOS 型轉內分泌科
    functional_progression_criteria:
    - 月經改善
    - 能量狀態恢復
    swim_modifications_in_rehab: null
    return_to_train: 月經改善後漸進恢復
    return_to_compete: 重度 LEA+低 BMD 更謹慎
    prognosis: 下視丘型介入後多恢復；高雄激素/PCOS 型預後更複雜
  population_notes:
    age:
      youth: 早期專項化+高訓練量主因
      adult_beginner: null
      masters: 停經後 RED-S 骨骼風險仍在，月經不再為指標
    sex:
      female: 游泳員月經失調平均約 41%，部分屬高雄激素型
      male: null
    ability:
      para: 資料極缺
    lifecycle: null
  links:
    mechanism_link: female-athlete-triad
    mechanism_link_ids:
    - female-athlete-triad
    technical_link: null
    perception_link: null
  references:
  - citation: Menstrual dysfunction in competitive swimmers, PMC9658102
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc9658102
  - citation: Swimmers as a distinct menstrual entity (hyperandrogenism), PMID 7673417
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmid-7673417
  flags:
    contested:
    - claim: 游泳員月經失調是否為『不同實體』
      consensus_source: 下視丘抑制型為主流機制
      dissent_source: 游泳員可能伴高雄激素型(類 PCOS)，雌二醇正常；樣本均小，兩型非互斥，先天 vs 訓練誘發方向不明
    vintage_warning: true
- id: female-athlete-triad
  zh: 女性運動員三聯症
  en: Female athlete triad
  category: D-endocrine
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 下視丘-腦垂體-性腺軸
  - 骨骼(骨密度)
  - 月經生理
  mechanism:
    summary: 三聯症由三個相互關聯成分構成——低能量可及性(LEA)、月經功能障礙、低骨密度。LEA 是核心驅動子:飲食熱量扣除訓練消耗後可用能量不足，下視丘抑制 GnRH 脈衝，引發月經紊亂，長期低雌激素削弱骨形成。三者連鎖:LEA → 月經失調 → 骨流失，全具備時骨折風險大增。註:RED-S 為涵蓋更廣(含男性、代謝/免疫等)的後繼框架，見 red-s 條目。
    trigger_phase: 能量赤字長期累積、菁英訓練量、青春期不穩定期
    who: 偏瘦/耐力型女性、菁英訓練量者、青春期中後期者
  epidemiology:
    prevalence: 游泳專項系統性回顧（Buchanan 等 2025, J Womens Sports Med）： **低能量可及性約 51%、低骨密度約 12%**；月經失調比例各研究差距極大。納入研究數與泳者總人數在文中有兩種讀法（17 篇納入／478 人來自其中報出人數的 11 篇）， **本條目不採用單一「n=478，17 研究」的寫法**。女性運動員整體「至少有一項三聯症成分」約 40%、完整三聯症約 1–4% 屬跨運動舊估計，非游泳專項。
    certainty: 🟡
    evidence_grade: B
    caveat: 2026-08-18 更正：原寫「游泳族群約 41% 有三聯症風險(系統性回顧 n=478，17 研究)」—— 41% 無法在該回顧摘要中對上，樣本描述亦有歧義，已改寫為可對上的 51%／12% 兩項。另：各研究診斷標準不一；游泳族群月經失調可能含高雄激素型(見 exercise-amenorrhea)，與低雌激素型骨骼影響不同。
    sources:
    - 'Buchanan BK, et al. (2025). Female athlete triad in swimmers: a systematic review. J Womens Sports Med 5(1):30-38. doi:10.53646/ahq2qs39'
    - RED-S Clinical Assessment Tool framework (IOC)
    source_ids:
    - src.buchanan-2025-female-athlete-triad-swimmers
    - src.red-s-clinical-assessment-tool-framework-ioc
  risk_factors:
  - text: 低能量可及性(LEA <30 kcal/kg FFM/天)
    grade: A
  - text: 月經失調 >3 個月
    grade: A
  - text: 飲食失調/限制飲食
    grade: B
  - text: 高訓練量、低體重項目
    grade: B
  - text: 青春期中後期
    grade: B
  prevention:
  - text: 熱量攝取監測與教育
    grade: B
  - text: 教練+醫療整合篩查
    grade: C
  - text: Triad Risk Assessment Tool 風險分級
    grade: B
  management:
    red_flags:
    - 低創傷骨折史 → 就醫
    - BMI <17.5 → 就醫
    - 停經 >6 月 → 就醫
    - 嚴重飲食限制 → 多學科介入
    acute: 多學科介入(營養/心理/運動醫學)；優先恢復能量可及性
    pain_rules: null
    rehab: LEA 糾正 → 月經恢復(6–12 月)→ DXA 監測 BMD
    functional_progression_criteria:
    - 能量可及性恢復
    - 月經恢復
    - 依 RED-S Clinical Assessment Tool 分級放行
    swim_modifications_in_rehab: null
    return_to_train: 能量狀態改善後漸進恢復
    return_to_compete: 重度需月經恢復才全訓練
    prognosis: 及早介入大多恢復月經；BMD 恢復慢需 1–2 年，能否回到峰值不確定
  population_notes:
    age:
      youth: 首次高風險期，延誤影響峰值骨量累積
      adult_beginner: null
      masters: 停經後以骨流失為表現，月經不再為指標
    sex:
      female: 游泳女選手約 41% 風險
      male: 三聯症定義本不含男性(→ RED-S 框架擴展之爭核心)
    ability:
      para: 資料極缺；脊損非重力負荷疊加 LEA 風險尤高
    lifecycle: null
  links:
    mechanism_link: red-s
    mechanism_link_ids:
    - red-s
    technical_link: null
    perception_link: null
  references:
  - citation: 'Buchanan BK, Bergstein VE, Rothschild EF, Coslick A. (2025). The Female Athlete Triad in Swimmers: a Review of Current Literature. J Womens Sports Med 5(1):30-38. doi:10.53646/ahq2qs39（2026-09-04 更正：原寫「JWSM systematic review」為改寫，原題為 a Review of Current Literature；結論「約 4/10 女性泳者具三聯症風險」是 17 篇異質研究的綜整估計，不是單一族群盛行率）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.buchanan-2025-female-athlete-triad-swimmers
  - citation: 'De Souza MJ, Williams NI, Nattiv A, et al. (2014). Misunderstanding the female athlete triad: refuting the IOC consensus statement on Relative Energy Deficiency in Sport (RED-S). Br J Sports Med 48(20):1461-5. PMID 25037200（立場論戰文，非原始研究；作者共 34 人）'
    certainty: 🟡
    verified: true
    source_ids:
    - src.de-souza-2014
  flags:
    contested:
    - claim: 三聯症 vs RED-S 框架
      consensus_source: 2014 起 IOC 擴展為 RED-S(含男性與代謝/免疫)，2023 修訂為 REDs v3
      dissent_source: De Souza 等 2014 發表反駁，主張保留三聯症框架；臨床界雙軌工具並用
    vintage_warning: false
- id: iron-deficiency-swimmer
  zh: 泳者鐵質缺乏（含非貧血性鐵缺）
  en: Iron deficiency in swimmers (including non-anemic iron deficiency)
  category: D-endocrine
  environment:
  - pool
  - open_water
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 紅血球系統
  - 攜氧鏈
  - 肌紅蛋白
  - 細胞色素鏈
  - 認知/疲勞調節
  mechanism:
    summary: 鐵不只用於血紅素——肌紅蛋白、粒線體細胞色素鏈、神經傳導物合成都依賴鐵。鐵缺乏分三階段：① 鐵儲備耗竭（鐵蛋白↓但血紅素正常）；② 紅血球生成減弱（血紅素開始下滑）；③ 缺鐵性貧血。耐力表現在階段 ① 就已下降——光看血紅素會錯失大量「鐵蛋白偏低但 Hb 正常」的選手。
    driver: 鐵蛋白(ferritin) < 20 ng/mL 即視為儲備不足；< 12 ng/mL 為臨床缺鐵；女性比男性更易缺鐵（月經損失+多吃植物來源+紅肉攝取低）
    trigger_phase: 高強度訓練期 / 月經期 / 訓練量驟增期
    who: 女性運動員、青少年成長期者、素食/純素傾向者、月經量大者、訓練量驟增者
    swim_context: 游泳是非衝擊運動，足部撞擊性溶血較跑者少；但訓練強度與量大、運動性發炎（hepcidin 升高抑制吸收）+ 訓練後 24 小時內鐵吸收窗口縮窄，仍易累積缺鐵
  epidemiology:
    prevalence: 女性運動員 11–41% 鐵缺乏（範圍取決於切點與族群）；女子泳者報告 ferritin < 20 ng/mL 比例可達 50%（即使口服鐵補充劑加倍從 20 mg → 40 mg/日，盛行率仍未顯著下降，顯示吸收效率才是瓶頸）
    certainty: 🟡
    evidence_grade: B
    caveat: 2026-08-18 更正（查無此文獻）：本欄原本引用一份「IOC 共識聲明 — Iron in sport」—— **IOC 從未發表過以鐵為主題的共識聲明**，該引用已解除。移除它不影響任何內容，只是拿掉了「有 IOC 背書」的假象。連帶：**11–41%、50%、20→40 mg 三個數字目前只剩 Sim 2019 這份敘事綜述可掛，而該文是轉述層級、非原始研究**，三者皆須視為待查，不進 public 數字。另：「鐵儲備不足」vs「臨床貧血」切點差異大；運動性偽貧血（高血漿量稀釋）會讓 Hb 看似低但其實有益於耐力，要與真鐵缺乏區分。
    sources:
    - 'Sim M, Garvican-Lewis LA, Cox GR, et al. (2019). Iron considerations for the athlete: a narrative review. Eur J Appl Physiol 119(7):1463–1478. PMID 31055680（**敘事綜述，非原始研究亦非系統回顧**；hepcidin 只是其中一節，引用時屬綜述轉述層級）'
    source_ids:
    - src.sim-2019
  risk_factors:
  - text: 女性（月經損失約每月 30 mg）
    grade: A
  - text: 素食/純素傾向（植物來源鐵吸收率僅 5–10% vs 動物來源 25–30%）
    grade: A
  - text: 維生素 C 攝入不足（抑制非血基質鐵吸收）
    grade: B
  - text: 高強度訓練期 hepcidin 升高（運動後 3–6 小時吸收降低）
    grade: B
  - text: 咖啡因/茶/鈣質與鐵補充劑同服（抑制吸收 30–60%）
    grade: B
  - text: 青少年成長期（生長性需求疊加運動性損失）
    grade: A
  prevention:
  - text: 女性運動員年度 ferritin 監測（建議目標 > 30 ng/mL；耐力選手 > 35 ng/mL）
    grade: B
  - text: 動物來源鐵優先（紅肉、肝、貝類、深色禽肉）
    grade: A
  - text: 植物來源鐵 + 維生素 C 同食（菠菜+柑橘/番茄/紅椒）
    grade: A
  - text: 訓練後 30 分鐘內勿補鐵（hepcidin 高峰），改在隔天清晨空腹或訓練前 2 小時前
    grade: B
  - text: 鐵補充劑與咖啡因/鈣分隔 ≥2 小時
    grade: B
  management:
    red_flags:
    - Hb < 11.0 g/dL（女）或 < 13.0 g/dL（男）+ 疲倦/頭暈/心悸 → 就醫排除其他病因
    - ferritin < 12 ng/mL + 持續疲勞 → 全套貧血評估
    - 口服鐵補充 8 週後 ferritin 仍 < 20 → 排除吸收障礙（celiac、H. pylori、IBD）
    acute: 若 ferritin < 30 ng/mL：硫酸亞鐵 100–200 mg 元素鐵/日 + 維生素 C 500 mg 同服（鐵吸收提升約 30%）；避免咖啡因/鈣/茶於同時段
    pain_rules: null
    rehab: ferritin 回升期間（4–12 週）：高強度訓練量減半，重點放在技術與基礎有氧；恢復後逐漸加量
    functional_progression_criteria:
    - ferritin > 30 ng/mL（耐力選手 > 35）
    - 主觀疲勞回到基線
    - 靜息心率回到基線
    swim_modifications_in_rehab:
    - 氧合不足時高強度訓練品質低，浪費窗口；改成技術 drill + 基礎有氧
    - 監測訓練後恢復時間（鐵缺乏者顯著延長）
    return_to_train: ferritin > 30 ng/mL + 主觀疲勞回正 → 漸進回歸（每週量增 ≤10%）
    return_to_compete: ferritin > 35（耐力）+ Hb 在正常範圍 + 訓練質量已恢復
    prognosis: 純鐵缺乏無潛在病因者 8–12 週可完全恢復；忽視持續高量訓練則演變為慢性疲勞、表現停滯、過度訓練症候群
- id: oral-contraceptives-performance
  zh: 口服避孕藥對運動表現的影響
  en: Oral contraceptives and athletic performance
  category: D-endocrine
  environment:
  - pool
  - open_water
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 下視丘-腦下垂體-性腺軸
  - 雌激素受體
  - 心血管自主神經
  - 骨代謝
  - 肌肉修復
  mechanism:
    summary: 口服避孕藥（OC）抑制內源性雌激素與黃體素的週期性波動，改以外源合成荷爾蒙維持相對穩定濃度。 **可測到的表現影響比一般想像小得多，而且集中在單一指標上。** 目前最直接的證據是一項雙盲安慰劑對照 RCT（Lebrun 2003，**n = 14** 名 VO₂max ≥ 50 ml/kg/min 的高訓練量女性）：使用三相型 OC 後 **VO₂max 下降 4.7%**（安慰劑組 +1.5%），皮脂厚度總和顯著上升。 **但同一研究直接測量的無氧速度、有氧耐力（90% VO₂max 力竭時間）、等速肌力、最大通氣量、心率、血比容全部沒有顯著差異。** 拉到族群層級，涵蓋 42 篇研究、590 名受試者的系統回顧與統合分析（Elliott-Sale 2020）結論是： OC 使用者的表現**平均可能略遜於自然月經週期女性，但群體層級效果極可能是微不足道的（trivial）**，且研究間變異大、83% 的納入研究品質為中等以下；作者明言 **「現有證據不足以支持對 OC 使用與否給出通則性建議」，應採個別化評估**。該分析另指出**表現在 OC 週期內各時點是一致的**。〔2026-08-17 更正：舊稿寫「VO₂max 降 10–11%（範圍 6–15%）」，實測值是 4.7%，舊數字疑似誤讀 Lebrun 文中「兩名受試者下降 4 與 9 ml/kg/min」的絕對值；一併撤除。〕
    driver: 劑量/配方型別與影響強度的高低排序（三相型 > 單相型 > 低劑量）在現有文獻中**尚未建立**——Lebrun 2003 只測了三相型一種配方，Elliott-Sale 2020 指出納入研究配方混雜且異質性高，無法據以排序。此欄保留為待驗證問題，不作為選配方的依據。
    trigger_phase: 尚無證據指出特定距離或項目受影響較大（見 swim_context）
    who: 服用 OC 的女性選手（尤其高訓練量者）；以及在未與教練/運科溝通的情況下開始或更換配方者
    swim_context: '**舊稿的「400m 以上耐力項目受影響顯著」已於 2026-08-17 撤除——它與自己引用的研究直接衝突。** Lebrun 2003 明確測量了有氧耐力（90% VO₂max 力竭時間）並**未發現顯著變化**，無氧速度測試同樣無差異。也就是說：可測到的是實驗室 VO₂max 這個生理指標下降， **不是**任何一項實際表現指標下降。VO₂max 降低是否會轉譯成 400m 以上項目的成績差異，現有證據無法回答（Lebrun n=14 且未測比賽表現；Elliott-Sale 2020 的群體效果為 trivial）。對教練的實務意義：OC 使用不應被當成解釋選手耐力表現起伏的預設原因，也不應成為建議選手換藥或停藥的理由——那是醫療決策，且證據強度不支持通則。'
  epidemiology:
    prevalence: OC 在女性運動族群中使用普遍（方向性描述）。**舊稿的「使用率 30–50%」已於 2026-08-17 撤除**：它掛在兩個來源下，但一個查無此文獻（Bushman 2006），另一個（Elliott-Sale 2020）是表現統合分析、根本不產出使用率數字。要恢復量化使用率必須另找流行病學調查。
    certainty: 🟡
    evidence_grade: B
    caveat: '**2026-08-17 來源健檢：本條目原有兩層錯誤，均已更正。** ① **引用不存在**：舊稿引的「Bushman et al. 2006, Phys Sportsmed，早期 OC × VO₂max 量化」在 PubMed 查無——該作者在該期刊 0 筆；唯一真實的 Bushman × OC 文獻是 J Sports Med Phys Fitness 2006 的**無氧功率**研究，期刊與測量指標皆不符。VO₂max 數字的真正出處是 Lebrun 2003（已補入來源清單），且實測值 4.7%、非舊稿的 10–11%。 ② **引用與主張不對應**：Elliott-Sale 2020 被誤記為 Br J Sports Med（實為 Sports Med），且被用來支撐「使用率 30–50%」——那是表現統合分析，不含使用率資料。現存證據的固有限制：Lebrun 2003 **n=14**、只測一種三相型配方、未測比賽表現； Elliott-Sale 2020 納入研究 83% 品質中等以下、配方混雜、研究間變異大；新一代低劑量配方研究稀少。'
    sources:
    - 'Lebrun CM, et al. (2003). Decreased maximal aerobic capacity with use of a triphasic oral contraceptive in highly active women: a randomised controlled trial. Br J Sports Med 37(4):315–320. PMID 12893716'
    - 'Elliott-Sale KJ, et al. (2020). The Effects of Oral Contraceptives on Exercise Performance in Women: A Systematic Review and Meta-analysis. Sports Med 50(10):1785–1812. PMID 32666247'
    source_ids:
    - src.lebrun-2003-triphasic-oc-vo2max
    - src.elliott-sale-2020
  risk_factors:
  - text: 三相型配方——**唯一有 RCT 直接測到 VO₂max 下降的配方型別（Lebrun 2003, n=14）**。但這不等於「三相型比單相型差」：該研究沒有設單相型對照組，跨配方比較尚未做過
    grade: C
  - text: 高劑量配方（每錠 > 35 μg ethinylestradiol）——**劑量-反應關係在現有文獻中未建立**，此條原標 B 屬過度宣稱，2026-08-17 降級為待驗證假說
    grade: Expert
  - text: 〔已撤除〕「耐力為主項目（400m 以上 / 開放水域 / 鐵人三項）受影響較大」——2026-08-17 撤除：Lebrun 2003 直接測量有氧耐力（90% VO₂max 力竭時間）**未發現顯著變化**，此條與其唯一證據來源相反
    grade: Expert
  - text: 選手未告知教練/運科 OC 使用（影響的是基線判讀與溝通，不是生理風險本身）
    grade: Expert
  prevention:
  - text: 避孕方式的選擇是選手與醫師的醫療決定；教練的角色是知情與配合，不是建議用哪一種
    grade: Expert
  - text: 〔已撤除〕「對耐力選手優先選擇低劑量單相型或非荷爾蒙避孕（IUD、保險套）」——2026-08-17 撤除：Elliott-Sale 2020（42 篇研究 / 590 人的統合分析）明確結論為**現有證據不足以支持對 OC 使用與否給出通則性建議，應個別化評估**。以運動表現為由建議特定避孕方式，既無證據支撐，也超出教練的角色界線
    grade: Expert
  - text: 若要換配方，避開賽季關鍵期較為穩妥（理由是「未知變化不宜疊在關鍵期」的一般性風險管理，**不是**因為已知會掉表現）；舊稿的「賽前 12 個月」是無來源的具體數字，已撤除
    grade: Expert
  - text: 教練知道選手是否使用 OC，有助於判讀 VO₂max 等實驗室基線的變動；但**不得反過來用 OC 使用解釋成績起伏**——現有證據顯示實際表現指標無顯著差異
    grade: Expert
  management:
    red_flags:
    - OC 使用後出現腿部腫脹疼痛、胸痛、呼吸困難 → 立即就醫排除血栓
    - 急性嚴重頭痛 + 視覺變化 → 就醫評估腦血管事件
    - 黃疸或上腹劇痛 → 評估肝臟反應
    acute: null
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 若選手主動關切 OC 是否影響自己的表現：先確認其他更常見的解釋（訓練量、睡眠、鐵儲存量、能量可用性）已排除，再與醫師討論；任何調整都由醫師決定，並在調整前後各留一次可比較的測驗
    swim_modifications_in_rehab: null
    return_to_train: null
    return_to_compete: null
    prognosis: '**現有文獻未回答停用後的恢復問題**：Lebrun 2003 是單向設計（濾泡期 → OC 期），沒有停藥後的追蹤測量。舊稿的「停用後 2–3 個月 VO₂max 通常回升」是無來源的具體時程，已於 2026-08-17 撤除。可以說的只有：該研究觀察到的是 VO₂max 這一項生理指標的變化，而非任何實際表現指標的下降。'
- id: red-s
  zh: 相對能量不足（RED-S）
  en: Relative Energy Deficiency in Sport (RED-S)
  category: D-endocrine
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 下視丘-腦下垂體-性腺軸
  - 骨骼(骨密度)
  - 內分泌系統
  - 心血管/代謝/免疫多系統
  mechanism:
    summary: 能量攝取長期低於運動消耗(low energy availability, LEA)→身體下調非必要功能以保命→月經/睪固酮、骨代謝、代謝率、免疫、心血管、心理多系統受抑。不是單一疾病而是低能量可用性引發的多系統症候群。女性運動員三聯症(低能量可用性+月經失調+低骨密度)是 RED-S 的子集。
    driver: 能量可用性 = (攝取 − 運動消耗) / 去脂體重；< 30 kcal/kg FFM/day 為臨床關切閾值（具體閾值待核實，個體差異大）
    swim_context: 泳者每日高熱量消耗 + 體型/外觀壓力 + 大量陸訓，能量赤字易被低估
    who: null
  epidemiology:
    prevalence: 女性運動員 LEA/三聯症盛行率報導範圍極廣；游泳專項數字待 WebFetch 核實。青少年女子泳者 disordered eating 盛行率 25–31%、月經失調 3–65%（範圍極廣反映定義差異），是同年齡男性與非運動族群的數倍
    certainty: 🟡
    evidence_grade: B
    caveat: 2026-08-18 更正（重複登錄）：本欄原本掛了兩筆引用，實為同一份 IOC 共識，已刪去重複的那筆、只保留一個——原寫法會讓一份文獻看起來像兩份獨立支撐。另：引用 IOC 共識必須標版本（2014／2018／2023 三版結論不同），本條目數字尚未逐版對回。定義與篩檢工具(LEAF-Q／REDs CAT2)差異大→盛行率不可橫向比較；男性 RED-S 長期被低估。
    sources:
    - Mountjoy M, et al. (2023). 2023 IOC consensus statement on REDs. Br J Sports Med 57(17):1073-1097. doi:10.1136/bjsports-2023-106994
    source_ids:
    - src.ioc-red-s-2014-2018-2023-doi
  risk_factors:
  - text: 能量攝取不足以匹配訓練量（有意或無意）
    grade: B
  - text: 刻意限食/體重控制/外觀壓力
    grade: B
  - text: 訓練量驟增未相應增加攝取
    grade: B
  - text: 飲食失調/失調性飲食行為
    grade: B
  - text: 對能量需求的知識不足（青少年尤甚）
    grade: C
  prevention:
  - text: 能量攝取匹配訓練消耗，重訓練日加量(fuelling)
    grade: B
  - text: 定期監測月經狀態(女)/晨間勃起或性慾(男)作為能量可用性指標
    grade: C
  - text: 教練/家長/醫療三方對體重與飲食言語謹慎，避免觸發限食
    grade: C
  - text: 青少年成長期格外保障能量與鈣/維D，保護骨量累積窗口
    grade: B
  management:
    red_flags:
    - 停經 ≥3 個月(原發或續發) → 內分泌/婦科評估，勿視為『訓練正常現象』
    - 反覆疲勞性骨折 → 評估骨密度與能量可用性
    - 極端限食/暴食清除行為/體重驟降 → 飲食失調專業介入
    - 心搏過緩+姿態性低血壓+電解質異常 → 醫療評估(嚴重 LEA/飲食失調可致命)
    acute: 非急性外傷模式；核心是『提升能量可用性』——增加攝取、降低訓練消耗，多由運動醫學+營養+(必要時)心理團隊處理
    pain_rules: null
    rehab: 能量再平衡為主軸；疲勞性骨折依部位另循骨折復健；恢復月經/骨代謝指標為療效錨
    functional_progression_criteria:
    - 能量可用性回升(攝取-消耗平衡)
    - 月經恢復(女)/賀爾蒙指標回升
    - 骨密度穩定或改善、無新發疲勞性骨折
    swim_modifications_in_rehab:
    - 暫時下調訓練量/陸訓負荷以縮小能量赤字，非『加練消耗』
    - 疲勞性骨折期依部位調整踢腿/出發跳台負荷
    return_to_train: 能量可用性恢復 + 無活動性疲勞性骨折 + 團隊(醫療/營養/心理)綠燈 → 漸進加量
    return_to_compete: 賀爾蒙/骨骼/心理指標穩定 + 訓練耐受全量無症狀 → 復賽；RED-S CAT2 風險分層輔助決策
    prognosis: 能量再平衡後多數可逆；但青少年期累積的骨量損失可能不完全回復→長期骨折風險
  population_notes:
    age:
      youth: 成長期骨量累積窗口受損影響終生峰值骨量；青少年競技泳者高風險
      adult_beginner: null
      masters: 成人/高齡能量赤字疊加既有骨流失，骨折風險升
    sex:
      female: 三聯症(LEA+月經失調+低骨密度)為經典表現
      male: RED-S 同樣發生但長期被低估；表現為睪固酮下降、骨密度低、表現停滯
    ability:
      para: 殘疾運動員能量需求評估更複雜(體組成/截肢/痙攣消耗)，篩檢工具未充分驗證
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Mountjoy M, Ackerman KE, Bailey DM, et al. (2023). 2023 IOC consensus statement on Relative Energy Deficiency in Sport (REDs). Br J Sports Med 57(17):1073-1097. PMID 37752011（2026-09-04 定版：原登錄未標版本，本條固定指向 2023 版；2014／2018 版結論不同，須另建條目）
    certainty: 🟢
    verified: true
    source_ids:
    - src.ioc-red-s-2014-2018-2023-doi
  - citation: Nattiv A, Loucks AB, Manore MM, Sanborn CF, Sundgot-Borgen J, Warren MP. (2007). American College of Sports Medicine position stand. The female athlete triad. Med Sci Sports Exerc 39(10):1867-82. PMID 17909417（2026-09-04 定版：原登錄未標年份，本條指定為 2007 現行版；1997 首版 PMID 9140913 為不同文獻）
    certainty: 🟡
    verified: true
    source_ids:
    - src.nattiv-2007
  flags:
    contested:
    - claim: 三聯症 vs RED-S 框架範圍
      consensus_source: IOC 主張 RED-S 為更廣的多系統框架，涵蓋男性與非月經系統
      dissent_source: 部分學者(如 ACSM 傳統三聯症陣營)主張保留三聯症的明確臨床定義，質疑 RED-S 證據強度
    vintage_warning: false
- id: stress-fracture-swimmer
  zh: 游泳員疲勞性骨折（肋骨為主）
  en: Stress fracture in swimmers (rib-predominant)
  category: D-endocrine
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 肋骨
  - 恥骨枝
  - 股骨頸
  - 蹠骨
  - 骨重塑單位
  mechanism:
    summary: 疲勞性骨折係骨骼在反復次最大應力下微損傷積累超過重塑修復所致。游泳水中低衝擊本應保護骨骼，但以下使游泳員仍有風險:①陸訓(跑步/跳躍/核心)的重力負荷；②非重力負荷使 BMD 整體偏低、骨骼對同等壓力耐受度下降；③RED-S 骨骼代謝異常；④肋骨在划水(尤蝶式)時承受反復軀幹旋轉拉力。游泳員最常見為肋骨疲勞性骨折，機制是軀幹肌肉拉力而非體重衝擊——與跑步的下肢衝擊型骨折不同。
    trigger_phase: 軀幹反復旋轉(尤蝶式)、陸訓負荷突增
    who: RED-S/低 BMD 者、陸訓負荷突增者、蝶式為主泳式者、既往疲勞性骨折史者
  epidemiology:
    prevalence: 2017 年前僅約 10 篇游泳員應力骨折研究，肋骨最常見(其他:第一肋、恥骨枝、股骨頸、蹠骨)；RED-S 相關:月經失調女性骨折風險 +4.5 倍、兩項以上三聯症成分 +4.7 倍、單項 LEA +1.1 倍
    certainty: 🟠
    evidence_grade: B
    caveat: 2026-08-18 更正（重複登錄）：本欄原掛的兩筆引用（一筆以期刊卷期登錄、一筆以標題登錄）其實是同一篇 Vasiliadis 2018，已合併為一筆。 **使用邊界**：該回顧僅納入 10 篇、多為個案報告、**無合併統計亦無分母**，可支撐「泳者應力性骨折罕見且以肋骨為主」，**不能導出發生率**；檢索截止 2017 年 1 月（🟡）。另：肋骨骨折常誤診為肌肉拉傷延誤 4–6 週；某些倍率數字為二手綜述。
    sources:
    - Vasiliadis AV, Lampridis V, Georgiannos D, Bisbinas I. (2018). Swimmers Are At Risk For Stress Fractures? A Systematic Review. Int J Kinesiol Sports Sci 6(3):25-31. doi:10.7575/aiac.ijkss.v.6n.1p.25
    - RED-S and bone stress injury risk, PMID 36479178 / PMC9724109 (已驗證)
    source_ids:
    - src.stress-fractures-in-swimmers-systematic-revi
    - src.pmc9724109
  risk_factors:
  - text: RED-S/低 BMD
    grade: A
  - text: 月經失調
    grade: A
  - text: 陸訓負荷突然增加
    grade: B
  - text: 蝶式為主要泳式(肋骨拉力)
    grade: B
  - text: 訓練量快速增加
    grade: B
  - text: 飲食失調
    grade: B
  - text: 疲勞性骨折既往史
    grade: A
  prevention:
  - text: RED-S 預防(能量/月經/BMD 監測)
    grade: A
  - text: 漸進式陸訓量(10% 規則)
    grade: C
  - text: 軀幹穩定肌訓練
    grade: C
  - text: 技術糾正降低蝶式扭矩
    grade: Expert
  management:
    red_flags:
    - 局部點狀骨骼壓痛(尤肋骨) → 就醫
    - 活動劇痛 → 就醫
    - 已知低 BMD 新發疼痛 → 就醫
    acute: 影像確認(X-ray 常陰性，需 MRI/骨掃描)；停止負重/疼痛活動；骨科評估。注意肋骨骨折常誤診為肌肉拉傷
    pain_rules: null
    rehab: 4–12 週相對休息(依嚴重度/部位)；水中跑步等低衝擊交叉訓練；RED-S 同步治療
    functional_progression_criteria:
    - 癒合+疼痛消失
    - RED-S 根源同步處理
    swim_modifications_in_rehab:
    - 游泳本身可較早恢復(低衝擊)
    - 陸訓最後恢復
    return_to_train: 以癒合+疼痛消失為準，游泳先於陸訓恢復
    return_to_compete: RED-S 控制+無痛後回賽
    prognosis: 肋骨骨折 6–8 週多癒合，但不解決 RED-S 根源則反覆
  population_notes:
    age:
      youth: RED-S+肋骨骨折疊加，常被誤為胸肌拉傷
      adult_beginner: null
      masters: 骨量自然衰退使閾值降低，需更積極 BMD 篩查
    sex:
      female: 月經失調為主要風險放大因子
      male: null
    ability:
      para: 截肢/脊損骨骼負荷分佈異常，特定部位風險未系統研究
    lifecycle: null
  links:
    mechanism_link: swimmer-low-bone-density
    mechanism_link_ids:
    - swimmer-low-bone-density
    technical_link: null
    perception_link: null
  references:
  - citation: Vasiliadis AV, Lampridis V, Georgiannos D, Bisbinas I. (2018). Swimmers Are At Risk For Stress Fractures? A Systematic Review. Int J Kinesiol Sports Sci 6(3):25-31
    certainty: 🟢
    verified: true
    source_ids:
    - src.stress-fractures-in-swimmers-systematic-revi
  - citation: RED-S and bone stress injury, PMC9724109
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc9724109
  flags:
    contested:
    - claim: 游泳員肋骨疲勞性骨折是否『常見』
      consensus_source: 肋骨為游泳員最常見應力骨折部位
      dissent_source: 僅約 10 篇研究，水中訓練直接致骨應力理論極低，但高強度划水軀幹扭矩不可忽略
    vintage_warning: false
- id: swimmer-low-bone-density
  zh: 游泳員低骨密度
  en: Low bone mineral density in swimmers
  category: D-endocrine
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 骨骼(皮質骨/小樑骨)
  - 成骨細胞-蝕骨細胞重塑單位
  mechanism:
    summary: 游泳是典型非重力負荷運動——水中地面反作用力近零，骨骼缺乏機械負荷刺激，成骨細胞活性不足。游泳員 BMD 往往接近靜態對照組，顯著低於同齡重力負荷型運動員(跑步/籃球/體操)。青少年若僅游泳，正值骨量累積關鍵期(10–20 歲)，錯失峰值骨質，後果延伸至成年骨折及骨質疏鬆風險。此框架與跑步相反:跑步是高衝擊成骨運動，游泳無此效益。
    trigger_phase: 純游泳專項、缺乏重力負荷交叉訓練、骨量累積期
    who: 純游泳青少年、合併 LEA/月經失調者、鈣/維生素 D 攝取不足者
  epidemiology:
    prevalence: 系統性回顧:游泳員 vs 靜態對照 BMD 無顯著差異，但顯著低於重力負荷運動員；小樣本研究近端脛骨皮質骨面積低 13.8%、皮質骨體積密度低 6.0%(橈骨/遠端脛骨無顯著差異，power 偏低)；阻力/跳躍訓練可改善青少年游泳員骨密度
    certainty: 🟡
    evidence_grade: B
    caveat: meta-analysis 多引 2000–2015 研究；游泳員專屬 BMD 介入研究僅約 2 篇且樣本小；長期實際骨折增加缺大型前瞻性結果數據
    sources:
    - Site-specific BMD in female swimmers, PMC7039474 (已驗證)
    - Resistance/impact BMD intervention, PMID 39833826 / PMC11744971 (已驗證)
    source_ids:
    - src.pmc7039474
    - src.pmc11744971
  risk_factors:
  - text: 純游泳專項、缺乏重力負荷交叉訓練
    grade: A
  - text: 低能量可及性合併
    grade: A
  - text: 月經失調/低雌激素
    grade: A
  - text: 早期專項化
    grade: B
  - text: 鈣/維生素 D 攝取不足
    grade: B
  prevention:
  - text: 陸上負重/阻力訓練(每週 ≥2 次)
    grade: B
  - text: 跳繩/跳躍訓練補充
    grade: B
  - text: 鈣 1,000–1,300 mg/天(青少年)+維生素 D
    grade: B
  - text: 月經週期監測(間接指標)
    grade: B
  management:
    red_flags:
    - 低創傷骨折 → 就醫
    - DXA Z-score <-2.0 → 就醫
    - 月經失調 >6 月 → 就醫
    acute: 多科評估(骨科/內分泌/營養)；排除繼發性骨質疏鬆
    pain_rules: null
    rehab: 增能量可及性、補鈣/維生素 D、加負重訓練；高風險者每 1–2 年 DXA
    functional_progression_criteria:
    - 能量可及性改善
    - 月經恢復
    - DXA 追蹤穩定/改善
    swim_modifications_in_rehab: null
    return_to_train: 持續游泳並加入陸上負重，不需停水
    return_to_compete: null
    prognosis: 能量改善+月經恢復後 BMD 可增，但恢復慢(1–2 年)，能否達年齡期望值不確定
  population_notes:
    age:
      youth: 骨量累積關鍵期，早期介入效益最大；高風險者常規 DXA
      adult_beginner: null
      masters: 對老年骨量無明顯額外保護(相比散步/慢跑)，但維持肌肉間接減少跌倒骨折
    sex:
      female: 研究較多，與 LEA/月經失調交互
      male: 男性游泳員低 BMD 亦有記錄，研究遠少於女性
    ability:
      para: 輪椅運動員非重力負荷疊加更嚴重，低 BMD 高盛行率
    lifecycle: null
  links:
    mechanism_link: female-athlete-triad
    mechanism_link_ids:
    - female-athlete-triad
    technical_link: null
    perception_link: null
  references:
  - citation: Site-specific bone density in female swimmers, PMC7039474
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc7039474
  - citation: Bone density intervention in low-impact athletes, PMC11744971
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11744971
  flags:
    contested:
    - claim: 游泳員低 BMD 是否導致實際骨折增加
      consensus_source: 游泳員 BMD 低於重力負荷運動員為共識
      dissent_source: 缺大型前瞻性骨折結果；水中浮力負面效應能否完全被陸訓抵消不確定
    vintage_warning: false
- id: diving-cervical-injury
  zh: 跳水 / 入水頸椎與脊髓損傷
  en: Diving-related cervical spine and spinal cord injury
  category: E-acute-trauma
  environment:
  - pool
  - open_water
  - surf
  sport_variant:
  - swim
  - diving_entry
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 頸椎(C4–C6)
  - 脊髓
  - 椎間盤/韌帶
  mechanism:
    summary: 入水頭頂先觸底，頸椎受軸向壓縮力(axial loading)致爆裂性骨折或骨折脫位；脊髓同時受壓/撕裂/缺血→四肢癱(tetraplegia)。關鍵物理條件：入水角度過陡+水深不足以吸收減速距離。
    trigger_phase: 從池邊/跳水台/石礁/防波堤往不明深度水域頭朝下跳；競賽出發台起跳角度過陡；撞上隱藏障礙(礁石/沙洲)
    who: 年輕男性(97.5–98.7%)；非正式場合、下午/傍晚、夏日水域；首次使用該場地者
  epidemiology:
    prevalence: 美國每年約 800 起跳水致脊髓損傷(約 90% 永久癱)；90% 發生於水深 <6 英尺(1.83m)、57% <4 英尺(1.22m)；受傷節段 C5 最常見(60.9%)；入院 55% 為完全性四肢癱(AIS A)
    certainty: 🟢
    evidence_grade: B
    caveat: 「每年 800 起」為多個美國傷害登記的廣泛引用估計(非單一 peer-reviewed 計數)；跳水佔所有脊髓損傷 1.2–22%(族群/登記系統差異大)。 **使用邊界（2026-08-18 補）**：Barss 等 2008 的魁北克 44 年研究**回收率僅 44%**，存在選擇偏誤；其樣本以**私人／住家泳池的休閒式跳水**為主， **不是競賽出發台跳水**——本條目談出發台時不得直接套用其數字。資料涵蓋至 2004 年（🟡）。
    sources:
    - Cervical spine injuries 34 patients(C5 節段數據), PMC2899837 (已驗證)
    - Spinal injuries Aegean Coast(24h 內減壓與恢復), PMC8192199 (已驗證)
    - Barss P, et al. (2008). Risk factors and prevention for spinal cord injury from diving, Quebec 1963-2004. Accid Anal Prev 40(2):787-97. PMID 18329434
    source_ids:
    - src.pmc2899837
    - src.pmc8192199
    - src.quebec-44-year-diving-sci-study-sciencedirec
  risk_factors:
  - text: 水深不足(<1.5m)——最強可改變風險因子
    grade: A
  - text: 飲酒(41.7% 案例涉及)
    grade: B
  - text: 年輕男性(16–35 歲，社會風險行為)
    grade: B
  - text: 未知水域/首次使用場地(無法判斷深度/障礙)
    grade: B
  - text: 無救生員在場(延誤急救)
    grade: B
  - text: 缺乏正式出發台訓練(競賽情境入水角度過陡)
    grade: Expert
  prevention:
  - text: 禁止在水深 <1.35m(競賽出發，World Aquatics)/<1.8m(教學跳水，另需前方淨空 7.6m)/<2.74m(一般跳水，美紅十字)水域頭朝下入水——三個門檻對應三種情境，不可互相代換
    grade: A
  - text: 陌生水域一律腳先入水
    grade: A
  - text: 競賽出發台須接受正式指導(僅 21.7% 教練用機構制定的潛水進展協議)
    grade: B
  - text: 禁止在私人/旅館泳池跳水(普遍 <1.5m)
    grade: B
  - text: 清楚設置水深標示與『禁止跳水』標誌
    grade: Expert
  - text: 飲酒後禁止入水
    grade: B
  management:
    red_flags:
    - 入水後頸/背劇痛+四肢麻木/刺痛/無力 → 立刻啟動脊椎預防措施
    - 意識不清漂浮水面 → 假定存在脊椎傷害直至排除
    - 呼吸困難(頸脊髓損傷可影響膈神經致呼吸衰竭) → 緊急
    acute: 脊椎預防序列：水中面朝上 log roll 保持頭頸軀幹直線(不扭不彎)維持氣道→多人協助移至脊板頭頸軀幹同一直線→頸圈/側面穩定物固定→立刻 EMS(不可自行起身/步行)→呼吸停止則維持頭頸穩定下 CPR(jaw-thrust，避免頭後仰)。傷後 24 小時內手術減壓與不完全損傷的神經恢復相關
    pain_rules: null
    rehab: 水療(aquatic therapy)為脊髓損傷主要復健工具；頸椎固定後須影像確認骨癒合再規劃水中活動
    functional_progression_criteria:
    - 完全性四肢癱(AIS A)：幾乎不可能回競技游泳，水療為主
    - 不完全損傷(AIS B–D)：神經外科/復健科評估後個別化，回水前功能性評估
    swim_modifications_in_rehab: null
    return_to_train: 依損傷完全性個別化；不完全損傷經神外/復健評估後漸進
    return_to_compete: null
    prognosis: 完全損傷神經改善率低；不完全損傷(AIS B–D)預後顯著較好；整體『outcomes still unsatisfactory』。早期(<24h)減壓與不完全損傷恢復相關
  population_notes:
    age:
      youth: 成人監督缺失或允許跳水時暴露於風險
      adult_beginner: null
      masters: 跌入水中(非主動跳水)為不同機制(見 poolside-slip/drowning)
    sex:
      male: 97–98% 案例(社會風險行為+飲酒)
      female: 明顯低風險(<3%)
    ability:
      para: 潛在風險尚無充分文獻
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: 競賽出發台入水角度技術(racing start)——與出發台撞擊傷共享預防
    technical_link_ids:
    - starts-turns.tech.42
    - starts-turns.tech.13
    perception_link: null
  references:
  - citation: DeVivo MJ, Sekar P. (1997). Prevention of spinal cord injuries that occur in swimming pools. Spinal Cord 35(8):509-15. PMID 9267915
    certainty: 🟢
    verified: true
    source_ids:
    - src.devivo-1997
  - citation: Cervical spine injuries 34 patients, PMC2899837
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc2899837
  - citation: Overview of Spinal Injuries Aegean Coast(24h decompression), PMC8192199
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc8192199
  - citation: 'Ull C, et al. (2021). Spinal Cord Injury With Tetraplegia in Young Persons After Diving Into Shallow Water: What Has Changed in the Past 10 to 15 Years? Global Spine J 11(8):1238-1247. PMID 32909818（2026-09-04 更正：SAGE 是出版商，期刊為 Global Spine J）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.ull-2021
  - citation: Safety Training Awards (STA). (2023-03-13). STA Technical Notice Regarding World Aquatics and Change to Diving Depth Rules（競賽出發台最小水深由 0.9 m 提高至 1.35 m，自端牆 1 m 延伸至至少 6 m；教學跳水另為 1.8 m 且前方淨空 7.6 m。屬 STA 對 World Aquatics 規則變更的技術通告，非場館規則原文）
    certainty: 🟢
    verified: true
    source_ids:
    - src.sta-2023-world-aquatics-diving-depth
  flags:
    contested:
    - claim: 各組織最低水深標準不一致
      consensus_source: 禁止淺水跳水、陌生水域腳先入水為強烈共識
      dissent_source: FINA/World Aquatics 1.35m(競賽) vs 美紅十字 2.74m(一般跳水)——適用情境不同
    vintage_warning: true
- id: flip-turn-wall-push
  zh: 轉身 / 蹬牆相關急性傷
  en: Flip-turn and wall-push acute injuries
  category: E-acute-trauma
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - 蹬牆踝/足扭傷
  - 蹬牆膝過伸
  - 轉身腕/手撞牆
  - 蹬牆下背急性痛
  structures:
  - 踝/足
  - 膝
  - 腕/手
  - 腰椎/下背
  mechanism:
    summary: 翻滾轉身在牆面瞬間產生高爆發離心-向心負荷。蹬牆相足踝若角度不正（足背屈/內翻）或牆面濕滑打滑→踝扭傷；膝在屈曲蹬伸瞬間若過度伸展或扭轉→髕股/半月板應力。轉身時手臂未及時收回或誤判牆距→腕/指撞牆。蹬牆爆發伴軀幹屈伸，核心控制不足者下背急性肌肉拉傷。多為技術或疲勞末端時序失準所致。
    trigger_phase: 翻滾觸牆-蹬牆相、轉身入水手臂位置相、疲勞末段反覆轉身
    who: 競技泳者（高頻轉身）、轉身技術未成熟青少年、疲勞訓練末段、誤判牆距者
  epidemiology:
    prevalence: 無可靠獨立流病數字——轉身/蹬牆急性傷多併入一般游泳傷害統計，未單獨計列
    certainty: 🟡
    evidence_grade: C
    caveat: 缺乏針對轉身機制的前瞻傷害登記；多為個案或生物力學研究外推
    sources:
    - Flip-turn kinetics 生物力學研究, PMC6409673 (已驗證 URL)
    - Swimming injuries narrative review, PubMed 33010194 (已驗證)
    source_ids:
    - src.pmc6409673-b
    - src.pmid-33010194
  risk_factors:
  - text: 轉身技術未成熟（足踝角度/牆距判斷）
    grade: Expert
  - text: 牆面濕滑/觸牆板老化打滑
    grade: Expert
  - text: 疲勞末段時序失準
    grade: B
  - text: 核心控制不足（蹬牆下背代償）
    grade: Expert
  - text: 既往踝/膝不穩定
    grade: B
  prevention:
  - text: 系統化轉身技術教學（觸牆時機/足位/牆距）
    grade: Expert
  - text: 防滑觸牆板與良好維護
    grade: Expert
  - text: 核心穩定訓練支撐蹬牆爆發
    grade: B
  - text: 疲勞時降低轉身強度避免時序失準
    grade: Expert
  management:
    red_flags:
    - 蹬牆後踝/膝即刻腫脹+無法承重 → 韌帶撕裂/骨折疑慮，影像評估
    - 撞牆後腕/指變形劇痛 → 骨折疑慮，固定影像
    - 下背急性劇痛伴下肢放射/麻木 → 排除椎間盤急性突出
    acute: 踝/膝扭傷 RICE+功能性評估韌帶完整性，中重度影像。腕/指撞傷固定+影像排除骨折。下背肌肉拉傷相對休息+止痛+早期活動，有神經症狀就醫
    pain_rules: null
    rehab: 踝/膝扭傷依分級漸進本體感覺與肌力；轉身技術再教育避免再傷
    functional_progression_criteria:
    - 踝/膝扭傷：無痛全活動度+單腳穩定+無腫脹
    - 下背：核心控制恢復+無神經症狀
    swim_modifications_in_rehab:
    - 急性期改用開放式觸牆/減少翻滾轉身
    return_to_train: 患部無痛全功能+轉身技術修正 → 漸進回轉身訓練
    return_to_compete: 全功能+無代償 → 復賽
