- id: swimmer-elbow-wrist-overuse
  zh: 游泳者肘/腕過度使用傷
  en: Swimmer's elbow & wrist overuse
  category: A-shoulder-upper
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - 內上髁肌腱病(游泳者肘)
  - 外上髁病
  - ECU 腱病/腱鞘半脫位
  structures:
  - 肱骨內上髁屈肌-旋前肌起點
  - 外上髁伸肌起點
  - 尺側伸腕肌(ECU)腱
  mechanism:
    summary: 最常見為「游泳者肘」(內上髁肌腱病)——拉水期反覆腕屈曲+前臂旋前，對肱骨內上髁屈肌-旋前肌起點累積負荷致腱病；蝶式/蛙泳「高肘划水」特別易誘發。外上髁病在背泳者偶見但較少。腕部以尺側伸腕肌(ECU)腱最常受累，入水角度不正或過度用划手板誘發；ECU 腱鞘半脫位可發生於強力旋後(背泳翻轉入水)。
    trigger_phase: 蝶式/蛙泳拉水、背泳恢復入水
    who: 過度用划手板者、蝶/蛙專項、技術不穩的成人初學者
  epidemiology:
    prevalence: 肩部佔游泳傷害的絕大多數：美國高中傷害監測（2008–2019 學年，563 件／2,171,260 人次暴露，整體 0.26 件／1000 AE）中，**泳者傷害以肩最多，佔 48.6%**，且 58.0% 屬過度使用／慢性； NCAA Division I 單隊五季資料同樣把**肩／上臂列第一、頸／背第二**。 **兩份監測研究都沒有把肘或腕單獨列進主要部位清單**——「肘佔比低」是由此推得，不是任何研究直接報出的數字。腕部的游泳特定流行率幾乎完全缺失。
    certainty: 🟢
    evidence_grade: C
    caveat: 2026-08-17 更正：本區塊原本的唯一引用，其內容寫的是「臨床與教練回報、無流行病學數據」——**那不是來源，是「沒有來源」這件事的描述**，卻被當成引用掛著，讀起來像有文獻。已改掛兩份真實的傷害監測研究。但**證據等級仍維持 C**：兩份研究支撐的是「肩部主導」，肘與腕的佔比是推論而非數據；游泳者肘／腕本身沒有前瞻性控制研究。另：常見引用的『精英泳者 58% 曾有肘不適』來自商業平台文章，不可作公開數字。
    sources:
    - Belilos E, Jow S, Maxwell M (2023). Descriptive Epidemiology of High School Swimming and Diving Injuries. Clin J Sport Med 33(4):428-434
    - Wolf BR, Ebinger AE, Lawler MP, Britton CL (2009). Injury patterns in Division I collegiate swimming. Am J Sports Med 37(10):2037-42
    source_ids:
    - src.pmc10372189
    - src.wolf-2009-ncaa-swimming-injury-patterns
  risk_factors:
  - text: 蝶/蛙拉水技術不正(手肘下垂、過中線)
    grade: Expert
  - text: 過度用划手板
    grade: Expert
  - text: 訓練量急增
    grade: Expert
  - text: 核心不足致肢末代償
    grade: Expert
  - text: 後肩肌群虛弱
    grade: Expert
  prevention:
  - text: 技術矯正(高肘、避過中線)
    grade: Expert
  - text: 限制划手板使用頻率
    grade: Expert
  - text: 前臂/腕肌腱離心訓練
    grade: Expert
  - text: 每週 10% 訓練量增幅上限
    grade: Expert
  management:
    red_flags:
    - 靜息痛 → 就醫
    - 手部麻木 → 就醫(排除 TOS/尺神經病變)
    - 骨性壓痛 → 就醫(排除應力骨折)
    - 腕部鎖定感/彈跳(ECU 腱鞘脫位) → 就醫
    acute: 休息、冰敷、NSAIDs；停划手板；急性 ECU 腕夾板固定
    pain_rules: 訓練後輕痠 24 小時消退 → 減量續練；划水時 NRS ≥4 → 停評估
    rehab: 內上髁離心腕屈曲(3 次/週)+後肩補強；ECU 腱鞘病以旋後位夾板固定 3–4 週；多數 4–8 週保守有效
    functional_progression_criteria:
    - 全 ROM 無痛
    - 握力 ≥85% 對側
    - 模擬划水動作無痛
    swim_modifications_in_rehab:
    - 停蝶/蛙，改自由式(減內上髁負荷)或背泳
    - 停划手板
    return_to_train: 輕症 4–8 週回水；難治者可考慮 PRP/ESWT
    return_to_compete: 技術矯正並達肌力指標後回賽
    prognosis: 通常良好；<5% 需手術；改善誘發技術為防復發關鍵
  population_notes:
    age:
      youth: 特定數據缺失(DATA GAP)
      adult_beginner: 技術不穩風險高但數據缺失
      masters: 特定數據缺失(DATA GAP)
    sex:
      female: 無游泳者特定數據
      male: null
    ability:
      para: 特定數據缺失(DATA GAP)
    lifecycle: null
  links:
    mechanism_link: 手部麻木需先排除胸廓出口症候群（紅旗鑑別診斷，非共同機轉）
    mechanism_link_ids:
    - thoracic-outlet-syndrome
    technical_link: fly.tech.34 EVF 四式共通概念（蝶/蛙「高肘划水」為誘發相）、free.tech.21 肘部下沉——對應風險因子「手肘下垂、過中線」
    technical_link_ids:
    - fly.tech.34
    - free.tech.21
    perception_link: null
    perception_link_ids: []
  references:
  - citation: Belilos E, Jow S, Maxwell M (2023). Descriptive Epidemiology of High School Swimming and Diving Injuries. Clin J Sport Med 33(4):428-434. PMID 36715985
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc10372189
  - citation: Wolf BR, Ebinger AE, Lawler MP, Britton CL (2009). Injury patterns in Division I collegiate swimming. Am J Sports Med 37(10):2037-42. PMID 19633232
    certainty: 🟡
    verified: true
    source_ids:
    - src.wolf-2009-ncaa-swimming-injury-patterns
  flags:
    contested:
    - claim: 划手板的角色
      consensus_source: 划手板被視為加速因素
      dissent_source: 為主因或促因未定論；無安全劑量 RCT
    vintage_warning: false
- id: swimmers-shoulder
  zh: 游泳肩
  en: Swimmer's shoulder
  category: A-shoulder-upper
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 棘上肌腱
  - 肱二頭肌長頭腱
  - 肩峰下滑囊
  - 旋轉肌袖
  mechanism:
    summary: 高度重複過頭划水；前鋸肌疲勞→肩胛骨去穩定(winging)→旋轉肌過載→繼發夾擊/肌腱病。是傘狀總稱，涵蓋肩峰下夾擊、旋轉肌腱病、內夾擊等亞型。
    trigger_phase: 自由式抓水—早期推水（肱骨高度外展+內旋，通過喙肩弓下方）；恢復期高肘崩潰。 **蝶式不可沿用同一句**：本描述的來源(StatPearls NBK470589)全篇只處理自由式，無蝶式內容。蝶式唯一的一手肌電/電影分析(Pink 1993)描述入水時肱骨為**外展、伸展、外旋**，與「入水即內旋夾擠位置」相反；蝶式的易傷機制在該研究中是**前鋸肌與肩胛下肌全程高激活→易疲勞**，屬肌肉耐力層而非姿勢夾擠層。蝶式肩位置的具體描述以 Pink 1993 為準，不由自由式外推。
    who: null
  epidemiology:
    prevalence: 菁英泳者肩痛 40–91%
    certainty: 🟡
    evidence_grade: B
    caveat: 盛行率不可橫向比較——定義差異極大（現症vs生涯、自陳vs影像、青少年/collegiate/Olympic/masters 族群不同）
    sources:
    - McKenzie 2023 系統綜述, Scand J Med Sci Sports, DOI:10.1111/sms.14454（DOI 待 WebFetch 驗證）
    - StatPearls Swimmer's Shoulder, NCBI Bookshelf NBK470589
    source_ids:
    - src.mckenzie-2023-a
    - src.statpearls-swimmer-s-shoulder-ncbi-bookshelf
  risk_factors:
  - text: 訓練量 >35 km/週
    grade: B
  - text: 肩關節鬆弛/多向不穩
    grade: B
  - text: 既往肩痛史
    grade: B
  - text: 內外旋活動度異常
    grade: C
  - text: 高肘技術崩潰（前鋸肌疲勞）
    grade: C
  prevention:
  - text: 旋轉肌+肩胛穩定肌耐力訓練（前鋸肌目標是耐力非力量）
    grade: B
  - text: 技術矯正：避免越中線入水、雙側換氣
    grade: C
  - text: 訓練量漸進管理、避免急性量跳升
    grade: B
  management:
    red_flags:
    - 夜間靜止痛 + 手臂主動上舉無力 → 排除旋轉肌全層撕裂
    - 頸部放射痛 + 上肢麻木/無力 → 排除頸神經根病變/TOS
    acute: 相對休息（非完全停練）+ 物理治療；急性期避免誘發角度的過頭動作
    pain_rules: 復健期疼痛 ≤3/10、動作型態不變形、24 小時內不惡化
    rehab: 旋轉肌與肩胛穩定肌漸進阻力訓練；離心負荷；恢復肩胛-肱骨節律
    functional_progression_criteria:
    - 肩胛穩定測試左右對稱、無 winging
    - 全活動度無痛
    - 旋轉肌肌力對稱達健側 ~90%
    swim_modifications_in_rehab:
    - 初期 pull buoy 減踢、限制過頭爆發負荷
    - 單臂划水分離患側、控制單側量
    - 暫避蝶式與大划距自由式
    return_to_train: 全活動度無痛 + 肩胛穩定測試過 → 漸進回水，技術重建優先於量
    return_to_compete: 全量無痛訓練 ≥2 週 + 技術穩定 → 復賽
    prognosis: 保守治療多數 6–12 週改善（依嚴重度）；結構性撕裂另評估
  population_notes:
    age:
      youth: 早發肌腱病（早開始競技 + 長泳齡，棘上/肩胛下肌）
      adult_beginner: 既有肩部退化 + 技術未熟，負荷集中易夾擠
      masters: 二頭肌長頭腱病/鈣化偏多；超音波 LHB tendinosis 可達 48.8%
    sex: null
    ability:
      para: 上肢推進依賴者（尤視障 S11–S13）肩負擔最高，為帕拉游泳首要傷害
    lifecycle: null
  links:
    mechanism_link: 前鋸肌耐力是 EVF（早期垂直前臂）的硬體前提，疲勞後肩胛失穩→捕水崩潰
    mechanism_link_ids: []
    technical_link: free.tech.10 前鋸肌硬體邊界 / free 疲勞崩潰順序第③步
    technical_link_ids:
    - free.tech.10
    perception_link: L4–L6 手感與全身張力
    perception_link_ids: []
  references:
  - citation: 'Sein ML, Walton J, Linklater J, Appleyard R, Kirkbride B, Kuah D, Murrell G. (2010). Shoulder pain in elite swimmers: primarily due to swim-volume-induced supraspinatus tendinopathy. Br J Sports Med 44(2):105-113. PMID 18463295'
    certainty: 🟢
    verified: true
    source_ids:
    - src.sein-2010
  - citation: McKenzie 系統綜述 2023, Scand J Med Sci Sports, DOI:10.1111/sms.14454
    certainty: 🔴
    verified: false
    source_ids:
    - src.mckenzie-2023-b
  - citation: Masters 泳者肩超音波研究, PMC7824457
    certainty: 🟡
    verified: false
    source_ids:
    - src.pmc7824457
  - citation: Pink M, Jobe FW, Perry J, Kerrigan J, Browne A, Scovazzo ML. (1993). The normal shoulder during the butterfly swim stroke. Clin Orthop Relat Res (288):48–59. PMID 8458154
    certainty: 🟡
    verified: true
    source_ids:
    - src.pink-1993
  flags:
    contested:
    - claim: 機制為真正喙肩弓下夾擊 vs 不穩定繼發的肌腱病
      consensus_source: 近期學界偏向不穩定+疲勞繼發肌腱病（Sein 2010 指鬆弛與夾擊關聯極小）
      dissent_source: 早期 Neer 肩峰下夾擊模型
    vintage_warning: false
- id: thoracic-outlet-syndrome
  zh: 胸廓出口症候群（TOS）
  en: Thoracic outlet syndrome in swimmers
  category: A-shoulder-upper
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - 神經性 nTOS
  - 靜脈性(Paget-Schroetter)
  - 動脈性
  structures:
  - 臂神經叢
  - 鎖骨下動靜脈
  - 斜角肌三角
  - 肋鎖間隙
  - 胸小肌後間隙
  mechanism:
    summary: 鎖骨下動靜脈或臂神經叢在斜角肌三角、肋鎖間隙或胸小肌後方受壓。游泳主機制為反覆過頭划水(自由式/蝶式/背泳)引起斜角肌與胸小肌肥大壓迫神經血管束，同時肩胛下沉前傾縮小出口空間。神經性(nTOS)最常見；靜脈性(Paget-Schroetter，鎖骨下靜脈血栓)次常見且更緊急；動脈性最罕見但最危險。
    trigger_phase: 入水相與過頭恢復相
    who: 高量競技者、頸肋/纖維索帶者、肩胛控制不足者
  epidemiology:
    prevalence: 游泳者 TOS 以個案與小系列為主：某 41 名運動員 TOS 手術系列含游泳者 11 名；另一 97 名 nTOS 系列含游泳者 2 名；無可靠流行病學分母
    certainty: 🔵
    evidence_grade: C
    caveat: TOS 診斷標準無完全共識(CORE-TOS 等)，盛行率差異大；易與 MDI/旋轉肌袖損傷混淆；游泳者文獻多為 1990s–2010s 小系列
    sources:
    - Thoracic Outlet Syndrome in the Overhead Athlete — diagnosis and treatment review, PMC7340704 (已驗證)
    - TOS conservative rehabilitation protocol, PMC11277273 (已驗證)
    source_ids:
    - src.pmc7340704
    - src.pmc11277273
  risk_factors:
  - text: 反覆過頭→斜角肌/胸小肌肥大
    grade: B
  - text: 先天頸肋/纖維索帶
    grade: B
  - text: 肩胛動作異常/下沉
    grade: B
  - text: 高訓練量
    grade: Expert
  - text: 斜角肌解剖變異
    grade: C
  prevention:
  - text: 肩胛提肌+中下斜方肌強化
    grade: Expert
  - text: 斜角肌/胸小肌伸展
    grade: Expert
  - text: 維持姿勢、避免過量
    grade: Expert
  management:
    red_flags:
    - 手臂腫脹/發紺(靜脈性) → 立即就醫
    - 手指缺血/蒼白冰冷(動脈性) → 急診
    - 進行性神經缺損(無力/萎縮) → 就醫
    - 持續手麻不因姿勢改變緩解 → 就醫
    acute: 神經性 nTOS：休息、斜角肌放鬆、NSAIDs、姿勢矯正；血管型需血管外科緊急處置
    pain_rules: 僅特定角度症狀 → 技術調整續輕量；靜息神經症狀(手麻持續) → 停誘發活動
    rehab: 6 期肩胛控制漸進(靜止位→<30°→45–90°→屈曲→>90° 仰舉→專項)+手法治療(第一肋/胸椎)+神經鬆動+呼吸訓練；避免血流限制訓練(靜脈性風險)
    functional_progression_criteria:
    - 症狀消失
    - 患側等長肌力 ≥90% 對側
    - 閉鏈上肢測試/後肩耐力測試通過
    swim_modifications_in_rehab:
    - 減過頭量、避誘發角度
    - 靜脈型禁血流限制式負荷
    return_to_train: 保守 60–70% nTOS 成功(4–6 月試驗)
    return_to_compete: 手術後 nTOS 約 9–12 月、靜脈性約 3.5 月返回
    prognosis: 保守對多數 nTOS 有效；血管型須及時介入；手術後約 70–81% 返回原水準(摘要層級待查)
  population_notes:
    age:
      youth: 頸肋+高量更易誘發
      adult_beginner: 罕見(DATA GAP)
      masters: 罕見(DATA GAP)
    sex: null
    ability:
      para: 罕見(DATA GAP)
