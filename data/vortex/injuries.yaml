- id: poolside-slip-fall
  zh: 池畔濕滑跌倒傷
  en: Poolside slip-and-fall injuries
  category: E-acute-trauma
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - 跌倒頭部撞擊
  - 保護性跌倒骨折(腕/髖)
  - 軟組織挫傷裂傷
  structures:
  - 頭/腦
  - 腕(橈骨遠端)
  - 髖(股骨頸)
  - 尾椎/骨盆
  - 肘
  - 皮膚軟組織
  mechanism:
    summary: 池畔濕磁磚/混凝土摩擦係數驟降——NFSI B101.1 把**濕態**靜摩擦係數（wet SCOF）分三級：≥ 0.60 高抓地力、0.40–0.59 中等、< 0.40 低抓地力；泳池濕區常落在低抓地力級距，赤足+水膜形成近似潤滑層。失去抓地→滑倒。跌倒生物力學分兩型：向後/側滑頭枕部直接撞硬面（腦震盪/顱內出血）；伸手保護性跌倒（FOOSH）力沿前臂傳致橈骨遠端骨折（Colles），或側髖著地致股骨頸骨折（高齡）。奔跑/嬉戲放大速度與衝量。
    trigger_phase: 出入水梯、起跳台周邊、淋浴更衣濕區、嬉戲奔跑、提重物失衡
    who: 兒童（奔跑嬉戲）、高齡泳者（平衡/骨密度↓）、視覺受限（泳鏡起霧/摘鏡）、地面排水不良場館
  epidemiology:
    prevalence: 池畔滑倒本身**沒有可引用的發生率數字**——原寫的『美國每年約 35 萬件泳池傷害、60% 為滑倒』是二手引用、原始登記查不到，維持不進任何層。可引用的是跌倒**後果**：台灣 ≥60 歲髖骨折住院者年死亡率 1999 年 18.10% → 2009 年 13.98%（健保資料庫 n=143,595）；台灣髖骨折術後族群整體一年死亡率 16.8%（n=5,442，已排除住院中死亡者）；亞太區系統回顧的一年死亡率自新加坡 10.8% 至紐西蘭 23.8%（142 研究 / 1,139,752 人）。以上皆為一般高齡族群，非游泳專屬。
    certainty: 🟡
    evidence_grade: B
    caveat: '**2026-08-17 來源健檢結果，兩處更正**： ① 原寫「高齡髖骨折後一年死亡率 20–30%」，其唯一引用的顯示字串本身就寫著「待補具體 PMID」——那是佔位字串，不是文獻。改查真實文獻後發現該數字**對本專案讀者族群偏高約 1.5–2 倍**：台灣兩份健保資料庫研究給出 13.98–18.10%（粗年死亡率）與 16.8%（術後一年），亞太區統合分析則顯示亞洲約為澳紐的一半。20–30% 大致是澳紐等西方族群的上緣。已改寫為分地區、附樣本數的敘述。 ② 原寫「乾混凝土靜摩擦約 0.6（ASTM 建議濕地最低標）」屬張冠李戴——ASTM F2508 規範的是 **步道摩擦計如何校驗**，從未訂定任何摩擦係數門檻；0.60／0.40 的分級出自 **NFSI B101.1** 且全是**濕態**值，不能用來描述乾混凝土。已改為正確歸屬與正確的濕態語意。 **2026-09-04 第三處更正**：本檔原全篇寫「ANSI/NFSI B101.1」並記為「2009 初版 / 2022 改版」，兩者皆誤。 NFSI 於 2006–2019 年間為 ANSI 認證的標準制定組織，**2020 年終止與 ANSI 的關係轉為獨立 SDO**，故 2020 版起 designation 是「NFSI B101.1」而非「ANSI/NFSI B101.1」，現行 2022 版**已不是美國國家標準**，援引時不得借用 ANSI 的權威層級；標題亦在改版時由 Common Hard-Surface Floor **Materials** 改為 Hard-Surface **Walkways**；沿革實為 2009 → 2020 → 2022 三版。門檻值本身經覆核在 2022 版未變（中等級距原文為 0.40–0.59）。餘下限制不變：池畔滑倒缺乏獨立流病登記，多併入一般跌倒或泳池傷害統計；摩擦係數依材質／清潔／量測法差異大。'
    sources:
    - NFSI B101.1-2022 Test Method for Measuring the Wet SCOF of Hard-Surface Walkways（沿革 2009 ANSI/NFSI 初版 → 2020 → 2022）——濕態 SCOF 分級門檻的正確出處
    - ASTM F2508-23 Standard Practice for Validation of Walkway Tribometry Using Research-based Reference Materials——**摩擦計校驗規範，不含門檻值**
    - Wang CB, et al. (2013). Excess mortality after hip fracture among the elderly in Taiwan. Bone 56(1):147–153. PMID 23727435
    - 'Lee TC, et al. (2017). One-Year Readmission Risk and Mortality after Hip Fracture Surgery: A National Population-Based Study in Taiwan. Aging Dis 8(4):402–409. PMID 28840055'
    - Harvey LA, et al. (2024). Variation in mortality following hip fracture across the Asia Pacific region. Arch Gerontol Geriatr 126:105519. PMID 38941947
    source_ids:
    - src.ansi-nfsi-b101-1
    - src.astm-f2508
    - src.wang-2013-taiwan-hip-fracture-mortality
    - src.lee-2017-taiwan-hip-fracture-1yr-mortality
    - src.harvey-2024-asia-pacific-hip-fracture-mortality
  risk_factors:
  - text: 濕滑硬質地面（濕態 SCOF < 0.40，NFSI B101.1 低抓地力級距）
    grade: A
  - text: 赤足+水膜
    grade: B
  - text: 奔跑嬉戲（兒童）
    grade: B
  - text: 高齡（平衡退化+骨質疏鬆）
    grade: B
  - text: 視覺受限（泳鏡起霧/近視摘鏡）
    grade: Expert
  - text: 場館排水不良/無防滑處理
    grade: B
  prevention:
  - text: 池畔防滑表面（粗糙磁磚/防滑塗層，目標為濕態 SCOF ≥ 0.60 的高抓地力級距）
    grade: A
  - text: 『池畔禁跑』規則與監督（尤兒童）
    grade: B
  - text: 良好排水避免積水
    grade: B
  - text: 高齡泳者防滑鞋/扶手輔助出入水
    grade: Expert
  - text: 充足照明與濕區警示標示
    grade: Expert
  management:
    red_flags:
    - 頭部著地後意識改變/持續嘔吐/抽搐/瞳孔不等 → 顱內出血疑慮，緊急就醫
    - 腕/髖跌倒後變形/無法承重/劇痛 → 骨折疑慮，固定就醫影像
    - 高齡跌倒後髖/鼠蹊痛無法站立 → 股骨頸骨折，勿勉強行走
    acute: 頭部撞擊依腦震盪流程評估，紅旗症狀緊急送醫。橈骨遠端骨折：固定+冰敷+抬高+影像（多需復位）。股骨頸骨折：勿移動患肢、保暖、EMS（高齡常需手術）。軟組織挫傷裂傷 RICE+傷口加壓清創。尾椎挫傷對症止痛+坐墊
    pain_rules: null
    rehab: 骨折後依固定/手術方式漸進負重與關節活動度；高齡須併跌倒預防與肌力平衡訓練
    functional_progression_criteria:
    - 腦震盪：依分級協議無症狀回場
    - 橈骨遠端骨折：影像癒合（一般 6 週）+腕關節活動度恢復
    - 股骨頸骨折：骨科評估負重進展
    swim_modifications_in_rehab: null
    return_to_train: 依傷型癒合（腦震盪逐步/骨折影像確認）後回水
    return_to_compete: 完成回場標準且無症狀 → 復賽
    prognosis: 輕度挫傷數日恢復；橈骨遠端骨折多良好；高齡股骨頸骨折預後較差（台灣資料一年死亡率約 14–17%，併發症與失能風險高；西方族群報告可達 23% 上下，地區差異大，引用時須連地區一起說）；頭部撞擊視傷情而定
  population_notes:
    age:
      youth: 奔跑嬉戲滑倒為兒童池畔主要傷因
      adult_beginner: null
      masters: 高齡跌倒骨折（髖/腕）後果最嚴重，預防最關鍵
    sex: null
    ability:
      para: 行動輔具使用者出入水濕區風險高，需無障礙防滑設計
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: NFSI B101.1-2022 Test Method for Measuring the Wet SCOF of Hard-Surface Walkways（濕態 SCOF ≥0.60 高／0.40–0.59 中／<0.40 低三級。2026-09-04 更正：現行版非 ANSI 標準，NFSI 已於 2020 年脫離 ANSI；標題與沿革均已修正）
    certainty: 🟡
    verified: true
    source_ids:
    - src.ansi-nfsi-b101-1
  - citation: ASTM F2508-23 Standard Practice for Validation of Walkway Tribometry Using Research-based Reference Materials（校驗規範，不含門檻值）
    certainty: 🟡
    verified: true
    source_ids:
    - src.astm-f2508
  - citation: 'Wang CB, et al. (2013). Excess mortality after hip fracture among the elderly in Taiwan: a nationwide population-based cohort study. Bone 56(1):147–153. PMID 23727435'
    certainty: 🟡
    verified: true
    source_ids:
    - src.wang-2013-taiwan-hip-fracture-mortality
  - citation: 'Lee TC, et al. (2017). One-Year Readmission Risk and Mortality after Hip Fracture Surgery: A National Population-Based Study in Taiwan. Aging Dis 8(4):402–409. PMID 28840055'
    certainty: 🟡
    verified: true
    source_ids:
    - src.lee-2017-taiwan-hip-fracture-1yr-mortality
  - citation: 'Harvey LA, et al. (2024). Variation in mortality following hip fracture across the Asia Pacific region: Systematic review and proportional meta-analysis. Arch Gerontol Geriatr 126:105519. PMID 38941947'
    certainty: 🟢
    verified: true
    source_ids:
    - src.harvey-2024-asia-pacific-hip-fracture-mortality
  flags:
    contested:
    - claim: 髖骨折一年死亡率
      consensus_source: 高齡髖骨折後死亡率顯著升高為骨科共識（台灣 SMR 一年 9.67，Wang 2013）
      dissent_source: 絕對數字地區差異極大：亞太區系統回顧自新加坡 10.8% 至紐西蘭 23.8%，亞洲約為澳紐一半（Harvey 2024）；舊稿的 20–30% 是西方族群上緣，不適用台灣讀者
    vintage_warning: false
- id: starting-block-impact
  zh: 出發台 / 牆面 / 水面撞擊傷
  en: Starting block, wall, and water-surface impact injuries
  category: E-acute-trauma
  environment:
  - pool
  sport_variant:
  - swim
  - diving_entry
  layer:
  - public
  - clinical
  subtypes:
  - 出發台入水撞擊
  - 游泳中撞牆
  - 水面拍水傷(bellyflop)
  structures:
  - 頭/臉/腦(腦震盪)
  - 頸椎
  - 腕/手指
  - 肋骨/胸壁皮膚
  mechanism:
    summary: 三子機制——A 出發台起跳：頭/臉/肩撞池底(水深不足)或不正確角度入水(腹/胸拍水)，或踩台失足跌至硬面；B 游泳中撞牆：高速轉身/衝刺末端未及時減速，頭/臉/腕撞壁，或密集起跑肢體碰撞；C 水面拍水傷：腹/胸大面積撞水面致皮膚撕裂/肌肉挫傷，高台情境有肺挫傷風險。
    trigger_phase: 出發起跳相(block phase)、轉身前減速相、密集起跑前數秒
    who: 初學出發動作的青少年競技泳者、技術訓練不足者、泳道秩序混亂(公開水域起跑)
  epidemiology:
    prevalence: 高中游泳與跳水（RIO 監測 2008–2019 學年）：563 件傷害 ／ 2,171,260 次暴露（0.26／1000 AE）； **跳水者頭／臉傷佔 36.6%、接觸池面／地面所致佔 68.3%**。游泳／跳水是高中運動中傷害率最低者之一。
    certainty: 🟢
    evidence_grade: B
    caveat: 2026-08-18 更正（兩處）：① 原寫「腦震盪為最常見傷型(31.7%)」—— Belilos 等 2023 摘要**未報出腦震盪佔比**，此數字無來源，已移出； ② 原將 Helmich 等 2024 的 Para 個案寫成「視障選手」——該個案實為**肢體缺損（limb deficiency）**組別泳者，且是 **n=1 個案報告**，不能作為族群風險陳述。另：競賽出發台直接致脊髓損傷的獨立流病數據缺乏(多併入一般跳水傷統計)；『70% 泳池傷害為頭頸部』為二手引用、原始數據源待查。
    sources:
    - Belilos E, Jow S, Maxwell M (2023). Descriptive Epidemiology of High School Swimming and Diving Injuries. Clin J Sport Med 33(4):428-434. PMID 36715985
    - Helmich I, et al. (2024). Neurobehavioural consequences of repetitive head impacts in Para swimming（n=1 個案報告）. J Sci Med Sport 27(1):16-19. PMID 37923648
    source_ids:
    - src.pmc10372189
    - src.neurobehavioral-consequences-of-repetitive-h
  risk_factors:
  - text: 出發技術未成熟(入水角度過陡致頭部觸底)
    grade: Expert
  - text: 水深不足(出發台前區)
    grade: A
  - text: 教練缺乏出發技術指導協議(僅 21.7% 用系統化進展)
    grade: B
  - text: 高速衝刺末端視野受限(近終點看不清牆距)
    grade: Expert
  - text: Para 視覺障礙(靠觸牆棒 tapper 延誤反應)
    grade: Expert
  prevention:
  - text: 出發台訓練遵循進階協議(水中出發→池邊→台上，技能未就緒不上台)
    grade: Expert
  - text: 水深符合 World Aquatics 競賽最低標準(1.35m)
    grade: A
  - text: 教練系統化出發技術教學(淺角度入水)
    grade: B
  - text: 提供視障選手觸牆訓練
    grade: Expert
  management:
    red_flags:
    - 頭部撞牆後意識改變/失憶/嘔吐/視力模糊 → 懷疑腦震盪，停止運動評估
    - 頸部疼痛+肢體症狀 → 脊椎預防措施(見 diving-cervical-injury)
    - 面部撞擊大量出血/眼眶骨折(浣熊眼) → 就醫
    acute: 腦震盪：當場撤離(remove from play)，不得同次訓練/比賽回場。裂傷直接加壓止血；顏面骨折疑似固定就醫。腕/手指骨折 RICE+固定+影像。肋骨/胸壁挫傷監測呼吸困難排除肺挫傷
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 腦震盪：依運動腦震盪分級協議逐步回場(Swimming Canada 有專項指引)
    - 骨折：影像確認癒合(掌骨一般 4–6 週)
    - 裂傷：傷口癒合(防水敷料下可提前回水)
    swim_modifications_in_rehab: null
    return_to_train: 依傷型(腦震盪逐步回場/骨折癒合/裂傷癒合)分別評估
    return_to_compete: 完成回場分級且無症狀 → 復賽
    prognosis: 頭部撞擊多為輕度腦震盪完全恢復(數天至數週)；反覆腦震盪(Para 個案)有神經行為後遺風險；未診斷腦震盪帶傷續練有 second impact syndrome 風險(罕見但嚴重)
  population_notes:
    age:
      youth: 競技青少年出發台受傷主要族群
      adult_beginner: 缺乏出發技術訓練時風險最高
      masters: null
    sex: null
    ability:
      para: Para 選手反覆頭部撞擊的神經行為後遺——文獻僅有 n=1 個案（肢體缺損組泳者，Helmich 2024），不足以推論族群風險；視障組別的觸牆撞擊風險屬機制推導(🔵)，無流病數據
    lifecycle:
      open_water: 公開水域起跑碰撞為獨特場景
  links:
    mechanism_link: null
    technical_link: 出發台 racing start 技術——與跳水頸椎傷共享水深/角度預防
    technical_link_ids:
    - starts-turns.tech.42
    - starts-turns.tech.13
    perception_link: null
  references:
  - citation: Belilos E, Jow S, Maxwell M (2023). Descriptive Epidemiology of High School Swimming and Diving Injuries. Clin J Sport Med 33(4):428-434. PMID 36715985
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc10372189
  - citation: 'Boltz AJ, Robison HJ, Morris SN, D''Alonzo BA, Collins CL, Chandran A. (2021). Epidemiology of Injuries in National Collegiate Athletic Association Men''s Swimming and Diving: 2014-2015 Through 2018-2019. J Athl Train 56(7):719-726. PMID 34280272（2026-09-04 更正：只涵蓋男子項目，族群邊界不得擴及女子）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.boltz-2021
  - citation: Helmich I, et al. (2024). Neurobehavioural consequences of repetitive head impacts in Para swimming（n=1 個案報告，肢體缺損組）. J Sci Med Sport 27(1):16-19. PMID 37923648
    certainty: 🟡
    verified: true
    source_ids:
    - src.neurobehavioral-consequences-of-repetitive-h
  flags:
    contested:
    - claim: 腦震盪在游泳的發生率估計
      consensus_source: 跳水者頭／臉為最常受傷部位(36.6%)有監測數據支持
      dissent_source: 『腦震盪為最常見傷型』與『>50% 泳池傷害為頭部』皆無可追溯來源，不應視為流病數據
    vintage_warning: false
- id: osgood-schlatter
  zh: Osgood-Schlatter 病
  en: Osgood-Schlatter disease
  category: F-pediatric-growth
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 脛骨粗隆骨突
  - 髕骨韌帶
  - 股四頭肌
  mechanism:
    summary: 脛骨粗隆的牽引性骨突炎。青春期骨骼快速生長，股四頭肌透過髕骨韌帶反復拉扯尚未完全骨化的脛骨粗隆骨突中心，造成微損傷與局部炎症，形成前膝隆起和疼痛。觸發機制(股四頭肌爆發拉力)在游泳中幾乎不存在——高風險運動為籃球/排球/田徑/體操，游泳員發生率極低。游泳員兼做陸訓(跑跳)時風險才重現。重要意義:游泳是 OSD 患者合理的低衝擊替代運動。
    trigger_phase: 陸訓跑跳(非水中)；游泳本身極少觸發
    who: 12–15 歲運動活躍男孩、8–12 歲女孩、急速生長期+高量跑跳陸訓者
  epidemiology:
    prevalence: 12–15 歲運動活躍青少年盛行率男 11.4%、女 8.3%、整體約 9.8%(運動活躍族群高達 21%)；荷蘭一般科前瞻發病率整體 3.8/1,000 人年(男 4.9、女 2.7)，峰值男 12 歲、女 11 歲
    certainty: 🟢
    evidence_grade: B
    caveat: 數據來自一般青少年/跑跳運動族群，非游泳特定；游泳機制上幾乎不致病，此條目主要意義為『游泳是友善替代運動』
    sources:
    - Osgood-Schlatter disease, StatPearls NBK441995 (已驗證)
    - OSD incidence general practice (Netherlands), PMID 34990396 / PMC8869186 (已驗證)
    source_ids:
    - src.osgood-schlatter-disease-statpearls-nbk44199
    - src.pmc8869186
  risk_factors:
  - text: 快速身高增長
    grade: B
  - text: 高量跑跳運動(陸訓)
    grade: A
  - text: 男性
    grade: B
  - text: 雙側受累(預後較長)
    grade: B
  - text: 股四頭肌/腿筋柔軟度不足
    grade: C
  prevention:
  - text: 避免跑跳量過快增加
    grade: C
  - text: 股四頭肌/腿筋拉伸
    grade: C
  - text: 急速生長期監測
    grade: Expert
  management:
    red_flags:
    - 急速腫脹/急性撕脫骨折 → 就醫
    - 成年後持續症狀(約 10%) → 骨科評估
    acute: 相對休息(不強制全停)、冰敷、NSAIDs、活動調整；無手術或注射適應症
    pain_rules: 膝前痛在不痛範圍內可繼續活動；負荷後加重則減量
    rehab: 股四頭肌/腿筋漸進拉伸；不痛範圍漸進恢復
    functional_progression_criteria:
    - 活動時膝前痛可控
    - 拉伸/肌力改善
    swim_modifications_in_rehab:
    - 游泳是友善替代運動(膝屈伸受控、無陸上衝擊)
    return_to_train: 游泳通常無需中斷；陸訓跑跳調整
    return_to_compete: null
    prognosis: 自限性；約 90% 於骨骺融合後(約 2 年內)完全緩解；約 10% 延續成年(症狀性骨化結節)
  population_notes:
    age:
      youth: 核心族群；游泳是 OSD 後低衝擊替代選項
      adult_beginner: null
      masters: 骨骺已閉合，幾乎不適用
    sex:
      male: 男性較多(約 65%)
      female: null
    ability:
      para: 骨骺閉合後不適用
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Osgood-Schlatter disease, StatPearls NBK441995
    certainty: 🟢
    verified: true
    source_ids:
    - src.osgood-schlatter-disease-statpearls-nbk44199
  - citation: OSD incidence in general practice, PMC8869186
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc8869186
  flags:
    contested:
    - claim: 是否需影像確認 / 運動限制程度
      consensus_source: 臨床診斷即可，現代指引傾向疼痛範圍內繼續活動
      dissent_source: 部分仍轉介影像(荷蘭研究 19.5%)；完全停訓 vs 疼痛範圍內繼續無一致
    vintage_warning: false
- id: salter-harris-physeal-fracture
  zh: Salter-Harris 生長板骨折
  en: Salter-Harris physeal fracture
  category: F-pediatric-growth
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 生長板(骨骺板)
  - 骨骺
  - 幹骺端
  - 遠端橈骨
  mechanism:
    summary: 生長板(骨骺板)是兒童骨骼最脆弱結構，強度低於韌帶，急性創傷時骨骺板先於韌帶斷裂。Salter-Harris 分型依骨折線穿過骨骺板位置與範圍分五型(I 型僅穿骨骺板，預後最佳；V 型壓縮型最差且常漏診)。游泳本身創傷風險低，但相關情境(跳水入池衝擊、陸訓跌倒、池邊滑倒 FOOSH)可引發上肢(遠端橈骨最常見)或下肢骨折。
    trigger_phase: 跳水/跳台入池衝擊、池邊滑倒、陸訓跌倒
    who: 開放骨骺兒童(女 11–12 歲、男 12–14 歲)、跳水/跳台高衝擊活動者
  epidemiology:
    prevalence: 佔兒童所有骨折 15–30%；II 型最常見(約 75%)；男>女；上肢>下肢，遠端橈骨為最常見單一部位；競泳本身致 Salter-Harris 極少見(水中低衝擊)，多見於跳水/池邊情境
    certainty: 🟢
    evidence_grade: B
    caveat: 游泳特定的生長板骨折分母缺；V 型急性期 X-ray 常正常易低估
    sources:
    - Salter-Harris fractures, StatPearls NBK430688 (已驗證)
    source_ids:
    - src.salter-harris-fractures-statpearls-nbk430688
  risk_factors:
  - text: 開放骨骺年齡
    grade: A
  - text: 跳水/池邊高衝擊活動
    grade: B
  - text: 高速衝擊(競速跳台跳水)
    grade: C
  - text: 骨骼代謝問題(維生素 D 缺乏、RED-S)
    grade: C
  prevention:
  - text: 池邊防滑設計
    grade: Expert
  - text: 跳水技術指導
    grade: Expert
  - text: 強制跳水深度規定
    grade: Expert
  - text: 補鈣/維生素 D(輔助)
    grade: B
  management:
    red_flags:
    - 任何兒童急性肢端創傷伴疼痛 → 就醫排除生長板骨折
    - 關節面受累(III/IV 型)徵象 → 小兒骨科急會診
    - 生長停滯/肢體不等長後續徵象 → 追蹤
    acute: X-ray 常低估需比對健側；SH I–II 閉合復位+固定(石膏/夾板)；SH III–IV 通常需切開復位內固定(ORIF)；SH V 急性期常漏診(X-ray 正常)
    pain_rules: null
    rehab: 初次 7–10 天複查；SH III–V 需 6–12 月影像追蹤確認生長板正常
    functional_progression_criteria:
    - 癒合確認
    - 生長板追蹤正常
    swim_modifications_in_rehab:
    - 依固定/部位調整水中活動
    return_to_train: 上肢 SH I–II 通常 6–8 週；依類型/固定/癒合
    return_to_compete: null
    prognosis: SH I–II 良好；SH III–V 有肢體不等長、關節畸形風險
  population_notes:
    age:
      youth: 唯一受影響族群(骨骺板閉合後不再發生)；跳水台/起跳台是游泳訓練中少數高衝擊情境
      adult_beginner: null
      masters: 不適用
    sex:
      male: 男>女，男 12–14 歲對應生長高峰
      female: null
    ability:
