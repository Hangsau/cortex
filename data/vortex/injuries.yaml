      dissent_source: 「箱型水母用醋」的證據層級**低於原本記載**：它出自體外刺絲胞抑制實驗與地區急救指引推論， **不是臨床試驗結論**，原文寫成「為共識」屬高估（2026-08-17 修正）。 Cochrane 2013 年版另有相反方向的發現：醋或嫩肉粉相較熱水**使皮膚外觀更差**（RR 0.31, CI 0.14–0.72）； 2023 年版對所有局部外用皆判定無法確定有效性。急救法仍為種屬特異，無單一通則。
