- id: scheuermann-kyphosis
  zh: Scheuermann 病（青少年脊椎後凸）
  en: Scheuermann's kyphosis
  category: F-pediatric-growth
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 胸椎椎體
  - 椎體終板軟骨
  - 椎間盤
  mechanism:
    summary: 青少年特發性脊椎後凸，以胸椎(T7–T9 頂點)或胸腰椎三節以上椎體前緣楔形變(wedging ≥5°×≥3 個相鄰椎體)為診斷標準。病因未完全明確，推測與生長期椎體終板軟骨細胞功能障礙有關，椎體前緣承壓大於後緣抑制前緣生長。蝶式反復軀幹彎曲-伸展被懷疑可誘發或加重，屬「加重因子」而非原因。姿勢型「圓背」需與結構型 Scheuermann 鑑別。
    trigger_phase: 蝶式反復軀幹屈伸(加重因子)；生長期椎體前緣壓力集中
    who: 男性(男:女 ≥2:1)、青春期快速生長者、蝶式高量者
  epidemiology:
    prevalence: 美國盛行率 1–8%；男:女 ≥2:1；診斷高峰 12–17 歲；胸椎型(I 型)最常見，胸腰椎型(II 型)罕見但症狀常較重；診斷標準 Cobb ≥40° 剛性後凸+3 個以上相鄰椎體楔形 ≥5°
    certainty: 🟢
    evidence_grade: B
    caveat: 游泳與後凸關聯之 OR 值來自摘要轉述未驗證原文；蝶式因果方向不明(加重後凸 vs 後凸者選游泳)
    sources:
    - Scheuermann disease, StatPearls NBK499966 (已驗證)
    source_ids:
    - src.scheuermann-disease-statpearls-nbk499966
  risk_factors:
  - text: 男性
    grade: B
  - text: 青春期快速生長
    grade: B
  - text: 反復胸椎屈曲運動(蝶式為特定 risk)
    grade: Expert
  - text: 姿勢習慣
    grade: C
  prevention:
  - text: 胸椎伸展運動
    grade: C
  - text: 核心穩定訓練
    grade: C
  - text: Scheuermann 患者限制蝶式
    grade: Expert
  management:
    red_flags:
    - 神經症狀(脊髓壓迫) → 就醫
    - 快速進展 → 脊椎評估
    - 後凸 >75° → 脊椎外科評估
    acute: 非手術(Cobb <60°):生活方式調整、NSAIDs、伸展復健；支架(60–80°)需 12–24 月；手術(>75° 合併疼痛/神經症狀):脊椎融合
    pain_rules: null
    rehab: 胸椎伸展+核心穩定；主動期減少蝶式訓練量
    functional_progression_criteria:
    - 症狀控制
    - 後凸角度穩定(非進展)
    swim_modifications_in_rehab:
    - 避免蝶式；仰式可能助胸椎伸展(理論性)
    return_to_train: 主動期減少蝶式訓練量
    return_to_compete: 術後患者有案例報告仍可游泳
    prognosis: Cobb <60° 骨骼成熟後通常無長期後遺症；>60° 者成年慢性背痛風險增加
  population_notes:
    age:
      youth: 診斷期；游泳教練需識別圓背且持續加重者，轉介脊椎評估
      adult_beginner: null
      masters: 已有結構後凸者蝶式訓練需個別評估
    sex:
      male: 男:女 ≥2:1
      female: null
    ability:
      para: 脊損患者坐姿加重前傾，但 Scheuermann 診斷不適用成年後脊損者
    lifecycle: null
  links:
    mechanism_link: extension-low-back-pain
    mechanism_link_ids:
    - extension-low-back-pain
    technical_link: null
    perception_link: null
  references:
  - citation: Scheuermann disease, StatPearls NBK499966
    certainty: 🟢
    verified: true
    source_ids:
    - src.scheuermann-disease-statpearls-nbk499966
  flags:
    contested:
    - claim: 游泳(尤蝶式)與 Scheuermann 因果關係
      consensus_source: 椎體楔形為診斷核心；蝶式為加重因子
      dissent_source: 橫斷面 OR 顯示關聯但方向不明；游泳是保護或加重取決泳式，兩者可能同時為真
    vintage_warning: false
- id: sever-disease
  zh: Sever 病（跟骨骨突炎）
  en: Sever's disease (calcaneal apophysitis)
  category: F-pediatric-growth
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 跟骨次級骨化中心
  - 跟腱
  - 腓腸肌-比目魚肌
  mechanism:
    summary: 跟骨骨突炎。跟骨次級骨化中心在快速生長期受跟腱過度拉力而炎症。骨骼生長快於肌肉伸展，跟腱相對緊繃，在跑跳等高地面反作用力活動中過度牽拉跟骨(行走時足跟承壓可達正常 10 倍)。機制高度依賴跑跳衝擊，水中幾乎無觸發；游泳員兼高量陸訓(跑步)才有風險。活躍游泳通常是 Sever 病患者的低衝擊替代運動。
    trigger_phase: 陸訓跑跳(非水中)；游泳本身幾乎不觸發
    who: 8–15 歲生長高峰運動活躍兒童(男>女約 2–3:1)、高跑跳陸訓量者
  epidemiology:
    prevalence: 佔兒童肌肉骨骼主訴 2–16%；高達 60% 雙側；男:女約 2–3:1；發病尖峰男 12 歲、女 11 歲；德國青少年足球學院 10 年年發病率 0.36/100 運動員(返回運動初次約 42 天、復發約 181 天)
    certainty: 🟢
    evidence_grade: B
    caveat: 數據來自跑跳運動(足球)族群，非游泳特定；游泳機制上幾乎不致病，主要意義為低衝擊替代運動
    sources:
    - Sever's disease (calcaneal apophysitis), StatPearls NBK441928 (已驗證)
    - Sever disease in youth football academy, PMID 35139872 / PMC8827183 (已驗證)
    source_ids:
    - src.sever-s-disease-calcaneal-apophysitis-statpe
    - src.pmc8827183
  risk_factors:
  - text: 快速生長高峰
    grade: B
  - text: 高跑跳訓練量(陸訓)
    grade: A
  - text: 腓腸肌緊繃/柔軟度差
    grade: B
  - text: BMI 偏高
    grade: B
  - text: 足部生物力學異常(扁平/高弓足)
    grade: C
  - text: 磨損/不合適鞋具
    grade: C
  prevention:
  - text: 腓腸肌-比目魚肌漸進拉伸
    grade: B
  - text: 適合鞋具+足跟墊
    grade: C
  - text: 訓練量漸進管理
    grade: C
  - text: 急速生長期監測
    grade: Expert
  management:
    red_flags:
    - 靜止痛/明顯腫脹 → 就醫(排除跟骨骨折)
    - 雙側受累恢復更長 → 評估
    acute: 活動調整(避跑跳)、冰敷、足跟墊、NSAIDs；持續 4–8 週可考慮 CAM boot 或短腿石膏
    pain_rules: 足跟痛在不痛範圍活動，跑跳後加重則減量
    rehab: 腓腸肌/比目魚肌漸進拉伸+離心強化；體重管理
    functional_progression_criteria:
    - 足跟痛緩解
    - 拉伸/離心改善
    swim_modifications_in_rehab:
    - 游泳通常是 Sever 病的友善低衝擊替代運動
    return_to_train: 症狀緩解後每週增量 <10%；雙側更保守
    return_to_compete: null
    prognosis: 自限性，骨骺閉合後完全緩解；可復發至骨骼成熟
  population_notes:
    age:
      youth: 8–15 歲核心族群
      adult_beginner: null
      masters: 骨骺閉合後不再發生
    sex:
      male: 男:女約 2–3:1
      female: null
    ability:
      para: 兒童資料缺乏
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Sever's disease, StatPearls NBK441928
    certainty: 🟢
    verified: true
    source_ids:
    - src.sever-s-disease-calcaneal-apophysitis-statpe
  - citation: Calcaneal apophysitis in youth football, PMC8827183
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc8827183
  flags:
    contested:
    - claim: 影像必要性 / 最佳保守方案
      consensus_source: 臨床診斷通常足夠
      dissent_source: 跟骨 X-ray 骨化碎裂為 non-specific；足跟墊/物理治療/觀察效益類似，無明確優勝
    vintage_warning: false
- id: youth-swimmer-apophysitis
  zh: 年輕游泳員肩/肘骨骺與骨突損傷
  en: Youth swimmer shoulder/elbow physeal & apophyseal injury
  category: F-pediatric-growth
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  subtypes:
  - 近端肱骨骨骺損傷
  - 肘內上髁骨突炎
  structures:
  - 近端肱骨骨骺
  - 肘內上髁骨突
  - 旋轉肌群
  mechanism:
    summary: 青少年游泳員肩部(近端肱骨骨骺)和肘部(內上髁骨突)受反復過頭動作旋轉應力。近端肱骨骨骺損傷(「小聯盟肩」類比):骨骺軟骨在高頻過頭划水中受旋轉剪力，引起骨骺微裂/增寬(X-ray 骨骺線增寬)。肘部內上髁骨突炎:反復外翻應力(蝶式/仰式轉身、拉力帶訓練)拉扯未骨化內上髁骨突，造成炎症甚至撕脫。
    trigger_phase: 高頻過頭划水、蝶/仰式轉身、陸訓拉力帶
    who: 開放骨骺期(11–16 歲)高過頭量者、快速增量者、技術缺陷者
  epidemiology:
    prevalence: 近端肱骨骨骺損傷最常見於 11–16 歲投擲型運動員，游泳專屬盛行率缺乏(多由棒球研究外推)；游泳員整體肩痛:15–17 歲 55.5%、13–14 歲 47.4%、9–10 歲 11.1% 有干擾游泳的肩痛(含骨骺+軟組織)
    certainty: 🟠
    evidence_grade: C
    caveat: 幾乎無游泳員專屬骨骺研究，全外推自棒球文獻，適用性存疑；游泳外翻應力遠低於投擲者；休息時程外推自投擲運動
    sources:
    - Youth swimmer shoulder pain multi-site, PMID 39100936 / PMC11297363 (已驗證)
    - Proximal humeral epiphysiolysis (little league shoulder), PMID 30485006 (摘要層級)
    source_ids:
    - src.pmc11297363-b
    - src.pmid-30485006
  risk_factors:
  - text: 開放骨骺期+高過頭訓練量
    grade: B
  - text: 快速訓練量增加
    grade: B
  - text: 旋轉肌群肌力不平衡
    grade: B
  - text: 技術缺陷(過度旋轉、入水角不良)
    grade: C
  - text: 陸訓拉力帶過度使用
    grade: C
  prevention:
  - text: 青少年定期肩部動態評估
    grade: Expert
  - text: 訓練量漸進管理
    grade: C
  - text: 旋轉肌群強化
    grade: B
  - text: 技術指導
    grade: Expert
  management:
    red_flags:
    - 肩部靜止痛/夜間痛 → 就醫
    - 骨骺點觸痛(骨骺線位置) → 就醫
    - 游泳後明顯腫脹 → 就醫
    acute: 完全停過頭划水(≥4–6 週，類比小聯盟肩標準)；冰敷；NSAIDs。診斷以 X-ray 雙側比對(骨骺線增寬陽性)、MRI(骨骺水腫)
    pain_rules: 骨骺點觸痛或靜止痛 → 停過頭划水評估
    rehab: 核心+肩胛穩定；旋轉肌群漸進強化；技術分析；陸訓量同步調整
    functional_progression_criteria:
    - 症狀消失
    - 影像骨骺線恢復
    - 漸進負荷(從低強度自由式始)
    swim_modifications_in_rehab:
    - 停過頭划水期可下肢/核心為主
    return_to_train: 症狀+影像恢復後漸進回水
    return_to_compete: null
    prognosis: 適當休息多痊癒；反復/延誤可能影響骨骺閉合後肩關節結構
  population_notes:
    age:
      youth: 11–16 歲核心高風險；教練應定期問肩部靜止痛
      adult_beginner: null
      masters: 骨骺閉合後改為旋轉肌腱損傷，不適用
    sex: null
    ability:
      para: 不適用/數據缺
    lifecycle: null
  links:
    mechanism_link: rotator-cuff-tendinopathy
    mechanism_link_ids:
    - rotator-cuff-tendinopathy
    technical_link: null
    perception_link: null
  references:
  - citation: Shoulder pain in youth competitive swimmers, PMC11297363
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11297363-b
  flags:
    contested:
    - claim: 游泳員近端肱骨骨骺損傷發生率
      consensus_source: 開放骨骺+高過頭量為理論風險
      dissent_source: 幾乎無游泳員專屬研究，全外推自棒球文獻，適用性存疑
    vintage_warning: false
