  - text: 避免突增入水/拉水量
    grade: Expert
  management:
    red_flags:
    - 深部肩痛+機械性卡頓/異音 → 就醫
    - 神經症狀 → 就醫
    - 與 Bankart/MDI 共存 → 骨科綜合評估
    - 保守 3–6 月無改善 → 關節鏡評估
    acute: 保守 3–6 月首選：訓練調整、物理治療、NSAIDs、必要時關節腔注射
    pain_rules: 深層痛可練但出現機械卡頓 → 立即停評估
    rehab: Type II 修補術後 5 期：0–6w 懸臂固定禁主動二頭收縮 → 6–12w 漸進 ROM+Throwers Ten → 12–20w 全活動+二頭抗阻 → 20–26w 專項 → 6–9 月返回
    functional_progression_criteria:
