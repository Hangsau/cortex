    - 等速肌力 ≥75–80% 對側
    - 外旋峰力矩/體重 18–23%
    swim_modifications_in_rehab:
    - 停高外展外旋負荷泳式
    - 保守期可低強度替代訓練
    return_to_train: 保守約 67% 過頭運動員無需手術即可回水
    return_to_compete: 手術整體約 55% 回傷前；游泳者術後平均 2.9 月返回(小樣本)
