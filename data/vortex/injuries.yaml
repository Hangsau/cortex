- id: shallow-water-blackout
  zh: 淺水昏迷
  en: Shallow water blackout (SWB)
  category: D-systemic-acute
  environment:
  - pool
  sport_variant:
  - swim
  - freediving
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 中樞神經系統
  - 延髓呼吸中樞化學受器
  - 頸動脈體
  mechanism:
    summary: 潛前自主過度換氣→人為降低動脈 CO₂(低碳酸血症)→鈍化高碳酸驅動的「想呼吸」警訊→閉氣下潛時 O₂ 持續耗盡卻無換氣衝動→在水下無預警失去意識→若無人即時救援即溺水。並非肺或心臟疾病，是化學驅動被人為關閉。
    trigger_phase: 閉氣前過度換氣 + 水下動態閉氣(DYN)或靜態閉氣(STA)；上升段壓力驟降使肺泡 O₂ 分壓再降，常在接近水面數公尺內昏迷
    who: 體能良好、年輕、經驗豐富的泳者/自由潛水者/軍警泳訓者尤其高危——「我很會憋氣」是風險放大因子非保護因子
  epidemiology:
    prevalence: '**沒有分母明確的發生率**——主要證據形態是個案系列與驗屍官紀錄。可取得的量級參考：澳洲水域 2014–2018 年經驗屍官資料庫確認的浮潛／閉氣潛水死亡共 **91 例** （男 78、女 13，中位年齡 48 歲），其中約三分之一涉及閉氣潛水，64 例為單獨從事。但**該資料是海域浮潛／閉氣潛水，不是泳池 SWB**，且只有分子沒有分母，不能換算成發生率。'
    certainty: 🟢
    evidence_grade: C
    caveat: 死亡常被逕行歸類為一般溺水、SWB 機制未被記錄，導致系統性低估；至今**無可靠盛行率數字**。 2026-08-17 更正：本區塊原掛的兩個 source_id 都是佔位字串（「來源待 WebFetch 核實」「具體文件待查」），已解除；其中「美軍／海軍閉氣訓練安全準則」查證後未能定位到任何具名文件。另補一項術語更正——美國紅十字會、YMCA 與 USA Swimming 已把本症改稱 **hypoxic blackout**，「shallow water blackout」被指為誤導性用語（意識喪失典型發生於 5 m 以內，但溺水可發生於任何深度），本條保留舊名便於檢索，正式定義以 hypoxic blackout 為準。
    sources:
    - Bart RM, Murray BP, Lau H. Shallow Water Blackout. StatPearls, NCBI Bookshelf NBK554620
    - Lippmann J (2023). Snorkelling and breath-hold diving fatalities in Australian waters, 2014 to 2018. Diving Hyperb Med 53(3):210-217
    source_ids:
    - src.statpearls-shallow-water-blackout-nbk554620
    - src.lippmann-2023-australia-breathhold-fatalities
  risk_factors:
  - text: 潛前主動過度換氣（hyperventilation）
    grade: B
  - text: 閉氣競賽/比拼憋氣時間
    grade: C
  - text: 單獨閉氣訓練（無 1:1 直接看護）
    grade: B
  - text: 重複多次閉氣未充分間隔恢復
    grade: C
  - text: 「自認憋氣能力強」的過度自信
    grade: Expert
  prevention:
  - text: 絕對禁止潛前過度換氣（最核心單一訊息）
    grade: B
  - text: 絕不單獨閉氣訓練；採 1:1 直接看護(direct supervision)，看護者手臂可及
    grade: B
  - text: 閉氣後充分水面恢復間隔，禁連續多趟拼時間
    grade: C
  - text: 泳池禁止閉氣比拼遊戲，張貼 SWB 警示
    grade: C
  - text: 教育：『想呼吸的衝動是保命警訊，過度換氣會把它關掉』
    grade: B
  management:
    red_flags:
    - 水下泳者靜止不動/沉底/吐氣泡停止 → 立即視為昏迷，馬上下水拉出
    - 拉出後無反應/無正常呼吸 → 立即啟動 EMS + CPR(先給呼吸/通氣，溺水復甦以通氣優先)
    - 曾水下短暫失神但自行恢復 → 仍須就醫評估，勿當沒事繼續下水
    acute: 離水→評估反應與呼吸→無呼吸即 CPR，溺水復甦採先通氣的 ABC 順序而非一般心停的 CAB：受訓者先給 2 次人工呼吸再進入 30:2 循環（AHA／AAP 2024）；未受訓或不願施行人工呼吸者，僅做胸外按壓仍優於不做→呼叫 EMS；恢復後仍須送醫觀察續發性溺水/吸入。**注意「先 5 次人工呼吸」是歐洲復甦委員會（ERC）的做法，不是 AHA 的數字，兩者不可互相冒名（2026-09-04 更正）**
    pain_rules: null
    rehab: null
    functional_progression_criteria: null
    swim_modifications_in_rehab:
    - 倖存者回水前須由醫療評估；移除所有過度換氣與閉氣比拼行為
    - 閉氣訓練(若必要)改為陸上或有 1:1 直接看護的結構化 protocol
    return_to_train: 經醫療評估無神經/心肺後遺 + 行為矯正(禁過度換氣、不單獨閉氣) → 漸進回水
    return_to_compete: null
    prognosis: 及時救援+CPR 多可完全恢復；延遲救援則缺氧性腦損傷或死亡——預後高度取決於目擊與救援時效
  population_notes:
    age:
      youth: 青少年泳池閉氣比拼/憋氣遊戲是常見情境
      adult_beginner: null
      masters: 自由潛水社群與軍警泳訓族群
    sex: null
    ability: null
    lifecycle:
      freediving: 自由潛水是 SWB/BO 主場景；競技自由潛水有 surface protocol 與 buddy 規範
  links:
    mechanism_link: 同一機轉在呼吸層的條目：breathing.safety.hypoxic_blackout（缺氧昏迷，本症舊稱 SWB）、breathing.safety.hypocapnia_mechanism（過度換氣造成的低碳酸血症）；水下失去意識後若無即時救援即為溺水
    mechanism_link_ids:
    - breathing.safety.hypoxic_blackout
    - breathing.safety.hypocapnia_mechanism
    - drowning
    technical_link: null
    technical_link_ids: []
    perception_link: 可接 L0 呼吸感知層：閉氣與換氣衝動的生理意義屬呼吸感知教育素材
    perception_link_ids: []
  references:
  - citation: 'Bart RM, Murray BP, Lau H. Shallow Water Blackout. In: StatPearls. Treasure Island (FL): StatPearls Publishing. NCBI Bookshelf NBK554620. PMID 32119507'
    certainty: 🟢
    verified: true
    source_ids:
    - src.statpearls-shallow-water-blackout-nbk554620
  - citation: Lippmann J (2023). Snorkelling and breath-hold diving fatalities in Australian waters, 2014 to 2018. Diving Hyperb Med 53(3):210-217. PMID 37718294
    certainty: 🟢
    verified: true
    source_ids:
    - src.lippmann-2023-australia-breathhold-fatalities
  - citation: 'Dezfulian C, McCallin TE, Bierens J, et al. (2024). 2024 American Heart Association and American Academy of Pediatrics Focused Update on Special Circumstances: Resuscitation Following Drowning. Circulation 150(23):e501-e516. PMID 39530204 / doi:10.1161/CIR.0000000000001274（2026-09-04 定版：原登錄為「ILCOR/AHA 溺水復甦演算法，具體版本待查」，現指向 AHA／AAP 2024 聚焦更新，其證據基礎為 ILCOR 2021–2023 系統性回顧）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.dezfulian-2024
  flags:
    contested:
    - claim: 溺水 CPR 起始人工呼吸次數
      consensus_source: 兩大復甦機構一致同意溺水復甦以通氣優先、CPR 須含人工呼吸而非僅胸外按壓（AHA／AAP 2024；證據基礎為 ILCOR 2021–2023 系統性回顧）
      dissent_source: 起始次數不同：AHA 為 2 次人工呼吸接 30:2；ERC 為 5 次起始人工呼吸（理由是先克服水造成的呼吸道阻塞）。本檔原將 ERC 的 5 次寫成 ILCOR/AHA 的建議，2026-09-04 更正
    - claim: 潛前過度換氣是否為唯一/主要機制
      consensus_source: 主流安全衛教共識：過度換氣去除 CO₂ 警訊是核心可預防因子
      dissent_source: 部分案例無明確過度換氣史，提示重複閉氣的累積缺氧亦可獨立致病
    vintage_warning: false
- id: sipe
  zh: 游泳誘發肺水腫
  en: Swimming-Induced Pulmonary Edema (SIPE)
  category: D-systemic-acute
  environment:
  - open_water
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 肺(肺泡-微血管膜)
  - 心血管系統
  - 肺循環
  mechanism:
    summary: 浸水(中心血液重新分布)+冷水(血管收縮)+劇烈運動(高心輸出)+負壓呼吸→肺微血管跨壁壓驟升→液體滲入肺泡(壓力性肺水腫)。非吸入溺水，是血流動力誘發的肺水腫，可在無嗆水下發生。
    trigger_phase: 開放水域競賽/訓練起始高強度段、冷水浸泡、緊身防寒衣壓迫；常於游程中突發呼吸困難、咳嗽、咳粉紅泡沫痰
    who: 鐵人三項/開放水域泳者尤高危；亦見軍事泳訓、SCUBA、健康年輕人
  epidemiology:
    prevalence: 發生率**高度取決於族群與賽事型態，不存在單一數字**。目前最大的前瞻資料是瑞典 Vansbrosimningen 2016–2019 年 47,573 人次，SIPE 發生率 **0.44%**（CI 0.39–0.51）；同一份資料的性別差距極大—— **女性 0.75% vs 男性 0.09%**（調整後 OR 8.59），並隨年齡上升（18–30 歲 0.08% → ≥61 歲 1.1%，OR 12.74）。軍事極端負荷族群則高一個數量級：美國海軍 SEAL 儲訓生 2,117 人中 **5.0%**。 2018 年系統回顧納入的 9 篇研究彼此差距近三個數量級（英國鐵人賽 5 年 0.01%、瑞典河賽 0.5%、以色列海上軍訓計時游 1.8–26.7%），**因異質性過高而無法做量化統合**——任何「SIPE 發生率是 X%」的單一說法都不成立。另可能因誤診為溺水／運動性氣喘而低估。
    certainty: 🟡
    evidence_grade: B
    caveat: '**2026-08-17 來源健檢結果**：本條原本掛的兩筆引用（泛稱的「SIPE」與「軍事游泳訓練 SIPE」）顯示字串都寫著「待查」「待核實」，是佔位字串而非文獻；原盛行率欄位也只寫「範圍待核實」。已查得三篇真實文獻並填入實際數字（Spencer 2018 系統回顧、Hårdstedt 2021 世代、Volk 2021 軍事世代）。 **引用紀律**：① 0.44% 與 5.0% 分屬完全不同族群，相差逾十倍，不可互相取代或平均； ② Hårdstedt 的分母是「游程人次」不是「人數」，且 2016–17 與 2018–19 的診斷方法不同（臨床判斷 vs 肺部超音波）； ③ Spencer 2018 明確寫出「**找不到任何報告 SIPE 死亡的研究**」——本條列為急性可致命是基於機制上的致命潛勢與臨床急症處置需求，**不是基於已發表的死亡率數據**，兩者不可混為一談。餘下限制不變：常被誤判為近乎溺水或運動性氣喘。'
    sources:
    - 'Spencer S, Dickinson J, Forbes L. (2018). Occurrence, Risk Factors, Prognosis and Prevention of Swimming-Induced Pulmonary Oedema: a Systematic Review. Sports Med Open 4(1):43. PMID 30238206（**僅 9 篇納入、異質性過高無法量化統合**）'
    - 'Hårdstedt M, et al. (2021). Incidence of Swimming-Induced Pulmonary Edema: A Cohort Study Based on 47,600 Open-Water Swimming Distances. Chest 160(5):1789–1798. PMID 34186036'
    - Volk C, et al. (2021). Incidence and Impact of Swimming-Induced Pulmonary Edema on Navy SEAL Candidates. Chest 159(5):1934–1941. PMID 33245874
    source_ids:
    - src.spencer-2018-sipe-systematic-review
    - src.hardstedt-2021-sipe-incidence-cohort
    - src.volk-2021-sipe-navy-seal
  risk_factors:
  - text: 冷水浸泡
    grade: B
  - text: 高強度起泳/比賽配速
    grade: B
  - text: 緊身防寒衣(wetsuit)胸廓壓迫
    grade: C
  - text: 高血壓/既往 SIPE 史(高復發)
    grade: B
  - text: 過量賽前補液(增加前負荷)
    grade: C
  - text: 女性（Hårdstedt 2021：女 0.75% vs 男 0.09%，調整後 OR 8.59）
    grade: B
  - text: 年齡較長（同研究 18–30 歲 0.08% → ≥61 歲 1.1%，OR 12.74）
    grade: B
  prevention:
  - text: 避免冷水中爆發式起泳，漸進加溫加速
    grade: C
  - text: 防寒衣合身不過緊，必要時剪鬆領口/胸口
    grade: C
  - text: 既往 SIPE 史者就醫評估血壓（約 30% 會復發）。**西地那非預防復發的建議已於 2026-08-17 撤除**：Spencer 2018 系統回顧指出該用法只有兩篇極小型無對照研究、結論不確定，不足以支撐建議，且用藥決定超出教練角色
    grade: Expert
  - text: 避免賽前過度補液
    grade: C
  - text: 認識早期症狀(呼吸困難/咳嗽/咳泡沫痰)即停止上岸
    grade: B
  management:
    red_flags:
    - 游泳中突發呼吸困難 + 咳嗽 + 咳粉紅/血色泡沫痰 → 立即停止、上岸、求救
    - 上岸後持續呼吸窘迫/血氧低/發紺 → 啟動 EMS，可能需氧療/醫院處置
    - 胸痛/意識改變 → 排除心因事件，立即就醫
    acute: 立即停止運動+離水+保暖+直立姿勢；給氧;多數離水後數小時內自行緩解，但須醫療評估排除嚴重者(可能需 CPAP/利尿/住院)
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 症狀完全緩解 + 影像/血氧恢復
    - 心肺評估(含血壓/心臟結構)排除潛在誘因
    swim_modifications_in_rehab:
    - 復發風險高→回水前心肺評估;避免冷水爆發式起泳
    - 調整防寒衣鬆緊、賽前補液量
    return_to_train: 症狀緩解 + 心肺評估綠燈 + 誘因矯正(配速/防寒衣/補液) → 漸進回水，避免冷水高強度起泳
    return_to_compete: 心肺專科評估通過 + 既往發作誘因已處理 → 復賽；高復發者需個別風險討論
    prognosis: 急性發作多在離水後 24 小時內緩解（Spencer 2018 納入的三篇研究），惟一篇小型研究觀察到限制型肺功能缺損可持續約一週；約 30% 會復發（兩篇研究），誘因未矯正者更高；個別嚴重者需住院。長期預後只有一篇小型研究，未發現發作者與未發作者有差異
  population_notes:
    age:
      youth: null
      adult_beginner: 成人鐵人/開放水域初入者冷水+高強度起泳組合高危
      masters: 高齡+高血壓增風險
    sex:
      female: 女性風險顯著較高：Hårdstedt 2021 的 47,573 人次世代中，SIPE 患者 90% 為女性（參賽性別比接近 1:1），發生率女 0.75% vs 男 0.09%
      male: null
    ability: null
    lifecycle:
      freediving: SCUBA/自由潛水浸水亦可誘發(immersion pulmonary edema 同源機制)
  links:
    mechanism_link: 「非吸入溺水」——與溺水的鑑別點在於液體來自肺微血管滲出而非吸入
    mechanism_link_ids:
    - drowning
    technical_link: null
    technical_link_ids: []
    perception_link: 可接 L0 呼吸感知/配速感知教育(辨識異常呼吸窘迫 vs 正常喘)
    perception_link_ids: []
  references:
  - citation: 'Spencer S, Dickinson J, Forbes L. (2018). Occurrence, Risk Factors, Prognosis and Prevention of Swimming-Induced Pulmonary Oedema: a Systematic Review. Sports Med Open 4(1):43. PMID 30238206'
    certainty: 🟢
    verified: true
    source_ids:
