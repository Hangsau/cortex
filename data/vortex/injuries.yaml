- id: sci-hip-flexor-contracture
  zh: 脊髓損傷泳者的髖屈攣縮
  en: Hip flexor contracture in SCI swimmers
  category: C-nonMSK-medical
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 髂腰肌
  - 股直肌
  - 髖關節囊
  - 骨盆-腰椎連結
  mechanism:
    summary: 脊髓損傷（SCI）選手長期坐輪椅，髖屈肌（髂腰肌、股直肌）長期處於縮短位置，加上下肢主動伸展能力受限，造成髖屈攣縮可達 60–90° 屈曲。游泳時這個攣縮無法靠水中拉伸快速消除——俯臥泳式時下肢往後伸不直，造成正面阻力大、軀幹拱起；仰式因軀幹控制不足會被攣縮的髖屈肌拉著腰椎前彎而更困難。不主動介入會持續惡化，極端情況需手術做髖關節囊釋放。
    driver: 髖屈攣縮角度 = 受傷時間 × 每日坐姿時間 × 是否有規律髖屈拉伸介入；坐輪椅 ≥ 2 年且無拉伸介入者攣縮普遍 ≥ 30°
    trigger_phase: 俯臥泳式下肢伸展位 / 仰式軀幹姿勢
    who: SCI 完全性損傷者、輪椅依賴 ≥ 2 年且無規律拉伸介入者、L1–L3 段以上損傷者
    swim_context: SCI 泳者在水中對下肢的本體感覺與主動控制能力有限，無法靠游泳本身展開髖部；陸上拉伸是必要而非選項
  epidemiology:
    prevalence: SCI 泳者髖屈攣縮普遍存在（方向性描述，非量化）。**原本寫的「嚴重攣縮（≥ 60°）報告比例 30–50%」已於 2026-08-17 撤除——該數字唯一的引用查無此文獻，屬無來源數字，不得再出現於任何層。**
    certainty: 🔵
    evidence_grade: Expert
    caveat: '**2026-08-17 來源健檢結果**：本條原引「Akkurt et al. 2017, J Phys Ther Sci，SCI 髖屈攣縮綜述」， PubMed 檢索該作者×該期刊×該年回傳 0 筆，放寬條件後唯一相符的 Akkurt H 2017 是 Eur J Phys Rehabil Med 的「上肢有氧運動 RCT」，期刊、主題、文獻類型三項皆不符，無法認定為同一篇。故引用已解除、依附其上的 30–50% 數字已撤除。保留的只有方向性敘述（長期輪椅坐姿 → 髖屈肌短縮 → 俯臥泳姿下肢伸不直），這部分是解剖推導 + 臨床通識，不需要那篇不存在的文獻背書。 **若日後要恢復量化盛行率，必須先找到真實可解析的流病來源，不得回填舊數字。** 確定性標記同日由 🟠 改為 🔵：撤掉數字後剩下的是「長期坐姿 → 髖屈肌處於縮短位 → 俯臥泳姿下肢伸不直」這條解剖／力學推導，本專案並無 SCI 泳者的教學觀察案例可據，標 🟠（教練觀測）會暗示一個不存在的觀察基礎，標 🔵（推導）才是誠實的位置。'
    sources: []
    source_ids: []
  risk_factors:
  - text: 完全性 SCI（vs 不完全性）
    grade: B
  - text: 受傷時間 > 2 年
    grade: B
  - text: 每日輪椅時間 > 12 小時
    grade: B
  - text: 無規律髖屈拉伸介入
    grade: Expert
  - text: L1–L3 段以上損傷（下肢主動伸展更受限）
    grade: B
  prevention:
  - text: 每日髂腰肌與股直肌拉伸（俯臥髖伸展、Thomas 姿）≥ 2 × 30 秒，每日至少 1 次
    grade: B
  - text: PT/OT 介入建立家用拉伸計畫，傷後 6 個月內開始
    grade: Expert
  - text: 游泳訓練前後加陸上動態髖伸展 10 分鐘
    grade: Expert
  - text: 考慮夜間使用髖伸展支架（已有攣縮者）
    grade: Expert
  management:
    red_flags:
    - 新發疼痛或攣縮加速 → 排除異位性骨化（HO）
    - 皮膚壓瘡風險增加（攣縮改變坐姿） → PT 重新評估輪椅適配
    - 保守治療 6 個月無進展 + 攣縮 > 60° 影響日常功能 → 骨科會診評估手術釋放
    acute: null
    pain_rules: 拉伸時 NRS ≤ 4 為安全範圍；> 4 或拉伸後 24 小時持續疼痛 → 降低強度
    rehab: ①每日 2 × 30 秒拉伸 ②水中俯臥使用 pull buoy 補償腿位 ③陸上髖伸展肌力訓練（臀大肌、後鏈）
    functional_progression_criteria:
    - 陸上俯臥姿勢髖伸展角度逐月改善
    - 游泳時軀幹拱起減少
    - 比賽姿勢可維持時間延長
    swim_modifications_in_rehab:
    - 俯臥泳式（自由式、蝶式）使用 pull buoy 提高腿位、減少正面阻力
    - 仰式時加強核心訓練補償腰椎被動前彎
    - 考慮起跳改用水中起跳（避開站立式起跳對攣縮髖部的衝擊）
    return_to_train: 新近介入拉伸計畫 → 立即可訓練；不應因攣縮而停訓，但訓練量與技術期望需依攣縮程度調整
    return_to_compete: null
    prognosis: 早期介入 (傷後 < 6 月) 可有效預防嚴重攣縮；已有 > 60° 攣縮者保守治療效果有限，需手術才能顯著改善
  links:
    mechanism_link: null
    mechanism_link_ids: []
    technical_link: free.tech.34 流線體線——攣縮使下肢往後伸不直、正面阻力大，是硬體邊界讓基準姿態達不到，不是感知缺陷
    technical_link_ids:
    - free.tech.34
    perception_link: null
    perception_link_ids: []
- id: surfers-ear-exostosis
  zh: 外耳道骨瘤 / 骨疣（衝浪耳）
  en: Surfer's ear / external auditory exostosis
  category: C-nonMSK-medical
  environment:
  - open_water
  - surf
  - pool
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  structures:
  - 外耳道骨性部
  - 骨膜
  - 外耳道上皮
  mechanism:
    summary: 長期冷水(臨界約 <19°C)與冷風刺激外耳道骨性部骨膜，引發慢性骨膜炎；成骨細胞活化致鼓環周圍骨性增生並向耳道腔延伸。過度增生後耳道阻塞，耳垢與水分積聚→反覆外耳道炎、傳導性聽損。外耳道上皮極薄(約 0.1mm)幾無緩衝。
    trigger_phase: 冷水游泳/衝浪/划艇/潛水，頻率高、累積時數長；風冷加成
    who: 衝浪者(研究最多)、冷水/冬泳者、划艇選手、潛水員；任何長期反覆冷水暴露者
  epidemiology:
    prevalence: 一般人群約每千人 6.3 例；冷水衝浪者 70–80%，連暖水衝浪者小樣本(n=23)仍達 69.6%；已確診者約 80% 雙側
    certainty: 🟡
    evidence_grade: C
    caveat: 絕大多數研究針對衝浪者，競技(室內溫水)游泳者獨立盛行率幾乎不存在；女性樣本過少
    sources:
    - External Auditory Exostoses, StatPearls PMID 30521295 (已驗證)
    - Warm-water surfers exostosis 橫斷研究, PMC7077213 (已驗證)
    source_ids:
    - src.pmid-30521295
    - src.pmc7077213
  risk_factors:
  - text: 冷水(<19°C)暴露頻率與累積時數
    grade: B
  - text: 每年 >50 次水域活動且 >5 年年資
    grade: B
  - text: 無耳保護裝備
    grade: B
  - text: 冷風暴露
    grade: Expert
  - text: 男性(部分因活動參與率偏差)
    grade: B
  prevention:
  - text: 完整密封型矽膠耳塞
    grade: B
  - text: 氯丁橡膠帽(neoprene hood)保溫
    grade: Expert
  - text: 每次入水均用耳保護(實際依從率僅約 5%)
    grade: Expert
  - text: 術後持續耳保護防復發
    grade: Expert
  management:
    red_flags:
    - 耳道阻塞 >80% → 耳鼻喉科評估
    - 反覆外耳道炎(≥3 次/年)+傳導性聽損 → 轉介
    - 持續耳痛/耳鳴 → 轉介
    acute: 保守(Grade 1–2)：定期耳垢清潔、治療合併外耳道炎、監測進展。外科(canalplasty/exostectomy)：阻塞 >80%+持續症狀；術後約 68% 生活品質改善，約 14% 併發症(鼓膜穿孔/顏面神經麻痺/顳顎關節障礙)
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 術後雙側手術一般間隔約 6 週
    - 術後持續使用耳保護(繼續冷水暴露可再生長)
    swim_modifications_in_rehab: null
    return_to_train: 保守者持續監測下可游泳；術後依耳鼻喉科評估回水
    return_to_compete: null
    prognosis: 骨性增生本質不可逆；保守下持續進展，外科治療後多數改善但繼續冷水暴露有復發風險
  population_notes:
    age:
      youth: 冷水訓練青少年為潛在高風險，但缺乏專項研究
      adult_beginner: null
      masters: 累積暴露年限長，篩查值得討論，無專項研究
    sex:
      male: 多數研究男性佔比 >80%
      female: 文獻嚴重不足(DATA GAP)
    ability:
      para: null
    lifecycle:
      open_water: 冬泳/開放水域為新興風險族群，無獨立流病資料
  links:
    mechanism_link: 骨性增生阻塞耳道後耳垢與水分積聚→反覆外耳道炎，游泳耳是本症的下游併發
    mechanism_link_ids:
    - swimmers-ear
    technical_link: null
    technical_link_ids: []
    perception_link: null
    perception_link_ids: []
  references:
  - citation: External Auditory Exostoses, StatPearls, PMID 30521295
    certainty: 🟡
    verified: true
    source_ids:
    - src.pmid-30521295
  - citation: Prevalence of exostoses in warm-water surfers, PMC7077213
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc7077213
  flags:
    contested:
    - claim: 是否僅冷水致病
      consensus_source: 冷水暴露為主要致病因子
      dissent_source: 暖水衝浪者小樣本(n=23)盛行率仍近 70%，暗示機械衝擊或其他因素，結論需審慎
    vintage_warning: false
- id: swimmer-dental-erosion
  zh: 牙齒酸蝕（游泳者）
  en: Swimmer's dental erosion
  category: C-nonMSK-medical
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 牙釉質
  - 牙本質(象牙質)
  mechanism:
    summary: 泳池水若 pH 偏低(<4.5)、或即使近中性但對羥基磷灰石飽和度不足(飽和指數為負)，持續接觸即緩慢溶解釉質。競技泳者訓練時口腔反覆浸入水中大口吸吐，口腔接觸池水時數遠超休閒者；高強度後唾液分泌減少(保護下降)。嚴重欠飽和酸性池水(有記錄低達 pH 3.24)為最強致病因素。
    trigger_phase: pH 維護不當泳池、每日 >2 小時水中訓練、主動吞嚥/浸潤池水
    who: 競技泳者(訓練時數長)、青少年(釉質仍成熟中)、合併高酸飲食者
  epidemiology:
    prevalence: 競技 vs 休閒對比研究：波蘭 26%(資深組 50%) vs 10%；埃及 60% vs 對照(划船)25.6%(p<0.001)；波蘭池水 pH 中位 7.2 但羥基磷灰石飽和指數 -3.33(中性 pH 仍有腐蝕風險)，埃及最低 pH 3.24
    certainty: 🟡
    evidence_grade: B
    caveat: 多為橫斷面無法確認時間序列；泳池水質差異大；現有研究多聚焦 14–25 歲競技者，老年/休閒數據缺如
    sources:
    - Dental erosion in competitive swimmers (Poland), PMC3579418 (已驗證)
    - Dental erosion competitive swimmers vs rowers (Egypt), PMC10713671 (已驗證)
    source_ids:
    - src.pmc3579418
    - src.pmc10713671
  risk_factors:
  - text: 競技游泳(高訓練量)
    grade: B
  - text: 游泳年資(每多一年 AOR 約 1.24)
    grade: B
  - text: 酸性泳池水(pH <4.5)
    grade: Expert
  - text: 羥基磷灰石飽和度不足(即使 pH 中性)
    grade: B
  - text: 高酸飲食(含糖/酸性飲料)
    grade: B
  - text: 既有牙齒過敏
    grade: B
  prevention:
  - text: 訓練前含氟漱口水(臨床共識，無游泳者 RCT)
    grade: Expert
  - text: 緊貼式防護牙托——保護來自牙托本身；內面塗氟/CPP-ACP 在唯一的離體實驗中各組間無顯著差異，不得當成額外效益宣稱(2026-09-04 更正)
    grade: B
  - text: 游泳後等 30 分待再礦化後再刷牙
    grade: Expert
  - text: 塗布氟化物塗劑(fluoride varnish)
    grade: Expert
  - text: 泳池管理者控制 pH 7.2–7.8 並監測飽和指數
    grade: Expert
  management:
    red_flags:
    - 牙齒冷熱過敏 → 牙科
    - 牙齒外形明顯改變(磨短/邊緣薄化) → 牙科
    - 釉質損傷進入象牙質(更深層疼痛) → 牙科
    acute: 含鉀/精氨酸去敏牙膏；氟化物塗劑、CPP-ACP(酪蛋白磷酸鈣);嚴重酸蝕需牙科樹脂修復。未改善池水水質則修復無意義
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 無需停止游泳；以預防措施為主
    - 確診嚴重酸蝕須評估並改善泳池水質
    swim_modifications_in_rehab: null
    return_to_train: 持續游泳，加強口腔防護
    return_to_compete: null
    prognosis: 預防措施執行良好者預後佳；未干預競技泳者釉質損傷可持續累積(尤年資長者)
  population_notes:
    age:
      youth: 14–18 歲競技者研究最多，釉質仍成熟中風險最高
      adult_beginner: null
      masters: 牙周退縮/象牙質暴露者池水更快進入敏感層(DATA GAP)
    sex:
      male: 部分研究較高(技術動作較激烈、更多口腔接觸水)
      female: null
    ability:
      para: null
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Dental erosion among competitive swimmers (Poland), PMC3579418
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc3579418
  - citation: Dental erosion in competitive swimmers vs rowers (Egypt), PMC10713671
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc10713671
  - citation: Kitsahawong K, Pitiphat W, Thongpaiboon P, Thongpaiboon S, Saengsuwannarot S. (2024). Evaluating the protective effects of mouthguards with neutralizing agents against chlorinated water-induced enamel erosion. Front Oral Health 5:1469228. PMID 39328893 / PMC11425598（2026-09-04 更正：離體實驗，保護來自牙托本身；含氟與 CPP-ACP 各牙托組之間無顯著差異）
    certainty: 🟢
    verified: true
    source_ids:
    - src.kitsahawong-2024
  flags:
    contested:
    - claim: pH 中性池水是否仍腐蝕
      consensus_source: 酸性池水致釉質溶解為共識
      dissent_source: 波蘭研究指 pH 7.2 但飽和指數負值仍腐蝕，需更多研究確認；飽和指數尚未納入全球泳池管理標準
    vintage_warning: false
- id: swimmer-dermatoses
  zh: 泳者皮膚問題群
  en: Swimmer dermatoses (folliculitis / swimmer's itch / green hair / chlorine dermatitis)
  category: C-nonMSK-medical
  environment:
  - pool
  - open_water
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  subtypes:
  - 熱浴缸毛囊炎(綠膿桿菌)
  - 泳者癢(尾蚴性皮膚炎)
  - 綠髮(銅沉積)
  - 氯刺激性皮膚炎
  structures:
  - 毛囊
  - 表皮角質層
  - 真皮(過敏反應)
  - 毛髮角蛋白
  mechanism:
    summary: 四亞型——A 熱浴缸毛囊炎：綠膿桿菌(Pseudomonas)在溫水/高 pH/低氯環境繁殖，經毛囊侵入致泳衣覆蓋區丘疹膿疱；B 泳者癢：淡水/海水中禽鳥血吸蟲尾蚴誤穿人皮膚後死亡引發遲發型過敏(再暴露反應加重)；C 綠髮：並非氯致綠，而是水中銅離子(銅管腐蝕/硫酸銅除藻劑)被氯氧化後與毛髮角蛋白螯合，漂染髮更明顯；D 氯刺激性皮膚炎：氯氧化作用去脂、破壞皮膚屏障致刺激性接觸性皮膚炎。
    trigger_phase: 熱浴缸/SPA(毛囊炎)、淡水湖淺水順風區(泳者癢)、含銅泳池(綠髮)、高頻室內泳池(氯皮膚炎)
    who: 競技泳者(氯皮膚炎/綠髮)、開放水域/湖泳者(泳者癢)、免疫低下/糖尿病(毛囊炎重症)、兒童(皮膚屏障薄)
  epidemiology:
    prevalence: 泳者癢(Michigan Douglas Lake 2000)每 100 水中暴露日 6.8 例、301 名湖泊使用者中 17.3% 有症狀；熱浴缸毛囊炎估計 67% 熱浴缸/63% 泳池有綠膿桿菌污染(污染率為二手引用)；氯皮膚炎/綠髮無系統盛行率
    certainty: 🟡
    evidence_grade: C
    caveat: 各亞型多為案例報告或單地調查；台灣本島泳者癢資料幾乎缺如；發生率因地理/季節差異極大
    sources:
    - Aquatic dermatoses 回顧, PMC5286756 (已驗證)
    - Cercarial dermatitis 前瞻調查, PMC1448328 (已驗證)
    - Hot tub folliculitis 回顧, PMC7584313 (已驗證)
    source_ids:
    - src.pmc5286756
    - src.pmc1448328
    - src.pmc7584313
  risk_factors:
  - text: 熱浴缸長時間浸泡(>30 分)+消毒不良(毛囊炎)
    grade: B
  - text: 免疫低下/糖尿病(毛囊炎重症化)
    grade: Expert
  - text: 淡水淺水區/順風水域暴露(泳者癢)
    grade: B
  - text: 泳者癢再暴露(過敏強化)
    grade: Expert
  - text: 含銅泳池+漂染/淺色髮(綠髮)
    grade: C
  - text: 高頻訓練+皮膚屏障不全(氯皮膚炎)
    grade: Expert
  prevention:
  - text: 選擇有定期消毒紀錄設施、限制浸泡時間(毛囊炎)
    grade: Expert
  - text: 避免淺水/順風區、出水立即用力擦乾(泳者癢)
    grade: B
  - text: 游泳前清水濕髮+矽靈護髮、游後螯合(EDTA)洗髮(綠髮)
    grade: Expert
  - text: 游泳後立即沖淋+保濕(氯皮膚炎)
    grade: Expert
  management:
    red_flags:
    - 毛囊炎合併發燒/蜂窩組織炎/膿腫 → 就醫
    - 泳者癢廣泛性繼發細菌感染 → 就醫
    - 皮膚炎大面積/合併全身症狀 → 就醫
    acute: 毛囊炎：免疫正常多 1–2 週自癒，醋酸濕敷；嚴重用環丙沙星。泳者癢：抗組胺+局部類固醇+止癢，3–7 天自限。綠髮：螯合(EDTA/組胺酸)洗髮，無健康風險。氯皮膚炎：避免暴露+局部類固醇(輕中度)，停止暴露後數天消退
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 皮疹完全消退再返泳防感染
    - 泳者癢:繼續暴露同一水體風險持續
    swim_modifications_in_rehab: null
    return_to_train: 皮損癒合後回水；氯皮膚炎考慮改低氯泳池
    return_to_compete: null
    prognosis: 毛囊炎 2–10 天自行消退多不留疤；泳者癢自限數日；綠髮為美觀問題可洗除；氯皮膚炎避刺激源後預後良好
  population_notes:
    age:
      youth: 皮膚屏障薄對刺激更敏感；尾蚴性皮膚炎在淡水嬉水兒童常見
      adult_beginner: null
      masters: 開放水域泳者癢風險最高
    sex: null
    ability:
      para: 皮膚病流病幾乎缺如(DATA GAP)
    lifecycle:
      open_water: 尾蚴性皮膚炎為開放水域(尤淡水湖)特有
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Aquatic dermatoses, PMC5286756
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc5286756
  - citation: Cercarial dermatitis epidemiology (Douglas Lake), PMC1448328
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc1448328
  - citation: Hot tub (Pseudomonas) folliculitis, PMC7584313
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc7584313
  flags:
    contested:
    - claim: 氯刺激性皮膚炎發生閾值
      consensus_source: 高氯暴露破壞皮膚屏障為共識
      dissent_source: 致病氯濃度閾值不明；干預措施無 RCT
    vintage_warning: false
- id: swimmers-ear
  zh: 游泳耳 / 外耳道炎
  en: Swimmer's ear / otitis externa
  category: C-nonMSK-medical
  environment:
  - pool
  - open_water
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  structures:
  - 外耳道皮膚
  - 耳垢腺
  - 耳道上皮屏障
  mechanism:
    summary: 外耳道靠酸性環境(pH 4–5)、耳垢抗菌與完整上皮屏障防禦。反覆進水沖淡耳垢、升高 pH、破壞上皮，細菌(最常見綠膿桿菌 Pseudomonas aeruginosa，次為金黃色葡萄球菌)增殖定植→感染性外耳道炎。棉花棒/耳塞機械摩擦直接破壞皮膚屏障形成入口。
    trigger_phase: 游泳(尤頻繁潛水/開放水域)、高溫潮濕、自行掏耳後
    who: 5–14 歲兒童(發生率最高)、頻繁游泳者、糖尿病/免疫低下者(重症化)、濕疹/乾癬者
  epidemiology:
    prevalence: 終身盛行率約 10%；美國 **2007 年單一年度**急性外耳道炎門診約 240 萬次（每千人 8.1）， 5–9 歲最高（每千人 18.6），逾半數就診者為 20 歲以上成人。
    certainty: 🟡
    evidence_grade: B
    caveat: 2026-08-18 更正（期間標錯）：原寫「2003–2007 年年門診約 240 萬次」，像是五年平均；CDC MMWR 60(19) 的 240 萬／8.1 per 1000 是 **2007 年單一年度**數值，已更正。 **使用邊界**：該分母是**全美總人口**、不是游泳人口，因此「游泳者風險為非游泳者約 5 倍」**不可能出自此來源**——該倍數目前為 StatPearls 轉述、原始研究待查，已移出本欄。另：缺最新全球系統回顧；開放水域 vs 室內泳池分層數據不足。
    sources:
    - StatPearls Otitis Externa, PMID 32310515 (已驗證)
    - CDC (2011). Estimated Burden of Acute Otitis Externa — United States, 2003-2007. MMWR 60(19):605-9. PMID 21597452
    source_ids:
    - src.pmid-32310515
    - src.cdc-mmwr-2003-2007
  risk_factors:
  - text: 游泳/頻繁潛水
    grade: B
  - text: 棉花棒/耳塞/助聽器機械創傷
    grade: Expert
  - text: 異位性皮膚炎/濕疹/乾癬
    grade: B
  - text: 糖尿病(惡性外耳道炎風險)
    grade: B
  - text: 免疫功能低下
    grade: Expert
  - text: 高溫潮濕氣候
    grade: B
  prevention:
  - text: 游泳後傾頭排水、耳道自然乾燥
    grade: Expert
  - text: 游泳後異丙醇+白醋耳滴劑(酸化乾燥，無 RCT)
    grade: Expert
  - text: 避免棉花棒掏耳
    grade: Expert
  - text: 矽膠耳塞(不當使用反致機械傷)
    grade: Expert
  - text: 糖尿病嚴格血糖控制
    grade: Expert
  management:
    red_flags:
    - 發燒 >38.3°C / 耳廓紅腫熱痛 / 耳周淋巴腫 → 感染超出外耳道，就醫
    - 糖尿病/免疫低下者耳痛未改善 → 懷疑惡性(壞死性)外耳道炎，緊急就醫
    - 耳道肉芽組織或顏面神經麻痺 → 緊急轉介
    acute: 第一線局部抗生素±類固醇耳滴劑(多黏菌素B/新黴素/氫化可體松、氧氟沙星或環丙沙星)，多在 7–10 天痊癒。口服抗生素非第一線，僅限糖尿病/免疫低下/惡性外耳道炎或合併中耳炎。疼痛用乙醯胺酚/NSAIDs。48–72 小時無改善再評估。惡性外耳道炎需靜脈/長療程抗假單胞菌抗生素±外科清創
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 症狀(疼痛/分泌物)完全消失再返泳
    - 惡性外耳道炎完成全療程+影像確認控制
    swim_modifications_in_rehab: null
    return_to_train: 急性期暫停游泳，症狀完全緩解後回水
    return_to_compete: null
    prognosis: 急性單純型預後極佳，5–7 天痊癒；慢性反覆者有耳道狹窄/聽損風險；惡性外耳道炎致死率高(顱內侵犯為主要死因)
  population_notes:
    age:
      youth: 5–9 歲發生率最高，但少重症
      adult_beginner: null
      masters: 糖尿病者惡性外耳道炎風險，致死率顯著較高
    sex: null
    ability:
      para: null
    lifecycle:
      open_water: 開放水域暴露量大，預防依從性決定風險
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Otitis Externa, StatPearls (Medina-Blasini & Sharman), PMID 32310515
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmid-32310515
  - citation: CDC (2011). Estimated Burden of Acute Otitis Externa — United States, 2003-2007. MMWR Morb Mortal Wkly Rep 60(19):605-9. PMID 21597452
    certainty: 🟢
    verified: true
    source_ids:
    - src.cdc-mmwr-2003-2007
  flags:
    contested:
    - claim: 預防性酸化耳滴劑與耳塞效益
      consensus_source: 游泳後乾燥耳道為共識
      dissent_source: 酸化滴劑無 RCT；耳塞不當使用反增創傷
    vintage_warning: false
- id: swimming-induced-bronchoconstriction
  zh: 運動誘發支氣管收縮 / 游泳氣喘
  en: Exercise-induced bronchoconstriction in swimmers
  category: C-nonMSK-medical
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 氣道上皮
  - 支氣管平滑肌
  - 黏液纖毛清除系統
  mechanism:
    summary: 游泳 EIB 有兩條並行途徑——A 滲透壓途徑：劇烈換氣致氣道水分丟失、滲透壓升高，肥大細胞脫顆粒釋放組胺/白三烯致平滑肌收縮；B 化學上皮損傷途徑(游泳特有)：吸入空氣中三氯胺(NCl₃)及含氯氣溶膠直接損傷氣道上皮、破壞黏液纖毛清除、增加上皮通透性而易致敏。競技泳者換氣量遠超一般人，吸入三氯胺有效劑量更高，較低濃度即顯著效應；長期可從暫時性 EIB 進展為持久性氣道高反應性乃至臨床氣喘。
    trigger_phase: 室內泳池長時間高強度訓練、高換氣量長距離游泳
    who: 競技泳者(尤長期室內訓練)、個人/家族過敏史者、兒童早期大量泳池暴露者
  epidemiology:
    prevalence: 競技游泳者 EIB 盛行率接近 50%(定義/診斷法差異下文獻 11–29% 亦見)；Brussels 兒童研究(n=341，10–13 歲)11.7% 醫師確診氣喘，每多 100 小時泳池暴露氣喘 OR 增 1.79(限 IgE>100)；泳池空氣 NCl₃ 中位數約 0.18 mg/m³
    certainty: 🟡
    evidence_grade: B
    caveat: EIB 自我報告準確率低需客觀肺功能確診；多數研究偏競技泳者；因果方向(氣喘者選游泳 vs 游泳致氣喘)仍爭論
    sources:
    - EIB in competitive swimmers 回顧, PMC6092370 (已驗證)
    - Childhood pool exposure and asthma (Brussels), PMC1626429 (已驗證)
    - Trichloramine and lung function, PMC3488741 (已驗證)
    source_ids:
    - src.pmc6092370
    - src.pmc1626429
    - src.pmc3488741
  risk_factors:
  - text: 室內泳池長期訓練(>100 小時)
    grade: B
  - text: 個人/家族過敏體質(atopy)
    grade: B
  - text: 血清 IgE 升高
    grade: B
  - text: 高三氯胺濃度泳池
    grade: B
  - text: 6 歲前大量泳池暴露(限兒童)
    grade: B
  prevention:
  - text: 改善室內泳池通風降低三氯胺
    grade: Expert
  - text: 游前充分熱身降低 EIB 反應
    grade: B
  - text: 入水前沐浴減少有機負荷(降三氯胺生成)
    grade: Expert
  - text: 有氣喘者游前 20–30 分預防性 SABA
    grade: A
  - text: 持續性氣喘者吸入型皮質類固醇
    grade: A
  management:
    red_flags:
    - 游泳中/後重度氣喘發作(SABA 無效) → 緊急就醫
    - 靜止時喘鳴/呼吸急促 → 就醫
    - 運動後 SpO₂ 下降 → 就醫
    acute: 停止訓練、離開高三氯胺密閉環境、吸入 SABA；嚴重者醫院全身性皮質類固醇。確診需客觀功能測試(FEV₁、eucapnic voluntary hyperpnea、高滲鹽水吸入)
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 輕度 EIB(藥物控制良好)可繼續游泳但預防性 SABA
    - 難控制者考慮更換訓練環境(戶外/低三氯胺)
    swim_modifications_in_rehab:
    - 症狀難控時部分患者陸地訓練後再返泳
    return_to_train: 依肺功能與症狀個別評估，無統一返泳流程
    return_to_compete: null
    prognosis: 多數 EIB 可藥物良好控制；長期高暴露不改善環境者可能進展為持久性氣道高反應性；退役競技泳者肺功能可有部分恢復
  population_notes:
    age:
      youth: 6 歲前大量(尤室內)泳池暴露為獨立危險因子，有明確劑量反應
      adult_beginner: 研究甚少，推測風險較低(訓練/換氣量低)，缺數據
      masters: 有 COPD/既有氣道疾病者可能更敏感(DATA GAP)
    sex: null
    ability:
      para: null
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Exercise-induced bronchoconstriction in swimmers, PMC6092370
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc6092370
  - citation: Childhood swimming pool attendance and asthma (Brussels), PMC1626429
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc1626429
  - citation: Nitrogen trichloride exposure and lung function, PMC3488741
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc3488741
  flags:
    contested:
    - claim: 游泳在氣喘管理中的地位 / 三氯胺因果
      consensus_source: 游泳傳統被推薦為氣喘者較安全運動
      dissent_source: 室內三氯胺暴露使建議複雜化；部分學者認為競技泳者氣喘高為選擇偏差非游泳致病；OR 部分研究未達顯著
    vintage_warning: false
- id: uv-photo-damage
  zh: 曬傷 / 光化性傷害（皮膚 + 眼睛）
  en: UV / photo-damage — skin cancer & pterygium in outdoor swimmers
  category: C-nonMSK-medical
  environment:
  - open_water
  - surf
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  structures:
  - 皮膚(表皮 DNA)
  - 眼球表面(結膜/角膜)
  - 水晶體
  mechanism:
    summary: 戶外泳者雙重 UV 暴露：直接陽光+水面反射(10–20%)，加上水平泳姿使軀幹頸部暴露最大化，實際劑量高於陸上同等時間。UV-B 誘導 DNA 損傷(嘧啶二聚體)長期累積致鱗狀細胞癌/基底細胞癌/黑色素瘤；眼球累積 UV 致翼狀胬肉與白內障。游泳後防曬因沾水降效，需防水型並頻繁補擦。
    trigger_phase: 長時間水面浮游(鐵人/馬拉松游泳)、高峰時段(10am–2pm)、未戴護目鏡/太陽眼鏡
    who: 熱帶/赤道戶外開放水域泳者、淺膚色者、兒童期大量戶外游泳者(DNA 損傷長期累積)
  epidemiology:
    prevalence: 澳洲衝浪/泳者黑色素瘤點盛行率為一般澳洲族群 76 倍(高 UV 地區，不可外推全球)；翼狀胬肉全球約 12%(20 歲以下 3%、80 歲以上 19.5%)
    certainty: 🟡
    evidence_grade: B
    caveat: 皮膚癌流病多為澳洲研究外推需謹慎；翼狀胬肉 12%/76 倍/15000 J·m⁻² 等數字來自二次來源，原始論文作者待查
    sources:
    - Point prevalence skin cancers Australian surfers/swimmers, PMC9057286 (已驗證)
    - Skin Cancer Risk in Athletes narrative review, Cancers 2023, PMC10339925 (已驗證)
    - Solar Radiation Latitudes and Pterygium systematic review, PMC5800136 (已驗證)
    source_ids:
    - src.pmc9057286
    - src.pmc10339925
    - src.pmc5800136
  risk_factors:
  - text: 累積 UV 暴露(>5 小時/日戶外)
    grade: A
  - text: 戶外運動(游泳/衝浪/釣魚)
    grade: B
  - text: 低緯度地區(南北緯 30 度內，台灣在翼狀胬肉帶)
    grade: B
  - text: 淺膚色/易曬傷體質(對皮膚癌)
    grade: B
  - text: 不戴護目鏡(對翼狀胬肉/白內障)
    grade: Expert
  - text: 水面反射增加劑量
    grade: B
  - text: 兒童期 UV 暴露(長期累積)
    grade: B
  prevention:
  - text: 防水廣譜防曬乳(SPF 30+)每 2 小時補擦、出水後再補
    grade: A
  - text: 穿防曬泳裝(UPF 50+ 上衣/泳帽)
    grade: B
  - text: UV 護目鏡/側翼遮蔽太陽眼鏡(護翼狀胬肉)
    grade: B
  - text: 高峰時段(10am–2pm)避開或縮短訓練
    grade: Expert
  - text: 戶外泳者年度全身皮膚科檢查
    grade: Expert
  management:
    red_flags:
    - 皮膚 ABCDE：不對稱/邊界不規則/多色/直徑 >6mm 病灶、不癒合潰瘍結痂、快速增大色素區 → 皮膚科
    - 眼睛：視力下降/模糊(翼狀胬肉侵入視軸)、眼表組織快速增大、持續眼紅刺激 → 眼科
    acute: 急性曬傷：移入陰涼+冷濕敷(非冰塊直接)+保濕+補水+非處方止痛(ibuprofen/acetaminophen)；大面積水泡/高燒就醫。翼狀胬肉輕度人工淚液+持續防護，侵犯視軸/快速增大則手術切除(mitomycin C 降復發)
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 曬傷待皮膚癒合(無水泡/剝落)再回水防感染
    - 翼狀胬肉術後通常 4–6 週避免氯水接觸
    swim_modifications_in_rehab: null
    return_to_train: 曬傷皮膚癒合後/翼狀胬肉術後復原後 → 回水並強化防護
    return_to_compete: null
    prognosis: 早期皮膚癌(尤黑色素瘤)5 年存活 >95%，轉移性預後差；翼狀胬肉手術成功率高但復發 10–40%(結膜移植術可降至 <5%)
  population_notes:
    age:
      youth: 皮膚癌潛伏期數十年，但兒童期 UV 暴露是日後皮膚癌最強獨立預測因子
      adult_beginner: null
      masters: 累積 UV 最多，翼狀胬肉及皮膚癌盛行率最高，定期篩查尤重要
    sex:
      male: 翼狀胬肉、SCC 風險較高
      female: null
    ability: null
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Point prevalence non-melanoma/melanoma skin cancers Australian surfers and swimmers SE Queensland/N NSW, PMC9057286
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc9057286
  - citation: Skin Cancer Risk, Sun-Protection Knowledge and Behavior in Athletes — Narrative Review, Cancers 2023, PMC10339925
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc10339925
  - citation: Occupational Solar Radiation at Different Latitudes and Pterygium systematic review, PMC5800136
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc5800136
  - citation: Harrison SC, Bergfeld WF. (2009). Ultraviolet light and skin cancer in athletes. Sports Health 1(4):335-40. PMID 23015891 / PMC3445124
    certainty: 🟢
    verified: true
    source_ids:
    - src.harrison-2009
  flags:
    contested:
    - claim: 水面反射『增加劑量』對皮膚癌/翼狀胬肉的獨立貢獻
      consensus_source: 水面反射 10–20% 為物理測量共識
      dissent_source: 缺乏對比單純戶外時間的大型對照研究
    vintage_warning: false
- id: cold-water-shock
  zh: 冷水休克 / 冷水衝擊反應
  en: Cold water shock / Cold shock response
  category: D-systemic-acute
  environment:
  - open_water
  - surf
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 皮膚溫度感受器
  - 自主神經系統
  - 呼吸系統
  - 心臟傳導系統
  mechanism:
    summary: 皮膚急劇降溫(≤15–25°C 水)在 5–30 秒內反射觸發強制喘氣(gasp)→過度換氣→血壓心率急升+血管收縮，使深水中呼吸控制喪失易嗆水，連強壯泳者也可數秒內溺水。若同時面浸觸發潛水反射(迷走→心動過緩)與交感心搏過速形成「自主神經衝突」，可誘發室性心律不整甚至心室顫動。
    trigger_phase: 突然跳入/意外落入冷水的最初數分鐘(此窗口溺水風險最高，冷休克反應隨後自行減退)
    who: 突然入冷水的非習化者、意外落水者(落橋/翻船)、兒童(體表面積比大反應更劇)、有心律不整史者
  epidemiology:
    prevalence: 無可靠獨立死亡數字——案例幾乎都歸類為『溺水』，與低體溫死亡混淆，現場目擊稀少
    certainty: 🟠
    evidence_grade: B
    caveat: 被認為是意外落水後最常見的『立即』死因(低體溫需 >30 分才危及生命)；機制證據多為生理實驗，缺大型流病
    sources:
    - 'Tipton M. (2003). Cold water immersion: sudden death and prolonged survival. Lancet 362 Suppl:s12–13. PMID 14698111（單一作者，兩頁短文性質為評論／概觀，非原始研究）'
    - Lundström et al., 健康青少年冰水面浸心律研究, Physiological Reports 2025, PMC12234767 (已驗證)
    source_ids:
    - src.tipton-mj-et-al-cold-water-immersion-sudden-2003
    - src.pmc12234767
  risk_factors:
  - text: 水溫 <15°C(尤 <10°C)
    grade: B
  - text: 未預期/意外落水(vs 自願入水)
    grade: Expert
  - text: 未進行冷水習化
    grade: A
  - text: 屏氣/潛水動作(加劇自主神經衝突)
    grade: B
  - text: 既有心律不整/長 QT/心臟病
    grade: Expert
  - text: 兒童(體表面積比大反應更強)
    grade: B
  - text: 急速跳入(vs 緩慢下水)
    grade: Expert
  prevention:
  - text: 冷水習化(≥4 次逐漸暴露，間隔 ≤8 天；效果可維持 7–14 月。要求暴露 ≥50% 體表、避免臉部以防觸潛水反射、每次 ≥150 秒)
    grade: A
  - text: 開放水域比賽前的『表現級』冷水適應協議 = 短期保命級 + 持續性：賽前 14–21 天的規律暴露才能達到比賽當天的穩定耐受度（一致性 > 強度，每天 15 分鐘比一週一次 2 小時有效）；凡士林、潤滑膏等號稱『急速適應』的方法都無效
    grade: Expert
  - text: 緩慢涉水入水(淋水後再入)
    grade: Expert
  - text: 穿防寒衣減少皮膚暴露面積
    grade: B
  - text: 開放水域穿 PFD 降溺水機率
    grade: B
  - text: 有心臟病史者避免冷水開放水域
    grade: Expert
  management:
    red_flags:
    - 突然入水後控制不住的喘息/過度換氣、無法控制肢體沉入水中 → 立即救援出水
    - 意識改變、心悸/心跳停頓感、唇/指甲發紺 → 監測心律並就醫
    acute: 立即救援出水(冷休克數分鐘自退但此窗口溺水風險最高)→保持橫躺(避免直立致『救援崩潰』)→無反應即 CPR(參溺水演算法)→有意識則保暖(離冷水/脫濕衣/蓋毯)、監測心律→即使症狀已緩仍送醫觀察(心律不整可能延遲出現)
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 無記錄心律不整、無缺氧損傷 → 完全恢復
    - 有心律不整記錄 → 心臟科評估後方回水
    swim_modifications_in_rehab:
    - 建議事後進行冷水習化訓練(尤開放水域泳者)
    return_to_train: 單純冷休克事件且無心臟異常 → 完全恢復後可回水；有心律不整則待心臟科綠燈
    return_to_compete: null
    prognosis: 及時救出且無缺氧損傷→完全恢復；若冷休克致溺水則預後同溺水(依缺氧時長)
  population_notes:
    age:
      youth: 反應更強烈但習化速度相同，10–12 歲兒童可有效習化
      adult_beginner: null
      masters: 心臟儲備下降，心律不整風險更高
    sex: null
    ability:
      para: 脊髓損傷者自主神經調節已異常，反應難預測
    lifecycle: null
  links:
    mechanism_link: 喘氣反射使深水中呼吸控制喪失易嗆水，「連強壯泳者也可數秒內溺水」即本條與溺水的接點
    mechanism_link_ids:
    - drowning
    technical_link: null
    technical_link_ids: []
    perception_link: 可接 L0 呼吸感知(冷水喘氣反射的生理意義)
    perception_link_ids: []
  references:
  - citation: 'Tipton M. (2003). Cold water immersion: sudden death and prolonged survival. Lancet 362 Suppl:s12–13. PMID 14698111 / DOI 10.1016/s0140-6736(03)15057-x（2026-08-17 更正：單一作者，原記「Tipton MJ et al.」的共同作者不存在）'
    certainty: 🟡
    verified: true
    source_ids:
    - src.tipton-mj-et-al-cold-water-immersion-sudden-2003
  - citation: 'Habituation of the cold shock response: systematic review and meta-analysis, 2024, PubMed 38211547'
    certainty: 🟢
    verified: true
    source_ids:
    - src.barwood-2024
  - citation: Lundström et al., face immersion/body submersion ice-cold water adolescents, Physiol Rep 2025, PMC12234767
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc12234767
  - citation: Farstad DJ, Dunn JA. (2019). Cold Water Immersion Syndrome and Whitewater Recreation Fatalities. Wilderness Environ Med 30(3):321-327. PMID 31178366（2026-09-04 補全：族群是激流泛舟死亡個案，不是泳者）
    certainty: 🟢
    verified: true
    source_ids:
    - src.farstad-2019
  flags:
    contested:
    - claim: 『自主神經衝突』作為溺水死亡機制的比重
      consensus_source: 2015 後主流假說，生理實驗支持
      dissent_source: 缺大型流行病學驗證其實際佔比
    vintage_warning: false
- id: dehydration-hyponatremia
  zh: 運動性脫水 / 低鈉血症
  en: Exercise-associated dehydration / hyponatremia in swimmers
  category: D-systemic-acute
  environment:
  - open_water
  - pool
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 體液-電解質平衡
  - 腎臟(AVP 調節)
  - 中樞神經系統(腦水腫)
  mechanism:
    summary: 游泳者口渴感受被抑制，可能因怕掉速而過度補水。低鈉血症(EAH，血鈉 <135 mmol/L)在長距離開放水域的主因不是『太少喝』而是過度飲水+運動誘發非滲透性 AVP(精胺酸加壓素)分泌使腎保留水分，加劇稀釋。嚴重時誘發低鈉腦病：腦水腫+顱內壓升，意識改變/抽搐/死亡。另有少見的低血容型(汗失鈉補充不足)。
    trigger_phase: 賽程 >4 小時的長距離馬拉松游泳/鐵人三項；賽事飲水站密集致過度補水
    who: 10km+ 開放水域泳者、鐵人三項選手、體重輕/女性(部分研究)、賽前服 NSAIDs(增 AVP 作用)者
  epidemiology:
    prevalence: 馬拉松跑者(可外推耐力運動)EAH 約 15–30%，血鈉 <120 嚴重者約 1%；開放水域游泳獨立盛行率無可靠數字
    certainty: 🟡
    evidence_grade: B
    caveat: 開放水域監測不一致、可水中補水量難追蹤、輕症常被誤診→無獨立盛行率
    sources:
    - Exercise-Associated Hyponatremia in Marathon Runners, PMC9699060 (已驗證)
    - EAH hyponatremic encephalopathy in open water swimmer 案例, PubMed 25443755 (已驗證)
    - Pathophysiology and treatment of EAH, J Endocrinol Invest, PMC12847173 (已驗證)
    source_ids:
    - src.pmc9699060
    - src.pmid-25443755
    - src.pmc12847173
  risk_factors:
  - text: 過度飲水(超過口渴需求的『預防性』補水)
    grade: A
  - text: 賽程 >4 小時/長距離
    grade: B
  - text: 女性(部分研究較高，機制仍爭論)
    grade: B
  - text: 低體重
    grade: B
  - text: 賽前服 NSAIDs
    grade: B
  - text: 僅補純水、電解質不足
    grade: B
  prevention:
  - text: 『按口渴補水(drink to thirst)』，不預防性過量補水
    grade: A
  - text: 補含鈉電解質飲料取代純水
    grade: B
  - text: 賽中監測體重(減 >3% 補水、增加則停止補水)
    grade: B
  - text: 賽前避免 NSAIDs
    grade: B
  - text: 長賽前制定個人化補水計畫
    grade: Expert
  management:
    red_flags:
    - 輕症(血鈉 125–134)：噁心/嘔吐/頭痛/脹氣感/異常疲勞
    - 重症腦病(血鈉 <125)：意識混亂/言語不清/定向力喪失、抽搐、呼吸困難、昏迷 → 立即停止+EMS+勿再給任何飲水
    acute: 現場：立即停止+水平躺+停止一切液體補充(症狀性 EAH 禁給水)。輕症(意識清楚)若確認體重增加→限水+高鹽零食(可口服高張鹽)+觀察。重症(意識改變)緊急送醫。醫院：重度/腦病型用 3% 高張鹽水(目標升血鈉 1–2 mmol/L/小時緩解顱內壓)；禁低張液體(0.9% 都可能惡化)
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - EAH 完全糾正後通常無長期影響
    - 有抽搐/意識喪失者神經學評估確認無腦水腫殘餘
    swim_modifications_in_rehab:
    - 重返長距離賽前須再評估並制定個人化補水策略
    return_to_train: 完全糾正+補水策略修正 → 漸進回水
    return_to_compete: 個人化補水計畫確立 + 無神經殘餘 → 復賽
    prognosis: 輕症及時停止補水完全恢復；重症腦病及時靜注高張鹽水可完全恢復(有插管次日出院案例)；誤給低張液體可致永久腦損傷/死亡
  population_notes:
    age:
      youth: 短距離游泳幾乎無 EAH 風險；長距離活動確保按需補水但不鼓勵『多補』
      adult_beginner: 泳池短訓風險低；開放水域挑戰事件另計
      masters: AVP 對滲透壓敏感性隨年齡改變+可能服利尿劑(HCTZ)改變鈉平衡，需個別化
    sex:
      female: 多研究觀察 EAH 發生率略高，機制(雌激素/AVP/體液分布)仍爭論
      male: null
    ability: null
    lifecycle:
      open_water: 10km+ 馬拉松游泳為最高風險場景
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Exercise-Associated Hyponatremia in Marathon Runners, PMC9699060
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc9699060
  - citation: EAH encephalopathy in an endurance open water swimmer, PubMed 25443755
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmid-25443755
  - citation: Pathophysiology and treatment of EAH, J Endocrinol Invest 2025, PMC12847173
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc12847173
  - citation: 'Armstrong LE. (2021). Rehydration during Endurance Exercise: Challenges, Research, Options, Methods. Nutrients 13(3):887. PMID 33803421 / PMC8001428（drink-to-thirst 是本文討論的內容，不是標題）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.armstrong-2021
  flags:
    contested:
    - claim: 補水策略
      consensus_source: 『按口渴補水』為現行主流共識
      dissent_source: 部分早期耐力指引(pre-2010)推薦定時補水
    vintage_warning: false
- id: drowning
  zh: 溺水 / 近乎溺水
  en: Drowning / Near-drowning
  category: D-systemic-acute
  environment:
  - pool
  - open_water
  - surf
  sport_variant:
  - swim
  - open_water_swim
  - freediving
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 呼吸系統(肺泡-表面活性劑)
  - 中樞神經系統(腦缺氧)
  - 心血管系統
  mechanism:
    summary: 液體進入氣道→氣體交換障礙→進行性低氧血症+高碳酸血症→若未中斷則心跳驟停(缺氧性，非心因性)。水入肺泡破壞表面活性劑致肺泡塌陷；約一成案例以喉痙攣為主(進水極少)。淡水/海水滲透壓機制有別但臨床處置相同。
    trigger_phase: 任何涉水情境失去有效呼吸；幼兒於浴缸/充氣泳池、成人於開放水域離岸/水流低估、酒精影響下尤甚
    who: 1–4 歲幼童最高危；男性各年齡死亡率均約女性 2 倍；無泳技或過度自信者；酒精/藥物影響者；獨游者
  epidemiology:
    prevalence: '**WHO 自己報的數字是每年約 30 萬人**（2021 年約 300,000 起溺水死亡）； 2000 年以來全球溺水死亡率下降約 38%。**274,200 是 GBD／IHME 系列的估計**，方法與 WHO 不同，兩者不可混用。近半發生於 29 歲以下，五歲以下約佔四分之一。'
    certainty: 🟢
    evidence_grade: A
    caveat: 2026-08-18 更正（歸屬顛倒）：本欄原寫「WHO 2024：約 274,200 人（另估 ~30 萬）」——方向反了，30 萬才是 WHO 的數字，274,200 屬 GBD／IHME。已對調。另：死亡常被泛歸「溺水」，特定機制(SWB/冷水休克/心因)難事後分辨；開放水域溺水人數多於泳池(紐西蘭 2020 達 87%)。
    sources:
    - WHO 2024-12-13 新聞稿『Drowning deaths decline globally』(已驗證 URL)
    - Scientific Reports 2025 全球溺水負擔 204 國研究, PMC11954903 (已驗證)
    - CDC Vital Signs 溺水死亡率, MMWR 2024, PMC11115434 (已驗證)
    source_ids:
    - src.who-2024-12-13-drowning-deaths-decline-globa-2024
    - src.pmc11954903
    - src.pmc11115434
  risk_factors:
  - text: 缺乏監督(幼童最關鍵，佔兒童溺水約 52%)
    grade: A
  - text: 無游泳技能或對泳技過度自信
    grade: A
  - text: 缺乏水邊障礙/圍欄
    grade: A
  - text: 男性
    grade: B
  - text: 幼兒年齡(1–4 歲為最高風險組)
    grade: A
  - text: 酒精攝取(青少年/成人開放水域)
    grade: B
  - text: 開放水域(波浪/水流/低能見度/低溫)
    grade: B
  - text: 獨游(無伴)
    grade: Expert
  prevention:
  - text: 6 歲以上兒童基礎游泳技能訓練(WHO 列 promising)
    grade: A
  - text: 泳池四面圍欄(可減約 75% 泳池溺水)
    grade: A
  - text: 水邊主動成人監督
    grade: A
  - text: 救生員在場
    grade: B
  - text: 開放水域穿戴個人浮力裝置(PFD)
    grade: B
  - text: 戒除水中/水邊飲酒、避免獨游
    grade: Expert
  management:
    red_flags:
    - 任何溺水事件無論意識狀態皆視為緊急；意識喪失或無法自行離水 → 立即救援
    - 離水後咳嗽/呼吸困難/喘鳴/發紺 → 立即就醫
    - 繼發性惡化警示：溺水後數小時內(最長 24–72h)咳嗽加重/呼吸急促/異常疲倦/混亂 → 即使當下『看似沒事』也須就醫
    acute: 2024 AHA/AAP 溺水復甦(已驗證 doi:10.1161/CIR.0000000000001274)：移出水→受訓者安全時可水中救援呼吸→無反應無呼吸即 CPR『通氣優先』先給 5 次救援呼吸再按壓(溺水驟停根因為缺氧)→盡早 AED 但不延誤 CPR→呼叫 EMS→勿試圖『倒水』。中度(有呼吸但吸入水)監測 4–6h 防遲發肺水腫
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 肺功能正常、無持續肺水腫/感染跡象
    - 若有缺氧後神經缺損 → 個人化評估
    swim_modifications_in_rehab:
    - 輕度案例經急診評估穩定後數日至一週多可回水
    - 神經學後遺者由醫療團隊個別決定，可能長期禁水
    return_to_train: 肺功能與神經狀態經醫師評估綠燈 → 漸進回水；勿自行評估
    return_to_compete: null
    prognosis: 及時目擊+立即 CPR 預後佳；浸水 >6 分鐘顯著惡化；入院時意識水平(缺氧時長)是最強預後指標。冷水(尤兒童)潛水反射可能延長 CPR 有效窗口，復甦至復溫前不輕言放棄
  population_notes:
    age:
      youth: 幼兒(0–4)家庭浴缸/充氣泳池最高危；學齡兒童游泳教育顯著降風險，開放水域危機來自水流低估
      adult_beginner: 成人初學低估開放水域波流
      masters: 心臟共病增加，開放水域突發驟停風險
    sex:
      male: 各年齡死亡率約女性 2 倍(風險行為+酒精+離岸游泳)
      female: null
