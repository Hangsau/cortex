injuries:
- id: biceps-tendinopathy
  zh: 肱二頭肌長頭肌腱病
  en: Biceps (long head) tendinopathy
  category: A-shoulder-upper
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 肱二頭肌長頭腱
  - 結節間溝
  - 旋轉肌袖
  - 旋轉間隔
  mechanism:
    summary: 肱二頭肌長頭腱(LHB)於結節間溝承受摩擦，推進期(自由式/蝶式拉水)反覆張力與剪切。LHB 兼任肱骨頭前方穩定器，當棘上肌功能下降後 LHB 代償超載而腱病；穩定肌疲勞後肩胛前傾增加溝內壓迫。多與旋轉肌袖退化共存，常為旋轉肌袖完整性下降之繼發表現。
    trigger_phase: 自由式拉水轉換、背泳恢復、蝶式入水
    who: 較大年齡者(Masters 尤甚)、棘上肌腱病共存者、肩部疼痛史者
  epidemiology:
    prevalence: Masters 泳者超音波(n=80 泳者/40 對照)LHB 腱病 48.8% vs 對照 12.5%；棘上肌與 LHB 共存率 22–78.5%(n=200 約 49% 共存退化);年齡每增 1 歲 LHB 腱病風險 +5%、晚競技每增 1 年 +4%
    certainty: 🟡
    evidence_grade: B
    caveat: 主要為 Masters 影像數據，年輕競技者資料較少；多與旋轉肌袖損傷共病，獨立歸因困難
    sources:
    - Masters swimmers shoulder ultrasound, PMC7824457 (已驗證)
    - LHB and rotator cuff coexistence systematic review, PMC4247626 (已驗證)
    source_ids:
    - src.pmc7824457
    - src.pmc4247626
  risk_factors:
  - text: 棘上肌腱病共存
    grade: B
  - text: 年齡增長(Masters)
    grade: B
  - text: 肩部疼痛史(OR 3.95)
    grade: B
  - text: 過頭活動量大
    grade: B
  - text: 旋轉間隔病變
    grade: C
  prevention:
  - text: 旋轉肌袖整體強化(避免 LHB 代償)
    grade: B
  - text: 仰泳/蛙泳輪換
    grade: Expert
  - text: 每週 ≥2 天休息
    grade: Expert
  management:
    red_flags:
    - Speed/Yergason 高度陽性+溝觸痛 → 就醫
    - 急性斷裂(Popeye 隆起) → 就醫
    - 與 SLAP 共存深部痛 → 骨科評估
    - 靜息/夜間痛 → 就醫
    acute: 休息、NSAIDs、必要時超音波導引注射(類固醇/PRP 短期止痛)
    pain_rules: 輕度前肩活動痛 → 調量避過度拉水；靜息/夜間痛 → 停水中訓練
    rehab: 減負荷→再負荷；以棘上肌+旋轉肌袖穩定為核心減少 LHB 代償；體外震波(ESWT)、PRP 為輔助選項
    functional_progression_criteria:
    - Speed/Yergason 無痛
    - 拉水無前肩痛
    - 肌力 ≥85% 對側
    swim_modifications_in_rehab:
    - 減拉水頻率、停划手板
    - 改踢腿板/浮袋訓練
    return_to_train: 保守反應良好者漸進回水
    return_to_compete: 視旋轉肌袖整體恢復而定
    prognosis: 多數保守反應良好；手術(tenodesis/tenotomy)保留給失敗者，年輕/活動型偏 tenodesis、Masters 可接受 tenotomy
  population_notes:
    age:
      youth: 資料較少
      adult_beginner: null
      masters: 主要風險群
    sex:
      female: 女性特定數據缺失(DATA GAP)
      male: null
    ability:
      para: Para 數據缺失(DATA GAP)
    lifecycle: null
  links:
    mechanism_link: LHB 是在棘上肌功能下降後才代償超載——旋轉肌袖腱病常是本症的上游，風險因子亦列「棘上肌腱病共存」
    mechanism_link_ids:
    - rotator-cuff-tendinopathy
    technical_link: null
    technical_link_ids: []
    perception_link: null
    perception_link_ids: []
  references:
  - citation: Shoulder pathology in masters swimmers, PMC7824457
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc7824457
  - citation: LHB tendon and rotator cuff coexistence, PMC4247626
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc4247626
  flags:
    contested:
    - claim: LHB 腱病為獨立病變或旋轉肌袖損傷繼發
      consensus_source: 文獻傾向視為旋轉肌袖完整性下降之代償繼發
      dissent_source: tenodesis vs tenotomy 在年輕運動員的選擇仍有爭論
    vintage_warning: false
- id: rotator-cuff-tendinopathy
  zh: 旋轉肌袖肌腱病（棘上肌）
  en: Rotator cuff (supraspinatus) tendinopathy
  category: A-shoulder-upper
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 棘上肌腱
  - 旋轉肌袖
  - 肩峰下空間
  - 肩胛穩定肌
  mechanism:
    summary: 棘上肌腱在划水推進期承受肩峰下壓縮與腱內張力、恢復期被過頭拉伸，反覆機械刺激活化基質金屬蛋白酶(MMP)並升高一氧化氮，造成膠原排列紊亂、細胞型態退化——是退化性腱病(tendinopathy)而非單純發炎。精英泳者每日肩部迴轉超過 2,500 次、年累積上百萬次為核心外在負荷。肩胛動態控制不足、內外旋肌力失衡會放大腱內應力。
    trigger_phase: 自由式/蝶式拉水與過頭恢復相
    who: 訓練量大者(≥15 h/週或 ≥35 km/週)、青少年急遽增量期、肩胛控制不足者、技術缺陷(手肘下垂/路徑偏移)者
  epidemiology:
    prevalence: Masters 泳者超音波研究棘上肌腱病 17.5%、合併部分撕裂達 35%；多站點青少年調查(n=671)49% 有肩部症狀、15–17 歲 55.5% 有疼痛史；棘上肌腱厚度每增 1 mm 腱病 OR 2.51
    certainty: 🟡
    evidence_grade: B
    caveat: 多為影像橫斷面；影像改變不等於臨床疾病(Masters 影像盛行率遠高於有症狀者)；訓練量倍率與部分 MRI 數字為二手綜述引用待追原始研究
    sources:
    - Masters swimmers shoulder ultrasound, PMC7824457 (已驗證)
    - Youth swimmer shoulder pain multi-site survey, PMC11297363 (已驗證)
    source_ids:
    - src.pmc7824457
    - src.pmc11297363-b
  risk_factors:
  - text: 高訓練量/急遽增量(>15 h/週或 >35 km/週)
    grade: B
  - text: 肩胛動作異常(疲勞後出現)
    grade: B
  - text: 內/外旋肌力失衡
    grade: B
  - text: 多向性肩鬆弛
    grade: B
  - text: 棘上肌腱厚度增加(每 mm OR 2.51)
    grade: B
  - text: 肩部受傷史(解釋約 22% 疼痛變異)
    grade: B
  - text: 技術缺陷(手肘下垂/路徑偏移)
    grade: Expert
  prevention:
  - text: 旋轉肌袖+肩胛穩定肌訓練(12 週×2/週)
    grade: B
  - text: 每週訓練量增幅 ≤10%
    grade: Expert
  - text: 賽季前 dryland 陸上訓練
    grade: B
  - text: 技術修正(增加軀幹旋轉、高肘划水)
    grade: Expert
  management:
    red_flags:
    - 靜息/夜間痛 → 就醫評估
    - 神經放射痛/手麻 → 就醫(排除頸椎/TOS)
    - 急性撕裂感+無力 → 就醫
    - 保守治療 3–6 月無效 → 骨科評估
    acute: 減量、冰敷、短期 NSAIDs、停用划手板
    pain_rules: NRS ≤3 且 24 小時內消退 → 減量續練；疼痛 >24 小時或 NRS ≥4 → 停划手練習、啟動物理治療
    rehab: ①肩胛穩定(前鋸肌、下斜方肌)+後囊拉伸 ②旋轉肌等長→向心→離心漸進 ③功能性重建模擬划手
    functional_progression_criteria:
    - 外旋肌力 ≥85% 對側
    - 肩胛控制正常
    - 模擬划手動作無痛
    swim_modifications_in_rehab:
    - 停蝶式、減自由式量、停划手板
    - 可從背泳低強度開始
    return_to_train: 輕症 4–8 週、中重症 8–16 週漸進回水
    return_to_compete: 肌力與技術指標達標後分階段回賽
    prognosis: 多數完全恢復；與 SLAP/MDI 共存較複雜；高量者易復發，需長期維持旋轉肌袖+肩胛肌力
  population_notes:
    age:
      youth: 15–17 歲流行率最高；成長期肌腱更脆弱，是教練重點問診對象
      adult_beginner: 技術不穩，風險不低於競技者
      masters: 棘上肌腱病盛行率隨年齡顯著上升(影像 75% vs 對照 17.5%)
    sex:
      female: 女性肩傷率較高但系統回顧結論不一致
      male: null
    ability:
      para: 上肢截肢者健側過度使用風險高，缺量化數據(DATA GAP)
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Shoulder pathology in masters swimmers (ultrasound), PMC7824457
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc7824457
  - citation: Shoulder pain in youth competitive swimmers, PMC11297363
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11297363-b
  - citation: 'Feijen S, Tate A, Kuppens K, Claes A, Struyf F. (2020). Swim-Training Volume and Shoulder Pain Across the Life Span of the Competitive Swimmer: A Systematic Review. J Athl Train 55(1):32-41. PMID 31935141 / PMC6961642（2026-09-04 更正：跨生涯期訓練量綜述，不是青少年盛行率研究）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.feijen-2020
  - citation: 'Tavares N, Vilas-Boas JP, Castro MA. (2025). Effect of Preventive Exercise Programs for Swimmer''s Shoulder Injury on Rotator Cuff Torque and Balance in Competitive Swimmers: A Randomized Controlled Trial. Healthcare (Basel) 13(5):538. PMID 40077099 / PMC11899141（2026-09-04 更正：終點是力矩與平衡，不是傷害發生率，不得寫成已證實的保護效果）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.tavares-2025
  flags:
    contested:
    - claim: 腱病 vs 夾擠(impingement)命名
      consensus_source: 現代共識傾向 tendinopathy 退化框架
      dissent_source: 傳統 impingement 模型仍見於部分臨床語境；影像改變≠臨床疾病
    vintage_warning: false
- id: shoulder-multidirectional-instability
  zh: 多向性肩關節不穩定（MDI）
  en: Multidirectional shoulder instability
  category: A-shoulder-upper
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 肩關節囊韌帶
  - 旋轉肌袖
  - 肩胛穩定肌
  - 盂肱關節
  mechanism:
    summary: 關節囊韌帶整體鬆弛使肱骨頭向 ≥2 個方向(前/後/下)過度移位。幼年反覆大幅外展外旋(蝶式、自由式恢復期)造成後天性關節囊拉伸；部分人有先天廣泛韌帶鬆弛(Ehlers-Danlos/Marfan 傾向)。當旋轉肌袖與肩胛肌無法動態補償時症狀顯現，表現為鬆動感、半脫位、dead arm。
    trigger_phase: 需極端外展外旋角度的入水與過頭恢復相
    who: 女性、雙側症狀者、結締組織鬆弛者、年輕游泳者
  epidemiology:
    prevalence: MDI 佔所有肩不穩定 <10%；游泳者 MDI 盛行率被認為高於其他運動，但**無精確數字**。對照 Trikha 等 2022（NCAA D1 泳者）：肩部佔肌肉骨骼傷害 **23.3%（126/540）**，為第一大部位——但該研究**未區分 MDI 與其他肩病理**，不能當 MDI 盛行率。
    certainty: 🟠
    evidence_grade: C
    caveat: 2026-08-18 更正（來源撐不起數字）：原欄寫「女性佔 MDI 患者約 35.7%」「喙肱距每增 1 mm 風險上升約 20%」，掛在 Bishop 等 2022（Ann Joint 7:10）之下——**該文是敘事型回顧、以女性運動員視角撰寫、未做統合統計，摘要中沒有這兩個數字**，已移出流行率欄。要保留須另找原始研究。另：TOS／旋轉肌袖損傷易混淆；游泳者 MDI 特定盛行率僅為摘要層級無前瞻數據；診斷標準不完全統一。
    sources:
    - Multidirectional instability of the shoulder, StatPearls NBK557726 (已驗證)
    - Bishop ME, et al. (2022). Multidirectional instability of the shoulder（敘事型回顧）. Ann Joint 7:10. PMID 38529164
    source_ids:
    - src.multidirectional-instability-of-the-shoulder
    - src.mdi-management-review-annals-of-joint
  risk_factors:
  - text: 廣泛韌帶鬆弛
    grade: B
  - text: 結締組織疾患(Ehlers-Danlos/Marfan)
    grade: B
  - text: 反覆過頭微創傷
    grade: B
  - text: 女性(雌激素/鬆弛素影響，結論不一)
    grade: B
  - text: 年輕(第二、三十歲高峰)
    grade: B
  - text: 喙肱距增加(每 mm 風險 +20%)
    grade: B
  prevention:
  - text: 肩胛穩定肌+旋轉肌袖強化(青少年主動預防)
    grade: Expert
  - text: 避免過度柔軟度訓練
    grade: Expert
  - text: 適度減少高角度訓練量
    grade: Expert
  management:
    red_flags:
    - 神經症狀(手麻/無力) → 就醫
    - 明顯 Sulcus sign + 功能受限 → 骨科
    - 反覆半脫位/dead arm → 停誘發動作就醫
    - 保守治療 6 月無效 → 手術評估
    acute: 限制誘發方向、肩胛穩定訓練、姿勢教育
    pain_rules: 日常輕度不適可續練但避誘發動作；dead arm / 反覆半脫位 → 立即停
    rehab: 非手術為第一線 ≥3–6 月：肩胛穩定(Blackburn Y、push-up plus)+旋轉肌+本體感覺+胸小肌柔軟度；保守 6–12 月 83–90% 改善
    functional_progression_criteria:
    - 誘發方向無不穩感
    - 肩胛動態控制達標
    - 本體感覺/閉鏈測試通過
    swim_modifications_in_rehab:
    - 減少高外展外旋角度訓練
    - 優先旋轉為主泳式、限制蝶式
    return_to_train: 保守復健達標後漸進回水
    return_to_compete: 術後 86–93% 恢復運動；8 年隨訪 82% 持續改善
    prognosis: 保守對多數有效；手術保留給保守失敗者(關節鏡全囊縫摺術復發率約 6%，熱收縮術已淘汰)
  population_notes:
    age:
      youth: 最常診斷年齡層
      adult_beginner: null
      masters: 文獻少，推測後天鬆弛累積
    sex:
      female: 風險因鬆弛度高而增，流行病學數據仍不足
      male: null
    ability:
      para: 文獻極少(DATA GAP)
    lifecycle: null
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: Multidirectional instability of the shoulder, StatPearls NBK557726
    certainty: 🟢
    verified: true
    source_ids:
    - src.multidirectional-instability-of-the-shoulder
  - citation: Bishop ME, Ode GE, Hurwit DJ, et al. (2022). Multidirectional instability of the shoulder（敘事型回顧，女性運動員視角，無統合統計）. Ann Joint 7:10. PMID 38529164, doi:10.21037/aoj-20-33
    certainty: 🟢
    verified: true
    source_ids:
    - src.mdi-management-review-annals-of-joint
  - citation: 'Ruiz Ibán MA, Díaz Heredia J, García Navlet M, Serrano F, Santos Oliete M. (2017). Multidirectional Shoulder Instability: Treatment. Open Orthop J 11:812-825. PMID 28979595 / PMC5611704（2026-09-04 更正：治療綜述，不是關節鏡對開放手術的療效比較研究）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.ruiz-iban-2017
  flags:
    contested:
    - claim: 先天 vs 後天鬆弛比例
      consensus_source: MDI 涵蓋先天廣泛鬆弛與後天反覆微創傷兩型
      dissent_source: 兩型比例與手術 vs 保守門檻仍有爭論；關節鏡活動度較佳、開放長期穩定性差異縮小
    vintage_warning: false
- id: slap-lesion
  zh: 上盂唇前後損傷（SLAP）
  en: Superior labrum anterior-posterior (SLAP) lesion
  category: A-shoulder-upper
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 上盂唇
  - 肱二頭肌長頭腱錨點
  - 盂肱關節囊
  - 後囊
  mechanism:
    summary: 上盂唇自肩盂緣撕脫，可延伸至前後及肱二頭長頭腱錨點。游泳主機制為 peel-back——外展 90°+最大外旋(自由式入水、蝶式拉水起點)時二頭腱錨點承受扭轉剪切；減速期二頭肌偏心收縮為另一路徑；急性牽引可單次造成。內旋缺損(GIRD)使後上盂唇張力集中。
    trigger_phase: 入水至拉水早期(外展外旋極限)
    who: GIRD(內旋缺損 >13–15°)者、優勢側高量者、急性牽引史者
  epidemiology:
    prevalence: 一般肩關節鏡中 SLAP 佔 6–26%；過頭運動員關節鏡盂唇病變比例高(投擲者達 83%，屬選擇性手術族群)；游泳者保守無效後關節鏡盂唇病變達 61%(小樣本 n=14 中 SLAP 2 例)
    certainty: 🟠
    evidence_grade: C
    caveat: 游泳者 SLAP 無大型前瞻數據，現有比例全來自偏態手術樣本；跨研究手術結果變異極大(40–94%)
    sources:
