      consensus_source: 2024 AHA 更新允許兩序，但強調溺水通氣重要性遠高於一般心臟驟停
      dissent_source: 標準成人驟停 CAB(壓縮優先)演算法
    vintage_warning: false
    terminology_note: 『乾溺水 dry drowning』『近乎溺水 near-drowning』為過時/不建議術語，ILCOR 統一用『溺水(存活/死亡)』描述
- id: exertional-sudden-cardiac-death
  zh: 運動性猝死（游泳 / 運動員）
  en: Exertional sudden cardiac death — swimming / athletes
  category: D-systemic-acute
  environment:
  - pool
  - open_water
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 心臟(心肌/傳導系統/冠狀動脈)
  - 自主神經系統
  mechanism:
    summary: 運動中或運動後 1 小時內突發心跳驟停(多為心室顫動)。病理基礎多元：肥厚性心肌病(HCM)使心肌增厚影響傳導；心肌炎使發炎心肌電不穩；長 QT 等離子通道病變於運動觸發惡性心律不整；冠狀動脈異常運動時受壓缺血；commotio cordis 為胸前鈍擊在 T 波升段觸發 VF。游泳特有：面浸冷水強烈副交感(潛水反射)與運動交感激活形成自主神經衝突，在潛在易感者可致命。
    trigger_phase: 游泳中突然意識喪失/沉水；鐵人三項游泳段(冷水+面浸+起跳緊張過度換氣多重壓力疊加)為最高風險情境
    who: 家族猝死史者、未診斷 HCM/LQTS/WPW、心肌炎後過早復訓者、男性(約女性 6 倍)、Masters(冠心病加入)
  epidemiology:
    prevalence: 競技運動員(≤35 歲)SCA/SCD 男性約 1.46、女性約 0.30 /10 萬運動員年；≤35 歲青年運動員猝死中 HCM 約佔 36%
    certainty: 🟢
    evidence_grade: B
    caveat: 游泳池獨立 SCD 數字無可靠單一來源，多依運動員整體數據推算；鐵人三項游泳段每 10 萬數字研究間差異大。 **使用邊界（2026-08-18 補）**：「3.6→0.4／10 萬、降 89%」出自 Corrado 等 2006（JAMA 296(13):1593-601），其資料範圍是**義大利 Veneto 單一大區、1979–2004 年、全體競技運動員**， **不是游泳專項**；且 ECG 全面篩查的成本效益在 ACC／AHA 立場中仍有異議，引用此數字時須同時呈現該爭議（見 flags.contested）。
    sources:
    - Sex Differences in SCA/SCD in Competitive Athletes 系統綜述+meta, PMC11985649 (已驗證)
    - Corrado D, Basso C, Pavei A, et al. (2006). Trends in sudden cardiovascular death in young competitive athletes after implementation of a preparticipation screening program. JAMA 296(13):1593-601. PMID 17018804, doi:10.1001/jama.296.13.1593
    - Commotio Cordis in 2023, PMC10356869 (已驗證)
    source_ids:
    - src.pmc11985649
    - src.ecg-scd-3-6-0-4-10-89-url
    - src.pmc10356869
  risk_factors:
  - text: HCM(肥厚性心肌病，最常見單一原因)
    grade: A
  - text: 先天性冠狀動脈異常
    grade: B
  - text: 心肌炎(尤近期病毒性後過早復訓)
    grade: B
  - text: 長 QT 症候群(冷水浸入為特定觸發)
    grade: B
  - text: Wolff-Parkinson-White(WPW)
    grade: B
  - text: 男性(約 6 倍風險)
    grade: A
  - text: commotio cordis(胸前鈍擊 T 波敏感期)
    grade: B
  - text: 冷水+面浸+屏氣(自主神經衝突)
    grade: B
  - text: 家族 SCD 史(一等親 <50 歲猝死)
    grade: Expert
  - text: 賽前感冒/發燒(可能遮蔽心肌炎)
    grade: Expert
  prevention:
  - text: 運動前篩查(病史+理學檢查±ECG)
    grade: A
  - text: ECG 篩查(ESC 推薦；義大利自然實驗 89% 減 SCD，美 ACC 立場有爭議)
    grade: A
  - text: 心肌炎後充分休息(≥6 個月，LVEF 恢復+無誘發心律不整後方回訓)
    grade: Expert
  - text: 賽場/泳池 AED 即時可取得 + 人員 CPR/AED 培訓
    grade: A
  - text: 不在感冒/發燒期訓練
    grade: Expert
  - text: LQTS 已知者避免冷水/強度衝刺
    grade: Expert
  management:
    red_flags:
    - 游泳中意識喪失/突然沉水 → 立即救援+CPR
    - 運動中突發心悸/胸痛/暈厥任一 → 立即停止就醫
    - 不明原因劇烈呼吸困難(排除溺水) → 排查心因
    acute: 安全地點立即 CPR(有目擊且具技能可先水中救援呼吸再上岸)→上岸 5 次救援呼吸+按壓(30:2)→盡快 AED(SCD 多為 VF，除顫最有效)→持續 CPR 直至 AED/救援到場；懷疑心肌炎者入院延伸心臟評估，不可未評估復訓
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - HCM：2022 JACC 趨個別化風險分層，不再一律禁競技
    - 心肌炎：≥6 個月休息+LVEF 正常+運動誘發心律不整陰性
    - LQTS：β 阻斷劑治療下部分可恢復游泳
    swim_modifications_in_rehab: null
    return_to_train: 依病因經心臟科風險分層評估綠燈 → 漸進回水
    return_to_compete: 心臟專科評估通過 + 個別化風險討論 → 復賽
    prognosis: commotio cordis 即時 CPR+AED 存活可達 >50%(過去曾低至 15%)；一般運動驟停每延遲 1 分鐘存活率降 7–10%
  population_notes:
    age:
      youth: HCM/LQTS/commotio cordis 為主，需強制運動前篩查
      adult_beginner: 未診斷冠心病/HCM 風險，篩查應覆蓋成人
      masters: 冠心病為首要新增因子；ECG+超音波評估更重要
    sex:
      male: 整體約 6 倍風險
      female: 整體風險低，但先天冠狀動脈異常在女性 SCD 佔比更高
    ability: null
    lifecycle:
      open_water: 鐵人三項游泳段多重自主神經壓力疊加，為最高 SCD 風險情境之一
  links:
    mechanism_link: 游泳特有的自主神經衝突（面浸潛水反射 × 運動交感激活）與冷水休克為同一機轉，風險因子亦列「冷水+面浸+屏氣」
    mechanism_link_ids:
    - cold-water-shock
    technical_link: null
    technical_link_ids: []
    perception_link: null
    perception_link_ids: []
  references:
  - citation: 'Sex Differences in the Incidence of SCA/Death in Competitive Athletes: systematic review and meta-analysis, PMC11985649'
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11985649
  - citation: 'Semsarian C, et al. (2022). Athletic Activity for Patients With Hypertrophic Cardiomyopathy and Other Inherited Cardiovascular Diseases: JACC Focus Seminar 3/4. J Am Coll Cardiol 80(13):1268-1283. PMID 36075839（綜述，非原始研究；涵蓋範圍不只 HCM）'
    certainty: 🟢
    verified: true
    source_ids:
    - src.semsarian-2022
  - citation: Commotio Cordis in 2023, PMC10356869
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc10356869
  - citation: Goff NK, Hutchinson A, Koek W, Kamat D. (2023). Meta-analysis on the Effectiveness of ECG Screening for Conditions Related to Sudden Cardiac Death in Young Athletes. Clin Pediatr (Phila) 62(10):1158-1168. PMID 36797841 / PMC10478328
    certainty: 🟢
    verified: true
    source_ids:
    - src.goff-2023
  - citation: Corrado D, Basso C, Pavei A, Michieli P, Schiavon M, Thiene G (2006). Trends in sudden cardiovascular death in young competitive athletes after implementation of a preparticipation screening program. JAMA 296(13):1593-601. PMID 17018804（義大利 Veneto 單區、全體競技運動員、非游泳專項）
    certainty: 🟢
    verified: true
    source_ids:
    - src.ecg-scd-3-6-0-4-10-89-url
  - citation: Lundström et al. diving reflex arrhythmia 2025, PMC12234767
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc12234767
  flags:
    contested:
    - claim: ECG 常規篩查
      consensus_source: ESC 主張 ECG 篩查(義大利自然實驗為最強證據)
      dissent_source: ACC/AHA 反對常規 ECG 篩查(混淆因素多)
    vintage_warning: false
- id: hypothermia-swimmers
  zh: 游泳者低體溫（開放水域）
  en: Hypothermia in swimmers / open-water hypothermia
  category: D-systemic-acute
  environment:
  - open_water
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  fatal_acute: true
  structures:
  - 核心體溫調節系統
  - 心臟傳導系統
  - 中樞神經系統
  mechanism:
    summary: 水導熱率為空氣 25 倍，泳者持續對流/傳導散熱。散熱速率超過產熱→核心體溫下降。輕度(32–35°C)顫抖+協調下降；中度(28–32°C)意識模糊+心律不整危險升；重度(<28°C)心室顫動風險劇增。「後降(afterdrop)」是關鍵危機：離水後周邊冷血回流使核心溫續降，可能在救援後才誘發驟停。
    trigger_phase: 長距離冷水(<18°C)游泳/超距賽末段；離水後不當處置(站立行走加速後降)
    who: 低體脂瘦型泳者、低體重兒童、未穿防寒衣的 10km+ 開放水域選手；超距(海峽)泳者核心溫可降 3–4°C 持續數小時
  epidemiology:
    prevalence: 無全球獨立盛行率(多以賽事為單位)；長距離開放水域賽事為顯著醫療風險
    certainty: 🟡
    evidence_grade: B
    caveat: 同一場賽事可同時出現低體溫與高體溫個案(核心溫變化 −3.1 至 +2.7°C)；多數研究為觀察性無對照
    sources:
    - Brannigan D, Rogers IR, Jacobs I, et al. (2009). Hypothermia is a significant medical risk of mass participation long-distance open water swimming. Wilderness Environ Med 20(1):14–18. PMID 19364182
    - JSAMS 開放水域/泳池體溫調節, PubMed 40783351 (已驗證)
    - Doha 2024 Masters 3km 核心溫研究（2025 發表）, PubMed 39500300 (已驗證)
    source_ids:
    - src.brannigan-et-al-hypothermia-mass-participati-2009
    - src.pmid-40783351
    - src.pmid-39500300
  risk_factors:
  - text: 水溫 <18°C(競賽分界)
    grade: B
  - text: 低體脂率/低體重
    grade: B
  - text: 長距離(10km+ / >1 小時)
    grade: B
  - text: 未穿防寒衣(規則允許時不穿)
    grade: B
  - text: 賽前訓練量不足
    grade: Expert
  - text: 脫水(降低循環效率)
    grade: Expert
  prevention:
  - text: 遵守 World Aquatics 水溫規範(下限近年趨提高)
    grade: Expert
  - text: 規則允許下穿防寒衣
    grade: B
  - text: 賽事設計合理中止時限(視水溫/預期時間)
    grade: Expert
  - text: 賽後即時隔熱(乾燥保暖衣物)
    grade: Expert
  - text: 辨識輕度低體溫症狀及早退出，不超時
    grade: Expert
  management:
    red_flags:
    - 顫抖停止(可能為中度加重、產熱失效) → 警訊
    - 意識混亂/言語不清/行為怪異(核心約 32°C) → 緊急處置
    - 無法協調動作/心律不整/意識喪失 → 緊急後送
    - 後降危機：上岸看似回暖仍可能數十分鐘內惡化；禁止讓傷者站立行走
    acute: WMS 2019：輕柔移出冷水保持水平(直立致救援崩潰)→防風脫濕衣隔熱保暖(避免直接熱敷防燙傷+加劇後降)→暖化腋下/鼠蹊(熱水袋)+暖氧→禁劇烈活動。輕度被動復溫；中度主動外部複溫+嚴密監測心律；重度緊急後送 ECMO 體外加溫。無心跳則 CPR 直至醫院(『暖了才算死』原則)
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 輕度完全恢復後數天可回水
    - 中重度需醫師評估心臟功能、排除續發心律不整風險
    swim_modifications_in_rehab:
    - 反覆低體溫事件須排查冷誘發心律不整易感體質
    return_to_train: 輕度恢復後數天；中重度待心臟評估綠燈
    return_to_compete: 核心溫調節與心臟評估正常 + 賽前準備(防寒/習化)到位 → 復賽
    prognosis: 輕中度多完全恢復；重度(<28°C)死亡率高但冷水低體溫即使外表『死亡』仍有復甦可能，應積極救治
  population_notes:
    age:
      youth: 體表面積比大降溫更快，賽事應採更嚴格水溫門檻
      adult_beginner: null
