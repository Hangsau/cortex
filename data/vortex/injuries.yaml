- id: acanthamoeba-keratitis
  zh: 棘阿米巴角膜炎（隱形眼鏡泳者）
  en: Acanthamoeba keratitis in swimmers
  category: C-nonMSK-medical
  environment:
  - pool
  - open_water
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  structures:
  - 角膜上皮
  - 角膜基質
  - 角膜神經
  mechanism:
    summary: 棘阿米巴(Acanthamoeba)為環境中普遍存在的自由生活原蟲，以包囊(cyst)形態抗環境耐氯。戴隱形眼鏡時鏡片與角膜間形成微缺氧及微小上皮損傷，原蟲附著於鏡片並侵入角膜上皮、沿角膜神經擴散(致劇痛與環形浸潤)，包囊形態對藥物與消毒高度抵抗，治療困難且病程數月。游泳時戴隱形眼鏡(尤其軟式)被水中原蟲污染、或用自來水沖洗/保存鏡片為主要途徑。標準泳池游離氯無法殺滅包囊，防護依賴鏡片管理而非水質。
    trigger_phase: 戴隱形眼鏡游泳/泡水、用自來水洗鏡片或鏡盒、戴鏡淋浴
    who: 隱形眼鏡配戴者(約佔病例 9 成)、配戴軟式日拋未取下即下水者、開放水域/溫泉接觸者
  epidemiology:
    prevalence: 依 Aiello 等人（2025）的統合分析（105 篇研究、91,951 眼），對總人口的比率約每百萬 2.34 眼（95% CI 0.98–5.55），2023 年基準推估全球約 12,953 眼；AK 佔非病毒性微生物角膜炎的 1.52%。隱形眼鏡配戴為最大宗危險因子（Garg & Daigavane 2024）；確診前誤用類固醇為最強不良預後因子
    certainty: 🟢
    evidence_grade: B
    caveat: 屬罕見但破壞性極強之眼科急症；發生率受隱形眼鏡使用率與通報品質影響，地區差異大；游泳特異性歸因比例缺精確分母
    sources:
    - 'Aiello, F., Gallo Afflitto, G., Ceccarelli, F., Turco, M. V., et al. (2025). Perspectives on the Incidence of Acanthamoeba Keratitis: A Systematic Review and Meta-Analysis. Ophthalmology, 132(2), 206-218.'
    - Garg, D., & Daigavane, S. (2024). A Comprehensive Review on Acanthamoeba Keratitis. Cureus, 16(8), e67803.
    source_ids:
    - src.aiello-2025-ak-incidence-meta
    - src.pmc11424229
  risk_factors:
  - text: 戴隱形眼鏡游泳/泡水
    grade: B
  - text: 用自來水沖洗或保存隱形眼鏡/鏡盒
    grade: B
  - text: 戴隱形眼鏡淋浴/泡溫泉
    grade: B
  - text: 鏡片衛生不良(過夜配戴、延長配戴)
    grade: B
  - text: 角膜既有微小外傷
    grade: Expert
  prevention:
  - text: 游泳/泡水/淋浴前取下隱形眼鏡(單一最重要措施)
    grade: B
  - text: 必須戴鏡下水則用密封泳鏡並改日拋、出水即丟
    grade: Expert
  - text: 絕不以自來水沖洗或保存鏡片/鏡盒
    grade: B
  - text: 鏡盒定期更換、用專用保存液
    grade: Expert
  - text: 出現紅眼/異物感/畏光持續勿自行點藥拖延，儘速眼科
    grade: Expert
  management:
    red_flags:
    - 與體徵不成比例的劇烈眼痛 → 緊急眼科
    - 戴隱形眼鏡者持續紅眼/畏光/視力模糊 → 緊急眼科(勿先點類固醇)
    - 角膜環形浸潤/上皮反覆缺損 → 角膜專科
    - 點抗生素/抗病毒無改善的角膜炎 → 重新評估阿米巴
    acute: 立即停戴隱形眼鏡並送角膜專科；確診靠共軛焦顯微鏡/角膜刮取培養/PCR。治療為長療程(數月)雙重抗阿米巴：雙胍類(PHMB/chlorhexidine)+二脒類(propamidine/hexamidine)；嚴重或藥物無效需角膜移植。確診前誤用類固醇會惡化預後，為關鍵禁忌
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 角膜炎完全治癒且眼科同意後方可恢復戴鏡/下水
    - 病史者強烈建議改採非鏡片視力矯正(眼鏡/雷射)後再下水
    swim_modifications_in_rehab: null
    return_to_train: 感染治癒、眼科放行後回水，並落實不戴鏡游泳
    return_to_compete: null
    prognosis: 早期確診且未誤用類固醇者預後較佳；延誤診斷或誤用類固醇者約四成視力結果不佳，重症可致角膜瘢痕、失明甚至需移植或摘除
  population_notes:
    age:
      youth: 青少年隱形眼鏡使用上升(美觀/運動)，泳前取鏡衛教應提早納入
      adult_beginner: 成人初學戴鏡下水習慣最須提醒
      masters: null
    sex: null
    ability:
      para: null
    lifecycle:
      open_water: 開放水域/溫泉原蟲負荷高，戴鏡風險更甚泳池
  links:
    mechanism_link: null
    technical_link: null
    perception_link: null
  references:
  - citation: 'Aiello, F., et al. (2025). Perspectives on the Incidence of Acanthamoeba Keratitis: A Systematic Review and Meta-Analysis. Ophthalmology, 132(2), 206-218.'
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc11424229
  flags:
    contested:
    - claim: 泳池水質能否防護
      consensus_source: 標準氯化無法殺滅棘阿米巴包囊，防護須靠鏡片管理
      dissent_source: 部分公衛建議仍強調水質維護，但對包囊實效有限，重點仍在不戴鏡下水
    vintage_warning: false
- id: chlorine-eye-irritation
  zh: 氯 / 化學性結膜炎與角膜刺激
  en: Chlorine / chemical conjunctivitis & corneal irritation
  category: C-nonMSK-medical
  environment:
  - pool
  sport_variant:
  - swim
  layer:
  - public
  - clinical
  structures:
  - 角膜上皮
  - 結膜
  - 淚膜
  mechanism:
    summary: 真正刺激源非氯本身而是氯胺(chloramines)，尤其三氯胺(NCl₃)——氯與游泳者帶入有機物(汗/尿素/皮脂)反應生成。三氯胺溶解淚膜脂質層、破壞淚膜穩定；池水相對淚液為低張，水分移入角膜上皮致暫時性角膜水腫。結果為化學性結膜炎(紅眼/灼熱/流淚)合併乾眼與暫時性視力模糊。
    trigger_phase: 室內泳池(三氯胺封閉累積)、水質管理不佳、無泳鏡游泳
    who: 所有不戴泳鏡游泳者；長時間/高頻訓練競技泳者；室內泳池工作人員
  epidemiology:
    prevalence: 自由氯約 8 ppm 開始出現結膜刺激、20 ppm 明確反應；游泳者紅眼/刺激主觀症狀極常見但缺系統盛行率；室內泳池工作者三氯胺相關眼症狀約佔 1/3–2/5
    certainty: 🟡
    evidence_grade: C
    caveat: 缺游泳者眼症狀全球前瞻盛行率；『結膜炎』vs『刺激』判準不一；多數研究聚焦職業工作者非一般泳者
    sources:
    - Chloramine eye irritation 機制研究, PMC6137694 (已驗證)
    source_ids:
    - src.pmc6137694
  risk_factors:
  - text: 不戴泳鏡游泳
    grade: Expert
  - text: 室內泳池(三氯胺不易散逸)
    grade: Expert
  - text: 長時間高頻游泳
    grade: Expert
  - text: 既有乾眼或配戴角膜接觸鏡
    grade: Expert
  - text: 泳池 pH 失衡/高有機負荷
    grade: Expert
  prevention:
  - text: 全程戴密封型泳鏡
    grade: Expert
  - text: 游泳後立即以清水/生理食鹽水沖洗眼部
    grade: Expert
  - text: 泳池維持 pH 7.2–7.8 與適當換水率
    grade: Expert
  - text: 室內泳池加強通風降低空氣三氯胺
    grade: Expert
  - text: 入池前淋浴減少有機負荷
    grade: Expert
  management:
    red_flags:
    - 游泳後 >48 小時刺激未緩解 → 就醫
    - 持續視力模糊(非瞬間) → 就醫
    - 膿性分泌物/劇痛/畏光/角膜混濁 → 懷疑細菌/阿米巴角膜炎(見 acanthamoeba-keratitis)
    acute: 立即以清水沖洗約 20 分鐘；無防腐劑人工淚液每日多次。化學性刺激通常 24–48 小時自癒，不需抗生素
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 刺激症狀完全緩解即可返泳(無細菌感染時不影響返泳時機)
    swim_modifications_in_rehab: null
    return_to_train: 症狀緩解後回水並改善護目防護
    return_to_compete: null
    prognosis: 化學性刺激預後極佳近乎完全自癒；角膜接觸鏡配戴者若無保護有較高進展為細菌/阿米巴角膜炎風險
  population_notes:
    age:
      youth: 不習慣戴泳鏡或密封不佳，症狀最常見
      adult_beginner: null
      masters: 既有乾眼者症狀更明顯
    sex: null
    ability:
      para: null
    lifecycle: null
  links:
    mechanism_link: 紅旗條目直接指名：劇痛/畏光/角膜混濁需排除棘阿米巴角膜炎（隱形眼鏡泳者為高風險族群）
    mechanism_link_ids:
    - acanthamoeba-keratitis
    technical_link: null
    technical_link_ids: []
    perception_link: null
    perception_link_ids: []
  references:
  - citation: Chloramines and ocular irritation in swimming pools, PMC6137694
    certainty: 🟢
    verified: true
    source_ids:
    - src.pmc6137694
  flags:
    contested:
    - claim: 主要刺激源
      consensus_source: 傾向三氯胺為主要致病物質
      dissent_source: 低張水質滲透壓效應的相對貢獻比例未定論
    vintage_warning: false
- id: recreational-water-cryptosporidium
  zh: 隱孢子蟲 / 泳池水傳染腸道病
  en: Cryptosporidium & recreational water illness
  category: C-nonMSK-medical
  environment:
  - pool
  - open_water
  sport_variant:
  - swim
  - open_water_swim
  layer:
  - public
  - clinical
  structures:
  - 腸道上皮(小腸刷狀緣)
  - 體液-電解質平衡
  mechanism:
    summary: 隱孢子蟲(Cryptosporidium parvum/hominis)以卵囊(oocysts)在水中存活，感染者糞便含大量卵囊(單次腹瀉排 10⁷–10⁸ 個)，僅需 10–100 個即致病。卵囊在標準泳池 >1 ppm 自由氯下仍可存活 >7 天，化學消毒幾乎無效。吞入含卵囊水後卵囊在腸道釋放子孢子侵入小腸上皮刷狀緣，造成大量水樣腹瀉、腹痛、噁心，病程 2–3 週；免疫低下者可慢性致命。
    trigger_phase: 公共泳池/水上遊樂設施(尤有腹瀉兒童入池)、循環式戲水池
    who: 兒童(最高風險)、照護機構人員、免疫低下者(HIV/AIDS/移植)
  epidemiology:
    prevalence: 美國 2009–2017 共 444 起隱孢子蟲暴露、7,465 例；泳池/水上設施為最大單一途徑(35.1% 暴發、56.7% 病例)；2015–2019 泳池水相關暴發中隱孢子蟲佔確認病因 49% 暴發、84% 病例；暴發報告件數每年約增 13%
    certainty: 🟢
    evidence_grade: B
    caveat: 受限於自願通報系統(36 州)，實際負擔可能遠高於報告；台灣/亞洲監測資料甚少
    sources:
    - Cryptosporidiosis outbreaks US 2009–2017, PMC6597118 (已驗證)
    - Treated recreational water illness outbreaks 2015–2019, PMC8136425 (已驗證)
    source_ids:
    - src.pmc6597118
    - src.pmc8136425
  risk_factors:
  - text: 吞入泳池水
    grade: B
  - text: 兒童(2–10 歲，穿尿布/意外排便)
    grade: B
  - text: 腹瀉期間或症狀消退 2 週內仍入池
    grade: B
  - text: 免疫低下
    grade: B
  - text: 泳池未用 UV/臭氧補充消毒
    grade: Expert
  prevention:
  - text: 腹瀉者禁入池(症狀消退後 2 週方可)
    grade: Expert
  - text: 泳池設 UV 光/臭氧補充消毒(殺氯抗性卵囊)
    grade: Expert
  - text: 兒童入池前沖洗/更換尿布、勿在池中排泄
    grade: Expert
  - text: 遊客入池前強制沖澡
    grade: Expert
  - text: 發現污染後超氯化+延長接觸時間
    grade: Expert
  management:
    red_flags:
    - 嚴重脫水(無尿/精神改變) → 就醫
    - 血便 → 就醫
    - 免疫低下者任何腹瀉 → 早期就醫
    - 腹瀉持續 >7 天 → 就醫
    acute: 免疫正常者：補液(口服電解質)；硝唑尼特(Nitazoxanide，唯一 FDA 核准)縮短病程 1–2 天，多 2–3 週自癒。免疫低下者：Nitazoxanide+抗病毒(若 HIV)，嚴重需住院靜脈補液。泳池暴發控制：關閉+超氯化(≥20 ppm 游離氯持續 8 小時)或 UV/臭氧
    pain_rules: null
    rehab: null
    functional_progression_criteria:
    - 免疫正常者症狀完全消退+至少 2 週後再入池(防再傳播)
    - 免疫低下者由感染科評估
    swim_modifications_in_rehab: null
    return_to_train: 症狀消退並達防傳播間隔後回水
    return_to_compete: null
    prognosis: 免疫正常者預後極佳完全自癒；免疫低下者預後謹慎，有慢性化與致命風險
  population_notes:
    age:
      youth: 最常見傳播來源(糞便污染)也是最主要受害者，應優先納入健康游泳教育
      adult_beginner: null
