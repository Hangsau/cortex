problems:
- id: prob.breast.head-lift-hip-drop
  stroke: breast
  category: head
  title: 換氣時抬頭，髖與腿跟著下沉
  links:
    technical_analysis:
    - breast.tech.5
    - breast.tech.26
    drills:
    - Br35
    - Br36
    - Br26
    interventions: []
    water_interventions:
    - movement.intervention.breaststroke-breathing.arm-driven-torso-lift
  cross_ref: 換氣時抬頭正前看、眼睛看向對岸；抬頭越高吸氣越容易——把蛙式做成海豚式上下擺動；游慢一點就不會抬頭壓髖——把槓桿問題當成速度問題
  cross_ref_ids:
  - breast.err7
  - breast.err13
  - breast.err18
  coverage_gap:
  - no_intervention
  observable: '- 吸氣那一下頭與胸往上抬，髖與腿同時下沉。

    - 臉回水後，身體還需要重新拉回平直。'
  mechanism_summary: 額外抬頭會改變體線；上身過度往上移，也會增加垂直位移與阻力。教材把換氣安排在內划帶起上身的窗口，並不要求主動把頭撐高。
- id: prob.breast.early-breath
  stroke: breast
  category: head
  title: 手還沒內划，頭就先抬起來換氣
  links:
    technical_analysis:
    - breast.tech.5
    drills:
    - Br36
    interventions: []
    water_interventions:
    - movement.intervention.breaststroke-breathing.arm-driven-torso-lift
  cross_ref: 划手末段才抬頭換氣；外划一開始就抬頭換氣是高效做法
  cross_ref_ids:
  - breast.err8
  - breast.err9
  coverage_gap:
  - no_intervention
  observable: '- 雙手還在向外分開，頭就已經往上仰。

    - 頭開始上升、臉破水與吸氣擠在同一瞬間。'
  mechanism_summary: 內划是手臂加速與上身抬升銜接的階段。過早把頭抬出水，會使換氣與手臂原有的動作窗口分離；應分別觀察頭上升、臉破水和吸氣三個事件。
- id: prob.breast.wide-knee-recovery
  stroke: breast
  category: kick
  title: 收腿時膝蓋向前、向兩側張開
  links:
    technical_analysis:
    - breast.tech.10
    - breast.tech.13
    drills:
    - Br1
    - Br7
    interventions: []
    water_interventions: []
  cross_ref: 膝蓋越開踢出力量越大；「像青蛙一樣踢」是正確的踢腳意象；「腳跟碰屁股」是正確的收腿口令；收腿要快、像彈簧反彈——增加阻力反而拖慢
  cross_ref_ids:
  - breast.err2
  - breast.err3
  - breast.err4
  - breast.err14
  coverage_gap:
  - no_intervention
  observable: '- 腳跟回收時，大腿明顯往前頂、雙膝向外張開。

    - 收腿中段前進速度明顯下降。'
  mechanism_summary: 收腿是阻力較大的階段；大腿前移與膝距增加會擴大迎水面積。這個外觀只能導向收腿路徑檢查，不能直接判定髖內旋、外旋或某個關節不足。
- id: prob.breast.unturned-feet
  stroke: breast
  category: kick
  title: 腳掌還沒轉向後方，就已開始蹬腿
  links:
    technical_analysis:
    - breast.tech.25
    - breast.tech.36
    drills:
    - Br7
    interventions: []
    water_interventions: []
  cross_ref: 踢腳主要是旋轉動作——上、外、繞回來才是核心
  cross_ref_ids:
  - breast.err1
  coverage_gap:
  - no_intervention
  observable: '- 膝已開始伸直，腳掌卻還沒有轉到朝後的位置。

    - 蹬出後雙腳合攏，身體前進仍不明顯。'
  mechanism_summary: 腳掌尚未朝後就蹬出，會減少有效迎水面與後續推進。足部朝向是多個關節動作的合成，不能把「翻腳」直接等同單一踝外翻。
- id: prob.breast.slow-leg-insweep
  stroke: breast
  category: kick
  title: 夾腿末段沒有加速，踢完前進不明顯
  links:
    technical_analysis:
    - breast.tech.12
    drills:
    - Br11
    interventions: []
    water_interventions: []
  cross_ref: ''
  cross_ref_ids: []
  coverage_gap:
  - no_intervention
  observable: '- 兩腳從外側向內合攏時，末段速度沒有增加。

    - 踢腿結尾不明顯帶出向前滑行。'
  mechanism_summary: 原技術條目把腳部內掃速度與推進聯繫起來；只把膝伸直得更快，並不等於把水有效往後送。先區分蹬出的方向與最後夾腿的加速。
- id: prob.breast.wide-outsweep
  stroke: breast
  category: pull
  title: 雙手一路往外划，遲遲沒有轉入捕水
  links:
    technical_analysis:
    - breast.tech.3
    - breast.tech.24
    drills: []
    interventions: []
    water_interventions: []
  cross_ref: 外划（outsweep）是蛙式手部動作的主要推進來源；outsweep 越寬越好，划得越遠推進力越大
  cross_ref_ids:
  - breast.err5
  - breast.err6
  coverage_gap:
  - no_intervention
  - no_drill
  observable: '- 雙手持續向兩側擴張，捕水與內划被延後。

    - 向外划的動作很大，向前移動卻不相稱。'
  mechanism_summary: 外划主要用來找到捕水起點；外划過寬會增加側向移動，並使捕水位置不利。這裡關注的是遲遲不能轉入有效捕水，不要求所有人採同一手距。
- id: prob.breast.dropped-elbows
  stroke: breast
  category: pull
  title: 內划時肘先掉下、貼近身體
  links:
    technical_analysis:
    - breast.tech.4
    - breast.tech.5
    drills:
    - Br14
    - Br13
    interventions: []
    water_interventions: []
  cross_ref: insweep 時手肘要收緊貼身體——失去高肘 leverage
  cross_ref_ids:
  - breast.err15
  coverage_gap:
  - no_intervention
  observable: '- 手還在內划，肘已先往下掉到軀幹旁。

    - 前臂不再維持朝後的迎水方向。'
  mechanism_summary: 捕水與內划需要前臂維持有效迎水方向；肘先掉到身體旁，會改變這個推進面。外觀本身無法量出推進力損失的比例。
- id: prob.breast.recovery-drag
  stroke: breast
  category: recovery
  title: 手臂回位時向外張開，身體明顯減速
  links:
    technical_analysis:
    - breast.tech.6
    drills: []
    interventions: []
    water_interventions: []
  cross_ref: ''
  cross_ref_ids: []
  coverage_gap:
  - no_intervention
  - no_drill
  observable: '- 雙手由胸前回位時向外分開，手臂沒有隨即前送。

    - 每次手回位都伴隨一段明顯減速。'
  mechanism_summary: 回臂的功能是以較小阻力回到前伸位置；張開手臂回位會增加迎水面。先觀察回位路徑與減速是否同時出現。
- id: prob.breast.timing-dead-spot
  stroke: breast
  category: timing
  title: 收手、收腿與推進接不上，每週期都卡一下
  links:
    technical_analysis:
    - breast.tech.8
    - breast.tech.35
    drills:
    - Br30
    - Br31
    - Br32
    interventions: []
    water_interventions: []
  cross_ref: 手腳可以同時動——同時划同時踢沒有問題；手完全前伸到底才能啟動踢腳
  cross_ref_ids:
  - breast.err10
  - breast.err11
  coverage_gap:
  - no_intervention
  observable: '- 手臂回位與腿部推進互相卡住，或手伸完後整個人停住才開始準備腿。

    - 同一週期可看到明顯的速度低谷。'
  mechanism_summary: 手腳的推進與回位會改變速度低谷；完全分段與部分重疊都是既有時序策略。應比較同一泳者不同銜接的結果，不能用「永遠不重疊」或「一定晚踢」作唯一規則。
- id: prob.breast.overlong-glide
  stroke: breast
  category: streamline
  title: 滑到幾乎停下來，才開始下一划
  links:
    technical_analysis:
    - breast.tech.7
    - breast.tech.28
    drills:
    - Br32
    interventions: []
    water_interventions: []
  cross_ref: 滑行越長代表技術越好、越省力
  cross_ref_ids:
  - breast.err12
  coverage_gap:
  - no_intervention
  observable: '- 踢完後維持前伸很久，前進幾乎停止才再分手。

    - 下一划像重新起步，而不是接續上一踢。'
  mechanism_summary: 滑行保存踢腿後的動能，但停留過久會讓速度下降後再重新加速。合適長度取決於個人與任務；不能把更長的滑行直接當成更好的技術。
- id: prob.breast.excess-undulation
  stroke: breast
  category: undulation
  title: 上身升得很高，前送卻接不上
  links:
    technical_analysis:
    - breast.tech.16
    - breast.tech.20
    - breast.tech.26
    drills:
    - Br22
    interventions: []
    water_interventions: []
  cross_ref: 蛙式波動越大越好——wave style 誤套到 flat style 選手
  cross_ref_ids:
  - breast.err16
  coverage_gap:
  - no_intervention
  observable: '- 胸與肩抬得很高，上升後停在頂點。

    - 身體上下位移很大，向前送出的動作卻接不上。'
  mechanism_summary: 抬升若不能接到前送，額外的垂直位移與波阻就會抵消收益。較平與較完整的波形各有適用情況，不能只憑波幅大小評定好壞。
- id: prob.breast.compressed-exhale
  stroke: breast
  category: head
  title: 臉快出水時才突然吐氣，吸氣窗口被擠短
  links:
    technical_analysis: []
    drills: []
    interventions: []
    water_interventions: []
  cross_ref: 水中先把氣全吐光再吸——破壞蛙式 stroke 內的連續呼吸節律
  cross_ref_ids:
  - breast.err17
  coverage_gap:
  - no_mechanism
  - no_intervention
  - no_drill
  observable: '- 臉快破水前，才出現一陣集中的吐氣泡。

    - 嘴離水後仍在吐氣，吸氣與下一次入水擠在一起。'
  mechanism_summary: ''
- id: prob.free.cross-midline-entry
  stroke: free
  category: entry
  title: 手從頭的正前方跨過中線入水
  links:
    technical_analysis:
    - free.tech.20
    drills:
    - Fr13
    interventions: []
    water_interventions: []
  cross_ref: 「頭部正前方入水」是標準入水點
  cross_ref_ids:
  - free.err6
  coverage_gap:
  - no_intervention
  observable: '- 由正面看，手跨到頭部中線的另一側入水。

    - 入水後先向外掃回，身體伴隨左右偏移。'
  mechanism_summary: 跨中線的入水點會讓後續捕水需要額外橫向調整。先看入水位置與身體偏移是否同時出現，不從這個外觀直接判定肩部病變。
- id: prob.free.cross-midline-pull
  stroke: free
  category: pull
  title: 拉水時手掌斜向肚臍，身體左右偏移
  links:
    technical_analysis:
    - free.tech.7
    drills: []
    interventions: []
    water_interventions: []
  cross_ref: S 形划水路徑是高效划水的目標；拉水朝肚臍方向斜拉——常見「拉到肚臍」口令造成跨越中線
  cross_ref_ids:
  - free.err10
  - free.err24
  coverage_gap:
  - no_intervention
  - no_drill
  observable: '- 水下拉水時，手由肩線斜向肚臍或對側。

    - 划手推進伴隨反覆左右擺動。'
  mechanism_summary: 手部作用方向偏向橫向時，向後送水的有效分量會改變。關注的是推進方向，不要求手在身體或池底座標中畫出同一條固定直線。
- id: prob.free.dropped-elbow
  stroke: free
  category: pull
  title: 捕水時肘先下沉，前臂沒有立起來
  links:
    technical_analysis:
    - free.tech.9
    - free.tech.21
    drills:
    - Fr16
    - FrSide1
    interventions: []
    water_interventions: []
  cross_ref: ''
  cross_ref_ids: []
  coverage_gap:
  - no_intervention
  observable: '- 捕水開始時，肘比手更早向下掉。

    - 前臂還沒轉成迎水面，上臂就已向下壓。'
  mechanism_summary: 肘與前臂的位置會同時影響上臂迎水面與捕水方向。外觀能指出捕水配置改變，不能據此算出推進力歸零或判定特定肌群失效。
- id: prob.free.forward-push
  stroke: free
  category: entry
  title: 入水後手臂用力往前頂，捕水被延後
  links:
    technical_analysis:
    - free.tech.22
    drills: []
    interventions: []
    water_interventions: []
  cross_ref: 「手伸遠一點」——在水中主動向前延伸增加划距
  cross_ref_ids:
  - free.err21
  coverage_gap:
  - no_intervention
  - no_drill
  observable: '- 入水後手繼續用力朝前頂，卻沒有順勢轉入捕水。

    - 另一手已離水，前手仍在延伸位置等待。'
  mechanism_summary: 手臂主動向前頂與由身體旋轉帶出的延伸是不同事件。前伸若拖延捕水，就會留下推進空窗；要把前伸和捕水放在同一時間軸觀察。
- id: prob.free.deep-pull
  stroke: free
  category: pull
  title: 手往池底深壓，上臂也跟著沉下去
  links:
    technical_analysis:
    - free.tech.9
    drills:
    - FrSide1
    interventions: []
    water_interventions: []
  cross_ref: 拉水越深推進越多——忽略「越深 = 越大阻力」的代價
  cross_ref_ids:
  - free.err25
  coverage_gap:
  - no_intervention
  observable: '- 捕水前整條上臂往池底壓。

    - 手臂越壓越深，頭或軀幹也出現上下位移。'
  mechanism_summary: 深壓整條上臂會改變迎水截面；捕水重點是建立合適的手與前臂方向，不是把手放得越深越好。
- id: prob.free.locked-knee-kick
  stroke: free
  category: kick
  title: 膝蓋全程僵直，整條腿上下擺
  links:
    technical_analysis:
    - free.tech.41
    drills:
    - Fr7
    interventions: []
    water_interventions: []
  cross_ref: 「用腰帶腿踢」——踢水要從腰開始（鎖死膝蓋）
  cross_ref_ids:
  - free.err13
  coverage_gap:
  - no_intervention
  observable: '- 踢水全程看不到膝部隨動，整條腿像同一根桿子擺動。'
  mechanism_summary: 教練說的全程僵直，與膝完全伸直時的正常解剖鎖定不同。可以比較小幅隨動的踢法，但不能因為看到膝伸直就宣稱會受傷或一定沒效率。
- id: prob.free.toes-up-kick
  stroke: free
  category: kick
  title: 踢水時腳尖持續勾起，腳掌朝向前進方向
  links:
    technical_analysis:
    - free.tech.13
    drills:
    - Fr7
    interventions:
    - movement.intervention.ankle-plantarflexion.conditional-mobility
    - movement.intervention.ankle-plantarflexion.capacity-control
    water_interventions: []
  cross_ref: 用力踢水才能快——力量優先於柔韌性；腳踝僵硬是先天條件，無法改善
  cross_ref_ids:
  - free.err11
  - free.err14
  coverage_gap: []
  observable: '- 踢腿時腳尖一直朝小腿方向勾起。

    - 同樣努力下，足部朝向沒有隨踢腿換向。'
  mechanism_summary: 踝蹠屈可用量會影響足部朝向，但相關研究不能證明拉鬆腳踝就會變快。需另外確認被動範圍與主動控制，才能區分下列兩條陸上路徑。
- id: prob.free.excess-roll
  stroke: free
  category: rotation
  title: 身體轉到接近側躺，下一次捕水接不上
  links:
    technical_analysis:
    - free.tech.16
    drills:
    - Fr11
    interventions: []
    water_interventions: []
  cross_ref: 主動轉髖是自由式旋轉的正確指令；旋轉幅度越大越好——「把肩膀打開」指令；「積極轉體，旋轉越快游越快」
  cross_ref_ids:
  - free.err15
  - free.err16
  - free.err17
  coverage_gap:
  - no_intervention
  observable: '- 身體轉得接近完全側躺，前手捕水被拖住。

    - 轉回來時又需要大幅反向調整。'
  mechanism_summary: 旋轉需要與對側手產力銜接；轉得更大或更快，並不保證能增加有效推進。問題在轉體後捕水接不上，而不是偏離某個固定角度。
- id: prob.free.head-lift-breath
  stroke: free
  category: head
  title: 換氣時抬頭看前上方，腿同時下沉
  links:
    technical_analysis:
    - free.tech.17
    - free.tech.18
    drills:
    - Fr4
    - Fr11
    interventions: []
    water_interventions: []
  cross_ref: 換氣時眼睛要「看到天花板」
  cross_ref_ids:
  - free.err18
  coverage_gap:
  - no_intervention
  observable: '- 換氣時眼睛看向前上方，頭部明顯離開原有體線。

    - 同一瞬間髖或腿下沉，回頭後才恢復。'
  mechanism_summary: 抬頭會改變全身平衡，腿部可能需要額外維持姿態。側轉換氣與主動抬頭應分開觀察；利用水面凹陷換氣也需要足夠速度與合適頭位。
- id: prob.free.breath-waiting-arm
  stroke: free
  category: timing
  title: 換氣時前手一直等著，兩臂之間出現停頓
  links:
    technical_analysis:
    - free.tech.8
    drills:
    - Fr11
    interventions: []
    water_interventions: []
  cross_ref: 換氣時前方手臂要「等在那裡」——catch-up 換氣
  cross_ref_ids:
  - free.err19
  coverage_gap:
  - no_intervention
  observable: '- 轉頭吸氣時前手一直停在前方。

    - 後手已完成推水，前手仍沒有開始捕水。'
  mechanism_summary: 不同風格容許不同長度的前伸階段，但換氣若把等待額外拉長，就可能增加兩臂之間的推進空窗。先比較換氣與不換氣週期的時序。
- id: prob.free.fatigue-short-strokes
  stroke: free
  category: tempo
