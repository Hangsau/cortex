    - src.research-psych-06-i
  - id: psych.self_talk.systematic_training
    name_zh: 練過的自我對話比臨時起意有效
    nav_zh: 系統練習
    order: 8
    status: complete
    phenomenon:
      certainty: 🟢
      text: 41 名競技青少年泳者（平均年齡 14.6 歲）參與的 10 週自我對話訓練研究（Hatzigeorgiadis et al. 2014）顯示：系統性自我對話介入組的游泳表現改善顯著優於無訓練的控制組，且長期訓練介入優於短期。跨運動的元分析（Hatzigeorgiadis et al. 2011）亦顯示，「有接受自我對話訓練」的組別效益高於「未訓練而即興使用」的組別。系統性 PST（心理技能訓練）整體回顧（2023 review of reviews）顯示 12 週 PST 的改善可持續至 6 個月後，長期或個人化 PST 效果優於短期標準化 PST，但現有研究品質普遍偏低（critically low quality），需謹慎詮釋。實用推論：自我對話 cue word 需要在訓練中反覆與特定感知狀態綁定，才能在比賽壓力下被可靠地觸發——臨場被動重複口號幾乎無效。
      plain_text: 一項針對競技青少年泳者、為期十週的訓練研究發現：有系統練過自我對話的那組，進步明顯比沒練的對照組大，而且練得久比練得短更有效。背後的道理是：提示詞要在平常訓練裡反覆跟某個感覺綁在一起，到了比賽壓力下才喚得出來；臨場才被動重複口號，幾乎沒用。實際做法是讓泳者用自己的語言挑提示詞（不是教練幫他定），再分階段導入——先在陸上、再到低壓的練習趟、然後計時趟、最後才帶進比賽。跳過低壓練習直接在比賽試新提示詞，成功率很低。
    intervention_refs:
    - name: 泳者自訂自我對話腳本（customized cue words）
      certainty: 🟢
      how_to: 由泳者自己選擇或創造與自身動作感知對應的提示詞（不由教練代定），在訓練趟中與目標感知反覆連結，直到提示詞能可靠地喚起對應感知狀態。 Zach（2024 游泳整合回顧）建議泳者自訂腳本並與教練共同評估。
    - name: 分階段導入（陸上 → 訓練低壓趟 → 高壓趟 → 比賽）
      certainty: 🟢
      how_to: 自我對話技能從陸上練習（識別干擾思維、選 cue word）開始，先在低壓訓練趟中測試，穩定後導入計時趟或模擬賽，最後帶入正式比賽。跳過低壓練習直接在比賽中試用新 cue word，成功率低。
    population_note: Hatzigeorgiadis 2014 的受試者為競技青少年泳者，是目前游泳直接實證最強的族群；兒童初學者（尤其低齡）的自我對話訓練能力受發展限制，正式 PST 計畫結構對 8 歲以下兒童的適用性需謹慎；成人初學的 PST 結構可完整適用，但干擾思維內容（社會評價）需納入訓練素材；鐵人三項目前有耐力 MST 直接研究支持（Matos 2020），但完整 PST 計畫適用性無直接游泳資料。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#心理技能訓練套裝計畫
    - Research/心理/06_自我對話與心理技能訓練.md#關鍵文獻清單
    source_ids:
    - src.research-psych-06-a
    - src.research-psych-06-i
- id: psych.arousal
  name_zh: 喚醒、焦慮與壓力崩潰
  nav_zh: 喚醒與崩潰
  when_zh: 一比賽就緊到崩、越想控制越糟時
  order: 7
  status: complete
  band: 進階競技端
  l_band: L3–L6
  level_tag: 進階·競技
  concept_count: 8
  lead_zh: 這一章講的是很多人最在意的問題：為什麼練得好好的，一上場就崩？常見的直覺是「練不夠」，但很多時候根本不是——是壓力把本來流暢的自動化動作，硬拉回「一步一步盯著做」的狀態。有趣的是，這跟初學者怕水時的失控，其實是同一條迴路，只是發生在程度很高的選手身上。
  bridge_zh: 前面都在講壓力怎麼讓動作崩掉；最後一章換個方向，講相反的那一端——當一切剛好對上，人會進入「忘我」的心流狀態。它其實就是把壓力崩潰的機制整個倒過來。
  premise:
    layer: public
    certainty: 🟢
    evidence_from:
    - psych.arousal.reinvestment
    - psych.arousal.explicit_monitoring
    - psych.arousal.catastrophe
    one_line: 壓力下表現崩潰，常不是「練不夠」，而是焦慮把流暢的自動化動作打回「逐步監控」——和初學的失控恐懼是同一條迴路，只是發生在競技端的高水平泳者身上。
  concepts:
  - id: psych.arousal.inverted_u
    name_zh: 倒 U 曲線是粗糙的起點，不是定律
    nav_zh: 倒U曲線
    order: 1
    status: complete
    phenomenon:
      certainty: 🟡
      text: Yerkes-Dodson（1908）的原始實驗用電擊強度對比老鼠辨別任務，並非直接測量喚醒與運動表現。倒 U 曲線是後人（1950 年代起）從圖形形狀反向命名——原作者從未使用「arousal」一詞。廣為流傳的版本是：喚醒過低或過高均削弱表現，中等最佳；任務難度越高，最佳喚醒點越低。 Nieuwenhuis（2024）在《Trends in Cognitive Sciences》的短評指出，倒 U 曲線在文獻中的實證支持遠比教科書描述稀薄，需要重新概念化——特別是「一條曲線適用所有人」這個預設，忽略了個體差異。在游泳等封閉技術性動作（closed-skill）場域，喚醒影響的機制可能不只是「量」的多寡，還有「類型」（透過注意力配置改變、肌肉張力前饋干預感知通道、誘發再投資行為三條路徑）。
      plain_text: 有個很流行的說法叫「倒 U 曲線」：太放鬆或太亢奮表現都差，中間剛好最好。這個圖常被當成定律，但它的來歷其實有點糊——原始實驗是拿電擊測老鼠，作者本人根本沒講過「喚醒」這個詞，倒 U 是後人看圖形反推命名的。 2024 年有篇短評指出，這條曲線的實證支持比教科書講的薄弱得多，最大問題是「一條曲線套所有人」忽略了個體差異。對游泳這種封閉技術動作來說，壓力影響的可能不只是「亢奮多少」，還有「哪一種亢奮」。所以把它當粗略的起點就好，別當鐵律。
    hardware_boundary:
      certainty: 🔴
      text: 不同泳距（50m 爆發 vs 1500m 有氧）是否有不同最佳喚醒點，現有研究幾乎全是跨運動外推，游泳特異的曲線形狀尚未有直接實驗資料。
    misconception_refs:
    - cue: 比賽前要讓自己興奮到最佳狀態
      why: 「最佳狀態」因人而異，更因任務類型而異；把教科書的「中等喚醒最佳」當成普適處方，會讓高喚醒下表現更好的游者刻意壓低自己，反而破壞功能性情緒狀態。
      better: 先識別「這位游者在什麼情緒強度下歷史表現最佳」，再針對個人設計賽前激活策略，而不是套用單一「中等最佳」的模板。
    population_note: 倒 U 假說文獻多從成人競技運動員樣本建立；兒童初學、鐵人三項開放水域情境、成人初學在不同情境中的喚醒反應均未系統研究。青少年競技的評價焦慮與高水平游泳員的競賽焦慮屬不同結構，不可互相外推最佳喚醒範圍。
    sources:
    - Yerkes & Dodson 1908（Journal of Comparative Neurology and Psychology）
    - Nieuwenhuis 2024（Trends in Cognitive Sciences）
    source_ids:
    - src.yerkes-dodson-1908
    - src.nieuwenhuis-2024-inverted-u-revisited
  - id: psych.arousal.izof
    name_zh: 最佳情緒區是個人化的，不是普適的
    nav_zh: 最佳區
    order: 2
    status: complete
    phenomenon:
      certainty: 🟡
      text: Hanin（1978/1986）在蘇聯頂尖運動員中提出個人最佳功能區（IZOF）：每位運動員有自己的最佳情緒激活區，寬度約 ±4 分（STAI 量尺），且區域位置因人而異——有些運動員在高焦慮下表現最佳，有些則在低焦慮下更好。關鍵是「對該個體是否功能性」，而非情緒的效價（正面/負面）。 IZOF 後擴展涵蓋憤怒、快樂等多種情緒；游泳員中有小樣本研究顯示，個人最佳情緒狀態與較佳競賽表現相關（樣本數有限，屬觀察性資料）。
      plain_text: 既然不是一條曲線套所有人，那比較準的講法是：每個人有自己的「最佳情緒區」。有些人要相當亢奮才游得好，有些人反而要很平靜——重點不是情緒是正面還是負面，而是「對這個人來說，這個強度能不能讓他發揮」。所以對所有人喊「冷靜下來就好」是錯的：有些人被壓到太冷靜，反而游不出來。比較好的做法是回頭看：他歷史上游最好那幾場，賽前是什麼情緒強度？那個位置才是他該對準的區間。
    l_levels:
    - L3
    - L4
    - L5
    - L6
    l_note: IZOF 的教練應用落在 L3 以上的競技游者——初學者的優先任務是建立感知安全基礎（L0–L2），而非情緒激活管理。
    misconception_refs:
    - cue: 告訴所有游者「冷靜下來就好」
      why: 部分游者在高情緒激活下才進入最佳功能狀態；強制壓低喚醒可能把他們推出最佳區。 IZOF 說明「最佳」是個人化座標，不是強度固定點。
      better: 先透過賽後回顧（最佳場次 vs 最差場次的賽前情緒描述對比）識別每人的功能性情緒簽名，再設計個人化賽前策略，允許個體差異存在。
    population_note: IZOF 文獻主要來自蘇聯/東歐高水平成人運動員；游泳員中的直接研究多為小樣本觀察，屬素材缺口。兒童競技游者的情緒激活最佳區尚無系統資料；鐵人三項的開放水域環境使情緒激活混入環境恐懼，診斷需區隔。
    sources:
    - Hanin 1997（European Yearbook of Sport Psychology）
    - Ruiz, Raglin & Hanin 2015（International Journal of Sport and Exercise Psychology）
    source_ids:
    - src.hanin-1997-izof
    - src.ruiz-raglin-hanin-2015-izof-overview
  - id: psych.arousal.catastrophe
    name_zh: 高認知焦慮下，崩潰是跳崖，不是滑坡
    nav_zh: 災變崩潰
    order: 3
    status: complete
    phenomenon:
      certainty: 🟡
      text: Hardy（1990）的災難模型（Catastrophe Model）提出，喚醒對表現的影響取決於認知焦慮的水平：低認知焦慮時，喚醒-表現仍呈平滑倒 U；但高認知焦慮 + 高生理喚醒同時發生時，跨越某個臨界點後，表現會發生「災難式跌落」——不是漸進惡化，而是突然崩潰。更關鍵的是「滯後效應（hysteresis）」：崩潰後要回到原表現水平，需先大幅降低喚醒，不是稍微調整就能回來。 Hardy, Parfitt & Pates（1994）在草地滾球選手（n=8）的場地實驗部分支持此模型。自信心是偏置因子：高自信把崩潰閾值推右（更晚觸發），低自信推左（更容易觸發）。
      plain_text: 當一個人「腦子裡的擔憂」很高、身體又很亢奮，兩個同時撞在一起，表現不是慢慢變差，而是過了某個臨界點突然整個垮掉——像跳崖，不是滑坡。更麻煩的是它有個「滯後」現象：垮掉之後，不是稍微調一下就能回來，得先把整體激活大幅降下來才回得去。自信心會影響這個崖在哪——自信高，崖往後推（比較晚才崩）；自信低，崖往前移（比較容易崩）。所以一旦崩了，喊「放鬆一下就好」沒用；要先整個慢下來、甚至停下來重整，再慢慢加回強度。
    hardware_boundary:
      certainty: 🔵
      text: 游泳的技術崩潰——尤其是長距離後段的動作形式崩解、節拍紊亂——可能符合非線性崩潰的模式，但「跨越閾值後的階躍式崩潰」在游泳的直接驗證仍是研究空白；從其他運動外推需降級。
    l_levels:
    - L3
    - L4
    - L5
    - L6
    l_note: 災難式崩潰主要發生在已建立技術自動化、但面臨高賭注競賽的游者（L3 以上）；初學者尚未自動化，崩潰機制不同（見恐懼主題 psych.fear）。
    misconception_refs:
    - cue: 放鬆一下就好了
      why: 滯後效應意味著一旦觸發崩潰式跌落，「微調放鬆」不足以回復——需要的是先大幅降低整體激活水平，才能從崩潰分支回到正常分支。把滯後效應誤作線性可調的假設，會讓教練低估介入強度。
      better: 崩潰一旦發生，先完全移除壓力源（放慢節奏、退出衝刺計畫、甚至停下重整）；等激活大幅下降後再循序恢復強度，而不是在崩潰狀態中繼續撐。
    population_note: 災難模型文獻以成人高水平競技運動員為主；滯後效應在青少年競技游者尚未直接研究。鐵人三項開放水域的環境干擾（能見度差、群泳、無法觸壁）可能加速高認知焦慮的積累，在技術崩潰前已先觸發恐慌性動作退化，與封閉泳道情境的崩潰路徑可能不同。
    sources:
    - Hardy 1990（Stress and Performance in Sport，Wiley）
    - Hardy, Parfitt & Pates 1994（Journal of Sports Science）
    source_ids:
    - src.hardy-1990-catastrophe-model
    - src.hardy-parfitt-pates-1994-hysteresis
  - id: psych.arousal.reinvestment
    name_zh: 壓力下「想太多動作」會讓自動化崩潰
    nav_zh: 再投資崩潰
    order: 4
    status: complete
    phenomenon:
      certainty: 🟢
      text: 再投資（reinvestment）是 Masters（1992）提出的機制：技能熟練後通常以程序化形式儲存，不需意識監控。壓力下，運動員「重新意識化」動作控制——工作記憶調用外顯的、基於規則的動作知識，在線上即時控制動作機械。這會把自動化流程強制拉回外顯操控，觸發崩潰。 Masters & Maxwell（2008）整合理論，確認再投資不只是壓力反應，也是人格特質（disposition）：個體在「再投資傾向」（MSRS 量表）上存在穩定差異——高外顯知識量 × 高再投資傾向 × 壓力情境 = 崩潰風險最高。壓力情境觸發因子包括：觀眾/評審在場、高賭注決賽、先前失誤觸發自我修正衝動、新環境失去熟悉感知錨點。
      plain_text: 技術練熟之後，多半是「不用想就會做」的自動狀態。壓力一來，人會忍不住「重新去想動作怎麼做」——把本來自動跑的流程拉回意識一步步控制，這叫「再投資」，而它正是崩潰的開關。研究還發現，有些人天生就比較容易再投資（這是穩定的個性差異）；外顯知識懂越多、再投資傾向越高、又遇到壓力，崩的風險就最大。觸發點包括有人在看、決賽、剛剛失誤想趕快修正、或換到陌生環境失去熟悉的感覺。所以比賽關鍵時刻喊「再專注一點在你的動作上」，反而是最常見、最幫倒忙的口令。
    l_levels:
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 再投資崩潰的前提是「有程序化的自動化技能可以被破壞」—— L2 後段到 L3 的游者才開始具備可被再投資干擾的自動化； L0–L1 的恐懼/初學者崩潰機制不同（控制感缺失，見 psych.fear 主題）。兩個主題的現象「看起來像」，但機制和干預方向相反，需要區辨。
    misconception_refs:
    - cue: 再拼一點，更專注在你的動作上
      why: 壓力下叫游者「更專注在動作上」正是再投資的觸發指令：它把注意力強制指向動作細節，啟動外顯監控，加速崩潰。這是教練在比賽關鍵時刻最常說但反效果最大的口令之一。
      better: 壓力情境下改用外部聚焦指令（「感覺水、切過水、讓身體滑過去」）而非內部動作細節聚焦（「手要這樣、膝要彎」），讓自動化繼續運作不被打斷。
    - cue: 現在把動作調整回來
      why: 比賽中途的動作調整要求游者把自動化流程暫停，呼叫外顯規則比對並修正——即使调整方向正確，在壓力情境下執行的成本遠高於訓練中，很可能觸發分析性麻痺（paralysis by analysis）。
      better: 比賽中「動作回饋」推遲到完賽後；比賽中提供的是感知錨點（「節拍」「滑」「長一點」）而非技術指令。
    population_note: 再投資研究主體是成人高爾夫球手、籃球員等乾地運動員；游泳員的 MSRS 分數與技術崩潰頻率的直接相關研究尚未見到（研究空白）。兒童競技游者的外顯知識累積量通常低於成人，再投資風險結構不同；青少年評價焦慮會提高再投資傾向，是值得關注的族群但缺乏直接游泳資料。鐵人三項游泳段屬開放水域，環境新奇性（失去熟悉感知錨點）是獨立的再投資觸發因子，與泳池封閉環境不同，不可直接外推。
    sources:
    - Masters 1992（British Journal of Psychology）
    - Masters, Polman & Hammond 1993（Personality and Individual Differences）
    - Masters & Maxwell 2008（International Review of Sport and Exercise Psychology）
    source_ids:
    - src.masters-1992-knowledge-knerves
    - src.masters-polman-hammond-1993-reinvestment-scale
    - src.masters-maxwell-2008-reinvestment-theory
  - id: psych.arousal.explicit_monitoring
    name_zh: 越分析動作細節，程序化技能越容易在壓力下崩潰
    nav_zh: 外顯監控
    order: 5
    status: complete
    phenomenon:
      certainty: 🟢
      text: Beilock & Carr（2001）的實驗（高爾夫推桿 vs 字母算術，*J. Exp. Psychol. Gen.* 130(4), 701–725）確認：專家技能以程序化形式儲存，在壓力下不是「資源不足」而崩潰，而是壓力誘發自我意識 → 注意力轉向技術細節（skill-focused attention）→ 打斷自動化程序。關鍵結果：程序化技能（推桿）在壓力下 choking；非程序化技能（算術）不受影響。雙任務訓練無助防 choking；降低內部監控傾向才有效。此機制與再投資理論高度重疊，差別是：Beilock 強調「注意力指向」是崩潰的觸發因， Masters 強調「外顯知識量」是崩潰的資源——兩者干預方向有差異，前者聚焦注意力訓練，後者聚焦學習設計。
      plain_text: 這個跟再投資是同一件事的另一面。實驗發現：練熟的技能（像推桿）在壓力下會「卡住」，原因不是腦力不夠用，而是壓力讓人開始自我意識、把注意力轉去盯技術細節，結果打斷了自動流程。對照之下，需要一步步算的任務（心算）在壓力下反而不受影響。兩個概念的差別只在強調點：一個強調「注意力被拉去盯細節」，一個強調「懂太多規則可以被調出來用」。對教練的提醒是一樣的：壓力下別叫人「更注意身體的每個動作」，把注意力移到水的效果（「感覺水在哪」「讓身體滑長一點」）才對。
    l_levels:
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 同再投資概念（psych.arousal.reinvestment），外顯監控崩潰需要「有程序化技能可以被打斷」作為前提。新手反而倚賴外顯監控建立技術——壓力下的干擾機制對他們不適用；初學者的崩潰是感知遮蔽（恐懼路徑），不是自動化被打斷。
    misconception_refs:
    - cue: 感覺不對的時候，試著更注意你身體的每個動作
      why: 壓力情境下「更注意身體動作」正是外顯監控的觸發指令。程序化技能被有意識地拆解分析，反而打斷自動化流程。這個教練常說的口令，在訓練中可能有幫助，在比賽壓力中幾乎必然適得其反。
      better: 感覺不對時把注意力移向外部效果（「感覺水在哪裡」「讓身體滑長一點」），而非掃瞄內部動作細節；感知目標語言正是設計來取代解剖指令的工具。
    sources:
    - Beilock & Carr 2001（Journal of Experimental Psychology: General）
    source_ids:
    - src.beilock-carr-2001-fragility
  - id: psych.arousal.muscle_tension_loop
    name_zh: 焦慮改變你在水裡的「形狀」，讓水感失真
    nav_zh: 張力迴路
    order: 6
    status: complete
    phenomenon:
      certainty: 🔵
      text: 在陸地運動中，焦慮誘發的防禦性肌肉張力主要影響協調與速度。游泳有一個在其他運動中不存在的迴路：焦慮 → 防禦性肌肉張力（全身預先張力升高）→ 改變身體在水中的姿態與剛性 → 水對身體的阻力分佈改變 → 感知信號改變（感知到的水的回饋不再是「正常姿態」的水感）→ 水感失真 → 游者試圖再投資修正 → 自動化進一步崩潰。這是焦慮破壞感知-動作自動化的**雙向迴路**，在游泳中因「感知通道本身是水」而特別顯著。間接支持：Hazlett、McLeod 與 Hoehn-Saric（1994）確認廣泛性焦慮症患者的靜息肌電顯著高於對照組——焦慮不只是主觀感受，是肌肉電位的物理狀態。但那是臨床樣本的陸上靜息測量，只撐住這條鏈的第一個環節，其餘仍是推導。
      plain_text: 游泳有一條別的運動沒有的迴路。在陸上，緊張會讓肌肉繃緊、影響協調；但在水裡，緊張讓全身先繃起來→身體在水中的姿態和硬度變了→水流經過身體的阻力跟著變→ 你感覺到的水感就跟「平常放鬆時」不一樣了→水感一失真，你又想去修正→自動化更崩。因為游泳「感覺的通道本身就是水」，所以這個迴路特別明顯。（整條鏈是框架推論，游泳裡還沒被完整量過；只有單個環節有證據，比如焦慮確實會讓肌電升高。）實務上：別只喊「放鬆你的手臂」——緊張是全身、不自主的，盯著某部位放鬆反而更緊；從感覺切入（「讓手滑過去」）或先降低被評價的壓力，比較有用。
    hardware_boundary:
      certainty: 🔵
      text: 「焦慮→防禦性肌張力→流體動力學改變→水感知失真」的完整迴路是框架推導，目前尚無游泳情境中直接測量此鏈路的研究。各節點單獨有文獻支持（焦慮-EMG、姿態-流體動力學），但跨節點的完整因果鏈在游泳中是研究空白。
    l_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 此迴路貫穿全 L 等——初學者的恐懼性全身緊縮（L0–L1 的沉體反應）與競技游者壓力下的微張力（L4–L5 的手感失真）是同一機制在不同強度的表現。 L0 的嚴重程度遠高於競技端，但機制的「形狀」相同。
    misconception_refs:
    - cue: 放鬆你的手臂
      why: 防禦性張力在緊張時是全身性的、不自主的；只叫「放鬆某部位」忽略了張力的根源是焦慮，不是局部習慣。局部口令常讓游者把注意力移向那個部位（觸發再投資），反而更緊。
      better: 從感知切入而非部位切入——「讓手滑過去」而非「放鬆手臂」；或先降低焦慮來源（降低評估感）再回到感知目標語言。
    population_note: 此迴路對兒童初學的意義是「沉體 + 感知遮蔽的雙重關閉」；對鐵人三項游者的意義是「開放水域環境焦慮快速觸發防禦張力，讓技術退回 L1 層次」；對競技游者的意義是「在高強度壓力場景（決賽、被超越）中微量張力改變感知精度」。三個族群表現出的現象相似但嚴重程度和情境觸發完全不同，不能用同一套干預強度處理。
    sources:
    - Hazlett, McLeod & Hoehn-Saric 1994（Psychophysiology）
    source_ids:
    - src.hazlett-1994-muscle-tension-gad
  - id: psych.arousal.breath_reinvestment
    name_zh: 焦慮先打亂呼吸節拍，節拍亂了再投資就跟著來
    nav_zh: 呼吸再投資
    order: 7
    status: complete
    phenomenon:
      certainty: 🔵
      text: 游泳的呼吸必須在精確的動作視窗中完成（換氣節拍），是動作序列的計時錨點。焦慮誘發的呼吸急促（交感神經激活）打亂換氣的節拍，游者察覺到節拍混亂後，傾向「有意識地重設節拍」——即對呼吸動作本身進行外顯監控，把本已自動化的呼吸協調拉入工作記憶管控，進一步觸發再投資。此外，游泳時面部長期入水，一般情境下可用的「深呼吸放鬆」介入選項受到限制，焦慮誘發的呼吸急促更難被即時中斷。在陸地運動中不存在這個節拍-監控的雙重鎖鏈，這是游泳情境下壓力崩潰的特殊路徑。
      plain_text: 游泳的換氣得卡在很精確的時間窗裡完成，等於是整個動作的「節拍器」。一緊張，呼吸就急促，節拍先被打亂；人一發現節拍亂了，就想「有意識地把節拍重新抓回來」——又把本來自動的呼吸協調拉進意識控制，再一次觸發前面講的再投資。而且游泳臉長時間在水裡，平常那招「深呼吸放鬆」也用不太上，急促的呼吸更難當場打斷。這條「節拍-監控」的雙重鎖在陸上運動裡不存在，是游泳特有的崩潰路徑。（這條鏈也是推論，游泳裡還沒直接量過，但呼吸急促和焦慮的關聯本身是有生理根據的。）
    hardware_boundary:
      certainty: 🔵
      text: 「焦慮→呼吸急促→節拍亂→有意識重設→再投資」的鏈路是從框架推導，游泳情境中直接量測此序列的研究仍是空白；呼吸急促與焦慮的關聯本身有生理支持（交感激活），但後續鏈路屬外推。
    l_levels:
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 呼吸節拍計時錨的崩潰從 L1 開始有意義（L0 尚未建立節拍）；競技游者（L3 以上）在節拍亂後的再投資反應更強，因為他們積累了更多可供「重設」的外顯知識。
    misconception_refs:
    - cue: 現在先調整呼吸節奏再繼續
      why: 壓力下叫游者「調整呼吸節奏」本身就是要求他對自動化呼吸協調做外顯監控——在陸地上可行（可暫停任務），在比賽中游到一半時幾乎必然觸發再投資。
      better: 訓練中建立「節拍的感知錨點」而非「節拍的技術規則」；比賽中用感知語言（「在水裡滾一下」「讓臉轉出去」）而非節奏計數指令。
    population_note: 兒童初學的呼吸節拍尚在建立中，焦慮對節拍的干擾對他們更根本（屬 L1 學習阻礙而非壓力崩潰）；青少年競技在評賽壓力下的呼吸急促目前缺乏直接游泳研究，是素材缺口；鐵人三項開放水域群泳起跑的呼吸節拍干擾（被踩踏、吸到浪）是環境誘發的節拍崩潰，機制相似但觸發源不同——干預需從環境減敏著手而不只是節拍訓練。
  - id: psych.arousal.implicit_learning
    name_zh: 讓技術「說不出口」，才能在壓力下不崩潰
    nav_zh: 內隱學習
    order: 8
    status: complete
    phenomenon:
      certainty: 🟢
      text: 再投資崩潰需要兩個條件：壓力 + 可供調用的外顯動作知識。內隱學習設計從源頭切斷第二個條件：讓技能以非語言化的程序性形式習得，工作記憶中沒有可被再投資劫持的顯性規則。主要策略： ① 類比教學（analogy instruction）：用整體意象取代分解規則， Poolton 與 Zachry（2007）整理內隱學習的教練應用，主張類比指令（「像海豚那樣踢」）比分解規則（「膝蓋先彎曲再伸展推水」）少留下可被再投資的顯性規則。須注意這是概念性回顧不是實驗，類比教學在游泳中的抗壓效果尚無直接實驗資料。 ② 外部聚焦（external focus of attention）：指向身體外部效果的注意力比內部身體聚焦更能支持自動化（Wulf 等多篇研究，2001–2010）。游泳應用：「讓手切過水線」vs「控制手掌角度」。 ③ 降低顯性回饋密度：訓練中不在每趟後詳細分析技術，讓感知探索先於解釋。 ④ 正念/接受導向訓練：Tang 等人（2023）在易 choking 運動員中發現，正念傾向較高者焦慮較低，韌性與知覺壓力是中介；那是橫斷面相關不是介入實驗，「練正念可降低崩潰」仍屬推論。
      plain_text: 既然再投資崩潰需要兩個條件——壓力 + 一堆「說得出口的動作規則」可以被調出來用——那最強的預防方法，就是從學習階段就不要囤那麼多「說得出口的規則」。這叫內隱學習。具體做法有幾種：①用比喻教，整體意象取代分解步驟（「像海豚那樣踢」比「膝蓋先彎再伸展推水」在壓力下更穩）；②注意力放外部效果（「讓手切過水線」而不是「控制手掌角度」）；③別每一趟都詳細講評技術，讓感覺先於解釋； ④練正念、降低「想去修正」的衝動。一個重要邊界：解剖上的硬限制（踝、肩活動度）還是要用清楚的話講明白讓學員理解，不適合全用比喻帶過。
    l_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 內隱學習設計貫穿全 L 等，但「防止再投資崩潰」的目標集中在 L2 以上； L0–L1 的內隱設計目標是建立基礎感知-動作連結，副效益是同時降低未來再投資風險。重要限制：解剖性硬體邊界（踝關節活動度、肩部活動度）必須用外顯說明讓學習者理解，不適合套用類比替代——這是內隱設計的邊界。
    misconception_refs:
    - cue: 現在告訴我你手怎麼划的（在比賽壓力下）
      why: 在壓力情境中要求游者語言化技術過程，正是再投資的搜尋指令；語言化成功 = 外顯規則被調用到工作記憶 = 下一個動作的崩潰風險升高。
      better: 將「技術回顧」推遲到完全脫離壓力情境後；訓練中多問「你感覺到什麼」而非「你知道怎麼做嗎」，讓技術以感知描述而非技術規則的形式被儲存。
    population_note: 內隱學習研究的游泳直接樣本以成人或青少年乾式訓練研究為主；兒童初學因認知發展限制，外顯規則本就不易建立，類比教學對他們天然適合但難以驗證「抗崩潰」效果；成人初學帶入大量生活技術外顯知識（「游泳就是手划腳踢」），內隱學習設計需要同時解除這些預設；鐵人三項游者多有多年技術積累外顯知識，再投資風險高，是內隱重設計的高優先候選族群。
    sources:
    - Masters & Maxwell 2008（International Review of Sport and Exercise Psychology）
    - Poolton & Zachry 2007（International Journal of Sports Science & Coaching）
    - Wulf & Prinz 2001（Psychonomic Bulletin & Review）
    - Tang et al. 2023（Frontiers in Psychology）
    source_ids:
    - src.masters-maxwell-2008-reinvestment-theory
    - src.poolton-zachry-2007-implicit-coaching
    - src.wulf-prinz-2001-directing-attention
    - src.tang-2023-mindfulness-choking
- id: psych.flow
  name_zh: 心流與去再投資
  nav_zh: 心流
  when_zh: 想進入忘我、把好表現守在壓力下時
  order: 8
  status: complete
  band: 進階競技端
  l_band: L3–L6
  level_tag: 進階·競技
  concept_count: 10
  lead_zh: 前一章講壓力怎麼讓動作崩掉，這最後一章講相反的那一端——當一切剛好對上，人會進入一種「忘我」的狀態，也就是心流。最高水準的水感不是「更用力控制」，而是「不再去想」：把控制權整個交還給已經練到自動的身體，刻意的自我監控反而是最大的干擾。這正好是前一章那條崩潰迴路的反面，也是 L5–L6 全身場感知在心理上的對應端。
  bridge_zh: null
  premise:
    layer: public
    certainty: 🔵
    one_line: 最高水準的水感是「不再去想」——心流狀態下控制權交還給自動化系統，刻意的自我監控（再投資）反而是頂尖表現的最大干擾。這是 L5–L6 全身場感知的心理對應端。
  concepts:
  - id: psych.flow.action_awareness_merging
    name_zh: 「不知道怎麼做到的」才是 L6 心流的語言
    nav_zh: 覺察合一
    order: 1
    status: complete
    phenomenon:
      certainty: 🟡
      text: Csikszentmihalyi（1990）把心流九維度分為前提、即時體驗、後效三層；其中「行動與覺察融合」（action-awareness merging）是最標誌性的即時體驗維度：做的人與做的動作之間的距離感消失，不再「觀看自己游泳」，而是直接「就是在游」。Jackson（1995）訪談 28 名精英運動員（含游泳選手），游泳者描述的核心語言是「我就只是在游，感覺不到我在控制每個動作」。這不是比喻，而是自動化控制系統（基底核、內隱程序記憶）取代顯性前額葉監控的現象學描述。
      plain_text: 心流最標誌性的特徵，是「做的人」和「做的動作」之間那種距離感消失了——你不再像在旁邊「看自己游泳」，而是直接「就是在游」。訪談精英運動員時，游泳選手最常用的話是「我就只是在游，感覺不到自己在控制每個動作」。這不是文藝的比喻，而是大腦把控制權從「有意識監控」交給「自動程序」的真實狀態。所以「不知道怎麼做到的」不是失憶——這種時候動作品質常常反而是個人最好的。
    hardware_boundary:
      certainty: 🔵
      text: 行動與覺察融合對應的神經機制是動作控制從前額葉皮質轉移到基底核的自動化路徑——這是跨領域外推（Dietrich, 2004 的暫時性前額葉低激活假說；Floyer-Lea & Matthews, 2005 的 fMRI 研究），游泳情境的直接量測仍是研究空白。「不知道怎麼做到」是意識無法觸及自動化程序的現象學側面，不是技術失憶——動作品質在此狀態往往達到個人最佳。
    l_levels:
    - L5
    - L6
    l_note: L5 泳者有時進入局部自動化的短暫融合（「這段手感覺對了」）， L6 的特徵是全身場感知層面的融合——描述語言從「某部位對了」轉移到「不知道怎麼做到的」。 L3–L4 仍在顯性控制階段，局部技術點尚在意識監控中，行動與覺察融合尚未出現。
    misconception_refs:
    - cue: 比賽前要把每個動作細節都在腦中跑過一遍，確認都對才下水
      why: 這個指令主動要求顯性監控，正是再投資（reinvestment）的觸發機制，實際上阻止行動與覺察融合的發生；對有足夠自動化程度的進階泳者，這會降低表現。
      better: 賽前心像演練的焦點放在整體節律感、水的感覺、身體輕鬆的狀態，而不是動作清單逐步驗核。
    sources:
    - Research/心理/07_心流與最佳表現.md#1-csikszentmihalyi-心流九大維度
    - Research/心理/07_心流與最佳表現.md#4-精英運動員心流研究jackson1995-1996
    - Research/心理/07_心流與最佳表現.md#游泳特異研究-vs-跨運動外推
    source_ids:
    - src.research-psych-07-a
    - src.research-psych-07-c
    - src.research-psych-07-m
  - id: psych.flow.challenge_skill_balance
    name_zh: 太難焦慮、太易無聊、剛好才有心流
    nav_zh: 挑戰平衡
    order: 2
    status: complete
    phenomenon:
      certainty: 🟡
      text: 心流最核心的觸發條件是「感知到的挑戰難度」與「自身技能水準」的匹配（Csikszentmihalyi, 1990）。挑戰高於技能 → 焦慮（anxiety）；技能高於挑戰 → 無聊（boredom）；兩者匹配且皆高 → 心流通道（flow channel）。Engeser & Rheinberg（2008）以划船運動員為樣本確認挑戰-技能平衡調節心流與表現的關係，自我效能感是重要的調節變數。這個模型最重要的教學意涵是：心流是**可以工程化設計**的——任務難度可以調，技能本身也隨練習增長，因此教練能主動製造心流的前提條件，而不是被動等待它降臨。
      plain_text: 心流最核心的開關，是「你覺得這件事有多難」剛好對上「你的能力」。太難會焦慮，太簡單會無聊，剛好對上、而且兩邊都不低，才進得了心流。最重要的一點是：心流是可以「設計」出來的——難度可以調，能力會隨練習長，所以教練能主動去製造心流的條件，而不是被動等它降臨。
    hardware_boundary:
      certainty: 🔵
      text: Engeser & Rheinberg（2008）以划船運動員為主要樣本，效應量偏小（混合結果）；游泳情境無直接量化研究（研究空白 🔴）。外推至游泳情境合理，但「挑戰-技能匹配保證觸發心流」的因果鏈尚未在游泳中建立——匹配是必要條件而非充分條件。
    l_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 每個 L 級都有當層的挑戰-技能匹配點，不是只有精英才能到達這個匹配帶。 L0–L2 的「剛好能做到但需要專注」（如能連續吐氣 10 次）就是當層的挑戰-技能匹配； L5–L6 的匹配點是整場游泳的節律感與水的共振。
    misconception_refs:
    - cue: 先把技術鞏固好，心流自然就來了，不用刻意設計
      why: 技術進步只解決了技能端，挑戰端若沒有跟著調整（任務太易就無聊、太難就焦慮），心流通道仍不會出現；心流發生需要兩端同時匹配，不是等技術夠強就自動開啟。
      better: 每次訓練設計時同時調整挑戰難度（任務難度、距離、限制條件）與評估學員的技能狀態，讓任務落在「剛好做得到但要專注」的帶寬內。
    sources:
    - Research/心理/07_心流與最佳表現.md#2-挑戰-技能平衡challenge-skill-balance模型演化
    - Research/心理/07_心流與最佳表現.md#flow-reinvestment-軸線的水感應用
    - Research/心理/07_心流與最佳表現.md#心流的發展軌跡flow-不是-l6-的專利推導
    source_ids:
    - src.research-psych-07-b
    - src.research-psych-07-i
    - src.research-psych-07-l
  - id: psych.flow.indirect_control
    name_zh: 心流不能直接命令自己進去
    nav_zh: 間接控制
    order: 3
    status: complete
    phenomenon:
      certainty: 🟢
      text: Swann 等人（2012）系統回顧 1992–2011 年精英運動心流文獻（n=17 篇），最重要的核心結論之一是：「多數研究者認為心流不能直接製造，但可透過創造前提條件提高發生機率（間接可控）。」 Harris 等人（2021）meta 分析也指出現有多數研究是相關性設計，無法確定「先進 flow 再表現好」還是「表現好才感覺 flow」。這個因果方向不確定性意味：任何「保證讓你進心流」的指導方案都超出當前實證基礎；心流是概率性現象，前提條件只能提高機率，不能保證觸發。
      plain_text: 不過要老實說：心流沒辦法用命令直接叫它出現。研究的共識是——你只能去佈置那些「讓它比較容易發生」的前提條件，沒辦法保證它一定來。而且現有研究多半只看到相關，分不清到底是「先進心流才表現好」還是「表現好才覺得進了心流」。所以任何號稱「保證讓你進心流」的方法都超出證據範圍；它是機率性的，你能做的是把成功率往上推，不能下指令。
    population_note: 心流研究嚴重偏向精英運動員，兒童初學、成人初學、鐵人三項業餘選手的心流發生率和形態直接量化數據幾乎缺失（研究空白 🔴）。兒童初學在低技能層級就特別容易進入類心流的吸收狀態（遊戲性、低自我意識），這與精英運動員的心流機制是否相同，目前沒有直接比較研究。
    sources:
    - Research/心理/07_心流與最佳表現.md#5-swann-等人心流系統回顧2012
    - Research/心理/07_心流與最佳表現.md#8-心流-表現關係-meta-analysis
    source_ids:
    - src.research-psych-07-d
    - src.research-psych-07-g
  - id: psych.flow.flow_vs_clutch
    name_zh: 心流是「讓它發生」；clutch 是「讓它成功」
    nav_zh: 心流與關鍵
    order: 4
    status: complete
    phenomenon:
      certainty: 🟢
      text: Swann 等人（2017, 2021）的 Flow-Clutch 框架區分出兩種不同的高表現狀態。心流（flow）：輕鬆、自動化、享受，注意力是漫散式當下專注，意識控制低，行動自動發生，活動中即感受到享受。 Clutch 狀態：強烈、費力、緊繃，注意力高度聚焦於特定目標，意識控制高，刻意執行，活動後才覺得享受（當下只有強度感）。高爾夫選手描述：心流是「letting it happen」；clutch 是「making it happen」——同樣的「讓它發生」這個字，語意完全相反。兩者不在同一時刻共存，但同一場比賽中可先後出現。
      plain_text: 高水準表現其實有兩種不同的狀態，別搞混。一種是心流：輕鬆、自動、當下就在享受，幾乎不用刻意控制。另一種叫 clutch（關鍵時刻爆發）：費力、緊繃、高度聚焦在一個目標上，刻意把它做出來，事後才覺得爽（當下只有強度）。有個選手講得很傳神：心流是「讓它發生」，clutch 是「逼它成功」。兩者不會同一刻並存，但一場比賽裡可以先後出現。
    l_levels:
    - L4
    - L5
    - L6
    l_note: Clutch 在 L3–L4 競技情境（重大比賽關鍵段）常見；flow 則更常與 L5–L6 的全身場感知並存。但 clutch 也需要一定的基礎自動化（L3+），純 L0–L2 初學者的壓力反應更接近恐懼崩潰，不是 clutch 的費力專注。游泳比賽最後 50 公尺是 clutch 還是 flow 主導，目前無游泳特異研究（🔴）。
    population_note: Flow-Clutch 量表（Swann et al., 2021, 2023）以廣義運動/休閒運動者為樣本，競技游泳場景的適用性尚待游泳專屬研究確認（外推至游泳標 🔵）。對兒童競技與青少年競技：兩種狀態都可能出現，但比例和觸發條件的系統研究缺失。
    sources:
    - Research/心理/07_心流與最佳表現.md#6-flow-vs-clutch-statesswann-等人2017-2023
    source_ids:
    - src.research-psych-07-e
  - id: psych.flow.reinvestment
    name_zh: 壓力讓人重新「想」動作，反而搞砸
    nav_zh: 壓力再投資
    order: 5
    status: complete
    phenomenon:
      certainty: 🟡
      text: 再投資（reinvestment）理論（Masters, 1992；Masters & Maxwell, 2008）：個體在壓力下用工作記憶重新叫回顯性規則知識，以意識控制動作。 Beilock & Carr（2001）在高爾夫推球實驗中確認：高技能者被要求監控動作細節時表現下滑，低技能者反之——這是「choking under pressure」的核心機制之一。游泳情境中，再投資的外觀是泳者在比賽中開始「清單思考」：「手臂要伸長、轉肩多一點、頭不要抬太高……」——逐步驟顯性控制重新上線，動作失去流暢性，出現前半程刻意、後半程崩解的模式。再投資與心流的關係是：再投資激活時，心流（尤其是「行動與覺察融合」）不可能同時發生。
      plain_text: 心流的最大敵人是「再投資」——壓力一來，人就用力去回想動作規則、想用意識一步步控制動作。在游泳裡，它的樣子就是比賽中開始「清單思考」：手臂要伸長、轉肩多一點、頭別抬太高……顯性控制一上線，動作就失去流暢，常出現前半程刻意、後半程崩解的模式。只要再投資啟動，心流（尤其那種「人和動作合一」的感覺）就不可能同時發生。所以這跟前一章講的崩潰是同一回事，只是從心流的角度再看一次。
    hardware_boundary:
      certainty: 🔵
      text: Beilock & Carr（2001）研究是高爾夫推球，Masters（1992）、Masters & Maxwell（2008）研究樣本非游泳專屬；再投資機制外推至游泳合理（壓力下顯性監控增加是跨運動現象），但游泳專屬的再投資-心流直接量測仍是研究空白（🔴）。
    misconception_refs:
    - cue: 比賽時要更專注在每個動作細節，確認你在做對的事
      why: 這個指令在比賽情境中主動觸發再投資，對已有自動化程度的進階泳者會打斷流暢性，導致「分析癱瘓（paralysis by analysis）」；這是行業內廣泛出現的賽前指導語。
      better: 進階泳者賽前焦點應放在整體感覺（節律、輕鬆、水感）而不是動作清單；顯性技術檢查保留在練習中，賽前最後指令選一個感知焦點（如「感覺水幫你」）不選動作清單。
    sources:
    - Research/心理/07_心流與最佳表現.md#reinvestment-理論masters-1992masters-maxwell-2008
    - Research/心理/07_心流與最佳表現.md#flow-vs-reinvestment-對照
    source_ids:
    - src.research-psych-07-k
    - src.research-psych-07-j
  - id: psych.flow.de_reinvestment
    name_zh: 放掉顯性控制，信任習得的感知——L6 的心理開關
    nav_zh: 去再投資
    order: 6
    status: complete
    phenomenon:
      certainty: 🔵
      text: Vortex 框架中 L5→L6 的過渡不只是技術問題，更是一個心理轉換點：成功「去再投資」（de-reinvestment）——放掉顯性自我監控，信任已習得的隱性感知模式。在 L5，泳者已具備相當自動化能力，但可能仍習慣性地進行局部顯性監控（「我的入水夠遠嗎？」）； L6 的「水我合一、水在幫我」描述語言，正是再投資降到最低、行動與覺察融合程度最高時的現象學報告。這不是放鬆注意力，而是注意力從「監控部位」轉移到「感受整體場」。類比學習（analogy learning，Liao & Masters, 2001）用一個比喻意象取代逐條顯性技術指令，目的正是降低顯性知識累積、讓學習走隱性路徑——這個機制外推到游泳去再投資是合理的機制推導（🔵），但游泳「類比指導→降再投資→近心流」的直接第一手實證目前尚缺（🔴）。
      plain_text: 既然再投資會擋住心流，那 L5 往 L6 的關鍵，就是學會反過來——「去再投資」：放掉刻意的自我監控，去信任已經練到身體裡的感覺。在 L5，泳者通常還會習慣性地局部檢查（「我入水夠遠嗎」）；到 L6 那種「水我合一、水在幫我」的描述，就是再投資降到最低、人和動作最合一的時候。它不是放空注意力，而是把注意力從「盯某個部位」移到「感受整個場」。（這個機制是合理的推論，但游泳裡「用比喻教→降再投資→接近心流」還缺直接實證。）重要邊界：這招只能用在已有足夠自動化的 L4 以上泳者；對初學者說「別想、讓身體自己來」，只會讓他在水裡失去方向，造成的是焦慮不是心流。
    l_levels:
    - L5
    - L6
    l_note: L1–L3：顯性學習必要，再投資在此階段是學習工具，不是問題； L4：技能-挑戰開始接近匹配，有時進短暫心流； L5→L6 轉換點：去再投資是關鍵——放掉顯性監控，信任隱性感知。強行把去再投資用在 L1–L2 反而危險：初學者需要顯性知識建立基礎感知框架，過早要求「不要想，直接感覺」會讓感知無從錨定。
    misconception_refs:
    - cue: 不要去想你在做什麼，放鬆，讓身體自己來（對初學者說）
      why: 去再投資策略用在尚未建立足夠自動化的初學者身上是錯誤的： L0–L2 泳者沒有穩固的隱性程序知識，「讓身體自己來」會讓他們在水中失去方向感；這個指令在初學端造成的是焦慮，不是心流。
      better: 去再投資語言只用在 L4+ 且已有足夠自動化基礎的泳者；初學者需要清晰的顯性感知目標（「試試看，吐氣的時候感覺你的臉放鬆」），不是「不要想」。
    sources:
    - Research/心理/07_心流與最佳表現.md#flow-reinvestment-軸線的水感應用
    - Research/心理/07_心流與最佳表現.md#與水感框架-l5-l6-水我合一的連結
    - Research/心理/07_心流與最佳表現.md#reinvestment-理論masters-1992masters-maxwell-2008
    source_ids:
