domain: psychology
domain_name_zh: 心理
intro_zh: 在這個網站的其他地方，我們談動作：手怎麼划、腳怎麼打、身體怎麼轉。但動作只是表面——真正決定一個人游不游得起來的，是他在水裡能不能「感覺到水」：浮力、水流、壓力這些安靜的訊號。而能不能感覺到水，又先被另一件事決定：他在水裡的心理狀態。怕水的人往往感覺不到水，因為恐懼把感知的頻寬佔滿了；緊張的人也感覺不到水，因為一緊繃，身體回報的訊號就變糊。所以心理不是技術之外的加分題，它是地基——技術蓋在感知上，感知又蓋在心理上。這一章從最底層的恐懼開始，沿著一個人從「不敢下水」到「能在壓力下穩住」的順序往上走。你不必全部讀完；但如果你不知道從哪開始，就從第一章讀起。
outro_zh: 回頭看這一整章：恐懼關掉水感、緊張讓身體回報失真、動機決定練不練得下去、注意力和心裡那個聲音決定壓力下守不守得住。它們看起來是好幾件不同的事，其實是同一條線——心理狀態先決定你感覺得到多少水，水感再決定你的技術能蓋多高。所以下次遇到一個「怎麼教都學不會」的人，先別急著改他的動作；往下看一層，問問是哪一道心理的閘門還沒打開。
themes:
- id: psych.fear
  name_zh: 水中恐懼
  nav_zh: 恐懼
  when_zh: 還不敢放手、一下水就僵、怕到不敢開始時
  order: 1
  status: complete
  band: 初學端
  l_band: L0–L2
  level_tag: 初學
  concept_count: 7
  lead_zh: 怕水的人，多半不是怕水這個東西，是怕一下水就管不住自己的身體。這種怕會在你還沒開始學動作之前，就先把學東西的能力關掉——所以它不是性格問題，是水感的第一道閘門。這一章拆開恐懼在身體裡到底發生了什麼，以及為什麼「安全啦、不要怕」這種話幫不上忙。
  bridge_zh: 恐懼這道門過了，可是真到水裡，很多人還是會發現：明明不怕了，一緊張身體照樣僵、換氣一亂整個就垮。那不是又怕了，是心理和身體在水裡會互相點火——下一章講這個。
  premise:
    layer: public
    certainty: 🔵
    one_line: 水中恐懼的核心常不是「怕水本身」，而是「怕在水裡失去對身體的控制」——而恐懼一旦啟動，會從源頭關閉學習所需的感知頻寬，所以它是 L0 的閘門，不是性格問題。
  concepts:
  - id: psych.fear.control_loss
    name_zh: 怕的是失控，不是水
    nav_zh: 失控感
    order: 1
    status: complete
    phenomenon:
      certainty: 🟢
      text: 針對游泳情境開發的恐懼量表（FWAQ, Misimi 等 2020, n=2,074）把水中恐懼拆成三個因子：與水環境接觸、水的自然力量、以及「水中動作控制感」。其中「對水中動作控制感的缺失」是三者裡最強的恐懼預測因子。換句話說，怕水的人多半不是怕水這個物質，而是怕自己一進水就失去對身體的掌控。
      plain_text: 有人專門量過怕水的人到底在怕什麼。一份兩千多人的研究把「怕水」拆開，發現最強的那一項不是怕水本身，而是怕「一進水就控制不住自己的身體」。這解釋了一件事：對怕水的人說「水很安全啦」常常沒用——因為他怕的根本不是水危不危險，是怕自己會失控。
    l_levels:
    - L0
    l_note: 恐懼閘門落在 L0——在呼吸與漂浮感知建立之前就把學習擋住。
    misconception_refs:
    - cue: 不要怕，水很安全
      why: 用「安全」回應失控恐懼，沒有觸及核心（怕的不是水危險，是怕自己會失控），反而否定了對方的感受。
      better: 先把可預測性與控制權還給對方——「你隨時可以站起來/抓邊，每一步由你決定」。
    intervention_refs:
    - name: 系統減敏（焦慮層級分階）
      certainty: 🟡
      how_to: 列出由弱到強的暴露階梯（坐池邊→腳入水→膝→腰→臉碰水），每階在放鬆狀態下充分習慣再進下一階。
    - name: 先建立信任再入水
      certainty: 🟠
      observation_basis: 這是游泳教學界的通行做法，不是本專案的教練觀測；族群涵蓋兒童與成人初學者。 **原文標注的「ERIC 教學實踐指引」不是可回溯的來源**——ERIC 是美國教育部的教育文獻資料庫，不是任何指引的發行者，2026-09-04 檢視時無法從這個字串定位到具體文件（見錯誤 30）。外推邊界：「先建立信任再入水」在教學現場幾乎無爭議，但「要花多久」「怎麼判定信任已建立」沒有量化判準；對已有溺水創傷者，池外建立關係未必足以覆蓋創傷反應，該情況需轉介而非延長暖身。
      how_to: 恐懼者需先在池外建立教練關係與情緒安全，不急著下水。
    population_note: 「失控」這個簽名在成人初學身上會被社會評價放大（「這年紀還不會」），介入要先卸評價威脅；族群差異見本主題「恐懼的不同臉孔」。
    sources:
    - Misimi et al. 2020（Frontiers in Psychology）
    source_ids:
    - src.misimi-2020-fwaq
  - id: psych.fear.perception_masking
    name_zh: 恐懼會關掉水感
    nav_zh: 恐懼遮蔽
    order: 2
    status: complete
    phenomenon:
      certainty: 🔵
      text: 恐懼啟動時，神經系統把感知資源全部分配給外感受（水在哪？深嗎？我要沉了嗎？），系統性壓制內感受與本體感覺。但水感正是建立在這些被壓制的安靜信號上——細微的浮力回饋、流場感、壓力分佈。結果是：恐懼者就算把動作教給他，也「感覺不到水」，因為感知頻寬已被恐懼佔滿。這是「先把動作學會就好」之所以對恐懼者無效的原因——通道在 L0 就被關了。
      plain_text: 人一害怕，注意力會全部衝向「水在哪、會不會沉」這些外部威脅，同時把身體內部那些安靜的小訊號關小聲——可是水感正好就藏在那些小訊號裡：浮力、水流、壓力。所以一個怕水的人，就算你把動作一步步教給他，他還是會說「我感覺不到水」。不是他笨，是頻道被恐懼佔住了。這也是為什麼「先把動作學會就好」對怕水的人沒用——通道在最底層就被關上了。
    hardware_boundary:
      certainty: 🔵
      text: 注意這是跨領域推導：注意力窄化、內感受壓制等機制來自臨床恐懼/焦慮研究，外推到游泳情境合理但游泳專屬的「感知遮蔽」直接量測仍是研究空白，不是已坐實的游泳實證。
    l_note: 解釋「為什麼對恐懼者教動作形式會學不進去」——感知遮蔽發生在 L0。
    misconception_refs:
    - cue: 先把動作學會，怕水自然就好了
      why: 感知被恐懼遮蔽時動作根本學不進去；把順序顛倒了。
      better: 先降恐懼、打開感知頻寬，再教動作——感知是輸入，動作是輸出。
    sources:
    - Krusemark & Li 2011（Journal of Neuroscience）
    - Yoris et al. 2015（Behavioral and Brain Functions）
    source_ids:
    - src.krusemark-li-2011-fear-perception
    - src.yoris-2015-interoceptive-panic
  - id: psych.fear.freeze_reflex
    name_zh: 凍結是反射，不是膽小
    nav_zh: 凍結反射
    order: 3
    status: complete
    phenomenon:
      certainty: 🟢
      text: 「凍結」（freeze）是杏仁核投射到中腦導水管周圍灰質（PAG）的神經反射，不是膽小或故意不配合。防衛反應是一條串聯：預警凍結（交感主導，警覺但不動）可能升級成崩潰性不動（背側迷走主導，解離、像關機）。兩者外觀都是「不動」，但神經狀態相反。
      plain_text: 有些人一到緊張關頭會整個「卡住」、動不了。那不是膽小、也不是故意不配合，是大腦深處一個自動的防衛反射——跟你被嚇到會僵住是同一回事，不受意志控制。它還分兩種：一種是高度警覺的僵（肌肉很緊、抓得死死的），一種更嚴重，像整個人「關機」、眼神放空。兩種看起來都是不動，但裡面的狀態完全相反。對著卡住的人喊「動啊」沒有用，因為那一層根本不聽指令。
    hardware_boundary:
      certainty: 🔵
      text: 在水中，凍結者無法主動輸出動作，而動覺回饋（水如何回應你的動作）需要主動輸出才會產生——所以凍結是最深的感知遮蔽：不只感覺不到水，連感覺不到自己在動。這是反射層，無法用「動起來啊」的指令解除（游泳情境的死亡案例比例本身仍是研究空白）。
    l_note: L0 最深層的遮蔽狀態。
    misconception_refs:
    - cue: 他就是不肯動 / 不配合
      why: 凍結是不自主的防衛反射，不是抗拒；催促等於加重威脅。
      better: 降低威脅、恢復安全信號（聲音、觸碰許可、可預測性），讓神經系統先離開凍結。
    sources:
    - Roelofs 2017（Philosophical Transactions of the Royal Society B）
    - Kozlowska et al. 2015（Harvard Review of Psychiatry）
    source_ids:
    - src.roelofs-2017-freeze-for-action
    - src.kozlowska-2015-defense-cascade
  - id: psych.fear.co2_breath_panic
    name_zh: 換氣過度反而會引爆憋氣恐慌
    nav_zh: 換氣恐慌
    order: 4
    status: complete
    phenomenon:
      certainty: 🔵
      text: 恐懼者典型是上胸淺快呼吸。淺快換氣讓血中 CO₂ 偏低，於是「想呼吸」的慾望感變弱，人就會不知不覺憋氣憋太久；一旦 CO₂ 回升並驟然超過閾值，就觸發一次微型恐慌，感知瞬間關閉、技術崩解。矛盾就在這裡：表面上的「換氣過度」反而是後段憋氣恐慌的引信。
      plain_text: 緊張的人通常會不自覺地用胸口淺淺地快呼吸。問題是這種呼吸法會讓血裡的二氧化碳偏低，於是「想吸氣」的感覺變得很弱——人就不知不覺憋氣憋太久。等二氧化碳突然衝上來，身體一下子警報大作，引爆一次小恐慌，當場什麼水感、技術全垮掉。矛盾就在這：看起來像「呼吸太多」，其實是後面那場恐慌的引信。
    hardware_boundary:
      certainty: 🟢
      text: 對 CO₂ 上升的敏感度有生理底盤：受訓潛水員的 CO₂ 耐受明顯高於恐慌傾向者（Kyriakoulis 2025）。提高耐受要靠漸進訓練，不是靠意志撐住。
    intervention_refs:
    - name: 陸上腹式呼吸
      certainty: 🔵
      how_to: 先在陸上讓學習者感受「吐氣時想呼吸的慾望是正常的」，不把這個感覺當警報。
    - name: 嘴碰水面吐氣（氣泡回饋）
      certainty: 🔵
      how_to: 用看得見的氣泡提供視覺回饋，降低憋氣的隱性焦慮。
    - name: 規律呼吸節奏
      certainty: 🔵
      how_to: 建立固定的吸—轉頭—吐入水節律，規律本身就抑制 CO₂ 驟升。
    sources:
    - Beck et al. 1999（Journal of Abnormal Psychology）
    - Kyriakoulis & Caballero 2025（Frontiers in Psychiatry）
    source_ids:
    - src.beck-1999-hypercapnic-hypoxic
    - src.kyriakoulis-2025-diving-response-co2
  - id: psych.fear.diving_reflex_calm
    name_zh: 同一片水，也能讓人冷靜
    nav_zh: 潛水反射
    order: 5
    status: complete
    phenomenon:
      certainty: 🔵
      text: 水對恐懼者同時打開兩條相反的迷走神經通路。一條是背側迷走：水=威脅+呼吸限制→崩潰凍結。另一條是潛水反射：臉部接觸（偏冷的）水→三叉神經感知→迷走神經激活→心跳反射性減緩→副交感優勢→ 產生鎮靜。也就是說，同一片水可以是威脅，也可以是冷靜的開關，差別在於怎麼進入。
      plain_text: 同一片水，對怕水的人其實同時握著兩個開關。一個是威脅開關：水＝危險＋不能呼吸，越踩越慌。另一個剛好相反——當臉（尤其是偏涼的水）碰到水面，身體會自動觸發一個讓心跳變慢、人變平靜的反射。也就是說，水可以讓人慌，也可以讓人靜，差別只在「怎麼進去」。慢慢地、自願地讓臉碰水，往往是把人從慌那邊拉回靜這邊的第一步。
    hardware_boundary:
      certainty: 🟢
      text: 潛水反射的生理路徑（三叉神經 CN V 感知、迷走神經 CN X 減緩心跳、臉部冷刺激最強）是已知的；但「用它當游泳教學的鎮靜工具」是從恐慌症臨床研究外推，游泳教學方案的效果仍未驗證（研究空白）。
    intervention_refs:
    - name: 漸進臉部接觸水
      certainty: 🔵
      how_to: 引導學習者緩慢讓臉部接觸水，利用潛水反射的自然鎮靜——前提是先建立安全感，避免突然的冷水觸發驚嚇而轉成交感主導。
    sources:
    - Panneton & Gan 2020（Frontiers in Neuroscience）
    - Kyriakoulis et al. 2021（Frontiers in Psychiatry）
    - Kyriakoulis & Caballero 2025（Frontiers in Psychiatry）
    source_ids:
    - src.panneton-gan-2020-diving-response-neural
    - src.kyriakoulis-2021-diving-response-panic
    - src.kyriakoulis-2025-diving-response-co2
  - id: psych.fear.safety_precondition
    name_zh: 沒有安全感就學不進去
    nav_zh: 安全前提
    order: 6
    status: complete
    phenomenon:
      certainty: 🔵
      text: 神經系統只有在判定「安全」時才會進入學習就緒狀態，開放接收新技術（多迷走理論的腹側迷走狀態）。水的陌生本身就是一串新奇威脅信號：重力消失、視覺模糊、聲音改變。教練的聲調、節奏、眼神接觸、一致性，會被學習者的神經系統自動評估（neuroception），決定他能不能維持在能學習的狀態。這是框架外推（多迷走理論在游泳的操作化測量仍是研究空白），但方向上與所有教學經驗一致。
      plain_text: 大腦有個很實際的規矩：只有先判定「現在安全」，它才會打開學習的開關，願意接收新東西。可是水這個環境本身就一直在發陌生的警報——沒了重力、看不清楚、聲音都變了。這時候教練的語氣、節奏、眼神、做事一不一致，會被學習者的神經系統悄悄打分數，決定他能不能待在「學得進去」的狀態。所以「凶一點他才會認真」剛好搞反了：嚇他只會把學習開關關得更緊。
    misconception_refs:
    - cue: 凶一點他才會認真 / 嚇一下就敢了
      why: 威脅信號把神經系統推離學習就緒態，恐懼者只會更關閉，不是更專注。
      better: 用穩定、可預測的安全信號（清楚的流程、觸碰許可、一致的語氣）維持學習狀態。
    intervention_refs:
    - name: 池外先建立信任
      certainty: 🟠
      observation_basis: 同 `psych.fear.control_loss` 的同名介入：這是教學界通行做法，不是本專案的教練觀測，原標注的「ERIC 教學實踐指引」不是可回溯來源（ERIC 是資料庫不是發行者，見錯誤 30）。族群涵蓋兒童與成人初學者。外推邊界：本條在「安全前提」脈絡下使用時要特別注意，建立信任是**心理安全**的前提，不能替代**物理安全**（救生員在場、水深、器材）——兩者是並列條件，不是可以互相抵換的。
      how_to: 進水前先建立教練關係與情緒安全。
    - name: 可預測流程 + 觸碰許可
      certainty: 🔵
      how_to: 每一步先說會發生什麼、徵得同意再做，把不可預測性降到最低。
    sources:
    - Porges 2022（Frontiers in Integrative Neuroscience）
    source_ids:
    - src.porges-2022-polyvagal-safety
  - id: psych.fear.population_faces
    name_zh: 恐懼的不同臉孔（依族群）
    nav_zh: 族群差異
    order: 7
    status: complete
    phenomenon:
      certainty: 🟠
      observation_basis: 四個族群的恐懼簽名是本專案整合教學實務與各族群文獻後的判讀，觀察者是本專案作者，族群涵蓋兒童初學、成人初學、鐵人三項、青少年競技——正是專案 CLAUDE.md 指定的全光譜對象。外推邊界有三層：① 各族群的證據厚度差很多——兒童初學與青少年競技有文獻可對照，成人初學與鐵人三項的恐懼結構幾乎全靠教學現場判讀，本專案未查到第一手研究； ② 「安全感一建立就快速消退」是對兒童的一般傾向描述，不適用於有溺水經驗或創傷史者； ③ 這是**辨識用的分類**，不是診斷工具——同一個人可以同時帶兩種簽名（例如成人鐵人選手同時有社會羞恥與開放水域情境恐懼），分類不互斥。
      text: 「水中恐懼」是同一個標籤，在不同族群指向完全不同的介入點，不能一套水性課通用：兒童初學是陌生環境的新奇威脅加上父母恐懼的代際傳遞，安全感一建立就快速消退；成人初學疊加了社會羞恥與自我意識，失控簽名被「這年紀還不會」的評價威脅放大；鐵人三項多半泳池能游，怕的不是水而是開放水域情境（看不到底、群泳被踩踏、無法觸壁），是有能力的泳者在賽境被暫時打回 L0；青少年競技的「怕」多半已不是 L0 水恐，而是表現/評價焦慮。
      plain_text: 「怕水」是同一個詞，但在不同人身上指的常常是完全不同的東西，不能用同一套課應付。小朋友怕的多半是陌生環境，加上會從爸媽身上「接收」到怕——但安全感一建立就退得很快。成年初學者上面還疊了一層難為情：「這年紀還不會游」的眼光，會把那份失控感放大。鐵人三項的人通常泳池游得好好的，怕的是開放水域——看不到底、被人踩到、摸不到牆，是有能力的泳者被賽場暫時打回原點。青少年選手嘴上說怕，很多時候已經不是怕水，是怕表現不好被看見。先認出是哪一種，才談得上怎麼幫。
    population_note: 框架紀律：本專案教學對象涵蓋全光譜、沒有單一主客群。恐懼文獻嚴重偏壓兒童泳課與一般非游泳者，其他族群（成人初學的社會性恐懼、鐵人開放水域 panic、青少年評價恐懼）多為質性/二手轉述，屬素材缺口而非「次要對象」，不以兒童 L0 資料外推填空。
    misconception_refs:
    - cue: 把鐵人三項或青少年的「怕」用兒童 L0 水性課來處理
      why: 族群混淆——他們的恐懼不在 L0 水性，介入點完全不同。
      better: 成人先卸評價威脅再暴露；鐵人做開放水域情境減敏（群泳模擬、定位呼吸）；青少年往表現焦慮查。
    sources:
    - Coelho et al. 2025（Education Sciences）
    - Wilson et al. 2023（BMC Public Health）
    source_ids:
    - src.coelho-2025-fear-aquatic-environment
    - src.wilson-2023-adults-learning-to-swim
- id: psych.interaction
  name_zh: 心理–感知–生理交互
  nav_zh: 身心交互
  when_zh: 不怕了，但一緊張身體就僵、換氣一亂整個垮時
  order: 2
  status: complete
  band: 初學端
  l_band: L0–L2
  level_tag: 初學
  concept_count: 8
  lead_zh: 很多人過了怕水那一關，下水卻還是覺得卡：一緊張身體就僵，換氣一亂整個節奏就垮。這不是又退回去怕了，而是心理和身體在水裡本來就接在同一條神經線路上——你一緊張，肌肉會不自覺繃緊，繃緊的身體回報給你的水流訊號就變糊；換氣一占住注意力，原本感覺得到的水就暫時消失。所以這一章講的不是「心態問題」，是身體層面真的會發生的事：為什麼「放鬆才有水感」不是一句安慰，而是有生理道理的。
  bridge_zh: 身體和心理在水裡互相點火，講的是「當下這一趟」會發生什麼。但能不能真的練得起來，還要看一件更長線的事——你願不願意一次又一次回到水裡。下一章講動機：是什麼讓人練得下去，又是什麼讓人在不知不覺中放棄。
  premise:
    layer: public
    certainty: 🔵
    one_line: 心理狀態不是「影響」身體的外力，而是和感知、生理共用同一條神經迴路——喚醒會直接改寫肌肉張力與本體感覺解析度，所以「放鬆才有水感」是生理事實，不是雞湯。
  concepts:
  - id: psych.interaction.anterior_insula_gain
    name_zh: 焦慮者前島把身體訊號放大為威脅
    nav_zh: 前島放大
    order: 1
    status: complete
    phenomenon:
      certainty: 🟢
      text: 焦慮與高度喚醒狀態下，前島皮質（anterior insula）對身體內在訊號的增益（gain）升高：同樣的心跳加速、呼吸節律改變、浮力造成的內臟位移，在焦慮者腦內被解讀為更強烈的威脅訊號（Paulus & Stein 2010, PMID 20490545）。前島是所有主觀「感覺」的整合中心，整合了心率、血氧、溫度與內臟壓力後輸出「此刻身體狀態如何」的主觀感受（Craig 2002, 2009）。水中的「感覺不舒服」因此往往不是水本身的危險，而是前島整合多種中性訊號後放大輸出的主觀不適。
      plain_text: 腦子裡有個地方專門負責「把身體各種訊號整合成一種感覺」——心跳、呼吸、肚子裡的位移，最後變成你主觀感覺到的「現在身體舒不舒服」。焦慮的時候，這個地方的音量會被調大：同樣的心跳加速、同樣的身體飄一下，在緊張的人腦裡會被放大成「不對勁、有危險」。所以怕水的人在水裡覺得「好奇怪、好不舒服」，常常不是水真的怎麼了，是這個放大器把一堆其實中性的訊號，整合成了一個「威脅」的感覺。
    hardware_boundary:
      certainty: 🔵
      text: 前島敏感化機制來自臨床焦慮/憂鬱研究（Paulus & Stein 2010）與神經影像（Craig 2002/2009），均為陸上實驗室或非游泳情境。外推至水中游泳教學屬跨領域推導：游泳情境下浮力卸除重力對內臟的壓迫，提供了額外的位移感知，可能放大前島增益效應，但游泳場景專屬的前島量測目前仍為研究空白。內感訓練可改變前島迴路已有初步支持（Translational Psychiatry 2024, DOI 10.1038/s41398-024-02933-9）。
    l_levels:
    - L0
    - L1
    l_note: 前島增益升高時，學習者感知頻寬被威脅性自我監控佔據，外部水流訊號被壓制。此機制是 L0–L1 感知建立的心理底層障礙——不先降低前島敏感化，感知通道難以對流場開放。
    intervention_refs:
    - name: 重複正向水中暴露（降前島激活閾值）
      certainty: 🔵
      how_to: 漸進式水中暴露（從腳入水到面部入水）提供重複的「身體訊號→無威脅結果」配對，有助於重新校準前島對水中身體訊號的評估增益。Baba et al. (2021) 顯示 25 分鐘水浸後內感準確性提升、心率下降，支持水中暴露本身具有內感訓練效果。
    - name: 正念/內感覺知訓練
      certainty: 🔵
      how_to: Haase et al. (PMC4692309) 顯示正念訓練使海軍陸戰隊員的前島反應模式向菁英運動員靠攏（遇到呼吸負荷時抑制而非放大前島反應）。陸上正念訓練外推至游泳教學仍需驗證，但方向支持用於降低前島敏感化。
    population_note: 前島放大效應在焦慮傾向個體最強，但機制本身跨族群存在。兒童初學的前島整合系統尚未成熟，對「新奇身體訊號」的評估基準不同；競技泳者的前島反應模式已透過重複訓練重新校準，在氣流受阻時反而表現出前島抑制（Paulus et al. 2012, PMC3261851）。成人初學因社會威脅疊加（羞恥/自我意識），前島整合的威脅訊號來源更複雜。文獻多來自臨床焦慮或菁英運動員研究，初學者族群的游泳前島量測仍為研究空白。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.1
    - Research/心理/08_心理感知生理交互.md#1.3
    source_ids:
    - src.research-psych-08-a
    - src.research-psych-08-c
  - id: psych.interaction.stress_hypertonia
    name_zh: 張力升高是感知閘門，不只是阻力
    nav_zh: 張力閘門
    order: 2
    status: complete
    phenomenon:
      certainty: 🟢
      text: 焦慮觸發交感激活後，γ-運動神經元活性升高，肌肉基線張力隨之上升。實驗顯示中度焦慮使前運動時間的 EMG 活性增加（Barreto et al. 2017, DOI 10.1016/j.neulet.2017.02.033）；肌肉放鬆則可恢復焦慮者的運動意象能力（PMC11723612, 2025）。肌張力升高不只增加水中阻力：關節受器（Ruffini 末梢）在皮膚被拉緊時飽和，機械感受器對水流方向與壓力的感知通道因此受阻。身體緊繃同時也造成動作時序提前（前饋控制崩潰），解釋了初學者 EMG 早啟動現象（Vaz et al. 2016, PMID 26878097；Olstad et al. 2017）的可能神經機制：γ-運動神經元活性升高 → 肌梭虛報張力喪失 → 提前觸發保護性收縮。
      plain_text: 一緊張，身體會不自覺繃緊，這是自律神經自動做的，你常常自己沒察覺。這層繃緊不只是讓你在水裡比較費力——它還會把感覺水的管道堵住。皮膚和關節裡有一批負責「感覺壓力和水流方向」的小受器，當身體被繃到很緊、皮膚被拉滿的時候，這些受器可能會像被塞爆一樣達到飽和，細緻的水流訊號就傳不上來了。所以「放鬆才有水感」不是修辭——身體一硬，感覺水的線路就先被掐住一截。
    hardware_boundary:
      certainty: 🔵
      text: 'Barreto et al. (2017) 與 PMC11723612 (2025) 為陸上焦慮 EMG 研究；水中浮力已改變肌張力基線，焦慮性肌張力升高在水中的量值與感知影響可能與陸上不同。 Ruffini 末梢飽和阻斷水感的具體路徑為推導（🔵），游泳場景中尚無直接量測。初學者 EMG 早啟動的焦慮成因（解釋 #1）有文獻支持但仍為最強假說，非定論。'
    l_levels:
    - L0
    - L1
    - L2
    l_note: 張力閘門在 L0–L2 的影響最直接：當身體緊繃時，感知系統無法接收到細緻的浮力回饋與流場壓力訊號，L1 的漂浮感知和 L2 的推進阻力感知都需要低張力狀態才能建立。
    misconception_refs:
    - cue: 放輕鬆就好了
      why: 口令正確但無操作化：未告訴學習者「放輕鬆」的身體感覺是什麼，也未提供任何感知錨點讓他們知道自己有沒有達到低張力狀態。對高焦慮者，抽象的「放鬆」指令反而可能增加「我沒辦法放鬆」的認知負荷。
      better: 給具體感知目標：「讓手腕像水草一樣漂浮」「感覺水在托著你，不要幫忙撐」——讓低張力有可感知的錨點，而非靠意志壓制緊繃。
    intervention_refs:
    - name: 先建立低張力感知錨點，再加入技術要求
      certainty: 🔵
      how_to: 在安全漂浮狀態（有支撐）下讓學習者確認「低張力感覺是什麼」，再逐步移除支撐。肌肉放鬆訓練（PMC11723612）在焦慮者身上可恢復運動計畫能力，先做陸上放鬆再入水是合理前置步驟。
    population_note: 兒童初學的基線肌張力因發展階段不同，焦慮引發的額外升高程度與成人不同，且兒童難以言語報告張力狀態。競技泳者的張力控制已自動化，張力升高通常只在高壓賽境才顯著影響感知。鐵人三項開放水域情境的群泳接觸可能觸發急性肌張力升高，影響最初幾百公尺的感知品質。文獻（Barreto 2017, PMC11723612）均為一般焦慮/EMG 研究，非游泳專屬。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.2
    - Research/心理/08_心理感知生理交互.md#4.2
    source_ids:
    - src.research-psych-08-b
    - src.research-psych-08-j
  - id: psych.interaction.rpe_psychobiological
    name_zh: 做不到是努力知覺超標，不是肌力不夠
    nav_zh: 努力知覺
    order: 3
    status: complete
    phenomenon:
      certainty: 🟢
      text: Marcora 的心理生物模型（Marcora, Staiano & Manning 2009, PMID 19131473）顯示： 90 分鐘認知作業後，心肺指標不變，但受試者的力竭時間縮短 15.1%（RPE 更高）——純心理疲勞即可透過提升努力知覺（RPE）縮短表現。潛意識呈現情感性訊號（笑臉）可在不知情下降低 RPE 並延長耐力（Blanchfield, Hardy & Marcora 2014, PMC4263011）。正向自我對話使耐力提升約 18%（Blanchfield et al. 2014）。核心主張：運動的終止決策由「努力知覺 vs. 潛在動機閾值」的比值決定，而非肌肉生化失敗。
      plain_text: 「游幾下就累到做不下去」，多數人以為是肌力或體力不夠。但研究發現，決定你撐不撐得下去的，不是肌肉真的沒力了，而是大腦覺得「這件事有多費力」超過了你願意付出的程度。有實驗讓人先做 90 分鐘很累的腦力作業，身體一點都沒動，接下來運動卻明顯更早放棄——純粹是「感覺更費力」就讓人撐不久。游泳初學者的這份費力感裡，還疊了怕沉下去的恐懼和「動作還不熟」的腦力負擔，所以他喊累，往往不是肌肉的問題，是這份費力感整個超標了。
    hardware_boundary:
      certainty: 🔵
      text: Marcora 的研究基礎為自行車/跑步耐力情境，非游泳。游泳初學者的 RPE 額外包含溺水恐懼成分與前島放大效應，其動機架構與純耐力運動不同，尚無游泳場景的直接量測。 Noakes 的中央調節者理論（PMID 9140893；Tucker 2009, PMID 19224911）與 Marcora 在 RPE 是最關鍵測量指標這一點上達成共識，兩者均支持「游泳中的停止訊號是腦層決策而非肌肉失敗」的推導方向，但游泳技術崩潰的 RPE 分解實驗目前為研究空白。
    l_levels:
    - L0
    - L1
    - L2
    l_note: 對防衛型初學者，在水中「感覺做不到」的 RPE 包含三個可區分的成分：生理疲勞（較小）、恐懼性前島放大（較大）、認知負荷（技術未自動化）。降低 RPE 的介入點因此不是肌力訓練，而是依序降低恐懼性成分與認知負荷。
    misconception_refs:
    - cue: 多游幾趟體力上來就好了
      why: 把「做不到」的原因歸結為體力/肌力不足，實際上初學者的停止訊號主要來自 RPE 超出動機閾值（恐懼 + 認知負荷 + 生理），純粹增加游趟數不能降低 RPE 的焦慮成分，甚至可能因反覆失敗提升 RPE 基線。
      better: 先識別 RPE 升高的來源：是呼吸節律失調（降換氣認知負荷）、還是肌張力引發的前島放大（先降張力）、還是真的體能問題。
    intervention_refs:
    - name: 正向自我對話（self-talk）
      certainty: 🟢
      how_to: Blanchfield et al. (2014) 的正向自我對話使 RPE 升高速率降低、耐力提升約 18%，機制為情感性訊號直接調節 RPE。游泳教學中鼓勵性語言的效果方向一致，但游泳場景的量測有待研究。
    - name: 降低認知負荷（自動化換氣）
      certainty: 🔵
      how_to: 感知訓練降低水中游泳的認知負荷（動作自動化後 RPE 貢獻降低），是 RPE 管理的結構性介入，效果比意志力壓制更持久。
    population_note: 兒童的動機閾值與成人不同，兒童 RPE 量表（如兒童版 Borg）需使用年齡適配工具。競技泳者的 RPE 主要為生理成分，焦慮貢獻小。鐵人三項的水中 RPE 在起點群泳時因情境威脅陡升，可能超過訓練時的 RPE 基線，導致「訓練游得好比賽卻崩」。 Marcora 研究樣本均為成人受訓者，其他族群的外推需謹慎。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.4
    - Research/心理/08_心理感知生理交互.md#5.1
    - Research/心理/08_心理感知生理交互.md#5.2
    source_ids:
    - src.research-psych-08-d
    - src.research-psych-08-k
    - src.research-psych-08-l
  - id: psych.interaction.attentional_narrowing
    name_zh: 高喚醒時注意力過濾掉流場訊號
    nav_zh: 注意窄化
    order: 4
    status: complete
    phenomenon:
      certainty: 🟡
      text: Easterbrook (1959, PMID 13658305) 的 Cue Utilization 假說：情緒激活升高時，可利用的外周線索範圍線性縮窄。低喚醒時注意力廣，包含雜訊；中度喚醒時注意力範圍最適，感知頻寬匹配任務需求，表現最佳；高喚醒時注意力過度集中於「中心線索」，外周訊號系統性被排除。游泳水感的核心訊號（手掌壓力梯度、前臂貼水面感、體側流場方向）在高喚醒者的注意力框架中屬「外周線索」，因此被自動過濾。高喚醒學習者的中心線索鎖定在「不要溺水」（呼吸位置、身體浮沉），水感訊號成為注意力資源分配後的殘餘。
      plain_text: 人一緊張，注意力的範圍會自動縮小，只剩下它覺得最要緊的那件事。在水裡，高度緊張的人腦中最要緊的事是「不要溺水」——所以他的注意力全鎖在「頭抬起來了沒、會不會沉」上面。而感覺水的那些訊號——手掌心的壓力、前臂貼著水面、身體兩側的水流——對緊張中的腦來說都是「邊邊的雜訊」，會被自動濾掉。這就是為什麼有些人在簡單漂浮時還能說出感覺，一開始划水就「什麼都感覺不到了」：不是感覺消失，是注意力被收窄，把水感擠到框框外面去了。
    hardware_boundary:
      certainty: 🔵
      text: Easterbrook (1959) 為認知心理學實驗室研究，非水中情境。游泳的感官環境（護目鏡、水下噪音、溫度）可能額外壓縮外周感知頻寬，使窄化效應在水中比陸上更強，但此「強化版」尚無直接量測（見研究空白 🔴-08）。 Yerkes-Dodson 倒 U 型曲線（中度喚醒最佳）在水中的精確「最佳喚醒點」未量測。
    l_levels:
    - L0
    - L1
    - L2
    l_note: L0–L1 的首要任務是將喚醒降至中度範圍，才能讓水感的外周訊號頻寬開啟。 L3 以上的精細感知訓練（手感/腳感）在高喚醒狀態下無效，因為那些訊號在注意力資源分配時已被排除在外。
    intervention_refs:
    - name: 先降喚醒、再進水感訓練
      certainty: 🔵
      how_to: 潛水反射（臉部接觸水）、深慢呼吸、降低教學刺激密度，先將喚醒帶入中度範圍，再引導注意力轉向外周水感訊號。對高喚醒學習者，技術指令的數量也要縮減——指令過多本身就是一個喚醒來源。
    population_note: 注意力窄化機制跨族群存在，但「中心線索」的定義因族群而異：兒童中心線索可能是父母的臉或聲音；成人初學是呼吸能否控制；鐵人三項在賽境的中心線索是群泳位置和計時器；競技泳者的中心線索在高壓賽境可能偏移至競技焦慮而非流場感知。文獻樣本偏壓認知心理學的一般成人，族群差異待研究。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.6
    source_ids:
    - src.research-psych-08-e
  - id: psych.interaction.vagal_tone_fear_extinction
    name_zh: 迷走張力決定脫敏快慢
    nav_zh: 迷走脫敏
    order: 5
    status: complete
    phenomenon:
      certainty: 🟢
      text: 靜息心率變異性（HRV）較高的個體，在恐懼消弱訓練（extinction learning）中更快速、更完整地消除恐懼反應（Pappens et al. 2014, PMID 25181542, PLoS ONE 9(9):e105054）。高迷走張力（高 HRV）反映腹側迷走系統的參與能力，關聯到安全感建立速度與學習靈活性。高特質焦慮者靜息 HRV 持續降低；自律訓練（autogenic training）可提升 HRV （Miu, Heilman & Miclea 2009, PMID 19059813）。 Porges 的多元迷走神經理論（1994/2011）提供框架：學習就緒狀態對應腹側迷走系統的主導，高 HRV 個體更容易維持在此狀態下接受新訊息。
      plain_text: 每個人「從害怕到放下」的速度天生不太一樣，這可能和一個身體指標有關：心跳之間的自然變動度（簡稱 HRV）。HRV 高的人，神經系統比較容易進入「安全、可以學新東西」的狀態；研究顯示這種人在練習「不再害怕某件事」時，消除恐懼的速度比較快、也比較徹底。要先講清楚：這目前主要是在實驗室測出來的，不是在游泳池裡，把它套到「HRV 高的學員脫敏比較快」還是一個推論。它能幫忙解釋的，是為什麼有些人怕水退得快、有些人慢，可能不全是努不努力的問題，而是身體底子的差別——而且這個底子，有機會靠規律的深慢呼吸慢慢練起來。
    hardware_boundary:
      certainty: 🔵
      text: Pappens et al. (2014) 的恐懼消弱研究為內感恐懼制約範式（非游泳），外推至「高 HRV 的游泳初學者脫敏速度更快」屬推導（見 dossier §六 🔴-04：此假說未驗證）。游泳場景中 HRV 作為脫敏速率預測指標的直接研究目前為研究空白。 Porges 多元迷走神經理論的游泳教學應用同為框架推導，操作化量測待研究。
    l_levels:
    - L0
    - L1
    l_note: 如果靜息 HRV 確實預測游泳脫敏速率，則初診時的 HRV 評估可作為 L0 學習者所需暴露階梯長度的前置估算指標——這仍是假說，提供研究方向。
    intervention_refs:
    - name: 提升迷走張力的訓練（自律訓練 / 呼吸訓練）
      certainty: 🟡
      how_to: Miu et al. (2009) 顯示自律訓練可逆轉焦慮者的 HRV 降低。水中的規律深慢呼吸、潛水反射啟動，可能在游泳課中直接練習迷走張力——但游泳課前後的 HRV 變化量測尚待研究。
    population_note: HRV 的正常參考區間因年齡、性別、體能水平差異顯著。兒童靜息 HRV 天生較高且波動大，不宜用成人標準解讀。競技泳者基線 HRV 通常高於一般人，但賽前焦慮下仍可能驟降。 Pappens et al. (2014) 樣本未限定游泳族群，所有族群外推均屬 🔵 推導。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.7
    - Research/心理/08_心理感知生理交互.md#4.1
    source_ids:
    - src.research-psych-08-f
    - src.research-psych-08-i
  - id: psych.interaction.freeze_prefrontal_shutdown
    name_zh: 凍結時前額葉下調，教得再好也聽不進
    nav_zh: 凍結停聽
    order: 6
    status: complete
    phenomenon:
      certainty: 🟢
      text: 防衛反應存在分級瀑布（Kozlowska、Walker、McLean 與 Carrive 2015，《Harvard Review of Psychiatry》）：從定向、預警凍結（交感主導）、逃跑/戰鬥，到強直性不動、崩潰性不動（背側迷走主導）。凍結不是被動靜止，而是杏仁核→中腦導水管周圍灰質（PAG）路徑啟動的主動備戰狀態（Roelofs 2017，《Philosophical Transactions of the Royal Society B》）。此狀態下，前額葉的下行抑制（executive control）減弱，運動計畫與指令接收所需的前額葉功能暫時受阻。
      plain_text: 有些學員在水裡會整個僵住、像是聽不見你說話。這不是故意不配合，也不是「講不聽」——是身體進入了一種叫「凍結」的防衛狀態。凍結不是放空發呆，而是大腦的警報區整個接管，把負責「理解指令、規劃動作」的那塊前額葉暫時壓了下去。所以在這個狀態下，你教得再仔細、講得再多次，他都接收不進去；而且講越多、語氣越急，對他的神經系統來說是威脅又升高，只會凍得更深。遇到這種狀況，第一步不是再教一次，是先讓他覺得安全、把警報關掉。
    hardware_boundary:
      certainty: 🔵
      text: 水中防衛型學員凍結狀態的神經機制為跨領域推導（來自動物恐懼研究與臨床防衛反應文獻），游泳情境中「前額葉因凍結而受阻導致指令接收失敗」尚無直接量測。背側迷走崩潰（解離）與交感預警凍結在外觀上均為「不動」，但神經狀態相反，介入方式不同；水中識別兩者的可靠方法尚待研究。
    l_levels:
    - L0
    l_note: L0 最深層的感知遮蔽狀態：凍結者無法主動輸出動作，而動覺回饋需要主動輸出才產生。在凍結狀態下繼續推進技術指令等於加重威脅訊號，可能深化而非解除凍結。
    misconception_refs:
    - cue: 講了這麼多次還是不動，就是不想學
      why: 凍結是 PAG 路徑的神經反射，不是抗拒或故意不配合。在凍結狀態下增加指令頻率或加重語氣，對神經系統而言是威脅訊號升高，可能觸發更深層的防衛反應（從預警凍結升至崩潰性不動）。
      better: 識別凍結信號後，暫停所有技術指令，先恢復安全感：降低聲音、提供身體控制感（可以離開水）、等待神經系統離開凍結再繼續。
    population_note: 兒童的凍結信號可能更難與「不想學」區分，因為兒童語言自我報告能力有限。成人在社會脈絡下可能「表演配合」但實際仍處於凍結邊緣，外觀行動但水感通道關閉。凍結文獻多來自動物研究與臨床創傷研究，游泳教學中輕度凍結的識別缺乏標準化方法。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.8
    source_ids:
    - src.research-psych-08-g
  - id: psych.interaction.breathing_cognitive_load
    name_zh: 換氣未自動化時，每次呼吸都閃斷一次水感
    nav_zh: 換氣負荷
    order: 7
    status: complete
    phenomenon:
      certainty: 🔵
      text: 陸上呼吸是腦幹自動化、幾乎零注意力成本的。游泳換氣則是必須與划臂週期精密對時的運動任務：轉頭/抬頭時機、吐氣-吸氣窗口、氣道保護。對未自動化的泳者，每一次換氣都要求把一份注意力資源從流場感知通道暫時抽走，投向「這口氣的執行」。此機制建立在已驗證的雙重任務成本與 Easterbrook 注意力窄化之上：換氣時機到達 → 注意力被徵召去執行換氣 → 流場感知通道（掌心壓力、前臂貼水、體側漩渦）暫時失去精度加權 → 該換氣週期內水感「閃斷」→ 若泳者察覺變糊 → 喚醒微升 → 注意力窄化疊加 → 惡性循環。此機制可解釋長期教學觀察到的「換氣側划手系統性比非換氣側差」現象。
      plain_text: 在陸地上呼吸是全自動的，不花你一點注意力。但游泳換氣不是——它得跟划手的節奏精準對上：什麼時候轉頭、什麼時候吐、什麼時候吸、怎麼不嗆到。對還沒練到自動的人，每換一次氣都得從「感覺水」那邊借走一份注意力，去處理「這口氣」。借走的那一瞬間，手掌的壓力、身體旁邊的水流感就暫時變糊了——水感等於每換一次氣就閃斷一次。這也很可能解釋了一個常見現象：很多人換氣那一側的划手，總是比另一側差，因為那一側每一划都被換氣打斷過。
    hardware_boundary:
      certainty: 🔵
      text: 此整條機制鏈為推導（🔵），建立在雙重任務文獻與 Easterbrook (1959) 之上；游泳換氣的認知負荷量值，以及換氣側 vs. 非換氣側水感精度差異的直接量測，目前尚無第一手數據（研究空白 🔴-09）。不焦慮的泳者（低喚醒）此機制仍成立，但幅度應小於高焦慮狀態。對自動化程度高的競技泳者，此成本在正常速度下接近零，只在衝刺/缺氧段才浮現。
    l_levels:
    - L1
    - L2
    - L3
    l_note: 換氣閃斷在 L1–L2 最影響感知建立的連貫性：L1 需要在漂浮中感知浮力回饋，但換氣動作打斷了這個感知窗口；L2 的推進阻力感知在換氣週期內精度下降。 L3 以上的精細水感訓練若不同步自動化換氣，每一趟的換氣側都會是感知弱點。對 L0 防衛型學習者，換氣帶來的認知負荷疊加前島放大，可能是一次喚醒升高點。
    misconception_refs:
    - cue: 換氣不好是因為你頭轉得不夠快/不夠及時
      why: 把換氣問題歸因為純動作形式，忽略了換氣是認知負荷注入點——只練轉頭速度不能降低換氣的注意力成本，水感閃斷的根本原因是換氣動作尚未自動化，而非頭的移動時機。
      better: 讓換氣動作本身先在低壓環境自動化（站立換氣 drill → 浮板換氣）再整合入完整划水，而非在完整游泳中反覆糾正頭的位置。
    population_note: 此機制對成人初學與兒童初學最強（換氣最不自動化）。兒童因注意力資源總量較有限，換氣的認知負荷比例相對更高，解釋了兒童「會游但換氣一加就崩」的常見現象。競技泳者換氣已高度自動化，殘餘成本在高強度訓練/缺氧段才顯著。鐵人三項選手若在公開水域改換氣頻率 (1:2 → 1:3)，換氣側的認知負荷比預期高，可能影響感知品質。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.9
    source_ids:
    - src.research-psych-08-h
  - id: psych.interaction.water_immersion_interoception
    name_zh: 水浸不只脫敏，同時訓練內感覺知
    nav_zh: 水浸內感
    order: 8
    status: complete
    phenomenon:
      certainty: 🟢
      text: Baba et al. (2021, IJERPH 18(19):10259, DOI 10.3390/ijerph181910259) 顯示： 25 分鐘水浸後，內感準確性（interoceptive accuracy）提升，心率下降。長期游泳訓練者與非訓練者在靜態條件下的內感指標無差異，但水浸過程中有即時性的內感提升效應。此發現支持「水中暴露本身是內感訓練」的假說——水浸提供了浮力卸載重力、體溫刺激、靜水壓，創造了陸上難以複製的內感刺激情境，在此情境下的身體覺知練習具有訓練效果。
      plain_text: 待在水裡這件事本身，可能就在訓練你「感覺自己身體」的能力。有研究發現，人在水中泡了 25 分鐘後，對自己身體訊號的感知變得更準、心跳也降了下來。有趣的是，長期游泳的人在岸上量並沒有比較厲害——也就是說，這個效果是「泡在水裡的當下」才出現的。水把重力卸掉、又給你溫度和水壓的刺激，創造了一個陸上做不出來的環境，在這個環境裡單純地待著、感覺身體，本身就有練習的效果。這帶來一個實用的提醒：別一下水就急著要求做動作——讓身體先在水裡靜靜待一會兒，感知的通道反而更容易打開。
    hardware_boundary:
      certainty: 🟢
      text: Baba et al. (2021) 發現長期游泳訓練者在靜態條件下與非訓練者的內感指標無差異，意味著內感提升效應是情境性的（水浸中），不能自動外推至「游泳訓練提升一般性內感能力」。恐水個體在水浸中的內感準確性變化（是否與非恐水個體相同，或被焦慮放大/壓制）目前為研究空白（🔴-03）。Paciorek & Skora (2020, DOI 10.3389/fpsyg.2020.01659) 提供迷走神經刺激改善內感覺知的機制背景，與水浸途徑可能有交集但未直接連結。
    l_levels:
    - L0
    - L1
    l_note: 若水浸的內感訓練效果在恐水個體中得到確認（🔴 待研究），則漸進水中暴露的教學設計不只是「讓學習者脫敏」，同時也在提升其感知水中身體訊號的準確度——兩個機制同時運作，為 L0→L1 過渡提供雙重支撐。
    intervention_refs:
    - name: 無結構性水中靜止浸泡（作為感知前置）
      certainty: 🔵
      how_to: 技術訓練前安排 10–20 分鐘的低結構水中靜止時間（站立、扶邊），讓學習者在非任務狀態下讓身體適應水中內感環境，可能降低後續技術練習時的前島增益，打開感知頻寬。 Baba et al. (2021) 的效果為 25 分鐘，陸上正念文獻建議逐步積累，最適時長在游泳教學情境中未直接測量。
    population_note: Baba et al. (2021) 的研究樣本為成人，恐水者、兒童、競技泳者的水浸內感效應均需分別驗證。水浸提升內感的效果被合理推測在內感敏感度較低的個體（高焦慮者、體感覺知較弱者）更大，但此推測目前缺乏數據支持。鐵人三項選手在開放水域的感官環境（能見度低、水溫冷）下，水浸訓練效果與泳池情境的差異尚未比較。
    sources:
    - Research/心理/08_心理感知生理交互.md#1.3
    - Research/心理/08_心理感知生理交互.md#4.1
    source_ids:
    - src.research-psych-08-c
    - src.research-psych-08-i
- id: psych.motivation
  name_zh: 動機與動機氣候
  nav_zh: 動機
  when_zh: 提不起勁、練不下去、想找回能一直練下去的動力時
  order: 3
  status: complete
  band: 貫穿全程
  l_band: L0–L6
  level_tag: 全程
  concept_count: 9
  lead_zh: 前面兩章講的是「下水當下」身體和心理發生什麼。但還有一個更長線的問題：一個人願不願意一次又一次回到水裡——這才真正決定他學不學得起來。而願不願意，很大一部分不是「他這個人有沒有毅力」，是環境給的氣候：教練把焦點放在「你有沒有進步、有沒有感覺到新東西」，還是「你贏了誰、排第幾」。前者讓人敢停在不確定的感覺裡慢慢試，後者讓人只敢重複有把握的、不敢探索。這一章講的就是這層土壤：感知要能長出來，先得有願意一直練下去的動機。
  bridge_zh: 動機讓人願意一次次回到水裡。但練習不一定只能在水裡——下一章講一件聽起來有點神奇、其實有神經科學根據的事：在腦中「想像」游泳的感覺，對身體來說幾乎等於真的練了一次。
  premise:
    layer: public
    certainty: 🟢
    one_line: 能不能持續感覺水，底層取決於動機氣候——教練把焦點放在「精熟自己」還是「贏過別人」，會在源頭決定學習者願不願意冒險去探索新的感覺。這是感知能生長的土壤，貫穿初學到競技。
    evidence_from:
    - psych.motivation.bpn_triad
    - psych.motivation.mastery_vs_performance_climate
    - psych.motivation.autonomy_support
  concepts:
  - id: psych.motivation.bpn_triad
    name_zh: 感知土壤的三根支柱：自主、勝任、連結
    nav_zh: 三大需求
    order: 1
    status: complete
    phenomenon:
      certainty: 🟡
      text: 自我決定理論（SDT，Deci & Ryan 2000）主張人類有三項基本心理需求（BPN），需求滿足時產生內在動機、幸福感與持續參與；需求受阻時產生受控動機、倦怠與退出。三需求為：自主（行為出於自我意志而非外部壓力）、勝任（感受到有效應對挑戰的能力、有進步感）、連結（感受到被他人接納與關心、與群體有歸屬感）。游泳直接實證確認三需求在泳者中同樣作用： Conroy 與 Coatsworth（2007）在青少年休閒泳者中驗證教練自主支持→BPN 滿足； Teixeira 等人（2020）在 799 名精英泳者中發現 BPN 滿足→享受→意圖持續的序列中介。
      plain_text: 心理學有個很扎實的發現：人要持續投入一件事，有三個基本需求得被餵飽——自主（這是我自己想做的，不是被逼的）、勝任（我感覺得到自己在進步）、連結（我在這裡被接納、有歸屬感）。這三個被滿足，人會發自內心想繼續；被卡住，就走向倦怠、最後退出。游泳的研究直接驗證了這件事：教練越支持選手的自主，這三個需求越被滿足，選手越享受、也越想一直游下去。所以動機不是「這個人有沒有毅力」的性格問題，是這三根支柱有沒有被撐住。
    hardware_boundary:
      certainty: 🔵
      text: BPN 需求滿足對學習開放性的效應，在游泳情境具有跨研究一致性，但「BPN 滿足如何調節本體感覺解析度或感知探索頻寬」目前仍無游泳專屬神經測量（研究空白 🔴01/🔴05），屬跨領域推導而非游泳直接量測。
    l_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 三需求全 L 範圍持續運作：L0 的連結感決定能否在水邊建立安全基礎； L2–L4 的勝任感回饋是每次感知躍升的內在獎勵；L5–L6 的自主感決定選手能否主動導引自己的感知探索。
    sources:
    - Deci & Ryan 2000（Psychological Inquiry）
    - Conroy & Coatsworth 2007（Psychology of Sport and Exercise）
    - Teixeira et al. 2020（European Journal of Sport Science）
    source_ids:
    - src.deci-ryan-2000-what-and-why
    - src.conroy-coatsworth-2007-ascq
    - src.teixeira-2020-persistent-swimmers
  - id: psych.motivation.continuum
    name_zh: 從「被逼來」到「想來」：動機不是有無，是深淺
    nav_zh: 動機光譜
    order: 2
    status: complete
    phenomenon:
      certainty: 🟡
      text: SDT 的動機連續體把動機分為從左（外在/受控）到右（內在/自主）六個區間：無動機（amotivation）→ 外在調節 → 投射調節 → 認同調節 → 整合調節 → 內在動機。越右側預測長期堅持、享受與幸福感；越左側預測倦怠、退出與 amotivation。游泳縱向直接實證（Pelletier 等人 2001，加拿大競技泳者 n=369，追蹤 22 個月）：內在動機是堅持最強的正向預測因子，無動機（amotivation）是退出最強的負向預測因子；教練的自主支持行為正向預測自主調節形式（即右移）。連續體本身並非游泳原創，但在游泳中有最直接的縱向驗證。
      plain_text: 動機不是「有」或「沒有」的開關，而是一條深淺的光譜。最淺的一端是「被逼來的」（媽媽叫我學、教練要我來），最深的一端是「我自己想來、我享受這件事」，中間還有好幾個層次。一份追蹤泳者快兩年的研究發現：越靠近「自己想來」那端的人，堅持得越久；越靠近「被逼來」那端、甚至完全沒動機的，最容易中途退出。所以問題不是「他有沒有動機」，是「他的動機長在哪一段」——而教練的支持，能把人從被逼來那端，慢慢往自己想來那端推。
    l_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 連續體的位置決定學員在每個 L 級投入的注意力資源：外在調節者「完成動作」不「感覺動作」；內在動機者把感知探索本身當作獎勵，是 L4–L6 細緻感知發展的前提。
    misconception_refs:
    - cue: 他只要下水就好，動機不重要
      why: 研究直接顯示動機類型（內在 vs 無動機）縱向預測退出與否，而非只影響「表現多好」。動機是持續參與的長期結構，不是短期門票。
      better: 把課程設計成讓學員在過程中體驗能力進步（勝任感），而非把動機問題留給學員自己解決。
    sources:
    - Ryan & Deci 2000（American Psychologist）
    - Pelletier et al. 2001（Motivation and Emotion）
    source_ids:
    - src.ryan-deci-2000-sdt-facilitation
    - src.pelletier-2001-swimmer-persistence
  - id: psych.motivation.autonomy_support
    name_zh: 教練語言是動機土壤的施肥或施毒
    nav_zh: 自主支持
    order: 3
    status: complete
    phenomenon:
      certainty: 🟢
      text: 教練的自主支持行為（autonomy-supportive coaching）包含：提供選擇、接納負向情緒、給理由而非命令、關注選手意見、讚美自主行為。游泳直接實證： Conroy 與 Coatsworth（2007）在青少年休閒泳者（n=165）中驗證自主支持教練行為正向預測 BPN 滿足與自主動機。 Minkels 等人（2023）觀察 128 堂荷蘭游泳課，發現現行游泳教學**嚴重壓制自主需求**，只有採用 SDT 設計課程的教師表現明顯更好。控制行為（controlling coaching）——壓力、威脅、條件式獎勵——預測需求受阻（need thwarting），需求受阻是與需求滿足獨立的維度（Bartholomew 等人 2011；Vansteenkiste 與 Ryan 2013）。 Liu 等人（2025）的系統性回顧與 meta 分析進一步確認：教練自身的動機品質也是關鍵變項（閉環：教練 BPN→選手 BPN→教練 BPN）。
      plain_text: 教練講話的方式，其實是在替動機這片土壤施肥還是施毒。施肥的講法：給選擇（你想先試哪個）、給理由（為什麼這樣做）、接納情緒、聽選手的意見。施毒的講法：命令（你必須這樣）、威脅、用條件綁（做到才給你下一步）。研究發現現行游泳教學其實普遍在壓制「自主」這個需求；而用條件綁、用壓力逼的方式，會更強地預測倦怠、甚至情緒低落。差別在哪？被命令的人，在教練面前做、教練不在就不做，也不會主動去探索感覺；有選擇權的人，才會主動停下來問「欸我剛剛手感不一樣，可以再試一次嗎」。
    misconception_refs:
    - cue: 不練就沒進步，說到做到才是認真教練
      why: 命令式語言（「你必須 / 沒得選 / 就這樣做」）屬控制行為，直接壓制自主需求，導致外在調節而非精熟動機——學員在教練面前做，不在時不做，感知探索窗口更窄。
      better: 把命令換成「你想先試哪一個？」或「做完這組，注意到手感有什麼不同？」——給理由與選擇，而非直接指定，同時保持技術清晰度。
    - cue: 做到我說的才給你上下一個動作
      why: 條件式獎勵（「達標才有下一步」）是受控動機的典型驅動，把動機外化到達標本身，讓學員把注意力放在「符合教練標準」而非「感知自己的身體」。
      better: 把進展框為「你注意到了什麼、身體說準備好了嗎」——以感知自評替代外部條件閘門。
    sources:
    - Conroy & Coatsworth 2007（Psychology of Sport and Exercise）
    - Minkels et al. 2023（Frontiers in Sports and Active Living）
    - Bartholomew et al. 2011（Journal of Sport and Exercise Psychology）
    - Vansteenkiste & Ryan 2013（Journal of Psychotherapy Integration）
    - Liu et al. 2025（International Journal of Sports Science & Coaching）
    source_ids:
    - src.conroy-coatsworth-2007-ascq
    - src.minkels-2023-dutch-swim-lessons
    - src.bartholomew-2011-need-thwarting
    - src.vansteenkiste-ryan-2013-need-frustration
    - src.liu-2025-bpn-coach-athlete-meta
  - id: psych.motivation.mastery_vs_performance_climate
    name_zh: 精熟氣候讓感知生長，表現氣候讓感知收縮
    nav_zh: 動機氣候
    order: 4
    status: complete
    phenomenon:
      certainty: 🟢
      text: 動機氣候（motivational climate，Ames 1992）建立在 Nicholls（1984）的成就目標理論之上——能力可以自我參照（任務導向）或他人參照（自我導向）——分兩種：精熟氣候（mastery/task-involving）強調個人進步、努力、學習與相互支持；表現氣候（performance/ego-involving）強調打敗他人、排名、才能評比。TARGET 六維度（任務多樣化、讓選手參與決策、認可所有人進步、合作分組、個人進步評估、允許足夠學習時間）是建構精熟氣候的操作工具。游泳直接實證： Moulds 等人（2023）比較 203 名澳洲青少年泳者（續留 99、已退出 104，8–18 歲）：教練創造的精熟氣候評分**直接區分退出 vs 持續**。 Moulds、Abbott 與 Cobley（2026）：游泳教練動機微氣候介入（混合方法評估）降低運動焦慮增幅、提升參與意願。Teixeira 等人（2020，n=799）：任務氣候→BPN 滿足+享受→意圖持續的序列中介。兩種氣候對感知探索的作用：精熟氣候把錯誤框為訊息（而非失敗），選手更願意停在不確定感覺中等待身體調整；表現氣候把錯誤解讀為能力不足，選手傾向重複有把握的感覺而非探索新感覺。
      plain_text: 一個練習環境會散發出兩種「氣候」。一種是精熟氣候：重點是你有沒有比上週進步、有沒有學到東西、大家互相幫忙。另一種是表現氣候：重點是排名、贏過誰、誰比較有天分。研究發現，教練營造的精熟氣候，直接決定了青少年泳者會留下還是退出。這兩種氣候對「感覺水」的影響很關鍵：精熟氣候把做錯當成一個訊息（喔，原來這樣不對），所以人願意停在「還不確定」的感覺裡，等身體慢慢調整；表現氣候把做錯當成「我能力不夠」，所以人傾向一直重複有把握的舊感覺，不敢去試新的。要長出細緻的水感，需要的正是前者那種敢探索的環境。
    misconception_refs:
    - cue: 公布成績排行榜讓大家看看誰最努力
      why: 公開排名是最典型的表現氣候操作（TARGET 中 Recognition 維度的反例）；在已有社會比較壓力的環境（競技訓練隊）更會把注意力從「自己感覺如何」拉向「排在第幾」，壓縮感知探索空間。
      better: 只公布個人縱向進步（本週 vs 上週），不橫向比較；認可「今天注意到了一個新感覺」而非只認可圈數或秒數。
    - cue: 看看旁邊的泳者怎麼做
      why: 把注意力引向他人表現是外部社會比較觸發，激活自我導向評估，把感知資源從內感受拉走；對低勝任感學員傷害尤甚。
      better: 改「注意你自己的手在水裡感覺到什麼」——感知目標語言天然是精熟氣候工具。
    sources:
    - Nicholls 1984（Psychological Review）
    - Ames 1992（Journal of Educational Psychology）
    - Moulds et al. 2023（International Journal of Sports Science & Coaching）
    - Moulds, Abbott & Cobley 2026（Frontiers in Psychology）
    - Teixeira et al. 2020（European Journal of Sport Science）
    source_ids:
    - src.nicholls-1984-achievement-motivation
    - src.ames-1992-classroom-goal-structures
    - src.moulds-2023-climate-dropout
    - src.moulds-2026-micro-climate-intervention
    - src.teixeira-2020-persistent-swimmers
  - id: psych.motivation.amotivation_trap
    name_zh: 無動機時，感知學習事實上停擺
    nav_zh: 無動機陷阱
    order: 5
    status: complete
    phenomenon:
      certainty: 🔵
      text: 當選手進入 amotivation 狀態（行為完全外在驅動、無自主意志），感知學習事實上不可能發生。原因：感知學習（尤其 L4–L6 的精細感知）需要「主動注意力投入」——選手必須自願把意識資源放在身體感覺上。Pelletier et al. (2001) 直接確認無動機是泳者退出的最強負向預測因子；但從 amotivation→感知中斷的神經機制是跨領域推導：注意力資源理論（Kahneman）、運動學習中的意向效果（ideomotor effect）與 SDT 合併推導——amotivation 的外部驅動狀態使自我監控動機缺席，感知探索頻寬歸零。動機介入因此是感知教學的前置條件，而非附加項。
      plain_text: 當一個人完全是被外力推著動、心裡毫無想做的意願（這狀態叫「無動機」），感知學習其實是停擺的。道理很簡單：要感覺到水裡細微的東西，你得自願把注意力放到身體的感覺上——這件事沒辦法被逼出來。有研究確認「無動機」是泳者退出最強的預兆；至於從無動機到「感覺不到水」之間的神經機制，目前還是跨領域的推論，不是泳池裡直接量到的。但方向很清楚：動機不是技術教學之外的加分題，它是能不能開始感知的前置條件。這裡有個容易踩的坑：無動機的人在最初幾級還是能把動作「做完」，看起來學得還行，其實裡面什麼都沒感覺到，很容易被誤判成「學得不錯」。
    hardware_boundary:
      certainty: 🔵
      text: 「amotivation 直接測量到感知探索頻寬」目前無游泳直接量測（研究空白 🔴05），此處是 SDT 縱向實證（退出預測）加上注意力理論的跨領域推導，標記 🔵 不冒充直接實驗證據。
    l_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 影響全 L 範圍，但在 L4–L6 最關鍵——精細感知需要主動注意力；L0–L2 的動作形式模仿在 amotivation 下還可維持表面完成，因此容易被教練誤判為「學得還好」。
    sources:
    - Pelletier et al. 2001（Motivation and Emotion）
    source_ids:
    - src.pelletier-2001-swimmer-persistence
  - id: psych.motivation.competence_moderator
    name_zh: 勝任感低的學員對表現氣候最脆弱
    nav_zh: 勝任調節
    order: 6
    status: complete
    phenomenon:
      certainty: 🟢
      text: 表現氣候（ego-involving climate）對選手的傷害程度受主觀勝任感調節：勝任感高時尚能承受社會比較壓力，勝任感低時傷害最大。游泳直接實證：Wineinger、Fry、Long 與 Brown（2025）調查 566 名美國 Masters 泳者（平均 54.82 歲）：自我氣候×低主觀勝任感→對承諾意願產生強烈負向交互效果。低知覺勝任感是所有初學族群的共同起點：兒童初學、成人初學、長期停游後回訓者。因此表現氣候對這幾群的課堂設計傷害最大；競技族群（青少年/兒童競技）勝任感較高， ego 氣候的主要傷害點不在承諾退出，而在壓縮再探索空間（見概念 4）。
      plain_text: 表現氣候（比排名、比輸贏）會傷人，但傷得多重，要看一個人此刻的「勝任感」高不高。勝任感高的人還扛得住社會比較的壓力；勝任感低的人，傷害最大。問題是：幾乎所有初學者——不管是小孩、大人、還是停游很久回來的——起點都是低勝任感。所以對這些人，比排名、搞競爭的氣候傷害最深，最快讓他們乾脆放棄或表面敷衍。常聽到一句「競爭能激發孩子的鬥志」——對已經有點底子的選手或許成立，但對剛起步、勝任感還很低的人，競爭只會正面撞上這個脆弱點。比較安全的順序是：先讓他感覺得到自己在進步，再考慮要不要加競爭，而且最好是跟自己上週比，不是跟別人比。
    population_note: 全族群光譜注意事項：勝任感調節效果不限於成人——兒童初學同樣低勝任感、同樣脆弱；競技青少年勝任感相對高但並非免疫，尤其在技術停滯期（plateau）時脆弱度上升；鐵人三項泳者的游泳段勝任感幾乎接近初學者水位，文獻無第一手 ego 氣候傷害量化（素材缺口）； Masters 泳者研究提供了最直接的成人非競技族群數據。
    misconception_refs:
    - cue: 競爭能激發孩子的鬥志
      why: 對低勝任感學員（初學兒童或剛接觸感知學習的任何族群），競爭型刺激直接撞上勝任感調節效果，產生「自我氣候×低勝任感」的最負面交互，最快觸發退出或表面敷衍。「鬥志」在已有勝任感基礎的選手才適用。
      better: 先用精熟氣候建立可量化的個人勝任感基礎（能感覺到進步），再考慮是否引入適量競爭框架，且競爭對象是自己上週的感知記錄，而非他人。
    sources:
    - Wineinger et al. 2025（Frontiers in Psychology）
    source_ids:
    - src.wineinger-2025-masters-ego-climate
  - id: psych.motivation.climate_biology
    name_zh: 表現氣候不只傷動機，也傷身體
    nav_zh: 氣候傷身
    order: 7
    status: complete
    phenomenon:
      certainty: 🔵
      text: 精熟氣候 vs 表現氣候的差異不只是心理感受，也反映在生物指標上。跨運動外推實證： Hogue（2024）的實驗：56 名不會雜耍的男大學生隨機分配到 30 分鐘的關懷任務導向或自我導向教學情境，自我導向組顯示顯著高於基線的唾液 IL-6（發炎指標）＋威脅評估＋BPN 受阻；精熟氣候組對應更高需求滿足與正向情緒。 Hogue 等人（2025）的籃球罰球研究：關懷任務導向氣候在投籃生物力學、正向情緒、動機指標上均優於自我氣候；自我氣候組顯示心理社會壓力反應。這是首批以生物指標量化氣候傷害的實驗，從技術習得角度直接顯示精熟氣候促進動作學習。游泳專屬氣候生物指標尚無研究（研究空白 🔴03），以上均屬跨運動外推。
      plain_text: 兩種氣候的差別不只是心情問題，連身體的生理指標都測得到。在別的運動項目（雜耍、籃球罰球）的實驗裡，被放進「表現氣候」的人，唾液裡的發炎指標升高、把情境評估成威脅、基本需求被卡住；而「精熟氣候」組則對應更高的滿足感和正向情緒，連動作都學得更好。要先講清楚：這些是在別的運動測的、樣本也有限，還沒有游泳專屬的研究，所以是「方向上的提示」而不是游泳的定論。但它至少告訴我們：一個老是比排名、施壓的環境，傷的可能不只是心情，還包括人實際的學習和恢復。
    hardware_boundary:
      certainty: 🔵
      text: IL-6 是急性期發炎標記，在 30 分鐘短期技能任務中的升高幅度能否外推至游泳長期訓練場景尚未驗證。樣本限男性大學生，對兒童、競技青少年、成人初學、鐵人三項、Masters 族群的生物指標效應均屬外推，不可直接套用數字。方向性結論（表現氣候→壓力反應→技術習得下降）的跨項目一致性目前有兩個不同技能任務（雜耍、籃球）支持，仍需游泳情境複製。
    sources:
    - Hogue 2024（Journal of Sport and Exercise Psychology）
    - Hogue et al. 2025（Frontiers in Psychology）
    source_ids:
    - src.hogue-2024-ego-climate-inflammation
    - src.hogue-2025-caring-climate-freethrow
  - id: psych.motivation.hmiem_bottomup
    name_zh: 一次感知成功可以由下而上修復對游泳的整體態度
    nav_zh: 由下而上
    order: 8
    status: complete
    phenomenon:
      certainty: 🔵
      text: Vallerand（1997）的動機層級模型（HMIEM）把動機分為三層：整體層（跨情境的人格性動機，如「我是不是運動型的人」）、情境層（對游泳這項活動的穩定動機傾向）、狀態層（單次訓練當下的動機）。三層具有雙向影響：上層下行影響（整體→情境→狀態）與下層上行修復（狀態體驗→情境態度→整體自我認定）。「先給一次可以做到的感知成功」走的是 bottom-up 動機修復路徑：單次的成功感知體驗（狀態層：「我今天真的感覺到水托住我了」）若反覆累積，可由下而上修復對游泳的情境層動機，甚至鬆動「我不是水裡的料」的整體層自我認定。此推導在 HMIEM 架構內邏輯一致，但「修復時間軸/次數」無游泳量化研究（🔵 推導）。對成人初學（整體層常已固化負向自我認定）與長期恐水者尤其關鍵。
      plain_text: 動機可以分三層：最表層是「今天這一趟想不想練」（當下的狀態），中間是「我對游泳這件事的整體態度」，最深是「我是不是水裡的料」這種對自己的認定。這三層會互相影響，而且不只是由上往下，也能由下往上修：一次真實的「我今天真的感覺到水把我托起來了」，若反覆累積，能從最表層慢慢往上修，甚至鬆動「我天生不適合游泳」那個最深的自我認定。這對成人初學和怕水很久的人特別重要——他們那層「我不是這塊料」通常已經很硬，光用嘴巴鼓勵沒什麼用，要給的是一次他自己能驗證的、真實的感知成功。（這條路徑邏輯上一致，但要修多久、要幾次成功才夠，游泳裡還沒量化研究。）
    hardware_boundary:
      certainty: 🔵
      text: HMIEM 三層架構的跨領域影響效應已有跨運動研究支持，但 bottom-up 修復速度、所需的成功體驗「劑量」（幾次？密度多高？）在游泳感知情境無直接量化，口頭鼓勵 vs 真實感知成功對情境層影響的差異也尚未在游泳中實驗對比。
    l_levels:
    - L0
    - L1
    - L2
    l_note: bottom-up 修復的槓桿點在 L0–L2：初學期的狀態層成功體驗決定情境層是否轉正。 L3 以後感知技能已建立，整體層自我認定的改變較已固化初學者容易。
    population_note: 全族群均有效，但操作槓桿不同：成人初學與長期恐水者的整體層負向自我認定最強， bottom-up 路徑是主要介入點（口頭說服效果有限）；兒童初學整體層尚未固化，狀態層體驗直接塑造情境層；競技青少年的整體層通常已正向，bottom-up 修復主要針對技術停滯期的情境層動機下滑；鐵人三項泳者多數游泳情境層負向（「最弱的一段」），成功的開放水域感知體驗是情境層修復的最有力路徑（🔵）。
    sources:
    - Vallerand 1997（Advances in Experimental Social Psychology）
    source_ids:
    - src.vallerand-1997-hmiem
  - id: psych.motivation.population_engines
    name_zh: 不同族群的動機引擎和崩潰點完全不同
    nav_zh: 族群引擎
    order: 9
    status: complete
    phenomenon:
      certainty: 🟠
      source_ids:
      - src.difernand-2025-french-swimmer-dropout
      - src.monteiro-2017-swimming-dropout-review
      observation_basis: 這是一個**混合區塊**：青少年競技那一段有文獻（兩則已於 2026-09-04 補登錄並核對），其餘三個族群的動機引擎與崩潰點是本專案整合教學實務的判讀，觀察者是本專案作者。外推邊界：① 退出年齡與退出率來自法國單一國家的註冊資料，泳會制度不同的地區不可直接套用，且存活分析描述相關不描述因果——「表現差導致退出」與「準備退出所以不再進步」在該資料中無法分離； ② 兒童的「樂趣優先」是 autonomy-support 研究的默認族群，這代表該結論在兒童身上證據最強，不代表它在成人身上不成立，只是沒被測過；③ 成人初學與鐵人三項兩段**沒有第一手研究**（🔴08），是本專案從教學現場歸納的，應讀成待驗證的假說而非文獻結論。
      text: 動機介入不能一套打全場。現有文獻按族群顯示不同的動機結構：兒童初學與兒童競技：樂趣優先（fun primacy）＋父母參與是最強動力；樂趣被表現壓力取代即快速流失（文獻默認族群，autonomy-support 研究主要在此族群）。青少年競技：從外在/內攝向內化動機逐步轉移（HMIEM）；參與在 ~11 歲前後達峰後遞減，機制=享受↓、功能性承諾↓、運動貶值↑，退出存活分析（Difernand 等人 2025，法國註冊泳者 n=160,861）顯示女孩 13.16 歲、男孩 17.50 歲為退出峰值；表現最差的後 10% 群體退出率，女性由 13 歲的 78.1% 升到 17 歲的 91.7%，男性同期為 69.3% 升到 83.4% （2026-09-04 更正原文「78–91%」——那是女性數值，原文未標性別）。游泳退出的系統回顧（Monteiro 等人 2017，僅完整回顧 6 篇、檢索止於 2015）列出的退出主因是與教練衝突、有其他事要做、勝任感未見進步、來自父母或教練的壓力、缺乏樂趣、感到無聊（2026-09-04 更正原文「自主支持的訓練情境比訓練量更能預測續留」——該回顧沒有做這個比較，是歸因錯誤，見錯誤 32）。成人初學：目標導向（健康、克服恐懼、社交、陪小孩）＋自我參照勝任感脆弱；「學不夠快」的挫敗＋社會評價威脅是主要崩潰點；與恐懼主題（cluster 03）的成人恐懼簽名高度耦合。鐵人三項：游泳是手段而非目的，動機是「不要在游泳段崩掉」的工具性投入；開放水域 panic 打斷整場比賽信心是最主要崩潰點；鐵人三項游泳動機結構幾無第一手研究（🔴08）。
      plain_text: 動機這件事不能一套打全場，不同族群的引擎和崩潰點完全不一樣。小孩（不管初學還是競技）：樂趣是最強的動力，旁邊還有父母的參與；一旦樂趣被表現壓力取代，流失得很快。青少年競技：動機慢慢從「外在」轉向「自己內化」，但青春期前後是一道退出懸崖，表現越差的越容易在這段流失。成人初學：動力來自具體目標（健康、克服恐懼、陪小孩），但勝任感很脆弱，最容易被「學不夠快」的挫敗和「這年紀還不會」的社會眼光打垮——這跟恐懼那一章高度相扣。鐵人三項：游泳只是工具不是目的，動機是「不要在游泳段崩掉」，開放水域一旦恐慌，就毀掉整場比賽的信心。重點是：針對某一群設計的動機語言，不能直接套到另一群身上。（各族群的研究量差很多：兒童和青少年競技資料最多，成人初學和鐵人三項其實是缺口。）
    population_note: 框架紀律：文獻嚴重偏壓兒童泳課與青少年競技隊，成人初學與鐵人三項是素材缺口，不以兒童或競技文獻外推填空。上表各族群的崩潰點機制以平行並列而非統一模型呈現；任何針對某一族群的介入設計不可直接套到其他族群。退出峰值百分比數字（女 ~64% / 男 ~45%）來源為 🟠 待核原始文獻，不作精確引用。
    misconception_refs:
    - cue: 用青少年競技隊的成就目標框架直接教成人初學或鐵人三項
      why: 族群混淆——青少年競技的社會比較框架（「打贏隊友」「縮短秒數」）撞上成人初學的低勝任感脆弱性或鐵人三項的工具性動機結構，產生前述最負向的氣候×勝任感交互效果。
      better: 成人初學優先個人進步里程碑；鐵人三項優先開放水域情境熟悉度的可控感。各族群的動機語言（「你比上週進步了」vs「游泳段你可以掌控了」）需要分別設計。
    sources:
    - Difernand et al. 2025（法國泳者退出存活分析）
    - Monteiro et al. 2017（游泳退出系統性回顧）
    source_ids:
    - src.difernand-2025-french-swimmer-dropout
    - src.monteiro-2017-swimming-dropout-review
- id: psych.imagery
  name_zh: 意象與心理演練
  nav_zh: 意象
  when_zh: 想用想像在岸上補練、強化動作記憶時
  order: 4
  status: complete
  band: 貫穿全程
  l_band: L0–L6
  level_tag: 全程
  concept_count: 6
  lead_zh: 前一章講動機讓人願意一直回到水裡。但有件事很多人不知道：練習不一定非得在水裡——在腦中「想像」游泳的感覺，對大腦來說幾乎等於真的練了一次。這不是心靈雞湯：當你在腦中走一遍划手、感覺水壓，大腦啟動的神經通路，和你真正下水時幾乎是同一套。這一章講怎麼用「意象」這個工具：把還抓不住的感覺先在岸上、在腦中排練好，從初學的呼吸吐氣，到競技的整場戰術，都用得上。
  bridge_zh: 意象幫你在腦中預先排練感覺。但真正下水的那一刻，還有一個關鍵變數：你把注意力放在哪裡。下一章講一件反直覺的事——盯著「手該怎麼動」反而會卡住，把注意力放到「水被推開」才會順。
  premise:
    layer: public
    certainty: 🟢
    evidence_from:
    - psych.imagery.functional_equivalence
    - psych.imagery.kinesthetic_priority
    - psych.imagery.functional_types
    one_line: 在腦中預演一個水感，會活化和真正執行幾乎相同的神經通路——意象不是「想像放鬆」，而是把還抓不住的感覺先在離線狀態排練好，從初學的呼吸到競技的整場戰術都用得上。
  concepts:
  - id: psych.imagery.functional_equivalence
    name_zh: 意象在神經層等同於真實動作
    nav_zh: 功能等同
    order: 1
    status: complete
    phenomenon:
      certainty: 🟡
      text: 運動意象與實際執行動作共享相同的神經表徵——意象是在「無運動輸出」的狀態下，啟動同一套動作規劃、意圖與神經迴路。這意味著意象不只是「想像」，而是一種真實的神經預演：大腦用意象「走一遍」動作，對應的感知預測與運動迴路同時被激活。2025 年以 fNIRS 測量足球員的研究進一步發現：專家在想象簡單動作時皮質激活效率更高；想象複雜感知技能（如水感）時激活更深層。這提示高水平泳者對水感的意象效果可能比初學者更精確，而非更省力。
      plain_text: 在腦中想像一個動作，跟真的做這個動作，用的是大腦同一套線路。差別只在意象時沒有真的把肌肉動出來，但動作的規劃、意圖、對感覺的預期，在腦中全都被啟動了。所以「想像」不是空想——它是一種真實的神經預演，大腦等於用想的「走了一遍」這個動作。有研究還發現，程度越高的運動員，想像複雜技能時大腦啟動得越深、越精準，意思是高手的意象效果可能更準，不是更省力。要補一句：這套「同一條線路」是在很多運動上驗證的通則，游泳的「水感」是不是同樣能被想像激活，目前還是研究空白。
    hardware_boundary:
      certainty: 🟢
      text: 意象不只激活運動皮質，還誘發運動網絡的可塑性變化，並調節脊髓層面的突觸活動——這是意象能促進真實動作改善的神經基礎（PMC7063062）。注意：「功能等價」是跨運動領域的通用發現，游泳情境下「水感神經表徵是否同樣被意象激活」仍是研究空白，外推時需標明。
    l_levels:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 貫穿全程：L0–L2 用意象預建入水、呼吸、漂浮的感知腳本；L3–L4 用意象強化手掌/前臂水壓的感知地圖； L5–L6 用意象整合全身場感知。每個 L 級的意象效果受當前技能水平決定，初學者意象精準度低但仍有益。
    sources:
    - Research/心理/05_意象與心理演練.md#1-功能等價functional-equivalence
    source_ids:
    - src.research-psych-05-a
  - id: psych.imagery.pettlep
    name_zh: 意象越像真實情境，效果越強
    nav_zh: PETTLEP
    order: 2
    status: complete
    phenomenon:
      certainty: 🟡
      text: Holmes & Collins（2001）基於功能等價理論提出 PETTLEP 七原則，核心邏輯是：意象情境越接近實際執行，神經激活的重疊度越高，訓練效果越佳。七個元素分別是 Physical（姿勢）、Environment（環境細節）、 Task（肌肉張力與感知細節）、Timing（實際速度而非慢動作）、Learning（隨技能進步更新內容）、 Emotion（競技時的情緒喚醒）、Perspective（視角）。2022 年 20 年回顧已整合動作觀察的新方向； 2025 年日本大學生運動員研究（n≈800）實證 PETTLEP 多維結構，發現 Timing 可細分，視角（第一/第三人稱）為獨立維度。
      plain_text: 意象不是隨便閉眼想想就好——越逼真，效果越強。有個叫 PETTLEP 的架構，把「逼真」拆成七個要點：擺出真正的划水姿勢（別只是坐著想）、喚起泳池的氣味水聲畫面、在腦中明確包含手掌壓水的感覺、用真實的划水節奏（不要慢動作）、隨技術進步更新想像的內容、比賽前加入競技情緒、選對視角。背後的道理是：想像的情境越接近真的在游，大腦啟動的線路重疊越多，練習效果就越好。所以與其模糊地「想一下游泳」，不如照這七點，把想像做得跟真的下水一樣具體。
    intervention_refs:
    - name: PETTLEP 結構化游泳意象腳本
      certainty: 🟢
      how_to: P：穿泳衣、採取划水姿勢（手臂在水線位置）進行意象，而非隨意坐著想； E：重現泳池氣味、水聲、視覺，閉眼喚起場景細節； T：在意象中明確包含「手掌感受到的水壓、前臂流動感、肌肉張力」——這是水感的神經表徵層； T（Timing）：按實際划水節奏，不用慢動作； L：隨著技術精進，更新意象腳本（L2 漂浮感知 → L3 手感 → L4 前臂壓力梯度）； E（Emotion）：比賽前加入競技情緒； P（Perspective）：動覺意象以第一人稱（感受自己動）為主，技術分析時輔以第三人稱（觀察姿勢）。
    - name: VR 輔助 PETTLEP 意象（游泳）
      certainty: 🟢
      how_to: 2025 年 RCT（PMC12229036）顯示，VR 結合 PETTLEP 結構化意象在划臂距離、心率、RPE 等指標均優於傳統訓練。若具備條件，VR 可強化 E（環境）與 T（任務感知）元素的保真度。
    population_note: PETTLEP 的 L（Learning）元素是全光譜適用的關鍵：兒童初學的意象內容應保持簡單（入水、吐氣氣泡）；青少年競技與鐵人三項可加入戰術與競技情緒層；成人初學若有水中焦慮，P 元素（姿勢）需謹慎，避免在過度緊張狀態下進行高仿真意象反而強化焦慮記憶。現有 PETTLEP 研究以大學生競技運動員為主，兒童與成人初學適用方式屬素材缺口，不以競技樣本直接外推。
    sources:
    - Research/心理/05_意象與心理演練.md#2-pettlep-意象模型
    source_ids:
    - src.research-psych-05-b
  - id: psych.imagery.kinesthetic_priority
    name_zh: 想「感覺」比想「畫面」更能強化水感
    nav_zh: 動覺優先
    order: 3
    status: complete
    phenomenon:
      certainty: 🟡
      text: '意象可依視角分為：內部視覺意象（第一人稱，看見自己動作）、外部視覺意象（第三人稱，旁觀自己）、動覺意象（感受動作的觸感、阻力、肌肉張力）。Spittle & Morris（2007, PMID: 17566428）發現，感知主導的任務（需即時感知環境回饋的開放技能）偏向內部視角；形式主導的封閉技能偏向外部視角。游泳是封閉技能，但「感知水的阻力、壓力分佈、前臂角度」使其具備高度感知主導的成分，因此動覺意象（KI）與內部視角的組合是強化水感的核心路徑。 2025 年多巴胺研究（n=42，DOI: 10.1007/s00426-025-02225-x）顯示，多巴胺能下降選擇性損害內部視覺意象，而本體感覺準確度保持穩定——提示動覺/本體感覺與視覺意象涉及部分獨立的神經通路，強化了「水感訓練需要動覺意象，而非只靠視覺想象」的理論根據。'
      plain_text: 想像可以分兩種：一種是「看」——看到自己游泳的畫面；另一種是「感覺」——感受手掌的阻力、前臂的水壓、肌肉的張力。要強化水感，關鍵是後者（用感覺去想），不是前者。因為水感本來就是一種「感覺」，光在腦中看自己游泳的樣子，提供的只是動作的外形資訊，不會啟動感覺水的那條通路。所以常見的「多看高手影片、多想幾遍就會了」其實有限——影片看完，要閉上眼睛，去想像手掌入水那個阻力的感覺，而不是想像自己「看起來」是什麼樣子。
    hardware_boundary:
      certainty: 🔵
      text: 動覺意象＋內視角在游泳水感訓練中效果最強的主張是跨領域外推（來自開放/封閉技能視角研究與多巴胺機制研究），游泳專屬的「動覺意象改善手掌/前臂水壓感知」直接 RCT 目前尚無，是 Vortex 框架最高優先的原創研究方向。
    misconception_refs:
    - cue: 看優秀泳者的影片多想幾遍就能學到技術
      why: 純視覺意象（第三人稱）對「感知環境」類技能效果有限；水感需要的是手掌/前臂的阻力感知模擬，影片觀看只提供形式資訊，不激活動覺通路。
      better: 以影片為輔助工具確認外部形式後，切換到閉眼動覺意象：想像手掌入水的阻力感、前臂的水壓，而非想像自己「看起來」的樣子。
    population_note: 兒童的動覺意象能力（vividness）低於成人，且隨年齡發展；對年幼兒童（6 歲以下）不宜以複雜動覺意象為主，宜以簡單感知描述（吹氣泡、腳踢水）帶領。青少年競技與成人初學的動覺意象能力差異明顯，前者受訓年限長、意象能力通常較強；成人初學若缺乏相關感知基礎，動覺意象內容需從最粗粒度開始建立（如「手放進水裡，感受水的溫度與阻力」）。鐵人三項有游泳基礎，可直接進入細粒度動覺意象訓練。現有量表（VMIQ-2 / MIQ-RS）均為跨運動通用版，游泳專屬動覺意象量測仍是研究空白。
    sources:
    - Research/心理/05_意象與心理演練.md#4-內部視角-vs-外部視角internal--external-imagery-perspective
    - Research/心理/05_意象與心理演練.md#c-動覺意象-vs-視覺意象的分離效應
    source_ids:
    - src.research-psych-05-d
    - src.research-psych-05-g
  - id: psych.imagery.feedforward_calibration
    name_zh: 意象是乾地上校準水感地圖的工具
    nav_zh: 前饋校準
    order: 4
    status: complete
    phenomenon:
      certainty: 🟢
      text: 'Kilteni 等（2018, PMID: 29691389）的 Nature Communications 研究直接證明：運動意象涉及「預測動作的感知後果」——大腦的前向模型（forward model）在意象中被調用，預測「如果這樣動，感覺會是什麼」。關鍵發現是：想象的自我觸碰會產生與真實觸碰相同的觸覺衰減效應，遵循相同的時空原則。這意味著意象不只是「回放記憶」，而是主動預測感知後果——每一次動覺意象循環都在校準前向模型的「期望感知 vs 實際感知」差距。 2025 年 Frontiers Physiology RCT（n=57 精英游泳者，PMC12433939）進一步在游泳情境直接驗證：閉眼＋運動意象組的腰椎本體感覺準確度顯著優於純技術組，是目前已知在游泳者身上驗證「意象強化本體感覺精準度」的高品質 RCT。'
      plain_text: 動覺想像不只是「回放」一段記憶，它其實在做一件更主動的事：預測「如果這樣動，感覺會是什麼」。大腦裡有個像預測引擎的東西，每想像一次，就在校準「我以為會有的感覺」和「真實的感覺」之間的差距。有一份找精英泳者做的高品質研究發現：閉眼加上動作想像的那組，身體位置的本體感覺準確度，明顯比只練技術的那組好。這就是為什麼有些人「下水前先在腦中想一遍，反而比較快找到感覺」——他是在乾地上，先把水感的地圖校準好了。（不過「想像能不能直接提升手掌的水壓感知」還沒被直接測過，是 Vortex 想研究的方向。）
    hardware_boundary:
      certainty: 🔵
      text: 「動覺意象改善手掌/前臂水壓感知（feel for water）」仍是研究空白——目前游泳研究以腰椎本體感覺、整體技術質量、成績為依變數，尚無研究直接以「手掌水壓感知分辨能力」為因變數。 Feedforward 校準連結水感的完整因果鏈屬 Vortex 框架原創推導，待游泳專屬實驗確認。
    l_levels:
    - L2
    - L3
    - L4
    - L5
    l_note: L2–L3：意象可預先建立「手掌入水時應感受到的阻力」感知腳本，縮短下水後感知地圖建立的時間； L4–L5：意象可精煉前臂壓力梯度、流場感知的細粒度預測，強化高水平感知判斷。
    sources:
    - Research/心理/05_意象與心理演練.md#5-運動意象與-feedforward-預測模型的關係
    - Research/心理/05_意象與心理演練.md#a-動覺意象能否預先建立或強化水感
    source_ids:
    - src.research-psych-05-e
    - src.research-psych-05-f
  - id: psych.imagery.functional_types
    name_zh: 意象腳本有目的之分，不能只演練技術
    nav_zh: 意象類型
    order: 5
    status: complete
    phenomenon:
      certainty: 🟡
      text: 'Paivio（1985）與 Hall 等（1998, SIQ）把運動意象的功能分為五類： CS（Cognitive Specific，技能演練）、CG（Cognitive General，策略/戰術）、 MS（Motivational Specific，目標設定）、MG-A（Motivational General-Arousal，情緒與喚醒調節）、 MG-M（Motivational General-Mastery，自信與心理掌控）。在 Vortex 框架中，「演練手掌入水時感知到的壓力與角度」屬 CS 類，直接針對感知技能；「建立對水的信任感與自信」屬 MG-M 類，對恐懼者或長期技術卡關的泳者尤其重要。 2025 年多層次 meta 分析（86 研究 3593 名運動員，PMID: 40426460）發現，意象與 1–2 種其他心理技巧（如放鬆技術）合用效果最佳；單純 CS 意象效果量為中等（d≈0.43）。'
      plain_text: 想像不是只有一種用途。它至少有幾種不同的目的：演練技術細節（手掌怎麼壓水）、演練戰術、設定目標、調節情緒和緊張、建立「我做得到」的掌控感。常見的做法是每次都只想「游一趟、把技術走一遍」——但這會漏掉情緒和信心這一層。舉例：一個怕水或長期卡關的人，他需要的可能不是再演練一次技術，而是先在腦中建立「我能做到、我是安全的」那種掌控感，有了這個地基，技術演練才有效。所以該想什麼，要看當下缺什麼：下水前焦慮就先想放鬆、技術卡關就想感知細節、信心低落就想掌控場景。
    misconception_refs:
    - cue: 每次意象都想游一趟，把技術演練一遍就好
      why: 只做 CS 類意象會遺漏動機與情緒層面；若泳者面對恐懼或自信缺口， MG-M 類（掌控感意象）反而是優先項——先建立「我能做到」的感知，才能有效進行技術演練。
      better: 依當前需求選擇意象類型：下水前有焦慮 → MG-A（放鬆/喚醒調節）先行；技術卡關 → CS（感知細節演練）；長期信心低落 → MG-M（掌控感場景）。
    population_note: CS 類意象（技能演練）需要足夠的感知基礎，對尚未建立 L2 以下感知的兒童初學者或恐懼者， CS 意象內容可能空洞或反效果（強化恐慌記憶）；應先以 MG-M（安全、掌控）類意象建立情緒基礎。青少年競技與鐵人三項以 CS + CG（戰術）為主；成人初學若有社會評價焦慮，MG-M 類意象（「我游得到」）的優先度高於技術演練。現有功能分類研究以競技運動員為主，兒童與恐懼族群的分類效度是素材缺口。
    sources:
    - Research/心理/05_意象與心理演練.md#3-意象的功能分類paivio-1985--hall-et-al-1998
    source_ids:
    - src.research-psych-05-c
  - id: psych.imagery.off_water_maintenance
    name_zh: 離水時，意象能減緩水感退化
    nav_zh: 離水維持
    order: 6
    status: complete
    phenomenon:
      certainty: 🟢
      text: 'Driediger、Hall & Callow（2006, PMID: 16368636）針對受傷運動員的質性研究發現，運動員在無法練習時主動使用動覺意象「保住」動作感覺，明確意圖是防止技術退化。這與功能等價理論一致：即便沒有真實的身體動作，意象仍在維持運動神經表徵的激活程度。對游泳而言，受傷停水、旅行無法下水、季外訓練低谷期，動覺意象是維持水感神經表徵的可用工具，優先於「等回去再練」。'
      plain_text: 受傷不能下水、出差碰不到泳池、或季節休息期——這些離水的日子，意象是「保住水感」的工具。有研究發現，受傷的運動員會主動在腦中想像動作的感覺，目的就是不讓技術退化；因為就算身體沒真的動，想像仍在維持那套神經線路的活躍。對游泳來說，與其想著「等回去再說」，不如在離水期間每天花十幾分鐘，照前面 PETTLEP 那套，具體想像手掌壓水、踢水節律的感覺，回到水裡前再加做一組，能縮短重新找回水感的時間。（能維持多久、退化慢多少，游泳裡還沒精確量過，但方向是成立的。）
    hardware_boundary:
      certainty: 🔵
      text: 意象能「維持」水感神經表徵的假設合理，但「維持多久、退化速率降低多少」在游泳情境缺乏直接量測。 Driediger 研究對象為一般競技運動員（非游泳專屬），外推至「手掌水壓感知的保留」需謹慎。停訓期意象的最佳頻率與結構（PETTLEP 標準適用性）同屬研究空白。
    intervention_refs:
    - name: 停訓期動覺意象維持方案
      certainty: 🔵
      how_to: 每日 10–15 分鐘，依 PETTLEP 原則進行：穿上泳衣或採取划水姿勢（P），重現泳池環境細節（E），明確想象手掌壓水、前臂承壓、踢水節律的感知細節（T），按實際游速進行（T-timing），包含回到水中的情緒期待（E-emotion）。停訓結束後第一次下水前加做一組意象，縮短重新建立水感地圖的時間。
    population_note: 對競技青少年與鐵人三項在停賽/傷後期間最為實用，因為技術退化影響直接反映在成績。兒童初學的「水感」本體感覺地圖尚未鞏固，停訓後意象維持效果理論上低於已建立感知基礎的泳者；成人初學若剛開始建立感知，停訓期意象優先維持 MG-M 類（情緒安全感），而非複雜動覺細節。意象維持方案對所有長期停水族群均有潛在效用，但目前文獻基礎來自受傷競技運動員，其他停水情境（旅行、季外、育兒中斷）的效果是素材缺口。
    sources:
    - Research/心理/05_意象與心理演練.md#視角與測量
    source_ids:
    - src.research-psych-05-h
- id: psych.attention
  name_zh: 注意力焦點
  nav_zh: 注意力
  when_zh: 一上場就分心、不知道該把注意力放哪時
  order: 5
  status: complete
  band: 進階競技端
  l_band: L3–L6
  level_tag: 進階·競技
  concept_count: 6
  lead_zh: 前面講了恐懼、動機、想像，這一章換一個很具體的問題：游的時候，注意力到底該放哪？很多人直覺以為「多想動作、盯緊每個細節」就會進步，但水裡的事情剛好相反——一旦把注意力鎖在「手該怎麼擺、手肘抬多高」，動作反而會變僵、變慢；把注意力放到「水有沒有被推開」，身體反而會自己把動作做順。這一章講的就是這個違反直覺的規律，以及它在「感覺水」這件事上會碰到的邊界。
  bridge_zh: 注意力放對地方，是讓動作順起來的外在條件；但人在水裡腦中其實還有另一個聲音——自己對自己說的話。下一章講這個內在的聲音：它怎麼幫你穩住，又怎麼反過來把你拖垮。
  premise:
    layer: public
    certainty: 🟢
    one_line: 把注意力放在「手要怎麼動」（內部焦點）反而會打斷自動化、壓低表現；放在「水被推開」（外部焦點）才讓動作流暢——感覺水的第三類焦點，是進階水感的注意力地基。
    evidence_from:
    - psych.attention.ef_if_definition
    - psych.attention.cah
    - psych.attention.water_sense_third_category
  concepts:
  - id: psych.attention.ef_if_definition
    name_zh: 注意力方向決定動作是受控還是自動
    nav_zh: 內外焦點
    order: 1
    status: complete
    phenomenon:
      certainty: 🟡
      text: 注意力焦點的方向分兩類。內部焦點（IF）：注意力指向身體部位或自身動作步驟，例如「抬高手肘」、「把手拉回來」。外部焦點（EF）：注意力指向動作對環境造成的效果或外在物件，例如「把水往後推」、「把手掌推向牆壁」。此分類由 Wulf & Prinz（2001）系統定義，核心主張是：將注意力指向動作「效果」而非動作「步驟」，可以增強學習與表現。
      plain_text: 注意力可以分兩種放法。一種是盯著自己的身體在做什麼——「手肘抬高」「把手拉回來」，這叫內部焦點。另一種是盯著動作對外面造成的效果——「把水往後推」「把手掌推向牆壁」，這叫外部焦點。研究的大方向是：把注意力放在「動作造成什麼效果」，通常比放在「身體該怎麼動」更容易學得好、游得順。
    misconception_refs:
    - cue: 感受你的手怎麼划
      why: 這是典型的內部焦點指令——把泳者注意力鎖在身體部位（手的動作），根據受限動作假說（CAH），這會干擾皮質下自動化迴路，使動作變得僵硬、不流暢。在有一定自動化基礎的泳者身上，此指令反而會使表現下降。
      better: 把注意力移向效果：「感覺水被你的手掌推往後方」——相同的動作但焦點落在水（外部），讓自動化機制自行處理手的路徑。
    - cue: 把手肘抬高
      why: 「把手肘抬高」是內部焦點指令，注意力鎖在關節位置，對已有自動化基礎的泳者可能干擾流暢度；對初學者的研究較少，此指令對尚未自動化者的效果尚不確定。
      better: 「讓你的指尖在最遠的地方感覺到水」——同時引導到正確動作形狀，且焦點更偏向感知效果而非關節位置。
    population_note: 多數 EF/IF 實驗以成人受試者為主，兒童泳者族群直接資料極少；初學者（兒童或成人）的自動化程度低，部分研究提示 proximal EF 或混合策略在初學階段可能比 distal EF 更適合，不應將精英/成人研究結論直接套用至兒童初學。鐵人三項、青少年競技、成人初學對此框架的反應差異均屬素材缺口，需分族群判斷。
    sources:
    - Wulf & Prinz 2001（Psychonomic Bulletin & Review）
    source_ids:
    - src.wulf-prinz-2001-directing-attention
  - id: psych.attention.cah
    name_zh: 內部焦點會綁架自動化，外部焦點讓動作自組
    nav_zh: 約束行動
    order: 2
    status: complete
    phenomenon:
      certainty: 🟡
      text: 受限動作假說（Constrained Action Hypothesis, CAH）的核心命題：採用內部焦點時，動作者對動作施加有意識的控制，干擾了皮質下自動化迴路，使動作「受限」（constrained）、變得更僵硬、耗能更高。採用外部焦點時，動作系統可利用自動化控制程序自然自組（self-organize），動作更流暢、更高效。實驗典型設計（動態平衡板任務）顯示，外部焦點組平衡誤差更小、雙重任務探針反應時間更短，代表自動化程度更高。游泳直接研究（Freudenheim et al., 2010）在中等程度游泳者身上複製此效果： EF 指令（「把水往後推」）組泳速顯著優於 IF 指令（「把手拉回來」）組。
      plain_text: 為什麼盯著身體反而不好？一個解釋是：當你刻意去控制每個動作，等於插手了身體本來已經自動化的流程，動作反而被「綁住」，變僵、變費力。把注意力交給外面的效果（水有沒有被推開），身體就能讓自動化機制自己把動作組織好。在中等程度的游泳者身上，喊「把水往後推」確實比喊「把手拉回來」游得快。不過要老實說：一篇 2024 年重新整理過往研究的大型統計回顧發現，「外部焦點一定比內部焦點好」這個強說法站不住——平均下來效果接近零，而且因人、因動作、因情境差很多。所以方向是對的（盯效果通常勝過盯身體），但不是鐵律。
    hardware_boundary:
      certainty: 🔵
      text: CAH 的神經機制主張（有意識控制干擾皮質下迴路）是理論推導，直接的游泳神經影像測量仍是研究空白。游泳任務（持續開放技能）與 CAH 核心實驗（離散平衡板任務）性質不完全可比，外推需謹慎。此外，McKay 等人（2024）的穩健貝葉斯元分析修正發表偏誤後，外部焦點優越性的平均效果量接近零，且各研究異質性極高——「EF 永遠優於 IF」的強版命題需要放棄；效果因人、因任務、因情境而異。
    l_levels:
    - L3
    - L4
    - L5
    - L6
    l_note: 自動化干擾效應在已建立一定自動化基礎的泳者（L3 以上）最相關； L0–L2 的初學者尚未自動化，IF 是否同樣有害尚無定論。
    misconception_refs:
    - cue: 游泳時多想動作才能進步
      why: 「多想」等同於強化內部焦點，在有自動化基礎的泳者身上反而會干擾自動化迴路，使動作更僵硬而非更精確。 Stoate & Wulf（2011）的精英游泳者研究顯示，IF 組泳速顯著慢於對照組。
      better: 讓注意力停在動作對水的效果上——「水是不是被你推走了」——而非停在身體部位；高技能者需要的是更好的感知回饋，不是更多的意識控制。
    population_note: 游泳直接研究（Freudenheim 2010、Stoate & Wulf 2011）受試者分別為「中等程度游泳者」與「精英游泳者」，兒童泳者、青少年競技、鐵人三項、成人初學均缺乏直接游泳 CAH 資料。兒童初學可能需要不同的焦點引導策略，不應以成人中等/精英資料外推。
    sources:
    - Wulf, McNevin & Shea 2001（平衡板實驗，CAH 出處）
    - Kal, van der Kamp & Houdijk 2013（自動化程度的完整檢驗）
    - Freudenheim et al. 2010（游泳直接證據）
    - Stoate & Wulf 2011（精英游泳者）
    - McKay et al. 2024（貝葉斯元分析，反向證據）
    source_ids:
    - src.wulf-mcnevin-shea-2001-automaticity
    - src.kal-2013-external-focus-automatization
    - src.freudenheim-2010-external-focus-swimming
    - src.stoate-wulf-2011-swimmers-focus
    - src.mckay-2024-reporting-bias-external-focus
  - id: psych.attention.elite_resilience
    name_zh: 精英泳者自動化強，但內部焦點仍有打擾力
    nav_zh: 精英韌性
    order: 3
    status: complete
    phenomenon:
      certainty: 🟡
      text: Stoate & Wulf（2011）研究精英游泳者（EF vs IF vs 控制組）發現： EF 組表現與控制組相同；IF 組泳速顯著慢於控制組。這說明精英者有強大的自動化保護機制，不需要外部焦點也能維持高水準——但內部焦點仍有足夠的打擾力使表現下降。另一項精英游泳者起跳動作研究（Maloney & Gorman, 2021）則顯示， EF 下動作事件序列提前（更好的自組織），但結果指標（相對峰功率、5m 時間）無顯著差異——彈性維持，結果持平但動作品質提升。
      plain_text: 程度越高的泳者自動化越穩，就算不特別用外部焦點也能游得好。但有趣的是：就算是精英，只要刻意去想身體動作，速度照樣會掉。也就是說，他們是「不需要想」，不是「想了也沒事」。另一個起跳的研究還發現，用外部焦點時動作的時序組織得更好，雖然最後成績沒明顯差別——品質先提升，結果持平。
    l_levels:
    - L5
    - L6
    l_note: 精英級（L5–L6）的泳者對注意力干擾有較高耐受度，即使 EF 效果不明顯，避開 IF 仍有意義。
    misconception_refs:
    - cue: 精英選手當然可以一邊想動作一邊游
      why: 實驗結果相反：即使是精英泳者，刻意採用 IF 仍會使泳速顯著下降；精英者的自動化程度讓他們不「需要」想，不代表「想了也沒事」。
      better: 精英者的訓練目標應是讓動作更不需要被意識到——教練反饋以感知效果為錨點，不以身體部位為錨點。
    population_note: 此主題直接游泳資料集中在精英成人或大學競技泳者；兒童競技、青少年競技的精英群體，以及鐵人三項選手，在 EF/IF 干擾敏感度上缺乏直接研究，不應直接套用精英成人的容忍度預設。
    sources:
    - Stoate & Wulf 2011（精英游泳者 EF/IF 對照）
    - Maloney & Gorman 2021（精英泳者起跳，彈性維持）
    source_ids:
    - src.stoate-wulf-2011-swimmers-focus
    - src.maloney-gorman-2021-skilled-swimmers-focus
  - id: psych.attention.distance_effect
    name_zh: 焦點越遠離身體，動作越自由
    nav_zh: 距離效應
    order: 4
    status: complete
    phenomenon:
      certainty: 🟡
      text: 外部焦點中，越遠離身體的焦點（distal EF）比越靠近身體的焦點（proximal EF）更有效。例子：注意靶心優於注意飛鏢路徑；注意終點線優於注意船的穩定性。機制：更遠的焦點使動作效果更易與身體動作本身區分，更清晰啟用「以效果為目標」的運動規劃；讓自動化系統有更多空間自組織，身體動作退為手段而非目的。 Zang 等人（2025）的系統性回顧與元分析整體支持此方向，但指出個人差異與技能水平調節此效果：高技能者從 distal 獲益更穩定；低技能者部分研究顯示 proximal EF 可能更合適（更近的回饋錨點）。
      plain_text: 在外部焦點裡，注意力放得「離身體越遠」往往越有效。像射飛鏢時盯靶心比盯飛鏢路徑準，划船時盯終點線比盯船身穩。道理是：焦點越遠，動作和效果越分得開，身體越有空間自己去組織。不過這主要來自陸上運動的研究——游泳是一片均勻的水，沒有靶心、終點線這種清楚的遠端目標，「把水往後推」算遠還算近都還有爭議，所以套到游泳上要保守看（這段是外推，不是游泳實測）。另外程度也有差：高手從「更遠的焦點」獲益較穩，初學者有時抓近一點的焦點反而更好上手。
    hardware_boundary:
      certainty: 🔵
      text: 游泳環境是均質水體，缺乏陸地運動研究的清晰外部目標（靶心、終點線、沙坑）；「把水往後推」算 distal 還是 proximal EF 本身就有爭議。游泳中距離效應的直接比較研究幾乎空白（🔴），現有結論來自非水中運動外推，游泳應用需以 🔵 謹慎對待。
    l_levels:
    - L3
    - L4
    - L5
    - L6
    l_note: 技能水平調節距離效應：L3–L4 初中階泳者可能從「中距離」外部焦點開始，高水準泳者（L5–L6）才穩定從 distal EF 獲益。
    misconception_refs:
    - cue: 專注在你的手感覺到什麼（跟水接觸的地方）
      why: 「手感覺到什麼」是 proximal 的感知焦點，按距離效應，對有自動化基礎的泳者效果不如將焦點移往水流路徑的更遠端；且「手的感覺」本身帶有 IF 傾向（感覺來自本體感覺系統）。
      better: 「感覺水流過你的整條手臂往後方流走」——焦點從手掌移往水流的遠端效果。
    population_note: 距離效應的游泳直接研究空白；陸地文獻受試者以成人為主。兒童初學焦點控制能力本身尚未成熟，「遠端焦點」可能超出其注意力掌控範圍；兒童族群的最適焦點距離應分開評估，不得從成人文獻外推。鐵人三項選手在開放水域可能需要利用真實的遠端地標（浮球、岸上目標）作為 distal EF 的物理錨點，這是有別於池泳的族群特異應用。
    sources:
    - Zang, Guo & Wang 2025（距離效應系統性回顧與元分析）
    source_ids:
    - src.zang-2025-focus-distance-meta
  - id: psych.attention.water_sense_third_category
    name_zh: 「感覺水」不是 IF 也不是 EF——水感是感知耦合
    nav_zh: 第三類焦點
    order: 5
    status: complete
    phenomenon:
      certainty: 🔵
      text: Wulf 的 EF/IF 二元框架在游泳「感覺水」的情境下面臨分類困難。支持「感覺水 = EF」：水是身體外的環境，感覺水的阻力與回饋是外部焦點指令（「推水」）執行時的自然感知後果，與意動原則相容。支持「感覺水 = 特殊 IF 或框架外」：水中感覺主要來自本體感覺與皮膚壓力受器，這是身體內部感知系統的輸出；Gottwald et al.（2020）提示當任務高度依賴本體感覺訊息時，與之相符的內部焦點表現反而可能最佳。生態動力學視角（Gottwald, Davies & Owen, 2023）則主張 EF/IF 二元框架本身在水感情境下不充分——任務是運動者與環境的感知耦合，而非注意力落點的二元選擇。本專案的理論定位：「感覺水」最接近一種第三類別——感知耦合（perceptual coupling），注意力的對象是身體與水的交界面，感覺本身就是動作調節的訊號，而非效果的「驗證」。這與 Wulf 框架不是矛盾，而是不同層次的描述： Wulf 描述指令語言如何影響短期表現；水感框架關注感知靈敏度的長期培育。
      plain_text: 「感覺水」這件事，其實塞不進「內部／外部」這個二分法。說它是外部焦點也行——水在身體外面；但你感覺水的方式，是靠本體感覺和皮膚壓力，這些訊號其實來自身體內部的感知系統。所以本專案把「感覺水」當成第三類：它不是在「驗證」動作有沒有效，而是感覺本身就在即時調整動作——注意力的對象是身體和水的那個交界面。這跟前面的內外焦點不是互相矛盾，而是在講不同層次的事：內外焦點談的是「一句指令怎麼影響當下這趟的表現」，水感談的是「長期把感知練得更靈敏」。（這個第三類定位目前還是推論，把「感覺水」當成獨立策略來測的實驗還沒人做。）
    hardware_boundary:
      certainty: 🟢
      text: Heath（2022）的民族誌研究顯示，競技游泳者將水質感知視為具身知識的核心，是「身體知識與技能動作共同產生的感知」，而非外加的注意力焦點指令。McKay 等人（2024）的貝葉斯元分析修正發表偏誤後外部焦點優越性效果接近零，支持「焦點效果因情境而異」的結論，也為「感覺水」作為特殊類別提供了理論空間。「感覺水作為獨立注意力策略的實驗研究」目前是研究空白（🔴）。
    l_levels:
    - L3
    - L4
    - L5
    - L6
    l_note: 感知耦合層次的水感訓練是 L3 以上的核心主題——在基礎自動化建立後，訓練感知靈敏度讓自動化系統有更豐富的輸入訊號可用。
    misconception_refs:
    - cue: 感覺水就是外部焦點，所以比想動作好
      why: 「感覺水 = EF」的推論會讓人誤以為只要「想著水」就自動符合 Wulf 框架的優越效果；但感覺水的注意力目標（本體感覺 + 皮膚壓力的交界感）和 Wulf 典型 EF （靶心、終點線等可視外部目標）在機制上有根本差異，不應混用。
      better: 不以 EF/IF 分類衡量「感覺水」的訓練價值；水感訓練的目標是提升感知靈敏度，使動作系統從更豐富的訊號中自組織——這是獨立的訓練軸線，不在 EF/IF 競爭框架內。
    - cue: 感覺水是 IF，所以會打斷自動化，不應該練
      why: 把「感覺水」歸類為 IF 後，直接套用 CAH 得出「不應練」的結論，跳過了「本體感覺主導型任務中 congruent IF 可能最優」的例外，也忽略了生態動力學框架對 EF/IF 二元分類本身的批評。
      better: 「感覺水」的訓練目標是建立感知系統的靈敏度，不是競爭 EF/IF 框架下的注意力位置；兩者目標層次不同，不應互相否定。
    population_note: Heath（2022）的研究對象為競技青少年游泳者——感知耦合框架的直接游泳資料主要來自此族群。兒童初學、鐵人三項、成人初學在「感知主導型水感培育」上均缺乏直接研究；生態動力學框架是理論外推，不同族群的感知耦合發展路徑可能有顯著差異。
    sources:
    - Gottwald et al. 2020（本體感覺相符時內部焦點最佳）
    - Gottwald, Davies & Owen 2023（生態動力學對 EF/IF 二元框架的批評）
    - Heath 2022（水質感知作為具身知識的民族誌）
    - McKay et al. 2024（貝葉斯元分析）
    source_ids:
    - src.gottwald-2020-internal-focus-congruent
    - src.gottwald-2023-two-sides-focus
    - src.heath-2022-quality-of-water
    - src.mckay-2024-reporting-bias-external-focus
  - id: psych.attention.association_dissociation
    name_zh: 長距離游泳：監測身體 vs 轉移注意力，各有用途
    nav_zh: 聯結與分離
    order: 6
    status: complete
    phenomenon:
      certainty: 🟡
      text: 耐力型運動中有另一條平行的注意力框架，與 Wulf 的 EF/IF 軸獨立。聯結策略（Association）：注意力集中在身體內部感覺——心跳、呼吸節奏、肌肉感覺、疼痛與疲勞訊號。分離策略（Dissociation）：注意力轉移到外在刺激或無關思緒，以抑制不適感覺（聽音樂、數呼吸、看場景等）。 Morgan & Pollock（1977）的經典研究顯示精英長跑者傾向聯結策略，業餘者傾向分離；但 Masters & Ogles（1998）20 年回顧指出兩者研究結果並不一致，方法論差異大。游泳直接研究（Couture, Jerome & Tihanyi, 1999）顯示休閒游泳者採聯結策略比控制組游得更快；另有研究提示長距離游泳中認知策略的「偏好適配程度」比策略類型本身更重要。
      plain_text: 長距離游泳還有另一條跟前面無關的注意力分法。一種叫「聯結」：注意力往身體內部放——心跳、呼吸、肌肉、累不累、痛不痛。另一種叫「分離」：把注意力移開，去聽音樂、數呼吸、看風景，藉此壓住不舒服的感覺。早期研究說精英長跑者偏聯結、業餘偏分離，但後來的回顧發現結果其實沒那麼一致。游泳這邊，休閒泳者用聯結策略反而游得比較快。比較實用的看法是：短距離或要顧技術時，把注意力錨在「技術感覺」（聯結的是技術，不是疼痛）；長距離撐到末段時，可以預先設好一個具體目標（數拍、計圈）來分離，繞開疲痛、讓配速繼續。
    l_levels:
    - L3
    - L4
    - L5
    - L6
    l_note: 聯結 vs 分離策略在長距離比賽中最相關（L3 以上，有基礎自動化後才有意義選擇策略）；短衝比賽技術維持多需聯結策略持續監測技術感覺；長距離高強度末段可借助分離策略繞開疲痛感，讓配速繼續。
    intervention_refs:
    - name: 技術聯結策略（短距衝刺 / 技術維持段）
      certainty: 🔵
      how_to: 設定「技術感覺錨點」（如每次換氣都回來確認水感），作為聯結的內容——聯結的不是疼痛訊號，而是技術感覺訊號。
    - name: 分離策略（長距離高強度末段）
      certainty: 🟡
      how_to: 預先設計分離的「目標」（節拍、計圈、場景）；不是「不想任何事」而是「把注意力帶到另一個具體目標」，避免分離策略反而讓注意力漂移。
    population_note: 聯結 vs 分離的游泳研究以休閒游泳者與業餘泳者為主；精英游泳者的資料不足。鐵人三項選手在長距離游泳段（尤其開放水域）的認知策略是素材缺口——開放水域的定位需求可能強制要求部分外部注意力，使純分離策略難以維持。兒童泳者的聯結/分離能力受後設認知發展限制，不應套用成人策略框架。青少年競技泳者長距離訓練中的認知策略使用幾乎無直接研究。
    sources:
    - Morgan & Pollock 1977（聯結／分離分類的歷史起源）
    - Masters & Ogles 1998（20 年回顧：結果並不一致）
    - Couture, Jerome & Tihanyi 1999（游泳直接研究，休閒泳者）
    - Grgic & Mikulic 2021（肌耐力情境元分析）
    - Vitali et al. 2019（耐力表現中 EF/IF 無差異）
    source_ids:
    - src.morgan-pollock-1977-elite-distance-runner
    - src.masters-ogles-1998-associative-dissociative
    - src.couture-1999-swimming-cognitive-strategies
    - src.grgic-mikulic-2021-focus-muscular-endurance
    - src.vitali-2019-action-monitoring-endurance
- id: psych.self_talk
  name_zh: 自我對話與心理技能
  nav_zh: 自我對話
  when_zh: 腦中雜念停不下、想用自我喊話穩住表現時
  order: 6
  status: complete
  band: 進階競技端
  l_band: L3–L6
  level_tag: 進階·競技
  concept_count: 8
  lead_zh: 前一章講的是注意力放在哪裡，這一章講的是腦子裡那個一直在說話的聲音。人在水裡其實沒有真的安靜——你會對自己下指令、打氣、罵自己、預演失敗。這個內在的聲音不是天生改不了的個性，而是一種可以練的技能：練得好，它能在動作當下幫你把注意力對準該感覺的地方；練不好，它會把本來該拿來感覺水的腦容量整個佔走。
  bridge_zh: 自我對話是你能主動調的工具；但有些時候，壓力會大到讓你連話都接不上——一上場就緊到發抖、越想控制越糟。下一章講這種「壓力下崩掉」到底是怎麼回事。
  premise:
    layer: public
    certainty: 🟢
    evidence_from:
    - psych.self_talk.trainable_skill
    - psych.self_talk.external_focus_ist
    - psych.self_talk.interfering_thoughts_bandwidth
    one_line: 自我對話不只是打氣——指導式自我對話能在動作當下調準感知焦點，而負面自我對話會佔走本該用來感覺水的工作記憶。這是可訓練的心理技能，不是天生的性格。
  concepts:
  - id: psych.self_talk.trainable_skill
    name_zh: 自我對話是技能，不是性格
    nav_zh: 可練技能
    order: 1
    status: complete
    phenomenon:
      certainty: 🟢
      text: 自我對話（self-talk）是人清醒時持續運作的內部獨白，包含技術指令、激勵語言、自我評價、注意力導向等多種功能。跨 32 個研究、62 個效應值的元分析顯示，整體效果量 ES = 0.48——自我對話對運動表現有中等顯著效益，且「經過訓練介入的自我對話」優於未訓練的即興自我對話。這表示自我對話不是固定的性格傾向，而是可以系統性訓練的心理技能。對泳者而言，關鍵不是「正向思考」口號，而是自我對話是否可信（believable）並導向當下任務。
      plain_text: 你一邊游一邊腦子裡會冒出各種話——技術提醒、給自己打氣、自我批評、提醒自己注意什麼。這些都叫「自我對話」。研究把很多實驗合起來看，發現自我對話對表現有中等程度的幫助，而且「練過的」自我對話比臨時想到才講的更有用。重點是：它不是「你就是個容易想太多的人」這種改不掉的個性，而是一項可以一步步練起來的技能。對泳者來說，關鍵不是喊「正面思考」口號，而是你說的話自己信不信、有沒有把注意力帶到當下這件事上。
    misconception_refs:
    - cue: 你就是個容易想太多的人
      why: 把自我對話模式歸為不可改變的性格，讓泳者放棄主動調整的可能。實際上干擾性思維是可量測、可介入的認知歷程，不是固定特質。
      better: 把注意力模式外化為「這趟你腦子裡在跑什麼」——讓泳者觀察自己的內部話語，再給具體的替換提示語，而非性格評斷。
    population_note: 自我對話研究的受試者高度集中在競技青少年與大學生運動員；兒童初學的自我對話能力受語言與後設認知發展限制，年齡越小效果越難類推，不可用競技成人資料外推；成人初學的干擾性思維多夾雜社會評價（「這年紀才學」），介入切入點與競技族群不同；鐵人三項群體游泳段的焦慮機制又與前述不同，需另行處理。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#核心概念
    - Research/心理/06_自我對話與心理技能訓練.md#關鍵文獻清單
    source_ids:
    - src.research-psych-06-c
    - src.research-psych-06-i
  - id: psych.self_talk.ist_mst_matching
    name_zh: 指導型配技術任務，激勵型配耐力任務
    nav_zh: 指導配激勵
    order: 2
    status: complete
    phenomenon:
      certainty: 🟢
      text: 自我對話依內容分兩大類：指導型（IST，如「手肘高提」「把水推後」）指向具體技術動作或注意焦點；激勵型（MST，如「撐過去」「我可以」）指向努力、信心、情緒調節。配對假說（Matching Hypothesis）的元分析支持：IST 在精細動作技能任務上成效顯著優於 MST； MST 在耐力與爆發力任務上效果明顯。游泳池中的直接研究（水球精度任務 vs 力量任務）複製了同樣的模式：精度任務 IST 優、力量任務 MST 優，兩者均能降低干擾性思維（interfering thoughts）。
      plain_text: 自我對話大致分兩種。一種是「指導型」：直接講技術或注意焦點，像「手肘高提」「把水推後」。另一種是「激勵型」：講努力和信心，像「撐過去」「我可以」。研究發現這兩種要配對任務才好用：做精細技術動作時，指導型比較有效；拚耐力、拚爆發時，激勵型比較有效。游泳裡的實驗也得到一樣的結果。還有一個重點——一趟只給一個提示詞就好；同時喊「手肘高、頭別抬、腿別沉」會把注意力塞滿，水感反而進不來。
    l_levels:
    - L2
    - L3
    - L4
    - L5
    - L6
    l_note: 技術精煉階段（L3–L6）多屬「精細動作 → IST 優先」； L2 以下感知基礎建立期的泳者，若尚無穩定動作模板，IST 的效果較難預測。長距離耐力游泳段（鐵人三項游泳、1500m）屬「耐力任務 → MST 優先」，與 L 等級無關，取決於任務性質。
    misconception_refs:
    - cue: 正面想就好，想著「我可以」技術就會穩
      why: 激勵型自我對話提升信心與努力，但不傳遞任何技術焦點信息。精細動作任務（如轉身節奏、入水角度）需要注意力導向的指導型提示，純激勵語言無法替代。
      better: 依任務性質選語言：技術學習趟用指導型提示詞（一個動作重點、一個感知目標）；衝刺或耐力趟再切換激勵型語言。不混用同一趟。
    - cue: 多給幾個要點他才能記住
      why: 工作記憶同時處理多條指令時反而加重認知負荷，干擾自動化執行。游泳中同時說「手肘高、頭別抬、腿別沉」等於要求泳者分配注意力到三個焦點——感知頻寬被佔滿，水感信號反而進不來。
      better: 每趟只給一個提示詞，讓其餘動作維持自動化執行。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#指導型-vs-激勵型自我對話
    - Research/心理/06_自我對話與心理技能訓練.md#游泳特異研究-vs-跨運動外推
    source_ids:
    - src.research-psych-06-b
    - src.research-psych-06-d
  - id: psych.self_talk.external_focus_ist
    name_zh: 「把水推後」比「拉手」更有利熟練執行
    nav_zh: 外部焦點語
    order: 3
    status: complete
    phenomenon:
      certainty: 🟢
      text: 指導型自我對話依注意力焦點可進一步分為：外焦點化 IST（描述動作對水的效果，如「把水推到身後」「讓水從掌心滑過」）和內焦點化 IST（描述身體部位的位置，如「拉手回來」「手肘彎曲」）。游泳速度研究（Freudenheim et al. 2010）顯示，外焦點指令（"push the water back"）比內焦點指令（"pull hands back"）顯著縮短 16m 時間，對中級前泳者與專家泳者均成立。其機制來自「受約束行動假說」（Constrained Action Hypothesis, Wulf 2013）：外焦點促進運動程序的自動化執行；內焦點引發有意識干預，破壞流暢動作。這解釋了為何 Vortex 框架的流體意圖語言（「推水方向、水的回饋」）比身體運動語言（「手臂路徑、關節位置」）更利於技術鞏固。
      plain_text: 指導型的話還能再分。一種講「動作對水做了什麼」——「把水推到身後」「讓水從掌心滑過」；另一種講「身體部位怎麼擺」——「拉手回來」「手肘彎曲」。游泳實驗發現，前者（講水的效果）比後者（講身體部位）讓人游得更快，對中級和高手都成立。原因跟前一章一樣：講身體部位會把注意力拉回去盯動作、打斷自動化。所以同一個技術重點，與其說「手肘高提」，不如換成「讓掌心一直朝向池底那端」——意思留著，語言換成水的效果。
    hardware_boundary:
      certainty: 🔵
      text: 這個規律在熟練度較高的泳者身上更顯著；早期學習階段（L0–L1）部分研究顯示內焦點在動作模板初建時也有作用。外焦點化 IST 的優勢主要在技術鞏固與自動化階段，不可一概而論地對所有學習者、所有動作阶段施用。
    l_levels:
    - L3
    - L4
    - L5
    - L6
    l_note: L3 以上的泳者已有基礎動作模板，自動化與精煉為主——外焦點化 IST 優勢最大。 L0–L2 的初學者與恐懼者尚在建立基本動作語彙，內外焦點指令的相對優勢仍需個別評估。
    misconception_refs:
    - cue: 手肘高提、手進水線不過中線（持續給身體部位指令）
      why: 對有一定技術基礎的泳者，身體部位導向的指令把注意力拉向內焦點，觸發有意識的肌肉監控，干擾已建立的自動化動作，反而讓動作退步或僵硬。
      better: 把相同技術意圖轉為流體結果語言：「手肘高提」→「讓掌心一直朝向池底那端」；「進水不過中線」→「讓指尖找到它自己的水，別切到另一邊的水」。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#與水感框架指令層次注意力焦點的連結
    - Research/心理/06_自我對話與心理技能訓練.md#游泳特異研究-vs-跨運動外推
    source_ids:
    - src.research-psych-06-g
    - src.research-psych-06-d
  - id: psych.self_talk.interfering_thoughts_bandwidth
    name_zh: 負面自我對話佔工作記憶，水感信號進不來
    nav_zh: 干擾佔頻
    order: 4
    status: complete
    phenomenon:
      certainty: 🔵
      text: 游泳中水感知（水壓分佈、流場變化、浮力回饋等）是細微的感知信號，需要注意頻寬才能接收和處理。干擾性思維（interfering thoughts）——包含擔憂成績、反覆復盤失誤、預判失敗——持續佔用工作記憶資源，與感知處理競爭相同的認知頻寬。游泳池中的實驗研究（Hatzigeorgiadis et al. 2004）直接量測到：IST 和 MST 均能顯著降低干擾性思維的報告量，而干擾性思維降低與表現提升相關。跨領域推導：工作記憶在焦慮狀態下的容量縮減是認知心理學的核心發現；游泳情境中干擾思維→感知頻寬減少的直接量測仍是研究空白。
      plain_text: 水感是很細的訊號——水壓怎麼分佈、水流怎麼變——要有足夠的注意力才接收得到。問題是，那些干擾的念頭（擔心成績、一直回放剛剛的失誤、預想等下會失敗）會一直佔住腦容量，跟感知搶同一份注意力。游泳池的實驗確實量到：用自我對話能明顯減少這些干擾念頭，而干擾念頭越少、表現越好。（不過「念頭擠掉水感訊號」這一步是從工作記憶理論推過來的，游泳裡還沒直接量過，算推論。）實務上：對已經分心的人喊「專心」沒用——他不知道要專心在哪；給一個具體的感知錨點（「這趟只放在掌心的水壓」），念頭才會被擠走。
    hardware_boundary:
      certainty: 🔵
      text: 注意：「干擾性思維降低 → 表現提升」的因果鏈在游泳池中有直接實驗支持；但「干擾思維 → 水感信號受阻」的說法是從工作記憶容量理論外推至游泳感知，不是已直接量測的游泳實證，使用時需誠實標注推導性質。
    misconception_refs:
    - cue: 你要集中精神、專心
      why: 「專心」作為裸命令，不傳遞任何注意力焦點內容——泳者不知道要「專心在哪裡」。對已有干擾思維的泳者，這句話增加一層焦慮（「我應該要專心但做不到」），而非給出注意力重新錨定的工具。
      better: 給出具體的感知錨點：「這趟把注意力放在掌心感受水壓這一件事上」。干擾性思維沒有辦法靠命令消除，但可以被明確的感知目標「擠走」。
    population_note: 不同族群的干擾思維來源不同：競技青少年多為成績/排名焦慮；成人初學多為社會評價（「出醜」「這年紀才學」）；鐵人三項在開放水域段的干擾思維有很強的環境觸發成分（看不到底、人群）。介入語言要對應來源，不能套同一個提示詞。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#自我對話的作用機制
    - Research/心理/06_自我對話與心理技能訓練.md#與水感框架指令層次注意力焦點的連結
    source_ids:
    - src.research-psych-06-e
    - src.research-psych-06-g
  - id: psych.self_talk.tense_drift
    name_zh: 心思跑去過去或未來，水感就斷線
    nav_zh: 時態漂移
    order: 5
    status: complete
    phenomenon:
      certainty: 🟠
      observation_basis: 「時態漂移」與「重力」隱喻出自 Bauman 在 Science of Swimming Faster 第 16 章的整理，那是一本泳隊運動心理實務書的章節，作者是執業運動心理師，不是本專案的教練觀測，也不是實驗報告；族群是他服務過的競技泳者。外推邊界：① 「心智與身體在當下對齊會帶來高效表現」是實務層級的講法，本專案未追到把時態導向與成績做對照量測的研究，不得寫成「研究顯示」； ② 把它接到本專案的水感知機制（水感是實時信號，心智不在當下就斷線）是**本專案的推論**， Bauman 沒有談水感；③ 當下／過程／結果三種導向的分類在運動心理界通用，但「結果導向一定較差」不成立——結果目標在賽前設定階段有其功能，這裡限定的是**游的當下**要換成過程提示。
      text: Bauman（Science of Swimming Faster, Ch.16）提出「重力（gravity）」隱喻：身體只能在「現在」，但心智可以漂移到三個時態。高效表現的條件是心智與身體在「當下」對齊——這與 Vortex 框架中「水感知」需要當下感覺輸入的機制直接對應：水感是一個實時信號，過去（「上一趟游得很爛」）或未來（「萬一出發失誤怎麼辦」）的心智時態讓泳者根本不在水裡，感知通道無從更新。建設性自我對話的時態特徵是當下導向（「現在的工作是這一刻游快」）與過程導向（「這次轉身要乾淨」），而非結果導向（「我必須破個人最好成績」）。
      plain_text: 身體永遠只能在「現在」，但腦子會亂跑——跑去過去（「上一趟游得超爛」）或跑去未來（「萬一出發失誤怎麼辦」）。一旦腦子不在水裡，水感這種要即時更新的訊號就斷線了。比較有用的自我對話是「當下導向」和「過程導向」——講這一刻要做的事、這次轉身要乾淨；而不是「結果導向」——我一定要破個人最好成績。結果目標可以存在，但游的當下要換成過程提示。（這個「時態」說法來自一本游泳書的整理，是觀測層級的講法，不是嚴格實驗結論。）
    misconception_refs:
    - cue: 把目標設成個人最佳（PR）
      why: 以個人最佳成績作為單一賽前目標，成功機率本身極低，造成高賽前焦慮並把心智拉向未來結果，脫離當下過程感知。這不是「放棄高標準」，而是目標的時態框架問題。
      better: 把目標語言從結果（「破PR」）轉向當下過程（「這趟的工作是：起跑後第一個臂循環感受水壓，保持節奏到 25m」）。結果目標可以存在，但賽中的自我對話換成過程提示詞。
    population_note: 時態偏移在競技青少年（結果焦慮）與成人初學（社會評價焦慮）都很常見，但觸發源和語言形式不同；兒童競技較少出現複雜結果性自我對話，但父母賽後評價可能在下場前就植入「必須表現好」的時態框架。文獻來源（Bauman, 書籍二手）描述的主要是競技成人泳者情境，對非競技或兒童族群屬外推，需謹慎。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#自我對話的時態框架過去現在未來
    source_ids:
    - src.research-psych-06-f
  - id: psych.self_talk.mst_endurance_efficiency
    name_zh: 激勵型自我對話讓耐力游泳更快，但感覺不到更累
    nav_zh: 激勵耐力
    order: 6
    status: complete
    phenomenon:
      certainty: 🟢
      text: 業餘鐵人三項選手的游泳段研究（Matos et al. 2020）顯示：激勵型自我對話（MST）組的游泳成績提升 2.8%，每 150m 配速加快，且自覺費力程度（RPE）與對照組相同——也就是說 MST 在不增加主觀努力感知的情況下提升了耐力游泳表現。此機制符合 MST 的功能定位：延後疲勞的主觀體驗、維持努力強度。這表示耐力游泳段（長距離、鐵人三項游泳）是 MST 直接有效的場景，不需要「感覺更累才有效」的心理準備。
      plain_text: 在耐力游泳裡，激勵型自我對話有個很實際的好處。一項業餘鐵人三項選手的研究發現：用激勵型自我對話那組，游泳成績進步了、配速變快，但他們主觀上「覺得多累」跟對照組一樣——也就是說，它讓人游得更快，卻沒讓人覺得更辛苦。所以長距離、鐵人三項游泳這種場景，激勵型自我對話是直接有用的工具，不需要「要感覺更累才有效」這種誤會。
    l_levels:
    - L2
    - L3
    - L4
    - L5
    l_note: 此效果適用於有基礎游泳能力的耐力游泳情境（鐵人三項、中長距離競技、馬拉松游泳）。技術學習期的泳者或 L0–L1 的初學者，主要任務是感知基礎建立而非耐力維持， MST 對這個階段的幫助有限，不可直接類推。
    population_note: Matos 2020 的受試者為業餘鐵人三項選手，游泳能力中等偏上。對兒童初學或純競技短距離泳者的適用性需獨立研究，目前不可外推；鐵人三項族群是本研究最直接受益的群體，亦是現有游泳專屬研究最薄弱的族群之一——此研究填補了部分缺口。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#關鍵文獻清單
    - Research/心理/06_自我對話與心理技能訓練.md#游泳特異研究-vs-跨運動外推
    source_ids:
    - src.research-psych-06-i
    - src.research-psych-06-d
  - id: psych.self_talk.pre_performance_routine
    name_zh: 賽前例行程序讓每次起跑都從相同感知基準線出發
    nav_zh: 賽前例行
    order: 7
    status: complete
    phenomenon:
      certainty: 🟢
      text: 賽前例行程序（Pre-Performance Routines, PPR）是在比賽前依固定順序執行的身心準備序列。跨 112 個效應值的元分析（Rupprecht et al. 2021）顯示 PPR 對運動表現有效：前後測設計 SMC = 0.31，實驗設計 Hedges' g = 0.64（低壓條件）。 1996 亞特蘭大奧運後對 8 支美國代表隊的訪談研究（Gould et al. 1999）發現，達標隊與未達標隊最大差異之一，是達標隊有已練習且在大賽中仍堅持執行的身心準備計畫。游泳專屬研究（Richard et al. 2021，46 名 NCAA D1 泳者）顯示 PPR 介入在速度與動作效能指標上效果不顯著，但情緒狀態顯著改善——表明 PPR 主要作用在情緒穩定與注意力聚焦，而非直接提升生理輸出。從 Vortex 框架看，PPR 中的熱身與感知提示詞練習，可作為「感知通道校準」的儀式：讓泳者在起跑前建立當天的水壓回饋基準線。
      plain_text: 賽前例行程序，就是比賽前照固定順序做的一套身心準備。研究發現它對表現有幫助；在游泳的直接研究裡，它對速度的直接提升不明顯，但能明顯穩定情緒、集中注意力。從水感的角度看，賽前那套熱身和提示詞練習，可以當成「校準感知通道」的儀式——讓你每次起跑前都先建立好當天的水感基準線。要注意：別只是反覆對自己喊「放鬆、放鬆」；人已經很緊還硬說放鬆，反而會更焦慮。把提示詞綁到具體可感覺的動作上（「腳踩啟動點、深呼吸、感覺水溫」），才有用。
    hardware_boundary:
      certainty: 🔵
      text: 「PPR 作為感知校準儀式」是 Vortex 框架與 PPR 研究的整合推導，非已被直接驗證的游泳實證；PPR 對情緒狀態的效果（Richard 2021）是現有游泳直接證據，對客觀速度指標的效果仍有限，使用時需誠實說明研究發現的範圍。
    misconception_refs:
    - cue: 比賽前反覆告訴自己「要放鬆、要放鬆」
      why: 重複激勵性口號若與實際身體狀態脫離（已經很緊卻硬說放鬆），會讓泳者感知到指令與現實的落差，反而增加焦慮或自我懷疑； PPR 的有效性來自與固定感知/行為序列的連結，裸口號缺少可執行的行為錨點。
      better: PPR 中的自我對話提示詞要與具體可感知的行為綁定——例如「腳踩啟動點、深呼吸、感覺水溫」的固定序列，而不是漂浮在空中的激勵語言。
    population_note: PPR 文獻以競技成人與大學運動員為主（包含游泳 NCAA D1 研究）；兒童競技泳者的 PPR 設計需考量認知發展限制（序列記憶、後設認知）——過複雜的例行程序可能增加負擔而非減少；成人初學多無比賽情境，PPR 的等效場景是練習前的固定熱身感知校準序列；鐵人三項的 PPR 需同時涵蓋三項間的身心切換，與純游泳 PPR 有結構差異。
    sources:
    - Research/心理/06_自我對話與心理技能訓練.md#賽前例行程序
    - Research/心理/06_自我對話與心理技能訓練.md#關鍵文獻清單
    source_ids:
