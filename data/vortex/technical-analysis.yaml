  stroke: free
  category: joint
  title: 轉頭換氣主要是上頸段事件——50–60% 的頸部旋轉集中在寰樞關節
  joint_region: spine-neck
  nav_zh: 轉頭的頸段
  summary: 換氣時的頸椎旋轉不是整段頸部平均分攤：約 50–60% 的頭頸軸向旋轉發生在寰樞關節複合體，其餘才分散在 C2 到 C7。這是關節層的分佈事實。由它可以推論「整段脖子平均轉」這個心像與實際發生的位置不符，但泳者接到不同指令後實際旋轉分佈如何改變，需要另行量測。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.neumann-2017
    text: '解剖事實：教科書引研究指出，頭頸區約 50–60% 的軸向旋轉發生於寰樞關節複合體，剩餘分散於 C2–C7；頸段本身是全脊椎軸向旋轉能力最大的區域。

      泳姿推論：換氣時頸椎旋轉「配合軀幹轉動」的方向描述在解剖上成立，但兩者的時序耦合（誰先誰後、耦合比例）屬游泳運動學問題，本條不涉及。由上述分佈可推論，換氣所需的頸部旋轉主要落在上頸段，不是整段頸椎均分。

      教練應用：描述換氣時把「頸椎旋轉」與「軀幹旋轉」分成兩欄，並在頸椎欄再分上頸段與下頸段，避免用「脖子轉過去」一句概括兩個不同層次的動作。

      尚待實測：不同換氣指令對實際旋轉分佈與代償型態的影響，以及頸部活動度受限與換氣困難之間的關聯，都需要水中量測或臨床評估。本條不對指令優劣、也不對特定伸展的效果下結論。

      '
  evidence:
  - certainty: 🟢
    text: 教科書引述的研究指出，頭頸區約 50–60% 的軸向旋轉發生於寰樞關節複合體，其餘分散於 C2–C7；頸段是全脊椎軸向旋轉能力最大的區域。此為一般人群的分佈估計，非泳者換氣時的實測分佈。
    source: Neumann 2017, Kinesiology of the Musculoskeletal System 3rd ed
    source_ids:
    - src.neumann-2017
  practical_implication: 換氣受限的判讀要分層：先分辨受限落在上頸段（寰樞）還是下頸段（C2–C7），因為兩層的評估項目不同。把整個換氣旋轉當成「一段脖子」處理，會讓評估與描述都停在無法區分的粒度。尚待實測：受限落在哪一層要靠分層頸椎活動度評估判定，不能由水中換氣外觀反推；針對某一層的介入是否能改善換氣，本條不下結論。
  cross_ref: free.tech.39（同屬脊椎分段描述）
  cross_ref_ids:
  - free.tech.39
- id: free.tech.41
  stroke: free
  category: joint
  title: 教練說的「膝蓋鎖死」與教科書的 knee locking 意思相反
  also_strokes:
  - back
  - breast
  - fly
  - udk
  joint_region: hip-knee
  nav_zh: 膝蓋鎖死
  summary: 打水教學常說「膝蓋不要打直鎖死」。但教科書的 locking（screw-home rotation）指的是膝完全伸直時必然發生的正常機轉，伴隨約 10 度外旋，是被動穩定的來源之一——不是需要避免的病態。兩個系統用同一個詞指相反的事。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '解剖事實：教科書載明，膝完全伸直的鎖定需要約 10 度外旋，這個旋轉鎖定作用長期被稱為 screw-home rotation，可在伸直的最後約 30 度觀察到明顯的扭轉。健康膝的活動範圍是從屈曲 130–150 度到超過 0 度（打直）位再多約 5–10 度，所以「接近打直」在解剖上仍有餘裕。

      泳姿推論：教練語境的「鎖死」與教科書的 locking 是兩個不同的詞義。教練想避免的可能是用力頂到終末、或維持肌肉張力的考量，但這個理由必須另行證明，不能引用教科書的 locking 來支持——引錯了會把正常機轉講成傷害風險。

      教練應用：教學語言保留「不要用力頂到底」沒問題，但不要用「鎖死會受傷」當理由，那是把教科書術語誤植。技術文件同時使用兩套術語時，加一欄註明採用的是哪一套定義。

      尚待實測：打水時膝是否真的到達完全伸直、以及末端張力與推進或不適之間的關係，需要游泳運動學量測。本條不對「打直」的好壞下結論。

      '
  evidence:
  - certainty: 🟢
    text: 教科書載明膝完全伸直的鎖定需要約 10 度外旋（screw-home rotation），明顯的扭轉出現在伸直的最後約 30 度；健康膝的活動範圍自屈曲 130–150 度到超過打直位再約 5–10 度。此為一般人群的關節活動度描述，非游泳時的實際使用範圍。
    source: Neumann 2017, Kinesiology of the Musculoskeletal System 3rd ed
    source_ids:
    - src.neumann-2017
  practical_implication: 教學語言保留「不要用力頂到底」沒問題，但不要用「鎖死會受傷」當理由——那是把教科書術語誤植，而教科書的 locking 指的是完全伸直時必然發生的正常機轉。技術文件若同時出現這兩個詞，必須註明採用的是哪一套定義，否則同一句話在兩個讀者眼中意思相反。尚待實測：膝伸直末端的旋轉表現要由臨床評估判定，不在公開教學層作診斷式解讀。
- id: back.tech.28
  stroke: back
  category: recovery
  title: 仰式 recovery 能量光譜——直臂高能量 vs 彎臂低能量的距離分流
  summary: 仰式 recovery 與自由式同樣存在能量光譜（見 free.tech.32）：直臂大圓繞臂高能量 high-octane 適合衝刺、彎臂低位 low-octane 適合長距離。仰式的特殊性在於「肩關節在仰躺位的活動度限制」更明顯，直臂回臂對肩柔軟度的要求高於自由式。
  mechanism:
    certainty: 🟠
    observation_basis: 仰式的能量光譜是本專案把 free.tech.32 的自由式 octane 分層平移過來的推論，不是 The Race Club 或其他體系對仰式做過的分層觀察，也不是本專案的教練觀測；代表選手（Ryan Murphy、Aaron Peirsol）是從比賽畫面判讀回臂形態，不是量測。外推邊界：① 「直臂約四倍能量代價」的數字承自自由式，仰式多出「水中提手」的初始負荷，這個差異沒有被計入，數字在仰式上更不精確；② 距離與回臂形態的對應是傾向不是規則， 200m 的個別化差異最大，不應據此規定選手用哪種回臂。
    text: '仰式回臂從水中經過垂直位（指天）到入水，比自由式多一個「水中提手」的初始重量負荷。

      直臂回臂走垂直軌跡 + 大圓動量 → coupling 增益最大但能量成本是彎臂的約四倍。

      彎臂回臂手肘彎曲、走較低弧線 → 節能但 coupling 動量小。

      距離適配：

      - 50/100 衝刺：直臂高能量（如 Ryan Murphy、Aaron Peirsol 短距時）

      - 200 中距：選手依柔軟度與體能個別化（彎/直皆有）

      - 800+/開放水域：彎臂節能為主

      肩柔軟度不足者強行直臂會肩衝擊（見 back.err16）；柔軟度好但選 low-octane 則放棄 coupling 增益。

      '
  practical_implication: 仰式 recovery 處方應依距離與肩柔軟度評估。教學早期建立中等彎臂作為預設，待選手肩柔軟度與專項距離確定後再切換。直臂訓練前必須通過肩活動度評估，否則訓練越多傷越多。
  cross_ref: free.tech.32（octane 三層光譜物理基礎）、back.err15（誤套導致的傷害風險）
  cross_ref_ids:
  - free.tech.32
  - back.err15
- id: back.tech.29
  stroke: back
  category: recovery
  title: 仰式 recovery 入水位置——肩線延伸線 vs 中線的橫向力差異
  summary: 仰式入水位置應該在肩膀延伸線（肩寬距離），不是頭頂正上方中線。入水偏內（朝中線）導致拉水軌跡橫越身體中心、肩部內旋撞擊位、推進力分散到橫向。許多「我手感覺很高了」的選手實際入水點仍在肩線之外或內——本體感覺與實際位置的偏差是仰式技術的常見隱性錯誤。
  mechanism:
    certainty: 🟠
    observation_basis: 向量分解的部分（入水偏內時推進力帶橫向分量）是力學推導；需要觀察者背書的是「前進分量降到 70–85%」這組數字與「本體感覺誤判」的普遍性描述。 2026-09-04 檢視時這兩項在本檔都沒有來源，本專案也未查到量測仰式入水點偏移與推進分量關係的研究。外推邊界：**70–85% 在追到來源前不得引用為具體數值**，只能保留「偏內會損失前進分量」的方向性結論；「選手感覺手在頭上方、實際在中線內」是教學上反覆出現的錯誤本體感覺，但本檔未記錄樣本數與族群。
    text: '仰式入水點與肩線的關係決定整個拉水推進向量：

      - 入水在肩線延伸線：拉水推進向量直接朝後，與游進方向反向；推進力 100% 用於前進

      - 入水偏內（朝中線）：拉水推進向量帶有「往身體中心斜拉」分量，前進分量降到 70-85%；同時肩部需內旋對齊，撞擊風險上升

      - 入水偏外（肩線之外）：類似偏內的問題，向量偏離前進方向

      仰式選手看不到自己的手，本體感覺判斷入水位置的能力遠低於自由式（自由式可低頭瞄）。

      常見錯誤本體感覺：選手感覺「我手在頭上方」實際在「身體中線之內」——身體軸線的本體圖被旋轉位置干擾。

      '
  practical_implication: 必須用外部回饋校正入水位置：① 教練從泳池上方拍攝、選手回看影片；② 水道線輔助 drill——選手沿水道線游、用手腕輕觸水線確認入水點對齊；③ Bk22 泳鏡平衡 drill 鞏固身體軸線靜止後再評估手位置。本體感覺單獨不足以判定入水位置。
  cross_ref: back.err11（小指先入水執著常引發入水偏外）、Bk22（泳鏡平衡）
  cross_ref_ids:
  - back.err11
  - Bk22
- id: back.tech.1
  stroke: back
  category: rotation
  title: 精英仰式泳者肩旋轉與髖旋轉的現代運動學數據
  summary: Gonjo et al.（2020）3D實測精英男性仰式肩旋轉平均 49.73 ± 5.73°，髖旋轉平均 39.83 ± 7.25°，均具個體差異。
  mechanism:
    certainty: 🟢
    text: 仰式仰臥姿勢下，浮力矩使髖部跟進幅度大於自由式（自由式髖旋轉約 33.79°）；肩髖旋轉差距比自由式小，核心旋轉控制需同時涵蓋兩者。
    source_ids:
    - src.gonjo-2020-c
  evidence:
  - certainty: 🟢
    text: 3D運動學比較自由式與仰式上肢動作，確認仰式肩旋轉 49.73 ± 5.73°、髖旋轉 39.83 ± 7.25°。
    source: Gonjo et al. 2020
    source_ids:
    - src.gonjo-2020-c
  practical_implication: 旋轉幅度有個體最優值，訓練應找到個人的穩定旋轉角度，而非追求固定數字；個體差異（SD ≈ 6°）屬正常範圍。
- id: back.tech.30
  stroke: back
  category: joint
  title: 仰式「上踢」在解剖學上是髖屈曲——池畔看到的方向與關節動作名稱相反
  joint_region: hip-knee
  nav_zh: 仰式上踢方向
  summary: 仰式打腿朝水面的那一拍在池畔被稱為「上踢」。因為身體仰躺，這一拍在解剖學上是髖屈曲，不是髖伸展——與自由式的「下踢」落在同一個髖動作上。大量技術文件在這裡寫錯，根因不是筆誤，是缺少區分「池畔可見方向」與「解剖學動作」的欄位。這兩拍在推進上各占多少，是另一個需要游泳量測才能回答的問題，不由關節命名推得。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '解剖事實：教科書明定，不論移動的是股骨還是骨盆，骨動學一律以解剖位置描述；矢狀面內只要股骨朝前方（anterior）旋轉就叫髖屈曲，不論是朝 0 度參考位靠近還是超過它。

      解剖事實：仰躺時「朝水面」就是朝腹側，也就是 anterior，所以仰式上踢對應髖屈曲，下踢（沉向池底）對應髖伸展。俯臥的自由式剛好相反：下踢對應髖屈曲、上踢對應髖伸展。

      泳姿推論：同一組池畔用語在兩式中對應到相反的髖動作，而多數技術表格只有一個欄位承載它，這類錯誤因此容易反覆出現。這也是為什麼不能用「文件內部自相矛盾就整段作廢」處理：仰式文件常見的情況是表格寫錯、但備註「上踢與自由式下踢性質相同」是對的，整段作廢會連對的那半一起去掉。

      教練應用：所有泳式的下肢技術描述改為雙欄標注——「池畔可見方向」（上踢／下踢，教學溝通用）與「解剖學動作」（髖屈曲／伸展，訓練處方與描述用）。

      尚待實測：某一拍實際由哪些肌群主導、以及各拍對推進的貢獻比例，需要游泳專項 EMG 與推進力量測。關節動作方向只能指出哪些肌群在解剖上可能參與，不能指出招募程度或推進佔比。

      '
  practical_implication: 所有泳式的下肢技術描述改為雙欄標注——「池畔可見方向」與「解剖學動作」——並在同一份文件內固定使用同一套。陸上輔助訓練的動作選擇要看解剖動作那一欄，不要照「上踢」「下踢」的字面選，否則會選到矢狀面方向相反的動作。尚待實測：該拍實際由哪些肌群主導需要游泳專項 EMG 才能回答，本條只保證動作方向對得上，不對肌群分配下結論。
  cross_ref: free.tech.36（同屬技術描述的必填欄位缺漏）
  cross_ref_ids:
  - free.tech.36
- id: back.tech.2
  stroke: back
  category: rotation
  title: 仰式在不同速度下維持旋轉幅度（不像自由式縮小）
  summary: 仰式泳者在速度增加時不縮小旋轉幅度，旋轉穩定性是仰式效率的結構性特徵。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.gonjo-2016
    - src.gonjo-2021-c
    text: 仰式在增加強度時維持整體旋轉幅度（WBR），但轉移旋轉峰值至划手週期前段；這與自由式高速時縮小旋轉的模式正好相反。
  evidence:
  - certainty: 🟢
    text: 仰式在不同速度下肩旋轉與髖旋轉幅度不隨速度改變，後被 2021 期刊研究延伸確認。
    source: Gonjo et al. 2016
    source_ids:
    - src.gonjo-2016
  - certainty: 🟢
    text: 仰式在增加強度時維持整體旋轉幅度，旋轉峰值時序轉移至週期前段，是與自由式的關鍵差異。
    source: Gonjo et al. 2021
    source_ids:
    - src.gonjo-2021-c
  practical_implication: 「衝刺時縮小旋轉以提高頻率」的策略在仰式不適用；疲勞也不應作為縮小旋轉的理由。旋轉幅度的穩定性本身是仰式效率的指標。
- id: back.tech.3
  stroke: back
  category: rotation
  title: 旋轉放大推進力：有效拉力臂增加（邏輯推導）
  summary: 旋轉使入水側肩部更深入水下，等效力臂增長，相同划手肌力能產生更大推進力矩。
  mechanism:
    certainty: 🔵
    text: 力矩 = 力 × 力臂（純幾何關係）。旋轉增加捕水深度，力臂增長，推進力矩因此放大。此推導不依賴「旋轉每 10° 增加 8%」等舊數字成立。
  practical_implication: 維持肩旋轉習慣是提升推進效率的第一優先，即使沒有精確的量化數字支持，幾何邏輯仍成立。
- id: back.tech.4
  stroke: back
  category: rotation
  title: 旋轉放大推進力：背闊肌進入最佳收縮起始長度（邏輯推導）
  summary: 肩旋轉使背闊肌在捕水前充分預拉，肌肉在最適初長度時能產生最大主動張力。
  mechanism:
    certainty: 🔵
    text: 肌肉最適預拉原理（optimal length theory）：肌肉在最適初長度時能產生最大主動張力。旋轉使背闊肌進入此最適預拉狀態。這是基礎肌肉生理學推導，不是仰式特有研究結論。
  practical_implication: 旋轉的訓練意涵不只是幾何上的力臂，也包含肌肉激活質量的最佳化；兩個機制相互強化。
  cross_ref: back.tech.3（同一旋轉的幾何力臂機制，文中「兩個機制相互強化」）
  cross_ref_ids:
  - back.tech.3
- id: back.tech.5
  stroke: back
  category: rotation
  title: 旋轉最優區間：45–50° 為群體中位數，個體差異合理
  summary: 精英仰式泳者肩旋轉分佈在約 44–56°（平均 ± 1SD），過度旋轉有幾何代價，並非越多越好。
