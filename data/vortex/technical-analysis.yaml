points:
- id: free.tech.1
  stroke: free
  category: concept
  title: 自由式無唯一最優技術——最優解由距離、生理條件、疲勞狀態共同決定
  summary: 自由式技術風格不是偏好選擇，而是距離與生理條件的客觀投影，沒有放諸四海皆準的單一正確技術。
  mechanism:
    certainty: 🔵
    text: 速度 = 划頻（SR）× 划手距離（SL），最優解隨距離、個人生理上限與疲勞狀態改變，屬開放式最佳化問題而非固定公式。
  practical_implication: 教練與泳者應以「找個人最優解」取代「學正確形狀」的教學框架；先確認距離和生理條件，再選風格策略。
- id: free.tech.2
  stroke: free
  category: concept
  title: 自由式動力鏈——手臂產力、踢腿減阻、胸廓旋轉增益划水功率
  summary: 自由式由三個環節共同提速：手臂是主要推進器；踢腿直接增加速度並抬高下肢、降低軀幹壓差阻力；胸廓旋轉把身體角速度轉成手部划水功率。三者必須在完整泳姿中協調，而不是分開相加。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.kudo-yanai-matsuda-2025
    - src.kadi-2024
    - src.deschodt-1999
    text: 25m 最大自由式加入腿部後平均速度提高約 10%，且手腕水下軌跡隨踢腿改變；在相同速度下，六拍踢可降低手部所需推進力，效果主要來自軀幹更水平、壓差阻力下降；最大強度划水中，胸廓旋轉在拉水相與推水相都貢獻約 32% 的手部划水功率。
  evidence:
  - certainty: 🟢
    text: 23 名國家級青年泳者的 30 秒最大完全繫繩測試中，以分開手／腿條件估計，腿部約占兩者力總和的 29.7%（男）與 33.4%（女）；完整泳姿力又低於分開條件總和約 13–16%，顯示協調不能由兩端簡單相加。
    source: Morouço et al. 2015, fully tethered front crawl
    source_ids:
    - src.morouco-2015
  - certainty: 🟡
    text: 軀幹旋轉回顧顯示效果依划水相位與模型而變；速度較一致地與肩—腰扭轉或角速度相關，而不是固定最大旋轉角。
    source: Hyodo 2025, trunk rotation review
    source_ids:
    - src.hyodo-2025
  - certainty: 🟢
    text: 10 名泳者在四種相同絕對速度下，自由式的抬腿浮力扭矩與反向水動力扭矩均比仰式大 30–40%；只量到全身總扭矩，未直接分出各肢段來源。
    source: Gonjo et al. 2021, Sports Biomechanics
    source_ids:
    - src.gonjo-2021
  - certainty: 🟢
    text: 14 名男子最大自由式中，平均划水功率與速度高度相關（r=0.806）；胸廓旋轉在拉水與推水相各貢獻約 32% 划水功率。
    source: Kudo, Yanai & Matsuda 2025, front-crawl stroke power
    source_ids:
    - src.kudo-yanai-matsuda-2025
  - certainty: 🟢
    text: 7 名男子在 0.75 m/s 至最大速度的測試中，六拍踢在相同速度下所需手部推進力較低；低於 severe velocity 時，踢腿降低軀幹傾斜與壓差阻力的效果最明顯。
    source: Kadi et al. 2024, kicking action and hand force
    source_ids:
    - src.kadi-2024
  practical_implication: '依掉速型態選主攻環節：

    - **低速或長距離時臀腿下沉、同速手壓很高**：先提高連續踢腿與身體水平，目標是在同速下降低手部負擔。

    - **拉水相速度谷底明顯**：把胸廓旋轉峰值接到肩內收與前段拉水，讓旋轉參與拉水功率。

    - **推水末段掉速**：讓胸廓旋轉、肩內收與肘伸同時完成推水，不讓身體先轉完、手臂才獨自收尾。

    - **手、腿單獨測試都強，完整泳姿反而差**：主問題是協調；用完整泳姿速度曲線對齊踢腿、胸廓旋轉與手部功率峰值。

    '
- id: free.tech.3
  stroke: free
  category: tempo
  title: SR–SL 動態關係——精英優勢在高划頻下維持划距不下降
  summary: 50m 中划手距離（SL）是主要速度決定因子；SR 在男子 50m 甚至與速度呈負相關；精英金牌的真正優勢是在高 SR 下維持 SL 不下降。
  mechanism:
    certainty: 🔵
    text: SR 提高而 SL 下降是「技術沒有同步支撐划頻」的結果，不是物理必然；技術足夠時兩者可同時最大化。
  evidence:
  - certainty: 🟢
    text: 50m 中 SL 是主要速度決定因子，SR 在男子 50m 與速度甚至呈負相關；精英金牌能在高 SR 下維持 SL。
    source: Staunton, Ruiz-Navarro & Born 2025
    source_ids:
    - src.staunton-2025-d
  - certainty: 🟢
    text: 划手穩定性（stroke steadiness）與速度相關 r = -0.61 至 -0.749，維持穩定的划手週期是高水準選手與地方選手的關鍵差距。
    source: Ruiz-Navarro et al. 2024
    source_ids:
    - src.ruiz-navarro-2024
  practical_implication: SR 訓練目標是提高神經快速徵召能力上限；SL 訓練目標是在高 SR 下維持捕水效率和阻力控制；兩者都要練，不是二選一。
  cross_ref: free.tech.13（划頻 vs 划距的生理條件分析）
  cross_ref_ids:
  - free.tech.13
- id: free.tech.4
  stroke: free
  category: style
  title: Hip-driven 髖部驅動風格——低划頻大幅髖旋轉，適合長距離有氧情境
  summary: 划頻 50–75 次/分（60 次/分時划水週期 2 秒），手入水後不立刻下壓而是先向前送，延遲升力相啟動；後端推水加長、出手釋放瞬間髖部大幅向後甩，把每划距離（DPS）拉到最大。最節能但非最快，用於 400m 以上有氧距離與三鐵節能策略。本風格不是 catch-up——拉手不能停太久，前手在對側手入水前必須已進入早期推進相。
  mechanism:
    certainty: 🟠
    observation_basis: 觀察者是 The Race Club 的泳型分類體系（hip-driven／shoulder-driven／hybrid 三分法由該體系命名與推廣），不是本專案的教練觀測；族群是他們鏡頭下的競技選手，以中長距離自由式為主。外推邊界：三分法沒有量化的歸類門檻——沒有「髖旋轉超過幾度才算 hip-driven」這種判準，實際上是連續光譜上的三個描述性區段。用它來讀選手可以，用它來判定「你屬於哪一型」則會製造假的分類邊界。
    text: 前端「手向前推（非下壓）」是與 shoulder-driven 的根本分歧，這多出來的時間留給對側回臂趕上、為後段大幅髖旋轉預備槓桿。後端推得更長、更用力，髖部隨之猛轉做出 hip-snap——這就是命名由來。划頻低造成的推進空窗需依賴強力六拍踢腿補足；彎臂低能量回臂（low-octane）配合節能目標，回臂的耗能不該與推進競爭體力預算。
  practical_implication: 適用條件：強力六拍踢、有氧耐力佳、體型高大臂展長。男子菁英 800/1500m 與開放水多見；女子菁英極少數使用（Allison Schmitt 200m、Camille Muffat 400m 為罕例，兩人共同點是極強的踢腿推進力）。三鐵運動員為節省體力供單車跑步常選此風格。划距優勢選手仍需訓練划頻作為疲勞保護機制。
- id: free.tech.5
  stroke: free
  category: style
  title: Shoulder-driven 肩部驅動風格——高划頻入水即捕水，適合衝刺與女子全距離
  summary: 划頻 85–150 次/分（50m 衝刺常用 120 次/分，cycle time 1 秒/划），手入水後立刻下壓施力、出手提早結束。手部功能從「槳板」轉為「螺旋槳葉」——靠高頻而非單划最大化推進。大幅肩旋轉但髖旋轉相對小；直臂高能量回臂（high-octane）配合。
  mechanism:
    certainty: 🟠
    observation_basis: 觀察者同 free.tech.4，是 The Race Club 的泳型分類體系，不是本專案的教練觀測；族群是衝刺與女子全距離的競技選手。外推邊界有兩層：① 「直臂回臂能量代價約是彎臂的四倍」是從「動能與手臂長度平方乘角速度平方成正比」推算出來的量級估計，不是對泳者做的代謝量測，不可當成訓練負荷的換算係數；② 「女子全距離適合 shoulder-driven」是族群層級的傾向描述，個別選手的肩穩定性與前鋸肌耐力才是實際門檻。
    text: 肩旋轉主導、髖在高頻下沒有時間大幅跟轉；高頻補划距不足。直臂回臂（手過水面時手臂打直走垂直軌跡）在 100m 以上提供 coupling 動量補償，但能量代價是彎臂的約四倍——這是換速度的權衡。要求神經快速徵召能力強、肩部穩定性高、前鋸肌耐力足（見 free.tech.10）。
  practical_implication: 幾乎所有菁英衝刺男女皆用；菁英女子各距離（50–1500m）皆首選。男子 100/200m 在 shoulder-driven 與 hybrid 之間選擇取決於踢腿推進力強弱。划頻優勢選手需額外訓練划距作為能量效率底線，否則 200m 以上會出現「划頻撐不住又沒划距備案」的崩潰模式。
- id: free.tech.6
  stroke: free
  category: style
  title: Hybrid 混合驅動風格——兩臂不對稱，呼吸側 hip-driven、非呼吸側 shoulder-driven
  summary: 划頻 70–100 次/分（與兩端風格在 75–85 次/分為灰色重疊區），兩臂時序不對稱：呼吸側採 hip-driven 模式，非呼吸側採 shoulder-driven 模式。同一划手週期裡兩種策略並存——呼吸後恢復臂下落快狠、頭部恰好在恢復臂入水那一瞬沒入水；非呼吸側入水後立刻下壓施力協助下次換氣轉到對側。
  mechanism:
    certainty: 🟠
    observation_basis: 觀察者同 free.tech.4，是 The Race Club 的泳型分類體系，不是本專案的教練觀測；族群是換氣側單邊呼吸的競技自由式選手。外推邊界：「hybrid 依賴強力踢腿，否則退化為不對稱崩壞」是教學上的因果判讀，本專案未查到把 hybrid 兩臂分工與踢腿輸出並列量測的研究；臨床上更常見的是先有兩側不對稱（能力差異）才被讀成 hybrid，因果方向不能只從外觀決定。
    text: 兩臂分工：呼吸側手入水後向前推（hip-driven 模式，給換氣與肩旋轉留時間，非呼吸側拉手此時在前象限），非呼吸側入水立刻下壓（shoulder-driven 模式，創造換氣機會點；對側拉手此時已進入後象限）。本風格依賴強力踢腿——呼吸後一邊推進、必須用強力下踢補上頭沒入水那段的速度損失，否則退化為不對稱崩壞的 shoulder-driven。
  practical_implication: 適合 100–400m 中距離（男子 400m 以上也常見）。Katie Ledecky 2015 後 200m 以上採用此風格；Zane Grothe（美國紀錄保持人）為代表。教學難度高（雙臂兩套時序），需要強力踢腿基礎；對教練的觀察門檻也高——肉眼很容易誤判為「呼吸側划手不順」。
- id: free.tech.7
  stroke: free
  category: stroke-cycle
  title: S 形划手路徑是歷史錯誤——現代共識為接近直線的後向推進路徑
  summary: 傳統 Counsilman（1970）S 形划手路徑已被修正；現代水下高速攝影確認實際推進路徑接近直線向後，S 形是測量工具不足時代的誤判。
  mechanism:
    certainty: 🔵
    text: 推進力來自對水施加向後的動量，所以手掌必須持續把水推向後方；純橫向移動製造的升力不產生前進分量——這一段是力學推導。至於「S 形是水下高速攝影普及前、測量工具不足時代的誤判」，是這段教學史的通行解釋，本專案未追到記錄該轉折的原始文獻，僅作背景敘述，不作為主張。
  practical_implication: 教學中應放棄「畫 S 形」的口令，改以「手掌持續朝後向後推」為感知目標。
- id: free.tech.8
  stroke: free
  category: stroke-cycle
  title: 六階段划手週期——從升力相到晚期回臂的完整推進轉換系統
  summary: 划手週期可分為升力相、前象限推進、後象限推進、釋放相、早期回臂、晚期回臂六個階段，各有不同主力肌群、時間長度與力學目標。觀察手部軌跡用「水下兩英尺時鐘」模型——時鐘直徑只有兩英尺（不是手臂長度），因為手在水下移動的同時身體也在前進，相對靜水的位移約兩英尺。
  mechanism:
    certainty: 🟠
    observation_basis: 六階段的切法與各階段的秒數（升力相 hip-driven 60 SPM 時 >0.6 秒、shoulder-driven 120 SPM 時 <0.3 秒、 1 秒 cycle 約 0.34 秒；前象限推進 0.15–0.21 秒；髖旋轉峰值落在肩旋轉峰值後 0.2–0.3 秒）都出自 The Race Club 的教學體系，不是本專案的教練觀測，本專案也未追到這些秒數的原始量測報告。族群是該體系鏡頭下的競技自由式選手。外推邊界：這些秒數應讀成「示範選手在該划頻下的量級」，用來理解各相位的相對長短；不可拿去當成個別泳者的目標值或診斷閾值，因為划頻、身高與手臂長度一變，所有秒數等比例改變。
    text: '升力相（手向前下方 12→3 點鐘）建立捕水位置。風格決定升力相長度：hip-driven 60 SPM 時 >0.6 秒，shoulder-driven 120 SPM 時 <0.3 秒，1 秒 cycle 約 0.34 秒。

      前象限推進（3→6 點鐘）持續約 0.15–0.21 秒，手與前臂作為一個剛體向後移動，上臂仍在向前——這段時間上臂是阻力源不是推力源（這就是為何 EVF 重要：把上臂藏在游進方向裡）。

      後象限推進（6→9 點鐘）達到推進峰值。

      釋放相（9→12 點鐘）小指翻上最小阻力出水。

      早期回臂肩胛上旋、手腕放鬆回復；晚期回臂重力輔助加速入水觸發 coupling。

      推進峰值的位置取決於風格：shoulder-driven 在前象限或肩膀正下方達到峰值（強調肩旋轉而非髖旋轉）；hip-driven 與 hybrid 因 hip-snap 把峰值推到後象限末或釋放相（強調大幅後段推水）。肩旋轉峰值與髖旋轉峰值不同步——髖旋轉峰值在肩旋轉峰值後 0.2–0.3 秒，這是 coupling 機制的時間結構（見 free.tech.15）。

      '
  practical_implication: 每個階段的技術崩潰位置不同，診斷時應依階段定位問題，而非只觀察最終速度下降。三種風格不該共用同一套「捕水時機」教學——shoulder-driven 要求入水立即下壓施力，hip-driven 卻反其道而行（前推延長升力相）。
- id: free.tech.27
  stroke: free
  category: stroke-cycle
  title: 入水手部位置與小指朝下——入水阻力差距可達 22%（從 +13% 到 -9.5%）
  summary: 入水瞬間手部姿勢決定前段阻力大小，差異比想像中大。指尖朝前掌心朝下（基準）的對照組中，「腕後仰」加 13% 阻力、「腕下彎」加 12%、「小指轉到正下方」反而減 9.5% 阻力——是已測量的最佳入水姿勢。但小指朝下只能用在 hip-driven 與 hybrid 風格（呼吸側）；shoulder-driven 沒時間做這個旋轉，要直接掌心朝下入水即刻下壓。
  mechanism:
    certainty: 🔵
    text: '阻力的關鍵不是「手有沒有平」而是「手的截面形狀朝向游進方向」。小指朝下時手的薄面切水、阻力截面最小；腕關節彎曲（不論前後）讓手變成擾流面，阻力暴漲。手指與大拇指此時應該緊閉、無縫隙——入水後等到開始下壓抓水才稍微張開製造紊流增益（見 free.tech.28）。

      風格限制：shoulder-driven 在 120 SPM 下，從入水到開始施力只有約 0.16–0.3 秒，根本沒有時間先做小指朝下再翻回掌心朝下，所以乾脆直接掌心朝下入水。

      '
  evidence:
  - certainty: 🟢
    text: 入水手部姿勢對阻力影響的量測（PDM, APLab Italy，配速 2.3 m/s）——指張開 +2%、腕側彎 +2.3%、腕後仰 +13%、腕下彎 +12%、小指朝下 -9.5%。對照基準為指尖前指、掌心朝下、腕直、指/拇緊閉。
    source: The Race Club PDM 量測資料
    source_ids:
    - src.race-club-pdm-data
  practical_implication: 教學口令應依風格分流。長距離（800/1500/open water）與三鐵泳者用 hip-driven/hybrid 時應加入「小指朝下入水」訓練；衝刺與 100m 沒有時間做這個翻轉，直接「掌心朝下、指緊、立刻抓水」。任何泳者都要避開腕後仰或腕下彎的入水（這是 13% 阻力陷阱）。
- id: free.tech.28
  stroke: free
  category: stroke-cycle
  title: 划水時手指微張製造紊流——把手的有效面積放大
  summary: 入水時指與拇指要緊閉（最小阻力），但開始下壓抓水後應該微微張開（約 5–10mm 間距）——指間水流變成紊流，效果上把手的有效面積放大、推進力增加。過度張開會讓水流變回層流，反而失去這個增益。
  mechanism:
    certainty: 🔵
    text: 流體力學上，水通過小縫隙時若速度夠快會形成紊流，紊流區域對「下游」物體呈現的等效面積大於物體實際面積——這是手指微張獲得的推進增益。間距太大（如手指完全張開）時，水流變回層流通過、增益消失。確切的臨界間距未被精密量測，但教練實踐共識在「指尖剛好不夾水」這個區間。
  practical_implication: 入水期（free.tech.27）和抓水期的指部姿勢不同——前者要「緊閉切水」，後者要「微張製造紊流」。多數泳者只記得其中一階段、整個划水週期用同一個指型，是放掉一段免費推進。
- id: free.tech.9
  stroke: free
  category: stroke-cycle
  title: 高肘捕水（EVF）——降低上臂阻力、最大化推進面積的核心技術
  summary: Early Vertical Forearm（EVF）讓上臂與游進方向平行（阻力最小），手掌和前臂同時面向後方（推進面積最大化）；常見誤解是「高肘讓前臂推進」，實際目的是降低上臂阻力。
  mechanism:
    certainty: 🔵
    text: 上臂是全身最大截面積部位之一；任何讓上臂橫向伸出的動作都製造正面阻力。高肘讓上臂平行游進方向，使手掌成為主推進面而非前臂（前臂是圓形截面，推進效率低於扁平手掌）。
  evidence:
  - certainty: 🟠
    text: The Race Club PDM 測試確認手掌（非前臂）是推進力的主要來源；三個物理原因（形狀、速度、拳頭測試）均支持此結論。
    source: Hall Sr. 2020
    source_ids:
    - src.hall-sr-2020
  practical_implication: 教學口令應從「讓前臂推水」改為「保持肘尖朝向游進方向」；高肘的訓練限制因素是前鋸肌耐力，而非技術理解。
  cross_ref: free.tech.10（前鋸肌硬體邊界）
  cross_ref_ids:
  - free.tech.10
- id: free.tech.10
  stroke: free
  category: hardware
  title: 前鋸肌——高肘動作的硬體邊界，耐力訓練優先於力量訓練
  summary: 前鋸肌在整個划手週期持續活化，是唯一全程工作的穩定肌；疲勞後觸發菱形肌代償→肩胛骨去穩定→高肘動作崩潰→游泳肩風險大升。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pink-1991-b
    - src.statpearls-2023
    text: 前鋸肌穩定肩胛骨作為高肘動作的「基底」；疲勞後代償鏈為：菱形肌取代前鋸肌穩定肩胛→肩胛骨 winging→肩胛下肌旋轉肌袖代償→內部撞擊風險。游泳需要的是持續低強度活化，不是爆發力。
  evidence:
  - certainty: 🟡
    text: EMG 分析確認前鋸肌在整個划手週期持續活化；疲勞後前鋸肌活化下降，菱形肌代償，肩胛骨去穩定——奠定游泳肩機制的基礎研究。
    source: Pink, Perry et al. 1991
    source_ids:
    - src.pink-1991-b
  - certainty: 🟢
    text: 游泳肩發生率 35–91%（定義不同）；前鋸肌和肩胛下肌是核心風險肌肉；前鋸肌疲勞後肩胛骨去穩定是主要機制。
    source: StatPearls 2023
    source_ids:
    - src.statpearls-2023
  practical_implication: 陸上訓練中前鋸肌訓練的目標是「耐力」而非「力量」；這是游泳訓練中最被忽略的陸上需求——不是技術不夠好，而是支撐技術的硬體撐不住。
- id: free.tech.11
  stroke: free
  category: kick
  title: 六拍踢——對側協調抵消蛇行，是最穩固的教學基準
  summary: 右手入水瞬間左腳主踢下；對側配對產生反扭矩抵消身體蛇行，與走路跑步的交叉模式一致，是教學上最穩固的基準。
  mechanism:
    certainty: 🔵
    text: 手入水時身體向該側滾轉，對側腳踢下產生反扭矩；六拍提供持續推進彌補划手空窗期，同時產生升力維持下半身水平、最小化正面截面積。
  practical_implication: 「入水配對側踢」適用絕大多數泳者和情境；Hip-driven 風格以六拍強力踢作為基礎，彌補低划頻造成的推進空窗。
- id: free.tech.12
  stroke: free
  category: kick
  title: 兩拍踢——同側協調省能，長距離首選但配對邏輯與六拍相反
  summary: 右手拉水中段時右腳踢（同側配對），輔助同側滾轉並為對側手入水創造槓桿條件；代謝成本低，是長距離省能量的主要方式。
  mechanism:
    certainty: 🔵
    text: 兩拍與六拍的配對邏輯相反（「拉水配同側踢」vs「入水配對側踢」）；兩拍推進貢獻低但代謝成本也低，適合需要最大化有氧效率的長距離。
  practical_implication: 教學時需明確說明兩拍和六拍的配對邏輯相反，否則容易混淆；長距離泳者從六拍轉換為兩拍時需要重新建立節律感知。
- id: free.tech.13
  stroke: free
  category: hardware
  title: 踝關節柔韌性——踢水效率的解剖硬體邊界
  summary: 蹠屈幅度會影響腳部推進面的方向；女性自由式樣本顯示蹠屈與 flutter-kick 速度相關，但尚不能由此推定特定背景、因果幅度或訓練效果。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.mccullough-b
    text: 踝關節蹠屈幅度影響腳掌能否形成有效推進面；McCullough 等人在女性自由式泳者中觀察到蹠屈與 flutter-kick 速度呈中度相關（r=0.509），但研究設計不能證明因果，也未測蛙式或仰式。
  evidence:
  - certainty: 🟡
    text: 20 名女性競技／休閒泳者中，踝蹠屈與 flutter-kick 速度呈中度相關（r=0.509）；研究沒有測試柔軟度訓練介入。
    source: McCullough et al. 2009/2010
    source_ids:
    - src.mccullough-b
  practical_implication: 踝關節活動度值得先評估；若蹠屈受限，可把柔軟度與水中技術訓練列為介入候選，但不能由這篇相關研究推論其必然優於力量訓練。
- id: free.tech.14
  stroke: free
  category: kick
  title: 踢水四個功能——推進、升力、速度慣性維持、平衡穩定
  summary: 踢水不只是推進工具，同時提供升力維持下半身水平、透過持續節律最小化速度波動（牛頓第一定律）、以斜向踢水抵消手臂回臂時的側向分力。
  mechanism:
    certainty: 🔵
    text: 速度波動需要反覆加減速，加減速消耗能量；持續踢水維持勻速比間歇推進更節能。斜向踢水（oblique kick）抵消回臂產生的橫向力矩，防止蛇行。
  practical_implication: 教學時不應把踢水簡化為「推進工具」；升力功能對下半身位置的影響在長距離尾段特別顯著，疲勞時踢水退化會連鎖引發頭部漂移。
  cross_ref: free.tech.11（斜向踢水抵消回臂橫向力矩＝六拍踢對側協調抵消蛇行）
  cross_ref_ids:
  - free.tech.11
- id: free.tech.15
  stroke: free
  category: rotation
  title: 肩胛肌群啟動旋轉——菱形肌是旋轉的主動發動者，髖部被動跟隨
  summary: 推水末段菱形肌收縮向後縮肩胛骨，啟動對側身體滾轉；髖部被動跟隨，幅度小於肩膀。旋轉感知目標是肩胛骨動作，不是髖部。
  mechanism:
    certainty: 🟡
    text: '兩個機制來源分清楚：① 「肩胛肌群啟動旋轉」是 Pink 1991 EMG 量測結果（12 塊肌肉同步分析），雖為舊文獻但屬實驗實證、機制至今未被推翻；② 「Hip-driven 髖旋轉 45-60° / Shoulder-driven 20-30°」是 Race Club 等教練體系的影像觀察數據（屬 🟠 教練觀測層級），不是 Pink 研究的內容。本條件 🟡 主要對應 EMG 機制——肩胛肌群啟動旋轉的結論至今有效。

      '
    source_ids:
    - src.pink-1991-b
    - src.race-club-b
  evidence:
  - certainty: 🟡
    text: 12 塊肌肉 EMG 分析確認推水末段肩胛肌群（含菱形肌）是旋轉的主動發動者。舊但仍有效。
    source: Pink, Perry et al. 1991
    source_ids:
    - src.pink-1991-b
  - certainty: 🟠
    text: Hip-driven 與 Shoulder-driven 風格的髖旋轉幅度範圍來自菁英影像觀察。
    source: Race Club / 通用菁英觀察
    source_ids:
    - src.race-club-b
  practical_implication: 在高划頻下刻意主動旋轉髖部會讓動作失調；短距離訓練應讓髖保持相對穩定，「把肩膀教好，髖部自然跟著動」。
- id: free.tech.16
  stroke: free
  category: rotation
  title: Coupling 動力鏈——胸廓旋轉、肩內收與肘伸共同產生划水功率
  summary: Coupling 的核心是把胸廓旋轉接進手部產力：拉水相由上臂帶動、胸廓旋轉補上功率；推水相則由胸廓、上臂與前臂三段共同完成。回臂與肩髖旋轉的時機決定這幾個環節能否在對側手產力時同時發生。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.kudo-yanai-matsuda-2025
    - src.hall-murphy-2020
    text: '最大強度自由式的直接功率分解顯示：拉水相中胸廓、上臂與前臂**體節旋轉**對划水功率的相對貢獻約為 32%、83%、−15%，由上臂旋轉主導、胸廓旋轉為第二來源；推水相約為 32%、37%、31%，三段貢獻彼此接近。

      **這三組數字的分解單位是體節旋轉，不是關節動作**——功率算的是手部受力與「各體節旋轉所誘發的手部速度」的內積，上臂體節旋轉不等於肩內收，前臂體節旋轉不等於肘伸展。原文另有一句關節層級的定性描述（推水相中胸廓滾轉、肩內收與肘伸展同等重要），那句話不是這些百分比的出處，兩者不得互相代換。

      Race Club 的相位模型把晚期回臂下落、肩旋轉峰、髖旋轉峰與對側手壓力峰放在同一時間軸。書中約 0.1 秒失配與肩髖相差 0.2–0.3 秒，可直接作第一次影片／儀器標記；最終位置由泳者的壓力峰與淨速度峰校準。

      '
  evidence:
  - certainty: 🟠
    text: Coupling、回臂與 Velocity/Pressure Meter 的相位解釋來自 Race Club 教材與個案量測。
    source: Hall & Murphy, Fundamentals of Fast Swimming, 2020
    source_ids:
    - src.hall-murphy-2020
  - certainty: 🟡
    text: 軀幹旋轉研究支持相位、角速度與手部運動互相相關，但未建立固定 0.1 秒門檻或直接節段能量流。
    source: Hyodo 2025, trunk rotation review
    source_ids:
    - src.hyodo-2025
  - certainty: 🟢
    text: 14 名男性泳者的功率分解中，胸廓體節旋轉對拉水相與推水相的划水功率均貢獻約 32%；拉水相由上臂體節旋轉主導（83%，前臂為 −15%），推水相三段接近（32%／37%／31%）。百分比屬體節旋轉層級，關節層級只有原文的定性描述。
    source: Kudo, Yanai & Matsuda 2025, front-crawl stroke power
    source_ids:
    - src.kudo-yanai-matsuda-2025
  practical_implication: '- **拉水相功率不足**：練「對側手開始抓水時胸口同步轉過去」，把胸廓旋轉接到肩內收。

    - **推水末段功率不足**：練「胸口轉完、手掌推完、肘部伸完同時結束」，避免任一環節提前完成。

    - **高划頻 50m／100m**：使用較小髖幅度、較快肩旋轉與積極回臂，優先守住相位與划頻。

    - **200m 以上或低划頻型**：使用較完整肩髖分離與較長產力時間，優先守住划距與同速耗力。

    - **加強回臂後水花、側擺增加且15–25m變慢**：降低回臂下砸幅度，但保留胸廓旋轉與對側拉水的峰值對齊。

    '
- id: free.tech.29
  stroke: free
  category: rotation
  title: 手部砸水強度 = 肩旋轉速度——同源驅動，教練只需要教其中一個
  summary: 入水瞬間「手用力砸下去」和「肩旋轉變快」其實是同一個動作的兩個觀察面，不是兩件事。教練不必同時教兩件事——只要教「重重把手砸到水裡」，肩旋轉速度會自動上去，coupling 增益就出現了。菁英 sprinter 入水時製造 3 英尺高的水花是這個現象的視覺證據。
  mechanism:
    certainty: 🟠
    observation_basis: 觀察者是 The Race Club，以 Pressure Meter 同步量測手部壓力與肩旋轉角速度，得到兩者峰值幾乎重合；不是本專案的教練觀測，該量測未經同儕審查、未報告樣本數與重複次數。外推邊界：「峰值重合」支持的是兩者同源、不宜分開教，但不足以證明「教其中一個效果更好」——後者是本專案接受的教學推論，沒有對照實驗。實務上先教「手砸下去」的理由是視覺反饋較明確，這是教學可行性的選擇，不是效果量的比較結果。
    text: '晚期回臂手部加速向下擊水時，肩膀必然跟著向同側強烈旋轉（解剖學連動，不是選擇）。手的線性動能與肩的角動能來自同一個發力鏈（背闊肌 / 三角肌後束 / 核心連動），分不出哪個帶哪個。Race Club 用 Pressure Meter 同步量測手壓與肩旋角速度，兩者的峰值幾乎重合。

      這個觀察有個重要實務意涵：教練若同時喊「手快點下去」+「肩膀轉快」，泳者會試圖獨立控制這兩件事、反而動作脫節變慢。只教其中一個（首選「手砸下去」，因為視覺反饋更明確）效果更好。

      '
  practical_implication: 教學口令簡化——只要「重重把手砸進水裡」這一句就涵蓋了肩旋轉訓練。觀察進步指標：入水水花高度（成人 sprinter 進步到 elite 級時水花從 6 吋變到 3 英尺）。Hip-driven 與 hybrid 風格的對應口令是「拉到底 + 髖部 snap」（後段 coupling 而非前段）。
- id: free.tech.17
  stroke: free
  category: head
  title: 頭部基礎位置與弓形波換氣——利用弓形波凹陷換氣幾乎零阻力代價
  summary: 頭頂朝前頸部持平視線約 45° 向下；弓形波在頭部兩側形成凹陷，精英選手嘴巴轉進凹陷換氣而非抬頭創造空間，頭部本身不移動靠眼球達成視線調整。
  mechanism:
    certainty: 🔵
    text: 頭部是全身密度最高且位於槓桿臂最長位置的部位，任何抬起都被放大。Wave drag（波阻）約與速度三次方成正比，競速時佔總阻力約 25%。弓形波凹陷換氣接近零額外阻力代價，但需正確頭部位置和足夠游速才存在。
  practical_implication: 頭部本體感知精確度遠低於手臂腿部，「感覺壓低了」不等於「實際是低的」；需用錄影或外部參照確認頭部位置；長距離視覺安全感靠眼球上轉而非頭部上抬。
- id: free.tech.18
  stroke: free
  category: head
  title: 頭部抬起的連鎖代價——隱性累積阻力影響在長距離尾段完整顯現
  summary: 頭部微抬→重心前移→下半身下沉→踢水必須對抗傾斜→踢水能量預算被部分佔用；代價隱性且累積，短距離難察覺，長距離尾段才完整顯現。
  mechanism:
    certainty: 🔵
    text: 頭部抬起改變全身重心分布，下半身因浮力中心與重心偏移而下沉；踢水需要部分能量用於對抗傾斜而非推進，形成「向踢水借能量」的隱性負擔。
  practical_implication: 換氣時過度抬頭不只影響換氣本身，還會打斷旋轉連動鏈並造成同側手入水位置偏移；「只讓嘴角露出水面，蛙鏡另一側不完全離水」是實用基準。
- id: free.tech.19
  stroke: free
  category: tempo
  title: 划頻是神經生理指標，划距是技術效率指標
  summary: SR 反映神經快速徵召能力與能量容量；SL 反映捕水品質、阻力控制與旋轉連動的綜合效率——SL 是技術問題的直接反映，SR 上限由神經系統循環速率決定。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.staunton-2025-d
    text: Staunton et al.（2025）確認：SL 與推進力產生和有效施水能力相關；SR 與神經肌肉功率和能量容量相關。強迫提高划頻而不提升技術支撐反而讓每划推進力下降。
  evidence:
  - certainty: 🟢
    text: 男子在 400m–1500m 之間從長 SL 低 SR 轉為高 SR 低 SL；女子轉換點更早（200m–400m），反映不同的生理策略。
    source: Staunton, Ruiz-Navarro & Born 2025
    source_ids:
    - src.staunton-2025-d
  practical_implication: 診斷速度瓶頸時應先問「SL 下降是技術問題還是生理條件問題」，而非直接提高划頻。
- id: free.tech.20
  stroke: free
  category: errors
  title: 手入水跨越中線——誘發蛇行偏移與肩胛失穩
  summary: 入水跨越身體中線是最常見的正面阻力錯誤之一；第一個後果是大幅外掃產生橫向分力，肩胛骨無法穩定。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.virag-2014
    text: 跨越中線入水讓手的第一個動作必然是向外側掃，產生橫向分力；同時肩胛骨無法保持穩定，高肘捕水結構在入水瞬間即崩潰。
  evidence:
  - certainty: 🟡
    text: 91% 泳者有至少一項划手錯誤；跨越中線入水與 dropped elbow 高度相關，是最常見的兩類錯誤。
    source: Virag et al. 2014
    source_ids:
    - src.virag-2014
  practical_implication: 修正入水位置在肩膀正前方（11 點/1 點方向）；回臂肘部下沉與跨越中線高度相關，修正回臂起始姿勢可同步改善入水位置。
- id: free.tech.21
  stroke: free
  category: errors
  title: 肘部下沉（dropped elbow）——捕水推進力歸零的最常見錯誤
  summary: 肘部下沉讓上臂橫向伸出，製造最大正面阻力且捕水階段推進力幾乎歸零；是 Virag et al.（2014）確認最常見的正面阻力錯誤。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.virag-2014
    text: 上臂橫向伸出時，最大截面積直接面對游進方向；同時肩胛骨無法形成穩定基底，高肘結構在捕水階段立即崩潰，推進力從最大化降至接近零。
  evidence:
  - certainty: 🟡
    text: Dropped elbow 是最常見的正面阻力錯誤，與跨越中線入水高度相關；91% 泳者有至少一項划手錯誤。
    source: Virag et al. 2014
    source_ids:
    - src.virag-2014
  practical_implication: 修正感知口令：「保持肘尖朝向游進方向」；dropped elbow 往往引發跨越中線，修正根本錯誤可連帶改善多個表面錯誤。
  cross_ref: free.tech.20（dropped elbow 引發的跨越中線）、free.tech.23（錯誤連動性的因果鏈起點）
  cross_ref_ids:
  - free.tech.20
  - free.tech.23
- id: free.tech.22
  stroke: free
  category: errors
  title: 入水後主動向前推水——失去捕水位置的隱性錯誤
  summary: 入水後主動向前推手讓手臂緩慢下沉而非停在捕水位置；泳者感知「在延伸」，實際是失去捕水結構。
  mechanism:
    certainty: 🔵
    text: 入水後的延伸應靠旋轉將肩膀送出去，而非手臂主動向前推水；主動推水讓手在水中失速，無法建立有效的升力相捕水位置。
  practical_implication: 口令：「讓慣性帶手向前滑幾寸，然後立刻轉入捕水——延伸靠旋轉把肩膀送出去，不是手臂主動推水。」
  cross_ref: free.tech.9（失去的正是 EVF 捕水位置）
  cross_ref_ids:
  - free.tech.9
- id: free.tech.23
  stroke: free
  category: errors
  title: 錯誤連動性——一個根本錯誤往往引發多個表面錯誤
  summary: Virag et al.（2014）確認錯誤高度相關：dropped elbow→跨越中線→過度抬頭→下半身下沉，找到因果鏈起點比逐一修正表面錯誤更有效。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.virag-2014
    text: 划手錯誤在生物力學上是互相連動的：入水位置偏差→捕水角度改變→肩胛穩定性受損→換氣旋轉補償→頭部位置漂移→下半身下沉連鎖。
  evidence:
  - certainty: 🟢
    text: 31 名大學游泳選手中 91% 有至少一項划手錯誤；錯誤之間高度相關，一個錯誤往往引發另一個。具體實證數據（n=31, 2014）。
    source: Virag et al. 2014
    source_ids:
    - src.virag-2014
  practical_implication: 診斷時應尋找因果鏈起點，不要同時修正所有表面錯誤；通常修正根本錯誤（如捕水位置或回臂姿勢）能連帶改善 2–3 個下游表面錯誤。
  cross_ref: 連動鏈上的三個節點：free.tech.21（dropped elbow）、free.tech.20（跨越中線）、free.tech.18（抬頭的連鎖代價）
  cross_ref_ids:
  - free.tech.21
  - free.tech.20
  - free.tech.18
- id: free.tech.24
  stroke: free
  category: fatigue
  title: 疲勞崩潰序列——SL 是最早警報，SR 補償掩蓋問題
  summary: 自由式疲勞崩潰順序：①SL 下降→②旋轉幅度縮小→③前鋸肌失守/高肘崩潰→④頭部漂移→⑤踢水退化；泳者本能提高 SR 以維持速度感，反而加速技術惡化。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.staunton-2025-d
    - src.pink-1991-b
    text: SL 下降先於 SR 下降——技術品質比頻率更早受疲勞影響。每划推進力下降→需要更多划次→消耗更多能量→惡性循環加速。旋轉縮小→有效拉力臂縮短→同樣肌力下推進力矩減少（幾何必然）。前鋸肌失守→肩胛 winging→EVF 崩潰→直臂蠻力划水。
  evidence:
  - certainty: 🟢
    text: 精英選手的疲勞優勢在「維持 SL 更久」而非 SR 更高。
    source: Staunton, Ruiz-Navarro & Born 2025
    source_ids:
    - src.staunton-2025-d
  - certainty: 🟡
    text: 前鋸肌疲勞後菱形肌代償→肩胛骨去穩定→高肘動作無法維持。
    source: Pink, Perry et al. 1991
    source_ids:
    - src.pink-1991-b
  practical_implication: 訓練目標：在疲勞下主動監測 SL 而非被動依賴 SR 補償；SL 是最早的疲勞警報信號但泳者通常感知不到，需建立對 SL 的主動意識。
- id: free.tech.25
  stroke: free
  category: watersense
  title: 水感的本質——加速 feedforward 神經固化的學習工具，非即時感知決策能力
  summary: 精英選手在比賽中的提前肌肉激活是大量訓練將正確時機固化成預測性神經指令的結果，不是比賽當下水感驅動的即時反應。水感加速這個固化學習過程，本身不是比賽中的反應能力。
  mechanism:
    certainty: 🔵
    text: Feedback 階段（初學）感知到阻力才決定動作，此迴路太慢在比賽速度下造成時機延遲；feedforward 階段（熟練）神經系統學會在感知到阻力變化之前就預先送出指令。水感好讓正確感知更快出現，讓 feedforward 固化更快。
  practical_implication: 水感是後天可發展的神經適應（感知施力如何轉換為推進速度的能力），可透過刻意練習發展；訓練設計應著重「讓泳者更快感知到正確施力時機」，而非「讓泳者比賽時靠感知決定動作」。
- id: free.tech.26
  stroke: free
  category: comparison
  title: 四式技術對照——推進波動、主推進來源、旋轉軸向、技術多樣性
  summary: 自由式是四式中速度最快、速度波動最低（最接近勻速）、技術風格多樣性最高的泳式；手臂提供 85–90% 推進力；縱軸旋轉（Roll）；生理個體差異對技術選擇影響最直接。
  mechanism:
    certainty: 🔵
    text: 自由式手臂推進的連續性比蝶式和蛙式高，速度波動最小化符合能量最優原則；三種系統性風格（hip/shoulder/hybrid）由生理條件和距離共同決定，而非純粹風格偏好。
  practical_implication: 理解四式技術差異有助於跨式訓練設計；自由式無「唯一正確技術」的特性使評估框架必須依個人生理條件調適，不能用統一標準強加於不同泳者。
  cross_ref: free.tech.1（無唯一最優技術的框架前提）
  cross_ref_ids:
  - free.tech.1
- id: free.tech.32
  stroke: free
  category: stroke-cycle
  title: 恢復臂能量光譜——彎臂低 / 中等 / 直臂高三層，按距離與專項分流
  summary: 恢復臂的能量成本不是「彎一點或直一點」的二分，而是一個連續光譜。光譜上的位置決定 coupling 動能與能量代價的權衡——直臂回臂的動能與「手臂長度平方 × 角速度平方」成正比，把手臂從彎到直拉長一倍，恢復同樣速度需要四倍能量。所以光譜選位實質上是「能量預算分配給推進 vs 分配給 coupling」的策略決定，按距離與專項分流。
  mechanism:
    certainty: 🟠
    observation_basis: 三層光譜的命名（octane 辛烷值類比）與分層來自 The Race Club 的教學體系，不是本專案的教練觀測；族群是競技自由式選手，代表人物由該體系點名。外推邊界：「直臂約是彎臂四倍能量代價」與 free.tech.5 同源，是由「長度平方乘角速度平方」推算的量級，不是代謝量測；三層之間也沒有量化分界，是連續體上的描述性分段。應用時的正確用法是「距離越長、能量預算越緊，coupling 佔比要下降」這個方向，不是把選手歸到某一層。
    text: '三層光譜（Race Club 命名借用汽車辛烷值類比，因應化學能燃燒高低）：

      - **低能量（彎臂 low-octane）**：肘部明顯彎曲、手在水面附近輕鬆繞回，能量代價最低但 coupling 動能小。適合 800/1500m 以上長距離有氧、三鐵節能策略。Hip-driven 風格通常配低能量。

      - **中等能量（半彎 mid-octane）**：肘部微彎、手臂部分延伸，介於前兩者。100/200m 中距離的多數菁英選手位於此區。Hybrid 風格的呼吸側典型。

      - **高能量（直臂 high-octane）**：肘部幾乎打直、手臂走垂直軌跡，coupling 動能最大但能量代價也最大（約是彎臂四倍）。專屬 50m 衝刺、shoulder-driven 風格。Brad Tandy 的直臂大圓繞臂是典型代表。

      選擇邏輯：能量代價隨手臂長度與角速度的平方放大，所以「拉直」的代價是非線性陡升。距離越長，總能量預算越緊，能量分配給推進的比例必須提高、coupling 比例下降。

      '
  practical_implication: 對教練：依選手主項距離與風格決定光譜定位，不要把衝刺直臂訓練套到長距離選手身上。對選手：練多種光譜位置以備不同距離與後段策略——例如 200m 前段用 mid、後段切高能量直臂衝。轉換並不會自然發生，需專門訓練。
  cross_ref: free.tech.4/5/6（hip/shoulder/hybrid 風格的對應位置）、free.tech.16（晚期回臂作為 coupling 動作）
  cross_ref_ids:
  - free.tech.4
  - free.tech.5
  - free.tech.6
  - free.tech.16
- id: free.tech.33
  stroke: free
  category: hardware
  title: 螺旋線動力鏈——用跨側肩、軀幹、髖、腳定位連動斷點
  summary: 螺旋線把對側肩胛、腹斜肌、骨盆與腳部放在同一條跨側檢查路徑。自由式出現划手—踢腿不同步時，沿這條路徑依序檢查胸廓旋轉、軀幹抗旋轉、髖部控制與踝腳輸出，就能把問題分成陸上能力限制或水中時序限制。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.myers-2021
    - src.karpinski-2020
    - src.liu-2025-core-stability-youth-swimmers
    text: '螺旋線（Anatomy Trains 命名）以頭頸、肩胛、腹斜肌、髖與小腿形成跨側連續路徑；自由式的胸廓旋轉、對側抓水與踢腿正好需要這種跨側組織。陸上核心訓練能改善轉身後5m與50m自由式表現；青年泳者的統合分析也支持核心穩定訓練縮短游泳時間，但「哪個距離或泳式獲益最大」屬於次群組結果、檢定力低，不宜當成選項排序的依據。

      '
  evidence:
  - certainty: 🟠
    text: Anatomy Trains 提供跨側螺旋線的解剖與動作閱讀方式。
    source: Myers, Anatomy Trains, 4th ed., 2021
    source_ids:
    - src.myers-2021
  - certainty: 🟢
    text: 6 週核心訓練的國家級男子泳者實驗組，轉身後5m改善0.1秒，50m自由式改善0.3秒。
    source: Karpiński et al. 2020, six-week core training RCT
    source_ids:
    - src.karpinski-2020
  - certainty: 🟢
    text: '16 篇試驗、438 名青年泳者的統合分析顯示核心穩定訓練縮短游泳時間（SMD −0.71，95% CI −0.91 至 −0.51，p<0.00001，I²=21%）；劑量最佳落在 8 週、每週不超過 3 次、每次 30–60 分鐘以上。三項邊界：① 受試全為青年泳者，不得外推成人菁英；② SMD 為負代表「時間縮短」，不是效果相反；③ 依距離與泳式切分的次群組檢定力低，該層結論只能當線索。另有 2026-02-18 的更正啟事本專案尚未取得全文，更正內容是否影響效果量未核對。

      '
    source: Liu S, et al. (2025). BMC Sports Sci Med Rehabil 17(1):327. PMID 41219810
    source_ids:
    - src.liu-2025-core-stability-youth-swimmers
  practical_implication: '- **陸上單側 deadbug、bird-dog 或 carry 明顯左右不對稱，水中同側也出現旋轉／踢腿延遲**：以6–8週、每週2–3次跨側核心訓練補足該側，再重測完整泳姿。

    - **陸上左右控制接近，只有提高划頻後才失同步**：能力足夠，主問題是水中相位；使用低次數高品質25m，逐步提高SR並維持肩峰—對側踢的順序。

    - **伴隨肩、腰或髖疼痛**：先進疼痛與負荷管理流程；這時目標是恢復容量，不用水中速度判定是否加量。

    '
  cross_ref: free.tech.10（前鋸肌）、free.tech.15（菱形肌啟動旋轉）、free.tech.16（coupling）
  cross_ref_ids:
  - free.tech.10
  - free.tech.15
  - free.tech.16
- id: free.tech.30
  stroke: free
  category: rotation
  title: 雙側對稱划水——觀景效率的前置條件，比優化單次抬頭技術回報大得多
  summary: 划水左右不對稱會強迫泳者頻繁抬頭觀景修正方向；對稱划水把觀景頻率減半的回報遠大於優化單次抬頭技術。在開放水域 10K 賽事這種情境，抬頭觀景約 400 次，10 磅頭部累計負荷可達 4,000 磅（折算到腰頸肩）——這是池泳完全不會遇到的累積成本。
  mechanism:
    certainty: 🔵
    text: 不對稱划手造成身體蛇行偏移→需要視覺校正→抬頭觀景頻率上升→腰頸肩負荷累積。對稱划水的核心是雙側拉水力與踢腿力的對等，這需要刻意訓練左右側分別的捕水感與後段推水長度。對稱性不是「左右動作看起來一樣」的外觀層次，而是兩側產生的推進向量相互抵消側分力，讓身體軸線維持直線。
  practical_implication: 對稱划水訓練對所有泳者都有益，對開放水域、鐵人三項、長距離有氧訓練特別重要。單臂 drill（Fr11）、雨刷 drill、catch-up drill 是建立雙側對稱的核心練習。
  perception_signal: 對稱時手背在側躺滑行階段感覺水流均勻向後（不是側壓或亂流）；不對稱時弱側會感覺水流偏一邊或無感
  cross_ref: Fr11（單臂 drill，文中指名的核心練習）、free.tech.20（不對稱造成的蛇行偏移）
  cross_ref_ids:
  - Fr11
  - free.tech.20
- id: free.tech.31
  stroke: free
  category: fatigue
  title: 神經肌肉控制限制下的技術退化——CP 選手 30 秒後系統性下降，配速策略要前低後高
  summary: 部分泳者（典型如腦性麻痺背景）的技術會在約 30 秒後系統性退化——這不是體能不足而是神經肌肉控制特性。傳統「保持均速、後段衝刺」的配速策略對這類選手會失效，比賽策略應反過來：前段刻意降強度以保留末段技術品質。
  mechanism:
    certainty: 🟠
    observation_basis: 本檔沒有記錄觀察者與樣本：這條描述的是腦性麻痺背景選手在約 30 秒後出現的系統性技術退化， 2026-09-04 檢視時該條沒有掛任何來源，本專案也沒有對應的第一手教學紀錄。外推邊界分兩層：① 「約 30 秒」這個時間點與「不可靠意志力對抗」的強度描述，本專案未追到原始量測； ② 把它延伸到創傷後復健者與自閉症類群，是從「中樞神經控制不穩」這個共通描述做的類比推論， **沒有任何觀察或文獻支持**，只能當成待驗證的假說，不得對這些族群直接套用前低後高的配速策略。
    text: 神經肌肉疲勞下的動作模式退化比能量代謝極限更早出現，且不可靠意志力對抗。這特性在 CP 選手中最明顯，但任何中樞神經控制不穩的泳者（含部分創傷後復健者、某些自閉症類群）都可能有類似曲線。技術剛性要求要放鬆——目標是 stroke profile 維持，不是動作標準。
  practical_implication: 配速處方按該選手 30 秒前後的技術差異反推：差異越大、前段越該保留。L 級評估時應加入「30 秒後技術品質」這一獨立軸，不只看初始技術。教練口令避免「再撐一下」這類意志力訴求，改成「降一檔保品質」。
- id: free.tech.34
  stroke: free
  category: streamline
  title: 流線體線——基準姿態，所有划手都是這個姿態的暫時偏離
  summary: 流線體線（streamline）是自由式的「零阻力參考姿態」——從頭頂到指尖、腳尖的全身對齊。所有划手動作都是這個姿態的暫時偏離；阻力代價與偏離程度的平方成正比。教學處方的核心是「縮短偏離期 + 加快回到基準」，不是「在偏離期努力推進」。
  mechanism:
    certainty: 🔵
    text: '流線型阻力係數（Cd）實測約 0.3-0.4，一般游姿（無 streamline）約 0.7-1.0。

      雙倍偏離程度 = 四倍阻力增加（阻力與速度平方成正比，類比同樣的非線性放大也適用於姿態偏離）。

      每個划手 cycle 內，泳者在「基準姿態（streamline）」與「划手偏離期（pull cycle）」之間振盪——

      菁英特徵不是「划手時更用力推」，而是「偏離期更短 + 偏離幅度更小」。

      推進效率 = 推力/阻力比，所以縮短偏離期比加大推力更有效率（推力提升受肌力限制，偏離縮短無限制）。

      '
  practical_implication: 訓練流線型不是只在出發和轉身做；每個 stroke cycle 都有 streamline 回歸窗口（手出水前後）。教學重點是「回到 streamline 的速度」，不是「保持划手不變形」。Drill：每三划後刻意 streamline 滑行 3 秒，建立「划手 → streamline → 划手」的循環感知。
  cross_ref: free.tech.32（octane recovery 是 streamline 偏離程度的選擇）
  cross_ref_ids:
  - free.tech.32
- id: free.tech.35
  stroke: free
  category: timing
  title: 划手週期 timing——SR 與 SL 的負相關不可避免，但斜率可訓練
  summary: SR（划頻）與 SL（划距）是負相關——SR 上升必伴隨 SL 下降。但「負相關曲線的斜率」是可訓練的：菁英選手的曲線較平緩（SR 上升 20% 時 SL 只降 5-10%），新手較陡（SR 上升 20% 時 SL 降 20-30%）。曲線斜率反映「在加速時保持划手結構完整性的能力」，是 L4-L5 的核心 timing 指標。
  mechanism:
    certainty: 🔵
    text: '物理上 SR × SL = velocity，所以加速（v 上升）需要 SR 或 SL 至少一個上升。

      肌力與神經徵召上限決定了單划推力的上限，SR 加快時每划時間縮短、推力累積減少、SL 下降。

      但「下降多少」取決於：① 划手結構是否在高 SR 下仍能維持高肘 catch；② 旋轉時序是否仍同步；③ 核心穩定是否撐住身體不蛇行。

      這三項做得好 → 曲線斜率平緩；做不好 → 陡降。

      菁英在 100% race pace 下的 SL 通常只比 80% pace 下降 5-15%；新手在同樣加速下 SL 可能降 30-50%。

      '
  practical_implication: SR-SL 曲線測試是 L4-L5 評估的核心：用 4-6 個逐漸加速的 50m，記錄每趟 SR 與 SL（劃數/距離），繪出曲線。曲線斜率與絕對位置都是教練指標。訓練重點：先用 tempo trainer 在不同 SR 下保持 SL，建立曲線平緩的本體控制。
  cross_ref: free.tech.4/5/6（hip/shoulder/hybrid 風格決定起點位置）
  cross_ref_ids:
  - free.tech.4
  - free.tech.5
  - free.tech.6
- id: free.tech.36
  stroke: free
  category: joint
  title: 「肩由屈曲轉為外展」不是兩個動作——上舉平面才是缺漏的欄位，且外旋是必然伴隨
  also_strokes:
  - back
  - breast
  - fly
  joint_region: shoulder-arm
  nav_zh: 上舉平面
  summary: 描述划手時常寫「肩由屈曲轉為外展」，但在手臂上舉的情境下，屈曲與外展是同一個動作在不同平面的兩個名字，差別只在上舉所處的平面。真正需要記錄的是「上舉平面」，而不是在兩個動作名之間切換。此外，手臂經外展路徑上抬時肱骨必然外旋，這個欄位在多數技術描述中被整個漏掉。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '解剖事實：教科書明載，把手臂舉過頭這件事，靠近矢狀面時被非正式地稱為屈曲，靠近額狀面或肩胛平面時被稱為外展——兩者描述的是同一件事，命名隨平面改變。因此「由屈曲轉為外展」在解剖學上不是關節動作改變，而是上舉平面由矢狀面移向肩胛面或額狀面。若手臂已在約 90 度上舉位，該平面內的移動應稱水平外展／水平內收，基準又不同。

      解剖事實：另有第六運動學原理——肩外展時肱骨自然外旋，使大結節從肩峰後方通過，避開肩峰下空間的內容物。外旋在此是上舉的組成成分，不是可選的修飾。

      泳姿推論：由上述機制可推論，移臂路徑若在外旋不足的情況下完成上舉，大結節與肩峰下空間內容物之間的間隙會減少，該處組織承受的壓迫增加。這是由關節幾何推導出的負荷描述，不是發生率或風險高低的陳述。

      教練應用：描述上肢相位時，把「上舉平面」與「內／外旋」設為與屈伸、內外展並列的必填欄位，空白處寫「中立」而非留白；避免使用「屈曲轉外展」這種在解剖上不成立的措辭。

      尚待實測：泳姿中實際的上舉平面角度與肱骨旋轉量，以及外旋不足與肩部症狀之間是否存在關聯，都需要三維肩關節運動學與前瞻性追蹤才能回答。本條不對此下結論。

      '
  practical_implication: 技術文件描述上肢相位時，把「上舉平面」與「內／外旋」設為必填欄位，空白須寫「中立」而非留白，並避免「屈曲轉外展」這種措辭。移臂教學若只講路徑高度而不講旋轉，寫出來的描述就缺了上舉的其中一個組成成分——這是欄位完整性問題，本條不由此推論任何傷害或防護效果。
  cross_ref: free.tech.37（同類的欄位缺漏：手掌朝向不能反推前臂旋轉）
  cross_ref_ids:
  - free.tech.37
- id: free.tech.37
  stroke: free
  category: joint
  title: 手掌在水中朝哪裡，不能反推前臂旋前或旋後
  also_strokes:
  - back
  - breast
  - fly
  joint_region: shoulder-arm
  nav_zh: 前臂旋轉
  summary: 技術描述常以「手掌朝後下方」推論「前臂旋前」、以「小指先入水」推論「前臂旋後」。這個推論在解剖學上無效：手掌在空間中的朝向是肱骨軸向旋轉、前臂旋前旋後、腕關節位置三者的合成，單看手掌朝向無法判定其中任何一項。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '教科書明指，當手被固定時，所謂的前臂旋前與旋後在本質上是盂肱關節主動外旋與內旋的表現——也就是說，同一個手掌朝向可以完全由肱骨旋轉達成，前臂維持中立。

      旋前旋後的定義是橈骨相對尺骨的軸向旋轉，判定必須看前臂兩骨的相對位置。移臂期尤其容易誤判：此時肱骨正在外旋（見 free.tech.36），單是肱骨外旋就足以讓小指側轉向入水方向，前臂不需要旋後。

      量測邊界：要判定前臂旋轉，需要能分辨橈骨與尺骨相對位置的資料。單一視角的水中或岸上影片做不到這件事——掌心朝向在二維畫面上是肱骨旋轉、前臂旋轉、腕位置三者投影後的合成，投影本身就把三個自由度壓成一個可見量，不同組合可以產生完全相同的畫面。

      量測邊界：可行的判定方式是分節段量測——在上臂、前臂、手背分別設參考標記，或使用多視角同步影像重建各節段的三維姿態。缺少分節段資料時，正確做法是把「掌心朝向」記為觀察值，把「前臂旋轉」欄位留空並註明未判定，不要用觀察值填推論值。

      尚待實測：泳姿各相位中肱骨軸向旋轉與前臂旋前旋後的實際分配，需要三維上肢運動學量測，本專案目前沒有可引用的一手數據。

      '
  practical_implication: 把「手掌空間朝向」（可直接觀察，是有效的教學指標）與「前臂關節位置」（需另行判定）拆成兩個欄位，後者在缺乏分節段量測時一律留空並註明未判定，不要用前者填後者。教練用手掌朝向下指令沒問題，但不要把它寫成前臂旋轉的證據。同一個原則適用於所有以單一視角影片做的關節旋轉判讀：畫面上看得到的是投影後的合成結果，要拆回各節段的旋轉需要多視角或標記點資料。
  cross_ref: free.tech.36（同源的欄位設計缺失）
  cross_ref_ids:
  - free.tech.36
- id: free.tech.38
  stroke: free
  category: joint
  title: 踝（距小腿）關節以背屈／蹠屈為主——水中看到的足部三維擺動不能單獨歸給任何一個關節
  also_strokes:
  - back
  - breast
  - fly
  - udk
  joint_region: ankle-foot
  nav_zh: 踝的三維擺動
  summary: 描述打水時常寫「踝隨水流輕微內旋／外旋」。距小腿關節的主要自由度是背屈與蹠屈，內翻／外翻這組額狀面動作發生在距下與橫跗關節，不在距小腿。但水中看到的足部三維擺動並不能單獨歸給其中任何一個關節：髖的軸向旋轉、屈膝位下的脛骨旋轉、距下與橫跗都可能同時貢獻，單一視角目視無法拆分各自出了多少。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '教科書明定距小腿關節只有一個主要自由度。足部繞斜軸的複合動作另有專門術語：旋前包含外翻、外展、背屈三個成分；旋後包含內翻、內收、蹠屈三個成分。

      原始觀察之所以成立，還有一個結構性理由：完全蹠屈是距小腿關節的鬆弛位（loose-packed），此時外側韌帶的張力下降，且距骨較窄的部分位於踝穴之間、榫眼張力釋放——附屬活動度在此位置增加。

      尚待實測：蹠屈位附屬活動度增加是關節層的解剖事實，把它推論成「打水時足部擺動幅度會變大」則屬游泳運動學問題，需分節段量測才能成立，本條不做此推論。同理，水中觀察到的擺動要拆成髖／膝／距下／橫跗各自的貢獻，也需要分節段量測，肉眼與單一視角影像都做不到。

      '
  practical_implication: 把「踝」拆成距小腿／距下／橫跗三層來描述與評估，並在描述中一併寫明脛骨與股骨的旋轉位置，否則同一個「腳掌轉出去」會被記到錯的關節上。這對硬體邊界判讀有直接後果：蹠屈受限（距小腿）與內外翻受限（距下／橫跗）是不同層的限制，評估項目不同。尚待實測：受限落在哪一層要靠分層被動與主動測試判定，不能由水中動作外觀反推；本條不對介入方式下結論。
  cross_ref: free.tech.39（同屬須分層描述的關節）
  cross_ref_ids:
  - free.tech.39
- id: free.tech.39
  stroke: free
  category: joint
  title: 脊椎節間旋轉與 body roll 是兩種量——胸椎每側 25–35 度、腰椎 5–7 度不能拿來分配整體滾轉角
  also_strokes:
  - back
  joint_region: spine-neck
  nav_zh: 轉體的脊椎段
  summary: 「轉體從腰發動」是常見教學語，脊椎各段的軸向旋轉能力確實差異極大：胸椎每側約 25–35 度，腰椎每側只有約 5–7 度。但這組數字管的是脊椎節與節之間的相對旋轉，而 body roll 通常指的是肩線或髖線相對水平面的整體滾轉——後者是全身繞縱軸的剛體轉動，可以在脊椎幾乎不轉的情況下發生。兩者是不同的量，不能互相換算，也不能用節間 ROM 去分配 body roll 的角度歸屬。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.neumann-2017
    text: '教科書列出各段水平面旋轉範圍：胸段每側約 25–35 度，腰段每側僅約 5–7 度。

      教科書自己另有一項提醒：臨床上量到的腰椎旋轉常常超過這個數字，原因是混入了髖關節（骨盆繞股骨旋轉）與下胸段的額外動作。所以「感覺腰在轉」不等於腰椎節間真的轉了那麼多。

      兩種量必須分開：

      一、脊椎節間旋轉——上一節相對下一節的相對角度。教科書給的 25–35 度與 5–7 度屬於這一種，量測方式是影像或分節段標記。

      二、body roll——身體整體繞縱軸的滾轉，常以肩線或髖線相對水平面的角度表示。它是剛體轉動，在水中無支撐的條件下可以整體發生，不需要脊椎節間出現等量旋轉。

      因此常見的 body roll 數字（自由式 30–45 度、仰式 30–40 度）落在第二種量，教科書層無從裁決——不是「超出解剖範圍」，而是問的不是同一個問題。把兩段節間 ROM 相加去否證一個滾轉角度，是跨層對撞，本條不採用這種論證。

      尚待實測：body roll 的實際角度、肩線與髖線是否同步、以及各泳式之間是否有系統性差異，都需要游泳運動學量測。「仰式比自由式少滾 5 度」這類敘述在取得標明量測基準的一手量測前，不作為區別性事實使用。

      '
  evidence:
  - certainty: 🟢
    text: 教科書列出的脊椎水平面旋轉範圍為胸段每側約 25–35 度、腰段每側約 5–7 度；同段並註明臨床量到的腰椎旋轉常因混入髖關節與下胸段動作而偏高。此為節與節之間的相對旋轉，非身體整體滾轉角。
    source: Neumann 2017, Kinesiology of the Musculoskeletal System 3rd ed
    source_ids:
    - src.neumann-2017
  - certainty: 🔵
    text: 常見引用的 body roll 角度（自由式 30–45 度、仰式 30–40 度）在本專案目前的來源集內找不到標明量測基準的一手量測，因此不作為處方值使用。可能的量測基準至少有三種——脊椎節間旋轉合計、肩線相對水平面、髖線相對水平面——三者數值不同且不可互換。
  practical_implication: 描述脊椎旋轉時把頸／胸／腰／髖骨盆分成四欄，並且在寫「body roll 幾度」時一律標明量測基準是肩線、髖線還是脊椎節間——不標基準的度數無法在人與人、式與式之間比較，不適合當驗收標準。腰椎節間旋轉能力小是解剖事實，可以拿來說明「要求腰去轉出大角度為什麼做不到」；但「指令該指向哪裡才會讓 roll 增加」是運動學與運動控制問題，靜態 ROM 答不了。尚待實測：不同指令對實際滾轉角與滾轉時序的影響需要水中量測比較，本條不做處方，也不對代償型態下結論。
  cross_ref: free.tech.36（同屬技術描述的欄位粒度問題）、back.tech.28（仰式轉體幅度）
  cross_ref_ids:
  - free.tech.36
  - back.tech.28
