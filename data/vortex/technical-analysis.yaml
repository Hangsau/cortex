    source: Gonjo et al. 2020
    source_ids:
    - src.gonjo-2020-c
  practical_implication: 訓練目標是找到「個人最優旋轉角度」並穩定複現，而非追求某個固定數字。約 45–50° 是群體中位數，不是每人的最優解。
- id: back.tech.6
  stroke: back
  category: rotation
  title: 仰式旋轉的不對稱性：回臂側主動上抬，划水側被動深沉
  summary: 仰式的身體旋轉不是兩側對稱地旋轉 45°，而是回臂側向上主動用力、划水側被動深沉的單側主動模式。
  mechanism:
    certainty: 🔵
    text: 回臂側肩膀（recovering shoulder）大幅向上 forward roll，盡量高出水面；這個向上動作把對側肩膀壓得更深入水下，進入更有力的生物力學位置。划水側的深沉是自然結果，不需要主動下壓。
  practical_implication: 「把肩膀壓下去划水」是錯誤的感知目標；正確感知是「把回臂側肩膀盡量抬高」，划水側深沉是自然結果。兩者產生相同外觀，但主動用力方向相反。
- id: back.tech.7
  stroke: back
  category: tempo
  title: 精英仰式划手頻率參考範圍（教練觀測）
  summary: 200m 仰式約 85–90 次/分，100m 約 95–105 次/分，50m 約 110–130 次/分（精英選手觀測值）。
  mechanism:
    certainty: 🟠
    observation_basis: 本條標題原本就寫「教練觀測」，但本檔沒有記錄是誰的觀測、觀察了哪些選手： 2026-09-04 檢視時沒有掛任何來源。族群依內容判讀為菁英仰式選手。外推邊界：「仰式無 hip-driven 版本」是從仰式無法做出自由式那種髖驅動時序推導的結論，這部分成立；但條目提供的划手頻率參考範圍屬於觀測值，缺樣本數與量測條件（長池／短池、比賽／訓練），只能當成量級參照，不可當成訓練目標或分級標準。
    text: 仰式是全肩帶驅動（shoulder-driven），無 hip-driven 版本。SR 與 SL 仍是雙主變數，但因不存在像自由式 hip-driven 那樣以低頻率換高 SL 的泳型策略，高頻率是 50m 的核心調節方向。
  practical_implication: 身材較高的泳者頻率通常略低，但差距比想像中小（Matt Grevers 198cm 仍維持 95/分）。實務用途是評估泳者的頻率是否明顯低於參考範圍，而非要求達到固定數字。
  cross_ref: free.tech.4（文中對照的自由式 hip-driven 低頻高 SL 策略）
  cross_ref_ids:
  - free.tech.4
- id: back.tech.8
  stroke: back
  category: stroke-cycle
  title: 入水：小指先入水，沿肩線延伸，角度 30–45°，不跨越中線
  summary: 小指側先行入水，沿肩線延伸方向，入水角度 30–45°，不跨越頭頂中線。
  mechanism:
    certainty: 🔵
    text: 三層邏輯：① 肩旋轉匹配——肩部旋轉時手掌自然呈現小指朝上，小指先入水是旋轉的自然延伸；② 入水阻力最小化——小指切入水面，正面阻力最小；③ 捕水位置預設——入水後手臂在水中旋轉自然將手掌轉向推進方向。
  practical_implication: 以「肩線延伸」為基準設定入水位置；感知目標是「手臂沿身體側面前方放入水」，而非「伸向頭頂正上方」。
- id: back.tech.9
  stroke: back
  category: errors
  title: 跨越中線入水：引發蛇行偏移的幾何必然
  summary: 手臂在頭頂跨越中線入水是最常見入水錯誤，引發橫向偏移（蛇行）與旋轉軸偏移。
  mechanism:
    certainty: 🔵
    text: 入水偏向對側產生橫向分力，迫使身體左右搖擺平衡動量（幾何必然）；旋轉不再以縱軸為中心，帶入橫向分量，能量散逸。注意：蛇行增加阻力 12–18% 的具體數字（Lyttle et al. 1999）方法論有限制（靜止拖曳測試），定性結論有效但具體百分比不應精確引用。
  practical_implication: 修正策略：想像「兩條平行軌道」分別在身體兩側，手臂不越過鼻樑；或使用「肩線延伸」為基準重建入水位置感知。
- id: back.tech.10
  stroke: back
  category: stroke-cycle
  title: 捕水：高肘確立，前臂面向推進方向，捕水點在肩線後約 10–15 cm
  summary: 手掌在身後確立高肘捕水，前臂面向推進方向，最大化槳葉面積，啟動升力推進。
  mechanism:
    certainty: 🔵
    text: 前臂垂直時升力係數（CL）最大化是基本流體力學推導——薄板面對水流的推進面積等同於前臂全長乘以掌寬，遠大於僅手掌的面積。Schleihauf 1979 用實驗手部模型量化了此關係，後續多項研究（Toussaint, Berger 等 1990 年代起）持續驗證升力推進在低速段佔比顯著、高速段以阻力推進為主。具體推力分配數字隨方法論演進，但「前臂垂直增大有效推進面積」這個結構性原理至今未被推翻。
  evidence:
  - certainty: 🟡
    text: 早期手部流體力學量化，奠定升力推進框架；具體數字今已被更精確方法替代，但原理推導仍有效。
    source: Schleihauf 1979（歷史依據，非當前定論）
    source_ids:
    - src.schleihauf-1979
  practical_implication: 「抓水感」的練習重點是讓前臂而非只是手掌面對推進方向；槳板輔助訓練有助建立前臂垂直的本體感知。
- id: back.tech.11
  stroke: back
  category: stroke-cycle
  title: 拉水：橢圓曲線路徑，肘部屈曲 90–100°（S形路徑已過時）
  summary: 手臂沿橢圓曲線路徑拉動，肘部維持屈曲 90–100°，避免直線推進；S 形路徑指導語已過時。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.maglischo-2003-b
    - src.gonjo-2020-c
    text: 升力＋阻力混合推進，最大化掌面與水流的作用角。Counsilman（1971）的 S 形划手路徑已被 Maglischo（2003）修正為橢圓形路徑；近期研究（Gonjo 2020 等）確認划手路徑個體差異顯著。核心原則（高肘捕水）仍有效，但強調固定形狀路徑的指導語已過時。
  evidence:
  - certainty: 🟡
    text: 修正 S 形划手路徑為橢圓形路徑；定性方向至今有效。
    source: Maglischo 2003
    source_ids:
    - src.maglischo-2003-b
  - certainty: 🟢
    text: 近期實測確認划手路徑個體差異顯著，「前臂面向推進方向」比路徑形狀更重要。
    source: Gonjo et al. 2020
    source_ids:
    - src.gonjo-2020-c
  practical_implication: 不應要求泳者走固定的 S 形或橢圓形軌跡；訓練重點是維持前臂面向推進方向的高肘，路徑隨個人最優化。
- id: back.tech.12
  stroke: back
  category: stroke-cycle
  title: 推水：手臂加速推至大腿側，指尖朝向池底，充分伸展至髖部
  summary: 推水相為阻力推進主導，手臂加速推至大腿側，指尖朝池底，單次划手最大推力輸出點。
  mechanism:
    certainty: 🔵
    text: 阻力推進主導（阻力 F = ½ρv²CdA），手臂加速使水流相對速度增加，最大化阻力推進。充分推至髖部才完成有效推水，提前收手浪費末段推力。
  practical_implication: 「不是推水，是拉身體過去」的感知重建有助避免手臂直線划水；完整推至大腿側是確保推水充分的可觀察指標。
- id: back.tech.13
  stroke: back
  category: stroke-cycle
  title: 回臂：拇指先出水，弧線向前，肩旋轉帶動；直臂或微彎均可
  summary: 回臂為非推進相，拇指先出水，手臂弧線向前，最小化阻力，保持動量連續性。
  mechanism:
    certainty: 🔵
    text: 回臂時手臂在空中移動，目標是最小化阻力干擾並為下一次入水做位置預備。拇指先出水是肩旋轉的自然延伸，直臂或微彎均可因人而異。
  practical_implication: 回臂不是推進相，不需追求固定形式；訓練重點是確保回臂後手臂能落在正確入水位置（不跨越中線）。
- id: back.tech.14
  stroke: back
  category: errors
  title: 手臂直線推水：有效槳面積縮小，肩部剪力增加
  summary: 直線推水使有效槳面積縮小，推進力降低；同時增加肩部剪力，是技術與傷害雙重問題。
  mechanism:
    certainty: 🔵
    text: 手臂沿直線推進時，手掌面積最大化作用角無法維持，升力分量消失，僅剩阻力推進且效率下降；肩關節在不利力學位置承受剪力（物理推導）。
  practical_implication: 練習水中高肘「抓水感」，槳板輔助訓練前臂垂直；以「拉身體過去」替代「推水」作為感知重建起點。
- id: back.tech.15
  stroke: back
  category: kick
  title: 仰式上踢為推進主力，對應自由式的下踢
  summary: 仰式上踢時足背朝上及後方（蹠屈），形成有效推進面，是踢水的主推進來源。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.maglischo-2003-c
    text: 上踢時蹠屈使足背面向上方及後方，形成有效推進面，對應自由式的下踢功能。**「上踢是主推進」這個定性結論至今未被推翻**——影像觀察與菁英教練共識一致。原始 70–80% 推進佔比數字來自 Maglischo 2003 整理的舊研究，現代精準量化（如 IMU + EMG 同步）尚未有同等規模的替代研究，所以**具體百分比應視為歷史定性方向，不是當代精確值**。教學決策上「主要推進來自上踢」這個結論已足夠，不需要精確百分比。
  evidence:
  - certainty: 🟡
    text: 仰式上踢是推進主力，定性結論仍被接受；70–80% 佔比的具體量化已過時。
    source: Maglischo 2003（屬定性方向參考，量化數字待現代研究更新）
    source_ids:
    - src.maglischo-2003-c
  practical_implication: 訓練上踢時注意蹠屈到位（足背朝後），是踢水產生推進力的前提；踝關節柔韌性不足會直接限制此動作。
- id: back.tech.16
  stroke: back
  category: hardware
  title: 踝關節蹠屈柔韌性：踢水速度的直接決定因子
  summary: 踝蹠屈與自由式 flutter-kick 速度呈相關；這提供仰式踢水評估的合理線索，但仰式效果、反向阻力與介入效益仍待直接研究。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.mccullough-2009-a
    text: 踝關節蹠屈不足會限制腳部形成有效推進面的能力；McCullough 等人的女性自由式樣本顯示蹠屈與 flutter-kick 速度呈中度相關，但未測仰式、負推進，也未比較柔軟度與力量訓練效果。
  evidence:
  - certainty: 🟢
    text: 20 名女性競技／休閒泳者中，踝蹠屈與 flutter-kick 速度呈中度相關（r=0.509）；垂直跳力量與踢水速度未呈顯著相關。
    source: McCullough et al. 2009
    source_ids:
    - src.mccullough-2009-a
  practical_implication: 對踢水較慢者可同時評估踝蹠屈與力量，不應只以腿部力量解釋；具體柔軟度處方仍需介入研究支持。
- id: back.tech.17
  stroke: back
  category: kick
  title: 六拍踢 vs 兩拍踢：距離決定策略，200m 中提升划手距離優先於提升踢水頻率
  summary: 50–200m 精英仰式泳者中六拍踢是普遍策略，但 200m 中提升划手距離（SL）對效率的影響優先於提升踢水頻率。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.gonzalez-rave-2025-b
    text: 六拍踢對 100m 以下有速度優勢；200m 策略更複雜，節省踢水能量分配到划手維持可能更優。注意：「六拍踢速度優於兩拍踢 8–12%」的數字（Maglischo 2003）測量條件不明確，更新系統綜述強調「距離決定策略」。
  evidence:
  - certainty: 🟢
    text: 50–200m 有不同生理與運動學模式；提升划手距離對 200m 效率的影響優先於踢水頻率；六拍踢是精英中的普遍策略但非絕對最優。
    source: González-Ravé et al. 2025
    source_ids:
    - src.gonzalez-rave-2025-b
  practical_implication: 教練應視距離與個人特質調整踢水策略；不應把「六拍一定更好」作為全距離通用原則。
- id: back.tech.18
  stroke: back
  category: kick
  title: 踢水深度最優區間約 30–40 cm，越深不等於越好
  summary: 踢水深度約 30–40 cm 時推進力最大；更大深度同時增加阻力，存在最優區間而非越深越好。
  mechanism:
    certainty: 🟡
    text: 踢水深度增加時推進力與阻力同步增加，二者存在最優交叉點（約 30–40 cm）。**「最優深度存在、不是越深越好」是定性結論至今有效**；具體 30-40 cm 區間來自 Maglischo 2003 二手整理，現代精準量化方法（如 CFD 模擬）尚未發表同等規模替代研究，故**此區間應視為群體均值參考、不是個人最優值**。實務上不應以固定深度為訓練目標。
    source_ids:
    - src.maglischo-2003-d
  evidence:
  - certainty: 🟡
    text: 踢水深度約 30–40 cm 推進力最大；同時指出更大深度也增加阻力，存在最優區間（屬群體均值，非個人最優）。
    source: Maglischo 2003（量化區間屬歷史參考，現代研究尚未更新具體值）
    source_ids:
    - src.maglischo-2003-d
  practical_implication: 踢水深度是個人最優值，不應以固定數字為目標；感知「推進感」優先於追求視覺上的特定深度。
- id: back.tech.19
  stroke: back
  category: kick
  title: 踢水與旋轉連動：對側腳上踢與拉水相位對齊，穩定旋轉軸
  summary: 對側腳上踢與拉水相位對齊，形成對角線推進平衡，穩定旋轉軸；六拍踢提供密集旋轉修正信號。
  mechanism:
    certainty: 🔵
    text: 對側腳上踢與拉水相位對齊，形成對角線推進平衡，穩定旋轉軸（牛頓第三定律角動量守恆推論）。六拍踢提供更密集的旋轉「修正信號」，有助維持旋轉穩定性。此為邏輯推導，尚無針對此相位關係的現代精確量化研究。
  practical_implication: 踢水節律訓練應與划手相位配合考量；六拍踢的功能不只是推進，也是旋轉穩定的調節機制。
  cross_ref: back.tech.17（六拍踢提供的密集旋轉修正信號）
  cross_ref_ids:
  - back.tech.17
- id: back.tech.20
  stroke: back
  category: errors
  title: 踢水膝蓋彎曲過大：正面阻力增加，踢水路徑縮短
  summary: 踢水時膝蓋彎曲過大，正面阻力增加，踢水推進路徑縮短，整體效率下降。
  mechanism:
    certainty: 🔵
    text: 膝蓋過度彎曲使小腿面積正面暴露在水流中，增加迎水面積與阻力（流體力學幾何）；同時踢水有效路徑縮短，推進面積減小。
  practical_implication: 以「腳踝帶動」而非「膝蓋帶動」重建踢水感知；蛙鞋輔助訓練有助感受腳踝延伸的踢水動作。
- id: back.tech.21
  stroke: back
  category: head
  title: 頭部基礎位置：耳朵與水面齊平，下巴略收，頭頂與脊椎成直線
  summary: 正確頭部位置是耳朵與水面齊平、下巴略收、頭頂與脊椎成直線；頭部過高導致髖部下沉。
  mechanism:
    certainty: 🔵
    text: 頭部過高 → 髖部下沉（幾何必然），正面阻力增加；視線略朝上方天花板（非正後方），避免頸部過伸（解剖學推導）。量化數字（阻力增加 15%）來自舊研究，定性結論仍有效。
  practical_implication: 以「耳朵貼水面」作為本體感知錨點；視線方向微調（看天花板而非正後方）有助避免頸部代償。
- id: back.tech.22
  stroke: back
  category: streamline
  title: 出發/轉身流線型：雙臂夾耳、頭完全入水，是 100m 成績的最重要技術預測因子之一
  summary: González-Ravé et al.（2025）確認 100m 仰式出發與轉身時間合計佔整場近 1/3，流線型品質是成績的關鍵預測因子。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.gonzalez-rave-2025-b
    - src.morais-2019
    text: 阻力公式 F = ½ρv²CdA：出發/推蹬後速度是整場最高點，阻力增長為二次方關係，此時流線型效益最高。完美流線型（雙臂夾耳、頭完全入水）大幅降低 Cd；頭部提前抬起，Cd 立即上升，且在最高速度下阻力損耗最大。
  evidence:
  - certainty: 🟢
    text: 100m 仰式中出發與轉身時間佔整場近 1/3；流線型品質是 100m 成績的最重要單一技術預測因子之一。
    source: González-Ravé et al. 2025
    source_ids:
    - src.gonzalez-rave-2025-b
  - certainty: 🟢
    text: 出發與轉身表現與 100m 仰式成績顯著相關（r > 0.7）；滑行距離是獨立預測因子。
    source: Morais et al. 2019
    source_ids:
    - src.morais-2019
  practical_implication: 現代訓練優先級：出發+轉身流線型 ≥ 游進技術（至少在 100m 賽事中）。這是舊報告未強調的面向，由近期系統綜述所揭示。
  cross_ref: back.tech.23（頭部提前抬起的阻力代價）、back.tech.25（由此得出的訓練優先級更新）
  cross_ref_ids:
  - back.tech.23
  - back.tech.25
- id: back.tech.23
  stroke: back
  category: streamline
  title: 提前浮頭錯誤：轉身推蹬後頭部必須維持水面下至流線型滑行結束
  summary: 轉身推蹬後頭部提前抬起是仰式最高代價的出發/轉身錯誤，因為此時速度最高，阻力增幅最大。
  mechanism:
    certainty: 🔵
    text: 二次方阻力效應（F ∝ v²）：速度最高時流線型破壞的阻力代價也最高。頭部提前抬起使 Cd 立即上升，疊加最高速度，導致最大速度損耗。「頭部抬起後速度損失 0.3 m/s」的具體數字來自舊研究，定性邏輯是物理必然。
  practical_implication: 訓練重點是建立「維持頭部在水面下直至滑行結束」的習慣；這是投入訓練時間邊際效益最高的技術改善點之一。
  cross_ref: back.tech.22（被破壞的正是雙臂夾耳、頭完全入水的流線型）
  cross_ref_ids:
  - back.tech.22
- id: back.tech.24
  stroke: back
  category: fatigue
  title: 仰式疲勞崩潰序列：四個代償階段
  summary: 疲勞時仰式崩潰依序為：① 髖旋轉增加（核心代償）→ ② 捕水深度下降 → ③ 踢水頻率降低 → ④ 手臂直線划水。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.psycharakis-2010
    text: Psycharakis & Sanders（2010）確認：疲勞時泳者維持肩旋轉幅度，但增加髖旋轉（核心穩定性下降，旋轉由肩轉移至髖）。後續三個崩潰由推導延伸：捕水深度下降（旋轉質量下降）；踢水頻率降低（從六拍退化至四拍/兩拍）；終端崩潰是完全依賴上肢力量划水（放棄旋轉連動）。
  evidence:
  - certainty: 🟢
    text: 疲勞時泳者維持肩旋轉但增加髖旋轉；仰式代償模式與蝶式（波動鏈中斷）截然不同。
    source: Psycharakis & Sanders 2010
    source_ids:
    - src.psycharakis-2010
  practical_implication: 教練觀察疲勞崩潰時，第一指標是髖旋轉是否顯著增加（而非肩旋轉縮小）；訓練核心旋轉控制能力可延緩崩潰序列。
  cross_ref: 崩潰序列點名的兩個節點：back.tech.17（六拍退化為四拍/兩拍）、back.tech.19（放棄旋轉連動）
  cross_ref_ids:
  - back.tech.17
  - back.tech.19
- id: back.tech.25
  stroke: back
  category: concept
  title: 訓練優先級更新：現代文獻建議出發+轉身流線型 ≥ 游進技術
  summary: 近年文獻重心從游進技術轉移到出發/轉身/完賽，改變訓練優先級的排序邏輯。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.gonzalez-rave-2025-b
    text: 傳統優先級：游進技術 > 出發 > 轉身。現代文獻建議：出發+轉身流線型 ≥ 游進技術（至少 100m 賽事中）。González-Ravé et al.（2025）系統綜述揭示此優先級轉移，是近 20 年研究趨勢的整合結論。
  evidence:
  - certainty: 🟢
    text: 仰式速度提升的重心正在從游進技術轉移到出發、轉身、完賽；100m 仰式出發+轉身時間合計佔整場近 1/3。
    source: González-Ravé et al. 2025
    source_ids:
    - src.gonzalez-rave-2025-b
  practical_implication: 訓練資源配置應重新評估；出發技術（起跳力學、背靠牆起跳 vs OSB13 起跳架）和轉身技術（翻轉觸牆、推蹬角度）的專項訓練應提升優先級。
  cross_ref: back.tech.22（同一份 González-Ravé 2025 的流線型結論）、starts-turns.tech.15（文中點名的背靠牆起跳 vs 起跳架）、starts-turns.tech.24（文中點名的翻轉觸牆轉身技術）
  cross_ref_ids:
  - back.tech.22
  - starts-turns.tech.15
  - starts-turns.tech.24
- id: back.tech.26
  stroke: back
  category: comparison
  title: 蝶式 vs 仰式：旋轉軸向、推進機制、呼吸代價對照
  summary: 蝶式以垂直平面波動（Undulation）為主，仰式以水平軸旋轉（Roll）為主；仰式最大優勢是無呼吸代價（持續仰臥呼吸）。
  mechanism:
    certainty: 🔵
    text: 蝶式：全身波動鏈，兩踢與手臂的節律性耦合，每次呼吸需抬頭有阻力代價。仰式：肩旋轉扭力轉換，旋轉在不同速度下穩定維持，持續仰臥呼吸無換氣代價。蝶式疲勞：波動鏈中斷序列（踢水 → 手臂孤立）。仰式疲勞：維持肩旋轉但增加髖旋轉，代償模式截然不同。
  evidence:
  - certainty: 🟢
    text: 仰式在不同速度下維持旋轉幅度（不像自由式縮小），旋轉是仰式效率的核心機制。
    source: Gonjo et al. 2020
    source_ids:
    - src.gonjo-2020-c
  - certainty: 🟡
    text: 蝶式兩踢功能不對稱（Entry Kick / Power Kick）；蝶式疲勞表現為波動鏈中斷序列。
    source: Maglischo 2003
    source_ids:
    - src.maglischo-2003-b
  practical_implication: 仰式分析深度應在「旋轉連動鏈」層面，對應蝶式的「波動連動鏈」；仰式尚需加入出發技術的專項分析（這是蝶式目前缺乏的面向）。
  cross_ref: back.tech.24（文中「仰式疲勞：維持肩旋轉但增加髖旋轉」）、fly.tech.22（文中「蝶式疲勞：波動鏈中斷序列」）
  cross_ref_ids:
  - back.tech.24
  - fly.tech.22
- id: back.tech.27
  stroke: back
  category: comparison
  title: 仰式出發/轉身佔比在四式中最高，100m 中是成績最重要的技術預測因子
  summary: 仰式在四式中出發技術佔比最高（100m 近 1/3），而蝶式出發研究主要聚焦於水下海豚踢距離。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.gonzalez-rave-2025-b
    text: 仰式的出發、轉身佔整場時間的比例在四式中最高；此面向在近年文獻中被大幅強調，是仰式分析中相對蝶式的重要差異點。
  evidence:
  - certainty: 🟢
    text: 100m 仰式中出發與轉身時間合計佔整場近 1/3；仰式在四式中出發技術佔比最高。
    source: González-Ravé et al. 2025
    source_ids:
    - src.gonzalez-rave-2025-b
  practical_implication: 若要平行深化蝶式與仰式的技術分析，仰式需加入出發技術（起跳力學）和轉身技術（翻轉觸牆、推蹬角度）的專項研究，以對應蝶式的連動鏈分析深度。
  cross_ref: back.tech.22（出發轉身佔 100m 近 1/3 的來源結論）、back.tech.26（文中要對應的蝶式連動鏈分析深度）
  cross_ref_ids:
  - back.tech.22
  - back.tech.26
- id: breast.tech.1
  stroke: breast
  category: concept
  title: 雙峰速度曲線與速度波動管理
  summary: 蛙式每個週期有兩個速度峰值與一個明顯低谷，週期內速度波動（IVV）是四式中最大的，技術核心是管理波動而非追求絕對速度。
  mechanism:
    certainty: 🔵
    text: 推進後（腿、臂各一）形成雙峰速度曲線（bi-modal velocity profile）；收腿中段速度跌至最低谷，部分泳者幾乎完全停止；核心邏輯是最大化推進脈衝的速度峰值、最小化低速段的時間與阻力。
  practical_implication: 所有蛙式技術分析的出發點——不是「如何游快」，而是「如何讓谷值不太低、峰值動能盡可能留住」。
- id: breast.tech.2
  stroke: breast
  category: comparison
  title: 三式速度波動對比
  summary: 蝶式為連續波無停頓、仰式旋轉動力鏈波動低，蛙式是四式中 IVV 最高、唯一每週期有明顯滑行的泳式。
  mechanism:
    certainty: 🔵
    text: 蝶式連續波，推進本身即波動機制；仰式旋轉動力鏈，推進相對連續；蛙式雙峰速度曲線，高速段（推進後）與低速段（收腿中）明確分隔。
  practical_implication: 蛙式的速度結構決定了其技術訓練重點與其他三式根本不同，滑行管理是蛙式特有的核心課題。
- id: breast.tech.3
  stroke: breast
  category: stroke-cycle
  title: 外划（Outsweep）：定位不推進
  summary: 外划階段不產生向前推進力，功能是將手移至最佳捕水起始位置，應以最小施力完成。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    text: 肩膀內旋，手掌轉約 45°，雙臂保持伸直向外展至肩寬外，形成 Y 字形；速度平穩不加速；側向合力不等於向前有效分量，外划越寬向前有效推進佔比反而下降。
  evidence:
  - certainty: 🟢
    text: 外划功能確認為捕水前置動作，非推進相
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  practical_implication: 外划幅度以不超過肩寬為上限（USMS 建議），不以更寬為目標；上肢力量越強或肩活動度受限者可有個人化調整空間。
- id: breast.tech.4
  stroke: breast
  category: stroke-cycle
  title: 捕水（Catch）：建立最大槳面
  summary: 捕水是肘開始下彎、前臂向後旋轉建立高肘姿態、手掌轉向後方的關鍵過渡，此時升力係數最大。
  mechanism:
    certainty: 🔵
    text: 前臂面向推進方向時升力係數最大；高肘捕水（EVF）建立最大槳面是捕水的物理目標。
  practical_implication: 捕水品質決定 insweep 推進力的上限；外划幅度過寬會讓捕水起始位置不佳，降低可建立的槳面。
- id: breast.tech.5
  stroke: breast
  category: stroke-cycle
  title: 內划（Insweep）：主推進相與加速時序
  summary: Insweep 是蛙式划手的主推進相；世界頂尖與國家級選手的差別不在更早開始內划，而在手臂推進相往滑腿相延伸得更久。
  mechanism:
    certainty: 🔵
    text: 雙臂加速向內、向後、向上畫弧，肘關節屈曲，手掌在胸口下方匯合；此階段是划手週期中加速度最大的一段。手臂推進相與腿部滑行相重疊多久，決定一個週期裡有效推進的時間窗有多長。
  evidence:
  - certainty: 🟢
    text: 世界冠軍在滑腿相的胸大肌活化時間明顯長於國家級選手（71% 對 50%），也就是手臂推進延伸進了腿的滑行段（n=4 對 4，屬個案級對照）。原文並未報告「更早啟動內划」，肱二頭肌也不在其列出的區辨指標之中。
    source: Olstad, B. H., Zinner, C., Vaz, J. R., Cabri, J. M. H., & Kjendlie, P.-L. (2017). Muscle activation in world-champion, world-class, and national breaststroke swimmers. International Journal of Sports Physiology and Performance, 12(4), 538-547.
    source_ids:
    - src.olstad-2017-world-champion-breaststroke
  - certainty: 🟢
    text: 綜述的肌電整合結論是：划水強度提高會讓肱三頭肌提早活化、外划提早、滑行縮短。那是同一人在不同強度下的變化，不是水準組間的差異。
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  practical_implication: insweep 的加速感是蛙式划手的核心感知目標，也是疲勞時最先崩潰的環節；但訓練指向不是「更早開始內划」，而是讓手臂推進在腿滑行時仍持續有效。
- id: breast.tech.6
  stroke: breast
  category: stroke-cycle
  title: 回臂（Recovery）：最小阻力回位
  summary: 回臂時肘必須保持在水面下，手掌合攏後向前伸出重回流線型；水面上方回臂可進一步降低阻力。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    text: 肘在水面下回臂是基本規定；水面上方回臂（肘露出水面）進一步降低阻力，屬進階技術選擇。
  evidence:
  - certainty: 🟢
    text: 回臂路徑與阻力關係確認
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  practical_implication: 回臂階段目標是最低阻力，不是推進；掌形合攏、肘低是共識要求。
- id: breast.tech.7
  stroke: breast
  category: streamline
  title: 流線型滑行（Glide）：阻力最小點的動能保存
  summary: 流線型滑行是蛙式每個週期的最低阻力時刻，精英選手的 arm glide phase 反而比次精英更長。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    text: 雙臂向前夾耳，身體水平，踝蹠屈，手掌朝下在水面下 15–20 cm；此時阻力係數（Cd）最小，利用踢腿後的動能向前滑行；過早打斷滑行等於主動浪費推進動能。
  evidence:
  - certainty: 🟢
    text: 精英選手（晉級組）比次精英（半決賽被淘汰組）有更長的 arm glide phase
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  practical_implication: 滑行結束的最優時機是速度開始快速下降時才啟動外划，不在動能最高段打斷。
- id: breast.tech.8
  stroke: breast
  category: timing
  title: 手腳時序：效率最敏感的變數
  summary: arm-leg coordination 時序與游速的相關性在各項技術指標中最高；Adam Peaty 的 late kick 技術代表了精英演進方向。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    - src.ward-2018
    text: 傳統時序為外划時收腿、insweep 時踢腿；Peaty 的 late kick 在 insweep 啟動時才踢腿（比傳統更晚），降低速度谷值，縮小速度波動範圍；核心原則是讓兩個推進峰值（insweep + 腿踢）盡量接近但不重疊——重疊時兩個推進力互相干擾。
  evidence:
  - certainty: 🟢
    text: arm-leg coordination 時序與游速的相關性在所有技術指標中最高
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  - certainty: 🟢
    text: late kick 有更小的速度下降百分比（%VDO）、更高的速度恢復百分比（%VR）
    source: Ward 2018（碩士論文，University of Hawaii at Manoa；亦見 Journal of Swimming Research Vol. 26）
    source_ids:
    - src.ward-2018
  practical_implication: 踢腿時機是速度波動管理的關鍵變數；晚踢策略有文獻支持，但需個人化調整。
- id: breast.tech.9
  stroke: breast
  category: kick
  title: 蛙腿推進機制：渦流整合而非反作用力
  summary: 蛙腿的主要推進力來自 outsweep 與 insweep 兩階段渦流合併後向後噴射的動量傳遞，不是「向後蹬水的反作用力」。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.tanaka-2024-c
    - src.hayashi-2025
    text: outsweep 階段足背側和小腿後外側產生渦流，有獨立前向推進力；insweep 階段大腿和小腿側面繼續產生渦流；兩個階段渦流合併後向後噴出，是主推進力輸出時刻；CFD 2024 首次以計算流體力學完整確認此機制。
  evidence:
  - certainty: 🟢
    text: CFD 完整分析蛙腿渦流：outsweep（足背 + 小腿後外側）→ insweep（大腿側 + 足背）→ 渦流合併後向後噴射是主推進機制
    source: Tanaka et al. 2024
    source_ids:
    - src.tanaka-2024-c
  - certainty: 🟢
    text: insweep 腳速與推進力 r=0.89
    source: Hayashi et al. 2025
    source_ids:
    - src.hayashi-2025
  practical_implication: 渦流整合機制解釋了為什麼 insweep 的加速度方向正確性比力量更重要，也解釋了膝距窄的雙重效益。
- id: breast.tech.10
  stroke: breast
  category: kick
  title: 收腿：阻力最大時刻與最優路徑
  summary: 收腿是整個踢腿週期阻力最大的時刻；最優路徑是腳跟往外側臀部靠（非正中間），同時發生髖外旋，最小化膝蓋前移與正面阻力。
  mechanism:
    certainty: 🔵
    text: 傳統「腳跟碰屁股」路徑使膝蓋大幅前移，正面面積激增；往外側臀部靠的路徑讓髖外旋同時發生，大腿前移量最小，正面阻力最低，路徑也更短，縮短收腿時間；腳掌提前到達斜後方位置，可更早進入 outsweep。
  evidence:
  - certainty: 🟢
    text: CFD 確認收腿是制動最大時刻；收腿時腳掌和小腿後外側產生制動渦流
    source: Tanaka et al. 2024
    source_ids:
    - src.tanaka-2024-c
  - certainty: 🟡
    text: 膝外旋（髖外旋功能性指標）與蛙腿游速顯著相關（r=0.35, p<0.08）
    source: Strzała et al. 2013
    source_ids:
    - src.strzala-2013-c
  practical_implication: 「腳跟往外側臀部靠」是物理最優路徑，但需要刻意建立——日常生活幾乎沒有對應動作；仰躺蛙腿可讓泳者直接看到自己的腿確認路徑。
- id: breast.tech.11
  stroke: breast
  category: kick
  title: 腳掌翻轉（Foot Flip）：獨立感知事件
  summary: 踝關節向外翻、腳掌朝斜後方是獨立於收腿的感知事件，翻轉到位後才能啟動有效的 outsweep 推進。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.strzala-2013-c
    text: 踝關節外翻讓腳掌背側對準推進方向；翻轉不到位則提前蹬水，outsweep 推進面積大幅縮減，insweep 渦流整合不完整；膝外旋是髖外旋的功能性指標。
  evidence:
  - certainty: 🟡
    text: 膝外旋與游速顯著相關（r=0.35）
    source: Strzała et al. 2013
    source_ids:
    - src.strzala-2013-c
  practical_implication: 「等腳掌到位再蹬」——腳掌斜後方出現水壓是蹬水確認訊號；速度越快越需建立此感知。
- id: breast.tech.12
  stroke: breast
  category: kick
  title: insweep 腳速是推進力的直接決定因子
  summary: insweep 階段腳速與推進力的相關性達 r=0.89，是蛙腿所有運動學變數中最強的推進力預測因子。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.hayashi-2025
    text: 渦流合併後向後噴射的動量與腳掌加速度直接相關；膝伸展角速度峰值則與推進力負相關（r=-0.54），代表更快「蹬出去」不等於更大推進力——加速度方向正確是前提。
  evidence:
  - certainty: 🟢
    text: insweep 腳速 r=0.89；踝蹠屈角速度 r=0.59；膝伸展角速度峰值負相關 r=-0.54
    source: Hayashi et al. 2025
    source_ids:
    - src.hayashi-2025
  practical_implication: 訓練目標是「渦流方向正確的加速」而非「更大的蹬腿力量」；夾腿沒有加速是推進力渙散的根本原因。
- id: breast.tech.13
  stroke: breast
  category: kick
  title: 膝距窄的雙重效益：減阻 + 增推進
  summary: 膝距窄不只降低阻力，也讓腳掌蹬入自己製造的收腿渦流區，同時提升推進力——兩個效益同時存在。
  mechanism:
    certainty: 🔵
    text: 收腿動作在身體後方形成渦流區（slipstream）；膝距窄讓收腿渦流集中，腳掌蹬出時精準蹬回渦流區，獲得額外推力；膝距寬使渦流範圍擴散，腳掌蹬出位置偏離渦流區，同時正面阻力增加、踢腿週期延長。
  practical_implication: 膝距窄是技術目標而非審美偏好；能否實現膝距窄的根本決定因子是 hip internal rotation 幅度。
- id: breast.tech.14
  stroke: breast
  category: hardware
  title: 踝關節蹠屈柔韌性：第一解剖決定因子
  summary: 踝關節蹠屈柔韌性是蛙腿游速的獨立預測因子，不足時腳掌推進面積物理上無法建立，嚴重時踢腿反向制動。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.strzala-2013-c
    - src.hayashi-2025
    text: 踝蹠屈角速度與 insweep 推進力正相關（r=0.59）；踝關節柔韌性不足時腳掌無法朝後，推進面積大幅縮小；柔韌性嚴重不足時腳掌方向造成制動而非推進；踝關節柔韌性主要靠軟組織訓練可以改善（蛙鞋、陸上伸展）。
  evidence:
  - certainty: 🟡
    text: 踝關節柔韌性是蛙腿游速的獨立預測因子
    source: Strzała et al. 2013
    source_ids:
    - src.strzala-2013-c
  - certainty: 🟢
    text: 踝蹠屈角速度與推進力 r=0.59
    source: Hayashi et al. 2025
    source_ids:
    - src.hayashi-2025
  practical_implication: 訓練優先級：踝關節柔韌性 > 踢腿力量——這是文獻一致的結論，且與多數業餘訓練習慣相反。
- id: breast.tech.15
  stroke: breast
  category: hardware
  title: 髖關節內旋（Hip Internal Rotation）：第二關鍵解剖因子
  summary: 髖旋轉幅度直接決定腳掌能否翻轉到位，不足時無論如何指導「腳掌翻出去」都是無效指令——是物理限制而非理解問題。本條的教練觀測把這個旋轉寫成內旋，動作圖譜則把內旋與外旋兩向並列，因為翻腳過程中股骨方位一直在變，兩者可能各自在講不同時點。
  mechanism:
    certainty: 🟠
    observation_basis: '觀察者為 The Race Club 的教練群，觀察族群為競技蛙式泳者。外推邊界：非控制實驗、未報告量測方法與樣本，不適用於一般成人初學與兒童；本條只作為「髖旋轉可用量會限制翻腳」這個定性關聯的實務依據，不作為方向歸屬或劑量的依據。

      '
    text: 蛙腿踢水時讓腳趾外翻，股骨必須在髖關節產生旋轉——這是腳掌朝向斜後方的解剖前提；本條的教練觀測把這個旋轉指為內旋，而解剖來源在同一現象上指的是外旋，動作圖譜兩向並列（見 cross_ref）。可用量不足時，腳掌無法外翻到位，只能靠膝距加寬補償；膝距加寬帶來三重成本：正面阻力增加、踢腿週期延長、腳掌蹬出位置偏離渦流區；限制混合了股骨頸角度（骨骼，固定）和周邊軟組織緊繃（可訓練），需先區分再介入。
  evidence:
  - certainty: 🟠
    observation_basis: '觀察者為 The Race Club 的教練群，觀察族群為競技蛙式泳者。外推邊界：此為教學現場觀察的比例感，非控制實驗數字，未報告量測方法、樣本數與離散度，不得當作訓練劑量或成效預期使用。

      '
    text: 每增加一度髖旋轉可用量，推進力增加約 5%（教練觀測，非學術研究控制數字）
  - certainty: 🟠
    observation_basis: '觀察者為教練現場觀察，觀察族群為菁英與一般競技蛙式泳者。外推邊界：個案級觀察，未報告量測方式與參考系，角度值只作為「菁英能在較小的髖-大腿夾角啟動踢腿」的定性對比，不作為目標值。

      '
    text: 部分菁英選手能在較小的髖-大腿角啟動踢腿；一般選手需要更大角度
  practical_implication: 評估泳者前應先區分「解剖固定限制」與「可訓練軟組織限制」，不能給相同的訓練建議；髖旋轉可用量是蛙腿技術的解剖前提，而不只是效率因子。辨識時不要看腳尖朝外的角度就回推髖——翻腳期膝在深屈曲，膝的軸向旋轉最自由，遠端的朝外有相當部分可以完全不經過髖；要判斷髖必須把髖單獨拿出來、在接近水中收腿位的髖屈曲角度下量，內旋與外旋各量一次、左右分開。
  cross_ref: movement.demand.breast.foot-flip.multi-joint-composition-of-toe-out（腳尖朝外的多關節合成與髖旋轉兩向並列，含四條辨識規則）
  cross_ref_ids:
  - movement.demand.breast.foot-flip.multi-joint-composition-of-toe-out
- id: breast.tech.16
  stroke: breast
  category: hardware
  title: 蛙式風格分流——用軀幹伸展能力選擇 flat、wave 或 undulating
  summary: 軀幹伸展能力決定泳者能否把 insweep 後的身體抬升接成有效前移：胸椎與髖伸展充足、腰背無症狀者可使用較完整的 wave／undulating；伸展受限或抬升後腰背負荷上升者，使用較平的路徑能守住流線與收腿速度。
  mechanism:
    certainty: 🔵
    text: 波形由胸椎伸展、髖伸展、骨盆控制與頭部回落共同形成；腰椎只負責其中一段。完整波形需要把抬升後的重心前移接到窄幅快速收腿，否則增加的垂直位移會變成阻力。
  evidence:
  - certainty: 🟠
    text: Fundamentals of Fast Swimming 以軀幹伸展能力區分 wave／undulating／flat 的可用範圍。
    source: Hall & Murphy, Fundamentals of Fast Swimming, 2020
    source_ids:
    - src.hall-murphy-2020
  practical_implication: '- **胸椎與髖伸展充足、抬升後能立即前送且腰背無症狀**：採 wave／undulating，訓練 insweep—抬升—前送連續完成。

    - **抬升後停在最高點、收腿變寬或速度谷底加深**：降低波幅，改採 wave 或 flat，優先縮短垂直停留。

    - **胸椎伸展不足但腰椎代償很大，或出現腰背症狀**：採較平路徑；陸上先補胸椎、髖伸展與骨盆控制，再重新測試較大波形。

    '
  cross_ref: 分流的三個目標風格：breast.tech.17（flat）、breast.tech.18（wave）、breast.tech.19（undulating）
  cross_ref_ids:
  - breast.tech.17
  - breast.tech.18
  - breast.tech.19
- id: breast.tech.17
  stroke: breast
  category: style
  title: Flat 平式：波幅最小、滑行最長
  summary: Flat 式身體始終接近水面，雙峰速度曲線波幅最小，滑行距離長，但水平姿勢收腿阻力較高。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.colman-1998-b
    text: 身體保持水平接近水面，雙峰速度曲線波幅最小，推進力方向效率高（水平向前）；收腿時身體水平導致膝蓋前移阻力較高；適合力量強、柔韌性一般的泳者。
  evidence:
  - certainty: 🟡
    text: flat 在最低速點阻力更小；與 undulating 的速度波動範圍比較
    source: Colman et al. 1998
    source_ids:
    - src.colman-1998-b
  practical_implication: 力量強、柔韌性有限的泳者可能在 flat 風格下表現最佳；Ed Moses 為部分代表選手。
  cross_ref: breast.tech.2（文中「雙峰速度曲線」的來源條目）
  cross_ref_ids:
  - breast.tech.2
- id: breast.tech.18
  stroke: breast
  category: style
  title: Wave Style 波動式：競技主流的最優平衡
  summary: Wave style 是精英蛙式競技主流，肩膀明顯升起但不超過手臂，波動同時達成減阻（收腿傾斜）與推進（俯衝升力）雙重功能。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.sanders-1998
    text: 肩膀升起讓收腿在傾斜姿勢進行，膝蓋不直接往前移，正面阻力大幅降低；俯衝角度產生流體升力（物理機制確立，升力在蛙式中的量化貢獻尚未直接測量）；推進效率和收腿減阻的最佳平衡使其成為競技主流。
  evidence:
  - certainty: 🟡
    text: wave style 在競技精英中的主流地位觀察
    source: Sanders 1998
    source_ids:
    - src.sanders-1998
  practical_implication: Adam Peaty、秦海洋、Mike Barrowman 均為 wave style 代表；競技蛙式技術教學應以 wave style 為預設目標風格。
- id: breast.tech.19
  stroke: breast
  category: style
  title: Undulating 波浪式：柔韌性超群者的特殊最優解
  summary: Undulating 軀幹大幅波動，收腿傾斜角最佳、阻力理論上最低，但蹬腿在 dome 位置造成推進垂直分量損失，需要極高柔韌性才能超越 wave style。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.colman-1998-b
    - src.sanders-1998
    text: 軀幹大幅波動，谷底反而較高（收腿傾斜阻力少）但峰值略低；蹬腿在 dome 位置時腿往斜下後方、手和軀幹往前下方，兩方向有衝突，推進力有垂直分量損失；上身過度出水製造額外波阻；Sanders（1998）觀察最大軀幹前彎角度個體差異 28–53°，多數泳者無法達到 undulating 所需柔韌度。
  evidence:
  - certainty: 🟡
    text: undulating 比 flat 速度波動範圍更小（谷值更高）但峰值略低；均速性可能更好但只在極高柔韌性泳者身上才能超越 wave style
    source: Colman et al. 1998
    source_ids:
    - src.colman-1998-b
  - certainty: 🟡
    text: 奧運選手軀幹波動：頭部振幅 43–64 cm；肩部 21–50 cm；髖部 12–17 cm；個體差異巨大，風格是連續體非離散分類
    source: Sanders 1998
    source_ids:
    - src.sanders-1998
  practical_implication: Undulating 是柔韌性超群泳者的特殊最優解（Amanda Beard 為代表）；一般泳者推進損失會蓋過減阻優勢。
  cross_ref: breast.tech.18（文中「才能超越 wave style」的比較對象）
  cross_ref_ids:
  - breast.tech.18
- id: breast.tech.20
  stroke: breast
  category: undulation
  title: 波動的雙重功能：推進 + 收腿減阻
  summary: 蛙式波動同時服務推進（俯衝升力）與減阻（傾斜收腿）兩個目的，兩者來自同一個動作。
  mechanism:
    certainty: 🔵
    text: 推進功能：insweep 帶動身體升起，俯衝角度產生流體升力（壓力差機制確立，類比浮板往下壓後的反彈；量化貢獻在蛙式中尚未直接測量）；減阻功能：身體傾斜時收腿，膝蓋不直接往前移，正面阻力大幅降低——這是最容易被忽略的波動效益。
  practical_implication: 波動是推進的副產品，不是技術目標；感知核心是「俯衝角度對不對」而非「某個部位要用力」，角度對了升力自然出現。
- id: breast.tech.21
  stroke: breast
  category: style
  title: 三種風格的解剖決定論
  summary: Flat、Wave、Undulating 三種風格本質上是不同解剖條件下各自的最優解，不是技術哲學選擇，而是解剖邊界決定了哪種風格能發揮最大效益。
  mechanism:
    certainty: 🔵
    text: 踝關節蹠屈柔韌性、髖關節內旋幅度、腰椎伸展幅度三個解剖因子共同決定哪些技術動作物理上可以完成；蛙式三風格的存在本身反映了這三因子個體差異之大，是蛙式個人差異遠大於其他三式的根本原因。
  practical_implication: 評估泳者應先確認解剖邊界狀態，再決定技術指導方向；對限制明確的泳者，先做柔韌性訓練，再在現有邊界內找最優路徑。
  cross_ref: 三風格 breast.tech.17／18／19，與文中點名的兩個解剖因子 breast.tech.14（踝蹠屈）、breast.tech.15（髖內旋）
  cross_ref_ids:
  - breast.tech.17
  - breast.tech.18
  - breast.tech.19
  - breast.tech.14
  - breast.tech.15
- id: breast.tech.22
  stroke: breast
  category: tempo
  title: 精英優勢在划距穩定性，非划頻
  summary: 精英與次精英的差距主要在 100m 游進段維持更穩定的划距（SL），而非更高划頻——優勢是「疲勞下技術不崩潰」。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.gonjo-2023
    text: 精英選手在 100m 中段（25–75m）維持更穩定的划距，出發/轉身差異反而不顯著；划距穩定代表每划的推進效率維持不變，不靠增加划頻（划頻提高通常代表技術效率下降）來彌補速度損失。
  evidence:
  - certainty: 🟢
    text: 精英比次精英在 100m 游進段有更穩定的划距（SL），出發/轉身差異反而不顯著
    source: Gonjo & Olstad 2023
    source_ids:
    - src.gonjo-2023
  practical_implication: 蛙式技術訓練的優先目標是「疲勞下技術穩定性」而非「單次最大速度」；insweep 加速感和滑行效率是最先崩潰的技術元素，也應是訓練的核心關注點。
  cross_ref: breast.tech.27（文中「insweep 加速感和滑行效率是最先崩潰的技術元素」＝崩潰序列前兩層）
  cross_ref_ids:
  - breast.tech.27
- id: breast.tech.23
  stroke: breast
  category: watersense
  title: 精英神經肌肉活化：更精省不是更大力
  summary: 世界冠軍與國家級選手的差別在活化時序，以及拮抗肌不互相干擾——不在力量大小。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.olstad-2017-world-champion-breaststroke
    text: 受測的八條肌肉全部呈現組間差異。踢腿推進相：世界級的肱三頭肌活化較少。滑腿相：股直肌與腓腸肌在此相「一開始」就活化（四位世界級全數如此，國家級僅一位），胸大肌活化時間較長。收腿相：股二頭肌活化較多，脛前肌起始較晚、持續較短。整個划水週期裡，世界冠軍的脛前肌與腓腸肌完全沒有共同收縮。
  evidence:
  - certainty: 🟢
    text: 世界級對國家級（各 4 人，含 2 位世界冠軍）：踢腿推進相肱三頭肌較少活化；滑腿相起始即有股直肌與腓腸肌活化、胸大肌活化 71% 對 50%；收腿相股二頭肌 50% 對 20%、脛前肌 40% 對 52%；世界冠軍脛前肌與腓腸肌無共同收縮。原文寫的是「沒有共同收縮」，不是「較短的共同收縮」；腓腸肌的差異也在滑腿相起始，不在踢腿末端。
    source: Olstad, B. H., Zinner, C., Vaz, J. R., Cabri, J. M. H., & Kjendlie, P.-L. (2017). Muscle activation in world-champion, world-class, and national breaststroke swimmers. International Journal of Sports Physiology and Performance, 12(4), 538-547.
    source_ids:
    - src.olstad-2017-world-champion-breaststroke
  practical_implication: 精英差距的本質是神經控制的時序精度與拮抗肌互不干擾，而非肌力大小；技術訓練應著重建立精確的時序感知，而非增加力量輸出。樣本僅 4 對 4，屬個案級對照，不宜當成群體常模。
- id: breast.tech.24
  stroke: breast
  category: errors
  title: 外划過寬：效率雙重損失
  summary: 外划超過肩寬導致側向分量增加、向前有效推進減少，同時使收腿阻力增加。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    text: 外划越寬，向前有效分量佔側向合力比例越低；外划更寬同時意味著收腿時腿展開更寬，阻力增加；捕水位置也因此不佳。
  evidence:
  - certainty: 🟢
    text: 外划幅度上限建議不超過肩寬
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  practical_implication: USMS 建議外划不超過肩膀寬度為上限；根本修正是建立捕水感知，讓手在感知到位時自然停止，而非靠意識強制控制幅度。
- id: breast.tech.25
  stroke: breast
  category: errors
  title: 提前蹬水（腳掌未翻轉到位）：渦流整合失敗
  summary: 腳掌未翻轉到位就蹬水，outsweep 推進力大幅下降，insweep 渦流整合不完整，推進力渙散。
  mechanism:
    certainty: 🔵
    text: 腳掌未朝後時推進面積大幅縮減；outsweep 推進渦流無法正常建立；insweep 渦流合併所需的前置渦流缺失，整個踢腿推進循環效率急劇下降。
  practical_implication: 「等腳掌到位再蹬」——腳掌斜後方出現水壓是蹬水確認訊號；速度越快此感知越重要。
- id: breast.tech.26
  stroke: breast
  category: errors
  title: 過度強調波動：波阻反效果
  summary: 刻意游波導致上身過度出水，製造額外波阻；dome 位置蹬腿使推進方向出現垂直分量損失。
  mechanism:
    certainty: 🔵
    text: 波動幅度超過需要時肩膀或胸口出水，額外的水面波阻抵消減阻優勢；dome 位置蹬腿讓推進力有垂直向上的分量，向前的有效推進力下降。
  practical_implication: 正確的波動幅度是「升到水到二頭肌位置」，不是胸口出水；波動是推進的副產品，不應成為意識努力的目標。
- id: breast.tech.27
  stroke: breast
  category: fatigue
  title: 疲勞崩潰序列：五層遞進惡性循環
  summary: 蛙式疲勞崩潰從 insweep 加速消失開始，依序是滑行縮短、收腿路徑延長、外划擴大、波動消失，每層崩潰讓下一層更容易發生。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    text: 第一崩潰：insweep 腳速下降（推進力直接損失 r=0.89），渦流合併不完整，速度峰值下降；第二崩潰：主觀需要更早划手，在動能仍高時打斷滑行，浪費動能；第三崩潰：髖外旋控制下降，腳跟路徑向正中間偏移，大腿前移、阻力上升；第四崩潰：捕水感知消失，手在「找水」，外划超過最優幅度；終端崩潰：核心肌群疲勞，無法維持俯衝角度，升力失效，退化為平游，收腿阻力暴增，惡性循環加速。
  evidence:
  - certainty: 🟢
    text: 疲勞導致 insweep 腳速下降，推進力直接損失
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  practical_implication: 訓練目標是讓第一層崩潰（insweep 加速消失）盡可能晚發生；這也解釋了為什麼「疲勞下技術穩定性」是精英的核心優勢。
  cross_ref: breast.tech.22（文中「疲勞下技術穩定性是精英核心優勢」）、breast.tech.31（第一崩潰引用的 insweep 腳速 r=0.89 即該條原則①）
  cross_ref_ids:
  - breast.tech.22
  - breast.tech.31
- id: breast.tech.28
  stroke: breast
  category: streamline
  title: 最優滑行長度管理
  summary: 蛙式是四式中唯一每個循環都需要管理滑行長度的泳式，最優結束時機是速度開始快速下降時才啟動外划。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    text: 滑行太短：在動能仍高時打斷，浪費推進力；滑行太長：速度跌至低谷後繼續滑行，下一划啟動更困難費力；最優點是速度開始快速下降的時刻，感知目標是「感覺到速度開始快速流失」時啟動外划。
  evidence:
  - certainty: 🟢
    text: 精英比次精英有更長的 arm glide phase；半決賽被淘汰選手的滑行比晉級選手更短
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  practical_implication: 滑行管理是蛙式特有的效率核心，是蛙式教學中最難靠觀察外部動作傳授的技術環節，必須靠感知建立。
- id: breast.tech.29
  stroke: breast
  category: comparison
  title: 蛙式的獨特性：每週期滑行管理
  summary: 在四式中，蛙式是唯一每個推進週期都有滑行、且滑行管理直接決定整體效率的泳式。
  mechanism:
    certainty: 🔵
    text: 蝶式無明顯滑行；仰式只在出發/轉身後有流線型滑行；蛙式每個週期必有滑行，且此滑行的長短與動能損失直接相關；這使蛙式的技術核心挑戰（手腳時序精度 + 滑行長度管理）與其他三式（蝶式的兩踢時序 + 波動連動鏈；仰式的肩旋轉連動 + 流線型管理）有本質差異。
  practical_implication: 蛙式效率的最終公式：最大化 insweep 推進力峰值 + 最小化收腿阻力（路徑 + 幅度）+ 最優滑行長度管理，三者整合品質決定最終速度。
- id: breast.tech.30
  stroke: breast
  category: kick
  title: 水面 vs 水下踢腿：波阻是主要差異來源
  summary: 水面蛙腿的收腿制動力比水下更大，outsweep 阻力係數也更高，主因是波阻而非渦流差異。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.tanaka-2025
    text: 水面收腿制動力 −173.5 N vs 水下 −134.0 N；outsweep 阻力係數水面 2.06 vs 水下 1.29；差異主因是波阻（波浪阻力）而非水中渦流結構本身的差異。
  evidence:
  - certainty: 🟢
    text: 水面比水下收腿制動力更大（−173.5 vs −134.0 N）；outsweep 阻力係數水面 2.06 > 水下 1.29；主因是波阻
    source: Tanaka et al. 2025
    source_ids:
    - src.tanaka-2025
  practical_implication: 水面蛙腿承受更大的阻力代價，解釋了為什麼流線型滑行在水面下進行以及波動對阻力管理的重要性。
  cross_ref: starts-turns.tech.32（水下比水面快的無波浪阻力機制，即本條的波阻差異）
  cross_ref_ids:
  - starts-turns.tech.32
- id: breast.tech.31
  stroke: breast
  category: concept
  title: 群體共識技術原則（解剖無關）
  summary: 四條技術原則有文獻或物理邏輯支持，不受個人解剖結構影響，對所有泳者成立。
  mechanism:
    certainty: 🟢
    evidence_from:
    - breast.tech.12
    - breast.tech.10
    - breast.tech.8
    - breast.tech.29
    text: ① insweep 腳速是推進力直接決定因子（r=0.89），加速度方向正確的前提下速度越快推進力越大；② 收腿是阻力最大時刻，縮短收腿時間是群體共識；③ arm-leg coordination 時序精度是精英和次精英最大差距——是技術問題非解剖問題；④ 滑行管理是蛙式特有的效率變數。
  practical_implication: 評估泳者問題時，應先區分這些解剖無關原則與解剖邊界限制，兩者的介入方向完全不同。
  cross_ref: 四條原則的承載條目（原 evidence_from）：breast.tech.12、breast.tech.10、breast.tech.8、breast.tech.29
  cross_ref_ids:
  - breast.tech.12
  - breast.tech.10
  - breast.tech.8
  - breast.tech.29
- id: fly.tech.1
  stroke: fly
  category: concept
  title: 蝶式動力鏈——胸廓起波、髖膝踝依序加速、兩踢接上手臂推進
  summary: 蝶式以胸廓／下肋啟動頭尾方向波動，運動波經髖、膝傳到踝腳並逐節增加振幅；第一踢接手臂入水與新一輪波動，第二踢接 insweep／push 形成週期內第二個速度峰值。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.veiga-2022
    - src.riewald-rodeo-2015
    text: 蝶式主要波形成分集中在第一正弦諧波H1，從髖到踝的振幅逐節增加；下軀幹角位移與UDK加速、減速階段的速度相關。完整蝶式把這條節段波與手臂推水、兩次下踢接成兩個推進峰。
  evidence:
  - certainty: 🟢
    text: UUS 系統與綜合回顧整理了競技泳者的軀幹—下肢運動學、頻率、振幅與節段時序，支持以完整週期而非單關節診斷。
    source: Veiga et al. 2022, UUS kinematics review
    source_ids:
    - src.veiga-2022
  - certainty: 🟠
    text: 兩踢、身體波動與手臂相位的完整蝶式教學模型來自兩本泳書的技術整合。
    source: Riewald & Rodeo (eds.), Science of Swimming Faster, 2015
    source_ids:
    - src.riewald-rodeo-2015
  practical_implication: '- **50m**：壓縮垂直振幅、提高波頻；保留胸—髖—腳順序與兩踢，只把波形做得短而快。

    - **100m**：使用中等波幅；第一踢守入水與前伸，第二踢守推水與回臂出水。

    - **200m**：使用完整但不過深的波形，以每次波動的前進距離與呼吸後回落速度控制能耗。

    - **膝先彎、腳先踢**：回到胸廓下壓—髖跟隨練習；先恢復近端到遠端順序，再加手臂。

    '
  cross_ref: 四式推進機制對比見 fly.tech.2
  cross_ref_ids:
  - fly.tech.2
- id: fly.tech.2
  stroke: fly
  category: comparison
  title: 四式推進機制與速度結構對比
  summary: 四式推進核心分別為旋轉耦合（自）、肩旋轉（仰）、全身波動（蝶）、雙脈衝（蛙），IVV由低至高排序為自→仰→蝶→蛙。
  mechanism:
    certainty: 🔵
    text: 蝶式速度主要決定因子為兩踢時機加 Insweep 品質；自由式為 SR×SL；蛙式為手腳時序；仰式為 SL 穩定性。
  practical_implication: 不同泳式的訓練優先項由推進機制決定，不能跨式套用策略。
- id: fly.tech.3
  stroke: fly
  category: undulation
  title: 波動 vs 上下擺動：最根本的概念區分
  summary: 正確的蝶式波動（Undulation）從胸骨/下肋啟動，能量沿體軸傳遞逐節放大（鞭打力學）；上下擺動是截然不同的錯誤模式。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.sanders-1995-a
    text: 波動能量主要集中在第一正弦諧波（H1），從髖傳到踝過程中振幅逐節增大，與鞭打力學（Whip-like Action）一致；上下擺動各部位獨立出力，阻力大且推進低效。
  evidence:
  - certainty: 🟢
    text: 確認蝶式波動以正弦H1波從髖傳至踝，振幅逐節增大
    source: Sanders, Cappaert & Devlin 1995
    source_ids:
    - src.sanders-1995-a
  practical_implication: 教學語言「壓胸起波」優於「踢腿驅動」，腳踢是波動的終點加速器而非起點。
- id: fly.tech.4
  stroke: fly
  category: undulation
  title: 六節點動力鏈——用最早失序點決定修正位置
  summary: 蝶式六節點依序為胸／下肋啟動、髖部跟隨與放大、膝部傳遞、踝腳末端加速、第一踢接入水、第二踢接推水。診斷時修正最早失序的節點，下游節點通常會隨順序恢復。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.veiga-2022
    - src.hall-murphy-2020
    text: 胸廓與髖的相位決定近端波形，膝與踝負責把波形轉成末端速度；第一踢把入水後的身體送回前伸流線，第二踢把腿部推進峰接到手臂insweep／push。越早出現的相位錯誤，影響的下游節點越多。「六節點」這個切法是 Hall & Murphy 泳書整合後的教學分段，不是文獻量測出來的節段界線——UUS 運動學文獻確認的是軀幹與下肢節段、頻率、振幅、時序共同決定表現，並未把身體切成這六段。
  evidence:
  - certainty: 🟢
    text: UUS 文獻確認軀幹與下肢節段運動學、頻率、振幅與時序共同決定水下波動表現。
    source: Veiga et al. 2022, UUS kinematics review
    source_ids:
    - src.veiga-2022
  - certainty: 🟠
    text: 六節點與兩踢角色是泳書整合後的教學模型。
    source: Hall & Murphy, Fundamentals of Fast Swimming, 2020
    source_ids:
    - src.hall-murphy-2020
  practical_implication: '依最早失序點處理：胸部不動→胸壓與body dolphin；髖未跟隨→小幅胸髖波；膝過早屈曲→直腿起波後延遲屈膝；踝腳速度不足→蹠屈活動度與末端快速鞭打；第一踢過晚→對齊手入水；第二踢過晚→對齊insweep／push。每次只修最早一點，再以15–25m時間與stroke count確認整條鏈恢復。

    '
- id: fly.tech.5
  stroke: fly
  category: undulation
  title: 波動幅度與頻率的距離差異化策略
  summary: 50m 用緊實平坦高頻波動；100m 中等幅度高划頻；200m 完整波動控制划頻，每次波動充分兌現能量。
  mechanism:
    certainty: 🟠
    observation_basis: 觀察者是美國泳隊教練 Andrew Sheaff 的公開教學評論（2022），不是本專案的教練觀測，也不是文獻；族群是他所帶的競技蝶式選手。外推邊界：「幅度壓縮但能量傳遞不變」目前沒有對應的運動學量測支持——沒有查到把 50m 與 200m 蝶式的垂直位移、節段時序並列量化的研究，所以「連續體不是開關」是教學判讀，不能寫成已量測的事實。
    text: 50m 的「波動消失」是誤解——能量仍從胸向腳傳遞，只是垂直幅度壓縮，節律更快；波動策略是連續體，不是開關。
  evidence:
  - certainty: 🟠
    text: 50m蝶式的技術不是波動消失，而是波動幅度壓縮後的緊湊版本
    source: Coach Andrew Sheaff 2022
    source_ids:
    - src.coach-andrew-sheaff-2022
  practical_implication: 不同距離的技術差異在於波動幅度與節律調配，不應按距離切換為本質不同的技術。
- id: fly.tech.6
  stroke: fly
  category: kick
  title: 兩踢功能高度不對稱：不可混同對待
  summary: 蝶式每划包含兩次功能完全不同的海豚踢，第一踢負責波動啟動與推進橋接，第二踢負責推進放大與恢復助力。
  mechanism:
    certainty: 🟠
    observation_basis: 「兩踢在時機、方向、任務上不同」是動作定義層的推導；真正需要觀察者背書的是**崩潰順序** （疲勞時第二踢先失守）。這條的來源是 Swim Like A Fish 的公開教學內容（2025），不是本專案的教練觀測，也未見量測研究；族群是一般競技蝶式訓練者，未分年齡與程度。外推邊界：沒有查到把疲勞條件下兩踢的推進力或時序分別量化、確認先後崩潰序的文獻，所以此順序只能當檢查的起手方向，不能當成必然。
    text: 兩踢在時機、方向、任務、協調難度上均不同；疲勞時第二踢先崩潰（協調難度最高），第一踢後崩潰；需分別針對性訓練。
  evidence:
  - certainty: 🟠
    text: 把兩踢當同一動作做兩次是最常見的訓練錯誤
    source: Swim Like A Fish 2025
    source_ids:
    - src.swim-like-a-fish-2025
  practical_implication: 訓練應明確區分兩踢任務，不用單一踢水口令覆蓋兩者。
- id: fly.tech.7
  stroke: fly
  category: kick
  title: 第一踢（Entry Kick）：波動啟動與推進橋接
  summary: 第一踢在手臂入水時執行，同時啟動波動鏈、填補推進空隙、定位身體深度影響捕水角度，是多數泳者最具推進力的踢。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.strzala-2017
    - src.maglischo-2003-b
    text: 第一踢的時機比值（entry-kick temporal index）與游速呈顯著負相關（r=−0.45）——第一踢越早執行，臂推進期越長，阻力越低；下踢使髖部上浮，協助手臂入水延伸對齊（EVF直接相關）。
  evidence:
  - certainty: 🟢
    text: entry-kick temporal index 與游速顯著負相關 r=−0.45；entry-kick 是速度獨立預測因子
    source: Strzała et al. 2017
    source_ids:
    - src.strzala-2017
  - certainty: 🟡
    text: 第一踢是多數泳者最具推進力的踢
    source: Maglischo 2003
    source_ids:
    - src.maglischo-2003-b
  practical_implication: 第一踢時機是可量化的訓練指標，精英訓練已開始量化其相對時機。
- id: fly.tech.8
  stroke: fly
  category: kick
  title: 第二踢（Exit Kick / Power Kick）：推進放大與恢復助力
  summary: 第二踢與 Upsweep 同步，腳踢力與手臂推力疊加，同時抬起髖部抵消出水重心下沉，為空中Recovery提供充分動量。
  mechanism:
    certainty: 🔵
    text: 第二踢是在對抗上半身出水重力的唯一踢，缺少它手臂必須靠背肩主動拉出水——是蝶式疲勞和肩傷的最常見機制之一；正確時序讓出水「被彈出去」而非「用力拉出去」。
  evidence:
  - certainty: 🟠
    text: 精英泳者第二踢穩定性是技術持續性的關鍵分界
    source: Swim Like A Fish 2025
    source_ids:
    - src.swim-like-a-fish-2025
  practical_implication: 第二踢與出水的同步是最容易被忽略但影響最大的時序問題，疲勞後需優先維持。
- id: fly.tech.9
  stroke: fly
  category: kick
  title: 兩踢推進貢獻量化與四式踢水對照
  summary: 蝶式兩踢合計推進比例約 80%，踢水節律固定為兩踢/划手（不可調整），協調難度為四式最高。
  mechanism:
    certainty: 🔵
    text: 踝關節是蝶式鞭打力學的終點加速器，柔韌性構成硬體上限；相較自由式（可選六拍或兩拍）蝶式踢水節律不可調整，是技術固定性最高的泳式。
  evidence:
  - certainty: 🟠
    text: 兩踢合計推進比例約 80%
    source: Swim Like A Fish 2025
    source_ids:
    - src.swim-like-a-fish-2025
  practical_implication: 踢水訓練是蝶式的核心不可簡化，踝關節訓練優先於腿部力量訓練。
  cross_ref: fly.tech.6（兩踢功能不對稱）、fly.tech.24（踝關節作為鞭打硬體上限）、free.tech.11／free.tech.12（文中對照的自由式六拍與兩拍可選節律）
  cross_ref_ids:
  - fly.tech.6
  - fly.tech.24
  - free.tech.11
  - free.tech.12
- id: fly.tech.10
  stroke: fly
  category: stroke-cycle
  title: 一個完整划手週期的閉環連動地圖
  summary: 蝶式一個划手週期由低頭入水→第一踢→外划捕水→內划上划→出水→第二踢→空中恢復→入水構成閉環，每節點同時完成自身任務並為下一步準備條件。
  mechanism:
    certainty: 🔵
    text: 任何節點的品質同時決定「接收多少上一步能量」與「給下一步輸送多少能量」——節點失品質的代價是雙向的。
  practical_implication: 技術診斷應從閉環角度定位斷裂點，而非孤立糾正單一動作。
- id: fly.tech.11
  stroke: fly
  category: stroke-cycle
  title: 五個推進加速峰值量化（Mason et al. 1992）
  summary: 精英蝶式選手每週期有五個推進加速峰值，Insweep 最大（4.2 m/s²），依次為第一踢（1.9）、第二踢+Upsweep（2.3）、外划（1.4）；乘波為非主動推進。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.mason-1992-b
    text: 峰值分布說明蝶式推進來自多個協調節點而非單一動作，各峰值間的時序連接品質決定整體速度。**「五個推進節點 + Insweep 為最大」這個定性結構至今未被推翻**，但具體數字（4.2 / 1.9 / 2.3 / 1.4 m/s²）來自 Mason 1992 單一研究（n 小）、現代影像分析尚未發表同等量化的替代研究，故**具體數值應視為單一研究結果而非定論**——實務上記住「Insweep 是最大、各峰值有時序」即可，不需精確數字。
  evidence:
  - certainty: 🟡
    text: 量化五個推進加速峰值：Insweep 4.2 m/s²、Entry Kick 1.9、Outsweep 1.4、第二踢+Upsweep 2.3（屬單一研究，定性順序仍被現代影像支持，具體數字屬歷史參考）
    source: Mason et al. 1992
    source_ids:
    - src.mason-1992-b
  practical_implication: Insweep 是最大推進相，其品質是訓練的最高優先項。
- id: fly.tech.12
  stroke: fly
  category: stroke-cycle
  title: 外划（Outsweep）功能重建：定位準備而非主動推進
  summary: 外划有約 1.4 m/s² 的推進力（升力機制），但不允許被主動強調；其核心功能是讓手臂到達 EVF 起始位置的捕水準備動作。
  mechanism:
    certainty: 🔵
    text: 主動外划干擾「減速→靜止→爆發」的節奏，壓縮 Insweep 的加速空間；理論最優幅度是「足以接收第一踢波動慣性、到達捕水位置所需的最小幅度」——過大或過小均為次優解。
  evidence:
  - certainty: 🟢
    text: 疲勞狀態下外划的手部方向偏移使有效推進力進一步下降，支持最小幅度外划原則
    source: Peyrebrune & Turner 2007
    source_ids:
    - src.peyrebrune-2007
  - certainty: 🟡
    text: 外划階段存在升力推進，但貢獻可能被部分研究高估
    source: Kudo et al. 2014
    source_ids:
    - src.kudo-2014
  practical_implication: 外划技術目標應設為「最小必要幅度的捕水位置準備」，不以外划形狀作為技術目標。
  cross_ref: 2024–2025 外划幅度縮小趨勢已成為精英教學主流演進方向
  cross_ref_ids:
  - fly.tech.35
- id: fly.tech.13
  stroke: fly
  category: stroke-cycle
  title: 五階段划水分析（外划→捕水→內划→上划→回臂）
  summary: 蝶式划水五階段功能依次為定位（外划）、槳面建立（捕水EVF）、主推進（內划）、推進疊加（上划+第二踢）、波動重置（回臂）。
  mechanism:
    certainty: 🔵
    text: 內划（Insweep）是主推進相，外划與捕水是它的空間定位前置；回臂是能量從水下移交空中的重置動作，初始動量品質決定下一週期波動起點。
  evidence:
  - certainty: 🔵
    text: 「精英比國家選手更早啟動 insweep」這項水準組間對照原本掛在 Nicol 等人（2022）的統合綜述下，但該綜述的收案範圍明確只有蛙式，全文提到蝶式僅一次、而且是用來說明蛙式與蝶式不同。蝶式目前查無同等的 insweep 起始時機組間對照研究（2026-09-05 以 PubMed 與 Crossref 各兩組關鍵字檢索）。因此本條只保留五階段的功能描述，不宣稱水準組間的時序差異。
  practical_implication: 划水技術訓練的核心是保護 Insweep 的爆發空間，外划不主動施力是前提。
- id: fly.tech.14
  stroke: fly
  category: stroke-cycle
  title: EVF（早期垂直前臂）在蝶式的實現路徑
  summary: 蝶式 EVF 通過外划完成空間定位→捕水時肘部彎曲下移→前臂旋轉至垂直後向位置三步實現；外划是 EVF 的準備動作。
  mechanism:
    certainty: 🔵
    text: 高肘讓上臂保持游進方向（阻力最小化），手掌和前臂同時面向後方（推進面積最大化）；此物理邏輯與自由式完全相同，但蝶式的實現路徑需依賴外划的空間定位。
  practical_implication: 沒有外划完成定位，前臂無法到達垂直後向位置——外划是功能性準備步驟，不是可省略的過渡動作。
- id: fly.tech.15
  stroke: fly
  category: stroke-cycle
  title: 蝶式划水與四式對比
  summary: 蝶式以拇指先 45° 切入入水，雙臂同步 S 形/橢圓路徑划水，水上低位弧線回臂；Insweep 峰值（4.2 m/s²）是四式最高量化推進峰值。
  mechanism:
    certainty: 🔵
    text: 蝶式雙側對稱划水與自由式交替、仰式交替在驅動模式上根本不同；蛙式 Insweep 與蝶式同為雙臂向內，但蛙式後接收腿循環，蝶式後接空中恢復。
  practical_implication: 混合式（IM）選手在蝶式與蛙式間切換是訓練難點，兩式的驅動邏輯不可互相代入。
- id: fly.tech.16
  stroke: fly
  category: head
  title: 頭部雙重角色：波動觸發器（低頭）+ 波動跟隨者（呼吸）
  summary: 低頭時頭部是波動觸發器（啟動胸部下壓能量注入波動鏈）；呼吸時頭部是波動跟隨者（沿波動切線方向前推）。
  mechanism:
    certainty: 🔵
    text: 單獨低頭而胸部不跟進只得到減阻效益，失去觸發效益——真正的波動觸發需要頭部+胸部協同下壓；頭部動作切換時機是技術精熟度的核心指標之一。
  practical_implication: 教學語言「壓胸」的物理原因正是頭+胸協同啟動波動，不只是流線型要求。
- id: fly.tech.17
  stroke: fly
  category: head
  title: 呼吸方向：向前（chin forward）而非向上（head up）
  summary: 正確呼吸方向是下巴沿波動切線方向前推（chin forward），不是頸椎後仰向上（head up）；後者強制斷裂波動鏈並大幅增加阻力。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.french-cfd-simulation-undated
    text: CFD 模擬確認頭部位置改變顯著修改泳者周圍的尾流結構，向上高抬（head up）在任何距離都不是最佳解；頸椎後仰使髖部強制下沉，阻力激增。
  evidence:
  - certainty: 🟢
    text: 頭部位置的改變顯著地改變泳者周圍的尾流結構，進而大幅修改水動力學表現
    source: 法國研究者 CFD 模擬（年份未指定）
    source_ids:
    - src.french-cfd-simulation-undated
  practical_implication: 「向前不向上」是蝶式換氣最重要的感知建立目標，Chin Forward 技術成熟者每划換氣速度損失極小。
  cross_ref: 呼吸策略的決定因子是換氣方式，不是換氣次數（見 fly.tech.30）
  cross_ref_ids:
  - fly.tech.30
- id: fly.tech.18
  stroke: fly
  category: timing
  title: 完整呼吸時序五節點
  summary: 正確呼吸視窗在手臂出水（Exit）→Recovery 起始之間：下巴向前推出，快速吸氣越短越好；Recovery 前半段頭部已回中性位。
  mechanism:
    certainty: 🔵
    text: 頭部在 Pull→Push 時完全埋頭；Push→Exit 時胸部自然上浮為頭部準備；手臂入水瞬間頭部完全中性，觸發下一波動。
  practical_implication: 呼吸時間越短阻力損失越小，應訓練呼吸為波動的跟隨動作而非主動抬頭動作。
- id: fly.tech.19
  stroke: fly
  category: head
  title: 蝶式頭部動作與四式對比
  summary: 蝶式和蛙式同為向前換氣（chin forward）；自由式側向換氣；仰式始終朝上無需主動抬頭；蝶式頭部在一週期內角色切換（觸發器→跟隨者）是四式中最複雜的。
  mechanism:
    certainty: 🔵
    text: 蝶式頭部的雙重角色（低頭觸發波動、抬頭接收波動）使其成為技術診斷的關鍵指標——頭部動作品質直接反映波動鏈的完整性。
  practical_implication: 蝶式換氣教學難點在「向前不向上」的感知建立，與蛙式雖方向相同但觸發機制不同。
  cross_ref: fly.tech.16（文中「頭部雙重角色：觸發器＋跟隨者」）、fly.tech.17（向前換氣 chin forward）
  cross_ref_ids:
  - fly.tech.16
  - fly.tech.17
- id: fly.tech.20
  stroke: fly
  category: stroke-cycle
  title: 出水順序與空中恢復（Recovery）的物理目標
  summary: 正確出水順序為肩→肘→前臂→小指先出；Recovery 目標是以最低能量在最短時間內回到能觸發高品質波動的入水位置，低位弧線路徑（貼近水面）最節能。
  mechanism:
    certainty: 🔵
    text: 低位 Recovery 依賴出水有初始動量、肩胛骨主動內收、肩關節足夠活動度三個前提；高舉弧線需三角肌主動抬臂，快速疲勞；第二踢與出水同步讓出水「被彈出去」而非主動拉出。
  practical_implication: Recovery 是系統重置動作，重置品質決定下一週期起點；低位路徑是能量守恆的結果，不只是技術習慣。
- id: fly.tech.21
  stroke: fly
  category: timing
  title: 入水停頓機制：水平動量轉換為垂直動量
  summary: 入水瞬間的受控停頓讓前向水平動量轉換為胸部下壓的垂直動量，直接助力第一踢腿加速；過快或過深入水反而讓動量在水的阻力中消散。
  mechanism:
    certainty: 🔵
    text: 入水停頓是能量轉換機制，不是技術猶豫——動量在介質切換時的方向轉換需要受控的減速緩衝區；跳過此環節等於丟失一部分由 Recovery 帶來的動能輸入。
  practical_implication: 入水技術目標是「拇指先 45° 切入後受控停頓」，不是持續向前衝入。
- id: fly.tech.22
  stroke: fly
  category: fatigue
  title: 蝶式疲勞崩潰五環序列
  summary: 崩潰依序：①第二踢力量下降→②Recovery抬高→③呼吸向上→④EVF崩潰→⑤第一踢消失；最終近乎純靠手臂划水，波動推進喪失。
  mechanism:
    certainty: 🔵
    text: 技術崩潰是神經系統執行最小努力原則的結果——選擇能量成本更低（效率也更低）的動作替代方案；第二踢因協調難度最高（對抗上半身出水）最先被捨棄。
  practical_implication: 訓練耐力的意義在於延遲崩潰序列的啟動時機，而非忽略各環節的崩潰規律。
- id: fly.tech.23
  stroke: fly
  category: fatigue
  title: 四式疲勞崩潰模式對比
  also_strokes:
  - free
  - back
  - breast
  summary: '四式的崩潰首環各不相同，而且都不在同一個層次上，不能套同一組觀察指標：


    - 自由式：SL（每划距離）先下降，泳者本能提高 SR 把速度感補回來，所以問題被掩蓋

    - 仰式：髖旋轉增加、肩旋轉仍維持——代償本身就是首環的可見形式

    - 蛙式：insweep 腳速下降（推進力直接損失），接著才是提早划手打斷滑行

    - 蝶式：第二踢力量下降，接著 Recovery 抬高；末期「游水上面」近乎喪失波動推進


    EVF 崩潰在自由式排第三、蝶式排第四，是兩式共同的中後段環節，不是任何一式的首環。'
  mechanism:
    certainty: 🔵
    evidence_from:
    - free.tech.24
    - back.tech.24
    - breast.tech.27
    - fly.tech.22
    text: '首環落在各式協調成本最高、能量代價最大的那個推進環節：蝶式的第二踢要對抗上半身出水，蛙式的 insweep 是腿部唯一直接產生推進的加速段，自由式的 SL 由整條動力鏈的品質決定，仰式的旋轉連動由核心穩定承擔。


      四式接著出現的都是同一種東西——用能量成本較低（效率也較低）的動作替代原本的動作：提高 SR、髖旋轉接手肩旋轉、提早划手、抬高 Recovery。所以疲勞的第一個可觀察訊號是「代償出現」，不是「幅度縮小」；等到幅度明顯縮水時，序列已經走到中段。'
  practical_implication: '疲勞抗性訓練要延後的是本式自己的首環，不是套用一組通用指標；觀察端同理，四式各盯各的：


    - 自由式：SL 是否在 SR 上升之前就先掉

    - 仰式：髖旋轉是否顯著增加（**不是**肩旋轉是否縮小）

    - 蛙式：insweep 腳速是否下降

    - 蝶式：第二踢是否消失'
  cross_ref: 四式各自的崩潰序列（本條的證據承擔者）：free.tech.24、back.tech.24、breast.tech.27、fly.tech.22
  cross_ref_ids:
  - fly.tech.22
  - free.tech.24
  - back.tech.24
  - breast.tech.27
- id: fly.tech.24
  stroke: fly
  category: hardware
  title: 踝關節蹠屈柔韌性：蝶式鞭打力學硬體上限
  summary: 踝關節蹠屈會影響蝶式末端推進面的方向，是值得評估的硬體條件；其優先順序與訓練效果不能由自由式相關研究直接決定。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.mccullough-2009-a
    text: 踝關節是波動傳遞鏈的末端，蹠屈幅度會影響腳部推進面的方向；把自由式 flutter-kick 的相關結果外推到蝶式屬生物力學綜合推論，McCullough 研究本身未測蝶式或訓練優先順序。
  evidence:
  - certainty: 🟡
    text: 女性自由式樣本中，踝蹠屈與 flutter-kick 速度呈中度相關（r=0.509）；蝶式外推尚未由該研究直接驗證。
    source: McCullough 2009
    source_ids:
    - src.mccullough-2009-a
  practical_implication: 蝶式踢水受限時可把踝蹠屈納入評估，但是否應優先於腿部力量須依個別限制與其他證據判斷。
  cross_ref: 四式踝關節柔韌性結論一致，見 fly.tech.34
  cross_ref_ids:
  - fly.tech.34
- id: fly.tech.25
  stroke: fly
  category: hardware
  title: 肩關節活動度：Recovery 低位路徑的硬體前提
  summary: 肩關節活動度是蝶式第二優先解剖能力，活動度不足時被迫走高舉弧線 Recovery（高能耗），並增加肩傷風險。
  mechanism:
    certainty: 🔵
    text: 低位 Recovery 需要肩關節能在低位角度完成前向弧線；活動度不足時三角肌被迫主動抬臂代償，快速疲勞；精英選手 Recovery 路徑低位化是近年技術主流趨勢，肩關節活動度訓練受重視程度提升。
  practical_implication: 肩關節活動度評估應在教學蝶式前進行，活動度不足先介入關節訓練再學低位 Recovery。
- id: fly.tech.26
  stroke: fly
  category: hardware
  title: 胸椎活動度：波動觸發品質的解剖前提
  summary: 胸椎活動度（Thoracic Mobility）是蝶式第三優先解剖能力，不足者胸部下壓起波的幅度與流暢度受限，影響波動觸發品質。
  mechanism:
    certainty: 🔵
    text: 胸部下壓是波動鏈的源頭；胸椎活動度限制波動的「發送端」幅度，導致波動能量輸入不足，後續各節點無足夠能量可放大與傳遞。
  practical_implication: 蝶式選手應定期評估胸椎活動度，限制者優先進行胸椎鬆動訓練。
  cross_ref: fly.tech.4（文中「後續各節點無足夠能量可放大與傳遞」＝六節點動力鏈）
  cross_ref_ids:
  - fly.tech.4
- id: fly.tech.27
  stroke: fly
  category: hardware
  title: 核心旋轉穩定性與前鋸肌耐力：波動導管與 EVF 硬體前提
  summary: 核心旋轉穩定性（第四優先）是波動傳遞的導管，核心不穩定則波動在腰部耗散；前鋸肌耐力（第五優先）是 EVF 硬體前提，疲勞後肩胛骨失穩導致捕水崩潰。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.pink-1993
    text: '核心穩定性需力量訓練提升；前鋸肌需耐力訓練（非力量訓練）——兩者訓練方式不同，不可混淆；前鋸肌疲勞是蝶式 EVF 崩潰的主要機制。


      **「耐力而非力量」這個訓練處方有直接的肌電證據**：蝶式肩部十二條肌肉的肌電圖分析發現，整個划水週期中維持高激活的是**前鋸肌與肩胛下肌**，其餘肌群都是分段作用、有休息空檔。作者據此指出這兩條肌肉特別易疲勞、也特別易受傷。持續激活的肌肉會先輸在耐力上，不是先輸在最大肌力上——這就是為什麼把前鋸肌當力量項目練會練錯方向。

      '
  practical_implication: 陸上訓練應包含前鋸肌耐力專項，而非只做腹肌或核心穩定力量訓練。肩胛下肌與前鋸肌同屬全程高激活，兩者應一併納入耐力課表；蝶式量大的週期若出現肩部症狀，先查這兩條的耐力狀態，再查姿勢角度。
- id: fly.tech.28
  stroke: fly
  category: errors
  title: 六個核心感知目標與對應執行目標
  summary: 六個蝶式教學感知目標（壓胸起波、下巴向前、手臂被彈出、外划輕內划爆、手臂低位飛、前額引導入水）各有對應的執行目標，兩者必須分開理解。
  mechanism:
    certainty: 🔵
    text: 感知到正確動作不等於能穩定執行；感知目標是教學語言，執行目標是技術原理——混淆兩者是蝶式教學最常見問題。
  practical_implication: 教學語言應從執行目標推導，確保感知目標指向正確的物理機制，避免誤導式口令。
  cross_ref: 六個感知目標中點名的執行層條目：fly.tech.17（下巴向前）、fly.tech.12（外划）、fly.tech.20（手臂低位飛／空中恢復）
  cross_ref_ids:
  - fly.tech.17
  - fly.tech.12
  - fly.tech.20
- id: fly.tech.29
  stroke: fly
  category: errors
  title: 常見技術錯誤：腰部彎曲代替胸部起波
  summary: 腰部過度彎曲代替胸部下壓起波是蝶式最常見的錯誤之一，產生「驢踢」式上下擺動，阻力大且推進低效。
  mechanism:
    certainty: 🔵
    text: 腰部彎曲是各部位獨立出力的「擺動」模式，無法形成正弦H1波的頭尾方向傳遞；胸部才是波動的發送端，腰部只是傳遞中介節點。
  practical_implication: 診斷時觀察動作起點在胸部還是腰部，不只看幅度大小。
  cross_ref: fly.tech.3（波動 vs 上下擺動的根本區分）、fly.tech.26（胸部作為波動發送端）
  cross_ref_ids:
  - fly.tech.3
  - fly.tech.26
- id: fly.tech.30
  stroke: fly
  category: tempo
  title: 不同距離的划頻策略與呼吸頻率
  summary: 50m：最大划頻+緊實波動，每 2 划或不換氣；100m：效率與速度平衡，精英主流每划換氣（Chin Forward 前提）；200m：波動品質優先，SL 是主要速度變數，後半段每划呼吸。
  mechanism:
    certainty: 🟠
    observation_basis: 本檔沒有記錄觀察者：這條原本掛的來源只寫「教練觀測 2024–2025」，既沒有人名也沒有機構，2026-09-04 檢視時判定為無法回溯的佔位來源，已移除。族群是國際級女子蝶式選手（Walsh、Huske 兩人的比賽畫面判讀）。外推邊界有兩層：① 從轉播畫面看得出「每划換氣」，但看不出「速度損失極小」——後者需要分段速度量測，本專案沒有，也未查到對應文獻； ② n=2 的菁英選手，不能推到一般訓練者身上。此條可用於說明「先看換氣技術再談換氣次數」的判斷順序，不可用來承諾每划換氣不會掉速。
    text: 呼吸策略的決定因子是換氣方式（Chin Forward 成熟度），不是換氣次數；Chin Forward 技術成熟者每划換氣速度損失極小，不受典型模式約束。
  evidence:
  - certainty: 🟠
    observation_basis: 與上方 mechanism 同一批觀察，觀察者未記錄；族群是 Walsh、Huske 兩位國際級女子蝶式選手的比賽畫面判讀（2024–2025 賽季）。外推邊界：n=2，畫面看得出換氣次數，看不出速度代價。
    text: 精英選手如 Walsh、Huske 採用每划換氣（Chin Forward 技術前提）
  practical_implication: 呼吸頻率訓練應以換氣技術成熟度為前提，而非直接套用精英的換氣次數模式。
- id: fly.tech.31
  stroke: fly
  category: streamline
  title: IVV（週期內速度波動）作為訓練指標
  summary: 精英蝶式 IVV 約 18.4%，顯著低於國家級（23.7%）；外划與 Recovery 相是主要變異來源；IVV 高於精英標準代表能量浪費。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.fernandes-2024
    text: IVV 反映週期內速度的穩定性，外划相是蝶式週期中最不穩定的技術環節，是精英與非精英最大差異來源之一；IVV 監控已被引入為訓練評估指標。
  evidence:
  - certainty: 🟢
    text: 精英蝶式 IVV（18.4%）顯著低於國家級（23.7%）；外划相是主要變異來源
    source: Fernandes et al. 2024
    source_ids:
    - src.fernandes-2024
  practical_implication: 外划技術優化有最高的 IVV 改善潛力，是精英與非精英差距最大的單一環節。
  cross_ref: fly.tech.12（外划相是主要變異來源）、fly.tech.20（Recovery 相）
  cross_ref_ids:
  - fly.tech.12
  - fly.tech.20
- id: fly.tech.32
  stroke: fly
  category: watersense
  title: 神經協調差異：精英 vs 休閒泳者的肌肉協調模式
  summary: 競技選手與休閒選手的肌肉協調模式（Synergy Analysis）存在顯著差異，精英泳者肌肉招募效率更高。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.yamakawa-2024
    text: 協調效率差異不只是肌力大小的問題，而是神經-肌肉系統的激活模式不同；精英泳者的高效協調是長期訓練後神經適應的結果，無法通過短期力量訓練直接獲得。
  evidence:
  - certainty: 🟢
    text: 競技選手 vs 休閒選手的肌肉協調模式（Synergy Analysis）存在顯著差異，精英泳者招募效率更高
    source: Yamakawa et al. 2024
    source_ids:
    - src.yamakawa-2024
  practical_implication: 蝶式技術訓練應包含神經協調層面的訓練設計，不只是體能和力量訓練。
- id: fly.tech.33
  stroke: fly
  category: comparison
  title: 蝶式 vs 蛙式：同為對稱泳式的技術根本分歧
  summary: 蝶式以波動傳遞為核心（要維持不中斷），蛙式以雙脈衝推進為核心（要縮短低速段）；兩式踢水功能、踝關節作用、IVV 特性均根本不同。
  mechanism:
    certainty: 🔵
    text: 蝶式波動本身是推進機制，中斷即失去推進；蛙式速度谷值管理是核心，低速段越短越好；混合式選手在兩式間切換是訓練難點，驅動邏輯不可互相代入。
  practical_implication: IM 訓練中蝶式和蛙式段落應使用完全不同的技術心智模型，不可混用教學語言。
- id: fly.tech.34
  stroke: fly
  category: comparison
  title: EVF 四式共通概念對比
  summary: EVF（高肘捕水）是自由式、仰式、蝶式、蛙式共通的核心捕水概念，物理邏輯相同（上臂平行游進=阻力最小；手掌朝後=推進面最大），但各式形成路徑和硬體前提不同。
  mechanism:
    certainty: 🔵
    text: 蝶式 EVF 需外划完成空間定位後建立，硬體前提為肩關節活動度；疲勞後蝶式外划時機偏移導致捕水位置漂移，是 EVF 崩潰的主要路徑。
  practical_implication: EVF 概念可跨式遷移，但各式的建立路徑和前提條件需分別理解，不可直接套用。
- id: fly.tech.35
  stroke: fly
  category: concept
  title: 2024–2025 技術教學主流演進趨勢
  summary: 主流演進包含：波動起點從腿踢轉向胸部/核心起波；第一踢時機精確化；外划幅度縮小趨勢；Recovery 低位化；IVV 監控普及；數位量化工具（PoolShark 等）取代主觀評估。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.fernandes-2024
    - src.strzala-2017
    text: Fernandes et al. 2024 確認外划相為精英與非精英最大差異來源；Strzała et al. 2017 entry-kick temporal index r=−0.45 已成為精英訓練量化依據；Recovery 低位化伴隨肩關節活動度訓練重視度提升。
  evidence:
  - certainty: 🟢
    text: 精英蝶式IVV（18.4%）顯著低於國家級（23.7%）
    source: Fernandes et al. 2024
    source_ids:
    - src.fernandes-2024
  practical_implication: 現代蝶式訓練日益依賴生物力學量化指標，訓練設計應整合 IVV 監控與時序量化工具。
  cross_ref: 演進趨勢逐項對應：fly.tech.26（胸部起波）、fly.tech.7（第一踢時機）、fly.tech.12（外划幅度縮小）、fly.tech.25（Recovery 低位化與肩活動度）、fly.tech.31（IVV 監控）
  cross_ref_ids:
  - fly.tech.26
  - fly.tech.7
  - fly.tech.12
  - fly.tech.25
  - fly.tech.31
- id: udk.tech.1
  stroke: udk
  category: concept
  title: 水下速度高於水面速度
  summary: 出發與轉身後水下速度通常高於水面游泳速度，UDK 讓泳者留在高速區間更長時間。
  mechanism:
    certainty: 🔵
    text: 水面游泳受波浪阻力影響，水下無此阻力；出發/轉身後初始速度遠高於游泳速度，水下可延長這個高速區間。
  practical_implication: UDK 是現代競技游泳技術投資報酬率最高的單一技術，每次出發與轉身後均應善用。
- id: udk.tech.2
  stroke: udk
  category: depth
  title: 最優水下深度範圍 0.4–0.6 m
  summary: 波浪阻力隨深度增加而下降，約 0.4–0.6 m 是實用最優深度範圍。
  mechanism:
    certainty: 🔵
    text: 波浪阻力非線性隨深度下降；0.4 m 可獲顯著阻力減少，0.6 m 比水面低約 20%，超過 0.75 m 無額外效益且增加上浮耗時。
  evidence:
  - certainty: 🟢
    text: 0.4 m 推薦推牆深度；0.6 m 阻力降約 20%（2.2 m/s 測量）
    source: Lyttle et al. 1998
    source_ids:
    - src.lyttle-1998
  - certainty: 🟢
    text: ≥ 0.7 m 波浪阻力 < 5% 總阻力，效益趨穩定
    source: ScienceDirect 波浪阻力研究
    source_ids:
    - src.sciencedirect-wave-drag-study
  - certainty: 🟢
    text: '> 0.75 m 無額外效益，反增上浮時間'
    source: Novais et al. 2012 (JHK)
    source_ids:
    - src.novais-2012-a
  practical_implication: 推牆後目標深度 0.4–0.6 m；過深反而增加上浮時間與能量消耗，應避免。
- id: udk.tech.3
  stroke: udk
  category: depth
  title: 精英選手水下速度顯著高於低層級選手
  summary: 世界錦標賽精英選手水下速度（2.54 m/s）顯著高於較低競技層級，水下速度是競技差距關鍵指標。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pla-2021
    text: 出水瞬間速度普遍高於中段游泳速度，水下確實是速度紅利區間；水下速度能力決定競技層級差距。
  evidence:
  - certainty: 🟢
    text: 精英 2.54 ± 0.05 m/s vs 次精英 2.46 / 2.38 m/s
    source: Pla et al. 2021, Frontiers in Physiology
    source_ids:
    - src.pla-2021
  practical_implication: 提升 UDK 絕對速度比延長水下距離更關鍵。
  cross_ref: udk.tech.1（文中「水下確實是速度紅利區間」）
  cross_ref_ids:
  - udk.tech.1
- id: udk.tech.4
  stroke: udk
  category: undulation
  title: UDK 是全身波動，不是腿部踢水
  summary: UDK 的推進力來自核心發動、向末梢傳遞的全身能量波，而非單純腿部踢水。
  mechanism:
    certainty: 🔵
    text: 能量傳導鏈：核心 → 髖 → 膝 → 踝 → 腳尖；核心啟動並穩定整個波動，髖是主要驅動節點，膝放大傳遞，踝決定推進面積。
  evidence:
  - certainty: 🟢
    text: 核心力量提升使踝關節力量增加 25%
    source: yourswimlog 核心力量研究；phantomlattice.com 生物力學分析
    source_ids:
    - src.yourswimlog-phantomlattice-core
  practical_implication: 訓練 UDK 必須從核心穩定性出發，「腿踢更用力」的思路無法觸及推進力的根源。
- id: udk.tech.5
  stroke: udk
  category: undulation
  title: 核心肌群在踢腿週期中輪替激活
  summary: 腹肌、腹斜肌、豎脊肌、多裂肌在踢腿各相輪替主導，確保核心全程穩定。
  mechanism:
    certainty: 🔴
    text: 過渡期（上踢→下踢）：腹肌 + 腹斜肌；下踢相：豎脊肌 + 多裂肌；上踢→下踢過渡：腹斜肌 + 豎脊肌再次激活。
  practical_implication: 核心訓練需涵蓋前側與後側肌群，非單一「收腹」即可；不同踢相有不同主導肌群。
- id: udk.tech.6
  stroke: udk
  category: kick
  title: 下踢末段渦流噴射機制
  summary: 下踢結束時髖外旋使雙腳聚攏，產生渦流叢與噴流，直接轉化為前進動能。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.university-of-tsukuba-2024-journal-of-biomec-2024
    text: 下踢末段髖部外旋 + 雙腳聚攏產生強烈渦流叢（vortex cluster）與噴流（jet flow）；游速越快，渦流越強，推進力越大。
  evidence:
  - certainty: 🟢
    text: 粒子影像測速（PIV）直接可視化 UDK 水流動態，確認渦流噴射機制
    source: University of Tsukuba 2024, Journal of Biomechanics
    source_ids:
    - src.university-of-tsukuba-2024-journal-of-biomec-2024
  practical_implication: 下踢末段的髖外旋 + 腳尖聚攏是觸發渦流噴射的關鍵動作，不可省略。
- id: udk.tech.7
  stroke: udk
  category: kick
  title: 下踢→上踢過渡的渦流回收（Vortex Recapture）
  summary: 從下踢快速切換到上踢的瞬間，可回收下踢已製造的水流能量，為上踢提供額外推進力。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.university-of-tsukuba-2024-journal-of-biomec-2024
    text: 下踢→上踢快速切換能最大化渦流回收；此效應在速度越高時越顯著，UDK 具正向回饋特性。
  evidence:
  - certainty: 🟢
    text: PIV 可視化確認渦流回收機制
    source: University of Tsukuba 2024, Journal of Biomechanics
    source_ids:
    - src.university-of-tsukuba-2024-journal-of-biomec-2024
  practical_implication: 縮短上踢過渡時間（快速切換）是利用渦流回收的關鍵；慢速上踢不只阻力大，還浪費下踢已製造的能量。
- id: udk.tech.8
  stroke: udk
  category: concept
  title: Strouhal 數與人類 UDK 推進效率
  summary: 人類 UDK 的 Strouhal 數（~0.80）遠高於最優範圍（0.25–0.35），推進效率天生低於海洋哺乳動物。
  mechanism:
    certainty: 🔵
    text: St = 踢腿頻率 × 振幅 ÷ 速度；人類裸泳效率 11–29%，單蛙鞋可達 82%。降低 St 的方法：在相同頻率下增大振幅，或在相同振幅下降低頻率，但兩者均有制約。
  evidence:
  - certainty: 🟢
    text: 人類 UDK St ~0.80；monofin St ~0.34；魚類最優 0.25–0.35
    source: Zamparo et al. 2009, J Biomech Eng; Rohr & Fish 2004
    source_ids:
    - src.zamparo
  practical_implication: 裸泳提升效率的方向是在現有頻率下改善技術質量（振幅/渦流利用），而非單純追求更快的踢頻。
- id: udk.tech.9
  stroke: udk
  category: kick
  title: 下踢力學序列與膝蓋彎曲的核心矛盾
  summary: 下踢由髖屈曲啟動，末段髖外旋聚攏腳尖觸發渦流；下踢前膝蓋彎曲是主要減速源，但一定程度的膝屈曲是蓄力必要條件。
  mechanism:
    certainty: 🔵
    text: 動作序列：髖屈曲啟動 → 膝蓋伸展（股直肌）踢出 → 下踢末段髖外旋 + 雙腳聚攏 + 踝蹠屈最大化 → 渦流噴射推進。膝屈曲的最優範圍不是推導得出來的，見下方證據。
  evidence:
  - certainty: 🟢
    text: 從髖到膝到踝的縱向加速度增加，與水平速度最大化直接相關
    source: Kinematic differences research (ResearchGate)
    source_ids:
    - src.researchgate-kinematic-differences
  - certainty: 🟠
    text: 下踢前膝蓋彎曲是主要減速來源——腿向前收的速度與膝彎曲的程度對減速量有巨大影響
    source: The Race Club — More on the Dolphin Kick
    source_ids:
    - src.the-race-club-dolphin-kick-deceleration
  - certainty: 🟠
    caveat: '**更正（2026-09-05）**：本條原本寫「最優膝屈曲約 30–40°」並掛在 The Race Club 名下， **與該來源說的相反**——回查原文，它寫的是理想範圍 55–75°，且明講低於 55° 會推進不足。 30–40° 追不到任何來源，等於教人往「推進不足」的方向少彎，已更正為原文數字。原本還標 🟢（近期文獻），也一併改 🟠：theraceclub.com 是教練發表的專欄，不是文獻。'
    text: 理想膝屈曲約 55–75°；低於 55° 下踢推進不足，高於 75° 弊大於利
    source: The Race Club — Getting the Freestyle Kick Right
    source_ids:
    - src.the-race-club-freestyle-kick-knee-bend
  practical_implication: 教學重點是控制膝蓋彎曲幅度，而非完全消除；過度彎曲造成正面阻力，但零彎曲無法蓄力。
- id: udk.tech.10
  stroke: udk
  category: kick
  title: 上踢是 UDK 速度的關鍵預測變數
  summary: 下踢與上踢腳尖速度的比值與水平游速呈顯著負相關——相對上踢越強，游速越快。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.atkison-2014-a
    text: 上踢三重貢獻：① 縮短上踢時間 → 提升有效踢頻；② 減少腿在最低點（最大阻力）的停留；③ 快速切換觸發渦流回收。
  evidence:
  - certainty: 🟢
    text: 下踢/上踢腳尖速度比值與水平游速呈顯著負相關
    source: Atkison et al. 2014, PubMed 24290609
    source_ids:
    - src.atkison-2014-a
  practical_implication: 多數選手下踢已接近個人上限，訓練上踢有更高的投資報酬率。
- id: udk.tech.11
  stroke: udk
  category: comparison
  title: UDK 上踢 vs 水面蝶式上踢的根本差異
  summary: 水面蝶式的上踢是回復動作；UDK 的上踢是推進動作之一——這是兩者最重要的感知差異。
  mechanism:
    certainty: 🔵
    text: 水面蝶式因波浪阻力與呼吸需求，上踢以恢復為主；UDK 無波浪阻力干擾，上踢可完整貢獻推進力並回收渦流。
  practical_implication: 從蝶式轉換到 UDK 訓練時，必須重建上踢的感知框架，由「回復感」轉為「推進感」。
- id: udk.tech.12
  stroke: udk
  category: kick
  title: 踢腿對稱性（Sagittal Kick Symmetry）
  summary: 踢腿對稱性指上踢與下踢各自均能產生推進力；多數選手天生偏向下踢，上踢薄弱。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.atkison-2014-a
    text: 對稱性越高，質心速度越穩定，效率越高；海豚能達到真正對稱，人類天生偏向下踢優先。
  evidence:
  - certainty: 🟢
    text: 踢腿對稱性與 UDK 效率正相關
    source: Atkison et al. 2014, PubMed 24290609; ScienceDirect
    source_ids:
    - src.atkison-2014-a
  practical_implication: 訓練重點應放在改善上踢，而非繼續強化已接近上限的下踢。
- id: udk.tech.13
  stroke: udk
  category: tempo
  title: 強迫提高踢頻不提升速度，振幅自動補償
  summary: 強迫超出個人最大踢頻後，振幅縮小精確抵消頻率提升，速度不變但體力消耗上升。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmid-28605694
    text: 強迫踢頻提升 15% 後，振幅自動下降使 Froude 效率從 0.72 降至 0.70，游速無變化；最優踢頻是個體特異的，受身體形態、踝柔韌性、核心力量、疲勞狀態影響。
  evidence:
  - certainty: 🟢
    text: 強迫 115% 踢頻實驗：游速無變化，Froude 效率 0.72 → 0.70
    source: Yamakawa, K. K., et al. (2017). Effect of increased kick frequency on propelling efficiency and muscular co-activation during underwater dolphin kick. Human Movement Science, 54, 276–286.
    source_ids:
    - src.pmid-28605694
  practical_implication: 正確訓練邏輯是「在現有頻率下踢得更有效率」；頻率提升應是技術改善的結果，而非訓練手段。
- id: udk.tech.14
  stroke: udk
  category: hardware
  title: 踝關節蹠屈柔韌性是 UDK 速度的硬體上限
  summary: 蹠屈範圍不足會壓低腳背的有效推進面積並拖慢速度；但「範圍越大越快」沒有得到支持——實驗中增加蹠屈的條件並未比一般條件更快。這是下限條件，不是可以一直往上推的效能旋鈕。
  mechanism:
    certainty: 🔵
    text: 蹠屈角度決定腳背有多少面積朝向水流，這可以解釋為什麼範圍不足會扣分。但同一個推導只支持「不足會扣分」，不支持「超過一般範圍還能加分」——後者在實驗條件下沒有出現，見下方增加蹠屈條件的結果。
  evidence:
  - certainty: 🟢
    text: 以貼紮把最大蹠屈限制約 30%，游速下降 19.5%；同一研究中蹠屈與內旋柔韌性受限顯著降低 UDK 表現，並伴隨膝往更大屈曲的動作型態改變
    source: Willems et al. 2014 (PMID 24984154)
    source_ids:
    - src.pmid-24984154
  - certainty: 🟢
    text: 另一組獨立樣本（10 名受過良好訓練的泳者，5 男 5 女）以貼紮限制最大蹠屈 10.42%，游速由 1.20 ± 0.14 降至 1.13 ± 0.13 m/s、踢腿效率由 0.72 ± 0.10 降至 0.69 ± 0.09 m；但「增加蹠屈」條件的游速與效率並未優於一般條件
    source: Kuhn & Legerlotz 2022 (PMC9402090)
    source_ids:
    - src.pmc9402090-b
  practical_implication: 可用來排除「範圍不足」這個限制，不能用來推銷加大範圍。介入怎麼做屬於介入層（見 cross_ref），該層已明寫沒有長期伸展介入試驗、也沒有劑量來源；本點不在此另給訓練處方。
  cross_ref: movement.intervention.ankle-plantarflexion.conditional-mobility（踝蹠屈受限時的條件式活動度介入）
  cross_ref_ids:
  - movement.intervention.ankle-plantarflexion.conditional-mobility
- id: udk.tech.15
  stroke: udk
  category: hardware
  title: 踝關節柔韌性不足的代償模式：膝蓋彎曲增加
  summary: 踝關節蹠屈受限時，泳者以加大膝蓋彎曲代償，但膝蓋彎曲是主要正面阻力來源，代償加速速度下降。辨識重點是先分清「踝硬所以膝彎」還是「技術問題所以膝彎」，兩者水中長得很像。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmc9402090-b
    - src.pmid-24984154
    text: 腳背無法完整朝後展開 → 泳者加大膝蓋彎曲試圖維持推進 → 膝蓋彎曲產生正面阻力 → 速度反而下降；此代償已在多項研究中重複觀察。
  evidence:
  - certainty: 🟢
    text: 踝關節蹠屈受限 → 踢腿時膝蓋彎曲增加，為最具體可觀察指標
    source: Kuhn & Legerlotz 2022 (PMC9402090); Willems et al. 2014 (PMID 24984154)
    source_ids:
    - src.pmc9402090-b
    - src.pmid-24984154
  - certainty: 🔵
    text: 代償出現在哪一相（上踢或下踢）在庫內尚未定論——本庫原寫上踢相，而 Kuhn & Legerlotz 2022 討論段轉述 Willems 時寫的是下踢的代償性屈膝。兩者並列，不選邊；辨識時不要靠相位當判準，該看的是同一泳者的膝彎幅度與其陸上蹠屈範圍是否對得起來。
  practical_implication: '辨識順序（不要從水中的膝角度起手，那個角度在水下本來就估不準，也不需要精確到度數）：

    1. **先在陸上看被動蹠屈**：讓泳者俯臥、膝伸直，放鬆讓腳背往下垂。腳背能否接近與小腿成一直線，一眼可辨；左右不對稱也在這步看得出來。

    2. **再回水中看膝彎**：若陸上蹠屈明顯受限、水中又靠加大膝彎推進，兩邊對得起來 → 硬體邊界，走活動度路線。

    3. **若陸上蹠屈正常但水中仍大幅屈膝** → 不是踝的問題，是踢腿的發動與節律，別再往拉腳踝的方向投時間。

    比較永遠對泳者自己的兩次觀察做（陸上 vs 水中、介入前 vs 介入後），不對一個跨人的角度門檻做。

    '
  cross_ref: movement.intervention.ankle-plantarflexion.conditional-mobility（踝蹠屈受限時的條件式活動度介入，含尚未解決的邊界）
  cross_ref_ids:
  - movement.intervention.ankle-plantarflexion.conditional-mobility
- id: udk.tech.16
  stroke: udk
  category: hardware
  title: 踝關節柔韌性與力量缺一不可
  summary: 柔韌性好但力量弱則踢腿軟；力量強但柔韌性差則推進面積小；理想狀態是柔韌的踝關節加上強而穩定的踝部肌群。
  mechanism:
    certainty: 🔵
    text: 柔韌性決定腳面對準水流的有效面積；力量決定蹠屈末端能否維持穩定而非「軟掉」；兩者相乘才能完整輸出推進力。
  practical_implication: 踝關節訓練需同時包含蹠屈柔韌性伸展和蹠屈肌群力量訓練，不可偏廢。
  cross_ref: udk.tech.14（蹠屈柔韌性作為 UDK 速度硬體上限）
  cross_ref_ids:
  - udk.tech.14
- id: udk.tech.17
  stroke: udk
  category: depth
  title: UDK 起踢規則——滑到個人滑行／海豚踢交叉速度就開始踢
  summary: 推牆後速度高於個人「流線滑行—海豚踢」淨力交叉速度時保持流線；速度降到交叉點就開始UDK。若離牆後已接近或低於交叉速度，直接起踢。群體研究的實用起點約1.9–2.2 m/s，精英泳者應以個人力—速度曲線校準。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.takeda-2026
    text: 流線滑行、UDK與水面自由式各有不同的淨力—速度曲線；兩條曲線的交點就是切換速度。高於交點時流線滑行的阻力較小；低於交點後UDK能提供較佳淨力，因此應在交點開始推進。下一個UDK—水面自由式交點同理決定breakout。
  evidence:
  - certainty: 🟠
    text: 精英選手實測：自由式 Aaron Greenberg 立刻起踢比短暫滑行快 0.1 秒、比長時間滑行快 0.18 秒（5 公尺）；仰式 Amy Bilquist 立刻下踢比短滑行快 0.1 秒，長滑行則慢 0.16 秒
    source: The Race Club — Turn Techniques Part I（velocity meter 實測）
    source_ids:
    - src.the-race-club-turn-when-to-start-dolphin-kick
  - certainty: 🟢
    text: 建立「流線型滑行 → UDK → 出水划手」三狀態最優轉換速度模型，確認大多數精英選手最優起踢速度高於水面游泳速度
    source: Takeda et al. 2026, glide–DK–front-crawl transition
    source_ids:
    - src.takeda-2026
  - certainty: 🟢
    text: 16名有經驗男子泳者的拖曳測試得到1.9–2.2 m/s的群體最佳起踢速度區間。
    source: Lyttle et al. 2000, net forces during glide and kicking
    source_ids:
    - src.lyttle-2000
  practical_implication: '- **有速度計／牽引量測**：建立個人流線、UDK與水面泳的淨力—速度曲線，在SL–DK交點起踢、DK–水面泳交點breakout。

    - **沒有儀器**：以1.9–2.2 m/s作第一起點，拍攝立即、短滑、長滑三種5m／10m測試；選擇速度最低點最高且10m最快的版本。

    - **推牆弱或第一踢能力強，離牆後很快落到交點**：直接或極短滑行後起踢。

    - **推牆速度高、流線阻力低，過早踢會增加主動阻力**：先滑到交點再踢。

    '
- id: udk.tech.18
  stroke: udk
  category: depth
  title: 最優水下距離由個人速度衰減曲線決定
  summary: 最優水下距離等於個人水下速度衰減曲線與水面游泳速度的交叉點，超過交叉點繼續踢腿等於用力減速。
  mechanism:
    certainty: 🔵
    text: 交叉點由 UDK 速度能力、泳式、比賽距離、疲勞狀態共同決定；較快的精英選手優勢來自更快的水下速度，而非更長的水下距離。
  evidence:
  - certainty: 🟢
    text: 精英選手優勢來自更快的水下速度，而非更長的水下距離
    source: Frontiers in Physiology 2021, PMC8442910
    source_ids:
    - src.pmc8442910-a
  practical_implication: 品質優先於數量；用更少但更有力的踢腿覆蓋距離，比用更多但速度已衰減的踢腿更有效。
- id: udk.tech.19
  stroke: udk
  category: depth
  title: 長水下距離的代謝代價：乳酸超過兩倍但速度無差異
  summary: 長水下距離（12.5 m）賽後血乳酸濃度（~7.9 mmol/L）超過短水下（~3.5 mmol/L）兩倍，但 25 m 速度無顯著差異。
  mechanism:
    certainty: 🔵
    text: 機制一：滑行過久 → 速度衰減超過游泳速度 → 重新加速需補償性爆發 → 乳酸產生速率瞬間超過清除速率。機制二：水下 CO₂ 排出窗口消失 → 血液酸化 → 後續划手乳酸堆積速率持續偏高。
  evidence:
  - certainty: 🟢
    text: 長水下（12.5 m）乳酸 ~7.9 mmol/L vs 短水下（<5 m）~3.5 mmol/L，速度無顯著差異
    source: Venckunas & Achramavicius 2024, Sports, PMC11125574
    source_ids:
    - src.hvid-2024
  practical_implication: 對 FINA 分數 < 800 的選手，延長水下距離幾乎確定是反效果——UDK 速度不足時，代謝代價超過速度紅利。
- id: udk.tech.20
  stroke: udk
  category: depth
  title: 速度穩定性優先於速度峰值
  summary: 速度平滑的選手即使每圈略慢，乳酸清除效率遠優於每次轉身後速度大起大落的選手，差異在比賽後半段完整放大。
  mechanism:
    certainty: 🔵
    text: 速度震盪引發補償性爆發 → 瞬間強度超過有氧閾值 → 乳酸不可逆堆積；轉身技術不好不只造成單次損失，而是每次轉身後加速乳酸的累積性惡化。
  practical_implication: 長距離比賽的水下策略目標是速度穩定，而非最大化每圈水下距離。
- id: udk.tech.21
  stroke: udk
  category: depth
  title: 短水道短距離的水下策略有不同代謝邏輯
  summary: 長水道長距離的乳酸研究結論不可直接套用到短水道短距離，兩者代謝本質不同。
  mechanism:
    certainty: 🔵
    text: 長水道長距離超時滑行以有氧系統為主（研究清楚）；短水道短距離極限水下為磷酸 + 無氧系統爆發。**這是基於通用代謝系統知識的推導**——短水道每 15-25m 一轉，水下推進佔總賽程比例極高（每次轉身可貢獻 7-10m 水下），密集無氧爆發累積，乳酸代謝曲線與長水道長距離本質不同。**目前仍是游泳運動科學的真實研究空白**——沒有同時量測短水道菁英選手連續水下段的乳酸動態研究發表。
  practical_implication: 短水道短距離極限水下策略目前缺乏高品質研究依據；不可直接套用長水道乳酸耐受訓練法；實務上以無氧能力訓練（短距重複 + 充分恢復）+ 水下技術效率優化為主，等實證研究出現再調整。
  cross_ref: 本條界定適用邊界的兩個長水道結論：udk.tech.19（長水下距離的乳酸代價）、udk.tech.20（速度穩定性與乳酸清除）
  cross_ref_ids:
  - udk.tech.19
  - udk.tech.20
- id: udk.tech.22
  stroke: udk
  category: comparison
  title: 仰式 UDK 效率高於俯式的物理原因
  summary: 仰式 UDK 雖每踢峰值加速度較小，但速度損失少、穩定性高，整體效率反而優於俯式。
  mechanism:
    certainty: 🔵
    text: 俯式下踢方向與浮力同向，合力讓身體易過早浮出，需額外補償；仰式下踢對抗浮力，深度自然平衡，速度損失少，整體效率更高。
  evidence:
  - certainty: 🟢
    text: 俯臥下踢峰值速度超 2 m/s 但速度波動達 0.5 m/s；仰臥速度曲線明顯更平緩
    source: SwimSwam Junya Koga analysis; WKU Digital Commons Kinematic Comparison
    source_ids:
    - src.swimswam-koga-wku-kinematic
  practical_implication: 仰式選手不應追求下踢的爆發峰值感，而應以速度維持穩定為感知目標。
- id: udk.tech.23
  stroke: udk
  category: comparison
  title: 各泳式水下距離策略差異
  summary: 不同泳式因水下耗能與水面效率差異，最優水下距離策略不同；蛙式不適用 UDK。
  mechanism:
    certainty: 🔵
    text: 自由式：中等距離視個人能力；仰式：可能較長（UDK 效率機制較優）；蝶式：可能較短（水下耗體力，出水划手恢復效益大）；蛙式：改為 pullout（規則限制）。
  practical_implication: 各泳式的水下距離策略需個別評估，不可一概而論。
  cross_ref: 逐式點名：udk.tech.22（仰式 UDK 效率較優）、udk.tech.18（自由式視個人速度衰減曲線）、starts-turns.tech.35（蛙式改為 pullout）
  cross_ref_ids:
  - udk.tech.22
  - udk.tech.18
  - starts-turns.tech.35
- id: udk.tech.24
  stroke: udk
  category: streamline
  title: 流線型品質是 UDK 速度的底板
  summary: 流線型不穩定時訓練踢腿，等於在漏水的容器裡加水——任何踢腿改善都會被阻力洩漏抵消。
  mechanism:
    certainty: 🔵
    text: 雙手疊合夾耳、頭部中立受控（穩定錨點而非波動起點，受控不等於僵直）、腹部收緊、踢腿振幅保持在身體輪廓線內，才能將踢腿推進力完整轉化為前進速度。
  evidence:
  - certainty: 🟠
    text: 原文把「成功的水下踢腿」拆成四個並列要素：建立穩定平台、盡量製造推進、上下兩個方向的推進與節奏對等、維持降低阻力的體態；四項裡兩項是姿態而非力量。
    source: Sheaff, A. (2022). How to Do Underwater Kicks. U.S. Masters Swimming.
    source_ids:
    - src.usms-sheaff-2022-how-to-do-underwater-kicks
  practical_implication: UDK 訓練的先決條件是流線型品質；流線型訓練優先於踢腿力量訓練。
- id: udk.tech.25
  stroke: udk
  category: kick
  title: Monofin 訓練暴露上踢弱點並建立上踢推進感知
  summary: Monofin 強迫兩方向均等踢腿，裸眼即可暴露上踢弱點，訓練效果顯著。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.yourswimlog-monofin
    text: Monofin 需要上踢主動出力才能移動裝備，建立上踢推進感知；含 monofin 速度可達 2.5 m/s，徒手約 1.2 m/s。
  evidence:
  - certainty: 🟢
    text: Monofin 訓練效果與上踢感知建立
    source: yourswimlog monofin 研究
    source_ids:
    - src.yourswimlog-monofin
  practical_implication: Monofin 是上踢訓練最有效的工具之一，可作為上踢弱點的診斷與訓練手段。
  cross_ref: udk.tech.10（Monofin 暴露的正是上踢這個關鍵預測變數）
  cross_ref_ids:
  - udk.tech.10
- id: udk.tech.26
  stroke: udk
  category: kick
  title: UDK 訓練 4 個月介入可顯著提升速度
  summary: 在常規訓練中加入每次約 10 分鐘 UDK 專項組，4 個月後男子速度提升 4.6%，女子提升 2.7%。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.elite-japanese-swimmer-4month
    text: 持續專項訓練能有效改善 UDK 技術，速度提升效果可在精英選手群體中觀察到。
  evidence:
  - certainty: 🟢
    text: 男子：1.73 → 1.81 m/s（+4.6%）；女子：1.49 → 1.53 m/s（+2.7%）
    source: Elite Japanese swimmer study, 4-month intervention
    source_ids:
    - src.elite-japanese-swimmer-4month
  practical_implication: 每次訓練加入 ~10 分鐘 UDK 專項組，是具實證支持的高效率投資方式。
- id: udk.tech.27
  stroke: udk
  category: tempo
  title: 節拍器訓練目標是節奏穩定，不是強迫提速
  summary: Tempo Trainer 節拍器控制踢腿節奏的目標是穩定節奏，而非強迫提速；Gonjo 2017 已確認強迫高踢頻無效。
  mechanism:
    certainty: 🟢
    evidence_from:
    - udk.tech.13
    text: 穩定節奏訓練能建立一致的踢腿週期，避免疲勞時節律崩潰；強迫超出個人最優踢頻只會降低效率。
  practical_implication: 使用節拍器時設定在選手當前自然踢頻附近，以節律穩定為目標，不設定超出能力的高頻率。
  cross_ref: udk.tech.13（原 evidence_from：強迫提高踢頻不提升速度）
  cross_ref_ids:
  - udk.tech.13
- id: udk.tech.28
  stroke: udk
  category: kick
  title: 踝關節蹠屈柔韌性：限制實驗支持關聯，伸展訓練效果沒有試驗支持
  summary: 現有依據是「把活動度限制住會變慢」的反向實驗，不是「拉鬆會變快」的訓練試驗。因此本點不列訓練動作、不給時程與劑量，也不宣稱柔韌性訓練能提升 UDK 表現。
  mechanism:
    certainty: 🔵
    text: 限制活動度後表現下降，可以支持「可用蹠屈範圍是表現的必要條件之一」，但不能反推「增加範圍就會增加表現」。前者是從原本未受限的人身上移除既有條件，後者要對原本就受限的人施加訓練並追蹤表現，受試狀態與因果方向都不同，前者不蘊含後者。庫內沒有後者的試驗，所以柔韌性訓練要多久見效、用哪些動作、多少劑量，在本專案都無依據可寫。
  evidence:
  - certainty: 🟢
    text: 以貼紮把最大蹠屈限制約 30%，游速下降 19.5%。這是在原本未受限的人身上移除既有範圍的限制實驗，支持蹠屈範圍與 UDK 表現之間存在關聯；本點不由此推出伸展訓練能提升表現。另一組樣本中「增加蹠屈」條件並未比一般條件更快（見 udk.tech.14），反向支持這個限度。
    source: Willems et al. 2014 (PMID 24984154)
    source_ids:
    - src.pmid-24984154
  practical_implication: 介入怎麼做屬於介入層，不在本點。該層記錄已明寫「沒有能支撐本處方的長期伸展介入試驗；既有急性伸展操作不是訓練試驗」，以及「本條沒有可支撐維持時間、次數、組數或週頻率的來源，因此不給定數字」。本點不另立一套訓練動作與週期時程去繞過那個邊界。
  cross_ref: movement.intervention.ankle-plantarflexion.conditional-mobility（踝蹠屈受限時的條件式活動度介入，含尚未解決的邊界）
  cross_ref_ids:
  - movement.intervention.ankle-plantarflexion.conditional-mobility
- id: udk.tech.29
  stroke: udk
  category: streamline
  title: 出發與轉身的起踢時機差異
  summary: 出發入水後需要短暫姿勢整合窗口（從空中進入水中確立流線型），起踢時機與轉身略有不同。
  mechanism:
    certainty: 🔵
    text: '兩段差異基於物理推導：

      - **出發**：從空中進入水中經歷介質改變（空氣→水）+ 高速衝擊（5-6 m/s 入水），身體需要短暫姿勢確立才能進入有效 streamline。**這個窗口的最優時機目前是研究空白**——沒有發表研究量化「入水後幾毫秒起踢最佳」。

      - **轉身**：已在水中、姿勢連續、推蹬力直接轉換為水下動能，可立刻起踢。

      現有共識：出發後等待約 0.3-0.5 秒確立 hyperstreamline 再起踢、轉身後 0.1 秒內起踢——但這些數字屬教練體系觀察，不是實驗研究結論。

      '
  practical_implication: 教學時出發與轉身的起踢時機指導需分開處理，不可完全套用轉身的「立刻起踢」原則；出發後 0.3-0.5 秒 streamline 確立窗口為教練觀測共識（非實驗實證），可作為訓練起點但保持個別調整空間。
- id: fly.tech.36
  stroke: fly
  category: streamline
  title: 蝶式 streamline 是脈衝式不是維持式——基準姿態只存在於波動低點
  summary: 自由式/仰式有「持續 streamline 姿態」可維持，蝶式沒有——身體在每個 stroke cycle 內都在波動，所以「streamline 基準」只存在於波動低點那一瞬。教學處方要把「streamline」重新定義為「波動週期內的最低阻力姿態」，不是「保持身體不動」。要求蝶式選手「保持 streamline」是動作物理上的不可能。
  mechanism:
    certainty: 🔵
    text: '蝶式推進依賴胸-髖反向波動——胸下壓時髖上抬，胸上抬時髖下壓。

      每個 cycle 有兩個「streamline 通過點」：

      - **入水後**（雙臂前伸、頭夾臂、身體拉長）——此時最接近自由式式的 streamline

      - **拉水末段**（雙臂在臀部、頭已抬完、身體準備出水）——此時是另一個低阻力相位

      兩個 streamline 通過點之間是必要的高阻力相（手出水、轉身、新的下壓）。

      所以教學目標不是「維持 streamline」，是「縮短兩個 streamline 通過點之間的時間 + 加深兩個通過點本身的低阻力品質」。

      '
  practical_implication: 蝶式 streamline 訓練應該分兩段：① 入水後 streamline（最像自由式，可借用 streamline kick drill）；② 出水前 streamline（身體拉長、手臂高於臀部）。對選手喊「保持 streamline」會困惑——他無法在波動中保持不動。改成「入水那瞬間 streamline 要乾淨」更可執行。
  cross_ref: free.tech.34（自由式 streamline 基準姿態對照）、fly.tech.10（IVV 與波動效率）
  cross_ref_ids:
  - free.tech.34
  - fly.tech.10
- id: udk.tech.30
  stroke: udk
  category: joint
  title: 關節動作的名稱不隨體位改變——會翻轉的是「池畔可見方向」與「解剖動作」之間的對照
  joint_region: hip-knee
  nav_zh: 體位翻轉的命名
  summary: 水下海豚打腿在俯臥與仰躺都會被描述成「上踢／下踢」，但這兩個詞講的是池畔看得到的移動方向，不是關節動作。關節動作的命名一律以解剖姿勢為基準，身體在空間中朝哪邊不進入命名，所以命名本身不會翻轉；翻轉的是方向與動作之間的對照。俯臥時腳往池底是髖屈曲，仰躺時腳往池底是髖伸展；同一句「下踢」在兩種體位指向相反的髖動作。因此「體位」必須是必填欄位，而且髖、膝、踝要各自逐相位對照，不能整組鏡像過去。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '教科書明定：不論移動的是股骨還是骨盆，髖的骨動學一律從解剖位置描述——矢狀面是屈曲／伸展，額狀面是外展／內收，水平面是內旋／外旋。身體在空間中朝哪個方向不進入命名。所以命名規則本身無條件成立，不因俯臥或仰躺而改變。

      會改變的是「池畔可見方向」對應到哪個關節動作。逐關節的對照如下：

      髖——俯臥時腳往水面是股骨往身體後方，屬髖伸展；腳往池底屬髖屈曲。仰躺時兩者相反：腳往水面屬髖屈曲，腳往池底屬髖伸展。

      膝——不論體位，腳跟靠近臀部就是膝屈曲，小腿回到大腿延長線上就是膝伸展。膝在矢狀面沒有可用的反向動作（伸展到中立即止），所以對照不因體位改變；但仍應逐相位填寫，因為同一句「下踢」在兩種體位所處的膝屈曲角度不一定相同。

      踝——不論體位，腳背靠近小腿前側是背屈，腳尖遠離小腿是蹠屈。對照繫於足與小腿的相對位置，不繫於身體朝向，所以同樣不隨體位改變，同樣須逐相位填寫。

      由此得到的欄位規則：技術表格需要三欄——體位（俯臥／仰躺／側臥）、池畔可見方向、解剖動作，並且對髖、膝、踝分別填。只寫一欄時錯誤會反覆發生，這是欄位缺漏造成的結構性錯誤，不是個別筆誤。

      尚待實測：俯臥與仰躺的水下海豚打腿在關節角度軌跡與相位時間分配上是否為同一套動作模式，屬游泳運動學問題。本專案的游泳文獻集在此主題沒有可用篇目，這一點不由本條下結論。

      '
  practical_implication: 水下海豚打腿的教學文件把「體位」設為必填欄位，並對髖、膝、踝分別採「池畔可見方向 ＋ 解剖動作」雙欄標注。這一步的直接用途是讓陸上輔助訓練的動作選擇不會方向接反——排課前先讀解剖動作那一欄，不要照「上踢」「下踢」的字面去選。尚待實測：某一拍實際由哪些肌群主導需要游泳專項 EMG 才能回答，關節動作方向只能指出「哪些肌群在解剖上可能參與」，不能指出招募程度。同理，動作幅度不足要歸給硬體邊界還是感知協調，須由分層被動與主動測試判定，不能由髖屈曲與髖伸展的正常 ROM 差異直接推得。
  cross_ref: udk.tech.22（仰式 UDK 效率高於俯式）、back.tech.30（仰式打腿同一命名翻轉）、free.tech.36（骨動學命名鐵律）
  cross_ref_ids:
  - udk.tech.22
  - back.tech.30
  - free.tech.36
- id: breast.tech.36
  stroke: breast
  category: joint
  title: 蛙式翻腳的「腳尖朝外」是四個關節的合成，不是踝關節外翻
  joint_region: ankle-foot
  nav_zh: 蛙式翻腳
  summary: 蛙式翻腳期常被描述為「踝關節外翻、腳尖轉向外側」。解剖學上這句話錯兩層：外翻不發生在踝（距小腿）關節，而「腳尖朝外」也不是任何單一關節的動作，是髖外旋、膝軸向旋轉、距下與橫跗關節旋前四者的合成結果。更關鍵的是——在水中（非承重）無法用肉眼分辨這四者各出了多少。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '解剖事實：距小腿關節只有一個主要自由度（背屈／蹠屈）。外翻是繞前後軸的額狀面動作，發生在距下關節與橫跗關節。

      解剖事實：可能貢獻「腳尖朝外」的四個來源與各自的正常活動度上限——髖外旋，股骨繞縱軸外轉並帶動整條下肢連足一起轉，伸髖位平均約 45 度且個體差異特別大；膝軸向外旋，脛骨相對股骨外旋，只在膝屈曲時存在，部分屈曲時最自由；距下關節旋前，主動外翻約 12.5 度，受外踝與三角韌帶限制；橫跗關節外翻約 10–15 度。

      解剖事實：旋前與旋後是單軸三平面運動，外翻、外展、背屈三個成分的組合不變，任一成分存在即代表另兩者也在發生。所以原文分列的「持續背屈」與「外翻」很可能是同一個旋前動作被拆成兩格，不是兩個獨立動作。

      泳姿推論：蛙式翻腳期膝處於高度屈曲，因此膝軸向旋轉這個來源在該相位推論上是可用的。上述四個來源在蛙式翻腳中實際各出多少，教科書答不了——那需要游泳運動學量測。

      教練應用：把「翻腳」改為分關節描述，並在文件中明講各關節的分配須靠分節段量測、不得目視反推。

      尚待實測：水中非承重情境下的目視觀察無法分辨「腳尖朝外」來自髖、膝還是足。教科書描述距下關節的功能是讓小腿能在水平面旋轉而不需要足在地面移動，那是承重情境；蛙式非承重，同一個自由度反過來讓足相對小腿轉動而小腿不必轉。因此個別泳者的限制落在哪個關節，要靠分關節被動與主動測試判定，本條不對此下結論，也不對介入方式下結論。

      '
  evidence:
  - certainty: 🟢
    text: 各來源的正常活動度上限——髖外旋於伸髖位平均約 45 度且個體差異大；膝軸向旋轉僅在膝屈曲時存在；距下關節主動外翻約 12.5 度；橫跗關節外翻約 10–15 度。皆為一般人群的關節活動度上限，非蛙式翻腳時的實際使用量。
    source: Neumann 2017 / Nordin & Frankel 2012
    source_ids:
    - src.neumann-2017
  practical_implication: 教學語言把「翻腳」改為分關節描述（髖外旋／膝軸向旋轉／距下與橫跗旋前），並註明各關節的分配須靠分節段量測、不得由水中外觀反推。教科書能裁決的是哪些關節有能力貢獻、各自的正常上限多少、哪些成分不可分離；不能裁決實際各出多少。尚待實測：學生翻腳角度不足時，限制落在哪個關節要靠分關節活動度評估判定；在判定之前不預設任何一個關節是限制所在，也不預設任何一種柔軟度介入。
  cross_ref: breast.tech.15（髖內旋是第二關鍵解剖因子）、free.tech.38（踝沒有內外旋，足的三維擺動在距下與橫跗）
  cross_ref_ids:
  - breast.tech.15
  - free.tech.38
- id: breast.tech.37
  stroke: breast
  category: joint
  title: 蛙式專屬硬體邊界——深屈膝時髖伸展被股直肌壓到只剩中立位
  joint_region: hip-knee
  nav_zh: 蛙式屈膝與髖
  summary: 髖關節正常可伸展到中立位之後約 20 度。但當膝關節處於完全屈曲時，跨越髖與膝兩個關節的股直肌被拉緊，被動張力把髖伸展壓縮到只能回到中立位附近。蛙式收腿期正是深屈膝，所以這條雙關節限制在蛙式構成的天花板，比自由式與仰式明顯。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '解剖事實：教科書明述，髖正常可伸展至中立位之後約 20 度；完全伸髖會拉緊關節囊韌帶（尤其髂股韌帶）與髖屈肌群；而當髖伸展時膝處於完全屈曲，被拉長的股直肌的被動張力會把髖伸展減少到大約只剩中立位。

      解剖事實：股直肌是雙關節肌，同時跨髖與膝，作用是屈髖兼伸膝。膝屈得越深，它在髖側的可用長度就越少；反過來，髖越接近伸展位，它在膝側的可用長度也越少。這個耦合是雙向的，屬肌肉長度—張力關係的直接結果。

      泳姿推論：蛙式收腿期的膝屈曲程度在四式中最深，因此推論這條限制只在蛙式構成實質天花板。此為由關節位置推得的負荷描述，不是發生率或症狀的陳述。

      教練應用：判讀「蛙式收腿時髖伸展不夠、腿沒有留在身體線上」時，先把這條解剖限制納入考慮再談感知或動作控制——深屈膝下髖的可用伸展範圍本來就受限。

      尚待實測：股直肌柔軟度改變後蛙式收腿位置是否隨之改變，需要介入研究才能回答；本條不對任何柔軟度處方的效果下結論。蛙式收腿期的實際髖膝角度組合也需要游泳運動學量測。

      '
  evidence:
  - certainty: 🟢
    text: 教科書載明髖正常可伸展至中立位之後約 20 度；當膝處於完全屈曲時，被拉長的股直肌被動張力會把可用的髖伸展減少到大約只剩中立位。此為一般人群的關節活動度描述，非蛙式收腿時的實測角度。
    source: Neumann 2017, Kinesiology of the Musculoskeletal System 3rd ed
    source_ids:
    - src.neumann-2017
  practical_implication: 判讀「蛙式收腿時髖伸展不夠、腿沒有留在身體線上」時，先把這條解剖限制納入考慮再談感知或動作控制——深屈膝下髖的可用伸展範圍本來就受限，要求選手「收腿時髖再往後一點」是在對抗被動張力。另一個直接後果是柔軟度測驗的方法問題：用仰躺屈髖姿勢量到的膝屈曲角度，量的是股直肌沒被拉長時的膝關節活動度，與蛙式收腿（髖接近伸展位）所處的力學情境不同，用它判定蛙式收腿能力，方法本身就對不上——要測就必須在近似伸髖的體位下測。尚待實測：改變股直肌柔軟度是否會改變蛙式收腿位置，需要介入研究，本條不對此下結論。
  cross_ref: breast.tech.14（踝蹠屈柔韌性是第一解剖決定因子）、breast.tech.15（髖內旋是第二關鍵因子）
  cross_ref_ids:
  - breast.tech.14
  - breast.tech.15
- id: breast.tech.38
  stroke: breast
  category: errors
  title: 蛙式肩最脆弱的位置在拉手起始、不在內掃——流傳版本把時相與旋轉方向都寫反了
  summary: 常見說法是「蛙式內掃期若肩內旋、內收過快會造成肩關節前脫位」。追到該說法所指的病例報告後，三項全部不符：文獻寫的是**拉手起始期**、肩關節處於**伸展併外旋**、且完全沒有做力矩量測。解剖上也是文獻版本才講得通——肩前脫位的典型機制本來就是外展、外旋、伸展，內旋內收把肱骨頭壓向後方，那是後脫位的方向。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.vasiliadis-2019
    text: '文獻原文的機制描述是：受傷機轉似乎與蛙式技術的**初始拉手期（initial pull phase）**、以及肩關節處於**伸展併外旋（extension and external rotation）**這個最弱的位置之間有關聯。


      為什麼這個位置最弱：肱骨外旋併伸展時，肱骨頭被推向關節囊前下方——那裡是盂肱關節囊最薄的一段，也是前方穩定結構（盂肱下韌帶前束）張力最吃緊的位置。蛙式雙手在身體正前方同步向外向下展開，起手瞬間正好經過這個區段，而且是雙側同時、沒有像自由式那樣有軀幹滾轉可以卸掉一部分角度。


      **證據等級必須跟著這條走：這是 n=1 的單一病例報告（36 歲女性，訓練中發生，閉鎖復位成功）。**它只能支持「曾有病例被如此描述」，**不能支持任何發生率、風險高低或「常見成因」的說法**。文獻本身也沒有做力學量測，所以流傳版本裡「力矩過大」那句是外加的，無來源。

      '
  practical_implication: '教學上不要講「內掃時肩不要內滾太快」——那個時相與方向都指錯了，選手照著調整不會碰到真正的脆弱區段。若要提醒，對象是**拉手起始**：起手時避免把手臂在完全伸展併外旋的位置上突然加載，尤其在未充分暖身或雙手起始位過寬時。


    這條真正可直接用的是文獻自己的實務結論，而原始說法完全略過了：**有肩關節脫位病史者，在納入水中訓練或水療前需要個別評估，開始游泳訓練的時機也需要審慎判斷。**個案史比技術微調重要——這是一條分流建議，不是一條技術建議。

    '
  cross_ref: fly.tech.38（「某動作＝某傷害位置」句型的查證紀律）、free.tech.36（上舉平面與義務性外旋是缺漏欄位）
  cross_ref_ids:
  - fly.tech.38
  - free.tech.36
- id: fly.tech.37
  stroke: fly
  category: joint
  title: 純額狀面上舉與肱骨義務性外旋的耦合最強——移臂描述漏掉旋轉欄位，等於漏掉整組上舉的必要成分
  joint_region: shoulder-arm
  nav_zh: 蝶式移臂外旋
  summary: 手臂上舉過頭會伴隨肱骨外旋，這是關節面與喙肩弓幾何決定的，不是可選的修飾動作。教科書進一步指出耦合強度隨上舉平面而變：在肩胛骨平面上舉時耦合較弱，在純額狀面上舉時耦合最強。蝶式雙手同步、沒有軀幹縱軸滾轉，上舉平面推論上會比自由式更靠近額狀面——這一點目前只有推論，沒有蝶式移臂上舉平面的一手量測。可以確定的是：移臂的技術描述若只寫「伸展→外展→屈曲」而不寫上舉平面與旋轉，欄位本身就不完整。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '解剖事實：教科書載明，在肩胛骨平面（額狀面前方約 30–40 度）外展比純額狀面外展更自然、可達到更大的上舉幅度，而且在肩胛骨平面外展與肱骨義務性外旋的力學耦合較弱。反過來說，純額狀面外展與外旋的耦合最強——教科書給的示範是：在純額狀面把肩外展到極限同時刻意不外旋會做不到，原因之一是肱骨大結節把肩峰下空間的內容物壓向喙肩弓的低點。要在純額狀面完成完整外展，外旋必須併入。

      解剖事實：命名規則不受泳式影響。解剖姿勢基準無條件成立，有沒有軀幹滾轉都不改變「屈曲／外展」的定義；受影響的只有同一次上舉該被記到哪個平面。

      泳姿推論：蝶式雙手同步、無軀幹縱軸旋轉，因此移臂的上舉平面推論上比自由式更靠近額狀面。此為由動作外觀出發的推論，本專案的游泳文獻集沒有蝶式移臂上舉平面的量測篇目。

      尚待實測：蝶式與自由式移臂的實際上舉平面角度，以及該角度與肩峰下空間負荷的關係，都需要三維肩關節運動學量測。在取得量測之前，本條不對兩式之間的風險高低作任何比較，也不對特定角度給出安全或危險的判定。

      '
  practical_implication: 蝶式移臂的技術描述把「上舉平面」與「肱骨旋轉」列為與屈伸、內外展並列的必填欄位，空白處寫「中立」而不是留白。只寫「伸展→外展→屈曲」等於把一次上舉切成三個獨立動作，還把旋轉欄位整格留空。尚待實測：移臂過程中肉眼看到的掌心朝向變化不能反推成肱骨外旋——掌心的空間朝向是肱骨軸向旋轉、前臂旋前旋後、腕關節位置三者的合成（見 free.tech.37），要判定肱骨旋轉需要肱骨本身的參考標記或影像。掌心朝向仍是有效的教學指標，只是不能當成旋轉欄位的填寫依據。
  cross_ref: fly.tech.25（肩活動度是 Recovery 低位路徑的硬體前提）、free.tech.36（上舉平面是缺漏欄位、外旋必然伴隨）
  cross_ref_ids:
  - fly.tech.25
  - free.tech.36
- id: fly.tech.38
  stroke: fly
  category: errors
  title: 「蝶式入水是夾擠位置」流傳甚廣，但唯一的一手量測說入水是外旋不是內旋
  summary: 網路與部分教材流傳一句話——蝶式入水時肩關節處於「上舉＋水平內收＋內旋」的夾擠位置，是蝶式肩傷的常見成因。追溯後發現這句話找不到一手量測支持；蝶式肩最接近一手的肌電＋電影分析描述入水時肱骨是**外展併外旋**。內旋與外旋在夾擠這件事上是相反方向：內旋才把大結節推向喙肩弓，外旋反而讓出空間。前提若反了，整條推論就不成立。
  mechanism:
    certainty: 🟡
    source_ids:
    - src.pink-1993
    text: '這條誤傳的來源結構值得記下來，因為它會重演。「高度外展＋內旋通過喙肩弓下方」是**自由式**抓水—早期推水的機制描述，有紮實文獻基礎；問題出在它被當成過頭泳式的通則，直接外推到蝶式入水。查證時另發現一件事：常被引來支持這句話的臨床綜述（StatPearls「游泳肩」章）**全篇只處理自由式，沒有蝶式內容**——搜尋摘要製造了這個歸屬，原文獻沒有。


      蝶式肩的一手研究（十二條肌肉肌電圖＋電影分析）描述的入水是：三角肌與旋轉肌袖作用，肱骨呈**外展、外旋**；同時菱形肌與上斜方肌後縮並上迴旋肩胛骨，為肱骨備好關節盂平台。這與 fly.tech.37 講的同一件事相通——蝶式沒有軀幹滾轉，上舉平面更靠近額狀面，而額狀面上舉與義務性外旋的耦合最強。**外旋在蝶式入水不是選項，是結構強制的。**


      該研究對入水肱骨還用了「伸展（extended）」一詞，與蝶式入水手臂前伸過頭的外觀直覺不符，可能與其分期定義或量測參考軸有關。**目前只取得摘要、未取全文，這一項不做解釋也不寫入教學語言。**

      '
  practical_implication: '不要用「入水是夾擠位置」當作蝶式肩痛的解釋去教——前提站不住，而且它會把注意力導向調整入水角度這條可能無效的路。同一份研究給出的可用機制在肌肉耐力層：**前鋸肌與肩胛下肌是全程高激活、因此最易疲勞也最易受傷的兩條**（見 fly.tech.27）。蝶式量大期出現肩部症狀，先查這兩條的耐力與肩胛控制，再查角度。


    判讀紀律：本條的價值不只在結論，也在方法。凡是「某動作＝某夾擠／傷害位置」這類句子，追到一手量測前一律不進公開層——它們讀起來精確、附得出來源、又與常識相符，是最難靠閱讀抓出來的一類錯誤。

    '
  cross_ref: fly.tech.27（前鋸肌與肩胛下肌全程高激活＝耐力而非力量）、fly.tech.37（額狀面上舉與義務性外旋耦合最強）、fly.tech.25（肩活動度硬體前提）
  cross_ref_ids:
  - fly.tech.27
  - fly.tech.37
  - fly.tech.25
- id: starts-turns.tech.47
  stroke: starts-turns
  category: joint
  title: 超流線的「脊椎些微伸展」與「hollow body」互相矛盾，必須擇一
  joint_region: spine-neck
  nav_zh: 超流線的脊椎
  summary: 超流線姿勢常見的描述是「脊椎維持中立或些微伸展（hollow body 空心姿），避免腰椎過度前凸」。這句話自我矛盾：伸展脊椎會加深腰椎前凸，而 hollow body 與「避免拱腰」要的是壓平前凸。兩者在同一個軸上指向相反，同一句話裡不可能同時成立。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '解剖事實：教科書明述，脊椎的自然彎曲不是固定的，會隨動作與姿勢調整而改變形狀。脊椎伸展會加深頸椎與腰椎前凸、減少胸椎後凸；脊椎屈曲則減少或壓平頸椎與腰椎前凸、加深胸椎後凸。

      解剖事實：hollow body 的定義特徵是壓平腰椎前凸（骨盆後傾、下背貼平），在脊椎命名上屬屈曲方向，不是伸展。

      泳姿推論：因此「些微伸展」與「hollow body 加上避免拱腰」不能並存，這是同一句內的內部矛盾（依裁決協議屬型 2），不是兩種學派差異。矛盾在命名層即可判定，不需要游泳量測。

      教練應用：超流線的教學語言必須擇一，並在文件中寫明選的是哪一個以及為什麼。兩種寫法對應的是不同的腰椎位置，同一份教材不能兩句並存。

      尚待實測：兩種腰椎位置各自對應的水中姿勢、阻力與推進差異，需要游泳量測比較。本條只裁決「這句話自我矛盾」，不裁決「哪一個比較好」——後者是教學政策決定。

      '
  practical_implication: 超流線教學語言必須擇一並說清楚是哪一個，兩種寫法不能在同一份教材並存。若選 hollow body，正確寫法是「脊椎中立到些微屈曲方向（壓平腰椎前凸）」，把「些微伸展」刪掉；若選脊椎些微伸展，就要同時刪掉「hollow body」與「避免拱腰」。這是文件一致性的要求，不是對兩種姿勢優劣的裁決。尚待實測：兩種腰椎位置對水中姿勢與阻力的實際影響需要游泳量測比較，本條不下結論。
  cross_ref: starts-turns.tech.42（乾淨入水的三段姿勢含 Hyperstreamline）、udk.tech.24（流線型品質是 UDK 速度的底板）
  cross_ref_ids:
  - starts-turns.tech.42
  - udk.tech.24
- id: starts-turns.tech.48
  stroke: starts-turns
  category: joint
  title: 超流線的「肩屈曲 170–180 度」是肩複合體角度，不是肩關節角度——查錯層級會找錯限制
  joint_region: shoulder-arm
  nav_zh: 肩複合體角度
  summary: 超流線常寫成「肩關節屈曲 170–180 度」。這個數字本身可達，但它是肩複合體的合計角度，不是單一關節的角度：手臂上舉到 180 度是盂肱關節與肩胛胸廓兩處一起完成的。教科書常用的教學近似是盂肱約 120 度、肩胛胸廓上迴旋約 60 度，同段並註明這組數值取自相當寬的估計範圍、個體之間與研究之間差異相當大，所以它是分層概念的近似值，不是可拿來比對個人的標準值。把整個 180 度掛在「肩關節」上，會在學生做不到時只往盂肱找原因，漏掉肩胛胸廓那一層。
  mechanism:
    certainty: 🔵
    source_ids:
    - src.neumann-2017
    text: '教科書把手臂上舉 180 度分成兩層來教：肩胛胸廓上迴旋約 60 度加上盂肱關節約 120 度。同一張圖的說明直接註明，這些數值取自文獻中相當寬的估計範圍，且個體之間與研究之間差異相當大。所以 120 加 60 是教學用的分層近似，不是可驗證的個人分配比例。

      170–180 度這個處方值因此有兩個必須一起講的性質：

      它是複合體的合計值而非單一關節值，兩層任一受限都會反映在同一個合計數字上。

      它貼著正常上限，餘裕很小——這與那些落在日常功能弧正中央的關節角度不同，達不到並不罕見。

      尚待實測：某一位泳者的上舉角度實際由兩層各出多少，需要分節段量測（影像或肩胛追蹤）才能知道。靜態的 120 加 60 近似值不能用來推斷個別泳者的分配，也不能用來判定他的限制落在哪一層。

      '
  evidence:
  - certainty: 🟢
    text: 教科書將手臂上舉 180 度分為肩胛胸廓上迴旋約 60 度與盂肱關節約 120 度兩層，並在同一處說明所引數值取自相當寬的估計範圍、個體之間與研究之間差異相當大。此為分層教學近似，非個別受試的實測分配。
    source: Neumann 2017, Kinesiology of the Musculoskeletal System 3rd ed
    source_ids:
    - src.neumann-2017
  practical_implication: 超流線做不出來時，先分辨限制落在盂肱還是肩胛胸廓，再決定後續處理——兩層的評估項目不同，對其中一層做的處置不會自動改善另一層。因為處方值本身貼著正常上限而且個體差異大，達不到 170 度不必然是技術或努力問題，要先判定是否為硬體邊界，再決定是調整姿勢容忍度還是安排活動度訓練。尚待實測：限制落在哪一層要由分層被動與主動測試判定，不能由水中姿勢外觀反推；本條也不對特定肌肉或組織作歸因，那需要個別評估。另注意術語一致性：同一份教材若在別處已把肩胛骨動作分開描述，就不該又把複合體角度寫成「肩關節」。
  cross_ref: starts-turns.tech.47（超流線脊椎矛盾）、fly.tech.25（肩活動度是 Recovery 低位路徑的硬體前提）、free.tech.36（上舉平面與外旋欄位）
  cross_ref_ids:
  - starts-turns.tech.47
  - fly.tech.25
  - free.tech.36
- id: breast.tech.35
  stroke: breast
  category: timing
  title: 蛙式三種時序策略——Touch-and-Go / Traditional / Wave 重疊，按距離與個人選擇
  summary: 蛙式時序不是「對 vs 錯」而是三種策略：Touch-and-Go（短距離極限速度）、Traditional（中距離平衡）、Wave 重疊（長距離節能或菁英衝刺）。教練常用「正確時序」的口令，但實際是依距離 / 體型 / 風格選擇——把一種時序當作普遍正確會限制選手潛能。
  mechanism:
    certainty: 🟠
    observation_basis: 三種時序策略的分類與代表選手（Adam Peaty、Kosuke Kitajima、Lilly King）是競技蛙式的通行教學分類，出自泳書與教練評論的整合，不是本專案的教練觀測；族群是菁英競技蛙式選手。外推邊界：① 三者的 SR／SL 高低是相對描述，本檔沒有掛上量化區間，不可當成配速表使用； ② 「選擇依體型、訓練史、距離綜合決定」意味著這是選項光譜不是階梯，特別要避免把 Touch-and-Go 讀成「進階版」——它的能量代價最高，用在 50m 以外的距離通常是退步。
    text: '三種時序策略的差異點：

      - **Touch-and-Go**（觸碰即起）：手前伸到底「碰一下」就立刻收手做下一划，幾乎沒有 streamline 滑行。SR 最高、SL 最短、能量代價最高，適合 50m 衝刺。Adam Peaty 為代表。

      - **Traditional**（傳統分段）：手前伸 + 短滑行 + 收手；明確的「拉手→踢腿→滑行→拉手」分段。SR 中、SL 中、平衡推進與節能，適合 100m。

      - **Wave 重疊**（waveform overlap）：拉手末段就開始收腿、踢腿時手已開始下一划外划；推進相互重疊。SR 高、SL 中、coupling 動能最大。Kosuke Kitajima、Lilly King 為代表，適合 100/200m 衝刺。

      選擇依個人體型（重心、肩柔軟度、髖內旋）、訓練史、距離綜合決定，不是「先進」優於「傳統」。

      '
  practical_implication: 教練處方時序應先評估選手體型與目標距離，再選對應時序作為主訓。教學早期建立 Traditional 為基礎，待選手成熟後再評估是否切換。Touch-and-Go 需要極高無氧能力支撐、Wave 重疊需要高肩髖協調——兩者都不是「越早教越好」。
  cross_ref: breast.err16（wave style 誤套到 flat style 適合者）
  cross_ref_ids:
  - breast.err16
- id: starts-turns.tech.1
  stroke: starts-turns
  category: comparison
  title: Grab Start vs Track Start 基本差異
  summary: 前衝式（Grab）與起跑式（Track）在腳站法、重心與啟動方式上有結構性差異，Track Start 因楔形輔具普及成為現代競技主流。
  mechanism:
    certainty: 🔵
    text: Track Start 以後腳踩楔形輔具獲得明確推蹬支撐面；Grab Start 靠向後拉再前彈，利用 SSC 牽張–縮短循環，但釋放時機稍晚會拖慢起跳。
  evidence:
  - certainty: 🟢
    text: 20 名大學女子選手比較：前重心 Track 離台時間最快（0.80 s），後重心 Track 水平速度最高（3.99 m/s）；建議女子選手採後重心起跑式。
    source: Welcher, Hinrichs & George 2008
    source_ids:
    - src.welcher-2008-a
  - certainty: 🟠
    text: 雪梨奧運頂尖選手出發的水下階段佔整體起跑時間約 84%，不同起跳方式在精英層級結果不顯著。
    source: Cossor & Mason 2001
    source_ids:
    - src.cossor-2001
  practical_implication: 選手技術選擇應依個人計時測試決定；精英層級起跳方式差異不顯著，水下表現才是決定因素。
- id: starts-turns.tech.2
  stroke: starts-turns
  category: stroke-cycle
  title: Grab Start 抓台拉力效益爭議
  summary: 〔歷史條目〕Grab Start 已於 2000 年代後逐漸退役，菁英層級今幾乎全用 Track Start（含重心前傾／後仰兩變體，見 tech.41）。此條保留為歷史脈絡與 Masters 等仍使用 Grab Start 的族群參考。
  mechanism:
    certainty: 🔵
    text: Grab Start 的手部拉力能預先拉伸下肢伸肌群（SSC），可產生可量化的向後拉力；但手部拉力相對腿部推力小，釋放時機稍晚則拖慢起跳。**這個機制在物理推導上仍然成立**，但在現代競技中已被 Track Start 的雙腳分離站位（更穩定的推蹬基礎 + 重心可前後調配）取代——不是 Grab 失效，是 Track 提供了更多策略空間。Masters 與部分長者因 Track 站姿穩定性問題仍使用 Grab Start，這時上述機制仍是其執行品質的關鍵。
  evidence:
  - certainty: 🟡
    text: 手部拉力可量化的向後拉力效益已有早期測量；現代菁英已轉用 Track Start，此實驗結論主要對 Masters 與穩定性受限族群仍有實務參考價值。
    source: Welcher et al. 1979（歷史依據）
    source_ids:
    - src.welcher-1979
  practical_implication: 仍使用 Grab Start 的族群（Masters、平衡受限者）執行品質取決於個人技術；菁英與 t2c/t2w 階段請見 starts-turns.tech.41（Track Start 重心前傾 vs 後仰）。
  cross_ref: starts-turns.tech.41（Track Start 重心策略）
  cross_ref_ids:
  - starts-turns.tech.41
- id: starts-turns.tech.3
  stroke: starts-turns
  category: hardware
  title: Set Position 膝蓋角度與肌肉特性相關
  summary: Grab/Track Start 起始姿勢的最優膝蓋角度與個人肌肉特性高度相關，無跨選手通用數字；過深超出最佳力–長度關係，過淺則無法充分利用 SSC。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.blanksby-2002
    text: 股四頭肌力–長度關係決定最佳預載深度：膝蓋角度過小（< 90°）超出最佳力–長度曲線；過大（> 120°）預載不足。
  evidence:
  - certainty: 🟢
    text: 早期建議 90–120°；後續研究指出過深超出股四頭肌最佳力–長度關係。
    source: Blanksby et al. 2002
    source_ids:
    - src.blanksby-2002
  practical_implication: 教練應依個別選手肌肉特性調整膝蓋角度，不應套用固定數字。
- id: starts-turns.tech.4
  stroke: starts-turns
  category: head
  title: 起跳零位姿勢頭部位置——靜態中立 vs 動態抬頭兩派
  summary: 「零位姿勢時頭部該在哪」實際上有兩派教法。靜態派主張頸部中立、脊柱對齊優先；動態派把抬頭視為一個 coupling 動作（11 磅的頭快速向上抬可產生可量化的推進增益）。兩派都有菁英選手為代表，分歧不在誰對誰錯，而在零位 vs 整個起跳動作的觀察視角。
  mechanism:
    certainty: 🟠
    observation_basis: 靜態中立與動態抬頭兩派都是教練體系的立場，不是本專案的教練觀測。動態抬頭派的數字（頭部 11 磅、抬頭比低頭遠 0.32 公尺、到 12m 快 0.12 秒）出自 The Race Club 的 Velocity Meter 示範量測，受試是被點名的單一選手，未經同儕審查、未報告樣本數。外推邊界：這個增益依賴選手在抬頭瞬間仍能維持身體軸線——核心力量或柔軟度不足者，抬頭破壞流線的損失會蓋過 coupling 增益；追求快入水策略的選手低頭反而更直接。所以這是策略選擇不是對錯，數字不可當成換做法就會拿到的回報（同 starts-turns.err10）。
    text: '靜態中立派：在零位姿勢階段維持頸與脊椎對齊，避免提前破壞流線；抬頭應該等到入水後再做。

      動態抬頭派：零位姿勢時頭已朝前（不是看水也不是看牆），起跳瞬間抬頭往前看並維持較久（手臂掃過肩膀前不收下巴）；頭部 11 磅快速向上的動能透過頸椎傳到上半身，與手臂前掃合成 coupling 推進。另一個附帶效應：頭朝哪、身體軌跡跟到哪——抬頭看遠處讓飛行軌跡更平、入水點更遠（量測數據：抬頭比低頭遠 0.32 公尺 = 11% 遠，到 12m 快 0.12 秒 = 3%）。

      兩派並非互斥——零位中立 + 起跳瞬間抬頭也是合理組合。

      '
  practical_implication: 教學建議：先教中立零位姿勢（避免初學者抬頭破壞流線），技術成熟後加入抬頭 coupling 訓練；初學選擇看哪派比較符合泳者自然動作。風格上低頭適合追求快入水的策略（如 Anthony Ervin），抬頭適合飛行距離優先策略（如 Brad Tandy）。
- id: starts-turns.tech.41
  stroke: starts-turns
  category: stroke-cycle
  title: 重心前傾 vs 重心後仰起跳——兩種 Track Start 的設置策略
  summary: Track Start 進一步分兩種重心策略。重心前傾把體重壓在前腳，set position 後幾乎所有推進力來自前腳，起跳快但離台速度較低；重心後仰在 take-your-mark 後把體重轉移到後腳（身體稍向後 5–10°），起跳啟動稍慢但能用上手部上拉、後腳推板、前腳推板三段加速。菁英男子多用後仰、女子多用前傾，但這對應的是肌肉組成與策略偏好，不是性別本身。
  mechanism:
    certainty: 🟠
    observation_basis: 兩種設置策略的比較與三個加速峰值的描述出自 The Race Club 的 Velocity Meter 示範量測，不是本專案的教練觀測；代表選手由該體系點名（前傾：Sarah Sjostrom、Ranomi Kromowidjojo；後仰：Caeleb Dressel、Brad Tandy）。外推邊界有三項：① 量測未經同儕審查、未報告樣本數，「後仰總時間到 12m 通常更快」是傾向不是定論；② 該結論明確附帶前提——需要強垂直起跳能力與快反應時間，不具備者選後仰只會多花離台時間而拿不到補償；③ 「據傳 Dressel 垂直彈跳 42 吋」是傳聞，本專案未查到可驗證的量測紀錄，不得引用為數據。
    text: '前傾策略：重心已在前腳上方，take-your-mark 後幾乎沒做姿勢變動，所以反應到離台時間最短。代價是手臂與後腳在這個姿勢下幾乎沒有產生推進力的力學位置——只能靠單一前腳。適合垂直起跳能力較弱、海豚踢速度極強的泳者（轉移到水中後的優勢蓋過離台速度劣勢）。

      後仰策略：手抓台板後上拉，配合身體後仰把重心移到後腳（同時手肘可彎可直，兩種效率接近）。Velocity Meter 量測能看到三個明確的加速峰值——手上拉、後腳蹬板、前腳蹬板。後仰多得到的離台速度補償了多花的離台時間，總時間到 12m 通常更快，但需要強垂直起跳能力與快反應時間才能完整實現潛能。

      代表選手：前傾——Sarah Sjostrom、Ranomi Kromowidjojo（極強海豚踢補償）；後仰——Caeleb Dressel、Brad Tandy（極高垂直起跳能力，據傳 Dressel 42 吋）。

      '
  practical_implication: 選擇策略要先測泳者的垂直起跳與海豚踢速度。垂直起跳強就用後仰；海豚踢強且垂直起跳普通就用前傾。Anthony Ervin 在 2012 倫敦試後仰失敗、2016 里約回到前傾才再奪金——是「個人能力結構決定策略」最直接的證據。
- id: starts-turns.tech.42
  stroke: starts-turns
  category: stroke-cycle
  title: 起跳乾淨入水的三段姿勢——Hyperstreamline、髖屈 15°、腳尖伸直
  summary: 高速入水時阻力按速度平方上升，所以入水前的姿勢構造比一般 streamline 嚴格得多。三個重點：① Hyperstreamline（下巴貼胸、肘部夾緊到幾乎觸碰、手腕重疊壓緊，整個前段體積壓最小）；② 髖屈約 15°（讓上半身與腿成一個鈍角，下身水平、上身略下傾，避免入水太深或太遠）；③ 腳尖完全伸直（plantar flexion 不足是觀察到最常見的錯誤，腳掌懸掛比腳尖伸直多 41% 阻力）。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.race-club-pdm-data
    text: 'Hyperstreamline 比一般 streamline 更激烈——把肩往前上方送、胸腹腔縮窄、皮膚繃緊降低截面。約二十人裡只有一個能做到兩肘真正觸碰（「獨角獸」），但近距離已足夠。最常見的崩潰是入水前手沒回到重疊位置——水接觸瞬間若兩臂分開或交叉，水會把姿勢硬撐開、阻力暴漲。

      命名更正（教練原話 vs 解剖命名）：來源把「把肩往前推」說成「肩關節做 sub-luxation 或 hyperextension」，這兩個名字在解剖命名下都不成立，而且錯的方向相反。肩的 hyperextension 指的是手臂往身體**後方**去，與超流線要的往前上方送方向相反；sub-luxation（半脫位）是關節面部分失去對合的病理狀態，不是一個可以主動做出來的動作，寫成教學指令等於叫泳者主動製造半脫位。手臂已在頭上時再把肩往前送，發生的是肩胛前突（scapular protraction）加肩胛上迴旋，屬肩胛胸廓那一層，不在盂肱關節——這正是 tech.48 裁決的「180 度是肩複合體合計角度、不可整包掛在肩關節上」同一件事。本條保留教練原話是為了讓聽過這句口令的人找得到，但依此教學時要用解剖命名。

      腰椎位置在此不裁決：來源原文另寫「腰椎反弓」（即腰椎伸展）。tech.47 已裁決「脊椎些微伸展」與「hollow body／避免拱腰」在同一軸上指向相反、同一份教材不能並存，必須擇一並寫明選的是哪一個以及為什麼；該條同時明說「哪一個比較好」是教學政策決定，不是解剖可裁決的事，需要游泳量測才能比較。因此本條不替使用者擇一，只標明此處的「腰椎反弓」落在 tech.47 判為互斥的那一邊，採用前必須先依 tech.47 完成擇一。

      髖屈 15° 是入水軌跡控制的關鍵。完全打直入水會用太陡的角度進水（太深、需要更長的水下滑行）；過度髖屈（>30°）也會入水太深。蛙式起跳因為要進水深些做 pullout，髖屈可以放到 20–30°。

      腳尖伸直：腳掌懸掛狀態（不做 plantar flexion）會把腳掌變成正面阻力面，PDM 量測在 2.3m/s 下增加 41% 阻力——比輸入水時的姿勢都關鍵。輕微膝彎可以幫助腳尖指得更垂直（沿著腿的軌跡進水）；大幅膝彎則破壞流線。

      '
  evidence:
  - certainty: 🟢
    text: 腳掌懸掛（未 plantar flexion）vs 腳尖伸直的對照阻力——前者在配速 2.3 m/s 下增加 41% 正面阻力。入水時實際速度更高（接近 5 m/s），阻力差異按速度平方放大。
    source: The Race Club PDM 量測資料
    source_ids:
    - src.race-club-pdm-data
  practical_implication: 入水訓練要拆開練。Hyperstreamline 在陸上鏡前先設好（手腕重疊位置、肘夾耳、頭夾臂）；髖屈用 Running Dive drill 訓練（助跑潛水自然會學會 hip lift）；腳尖伸直是觀察的最後一道防線——每次起跳訓練都要回看影片檢查腳尖。把肩往前送的教學語言要用肩胛前突而非「肩關節 hyperextension／sub-luxation」，後者方向相反且是病理狀態；腰椎那一項在依 tech.47 完成擇一之前不要照本條原文教。
  cross_ref: starts-turns.tech.47（超流線的脊椎：「些微伸展」與 hollow body 互斥，必須擇一）、starts-turns.tech.48（超流線的肩複合體角度：180 度是合計值不是肩關節值）
  cross_ref_ids:
  - starts-turns.tech.47
  - starts-turns.tech.48
- id: starts-turns.tech.43
  stroke: starts-turns
  category: coupling
  title: 起跳的三個 coupling 動作——抬頭、繞臂、後腿踢
  summary: 起跳的推進主力來自雙腳蹬板與雙手上拉，但有三個額外 coupling 動作能放大這些推進力。能量貢獻由大到小：後腿踢（最大，後腿 20–40 磅快速上揚產生大量動能）、繞臂（大圓直臂 > 小圓彎肘 > 停反向 > 直接前推）、抬頭（11 磅頭快速抬升並維持遠視）。三個 coupling 動作的共同特徵：本身不產生推進力，但與雙腳蹬板的時機對齊就放大推進。
  mechanism:
    certainty: 🟠
    observation_basis: 三個 coupling 動作的方向與訓練法是本專案採用 The Race Club 的教學體系整理的，不是本專案的教練觀測；文中的具體數字全部來自 The Race Club 自行以 Velocity Meter 量測的示範資料，受試者是被點名的單一選手，未經同儕審查、未報告樣本數與重複次數。抬頭那組（Amanda Kendall，遠 0.32 m、12 m 快 0.15 秒）2026-09-05 已回原文逐值核對，數字相符——**本欄原本寫「快 0.12 秒」是錯的，原文是 0.15 秒**，同日更正。大圓比小圓多 37% peak acceleration 那組（Niko Obrovac）**回原文找不到**：站上談同一對照的公開文章換的是 Zane Grothe（快 2%），37% 這個數字與 Obrovac 這個名字都不在公開頁面上，詳見下方 evidence 的 🔴 註記。下面的 text 保留原敘述，但 37% 目前是待查值不是已證數字。外推邊界：這些數字只能讀成「該選手在該次量測下的差異」，不是可對其他人預期的增益值；尤其大圓直臂的代價（手臂未及時歸位、雙手交叉）在不同肩活動度與起跳熟練度下並不對等，不得把 37% 當成換技術就會拿到的回報。
    text: '後腿踢：起跳瞬間後腿從直放姿勢猛力向上踢到接近垂直、腳尖朝上，重量與速度共同產生大量動能。Brad Tandy 後腿幾乎垂直、前腿被帶到水平以上。多數泳者完全沒意識到自己後腿在幹嘛，是進步空間最大的 coupling。訓練：抓在出發台後方練「驢踢」（單腳支撐踢另一腳）；或起跳台上放沙灘球練踢中。

      繞臂：四種等級——直接前推（無能量）→ 停反向（短能量）→ 小圓彎肘（中等，多數選手用）→ 大圓直臂（最大）。大圓直臂的動能與「手臂長度平方 × 角速度平方」成正比，菁英 Niko Obrovac 在 VM 量測下大圓比小圓多 37% 離台 peak acceleration。風險：手沒及時回到重疊位置或兩手交叉——大圓技術代價高但回報也高。

      抬頭：在起跳瞬間頭快速向上抬看遠處並維持，手臂掃過肩膀前才把下巴收回。Amanda Kendall VM 量測抬頭比低頭遠 0.32m、到 12m 快 0.12 秒。

      '
  evidence:
  - certainty: 🟠
    text: Amanda Kendall 測試抬頭 vs 低頭起跳：入水距離 2.96 vs 2.64 公尺，到 12 公尺 5.41 vs 5.56 秒（快 0.15 秒，約 3%）。
    source: 'The Race Club — Improving Your Starts: Head Lift'
    source_ids:
    - src.the-race-club-starts-head-lift
  - certainty: 🟠
    text: 大圓直臂繞臂的動能來源：把手臂由彎伸直，圓周運動的動能變成四倍；量測示範是 Zane Grothe，大圓比小圓到 12 公尺快 2%（0.1 秒）。
    source: 'The Race Club — The Coupling Motions of the Start: The Arm Swing'
    source_ids:
    - src.the-race-club-start-arm-swing
  - certainty: 🔴
    caveat: '**查證失敗（2026-09-05）**：這兩組數字原本掛在「The Race Club VM 量測資料」這個定位不到任何一篇的字串上。回站上找，談同一個大圓／小圓對照的公開文章用的是**另一位選手** （Zane Grothe，2%／0.1 秒），Obrovac 與 Arcila 都不在裡面，30.14／19.09／23.46／22.48 這幾個數字在公開頁面一個都找不到。**沒有證據說它們是錯的**——可能出自 Hall & Murphy 的書或會員牆後的文章；但在追到出處之前，它們是人名加小數點的具體數字卻無來源，正是本專案列為高風險的那一類。降為 🔴 保留、不刪除，也不拿它們支撐任何訓練建議。'
    text: '待查：Niko Obrovac（克羅埃西亞菁英蛙式）大圓直臂 vs 小圓彎肘：peak acceleration 30.14 vs 19.09 m/s²（+37%），到 12m 5.54 vs 5.66 秒。

      待查：Isabella Arcila 圓背 vs 平背 set position：peak acceleration 23.46 vs 22.48 m/s²，入水距離 2.89 vs 2.75 公尺。

      '
  practical_implication: 訓練優先序：① 先確認後腿踢的存在與幅度（多數人忽略，回報最大）；② 教大圓直臂繞臂（需要肩柔軟度，沒有就保留小圓）；③ 抬頭視角訓練。Set position 的圓背／平背差異暫不列入建議——支撐它的那組數字目前追不到出處（見上方 🔴）。
- id: starts-turns.tech.44
  stroke: starts-turns
  category: stroke-cycle
  title: 自由式 Breakout 七要點——浮上水面時最容易丟掉起跳優勢
  summary: 浮上水面那一段（breakout）是起跳優勢最容易蒸發的地方。七個檢查點都圍繞同一件事：不要過早破壞 streamline、不要過早抬頭。第一划必須與最後一下海豚踢同步啟動（不在過渡踢腿期）；維持 hyperstreamline 直到第一划真正開始；第一划手肘要在身體內側（不外掃）；前伸手保持指緊掌平；下巴貼胸到 breakout 完成才能抬；第一划不換氣。
  mechanism:
    certainty: 🟠
    observation_basis: 七要點是 breakout 教學的整合清單，出自 The Race Club 等體系的公開教學內容，不是本專案的教練觀測；族群是競技自由式選手。外推邊界：清單描述的是「菁英怎麼做」，不是「照做就會變快」的因果——本專案未查到逐項拆解這七點各自貢獻多少速度的研究。其中第 ⑥ 點（下巴貼胸、不抬頭找水面）對本體感覺尚未建立的泳者風險最高，初學階段強行照做容易撞牆或誤判深度，應該先建立深度判讀再套用。
    text: '多數人 breakout 失分的根因：感覺要浮上來了就提前「準備」——手分開、抬頭找水面、第一划同時換氣。每個準備動作都把流線打破，速度被水阻吃掉。

      七要點：

      ① 第一划與最後一下海豚下踢同步啟動（不是過渡到捷式踢之後才划）。

      ② 最後一下海豚踢完才轉強力捷式踢。

      ③ 第一划開始前維持 hyperstreamline，不提前分手。

      ④ 第一划手要在肘部內側發動（不外掃）。

      ⑤ 划手側拉水時前伸手要繼續往前送、指緊掌平、肘不彎。

      ⑥ 下巴貼胸或近胸維持到 breakout 完成；不抬頭看前方（信任本體感覺判斷深度）。

      ⑦ 第一划不換氣（不論距離；200m 以上是「轉身後第一划換氣」，起跳那次不換氣）。

      '
  practical_implication: Breakout 訓練要單獨拉出來練。Drill：streamline → 海豚踢若干下 → 第一划 → 滑行停。慢動作影片回看是否有提前抬頭或提前分手。Breakout 是大量重複才能改的肌肉慣性，不能只靠口令。
- id: starts-turns.tech.5
  stroke: starts-turns
  category: stroke-cycle
  title: Track Start 零位姿勢：臀高於肩的物理邏輯
  summary: Track Start 零位姿勢中臀部應高於肩部，讓重心集中在前足上方，縮短啟動力矩並預備向前傾的動能。
  mechanism:
    certainty: 🔵
    text: 臀部高於肩部將重心前移至前足上方，縮短啟動力矩；肩部前傾讓身體在出發瞬間已具備前向動能，不需從直立重新加速。
  evidence:
  - certainty: 🟢
    text: 前腳膝蓋 130–133°、後腳 76–82°；建議後腳踏板位置 3–4 號（OSB12 台）。
    source: Yeadon et al. / MDPI 2024
    source_ids:
    - src.yeadon-et-al-mdpi-2024
  practical_implication: 起始姿勢設置以臀高肩低為原則，膝蓋角度數據可作為量化參考。
- id: starts-turns.tech.6
  stroke: starts-turns
  category: stroke-cycle
  title: Track Start 推蹬方向與水平速度最大化
  summary: 起跳角度越低，水平速度越高；精英選手起跳角度（21–28°）遠低於傳統建議的 30–40°，關鍵在於水平速度最大化而非角度本身。
  mechanism:
    certainty: 🔵
    text: 蹬伸方向偏垂直時飛行弧線過高、水平速度損失；方向過水平則入水點太近、飛行距離不足；精英選手傾向低角度以保留更多水平速度。
  evidence:
  - certainty: 🟢
    text: 精英選手起跳角度 27.45 ± 5.99°，非精英 39.62 ± 13.19°。
    source: Benjanuvatra et al. 2007
    source_ids:
    - src.benjanuvatra-2007-a
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3990873/
  - certainty: 🟡
    text: 精英選手起跳角度 21.25 ± 5.59°。
    source: Wilson & Marino 1983
    source_ids:
    - src.wilson-1983
  practical_implication: 訓練目標是水平速度最大化，不是追求特定角度數字；降低起跳角度通常有利。
- id: starts-turns.tech.7
  stroke: starts-turns
  category: stroke-cycle
  title: Kick Start 前後腳 GRF 功能分工
  summary: Kick Start 中後腳（楔形台）主要產生水平衝量，前腳（台前緣）主要產生垂直衝量，兩腳功能明確分工，與傳統「前腳主導」教學描述相反。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.takai-2016
    text: 力板直接測量確認：後腳水平衝量顯著高於前腳，前腳垂直衝量顯著高於後腳；楔形台讓後腳從輔助角色成為主要水平推力來源。
  evidence:
  - certainty: 🟢
    text: 力板量測確認 Kick Start 前後腳 GRF 方向分工。
    source: Takeda et al. 2017
    source_ids:
    - src.takai-2016
    url: https://pubmed.ncbi.nlm.nih.gov/27149652/
  practical_implication: 教學重點應調整為「後腳產生水平速度、前腳控制飛行角度」，不再以前腳主導描述 Kick Start。
- id: starts-turns.tech.8
  stroke: starts-turns
  category: stroke-cycle
  title: Kick Start 慣用腳位置
  summary: 慣用腳放台前緣（而非楔形台）能縮短 block 時間、提升 2m/5m 成績，因為前腳負責起跳角度精準控制。
  mechanism:
    certainty: 🔵
    text: 前腳主要貢獻垂直分量以控制飛行角度；慣用腳的角度控制精準度更高，前腳的角度貢獻可能超過後腳水平力量的增益。
  evidence:
  - certainty: 🟢
    text: 慣用腳放前：block 時間更短、2m 和 5m 成績更好、飛行距離更長。
    source: Leg Dominance 研究 2021
    source_ids:
    - src.pmc8700779
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8700779/
  practical_implication: 建議選手以慣用腳置台前緣作為預設，再透過計時測試確認個人最優配置。
- id: starts-turns.tech.9
  stroke: starts-turns
  category: stroke-cycle
  title: Kick Start 重心策略：中立或後重心優於前重心
  summary: Kick Start 中立重心或後重心的 15m 成績優於前重心，與傳統 Track Start 研究結果一致。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.mdpi-2024
    - src.welcher-2008-a
    text: 後重心讓後腳蹬力有更大的水平分量輸出；前重心雖利於反應時間但在水平速度上居劣。
  evidence:
  - certainty: 🟢
    text: 中立與後重心 15m 時間優於前重心。
    source: MDPI 2024
    source_ids:
    - src.mdpi-2024
  - certainty: 🟢
    text: 後重心在水平速度上有優勢。
    source: Welcher et al. 2008
    source_ids:
    - src.welcher-2008-a
  practical_implication: Kick Start 重心設定傾向中立至後重心；不應為加快反應時間而過度前移重心。
- id: starts-turns.tech.10
  stroke: starts-turns
  category: stroke-cycle
  title: 飛行階段：姿勢整理是主要任務
  summary: 飛行階段的重心拋物線在起跳瞬間即已決定，無法在空中修正；此階段主要任務是合攏雙腿與手臂，讓身體成最小截面積備入水。
  mechanism:
    certainty: 🔵
    text: 拋物線路徑由起跳力向量完全決定；飛行中合攏肢體減少入水截面積，降低入水衝擊阻力。
  practical_implication: 飛行階段教學重點在姿勢整備（腿合攏、臂合攏），而非嘗試修正飛行軌跡。
- id: starts-turns.tech.11
  stroke: starts-turns
  category: streamline
  title: 「全身穿過同一個洞」入水原則
  summary: 入水時雙腿沿與身體相同路徑進入水面（全身穿過同一個洞），是減少入水阻力的核心原則；腿部打開或腳踝未伸展會產生額外阻力。
  mechanism:
    certainty: 🔵
    text: 身體各部位依序通過同一入水點，最小化入水截面積；腳踝未伸展或腿部分開會讓後段身體產生波浪阻力，打破已建立的水下滑行動能。
  practical_implication: 入水訓練強調腳踝完全伸展（pointed toes）與腿部緊閉，確保全身通過最小入水孔徑。
- id: starts-turns.tech.12
  stroke: starts-turns
  category: depth
  title: 入水距離與水平速度是成績最強預測因子
  summary: 入水距離和重心水平速度對 15m 成績的影響高於入水角度；三變數合計解釋成績變異 86.1%。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.journal-pone-0241345-a
    text: 入水距離每增加 1m 快 0.6 s；重心水平速度每增加 1 m/s 快 0.3 s；入水角度每平 1 弧度快 0.5 s，影響次於前兩者。
  evidence:
  - certainty: 🟢
    text: 15 名次精英選手量化，三變數解釋 86.1% 成績變異。
    source: PLOS ONE 2020
    source_ids:
    - src.journal-pone-0241345-a
    url: https://doi.org/10.1371/journal.pone.0241345
  practical_implication: 訓練優先序為提升入水距離與水平速度，入水角度調整是手段而非目標。
- id: starts-turns.tech.13
  stroke: starts-turns
  category: depth
  title: 入水深度：最優約 −0.92 m，過淺顯著損害成績
  summary: 推薦最大入水深度約 −0.92 m；過淺入水因截面積大、波浪阻力峰值高，15m 成績顯著慢於中等深度軌跡。
  mechanism:
    certainty: 🔵
    text: 身體近水平入水時接觸水面積大，入水瞬間波浪阻力峰值高；水下軌跡偏淺難以充分利用重力加速後的速度，轉水平距離更長，速度耗散更多。
  evidence:
  - certainty: 🟢
    text: 淺軌跡（Dive 1）15m 成績顯著慢於中等深度（Dive 2）；推薦最大深度 −0.92 ± 0.16 m。
    source: Tor, Pease & Ball 2015, PubMed 25455956
    source_ids:
    - src.pmid-25455956
    url: https://pubmed.ncbi.nlm.nih.gov/25455956/
  practical_implication: 入水後應尋求約 0.9 m 的最大深度，避免過淺入水路徑。
- id: starts-turns.tech.14
  stroke: starts-turns
  category: stroke-cycle
  title: 仰式起跳：髖部高度是核心表現變數
  summary: 仰式起跳中髖部高度提升可增大起跳後水平速度；「背部有沒有出水」是外觀指標，髖高才是正確評判維度。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmc4234766-a
    text: 髖部高度直接影響起跳方向的水平分量；起跳角度越大（弧線越高）成績越差，與俯式起跳邏輯一致。
  evidence:
  - certainty: 🟢
    text: 髖部高度提升與水平速度正相關；起跳角度大與成績差相關。
    source: 'The Backstroke Swimming Start: State of the Art'
    source_ids:
    - src.pmc4234766-a
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4234766/
  practical_implication: 仰式起跳教學應以最大化髖部高度為目標，不以背部出水程度作評估指標。
- id: starts-turns.tech.15
  stroke: starts-turns
  category: stroke-cycle
  title: 仰式出發台（Backstroke Ledge）效益：改善入水距離而非推力
  summary: 使用 OBL2 出發台讓 10m 時間快 0.13 s、入水距離多 0.14 m；機制是讓頭部入水距離更遠，不是靠更大的水平推力。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmid-28975846
    text: OBL2 改善的是起跳角度與飛行弧線的水平延伸，使頭部入水點更遠；起跳角度（水平延伸）比推力大小對成績的影響更大。
  evidence:
  - certainty: 🟢
    text: OBL2：10m 時間快 0.13 s，入水距離多 0.14 m。
    source: 'Barkwell, G. E., & Dickey, J. P. (2018). Backstroke start performance: the impact of using the Omega OBL2 backstroke ledge. Sports Biomechanics, 17(4), 429–441.'
    source_ids:
    - src.pmid-28975846
    url: https://pubmed.ncbi.nlm.nih.gov/28975846/
  practical_implication: 推廣使用仰式出發台；教學重點在優化起跳水平延伸，而非單純增加推力。
  cross_ref: starts-turns.tech.12（出發台改善的入水距離即該條的最強預測因子）
  cross_ref_ids:
  - starts-turns.tech.12
- id: starts-turns.tech.16
  stroke: starts-turns
  category: stroke-cycle
  title: 仰式起跳推蹬：臀部先出水再蹬腿
  summary: 仰式起跳的關鍵時序是先讓臀部完全出水，再蹬直腿部；若腿蹬得太早，水的阻力會直接對抗蹬腿力量。
  mechanism:
    certainty: 🔵
    text: 臀部仍在水中時蹬腿，水阻力對抗蹬腿力量，力量無法完整轉換為水平速度；臀部出水後蹬腿，推力轉換效率最大化。
  practical_implication: 仰式起跳教學應強調動作時序：臀部出水 → 腿部蹬直，兩者不可同步或顛倒。
- id: starts-turns.tech.17
  stroke: starts-turns
  category: concept
  title: 轉身核心目標：速度損失最小化
  summary: 轉身的每個決策都圍繞「讓泳者盡快重新達到接近游泳速度的水平速度」；進牆速度是轉身成績的首要預測變數。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmc8960438-c
    - src.pmc6409673-b
    - src.pmid-40252339-a
    text: 進牆速度越高，推出速度越高；推蹬力道解釋成績約 42% 的變異，推蹬方向與流線型解釋其餘 58%。
  evidence:
  - certainty: 🟢
    text: 進牆速度與推出速度正相關。
    source: Journal of Applied Biomechanics 1998; PMC8960438
    source_ids:
    - src.pmc8960438-c
  - certainty: 🟢
    text: 推蹬力道解釋成績約 42% 的變異。
    source: PMC6409673
    source_ids:
    - src.pmc6409673-b
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6409673/
  - certainty: 🟢
    text: 推蹬力向量與重心軌跡對齊程度與出水速度相關 r = 0.76（p < 0.001）。
    source: Koster, P., Schreven, S., David, S., & Beek, P. J. (2025). Can the tumble turn performance be improved by aligning the push-off force vector to the centre of mass trajectory? Journal of Biomechanics, 185, 112694.
    source_ids:
    - src.pmid-40252339-a
  practical_implication: 訓練優先順序：流線型時機 → 推蹬方向 → 推蹬力道；進牆前任何減速行為都直接損害成績。
- id: starts-turns.tech.18
  stroke: starts-turns
  category: streamline
  title: 流線型應在腳觸牆前完成，而非推出後整理
  summary: 腳觸牆時雙臂應已就位於流線型姿勢，而非推出後再整理；推出後才整理流線型會讓部分力量轉為旋轉動量，效率損耗。
  mechanism:
    certainty: 🔵
    text: 腳觸牆時流線型已就位，推蹬力直接轉換為水平速度；推出後整理流線型則部分推蹬衝量轉為旋轉動量而浪費。
  practical_implication: 翻滾訓練中強調「雙臂比腳先就位」，觸牆瞬間流線型已完成。
- id: starts-turns.tech.19
  stroke: starts-turns
  category: tempo
  title: 進牆速度保護：最後一划完整，距離不對補踢腿
  summary: 蛙式/蝶式轉身前最後一划應完整推水；距離判斷不準時補一個踢腿，而非縮短划手或提前收手「湊牆」。
  mechanism:
    certainty: 🔵
    text: 提前收手讓速度在觸牆前提早流失；最後一划縮短也讓觸牆時手臂位置不理想，雙重損失進牆速度。
  evidence:
  - certainty: 🟠
    text: 縮臂湊牆被直接列名為轉身錯誤。
    source: MySwimPro 2022
    source_ids:
    - src.myswimpro-2022
  practical_implication: 教學口令：「划完再轉，不夠就踢，不要縮手湊。」
- id: starts-turns.tech.20
  stroke: starts-turns
  category: watersense
  title: 自由式翻滾：計步判距，頭不抬
  summary: 有經驗的泳者靠計步（stroke count）判斷翻滾時機而非視覺；抬頭看牆會破壞翻滾旋轉動量並讓身體提前減速。
  mechanism:
    certainty: 🔵
    text: 抬頭看牆使頸部伸展，破壞翻滾啟動的旋轉動量；頭部朝下保持翻滾動量並維持進牆速度；計步是無需視覺確認距離的神經控制策略。
  evidence:
  - certainty: 🟠
    text: 翻滾啟動時機研究以 tuck index 為主要變數；頭部朝下是教練觀測共識。
    source: PMC5260528; The Race Club; 360swim
    source_ids:
    - src.pmc5260528
  practical_implication: 訓練計步能力是自由式轉身的核心技能；啟動翻滾時視線向下看池底，不看牆。
- id: starts-turns.tech.21
  stroke: starts-turns
  category: stroke-cycle
  title: 自由式轉身觸牆：膝蓋屈曲 100–120° 最優
  summary: 自由式翻滾觸牆時膝蓋屈曲 100–120° 為最優範圍，讓股四頭肌處於最佳力–長度關係並最大化 SSC 預載。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmc6409673-b
    text: 膝蓋角度 100–120° 讓股四頭肌在最佳力–長度曲線上預載彈性能；< 90° 超出最佳曲線，推力下降；> 120° 預載不足，衝量減少。
  evidence:
  - certainty: 🟢
    text: 觸牆膝蓋屈曲 100–120° 最優範圍。
    source: PMC6409673
    source_ids:
    - src.pmc6409673-b
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6409673/
  practical_implication: 翻滾時機訓練目標：觸牆時膝蓋約 100–120°；tuck 過深或過淺均損害推蹬力。
- id: starts-turns.tech.22
  stroke: starts-turns
  category: streamline
  title: 自由式轉身推蹬：力向量對齊重心決定出水速度
  summary: 推蹬力向量與重心軌跡的對齊程度是出水速度的強預測因子（r = 0.76）；觸牆過深導致推蹬方向偏上，水平速度損失。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmid-40252339-a
    text: 腳觸牆深度直接決定推蹬方向；觸牆過深時推蹬方向偏上，水平分量減少，出水速度下降。
  evidence:
  - certainty: 🟢
    text: 推蹬力向量對齊與出水速度 r = 0.76（p < 0.001）。
    source: Koster, P., Schreven, S., David, S., & Beek, P. J. (2025). Can the tumble turn performance be improved by aligning the push-off force vector to the centre of mass trajectory? Journal of Biomechanics, 185, 112694.
    source_ids:
    - src.pmid-40252339-a
  practical_implication: 腳觸牆位置的深度控制是轉身技術的關鍵量化目標。
- id: starts-turns.tech.23
  stroke: starts-turns
  category: watersense
  title: 仰式轉身計步：無跨選手通用數字，需分速度標定
  summary: 旗幟（5m）到牆的划手次數隨游速改變而變動；沒有跨選手通用數字，也沒有適用所有速度的固定數字，需在慢/中/比賽速度各自標定。
  mechanism:
    certainty: 🔵
    text: 游速快時划效提高，相同步數覆蓋更長距離；訓練量增加後划幅改變，步數也隨之變動，需定期重新確認。
  evidence:
  - certainty: 🟠
    text: 旗幟到牆的划手次數取決於速度與划效，身高與臂長也有影響；原文另指出技術變好、變壯之後步數會改變，且完成式、轉身、碼池與公尺池、比賽速與熱身速各自的步數都不一樣，需分別標定。
    source: Bay, S. (2024). How to Use Backstroke Flags in Swimming. U.S. Masters Swimming.
    source_ids:
    - src.usms-bay-2024-backstroke-flags
  practical_implication: 教練應幫助泳者建立三速計步庫（慢/中/比賽速），並在訓練量或技術改變後重新標定。
- id: starts-turns.tech.24
  stroke: starts-turns
  category: stroke-cycle
  title: 仰式轉身：翻滾動作與自由式相同，俯臥觸牆不違規
  summary: 仰式轉身的翻滾動作與自由式翻滾相同；泳者翻轉成俯臥姿觸牆不違規，FINA 規則允許翻轉後以俯臥姿觸牆但需在轉身過程中連續完成。
  mechanism:
    certainty: 🔵
    text: 仰式轉身以俯臥姿觸牆後推蹬，利用與自由式相同的翻滾旋轉動量；連續翻轉的力學效率高於停頓後再旋轉。
  practical_implication: 仰式轉身教學可直接移轉自由式翻滾的肌動學訓練；強調連續性，不在觸牆後停頓。
- id: starts-turns.tech.25
  stroke: starts-turns
  category: stroke-cycle
  title: 蛙式轉身觸牆深度：最優 30–40 cm
  summary: 蛙式/IM 轉身最優腳觸牆深度為 30–40 cm；過深導致推蹬方向偏上，水平速度損失；髖部不應主動下沉來「找牆」。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmc8960438-d
    text: 腳觸牆深度決定推蹬角度；30–40 cm 深度使推蹬方向接近水平，水平速度輸出最佳；更深時垂直分量增大，水平速度降低。
  evidence:
  - certainty: 🟢
    text: 最優腳觸牆深度 30–40 cm，此深度下水平推蹬速度最佳。
    source: PMC8960438
    source_ids:
    - src.pmc8960438-d
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8960438/
  practical_implication: 教學重點：縮腿路徑自然決定腳的深度；避免主動壓低髖部「找牆」。
- id: starts-turns.tech.26
  stroke: starts-turns
  category: stroke-cycle
  title: 蛙式 Pullout 三種技術：無統計顯著差異，個人測試決定
  summary: 世界級精英的 Combined（蝶腳與拉手重疊）、Fly-Kick First、Pull-Down First 三種 Pullout 技術在蛙式成績間無統計顯著差異；無單一最優技術，應依個人測試選擇。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.mccabe-2022
    text: 三種技術在推出速度與水下路徑效率上有不同取捨；個人肌力與柔韌性特性決定哪種技術效益最高，強制統一模式會損害部分選手表現。
  evidence:
  - certainty: 🟢
    text: 世界級精英 150 次試驗：Combined 71 次（最多）、Fly-Kick First 65 次、Pull-Down First 14 次；三種技術在 50/100/200m 成績間無統計顯著差異。男性偏好 Combined，女性偏好 Fly-Kick First。
    source: PMC9445308 Frontiers 2022
    source_ids:
    - src.mccabe-2022
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9445308/
  practical_implication: 教學應讓選手試驗三種技術並計時比較，以個人最快結果為準，不強制統一。
- id: starts-turns.tech.27
  stroke: starts-turns
  category: depth
  title: 蛙式水下滑行最優深度 0.4–0.6 m
  summary: 蛙式轉身後水下滑行最優深度 0.4–0.6 m，來自背→蛙轉身研究數據，可作為蛙式 pullout 參考。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pmc8960438-d
    text: 適當深度讓身體在無波浪阻力的水層充分利用推出速度；過深增加轉回水平的額外能耗，過淺受波浪阻力影響。
  evidence:
  - certainty: 🟢
    text: 最優滑行深度 0.4–0.6 m（背→蛙轉身研究）。
    source: PMC8960438
    source_ids:
    - src.pmc8960438-d
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8960438/
  practical_implication: 蛙式推出後維持流線型滑行於 0.4–0.6 m 深度，再啟動 pullout 動作序列。
- id: starts-turns.tech.28
  stroke: starts-turns
  category: comparison
  title: IM 蝶→背轉身：四式 IM 中最快的轉身
  summary: 蝶→背是四式 IM 轉身中時間最短的，因為不需執行翻滾，雙手直接觸牆後腳即可落牆；但觸牆後停頓、旋轉過慢、多吸一口氣是主要效率損失來源。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.born-2022-im
    text: 無翻滾動作縮短轉身路徑；但觸牆後確認停頓、縮腿路徑過長、換氣打斷旋轉動量均直接增加轉身時間。
  evidence:
  - certainty: 🟢
    text: 四式 IM 轉身中蝶→背轉身時間最短。
    source: Born, Romann & Stöggl 2022
    source_ids:
    - src.born-2022-im
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9157519/
  practical_implication: 蝶→背訓練重點：觸牆同時啟動縮腿（不停頓），快速收膝縮短旋轉半徑，全程閉氣。
  cross_ref: starts-turns.tech.36（文中點名的三大效率損失：停頓、旋轉慢、換氣）
  cross_ref_ids:
  - starts-turns.tech.36
- id: starts-turns.tech.29
  stroke: starts-turns
  category: stroke-cycle
  title: 背→蛙規則：觸牆時仰臥、離牆時俯臥，旋轉在牆上完成
  summary: 背→蛙規則精確解讀：觸牆時肩部仍在仰式位置（背面朝上），離牆時肩部已完成 ≥ 90° 旋轉至俯臥；旋轉在牆上完成，觸牆與離牆是兩個獨立時間點要求。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.fina-sw64-usas-usms
    text: FINA/World Aquatics 規則明確分離兩個時間點：觸牆時（仰臥）與離牆時（俯臥）；中間旋轉在牆上快速完成。常見犯規是觸牆前提前側滾（疲勞時加快觸牆的捷徑）。
  evidence:
  - certainty: 🟢
    text: FINA Swimming Technical Rules SW 6.4 確認觸牆/離牆兩點要求。
    source: FINA/World Aquatics SW 6.4; USA Swimming; USMS
    source_ids:
    - src.fina-sw64-usas-usms
  practical_implication: 教學需分別訓練兩個時間點的身體位置；長距離 IM 疲勞段需特別注意不提前側滾。
- id: starts-turns.tech.30
  stroke: starts-turns
  category: comparison
  title: 背→蛙三種轉法比較：Crossover 推出速度最高，但 7.5m 成績無顯著差異
  summary: Crossover 轉法推出速度（2.17 m/s）顯著高於 Open（2.03）與 Somersault（2.02），但 7.5m 成績三種技術無顯著差異；執行穩定性可能比技術選擇更重要。
  mechanism:
    certainty: 🔵
    text: 三種技術在推出速度與水下路徑效率之間做不同取捨：Crossover 腳觸牆最淺（推蹬最水平），Somersault 最深（推蹬方向偏上但水下路徑更深）；速度差距在 7.5m 內被阻力抹平，且 pullout 品質主導後段。
  evidence:
  - certainty: 🟢
    text: Crossover 推出 2.17 ± 0.05 m/s（p = 0.01 顯著）；7.5m 成績三種技術無顯著差異（平均 4.86 ± 0.98 s）；受試者為 age-group swimmers。
    source: PMC7918682
    source_ids:
    - src.pmc7918682
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7918682/
  practical_implication: 技術選擇應以個人計時測試（觸牆到 7.5m）為依據；將任一技術練到完全一致，可能比半熟練 Crossover 更有利。
- id: starts-turns.tech.31
  stroke: starts-turns
  category: comparison
  title: 背→蛙三種轉法適用情境
  summary: Open turn 適合初學者與長距離 IM；Bucket turn 需良好憋氣能力；Crossover 適合短距離 IM 技術熟練者，技術要求最高且失誤易犯規。
  mechanism:
    certainty: 🟠
    observation_basis: 三種轉法的適用情境分類來自 360swim、U.S. Masters Swimming 與 Swimming World 的公開教學內容，不是本專案的教練觀測；族群是成人泳者與 masters 競賽者。外推邊界：「Bucket turn 的 pullout 氧耗高」是教學說法，本專案沒有查到對背→蛙三種轉法做代謝或攝氧量對照的研究，該項只能當作選轉法時的權衡提示，不可寫成已量化的生理代價。
    text: Open turn 旋轉弧度最長但動作穩定；Bucket turn 翻滾後 pullout 氧耗高；Crossover 旋轉複雜，提前過垂直面是犯規高風險點。
  evidence:
  - certainty: 🟠
    text: 適用情境分類來自教練系統觀測。
    source: 360swim; USMS; Swimming World
    source_ids:
    - src.360swim-usms-swimming-world
  practical_implication: 400 IM 疲勞段若無法完整執行 Crossover，改用 Open turn 更穩定；100/200 IM 技術熟練者可考慮 Crossover。
- id: starts-turns.tech.32
  stroke: starts-turns
  category: depth
  title: 水下比水面快：無波浪阻力 + 初始速度優勢
  summary: 出發/轉身後水下初始速度遠高於游泳速度；水下無波浪阻力；實用深度 0.4–0.6 m，超過 0.75 m 無額外效益。
  mechanism:
    certainty: 🔵
    text: 水面波浪阻力（wave drag）在水下消失；出發/轉身賦予的初始速度超過游泳速度，使水下階段比水面更快；超過最優深度後轉回水平的能耗抵消深度帶來的低阻優勢。
  evidence:
  - certainty: 🟢
    text: 實用深度 0.4–0.6 m；超過 0.75 m 無額外效益。
    source: Lyttle 1998; Novais et al. 2012
    source_ids:
    - src.lyttle
  practical_implication: 出發轉身後維持 0.4–0.6 m 深度進行 UDK，不追求更深的水下路徑。
- id: starts-turns.tech.33
  stroke: starts-turns
  category: kick
  title: UDK 速度關鍵：上踢腳尖峰值速度，精英靠踢速而非踢距
  summary: UDK 速度的核心決定因素是上踢的腳尖峰值速度；精英選手的水下優勢來自更快的踢腿速度，而非更長的水下距離。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.frontiers-2021
    text: 上踢時腳尖加速產生主要推進力；更高的腳尖峰值速度意味著更大的推進衝量；增加水下距離而踢速不足，只是延長減速滑行，反而無益。
  evidence:
  - certainty: 🟢
    text: 精英選手水下優勢來自更快踢腿速度，非更長水下距離。
    source: Frontiers 2021
    source_ids:
    - src.frontiers-2021
  practical_implication: UDK 訓練重點在提升踢腿速度，而非追求更長的水下距離。
  cross_ref: udk.tech.10（上踢是關鍵預測變數）、udk.tech.18（水下距離由速度衰減曲線決定，非越長越好）
  cross_ref_ids:
  - udk.tech.10
  - udk.tech.18
- id: starts-turns.tech.34
  stroke: starts-turns
  category: kick
  title: UDK 動作要點：入水後先滑行再起踢，小幅高頻，最後一踢銜接第一抓水
  summary: UDK 核心要點：入水後先滑行再起踢；採小幅度高頻率；臀部固定；最後一踢與第一個抓水同步，不留空窗。
  mechanism:
    certainty: 🔵
    text: 先滑行讓身體在高速中整備流線型再施力；小幅高頻減少阻力波動；臀部固定確保力量從核心傳遞至腳尖；最後一踢銜接第一抓水避免出水過渡期速度空窗。
  practical_implication: 出水訓練強調最後一踢與第一抓水的時序同步，消除出水空窗。
- id: starts-turns.tech.35
  stroke: starts-turns
  category: comparison
  title: 各式 UDK 姿勢差異：蛙式不用 UDK，改為 pullout
  summary: 自由式/蝶式採俯臥 UDK，仰式採仰臥 UDK，蛙式不用 UDK 而改為 pullout（水下单次划手+一次蛙踢）；仰式出水時鼻子需在水面，自由式出水時最後一踢與第一抓水同步。
  mechanism:
    certainty: 🔵
    text: 蛙式規則禁止多次 UDK；仰式水下維持仰臥以便出水時轉換為捷式踢；各式出水時機與銜接動作因規則與力學需求不同而有差異。
  practical_implication: 教學應針對各式明確區分水下動作類型，避免混用 UDK 與 pullout 概念。
- id: starts-turns.tech.36
  stroke: starts-turns
  category: errors
  title: 蝶→背轉身三大效率損失：停頓、旋轉慢、換氣
  summary: 蝶→背轉身最常見效率損失：觸牆後停頓確認、縮腿路徑過長旋轉慢、觸牆後抬頭換氣打斷旋轉動量；正確做法是觸牆同時縮腿、快速收膝、全程閉氣。
  mechanism:
    certainty: 🔵
    text: 觸牆停頓使旋轉動量歸零需重新加速；腿未收緊時轉動慣量變大，在同樣的角動量下角速度下降、旋轉變慢（2026-09-04 更正原文「旋轉半徑大增加角動量」——角動量在旋轉中是守恆的，收腿改變的是轉動慣量不是角動量）；換氣抬頭破壞旋轉連續性並增加阻力。
  evidence:
  - certainty: 🟠
    text: 效率損失清單來自教練系統觀測。
    source: USMS; SGSwim
    source_ids:
    - src.usms-sgswim
  practical_implication: 訓練口令：觸牆不停頓（同時縮腿）、膝蓋快收向胸口、全程閉氣到出水。
- id: starts-turns.tech.37
  stroke: starts-turns
  category: errors
  title: 背→蛙常見犯規：觸牆前肩部提前過垂直面
  summary: 背→蛙最常見犯規是觸牆前肩部提前側滾過垂直面（提前轉身看牆），在長距離 IM 疲勞段尤其常見；正確時序是觸牆後才啟動旋轉。
  mechanism:
    certainty: 🟠
    observation_basis: 規則部分（觸牆時仍須維持仰式位置，提前過垂直面即失格）是規則條文，不需要觀察者；需要觀察者的是「疲勞時泳者傾向提前旋轉以確認牆距」這個行為傾向， 2026-09-04 檢視時本檔沒有記錄是誰觀察的、觀察了哪些選手，本專案也未查到統計此犯規在疲勞段發生率的資料。外推邊界：此傾向只能當作訓練設計的提示（在疲勞狀態下練背→蛙轉身），不可寫成「長距離 IM 的主要失格原因」——本專案沒有失格原因的分布數據。
    text: 疲勞時泳者傾向提前旋轉以確認牆距，但這違反「觸牆時仍在仰式位置」的規則要求；犯規直接導致失格。
  practical_implication: 長距離 IM 訓練應包含疲勞狀態下的背→蛙轉身練習，建立即使疲勞也不提前旋轉的動作模式。
- id: starts-turns.tech.38
  stroke: starts-turns
  category: errors
  title: 翻滾啟動時機：太早導致觸牆角度過垂直，太晚損失進牆速度
  summary: 自由式翻滾啟動太早會讓腳觸牆角度過垂直（推蹬方向偏上），太晚則降低進牆速度或超過牆面；正確時機通常在最後一划末端啟動，頭已低於水面。
  mechanism:
    certainty: 🔵
    text: 啟動太早時身體旋轉弧度在接近牆時已過大，腳觸牆點偏高，推蹬方向偏上；啟動太晚則需減速避免撞牆，或旋轉未完成就已過牆。
  evidence:
  - certainty: 🟠
    text: 以 tuck index（腳觸牆時臀部距牆距離）為主要測量變數；最優翻滾啟動距離無跨選手通用量化值。
    source: PMC5260528; The Race Club; 360swim
    source_ids:
    - src.pmc5260528
  practical_implication: 以「最後一划末端啟動、頭已低於水面」作為計步之外的啟動參照信號。
- id: starts-turns.tech.39
  stroke: starts-turns
  category: concept
  title: 起跳技術測量指標不一致：反應時間/入水速度/15m 時間結論可能相反
  summary: 不同測量指標（反應時間、入水速度、15m 總時間）對相同起跳技術的評估結論可能相反；精英 vs 非精英樣本差異與個體生物力學差異是主要混淆因素。
  mechanism:
    certainty: 🔵
    text: 優化反應時間的技術選擇（如前重心）不一定最大化水平速度；水下表現佔整體起跳時間 84%，5m 速度比離台速度更能預測整體成績；跨指標結論不一致是文獻爭議的根本來源。
  evidence:
  - certainty: 🟠
    text: 水下階段佔整體起跳時間約 84%。
    source: Cossor & Mason 2001
    source_ids:
    - src.cossor-2001
  practical_implication: 選手評估起跳技術時應以最終成績指標（15m 時間）為主，不以單一中間指標（如離台速度）判斷優劣。
- id: starts-turns.tech.40
  stroke: starts-turns
  category: hardware
  title: 膝蓋角度與個人肌肉特性高度相關，無跨選手通用最優值
  summary: 起跳與轉身推蹬的最優膝蓋角度與個人肌力特性高度相關；研究確立了雙邊邊界（「不是越直越好也不是越彎越好」），但無跨選手通用數字。
  mechanism:
    certainty: 🟢
    evidence_from:
    - starts-turns.tech.21
    - starts-turns.tech.3
    text: 股四頭肌力–長度關係因個人肌纖維比例與訓練歷程而異；最優預載角度因人而異，研究提供的範圍（100–120°）是群體均值，個人可能在範圍之外仍表現最佳。
  practical_implication: 教練應以雙邊邊界為指引，對個別選手進行膝蓋角度的計時優化，而非套用固定數字。
  cross_ref: starts-turns.tech.21、starts-turns.tech.3（原 evidence_from：膝蓋角度的兩個承載條目）
  cross_ref_ids:
  - starts-turns.tech.21
  - starts-turns.tech.3
- id: starts-turns.tech.45
  stroke: starts-turns
  category: comparison
  title: 水下速度是起跳時間的最強預測因子——勝過離台時間與飛行距離
  summary: 跨所有競技層級包含 Paralympic，水下階段速度是「總起跳時間（到 15m）」的最強預測因子；離台時間與飛行距離的影響相對次要。S10 / Olympic 級選手水下速度約 3 m/s，S8/S9 級因 streamline 維持困難常低 40–50%。
  mechanism:
    certainty: 🔵
    text: 起跳後身體速度從入水的 5–6 m/s 開始衰減，水下階段越短/越快、抵達 15m 越快。streamline 緊度與第一下海豚踢時機直接決定衰減曲線；任何 streamline 鬆掉的瞬間阻力暴增（速度平方）。對 S8/S9 等軀幹控制不全的選手，streamline 維持困難造成顯著速度損失，因此這類選手的起跳改善重點不是離台爆發力（無法輕易改善），而是水下姿勢（可大幅改善）。
  practical_implication: 起跳訓練優先序——水下姿勢與第一下海豚踢時機 >> 離台爆發力。對能力較有限的選手（含部分 Paralympic 級別），這個排序差異尤其關鍵。15m 計時應分段測（離台/入水/出水 15m），找出個別選手的衰減瓶頸。
  cross_ref: starts-turns.tech.12（離台時間與飛行距離的舊預測因子）、starts-turns.tech.39（15m 分段量測指標不一致）、udk.tech.17（第一下海豚踢時機）
  cross_ref_ids:
  - starts-turns.tech.12
  - starts-turns.tech.39
  - udk.tech.17
- id: starts-turns.tech.46
  stroke: starts-turns
  category: stroke-cycle
  title: Paralympic 級別決定 SR/SL 最佳組合——SR 主導 vs SL 主導視級別而定
  summary: Paralympic 不同級別與比賽時間的相關性結構不同。S8–S9 對划頻（SR）高度敏感（r = −0.51 至 −0.78）、對划距（SL）相對不敏感；S7 中度依賴划距；S10 高度依賴划距。處方必須按級別個別化——對 S8/S9 喊「拉長划距」是錯誤建議，對 S10 喊「拉高划頻」也錯。
  mechanism:
    certainty: 🟢
    source_ids:
    - src.pereira-2018
    - src.pmc10813451
    text: 不同障別下「能維持的最大推進力」的限制因子不同。軀幹控制較弱的級別無法把 stroke 拉長（核心會崩潰），只能靠提高頻率；軀幹完整的級別則可以從拉長 stroke 中獲益。Pereira 2018 (Redalyc) 跨國家級身障泳者實測證實 SL/stroke index/速度隨功能性 class（S4→S10）顯著上升、SR 不隨之上升；S4 與 S8/S9/S10 在 SR/SL/速度上有顯著差異；Olstad 2024 IMU 量測驗證了這個 class-stratified 模式。「個人結構決定 SR/SL 最佳組合」這個原則對非 Paralympic 選手也適用——肩柔軟度差的選手無法做菁英級延伸划距，提高頻率反而是更好的策略。
  evidence:
  - certainty: 🟢
    text: 國家級身障泳者實測 SL/stroke index/速度隨 functional class 顯著上升、SR 不隨之上升；class 間有顯著差異
    source: Pereira et al. 2018, Freestyle stroke parameters of national level swimmers with physical impairments
    source_ids:
    - src.pereira-2018
    url: https://www.redalyc.org/journal/710/71059023007/html/
  - certainty: 🟢
    text: IMU 自動量化 Paralympic 泳者 stroke mechanics 確認 class-stratified SR/SL 模式
    source: Validation of Automatically Quantified Swim Stroke Mechanics Using an Inertial Measurement Unit in Paralympic Athletes, 2023
    source_ids:
    - src.pmc10813451
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10813451/
  practical_implication: 教練處方 SR/SL 前要先評估選手能延伸 stroke 的硬體上限。對軀幹控制不全或肩柔軟度有限的選手，與其追求「拉長划距」不如優化頻率；硬體允許延伸的選手才走划距路線。「Distance Per Stroke 越大越好」是某類選手才適用的部分真理。
  cross_ref: free.tech.35（SR–SL 負相關與可訓練斜率）、free.tech.3（精英在高划頻下維持划距）
  cross_ref_ids:
  - free.tech.35
  - free.tech.3
