  purpose_zh: 戴呼吸管閉眼蝶腿，拿掉視覺後讓核心驅動波動的感覺浮出來
  how_to:
  - 戴呼吸管、面朝下，雙手放身側
  - 閉眼打蝶腿，把感官集中在腹部與胸口的波動傳遞
  - 每 10 秒睜眼確認方向；逐步延長到 20 秒
  - 重點不在距離，在感受波動是否仍從核心啟動
  perception_goal: 閉眼後波動的源頭變得明顯；核心是鞭柄、腳是鞭梢
  success_signal: 閉眼期間方向穩定；波動感清楚
  failure_signal: 立刻漂離中線；波動從膝蓋啟動
