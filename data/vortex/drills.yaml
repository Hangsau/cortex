  difficulty_tier: elite
- id: STEL2
  name_en: Leg Kick Flops
  name_zh: 仰式出發腿驅動跳
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L5
  - L6
  abc_type: C
  purpose_zh: Race Club 仰式出發專項 drill：強調腿/髖往上爆發，不靠手——讓臀部和大腿先離水後手才進入水
  how_to:
  - 正常仰式出發姿勢（腳貼牆、抓握把）
  - 出發時專注雙腿往上方爆發推送，讓臀部先離開水面、形成空中拋物線
  - 手反而是被動跟著走，不主動往後甩
  - 做 5-10 次，組間休 60 秒；專注腿驅動感
  perception_goal: 出發時感覺臀部和大腿先飛起；手是被動的
  success_signal: 身體形成乾淨拋物線；入水後仍有強流線
  failure_signal: 靠手拉起身體；身體入水時已散
  deficiency_fixes:
  - C
  source: The Race Club — Fundamentals of Fast Swimming Ch 24
  source_ids:
