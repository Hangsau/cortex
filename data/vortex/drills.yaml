- id: UDKLow1
  name_en: Surface Dolphin Kick with Snorkel
  name_zh: 水面呼吸管蝶腿
  strokes:
  - underwater_dolphin_kick
  category: kick
  equipment:
  - snorkel
  l_target:
  - L3
  abc_type: B
  purpose_zh: 在水面正常呼吸的條件下，感受輕鬆蝶腿的連續節律，作為主項目前的動作準備；一般呼吸管不能在管口浸沒後供氣
  how_to:
  - 先在能站穩或扶牆的位置熟悉呼吸管；臉入水、管口露出水面，確認能自然呼吸及自行停止
  - 從水面輕鬆出發，雙手舒適前伸，做小幅連續蝶腿；保持管口在水面上，不接水下潛行
  - 先做自己能保持正常呼吸與節律的短段，到達自己預定的位置或動作失控就停下；距離及休息依能力調整，不要求游滿 25 公尺
  - 恢復後可接無呼吸管的水面踢腿或完整游，檢查節律是否保留；進水、呼吸不順或緊張時立即停下，不用憋氣補完
  perception_goal: 自然呼吸時，仍能感到波動連續傳到腳部，不需用抬頭或大幅踢水找支撐
  success_signal: 管口保持在水面上，呼吸自然，短段節律可重複
  failure_signal: 管口反覆浸沒、呼吸不順，或波動幅度越來越大；停止並縮短或退回扶牆練習
  deficiency_fixes: []
  source: Vortex 水面操作設計；呼吸管僅供水面呼吸的功能說明：Pollock（2015），DAN。步驟與距離不是該文的訓練處方
  source_ids:
