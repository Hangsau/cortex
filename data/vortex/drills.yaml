  perception_goal: 建立純聽覺/觸覺的空間判斷，取代視覺
  success_signal: 誤差在 30 公分內；翻身不撞牆不撈空
  failure_signal: 嚴重誤差（>1 公尺）；需要睜眼或撞牆
