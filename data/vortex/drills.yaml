  - L2
  abc_type: null
  purpose_zh: 站姿模擬蝶式胸壓帶動髖前後的動作，建立短軸波動的肌肉感覺；蝶式熱身首選
  how_to:
  - 站在及腰水深，雙手放大腿
  - 把胸口往前下壓——同時髖往後拱（像 cobra 弓背）
  - 再把胸口往上挺——髖往前送（骨盆前傾）
  - 重複 10 次，配呼吸節律；下水時把這個感覺帶進蝶腿
  perception_goal: 胸壓和髖動作的反向連動清晰；蝶式波動的源頭可視化
  success_signal: 胸與髖的反向動作流暢；身體像柔軟的桿子
  failure_signal: 胸與髖一起前後（沒有反向）；動作僵硬
  deficiency_fixes:
