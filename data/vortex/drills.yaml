  abc_type: C
  purpose_zh: 兩側都會轉：每趟輪流用左手、右手當先離牆的那隻，避免只會往一個方向轉。
  how_to:
  - 蛙式或蝶式游進牆，雙手同時觸牆
  - 單數趟由左手先離牆（往左側轉），雙數趟由右手先離牆（往右側轉）
  - 每趟之間在牆邊停下檢查：先離牆的手肘有沒有收在身旁、越頂手有沒有彎肘入水
  - 兩側的流暢度差很多時，弱的那側多練幾趟，但速度先放慢
  perception_goal: 兩側轉身的感覺一致，不需要為了轉身方向臨時調整進牆步調。
  success_signal: 左右兩側轉身時間接近、離牆姿勢都乾淨。
  failure_signal: 弱側明顯卡住、進牆前就先偏向慣用側。
  deficiency_fixes: []
