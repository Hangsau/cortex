- id: ST20
  name_en: 'Backstroke Breakout: Back Dolphin, Transition Kick, First Stroke'
  name_zh: 仰式破水：仰臥海豚踢、轉換踢、第一划
  strokes:
  - starts_turns
  category: timing
  equipment:
  - fins
  l_target:
  - L4
  - L5
  abc_type: C
  purpose_zh: 練仰式從水下到水面的銜接：仰臥海豚踢，換成仰式踢，第一划在頭破水之前就開始。
  how_to:
  - 仰臥蹬牆，雙臂流線，開始水下海豚踢；水下距離由教練指定，不超過規則上限，也不憋到極限，有人在旁邊看
  - 最後一下上踢時發動第一划，隨後轉成有力的仰式踢，接著連續游數划
  - 仰臥時氣泡只會往水面跑，對阻力沒有幫助；用鼻夾或上唇輕壓鼻孔，把空氣留在肺裡、水擋在鼻外，找到自己穩定的方法
  - 同伴看第一划是否在頭破水前就開始、轉換踢是否有力
  perception_goal: 水下的推進直接接到水面的第一划，中間沒有空窗。
  success_signal: 破水時速度不掉、第一划接得上、鼻子沒有進水。
  failure_signal: 海豚踢結束後才開始划、轉換踢變弱、破水時嗆水。
  deficiency_fixes: []
  source: Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 24 章（仰式出發的水下海豚踢、保持空氣在肺內與出水七要點）
