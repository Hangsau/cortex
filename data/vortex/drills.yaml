  purpose_zh: 戴小手掌板做蝶式水下恢復（像蛙式恢復），用板放大高肘捕水的壓力訊號
  how_to:
  - 戴小手掌板、戴呼吸管
  - 做 Fl17 蝶式水下恢復：高肘捕水→拉到身體下方會合→沿身體推回前方
