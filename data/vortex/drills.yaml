  difficulty_tier: advanced
- id: ST14
  name_en: 'Finish Touch: Last Five Meters'
  name_zh: 終點觸牆：最後 5 公尺全速、不抬頭、伸長觸牆
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L3
  - L4
  abc_type: C
  purpose_zh: 終點觸牆的功課是進牆時不減速、不抬頭，最後一划接上伸長的觸牆；距離不對時補半划或踢腿，而不是滑行。
  how_to:
  - 從離牆約 10 公尺處起，最後 5 公尺全速游，頭保持正常姿勢
  - 自由式與仰式單手伸長觸牆；蛙式與蝶式雙手同時觸牆
  - 觸牆的那一下是整個動作的一部分，不是游完才補的；觸牆後教練或同伴回報進牆節奏有沒有減速
  - 發現距離不對時，練習補半划或加踢腿，不做滑行或回頭看牆
  perception_goal: 最後一划之後手臂自然伸長碰到牆，速度在碰牆的瞬間都還在。
  success_signal: 最後 5 公尺沒有減速、觸牆時身體伸長、不需要抬頭看牆。
  failure_signal: 最後一划太短或滑進牆、觸牆前抬頭、蛙蝶式雙手沒有同時到。
  deficiency_fixes: []
  source: Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（仰式終點與進牆，不減速、不回頭看牆）；各式觸牆規定依 World Aquatics 游泳技術規則
  source_ids:
  - src.hall-murphy-2020
  - src.world-aquatics-2023-swimming-technical-rules
  body_position: prone
  constraints: []
  movement_pattern: continuous
  skill_focus:
