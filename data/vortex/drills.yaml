- id: BrSt1
  name_en: Standing Wall Glide Setup
  name_zh: 站姿牆邊流線設定
  strokes:
  - breaststroke
  category: balance
  equipment: []
  l_target:
  - L1
  - L2
  abc_type: null
  purpose_zh: 站姿在牆邊建立蛙式 streamline 的肌肉感覺，作為下水前的姿勢校正；蛙式熱身首選
  how_to:
  - 站在牆邊及胸水深，背貼牆、腳跟距牆 30 公分
  - 雙手交疊上舉成 streamline，肘部夾耳、肩胛下沉
  - 感覺背部、肩胛、頭頸都在一直線上
  - 停 10 秒，重複 5 次；下水後立刻做一次蛙式拉手檢查 streamline 是否一致
  perception_goal: 建立 streamline 的內部肌肉記憶；下水後能立刻找回此姿勢
  success_signal: 肘部夾耳、背平、肩下沉的感覺清楚
  failure_signal: 肩膀聳起；肘部無法夾耳（柔軟度限制——這是硬體邊界）
  deficiency_fixes:
  - 9
  source: USA Swimming Foundations / 通用蛙式教學熱身
  source_ids:
  - src.usa-swimming-foundations
  body_position: standing
  constraints:
  - no_arms
  - no_kick
  movement_pattern: static
  skill_focus:
  - streamline_line
  - core_tension
  stroke_phase: glide
  drill_function: warmup
  cognitive_load: low
  tactile_anchor: wall_contact
  difficulty_tier: foundation
- id: BrLow1
  name_en: Pull-Pull-Kick
  name_zh: 拉拉踢
  strokes:
  - breaststroke
  category: timing
  equipment: []
  l_target:
  - L2
  - L3
  abc_type: null
  purpose_zh: 兩次拉手只一次踢腿的低強度組合，建立蛙式拉手獨立性與滑行感；蛙式熱身用
  how_to:
  - 做兩次完整蛙式拉手（每次都換氣），第三次只做踢腿、雙手保持 streamline
  - 拉拉踢、拉拉踢，循環
  - 重點不在速度，在分段感的清晰度
  - 做 4×100，配速 60–70%
  perception_goal: 拉手與踢腿成為兩個獨立的感知單元；滑行段拉長
  success_signal: 三個動作分得清楚；踢腿後滑行明顯
  failure_signal: 動作糊在一起；沒有滑行感
  deficiency_fixes:
  - 9
  source: 通用蛙式教學（fractional drill 變體）
  source_ids:
  - src.fractional-drill
  body_position: prone
  constraints: []
  movement_pattern: pause_pulse
  skill_focus:
  - hip_drive
  - glide_efficiency
  stroke_phase: transition
  drill_function: warmup
  cognitive_load: low
  tactile_anchor: core_tension_internal
  difficulty_tier: intermediate
- id: Br35
  name_en: Tennis Ball Breaststroke
  name_zh: 網球夾下巴蛙式
  strokes:
  - breaststroke
  category: breathing
  equipment:
  - ball
  l_target:
  - L2
  - L3
  abc_type: C
  purpose_zh: 用下巴夾住網球當外部限制，一抬頭球就掉——把「不要抬頭」從口頭提醒換成立即回饋
  how_to:
  - 把網球輕輕夾在下巴與胸口之間，游蛙式
  - 划手與踢腿照常，換氣靠內划把肩帶起來，頭不主動往上抬
  - 只要在任何一刻抬頭，球就會掉出來；球掉了就停下撿球重來
  - 單趟 25 公尺以內的矯正用途，不拿來練長距離——夾球會限制每次踢腿後的推進與滑行段，整體 stroke 會被拖慢
  perception_goal: 感覺換氣時下巴往前推而不是往上抬；球在下巴下方的接觸點是頭部位置的即時參考
  success_signal: 整趟球都沒掉，而且還吸得到氣
  failure_signal: 球掉出來（抬頭了）；若為了夾球而頸部僵硬、上半身緊繃或無法順利換氣，立即停止夾球、恢復呼吸，改做不夾球版本
  deficiency_fixes:
  - 1
  source: 'Sica, J. (2025). Swim Drill of the Week: Tennis Ball Breaststroke. Swimming World.'
  source_ids:
  - src.sica-2025-swimmingworld-tennis-ball-breaststroke
  body_position: prone
  constraints:
  - tension_held
  movement_pattern: continuous
  skill_focus:
  - streamline_line
  - breath_rhythm
  stroke_phase: whole_stroke
  drill_function: corrective
  cognitive_load: medium
  tactile_anchor: equipment_feedback
  difficulty_tier: intermediate
- id: Br36
  name_en: Walking Breaststroke Pull
  name_zh: 水中步行蛙式划手
  strokes:
  - breaststroke
  category: breathing
  equipment: []
  l_target:
  - L0
  - L2
  abc_type: C
  purpose_zh: 在淺水區用走的做蛙式划手，把「上浮的力量來自手不是脖子」變成直接可感覺的事
  how_to:
  - 站在及胸水深，身體前傾把臉放進水裡，雙手前伸
  - 邊往前走邊做完整蛙式划手：外划、內划、前伸
  - 內划時手往內往下壓，讓上半身被推起來，等臉自然出水再吸氣
  - 頭不主動抬；如果壓完了臉還在水裡，是手沒壓夠，不是脖子抬不夠
  - 走 10–15 公尺，重複 4–6 趟
  perception_goal: 感覺到「氣是手給的」——上浮來自內划的向下分量，避免主動仰頭，頸部保持自然對齊
  success_signal: 臉在內划進行到一半時自己出水；吸完氣頭自己回到水裡
  failure_signal: 靠仰頭把臉抬出水；或手壓完了臉還在水裡（內划沒有向下分量）
  deficiency_fixes:
  - 1
  source: Vortex 整理（外部限制矯正法；淺水步行版划手）
  body_position: standing
  constraints:
  - no_kick
  movement_pattern: progressive
  skill_focus:
  - forearm_pressure
  - breath_rhythm
  stroke_phase: pull
  drill_function: corrective
  cognitive_load: medium
  tactile_anchor: hand_pressure
  difficulty_tier: foundation
- id: Fl1
  name_en: Chest Press
  name_zh: 胸部下壓
  strokes:
  - butterfly
  category: kick
  equipment: []
  l_target:
  - L1
  - L2
  abc_type: null
  purpose_zh: 感覺胸部下壓水中帶來的波動感，這是蝶式波動的種子動作
  how_to:
  - 面朝下（不穿蛙鞋），雙手放身側，在水中輕輕波動
  - 用頭與胸下壓帶動波動，想著把肺往水裡壓
  - 不求快、不踢水，單純壓水感覺press與release
  perception_goal: 胸骨往水裡壓時感覺波動傳往全身；不是上下蹦跳
  success_signal: 感覺到一股波動感從胸部往腿部傳遞
  failure_signal: 只感覺胸部在做一個獨立動作，沒有傳遞感
  deficiency_fixes:
  - 8
  source: There's a Drill for That
