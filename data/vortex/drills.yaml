  cognitive_load: medium
  tactile_anchor: water_sound
  difficulty_tier: intermediate
- id: BkPad1
  name_en: Paddle Backstroke Pull
  name_zh: 手掌板仰式拉手
  strokes:
  - backstroke
  category: arm
  equipment:
  - paddles
  - pull_buoy
  l_target:
  - L4
  - L5
  abc_type: A
  purpose_zh: 戴小手掌板夾浮棒游仰式，放大拉水過程中的壓力差，讓泳者說得出整段拉水裡哪一段最有壓力
  how_to:
  - 戴小手掌板（防傷肩，不戴大型）、夾 pull buoy
  - 正常仰式划水，全程感受手掌板的水壓變化
  - 肘部收近身體、像「往腳的方向丟東西」——板會把這個位置標記得很清楚
  - 做 4×50，每組停下回報「最有壓力的點在哪」
  perception_goal: 手掌板讓拉水路徑變成有方向感的壓力地圖
  success_signal: 能說出整段拉水中壓力最大的位置
  failure_signal: 全程壓力平均（代表路徑沒分段）
  deficiency_fixes:
  - 11
  - 15
