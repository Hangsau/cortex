  purpose_zh: 在 45° 側躺位置只練前手的捕水錨定，把捕水從旋轉與呼吸中孤立出來
  how_to:
  - 右側躺 45°，右手前伸、左手放左臀，輕踢水保持平衡
  - 右手做捕水動作：肘部抬高、前臂垂直、手指朝池底，停住 3 秒
  - 感覺前臂全長都在抓水（不只是手掌）；不拉到底，只練捕水那一段
  - 停夠後放鬆讓手回前方，重複 8 次再換側
  perception_goal: 捕水位置的水壓清晰；前臂感覺像「掛在水上」
  success_signal: 停住時手沒有下沉；前臂感受得到水壓
  failure_signal: 手一停就下沉（肘部沒抬）；只感覺手掌不感覺前臂
