- id: ST18
  name_en: Breakout in Three Steps
  name_zh: 破水三步：蹬牆、N 下海豚踢、第一划不換氣、接 6 划
  strokes:
  - starts_turns
  category: timing
  equipment:
  - fins
  l_target:
  - L4
  - L5
  abc_type: C
  purpose_zh: 把出水前後的動作變成固定順序：蹬牆、水下海豚踢若干下、在最後一踢時發動第一划、先不換氣、連續游幾划。
  how_to:
  - 蹬牆成流線，立刻開始海豚踢；踢幾下依自己的能力決定，每次練習先固定一個數字（例如 3 下）
  - 最後一下海豚踢的同時發動第一划，下巴貼近胸口，不抬頭找水面
  - 第一划先不換氣，接著連續游 6 划，再換氣；水下段不拉長，覺得需要換氣就提早浮出
  - 有同伴在旁邊時，由同伴看第一划是否與最後一踢同步、頭有沒有提早抬起
  perception_goal: 最後一踢和第一划是同一個動作；不是踢完再想怎麼划。
  success_signal: 出水時速度沒掉、頭沒有提早抬、第一划與最後一踢同步。
  failure_signal: 最後一踢結束後才開始划、手提早打開、頭先抬起。
  deficiency_fixes: []
  source: Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 23 章（自由式出水七要點）與第 25 章（三踢三划練習）
