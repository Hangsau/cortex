- id: ST4
  name_en: Backstroke Flag Stroke-Count
  name_zh: 仰式旗下數划手
  strokes:
  - starts_turns
  category: turn
  equipment:
  - fins
  l_target:
  - L3
  - L4
  abc_type: C
  purpose_zh: 仰式看不到牆，用旗標（距牆 5 公尺）建立固定划手數，不靠回頭偷看就能準確翻身。
  how_to:
  - 正常仰式游，經過背泳旗標時開始數划手，記錄到牆需要幾下
  - 用這個固定划手數，在最後一下轉體翻身，不抬頭偷看
  - 加蛙鞋以比賽速度測試，校正高速下的划手數
  perception_goal: 靠固定划手節律就知道牆在哪；轉體在不減速、不偷看的狀態下啟動。
  success_signal: 用划手數就能準確到牆翻身，不需偷看、不撞牆或撈空。
  failure_signal: 仍需抬頭看牆、划手數不穩、到牆距離忽遠忽近。
  deficiency_fixes:
  - C
  source: Train Daly 仰式翻身系統；U.S. Masters Swimming（旗標距牆 5yd/m，數划手）
