  name_zh: 慢速前恢復
  strokes:
  - butterfly
  category: arm
  equipment:
  - snorkel
  - fins
  l_target:
  - L3
  - L4
  abc_type: A
  purpose_zh: 戴呼吸管緩慢恢復（4拍）感覺手掌壓力和錨定，訓練柔手入水
  how_to:
  - 戴呼吸管、穿蛙鞋配輕自由式踢水。手錨定在前方，感覺手背上的水壓，拉到結束、停一下，恢復用四拍很慢地回到前方，錨定後重複
  - 恢復時出手掌心朝上、入水前拇指朝下
  - （掌心朝下可能讓胸口浮起）
  perception_goal: 錨定時感覺手背有水壓；恢復時手心朝天然後拇指朝下；入水軟
  success_signal: 慢速恢復時感覺清楚的捕水壓力；手入水非常柔和
  failure_signal: 手背感覺不到水壓；入水猛烈
  deficiency_fixes:
  - 4
  source: There's a Drill for That
  source_ids:
  - src.theres-a-drill-for-that
  body_position: prone
  constraints:
  - tempo_constrained
  movement_pattern: pause_pulse
  skill_focus:
  - catch_evf
  - recovery_path
  stroke_phase: recovery
  drill_function: skill_isolation
  cognitive_load: high
  tactile_anchor: hand_pressure
  difficulty_tier: advanced
- id: Fl26
  name_en: Triangle or Biondi Drill
  name_zh: 三角形（Biondi）鑽
  strokes:
  - butterfly
  category: timing
  equipment: []
  l_target:
  - L4
  - L5
  abc_type: null
  purpose_zh: 水下拉手推後方接水下恢復，感覺換氣時機（手向後推時）和臀部上浮
  how_to:
  - 先做Fl1壓胸與Fl2蝶腿熱身（波動是關鍵）。從牆邊streamline水下推牆出發
  - 開始浮起時做一個水下拉手，然後把手往後甩像要恢復，設法在大腿邊停住不出水；手往後推時抬頭換氣，甩到底時頭也正好上來換氣
  - 完成甩之後把頭壓回水中（此時髖部升起），手在水下恢復回streamline，做約六個波動，手浮到水面時準備重新開始
  perception_goal: 手向後推時感覺是換氣的時機；頭入水後感覺臀部上浮
  success_signal: 換氣和手後推時機吻合；流線時臀部自然上浮
  failure_signal: 換氣太早或太晚；臀部無法上浮
  deficiency_fixes:
  - 2
  - 12
  source: There's a Drill for That
  source_ids:
  - src.theres-a-drill-for-that
  body_position: transitional
  constraints: []
  movement_pattern: continuous
  skill_focus:
  - hand_acceleration
  - breath_rhythm
  stroke_phase: push
  drill_function: skill_integration
  cognitive_load: high
  tactile_anchor: hand_pressure
  difficulty_tier: advanced
- id: Fl27
  name_en: Four Kicks Per Arm Cycle
  name_zh: 每划四踢
  strokes:
  - butterfly
  category: timing
  equipment:
  - fins
  l_target:
  - L4
  - L5
  abc_type: null
  purpose_zh: 四踢蝶腿後一次完整蝶式划手，感覺踢腿整合進划手的時機
  how_to:
  - 穿蛙鞋，滑進水線下成streamline，做四個蝶腿接一個完整蝶式划
  - 前兩踢建立捕水位置、第三踢啟動手臂、第四踢推過水下恢復；不要為了加划手而停踢（會失去動力）
  - 可每划低換氣；划手時想著把自己往前拉、下巴貼水面、髖部高；進階可改5踢1划或6踢1划
  perception_goal: 第三踢開始啟動手臂；第四踢時手臂在水下恢復；踢腿不停
  success_signal: 踢腿不因加入划手而停頓；感覺踢腿和划手有整合感
  failure_signal: 每次加入划手就停止踢腿
  deficiency_fixes:
  - 12
  source: There's a Drill for That
  source_ids:
  - src.theres-a-drill-for-that
  body_position: prone
  constraints:
  - tempo_constrained
  movement_pattern: continuous
  skill_focus:
  - rhythm_tempo
  - wave_undulation
  stroke_phase: transition
  drill_function: skill_integration
  cognitive_load: high
  tactile_anchor: foot_pressure
  difficulty_tier: elite
