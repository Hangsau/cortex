  purpose_zh: Race Club 仰式出發感知時機 drill：教練拿沙灘球在游者頭部上方、起跳後算準時間放下，選手要在腳入水前把球踢起，發展腿驅動時機
  how_to:
  - 同伴或教練站在池邊，把沙灘球拿在水面上方、離牆約兩呎（約 60 公分）、位在游者頭部上方
  - 游者正常仰式出發；同伴在起跳後算準時間放手讓球落下，游者要在腳入水前把球踢起
  - 踢到球代表腿伸展時機正確且有足夠爆發力
  - 需要一點練習才抓得到放球時機；做 5-10 次，每次調整放球時機；組間休 60 秒
  perception_goal: 出發時腿往上爆發到能踢到球的高度；感覺腿是主驅動
  success_signal: 能持續踢到球；入水時身體仍流線
  failure_signal: 踢不到球（腿驅動不夠）；身體入水時拱起
