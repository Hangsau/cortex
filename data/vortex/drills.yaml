  purpose_zh: Race Club 強調的 coupling motion：髖部旋轉在肩部旋轉後約 0.2–0.3 秒跟上，緊接在後段推水結束時，能加強後段推水的力量
  how_to:
  - 穿蛙鞋、戴呼吸管，正常游自由式
  - 誇張化肩部旋轉：每次划手肩膀盡量側轉到極限
  - 感覺髖部在肩膀轉完之後才跟上（書中量到的時間差約 0.2–0.3 秒，練習時只抓先後順序，不必去計秒）
  - 做 6×100 公尺，組間休 30 秒；專注旋轉而非速度
  perception_goal: 肩到髖的旋轉是接力不是同步；髖部跟在肩後而非和肩同時
  success_signal: 感覺旋轉「分兩步」；划手力量明顯增強
  failure_signal: 肩髖同時轉（失去 coupling 效益）；只動肩不動髖
  deficiency_fixes:
  - 4
