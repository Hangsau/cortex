  abc_type: C
  purpose_zh: Race Club 仰式出發階梯式 progression：從池梯最低踏板開始，每組往上一階，安全建立爆發力出發機制
  how_to:
  - 雙腳放在池梯最低踏板上，雙手抓踏板上方握把
  - 做 3-5 次完整仰式出發動作（頭往後仰、身體拱起、雙腿爆發蹬離）
  - 穩定後往上移一階，再做 3-5 次
  - 逐階往上直到接近正式出發台高度；最終轉到正式出發台
  perception_goal: 每階高度都能完成乾淨爆發；不依賴蠻力
  success_signal: 每階都能做出對稱、有力的出發；身體拋物線清晰
  failure_signal: 蠻力撐起；單腳先離開；身體歪斜
