  abc_type: A
  purpose_zh: 側躺滑行時用前伸手的手背感受水流方向，建立「身體切水」的細微感知
  how_to:
  - 側躺 45°，前手伸直、掌心略朝池底，後手放臀
  - 輕踢水緩慢前進，把注意力放在前伸手的「手背」上
  - 手背應感覺水從指尖流向手腕的均勻壓力——這代表身體切水方向正確
  - 如果手背感覺亂流或側面壓力，代表手腕或肩膀沒對齊
  perception_goal: 手背的水流是均勻向後的壓力，不是側壓也不是亂流
  success_signal: 手背能清楚感受到方向性的水流
  failure_signal: 手背只感覺到亂流或無感（代表姿勢有偏）
