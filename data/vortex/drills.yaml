  purpose_zh: 雙手抓住池邊，身體水平，專心把腿往上拉起來的那一下；把上踢單獨拉出來練，不被往前游的動作打斷。
  how_to:
  - 雙手抓住池邊，臉朝下浮在水面或使用呼吸管，身體保持水平
  - 專心做上踢：用直一點的腿往上拉，感覺後腿面與腳背把水往上方推
  - 每次做 10 到 15 秒，中間休息；想到下踢時就放鬆，不要兩邊都用力
  - 可以改成呼吸管，臉可以一直在水裡；不憋氣，覺得需要時就抬頭換氣
  perception_goal: 上踢也是推進的一半，不是只讓腿回到上面的動作。
  success_signal: 上踢時能感覺到水被腿後側往上推，且身體不因此被拉動。
  failure_signal: 只用膝蓋往上彎、腿後側沒有感覺、動作變成只靠下踢。
  deficiency_fixes: []
  source: Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 22 章（上踢不只是回復動作，也能產生推進）；抓池邊的做法是本庫整理，非原書練習
