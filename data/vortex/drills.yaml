- id: ST7
  name_en: Open Turn Breakdown at the Wall
  name_zh: 開放式轉身分解：觸牆—肘拉—越頂手入水—側蹬
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L2
  - L3
  abc_type: C
  purpose_zh: 把蛙式、蝶式的開放式轉身拆成慢動作，一步一步練到順，目標是在牆上的停留時間越短越好。
  how_to:
  - 從牆邊約一臂長處慢速游進，雙手同時觸牆（蛙式、蝶式的觸牆規則都要求雙手同時）
  - 觸牆後一側手立刻離牆，手肘收在身體旁邊貼著水下往後帶；另一手肘彎曲、從頭上越過入水
  - 雙膝收緊、雙腳疊在一起收到身體下方，兩腳側向踩上牆，腳尖指向轉身的那一側
  - 先在牆邊做到每一步都清楚，再把動作連起來，最後才加速；每次只盯一個重點（例如這趟只看離牆那隻手）
  perception_goal: 整個轉身是一個連續動作，頭和上半身貼近水面，腳在水下很快就位。
  success_signal: 觸牆到雙腳踩牆之間沒有停頓，頭沒有抬到很高。
  failure_signal: 雙手都抓著牆不放、身體直立抬很高、離牆的手繞到側面太遠。
  deficiency_fixes: []
  source: Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 26 章 Open Spin Turns（旋轉式開放轉身六個教學重點）
