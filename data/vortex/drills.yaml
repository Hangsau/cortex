- id: ST5
  name_en: Push-and-Rotate Breakout
  name_zh: 蹬牆轉體出水
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L3
  - L4
  abc_type: C
  purpose_zh: 自由式翻身蹬牆時人是仰／側躺，練在水下邊打水邊旋轉回俯臥，再乾淨接第一次划手。
  how_to:
  - 翻身蹬牆，蹬出時維持側／仰流線、保持窄而緊
  - 水下打水，利用腳的擺動帶動身體從背／側轉回俯臥
  - 在速度仍高時接第一次划手出水（breakout），不先把速度滑掉
  perception_goal: 旋轉由打水自然帶動、流線全程不散；breakout 接在速度尚高的時點。
  success_signal: 出水順、無卡頓、轉體中流線維持、銜接划手不減速。
  failure_signal: 為了轉體鬆開流線、太早浮起、breakout 時明顯減速。
  deficiency_fixes:
  - C
  source: U.S. Masters Swimming Flip Turn Fundamentals（approach/execution/breakout）；arenaswim flip turn drills
