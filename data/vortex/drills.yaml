  purpose_zh: 每三划交替兩側換氣，建立左右對稱的換氣節律，並讓換氣由身體旋轉帶動而非抬頭
  how_to:
  - 游自由式，固定每三次划手換一口氣，使換氣自動在左右兩側交替
  - 弱側換氣時放慢、靠身體旋轉把嘴帶出水面，而不是抬頭去找空氣
  - 延續涓流吐氣：兩次換氣之間臉在水中持續吐氣
  - 弱側會比較不順是正常的，先求能放鬆吸到氣，再求和強側一樣順
  perception_goal: 兩側換氣都能放鬆吸到氣；換氣靠身體旋轉帶動、頭轉量最小；節律穩定不亂
  success_signal: 弱側也能順利吸氣、不憋不嗆；左右換氣感覺逐漸接近
  failure_signal: 弱側憋氣或改用抬頭換氣；換到弱側時節律亂掉、身體失去平衡
  deficiency_fixes:
  - 1
  - 2
  - 4
