  abc_type: A
  purpose_zh: 閉眼版超人趕上，拿掉視覺後逼出前臂錨定與髖部旋轉的本體感
  how_to:
  - 確認泳道淨空、無他人；超人姿勢俯臥，雙臂前伸與肩同寬，輕踢水
  - 閉上眼睛（戴遮蔽鏡或泳鏡塗膠帶最佳），做超人趕上節律
  - 全程靠手感判斷另一手是否回到會合點，不靠視覺；每 6 划停下抬頭確認方向
  - 捕水時感覺髖同步旋轉、前手錨定不動
  perception_goal: 閉眼後感知放大；前手錨定與髖旋轉變得明顯；沒有視覺仍能維持身體線
  success_signal: 能維持與肩同寬的會合點；划水有明確錨定感
  failure_signal: 失去方向（漂離中線）；划手感覺混亂
  deficiency_fixes:
  - 4
  - 6
  - 11
