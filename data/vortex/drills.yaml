- id: ST8
  name_en: Open Spin Away From the Wall
  name_zh: 離牆水平旋轉練習（一耳貼水面）
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L1
  - L2
  abc_type: C
  purpose_zh: 先離開牆面練習「水平轉、不立起來」的旋轉，建立旋轉半徑小、頭貼近水面的感覺，再帶回牆邊。
  how_to:
  - 在池中俯臥漂浮，雙臂前伸，頭放進水裡
  - 聽到口令後雙膝收向胸口，身體在水面上水平轉半圈，轉的過程中轉動方向那一側的耳朵貼著水面
  - 轉的時候頭向後轉去換氣，眼睛看向後方的牆或水道邊，不是看向側面
  - 轉完雙臂回到前伸、身體伸直，再重複；左右兩個方向都要練
  perception_goal: 身體縮得越小轉得越快；頭和肩膀貼近水面，不往上立起。
  success_signal: 能在原地很快轉半圈、一耳貼水、換到氣，轉完身體回到水平。
  failure_signal: 身體往上立起、肩膀一前一後歪斜、轉的時候膝蓋沒有收緊。
  deficiency_fixes: []
