  difficulty_tier: advanced
- id: ST13
  name_en: Backstroke Flag Count, Roll, One Stroke, Flip
  name_zh: 仰式旗下計划、翻俯臥一划、翻滾仰躺蹬出
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L3
  - L4
  abc_type: C
  purpose_zh: 把仰式翻滾轉身的前半段練成一個連續動作：過旗後數划、翻成俯臥、接一個連續手划、翻滾，蹬出時回到仰臥。
  how_to:
  - 先確認自己從旗下到牆的划手數（可用仰式旗下數划手那個練習先標定）
  - 過旗後按划手數游，在預定的那一划翻成俯臥，接一個連續的手划，立刻翻滾
  - 翻滾後雙腳平踩牆、腳尖朝上，蹬出時身體回到仰臥；轉身過程不能在俯臥時停頓
  - 先用慢速確認序列，再逐步加到比賽速度；加蛙鞋時划手數會變，要重新標定
  perception_goal: 翻成俯臥後的動作是連續的，沒有停頓，也不需要抬頭找牆。
  success_signal: 進牆不撞牆不撈空，翻轉連貫，蹬出時身體是仰臥且腳尖朝上踩牆。
  failure_signal: 翻成俯臥後停下來滑行、過早翻過去、離牆時已經不是仰臥。
  deficiency_fixes: []
  source: Hall, G. W., & Murphy, D. (2020). Fundamentals of Fast Swimming. 第 25 章（仰式翻滾轉身的進牆節奏與翻成俯臥的時機）；轉身規則依 World Aquatics 游泳技術規則
