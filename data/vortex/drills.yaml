  difficulty_tier: advanced
- id: UDK8
  name_en: With and Without Fins Contrast
  name_zh: 穿蛙鞋與不穿蛙鞋對照
  strokes:
  - underwater_dolphin_kick
  category: kick
  equipment:
  - fins
  l_target:
  - L3
  - L4
  abc_type: B
  purpose_zh: 同一段距離先穿蛙鞋打、再脫掉蛙鞋打，比較兩種情況下波動的大小和節奏，檢查蛙鞋有沒有讓你偷偷把動作做大。
  how_to:
  - 同一個距離（例如蹬牆後打到旗標，不超過自己舒服的水下距離），先穿蛙鞋打一趟
  - 休息後脫掉蛙鞋，以同樣的力道與同樣的距離再打一趟，同伴記錄兩趟的踢數與時間
  - 比較：脫鞋後踢數有沒有大增、波動有沒有變大或變亂；腳背的感覺在兩種情況下有沒有一致
  - 不為了追時間而把水下距離拉長；覺得需要換氣就提早浮出
  perception_goal: 有鞋沒鞋，打水的核心動作是同一個；蛙鞋只是放大，不是替代。
  success_signal: 脫鞋後節奏與波動形式大致維持，踢數合理增加。
  failure_signal: 脫鞋後動作塌掉、波動變小或變亂、膝蓋代償。
  deficiency_fixes: []
  source: 通行的蛙鞋對照練習形式；本庫未取得可定位的單篇出處
