  abc_type: A
  purpose_zh: 戴手掌板放大前臂水壓訊號，靜止錨定 3 秒讓捕水感固化
  how_to:
  - 戴標準捕水板（小或中號，避免傷肩），超人姿勢俯臥輕踢
  - 單臂划手到捕水位置（前臂垂直、肘高於手），停住 3 秒感受手掌板的水壓
  - 完成拉水，前手停在前方等待換手；每側做 8 次
  - 板會把細微壓力差異放大，幫助大腦標記正確角度
  perception_goal: 手掌板讓水壓變得「響亮」；停住時感覺前臂全長都在抓水，不只是手掌
  success_signal: 停 3 秒手仍有支撐感不下滑；左右側壓力感類似
  failure_signal: 板一停就下沉（代表肘部沒高於手）；左右側差異很大
  deficiency_fixes:
