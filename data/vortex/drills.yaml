  purpose_zh: 腰繫彈力繩、同伴在岸上輕拉，阻力下游自由式，感覺核心必須持續做功維持身體線
  how_to:
  - 腰繫長彈力繩，同伴站在岸上或前方水中輕拉繩另一端（拉力溫和，不爆衝）
  - 游自由式，阻力下注意身體不能往下沉、髖必須持續驅動
  - 做 4×15 秒，組間休 30 秒；繩拉力固定不變
  - 核心一鬆身體會立刻下沉——這是回饋
  perception_goal: 核心持續發力；髖部旋轉不間斷；阻力放大了「沒做功」的代價
  success_signal: 阻力下仍能維持高臀位；划水節律不亂
  failure_signal: 臀部下沉；划水變慢且亂
  deficiency_fixes:
