  abc_type: A
  purpose_zh: 同伴站在泳道邊把手伸到水面當固定點，回臂時必須輕擊那隻手，強制建立穩定恢復路徑
  how_to:
  - 同伴站在泳道邊（或水中），把手平伸到游者預期入水點外側 10 公分處
  - 游自由式，每次恢復臂的最高點（或入水前）輕擊同伴的手
  - 持續 25 公尺，左右側都練；同伴慢慢調整手的位置試探游者的舒適區
  - 目的不是擊中而是建立空間參考
  perception_goal: 恢復路徑有外部空間錨點；同伴的手成為「正確位置」的回饋
  success_signal: 穩定擊中同伴的手；左右側都能精準
  failure_signal: 擊中位置忽前忽後（代表回臂路徑不穩定）
  deficiency_fixes:
