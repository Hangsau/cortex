- id: ST6
  name_en: Standing Forward Roll (Shallow Water)
  name_zh: 站立前滾翻（淺水，鼻子吐氣）
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L0
  - L1
  abc_type: C
  purpose_zh: 在腳踩得到底的淺水區，先熟悉頭朝下翻轉一圈的感覺，並確認整個翻轉過程鼻子能持續吐氣；翻滾轉身學不會，最常見的原因是鼻子進水而不是動作不會。
  how_to:
  - 選胸口以下的淺水區，吸一口氣，臉入水、鼻子開始緩慢吐氣
  - 下巴貼胸，雙手在身前撐水，雙腳離地把身體團成一球，向前翻一圈後站起
  - 整圈都維持鼻子吐氣；先翻一圈就站起，確認不嗆水，再連續翻兩三圈，每圈之間站起來換氣
  - 鼻子進水或不舒服時立即站起，退回只把臉埋入水中吐氣；可先戴鼻夾或泳鏡，不勉強
  perception_goal: 翻轉時空氣一直從鼻子出去，水就進不來；頭朝下翻也知道哪裡是上、哪裡是下。
  success_signal: 連翻數圈不嗆水，起身時方向感還在。
  failure_signal: 翻到一半憋住氣再嗆到、身體攤開沒有團緊、翻完不知道面向哪裡。
  deficiency_fixes: []
  source: 通行的前滾翻入門練習形式；本庫未取得可定位的單篇出處
