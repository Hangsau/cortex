  - 重複，嘗試讓身體更窄更緊以滑更遠
  perception_goal: 蹬離牆瞬間全身像一支箭，水從身體兩側乾淨滑過，沒有任何鼓出的阻力面。
  success_signal: 同樣力道下滑行距離增加、感覺水阻變小。
  failure_signal: 頭抬起、手沒鎖緊、身體鬆開，很快就停。
  deficiency_fixes:
  - C
