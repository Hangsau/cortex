  difficulty_tier: foundation
- id: BkP1
  name_en: Partner Pace Side-by-Side
  name_zh: 同伴並肩配速仰式
  strokes:
  - backstroke
  category: timing
  equipment:
  - partner
  l_target:
  - L4
  - L5
  abc_type: null
  purpose_zh: 與同伴在相鄰泳道並肩游仰式，互相鎖節律，外部視覺與聽覺成為節律錨
  how_to:
  - 兩人選相鄰泳道，事先約定划手次數（例：每 25 公尺 14 次）
  - 並肩出發，餘光與水聲互相回饋；節律以慢者為準（不競速）
  - 做 6×50，每組換配速約定（13、14、15 划/25）
  - 重點是在被動接收節律下能否維持身體線
  perception_goal: 節律從外部回饋變成內化參考；身體線不為了追節律而崩潰
  success_signal: 兩人能在約定划數下到牆，划水節律穩定
  failure_signal: 為了配速犧牲身體線；節律跟不上
  deficiency_fixes: []
