- id: BkEC1
  name_en: Eyes Closed Streamline Backkick
  name_zh: 閉眼仰式流線踢水
  strokes:
  - backstroke
  category: kick
  equipment: []
  l_target:
  - L2
  - L3
  abc_type: null
  purpose_zh: 閉眼仰式流線踢水，留意周圍水聲、靠體感確認身體線；練習減少視覺依賴
  how_to:
  - 確認泳道淨空、最好有同伴看著；仰躺 streamline 踢水
  - 閉眼出發，靠耳朵聽水流方向、靠身體感覺水面位置
  - 踢 8 拍後睜眼確認方向；逐步延長到 16 拍
  - 重點是當視覺消失時，身體線必須由核心而非眼睛維持
  perception_goal: 閉眼後身體線變成純內部感覺；耳朵的水聲變成方向參考
  success_signal: 睜眼時仍在中線；身體線沒有彎掉
  failure_signal: 嚴重漂離中線；身體下沉
  deficiency_fixes:
  - 3
