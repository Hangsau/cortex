  abc_type: A
  purpose_zh: 及胸水深站姿模擬自由式回臂與入水，慢動作建立高肘記憶；熱身或初學者乾預演
  how_to:
  - 站在及胸水深，身體微前傾（脊椎打直、不彎腰駝背）
  - 雙手放大腿，緩慢做自由式划手循環：抬肘→指尖入水→延伸→拉到大腿
  - 全程肘部高於手腕，視覺確認手指軌跡擦過水面
  - 兩側各做 10 次，重點在感覺肩部三角肌位置和肘部高度
  perception_goal: 肘高於手；指尖先入水；無速度壓力下建立正確路徑記憶
  success_signal: 肘部明顯高於手腕；入水時手指先觸水
  failure_signal: 肘部下垂；手掌整片拍水
  deficiency_fixes:
