  - 水下段保持原本課表上的規定，不因為追求轉身品質而加長水下距離
  perception_goal: 累的時候轉身仍然是一個完整的動作，不是拿來喘氣的休息站。
  success_signal: 最後幾趟的轉身與精神好時的轉身看起來一樣。
