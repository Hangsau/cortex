  difficulty_tier: advanced
- id: ST16
  name_en: 'Start Progression: Sitting, Kneeling, Staggered Stance'
  name_zh: 出發進程：坐姿入水、跪姿、單腳前後站
  strokes:
  - starts_turns
  category: turn
  equipment: []
  l_target:
  - L1
  - L2
  abc_type: C
  purpose_zh: 從低的姿勢開始，一階一階升高，讓出發這件事從不怕水開始建立；每一階的檢查標準都是全身從同一個洞入水。
  how_to:
  - 前提：只在水夠深、有人在旁的地方做，水深不足時不做任何跳水出發，只做水中蹬牆流線
  - 第一階：坐在池邊，雙手前伸、下巴貼胸，身體向前滑入水中，檢查頭、肩、腳是否從同一個洞進去
  - 第二階：跪姿，一腳在前、一腳在後，向前倒入水，每一階都確認過關再升級
  - 第三階：單腳前後站，重心前傾後向前出發；最後才換到出發台，每升一階都先在水中確認深度與流線
  perception_goal: 入水不是用力跳出去，而是身體向前倒、全身從一個洞進去。
  success_signal: 每一階的入水水花都小、手腳身體走同一路徑、入水後流線維持。
  failure_signal: 身體分成兩段入水、肚子拍水、入水角度太陡而往下。
  deficiency_fixes: []
  source: 通行的出發入門進程；本庫未取得可定位的單篇出處
  source_ids: []
  body_position: transitional
  constraints: []
  movement_pattern: progressive
  skill_focus:
  - entry_extension
  - streamline_line
  stroke_phase: entry
  drill_function: progression
  cognitive_load: medium
  tactile_anchor: partner_feedback
  difficulty_tier: foundation
- id: ST17
  name_en: Entry Through the Hole
  name_zh: 入水穿洞（漂浮呼拉圈或想像點）
  strokes:
  - starts_turns
  category: turn
  equipment:
  - small_object
  l_target:
  - L2
  - L3
  abc_type: C
  purpose_zh: 用一個看得見的目標把「全身穿過同一個洞」變成具體動作：手、頭、身體、腳都從水面上同一點進去。
  how_to:
  - 在水中固定一個漂浮的呼拉圈或在水面標一個點，作為入水目標；深度夠才做跳水動作，不夠就只做坐姿入水
  - 從池邊以坐姿或跪姿入水，手先進圈、身體順著手走，腳最後從同一個圈穿過
  - 同伴在旁邊看並回報：身體有沒有碰到圈、腳有沒有從別的地方入水
  - 穿過後馬上維持流線，看能滑多遠
  perception_goal: 手打開的那個洞，整個身體和腳都要走同一條路過去。
  success_signal: 身體不碰圈、腳也穿得過去、入水水花小。
  failure_signal: 手穿過了但腰以下拍在圈外、身體入水角度不一致。
  deficiency_fixes: []
  source: 通行的出發入水目標練習形式；本庫未取得可定位的單篇出處
