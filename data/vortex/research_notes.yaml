  theme: physics
  kind: literature
  status: researching
  summary_zh: 「找靜水來划」是升力理論的副產品，前提已瓦解；現在主流認為往後推水的阻力才是主要推進力。
  findings:
  - text_zh: 推進力理論從阻力槳葉、升力（S 形划手）走回以阻力為主；升力存在但被高估。
    certainty: 🟡
  - text_zh: 「找靜水當支點」的邏輯前提有誤。
    certainty: 🔵
    apply_zh: 不用「找靜水」當教學指令。
  - text_zh: 有速度時水感比靜止時好，是因為迎面水流讓手掌壓力回饋更清楚。
    certainty: 🔵
