- id: note.perceptual-learning
  slug: perceptual-learning
  theme: perception
  kind: literature
  status: researching
  summary_zh: 水感進步不是手變靈敏，而是大腦學會從同樣的訊號分辨更細的差異；練習要有「辨別什麼」。
  findings:
  - text_zh: 感知學習改善的是辨別精度（Gibson 分化理論），比較不同條件是分化的主要機制。
    certainty: 🟡
    apply_zh: 交替裸手與划板、慢速與快速，比單一條件重複更有效。
  - text_zh: 感知學習高度特異，陸上練習能遷移本體感覺，練不到水感。
    certainty: 🔵
  - text_zh: 練感知時同時要求注意動作形式，會搶走注意力、壓低學習效果。
    certainty: 🔵
    apply_zh: 每個練習給一個明確的辨別任務，難度接近「剛好感覺得出差異」。
