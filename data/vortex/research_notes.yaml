- id: note.cross-stroke-relations
  slug: cross-stroke-relations
  theme: development
  kind: analysis
  status: researching
  summary_zh: 牆比較強的人隔年長池進步比較多；蛙式跟其他泳式脫鉤只發生在男性。「蝶式先進步」已撤回。
  findings:
  - text_zh: 同樣成績水準下，短池比長池快得多（牆強）的人，隔年長池 100 公尺進步較多；衝刺型、耐力型都不能預測進步。
    certainty: 🔵
  - text_zh: 自由式和蛙式的關係隨年齡分開，這個脫鉤只發生在男性。
    certainty: 🔵
  - text_zh: 跨泳式共用程度由強到弱：出發反應、水中衝刺、不掉速、牆。不掉速是個人特質，不是國家或教練風格。
    certainty: 🔵
  - text_zh: 原先的「蝶式先進步、隔年自由式才跟上」是量測誤差造成的假象，已撤回，原文保留作紀錄。
    certainty: 🔵
