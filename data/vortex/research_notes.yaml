- id: note.triathlon
  slug: triathlon-swimming
  theme: triathlon
  kind: literature
  status: graduated
  summary_zh: 鐵人泳段專屬的強度分布、週期化、減量沒有研究全文；17 條常見說法只有「跟游沒差別」「防寒衣快 20%」能用研究直接對照，兩條都不成立。
  findings:
  - text_zh: 跟游有明確的省力效果：緊跟在後時攝氧量降約 11%、血乳酸降約 38%，「跟游沒差別」不成立。
    certainty: 🟢
  - text_zh: 防寒衣在 400 m 約快 6%，主要來自划幅變長；「快 20%」找不到出處。
    certainty: 🟢
  - text_zh: 「鐵人不用學踢腿」「一定要雙邊換氣」只對一半：賽中少踢、會雙邊換氣有用，但完全不踢、「必須」都沒有依據。
    certainty: 🟠
  - text_zh: 每週課數、每堂時間、組型範本有實務文件出處；泳段強度分布、開放水域配速換算、減量幅度都沒有出處。
    certainty: 🟠
    apply_zh: 課表裡沒有出處的份量留白，不自己補數字。
  title: 鐵人三項的游泳：常見說法與訓練參數，研究怎麼說
  group: literature
  weight: 45
  status_zh: 已寫進知識點
  graduated:
  - id: open-water.err1
    title: 鐵人不用學踢腿，腿留給騎跑
  - id: open-water.err2
    title: 一定要雙邊換氣，而且固定每三划換氣一次
  - id: open-water.tech.4
    title: 跟游（drafting）——跟在正後方或髖側，用別人帶動的水流省力
  - id: open-water.tech.7
    title: 防寒衣（一）身體位置——浮力集中在軀幹與下肢，腿沉的人受益最大
  - id: open-water.tech.20
    title: 『游泳只占比賽一小部分，練游泳不划算』——判定（部分正確，依族群）
  - id: open-water.tech.21
    title: 『鐵人是長距離所以不用練速度』與『一定要連續游到比賽距離（或間歇就夠）』——判定（證據不足）
  - id: open-water.tech.22
    title: 『游泳段要保留體力，慢慢游就好』——判定（部分正確，依族群）
  - id: open-water.tech.23
    title: 『成人學游泳太晚，技術改不了，只能靠體能』——判定（迷思，但證據只有自述）
  - id: open-water.tech.24
    title: 『比賽前一天要休息，不要下水』——判定（證據不足，找不到主張者）
  - id: periodization.triathlon.planner
    title: 鐵人三項泳段排課
