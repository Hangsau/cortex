- id: note.polarized
  slug: polarized-training-seiler
  theme: training
  kind: literature
  status: researching
  summary_zh: 極化訓練不是游泳的唯一解：游泳選手多數是金字塔型分布，而且依主項距離不同。
  findings:
  - text_zh: 游泳的系統性回顧中，金字塔型（低 > 中 > 高強度）最常見，其次是極化型，閾值型少數。
    certainty: 🟢
  - text_zh: 短距離選手偏極化與閾值型，中距離偏閾值與金字塔，長距離以金字塔為主；這是觀察歸納，不是實驗驗證。
    certainty: 🟢
  - text_zh: 即使衝刺選手，約 87–90% 的訓練量仍落在低強度。
    certainty: 🟢
  title: 極化訓練（Polarized Training）與訓練強度分布（TID）
  group: literature
  weight: 40
  status_zh: 研究中
  graduated:
  - id: periodization.zones.swim_tid
    title: TID＝整個週期裡輕鬆／閾值／吃力三種強度各占多少。主要有三種分布：極化型（大量輕鬆 ＋少量超吃力、中間幾乎不練）、金字塔型（由下往上遞減）、閾值型（中間那塊偏多）。游泳最該知道的一件事是：它不像跑步、自行車那樣呈現極化。追蹤 127 名法國菁英泳者、 289 個賽季的資料顯示，將近一半的訓練量（44–46%）就落在
  - id: periodization.zones.school_polarized
    title: 極化派（Seiler）問的不是「每區強度多少」而是「每區各占幾成」。他觀察全國／國際級耐力選手，發現他們自然形成「大量輕鬆＋少量超吃力、中間幾乎不練」的分布——大約 80% 低強度、20% 高強度（這個 80/20 算的是課次，不是時間）。為什麼避開中間（閾值）區？因為那強度「高不成低不就」：累積疲勞不少，刺激又不
  questions: []
- id: note.block
  slug: block-periodization-issurin
  theme: training
  kind: literature
  status: researching
  summary_zh: 板塊週期化一次只集中練一兩項能力，靠殘留效應銜接；在游泳中還沒有對照研究。
  findings:
  - text_zh: 核心是集中負荷、序列發展，前一板塊的殘留效應在下一板塊期間仍維持。
    certainty: 🟡
  - text_zh: 板塊與反向週期化在游泳缺乏介入研究。
    certainty: 🟢
  title: 板塊週期化（Block Periodization）— Issurin 研究筆記
  group: literature
  weight: 41
  status_zh: 研究中
  graduated:
  - id: periodization.structure.school_block
    title: 板塊週期化（Issurin）跟 Bompa 最大的不同：Bompa 主張準備期可以同時把很多能力一起練；Issurin 說高水準選手做不到——很多訓練刺激會互相打架（大量有氧會干擾長肌力），所以要『一次只集中練一兩項』，按順序排。怎麼決定何時換下一項？看『殘留效應』——某能力停練後能撐多久：有氧耐力、最大肌力約撐 30
  questions:
