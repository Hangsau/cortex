- id: note.obs-small-paddle
  slug: small-paddle-observation
  theme: observation
  kind: observation
  status: researching
  summary_zh: 只稍微放大手掌的小划手板，沒教正確動作，學生也會自己調整出相似的手型和前臂角度。
