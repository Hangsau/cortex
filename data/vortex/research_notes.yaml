- id: note.finswimming
  slug: finswimming-training
  theme: training
  kind: literature
  status: researching
  summary_zh: 蹼泳沒有公開處方，這篇從游泳資料推論：組內靜止休息、組間輕鬆游，屏氣組一定要有人看著。
  findings:
  - text_zh: 一組衝刺裡，趟間靜止休息比慢游讓下一趟更快；組與組之間輕鬆游清乳酸。
    certainty: 🟢
    apply_zh: 組內被動休息、組間主動休息。
  - text_zh: 屏氣 50 單蹼比水面快，乳酸一樣高，心跳較低是潛水反射，不代表比較輕鬆。
    certainty: 🟢
    apply_zh: 屏氣組一定有人直接看著，出發前不過度換氣，想換氣就上來。
  - text_zh: 各項目的能力分配與三個處方缺口是推論，要在實際訓練中驗證。
    certainty: 🔵
  title: 蹼泳訓練：各項目要練什麼、怎麼休息、器材怎麼分配
