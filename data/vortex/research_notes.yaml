- id: note.team-transfer
  slug: team-transfer
  theme: development
  kind: analysis
  status: researching
  summary_zh: 在哪一隊大約解釋一成多的進步差異；轉隊當年常伴隨進步，但到新隊第一整年就回到一般水準。
  findings:
  - text_zh: 扣掉年齡與程度後，進步差異約 12% 可以用隊伍解釋；隊伍今年進步多、明年還多的相關只有 0.22。
    certainty: 🔵
    apply_zh: 評估一個隊要看好幾年，單一年的好壞很大部分是運氣。
  - text_zh: 轉隊那年進步較多，但轉隊前一年本來就進步較多；到新隊第一整年跟留隊的沒有差別。
    certainty: 🔵
    apply_zh: 轉隊看訓練內容、距離、師生關係，不期待成績因此跳升。
