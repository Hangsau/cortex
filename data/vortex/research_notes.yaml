notes:
- id: note.analysis-overview
  slug: race-data-overview
  theme: analysis
  role: overview
  kind: analysis
  status: researching
  summary_zh: 15 篇比賽分析串起來的四件事：勝負和狀態落在後半段、前段多衝通常划算、單場不下判斷、很多差別是量法造成的。
  title: 比賽數據告訴我們什麼：15 篇分析的總覽
  group: analysis
  weight: 1
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.1
    'no': '1.1'
    title: 狀態為什麼先出現在後半段
    anchor: q-1-1
  - id: fq.1.2
    'no': '1.2'
    title: 最後一段掉速的原因，與「轉身前先加速」
    anchor: q-1-2
- id: note.split-patterns
  slug: split-patterns
  theme: race-swim
  kind: analysis
  status: researching
  summary_zh: 同一個人每場差最多的是最後一段；狀態變好或變差，主要反映在後半段。
  findings:
  - text_zh: 同一人同一季，最後一段每場的起伏約 1.0–1.3 個百分點，是中間段的 1.6–2 倍。
    certainty: 🔵
    apply_zh: 一場不下判斷，單場好壞放進一段期間裡看。
  - text_zh: 隔季進步或退步的人，變化主要落在後半段；退步時後半段變慢得比進步時更多。混合式的變化主要落在蛙式段。
    certainty: 🔵
    apply_zh: 看狀態先看後半段；混合式先看蛙式段。
  - text_zh: 一年的型態變化（0.13–0.6 個百分點）比單場之間的雜訊小，一場對一場比會被雜訊蓋掉。
    certainty: 🔵
    apply_zh: 練習分段只跟自己比，用多場平均。
  title: 分段型態：每場差多少、狀態變化落在哪一段
  group: analysis
  weight: 2
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.1
    'no': '1.1'
    title: 狀態為什麼先出現在後半段
    anchor: q-1-1
- id: note.hundred-decider
  slug: hundred-decider
  theme: race-swim
  kind: analysis
  status: researching
  summary_zh: 100 公尺同組的差距約六成在後 50；實力相近時，前 50 領先的人比較常贏。
  findings:
  - text_zh: 同一組比賽裡，選手之間的差距約六成來自後 50。程度越高掉速越少，台灣孩子在自由式、蝶式的後 50 差距特別大。
    certainty: 🔵
    apply_zh: 想往上一個程度帶，先練後 50 不掉速；賽後用「後 50 ÷ 前 50」跟自己過去比。
  - text_zh: 實力相近時，前 50 領先的人比較常贏。
    certainty: 🔵
    apply_zh: 已經在爭名次的選手，前 50 要敢游出領先。
  - text_zh: 出發反應平常不影響名次，但成績接近時常常就是差那一點。
    certainty: 🔵
    apply_zh: 一般孩子不必特別練；常爭前幾名的選手值得花時間。
  title: 100 公尺的勝負點：前 50、後 50 與出發反應
  group: analysis
  weight: 3
  status_zh: 研究中
  graduated: []
  questions: []
- id: note.fade-causes
  slug: fade-causes
  theme: race-swim
  kind: analysis
  status: researching
  summary_zh: 前段比平常快，代價落在最後一段；短池比長池掉得多。最後 50 的加速從進最後一面牆之前就開始。
  findings:
  - text_zh: 前段比自己平常快 1%，最後 50 相對第三個 50 多掉約 0.55 個百分點。
    certainty: 🔵
    apply_zh: 前段要快但控制得住：前 100 照目標配速。
  - text_zh: 短池比長池多掉約 0.64 個百分點，掉速不但沒被牆止住，反而出在轉身和水下。
    certainty: 🔵
    apply_zh: 轉身和水下打腿放在高強度組的最後練，最後一面牆的打腿數跟第一面一樣。
  - text_zh: 偏耐力型的人掉得少一點，但幅度很小。
    certainty: 🔵
  - text_zh: 進最後一面牆就加速的人，出牆也比較快，看不到代價；但中段轉身前加速一樣有，因果要靠練習對照驗證。
    certainty: 🔵
    apply_zh: 自己驗證：同配速的 200 輪流游「進牆前 10 m 加速」與「出牆才加速」，各 4–6 次比最後 25／50。
  title: 最後一段為什麼會掉速、該練什麼
  group: analysis
  weight: 4
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.2
    'no': '1.2'
    title: 最後一段掉速的原因，與「轉身前先加速」
    anchor: q-1-2
- id: note.fade-followup
  slug: fade-followup
  theme: race-swim
  kind: analysis
  status: researching
  summary_zh: 「會掉的選手」要看一季好幾場才準；決賽前段多衝，最後一段痛一點但總成績更好。
  findings:
  - text_zh: 有些人確實比較會掉，但要用一季 3 場以上的中位數判斷，單場看不準。
    certainty: 🔵
    apply_zh: 跟同齡同泳式的常模比，不用單場下結論。
  - text_zh: 決賽前段比預賽多衝，最後一段會多掉一點，但總成績明顯更好。
    certainty: 🔵
    apply_zh: 決賽前段可以多衝，練習時預期最後 50 會更痛。
  - text_zh: 最後 50 超車的人，從進最後一面牆之前就開始加速，出牆後再加更多（描述，不是因果）。
    certainty: 🔵
    apply_zh: 練習組可用「最後 50：前 25 加速進牆、出牆後全力」。
  title: 掉速延伸：是這個人還是這一場？決賽前段多衝值不值得？最後 50 超車從哪裡開始？
  group: analysis
  weight: 5
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.2
    'no': '1.2'
    title: 最後一段掉速的原因，與「轉身前先加速」
    anchor: q-1-2
- id: note.rt-opening
  slug: rt-opening
  theme: race-swim
  kind: analysis
  status: researching
  summary_zh: 出發反應快不會讓前段衝過頭（仰式例外）；反應快的那天，往往整體狀態也好。
  findings:
  - text_zh: 自由式、蛙式、蝶式反應快的那趟，前 50 和最後一段都沒有變化，總成績快的幅度是省下反應時間的 2–4 倍。
    certainty: 🔵
    apply_zh: 不必擔心出發太快亂掉配速，出發照樣全力；反應比平常快常代表當天狀態好。
  - text_zh: 仰式是例外：反應快時前 50 也明顯快，200 仰最後一段多掉一點，但總成績仍快很多。
    certainty: 🔵
    apply_zh: 仰式出發、蹬牆、水下當成一個單元練。
  title: 出發反應與前段配速：反應特別快，前段會不會跟著衝過頭？
  group: analysis
  weight: 6
  status_zh: 研究中
  graduated: []
  questions: []
- id: note.im-legs
  slug: im-legs
  theme: race-swim
  kind: analysis
  status: researching
  summary_zh: 個人混合式前面快的那天，四個泳式段都快；相對沒跟上的是最後的自由式段，不是蛙式段。
  findings:
  - text_zh: 沒有看到「前面衝、後面垮」：前兩段快的那天，四段都快，總成績更好。
    certainty: 🔵
    apply_zh: 資料看不到前兩段保留的好處。
  - text_zh: 前段快時相對沒跟上的是自由式段，長池、成人更明顯；蛙式段是最跟著當天狀態走的一段。
    certainty: 🔵
    apply_zh: 賽後先看蛙式段跟自己平常比；練「前三段快之後自由式還踢得起來」的轉換組。
  title: 個人混合式的泳式段取捨：前面衝快，哪一段付帳？
  group: analysis
  weight: 7
  status_zh: 研究中
  graduated: []
  questions: []
- id: note.neighbor-effect
  slug: neighbor-effect
  theme: race-day
  kind: analysis
  status: researching
  summary_zh: 旁邊的人快會把你拉快；最後一段會多掉一點，但總成績平均是賺的。
  findings:
  - text_zh: 兩側選手快時自己也會變快，自由式、蝶式和決賽最明顯；最後一段多掉一點，但前段多賺的大於後段多付的。
    certainty: 🔵
    apply_zh: 分到強組、旁邊衝出去可以跟；賽後最後 50 掉得多，先看旁邊是不是特別快、總成績如何。
  title: 鄰道效應：被旁邊的人拉快，最後 50 會不會付帳？
  group: analysis
  weight: 8
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.3
    'no': '1.3'
    title: 被帶著衝為什麼划算
    anchor: q-1-3
- id: note.lane-heat
  slug: lane-heat
  theme: race-day
  kind: analysis
  status: researching
  summary_zh: 長池邊道比較慢、後段掉比較多；預賽獨自領先時沒人帶，比較慢；決賽碰到強組會被帶快。
  findings:
  - text_zh: 長池邊道比較慢、最後一段也掉比較多；短池看不出來。
    certainty: 🔵
    apply_zh: 長池分到邊道，前段別多衝。
  - text_zh: 組裡沒人比自己快時比較慢，前段也比較不衝。
    certainty: 🔵
    apply_zh: 預賽遙遙領先時，自己要有配速計畫，不靠別人帶。
  - text_zh: 整組越強只在決賽會把人帶快，預賽幾乎沒影響。
    certainty: 🔵
  title: 水道位置與分組強度：邊道、獨自領先、強組會怎樣？
  group: analysis
  weight: 9
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.3
    'no': '1.3'
    title: 被帶著衝為什麼划算
    anchor: q-1-3
- id: note.heat-saving
  slug: heat-saving
  theme: race-day
  kind: analysis
  status: researching
  summary_zh: 預賽要收，平常成績至少要比晉級門檻快 2–3%；資料看不到「預賽收著游、決賽比較好」。
  findings:
  - text_zh: 平常成績只比晉級門檻快 0–0.5% 時落選率 50%，快 2–3% 降到 7%，快 3% 以上 3%；200–400 m 需要更大的邊際。
    certainty: 🔵
    apply_zh: 用去年的晉級門檻估邊際；不到 1% 不要收。
  - text_zh: 預賽比平常多慢 1% 的那場，決賽也比平常慢約 0.56%：狀態好的那天兩場都快。
    certainty: 🔵
    apply_zh: 賽前準備比預賽留力重要；預賽目標寫成「比門檻快 X 秒」。
  title: 預賽保留與晉級：預賽要收多少才安全？收著游，決賽有比較好嗎？
  group: analysis
  weight: 10
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.5
    'no': '1.5'
    title: 選拔、轉隊、預賽策略的長期效果
    anchor: q-1-5
- id: note.tw-kids
  slug: tw-kids
  theme: race-day
  kind: analysis
  status: researching
  summary_zh: 同一天每多游一項，每趟平均慢約 0.2%；台灣孩子的 200 常中段保留太多，100 則是後 50 撐不住。
  findings:
  - text_zh: 同一天每多游一項，每趟平均慢 0.18%（12 歲以下 0.28%），慢在整趟，不是最後一段崩。多天比賽的第幾天看不出影響。
    certainty: 🔵
    apply_zh: 最在意的項目，盡量排在項目少的那天。
  - text_zh: 台灣孩子的 200 普遍中段保留、最後衝，年紀越大越反過來；100 則年紀小的後 50 掉得多。
    certainty: 🔵
    apply_zh: 200 最後 50 比第三個 50 快很多（例如 5% 以上）代表中段保留太多；100 練前 50 控制住。
  title: 台灣孩子：同一天游越多項會怎樣？幾歲開始會收尾？
  group: analysis
  weight: 11
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.4
    'no': '1.4'
    title: 孩子的 200 中段游快一點，總成績會不會更好
    anchor: q-1-4
- id: note.relative-age
  slug: relative-age
  theme: development
  kind: analysis
  status: researching
  summary_zh: 分齡組裡年紀最小的孩子吃虧很大，12 歲最明顯、男生拖到 16 歲；但年紀最小還擠進全國賽的孩子，長大反而比較好。
  findings:
  - text_zh: 日本全國少年賽 11–12 歲組，組裡最年輕那群只有應有人數的 2–4 成；同場排名平均落後 38 個百分位，15–16 歲縮到 4 個。
    certainty: 🔵
    apply_zh: 看孩子進步用同出生年或跟自己去年比，不只看組內排名。
  - text_zh: 女生約 14 歲以後大致追上，男生到 15–16 歲仍明顯吃虧。
    certainty: 🔵
    apply_zh: 評估男生要更有耐心。
  - text_zh: 11–12 歲以組裡最年輕擠進全國賽的孩子，17–18 歲時仍在全國賽的比例較高（40% 對 27%），同出生年百分位也較高。
    certainty: 🔵
    apply_zh: 這群孩子值得特別留意與留住。
  - text_zh: 台灣分齡組第一年的孩子同場排名平均落後 10–14 個百分位，到 15–17 歲組仍落後約 10 個。
    certainty: 🔵
    apply_zh: 「今年排名退步」常只是剛升組，等第二年再看。
  title: 相對年齡效應：分齡組裡年紀小的那一半吃虧多少？吃虧到幾歲？
  group: analysis
  weight: 12
  status_zh: 研究中
  graduated: []
  questions:
  - id: fq.1.5
    'no': '1.5'
    title: 選拔、轉隊、預賽策略的長期效果
    anchor: q-1-5
- id: note.race-frequency
  slug: race-frequency
  theme: development
  kind: analysis
  status: researching
  summary_zh: 「比賽多、進步少」是計算方式造成的假象；用公平的量法，比賽多寡跟進步沒有關係。
  findings:
  - text_zh: 用季最佳量進步時，比賽多的人隔年進步看起來較少；改用每季隨機抽 2 場的平均，這個關係就消失。
    certainty: 🔵
    apply_zh: 看進步用一段期間的平均或中位數，不只看季最佳。
  - text_zh: 破個人最佳的比例本來就隨場數下降（一季 1 場 73%、9 場以上 40%），不代表比賽多不好。
    certainty: 🔵
    apply_zh: 不拿破 PB 率比較場數不同的孩子；排賽考量疲勞、課業、動機。
  title: 比賽頻率與進步：比賽場數多，進步會比較少嗎？還是只是統計假象？
  group: analysis
  weight: 13
  status_zh: 研究中
  graduated: []
  questions: []
- id: note.experience-pacing
  slug: experience-pacing
  theme: development
  kind: analysis
  status: researching
  summary_zh: 比賽比得多，配速不會自己變穩；要穩得在練習中刻意練。
  findings:
