  theme: perception
  kind: literature
  status: researching
  summary_zh: 顯性規則學得快但壓力下容易崩；隱性學習慢但穩。壓力下崩潰的機制叫「再投資」。
  findings:
  - text_zh: 擁有越多顯性規則，壓力下越可能把規則叫回來監控動作而崩潰（Masters 1992 再投資理論）。
    certainty: 🟡
  - text_zh: 用比喻代替技術分解（類比學習）能讓表現在壓力下更穩，原研究是桌球，游泳應用尚待驗證。
    certainty: 🟢
  - text_zh: 從 L5 到 L6 的轉換，可以理解成放掉顯性自我監控（去再投資）。
    certainty: 🔵
