domain: health
sub: breathing-training
schema_version: 1
safety:
  id: health.breathing.safety
  cert: 🟢
  source: StatPearls 缺氧昏迷機轉 (PMID 32119507); CDC MMWR 2015;64(19) 紐約州 DUBB 致死研究; American Red Cross / YMCA / USA Swimming 缺氧昏迷聯合聲明 (2015/2022)
  source_ids:
  - src.pmid-32119507
  danger_zh: 🟢 先講最重要的一件事：『憋氣練肺活量』『水下閉氣比遠』『游前先用力深呼吸幾次再潛下去』——這些都可能直接致命，不是危言聳聽。機轉是『缺氧昏迷』（hypoxic blackout，舊稱淺水昏迷 SWB）：游泳前過度換氣會把血中二氧化碳壓得很低，而二氧化碳才是大腦『想呼吸』的主要訊號；訊號被壓掉之後，血氧會在你還沒感到任何窒息感之前就先掉到失去意識的程度——人就這樣無聲地在水下昏過去。
  evidence_zh: 🟢 這不是理論：CDC MMWR 統計紐約州 1988–2011 年的危險水下憋氣行為（DUBB），記錄到 16 起、其中 4 人死亡（皆為 17–22 歲男性）；同時把『過度換氣 + 長距離水下游 + 靜態閉氣』幾種行為疊加，致死風險明顯上升。美軍同期也有數十起相關溺斃。
  policy_zh: 🟢 三方權威立場：美國紅十字會、YMCA、USA Swimming 共同聲明把『游前刻意過度換氣』與『水中長時間閉氣』定義為**危險且可能致命的行為**，並要求救生員與教練主動制止。USA Swimming 的教練安全訓練明文規定：任何缺氧訓練**只能在水面做，不能在水下做**。
  rule_zh: 🔵 因此本頁所有『呼吸訓練』方法都是在**陸上或水面**進行（呼吸肌訓練器、坐姿呼吸練習），**零水下憋氣**。如果有人教你『閉氣憋久一點練肺』，那不是訓練，是風險。要練感知層的呼吸節律，去看 drills 的呼吸類練習（在水面換氣，不在水下憋氣）。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
overview:
  id: health.breathing.overview
  cert: 🔵
  premise_zh: 『呼吸要不要練、怎麼練』之所以講不清楚，是因為大家把兩件不同的事混在一起。Vortex 把呼吸拆成兩條線：① **感知線**——吐氣連不連續、換氣會不會緊張、兩側順不順，這是水感的一部分，跟『手感腳感』一樣按 L0–L6 分級，靠水裡的 drill 練（FrBr1–FrBr4）。② **生理線（本頁）**——呼吸肌（吸氣那組肌肉）有沒有力、對二氧化碳堆積的耐受度，這是純『硬體』，是可以用阻力訓練的骨骼肌，跟水感無關。
  author_synthesis_zh: 🔵 作者立場：把生理線放進『健康 / 輔助軸』，定位跟『陸上力量訓練』完全平行——都是處理硬體上限那一側，都**按負荷分級而不是按 L 分級**，也都**不是水感的替代**。先問：這個泳者換氣的問題，是『感知還沒建立』（緊張、憋氣、抬頭找氣）還是『呼吸肌真的不夠力』（技術沒問題但長距離後段明顯喘到掉速）？前者回水裡練 drill，後者才考慮呼吸肌訓練。把兩者混淆——用憋氣訓練去解決一個其實是緊張的問題——既無效又危險。
  plain_zh: 呼吸有兩種『練』：一種是在水裡把換氣節律練順（那是水感，去看 drill）；另一種是在陸上把『吸氣的肌肉』練得更有力（那是這一頁講的生理訓練）。它們解決的是不同問題，別搞混。而且後者就像陸上重訓——是輔助，不是捷徑，而且永遠不在水下憋氣做。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
imt_rmt:
  id: health.breathing.imt_rmt
  cert: 🟡
  source: RMT 統合分析 Frontiers Physiology 2025 (DOI 10.3389/fphys.2025.1638739, 10 RCT n=230); 各距離分層統合分析 (DOI 10.3389/fphys.2026.1770925, 14 RCT n=375); 肺功能/MIP 統合分析 Frontiers Sports Act Living 2024 (PMID 39351143, 13 研究 n=277)
  source_ids:
  - src.pmid-39351143
  what_zh: 🟢 是什麼：吸氣肌訓練（IMT）用一個有阻力的呼吸器（最常見 POWERbreathe），讓你『用力吸氣對抗阻力』，把橫膈與肋間肌等吸氣肌當骨骼肌來練。RMT（呼吸肌訓練）是包含吸氣與吐氣的廣義版本。
  evidence_zh: 🟡 證據（要分距離看，別一概而論）：① **呼吸肌力量（MIP）幾乎一定會進步**——統合分析穩定看到 MIP 顯著上升（一份報告約 +29 cmH2O）。② 但『力量進步』不等於『游更快』：50–200m 短中距，多份統合分析看到**游泳成績無顯著改善**；只有較長距離 / 有氧表現出現中等程度的正向訊號，且異質性高、要保守解讀。③ 整體 RMT 對游泳表現的合併效果量約 −0.49（小到中等、統計顯著）。換句話說：呼吸肌會變強是肯定的，會不會讓你游更快，看距離、而且別期待太大。
  protocol_zh: 🟢 證據導向的協議（成人 / 青少年菁英資料）：負荷從 **50% MIP** 起（不是更低的 30%——30% 是給呼吸道病人的臨床劑量，不是運動員），每次 **30 次呼吸、每天 1–2 組、每週 3–6 天、至少 6–12 週**，適應後漸進加到約 80% MIP。器材以 POWERbreathe 為研究主流，Threshold IMT 是較便宜的替代。每天兩組之間留約 6 小時讓呼吸肌恢復。
  null_zh: 🟡 誠實反例（必讀）：一份 12 週菁英泳者 RCT（Cunha 2019, PMID 33501396，50% MIP、30 次 ×2/日 ×5 日/週）發現，相較 15% 假訓練組，**游泳成績、吸氣肌力、肺活量、主觀喘感都沒有顯著差異**——作者推測菁英泳者的呼吸肌可能早已適應，邊際空間小。所以 IMT 對『已經練很久的人』可能近乎無效，對訓練史較短或長距離項目的人才比較可能有感。
  plain_zh: 用阻力呼吸器練『吸氣的肌肉』，肌肉確實會變強，這點研究很一致。但變強會不會讓你游更快？短距離（50–200）多數研究說沒差，長一點的距離可能有一點點幫助，別期待太大。如果你已經是練很多年的高手，有份菁英研究甚至完全沒看到效果。協議是 50% 強度起、一次 30 下、一天 1–2 次、練 6–12 週。它是錦上添花的輔助，不是讓你脫胎換骨的東西。
  links:
    development_stages:
    - t2c
    - t2w
co2_tolerance:
  id: health.breathing.co2_tolerance
  cert: 🔴
  source: 閉氣訓練統合分析 Frontiers Physiology 2022 (DOI 10.3389/fphys.2022.964144, 7 RCT n=126); 減少呼吸頻率訓練 RCT (PMID 24421735)
  source_ids:
  - src.pmid-24421735
  what_zh: 🟠 是什麼：自由潛水社群用『CO2 表』『O2 表』（結構化的靜態閉氣，逐步縮短休息）來提高對二氧化碳堆積的耐受度。常被搬來宣稱能讓游泳『更耐喘、游更快』。
  evidence_zh: 🔴 對游泳表現的證據：**沒有任何同行審查 RCT 或系統回顧，直接測試 CO2 表協議能不能提升競技游泳成績**——這在游泳脈絡下屬於沒有實證的說法。相近研究：一份閉氣訓練統合分析（7 RCT, n=126）發現 VO2max **無顯著提升**，但峰值血乳酸顯著上升，暗示是『無氧』而非『有氧』適應；一份減少呼吸頻率 RCT 確實讓 CO2 通氣反應下降 45%（CO2 耐受真的會升），但**沒測游泳表現**，且高強度時受試者無法維持限制呼吸——剛好限制了它對競速游泳的適用性。
  safety_zh: 🟢 安全面：CO2 耐受練習若**完全在陸上、不入水**做，沒有缺氧溺水（SWB）的風險。但仍有少見的迷走性昏厥（暈過去）可能，**即使在陸上也不要獨自做**。一旦把閉氣搬進水裡，就回到本頁置頂的致命風險——絕對禁止。
  verdict_zh: 🔵 結論：CO2 表是自由潛水的傳統工法，搬到游泳上『提升表現』目前是沒有實證的外推。要練的話只在陸上、有人陪同；別把它當成游泳變快的捷徑，更別在水裡做。自由潛水（含未來規劃中的兒童／成人自由潛水內容）是另一個脈絡，不在此處的游泳結論範圍內。
  plain_zh: 自由潛水那套『閉氣表』在游泳圈很流行，但沒有任何像樣的研究證明它能讓你游更快——這是從別的運動硬搬過來的說法。真要練 CO2 耐受，只在陸上、找人陪、別獨自做；而且永遠不要把閉氣帶進水裡（那是會死人的）。它跟自由潛水是兩回事，自由潛水的結論不能直接套到游泳。
  links:
    development_stages:
    - t2c
    - t2w
grading:
  id: health.breathing.grading
  cert: 🔵
  premise_zh: 『純粹的呼吸訓練能不能分級？』能，但要看哪一條線，而且分級的軸不一樣：
  axes_zh:
  - 感知線（在水裡）：按 **L0–L2** 分級。L0 水中連續吐氣（FrBr1 韻律呼吸 / FrBr2 放鬆下沉）→ L1 游進中持續吐氣（FrBr3 連續涓流吐氣）→ L2 兩側換氣（FrBr4）。這條按『感知建立的順序』走，不是按強度。
  - 生理線—呼吸肌（在陸上）：按 **負荷（% MIP）** 分級。50% MIP 起 → 漸進到 80% MIP；這跟陸上重訓一樣是『加阻力』式的線性／漸進分級，跟 L 級無關。
  - 生理線—CO2 耐受：**不建議當成游泳的分級訓練**。游泳無實證、且任何水下版本致命；自由潛水有自己的分級表，但那是另一個脈絡。
  caveat_zh: 🔴 素材缺口：呼吸肌訓練的劑量證據集中在青少年與菁英泳者；**兒童、成人初學、masters、para** 的呼吸訓練分級沒有對應游泳文獻，不可把菁英協議直接外推。
  plain_zh: 可以分級，但分兩套：水裡的呼吸節律按『感知順序』分（L0 吐氣 → L1 游進吐氣 → L2 兩側換氣，去看 drill）；陸上的呼吸肌按『阻力強度』分（50% 起、慢慢加到 80%，像重訓）。至於自由潛水那種『閉氣表』，游泳上沒證據、水下還會要命，不列入游泳的分級。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
