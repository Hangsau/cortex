stroke_zh: 自由式
stroke_en: Freestyle
intro: "自由式是四式中速度最快、速度波動最低的泳式。划手距離（SL）是技術指標——捕水品質、旋轉連動、阻力控制的直接反映；划頻（SR）是生理指標——神經快速徵召能力的輸出。疲勞時 SL 先下降，本能反應是提高 SR 來補速度——但 SL 下降才是最早的技術崩潰訊號，不是 SR。「認真游」這個念頭本身就是 C 型的觸發點：心理壓力直接轉化為全身肌肉張力，把所有感知訊號遮蔽掉。"

components:
  - id: entry
    name_zh: 入水位置
    order: 1
    physical: "手入水跨越中線，是自由式最常見的錯誤（PMC 2014 統計：91% 泳者至少一項划手錯誤）。跨越中線的第一個動作是大幅外掃，產生橫向分力，誘發蛇行，讓肩胛骨無法穩定。正確入水在肩膀正前方（11 點／1 點鐘方向），不跨越中線。小指可略轉朝下入水，阻力降低約 9.5%。"
    coach_cue: "單臂划水：隔離觀察入水位置。或在水中設置目標點讓學生對準入水。"
    should_feel:
      - "感覺手在肩膀前面"
      - "入水的時候感覺直直進去"
      - "入水沒有感覺到側向的力"
    wrong_feel:
      - quote: "我有把手放直進去"
        followup: "進去的時候，有沒有感覺身體稍微偏一下？跨越中線的人通常感覺不到蛇行，因為它是慣性模式。"
      - quote: "感覺很流暢"
        followup: "太寬泛。入水之後，手的第一個動作是往哪裡去？往外掃 = 跨越中線的代償。"
    external_check: "從後方觀察：手入水點是否在肩膀正前方延伸線上。最可靠的工具是側錄，因為泳者本體感知頭部和手臂位置的準確度遠低於實際。"
    drill_filter:
      stroke: freestyle
      category: arm

  - id: catch
    name_zh: 捕水（高肘 EVF）
    order: 2
    physical: "Early Vertical Forearm（EVF）是捕水階段最重要的概念，但常被誤解：高肘的目的是降低上臂阻力，不是讓前臂推進。上臂是自由式中阻力最大的部位，高肘讓上臂與游進方向平行、截面積最小化，同時讓手掌和前臂朝向後方。手掌才是主推進面，不是前臂。感知目標是手入水後感覺「肘尖朝向前方游進方向」——不是前臂往下壓，而是上臂沒有往旁邊展開。"
    coach_cue: "拳頭游 → 張開手：拳頭游時強迫前臂和手肘承接水壓，張開手後「復活感」那一刻就是正確捕水的感知窗口。"
    should_feel:
      - "肘尖朝前"
      - "感覺手掌面向後方，不是面向下方"
      - "高肘的時候感覺上臂沒有在擋水"
      - "拳頭張開那一刻，手掌突然有東西（復活感）"
    wrong_feel:
      - quote: "我有把前臂壓下去推水"
        followup: "這是最常見的誤解。前臂是圓形截面，推進效果遠差於手掌。你感覺到的阻力，是在手掌上還是前臂上？"
      - quote: "我有把肘部抬高"
        followup: "可能在執行形式記憶。肘部高起來的時候，上臂有沒有往旁邊？還是跟身體前進方向平行？"
      - quote: "感覺手在抓水"
        followup: "可能有效，也可能是在用手腕代償。抓的時候，肘有沒有往下沉？肘下沉 = dropped elbow，上臂截面積瞬間增大。"
    hardware_boundary: "前鋸肌是 EVF 的硬體前提。前鋸肌疲勞後肩胛骨失穩，高肘姿態無法維持，EVF 自然崩潰——這不是技術感知的問題，是支撐動作的肌肉撐不住了。長距離後段的 EVF 崩潰，多半是前鋸肌耐力問題，不是技術理解問題。"
    drill_filter:
      stroke: freestyle
      category: arm

  - id: pull
    name_zh: 拉水加速
    order: 3
    physical: "捕水之後進入推進相，手掌從 3 點鐘位置加速往後推到 9 點鐘。路徑接近直線向後——傳統 S 形划水路徑已被現代共識修正，那是高速攝影出現前缺乏測量工具的結果。hand speed 必須從捕水起點開始逐漸加速，不是定速推水。「感覺手在水裡移動」和「感覺手在推動水」是兩個完全不同的感知對象。"
    coach_cue: "Tornado Drill：感受手在水中製造渦流，建立加速推進的感知曲線。或單臂划水，專注感覺哪個位置推進力最大。"
    should_feel:
      - "拉水的時候感覺越拉越有力"
      - "有一個點開始感覺推到了東西"
      - "感覺手在把水往後送，不只是在動"
    wrong_feel:
      - quote: "我有用力推水"
        followup: "這是在描述肌力輸出。推的過程中，感覺推力有沒有越來越大？還是一直一樣？加速曲線是重點。"
      - quote: "感覺手在往後划"
        followup: "太中性，可能有效也可能是 S 形路徑。往後划的時候，有沒有什麼點讓你感覺推力最大？"
      - quote: "推完感覺手掌壓力消失"
        followup: "有效，這是釋放相的正確感知，但要確認時機——太早消失 = 提前釋放，推進力截斷。"
    drill_filter:
      stroke: freestyle
      category: arm

  - id: rotation
    name_zh: 旋轉耦合
    order: 4
    physical: "身體旋轉本身不產生推進力，但旋轉的時機決定推進力大小。當旋轉速度峰值和划手推力峰值「耦合」時，能量疊加放大推力。感知目標不是「旋轉幅度多大」，而是「旋轉峰值有沒有和推力峰值對上」。啟動旋轉的發動者是推水末段的肩胛肌群（菱形肌收縮、縮回肩胛骨），不是腰部或髖部。"
    coach_cue: "把肩膀教好，髖部自然跟著動——旋轉的感知引導從肩胛骨入手，不從腰部或髖部。"
    should_feel:
      - "推完感覺肩膀往後縮，對側自然就轉過來了"
      - "旋轉感覺是推水帶出來的，不是獨立做的"
      - "感覺旋轉和推水像是同一件事"
    wrong_feel:
      - quote: "我有旋轉髖部"
        followup: "旋轉的時候，推水有沒有跟著更有力？還是感覺旋轉和推水是兩件不同的事？耦合成功的標誌是兩者感覺像同一件事。"
      - quote: "我有把身體轉到側面"
        followup: "這是在監控幅度，不是時機。幅度轉得對，但感覺有沒有讓推水更有力？"
    hardware_boundary: "Hip-driven 和 Shoulder-driven 的旋轉感知目標不同：Hip-driven 髖旋轉幅度更大（45–60°），感知重點在大幅側旋；Shoulder-driven 髖旋轉幅度小（20–30°），感知重點在肩胛骨啟動。不同風格泳者的旋轉描述可能截然不同，都是有效的。"
    drill_filter:
      stroke: freestyle
      category: arm

  - id: kick
    name_zh: 踢水節律
    order: 5
    physical: "自由式踢水有四個功能，不只是推進：①推進（彌補划手空窗期）②升力（讓下半身水平、降低正面截面積）③慣性（讓速度波動最小化）④平衡穩定（抵消回臂的側向分力）。六拍踢的對側配對邏輯：右手入水 → 左腳主踢下，來自反扭矩。感知目標不是「踢的力道」，而是「踢水和划手有沒有整合在一起」。"
    coach_cue: "浮板踢水 + 刻意停頓，感覺踢水有沒有讓身體繼續前進。或 2 打腿訓練，強制低頻踢腿配合划手，讓整合感知浮現。"
    should_feel:
      - "踢水感覺和划手接在一起"
      - "踢的時候感覺腳背有東西"
      - "踢腿的節奏感覺像在走路，不用想"
      - "腿沒有追划手，感覺一起在動"
    wrong_feel:
      - quote: "我有用力踢"
        followup: "B 型常見。踢的時候感覺腳在推水，還是腿只是在動？"
      - quote: "我踢了六下"
        followup: "在計數，不在感知。六下踢完，划手有沒有感覺更有力？還是踢水和划手各自跑？"
      - quote: "腿很累"
        followup: "踢腿比手臂疲勞更快通常是 B 型訊號。腿累的時候，踢水感覺有沒有在推水？還是只是在打水？"
    hardware_boundary: "踝關節蹠屈幅度是踢水效率的硬體邊界。踝關節僵硬的泳者（跑步背景者常見），腳掌無法朝後，踢水效率大幅下降，嚴重時踢水反而制動。感知建立之前先確認踝關節能否完整蹠屈。"
    drill_filter:
      stroke: freestyle
      category: kick

  - id: head
    name_zh: 頭部位置
    order: 6
    physical: "頭部位置是自由式中感知最不可靠的部位。大腦對頭部位置的本體感知精確度遠低於手臂和腿部——「感覺頭部壓低了」不等於頭部實際是低的。這解釋了為什麼泳者陸上示範正確、下水後自動回到微抬習慣：感知系統沒有被重新校正，不是「忘了」。波阻佔自由式總阻力約 25%，與速度四次方成正比。換氣機制是嘴巴轉進弓形波凹陷換氣，不是抬頭創造空間；視線靠眼球上轉，頭部本身不移動。"
    coach_cue: "蛙鏡鏡片不超過水面基準線。"
    should_feel:
      - "感覺眼睛是往上翻，不是頭往上抬"
      - "換氣的時候嘴角才出水"
      - "頭壓著，感覺下半身比較輕"
      - "換氣很順，好像水把嘴送出來（弓形波凹陷有效）"
    wrong_feel:
      - quote: "我有把頭壓低"
        followup: "這個感知最不可信。你怎麼知道頭是低的？如果答案是「感覺低」，需要外部確認（錄影、他人觀察）。"
      - quote: "換氣的時候我只讓嘴巴出來"
        followup: "眼睛有沒有離開水面？眼睛離開水面 = 頭部超過必要高度。"
      - quote: "換氣感覺有點卡"
        followup: "可能是頭部壓得過低導致轉身角度不夠，也可能是弓形波還沒建立（游速不夠快，凹陷不存在）。要分兩種情況。"
    drill_filter:
      stroke: freestyle
      category: breathing

  - id: distance
    name_zh: 划距（最重要的疲勞指標）
    order: 7
    physical: "SL（每划距離）是自由式技術品質最直接的外部指標，也是疲勞崩潰的第一個訊號——SL 下降先於 SR 下降。泳者的本能反應剛好是反的：感覺速度慢 → 划更快（提高 SR）→ 每划推進力下降但划次增加 → 消耗更多能量 → 技術繼續惡化。精英選手的優勢不是更高的 SR，而是「在高 SR 下維持 SL 不下降」。感知目標是能感覺到「這趟划距開始縮短了」——不是游完才發現，而是游泳中途就能偵測到。"
    coach_cue: "記錄 SPL（每趟划手數）：SPL 上升 = SL 下降。讓學生在同樣距離設定目標划數，感覺「少划一划是什麼感覺」。"
    should_feel:
      - "感覺這趟每划比較遠"
      - "划手數少了，但感覺速度差不多"
      - "後段感覺划得越來越短（能察覺 = L4–L5 的重要里程碑）"
      - "划距縮短了，我讓自己慢下來重新抓"
    wrong_feel:
      - quote: "我感覺游很快"
        followup: "你的划手數大概幾下？速度感知和划距感知是兩件事，感覺快但划數多，通常是 SR 補了 SL 的洞。"
      - quote: "游累了就划快一點"
        followup: "這是本能補償行為。划快之後，感覺每划有沒有推到一樣多的水？"
      - quote: "感覺和之前一樣"
        followup: "疲勞後的感知可信度下降。這時候要看 SPL 數字，不是主觀感知。"
    drill_filter:
      stroke: freestyle
      category: arm

  - id: coupling
    name_zh: 旋轉連動鏈（進階 · L5+）
    order: 8
    physical: "回臂動作產生 coupling 能量：手臂從最高點加速下落，入水時動能傳遞到對側划手的末段推力。這個耦合要有效，回臂必須持續加速到入水（不能在入水前減速）。Coupling 的感知訊號是對側拉水末段在回臂手入水瞬間有「力量被放大」的感覺。這是 L5 的感知層次——L3–L4 不要優先處理，連動鏈的感知要等基礎捕水和推進感知穩固後才會出現。"
    should_feel:
      - "感覺手入水的時候，另一隻手的推力突然更強"
      - "整個游感覺像一個整體在動"
      - "旋轉和推水感覺在同一時間發生"
    wrong_feel:
      - quote: "（L3–L4 學生）感覺整個身體連在一起游"
        followup: "先確認基礎感知（抓水感、踢水推進感）是否穩定，而不是直接進入連動鏈。過早進入整體感知，往往是感覺「很好」但個別環節實際不穩固。"
    drill_filter:
      stroke: freestyle
      category: arm

fatigue_sequence:
  - "SL 開始下降 — 最早、最隱性。游泳中途感覺不到，游完才能從 SPL 看出來。L5–L6 才能在中途察覺。"
  - "旋轉幅度縮小 — 核心穩定性下降，推進力矩跟著減少。教練可觀察，泳者通常感覺不到。"
  - "前鋸肌失守 — EVF 崩潰，肩胛骨失穩，轉為直臂划水。泳者的感覺：「手越來越沒力，在蠻力划水」。"
  - "頭部漂移 — 下半身開始下沉，踢水能量預算被佔用。最難自我察覺的崩潰。"
  - "踢水退化 — 從六拍退化至四拍或兩拍。最後防線，到這裡只剩意志力。"

quick_diag:
  - says: "肩膀和上臂特別累"
    type: A
    first_q: "拳頭游和張開手游，速度差很多嗎？"
  - says: "大腿小腿比手臂累很多"
    type: B
    first_q: "踢水的時候，感覺腳在推水嗎？"
  - says: "放輕鬆游得比較好，一認真就不對了"
    type: C
    first_q: "準備「認真游」的那個瞬間，身體有沒有先緊起來？"
  - says: "游累了就划快一點"
    type: 任何型
    first_q: "划快之後，每划感覺推的距離有沒有一樣長？"
  - says: "有時候感覺手有抓到，下一趟又沒了"
    type: A · L3
    first_q: "有抓到的那趟，肘有沒有往下沉？"
  - says: "感覺全身都在用力但速度差不多"
    type: C
    first_q: "如果你放慢一半，感覺水感有沒有回來？"

cue_check:
  - bad_cue: "前臂壓下去推水"
    problem: "高肘的目的是降上臂阻力，不是讓前臂推；前臂是圓形截面效率差"
    better: "肘尖保持朝向前方游進方向"
  - bad_cue: "旋轉髖部"
    problem: "高划頻下讓動作失調；旋轉的發動者是推水末段的肩胛肌群"
    better: "推水末段感覺肩膀往後縮，對側跟著轉"
  - bad_cue: "頭部壓低"
    problem: "感知最不可靠的部位；學生覺得低了 ≠ 實際是低的"
    better: "錄影確認 + 眼睛往上翻，頭不動"
  - bad_cue: "划快一點"
    problem: "疲勞時提 SR 掩蓋 SL 下降，短期有用但長期惡化技術"
    better: "先感覺每划推多遠，再考慮快慢"
  - bad_cue: "用力踢腿"
    problem: "B 型常見陷阱；力量不是問題，整合節律才是"
    better: "踢腿有跟上划手嗎？還是各自跑？"
  - bad_cue: "抬頭換氣"
    problem: "直接指導語造成頭部過高，下半身下沉"
    better: "嘴角轉進水面的凹陷，眼睛看斜前方"
