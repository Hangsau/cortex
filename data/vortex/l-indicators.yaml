- id: free.L3.evf
  stroke: free
  level: L3
  aspect: EVF 捕水
  indicator: 划手有明顯的捕水「卡頓感」；拳頭游 vs 開手速度差 > 15%
  framework_state: 水感出現但不穩定
  evidence:
  - certainty: 🟢
    text: Race Club PDM（推進方向動作）
    source: Race Club
    source_ids:
    - src.race-club
- id: free.L3.kick-rhythm
  stroke: free
  level: L3
  aspect: 踢水節律
  indicator: 六拍踢能描述「對側配對」；踢水後下半身不下沉
  framework_state: 本體感覺萌芽
  evidence:
  - certainty: 🟠
    text: 到 L3 的泳者能把六拍踢描述成「對側配對」（哪一腳配哪一手），而不只是「一直踢」；同時踢水停止時下半身不會立刻下沉——這兩項在教學現場常同時出現，可當成同一個節律感知的兩個外顯面。
    observation_basis: 觀察者是本專案作者的教學實務，族群涵蓋兒童競技與成人初學；原欄位只寫「教練觀測共識」四個字、`source` 是空字串，2026-09-04 補寫觀察基礎並把指標內容寫實。外推邊界：① 「共識」這個詞不成立——本專案沒有調查過其他教練，這是單一觀察者的累積判讀，不得寫成業界共識；② 兩項訊號同時出現只是常見，不是必然，部分踢腿力量足但本體感覺弱的泳者可以不下沉卻描述不出配對關係； ③ 沒有量測支持，不可當成 L3 的通過門檻，只能當成觀察的起手方向。
- id: free.L4.roll-coupling
  stroke: free
  level: L4
  aspect: 旋轉耦合
  indicator: 加速後旋轉崩潰（肩旋轉提前縮小）；高划頻下 EVF 消失
  framework_state: 壓力下感知失守
  evidence:
  - certainty: 🟢
    text: Gonjo 2020
    source: Gonjo 2020
    source_ids:
    - src.gonjo-2020-a
- id: free.L4.sr-sl
  stroke: free
  level: L4
  aspect: 划頻×划距
  indicator: SR 提高時 SL 下降 > 5%（感知尚未支撐技術）
  framework_state: 壓力下感知失守
  evidence:
  - certainty: 🟢
    text: Staunton 2025
    source: Staunton et al. 2025
    source_ids:
    - src.staunton-2025-c
- id: free.L5.sr-sl
  stroke: free
  level: L5
  aspect: 划頻×划距
  indicator: 精英特徵：高 SR 下 SL 不下降；SR 與速度負相關消失
  framework_state: 感知自動化過渡
  evidence:
  - certainty: 🟢
    text: Staunton 2025
    source: Staunton et al. 2025
    source_ids:
    - src.staunton-2025-c
- id: free.L5.coupling-timing
  stroke: free
  level: L5
  aspect: 肩-髖旋轉時間差
  indicator: 精英特徵：肩旋轉峰值與髖旋轉峰值相差 0.2–0.3 秒（不是同步）；初學者兩者同時或無時差
  framework_state: 感知自動化過渡
  note: 同步旋轉代表把肩髖當剛體一起轉，失去 coupling 機制；菁英的時間差是讓肩旋轉先進入拉水前段、髖旋轉接到拉水末段，整個拉水週期都有 coupling 加成。可由水下高速攝影或 IMU 多軸感測量測。
  evidence:
  - certainty: 🟠
    text: Race Club Pressure Meter 同步量測肩-髖角速度與手壓力
    source: 整合 Race Club + 通用菁英觀察
    source_ids:
    - src.race-club-c
- id: free.L5.lift-phase-duration
  stroke: free
  level: L5
  aspect: 升力相時長與風格匹配
  indicator: 精英特徵：升力相時長與所選風格的 SR 對應——hip-driven 60 SPM 約 >0.6 秒、shoulder-driven 120 SPM <0.3 秒；風格與時長不匹配（如低 SR 但短升力相）代表風格未真正建立
  framework_state: 感知自動化過渡
  note: 升力相 = 手入水到開始向後產生推進力之間的時間。這個指標把風格從外觀判斷（觀察 SR）升級到力學判斷（觀察推進啟動時機）。長距離選手做高 SR 但升力相短 = 形似 shoulder-driven 神不到。
  evidence:
  - certainty: 🟠
    text: Race Club Velocity Meter 量測 Gary Hall Sr 100 SPM 升力相 0.34 秒
    source: 整合 Race Club 量測
    source_ids:
    - src.race-club-d
- id: free.L5.serratus
  stroke: free
  level: L5
  aspect: 前鋸肌耐力
  indicator: 疲勞後 EVF 仍維持；肩胛骨不 wing；第 4-6 趟技術與第 1-2 趟差距小
  framework_state: 感知自動化過渡
  note: 前鋸肌耐力是 L5 的硬體邊界——技術感知建立後能維持多久取決於前鋸肌，不是感知問題。
  evidence:
  - certainty: 🟡
    text: Pink EMG 1991
    source: Pink et al. 1991
    source_ids:
    - src.pink-1991-a
  - certainty: 🟢
    text: StatPearls 2023
    source: StatPearls 2023
    source_ids:
    - src.statpearls-2023
