    source: ''
- id: fly.L3.undulation-integration
  stroke: fly
  level: L3
  aspect: 波動整合
  indicator: 胸部下壓有帶動腿踢的感知（不是腿獨立踢）；身體像「一條線」而非兩段
  framework_state: 水感出現但不穩定
  evidence:
  - certainty: 🟡
    text: Sanders 1995
    source: Sanders 1995
    source_ids:
    - src.sanders-1995-a
  - certainty: 🟠
    text: 到 L3 的蝶式泳者會把「胸部下壓帶動腿踢」講成一件事，而不是把踢腿當成獨立加上去的動作；旁觀時身體看起來是一條連續的線而不是上下兩段各走各的。
    observation_basis: 觀察者是本專案作者的教學實務，族群以兒童競技與青少年競技的蝶式學習者為主；原欄位只寫「教練觀測」四個字、`source` 是空字串，2026-09-04 補寫觀察基礎並把指標內容寫實。外推邊界：① 同組 evidence 的另一行（Sanders 1995）提供的是波動運動學的文獻依據，本行只補「泳者怎麼描述」這一層，兩者不可互相代替； ② 「一條線」是旁觀者的視覺印象，不是量測的節段相位差，相位差要用影像分析才判得準，肉眼判讀在划頻高時可靠度明顯下降； ③ 沒有量測支持，不得當成 L3 的通過門檻。
