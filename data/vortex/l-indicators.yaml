- id: back.L4.roll-stability
  stroke: back
  level: L4
  aspect: 旋轉穩定
  indicator: 高划頻下旋轉幅度縮小；加速後蛇行明顯；流線型滑行後提早抬頭
  framework_state: 壓力下感知失守
  evidence:
  - certainty: 🟢
    text: González-Ravé 2025
    source: González-Ravé 2025
    source_ids:
    - src.gonzalez-rave-2025-a
- id: back.L4.head-stillness
  stroke: back
  level: L4
  aspect: 頭部加速靜止度
  indicator: '加速後頭部仍能維持完全靜止（不左右晃、不前後點）；額頭水線位置不偏移。

    L4 訊號是「加速時頭部開始輕微晃動但仍能控制」；L5 是「全速下完全不動」。

    測試：在額頭放小物（泳鏡平衡 drill）+ 漸進加速，物品掉落速度與加速幅度的關係。

    '
  framework_state: 壓力下感知失守
  note: 頭部靜止度與身體軸線穩定直接連動——頭一動，肩旋轉軸線偏移，划手對齊度下降。多數教練只看「外觀有沒有動」，但實際應該看「加速曲線中何時開始動」。
  evidence:
  - certainty: 🟠
    text: 教練影像觀察—菁英仰式選手在 sub-1:00 100m 配速下頭部位移 <3cm
    source: 通用菁英影像共識
    source_ids:
    - src.elite-video-consensus
- id: back.L5.roll-invariant
  stroke: back
  level: L5
  aspect: 旋轉不隨速縮
  indicator: 仰式精英特徵：速度增加時旋轉幅度維持（≠ 自由式）；划距穩定
  framework_state: 感知自動化過渡
  note: 仰式精英特徵——速度增加時不縮小旋轉幅度（≠ 自由式），是 L5→L6 的關鍵分水嶺。
  evidence:
  - certainty: 🟢
    text: Gonjo 2021
    source: Gonjo 2021
    source_ids:
    - src.gonjo-2021-a
- id: back.L5.start-turn
  stroke: back
  level: L5
  aspect: 出發轉身流線
  indicator: 推蹬後流線型滑行至速度降至游進速度才開始划手；時機感知穩定
  framework_state: 感知自動化過渡
  note: 出發轉身流線型在 100m 佔近 1/3 時間，L4 即需重點介入，不可等到 L5。
  evidence:
  - certainty: 🟢
    text: 流線滑行佔 100m 近 1/3 時間
    source: González-Ravé 2025
    source_ids:
    - src.gonzalez-rave-2025-a
- id: back.L6.stability
  stroke: back
  level: L6
  aspect: 技術穩定性
  indicator: 疲勞後技術與前段差距極小；六拍踢節律全程維持；划距跨速度穩定
  framework_state: 感知自動化完成
  evidence:
  - certainty: 🟢
