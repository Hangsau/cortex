- id: breast.L2.leg-propulsion
  stroke: breast
  level: L2
  aspect: 腿部推進
  indicator: 浮板踢水能穩定前進；翻腳掌時腳掌有水壓感知（非腳心朝後）
  framework_state: 推進感萌芽——腿部
  note: 踝關節柔韌性 > 踢腿力量（文獻一致結論）。感知建立前先確認踝關節能否翻轉到推進位置，否則是硬體問題而非感知問題。
