  indicator: 疲勞全程划距穩定（Gonjo & Olstad 2023 精英特徵）；SWOLF 跨速度差異 < 3
  framework_state: 感知自動化完成
  evidence:
  - certainty: 🟢
    text: 疲勞全程划距穩定是精英特徵
