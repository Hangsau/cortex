  stroke: fly
  level: L4
  aspect: 外划過大
  indicator: 捕水感知不穩時外划幅度代償性增大；前臂感知比手掌感知更弱
  framework_state: 壓力下感知失守
  note: 外划幅度過大常是代償訊號——感知不到前臂水壓 → 靠更大外划「感覺抓到了」 → 實際推進反而下降。
  evidence:
  - certainty: 🟡
    text: Peyrebrune & Turner 2007
    source: Peyrebrune & Turner 2007
    source_ids:
    - src.peyrebrune-2007
- id: fly.L5.two-kick-differentiation
  stroke: fly
  level: L5
  aspect: 兩踢功能分化
  indicator: 能區分第一踢（輕、穩、觸發）和第二踢（強、同步出水）的不同感知
  framework_state: 感知自動化過渡
  note: 兩踢功能分化是蝶式最重要的進階感知——第一踢（輕、觸發）與第二踢（強、同步出水）是不同的感知對象。
  evidence:
  - certainty: 🟡
    text: Mason 1992
    source: Mason 1992
    source_ids:
    - src.mason-1992-a
  - certainty: 🟢
    text: Swim Like A Fish 2025
    source: Swim Like A Fish 2025
    source_ids:
    - src.swim-like-a-fish-2025
- id: fly.L5.glide-elimination
  stroke: fly
  level: L5
  aspect: 滑行相消除
  indicator: '每個 stroke cycle 的「滑行/減速期」幾乎消失——推進力連續銜接、不存在「等」的瞬間。

    L4 訊號是「能感知滑行期但無法消除」；L5 是「在標準訓練配速下能消除」；

    L6 是「比賽配速下也消除」。

    測試：水下高速攝影 + 速度曲線分析。菁英 50/100m 蝶式選手的 IVV

    （週期內速度波動）顯著小於非菁英，主要因為滑行期消失。

    '
  framework_state: 感知自動化過渡
  note: 菁英蝶式的決定性特徵之一是「stroke 之間沒有空檔」——前一個推進相還沒結束，下一個推進相已經開始。這與「划手快」是不同的——划手快但有滑行的選手 IVV 仍大；真菁英是「划手節律 + 滑行消除」雙重特徵。
  evidence:
  - certainty: 🟠
    text: 菁英蝶式 IVV 觀察—Phelps/Milak/Dressel 50/100m 影像分析
    source: 通用菁英影像共識
    source_ids:
    - src.elite-video-consensus
- id: fly.L6.chain-closure
  stroke: fly
  level: L6
  aspect: 波動鏈閉環
  indicator: 每個划手週期從胸到腳感知連貫；疲勞後仍維持兩踢時機；SWOLF 穩定
  framework_state: 感知自動化完成
  evidence:
  - certainty: 🔵
    text: 連動鏈分析整合
    source: ''
- id: breast.pre.resistance
  stroke: breast
  level: pre
  aspect: 阻力感知
  indicator: 靜止漂浮感覺到「緊的身體滑更遠」；能描述阻力存在（非推進）
  framework_state: 感覺阻力（火箭漂）
  note: 蛙式前置感知（火箭漂）核心目的是讓學習者在任何動作之前先感知阻力存在——蛙式特有設計，因為蛙式是四式中阻力最大的泳式。
  evidence:
