errors:
- id: free.err1
  stroke: free
  category: recovery
  title: 高肘回臂是唯一正確方式
  misconception: 許多教練教材將「高肘回臂（High Elbow Recovery）」定為標準，不論選手距離、水域、肩部結構，一律要求高肘。
  physical_reason:
    certainty: 🔵
    text: 回臂功能是「以最少能量將手臂帶回入水位置」。最佳路徑取決於距離、划頻需求、肩部活動度：長距離需省能 → 高肘較優；短距離需高划頻與耦合動作 → 直臂反而能疊加推進力；直臂自然拉高划頻並迫使更大身體旋轉；肩關節柔軟度不足者強制高肘可能製造代償或傷害。
  evidence:
  - certainty: 🟠
    text: 教練過去教導必須高肘回臂、對稱划水，但 Janet Evans 的直臂、Grant Hackett 的單側換氣、 Phelps 與 Ledecky 的不對稱划水都推翻了這個說法。
    source: Scott Bay, USMS Level 5 Coach
    source_ids:
    - src.scott-bay-usms-level-5-coach
    url: https://www.usms.org/fitness-and-training/articles-and-videos/articles/freestyle-demystified
  - certainty: 🟠
    text: 大多數世界級 50 公尺選手使用直臂回臂，因為直臂的耦合動作能增強划水推進力。
    source: Tritonwear
    source_ids:
    - src.tritonwear
    url: https://blog.tritonwear.com/how-to-have-a-flawless-freestyle-swimming-recovery
  cross_ref: 技術分析 §2.1、§3.1（三種風格對應三種回臂策略）
  cross_ref_ids:
  - free.tech.32
  - free.tech.4
  - free.tech.5
  - free.tech.6
  correct_concept: 先評估選手的距離目標、划頻需求、肩部柔軟度，再選擇適合的回臂風格。不存在唯一標準。
  perception_impact: 強制改高肘 → 學員常用肩頸張力「架起」高肘，整條回臂因此僵硬，反而破壞換氣與旋轉的感知流暢度。
- id: free.err2
  stroke: free
  category: recovery
  title: 模仿菁英選手的動作就是正確
  misconception: 教學中播放菁英選手影片，要求學員直接模仿其回臂動作，視「與奧運選手一樣」為技術目標。
  physical_reason:
    certainty: 🔵
    text: 速度與技術細節是「相關」不是「因果」。菁英的速度部分來自技術，部分來自生理條件（肌力、爆發力、肌纖維組成）——後者可以補償甚至掩蓋技術缺陷。
  evidence:
  - certainty: 🟠
    text: 許多人相信最快的選手使用的技術值得模仿，結果產生許多誤解。即使最快的選手也有技術限制，只是用體能彌補了不足。
    source: Rod Havriluk, Swimming Technology Research
    source_ids:
    - src.rod-havriluk-swimming-technology-research
    url: https://chicagobluedolphins.com/article-freestyle-straight-arm-recovery/
  cross_ref: 自由式無唯一最優技術、恢復臂能量光譜
  cross_ref_ids:
  - free.tech.1
  - free.tech.32
  correct_concept: 影片分析要區分：「選手因為這個動作而快」vs「選手雖然有這個動作但還是快」。前者值得學，後者是體能補償，複製只是複製了缺陷。
  perception_impact: 「跟誰一樣」是形式目標，不是感知目標。學員注意力放在外型像不像，感知系統沒有接收到動作帶來的水壓回饋訊號。
- id: free.err3
  stroke: free
  category: recovery
  title: 拉鏈 Drill 代表正確的高肘路徑
  misconception: 拉鏈 drill（拇指沿身體側面往上拉）被廣泛用來訓練高肘回臂，並被教練告知「這就是正確的回臂路徑」。
  physical_reason:
    certainty: 🟠
    text: Drill 是找感覺的工具，不是游泳時的固定路徑。拉鏈 drill 手部軌跡緊貼身體——實際游泳時手部離身體應更寬。用這個 drill 的感覺直接對應到正式游泳，反而是錯誤的遷移。
    observation_basis: 觀察者為兩位公開發表教學文章的教練——Tri Training Harder 的 Coach Alan 與 USMS 的 Matt Donovan （即下方兩則 evidence 的來源），族群為一般成人泳者與 masters。外推邊界：教練文章非控制實驗，未報告樣本、量測方法與效果量；本條只支撐「drill 軌跡不等於游泳軌跡、直接遷移會把手帶太近」這個方向性判讀，不支撐任何寬度數值，也不宜外推到兒童與競技隊的 drill 使用情境。
  evidence:
  - certainty: 🟠
    text: 高肘概念常被 drill 強化錯誤方向；拉鏈 drill 視覺化為手部緊貼身體，容易被誤解為正確游法——但實際手部離身體應更寬。
    source: Coach Alan, Tri Training Harder
    source_ids:
    - src.coach-alan-tri-training-harder
    url: https://tritrainingharder.com/blog/2021/6/blog-is-straight-arm-better-than-high-elbow
  - certainty: 🟠
    text: 應避免拇指拖拉 drill（拉鏈 drill），因為它會讓肘部過度偏高，對肩膀產生極大壓力。
    source: Matt Donovan, USMS
    source_ids:
    - src.matt-donovan-usms
    url: https://www.usms.org/fitness-and-training/articles-and-videos/articles/the-right-and-wrong-time-to-have-high-elbows-on-freestyle
  cross_ref: 恢復臂能量光譜、手入水跨越中線
  cross_ref_ids:
  - free.tech.32
  - free.tech.20
  correct_concept: Drill 是找感覺的工具，需明確說明它在訓練什麼感知，以及與正式游泳的差異。使用前告知目的，使用後確認學員是否誤以為 drill 路徑就是游泳路徑。
  perception_impact: Drill 引導的感知目標若方向錯誤，學員在正式游泳時會「找 drill 的感覺」，反而拉近手臂路徑，製造不必要的側向阻力。
- id: free.err4
  stroke: free
  category: recovery
  title: 直臂回臂是初學者的壞習慣，需要矯正
  misconception: 部分教練見到學員直臂回臂，不問原因直接要求改高肘，視直臂為「需要矯正的錯誤」。
  physical_reason:
    certainty: 🔵
    text: 直臂回臂有其合理適用情境：短距離衝刺（直臂耦合增強推進）、開放水域（手部高於浪面減少阻力）、肩部柔軟度不足（不強迫高肘，減少肩峰下撞擊風險）。
  evidence:
  - certainty: 🟠
    text: 直臂回臂可獲得更高划頻，並在開放水域讓手部高於浪面，也有助於肩膀柔軟度不足的選手。
    source: chilitri.com
    source_ids:
    - src.chilitri-com
    url: https://chilitri.com/blog/karenparnell01@hotmail.com/bent-elbow-vs-straight-arm-recovery-which-is-best-for-you
  - certainty: 🟢
    text: 直臂回臂對肩部影響並非單向：高肘回臂若配合過高的肩膀抬舉，反而可能增加肩峰下撞擊（subacromial impingement）風險。
    source: Biomechanical Considerations in the Competitive Swimmer's Shoulder, PMC3438875
    source_ids:
    - src.pmc3438875
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3438875/
  cross_ref: 恢復臂能量光譜、Shoulder-driven 肩部驅動風格
  cross_ref_ids:
  - free.tech.32
  - free.tech.5
  correct_concept: 先問「這個學員為什麼用直臂？」再決定是否需要調整。直臂回臂不等於錯誤，高肘回臂也不等於安全。
- id: free.err5
  stroke: free
  category: recovery
  title: 回臂動作本身能產生推進力，所以要做得有力
  misconception: 部分教學強調「回臂要快、要有力」，讓學員誤以為回臂動作本身可以直接帶來速度。
  physical_reason:
    certainty: 🔵
    text: 手臂在空中移動不接觸水，無法直接產生推進力。但回臂的加速方式與時機透過「耦合動作」影響水下划手效益：晚期回臂的加速能量在入水瞬間耦合至對側划手末段推力。正確說法是「鬆弛加速、時機準確」，不是「要有力」。
  evidence:
  - certainty: 🟠
    text: 回臂在空中的動作本身不產生推進力；重要的是水下划水。但回臂若做得不好，會消耗不必要的能量，讓水下划水力道下降。
    source: Tri-Coaching
    source_ids:
    - src.tri-coaching
    url: https://tri-coaching.co.uk/2015/04/21/freestyle-recovery/
  cross_ref: 技術分析 §3.1（晚期回臂）
  cross_ref_ids:
  - free.tech.32
  - free.tech.29
  correct_concept: 回臂本身不產生推進力，但回臂的質量（鬆弛度、加速節奏）直接影響水下推進效益。不是「要有力」，而是「鬆弛加速、時機準確」。
  perception_impact: 「用力揮臂」製造全身張力，表層肌肉張力升高後，本體感知對水下划手路徑的精細回饋被覆蓋，學員失去感知水的能力。
- id: free.err6
  stroke: free
  category: entry
  title: 「頭部正前方入水」是標準入水點
  misconception: 許多教學要求「在頭部正前方輕輕滑入水中」，甚至示範手剛超過頭頂就落水。
  physical_reason:
    certainty: 🔵
    text: 水的密度約是空氣的 800 倍，正面阻力遠大於空氣。手臂在空中阻力極小，應讓手臂充分伸展後再入水，而非提早落水製造正面阻力。
  evidence:
  - certainty: 🟠
    text: 應讓手臂充分伸展後再入水，而不是在頭部正上方就落水。
    source: The Race Club — Common Mistakes from the Freestyle Hand Entry
    source_ids:
    - src.the-race-club-freestyle-hand-entry
    url: https://theraceclub.com/aqua_note/common-mistakes-from-the-freestyle-hand-entry/
  - certainty: 🟠
    text: 現代共識：入水點應在肩線延伸前方、手臂接近完全伸展的位置（約肩寬、距頭部 30–45 公分），指尖朝前斜下切入，不跨越中線。
    observation_basis: 作者本人在兒童、青少年競技與成人初學泳課上的入水點指導經驗，以及同一條誤區底下 The Race Club 影像分析所示的方向。所列數字（約肩寬、距頭部 30–45 公分）是教學上拿來對齊的操作範圍，不是量測結果——沒有任何研究測過這個距離。外推邊界：一般教學節奏下的自由式入水指導；競技衝刺配速下入水點會前移，不適用本區間。
  cross_ref: 入水手部位置與小指朝下、手入水跨越中線
  cross_ref_ids:
  - free.tech.27
  - free.tech.20
  correct_concept: 入水點在肩線前方、手臂接近伸展處，指尖朝前斜下切入，不跨中線。
  perception_impact: 入水過短 → 升力相被壓縮，捕水前延伸時間不足，學員無法建立「手伸到水前方、讓水來找手」的感知， L2 延伸感知難以建立。
- id: free.err7
  stroke: free
  category: entry
  title: 入水時手指要「完全夾緊」
  misconception: 教學常要求入水時手指「完全夾緊、不留縫隙」，並且「全程保持夾緊」。
  physical_reason:
    certainty: 🟢
    text: 入水（切入）與抓水（捕水）是兩個不同動作、對應不同手型：入水瞬間手形緊實降低阻力；進入捕水後微微張開至放鬆自然位（約 10° 間距），增大推進面積。全程夾緊會限制抓水有效面積。
    source_ids:
    - src.marinho-2010
    - src.the-race-club-freestyle-hand-entry
  evidence:
  - certainty: 🟢
    text: CFD 分析真實手部模型（2 m/s）：最佳手指間距約 10°（指尖間距約 3.2 mm），與完全夾緊相比阻力係數提升 2–5%、力矩提升 5–8%；最佳間距接近放鬆手的自然姿態。機制是指縫產生噴流，抑制大渦流形成。多篇 CFD 重複確認。
    source: Marinho et al. (2010), Journal of Applied Biomechanics
    source_ids:
    - src.marinho-2010
    url: https://pubmed.ncbi.nlm.nih.gov/20147761/
  - certainty: 🟢
    text: 入水瞬間手指與拇指應緊合像刀片劃入；進入抓水後手指應略微張開以增大受力面積。
    source: The Race Club — Common Mistakes from the Freestyle Hand Entry
    source_ids:
    - src.the-race-club-freestyle-hand-entry
    url: https://theraceclub.com/aqua_note/common-mistakes-from-the-freestyle-hand-entry/
  cross_ref: 划水時手指微張製造紊流、入水手部位置與小指朝下
  cross_ref_ids:
  - free.tech.28
  - free.tech.27
  correct_concept: 入水瞬間指尖領先、手形緊實；進入捕水後微微張開至約 10° 自然位。只教「全程夾緊」會限制抓水面積。
  perception_impact: 手指感知是手感發展的核心。完全夾緊 → 手掌變「硬板」，失去對水流分布的感知細節；略微張開後才能感知「水填滿指縫的壓力」，這是重要的感知訊號入口。
- id: free.err8
  stroke: free
  category: entry
  title: 「掌心朝下平入水」是唯一正確角度
  misconception: 傳統教學幾乎一律要求掌心朝下（palm down）入水，視其為「乾淨入水」的標準。
  physical_reason:
    certainty: 🔵
    text: 入水角度受回臂方式、身體旋轉幅度、個人腕部活動度共同決定。直臂回臂選手入水時手腕通常需要更多屈曲才能讓指尖先入水；強制掌心朝下反而製造入水阻力或手腕代償。
  evidence:
  - certainty: 🟠
    text: 一種手型適合所有人是不存在的（原文用語是「One size fits none!」）。直臂回臂需要比屈臂回臂更多的腕部屈曲才能讓指尖先入水，而傷病史也會改變可用的腕部角度範圍。使用邊界：這是 Swimming World 的技術專欄論述，非對照實驗；原文全篇談自由式，不可外推到其他泳式。
    source: 'Mullen, G. J. (2011). Science of Performance: Hand Entry. Swimming World.'
    source_ids:
    - src.mullen-2011-swimmingworld-hand-entry
    url: https://www.swimmingworldmagazine.com/news/science-of-performance-hand-entry/
  cross_ref: 入水手部位置與小指朝下、手掌在水中朝哪裡，不能反推前臂旋前或旋後
  cross_ref_ids:
  - free.tech.27
  - free.tech.37
  correct_concept: 目標是「指尖領先、乾淨切入」，達成此目標的腕部角度因回臂方式與個人解剖條件而異，不能硬套單一標準。
- id: free.err9
  stroke: free
  category: entry
  title: 入水要「越安靜越好」
  misconception: 教學常強調「安靜入水、不能有水花」，讓學員過度謹慎地「放」手進水，而非積極向前伸刺。
  physical_reason:
    certainty: 🟠
    text: 過度追求安靜 → 入水動作變被動、位置過短、姿勢消極，失去晚期回臂的加速能量轉移。「安靜」是乾淨切入的副產品，不是追求目標。
    observation_basis: 觀察者為 YourSwimLog（教練型泳訊網站，即下方 evidence 的來源），族群為競技與進階泳者。外推邊界：教學文章的經驗歸納，未報告量測；「安靜是副產品而非目標」屬教學價值判斷，不是可量化的因果宣稱。初學者階段仍可能需要先用「安靜」當入水品質的粗略檢查，本條不否定該用法，只否定把它當成終點目標。
  evidence:
  - certainty: 🟠
    text: 正確做法是積極「攻擊水面」，將手向前推刺。15 次奧運冠軍教練 Eddie Reese：「我們教的是『伸手觸牆』的概念。」
    source: YourSwimLog
    source_ids:
    - src.yourswimlog-a
    url: https://www.yourswimlog.com/how-to-improve-freestyle-hand-entry/
  cross_ref: 入水手部位置與小指朝下、手部砸水強度 = 肩旋轉速度
  cross_ref_ids:
  - free.tech.27
  - free.tech.29
  correct_concept: 目標是「指尖領先、積極前伸切入」。以「安靜」為目標會減慢手臂在空中的最後加速，削減耦合的能量轉移。
  perception_impact: 「輕輕放入」製造消極的入水感知，學員把「沒有感覺」當成正確訊號。正確積極入水後應能感受到指尖切入水面的「劈」感，這是重要的本體回饋起點。
- id: free.err10
  stroke: free
  category: pull
  title: S 形划水路徑是高效划水的目標
  misconception: 過去教學（1960–1990 年代普遍）要求選手手部在水下走「S 形路徑」，視為高效划水的標準動作。
  physical_reason:
    certainty: 🔵
    text: S 形划水的每次方向改變都意味手部需加速、減速、再加速，每次減速都是推進力損失。手掌相對身體走接近直線的後向推進才最有效率。水下看到的 S 形是身體轉體造成的視覺錯覺，不是手部刻意繞 S。
  evidence:
  - certainty: 🟡
    text: S 形路徑由 James "Doc" Counsilman 在《The Science of Swimming》（1968）依水下攝影觀察提出。
    source: 歷史背景
    source_ids:
    - src.historical-background-unattributed
  - certainty: 🟢
    text: 高速影像顯示菁英選手手部路徑相當直線；過去看到的 S 形是身體轉體造成的視覺錯覺。
    source: Rocketswim
    source_ids:
    - src.rocketswim
    url: https://rocketswim.com/four-phases-of-freestyle-arm-stroke/
  cross_ref: 技術分析 §3.1（後象限推進）
  cross_ref_ids:
  - free.tech.7
  correct_concept: 水下划手目標是「手掌向後加速、維持路徑穩定」，S 形是轉體副產品，不應刻意訓練。
  perception_impact: 「刻意繞 S」讓學員注意力放在路徑形狀（視覺/空間目標），無法聚焦在「手掌對水壓力的連續感知」。路徑形狀是外部視角描述，感知系統不以路徑形狀為輸入。
- id: free.err11
  stroke: free
  category: kick
  title: 用力踢水才能快——力量優先於柔韌性
  misconception: 「腿要踢有力、踢得快」是最普遍的踢水指令之一，但忽略了踢水效率的硬體前提：踝關節蹠屈幅度。
  physical_reason:
    certainty: 🔵
    text: 踝關節蹠屈幅度會改變腳部推進面的方向；蹠屈受限時，單純增加踢水力量未必能轉化為有效推進。 McCullough 研究顯示蹠屈與 flutter-kick 速度相關、垂直跳力量則未呈顯著相關，但這不足以證明柔軟度訓練必然優於力量訓練，應先評估個別限制再選介入。
  evidence:
  - certainty: 🟡
    text: 20 名女性競技／休閒泳者中，踝蹠屈與 flutter-kick 速度呈中度相關（r=0.509）；垂直跳力量未呈顯著相關。這是相關研究，沒有測試陸上柔軟度訓練，也沒有分析跑步背景或倒退力。
    source: McCullough et al. 2009, J. Strength & Conditioning Research
    source_ids:
    - src.mccullough-2009-a
    url: https://pubmed.ncbi.nlm.nih.gov/19855342/
  cross_ref: 踝關節柔韌性
  cross_ref_ids:
  - free.tech.13
  correct_concept: 踝關節柔韌性訓練優先於力量。跑步背景選手需先評估蹠屈幅度確認硬體邊界，再決定踢水訓練方向。
  perception_impact: 踝僵硬選手腳掌從未建立「後方推水」的感覺——因為腳掌實際從未朝後過。這無法靠感知訓練解決，是硬體邊界，必須先做柔韌性改善。
- id: free.err12
  stroke: free
  category: kick
  title: 六拍踢是正確標準，兩拍是偷懶或技術不好
  misconception: 許多教練把六拍踢當「正確」節奏，見到兩拍踢直覺判斷為偷懶或技術不成熟，要求一律改六拍。
  physical_reason:
    certainty: 🔵
    text: 六拍踢（高代謝、連續推進+填補划手空窗，適合 100m 以下衝刺）與兩拍踢（低代謝、維持旋轉節律+ 平衡穩定，適合 400m 以上長距離）的協調邏輯與適用情境不同——是距離策略的客觀反映，不是技術高低。兩拍同側踢與六拍對側踢相反，但服務不同旋轉需求。
  evidence:
  - certainty: 🟠
    observation_basis: 本檔沒有記錄觀察者：這條原本掛的來源就是「教練觀測」四個字，既無人名也無機構， 2026-09-05 檢視時判定為無法回溯的佔位來源，已移除。族群是精英長距離自由式選手。外推邊界：踢腿拍數是比賽畫面數得出來的，「六拍在低划頻下製造不必要腿部疲勞」則是對這個選擇所做的解釋，沒有對應的代謝或肌電量測；也不能倒過來要求長距離訓練者改用兩拍。
    text: Hip-driven 風格（長距離）自然發展兩拍踢，因六拍在低划頻下製造不必要腿部疲勞。精英長距離大多用兩拍或四拍，不是六拍。
  cross_ref: 技術分析 §肆（踢水機制）
  cross_ref_ids:
  - free.tech.11
  - free.tech.12
  correct_concept: 踢水節奏由距離、划頻、腿部耐力共同決定。強制六拍可能讓長距離選手後段腿部提前疲勞，破壞整體效率。
  perception_impact: 強制六拍的長距離選手，腿部能量在中段已大量消耗，後段節律錨點崩潰，換氣時機和划手節奏同步失守。踢水節奏是整個划手週期的節律框架。
- id: free.err13
  stroke: free
  category: kick
  title: 「用腰帶腿踢」——踢水要從腰開始（鎖死膝蓋）
  misconception: 「踢水要從腰帶動、不是靠膝蓋彎曲」常被過度執行，導致選手完全鎖住膝蓋，反而失去踝關節的加速能量。
  physical_reason:
    certainty: 🔵
    text: 有效踢水需三環節連動：髖關節發力 → 膝蓋有控制地彎曲（下踢峰值約 55–75°）→ 踝關節鞭打加速。「從腰帶動」解決環節 1，但若被解讀為「膝蓋不能動」，環節 2 消失、環節 3 無法加速，踢水變成整條腿擺動，效率大幅下降。
  evidence:
  - certainty: 🟠
    text: bicycle kick 的問題在膝蓋彎曲過大且主導踢水（膝先動、髖後動），而非膝蓋彎曲本身。最佳膝蓋彎曲角度 55–75°（下踢峰值），低於 55° 推進不足，超過 75° 進入 bicycle kick。
    source: The Race Club — Getting the Freestyle Kick Right
    source_ids:
    - src.the-race-club-freestyle-kick-knee-bend
  cross_ref: 教練說的「膝蓋鎖死」與教科書的 knee locking 意思相反、踝關節柔韌性
  cross_ref_ids:
  - free.tech.41
  - free.tech.13
  correct_concept: 根本是發力序列：髖帶膝、膝帶踝、踝完成鞭打。「用腰帶腿」修正的是發力起點，不應解讀為消除膝蓋動作。推薦夾板踢水隔離腿部，感知髖-膝-踝連動。
  perception_impact: 膝蓋鎖死的選手踝關節無法完成末端加速，踢水是「腿部整體推」而非「踝關節掃過水」。有鞭打感的踢水在踝末端可感受水壓劇烈變化；鎖膝版本沒有這個峰值，感覺「平滑但沒有力量感」。
- id: free.err14
  stroke: free
  category: kick
  title: 腳踝僵硬是先天條件，無法改善
  misconception: 部分教練診斷踝僵硬後告知「你的踝關節先天比較硬，踢水不會好」，或跳過踝訓練改強調用上半身彌補。
  physical_reason:
    certainty: 🔵
    text: 踝關節蹠屈柔韌性後天可改善，而柔韌性的改善與游速的改善之間有時間差：角度先動，成績後動。「先天不可改」的判斷常來自短期介入未見速度提升後的誤判——量錯了對象，不是結論成立。
  evidence:
  - certainty: 🔴
    text: 原記錄在此掛了一組「6 週介入、柔韌性 p=0.0008、25m 踢板 p=0.40」的數字，並掛在 McCullough 2009 名下。 McCullough 2009 是 20 名女性泳者的橫斷相關研究、沒有做任何柔軟度介入，**不可能是這組數字的出處**；該研究本身也只支持「蹠屈與踢腿速度相關（r=0.509）」，不支持任何介入效果。這組介入數字目前定位不到原始研究，已從上方機制敘述中移除，本行保留為待查紀錄。
  cross_ref: 踝關節柔韌性
  cross_ref_ids:
  - free.tech.13
  correct_concept: 踝柔韌性是可訓練的硬體條件，不是不可改變的先天限制。診斷僵硬後應設計踝專項訓練，同時在水中用適合目前範圍的踢水訓練。只告知「天生腳踝硬」而不提供改善方案，是診斷與教學流程的雙重失職。
  perception_impact: 改善過程中選手會逐漸出現「腳掌開始感受到水壓的新感覺」。需教練明確告知「這個新水壓感就是踢水開始有效的信號」，否則可能誤判為「踢法改變了，感覺怪怪的」。
- id: free.err15
  stroke: free
  category: rotation
  title: 主動轉髖是自由式旋轉的正確指令
  misconception: 「游自由式要用髖帶動手臂」「轉髖才能讓划水更有力」混淆了因果方向，在短距離或高划頻情境反而造成代償。
  physical_reason:
    certainty: 🔵
    text: 旋轉的正確因果鏈：推水末段 → 肩胛肌群收縮（菱形肌後縮肩胛骨）→ 啟動對側身體滾轉 → 髖部被動跟隨。髖部是被動跟隨者，不是發動者。短距離（高划頻）刻意主動轉髖 → 時機錯亂+額外能耗；「用髖帶動划手」在長距離和短距離效果方向相反。
  evidence:
  - certainty: 🟡
    text: 推水末段肩胛肌群（菱形肌）是旋轉的主動發動肌，髖部被動跟隨。「把肩膀教好，髖部自然跟著動。」
    source: Pink et al. (1991) EMG；Science of Swimming Faster (Riewald & Rodeo 2015)
    source_ids:
    - src.pink
  cross_ref: 技術分析 §伍（身體旋轉）
  cross_ref_ids:
  - free.tech.15
  correct_concept: 旋轉的感知目標是肩胛骨的動作，不是髖部旋轉。指導語應從「轉髖」改為「推水末段感覺肩胛骨往脊椎縮」。
  perception_impact: 「主動轉髖」的感知是腰椎扭轉感，與肩胛骨收縮感完全不同。建立「轉腰=正確旋轉」後，注意力永遠在腰部而非肩胛骨，旋轉的耦合質量難以被精確感知和調整。
- id: free.err16
  stroke: free
  category: rotation
  title: 旋轉幅度越大越好——「把肩膀打開」指令
  misconception: 「肩膀要打開到 90 度」「旋轉越多越好，增加拉力臂」混淆了長距離與短距離策略，在高划頻下幾何上不可能。
  physical_reason:
    certainty: 🔵
    text: 划頻越高，每一次旋轉可用的時間窗口越短，能完成的髖旋轉幅度就越受限——這是時間限制，不是選擇。而幅度本身超過某點後邊際效益為負：側面投影面積增加（阻力上升）、推進方向偏移、旋轉速度峰值與推力峰值不再對齊。旋轉的價值在時機對齊，不在幅度。（具體角度見下方實測，本段不自帶數字）
  evidence:
  - certainty: 🟢
    text: 衝刺配速下變小的是**髖旋轉**（36.8° 對 400 公尺配速的 49.9°），**肩旋轉並沒有跟著變小** （97.7° 對 101.6°）。兩者不同步的結果是軀幹扭轉範圍在衝刺時反而**更大**（78.1° 對 61.3°），角速度也全面更高。所以「短距離就是轉得少」是把髖的變化說成全身的變化——短距離真正的差別是上下軀幹解耦得更多，不是整體旋轉幅度縮小。（Andersen 等人 2020，13 名菁英自由式選手）
    source: Andersen JT, Sinclair PJ, McCabe CB, Sanders RH. (2020). J Strength Cond Res 34(1):20-25
    source_ids:
    - src.andersen-2020
    url: https://pubmed.ncbi.nlm.nih.gov/31567840/
  cross_ref: Hip-driven 髖部驅動風格、Shoulder-driven 肩部驅動風格、脊椎節間旋轉與 body roll 是兩種量
  cross_ref_ids:
  - free.tech.4
  - free.tech.5
  - free.tech.39
  correct_concept: 旋轉幅度目標是「讓划手推力峰值和旋轉速度峰值對齊」，不是越大越好。要分開看肩與髖：實測顯示提速時**髖旋轉收小、肩旋轉維持**，兩者的差（軀幹扭轉）反而變大。所以「把肩打開」在兩種距離都不是要壓抑的東西，該被檢查的是髖有沒有跟著肩一起過度轉。先確認目標距離和划頻，再分層看。
  perception_impact: 追求旋轉幅度的選手感知目標是「轉多遠」（空間/位置感知），不是「旋轉時機是否讓推水感覺更強」（水壓感知）。這是耦合感知能否建立的關鍵分岔點。
- id: free.err17
  stroke: free
  category: rotation
  title: 「積極轉體，旋轉越快游越快」
  misconception: 「要積極轉體，旋轉帶動划手才有力」把旋轉定位為速度的主動來源，但旋轉本身不接觸水，無法直接產生推進力。
  physical_reason:
    certainty: 🔵
    text: 身體旋轉發生在空氣與水的介面，旋轉動作本身不接觸水（手臂在回臂，不在拉水），因此旋轉本身不產生推進力。旋轉的作用是透過耦合——旋轉速度峰值與划手推力峰值在時間上對齊時能量疊加。旋轉是放大器，不是引擎。沒有時機對齊的旋轉 = 零耦合貢獻 + 額外阻力。
  evidence:
  - certainty: 🟠
    text: 壓力計加陀螺儀讓身體與手臂的旋轉角速度可以和划手推力**同時**量到，因此時機好不好第一次變成看得見的東西；四式都要靠耦合動作與推進的時機對齊才游得快。原文停在這裡——它證明時機可被量測、且時機重要，沒有給出「窗口幾毫秒」或「窗口外增益為零」這種量化門檻，那部分是本條上方 mechanism 的推導，不是量測結果。
    source: The Race Club — Update on Race Club Sensors
    source_ids:
    - src.the-race-club-sensors-update
  cross_ref: 技術分析 §伍（Coupling 能量）
  cross_ref_ids:
  - free.tech.16
  - free.tech.29
  correct_concept: 正確問題不是「旋轉多不多」，而是「旋轉速度峰值有沒有和推力峰值對齊」。沒有時機的大幅旋轉，效果不如時機精準的小幅旋轉。
  perception_impact: 「積極旋轉」容易觸發全身張力升高（核心和腰部同時收緊），手部對水壓的細緻感知被覆蓋。結果是選手一邊積極旋轉一邊失去感知划手是否有效的能力，耦合品質無法被感知調整。
- id: free.err18
  stroke: free
  category: head
  title: 換氣時眼睛要「看到天花板」
  misconception: 「換氣時眼睛要看天花板」「臉要完全轉出水面才能吸到夠的空氣」透過頭部過度旋轉來解決換氣，代價比直覺大。
  physical_reason:
    certainty: 🔵
    text: 頭部過度旋轉的連鎖代價：頸部肌肉張力升高 → 旋轉連動鏈被打斷 → 換氣側手臂入水位置偏移（常見跨中線） → 重心偏移 → 下半身補償 → 節律干擾。精英是「寄生換氣」：頭部搭身體旋轉的便車，嘴巴轉進弓形波凹陷吸氣，而非主動把頭轉出水面。
  evidence:
  - certainty: 🟠
    text: 換氣時讓一邊的護目鏡、一隻耳朵、一邊臉頰留在水裡——這是「最小旋轉換氣」可以當場自己檢查的外部指標。只露出半張嘴看起來不夠，實際上比想像的多，足以吸到氣，不需看天花板。
    source: The Race Club — 3 Breathing Tips for Freestyle Swimming
    source_ids:
    - src.the-race-club-3-breathing-tips
  cross_ref: 技術分析 §陸（頭部位置與弓形波）
  cross_ref_ids:
  - free.tech.17
  - free.tech.18
  correct_concept: 換氣目標是「最小旋轉、讓嘴巴進入弓形波凹陷」。感知替代目標：「換氣時，另一側護目鏡還有一半在水裡。」
  perception_impact: 頭部過度旋轉製造大量頸部張力，每次換氣都是一次全身感知的部分中斷。換氣週期和非換氣週期的划手品質明顯不一致 → 換氣成為技術崩潰的觸發點而不是中性事件。
- id: free.err19
  stroke: free
  category: head
  title: 換氣時前方手臂要「等在那裡」——catch-up 換氣
  misconception: 「換氣時另一隻手先在前方等著，等你吸完氣再一起划」製造人為的划手暫停，讓呼吸從「寄生在旋轉中」變成「打斷旋轉節律」。
  physical_reason:
    certainty: 🔵
    text: 呼吸最優是「寄生模式」：頭部搭身體已在進行的旋轉便車，借用但不延長。停留手臂的問題：一側手臂水中停留 → 升力相拉長（消耗能量不推進）→ 划頻下降 → 旋轉動量被打斷，下一次旋轉需重新啟動。
  evidence:
  - certainty: 🟠
    observation_basis: 本檔沒有記錄觀察者：這條原本掛的來源就是「教練觀測」四個字，既無人名也無機構， 2026-09-05 檢視時判定為無法回溯的佔位來源，已移除。族群是精英自由式選手。外推邊界：「划手節律不因換氣而改變」是從畫面上的划頻判讀得出來的；換氣當下頭頸怎麼動、借了多少旋轉，轉播視角看不出來，本專案也沒有量測。此條不含初學者——初學者的問題多半在還沒有穩定的旋轉節律可搭，不是搭得好不好。
    text: 精英不是為換氣而停等手臂，而是找到旋轉節律中換氣自然契合的時間窗口塞進去，不改變划手節律。
  cross_ref: 頭部基礎位置與弓形波換氣、六階段划手週期
  cross_ref_ids:
  - free.tech.17
  - free.tech.8
  correct_concept: 換氣不應讓划手節律停等它。讓嘴巴在旋轉瞬間進入弓形波凹陷，吸氣後立刻回位，整個換氣發生在旋轉的正常弧度裡。換氣是「找到身體自然給出空間的瞬間」，不是「要求身體停下來等你」。
  perception_impact: 停等手臂製造划手週期裡的感知空白段——那段時間手臂被動停留，沒有推進方向的水壓感知。習慣後換氣週期和非換氣週期的節律感知差異越來越大，技術崩潰時換氣週期第一個失守。
- id: free.err20
  stroke: free
  category: tempo
  title: 衝刺要「划快一點」——划頻越高越快
  misconception: 比賽後半或衝刺時本能反應是「划快一點」提高划頻。在精英以下層次有一定效果，但在高水準和長距離情境下可能適得其反。
  physical_reason:
    certainty: 🔵
    text: 速度 = SR × SL。SR 提高而 SL 不下降時速度才增加。但 SR 提高 → 每次划手時間窗口縮短 → 捕水品質下降 → SL 容易下降。若 SL 同幅下降則速度不變但能耗增加；若 SL 下降更多則速度反而降低。精英優勢是「在高 SR 下維持 SL 不下降」的技術穩定性，不是更高的 SR。
  evidence:
  - certainty: 🟢
    text: 50m 中 SL 是主要速度決定因子；SR 在男子 50m 中甚至與速度呈負相關。精英金牌優勢在「高 SR 下維持 SL」，而非更高的 SR。
    source: Staunton et al. (2025), Frontiers in Sports and Active Living
    source_ids:
    - src.staunton-2025-b
  cross_ref: 技術分析 §柒（划頻 vs 划距）
  cross_ref_ids:
  - free.tech.3
  - free.tech.19
  - free.tech.24
  correct_concept: 衝刺感知目標不是「划快一點」，而是「確認每次划手還有水感」。若 SL 已在下降，繼續提高 SR 只會加速技術崩潰。疲勞監測最佳信號是 SL 變化，不是主觀的快/慢。
  perception_impact: 「衝刺靠划頻」的訓練模式讓選手在高速時習慣放棄感知監測、改用「努力划」模式，高速下的 feedforward 建立在錯誤技術模式上。速度越高，感知越差，技術崩潰越早。
- id: free.err21
  stroke: free
  category: tempo
  title: 「手伸遠一點」——在水中主動向前延伸增加划距
  misconception: 「手在水裡要繼續向前伸」「延伸讓你划得更遠」想解決真實問題（提升 SL），但方向弄反了——在水中主動向前推手反而讓手臂失去捕水位置。
  physical_reason:
    certainty: 🔵
    text: 手在水中「主動向前推」：向前的肌肉收縮 → 手臂緩慢向前下方移動（不是靜止在最佳捕水位置）→ 選手感知是「在延伸」，實際正在下沉到更深更前的地方 → 捕水效率降低，SL 反而下降。真正的延伸距離來自旋轉把肩膀送出去，手臂搭便車到達更遠位置。
  evidence:
  - certainty: 🟠
    observation_basis: 本檔沒有記錄觀察者：這條原本掛的來源就是「教練觀測」四個字，既無人名也無機構， 2026-09-05 檢視時判定為無法回溯的佔位來源，已移除。族群是精英自由式選手（水下畫面判讀）。外推邊界：「滑幾寸」是定性描述不是量測值，不得當成可執行的距離劑量；「主動推會讓 SL 下降」是對機制的解釋，本專案沒有對應的划距量測。
    text: 入水後讓慣性帶手繼續向前滑幾寸，然後立刻轉入捕水——不是主動推水延伸。延伸和捕水之間沒有「主動向前推」這個動作。
  cross_ref: 技術分析 §參（六階段划手週期 ①升力相）
  cross_ref_ids:
  - free.tech.8
  - free.tech.9
  correct_concept: 增加 SL 的正確方向是提升捕水品質，而非延長手臂在水中的前進距離。「伸得更遠」應是「感覺肩膀被旋轉送得更遠」，而不是「手臂在水中繼續往前推」。
  perception_impact: 「主動向前推水」建立錯誤的 L2 水感：把「向前推動水」當成延伸訊號。這與 L3 捕水感知（水壓作用在手掌後方）方向完全相反，前者一旦固化，L3 的建立會因感知方向衝突而受阻。
- id: free.err22
  stroke: free
  category: tempo
  title: SR 和 SL 必然互相取捨，要選一個方向訓練
  misconception: 「你划頻快但划距短，這是你的風格，各有優劣」把 SR-SL 的負相關當成物理定律，並以此放棄對弱項的訓練。
  physical_reason:
    certainty: 🔵
    text: SR-SL 的負相關是技術限制的外在表現，不是物理定律：技術足夠時 SR 提高 SL 可維持甚至提升——這正是精英訓練的目標。兩者並非風格差異，而是「技術是否能在高划頻下維持捕水效率」的反映。
  evidence:
  - certainty: 🟢
    text: 精英金牌相對於一般精英的優勢正在於「高 SR 下維持 SL 不下降」——兩者不是取捨，是同時最大化的目標。
    source: Staunton et al. (2025)
    source_ids:
    - src.staunton-2025-a
  cross_ref: SR–SL 動態關係、划手週期 timing、划頻是神經生理指標，划距是技術效率指標
  cross_ref_ids:
  - free.tech.3
  - free.tech.35
  - free.tech.19
  correct_concept: SR 與 SL 都要訓練但目標不同：SR 訓練神經快速徵召；SL 訓練在高 SR 下維持捕水效率和阻力控制。問題不是「選哪個」，而是「目前 SR 壓力下 SL 下降的原因是技術問題還是生理條件問題」。
  perception_impact: 相信「必然取捨」的選手在划距縮短時不會嘗試找回捕水的感知質量，而是接受它。這讓捕水感知不精確被「風格差異」的標籤永久掩蓋，無法被識別和改善。
- id: free.err23
  stroke: free
  category: tempo
  title: 「慢游練技術、快游練體能」——速度是訓練分界線
  misconception: 「慢游注意技術、快游全力衝」幾乎普遍。它描述層次錯了——用速度作分界掩蓋了真正的判斷標準，並製造有害副作用：選手在速度稍快時自動關閉技術監測。
  physical_reason:
    certainty: 🔵
    text: 速度不是關鍵變項，真正的分界是「不崩速度」——在這個速度下技術不崩潰（疲勞時低、新鮮時高）。在不崩速度以下游 → 有效技術刺激；超過 → 強化崩潰下的動作模式。技術崩潰有兩種：能量系統崩潰 vs 神經肌肉協調崩潰，兩者訓練介入方向完全不同。長距離後段崩潰更可能是神經肌肉協調崩潰。
  evidence:
  - certainty: 🟡
    text: Craig 與 Pendergast（1979）在四式都量到同一件事：提高游速靠的是提高划頻並降低每划距離，而且各式的換法不同（蝶式的加速幾乎全來自划頻，蛙式的每划距離掉得最多）。換句話說，慢游時的划水參數本來就不等於比賽速度下的划水參數。這是運動學證據——它撐得起「慢游練的東西和快游不是同一組參數」，撐不起「慢速習得的神經模式無法遷移」，後者是外推，沒有量測支持。
    source: Craig, A. B., Jr., & Pendergast, D. R. (1979). Relationships of stroke rate, distance per stroke, and velocity in competitive swimming. Medicine and Science in Sports, 11(3), 278–283.
    source_ids:
    - src.craig-pendergast-1979-stroke-rate-distance-velocity
  - certainty: 🟢
    text: Rushall 的 USRPT 把上面這件事推到訓練設計上：既然技術隨游速而變，就該盡量在比賽配速下練習。那是他的主張與理由，不是已驗證的結論——Nugent 等（2019）的系統性回顧檢索 1347 篇、全文評估 15 篇後全數排除，因為沒有一篇的介入措施真的是 USRPT，結論是 USRPT 目前並未建立在同行評審文獻上。同一份回顧也指出 USRPT 反對分解式 drill 這一點同樣缺乏證據。本庫是 drill 密集的系統，引用它時不能只取對自己有利的那一半。
    source: 'Rushall, B. S. (2016). USRPT defined (Version 1.2). Swimming Science Bulletin, 49；Nugent, F., Comyns, T., Kearney, P., & Warrington, G. (2019). Ultra-short race-pace training (USRPT) in swimming: Current perspectives. Open Access Journal of Sports Medicine, 10, 133–144.'
    source_ids:
    - src.rushall-2016-usrpt-defined-bulletin-49
    - src.nugent-2019-usrpt-systematic-review
  cross_ref: 疲勞崩潰序列、水感的本質
  cross_ref_ids:
  - free.tech.24
  - free.tech.25
  correct_concept: 訓練分界不是速度，而是「技術是否崩潰」。Drill 可加速度要求（只要技術不崩）；計時游也可是技術訓練（只要在不崩速度內）。教練核心是找到每個選手在每個階段的「不崩速度」，在那個邊界設計訓練。
  perception_impact: 「快游不用管技術」讓選手在速度稍高時自動關閉感知監測，高速下的神經動作模式和低速完全不同， feedforward 在高速下沒被正確建立。精英的標誌之一是「比賽速度和訓練速度下感知監測品質相同」。
- id: free.err24
  stroke: free
  category: pull
  title: 拉水朝肚臍方向斜拉——常見「拉到肚臍」口令造成跨越中線
  misconception: 常見教練口令「拉到肚臍」「拉水朝身體中線」要求泳者把手往肚臍方向斜拉，立意是強化拉水推進向後。但實際是把推進方向偏離游進方向、強迫肩部內旋撞擊位、推進力分散到橫向。
  physical_reason:
    certainty: 🔵
    text: 有效推進方向是與游進方向相反——手要直接往後推。朝肚臍方向斜拉等於推進向量同時有「往後」和「橫向往內」兩個分量，橫向分量造成身體左右搖晃（snake-like wiggle）、推進力浪費。「拉到肚臍」常被誤解的根源：過去的 S 形划水理論說手要走 S 路徑，但 S 路徑指的是手在水中**相對水流**的軌跡（因為水也在動），不是手相對身體的軌跡。教練把「手相對身體的軌跡」誤解成 S 形了。（2026-09-06 由 🟢 改標 🔵，並刪掉一句幻影引用：原文寫「現代研究確認菁英自由式選手手部軌跡是相對直線的後推（Gonjo 2020 個體差異研究的核心發現之一）」，但那篇研究不存在——Gonjo 等人 2020 那篇量的是肩髖滾轉角與各相位時長，沒有量手部軌跡，也沒有做個體差異分析。刪掉它之後這一段仍然成立，因為向量分解本來就不需要文獻背書。）
  correct_concept: 拉水方向感目標是「手掌持續朝後、推進方向與游進方向相反」。手相對身體的位置可以略有自然弧度（這是關節角度限制造成的自然軌跡），但不應主動朝肚臍斜拉。
  perception_impact: 「拉到肚臍」口令把感知焦點放在「我手有沒有到肚臍」的位置監控，錯失了「手掌推進方向是否與游進方向相反」這個更重要的感知目標。
  cross_ref: free.tech.7（S 形划水歷史錯誤）、back.err2（仰式同樣誤區）
  cross_ref_ids:
  - free.tech.7
  - back.err2
- id: free.err25
  stroke: free
  category: pull
  title: 拉水越深推進越多——忽略「越深 = 越大阻力」的代價
  misconception: 部分教練教「拉水越深，能抓到的水越多，推進就越多」，立意是強化手部抓水深度。但忽略了「深拉水必然造成上臂偏離游進方向」，導致正面阻力暴增（free.tech.9 已說明上臂是阻力最大部位）。
  physical_reason:
    certainty: 🔵
    text: 深拉水時手部在深處，但上臂從肩膀往下伸的過程中**必然偏離游進方向**——上臂的截面積（圓形）是身體最大的部位之一，偏離游進方向時其正面阻力與深度成正比增加。所以「深拉水多推進」是局部真相（深處水體積大），但忽略了整體代價（上臂正面阻力暴增）——淨效果常是負的。 EVF（high elbow）的整個物理目標就是「把上臂藏在游進方向裡」，代價是放棄深拉水的局部推進，換取上臂阻力的大幅降低。（2026-09-06 由 🟢 改標 🔵：這一整段是幾何與流體阻力的推導，原本掛的來源是「Race Club PDM；通用菁英研究」——一個指不到文件的字串，掛著它反而讓一段自己站得住的推導看起來需要文獻背書。）
  correct_concept: 拉水深度應該以「肘部高於手腕、手腕高於指尖」的相對位置維持，絕對深度依個人條件（衝刺可較深、長距較淺），但不應追求「越深越好」。 EVF 的核心是維持上臂貼游進方向，不是手部抓深。
  perception_impact: 「越深越多」口令把感知焦點放在「手能伸多深」的深度監控，錯失了「上臂截面積朝向哪裡」這個更關鍵的阻力感知。
  cross_ref: free.tech.9（EVF 核心物理）、back.err3（仰式對應誤區）
  cross_ref_ids:
  - free.tech.9
  - back.err3
- id: back.err1
  stroke: back
  category: rotation
  title: 仰式要躺平，旋轉是不穩定的信號
  misconception: 許多教練為修正初學者「過度扭腰」，改用全面壓制旋轉的指令：「游仰式要躺平，不要扭來扭去。」結果是把矯正過度旋轉的口令，變成一條消滅正常旋轉的指令。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.gonjo-2020-upper-body-kinematics
    - src.gonjo-2021-body-roll
    text: 競技男性泳者的仰式最大肩滾轉平均 49.73 ± 5.73°（Gonjo 等人 2020，十名男性競技泳者，最大速度），也就是說「幾十度的滾轉」是這個族群的常態，不是個別選手的怪癖。旋轉使背闊肌進入最佳收縮起始長度，是仰式推進力的核心機制之一（🔵 肌肉最適預拉原理）。 Gonjo 等人 2021 進一步在四種強度下量：自由式的滾轉幅度隨強度上升而全面縮小，仰式則維持——所以「衝刺縮小旋轉提高划頻」的策略在仰式不適用。
  evidence:
  - certainty: 🟢
    text: 三維運動學實測：十名男性競技泳者的仰式最大肩滾轉平均 49.73 ± 5.73°、最大髖滾轉 39.83 ± 7.25°。受試者是 competitive 不是 elite，本條不寫「精英」。
    source: Gonjo et al. (2020)
    source_ids:
    - src.gonjo-2020-upper-body-kinematics
  - certainty: 🟢
    text: 四種強度（最大速度的 83–100%）下，自由式的全身滾轉、肩滾轉、髖滾轉幅度全部隨強度縮小，仰式則維持不變；速度增加不應成為縮小旋轉的理由。原文有一個限制常被略過：浮力矩造成的那一部分滾轉（WBRBT）在仰式也是顯著縮小的，所以「仰式旋轉完全不受速度影響」講得太滿。
    source: Gonjo et al. (2021)
    source_ids:
    - src.gonjo-2021-body-roll
  - certainty: 🟠
    text: 正確的感知目標是「回臂側肩膀盡量向上抬高」，划水側的深沉是自然結果，不需主動下壓。兩者外觀相似，但主動用力方向完全不同。
    source: Race Club, Gary Hall Jr.
    source_ids:
    - src.race-club-gary-hall-jr
    observation_basis: 觀察者為 The Race Club 的 Gary Hall Jr.（奧運選手兼教練），族群為其技術教學面向的競技與進階成人仰式泳者。外推邊界：這是**動作意識的處方**，不是量測結果——「回臂側主動上抬」與「划水側主動下壓」在水下影像上外觀高度相近，本庫無法由公開素材區分兩者的實際肌肉徵召差異，因此只作為教學語言的選擇建議，不作為機制主張；初學與兒童族群未在此觀察範圍內。
  cross_ref: 技術分析 §旋轉機制
  cross_ref_ids:
  - back.tech.1
  - back.tech.5
  - back.tech.6
  correct_concept: 仰式需要充分旋轉才能讓背闊肌進入最佳預拉位置，正確感知目標是「回臂側肩膀主動上抬」，而非對稱壓制兩側旋轉。
  perception_impact: 「躺平」指令使學員用全身張力維持水平姿態，背闊肌無法進入預拉位置，划水只靠小肌群，手感與水感回饋隨之弱化；張力升高後感知訊號被整體遮蔽。
- id: back.err2
  stroke: back
  category: pull
  title: 划手要刻意走 S 形路徑，升力更多
  misconception: 受 Counsilman（1971）螺旋槳升力框架影響，部分教練仍要求「划手要走 S 形，這樣升力更多」，視 S 形路徑為高效划水的設計目標。
  physical_reason:
    certainty: 🟡
    text: 刻意走 S 形的理論依據，是把手當成機翼、放在等速水槽裡量升力與阻力係數的「定常流」模型。這個模型本身已被質疑：實際划水中水本身在移動、手臂大幅旋轉，流場高度非定常，還存在沿手臂軸向的流，用定常流係數推算出來的推進力並不可靠。也就是說，S 形的理由建立在一個被質疑的計算模型上——不是「升力沒有用」。真正決定推進的是前臂面向推進方向的程度，不是路徑畫成什麼形狀。仰式另有兩個特殊困難加重此問題：選手看不到自己的手（視覺回饋缺失），入水後手掌容易因慣性繼續往外滑形成被動 S 形。
    source_ids:
    - src.toussaint-2002-pumped-up-propulsion
  evidence:
  - certainty: 🟡
    text: Toussaint 等（2002）以流場觀察與沿臂壓力量測指出，用定常流假設把划水力分解成升力與阻力來計算推進，是可疑的；Maglischo（2003）也已把 S 形修正為「橢圓路徑」。這裡要講清楚一件事： Toussaint 本人 1992 年的回顧反而寫「與高水準表現相關的共同技術元素，是用複雜的手部撥水動作特別去產生升力」。所以本條的依據是「升力／阻力的分解模型被質疑」，不是「升力推進效率低於阻力推進」——後者是常見的二手轉述，與被引用者的原文相反。
    source: Toussaint, H. M., Van den Berg, C., & Beek, W. J. (2002). "Pumped-up propulsion" during front crawl swimming. Medicine & Science in Sports & Exercise, 34(2), 314–319；Toussaint, H. M., & Beek, P. J. (1992). Biomechanics of competitive front crawl swimming. Sports Medicine, 13(1), 8–24；Maglischo, E. W. (2003). Swimming Fastest. Human Kinetics.
    source_ids:
    - src.toussaint-2002-pumped-up-propulsion
    - src.toussaint-beek-1992-biomechanics-front-crawl
    - src.maglischo-2003-swimming-fastest
  - certainty: 🔵
    text: 「前臂面向推進方向」比「路徑是否筆直」更重要，這一句本身是推力方向的幾何推導：推進力來自前臂與手掌把水往後推，方向由掌面朝向決定，路徑形狀只是這個朝向在空間中走過的痕跡。（2026-09-06 修正：原本這一行寫「近期研究（Gonjo 2020 等）確認路徑形狀的個體差異顯著」並掛 🟢，但那篇研究不存在——Gonjo 等人 2020 沒有量手部軌跡、也沒有做個體差異分析。掛掉的引用移除後，論證由上一行 Toussaint／Maglischo 承擔，這一行降為推導。）
  correct_concept: 「手掌是否面向推進方向」比「路徑是否走 S 形或直線」更重要。刻意 S 形是已過時的誤解；輕微 S 形（關節角度限制的自然結果）不需強行消除；被動 S 形（入水慣性造成）則應強化入水後「掌心壓水」的即時感知來修正。
  perception_impact: 刻意走 S 形時，注意力集中在空間路徑描述（「往外再往內」），等效於將感知從手掌水壓回饋轉移到空間位置監控，使前臂捕水感難以建立。
- id: back.err3
  stroke: back
  category: depth
  title: 手伸越深，抓到的水越多，推力越大
  misconception: 常見教法是「手伸越深，抓到的水越多，推力越大」。力學上這個邏輯並非全錯（更深手位確實可增加某些力矩），但忽略了深抓帶來的三個代價，且「深抓」一詞本身存在嚴重的用詞混淆。
  physical_reason:
    certainty: 🟠
    text: 代價一：手掌推進方向偏離水平，正對推力方向的分力下降。代價二：肩關節需要更多內旋，受傷風險上升，青少年尤其明顯。代價三：姿態維持耗能增加，長距離中疲勞惡化更快。現代技術重點是「肘部高於手腕、手腕高於指尖」的相對位置關係，而非深度數字本身。淺抓被誤解為「肘部不需要彎、直臂推水」是另一種常見過度矯正。
    observation_basis: 三項「代價」本身是流體力學與肩關節解剖的推導（分力、內旋負荷、姿態耗能），但把它們指認為「深抓水」的實際後果，依據是下方 evidence 的 Aaron Peirsol／Ryan Murphy 水下影像觀察，觀察者為教練群，族群為菁英仰式選手。外推邊界：影像觀察無同步測力，三項代價的**相對大小未經量測**，不得排序或給權重；「青少年受傷風險上升」是族群風險的定性提示，不是本條觀察得出的發生率。
  evidence:
  - certainty: 🟠
    text: 頂尖仰式選手（Aaron Peirsol、Ryan Murphy 等）水下影像分析：手指尖約距水面 10–20 cm，捕水完成時肘部角度約 100–120°。注意：此數字來自教練觀測影像分析，非精確實驗室控制研究。
    source: Aaron Peirsol / Ryan Murphy 水下影像分析（教練觀測）
    source_ids:
    - src.aaron-peirsol-ryan-murphy
    observation_basis: 觀察者為教練群（非單一具名研究者），素材是 Aaron Peirsol、Ryan Murphy 等奧運層級仰式選手的公開水下影像，族群 = 男子菁英仰式短中距離。外推邊界：影像判讀無標定尺規與同步測力，10–20 cm 與 100–120° 都是**目測區間**，誤差未知、不得當成量測值引用或再做運算；樣本是少數頂尖個案，不代表族群分布，也不可外推到女子、青少年、成人初學或其他泳式。
  correct_concept: 「肘部高於手腕、手腕高於指尖」的相對位置比深度數字本身更重要。最優深度依選手條件而定：短距離高力量選手可接受略深手位；長距離或力量不足者明確淺抓；青少年優先淺抓。淺抓的重點是手掌位置淺，而非肘部不彎。
  perception_impact: 「淺抓即直臂」的誤解使高肘機制消失，前臂捕水感喪失；學員無法感受前臂作為推進面承接水壓的訊號。
- id: back.err4
  stroke: back
  category: rotation
  title: 滾轉要靠髖部（或肩部）主導，選定一邊才對
  misconception: 教練常將仰式滾轉二分為「髖部主導」或「肩部主導」，並要求學員固定採用其中一種。告訴學員「用髖帶動」後，大多數人對髖部動作感知很弱，往往變成腰部扭動代償。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.gonjo-2021-body-roll
    text: Gonjo 等人（2021）在四種強度下量到：仰式的肩滾轉、髖滾轉與全身滾轉幅度不隨強度縮小，自由式則全面縮小。所以「游快一點就少轉一點」在仰式沒有依據。「由什麼主導」實際上取決於每一划當下的速度、踢水相位以及手掌抓水是否成功，並非固定模式。髖部主導與肩部主導各有適用情境：前者適合踢水有力的長距離選手，後者適合踢水較弱或短距離提升划頻的情境（🔵 這一組配對是依推進來源推導的，文獻只量到「幅度不隨強度縮小」，沒有比較過主導方式與距離專項的搭配）。
  evidence:
  - certainty: 🟢
    text: 四種強度（最大速度的 83–100%）下，仰式的肩滾轉、髖滾轉與全身滾轉幅度維持不變，自由式則全面縮小。原文量的是強度不是比賽距離，且浮力矩造成的那一部分滾轉（WBRBT）在仰式也是顯著縮小的——可支持的是「速度不是縮小滾轉的理由」，不是「仰式滾轉完全不受速度影響」。
    source: Gonjo et al. (2021)
    source_ids:
    - src.gonjo-2021-body-roll
  cross_ref: 競技仰式泳者肩旋轉與髖旋轉的現代運動學數據、仰式在不同速度下維持旋轉幅度（不像自由式縮小）、仰式旋轉的不對稱性
  cross_ref_ids:
  - back.tech.1
  - back.tech.2
  - back.tech.6
  correct_concept: 滾轉主導方式應依選手踢水能力與比賽距離判斷，不強制單一模式。有效教學路徑：髖部主導從踢水訓練切入，讓腿打水節律帶動身體旋轉；肩部主導從入水動作切入，強調「入水後肩膀壓低」的感知目標。
  perception_impact: 「用髖帶動」指令常觸發腰部扭動代償，旋轉感知與推進感知脫節；身體晃動而手掌未能固定水中錨點，感知系統失去旋轉與推進力連動的訊號。
- id: back.err5
  stroke: back
  category: kick
  title: 踢水要用力向下踢——自由式思維的直接干擾
  misconception: 教練本身多半由自由式建立對踢水的直覺，在教仰式時未翻轉方向，口令隱含自由式「下踢推進」邏輯，有時直接說「向下踢」。
  physical_reason:
    certainty: 🟡
    source_ids:
    - src.maglischo-2003-swimming-fastest
    text: 仰式推進力主要來自上踢（up-kick）——腳背向後向上推水，水的反作用力向前（Maglischo 2003）。自由式靠下踢（膕繩肌屈膝），仰式靠上踢（股四頭肌伸膝），方向完全相反。三種常見踢水錯誤：腳趾朝上（推進面消失）、膝蓋出水（阻力增加）、大腿主導（失去膝關節末端鞭打效應）。注意：「70–90% 推進力來自上踢」的舊文獻數字（Hollander 等）測量方法有限制，具體比例不應引用為精確值；定性結論（上踢是主力）有效。
  evidence:
  - certainty: 🟡
    text: 仰式上踢（up-kick）是主要推進踢水方向，主肌群為股四頭肌（伸膝）；自由式下踢方向與仰式相反。
    source: Maglischo, E. W. (2003). Swimming Fastest. Human Kinetics.
    source_ids:
    - src.maglischo-2003-swimming-fastest
  correct_concept: 仰式踢水的感知目標是「上踢時腳背感覺到水在往後推」，而非腿往上移動的空間位置感。上踢振幅的最優值目前文獻報告範圍過寬（30–60 cm），缺乏控制實驗，不應給定精確數字。
  perception_impact: 「向下踢」指令使學員從未建立上踢的腳背推水感知； B 型腳感系統缺乏正確的感知校準起點，腿部節律也因此難以與手臂節律整合。
- id: back.err6
  stroke: back
  category: pull
  title: 划手手臂打直，從肩掃到大腿
  misconception: 初學教學常用「手臂打直，從肩膀一路掃到大腿」作為划手口令——直臂划水好教、好示範，被當成標準動作教給入門者，而非過渡階段。問題是它把「容易教」誤當成「正確」。
  physical_reason:
    certainty: 🟠
    text: 直臂划水時手腕成為手臂最深點，前臂無法在肩前方建立向後的推進面，推水時間窗大幅縮短；彎臂（高肘 / 深肘抓水）讓前臂提早朝後施力，推水路徑更長。 Race Club 等教學分析比較彎臂與直臂，指出彎臂在划速與推進加速度上明顯較優；但具體百分比來自教學影片分析，未追溯到同儕審查原始數據，不引用為精確值。直臂並非全錯——休閒泳者與旋轉不足者直臂較易學，且直臂常是「兩側旋轉不對稱」的徵兆而非根因。
    observation_basis: 觀察者為 The Race Club（Gary Hall Jr.）的仰式彎臂 vs 直臂分析與 USMS 的 Backstroke Pull 指引（即下方 evidence 的來源），族群為競技仰式泳者與 masters。外推邊界：本文已在正文自陳「具體百分比來自教學影片分析，未追溯到同儕審查原始數據」，因此**只支撐方向（彎臂推水路徑較長）不支撐幅度**；末段「直臂常是旋轉不對稱的徵兆而非根因」是教學現場的因果判讀，未經對照設計驗證。
  evidence:
  - certainty: 🟠
    observation_basis: 觀察者為 The Race Club（Gary Hall Jr.）的仰式彎臂 vs 直臂影像分析與 USMS 的 Backstroke Pull 教學內容，族群為競技仰式泳者與 masters。外推邊界：本專案取回原文的嘗試沒有成功——兩者都只查到機構與主題，查不到可定位的單篇文件，所以**這條只是「兩個教學來源都這樣說」的紀錄**，不是量測結果；「推進力與加速度高於直臂」的方向可用，任何幅度、百分比或適用門檻都不成立。 2026-09-06 撤下原本掛的 source_ids（那是一個指不到文件的複合字串）。
    text: 彎臂（bent-arm / deep-elbow catch）划水的推進力與加速度高於直臂，是精英仰式的主流選擇；直臂多見於休閒與入門泳者。
  cross_ref: 教學誤區 §back.err3（深度與肘位）
  cross_ref_ids:
  - back.err3
  correct_concept: 彎臂與直臂是光譜，不是對錯二分。入門可從直臂建立節律，但要儘早過渡到「肘部彎曲、前臂朝後」的抓水；關鍵感知是「前臂背側壓到水」，不是「手臂掃過多長的弧」。直臂若源於旋轉不足，要先修旋轉而非只改手臂。
  perception_impact: 直臂划水時前臂無法承接水壓，學員只感覺到手掌劃過水面下的「滑」，建立不起前臂捕水感（A 型手感缺失）；把注意力放在「手臂掃多遠」的空間描述，而非掌心與前臂的水壓回饋。
- id: back.err7
  stroke: back
  category: head
  title: 仰式臉在水面上，想呼吸就呼吸、不用管節律
  misconception: 因為仰式臉多半在水面上，教練常直接說「仰式不用練呼吸，想換氣就換氣」，把呼吸節律從教學中省略。這是「主動省略」而非沒注意到——口令明確告訴學員呼吸不重要。
  physical_reason:
    certainty: 🔵
    text: 沒有外在水的威脅不等於呼吸可以隨意。無節律呼吸最常見的後果是憋氣：憋氣使二氧化碳累積、肌肉快速疲勞，初學兒童尤其常一路憋到牆邊才大口喘。規律呼吸（一手划入水吸、對側手划入水吐）同時穩定頭部、串接手腿時序、降低整體張力。
  evidence:
  - certainty: 🟠
    text: 多家教學指引一致建議仰式採固定呼吸節律：一臂划水吸氣、對臂划水吐氣，以避免憋氣與疲勞，並協助手腿協調與放鬆。兒童憋氣是教練需主動辨識並糾正的常見問題。
    source: swim-teach.com、A3 Performance、enjoy-swimming 等背式呼吸教學指引（教學共識）
    source_ids:
    - src.swim-teach-com-a3-performance-enjoy-swimming
    observation_basis: 觀察者是三個獨立的泳訓教學網站（swim-teach.com、A3 Performance、enjoy-swimming），族群為成人初學到中階仰式學員與兒童泳訓班。本條記錄的是**多家教材說法一致**這件事，不是任何一家的實驗結果。外推邊界：「一臂吸、對臂吐」是普遍的入門處方，沒有任何一家給出對照組或呼吸交換量測；競技層級的呼吸節律（配合划頻與距離調整）不在此範圍，不可用本條反推菁英做法。
  cross_ref: 頭部基礎位置、化學受器與呼吸驅動
  cross_ref_ids:
  - back.tech.21
  - breathing.physiology.chemoreceptors
  correct_concept: 仰式仍需固定呼吸節律。感知目標是「吐氣與某一側划手綁定」形成自動節奏，而非用意識決定何時呼吸。節律穩定後，呼吸成為手腿時序的節拍器。
  perception_impact: 「想呼吸就呼吸」使學員在用力時下意識憋氣，胸腔張力升高遮蔽全身水感（C 型）；失去呼吸作為節拍錨點後，手腿節律也更難整合。
- id: back.err8
  stroke: back
  category: kick
  title: 腿要打直、膝蓋不能彎——對「腳踏車式踢水」的過度矯正
  misconception: 為糾正初學者「用膝蓋猛踩（腳踏車式踢水）」，教練改下「腿打直、膝蓋不要彎」的反向口令。矯正過度後變成僵直雙腿整條上下擺，失去踢水推進的核心機制。這是教練主動下的反向指令，與 back.err5（踢的方向錯成向下）是不同的錯誤軸。
  physical_reason:
    certainty: 🟠
    source_ids:
    - src.wolf-2012-usms-backstroke-pointers
    observation_basis: 觀察者是 Lisa Wolf（Montgomery Ancient Mariners 與 DC Aquatics Club 的 masters 教練、 USA-S 分齡教練）發表在 USMS 的 Backstroke Pointers，族群是成人學習者與 masters。外推邊界：原文只寫到「踢腿由髖驅動，膝只需要微屈」， **沒有描述上踢末端的鞭打機制**——鞭打那一段是本專案自己接的力學讀法，屬於連動鏈的一般性質，不是這篇支撐的。原文也沒有給任何膝角度或幅度的數值。 2026-09-06 由 🟡 改標 🟠：這是一篇教練撰寫的教學文章，不是研究，原本標成「舊文獻」是把教學內容當成文獻層級在用。
    text: 有效的仰式踢水由髖部啟動，上踢（up-kick）時膝關節自然微屈再伸展，形成末端鞭打；完全僵直的腿失去這個鞭打，推進面消失。但「彎膝」必須是髖驅動下的自然結果，不是主動用膝蓋發力——後者退回腳踏車式踢水。正確狀態介於兩個極端之間：髖啟動、膝自然屈伸、下踢相對直、上踢有鞭打。
  evidence:
  - certainty: 🟠
    observation_basis: 同上：Lisa Wolf（2012）在 USMS 的 Backstroke Pointers，族群為成人學習者與 masters。原文踢腿段逐字寫的是「The kick drives from the hip and only a slight bend of the knees is needed」，以及腳尖略內、上下都要撥到水（「boil the water」）。外推邊界：**「單純從膝蓋踢會失去推進並增加阻力」這句原文沒有寫**，是教學共識的推論，本專案沒有查到量化過這個代價的來源。
    text: 仰式踢水應由髖啟動、膝只需微屈，非完全僵直亦非主動屈膝踩踏。
    source: Wolf, L. (2012). Backstroke Pointers. U.S. Masters Swimming.
    source_ids:
    - src.wolf-2012-usms-backstroke-pointers
  cross_ref: 教學誤區 §back.err5（踢水方向）
  cross_ref_ids:
  - back.err5
  correct_concept: 踢水的關鍵不是膝蓋彎或直，而是「髖啟動、膝自然屈伸的鞭打」。感知目標是上踢時腳背把水往後推、力量像鞭子從髖傳到腳背，而非刻意控制膝關節角度。
  perception_impact: 僵直腿的學員感覺不到腳背的鞭打推水（B 型腳感缺失）；把注意力放在「膝蓋有沒有彎」這個空間/動作監控，反而切斷了髖到腳背的力量傳遞感知。
- id: back.err9
  stroke: back
  category: posture
  title: 肚臍頂出水面、挺胸——把浮力口令做成拱背
  misconception: 為對抗「沉臀」，教練常用「肚臍露出水面」「挺胸」當浮力口令。口令本意是好的，但被學員過度執行成「主動拱背、把胸口頂出水面」，反而破壞流線。這條的爭議點在口令本身容易被做歪，屬於「主動下的口令導致系統性偏差」。
  physical_reason:
    certainty: 🟠
    text: 主動拱背（腰椎過度前凸）不是流線姿態，且常伴隨頭與肩主動下壓，造成腰部緊張與阻力。真正讓臀腿上浮的機制不是拱背，而是「頭頸中立、核心收住、必要時微微壓低頭肩」這個翹翹板原理；多家教學指引明確把「拱背」列為錯誤，建議改成「背稍微圓」而非拱。
    observation_basis: 觀察者為三個彼此獨立的教學來源——USMS 的 Backstroke Body Position 指引、swim-teach.com、 enjoy-swimming（即下方 evidence 所載的教學共識），族群為成人學習者與 masters。外推邊界：這是**教材共識**而非實驗結果，三方一致提高了可信度但不改變證據層級；「翹翹板原理」是力學推導，「多家教學指引把拱背列為錯誤」是文獻式事實陳述，兩者都不支撐任何角度或幅度的處方值。
  evidence:
  - certainty: 🟠
    observation_basis: 觀察者是 USMS 的仰式身體位置教學內容、swim-teach.com 與 enjoy-swimming 三方教材，族群為成人學習者與 masters。外推邊界：這是**教材共識**不是實驗結果，三方一致提高的是可信度不是證據層級；本專案沒有取回任何一份可定位的單篇原文，所以它只支撐「多家教材都把主動拱背列為錯誤」這個文獻式事實，不支撐任何角度、幅度或處方值。2026-09-06 撤下原本掛的 source_ids （那是三個網站名串起來的字串，指不到任何文件）。
    text: 「肚臍露出水面」是常見浮力心像，但不應靠拱背達成；過度拱背非流線。建議核心收住、頭頸中立，靠壓低頭肩讓臀腿自然上浮，背部寧可微圓不要拱。
  cross_ref: 教學誤區 §back.err1（旋轉壓制造成的張力）
  cross_ref_ids:
  - back.err1
  correct_concept: 臀腿上浮靠的是頭頸中立 + 核心收住 + 翹翹板（壓低頭肩端），不是主動拱背。感知目標是「身體像一條被輕輕拉直的線」，而非「胸口用力頂高」。
  perception_impact: 主動拱背使學員用腰背張力維持姿態，全身進入高張力狀態，水感回饋被遮蔽（C 型）；注意力集中在「胸口夠不夠高」的形態監控，建立不起「身體成一直線漂浮」的整體場感知。
- id: back.err10
  stroke: back
  category: head
  title: 看腳趾確認身體有沒有平——抬頭找視覺確認反而壓臀部
  misconception: 常見教練口令為了讓初學者「自己感受身體有沒有平」會要求泳者「看一下腳趾」「看膝蓋有沒有出水」。立意是給泳者一個自我檢查工具，但執行起來變成持續抬頭找視覺回饋，反而把姿勢破壞。
  physical_reason:
    certainty: 🔵
    text: 仰式頭部基準位置是後腦勺平躺水中、頸與脊椎成一線、視線約朝天花板正上方。任何抬頭看身體下半部的動作都會讓重心前移、臀部下沉、身體拱起，形成所謂「坐在水裡」的姿勢——而這正是想用抬頭口令矯正的問題本身。換句話說，這個口令把症狀當成了診斷工具，逼選手做出讓問題加劇的動作。
  cross_ref: 頭部基礎位置
  cross_ref_ids:
  - back.tech.21
  correct_concept: 身體位置不靠視覺確認，靠本體感覺與外部回饋（教練影片、額頭水線位置）。初學階段用 Bk22 泳鏡平衡 drill（額頭放泳鏡保持不掉）建立頭部靜止感，比讓泳者自己抬頭看腳更有效。
  perception_impact: 抬頭看腳的動作把感知頻寬鎖在「我有沒有平」的視覺監控上，反而離開原本應該專注的水壓回饋（背部、頭後接觸水的感覺）。感知層的浮力察覺被視覺監控擠掉。
- id: back.err11
  stroke: back
  category: entry
  title: 小指先入水的執著——過度旋轉手腕造成肩衝擊與入水偏外
  misconception: 「小指先入水」是仰式入水動作的標準口令，本身沒錯，但常被誇大成「越早越深越好」的執著。結果泳者在回臂末段過度旋轉手腕、把手掌完全轉到外側，造成入水點偏離肩膀延伸線、肩關節做出強制內旋撞擊位。
  physical_reason:
    certainty: 🟠
    text: 小指入水的目的是讓手掌薄面切水、減少入水阻力——這是「入水那一瞬間」的目標，不是整個回臂過程的目標。回臂在指天位置之前手掌應該朝側、到接近水面才開始轉到小指朝下。過早把手腕轉到極端內旋位置使肩關節在過頭內旋同時做負重（入水撞擊力），是仰式肩夾擊（內衝擊）的常見機轉之一。同時手腕轉太遠時手會「往外帶」，入水點落在肩膀延伸線之外，造成 lateral pull、推進方向偏離。
    observation_basis: 觀察者為教練影像觀察與 The Race Club Ch 13–14（即下方 evidence 的來源），族群為競技仰式泳者。外推邊界：入水時序與手腕轉向的描述是影像觀察，未報告角度量測；中段「是仰式肩夾擊（內衝擊）的常見機轉之一」是把生物力學情境對到臨床機轉的**推論**，不是本觀察測到的損傷發生率，臨床主張請以 health 網域的條目為準。
  evidence:
  - certainty: 🟠
    text: 菁英仰式選手影像分析顯示入水點通常在肩膀延伸線或略內側，而非偏外；小指轉動發生在入水前 0.1-0.2 秒，不是整個回臂過程。
    source: 教練影像觀察 / Race Club Ch 13-14
    source_ids:
    - src.race-club-ch-13-14
    observation_basis: 觀察者為教練群與 The Race Club 第 13–14 章的技術教學素材，族群為競技仰式泳者。外推邊界：入水點「在肩線或略內側」是影像目測，無標定尺規；「入水前 0.1–0.2 秒」是由影格數估算的區間，**不是同步計時量測**，不得當成可再運算的時間常數；初學者與兒童的回臂型態不在此觀察範圍。
  correct_concept: 回臂大部分時間手掌朝側（中性位置），只在接近水面那一瞬把小指轉到朝下切水。重點是入水位置在肩膀延伸線，不是手腕旋轉幅度。
  perception_impact: 過度旋轉手腕的注意力集中在「我手轉得夠多沒有」，等效於把感知從入水後的水壓建立轉移到關節角度監控，建立 EVF 與早期捕水的感覺反而被排擠。
- id: back.err12
  stroke: back
  category: pull
  title: 划水要拉到大腿底——過度延長拉水反被減速期反咬
  misconception: 常見口令「拉到底」「划到大腿側」要求把水下划水延長到最遠。立意是「划程越長推進越多」，但忽略了拉水的力學是有「最佳出水時機」的，過了臀部之後手在水中變成阻力源而非推進源。
  physical_reason:
    certainty: 🟠
    text: 拉水的有效推進區結束於手掌通過臀部側面附近（約 6 點鐘到 7-8 點鐘位置）。過了這個點之後，手繼續向後推時水流方向已經與身體前進方向夾角太大，推進力分量下降但阻力分量上升；同時這段時間還佔用了「應該開始準備回臂」的窗口，讓回臂被迫加速來補時序，整個 stroke rate 受損。菁英選手出水點通常在大腿外側偏上而非大腿底——這是力學最佳化的結果，不是肌力不足。
    observation_basis: 觀察者為 The Race Club Ch 14 與通用菁英影像觀察（即下方 evidence 的來源），族群為菁英仰式選手。外推邊界：「6 點鐘到 7–8 點鐘」是**時鐘方位的教學語言，不是量測角度**，不同參考系（身體軸 vs 池底）讀出來的位置會不同，不可當成目標值；「菁英出水點在大腿外側偏上」是影像觀察的分布印象，未報告樣本數與離散度。推進力分量下降／阻力分量上升那段是流體力學推導，不依賴本觀察。
  evidence:
  - certainty: 🟠
    observation_basis: 觀察者是 The Race Club 的菁英仰式水下影像教學內容，族群為競技仰式選手。外推邊界：**「0.05–0.1 秒」這個區間要當成影像觀察的印象值，不是量測結果**——本專案 2026-09-06 回頭找原文時只查到「Ch 14」這個章號，沒有書名、年份或作者，無法確認它出自哪一份 Race Club 教材，因此沒有任何樣本數、離散度或量測方法可交代。上面 mechanism 裡「推進力分量下降／阻力分量上升」那段是流體力學推導，不依賴本觀察。
    text: 水下高速攝影分析菁英仰式選手出水時機，多數在手通過臀部後 0.05-0.1 秒內出水，而非繼續拉到大腿底。
  cross_ref: 推水、拉水
  cross_ref_ids:
  - back.tech.12
  - back.tech.11
  correct_concept: 拉水的目標是「通過臀部時釋放」，不是「拉到底」。感知目標是「手通過臀部時感覺水壓開始下降→立刻出水」，不是「主動把手推到大腿底再出水」。
  perception_impact: 強迫拉到底會讓泳者錯過手部水壓回饋的轉折點訊號（從推進變阻力的那一瞬），把感知從「水壓何時最強」轉移到「手有沒有到大腿」的位置監控。
- id: back.err13
  stroke: back
  category: posture
  title: 核心要 brace 到極致——把柔性張力做成剛性硬塊割斷 coupling
  misconception: 部分教練從陸上肌力訓練的「核心 brace」概念直接套用到仰式：「肚臍貼背、整個核心收緊」。本意是改善身體線條穩定，結果泳者把核心做成剛性硬塊，反而割斷了肩-髖之間的 coupling 連動。
  physical_reason:
    certainty: 🔵
    text: 仰式的核心需求是「柔性張力」——足夠的張力維持身體線、足夠的柔軟讓肩旋轉透過螺旋筋膜線傳到對側腳。剛性 brace（如重訓硬舉時的核心模式）會把腹斜肌固定，讓肩旋轉的扭力卡在胸腰交界傳不下去。結果是肩雖然在轉、髖卻不跟、踢水時序與划手脫節——而這正是 coupling 失效的典型表現。陸上 brace 的目的是抗負重，水中需要的是「動態穩定」——兩者完全不同。
  correct_concept: 核心目標是「線條維持」+「動態傳力」，不是「最大張力」。感知目標是「肩旋轉時感覺髖會跟著轉、不是被卡住」。 Drill 用 Bk5（頭帶平衡旋轉踢水）建立肩-髖連動感，比 plank-style brace 練習更貼近仰式需求。
  perception_impact: 過度 brace 製造的內部高張力會遮蔽感知訊號（張力升高 → 本體感覺降低），泳者報告「感覺穩但水感差」就是這個機制——剛性換來了姿勢穩定，但同時關掉了水感的細微回饋通道。
  cross_ref: free.tech.33（螺旋筋膜線是 coupling 解剖基礎）
  cross_ref_ids:
  - free.tech.33
- id: back.err14
  stroke: back
  category: head
  title: 仰式也要套自由式呼吸節律——每三划換氣、強迫節律
  misconception: 部分教練把自由式 bilateral breathing 的「每三划換氣」思維直接套到仰式：要求學員「每幾下換一次氣」。立意是建立穩定節律，但仰式臉本來就在水面上，強迫節律反而把自然的呼吸打亂、製造緊張。
  physical_reason:
    certainty: 🔵
    text: 仰式臉持續在水面上（除浪較大或速度時水濺臉），呼吸不受換氣時機限制，本質上接近陸上呼吸。強迫節律相當於要求選手「每跑三步換氣一次」——把自由呼吸改成固定週期，會讓選手在「該換氣的節律點」感到憋氣、在「不該換氣的節律點」感到不知道要不要呼吸。結果是核心張力上升、整體放鬆度下降，反而拖累技術。與自由式相反——自由式臉在水中需要建立節律，仰式臉在水面不需要也不該。
  cross_ref: 頭部基礎位置、仰式臉在水面上，想呼吸就呼吸、不用管節律
  cross_ref_ids:
  - back.tech.21
  - back.err7
  correct_concept: 仰式呼吸應該保持「自然、按需」——感覺需要時呼吸，不需要強迫節律。如果泳者因緊張而憋氣，介入點是放鬆而不是節律。例外：水濺臉的開放水域或衝刺時，可以建立「划手週期內的吐氣時機」避免嗆水，但這是技術應對特定情境，不是統一節律規定。
  perception_impact: 強迫節律把感知頻寬鎖在「我下一次換氣時機」的計時監控上，把該用於水壓回饋的注意力擠掉。放鬆呼吸恢復後，感知層的水感訊號才能浮上來。
- id: back.err15
  stroke: back
  category: recovery
  title: 回臂越貼水面越好——把長距離 low-octane 誤套到所有人
  misconception: 部分教練要求所有人「回臂越貼水面越好、手不要舉太高」，立意是減少能量消耗。但這個口令把「長距離選手的 low-octane 策略」誤套到衝刺、菁英、肩柔軟度好的選手身上，他們本來應該用高一點的回臂取得 coupling 動能。
  physical_reason:
    certainty: 🟠
    text: 回臂高度是 octane 能量光譜的一部分（見 free.tech.32）：長距離選手用低能量彎臂貼水回臂（節能優先），衝刺用高能量直臂垂直回臂（coupling 增益優先）。仰式同樣有這個光譜——50/100 短距菁英常用偏垂直回臂；800/1500 才用偏貼水回臂。一律要求貼水把衝刺選手的 coupling 推進拿掉，等於用節能換掉速度。
    observation_basis: 本條沒有自己的觀察來源：能量光譜框架借自 `free.tech.32`（Race Club 的 octane 類比），觀察族群為競技自由式泳者，**把它平移到仰式是本專案的推論，不是 Race Club 對仰式做過的觀察**。外推邊界：「50/100 短距菁英常用偏垂直回臂、800/1500 才用偏貼水」是分布印象，本檔未記錄誰觀察、看了幾位選手，**在追到來源前不得當成距離對應的處方**；可用的只有「回臂高度是節能與 coupling 的權衡、不該一律要求貼水」這個結構性判斷。
  correct_concept: '回臂高度應依距離與個人能力分流：


    - 短距/衝刺：垂直回臂、直臂為主，追求 coupling 動能

    - 中距：依個人偏好調整高度

    - 長距：貼水低位回臂，追求節能


    教學早期建立中位回臂作為預設，等選手進入專項距離訓練再調整。'
  perception_impact: 絕對化貼水口令讓追求衝刺的選手放棄 coupling 增益，感知焦點被鎖在「手有沒有夠低」的位置監控，錯失了「入水撞擊強度 ≈ 肩旋轉速度」這個 coupling 感知（見 free.tech.29）。
  cross_ref: free.tech.32（octane 三層光譜）、free.tech.29（手砸水 = 肩旋轉同源）
  cross_ref_ids:
  - free.tech.32
  - free.tech.29
- id: back.err16
  stroke: back
  category: recovery
  title: 回臂手要打直、肌肉繃緊維持姿勢
  misconception: 部分教練要求「回臂時手要打直、不能鬆」，立意是維持手臂線條乾淨。執行端變成回臂整個過程肌肉繃緊鎖死，造成肩部過度負荷、長期累積肩衝擊。
  physical_reason:
    certainty: 🟡
    source_ids:
    - src.general-swim-medicine-consensus
    text: 仰式肩部已是運動界承受最高重複負荷的關節之一（每分鐘約 50-60 次過頭運動）。回臂期是肩部「主動恢復」的少數窗口——手臂自重借重力擺動回水面前。肌肉繃緊鎖死把這個被動恢復窗口取消，肩部從未真正放鬆，疲勞累積比放鬆回臂更快、肩衝擊風險更高（仰式選手肩痛盛行率 70-80%，部分原因是過度回臂負荷）。
  evidence:
  - certainty: 🟡
    text: 仰式選手肩痛盛行率約 70-80%，與重複負荷直接相關。
    source: 通用游泳醫學共識
    source_ids:
    - src.general-swim-medicine-consensus
  cross_ref: 回臂、仰式 recovery 能量光譜
  cross_ref_ids:
  - back.tech.13
  - back.tech.28
  correct_concept: 回臂應該主動發力的只有「出水的瞬間」（從水中提起需肌肉收縮）+「入水前的最後加速」（coupling 動作）。中間過程應該放鬆讓手臂借重力擺動。手肘可以是打直的（直臂 high-octane 策略）或微彎（節能策略），但無論哪種，過程中肌肉都應該放鬆，不是繃緊。
  perception_impact: 繃緊手臂讓感知頻寬被本體張力佔滿，水感訊號（背部接觸水的感覺、入水位置）被擠掉。放鬆後本體張力下降，感知通道才能恢復。
- id: back.err17
  stroke: back
  category: recovery
  title: 手要過頭頂正上方再入水——破壞入水位置與肩線對齊
  misconception: 部分教練要求「手要回到頭頂正上方再入水」，立意是讓回臂走垂直軌跡取得最大 coupling。但執行端變成手臂越過中線、入水點偏內，造成入水後拉水軌跡橫越身體中線、肩部內旋撞擊。
  physical_reason:
    certainty: 🟠
    text: 仰式入水位置應該在「肩膀延伸線」上，不是頭頂正上方。頭頂正上方在解剖學上已是中線，從那個位置入水後拉水會經過身體中央，推進力分散在橫向、肩部需要強制內旋對齊。直臂回臂走垂直軌跡時，手會在肩膀正上方的位置——這已經是「過頭」的視覺感，但實際位置仍在肩線延伸線，沒有偏內。口令「過頭頂正上方」把目標設過了。
    observation_basis: 主體是解剖與力學推導（頭頂正上方即中線；自中線拉水會讓推進向量分散到橫向、並迫使肩在過頭位強制內旋），這部分不依賴任何觀察。真正屬於觀察的只有一句——「直臂垂直回臂時手看起來在肩正上方，但實際仍在肩線延伸線」，這是視覺錯覺的教學提醒，本檔未記錄觀察者與族群。外推邊界：本條不提供入水點的角度或距離值，只提供「口令把目標設過頭」的方向性判讀。
  correct_concept: 回臂目標是「手到肩膀正上方延伸線、入水點在肩線」，不是「過頭頂正中線」。差別只有 10-15 公分，但決定整個拉水軌跡的對齊。
  perception_impact: 感知目標應該是「入水時對側肩感覺被推開」（推進力對齊產生的反作用），不是「我手有沒有過頭頂」的位置監控。選手注意力應該在入水後的水壓回饋，不是回臂的空間位置。
  cross_ref: starts-turns.err10（起跳抬頭二元口令的對應討論）
  cross_ref_ids:
  - starts-turns.err10
- id: breast.err1
  stroke: breast
  category: kick
  title: 踢腳主要是旋轉動作——上、外、繞回來才是核心
  misconception: 「上、外、繞回來」幾乎是全球通行的蛙式踢腳口令，讓學員誤以為「畫圓」是踢腳的主體動作。
  physical_reason:
    certainty: 🔵
    text: 外、內擺動是踢腳的啟動設定與收攏，不是推進的主角。蛙腿的主推進機制是 outsweep→insweep 兩段渦流合併後向後噴射，而非旋轉拉力。「踢腳是旋轉動作」的說法從根本否定了這個物理機制。
  evidence:
  - certainty: 🟠
    text: 蛙式踢腳最常見的誤解之一，是認為它主要是旋轉動作。目標應該是讓腳盡量向後施力推水。往外、往內只是準備和收尾階段；踢腳的主體幾乎是完全向後的。
    source: U.S. Masters Swimming — Breaststroke Kick 指南
    source_ids:
    - src.usms-breaststroke-kick-guide
  - certainty: 🟢
    text: CFD 研究確認：蛙腿的主推進機制是 outsweep→insweep 兩段渦流合併後向後噴射，而非旋轉拉力。
    source: Tanaka et al. (2024). CFD study. Journal of Biomechanics
    source_ids:
    - src.tanaka-2024-b
  cross_ref: 蛙腿推進機制
  cross_ref_ids:
  - breast.tech.9
  correct_concept: 踢腳的目標是「直接向後推水」。旋轉感是動作設定和收腳帶來的副產品，不應被誇大為主要目標。
  perception_impact: 誤以為旋轉是主體，腳掌回饋的方向感就會從「後方壓力」偏移至「畫圓阻力感」。 L2–L3 的腳感校準起點整個跑掉。
- id: breast.err2
  stroke: breast
  category: kick
  title: 膝蓋越開踢出力量越大
  misconception: 教練要求「膝蓋打開、分開來踢」，學員因此認為膝蓋越開、腳踢出的範圍越大，推進力就越強。
  physical_reason:
    certainty: 🔵
    text: 問題不在於膝蓋開多寬，而在於腳掌能否外翻對準後方。膝蓋過度外開讓小腿角度偏斜，腳底面無法朝後施力。膝外旋是腳掌翻轉到位的功能性指標，不是膝蓋開角本身。
  evidence:
  - certainty: 🟠
    text: 最重要的事不是踢多寬，而是能否讓腳充分外翻，以及整個踢腳過程中膝蓋能否保持穩定。原文另註明腳掌需比膝蓋更寬，才有辦法把腳翻出去向後施力。
    source: U.S. Masters Swimming — Breaststroke Kick 指南
    source_ids:
    - src.usms-breaststroke-kick-guide
  - certainty: 🟠
    text: 膝蓋朝向水線兩側時，小腿的角度讓腳無法有效抓水；你不是在把水往後推，而是在把水往中間推擠。
    source: SwimOutlet.com (2024). Common Breaststroke Mistakes.
    source_ids:
    - src.swimoutlet
  - certainty: 🟡
    text: 膝外旋（knee external rotation）與蛙腿游速顯著相關，但這是腳掌翻轉到位的功能性指標，不是膝蓋開角本身。
    source: Strzała et al. (2013). Journal of Human Kinetics
    source_ids:
    - src.strzala-2013-b
  cross_ref: 膝距窄的雙重效益、腳掌翻轉（Foot Flip）、髖關節內旋（Hip Internal Rotation）
  cross_ref_ids:
  - breast.tech.13
  - breast.tech.11
  - breast.tech.15
  correct_concept: 踢腳寬度的前提是「腳能否外翻」，而非「膝蓋能開多寬」。最優寬度因解剖條件（髖關節活動度、踝關節柔韌性）不同而異，不應強求統一。
  perception_impact: 膝蓋外開但腳掌未翻轉到位，踢腳水壓感覺偏向側方，學員無法感知「往後施力」的正確壓力方向。 L2 無法建立正確的腳掌方向感知。
- id: breast.err3
  stroke: breast
  category: kick
  title: 「像青蛙一樣踢」是正確的踢腳意象
  misconception: 「像青蛙一樣踢」是全球最普遍的蛙式指導語，被視為理所當然的直覺意象。
  physical_reason:
    certainty: 🟠
    text: 青蛙是用腳趾間的蹼往前推水，但蛙式選手需要用小腿內側和腳來往後推水——兩者方向完全相反。「青蛙踢」意象容易讓學員把注意力放到腳趾（蹼）而非小腿內側，推進面積完全錯位。
    observation_basis: 觀察者為 360swim（教學網站，即下方 evidence 的來源），族群為蛙式學習者。外推邊界：「青蛙踢意象讓學員把注意力放到腳趾」是**注意力導向的教學判讀**，未經對照設計驗證（沒有「用此意象 vs 不用」的比較）；前半段「兩者推水方向相反、推進面錯位」則是解剖與流體方向的推導，不依賴本觀察。
  evidence:
  - certainty: 🟠
    text: 青蛙是用腳趾間的蹼往前推水，但蛙式選手需要用小腿內側和腳來往後推水——兩者方向完全相反。
    source: Breaststroke Lesson - How About Them Legs? 360swim.
    source_ids:
    - src.360swim-breaststroke-legs
  cross_ref: 蛙腿推進機制、腳掌翻轉（Foot Flip）
  cross_ref_ids:
  - breast.tech.9
  - breast.tech.11
  correct_concept: 推進力來自小腿內側和腳踝的向後推壓。更精確的感知意象：「腳掌外翻後像刀片往後劈水」，而非「像青蛙那樣畫圓」。
  perception_impact: 使用青蛙意象，學員的感知目標會落在錯誤的身體部位（腳趾而非小腿內側）。腳感建立方向根本偏差，L2 感知校準需要整個重置。
- id: breast.err4
  stroke: breast
  category: kick
  title: 「腳跟碰屁股」是正確的收腿口令
  misconception: 幾乎所有初學教學都使用「腳跟碰屁股」作為收腿口令，這個說法已成為蛙式教學的預設語言。
  physical_reason:
    certainty: 🔵
    text: 「腳跟碰屁股」的幾何路徑必然是往正中間收，造成膝蓋大幅前移（正面截面積激增、阻力最大），且腳掌收完朝上，翻腳掌需額外旋轉，錯過最佳蹬水時機。最優路徑是「腳跟往外側臀部靠」——髖外旋同時發生，大腿前移量最小，腳掌自然朝向斜後方，可提早進入推進相。
  cross_ref: 技術分析 §3.2
  cross_ref_ids:
  - breast.tech.10
  - breast.tech.13
  correct_concept: 「腳跟往外側臀部靠」是物理最優收腿路徑，但這個動作日常生活中幾乎沒有對應動作，需要刻意感知建立，不能只靠口令替換。
  perception_impact: 錯誤收腿路徑讓學員無法感知「收腿是短暫高阻力階段，需要最快通過」的時間感。速度谷值管理在感知層無法建立，卡在 L2 無法往 L3 發展。
- id: breast.err5
  stroke: breast
  category: pull
  title: 外划（outsweep）是蛙式手部動作的主要推進來源
  misconception: 部分教學強調外划要有力，讓學員誤以為外划和內划（insweep）一樣重要，甚至誤解外划本身是推進力的來源。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
    - src.mccauley-1993-usms-modern-breaststroke
    text: outsweep 的功能是「將手移至最佳捕水起始位置」，不是推進。外划本身推進力很小； insweep（內掃）才是蛙式手部動作的主推進相。世界頂尖與國家級選手的差別，在於手臂推進相往腿的滑行段延伸得更久，不是更早開始內划。
  evidence:
  - certainty: 🟡
    text: 外划本身推進力很小；要從外划取得任何推進，手掌必須相對前臂帶出 30–45 度的角度。使用邊界：這是 1993 年美國masters 泳協技術文章的說法，作者的解釋架構是當年主流的升力理論（把手當機翼），與後來以非穩態流體、渦流脫落為主的解釋不同；「外划推進力小」這個結論本身有 Nicol 2022 系統性綜述支持，但這裡的角度數字屬於當年的經驗處方，不是量測值。
    source: McCauley, W. (1993). The Modern Breaststroke. U.S. Masters Swimming.
    source_ids:
    - src.mccauley-1993-usms-modern-breaststroke
  - certainty: 🟢
    text: 系統綜述確認 insweep 是蛙式手部動作的主推進相；外划的功能在定位而非產生推進力。
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  cross_ref: 技術分析 §2.1
  cross_ref_ids:
  - breast.tech.3
  - breast.tech.5
  correct_concept: outsweep 的目的是「設定抓水位置」；insweep（內掃加速）才是蛙式手部動作的主要推進來源。教學應區分兩個階段的功能：外划最小施力，insweep 全力加速。
  perception_impact: 誤以為外划需要用力，注意力會提前消耗在外划阻力感上，錯失捕水時刻（catch point）應有的「前臂鎖水感」。L3 EVF 無法建立。
- id: breast.err6
  stroke: breast
  category: pull
  title: outsweep 越寬越好，划得越遠推進力越大
  misconception: 教練有時告訴學員「手要划到最寬處再拉回來」，讓人以為越寬的外划能抓到更多水、推進力更大。
  physical_reason:
    certainty: 🔵
    text: 沒有足夠肌力控制的過寬外划，反而讓肘部下沉，破壞後續 insweep 的高肘捕水姿態，降低整體推進效率。外划幅度越大，側向分量越多，向前有效分量佔比下降，同時收腿阻力增加；兩個成本同時出現，超過最優幅度後收益快速遞減。
  evidence:
  - certainty: 🟡
    text: 捕水點要拉多寬，取決於選手自身的力量——越強的人才撐得住越寬的外划。使用邊界：這是 1993 年美國 masters 泳協技術文章的教練處方，不是量測結果；原文沒有給出可對照的寬度數值或肌力門檻，只說明寬度是個體變數而非固定標準。
    source: McCauley, W. (1993). The Modern Breaststroke. U.S. Masters Swimming.
    source_ids:
    - src.mccauley-1993-usms-modern-breaststroke
  cross_ref: 外划（Outsweep）、外划過寬、捕水（Catch）
  cross_ref_ids:
  - breast.tech.3
  - breast.tech.24
  - breast.tech.4
  correct_concept: outsweep 的寬度應在自身肌力可控制的範圍內，不追求「越寬越好」。outsweep 的終點才是真正的捕水點（catch point），那才是發力的起點。
  perception_impact: 過寬外划使肘部失去對準，學員感知到的是「手臂大幅移動的划水感」而非「前臂鎖水後的推進感」——手感建立失敗，L3 感知錯位。
- id: breast.err7
  stroke: breast
  category: head
  title: 換氣時抬頭正前看、眼睛看向對岸
  misconception: 大多數初學教學要求換氣時眼睛正面直視前方，甚至要「看到對面牆壁」才算換氣位置正確。
  physical_reason:
    certainty: 🔵
    text: 換氣時抬頭直視前方，會讓臀部下沉，身體姿勢把人往上推而不是往前推。競技蛙式換氣應由 insweep 帶動的上胸前衝自然帶出，抬升的方向是向前而不是向上。長期正面換氣習慣也容易造成頸部過度仰伸的傷害。要注意的是：「所以頸部角度應該固定、頭跟脊柱一起動」是另一個方向的過度修正——見下方證據列，生物力學觀點反而要求頸部在完整活動範圍內伸展，只是下巴維持在水面高度。
  evidence:
  - certainty: 🟠
    text: 換氣時抬頭直視前方，會讓臀部下沉，身體姿勢把你往上推而不是往前推。換氣時頭部往下調整到45度角，有助於讓臀部維持在水面。
    source: SwimOutlet.com (2024). Common Breaststroke Mistakes.
    source_ids:
    - src.swimoutlet
  - certainty: 🟠
    text: 生物力學者 Rod Havriluk 明確把「蛙式換氣時不該改變頸部角度」列為技術誤區：有效的換氣動作需要頸部在完整活動範圍內伸展，而伸展的判準是下巴維持在水面高度，不是把整個頭抬離水面。他引 Jon Urbanchek 的說法形容錯誤版本像是「頸部和肩膀打了石膏」。使用邊界：這是專欄形式的生物力學論述，不是對照實驗；本庫先前把他的立場記反了（寫成「頭部隨脊柱移動而非獨立仰起」），2026-09-06 更正。
    source: 'Havriluk, R. (2017). Technique Misconceptions: Breaststroke and Butterfly Breathing Revisited. Swimming World.'
    source_ids:
    - src.havriluk-2017-breathing-misconceptions-revisited
  cross_ref: 內划（Insweep）、波動的雙重功能
  cross_ref_ids:
  - breast.tech.5
  - breast.tech.20
  correct_concept: 競技蛙式換氣應由 insweep 帶動的上胸前衝自然帶出，抬升方向是向前而非向上，眼睛看向水面前方（約45度角）而非直視對岸。頸部本身是要伸展的，判準是下巴停在水面高度——不是把頸部鎖死跟著脊柱走。
  perception_impact: 把頭往上拔（而非隨上胸向前送）會觸發頸部和上背張力，干擾整體流線感知。換氣時突發的感知遮蔽讓 L3–L4 的動作整合不穩定。
- id: breast.err8
  stroke: breast
  category: head
  title: 划手末段才抬頭換氣
  misconception: 部分教學說「等手划到肩膀附近才抬頭換氣」，或示範「手都划完了、準備前伸時才呼吸」。
  physical_reason:
    certainty: 🔵
    text: 手臂失去支撐後才換氣，頭部浮起的重量完全靠軀幹肌肉抵抗，臀部必然下沉。換氣應在 insweep 帶起上胸時自然發生（insweep 中段到後段），在手臂仍有支撐力的時候完成呼吸。
  evidence:
  - certainty: 🟠
    text: 換氣時機的常見錯誤是等到手已經在肩旁甚至腰部才吸氣，這時候手臂在水中沒有支撐，頭部出水後身體會快速下沉。
    source: Do You Know How To Swim Breaststroke? (Top 5 Most Common Breaststroke Mistakes). 360swim.
    source_ids:
    - src.360swim-common-breaststroke-mistakes
  - certainty: 🟠
    text: 換氣應在划手開始（outsweep展開時）就啟動，而不是等到結束才呼吸；當手臂仍在前方有支撐力的時候就開始吸氣，在手臂前伸時完成呼吸。
    source: Do You Know How To Swim Breaststroke? (Top 5 Most Common Breaststroke Mistakes). 360swim.
    source_ids:
    - src.360swim-common-breaststroke-mistakes
  cross_ref: 內划（Insweep）、手腳時序
  cross_ref_ids:
  - breast.tech.5
  - breast.tech.8
  correct_concept: 換氣應在 insweep 帶起上胸時自然發生（insweep 中段到後段），在手臂仍有支撐力的時候完成呼吸，並在手臂前伸時頭部跟著入水。
  perception_impact: 換氣時機太晚，學員感知到的是「頭沉、身體下墜、用力掙出水面」——這個掙扎感加深了換氣對感知系統的干擾，而非讓換氣融入推進節律（L4 需要的流暢整合）。
- id: breast.err9
  stroke: breast
  category: head
  title: 外划一開始就抬頭換氣是高效做法
  misconception: 部分傳統教材（尤其是1960年代前）或某些教練，在 outsweep 一開始就讓學員抬頭，認為這樣換氣時間充裕。
  physical_reason:
    certainty: 🟠
    text: outsweep 時手臂剛開始移動，尚未建立支撐力，此時頭部上抬等同於在最弱的時機增加重心上移負擔。過早抬頭等同於把推進力從水平方向轉為垂直方向，浪費 insweep 的動能。
    observation_basis: 觀察者為生物力學者 Rod Havriluk 在 Swimming World 的技術專欄（即下方 evidence 的來源），族群為競技蛙式泳者。外推邊界：Havriluk 的分析屬技術評論層，本條引用的是其時序判斷（抬頭時機相對於 outsweep），**不含任何力或時間的量測值**；「浪費 insweep 動能」是動量方向的推導，不是測到的能量損失比例。
  evidence:
  - certainty: 🟠
    text: 划手一開始時頭應維持在流線位置、視線朝正下方，一直到雙手進入視野範圍才開始抬頭——這個延遲大約四分之一秒，而到那個時間點手部已經產生約 10 磅的作用力，也就是說身體已經有支撐可以承接頭部上抬。使用邊界：四分之一秒與 10 磅是原文引用其手部測力量測給出的概數，不是本庫的獨立量測；本庫先前另外掛在此處的「外划換氣已不被現代頂尖選手使用」「停停走走的節奏」兩句，回原文查無，2026-09-06 刪除。
    source: 'Havriluk, R. (2020). Breaststroke Breathing: Head Timing Delay. Swimming World.'
    source_ids:
    - src.havriluk-2020-breaststroke-head-timing-delay
  cross_ref: 外划（Outsweep）、內划（Insweep）
  cross_ref_ids:
  - breast.tech.3
  - breast.tech.5
  correct_concept: 換氣應在 insweep 發動後再開始，讓上胸前衝自然帶動頭部出水。過早抬頭等同於把推進力從水平方向轉為垂直方向，浪費 insweep 的動能。
  perception_impact: 早期換氣破壞「insweep 前衝感帶出換氣」的感知連結，學員永遠感受不到「換氣是推進的副產品」這個 L4 的核心感知時刻。
- id: breast.err10
  stroke: breast
  category: timing
  title: 手腳可以同時動——同時划同時踢沒有問題
  misconception: 初學者和休閒游者最常出現「手腳同時動」的模式，而且這個模式常因為沒有明確糾正而持續，甚至有些初階教材沒有清楚說明為什麼不能同步。
  physical_reason:
    certainty: 🔵
    text: 手腳的推進階段必須交替發生：划手時腳保持流線，踢腳時手保持流線。如果手臂正在划水時腳在收回，或者腳在踢出時手臂在收回，就等於同時踩油門和踩煞車。手腳協調時序是蛙式效率最敏感的技術變數之一。
  evidence:
  - certainty: 🟠
    text: 划手發生在收腿期間會在你想加速的時候讓你減速；踢腿發生在收手期間也一樣。原文另指出手腳動作重疊「就像踩了煞車」——本庫把這兩句合併敘述為「同時踩油門和踩煞車」，油門那半是合併時的措辭，不是原文用字。
    source: U.S. Masters Swimming — Breaststroke Timing 指南
    source_ids:
    - src.usms-breaststroke-timing-guide
  - certainty: 🟢
    text: arm-leg coordination 時序與游速的相關性在各項技術指標中最高，是文獻中最有力支持「時機配合是蛙式效率最敏感變數」的直接證據。
    source: 'Nicol, E., Pearson, S., Saxby, D., Minahan, C., & Tor, E. (2022). Stroke Kinematics, Temporal Patterns, Neuromuscular Activity, Pacing and Kinetics in Elite Breaststroke Swimming: A Systematic Review. Sports Medicine - Open, 8(1), 75.'
    source_ids:
    - src.nicol-2022-breaststroke-systematic-review
  cross_ref: 手腳時序
  cross_ref_ids:
  - breast.tech.8
  correct_concept: 蛙式的核心原則是「划手時腳保持流線、踢腳時手保持流線」——手腳的推進階段必須交替發生，不能重疊。
  perception_impact: 手腳同時動時，每個推進的感知都被另一方向的阻力干擾，學員永遠無法感受到「單一推進完整的速度感」——L3 以上的推進感知建立的前提條件缺失。
- id: breast.err11
  stroke: breast
  category: timing
  title: 手完全前伸到底才能啟動踢腳
  misconception: 部分教練為了讓動作分段清楚，告訴學員「手完全伸直後，才開始準備踢腳」，造成學員在手臂前伸時完全停住等待，再啟動踢腳。
  physical_reason:
    certainty: 🔵
    text: 踢腳的收腿準備（上踢）在 insweep 末段就可以開始，踢腳發力在手臂前伸期間完成。手完全伸直後才啟動踢腳，等於讓身體有一段完全停頓的空窗，是競技上速度流失的主因。快速的競技蛙式甚至允許輕微的「重疊時機」，讓動能更連貫。
  evidence:
  - certainty: 🔵
    text: insweep 結束時開始上踢（腿部收回），讓腿部的向外踢和向內收發生在手臂前伸的期間——那是身體阻力最小的流線階段。
  - certainty: 🟠
    text: 在踢腳剛結束、腿部仍在流線狀態、還沒開始收腿時划手；在手臂收回完成後、划水之前踢腳。
    source: U.S. Masters Swimming — Breaststroke Timing 指南
    source_ids:
    - src.usms-breaststroke-timing-guide
  cross_ref: 技術分析 §2.3
  cross_ref_ids:
  - breast.tech.8
  - breast.tech.35
  correct_concept: 踢腳的收腿準備（上踢）在 insweep 末段就可以開始，踢腳發力在手臂前伸期間完成。手完全伸直後才啟動踢腳，等於讓身體有一段完全停頓的空窗，是競技上速度流失的主因。
  perception_impact: 「等手伸直才踢」讓學員把滑行空窗當成休息點，無法感知「動能連貫通過阻力最小點」的流線感。 L4 推進節律整合的前提條件缺失。
- id: breast.err12
  stroke: breast
  category: streamline
  title: 滑行越長代表技術越好、越省力
  misconception: 蛙式的 pull-glide-kick-glide 節奏讓許多教練強調「好好滑行、感受向前的力量」，並認為滑行越長代表技術越好；同時把這個節奏當成所有距離的標準。
  physical_reason:
    certainty: 🔵
    text: 滑行不是休息，而是讓推進力「繼續作用」的短暫慣性窗口。動力在選手停頓而非流暢銜接下一個划手時消散，一旦速度流失，選手就要用力氣而不是時機感來追回。過長的滑行代表速度流失再重建，是耗能的。適當滑行長度依情境而定：初學建立動作感可用明顯停頓滑行，競技衝刺應將滑行縮到最短以維持動能連貫。
  evidence:
  - certainty: 🟠
    text: 動力在選手停頓而非流暢銜接下一個划手時消散。一旦速度流失，選手就要用力氣而不是時機感來追回。
    source: 'How to Improve Breaststroke Momentum: 4 Coaching Fixes That Work. Swim Like A Fish.'
    source_ids:
    - src.swimlikeafish-breaststroke-momentum
  - certainty: 🟠
    text: 通常衝刺時滑行階段比長距離短；長距離游泳時滑行階段較長。
    source: Breaststroke. Wikipedia (English).
    source_ids:
    - src.wikipedia-breaststroke
  cross_ref: 流線型滑行（Glide）、最優滑行長度管理、蛙式的獨特性
  cross_ref_ids:
  - breast.tech.7
  - breast.tech.28
  - breast.tech.29
  correct_concept: 初學教學使用明顯滑行幫助建立動作感覺是合理的，但若將其當成所有情境的標準，反而讓進階選手的速度受限。滑行長短的判斷標準是「不流失動能」，不是追求優美感。
  perception_impact: 過度強調滑行讓學員把「停頓後的重新加速感」誤認為良好推進的感知特徵，而非感知「連貫動能通過阻力最小時間窗」的流暢感。L3–L4 推進感知的參照點建立錯誤。
- id: breast.err13
  stroke: breast
  category: head
  title: 抬頭越高吸氣越容易——把蛙式做成海豚式上下擺動
  misconception: 部分教練教「換氣時抬頭抬高一點才吸得到氣」，立意是確保學員不嗆水。執行端變成每次換氣都把頭抬到肩線以上、整個上半身往上翹，把蛙式做成類似海豚式的劇烈上下擺動，前進動能在垂直方向被浪費掉。
  physical_reason:
    certainty: 🟠
    text: 蛙式換氣的物理目標是「在內划（insweep）創造的上浮窗口快速吸一口氣」，不是「主動把頭抬出水面」。內划時手向身體中央方向收，產生向後下方的反作用力，自然把肩膀與頭部向前上方推——這個動量是「免費的」抬頭。如果額外主動抬頭，就是用核心肌力把頭頂出水（消耗能量），同時破壞 streamline、入水時要對抗向下分量、整個週期效率下降。菁英蛙式選手換氣時頭部抬升幅度通常只有眼睛剛出水面（甚至更低），靠下巴前送的姿勢吸氣，不靠抬高。
    observation_basis: 前半是力學推導：內划的反作用力方向本身就會把肩與頭往前上推，額外主動抬頭等於用核心肌力重複做同一件事並破壞流線——這部分不需要觀察支撐。後半「菁英蛙式選手換氣時頭部抬升幅度通常只有眼睛剛出水面、靠下巴前送吸氣」是描述性觀察，**本檔未記錄觀察者、樣本與量測方式**。外推邊界：該描述只作為「抬升幅度比多數人以為的小」的定性對照，不是目標高度，也不適用於仍在建立換氣信心的初學者——後者被要求壓低抬升幅度可能直接導致吸不到氣。
  cross_ref: 內划（Insweep）、過度強調波動
  cross_ref_ids:
  - breast.tech.5
  - breast.tech.26
  correct_concept: 換氣動作的感知目標是「跟著內划推力上來」，而不是「我要把頭抬多高」。頭部抬升幅度應該「剛好夠嘴出水吸氣」，不是更多。
  perception_impact: 「抬高」口令把感知放在「頭離水面多少公分」的位置監控，錯失了「內划推力與身體上浮對齊」的關鍵 coupling 感知。 L3–L4 蛙式 timing 感知建立會被這個錯誤口令阻擋。
- id: breast.err14
  stroke: breast
  category: kick
  title: 收腿要快、像彈簧反彈——增加阻力反而拖慢
  misconception: 部分教練教「收腿要快速、像彈簧把腳收回來」，立意是減少收腿期的滑行損失。但執行端造成快速收腿期間阻力暴增（膝蓋、大腿正面正對前進方向），反而比緩慢、放鬆的收腿浪費更多時間與動量。
  physical_reason:
    certainty: 🟠
    text: 收腿期是蛙式 stroke cycle 中阻力最大的瞬間——膝蓋與大腿從伸展位收向身體，正面投影面積大幅增加。快速收腿的「快」會放大這個阻力（阻力與速度平方成正比），反而比慢速放鬆收腿的減速更嚴重。菁英蛙式選手的收腿是「不主動加速、讓腿自然回收」的動作，速度遠慢於外划/內划/踢腿期——這個慢正是減阻策略。「快速收腿」的口令把蛙式時序最關鍵的「減速期」做反了。
    observation_basis: 核心論證是流體力學推導：收腿使正面投影面積大增，而阻力隨相對速度平方放大，因此「快速收腿」放大的是阻力而非效率——這一步不需要觀察支撐。「菁英選手的收腿是不主動加速、速度遠慢於外划／內划／踢腿期」是描述性觀察， **本檔未記錄觀察者與樣本**。外推邊界：本條不提供收腿的時間或角速度值；「慢」是相對於同一週期的其他相位而言，不是絕對慢——收腿過慢會拖長高阻力窗口，兩端都有代價，本條只否定「刻意加速」這個口令。
  cross_ref: 收腿
  cross_ref_ids:
  - breast.tech.10
  correct_concept: 收腿動作目標是「最小阻力路徑回到踢腿準備位」，速度應該是整個 stroke cycle 中最慢的。感知目標是「腿放鬆讓水把腿帶回來」，不是「主動快速收」。
  perception_impact: 「快」的口令鎖住感知，學員會用本體張力推動快速收腿，反而阻擋了「水把腿帶回來」的感知建立。蛙式 L4-L5 的核心感知（被動 vs 主動的時序判讀）會被這個口令阻擋。
- id: breast.err15
  stroke: breast
  category: pull
  title: insweep 時手肘要收緊貼身體——失去高肘 leverage
  misconception: 部分教練教「insweep 時手肘要收緊貼到身體」，立意是讓內划動作緊湊。但執行端造成手肘在內划期「掉下來」貼到身體側，失去了高肘 catch 的 leverage、推進力大幅下降。
  physical_reason:
    certainty: 🟠
    source_ids:
    - src.race-club-ch-18
    text: 蛙式 insweep 是整個 stroke cycle 推進力最大的相位（見 fly.tech.11 類似機制）。 insweep 推進的物理基礎是「高肘前臂橫掃水」——手肘必須維持在身體前方上方，讓前臂能像扇葉一樣向後推水。手肘掉下來貼身體時，前臂變成「直直向後推手掌」，失去高肘 leverage，推進力降到約 30-50% 之間（依肘位置而定）。菁英蛙式選手 insweep 時手肘明顯保持在「肩膀前方、不貼身體」的高位置——這需要訓練建立的核心穩定支撐。
    observation_basis: 觀察者為 The Race Club 第 18 章的技術教學素材與通用菁英影像，族群為競技蛙式泳者。外推邊界：「手肘保持在肩前高位」是可由影像確認的姿態描述；但「推進力降到約 30–50%」**沒有量測依據**——本庫未取得任何蛙式 insweep 的肘位置對推進力的測力數據，該區間只是幅度上的定性提示，不得引用為數值、不得再做運算或比較。
  evidence:
  - certainty: 🟠
    text: 菁英蛙式選手 insweep 影像分析：手肘在肩膀前方、不貼身體側
    source: Race Club Ch 18 / 通用菁英影像觀察
    source_ids:
    - src.race-club-ch-18
    observation_basis: 觀察者為 The Race Club 第 18 章素材與通用菁英水下影像，族群為競技蛙式泳者。外推邊界：這是姿態的有無判讀（肘在肩前 vs 貼身側），無角度或深度量測；成人初學與兒童因核心穩定不足常做不到此姿態，本條不可當成他們的教學指標。
  correct_concept: insweep 時手肘維持在肩膀前方、上方，前臂橫掃水（像扇葉），不是「手肘收緊推手掌」。感知目標是「前臂感覺水流」，不是「手肘有沒有到身體」。
  perception_impact: 「手肘收緊」口令把感知放在手肘位置監控，錯失了「前臂掃水的水壓感」這個 L4 蛙式核心感知。
  cross_ref: free.tech.9（EVF 通用原理）、fly.tech.11（Insweep 是最大推進）
  cross_ref_ids:
  - free.tech.9
  - fly.tech.11
- id: breast.err16
  stroke: breast
  category: undulation
  title: 蛙式波動越大越好——wave style 誤套到 flat style 選手
  misconception: 部分教練（受 wave-style 訓練影響）教所有人「蛙式要有大幅波動、髖部要上下擺動」，立意是建立菁英的 wave style。但執行端把 flat style 適合的選手（核心穩定/腰柔軟度差/體型較重）也強迫做波動，他們的波動會變成失控擺動，反而拖慢前進。
  physical_reason:
    certainty: 🟠
    text: 蛙式有兩大風格體系：① wave style（Adam Peaty、Kosuke Kitajima 等）強調髖部大幅波動，靠核心連動傳遞推進到上半身；② flat style（Mike Barrowman、Eddie Reese 教學體系）強調身體保持平直，靠強力推進相+短滑行刻劃距離。兩者都有奧運級代表選手，沒有絕對優劣。選擇取決於選手特性：腰椎柔軟度、核心控制能力、體型重心、肩柔軟度。要求所有人都做 wave style 等於要求柔軟度不足者做超出能力範圍的動作，造成腰椎過度伸展、髖節時序錯亂、整體效率下降。
    observation_basis: 兩大風格體系與其代表人物（Peaty／北島康介對 Barrowman／Eddie Reese 教學體系）是競技游泳界流通的分類共識，**本檔未記錄是誰做的分類、依據哪些比賽影像**；與 `breast.tech.16` 是同一個分類軸，該條把依據記在 Hall & Murphy 的 *Fundamentals of Fast Swimming*，本條可視為同源但未逐一對照。外推邊界：「兩者都有奧運級代表、沒有絕對優劣」是可觀察的事實陳述；但「選擇取決於腰椎柔軟度／核心控制／體型重心／肩柔軟度」這四項是機制推論， **沒有把泳者分派到某風格的效標或切點**，不得用來替學員指定風格。
  correct_concept: '蛙式風格選擇應該按選手特性評估：


    - 腰椎柔軟+核心強：wave style 適合

    - 腰椎硬+核心一般：flat style 適合

    - 體型重+短距：flat style 通常較好


    教學早期建立平直的 flat style 作為基礎，

    等選手進入專項訓練後再評估是否切換到 wave style。'
  perception_impact: 「波動越大越好」口令把感知放在「我波動有沒有夠大」的動作監控，錯失了「推進方向是否向前」這個結構性感知。強迫波動的選手會感受到「身體上下動但前進感變差」，但已經被口令鎖死無法調整。
- id: breast.err17
  stroke: breast
  category: head
  title: 水中先把氣全吐光再吸——破壞蛙式 stroke 內的連續呼吸節律
  misconception: 部分教練教「水中要先把氣全部吐光，等臉出水才吸」，立意是徹底排氣防嗆水。但執行端造成吐氣集中在很短的瞬間，破壞蛙式 stroke 內的連續呼吸節律，反而緊張嗆水。
  physical_reason:
    certainty: 🟠
    text: 蛙式的呼吸節律應該是「連續吐氣（從入水到下次出水）+ 快速短吸（內划上浮窗口）」，類似於自由式的 trickle exhale。「先吐光再吸」的口令把吐氣集中到出水前 0.2-0.3 秒，這個瞬間吐氣量需要肺部突然收縮——造成腹部緊繃、橫膈緊張、下一秒的快速吸氣機械上更困難，反而容易嗆水。連續吐氣讓肺內 CO2 持續排出，到吸氣窗口時肺已半空、一個快速短吸就足夠補回新鮮空氣。
    observation_basis: 全條是呼吸力學推導：把吐氣壓縮到出水前 0.2–0.3 秒需要肺與腹壁的突發收縮，會讓緊接著的快速吸氣在機械上更不利；連續吐氣則讓吸氣窗口開始時肺已半空。 **本檔未記錄任何觀察者或量測**——「0.2–0.3 秒」是對集中吐氣窗口的估計值，不是量到的數字。外推邊界：本條支撐的是吐氣**節律型態**（連續 vs 集中）的選擇，不支撐任何時間、氣量或頻率的處方；嗆水傾向與焦慮程度因人而異，換節律本身對初學者可能先變差再變好。
  correct_concept: 水中持續吐氣（細流式，不是憋住），內划上浮窗口快速短吸，不需要「先吐光」。感知目標是「吐氣的細流連續性」，不是「我有沒有吐光」。
  perception_impact: 「吐光」口令把感知放在「我吐了多少」的量化監控，錯失了「吐氣節律連續性」這個核心感知。 L0-L1 呼吸感知（FrBr3 連續涓流吐氣）建立會被這個口令阻擋。
  cross_ref: 自由式 FrBr3（連續涓流吐氣 drill）通用呼吸原則
  cross_ref_ids:
  - FrBr3
- id: fly.err1
  stroke: fly
  category: pull
  title: 水下划手應走鑰匙孔（Keyhole）或S形整條路徑
  misconception: 過去數十年，教練廣泛教導蝶式水下划手應走「鑰匙孔形（keyhole）」或「S形」路徑——手先向外，再拉進身體中線，最後向外推至大腿。許多教材至今仍將其列為標準。
  physical_reason:
    certainty: 🔵
    text: 現代生物力學分析與高速影像顯示，菁英選手的水下划手路徑比過去認為的更接近直線後推，刻意的鑰匙孔路徑增加橫向阻力並拉長外划時間。所謂「鑰匙孔」其實是手臂在三維空間移動加上軀幹起伏後的視覺副產品，而非刻意設計的手部路徑。insweep → upsweep 階段自然產生的小幅度弧線是正常現象，非技術目標，與整條路徑刻意走S形兩者不矛盾。
  evidence:
  - certainty: 🟠
    text: 強調直線後推（straight back pull），而非過時的「鑰匙孔」、「雪人」或「大-小-大」划法。使用邊界：出自 SwimSwam 一篇個人教學法投稿，屬教練意見；原文站點目前有付費牆，本庫僅能由檢索索引取得段落，未逐字覆核全文。
    source: My Golden Method for Teaching/Improving Butterfly. SwimSwam.
    source_ids:
    - src.swimswam-golden-method-butterfly
  - certainty: 🟠
    text: 近年競技游泳更傾向較直線的划手方式。
    source: Butterfly. Swimming Technique. Waterford Crystal Swimming Club.
    source_ids:
    - src.waterford-crystal-swimming-club
  cross_ref: 技術分析伍5.1（外划功能重建）；伍5.1 五階段划水
  cross_ref_ids:
  - fly.tech.12
  - fly.tech.13
  - fly.tech.14
  correct_concept: 水下划手以「EVF入水後直線加速後推」為目標。外划（outsweep）是定位動作，以最小幅度完成； S形是觀察角度造成的錯覺，不應刻意教導。
  perception_impact: 學員為了「畫出正確形狀」而產生的橫向移動感，會取代「後方推進感」，導致手感目標從「前臂鎖水→爆發推進」偏移至「手臂移動路徑控制」。
- id: fly.err2
  stroke: fly
  category: entry
  title: 蝶式雙手入水位置要靠近中線甚至額頭正前方
  misconception: 部分教練指示學員雙手入水位置靠近中線，甚至幾乎在額頭正前方入水，認為這樣能降低阻力或保持身體對稱。
  physical_reason:
    certainty: 🔵
    text: 正確入水點應在肩線延伸前方（11點與1點鐘位置）。入水過窄會讓捕水角度不良，直接影響 EVF 的建立。入水過窄還導致外划幅度過大（必須向外移動更多距離才能到達捕水位置），反而增加了外划的阻力代償。
  evidence:
  - certainty: 🟠
    text: 手部入水應略寬於肩膀——想像把雙手放在時鐘的 11 點與 1 點位置。手部應平整入水，水花極少。
    source: MySwimPro (2020). How To Swim Butterfly With Perfect Technique.
    source_ids:
    - src.myswimpro-2020-butterfly-technique
  cross_ref: 外划（Outsweep）功能重建、EVF（早期垂直前臂）在蝶式的實現路徑
  cross_ref_ids:
  - fly.tech.12
  - fly.tech.14
  correct_concept: 入水點約肩線寬度、手臂接近完全伸展，指尖朝前斜下切入。過窄入水會讓抓水失去力矩支撐，影響 EVF 品質。
  perception_impact: 入水過窄時，外划必須更費力，捕水感知建立被幹擾——學員感受到的是「外划的努力感」而非「捕水位置到達感」。
- id: fly.err3
  stroke: fly
  category: pull
  title: 蝶式划手要像蛙式一樣「向外掃—向內夾」
  misconception: 由於蝶式由蛙式演變而來，部分教材或教練用蛙式划手心法套用到蝶式，強調明顯的外掃→內夾路徑，讓學員把insweep理解成「兩臂在胸前夾合」。
  physical_reason:
    certainty: 🔵
    text: 蝶式的驅動力來源、身體位置與蛙式截然不同。「向外-向內」的刻意夾合路徑容易讓選手在水下浪費時間，破壞節奏，甚至增加肩膀壓力。蝶式外划的功能是定位（讓手臂到達 EVF 的起始位置），而非主動推進；兩者的身體位置與波動機制完全不同，教學語言不可混用。
  cross_ref: 外划（Outsweep）功能重建、五階段划水分析（外划→捕水→內划→上划→回臂）、蝶式 vs 蛙式
  cross_ref_ids:
  - fly.tech.12
  - fly.tech.13
  - fly.tech.33
  correct_concept: 蝶式划手重點在於 EVF 建立後的直線加速後推，結合蝶腰起伏的驅動。「外划輕，內划爆」是正確的感知目標，而不是「外掃-內夾」的路徑追蹤。
  perception_impact: 「向外掃、向內夾」的動作意識讓學員把注意力放在手臂路徑，錯失 insweep 加速時的「前臂推水爆發感」——這是 insweep 峰值推進力的感知核心。
- id: fly.err4
  stroke: fly
  category: recovery
  title: 蝶式回臂要高舉、大弧度、讓手臂遠離身體
  misconception: 部分教練要求學員蝶式回臂時手臂要高舉、向外大弧度揮出，認為這樣能讓入水點更前，或避免手臂碰到水面。
  physical_reason:
    certainty: 🔵
    text: 回臂過高或過大弧度會造成多餘的能量耗損，也讓三角肌承受不必要的主動抬臂負擔。正確的回臂依賴出水時的動量——若第二踢正確執行，髖部抬升後的慣性足以讓手臂「飛過」水面，不需要主動高舉。高舉回臂往往是第二踢品質不足的代償動作。
  evidence:
  - certainty: 🟠
    text: 菲爾普斯展示的標準動作是：手臂側展、小指朝上、拇指幾乎掠過水面。
    source: Melton Swimming (2012). Teaching the Butterfly Stroke.
    source_ids:
    - src.melton-swimming
  - certainty: 🟠
    text: 拇指拖曳 drill（thumb drag drill）可以幫助學員練習將手臂保持貼近水面回臂。
    source: Teaching Butterfly. Swim Smart.
    source_ids:
    - src.swim-smart
  cross_ref: 技術分析柒7.2 Recovery物理目標表；捌8 疲勞崩潰第二環
  cross_ref_ids:
  - fly.tech.20
  - fly.tech.22
  correct_concept: 回臂以最少阻力、最節能的方式將手臂帶回前方：低位側擺、小指側領先，接近掠水面。
  perception_impact: 高舉回臂讓學員習慣用「主動抬臂努力感」代替「被動動量飛越感」。回臂過度努力掩蓋了第二踢的助力感知，形成惡性循環。
- id: fly.err5
  stroke: fly
  category: timing
  title: 競賽規則要求雙臂對稱，所以力道與時機也必須完全一致
  misconception: 「蝶式雙臂必須完全對稱」的競賽規則常被誤解為技術上也要求雙臂力道與時機完全一致，教練據此糾正任何不對稱的外觀。
  physical_reason:
    certainty: 🔵
    text: 競賽規則要求的是雙臂「同時入水」，而非力道或幅度的完全一致。在生物力學層面，個別選手因慣用手差異、肩膀柔軟度差異，雙側略有不對稱是自然現象。強迫視覺對稱反而可能讓弱側肩膀過度補償而受傷。
  cross_ref: 出水順序與空中恢復（Recovery）的物理目標、一個完整划手週期的閉環連動地圖
  cross_ref_ids:
  - fly.tech.20
  - fly.tech.10
  correct_concept: 教學重點應放在節奏與入水時機，而非鏡像對稱的外觀。雙臂微小的功能不對稱在菁英選手中也廣泛存在，是正常現象而非需要矯正的錯誤。
  perception_impact: 追求視覺對稱的學員往往用弱側「等待」強側，破壞節律感知的建立。注意力被外部對稱形狀佔據，而非內在節律感。
- id: fly.err6
  stroke: fly
  category: kick
  title: 先教蝶腿，掌握海豚踢後再整合其他動作
  misconception: 許多教練認為蝶腿是蝶式的基礎，主張先讓學員掌握海豚踢，再逐步加入上肢與呼吸。
  physical_reason:
    certainty: 🔵
    text: 蝶式的能量主要集中在第一正弦諧波（H1），從髖傳到踝的過程中振幅逐節增大。腳踢的力量不是從腿「發出」的，而是整個身體波動「傳到」腳的。若先建立孤立的海豚踢，學員會把踢腿當成主動發力點，阻斷波動傳遞鏈。
  evidence:
  - certainty: 🟠
    text: 先教腿再教全身的學員，較常出現膝蓋過度彎曲、臀部幾乎沒有起伏，結果只是小腿在水面上拍打，對整個划法有害無益。
    observation_basis: 本專案教學現場觀察（初學至進階蝶式學員，兒童與成人皆有），未量化統計。外推邊界：只描述「先建立孤立踢腿」這種教學順序下的傾向，不是所有踢腿練習都會如此；已能做出全身波動的學員做分解踢腿不在此列。此條原標註引用 swim-teach.com 並宣稱「超過40年的英國游泳教學經驗」—— 2026-09-06 逐頁取回該站四篇（butterfly-stroke-body-movement／butterfly-stroke-kick／ breaststroke-timing／how-to-swim-breaststroke），四篇皆無此教學順序主張，且作者 Mark Young 自述為「over 30 years」而非 40 年，年數與主張都無出處，故撤下引用改列觀察。
  - certainty: 🟠
    text: 腿的動作應是身體起伏（undulation）的結果，而非原因。
    source: Cocozza, L. Undulation Technique to Improve Your Butterfly Stroke. Swimming Science.
    source_ids:
    - src.swimming-science-livio-cocozza
    caveat: 來源只支持「腿是起伏的結果」這個方向；「要等全身波動流暢後才加入腿的主動施力」是本專案自己的教學順序推論，不是該文的主張。
  - certainty: 🟡
    text: 蝶式的能量主要集中在第一正弦諧波（H1），從髖傳到踝的過程中振幅逐節增大。
    source: Sanders, Cappaert & Devlin (1995). Biomechanics of butterfly. J Appl Biomech
    source_ids:
    - src.sanders-1995-a
  cross_ref: 技術分析貳2.1 波動vs擺動；貳2.2 完整動力傳遞鏈
  cross_ref_ids:
  - fly.tech.3
  - fly.tech.4
  correct_concept: 先建立頭→胸→臀的波動感（undulation），腿自然跟上。蝶腿是波動傳遞鏈的「終點加速器」，不是波動的起點。
  perception_impact: 先教踢腿導致學員建立「腿部主動用力感」，而非「波動傳遞到腿末端的加速感」。兩者是完全不同的感知目標——前者關注腿的出力，後者關注整條身體波動的貫穿感。
- id: fly.err7
  stroke: fly
  category: kick
  title: 蝶腿要踢大一點才有力
  misconception: 常聽到教練喊「腿踢大一點！」，認為踢的幅度越大，推進力越強。
  physical_reason:
    certainty: 🔵
    text: 蝶腿的有效推進來自踝關節柔軟度加上膝蓋適度彎曲後的鞭打伸展，而非靠大幅上下動作。踝關節蹠屈柔韌性是蝶腿推進的「硬體上限」——踢幅越大，阻力越大，但推進力並不因此增加。踢幅大小與推進效率是倒U形關係，有效區間遠比多數初學者認為的小。
  evidence:
  - certainty: 🟠
    text: 踢腿幅度太大會造成極大阻力，消耗大量能量。踢腿應緊湊有力，膝蓋彎曲程度不需過大。
    source: Daly, D. (2026). How to Swim Butterfly with Speed and Power. Train Daly.
    source_ids:
    - src.train-daly
  - certainty: 🟠
    text: 過度起伏造成游泳者動作緩慢、深沉且低效，同樣容易讓游泳者很快疲勞。
    observation_basis: 本專案教學現場觀察（蝶式學員，兒童與成人皆有），未量化統計。外推邊界：指的是起伏大到把力氣用在上下移動而非前進的情況，不是所有起伏都算過度；正在建立波動感的初學者短暫出現大幅起伏屬於過程，不列入此判斷。此條原標註引用 EatSleepSwimCoach，2026-09-06 取回該站唯一一篇蝶式教學文全文核對，全篇沒有這句話、也沒有討論過度起伏的負面效果，站上亦無其他候選文章，故撤下引用改列觀察。
  cross_ref: 技術分析拾壹11.1（踝關節蹠屈柔韌性）
  cross_ref_ids:
  - fly.tech.24
  correct_concept: 緊湊有力的踢腿，靠踝關節柔韌度的鞭打效應輸出推進力。
  perception_impact: 大幅度踢腿讓學員把「移動幅度感」誤認為「推進力感」——感知到的是「我踢很大」，感知不到的是「腳尖的加速鞭打感」。
- id: fly.err8
  stroke: fly
  category: kick
  title: 流線型手臂貼側的海豚踢等同蝶式踢腿訓練
  misconception: 教練讓選手做手臂貼側的流線型海豚踢（aquaman drill / streamline dolphin kick），當作蝶腿訓練的主要手段。
  physical_reason:
    certainty: 🔵
    text: 流線型海豚踢與蝶式踢腿在時機結構上根本不同：流線型只有一種踢的功能，而蝶式有第一踢（Wave Trigger，波動啟動）和第二踢（Wave Harvest，推進收割）兩種功能完全不對稱的踢。大量練習流線型海豚踢，並不能直接轉化成正確的兩踢時機。
  evidence:
  - certainty: 🟠
    text: 在真正游蝶式時，頭朝下時對應一下踢，頭朝上時對應另一下踢。但在手臂貼側的海豚踢中，每一下踢都是在頭下壓時發生的——這和蝶式裡兩下踢的時機完全不同。
    source: Coach Gary (2022). Are You Training Dolphin Kick? Or Butterfly Kick? swimcoachingblog.
    source_ids:
    - src.swimcoachingblog-com
  cross_ref: 技術分析參3.1-3.3 兩踢功能不對稱矩陣
  cross_ref_ids:
  - fly.tech.6
  - fly.tech.7
  - fly.tech.8
  correct_concept: 蝶式訓練中，應盡量讓蝶腿練習保留正確的兩踢時機結構（第一踢配合入水、第二踢配合 upsweep）。流線型海豚踢是踝關節柔韌度訓練，不是蝶式技術訓練。
  perception_impact: 用流線型海豚踢建立的踢腿感知，缺少「第二踢是要抬起臀部讓手臂飛出去」的功能感——當融入全式後，第二踢的力量感和時機感完全無法遷移。
- id: fly.err9
  stroke: fly
  category: timing
  title: 第二踢在手臂離水時發生
  misconception: 教練常用「kick the hands in, kick the hands out（踢手入水、踢手出水）」作為兩踢時機的口訣。「踢手出水」這個描述廣泛流傳。
  physical_reason:
    certainty: 🔵
    text: 第二踢（Exit Kick）與 Upsweep 同步——是「雙臂加速向後向上推、通過腹部下方時」啟動，而非等到手臂已離水。若第二踢時機太晚，手臂必須靠背部肌肉主動拉出水，既費力又破壞節律。
  evidence:
  - certainty: 🟠
    text: 這個說法雖然是個好的起點，但並不完全正確。第二下踢應該在手肘開始伸展之前、雙手通過肚臍位置時發生——比手臂出水更早。
    source: 'Part II: Focus on Your Second Dolphin Kick. Swim Like A Fish.'
    source_ids:
    - src.swimlikeafish-second-dolphin-kick
  cross_ref: 技術分析參3.2 第二踢；肆4 連動鏈閉環
  cross_ref_ids:
  - fly.tech.8
  - fly.tech.10
  correct_concept: 第二踢的正確時機是划手末段、手經過肚臍附近時啟動，目的是助推手臂越過水面完成輕鬆回臂，而非等到手已出水才踢。
  perception_impact: 時機偏晚的第二踢，讓學員習慣「踢腿→然後費力拉手出水」的順序感知，正確動作應該是「踢腿→手臂被彈出」的感知——兩者體感截然不同。
- id: fly.err10
  stroke: fly
  category: undulation
  title: 蝶式起伏幅度越大越好、越像海豚越好
  misconception: 許多教練見到學員蝶式起伏不足，直接要求「多波浪、多起伏、身體要像海豚一樣」，把大幅度起伏視為技術目標。
  physical_reason:
    certainty: 🔵
    text: 50m衝刺的蝶式波動幅度比200m更小——菲爾普斯本人是「低起伏但高效」的代表。起伏的目的是讓能量從頭→胸→臀→腿順利傳遞，重點是節奏流暢、方向向前，而非追求視覺上的大波浪。起伏過大是技術錯誤，不應鼓勵。
  evidence:
  - certainty: 🟠
    text: 起伏太大造成游泳者把力氣花在上下移動而非向前，這是最常見的錯誤之一。
    source: Young, M. Butterfly Stroke Body Movement Begins At The Head. Swim Teach.
    source_ids:
    - src.swim-teach-com
  - certainty: 🟠
    text: 起伏幅度應該適中。垂直方向的動作過多會增加阻力、削減前進動能。
    source: Daly, D. (2026). How to Swim Butterfly with Speed and Power. Train Daly.
    source_ids:
    - src.train-daly
  cross_ref: 技術分析貳2.3 幅度vs頻率策略表；拾壹11.3 不同距離技術差異化
  cross_ref_ids:
  - fly.tech.5
  - fly.tech.30
  correct_concept: 適中且向前的起伏。每個距離對應不同的適當幅度，50m衝刺幅度較小，200m幅度可略大。
  perception_impact: 「大幅度波浪感」被建立成目標後，學員會把「上下移動感」誤認為「向前推進感」，在疲勞時更傾向增加幅度（實際上這是最快消耗能量的方式）。
- id: fly.err11
  stroke: fly
  category: undulation
  title: 蝶式起伏是靠臀部主動上下來驅動的
  misconception: 一些教學要求選手意識放在「臀部上下動」，認為髖部的主動上下是起伏的驅動源頭。
  physical_reason:
    certainty: 🔵
    text: 胸/下肋是「波動起點（Wave Origin）」，髖部是「波動放大器（Wave Amplifier）」——髖部是接收傳遞的中繼點，而非主動的發力源。真正的波動觸發需要頭部加上胸部的協同下壓。起伏是由胸部與臀部輪替的下壓/釋放動作共同驅動，而非臀部單獨主動上下。
  evidence:
  - certainty: 🟠
    text: 許多人普遍認為身體起伏主要是靠臀部上下動所驅動——其實不然。起伏是由胸部與臀部輪替的下壓/釋放動作共同驅動。
    source: 'Keller, C. (2021). Butterfly Swimming Technique: The Body Undulation. Enjoy Swimming.'
    source_ids:
    - src.keller-enjoyswimming-butterfly-undulation
  - certainty: 🟠
    text: 起伏從頭部開始，像波浪般向下傳遞，帶動核心、背部、臀部與強壯的腿部肌群，最後以腳尖的鞭打動作收尾。（同一機構的另外兩篇把起點寫在肋廓下緣或核心軀幹，起點歸屬在該機構內部並未統一。）
    source: Fish, A. (2025). What Your Hips Need to Do While You Swim Butterfly. U.S. Masters Swimming.
    source_ids:
    - src.usms-fish-2025-butterfly-hips
  - certainty: 🟡
    text: 胸部是波動起點，髖部為波動放大器，能量從頭部向下傳遞至踝。
    source: Sanders, Cappaert & Devlin (1995). Biomechanics of butterfly. J Appl Biomech
    source_ids:
    - src.sanders-1995-a
  cross_ref: 技術分析貳2.2 動力傳遞鏈；陸6.1 低頭：波動觸發器
  cross_ref_ids:
  - fly.tech.4
  - fly.tech.16
  correct_concept: 起伏的啟動點是頭部下壓帶動胸骨下壓，臀部隨後跟上升高。教學口令「壓胸起波」比「臀部上下動」更精確。
  perception_impact: 注意力集中在臀部的學員，會建立「髖部主動上下的努力感」，而感知不到「波動從胸部傳遞到腿尖的連貫感」——後者是蝶式感知整合的核心目標。
- id: fly.err12
  stroke: fly
  category: head
  title: 蝶式換氣時頭要往上抬高、眼睛看前方
  misconception: 傳統教學幾乎一律要求蝶式換氣時頭部往上抬，眼睛看正前方，讓嘴巴離水面夠高才算換氣正確。
  physical_reason:
    certainty: 🔵
    text: 向上換氣（head up）會讓頸椎後仰、頸肌主動收縮，導致連動鏈在此環斷裂，髖部強制下沉，正面阻力大幅上升。法國研究者 CFD 模擬確認頭部位置改變會顯著改變泳者周圍的尾流結構。把頭頸這一段質量垂直抬離水面，反作用力必須由手臂下壓或踢腿去抵消，那是純粹的能量支出，不產生任何前進。
  evidence:
  - certainty: 🟠
    text: 頭部過度上抬會讓臀部下沉、阻力增大，游泳者基本上是在往上游而非往前游。菲爾普斯的頭部在換氣與不換氣時幾乎完全沒有移動——他的中性頭位就是最好的示範。
    source: McBride, N. (2009). Teaching Masters to Master the Butterfly. U.S. Masters Swimming.
    source_ids:
    - src.usms-masters-teaching-article
  - certainty: 🟡
    text: 頭頸段的質量約占全身體重的 8.1%（Winter 的人體測量表 Table 4.1，頭與頸合併計算）， 70 公斤的成人約 5.7 公斤。這就是抬頭換氣時必須被抵消掉的那一塊。這是平均比例、用來估量級，不是個體實測值。
    source: Winter, D. A. (2009). Biomechanics and Motor Control of Human Movement (4th ed.), Table 4.1. Wiley.
    source_ids:
    - src.winter-2009-biomechanics-anthropometric-table
  - certainty: 🟡
    text: Rushall（1996）以同一個機制反對傳統向前換氣：抬頭的反作用力必須由手臂或踢腿的向下分力抵消，非常耗能。機制成立，但他文中寫的「成人頭部至少 7 公斤」不要照抄——原文沒有附任何量測出處，而且高於人體測量表：7 公斤要體重 86 公斤以上的成人才成立，那還是頭頸合計。這篇是他自編自行發行的教練通訊，不是同行評審文獻。
    source: Rushall, B. S. (1996). Breathing actions in butterfly swimming. Carlile Coaches' Forum, 2(6).
    source_ids:
    - src.rushall-1996-butterfly-breathing-actions
  cross_ref: 技術分析陸6.2 抬頭呼吸；陸6.3 完整呼吸時序；捌8 疲勞崩潰第三環
  cross_ref_ids:
  - fly.tech.17
  - fly.tech.18
  - fly.tech.22
  correct_concept: 換氣時頭部應向前方延伸（chin forward, not up），下巴幾乎貼近水面——「chin rider / chin skimmer」技術。這樣能保持身體更平坦、阻力更小，頭部回水的速度也更快。
  perception_impact: 「往上抬頭換氣」導致學員把「頸部後仰感」誤認為換氣完成的標誌。正確換氣應感知到「下巴向前穿出水面、身體線條保持平坦」——頸部張力在正確換氣中應幾乎不存在。
- id: fly.err13
  stroke: fly
  category: head
  title: 蝶式只能向正前方換氣，側向換氣不規範
  misconception: 許多教練認為蝶式的對稱性規則要求換氣必須向正前方，側向換氣是「不規範」甚至「犯規」的做法。
  physical_reason:
    certainty: 🔵
    text: 蝶式競賽規則要求的是「雙臂同時出水並同時入水」，換氣方向並沒有限制。側向換氣讓頭部保持更靠近水面，臀部不易下沉，身體起伏更流暢，正面與波浪阻力大幅降低。
  evidence:
  - certainty: 🟠
    text: Mel Stewart 以側向換氣在 1992 年奧運 200 公尺蝶式奪金。原文的論點止於：對前方換氣配合不良起伏的人，側向換氣能換到更接近流線的姿勢。「頭部更靠近水面、臀部不易下沉」是本庫的推導（見上方 🔵），不在原文裡。
    source: Lassen, M. (2018). Breathing Easy to the Side on Butterfly. U.S. Masters Swimming.
    source_ids:
    - src.usms-lassen-2018-butterfly-side-breathing
  - certainty: 🟡
    text: Rushall（1996）主張側向換氣優於傳統向前換氣：在水線以下換氣讓頭部幾乎不必移動，省下手臂與踢腿的抵消成本，也降低正面與波浪阻力。要注意同一篇也寫側向換氣「未完全符合蝶式規則」而裁判予以容忍——那是 1996 年當時對對稱性規則的詮釋，不是現行規則（現行規則只規範雙臂同時出水與入水，見上方物理原因），不可拿 1996 年的描述當現況讀。
    source: Rushall, B. S. (1996). Breathing actions in butterfly swimming. Carlile Coaches' Forum, 2(6).
    source_ids:
    - src.rushall-1996-butterfly-breathing-actions
  cross_ref: 呼吸方向、頭部雙重角色
  cross_ref_ids:
  - fly.tech.17
  - fly.tech.16
  correct_concept: 側向換氣是合法且在某些情境更節能的替代方案，特別適合肩頸柔軟度不足或疲勞管理需求較高的選手。不應被教練先入為主地否定或禁止。
  perception_impact: 若強制使用正前方換氣（而個人解剖條件更適合側向），換氣時會建立「強制抬頭—張力代償」的感知模式，難以感知波動鏈的連貫性。
- id: fly.err14
  stroke: fly
  category: head
  title: 蝶式每下必換氣，或每兩下才能換一次，是固定標準
  misconception: 部分教練設定固定換氣頻率為「標準」——有人規定「每下必換」，也有人規定「每兩下才換一次」，並要求學員照此執行，認為偏離就是技術問題。
  physical_reason:
    certainty: 🔵
    text: 不同距離的呼吸策略差異顯著——50m可以幾乎不換氣，200m後半段需每划換氣。固定頻率的教學掩蓋了這個情境依賴性。精英選手的換氣策略因距離和個人而異，沒有一個固定答案。
  evidence:
  - certainty: 🟠
    text: 換氣頻率應根據選手個人、游泳距離和體力狀況來決定，沒有一個固定答案。
    source: Keller, C. How to Breathe while Swimming Butterfly. Enjoy Swimming.
    source_ids:
    - src.keller-enjoyswimming-butterfly-breathing
  cross_ref: 技術分析拾壹11.3 不同距離技術差異化
  cross_ref_ids:
  - fly.tech.30
  correct_concept: 換氣頻率應配合比賽距離、個人體能與技術水平彈性調整。教練的職責是幫助選手建立感知自己「何時需要換氣」的能力，而非套用固定公式。
  perception_impact: 固定換氣規則阻止了「節律自我調節感知」的發展——學員應建立「在正確的波動視窗感知換氣時機」的能力，而非遵守外部計數規則。
- id: fly.err15
  stroke: fly
  category: entry
  title: 入水手指先入、手腕折下——破壞高肘設定造成 EVF 早期崩潰
  misconception: 部分教練教蝶式入水時「手指先入、手腕往下彎讓手指撥開水」，立意是「乾淨入水減少阻力」。但執行端造成手腕過度屈曲，入水後手腕鎖在彎曲位、無法接續做出高肘 EVF，反而把整個拉水週期的最大推進相（Insweep）的設定鎖死。
  physical_reason:
    certainty: 🟠
    text: 蝶式入水後立刻要進入捕水→Insweep 的高肘狀態。手腕折下造成兩個連鎖問題：① 手腕屈曲位置無法快速翻回高肘所需的「手腕中性」狀態； ② 入水瞬間的橫向力造成手肘略內收（自然反射），EVF 設定變得更困難。菁英蝶式選手入水時手腕保持中性、手掌與前臂在同一平面，入水後手腕、肘、肩線順勢進入 EVF 設定——這需要手腕從一開始就不折下。「乾淨入水」的目標應該透過「手掌成扁平面、平行入水」達成，不是「手指先入」。
    observation_basis: 兩項連鎖問題（屈曲位手腕無法快速翻回中性、入水橫向力引發肘內收反射）是解剖與力學推導。「菁英蝶式選手入水時手腕保持中性、手掌與前臂同平面」是描述性觀察， **本檔未記錄觀察者、樣本與量測方式**。外推邊界：本條不提供手腕角度值；「手指先入」被否定的是它作為**目標口令**的效果，不是說手指先觸水本身有害——乾淨入水與手腕中性可以並存，本條主張的是用「手掌成扁平面、平行入水」替換口令。
  cross_ref: EVF（早期垂直前臂）在蝶式的實現路徑、入水停頓機制
  cross_ref_ids:
  - fly.tech.14
  - fly.tech.21
  correct_concept: 入水手腕保持中性（直），手掌平面與水面平行接觸——像把手放下接觸桌面，不是用手指戳水。這樣入水後手腕、前臂、肘可直接接續做 EVF 高肘設定。
  perception_impact: 手腕折下的口令把感知焦點放在「手指有沒有先入」的入水形式，錯失了「入水後手腕能否接續高肘」的功能性目標。正確的感知是「入水後手腕仍有自由度做下一個動作」。
- id: fly.err16
  stroke: fly
  category: entry
  title: 入水越深、起手越輕鬆
  misconception: 部分教練教「入水越深越好，這樣起手時水阻小、感覺輕鬆」，立意是減少水中拉手的負擔。但深入水把「往下的衝量」傳到身體，造成下沉、往下推進向量損失、出水阻力反而上升。
  physical_reason:
    certainty: 🟠
    text: 蝶式入水後的最佳路徑是「橫向滑入水→立刻 outsweep → catch → Insweep」，身體保持接近水面、波動向前推進。入水太深時：① 衝量的垂直分量大、身體下沉、出水時要對抗額外向上分量； ② 進入捕水的初始位置太低、無法做出「向後推」的有效角度； ③ Insweep 的推進向量被身體姿勢偏離。菁英蝶式選手入水深度約 15-25 cm，不是「越深越好」。「起手輕鬆」是錯誤的感覺指標——應該感覺「水流順著手往後」，不是「水阻小」。
    observation_basis: 三項代價（垂直分量、捕水初始位置過低、推進向量偏離）是力學推導，不需觀察支撐。「菁英蝶式選手入水深度約 15–25 cm」則**沒有任何來源**—— 2026-09-04 以五組關鍵字查 PubMed（butterfly hand entry depth／underwater hand path／ arm stroke kinematics 等），找不到報告入水深度公分值的文獻，判為研究空白而非檢索失敗。外推邊界：**該區間在追到來源前不得引用為目標值**，本條可用的只有「入水過深會付出上述三項代價」與「『起手輕鬆』是錯誤的感覺指標」兩點；後者是感知判讀，屬教學經驗，本檔亦未記錄觀察者。
  cross_ref: 入水停頓機制、外划（Outsweep）功能重建
  cross_ref_ids:
  - fly.tech.21
  - fly.tech.12
  correct_concept: 入水深度目標約 15-25 cm，手掌入水後接續做 outsweep + catch，不是繼續往下深入。感知指標是「身體前進方向的水流順暢」，不是「拉水輕鬆度」。
  perception_impact: 「越深越輕鬆」口令把感知放在「拉水負擔感」，錯失了「身體與水流前後方向對齊」的關鍵感知。蝶式真正的省力來自波動連貫，不是減少抓水深度。
- id: udk.err1
  stroke: udk
  category: kick
  title: 踢的幅度越大，推進力越強
  misconception: 教練常喊「腿踢大一點！」，認為踢的範圍越大推進力越強，或看到學員踢幅小就指正。許多初學者也直覺認為「動作大＝力量大」。
  physical_reason:
    certainty: 🟢
    text: 系統回顧研究指出，競技選手的有效踢幅約為身長的 0.2–0.3 倍，與魚類的最優推進比例相符。超過這個範圍後，身體截面積增大、阻力急劇上升，核心需要額外力量對抗側向晃動，效率下降。
    source_ids:
    - src.veiga-2022
  evidence:
  - certainty: 🟢
    text: 競技選手有效踢幅約為身長的 0.2–0.3 倍，與魚類最優推進比例相符。
    source: Veiga et al. 2022 systematic review
    source_ids:
    - src.veiga-2022
  - certainty: 🟠
    text: 踢腿幅度太大會造成極大阻力，消耗大量能量。踢腿應緊湊有力，膝蓋彎曲程度不需過大。
    source: Daly, D. (2026). How to Swim Butterfly with Speed and Power. Train Daly.
    source_ids:
    - src.train-daly
  - certainty: 🟠
    text: 過度起伏造成游泳者動作緩慢、深沉且低效，同樣容易讓游泳者很快疲勞。
    observation_basis: 本專案教學現場觀察（蝶式學員，兒童與成人皆有），未量化統計。外推邊界：指的是起伏大到把力氣用在上下移動而非前進的情況，不是所有起伏都算過度；正在建立波動感的初學者短暫出現大幅起伏屬於過程，不列入此判斷。此條原標註引用 EatSleepSwimCoach，2026-09-06 取回該站唯一一篇蝶式教學文全文核對，全篇沒有這句話、也沒有討論過度起伏的負面效果，站上亦無其他候選文章，故撤下引用改列觀察。
  - certainty: 🟠
    text: Dressel、Gretchen Walsh 等頂尖選手確實使用較大振幅，但他們的超強核心控制讓推進力能超過額外阻力——這是建立在極高的核心整合能力之上，不是通用法則。
    source: Poirier-Leroy, O. 3 Things Swimmers Can Learn from Gretchen Walsh's Underwater Dolphin Kick. YourSwimLog.
    source_ids:
    - src.yourswimlog-gretchen-walsh-udk
  cross_ref: 強迫提高踢頻不提升速度，振幅自動補償、UDK 是全身波動，不是腿部踢水
  cross_ref_ids:
  - udk.tech.13
  - udk.tech.4
  correct_concept: 踢幅以「保持在身體輪廓線內」為原則。有效推進力來自踝關節柔韌性與上踢速度，而非幅度大小。
  perception_impact: 大踢幅讓學員把「動作幅度感」誤認為「推進力感」——感知到的是「我踢了很大一下」，而非「腳尖加速鞭打的爆發感」。兩者是完全不同的感知目標。
- id: udk.err2
  stroke: udk
  category: kick
  title: 踢腿應從大腿或膝蓋主動發力
  misconception: 許多教練在教 UDK 時，指導學員「用腿踢水」或「膝蓋彎曲再踢直」，把動作的啟動點放在膝蓋或大腿。
  physical_reason:
    certainty: 🔵
    text: 正確的力量鏈是從髖部啟動，能量向下傳導至膝蓋、踝關節、腳尖。「從膝蓋發力」等於跳過了髖部的起始驅動，讓踝關節鞭打失去近端的力量支撐。此外，過度膝蓋彎曲增加身體截面積，在下踢啟動之前就已產生阻力。
  evidence:
  - certainty: 🟠
    text: 海豚踢最主要的減速來源，是下踢之前的膝蓋彎曲量。
    source: The Race Club — More on the Dolphin Kick
    source_ids:
    - src.the-race-club-dolphin-kick-deceleration
  - certainty: 🟠
    text: 從髖部啟動踢腿，波動才會傳過整個身體，海豚踢因此更快也更省力；發力點放在膝蓋則失去這條傳遞。
    source: 'Novikov, D. Mastering the Dolphin Kick: Techniques for Effortless Speed. DanSwim.'
    source_ids:
    - src.danswim
  cross_ref: UDK 是全身波動，不是腿部踢水、下踢力學序列與膝蓋彎曲的核心矛盾
  cross_ref_ids:
  - udk.tech.4
  - udk.tech.9
  correct_concept: UDK 的啟動點在髖部，核心肌群（腹肌、下背）提供穩定平台，力量通過波動傳遞到腳尖。「從髖部開始、腳踝鞭打結束」是正確的力量鏈描述。
  perception_impact: 「膝蓋發力感」是最常見的感知誤植——學員感受到的是「大腿前側在用力」，感知不到的是「髖→膝→踝→腳尖的波動傳遞感」。
- id: udk.err3
  stroke: udk
  category: kick
  title: 上踢只是回復動作，推進力來自下踢
  misconception: 蝶式教學中下踢功能比上踢明確，導致許多教練將 UDK 訓練也集中在下踢的力量，把上踢視為「回復動作」，認為上踢只是為了回到下踢的起始位置。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.atkison-2014-a
    - src.arellano
    text: 學術文獻直接指出：下踢腳尖速度與上踢腳尖速度的比值，與水平游速呈顯著負相關——相對上踢越強的選手，水下速度越快。上踢縮短時間能增加踢頻、減少阻力姿勢的持續時間，且上踢本身也能產生推進力（尤其在高速下，水流回收效應讓上踢利用下踢製造的渦流）。
  evidence:
  - certainty: 🟢
    text: 下踢腳尖速度 / 上踢腳尖速度的比值，與水平游速呈顯著負相關——相對上踢越強的選手，水下速度越快。
    source: Atkison et al. 2014
    source_ids:
    - src.atkison-2014-a
    url: https://pubmed.ncbi.nlm.nih.gov/24290609/
  - certainty: 🟢
    text: 上踢本身在高速下也能利用下踢製造的渦流產生推進力。
    source: Arellano 2013; ScienceDaily 2024
    source_ids:
    - src.arellano
  - certainty: 🟠
    text: 快速上踢是提升海豚踢最有效的投資之一——它讓你在推進相待得更久，減少阻力，並提升整個踢腿循環的流動感。
    source: YourSwimLog
    source_ids:
    - src.yourswimlog-a
  cross_ref: 上踢是 UDK 速度的關鍵預測變數、踢腿對稱性（Sagittal Kick Symmetry）、下踢→上踢過渡的渦流回收（Vortex Recapture）
  cross_ref_ids:
  - udk.tech.10
  - udk.tech.12
  - udk.tech.7
  correct_concept: UDK 的目標是踢腿對稱性（sagittal kick symmetry）——上踢與下踢各自高效，而非只強化下踢。上踢速度是 UDK 效率的關鍵預測變數。
  perception_impact: 「下踢爆發→上踢放鬆等待」的感知節奏，讓學員建立不對稱的踢腿感知地圖。正確感知目標是「兩個方向都有加速感」，而非一半推進、一半等待。
- id: udk.err4
  stroke: udk
  category: tempo
  title: 強迫提高踢頻才能提升水下速度
  misconception: 教練常認為踢得越快游得越快，在訓練中要求選手盡量提高踢腿頻率，甚至用節拍器強制提速。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.pmid-28605694
    text: 強迫加快踢頻時，振幅自動縮小；振幅縮小帶來的推進力損失剛好抵消頻率增加的收益，結果速度不變但更耗力。研究實測顯示，Froude 效率從 0.72 降至 0.70，肌肉共收縮相增加，代謝負擔上升。最優踢頻是個體特異的，受身體形態、踝關節柔韌性、核心力量影響，沒有跨選手通用數字。
  evidence:
  - certainty: 🟢
    text: 當選手被要求以超過最大努力的踢頻踢腿時，振幅顯著下降，但游速沒有增加。 Froude 效率從 0.72 降至 0.70，肌肉共收縮相增加，代謝負擔上升。
    source: Yamakawa et al. 2017
    source_ids:
    - src.pmid-28605694
    url: https://pubmed.ncbi.nlm.nih.gov/28605694/
  cross_ref: 強迫提高踢頻不提升速度，振幅自動補償、節拍器訓練目標是節奏穩定，不是強迫提速
  cross_ref_ids:
  - udk.tech.13
  - udk.tech.27
  correct_concept: 不要強迫提高踢頻，而是提高踢腿效率——在同樣頻率下產生更多推進力，或在不犧牲振幅的前提下自然提升頻率。頻率的提升應是技術進步的結果，而非訓練手段。
  perception_impact: 強迫高踢頻讓學員的感知資源全部投入「踢快」這件事，失去對「每一踢品質」的注意力——無法感受到踝關節鞭打的爆發感，也無法察覺阻力增加的訊號。
- id: udk.err5
  stroke: udk
  category: undulation
  title: 頭部引導波動才能產生完整的海豚踢
  misconception: 部分教材描述 UDK 的波動「從頭部開始」，教練因此指導學員「頭帶動身體」或讓頭部有明顯的上下起伏，認為這樣才能產生完整的波動感。
  physical_reason:
    certainty: 🔵
    text: UDK 的力學核心中，頭部的角色是穩定錨點，不是波動的發起點。正確的波動順序是核心→髖→膝→踝→腳尖，頭部受控、不主動發動，讓力量能穩定向下傳遞。頭部無意圖的晃動只會增加阻力。注意「受控」不等於「僵直」——上半身仍會有節律性的微幅移動，要壓掉的是無意圖的晃動而非全部位移。水面蝶式中頭部確實有被動跟隨的起伏，但這是划手和呼吸循環的副產品；UDK 沒有這個機制。
  evidence:
  - certainty: 🟠
    text: 要有效地做出起伏，泳者必須從身體頂端建立一個穩定平台，從雙手和頭部開始；把手當成灌進水泥裡、不讓它移動。原文的表述是「只有在雙手和頭部保持靜止時才有效」，但同段隨即補充：確實有菁英水下踢腿者的手是會動的，那是進階版本。
    source: Sheaff, A. (2022). How to Do Underwater Kicks. U.S. Masters Swimming.
    source_ids:
    - src.usms-sheaff-2022-how-to-do-underwater-kicks
  - certainty: 🟠
    text: 如果雙手、頭部和肩部在沒有意圖的情況下上下或左右晃動，你會遭遇大量阻力；能控制這個動作就能把阻力壓低。同一機構在較晚的指南裡把說法收斂成「穩定不等於僵直——雙手與上半身會以節律方式移動，它們不是靜止不動，而是受控」。這一句修正了上一列 2022 年文章的「保持靜止」措辭，本條依較晚的版本。
    source: U.S. Masters Swimming — Underwater Kick Body Alignment 指南
    source_ids:
    - src.usms-underwater-kick-body-alignment-guide
  cross_ref: UDK 是全身波動，不是腿部踢水、流線型品質是 UDK 速度的底板
  cross_ref_ids:
  - udk.tech.4
  - udk.tech.24
  correct_concept: 頭部中立、緊貼手臂，雙臂夾耳維持流線型。波動從核心啟動，頭不主動引導。指導語用「受控」而非「僵住」——目標是消除無意圖的晃動，不是把上半身鎖死。
  perception_impact: 頭部主動引導的感知，讓學員把注意力放在頭部位置上，干擾了對「核心→腳尖波動傳遞感」的感知建立。頭部動得越多，干擾越大。
- id: udk.err6
  stroke: udk
  category: concept
  title: 會游蝶式就等於會踢 UDK，技術可以直接遷移
  misconception: 教練認為蝶式踢腿訓練等同於 UDK 訓練，讓蝶式選手大量練習水面蝶腳，假設技術會直接遷移到水下階段。或反過來，讓初學者大量練 UDK 當作學蝶式的前置作業。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.researchgate-3d-analysis-2018
    - src.swimcoachingblog-com
    text: 兩者在時機結構和關節角度上有根本差異。流線型 UDK 的每一踢都在頭下壓時發生；蝶式的兩踢則與手臂入水和 upsweep 時機緊密耦合，結構完全不同。三維分析研究確認，蝶式第二踢的髖屈曲峰值角度、膝蓋伸展峰值角度均顯著小於 UDK，代表大量練習水面蝶腳無法直接建立 UDK 所需的關節動作模式。
  evidence:
  - certainty: 🟠
    text: 流線型海豚踢的每一踢都在頭下壓時發生，這和蝶式裡兩踢的時機完全不同。
    source: Coach Gary (2022). Are You Training Dolphin Kick? Or Butterfly Kick? swimcoachingblog.
    source_ids:
    - src.swimcoachingblog-com
  - certainty: 🟢
    text: 蝶式游泳第二踢的髖屈曲峰值角度，顯著小於踢板海豚踢和水下海豚踢。蝶式游泳第二踢的膝蓋伸展峰值角度，也顯著小於其他踢腿類型。
    source: 三維分析研究，ResearchGate 2018
    source_ids:
    - src.researchgate-3d-analysis-2018
  cross_ref: 技術分析 §陸（UDK vs 蝶式踢腿對照表）
  cross_ref_ids:
  - udk.tech.11
  correct_concept: UDK 與水面蝶式踢腿是相關但不相同的技術。前者需要在流線型約束下獨立節奏踢腿，後者與手臂動作的時機結構緊密耦合。訓練應分開設計，轉換點是時機感知而非踢腿力量。
  perception_impact: 用蝶式踢腿感知遷移至 UDK，學員可能建立「頭向下踢腿才啟動」的時機感，進入水下後反而產生踢腿節奏不穩定的問題。
- id: udk.err7
  stroke: udk
  category: depth
  title: 水下踢得越深，速度越快
  misconception: 部分教練指導學員盡量往深處踢，或刻意讓選手在較深的位置踢腿，認為「水越深、阻力越小、速度越快」，深度越大效益越高。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.lyttle-1998
    - src.vennell-2006-wave-drag
    - src.novais-2012-glide-depth-cfd
    text: 阻力確實隨深度下降，但下降是先陡後平的，而且有量到的上限。實測拖曳顯示 0.4 與 0.6 m 相對水面降阻 10–20%，0.2 m 只降 7–14%；假人拖曳顯示波浪阻力要壓到總阻力 5% 以下， 1 m/s 時需深於 0.5 m、2 m/s 時需深於 0.7 m；CFD 模擬則顯示超過 0.75 m 之後阻力幾乎不再變化。也就是說再往深踢，換到的阻力好處已經接近零，剩下的只有代價。
  evidence:
  - certainty: 🟢
    text: 拖曳測力，深度取水面與 0.2／0.4／0.6 m、速度 1.6–3.1 m/s：水面總阻力在所有速度下都顯著高於三個水下深度，0.4 與 0.6 m 降阻 10–20%。本研究最深只測到 0.6 m。
    source: Lyttle et al. 1998
    source_ids:
    - src.lyttle-1998
  - certainty: 🟢
    text: 拖曳假人模型：波浪阻力在 1.7 m/s 時佔總阻力 50–60%；要壓到 5% 以下，1 m/s 需深於 0.5 m、2 m/s 需深於 0.7 m。
    source: Vennell et al. 2006, Journal of Biomechanics
    source_ids:
    - src.vennell-2006-wave-drag
  - certainty: 🟢
    text: 三維 CFD 模擬，深度 0 至 1.0 m 每 0.25 m 一階：阻力隨深度下降，但超過 0.75 m 後幾乎不再變化。
    source: Novais et al. 2012, Journal of Human Kinetics
    source_ids:
    - src.novais-2012-glide-depth-cfd
  cross_ref: 最優水下深度範圍 0.4–0.6 m
  cross_ref_ids:
  - udk.tech.2
  correct_concept: '實用深度約 0.4–0.6 m，超過 0.75 m 沒有追加效益。推牆後的流線型深度以此範圍為目標，

    不需要特別往深處去。


    另外要說清楚一件常被當成理由的事：「潛太深會增加上浮耗時、破壞出水角度」聽起來合理，

    但上面三份研究量的都是阻力，**沒有任何一篇量過上浮時間、出水角度或能量消耗**。

    它可以當成教練端的取捨提示，不能當成已經被證實的代價。'
  perception_impact: 追求「越深越好」的學員，會把注意力放在「往下沉的感覺」，而非「向前推進的感覺」——感知目標方向錯誤。
- id: udk.err8
  stroke: udk
  category: turn
  title: 轉身後必須先滑行，等速度降下來再開始踢腿
  misconception: 教練常指導「推牆後先滑行維持流線型，等速度降下來再開始踢腿」，認為干擾流線型滑行會浪費初始動能。
  physical_reason:
    certainty: 🟠
    observation_basis: 前兩句的觀察者是 The Race Club 教練群（velocity meter 實測 + 教學分析），觀察族群為競技泳者，其速度差數字出自單一菁英受試（Aaron Greenberg）。外推邊界：非控制實驗、未報告樣本數與離散度，只作為「等越久起點速度越低」這個方向性判斷的實務依據，不作為時間或距離的處方值。第三句不是教練觀測而是文獻，其自證由下方 🟢 evidence 承擔（Takeda 等 2026）。
    text: 選手在流線型滑行時速度下降得非常快。彎膝準備第一下踢的減速量，不管在什麼時間點發生都差不多——等越久，只是在從更慢的速度開始加速而已。近年一份運動生物力學的力學模型也指向同一方向：多數受試菁英泳者的最優轉換速度高於其等速游泳速度，支持盡早起踢的邏輯（該研究樣本為 10 名菁英女性、在水槽 tethered 條件下量測淨力，作者自述為 conceptual model，不宜讀成賽場實證，2026-09-04 更正原文「研究也確認」的定論語氣）。
  evidence:
  - certainty: 🟠
    text: 以精英選手 Aaron Greenberg（自由式）測試：立刻起踢比短暫滑行快 0.1 秒，比長時間滑行快 0.18 秒（5 公尺成績）。同篇另測仰式選手 Amy Bilquist，立刻下踢比短滑行快 0.1 秒、長滑行則慢 0.16 秒。
    source: The Race Club — Turn Techniques Part I（velocity meter 實測）
    source_ids:
    - src.the-race-club-turn-when-to-start-dolphin-kick
  - certainty: 🟠
    text: 選手在流線型滑行時速度下降得非常快。彎膝準備第一下踢的減速量，不管在什麼時間點發生都差不多。等越久，就只是在從更慢的速度開始加速而已。
    source: The Race Club — Turn Techniques Part I
    source_ids:
    - src.the-race-club-turn-when-to-start-dolphin-kick
  - certainty: 🟢
    text: 以冪律擬合流線滑行（SL）／海豚踢（DK）／自由式（FC）三者的淨力–流速曲線，交會速度 USL-DK 與 UDK-FC 即最佳轉換時機；對多數受試者而言這兩個交會速度 **高於**其各自的等速游泳速度（VDK_const、VFC_const），支持盡早起踢的邏輯。樣本為 10 名菁英女性泳者、水槽 tethered 淨力量測，作者提出的是 conceptual model。
    source: Takeda T, et al. (2026). Sports Biomech. PMID 41728809
    source_ids:
    - src.takeda-2026
  cross_ref: UDK 起踢規則、出發與轉身的起踢時機差異
  cross_ref_ids:
  - udk.tech.17
  - udk.tech.29
  correct_concept: 轉身後，第一下上踢應在離牆後盡快啟動，而非等待滑行。目標是最小化從推牆到第一踢之間的速度損失窗口。注意：出發起跳後的水下情境略有不同，入水瞬間需要建立流線型姿勢，有一個短暫的身體整合窗口。
  perception_impact: 「先滑行」的習慣讓學員建立「靜待感→再啟動」的感知序列。正確感知應是「推出瞬間已感受到踢的準備」——連貫的動能感知，沒有中斷。
- id: udk.err9
  stroke: udk
  category: depth
  title: 水下踢越遠越好，15 公尺上限就是目標
  misconception: 「15 公尺限制就是目標」——教練要求選手盡量在水下踢到規則上限，或認為踢得越遠就越快。
  physical_reason:
    certainty: 🔵
    text: 最優水下距離等於個人水下速度衰減曲線與水面游泳速度的交叉點。當水下速度低於水面游泳速度後，繼續踢腿就是在用力減速。大多數選手的水下踢腿速度低於其水面游泳速度，對這些選手而言，延長水下距離是在拖慢自己。
  evidence:
  - certainty: 🟢
    text: 在 100m 項目中，較快的選手並非踢得更遠——而是踢得更快。水下距離不是差異的關鍵，水下速度才是。
    source: Frontiers in Physiology 2021
    source_ids:
    - src.pmc8442910-a
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8442910/
  - certainty: 🟠
    text: 多踢兩腳只為了多踢幾公尺——但每一腳的速度都在下降——顯然不等於在那段距離用爆發有效的踢腿走完同樣的路。當談到水下距離時：品質 > 數量。
    source: Poirier-Leroy, O. How Far Underwater Should You Be Dolphin Kicking? YourSwimLog.
    source_ids:
    - src.yourswimlog-how-far-underwater-kicking
  - certainty: 🟠
    text: 大多數選手的踢腿速度明顯低於其游泳速度，因此應該用最少的海豚踢數到出水點；延長水下距離是在拖慢自己。
    source: 'The Race Club — Freestyle Flip Turn: Number of Kicks'
    source_ids:
    - src.the-race-club-flip-turn-kick-count
  cross_ref: 最優水下距離由個人速度衰減曲線決定、長水下距離的代謝代價
  cross_ref_ids:
  - udk.tech.18
  - udk.tech.19
  correct_concept: 水下踢腿的終止點應是速度交叉點，而非固定距離。提升水下踢腿速度（讓交叉點更遠）才是正確訓練方向，而非強迫延長距離。
  perception_impact: 「踢遠」的目標讓學員關注「距離計數感」，而非「速度維持感」。感知應是「每一踢仍有向前的推進感」，當這個感覺消失時就是出水的時機。
- id: udk.err10
  stroke: udk
  category: timing
  title: 最後一踢結束後才出水，踢完再接第一划
  misconception: 標準出水教學通常是「踢腿→換成 flutter kick→浮出水面→開始划手」，許多教練也接受「踢完停一下再出水」的節奏。
  physical_reason:
    certainty: 🟠
    text: 精英選手分析顯示，頂尖選手幾乎消除了最後一踢與第一抓水之間的空窗，將踢腿動能直接轉入第一划。先踢腿、再換 flutter kick、再出水划手的「標準」方式比較慢，因為過早換成自由式踢腿等於踩了剎車，浪費出發或轉身後辛苦建立的速度。
    observation_basis: 觀察者為 YourSwimLog（教練型泳訊網站，下方三則 evidence 同源），族群為菁英競技泳者。外推邊界：**三則 evidence 指向同一個來源，不是三方獨立佐證**，不可讀成收斂；「幾乎消除空窗」是影像觀察的定性描述，未報告時間量測；「過早換成自由式踢腿等於踩剎車」是動量推導，不是測到的減速值。
  evidence:
  - certainty: 🟠
    text: Michael Phelps 把海豚踢一路踢進第一下自由式划水，在第一個划手循環仍做最後一踢，真正踢到水面。
    source: YourSwimLog
    source_ids:
    - src.yourswimlog-a
  - certainty: 🟠
    text: Caeleb Dressel 使用蝶式式 breakout，在第一下划手臂拉時仍在踢腿，手臂開始拉水時他的腿還在踢。
    source: YourSwimLog
    source_ids:
    - src.yourswimlog-a
  - certainty: 🟠
    text: 先踢腿、再換 flutter kick、再出水划手的「標準」方式比較慢，因為過早換成自由式踢腿等於踩了剎車，浪費出發或轉身後辛苦建立的速度。
    source: YourSwimLog
    source_ids:
    - src.yourswimlog-a
  cross_ref: UDK 動作要點、自由式 Breakout 七要點
  cross_ref_ids:
  - starts-turns.tech.34
  - starts-turns.tech.44
  correct_concept: 最後一踢應與第一個抓水動作同步啟動——不踢完再抓水，也不在抓水前停踢。 Breakout 的感知目標是「無縫接軌」，踢腿的動能直接轉入第一划。
  perception_impact: 「踢完→停→出水」的習慣在 breakout 時製造一個感知空窗——速度在這個空窗中流失，學員卻毫無感知。正確感知應是「最後一踢推出的動能被第一划接住」的連貫感。
- id: udk.err11
  stroke: udk
  category: concept
  title: 仰式水下踢法與俯式相同，橫躺過來踢就好
  misconception: 教練直接用俯式 UDK（自由式/蝶式）的教學口令套用到仰式選手，認為「橫躺」就好，踢法相同。
  physical_reason:
    certainty: 🔵
    text: 仰式（仰臥/dorsal）與俯式（俯臥/prone）UDK 至少有一項條件不同：下踢方向與浮力的關係。俯式下踢往腹側、與浮力同向，容易過早浮出或需角度朝下補償；仰式下踢往背側、與浮力反向，維持深度較不費力。 **這個幾何差異成立，但它推不出「所以仰式效率較高」**——效率是推進力、阻力與代謝成本的合成，要靠實測。 2026-09-06 更正：本條原本從幾何差異一路寫到「仰式速度曲線更平穩、整體效率反而更高」，那是把一個方向性的力學條件當成結論在用（詳見 udk.tech.22）。誤區本身仍然成立——兩種體位的條件確實不同，口令不能整組平移——但「不同」的內容是浮力關係與感知重點，不是誰比較快。
  evidence:
  - certainty: 🟢
    text: 唯一一份把同一批泳者的俯臥與仰臥全力海豚腳直接對照的運動學研究：水平速度（p=0.774）與踢頻（p=0.730）兩種體位都沒有差異，關節活動度也不受體位影響（p=0.36），結論明文反駁「仰臥海豚腳較有效」的說法。這是 n=6 的會議摘要，沒測到差異不等於兩者相等——它能推翻的是「已有證據支持仰式較優」。 2026-09-06 更正：本條原本引的就是這份研究，卻寫成「仰臥速度曲線更平穩、效率更高」。
    source: 'Scharborough et al. (2017), International Journal of Exercise Science: Conference Proceedings 2(9), Article 81'
    source_ids:
    - src.scharborough-2017-dolphin-kick-prone-supine
  cross_ref: 仰／俯海豚腳的效率差異查無證據
  cross_ref_ids:
  - udk.tech.22
  correct_concept: 仰式 UDK 的技術指導應強調「對抗浮力的下踢感」和「深度維持感」，而非套用俯式的「向下爆發感」口令——理由是兩個體位的浮力關係不同， **不是因為仰式比較有效率**（那個說法沒有證據支持）。
  perception_impact: 用俯式感知訓練仰式 UDK 的學員，往往把注意力放在「踢的力量感」，而非仰式特有的「對抗浮力、把深度守住」的感覺——導致仰式水下深度守不住。
- id: udk.err12
  stroke: udk
  category: concept
  title: 「像海豚一樣游」足以傳遞 UDK 的技術要求
  misconception: 「像海豚一樣！」是最廣泛使用的 UDK 口令之一，簡單直覺，教練和學員都很熟悉。
  physical_reason:
    certainty: 🔵
    source_ids:
    - src.rohr-2004
    - src.usms-swimming-world-magazine-the-race-club
    text: 鯨豚以水平展開的尾鰭做背腹向拍動，人類則以髖—膝—踝關節鏈驅動雙腿；兩者推進構造不同。 Rohr & Fish (2004) 只量化鯨豚的尾鰭頻率、振幅、速度與 Strouhal number，並未直接比較人類 UDK。因此「像海豚」只能作形象類比，無法告訴學員波動從哪裡啟動、上踢的速度目標，或流線型的核心穩定要求。
  evidence:
  - certainty: 🟡
    text: Rohr & Fish 量化鯨豚尾鰭頻率、振幅、游速與 Strouhal number；研究未測量或直接比較人類 UDK。
    source: Rohr & Fish 2004, odontocete swimming kinematics
    source_ids:
    - src.rohr-2004
  - certainty: 🟠
    text: 有效的 UDK 教學需要具體的技術語言，指向身體的特定部位和感知目標。
    source: USMS, Swimming World Magazine, The Race Club
    source_ids:
    - src.usms-swimming-world-magazine-the-race-club
    observation_basis: 觀察者是三個獨立的泳訓教學發布方（U.S. Masters Swimming、Swimming World、The Race Club）的 UDK 教學內容，族群為競技與進階成人泳者。本條記錄的是**這些教材共同採用具體部位語言而非動物類比**這個現象，不是任何一方的實驗結論。外推邊界：沒有任何一方比較過「具體技術語言」與「動物類比」的教學成效，所以本條**不能宣稱前者教得比較快**——它只支持「業界主流教材是這樣寫的」。兒童初學階段的口令選擇不在此範圍（形象類比在該族群可能有不同作用）。
  cross_ref: UDK 是全身波動，不是腿部踢水、Strouhal 數與人類 UDK 推進效率
  cross_ref_ids:
  - udk.tech.4
  - udk.tech.8
  correct_concept: 以具體感知語言取代動物類比：「從肚臍啟動波動」「腳尖鞭打感」「上踢要快，快到沒有等待感」等。口令的目的是縮窄感知目標，而非喚起形象聯想。
  perception_impact: 「像海豚一樣」的口令讓學員建立形象感知而非身體感知——感知到的是「像海豚的樣子」，感知不到的是「踝關節鞭打的加速感」或「核心穩定下波動傳遞感」。
- id: udk.err13
  stroke: udk
  category: streamline
  title: 直接練踢腿就好，流線型會自然到位
  misconception: 教練直接讓選手練習 UDK 踢腿，假設流線型姿勢是自然的、不需要獨立訓練，或把「踢腿次數」當作訓練進步的主要指標。
  physical_reason:
    certainty: 🔵
    text: 流線型品質直接決定 UDK 的速度上限。頭部鬆散晃動的選手，無法製造出快速有力踢腿所需的穩定源頭。大幅度踢腿超出身體輪廓線增加阻力，所有額外的踢腿力量都被自己製造的阻力抵消。在流線型不穩定的前提下練踢腿，等於是在漏水的容器裡加水。
  evidence:
  - certainty: 🟠
    text: 原文把「成功的水下踢腿」拆成四個並列要素：建立穩定平台、盡量製造推進、上下兩個方向的推進與節奏對等、維持降低阻力的體態。四項裡有兩項與踢腿力量無關，踢腿力量只佔其中一項。
    source: Sheaff, A. (2022). How to Do Underwater Kicks. U.S. Masters Swimming.
    source_ids:
    - src.usms-sheaff-2022-how-to-do-underwater-kicks
  - certainty: 🟠
    text: 在水中最快的移動方式，是在緊縮流線型中完美執行水下海豚踢。
    source: MySwimPro (2023). This is the Fastest Way to Move Through the Water.
    source_ids:
    - src.myswimpro-2023-fastest-way-underwater
  cross_ref: 流線型品質是 UDK 速度的底板
  cross_ref_ids:
  - udk.tech.24
  correct_concept: UDK 訓練應以「流線型品質→踢腿時機→踢腿效率」的順序推進。流線型是 UDK 速度的先決條件，需要獨立訓練。
  perception_impact: 跳過流線型的學員，把注意力全放在「腿的動作」，感知不到「全身整合的流線感」——而後者才是 UDK 速度的先決條件。
- id: starts-turns.err1
  stroke: starts-turns
  category: start
  title: 起跳角度越大、飛越遠，入水後速度越快
  misconception: 教練常要求選手「跳高一點」「大力跳出去」，認為起跳弧線越高、飛行距離越遠，入水後的速度就越快。這個觀念在競技游泳圈流傳甚廣，甚至出現在早期教科書中。
  physical_reason:
    certainty: 🔵
    text: 起跳角度越高，水平速度越低（力量分量不同）；高弧線帶來較長飛行時間，但入水後水平速度更低。精英選手選擇低平快速入水而非高飛遠落，重點是入水時的水平速度，而非飛行距離。
  evidence:
  - certainty: 🟢
    text: 精英選手起跳角度 27.45 ± 5.99°，非精英 39.62 ± 13.19°——精英角度遠低於傳統建議的 30–40°。
    source: Benjanuvatra N, Edmunds K, Blanksby B. (2007). Int J Aquat Res Educ 1(3)
    source_ids:
    - src.benjanuvatra-2007-a
  - certainty: 🟡
    text: 另一組精英樣本的起跳角度為 21.25 ± 5.59°（Wilson & Marino 1983），方向一致但年代較早。
    source: Wilson & Marino 1983
    source_ids:
    - src.wilson-1983
  - certainty: 🟢
    text: 但出發不是單一變數的最佳化。Vantorre 等人 2014 的綜述把出發描述成**一連串妥協**：空中距離要長（減少水中阻力）與入水姿勢要正確（需要旋轉）這兩個約束彼此拉扯；該綜述區辨高水準出發的因子是反應時間、蹬離期的足部施力控制與方向、滑行時間長度，以及踢腿轉入完整划手的銜接效率——**不是角度**。所以「角度越低越好」不能當成結論，低角度只是精英樣本呈現的傾向。
    source: Vantorre J, Chollet D, Seifert L. (2014). J Sports Sci Med 13(2):223-231
    source_ids:
    - src.vantorre-2014-swim-start-review
  cross_ref: 技術分析 §壹 1.2 推蹬階段：起跳角度數據（精英 21–27°）
  cross_ref_ids:
  - starts-turns.tech.6
  - starts-turns.tech.39
  correct_concept: 起跳目標是最大化水平速度，而非最大化飛行高度或距離。精英選手的低角度起跳看起來「沒有跳很高」，但入水後速度更快。
  perception_impact: 「跳高」口令讓學員把注意力集中在「身體離地的高度感」，而非「向前射出的水平衝勁感」，導致起跳的力量方向本身就偏了。
- id: starts-turns.err2
  stroke: starts-turns
  category: start
  title: Kick Start：前腳是主力推進腳
  misconception: Track Start 的傳統教法強調「有力的腳（慣用腳）放前，作為主要推力來源」。大多數教練仍以這個邏輯指導選手擺腳位置——前腳是「發力腳」，後腳是「輔助腳」。
  physical_reason:
    certainty: 🔵
    text: 楔形台普及後，前後腳角色與傳統認知相反：後腳（踩楔形台）主要產生水平速度；前腳（踩台前緣）主要產生垂直速度，負責飛行高度與身體對齊。前腳是方向控制腳，不是水平推力腳。慣用腳放前能更精準控制起跳方向，對成績的貢獻可能超過後腳水平力量的增加。
  evidence:
  - certainty: 🟢
    text: 十一名男性競技泳者做楔形台起跳，三塊測力板分別記錄雙手、前足、後足的反作用力衝量：後足的水平衝量顯著高於前足，前足的垂直衝量顯著高於後足。也就是水平出發速度主要由後足貢獻，垂直出發速度主要由前足貢獻。
    source: Takeda et al. 2017, Journal of Sports Sciences
    source_ids:
    - src.takai-2016
    url: https://pubmed.ncbi.nlm.nih.gov/27149652/
  - certainty: 🟢
    text: 二十名平均 16.1 歲的女性競技泳者在 OSB12 出發台上測試腳位：慣用腳放前緣時 block 時間更短、到 2 m 與 5 m 的時間也更短（效果量大）。這是「慣用腳放前」的直接成績證據，但族群限於青少女，且台型限於 OSB12。
    source: Matúš et al. 2021, Int J Environ Res Public Health
    source_ids:
    - src.pmc8700779
    url: https://pubmed.ncbi.nlm.nih.gov/34948765/
  cross_ref: 技術分析 §壹 1.3 Kick Start 變體：前後腳角色重新分配
  cross_ref_ids:
  - starts-turns.tech.7
  - starts-turns.tech.8
  correct_concept: 現代 Kick Start 的核心是後腳水平蹬出，前腳控制起跳角度。慣用腳放前，是讓它負責精準控制起跳方向，而非「主力水平發力」。
  perception_impact: 「前腳用力蹬」的感知模型讓選手在起跳時集中感受「前腿伸直的力量感」，忽略了後腳向後快速蹬出的水平推進感。兩者是完全不同的感知目標。
- id: starts-turns.err3
  stroke: starts-turns
  category: entry
  title: 入水要垂直插入——手指先插進去、身體筆直最乾淨
  misconception: 常見入水教學要求選手「手指先插入，身體保持筆直，像一根線一樣進水」，部分教練甚至要求入水角度越直越好，認為這樣阻力最小、最乾淨。
  physical_reason:
    certainty: 🔵
    text: 入水角度影響的是水平速度保留，而非水花大小。垂直入水使水平速度在入水瞬間大量損失，身體要從幾乎零水平速度重新加速；低角度（較平）入水讓更多水平速度被保留進入水下滑行階段。流線型品質是另一回事，入水角度的優化目標是水平速度保留，而非追求視覺上的垂直筆直感。
  evidence:
  - certainty: 🟢
    text: 入水的重心水平速度與入水距離是起跑成績的主要預測變數；入水角度本身影響次要，但較平的入水角度與較好的成績相關（入水角度每平 1 弧度，成績約進 0.5 秒）。
    source: Predicting dive start performance from kinematic variables at water entry, PLOS ONE 2020
    source_ids:
    - src.journal-pone-0241345-a
    url: https://doi.org/10.1371/journal.pone.0241345
  cross_ref: 技術分析 §壹 1.2 入水點：水平速度是主要預測變數
  cross_ref_ids:
  - starts-turns.tech.11
  - starts-turns.tech.12
  correct_concept: 入水的核心目標是保留水平速度。低角度入水讓速度更完整地轉換進入水下，而非用垂直插入製造「乾淨感」。
  perception_impact: 「垂直插入感」讓選手把「向下的衝勁」誤認為好的入水——感知的是「插進去的力道」，感知不到的是「水平速度在入水瞬間被保留或流失」。
- id: starts-turns.err4
  stroke: starts-turns
  category: start
  title: 仰式起跳要盡量拱背，弧線越大越好
  misconception: 仰式起跳的常見教學強調「用力向後拱背」「背部弧線越大越好」，認為弧線大代表跳得遠、姿勢好。部分教練以「背部有沒有出水」作為評判標準。
  physical_reason:
    certainty: 🔵
    text: 蹬牆的衝量分成水平與垂直兩個分量，總量有限：一直把弧線做大，等於把更多分量放到垂直方向，水平方向能拿到的就少；弧線過大時入水的腳進水角度也偏，雙腿難以沿同一軌跡入水。但這是取捨關係，不是「角度越大成績越差」的單調關係——角度只是外顯結果，同一個角度可以來自完全不同的蹬牆方式（見下方證據：起跳角度較大的那一組 5 m 時間並沒有比較差）。可以操作的變數是髖部高度與蹬牆方向，不是背部弧線的視覺幅度；背部弧線本身是仰式起跳的合理組成，問題是刻意最大化弧線、並拿它當評判標準。
  evidence:
  - certainty: 🟢
    text: 六名菁英泳者比較「雙腳沒入水面下」與「雙腳露出水面」兩種仰式出發腳位：腳沒入水的那一組起跳角度較大、hands-off 時的重心水平速度也較大，但兩組的重心水平入水距離、背弓角度與 5 m 出發時間相當。也就是說，起跳角度較大的那一組並沒有比較慢——角度本身不是可以直接讀出成績好壞的指標。
    source: de Jesus et al. 2013, Journal of Sports Sciences 31(15):1665–1675
    source_ids:
    - src.de-jesus-2013-backstroke-start-feet
    url: https://pubmed.ncbi.nlm.nih.gov/23688055/
  - certainty: 🟢
    text: 彙整 23 份仰式出發文獻的方法學回顧指出：各研究對出發分期的定義沒有共識，計時終點從約 5 m 到 22.86 m 不等，且部分研究的結論已對應到規則改變後不再使用的技術。所以仰式出發的任何單一數值都要先看它用什麼分期與什麼終點測出來的。
    source: de Jesus et al. 2014, Journal of Human Kinetics（仰式出發文獻回顧）
    source_ids:
    - src.pmc4234766-a
    url: https://pubmed.ncbi.nlm.nih.gov/25414737/
  cross_ref: 技術分析 §壹 1.4 仰式起跳
  cross_ref_ids:
  - starts-turns.tech.14
  - starts-turns.tech.16
  correct_concept: 仰式起跳的目標同樣是水平速度最大化，關鍵是髖部高度而非弧線幅度。弧線是起跳的結果，不是目標。判斷標準應是「入水後速度保留」，而非「背部弧線視覺感」。
  perception_impact: 「拱背越高越好」的口令讓選手把注意力放在「背部向後延展的感覺」，而非「向後射出的水平衝勁感」。背部弓起的本體感知佔據注意力，推蹬方向的感知反而退居其次。
- id: starts-turns.err5
  stroke: starts-turns
  category: turn
  title: 蛙式／蝶式接近牆時提前收手，換取快速觸牆
  misconception: 接近終點牆時，教練常要求「快點碰牆」，選手和教練把「最快速度碰到牆」視為目標。實際操作上，選手往往在最後一划還沒完整推完水時就收手觸牆——「湊」上去。
  physical_reason:
    certainty: 🔵
    text: 轉身的計時是從進牆前幾公尺算到離牆後幾公尺，這一整段裡沒有推進的時間都算在成績內。提前收手觸牆會製造三個代價：最後一划推水不完整，少拿一段推進；身體多一個「漂移觸牆」的空窗，這段時間只有減速沒有推進；觸牆時身體位置不理想，縮腿路徑受限、在牆上停留變久。第三項是有量測支撐的那一項（見下方證據的 pivot time），前兩項是從「這段時間也計分」直接推出來的。
  evidence:
  - certainty: 🟡
    text: 二十三名分齡蛙式泳者的轉身分析（結果變項是進牆前 5 m 到離牆 5 m 的往返時間）：逐步迴歸留下的預測項是出水距離、出水水平速度、pivot time、離牆峰值水平速度與身高。 **其中 pivot time 越長、往返時間越差**——「湊牆」讓身體位置不理想、縮腿路徑受限，付出的代價就在這一項上。要注意的是，這份資料**沒有把進牆速度留在模型裡**，所以「進牆速度直接決定轉身成績」不是它證明的東西；提前收手的問題是在牆上多花時間，不是有文獻量到的進牆速度效應。
    source: Blanksby et al. 1998, Journal of Applied Biomechanics 14(2):180–189
    source_ids:
    - src.blanksby-1998-breaststroke-turns
    url: https://doi.org/10.1123/jab.14.2.180
  - certainty: 🟠
    observation_basis: 兩句都是 MySwimPro（2022）的教學內容原文，族群為成人泳者與 masters。外推邊界：這是教學指導語不是量測——「約半個身體長度」是口訣式的距離提示，沒有報告過族群、身高範圍或誤差；上面 Blanksby 那條才是有模型的證據。 2026-09-06 撤下原本掛的 source_ids（複合字串，另一半 coachsci.sdsu.edu 是 Brent Rushall 的摘要索引站，本身不是原始文獻）。
    text: 「另一個常見錯誤是靠近牆時彎曲手臂把自己拉過去。正確做法是保持手臂伸直，盡量離牆遠——用伸直的手觸牆。」「最後一划前距牆約半個身體長度；如果太遠，就踢腿補上——不是縮短划手。」
    source: MySwimPro（2022）教學內容
  cross_ref: 技術分析 §貳 2.3/2.4 接近與旋轉：完整最後一划
  cross_ref_ids:
  - starts-turns.tech.19
  correct_concept: 最後一划應完整推完，讓身體以最高速度觸牆。寧可多一個小踢腿讓距離對上，也不提前收手湊牆。
  perception_impact: 「湊牆」的習慣讓選手在最後幾公尺就切換進「等待觸牆」的感知模式，游泳的推進感知提前中斷。感知目標應是「最後一划的推水感直接連到觸牆感」，中間沒有漂浮等待。
- id: starts-turns.err6
  stroke: starts-turns
  category: streamline
  title: 觸牆蹬出之後才做流線型
  misconception: 教練常在選手推牆後才提醒「手舉高！」「做流線型！」，隱含的邏輯是先用力蹬出去，再整理姿勢。許多選手確實是蹬出去以後，身體在水中旋轉整理才成為流線型。
  physical_reason:
    certainty: 🔵
    text: 流線型的時機決定推蹬力量的轉換效率。腳觸牆時雙臂應已完成流線型姿勢（在觸牆前完成），推蹬的力量方向與流線型的方向一致，力量直接轉換為前進速度。推蹬後才整理姿勢，推蹬力量有一部分轉換為旋轉動量，再修正為直線，效率損耗。
  cross_ref: 技術分析 §貳 2.1 接觸與推蹬：流線型應在觸牆前就位
  cross_ref_ids:
  - starts-turns.tech.18
  correct_concept: 流線型不是推蹬之後的整理動作，而是觸牆前的準備動作。正確順序：手臂進入流線型 → 腳觸牆 → 蹬出。
  perception_impact: 「蹬出去再整理」的模式讓選手的感知資源在最關鍵的推蹬瞬間分配給「整理身體」，而非「感受推進方向」。正確感知目標是「觸牆瞬間已感受到全身流線型對齊」，推蹬只是釋放這個對齊姿勢的力量。
- id: starts-turns.err7
  stroke: starts-turns
  category: turn
  title: 仰式計步：從旗幟數固定步數就翻，速度快慢都一樣
  misconception: 仰式選手看不到牆，必須靠 5 公尺旗幟計步判斷翻滾時機。教練常在練習中找出一個數字（「你是三步的人」），然後把這個數字固定下來，無論比賽速度還是訓練速度都用同一個數字。
  physical_reason:
    certainty: 🔵
    text: 旗幟到牆的計步數隨游速而改變——比賽衝刺時滑行距離更遠，同樣步數會撞牆；疲勞後半程划幅縮小，原本夠用的步數可能到不了牆；划幅提升後同樣步數抵達位置改變。個人化但不考慮配速的固定數字，只在特定速度下成立，出賽速度一變就會失準。
  evidence:
  - certainty: 🟠
    text: 旗幟到牆的划手次數取決於速度和划效……這個步數會因游速快慢而有輕微變化，導致你比預期更靠近或更遠離牆。
    source: Bay, S. (2024). How to Use Backstroke Flags in Swimming. U.S. Masters Swimming.
    source_ids:
    - src.usms-bay-2024-backstroke-flags
  cross_ref: 技術分析 §貳 2.2 接近與旋轉：🔴 旗幟計步系統
  cross_ref_ids:
  - starts-turns.tech.23
  correct_concept: 旗幟計步應「分速度標定」：慢速、中速、比賽速度三種條件下各找一個數字，並定期重新確認（訓練量大時划幅改變，步數也會跟著變）。
  perception_impact: 依賴固定數字的選手把注意力集中在「數步數」而非「感受與牆的距離感」。正確的感知目標是建立「速度＋距離＋步幅」的整合感知，讓計步成為確認工具，而非唯一判斷依據。
- id: starts-turns.err8
  stroke: starts-turns
  category: depth
  title: 蛙式轉身觸牆後要刻意往下沉，讓腳找到牆
  misconception: 蛙式／蝶式轉身時，教練有時指導選手「觸牆後往下沉一點，讓腳踩到牆」，認為腳需要「找到牆的支撐點」才能推蹬，特別是在觸牆位置不理想時。
  physical_reason:
    certainty: 🔵
    text: 刻意下沉讓腳落在更深位置，推蹬方向自然偏向上而非向前。下沉增加轉身的垂直位移，使推蹬方向偏上、水平速度損失；腳踩到牆的深度越深，推出方向越向上而非向前。正確的腳找牆邏輯是透過縮腿路徑（腿從身體下方收回），讓腳自然落在最優深度，而非靠身體主動下沉補位。
  evidence:
  - certainty: 🟢
    text: 蛙式最優觸牆深度為 30–40 cm。
    source: Biomechanical Features of Backstroke to Breaststroke Transition Techniques, PMC8960438
    source_ids:
    - src.pmc8960438-d
  - certainty: 🟠
    text: 目標是把腿踢進牆，絕不是把自己拉進牆——拉進去會讓髖部下沉，就像放了錨一樣。使用邊界：這句出自 1998 年美國 masters 泳協的技術文章，屬教練處方而非量測；「放錨」是原文的比喻。本庫先前把這段歸給 SwimSwam 的 Jozsef Nagy，那是錯的歸屬，2026-09-06 更正。
    source: McCauley, W. (1998). The Complete New Breaststroke Turn. U.S. Masters Swimming.
    source_ids:
    - src.mccauley-1998-usms-complete-new-breaststroke-turn
  cross_ref: 技術分析 §貳 2.3/2.4 接觸與推蹬：觸牆深度
  cross_ref_ids:
  - starts-turns.tech.25
  correct_concept: 轉身的深度控制在縮腿階段完成，而非觸牆後靠身體下沉補救。接近牆的姿勢和縮腿路徑決定觸牆深度，到位後直接推蹬，不再有額外調整。
  perception_impact: 「下沉找牆」的習慣讓選手在轉身最關鍵的時刻把注意力放在「腳有沒有踩穩」，而非「推蹬方向感」。轉身的感知目標應是整個轉身動作的動量連貫感——從觸牆到推出是一個不間斷的力量傳遞，沒有找位置的停頓。
- id: starts-turns.err9
  stroke: starts-turns
  category: concept
  title: 推牆力道越大，出去速度就越快
  misconception: 轉身訓練中，教練常評估「腿有沒有力」「推牆有沒有到底」，把蹬牆力道視為決定出發速度的主要因素。選手也常把「用力蹬」當作轉身訓練的核心目標。
  physical_reason:
    certainty: 🔵
    text: 推蹬力道解釋轉身成績約 42% 的變異——力道確實重要，但只是成績的一部分。推蹬方向的影響尤其強（出水速度與推蹬力向量對齊重心方向的相關係數 r = 0.76）；流線型是力量轉換的前提條件：推蹬時沒有流線型姿勢，不管推多用力速度都出不去。更精確的框架：出去速度 = 推蹬力量（42%）× 推蹬方向（r=0.76）× 流線型效率（前提條件）。
  evidence:
  - certainty: 🟢
    text: 推蹬力道解釋轉身成績約 42% 的變異。
    source: Kinetic Analysis of Swimming Flip-Turn Push-Off Techniques, PMC6409673
    source_ids:
    - src.pmc6409673-b
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6409673/
  - certainty: 🟢
    text: 出水速度與推蹬力向量對齊重心方向的相關係數為 r = 0.76（p < 0.001）。
    source: Can the tumble turn performance be improved by aligning the push-off force vector to the centre of mass trajectory?, PubMed 40252339
    source_ids:
    - src.pmid-40252339-a
    url: https://pubmed.ncbi.nlm.nih.gov/40252339/
  - certainty: 🟠
    text: 若泳者在推蹬時沒有流線型姿勢，不管推多用力速度都出不去——水會反推回來，抵消向前的推進，量到的推蹬強度數值也因此偏低。使用邊界：原文出自穿戴裝置廠商 TritonWear 的部落格，其「Push-Off Strength」是該公司自訂的無單位指標（文中給的菁英區間為女子 29–31、男子 30–33），不是力學單位，不能與文獻中的推蹬力數據互相對照。
    source: 'Marr, K. (2018). Building the Perfect Turn: Push Off Strength. TritonWear Blog.'
    source_ids:
    - src.marr-2018-tritonwear-push-off-strength
  cross_ref: 技術分析 §貳通用：流線型品質與推蹬方向同等重要
  cross_ref_ids:
  - starts-turns.tech.17
  - starts-turns.tech.18
  - starts-turns.tech.22
  correct_concept: 轉身訓練的優先順序：流線型時機 → 推蹬方向 → 推蹬力道。在流線型和方向不到位的前提下強化腿力，是邊際效益最低的投資。
  perception_impact: 「用力蹬」的目標讓選手把注意力集中在「腿的爆發力感」，忽略了「全身在推蹬瞬間的對齊感」。推蹬後速度快不快，取決於那個對齊感是否到位——不是腿有多用力。
- id: starts-turns.err10
  stroke: starts-turns
  category: head
  title: 起跳一定要抬頭（或反向：絕對不能抬頭）——二元口令兩派都過度執行
  misconception: 起跳時頭部位置有兩派教法，常見以絕對化口令呈現：派 A「起跳一定要抬頭看遠處才能飛得遠」、派 B「絕對不能抬頭，會破壞 streamline」。執行端兩派都過度——抬頭派把所有人都教成抬頭、低頭派把所有人都壓住頭，但實際是兩派各有適用情境，非二元。
  physical_reason:
    certainty: 🟠
    text: 頭部 11 磅快速向上抬升是 Race Club 確認的 coupling 動作（量測：抬頭比低頭遠 0.32m、12m 快 0.12 秒），但這個效應依賴選手能在抬頭瞬間維持身體軸線——核心力量不足或柔軟度有限的選手抬頭會破壞 streamline， coupling 增益被 streamline 損失蓋過。低頭派的對立論述也成立：對追求快入水策略的選手（如 Anthony Ervin 風格），低頭飛行軌跡更直接、入水更快，抬頭反而拖慢入水時機。所以這不是「對 vs 錯」而是「策略選擇」。
    observation_basis: 觀察者為 The Race Club Ch 23 的菁英影像觀察（即下方 evidence 的來源），族群為菁英出發動作。外推邊界：「11 磅」「遠 0.32 m」「12 m 快 0.12 秒」都是 Race Club 自行量測的數字， **未經同儕審查、未報告樣本數與重複次數，不得當成可預期的增益值**；後半「低頭派對追求快入水者也成立」是策略對立的並陳，不是本觀察比較出的結論——本條的可用結論只有「這是策略選擇不是對錯」這一句。
  evidence:
  - certainty: 🟠
    text: Amanda Kendall VM 量測抬頭 vs 低頭：抬頭飛行距離 +11%、到 12m 時間 -3%；但量測對象需要本身有足夠核心控制配合。
    source: Race Club Ch 23（菁英影像觀察）
    source_ids:
    - src.race-club-ch-23
    observation_basis: 觀察者為 The Race Club 第 23 章的教學素材，受測者具名為單一菁英選手 Amanda Kendall，量測方式為該單位自行架設的影像分析。外推邊界：**n=1**，未報告重複次數與變異，「+11%」「-3%」是單一受試的對比值，不是可預期的族群增益；且原始素材本身指出效果依賴受測者的核心控制能力，所以連該選手自己在疲勞或減量期是否重現都未知。不得用於任何族群推論。
  correct_concept: 評估選手核心控制與飛行軌跡偏好再決定：核心強+追求飛行距離的選手用抬頭 coupling；核心普通或追求快入水策略的用低頭。教學初期先用中立姿勢（不刻意抬也不壓），技術成熟後再加入抬頭訓練作為進階選項。
  perception_impact: 絕對化口令逼選手執行不適合自己的動作。抬頭派下的非合適者破壞 streamline、低頭派下的合適者放棄 coupling 增益——兩種情況都把感知從「身體軸線回饋」轉移到「我有沒有達到口令要求」的動作監控。
  cross_ref: starts-turns.tech.4（兩派並陳分析）
  cross_ref_ids:
  - starts-turns.tech.4
- id: starts-turns.err11
  stroke: starts-turns
  category: turn
  title: 轉身越快越好——approach 速度過快反失分
  misconception: 部分教練只強調「轉身越快越好」「不要減速」，把 approach（接近牆）速度當成轉身品質的唯一指標。結果選手在接近牆時無法精確控制翻滾啟動時機，要嘛太早翻、要嘛撞牆，反而比稍微減速但精確翻滾的選手慢。
  physical_reason:
    certainty: 🔵
    text: 轉身效率 = approach 速度 × 翻滾精確度 × 推蹬品質。三者乘積決定總時間，只追求 approach 速度（其中一項）會犧牲翻滾精確度（另一項）——當翻滾時機誤差 0.1 秒，推蹬位置與最佳位置可能偏離 30-50 公分，後續水下推進距離與方向都受影響。菁英選手在最後 5 公尺通常有「微減速 + 精確翻滾啟動」的模式，不是「全力衝牆 + 隨機翻滾」。
  cross_ref: 進牆速度保護、翻滾啟動時機、轉身核心目標
  cross_ref_ids:
  - starts-turns.tech.19
  - starts-turns.tech.38
  - starts-turns.tech.17
  correct_concept: approach 訓練要同時涵蓋速度與精確度，不是只追求速度。 Drill：在最後 5 公尺刻意調整 stroke count（例如固定 3 划接翻），建立「速度可調 + 翻滾時機精確」的雙重控制感。
  perception_impact: 只追求速度時感知頻寬鎖在「我夠不夠快」，犧牲了「我什麼時候該啟動翻滾」的時機感。加上時機感的訓練後，選手會發現「稍慢但精確」的總時間比「全力但隨機」更短。
- id: starts-turns.err12
  stroke: starts-turns
  category: breakout
  title: Breakout 多踢幾下、慢慢上來避免掉速——水下越久速度衰減越多
  misconception: 常見教練口令「再多踢幾下、慢慢上來，不要太快出水會掉速」，立意是避免出水時 streamline 鬆掉造成速度損失。但實際是水下推進的速度衰減比水面游速更快——超過個人最佳出水時機後，每多一下水下踢都在掉速。
  physical_reason:
    certainty: 🟢
    source_ids:
    - src.general-swim-science-consensus
    text: 水下推進速度從蹬牆瞬間（5-6 m/s）就開始衰減，海豚踢主要功能是「維持速度」而非「加速」。當水下速度衰減到接近個人游速時，繼續水下就是淨損失——應該立刻出水接划手。每位選手有自己的「最佳出水點」（通常在 5-12 公尺之間，依個人水下踢力與游速比例而定），超過這個點都是浪費。「慢慢上來」口令把「保持 streamline」（對）與「待越久越好」（錯）混淆。
  evidence:
  - certainty: 🟢
    text: 水下推進速度衰減模型 + 菁英選手出水時機影像分析。
    source: 通用游泳科學共識（Race Club / 多項游泳生物力學研究）
    source_ids:
    - src.general-swim-science-consensus
  cross_ref: 水下比水面快、自由式 Breakout 七要點、最優水下距離由個人速度衰減曲線決定
  cross_ref_ids:
  - starts-turns.tech.32
  - starts-turns.tech.44
  - udk.tech.18
  correct_concept: 個別化測試最佳出水點——用秒錶與標記比較不同距離出水的 15m 總時間，找到個人最快的出水位置。多數選手最佳點在 5-10 公尺；超過 12 公尺通常已是淨損失區。
  perception_impact: 「慢慢上來」口令把感知重點放在「我能撐多久水下」，反而錯過了「速度何時開始低於游速」這個關鍵訊號。正確的感知目標是「速度感」——感覺水下推進開始費力、速度感開始下降，就是出水時機。
- id: starts-turns.err13
  stroke: starts-turns
  category: timing
  title: 蛙式 pullout 完全靜止才划手——錯失最佳推進力疊加時機
  misconception: 部分教練教蛙式 pullout 時要求「等流線完全靜止再開始划手」，立意是避免 streamline 不到位就動，但實際是錯過了推進力疊加的最佳時機。
  physical_reason:
    certainty: 🟠
    text: 蛙式 pullout 的物理目標是「流線速度 + 第一划水推進力」的疊加最大化，不是「等到完全靜止才動」。最佳啟動時機是當流線速度衰減到接近、但尚未低於蛙式游速時——這個時候啟動第一划水，加速度推進可以接續上殘留的水下速度，避免速度斷層。等到完全靜止才划，等於放棄了水下殘留動能，相當於每次轉身都要從零開始加速到蛙式游速——明顯效率低。
    observation_basis: 全條是速度銜接的力學推導，與 `udk.err8` 同一個邏輯家族（不要等速度掉到游速以下才啟動）：流線速度衰減到接近但尚未低於蛙式游速時啟動第一划，可避免速度斷層。 **本檔未記錄任何觀察者或量測**——「接近但尚未低於」是判準的方向，不是量到的切點。外推邊界：本條**不提供任何時間、距離或速度的啟動門檻**；蛙式 pullout 另受規則限制（一次划手加一次海豚踢的時序），與此處純力學的最佳化不是同一層問題，實作時規則優先。
  cross_ref: 蛙式 Pullout 三種技術、UDK 起踢規則、轉身後必須先滑行，等速度降下來再開始踢腿
  cross_ref_ids:
  - starts-turns.tech.26
  - udk.tech.17
  - udk.err8
  correct_concept: 啟動時機判斷：感覺「水下速度開始低於游速」就是該動的訊號。不是視覺判斷（看不到自己），是身體對水流速度感的判斷。訓練 drill：在不同時機啟動第一划，計時對比，找到個人最佳時機。
  perception_impact: 「等完全靜止」口令把感知頻寬鎖在「我有沒有靜止」，把焦點放錯方向。正確感知是「水流速度感的轉折點」——這需要 L3 以上的水感才能準確判斷。
- id: starts-turns.err14
  stroke: starts-turns
  category: breakout
  title: 起跳後第一划要呼吸補氣（200m 以上）——破壞 breakout 速度的最大錯誤
  misconception: 有教練對 200m 以上自由式選手教「起跳後第一划就要呼吸補氣，後面才有體力」，立意是避免缺氧。但這個口令把選手的最快速度段（起跳後 breakout）拿來呼吸，是速度損失最大的時段之一。
  physical_reason:
    certainty: 🟠
    source_ids:
    - src.race-club-ch-23-7
    text: 起跳後 breakout 的速度通常是整趟最快段（接近水下推進殘留動能）。抬頭呼吸即時打破 streamline 與身體軸線，速度立刻下降——這個損失遠大於「不換氣 1 划」對體能的負擔（一划約 1-2 秒，氧氣儲備充足）。 Race Club Ch 23 第 7 點明確規定：起跳後第一划絕對不換氣，無論比賽距離（200/400/800/1500 都一樣）。轉身後第一划換氣（200m 以上）是另一回事——那是補回轉身屏氣的需求，兩者不能類推。
    observation_basis: 觀察者為 The Race Club 第 23 章第 7 點的教練處方（即下方 evidence 的來源），族群為競技自由式 200 m 以上項目的選手。外推邊界：「breakout 是整趟最快段」與「一划約 1–2 秒」是本庫的力學與時序推導， **不是 Race Club 提供的量測**；該素材給的是一條絕對化的教練規定，沒有附上速度損失量或氧債的數據，所以本條不得宣稱「損失多少秒」。成人初學與兒童在 breakout 常本來就撐不到不換氣，不適用此規定。
  evidence:
  - certainty: 🟠
    text: Race Club 觀察菁英 200m+ 選手的 breakout 模式，幾乎全部第一划不換氣。
    source: Race Club Ch 23 第 7 點（菁英教練共識）
    source_ids:
    - src.race-club-ch-23-7
    observation_basis: 觀察者為 The Race Club 的教練群，素材是菁英 200 m 以上自由式選手的比賽／訓練影像，判讀項目是「第一划有無換氣」這個二元事實。外推邊界：「幾乎全部」是印象式的比例陳述，**未報告樣本數與確切比例**，不得寫成百分比；本觀察只能支持「菁英族群普遍如此」，不能支持「這樣做會比較快」——沒有任何對照。
  correct_concept: 起跳後第一划絕對不換氣，第二划開始建立呼吸節律。轉身後可以第一划換氣（200m+ 距離），是不同情境的不同決策。教練要分清楚兩個情境再給口令。
  perception_impact: 「第一划要呼吸」口令讓選手把感知放在呼吸時機監控，破壞了 breakout 那段最寶貴的「速度感」回饋——而 breakout 速度感是判斷流線與出水時機的核心感知。
  cross_ref: starts-turns.tech.44（自由式 Breakout 七要點，含「第一划不換氣」）
  cross_ref_ids:
  - starts-turns.tech.44
