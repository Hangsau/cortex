domain: periodization
sub: _index
schema_version: 1
structure:
- id: periodization.structure.gas
  file: structure.yaml
  name_zh: 一般適應症候群
  gist_zh: 用壓力與恢復理解訓練適應的框架；不是個人加量時程的驗證
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.structure.schools_overview
  file: structure.yaml
  name_zh: 週期化多派概覽
  gist_zh: 週期化不是定論而是幾派辯論：傳統/板塊/極化/Olbrecht/反向；含 Q1–Q11 導讀＋作者立場
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.structure.school_block
  file: structure.yaml
  name_zh: 板塊週期化（Issurin）
  gist_zh: 菁英序列集中而非並行；殘留效應決定換塊（速度~5d/有氧~30d）；8–12 週一階段
  stages:
  - t2c
  - t2w
- id: periodization.structure.perception_periodization_bridge
  file: structure.yaml
  name_zh: 感知—週期化橋接
  gist_zh: 特定手部任務的疲勞學習研究與 PoST 概念框架；跨到游泳及水感知仍需驗證
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.structure.annual.monocycle
  file: structure.yaml
  name_zh: 單週期
  gist_zh: 一年衝一個高峰；適合新手/青少年/單一目標賽季
  stages:
  - l2t
  - t2t
- id: periodization.structure.annual.bicycle
  file: structure.yaml
  name_zh: 雙週期
  gist_zh: 一年衝兩個高峰；競技泳者原型，對應 ADM 一年兩巔峰
  stages:
  - t2c
  - t2w
- id: periodization.structure.annual.tricycle
  file: structure.yaml
  name_zh: 三週期
  gist_zh: 一年衝三個高峰；高水準多目標賽季
  stages:
  - t2w
- id: periodization.structure.annual.multipeak
  file: structure.yaml
  name_zh: 多巔峰
  gist_zh: 賽事極密集時用；風險高，游泳少用
  stages: []
- id: periodization.structure.macrocycle
  file: structure.yaml
  name_zh: 中觀週期
  gist_zh: 本書數週組成的中型週期；3:1 是選項，依任務與恢復決定
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.structure.microcycle
  file: structure.yaml
  name_zh: 微觀週期
  gist_zh: 常用一週整理可用課次；每堂依品質與恢復調整，不預設六練一休
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.structure.detraining
  file: structure.yaml
  name_zh: 停練衰退安全表
  gist_zh: 完全停練的衰退速率；停 4 週 VO2max 掉 14%——休季別躺平
  stages:
  - t2c
  - t2w
- id: periodization.structure.swim_annual
  file: structure.yaml
  name_zh: 游泳年度結構
  gist_zh: 菁英實證：一年 2–4 macrocycle、86–90% 量為低強度（Hellard 2019）
  stages:
  - t2c
  - t2w
- id: periodization.structure.swim_youth_ltad
  file: structure.yaml
  name_zh: 青少年分齡 LTAD
  gist_zh: 對齊 ADM 分齡；PHV 女12.5/男14；trainability 窗口有爭議須慎用
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
taper:
- id: periodization.taper.definition
  file: taper.yaml
  name_zh: 減量定義
  gist_zh: 賽前慢慢降量；保留體能、消掉疲勞，比賽當天有料又不累
  stages:
  - t2c
  - t2w
- id: periodization.taper.volume
  file: taper.yaml
  name_zh: 訓練量
  gist_zh: 標準降41–60%；高量訓練塊後降60–90%
  stages:
  - t2c
  - t2w
- id: periodization.taper.intensity
  file: taper.yaml
  name_zh: 訓練強度
  gist_zh: 保適應旋鈕；強度不能跟著砍，要留快游
  stages:
  - t2c
  - t2w
- id: periodization.taper.frequency
  file: taper.yaml
  name_zh: 訓練頻率
  gist_zh: 下水頻率維持至少80%，縮短每堂而非大量停水
  stages:
  - t2c
  - t2w
- id: periodization.taper.duration
  file: taper.yaml
  name_zh: 減量時長
  gist_zh: 8–14 天為主；之前越累拉越長
  stages:
  - t2c
  - t2w
- id: periodization.taper.type.linear
  file: taper.yaml
  name_zh: 線性遞減
  gist_zh: 等量直線下降；可用方案之一，與個人歷次反應比較
  stages:
  - t2c
  - t2w
- id: periodization.taper.type.step
  file: taper.yaml
  name_zh: 階梯式減量
  gist_zh: 一次降量後維持；統合平均較低，不代表個人必然較差
  stages:
  - t2c
  - t2w
- id: periodization.taper.type.fast_exponential
  file: taper.yaml
  name_zh: 快速指數遞減
  gist_zh: 統合研究平均效果最高；無個人歷史時作標準首選
  stages:
  - t2c
  - t2w
- id: periodization.taper.peak_window
  file: taper.yaml
  name_zh: 達峰窗
  gist_zh: 主賽放進達峰後7–14天；超出時用恢復＋再刺激＋微減量
  stages:
  - t2c
  - t2w
- id: periodization.taper.swim
  file: taper.yaml
  name_zh: 游泳減量應用
  gist_zh: 8–14天快速指數減量、降41–60%、頻率留80%、保賽速
  stages:
  - t2c
  - t2w
zones:
- id: periodization.zones.school_polarized
  file: zones.yaml
  name_zh: 極化分布（Seiler/TID）
  gist_zh: 問每區占幾成：80/20 極化、避中間 Z2；但游泳不吻合——菁英泳者 44–46% 的量就在 2–4 mmol（Hellard 2019）
  stages:
  - t2c
  - t2w
- id: periodization.zones.olbrecht_model
  file: zones.yaml
  name_zh: Olbrecht 能量系統個體化
  gist_zh: 最適非最大；閾值=魔法子彈謬誤；capacity/power 不能同時練；個體乳酸測試
  stages:
  - t2c
  - t2w
- id: periodization.zones.table_7_1
  file: zones.yaml
  name_zh: Bompa 六分區
  gist_zh: 用最大表現百分比分 6 區；賽配速=zone 2，每週≥50% 落賽配速
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.energy_systems_primer
  file: zones.yaml
  name_zh: 三大能量系統運作入門
  gist_zh: 磷酸原(0–10s爆發)/糖酵解(10s–2min乳酸)/有氧(2min+持續)三系統的運作、主導距離與訓練方向；三者連續重疊非開關
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.table_11_2
  file: zones.yaml
  name_zh: 心率/攝氧/能量系統對照
  gist_zh: 把心率攝氧對應到主導能量系統；確認該組課練到哪套系統
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.table_11_1
  file: zones.yaml
  name_zh: 低強度耐力方法
  gist_zh: 主動恢復/長慢游/節奏游等；低強度與高強度耐力不可亂混
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.endurance_phases
  file: zones.yaml
  name_zh: 耐力週期化三階段
  gist_zh: 廣度有氧→有氧+專項→專項耐力；順序不能顛倒
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.swim_maglischo
  file: zones.yaml
  name_zh: Maglischo 游泳六分區
  gist_zh: 游泳專用分區：恢復/En1/En2/En3/AnTh(3–5mmol)/VO2max；SP另類
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.swim_three_zone
  file: zones.yaml
  name_zh: 三區乳酸模型
  gist_zh: TID 分析用：Z1≤2 / Z2 2–4 / Z3>4 mmol
  stages:
  - t2c
  - t2w
- id: periodization.zones.swim_energy_by_distance
  file: zones.yaml
  name_zh: 各距離能量系統供能比
  gist_zh: 50m 有氧5–20%、100m≈各半、400m 40–84%(跨研究區間)
  stages:
  - t2c
  - t2w
- id: periodization.zones.swim_tid
  file: zones.yaml
  name_zh: 訓練強度分布 TID
  gist_zh: 極化/金字塔/閾值三型；游泳把 44–46% 的量放在中間閾值區(Hellard 2019);依距離分流短=極化長=金字塔
  stages:
  - t2c
  - t2w
- id: periodization.zones.swim
  file: zones.yaml
  name_zh: 游泳配速分區應用
  gist_zh: 組課明列距離、速度、次數與休息；撤回通用賽速分區與每週至少一半賽速配方
  stages:
  - t2t
  - t2c
  - t2w
dryland:
- id: periodization.dryland.flexibility
  file: dryland.yaml
  name_zh: 柔軟度與活動度介入
  gist_zh: 先分清被動範圍、主動控制與任務限制，再選介入及水中驗收
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.dryland.overview
  file: dryland.yaml
  name_zh: 陸訓總覽
  gist_zh: 出發用爆發、推牆與划水產力用最大力量、轉身後5m用核心；全部接回水中驗收
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.dryland.transfer
  file: dryland.yaml
  name_zh: 力量轉移效果
  gist_zh: 36個RCT共844人支持水中＋陸上；依掉速段選陸訓，4–6週用水中分段判定轉移
  stages:
  - t2c
  - t2w
- id: periodization.dryland.methods
  file: dryland.yaml
  name_zh: 陸訓模式比較
  gist_zh: 最大力量接推牆與划水功率；增強式接出發轉身；核心接轉身後5m；力量耐力接後段姿勢
  stages:
  - t2c
  - t2w
- id: periodization.dryland.concurrent
  file: dryland.yaml
  name_zh: 並行排程殘留疲勞
  gist_zh: 小樣本隔夜研究未見差異；按同條件表現、RPE 與品質調整，不用通用間隔
  stages:
  - t2c
  - t2w
- id: periodization.dryland.needs_analysis
  file: dryland.yaml
  name_zh: NSCA需求分析與三層驗收
  gist_zh: 先找掉速任務與個人限制；依序驗收陸上能力、水中相位／外力與完整泳段
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.dryland.injury
  file: dryland.yaml
  name_zh: 游泳肩容量與疼痛管理
  gist_zh: 有痛先追疼痛、ROM與容量；無痛但能力不足再補外旋、肩胛與全鏈訓練
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.dryland.youth
  file: dryland.yaml
  name_zh: 青少年與特殊族群負重安全
  gist_zh: 能守規則約7–8歲起徒手；成熟後負重；成人先學動作、masters看恢復、para依功能分流
  stages:
  - l2t
  - t2t
- id: periodization.dryland.caveats
  file: dryland.yaml
  name_zh: 無反應時的調整規則
  gist_zh: 陸上進步但水中不變就換水中阻力或賽速；每4–6週依乾地→分段→完整成績換法
  stages:
  - t2c
  - t2w
decisions:
- id: periodization.decisions.planner
  file: decisions.yaml
  anchor: planner
  name_zh: 套用週期決策
  gist_zh: 輸入目標、課次、近期反應，取得安排理由、觀察點與調整條件；含三個可試範例
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.decisions.monitoring
  file: decisions.yaml
  anchor: planner-monitoring
  name_zh: 同條件比較與記錄
  gist_zh: 計時、RPE、划頻划距與恢復的判讀方向；一張可重用的記錄欄
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.decisions.set_response
  file: decisions.yaml
  anchor: periodization.decisions.set_response
  name_zh: 2026 組課反應研究
  gist_zh: 同一乳酸數字可能掩蓋不同生理反應；急性研究不證明長期訓練優劣
  stages:
  - t2c
  - t2w
- id: periodization.decisions.hrv_response
  file: decisions.yaml
  anchor: periodization.decisions.hrv_response
  name_zh: 2026 HRV 負荷反應研究
  gist_zh: 加量時 HRV 改變與表現維持可並存，不以單一數字自動加減量
  stages:
  - t2c
  - t2w
