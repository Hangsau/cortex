domain: periodization
sub: _index
schema_version: 1
structure:
- id: periodization.structure.schools_overview
  file: structure.yaml
  name_zh: 週期化多派概覽
  gist_zh: 週期化不是定論而是幾派辯論：傳統/板塊/極化/Olbrecht/反向；含 Q1–Q11 導讀＋作者立場
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.structure.school_block
  file: structure.yaml
  name_zh: 板塊週期化（Issurin）
  gist_zh: 菁英序列集中而非並行；殘留效應決定換塊（速度~5d/有氧~30d）；8–12 週一階段
  stages:
  - t2c
  - t2w
- id: periodization.structure.perception_periodization_bridge
  file: structure.yaml
  name_zh: 感知—週期化橋接
  gist_zh: 🔵綜合：技能週期化+疲勞損害技能學習有文獻(Branscheidt2019/PoST)；真正🔴空白只剩水感知L0–L6專屬量測
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.structure.annual.monocycle
  file: structure.yaml
  name_zh: 單週期
  gist_zh: 一年衝一個高峰；適合新手/青少年/單一目標賽季
  stages:
  - l2t
  - t2t
- id: periodization.structure.annual.bicycle
  file: structure.yaml
  name_zh: 雙週期
  gist_zh: 一年衝兩個高峰；競技泳者原型，對應 ADM 一年兩巔峰
  stages:
  - t2c
  - t2w
- id: periodization.structure.annual.tricycle
  file: structure.yaml
  name_zh: 三週期
  gist_zh: 一年衝三個高峰；高水準多目標賽季
  stages:
  - t2w
- id: periodization.structure.annual.multipeak
  file: structure.yaml
  name_zh: 多巔峰
  gist_zh: 賽事極密集時用；風險高，游泳少用
  stages: []
- id: periodization.structure.macrocycle
  file: structure.yaml
  name_zh: 中觀週期
  gist_zh: 2–6 週的中型週期；最常見 3:1（3 負荷週 + 1 恢復週）
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.structure.microcycle
  file: structure.yaml
  name_zh: 微觀週期
  gist_zh: 一週，排課表的最小單位；分發展/競賽/恢復/卸載型
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.structure.detraining
  file: structure.yaml
  name_zh: 停練衰退安全表
  gist_zh: 完全停練的衰退速率；停 4 週 VO2max 掉 14%——休季別躺平
  stages:
  - t2c
  - t2w
- id: periodization.structure.swim_annual
  file: structure.yaml
  name_zh: 游泳年度結構
  gist_zh: 菁英實證：一年 2–4 macrocycle、86–90% 量為低強度（Hellard 2019）
  stages:
  - t2c
  - t2w
- id: periodization.structure.swim_youth_ltad
  file: structure.yaml
  name_zh: 青少年分齡 LTAD
  gist_zh: 對齊 ADM 分齡；PHV 女12.5/男14；trainability 窗口有爭議須慎用
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
taper:
- id: periodization.taper.definition
  file: taper.yaml
  name_zh: 減量定義
  gist_zh: 賽前慢慢降量；保留體能、消掉疲勞，比賽當天有料又不累
  stages:
  - t2c
  - t2w
- id: periodization.taper.volume
  file: taper.yaml
  name_zh: 訓練量
  gist_zh: 減量主旋鈕；研究區間作候選起點，以個人 pretaper 負荷與反應校準
  stages:
  - t2c
  - t2w
- id: periodization.taper.intensity
  file: taper.yaml
  name_zh: 訓練強度
  gist_zh: 保適應旋鈕；強度不能跟著砍，要留快游
  stages:
  - t2c
  - t2w
- id: periodization.taper.frequency
  file: taper.yaml
  name_zh: 訓練頻率
  gist_zh: 保技術旋鈕；維持部分下水與賽速暴露，比例依個人反應調整
  stages:
  - t2c
  - t2w
- id: periodization.taper.duration
  file: taper.yaml
  name_zh: 減量時長
  gist_zh: 8–14 天為主；之前越累拉越長
  stages:
  - t2c
  - t2w
- id: periodization.taper.type.linear
  file: taper.yaml
  name_zh: 線性遞減
  gist_zh: 等量直線下降；可用方案之一，與個人歷次反應比較
  stages:
  - t2c
  - t2w
- id: periodization.taper.type.step
  file: taper.yaml
  name_zh: 階梯式減量
  gist_zh: 一次降量後維持；統合平均較低，不代表個人必然較差
  stages:
  - t2c
  - t2w
- id: periodization.taper.type.fast_exponential
  file: taper.yaml
  name_zh: 快速指數遞減
  gist_zh: 前快後慢；統合平均訊號較高，作候選而非固定首選
  stages:
  - t2c
  - t2w
- id: periodization.taper.peak_window
  file: taper.yaml
  name_zh: 達峰窗
  gist_zh: 7–14 天作排程起點；用歷次反應估計個人高表現窗
  stages:
  - t2c
  - t2w
- id: periodization.taper.swim
  file: taper.yaml
  name_zh: 游泳減量應用
  gist_zh: 常見天數與降量範圍作候選；按主項、pretaper 負荷與個人反應校準
  stages:
  - t2c
  - t2w
zones:
- id: periodization.zones.school_polarized
  file: zones.yaml
  name_zh: 極化分布（Seiler/TID）
  gist_zh: 問每區占幾成：80/20 極化、避中間 Z2；但游泳金字塔型更常見（González-Ravé 2021）
  stages:
  - t2c
  - t2w
- id: periodization.zones.olbrecht_model
  file: zones.yaml
  name_zh: Olbrecht 能量系統個體化
  gist_zh: 最適非最大；閾值=魔法子彈謬誤；capacity/power 不能同時練；個體乳酸測試
  stages:
  - t2c
  - t2w
- id: periodization.zones.table_7_1
  file: zones.yaml
  name_zh: Bompa 六分區
  gist_zh: 用最大表現百分比分 6 區；賽配速=zone 2，每週≥50% 落賽配速
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.energy_systems_primer
  file: zones.yaml
  name_zh: 三大能量系統運作入門
  gist_zh: 磷酸原(0–10s爆發)/糖酵解(10s–2min乳酸)/有氧(2min+持續)三系統的運作、主導距離與訓練方向；三者連續重疊非開關
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.table_11_2
  file: zones.yaml
  name_zh: 心率/攝氧/能量系統對照
  gist_zh: 把心率攝氧對應到主導能量系統；確認該組課練到哪套系統
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.table_11_1
  file: zones.yaml
  name_zh: 低強度耐力方法
  gist_zh: 主動恢復/長慢游/節奏游等；低強度與高強度耐力不可亂混
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.endurance_phases
  file: zones.yaml
  name_zh: 耐力週期化三階段
  gist_zh: 廣度有氧→有氧+專項→專項耐力；順序不能顛倒
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.swim_maglischo
  file: zones.yaml
  name_zh: Maglischo 游泳六分區
  gist_zh: 游泳專用分區：恢復/En1/En2/En3/AnTh(3–5mmol)/VO2max；SP另類
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.zones.swim_three_zone
  file: zones.yaml
  name_zh: 三區乳酸模型
  gist_zh: TID 分析用：Z1≤2 / Z2 2–4 / Z3>4 mmol
  stages:
  - t2c
  - t2w
- id: periodization.zones.swim_energy_by_distance
  file: zones.yaml
  name_zh: 各距離能量系統供能比
  gist_zh: 50m 有氧5–20%、100m≈各半、400m 40–84%(跨研究區間)
  stages:
  - t2c
  - t2w
- id: periodization.zones.swim_tid
  file: zones.yaml
  name_zh: 訓練強度分布 TID
  gist_zh: 極化/金字塔/閾值三型；游泳金字塔最常見(162筆89);依距離分流短=極化長=金字塔;連衝刺者也87–90%量在Z1
  stages:
  - t2c
  - t2w
- id: periodization.zones.swim
  file: zones.yaml
  name_zh: 游泳配速分區應用
  gist_zh: 組課強度用比賽配速百分比表達；映射 Bompa 不發明數字
  stages:
  - t2t
  - t2c
  - t2w
dryland:
- id: periodization.dryland.overview
  file: dryland.yaml
  name_zh: 陸訓總覽
  gist_zh: 爭論不是能不能變強(能)而是三件事:轉移成不成立/並行排程/成熟度;有條件成立非鐵律
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.dryland.transfer
  file: dryland.yaml
  name_zh: 力量轉移效果
  gist_zh: 16篇約7篇無效;最大力量最有效;轉移看技術成熟度+專項性;臥推未必預測衝刺速度
  stages:
  - t2c
  - t2w
- id: periodization.dryland.methods
  file: dryland.yaml
  name_zh: 陸訓模式比較
  gist_zh: 最大力量轉移最強;增強式只助出發轉身非整體游速(618人SR無效);專項阻力(划手板/拖傘)轉移高
  stages:
  - t2c
  - t2w
- id: periodization.dryland.concurrent
  file: dryland.yaml
  name_zh: 並行排程殘留疲勞
  gist_zh: 傍晚陸訓+12h睡眠→隔天100m無殘留疲勞(n=8);重陸訓排關鍵課前一天非當天
  stages:
  - t2c
  - t2w
- id: periodization.dryland.needs_analysis
  file: dryland.yaml
  name_zh: NSCA需求分析與三層驗收
  gist_zh: 先找掉速任務與個人限制；依序驗收陸上能力、水中相位／外力與完整泳段
  stages:
  - t2t
  - t2c
  - t2w
- id: periodization.dryland.injury
  file: dryland.yaml
  name_zh: 游泳肩傷害預防
  gist_zh: 划手讓內旋>外旋失衡=游泳肩源頭;彈力帶練外旋+肩胛8週有效;練整條動力鏈優於孤立肩肌
  stages:
  - l2t
  - t2t
  - t2c
  - t2w
- id: periodization.dryland.youth
  file: dryland.yaml
  name_zh: 青少年負重安全
  gist_zh: 無最低年齡硬門檻(能守安全規則~7-8歲);成熟度>實齡;PHV前只徒手;成人初學/masters/para是缺口
  stages:
  - l2t
  - t2t
- id: periodization.dryland.caveats
  file: dryland.yaml
  name_zh: 陸訓誠實反例
  gist_zh: 7/16無效+臥推未必預測衝刺+三組100m無差+增強式對游速無效;轉移有條件成立非普遍
  stages:
  - t2c
  - t2w
