domain: periodization
sub: set_design
schema_version: 1
overview:
  id: periodization.set_design.overview
  cert: 🔵
  name_zh: 組課設計的六個步驟
  provenance_zh: 渦流計畫的操作模型；用於整理與試行，尚未經訓練成效試驗驗證。
  evidence_from:
  - periodization.set_design.anchors
  - periodization.set_design.css_evidence
  - periodization.set_design.energy_targets
  - periodization.set_design.variables
  - periodization.set_design.weekly_assembly
  - periodization.set_design.phase_allocation
  - periodization.set_design.monitoring_exit
  version: '1.0'
  steps:
  - step_no: 1
    title: 量錨點
    text: 先有這個人自己的時間。沒有錨點就沒有目標時間，只能憑感覺開組——這是自動課表生成最先卡住的地方。
  - step_no: 2
    title: 定這組要練什麼
    text: 先講清楚這組的意圖：速度、乳酸生成、乳酸耐受、賽速重複、閾值有氧、輕鬆恢復。意圖決定後面四個數字，反過來不行。
  - step_no: 3
    title: 填四個變項
    text: 順序固定：距離 → 目標時間 → 休息 → 次數。每一步都由前一步推出來，任何一步改了，後面要重算。
  - step_no: 4
    title: 擺進一週
    text: 同一週裡吃力的組要隔開，維持課補中間。可用課次少的時候，先砍次數不砍間隔。
  - step_no: 5
    title: 對到階段
    text: 同一組課在基礎期與賽前期的份量不同。階段只調配比與頻率，不改第 3 步的內部邏輯。
  - step_no: 6
    title: 設好退出條件
    text: 開組之前就要寫好什麼時候停這一組、什麼時候重測錨點、什麼時候整週降載。沒寫退出條件的組課不能自動生成。
  hard_rule_zh: "\U0001F535 三條不可跳過的前置條件：\n(1) 沒有錨點時間就不產生任何帶目標時間的組——退回成「熟悉任務＋記錄」，\n    不要用年齡、身高或他人成績反推配速。\n(2) 任何一組都要同時寫出距離、次數、目標時間、休息與泳式；缺一項的組不算完整規格，\n    下游沒辦法比較，也沒辦法判斷有沒有進步。\n(3) 有症狀（疼痛、暈眩、明顯呼吸困難）時本檔全部規則失效，\n    走 decisions.yaml 的停止分支。"
  plain_zh: '一組課不是「今天想練什麼就寫什麼」。它有固定的推導順序：先知道這個人現在能游多快

    （錨點），再決定這組想刺激哪套能量系統，然後照「距離 → 目標時間 → 休息 → 次數」

    把四個數字填出來，接著看這組要擺在一週的哪一天、屬於賽季的哪個階段，最後寫好

    什麼情況要停。少了任何一步，這組課就沒辦法被重複、被比較，也沒辦法交給程式自動生成。'
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
    related:
    - periodization.set_design.anchors
    - periodization.set_design.variables
    - periodization.decisions.planner
    - periodization.zones.swim
anchors:
  id: periodization.set_design.anchors
  cert: 🟢
  name_zh: 錨點時間與測驗協議
  source: Wakayoshi 等（1993）兩點法原始定義；Scott 等（2024）四泳式信度；Toubekis 等（2006）距離組合選擇；Zacca 等（2016）單次 400 公尺估計；Piatrikova 等（2018）3 分鐘全力法
  source_ids:
  - src.wakayoshi-1993-critical-velocity-mlss
  - src.scott-2024-css-stroke-specific-reliability
  - src.toubekis-2006-css-distance-selection
  - src.zacca-2016-400m-single-test-estimate
  - src.piatrikova-2018-3min-all-out-cs
  source_locator: PubMed 8425518 / 38380294（PMC10875687）/ 16475057 / 26473520 / 29651887
  sprint_anchors:
  - key: t25
    name_zh: 25 公尺全力
    use_zh: 推速度組與乳酸生成組的目標時間；也是計時誤差最大的一項
    protocol_zh: 水中出發（推牆），同一泳式，完全休息後做；取兩趟中較快者。建議電子計時。
  - key: t50
    name_zh: 50 公尺全力
    use_zh: 推乳酸生成組目標時間；50 公尺主項者的賽速基準
    protocol_zh: 水中出發或跳台出發二選一並固定；兩趟之間至少完全休息 10 分鐘。
  - key: t100
    name_zh: 100 公尺全力
    use_zh: 推 USRPT 型賽速組的分段目標；乳酸耐受組的速度上緣參照
    protocol_zh: 單次盡全力；與後續任何測驗至少隔一天。
  endurance_anchors:
  - key: t200
    name_zh: 200 公尺盡力
    use_zh: 臨界游速兩點法的第一點
    protocol_zh: 與 400 公尺同一次或分兩次皆可；同一次時中間至少完全休息 20–30 分鐘，且先做 200 後做 400 的順序要固定。
  - key: t400
    name_zh: 400 公尺盡力
    use_zh: 臨界游速兩點法的第二點；亦可單獨用於粗估
    protocol_zh: 同泳式、同池長、同出發方式；配速要求是全程盡力而非前快後爆。
  css_formula_zh: 🟢 臨界游速（每 100 公尺配速）＝（T400 秒數 − T200 秒數）÷ 2。這個兩點簡化不是後人的商業發明——原始論文的原文就是「以游 200 公尺與 400 公尺所需的兩個時間連線的斜率計算臨界速度」，Swim Smooth 只是把斜率換算成每百公尺秒數，數學上等價。
  distance_choice_rule_zh: '🟢 兩點必須用 200 與 400 公尺，不可換成 50 或 100。

    20 名青少年泳者（12.9±1.1 歲）的距離組合比較顯示，任何含 50 或 100 公尺的組合

    都讓臨界速度顯著高於乳酸閾值速度，50＋100 的組合偏差最大；200–400 的組合

    才落在略低於 4 mmol 速度的位置。短距離把速度—距離直線的截距吃掉，斜率就失真。'
  reliability_zh: '🟢 兩點法在四種泳式都可重複：32 名全國級泳者在三週內做 3 次 200 公尺與

    3 次 400 公尺，臨界速度的典型誤差 ≤0.04 m/s、變異係數四式皆 <4%，

    單項 200 與 400 的個人變異係數 <2%。

    ⚠️ 同一份資料顯示「無氧距離容量」（速度—距離直線的截距）**不可靠**：

    典型誤差 4–9 公尺、變異係數 13–45%。本檔只用斜率（臨界游速），不用截距做任何決策。'
  butterfly_limit_zh: 🟢 蝶式不要擴成三點法。同一研究的可行性資料：能夠（且願意）加做 800 公尺第三點的比例，蝶式只有 39%，蛙式 71%，仰式與自由式 100%。蝶式維持兩點。
  fallback_zh: '🟢 只拿得到一次 400 公尺時的退路：以 400 公尺平均速度的 0.92 倍估臨界速度

    （14–16 歲樣本，變異係數約 2%）。這是估計值，標註來源與誤差後可用於排課，

    但不可用來宣稱「他的閾值是多少」。

    另有 3 分鐘全力法可用（變異係數 0.9%、與傳統法相關 r＝0.97），

    但它需要嚴格的出發與計時控制，本檔預設仍走 200/400。'
  retest_interval_zh: 🔵 建議 4–6 週重測一次，不是每 2–4 週。理由見 css_evidence 的敏感度段落：臨界速度對訓練適應的反應遲鈍，太密的重測只會量到當天狀態波動，還占掉一次品質課的名額。
  plain_zh: '要開有目標時間的組課，得先知道這個人現在游多快。短距離的錨點是 25、50、100 公尺

    的全力成績；耐力的錨點是用 200 和 400 公尺算出來的「臨界游速」——把兩個時間相減

    再除以二，得到每 100 公尺的配速。

    這裡有三個容易踩的坑：① 兩點只能用 200 和 400，換成 50 或 100 算出來會偏快；

    ② 蝶式不要勉強加做 800 公尺當第三點，實測有六成的人做不到或不願意做；

    ③ 只算斜率（配速），不要用截距（所謂「無氧距離容量」），那個數字的誤差大到不能用。

    如果只有一次 400 公尺成績，可以用它的平均速度乘 0.92 先估一個，但要標明是估的。'
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - periodization.set_design.css_evidence
    - periodization.set_design.variables
    - periodization.decisions.monitoring
css_evidence:
  id: periodization.set_design.css_evidence
  cert: 🟢
  name_zh: 臨界游速的證據鏈與外推邊界
  source: Wakayoshi 等（1992, 1993）原始推導；Dekerle 等（2005, 2010）與 Pelarigo 等（2011）與最大乳酸穩態的比較；Toubekis 與 Tokmakidis（2013）綜述；Nikitakis 等（2019）兒童與青少年；di Prampero 等（2008）泳式能量學校正；Toubekis 等（2011）訓練敏感度；Rizzato 等（2018）族群偏差
  source_ids:
  - src.wakayoshi-1992-critical-velocity-flume
  - src.wakayoshi-1993-critical-velocity-mlss
  - src.dekerle-2005-css-not-mlss
  - src.pelarigo-2011-css-above-mlss
  - src.dekerle-2010-css-severe-domain
  - src.toubekis-tokmakidis-2013-css-review
  - src.nikitakis-2019-css-children-adolescents
  - src.diprampero-2008-css-energetic-correction
  - src.toubekis-2011-cv-insensitive-to-training
  - src.rizzato-2018-css-population-bias
  source_locator: PubMed 1555562 / 8425518 / 16195984 / 20926340 / 19577514 / 23449237 / 30669295 / 17901978 / 21386726 / 28597620
  origin_zh: '🟡 起點是四篇常被混講成一篇的論文。1992 年那篇最常被引用的是**水槽**研究

    （9 名泳者、6 種速度游到力竭），距離—時間關係的判定係數 >0.998，臨界速度

    1.166±0.052 m/s，與血乳酸拐點速度的相關 r＝0.949，與 400 公尺平均速度

    相關 r＝0.864——但該研究**沒有量最大乳酸穩態**。

    1993 年那篇才是泳池兩點法的原型，與 4 mmol 速度的相關為 r＝0.914。

    ⚠️ 常見拼接錯誤：把水槽研究的 r＝0.949 說成「兩點法與乳酸閾值的相關」。

    那是兩個不同的方法、不同的比較對象，不可互換敘述。'
  not_mlss_zh: '🟢 臨界游速**不等於**最大乳酸穩態速度，也不能互相替代。

    以最大有氧速度為分母，臨界游速落在 92.7±2.6%，最大乳酸穩態落在 88.3±2.9%；

    兩者相關 r＝0.87，但一致性界限達 0.07±0.13 m/s——相關高不代表可替換。

    另一份研究的絕對值是臨界速度 1.30±0.08 對最大乳酸穩態 1.22±0.05 m/s（快約 6.6%）。

    綜述的彙整區間是：臨界速度比最大乳酸穩態快 3–6%，比乳酸閾值快 8–11%。

    本庫採用的說法：**臨界游速比最大乳酸穩態快約 3–7%，高度相關但不可互換。**'
  severe_domain_zh: '🟢 這是本次整合最重要的一次語意更正。

    外部資料把「約能維持 20–30 分鐘的配速」說成「有氧與無氧的分界線（有氧閾值）」。

    數字對得上，語意完全相反。

    原始研究（9 名男性、四點法）測到的是：以臨界速度**持續游到力竭**的時間為

    24.3±7.7 分鐘，過程中血乳酸與攝氧量一路爬升到峰值的 95±5%；

    比臨界速度慢 5% 時可撐 48.9±14.1 分鐘、血乳酸穩定在 3.8±1.9 mmol；

    快 5% 時只剩 8.6±3.1 分鐘。作者的結論是臨界速度落在**重度強度域**。

    也就是說，24 分鐘是**力竭時間**，不是「可穩定維持的閾值」。

    對排課的實際差別：不要開「以臨界游速連續游 30 分鐘」這種組；

    要開就開**間歇**——同一份研究裡 10×400 公尺以臨界速度、休 40 秒是可以完成的

    （總計 53.9±2.7 分鐘），血乳酸維持穩定。'
  children_zh: '🟢 兒童與青少年要再退一步。10 名兒童（11.5±0.4 歲）與 10 名青少年（15.8±0.7 歲）

    的比較顯示，臨界速度與游泳最大乳酸穩態速度的平均值沒有顯著差異（p＝0.12），

    但**連續**游臨界速度時終末血乳酸顯著較高（兒童 4.0 對 3.4、青少年 4.5 對 3.1 mmol/L），

    部分受試者無法完成 30 分鐘；改成**間歇**（10×200）則與最大乳酸穩態吻合。

    本檔規則：未成年泳者的臨界游速一律只用於間歇組，不開連續長時間定速游。'
  stroke_bias_zh: 🟡 泳式偏差：以能量學校正後的臨界速度為基準，傳統斜率法高估蝶式約 4%、仰式約 16%、蛙式約 7%、自由式約 11%。因此跨泳式比較臨界游速沒有意義，每個泳式各自建立錨點與趨勢。
  sensitivity_zh: 🟢 敏感度低：一份 14 週增量訓練的追蹤中，臨界速度幾乎沒動（0.3±0.8%），同期乳酸閾值上升 6.5%。⚠️ 引用限制：本庫只採「臨界速度對訓練適應的敏感度可能低於乳酸閾值」這個定性結論，該百分比在本庫升級為已查證前不對外引用。實務含意就是上面那條——重測間隔拉到 4–6 週。
  population_bias_zh: 🟢 族群偏差：相對於 4 mmol 速度，菁英泳者的臨界游速偏低估、成人 masters 偏高估。⚠️ 同樣屬待升級引用，只採定性方向。
  gaps_zh: "\U0001F534 明確查無，不得外推的五個缺口：\n(1) 沒有任何研究驗證任一商業臨界游速訓練系統（配速表、休息秒數、分區偏移）的成效；\n(2) **完全沒有**在初學者或非競技泳者身上的臨界游速效度研究——不要對這兩個族群\n    宣稱臨界游速代表什麼生理意義，本檔只把它當「可重複的個人配速基準」；\n(3) 沒有純女性樣本的臨界速度力竭時間研究（上述 24 分鐘那份全為男性）；\n(4) 沒有開放水域的臨界游速效度與信度研究；\n(5) 兩點法常被歸給 1993 年的一份澳洲教練報告，該報告無數位物件識別碼、\n    未經同儕審查，且兩點簡化在同年的原始論文中已經出現——歸屬應回到原始論文。"
  plain_zh: '臨界游速很好用，但它不是一般說的「有氧閾值」。實測是：用這個速度一直游，

    平均 24 分鐘就力竭，而且過程中乳酸和耗氧一路往上爬——它落在「重度」強度區，

    不是可以無限維持的線。它也比真正的最大乳酸穩態快了大約 3 到 7 個百分點，

    相關性高但不能互相代替。

    所以正確用法是：拿它當**間歇組的配速基準**（例如 10 趟 400 公尺、休 40 秒，

    這是研究裡實際完成過的），而不是拿它去開 30 分鐘連續定速游。小朋友更要注意，

    連續游會明顯超出他們的穩態，改成間歇就吻合了。

    還有三件事要記得：不同泳式的臨界游速不能互相比；它對訓練的反應很慢，

    別每兩週就重測；初學者身上根本沒有研究，對他們只能當「可重複的個人基準」用。'
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
