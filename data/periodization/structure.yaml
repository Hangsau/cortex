domain: periodization
sub: structure
schema_version: 1
source_repos:
- resources/books/Periodization__Theory_and_Methodology_of_Training/
phases:
- key: preparatory
  name_zh: 準備期
  name_en: Preparatory
  cert: 🟡
  source: Bompa & Buzzichelli 2019，第 5 章（週期化術語）與第 8 章（訓練階段）
  source_ids:
  - src.bompa-buzzichelli-2019
  purpose_zh: 建立表現的生理基礎；準備期不足則競賽期表現無法最大化
  plain_zh: 準備期＝打底的階段。先把體能基礎建起來，這段練得不夠，後面比賽就拉不出好成績。前半段練得廣、雜一點，後半段越來越專項。
  subphases:
  - key: general
    name_zh: 一般準備
    cert: 🟡
    source: Bompa & Buzzichelli 2019，第 8 章
    source_ids:
    - src.bompa-buzzichelli-2019
    share_of_prep: 25–33% of 準備期
    intensity_cap: ≤40% of 總量
    endurance_aerobic_share: 耐力運動 70–80% aerobic
    focus_zh: 用多元非專項與專項方法建立生理基礎
  - key: specific
    name_zh: 專項準備
    cert: 🟡
    source: Bompa & Buzzichelli 2019，第 8 章
    source_ids:
    - src.bompa-buzzichelli-2019
    sport_specific_share: 70–80% sport-specific work
    focus_zh: 用專項模態發展項目所需特性
- key: competitive
  name_zh: 競賽期
  name_en: Competitive
  cert: 🟡
  source: Bompa & Buzzichelli 2019，第 5 章與第 8 章
  source_ids:
  - src.bompa-buzzichelli-2019
  purpose_zh: 表現能力最大化；維持 90% 專項 / 10% 非專項
  plain_zh: 競賽期＝把表現拉到最高的階段，幾乎全部練專項（90%）。正式比賽都在這段，主賽前面接減量（taper）。
  subphases:
  - key: precompetitive
    name_zh: 賽前
    cert: 🟡
    source: Bompa & Buzzichelli 2019，第 8 章
    note_zh: 通常僅熱身賽 / 展示賽
    source_ids:
    - src.bompa-buzzichelli-2019
  - key: main_competitive
    name_zh: 主競賽
    cert: 🟡
    source: Bompa & Buzzichelli 2019，第 8 章
    note_zh: 所有正式比賽；主賽前接 unloading/taper + special preparation 子階段
    source_ids:
    - src.bompa-buzzichelli-2019
- key: transition
  name_zh: 過渡期
  name_en: Transition
  cert: 🟡
  source: Bompa & Buzzichelli 2019，第 8 章（過渡期）
  source_ids:
  - src.bompa-buzzichelli-2019
  duration_weeks:
    min: 2
    max: 4
    extended_max: 6
    note: 一般 2–4 週，年輕運動員可延至 6 週，正常不超過 6 週
  maintain_fitness: 維持 40–50% 競賽期一般體能
  purpose_zh: 移除疲勞、心理放鬆、生物再生；用主動休息(active rest)而非完全停練
  warning_zh: 非 off-season；完全停練 <4 週即顯著 detraining（見 detraining 安全表）
  plain_zh: 過渡期＝賽季結束後的休整，但不是完全躺平。重點是消疲勞、心理放鬆，用『主動休息』（輕量活動）取代完全停練。完全不動超過 4 週，體能就明顯掉了（見下面 detraining 表）。
annual_plan_types:
- id: periodization.structure.annual.monocycle
  key: monocycle
  name_zh: 單週期
  name_en: Monocycle
  cert: 🟡
  source: Bompa & Buzzichelli 2019，表 5.1 與第 8 章（年度計畫分類，圖 8.4／8.5）
  source_ids:
  - src.bompa-buzzichelli-2019
  total_weeks: 52
  peaks: 1
  weeks:
    preparatory:
      min: 28
      max: null
      note: ≥28
    competitive:
      min: 12
      max: 22
    transition:
      min: 4
      max: 4
  suited_for_zh: 新手 / 青少年；季節性運動；耐力主導項目（北歐滑雪、划船、自行車、長跑）
  swim_application_zh: 🔵 游泳本質高度有氧，耐力型 monocycle（Fig 8.5）體積曲線需全程維持高；適合泳齡尚淺、單一目標賽季的泳者
  plain_zh: 一年只衝一個高峰。整年（52 週）裡準備期最長（≥28 週），最後對準一場大賽。適合新手、青少年、泳齡還淺、一年只有一個重要目標的泳者。
  links:
    development_stages:
    - l2t
    - t2t
- id: periodization.structure.annual.bicycle
  key: bi-cycle
  name_zh: 雙週期
  name_en: Bi-cycle
  cert: 🟡
  source: Bompa & Buzzichelli 2019，表 5.1、圖 8.6、圖 5.11（游泳 200 公尺範例）
  source_ids:
  - src.bompa-buzzichelli-2019
  total_weeks: 26
  peaks: 2
  weeks:
    preparatory:
      min: 12
      max: 16
    competitive:
      min: 6
      max: 12
    transition:
      min: 1
      max: 4
  structure_note_zh: 兩個短 monocycle 以極短 unloading/transition 相連；準備期1體積遠大於準備期2；競賽期2目標年度最重要賽事
  suited_for_zh: 進階 / 菁英；可達全國錦標資格者
  swim_application_zh: 🔵 競技泳者原型年計畫——Bompa Fig 5.11 即『游泳 200m bi-cycle（冬季 + 夏季全國錦標）』；對映 ADM T2W『一年兩巔峰（春季選拔 + 夏季國際賽）』
  plain_zh: 一年衝兩個高峰（如冬季＋夏季兩場大賽）。等於把一年切成兩個短的單週期接起來。這是競技泳者最典型的年計畫——Bompa 書裡舉的例子剛好就是游泳 200m。對應 ADM T2W 階段的『一年兩巔峰』。
  links:
    development_stages:
    - t2c
    - t2w
    related:
    - periodization.structure.annual.monocycle
- id: periodization.structure.annual.tricycle
  key: tri-cycle
  name_zh: 三週期
  name_en: Tri-cycle
  cert: 🟡
  source: Bompa & Buzzichelli 2019，表 5.1 與圖 8.7
  source_ids:
  - src.bompa-buzzichelli-2019
  peaks: 3
  weeks_note_zh: 三段分別約 20–24(冬)/16–18(春夏)/4–6(夏)；準備期 12–20/10–12/2–4；競賽期 4–6/8–12/2–4；過渡期 1–2/1–2/3–6
  structure_note_zh: 首準備期最長（含一般準備子階段）；最重要賽事置於第三 cycle；通常僅進階運動員使用
  suited_for_zh: 進階 / 國際級（冬季錦標 + 夏季全國 + 世錦/奧運）
  swim_application_zh: 🔵 高水準泳者多目標賽季；ADM T2W 終身競技階段可演進至此
  plain_zh: 一年衝三個高峰（如冬季錦標＋夏季全國＋世錦/奧運）。最重要那場放在第三段。只有高水準、能撐密集賽季的泳者才用。
  links:
    development_stages:
    - t2w
- id: periodization.structure.annual.multipeak
  key: multipeak
  name_zh: 多巔峰
  name_en: Multiple-peak
  cert: 🟡
  source: Bompa & Buzzichelli 2019，表 5.1、第 5 章（選擇性週期化）、圖 8.8
  source_ids:
  - src.bompa-buzzichelli-2019
  peaks_note_zh: 多
  weeks:
    per_cycle:
      min: 11
      max: 16
    preparatory:
      min: 9
      max: 12
    competitive:
      min: 1
      max: 2
    transition:
      min: 1
      max: 2
  structure_note_zh: 週數少、準備期明顯短；僅適合 4–6 年訓練底、高運動能力、能承受密集賽事者（如網球）
  suited_for_zh: 資深運動員（4–6 年訓練背景）；不建議青少年（易多重傷害）
  swim_application_zh: 🔵 游泳少用純 multipeak；僅適用賽事極密集的職業 / 系列賽泳者
  plain_zh: 一年衝很多個高峰（賽事極密集時用）。準備期被壓很短，風險高——要有 4–6 年訓練底子才扛得住。青少年不建議，容易受傷。游泳很少用。
  links:
    development_stages: []
macrocycle:
  id: periodization.structure.macrocycle
  cert: 🟡
  source: Bompa & Buzzichelli 2019，第 7 章（訓練週期規劃）
  source_ids:
  - src.bompa-buzzichelli-2019
  duration_weeks:
    min: 2
    max: 6
    prep_macrocycle:
      min: 4
      max: 7
  loading_patterns:
  - ratio: '3:1'
    cert: 🟡
    note_zh: 最常見（probably the most common）；契合身體自然生物節律
    default: true
  - ratio: '4:1'
    cert: 🟡
    note_zh: 早期準備期
  - ratio: '2:1'
    cert: 🟡
    note_zh: 爆發專項準備
  - ratio: 2:2 / 1:1
    cert: 🟡
    note_zh: 競賽期
  - ratio: '3:2'
    cert: 🟡
    note_zh: 高疲勞時
  swim_application_zh: 🔵 游泳週課表結構基礎：3 個負荷週 + 1 個 unloading 週為預設；高疲勞泳者改 3:2
  plain_zh: Macrocycle＝由幾個週組成的中型週期（2–6 週）。最常見的節奏是『3:1』——練 3 個漸增負荷的週，接 1 個減量恢復週。這契合身體自然的疲勞—恢復節律。泳者特別累時改 3:2（多一週恢復）。
  block_dialogue_zh: 🟡 對話（板塊派 Issurin）：3:1 是『以時間切恢復』，板塊派改成『以殘留效應切換訓練焦點』——某能力的適應停練後能撐多久，就決定下一塊何時換。例如最大速度殘留只 ~5 天、有氧耐力 ~30 天（見 school_block 節點），所以速度要頻繁刺激、有氧可暫放。兩者不互斥：3:1 管的是『一塊之內的疲勞節律』，殘留效應管的是『塊與塊之間練什麼』。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - periodization.structure.school_block
microcycle:
  id: periodization.structure.microcycle
  cert: 🟡
  source: Bompa & Buzzichelli 2019，第 7 章（訓練週期規劃）；表 7.1 的強度分區另見本庫強度分區表
  source_ids:
  - src.bompa-buzzichelli-2019
  duration: 1 週
  classifications:
  - key: developmental
    name_zh: 發展型
    cert: 🟡
  - key: competition
    name_zh: 競賽型
    cert: 🟡
    note_zh: 賽前 3–5 天達峰
  - key: recovery_regen
    name_zh: 恢復再生型
    cert: 🟡
  - key: peaking_unloading
    name_zh: 達峰/卸載型
    cert: 🟡
    note_zh: 體積降 ≥50%、強度降 5–10%
  rest_day_patterns:
  - key: '6:1'
    name_zh: 六練一休
    cert: 🟢
    note_zh: 傳統游泳隊預設，週內固定一個完整休息日
  - key: '4:1'
    name_zh: 四練一休
    cert: 🟡
    note_zh: 雙練日 + 單練日的循環變體（雙練×2 + 單練×1）；少數菁英隊使用
  - key: '7:0'
    name_zh: 天天練
    cert: 🟡
    note_zh: 完全不留固定休息日；少數教練嘗試但風險高，需精細監測
  swim_application_zh: 🔵 週為游泳課表最小規劃單位；unloading 微週期用於賽前與 macrocycle 銜接；6:1 為預設休日模式
  plain_zh: Microcycle＝一週，是排課表的最小單位。一週有不同類型：發展型（往上堆）、競賽型（賽前 3–5 天達峰）、恢復型、卸載型（量砍一半以上）。游泳就以『週』為單位排課。週內休息日預設「六練一休」，少數隊伍用「四練一休」或全天天練但需要更細的監測。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - periodization.structure.macrocycle
    - periodization.zones.table_7_1
general_adaptation_syndrome:
  id: periodization.structure.gas
  cert: 🟢
  source: Selye 1974, 1976; 整合進 Bompa 體系（多教練書共識）
  source_ids:
  - src.selye
  three_stages:
  - key: alarm
    name_zh: 警覺期
    duration_zh: 幾天
    description_zh: 新訓練刺激出現時的即時反應；交感神經興奮、表現可能短暫下降、免疫力短期被壓抑
  - key: adaptation
    name_zh: 適應期/抗拒期
    duration_zh: 幾週
    description_zh: 身體積極建構應對能力——肌力增加、能量系統效率提升、神經肌肉協調改善；訓練成果在此階段累積
  - key: exhaustion
    name_zh: 耗竭期
    duration_zh: 超出時不可逆
    description_zh: 刺激過大或持續太久，身體無法繼續適應或修復，表現下降、過度訓練症候群、傷病風險暴增；這是過度訓練的生理本質
  why_periodization_works_zh: 🔵 週期化的核心邏輯：刻意把每段訓練留在「適應期」收完成果就減量恢復，避免進入耗竭期。3:1 macrocycle 結構（3 週堆負荷 + 1 週減量）就是 GAS 三階段的時間骨架——前 3 週走完警覺→適應，第 4 週減量讓身體完成適應、避免耗竭。Unloading 微週期同理。
  swim_application_zh: 🔵 游泳教練判斷選手是否「練過頭」時的生物學參考——出現持續性表現下降、睡眠品質崩、晨脈異常、技術細節失守，是耗竭期的早期信號；不是「再撐一下」的時機，而是立刻 unloading 的時機。
  plain_zh: 為什麼週期化要有節奏不能一路往上堆？因為身體對訓練壓力有三個階段：① 警覺期（剛開始幾天，覺得難）、② 適應期（幾週後身體變強）、③ 耗竭期（再撐就崩）。週期化的目標就是每段訓練都停在適應期收成果就減量，不要踩進耗竭期。3 練 1 休的 macrocycle 結構就是這個原理。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - periodization.structure.macrocycle
    - periodization.structure.microcycle
detraining:
  id: periodization.structure.detraining
  cert: 🟢
  source: Bompa & Buzzichelli (2019)《Periodization》第 6 版第 8 章表 8.2；原始出處：Viru 1995、Coyle 等人 1984、Mujika & Padilla 2000（Part I / Part II）、Izquierdo 等人 2007
  source_ids:
  - src.bompa-buzzichelli-2019
  - src.viru-1995-adaptation-in-sports-training
  - src.coyle-1984-loss-of-adaptations
  - src.mujika-padilla-2000-detraining-part1
  - src.mujika-padilla-2000-detraining-part2
  - src.izquierdo-2007-detraining-tapering
  vo2max_loss:
  - days: 4
    loss: 4%
    source_zh: Viru 1995
  - weeks: 3
    loss: 7%
    source_zh: Coyle 等人 1984
  - weeks: 4
    loss: 14%
    source_zh: Mujika & Padilla 2000 Part I
  - weeks: 8
    loss: 20%
    source_zh: Mujika & Padilla 2000 Part II
  strength_power_loss_zh: 4 週完全停力量訓練：最大肌力降 6–10%、最大功率降 14–17%（Izquierdo 等人 2007）；菁英運動員衰退更快
  endurance_perf_loss_zh: 短期(<4週)停練：力竭時間降 4–25%（Mujika & Padilla 2000 Part I）
  reversible_note_zh: 短時間恢復訓練可逆轉；完全停練 <4 週即顯著 detraining → 過渡期務必 active rest
  swim_application_zh: 🔵 游泳排賽季間休 / 傷停課表時，過渡期 >4 週需保留低量 active rest 以免 VO2max 大幅流失
  plain_zh: 完全停練掉得有多快？最大攝氧量：停 4 天掉 4%、停 4 週掉 14%、停 8 週掉 20%。力量也類似（停 4 週最大肌力掉 6–10%）。好消息是這些可以練回來。實務結論：休季或受傷時也別完全躺平，保留一點輕量活動，體能才不會崩。
  links:
    development_stages:
    - t2c
    - t2w
swim_annual_structure:
  id: periodization.structure.swim_annual
  cert: 🟢
  source: Hellard et al. 2019 (PMC6470949); González-Ravé et al. 2022 (PMID 36247944, n=1)
  source_ids:
  - src.hellard
  macrocycles_per_year: 2–4（菁英游泳常見；Hellard 2019）
  macrocycle_length_weeks: ≈15 週/macrocycle（Hellard 2019）
  low_intensity_volume_share: 86–90% 訓練量落在 ≤4 mmol（低強度為主，Hellard 2019）
  case_400im_zh: 🟢 400m 個人混合式單一菁英個案（n=1，González-Ravé 2022）：52 週分 3 個 macrocycle，週量在 24–90 km 間波動
  caution_zh: 🔴 不收『60–80 km/週、9–10 課/週』這類距離選手週量——屬未經查證的網路共識，無原始文獻
  plain_zh: 菁英游泳的年度結構長怎樣（有實證的）：一年大概切 2–4 個中週期（每個約 15 週）。最反直覺的數字——高達 86–90% 的訓練量是低強度（血乳酸 ≤4），不是整天操高強度。有一個 400 混合式選手的個案，全年 52 週分 3 段，週泳量在 24–90 km 間起伏（這是單一個案，不是通則）。
  open_water_distance_buffer_zh: 🟠 開放水域 / 鐵人三項：訓練最長單次距離須超出比賽距離以建立『不可控變因 buffer』。短距開放水賽（≤ 5K）建議訓練到比賽距離的 130%；馬拉松級（10K+）達 60–80%；超馬（20+ 英里）前必須有 6–8 小時的實境水溫訓練。原因是冷水、洋流、浪況都會吃掉預備容量——池泳『練到比賽距離就好』的原則不適用於開放水域。
  links:
    development_stages:
    - t2c
    - t2w
swim_youth_ltad:
  id: periodization.structure.swim_youth_ltad
  cert: 🟢
  source: 'Swimming Canada. Long Term Athlete Development Strategy; Ford, P., De Ste Croix, M., Lloyd, R., Meyers, R., Moosavi, M., Oliver, J., Till, K., & Williams, C. (2011). The long-term athlete development model: physiological evidence and application. Journal of Sports Sciences, 29(4), 389–402; van Hooren, B., & De Ste Croix, M. (2020). Sensitive periods to train general motor abilities in children and adolescents: Do they exist? A critical appraisal. Strength and Conditioning Journal, 42(6), 7–14.'
  source_ids:
  - src.swimming-canada-ltad-strategy
  - src.pmid-21259156
  - src.van-hooren-2020-sensitive-periods
  stage_ages_zh: Swimming Canada 游泳專項 LTAD 分齡（依該協會 LTAD 策略文件原文）：基礎期 FUNdamentals 女 5–8／男 6–9；學習訓練 L2T 女 8–11／男 9–12；訓練為訓練 T2T 女 11–14／男 12–15；訓練為競賽 T2C 女 14–16／男 15–18；競賽求勝 Compete to Win 女 16+／男 18+。要注意兩件事。第一，該文件把進階條件寫在年齡旁邊，年齡只是參考：進入 T2T 看的是『生長陡增趨緩且技術已掌握』，進入 T2C 看的是『成績與技術精熟度』——所以這張表不是分齡標準，是搭配成熟度判讀用的座標。第二，坊間流通的另一套分齡（T2C 女 15–21／男 16–23、訓練為勝利 T2W 女 18+／男 19+）是跨項目通用的 LTAD 表，不是游泳專項表；兩套差距在青少年後段可以大到五、六歲，混用會直接影響訓練量與專項化時機的判斷。
  phv_zh: 生長陡增高峰 PHV：女 ≈12.5 歲、男 ≈14 歲（平均值）。這個平均值本身不太有用，真正該記的是它旁邊那句話——同樣是 11 歲的兩名泳者，生物年齡可以一個是 10 歲、另一個是 15 歲，**同齡個體之間的成熟度差距可達五個生物年**。生長陡增本身也不是一個時點而是一段期間，可以持續一年半到五年。因此該文件的建議是每三個月固定量一次身高（含坐高與腿長）、在固定時段測量、從六歲開始建線，用曲線判斷這名泳者到哪了，而不是查表。
  windows_of_trainability_contested: true
  windows_note_zh: ⚠️ contested：『trainability 關鍵窗口』（某些素質在特定年齡有黃金訓練期）是有爭議的概念。Ford et al. 2011 指出 LTAD 是單一維度（純生理）的通則模型、缺乏實證基礎，且所依據的資料建立在可疑假設與有瑕疵的方法上，主張把它當『進行中的工作』而非定論；van Hooren & De Ste Croix 2020 對『敏感期是否存在』做了同方向的批判性檢視。這裡有個必須講明的張力：**上面那張分齡表與 PHV 建議，出自同一份主張窗口存在的 Swimming Canada 文件**（它明列耐力窗口在 PHV 起點、力量窗口女生在 PHV 後或初經後、男生在 PHV 後 12–18 個月）。也就是說本節同時引用了一份文件的分齡資料、又引用兩篇批判它核心假設的論文——這不是矛盾，是刻意的：分齡與 PHV 量測是可操作的實務座標，窗口則是它附帶的理論主張，前者可用不代表後者成立。引用時必須標明爭議，不可當定論。
  volume_zh: 🟡 分齡週泳量（Swimming Canada LTAD 策略文件原文所列）：L2T 8–14 km／週；T2T 24–30 km／週、逐步建立到 40–50 km／週；T2C 40–50+ km／週；Compete to Win 40–50+ km／週（依專項化方向調整）。標 🟡 而非 🟢 的理由：這是單一國家協會的建議值，文件未附推導依據或實證來源，也沒有交代這些數字是怎麼定出來的。可以當作一個有出處的參考錨點，不能當作劑量標準——尤其不要拿它去反推『我的學生沒游到就是量不夠』。
  caution_zh: 🔴 T:C（訓練比賽比）60:40／50:50／25:75 僅 Balyi 二手轉述，查無原始出處，標弱不入正文。
  plain_zh: 青少年怎麼分齡練：Swimming Canada 的游泳專項表大致是——女生 8–11 歲學習訓練、11–14 訓練為訓練、14–16 訓練為競賽、16 歲以上競賽求勝；男生各段晚一到兩年。但這張表最該記的其實不是數字。第一，年齡只是座標，該文件自己說進階要看生長趨緩與技術掌握，不是看生日。第二，同樣 11 歲的兩個孩子，身體成熟度可以差到五年——一個像 10 歲、一個像 15 歲，你把他們排在同一組用同一份課表，本來就會有一個被拖著、一個被硬撐。所以建議是每三個月量一次身高畫成曲線，看這個孩子走到哪，比查表可靠得多。第三，有個很流行的說法要特別小心：『某些能力有黃金訓練窗口、錯過就補不回』——這在學界是有爭議的（Ford 2011、van Hooren 2020 都批評它證據不足），而且諷刺的是，提供上面那張分齡表的同一份文件，正是主張有窗口的那一方。表可以用，窗口別當鐵律，不必硬逼小孩在特定年齡猛練某一項。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
schools_overview:
  id: periodization.structure.schools_overview
  cert: 🔵
  source: 作者綜合：Bompa & Buzzichelli 6th ed.；Issurin 2008/2010/2016；Seiler 2010；Olbrecht 2000；Sweetenham & Atkinson 2003；Hellard 2019
  source_ids:
  - src.bompa-buzzichelli-6th-ed-issurin-2008-2010-2
  premise_zh: 週期化不是一套被證明的定論，而是幾套互相辯論的框架。它們問的問題不同、適用的對象不同——把任何一派當『標準答案』都是誤讀。
  schools:
  - key: traditional
    name_zh: 傳統線性（Bompa/Matveyev）
    core_q_zh: 一年怎麼分準備/競賽/過渡，讓表現在大賽達峰？
    strength_zh: 結構清晰、教學完整、對新手與單一賽季最穩
    weakness_zh: 對菁英多峰賽季僵硬；並行練多能力對高水準者效率下降
    cert: 🟡
  - key: block
    name_zh: 板塊集中（Issurin）
    core_q_zh: 高水準者無法同時練好所有能力，那要按什麼順序集中練？
    strength_zh: 用殘留效應科學決定換塊時機；適合菁英、多峰
    weakness_zh: 殘留效應個體差異大；術語邊界模糊；初中級者不需要
    cert: 🟡
  - key: polarized
    name_zh: 極化分布（Seiler/TID）
    core_q_zh: 每個強度區各應占多少比例？
    strength_zh: 從菁英真實行為歸納；80/20 有 RCT 支持（Stöggl 2014）
    weakness_zh: 只有單一 RCT；游泳實證其實金字塔型更常見（González-Ravé 2021）
    cert: 🟢
  - key: swim_energy
    name_zh: 能量系統個體化（Olbrecht）
    core_q_zh: 有氧/無氧不是越大越好，怎麼找到最適組合？
    strength_zh: 捨棄通用閾值、改個體乳酸測試；解釋『閾值進步但成績沒進步』
    weakness_zh: 需實驗室乳酸測試支援；原書處方數字不可及
    cert: 🟡
  - key: swim_reverse
    name_zh: 反向週期化（Sweetenham）
    core_q_zh: 速度該放賽季末，還是當全季的校準錨？
    strength_zh: 速度先行、技術不被疲勞固化；現場可操作（BBM＋benchmark）
    weakness_zh: 原書五法則/具體數字網路不可查；非 RCT，靠成績佐證
    cert: 🟢
  reader_questions_zh:
  - Q1 我（或我的學員）是新手還是菁英？——新手用傳統線性就夠，菁英才需要板塊/極化的精細化。
  - Q2 這一季要衝幾個高峰？——一個峰選單週期；多個峰板塊派更靈活。
  - Q3 各強度該怎麼分配？——這是極化/TID 派的問題，不是 Bompa 的問題。
  - Q4 我能不能同時練多項能力？——傳統派說能（調比例），板塊派說菁英不能（要序列化）。
  - Q5 換訓練焦點的時機怎麼定？——傳統派看疲勞節律（3:1），板塊派看殘留效應天數。
  - Q6 閾值訓練到底要不要大量練？——Bompa 當主力，Olbrecht/Seiler 都質疑（魔法子彈謬誤／避開中間區）。
  - Q7 速度訓練放哪？——傳統派放賽季末，Sweetenham 放全季當校準錨。
  - Q8 我的距離項目偏有氧還是無氧？——決定 TID 型態與能量系統側重（見 zones）。
  - Q9 怎麼知道訓練有沒有效？——benchmark/階梯測試/乳酸曲線，不是只看課表跑完。
  - Q10 青少年和成年人練法一樣嗎？——不一樣；分齡發展是各派都同意要區分的。
  - Q11 減量怎麼安排？——這是相對成熟、各派分歧最小的一塊（見 taper）。
  author_synthesis_zh: 🔵 作者立場：這幾派不是『誰對誰錯』，是『不同問題的答案』。實務上我傾向——(1) 結構骨架用傳統線性（清楚、好教）；(2) 菁英換焦點時機參考板塊派的殘留效應；(3) 強度分配吸收極化派的『大量低強度＋少量高強度、慎用中間區』，但承認游泳金字塔型也常見、不教條化；(4) 評估診斷學 Olbrecht 的個體化測試精神（即使沒有實驗室，也別套通用百分比）；(5) 速度當全季校準錨（Sweetenham），不留到賽季末才碰。這是綜合判斷，不是文獻定論，故標 🔵。
  plain_zh: 週期化不是一本標準答案，而是幾派人在吵架。Bompa 那套（傳統線性：分準備期/競賽期/過渡期）只是歷史最久、最常被當教科書的一派，不等於唯一真理。另外幾派各問不同的問題：板塊派（Issurin）問『菁英不能什麼都同時練，那該按什麼順序集中練』；極化派（Seiler）問『各強度該占幾成』；Olbrecht 問『有氧無氧不是越大越好，怎麼配到最適』；Sweetenham 問『速度該放賽季末還是當全季的校準錨』。先搞清楚你要回答哪個問題（看上面 Q1–Q11），再決定參考哪一派——不要把任何一派當鐵律。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
    related:
    - periodization.structure.school_block
    - periodization.zones.olbrecht_model
    - periodization.zones.school_polarized
school_block:
  id: periodization.structure.school_block
  cert: 🟡
  source: Issurin 2008《Block Periodization》; Issurin 2008 (PMID 18212712); 2010 (DOI 10.2165/11319770); 2016 (PMID 26573916); 2019 (PMID 30411234); Breil 2019 meta (PMID 31802956)
  source_ids:
  - src.issurin
  core_mechanism_zh: 板塊派的根本主張：高水準運動員無法在同一階段同時有效提升所有能力，因為許多訓練刺激彼此不相容（有氧 AMPK 路徑 vs 肌力 mTOR 路徑拮抗），會產生衝突反應。解法是『序列集中』——一次只把高度集中的負荷指向極少數相容能力，靠前一塊的殘留效應保住已得適應。
  residual_effects:
  - ability_zh: 有氧耐力
    days: 30 ± 5
    cert: 🟡
  - ability_zh: 最大肌力
    days: 30 ± 5
    cert: 🟡
  - ability_zh: 無氧糖解耐力
    days: 18 ± 4
    cert: 🟡
  - ability_zh: 肌力耐力
    days: 15 ± 5
    cert: 🟡
  - ability_zh: 最大速度（磷酸原）
    days: 5 ± 3
    cert: 🟡
  residual_caveat_zh: 🔴 上述天數在教練界廣泛流通（引自 Issurin 2008 書，據轉引為 Table 2.4），但『± N 天』的原始統計依據（實驗數據還是專家估計）、確切頁碼、方法論細節無法追溯至一手來源。使用時必須加注『原始方法論待核』。
  block_structure:
  - key: accumulation
    name_zh: 累積板塊
    focus_zh: 建立一般耐力、基礎肌力、協調的訓練儲備（基礎能力）
    load_zh: 強度低中、量大
    weeks: ≈3–6（🔴 精確範圍待核）
  - key: transmutation
    name_zh: 轉化板塊
    focus_zh: 把基礎儲備轉化為專項能力（專項耐力、爆發力、賽事技術）
    load_zh: 強度高、量中、消耗最大
    weeks: ≈2–4（🔴 待核）
  - key: realization
    name_zh: 實現板塊
    focus_zh: 完全恢復、最大速度、賽事戰術，以比賽/測驗收尾
    load_zh: 強度極高、量最小
    weeks: ≈1–2（🔴 待核）
  full_stage_weeks: 一個完整『累積→轉化→實現』序列構成一個訓練階段，典型 8–12 週；多階段疊加可靈活安排多峰
  critique_of_traditional_zh: 🟡 對傳統線性（Bompa/Matveyev）的三點批評（Issurin 2010）：(1) 長準備期→競賽期結構難產生現代賽季要求的多峰；(2) 長期混合訓練對已高度適應的菁英進步率遞減（刺激太分散）；(3) 不相容負荷同時練會互相干擾。核心張力：菁英能否從混合訓練持續受益——Bompa 說能（調比例），Issurin 說不能（要序列化高集中負荷）。
  swim_link_zh: 🟠 游泳早期應用：蘇聯教練 Koshkin 為三屆奧運冠軍 Salnikov 設計 10 週板塊系統（速度技術／肌力／有氧／減量比賽序列）。🔴 此案例廣見於教學材料但一手出處待核。當代游泳文獻多採『傳統模型＋強度分布分析』，較少嚴格依循板塊架構，但『階段專注』概念已廣泛影響備賽設計（對照 Almeida 2022, PMC9536385，400IM 世界級個案採傳統三巨集週期）。
  limitations_zh: 🟢 學界批評：(1) 殘留效應個體差異大，平均值±SD 難直接套用；(2) 證據基礎有限——Breil 2019 meta（PMID 31802956）證實板塊在 VO2max/最大功率有優越表現，但研究數量少、受試多為高水準耐力選手；(3) 累積/轉化/實現的邊界操作上不夠清晰，教練詮釋差異大。不適合初中級者（達超補償只需 2–3 課，不需長期集中負荷策略）。
  author_note_zh: 🔵 作者取用：板塊派最值得吸收的不是整套換掉 Bompa，而是『換訓練焦點時用殘留效應當依據』這個操作原則——尤其菁英多峰賽季，比死守 3:1 時間節律更貼生理。但殘留天數要當『量級參考』不是『精確處方』（個體差異＋原始方法論待核）。
  plain_zh: 板塊週期化（Issurin）跟 Bompa 最大的不同：Bompa 主張準備期可以同時把很多能力一起練；Issurin 說高水準選手做不到——很多訓練刺激會互相打架（大量有氧會干擾長肌力），所以要『一次只集中練一兩項』，按順序排。怎麼決定何時換下一項？看『殘留效應』——某能力停練後能撐多久：有氧耐力、最大肌力約撐 30 天，無氧糖解約 18 天，最大速度只撐 ~5 天。所以速度要常常練、有氧可以先放一陣子。一個完整週期（累積→轉化→實現）約 8–12 週。注意：這套是為菁英設計的，新手用不到；那些殘留天數是廣為流傳的參考值，原始實驗依據其實沒查到，別當精確處方。
  links:
    development_stages:
    - t2c
    - t2w
perception_periodization_bridge:
  id: periodization.structure.perception_periodization_bridge
  cert: 🔵
  source: 作者綜合（Vortex 核心命題 × 週期化）；通用『技能週期化』與『疲勞損害技能學習』有文獻支持，水感知(L0–L6)專屬層仍待驗證
  source_ids:
  - src.vortex-l0-l6
  gap_zh: 目前的週期化內容（量、強度、能量系統、減量）全部講『生理負荷』，完全沒接到 Vortex 的核心命題『所有游泳技術都建立在水感知上』。兩者像兩套平行系統。
  hypothesis_zh: 作者假設：感知穩定度本身是一個該被週期化的變項。疲勞會讓動作退回『感知真正穩定的地方』（CLAUDE.md 核心命題），高量/高疲勞的訓練塊會壓低感知品質——三個推論逐層標確定性：(1) 🔵 大量低強度有氧塊可能正是『鞏固感知』的窗口（低疲勞、可專注感覺）——與減量研究『降頻會掉 motor sensation 與技術熟練度、需維持頻率保技術』方向一致；(2) 🟢 高強度/減量前的疲勞峰是最不該導入新技術的時機——Branscheidt et al. 2019（eLife 8:e40578，DOI 10.7554/eLife.40578）證實肌肉疲勞會損害動作技能的『學習』本身（非僅執行），且影響延續到隔天無疲勞狀態，作者直言『在疲勞中或超過疲勞訓練的常見做法應重新檢討』；(3) 🟡 Sweetenham『速度先行、別讓疲勞固化壞技術』與此方向一致。框架層面：『技能本身可週期化』非原創——Otte, Millar & Klatt 2019 的 PoST 框架（Front. Sports Act. Living 1:61，DOI 10.3389/fspor.2019.00061）已把技能訓練分 coordination → skill adaptation → performance 三階段；板塊週期化的 transmutation 塊本就定義為『specific technical motor skills 習得』。
  why_it_matters_zh: 若這個接點成立，週期化模組就不只是『排生理負荷』，而能回答 Vortex 真正關心的問題：在年度計畫的哪個階段、哪種疲勞狀態下，最適合建立 vs 鞏固 vs 不該碰感知技術。這會讓週期化從『借來的通用理論』變成『服務水感知命題的工具』。
  status_zh: 通用層有據、感知專屬層待驗證——分清楚兩件事：『技能/動作學習可被週期化、且疲勞損害技能學習』在運動學習文獻已成立（Branscheidt 2019；Otte 2019 PoST；板塊 transmutation 塊），這部分不是空白。真正仍 🔴 的是 Vortex 專屬一層：把通用『技能』收窄成『水感知（L0–L6）』後，沒有任何研究直接量測過『水感知品質的週期化』。後續需：(1) 把『感知穩定度』操作化為可觀測指標；(2) 在 Observations/ 層累積疲勞 vs 感知退化的教學案例；(3) 才談得上驗證水感知專屬層。
  plain_zh: 先講清楚兩層：第一層『技能會不會該被週期化、疲勞會不會傷技術』——這層有研究撐：Branscheidt 2019 證實疲勞不只讓你當下做不好，連『學會新技能』的能力都被拖累，而且累的影響會延續到隔天；減量研究也說賽前降頻會掉水感和技術，要維持頻率才保得住；甚至有專門的『技能週期化』框架（PoST）。所以『大量輕鬆游的階段適合鞏固感覺、賽前最累時最不該硬塞新技術』，方向是有根據的。第二層才是真缺口：把上面這些『技術/技能』收窄成 Vortex 講的『水感知』之後，沒人直接量測過『水感知的週期化』長什麼樣——這一層還是 🔴 假設，標出來是為了講清楚研究方向，不是說已驗證。
