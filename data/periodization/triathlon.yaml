domain: periodization
sub: triathlon
schema_version: 1
planner:
  id: periodization.triathlon.planner
  cert: 🔵
  name_zh: 鐵人三項泳段排課
  provenance_zh: 渦流計畫的操作模型：結構取自公開的鐵人教練文章與訓練計畫（實務文件，不是訓練成效研究），配速沿用游泳的 CSS 系統，鐵人未驗證。各賽距的每週總量、泳段專屬的強度分布、開放水域配速換算、鐵人專屬減量都沒有找到出處，工具不給預設值。
  stroke: free
  links:
    related:
    - periodization.set_design.weekly_assembly
    - periodization.taper.swim
    - open-water.tech.14
    - open-water.tech.16
    - open-water.tech.17
    - open-water.tech.18
    - open-water.tech.19
race_distances:
  id: periodization.triathlon.race_distances
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  scale_note_zh: 組量以標準距離為基準：短距離約減 30%，70.3 約增 30%（Hayes 2018，單一教練的 8 週計畫）。超級距離沒有找到縮放出處，組量沿用 70.3，並照 Slaughter 2019 每週至少放一次 10×100。
  source_ids:
  - src.hayes-2018-open-water-8-weeks-220-triathlon
  - src.slaughter-2019-swim-plan-triathlon-distances-usms
  items:
  - key: sprint
    name_zh: 短距離
    swim_m: 750
    scale: 0.7
    rp_from_css: true
  - key: standard
    name_zh: 標準距離
    swim_m: 1500
    scale: 1.0
    rp_from_css: true
  - key: half
    name_zh: 70.3（半程超級）
    swim_m: 1900
    scale: 1.3
    rp_from_css: false
  - key: full
    name_zh: 超級（Ironman）
    swim_m: 3800
    scale: 1.3
    rp_from_css: false
    weekly_10x100: true
race_pace:
  id: periodization.triathlon.race_pace
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  rule_zh: 比賽配速優先用你自己填的泳段目標配速；其次用上次同賽距的泳段成績（出水時間）÷ 泳段距離算出實際比賽配速——它已含抬頭、沒有牆、水況與防寒衣的影響，只是賽道實際距離不一定準，也不能拿來反推泳池 CSS（開放水域換回泳池沒有出處）。兩者都沒有時，短距離與標準距離暫用 CSS： Swim Smooth 的換算表把 1500 m 游泳賽配速對到 CSS；但那是游泳比賽，鐵人與開放水域沒有換算出處，抬頭、沒有牆、水況都會讓實際配速變慢。70.3 與超級距離連這個暫用值都沒有，必須自己填。
  source_ids:
  - src.newsome-2025-swim-smooth-pace
  retest_zh: CSS 用 400 m 與 200 m 兩次計時算出，每 4–6 週重測一次（Swim Smooth）。
  retest_source_ids:
  - src.newsome-2025-swim-smooth-pace
levels:
  id: periodization.triathlon.levels
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  items:
  - key: beginner
    name_zh: 入門
    sessions: 2
    note_zh: 每週 2 堂、至少隔 24 小時，一堂較快、一堂較輕（Bernhardt 的 12 週短距離計畫）。
    source_ids:
    - src.bernhardt-12-week-sprint-swim-plan
  - key: regular
    name_zh: 一般分齡
    sessions: 3
    note_zh: 不論賽距，每週至少游 3 次（Slaughter 2019）；每週 2 次大致只能維持、3 次可以進步（Mackinnon 2024）。
    source_ids:
    - src.slaughter-2019-swim-plan-triathlon-distances-usms
    - src.mackinnon-2024-how-much-swimming-triathlete
  - key: advanced
    name_zh: 要進步／跟游賽
    sessions: 4
    note_zh: 每週 4 次以上，對需要改進泳技、參加允許跟游的賽事或菁英較理想（Mackinnon 2024）。
    source_ids:
    - src.mackinnon-2024-how-much-swimming-triathlete
session_volume:
  id: periodization.triathlon.session_volume
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  note_zh: 多數學員每堂 45–60 分鐘；進階的例子單堂很少超過 2,500 m，每週有一堂 3,000–3,500 m（Mackinnon 2024，教練文章）。各賽距的每週總量沒有找到出處，本工具不給預設值。
  source_ids:
  - src.mackinnon-2024-how-much-swimming-triathlete
week:
  id: periodization.triathlon.week
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  note_zh: 每堂一個主目的是依時間預算推導，沒有直接出處；吃力的課之間隔一堂輕鬆或技術課，沿用游泳的週組裝規則。主課以 100–400 m 一趟為主，25–50 m 只在長組裡當短衝刺插入——這是照下列組型原文的分布，不是另訂的比例。
  by_sessions:
    '1':
    - rp
    '2':
    - rp
    - skill
    '3':
    - rp
    - skill
    - aerobic
    '4':
    - rp
    - skill
    - change
    - aerobic
    '5':
    - rp
    - skill
    - change
    - aerobic
    - skill
    '6':
    - rp
    - skill
    - change
    - aerobic
    - skill
    - aerobic
slots:
  id: periodization.triathlon.slots
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  items:
  - key: rp
    name_zh: 比賽配速課
    sets:
    - name_zh: 比賽配速 200
      reps: 5
      dist: 200
      int: rp
      rest: 20
    - name_zh: 比賽配速 100
      reps: 5
      dist: 100
      int: rp
      rest: 10
    note_zh: 組型照 Hayes 2018 的池內組：5×200 m 比賽配速、休 20 秒；5×100 m 比賽配速、休 10 秒。可在長組中插入 25–100 m 全力衝刺，再立刻回到比賽配速，模擬跟上突然加速的人或追前方集團（Heggy 2021，USMS）。
    source_ids:
    - src.hayes-2018-open-water-8-weeks-220-triathlon
    - src.heggy-2021-triathlon-swim-intensity-usms
  - key: change
    name_zh: 配速變化課
    sets:
    - name_zh: 比賽配速 300
      reps: 1
      dist: 300
      int: rp
      rest: 20
      block: 2
    - name_zh: 比比賽配速快 200
      reps: 1
      dist: 200
      int: rp_fast
      rest: 20
      block: 2
    - name_zh: 用力 100
      reps: 5
      dist: 100
      int: hard
      rest: 10
      block: 2
    note_zh: 組型照 Hayes 2018：2×[300 m 比賽配速；200 m 比比賽配速快；5×100 m 用力]。原文沒寫組內休息秒數，這裡的休息是預設欄位，請依自己狀況改；「比賽配速快多少」原文也沒給，不設目標秒數。
    source_ids:
    - src.hayes-2018-open-water-8-weeks-220-triathlon
  - key: skill
    name_zh: 技術＋開放水域技能課
    sets:
    - name_zh: 每 4 個池長抬頭定向一次
      reps: 1
      dist: 400
      int: steady
      rest: 20
      block: 2
    - name_zh: 每 4–5 划換氣
      reps: 2
      dist: 200
      int: steady
      rest: 20
      block: 2
    - name_zh: 輕鬆
      reps: 1
      dist: 200
      int: easy
      rest: 20
      block: 2
    note_zh: 組型照 Hayes 2018：2×[400 m 每 4 個池長抬頭定向一次；2×200 m 每 4–5 划換氣；200 m 輕鬆]。原文沒寫休息秒數，這裡的休息是預設欄位。抬頭、游直、跟游、繞標等練法見開放水域與鐵人的練習。
    source_ids:
    - src.hayes-2018-open-water-8-weeks-220-triathlon
  - key: aerobic
    name_zh: 長有氧
    note_zh: 沿用游泳的輕鬆有氧組（配速 CSS 換算，鐵人未驗證）。另可改成一段不停的穩定長游：短距離約 10 分鐘、標準距離約 20 分鐘、長距離約 40 分鐘（Laughlin 2016，教練個人觀點）。要不要排連續長游，教練與論壇意見分歧；它是訓練量，不是恢復課。
    continuous_minutes:
      sprint: 10
      standard: 20
      half: 40
      full: 40
    source_ids:
    - src.laughlin-2016-short-reps-vs-steady-swims
  - key: tenx100
    name_zh: 10×100
    sets:
    - name_zh: 10×100 比賽配速
      reps: 10
      dist: 100
      int: rp
      rest: 10
    note_zh: 超級距離每週至少放一次 10×100，並試著縮短休息來看耐力有沒有進步（Slaughter 2019）。原文範例是比賽配速、休 10 秒。
    source_ids:
    - src.slaughter-2019-swim-plan-triathlon-distances-usms
race_month:
  id: periodization.triathlon.race_month
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  open_water_days: 28
  note_zh: 賽前最後一個月每週 2 次開放水域（Hayes 2018，單一計畫）；能下開放水域的那幾堂，把技術課或長有氧換成開放水域，並穿上比賽要穿的防寒衣練。防寒衣要練幾次、從何時開始，沒有找到出處。
  source_ids:
  - src.hayes-2018-open-water-8-weeks-220-triathlon
taper:
  id: periodization.triathlon.taper
  links:
    related:
    - periodization.triathlon.planner
  cert: 🔵
  note_zh: 整體鐵人週期化的教練文章把減量放在最後兩週，沒有給降幅（Petrie 2025）。泳段專屬的減量降幅與天數沒有找到出處，這裡沿用游泳的減量規則，鐵人未驗證。
  source_ids:
  - src.petrie-2025-periodize-triathlon-training
