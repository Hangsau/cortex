domain: periodization
sub: dryland
schema_version: 1
overview:
  id: periodization.dryland.overview
  cert: 🔵
  premise_zh: 陸上力量常被當成『游得快的捷徑』或被當成『沒用、浪費水感』兩個極端來吵。兩種都是誤讀。陸訓能讓人變強這件事幾乎沒爭議；真正有爭議的是三件事：① 變強的力量能不能轉移到游速（轉移問題）；② 陸訓那天的疲勞會不會吃掉隔天的泳池課（並行排程問題）；③ 還沒發育的孩子能不能負重（成熟度問題）。把陸訓放進『週期化』這一頁，就是因為它的關鍵全在『什麼時候做、做多少、誰能做』——這正是週期化要回答的。
  author_synthesis_zh: 🔵 作者立場：陸訓不是水感的替代，也不是水感的敵人。它先改變陸上能力，是否轉移到水中要再量測。對技術成熟、疑似受力量限制的泳者，最大力量訓練是合理候選；仍須逐層驗收乾地能力、水中技術／外力與目標速度表現。
  plain_zh: 陸上重訓會不會讓你游更快？答案是『看情況』。能變強不等於一定游更快，中間隔著轉移。最大力量、增強式或專項阻力都可以是候選方案，但最後要回到完整泳姿和目標速度重測。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
transfer_evidence:
  id: periodization.dryland.transfer
  cert: 🟡
  source: Amaro et al. 系統回顧 (Science & Sports, S0765159718302363); 簡短回顧 (Redalyc 3010); Frontiers Physiology 2024 統合分析 (DOI 10.3389/fphys.2024.1406518)
  source_ids:
  - src.fphys-2024-1406518
  positive_zh: 支持的證據：部分研究看到 25m、50m、400m 自由式表現、划距或划頻改善；最大力量訓練在若干比較中有正向訊號。2024 統合分析指出阻力訓練平均提升上肢力量與前爬式表現，可能和划頻改變相關；這不等於已確認唯一最佳方法或個人因果機制。
  negative_zh: 🟡 反向證據（必讀）：回顧的 16 篇研究中約 **7 篇未報告任何正向或負向效果**。臥推力量在部分研究中**無法顯著預測衝刺速度**；另一研究發現力量耐力、最大力量、對照三組之間 **100m 衝刺時間沒有差異**。
  conditions_zh: 轉移成不成立取決於：① 對象的競技水準、技術與原始限制；② 訓練後增加的能力是否能在水中產生需要的外力或技術改變；③ 年齡、性別、主項與訓練史。動作外觀相似不自動等於高轉移，純陸上自由重量也不自動等於低轉移；應逐層量測。
  plain_zh: 陸訓不是保證，也不是沒用。先說清楚要改哪個限制，再測三層：陸上能力有沒有變、水中動作或外力有沒有變、目標泳段有沒有變。任何一層沒接上，就調整動作、劑量或排程。
  links:
    development_stages:
    - t2c
    - t2w
methods:
  id: periodization.dryland.methods
  cert: 🟢
  source: Frontiers Physiology 2025 網絡統合分析 (DOI 10.3389/fphys.2025.1636595); 水上運動增強式 SR (PMC9424421, n=618); 前爬式 S&C 生物力學 SR (PMC8488830); Hermosilla et al. 2021, dry-land turn systematic review
  source_ids:
  - src.pmc9424421-a
  - src.hermosilla-2021
  methods_list:
  - name_zh: 最大力量訓練
    desc_zh: 少次數、大重量（部分研究使用 ≥85% 1RM）。有正向轉移訊號，但劑量與優越性受族群、方案和 outcome 限制，必須回水中驗收。
    cert: 🟢
  - name_zh: 增強式（plyometrics）
    desc_zh: 跳躍、爆發式動作。部分出發與轉身 outcome 有正向訊號，但研究少且結果混合；不能由局部 outcome 推定 50/100m 整體游速。
    cert: 🟢
  - name_zh: 游泳專項阻力
    desc_zh: 划手板、拖傘、彈力繩等貼近划水動作的阻力。轉移性高於純陸上自由重量，因動作模式相符。
    cert: 🟠
  - name_zh: 力量耐力
    desc_zh: 高次數、中低負荷。理論上對中長距有氧肌耐力有幫助，但與最大力量／對照組相比，部分研究在 100m 看不到差異。
    cert: 🟡
  caveat_zh: 🟢 重要分辨：增強式『有效』指的多半是**出發與轉身**（這兩段確實是爆發力主導），不是『讓你游每一趟都更快』。把增強式對出發的效益,誇大成對整體游速的效益,是常見的解讀錯誤。
  plain_zh: 不是所有陸訓都一樣，也沒有一套對所有人最佳。先確認想改的是力量、出發、轉身還是完整游速，選候選方案後分別測乾地能力、水中段落和完整成績。
  links:
    development_stages:
    - t2c
    - t2w
concurrent_scheduling:
  id: periodization.dryland.concurrent
  cert: 🟢
  source: Delayed Effect of Dry-Land Strength Training Sessions on Swimming Performance, J Funct Morphol Kinesiol 2023 (PMID 37489300 / PMC10366873)
  source_ids:
  - src.pmc10366873
  finding_zh: 8 名泳者（18.6±2.9 歲）傍晚做陸訓（最大力量 MS 或力量耐力 SE，19:00–19:40），接著 90 分鐘泳池課；隔天早上 8:30 測 100m 自由式衝刺。三種條件（MS / SE / 對照）的成績**無顯著差異**（MS 64.70、SE 63.81、CON 64.52 秒，p>0.05），RPE、血乳酸、生物力學變數也都無差異。
  interpretation_zh: 🟡 這一次急性研究在約 12 小時後沒有偵測到三條件差異，可把『隔一晚』列為候選排程；它沒有證明所有泳者都已完全恢復，也不能保證隔天關鍵課一定不受影響。
  caveat_zh: 🟢 限制：n 僅 8、單一年齡層（成年青年）、單次急性設計。減量／達峰期間（taper）的陸訓劑量該怎麼降、青少年的恢復窗是否更長，都還沒有對應證據——別把『12 小時就好』外推到所有對象與所有週期階段。
  plain_zh: 這 8 名泳者隔一晚後，研究沒有測出 100 公尺差異。因此可以先測『重陸訓與關鍵課隔一晚』，再用隔天配速、SR/SL、RPE 和個人平常波動判斷；不是看到 12 小時就自動算恢復。
  links:
    development_stages:
    - t2c
    - t2w
needs_analysis:
  id: periodization.dryland.needs_analysis
  cert: 🟡
  source: Haff & Triplett (eds.), NSCA Essentials of Strength Training and Conditioning, 4th ed., 2016
  source_ids:
  - src.haff-triplett-2016
  premise_zh: 先定義比賽任務與個人限制，再選測試和處方。測試必須可靠、與欲回答的問題相符，並能在相近條件重測；不能因某個陸上數字容易量，就把它當成游速的代理。
  workflow_zh: '1. **任務層**：主項距離、泳式、出發／轉身／水面段哪一段掉速，疲勞出現在何時。

    2. **能力層**：只測可能限制該任務的力量、爆發力、活動度、耐力或左右差；同時記錄疼痛與訓練史。

    3. **處方層**：用最小可辨識劑量改一個主要限制，記錄總負荷（組×次×重量或等價外負荷）與完成品質。

    4. **驗收層**：依序重測陸上能力、水中相位／外力、完整目標泳段。只有末端 outcome 也改善，才稱為對該泳者完成轉移。

    '
  criteria_progression_zh: 進階不只看日曆：在目標動作無痛、技術可重複、前一級負荷與水中品質不惡化時才加量／加速／加複雜度。若陸上進步但水中不變，先查轉移與排程，不盲目繼續加重量。
  practical_example_zh: 例如轉身後 5m 慢：先分清推牆衝量、流線阻力、起踢時機或 UDK 速度哪一項最先掉；若是推牆能力候選，可練最大力量／爆發力，但仍須用 5m、10m 與 breakout 整段重測。
  plain_zh: 先找掉速段，再找可能限制，不是先挑一套重訓。陸上數字進步只是第一關；水中段落與完整成績都接上，才算真的轉移。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
injury_prevention:
  id: periodization.dryland.injury
  cert: 🟢
  source: McKenzie et al. 2023 SR, Scand J Med Sci Sports (DOI 10.1111/sms.14454); Kabat D2 彈力帶計畫, Frontiers Physiology 2023 (PMC10679734); 綜合傷害預防 RCT (ScienceDirect S1360859225004899)
  source_ids:
  - src.mckenzie-2023-b
  risk_factors_zh: 2023 系統回顧發現肩關節活動度、鬆弛／不穩定、姿勢與肩胛動作等候選因子，但證據整體不足以建立跨泳者通用的單一強風險因子或因果篩檢門檻。
  intervention_zh: 🟢 8 週 Kabat D2 彈力帶計畫（RCT n=22 男泳者）改善活動度、等長肌力與肩胛動作等 proxy outcomes；研究未直接證明傷害發生率下降。外旋肌與肩胛訓練可作容量方案候選，不能當清關或保證預防。
  kinetic_chain_zh: 🟢 動力鏈方案在青少年樣本改善上肢動態穩定與部分自由式表現 outcome；這支持整體能力訓練的候選方向，但不能由 proxy outcome 宣稱已證明預防傷害。
  plain_zh: 肩部活動度、肌力與肩胛動作都值得觀察，但沒有單一數字能判斷誰一定受傷。彈力帶或整體動力鏈訓練可以改善部分能力；是否減少疼痛或傷害仍要另外追蹤。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
youth_safety:
  id: periodization.dryland.youth
  cert: 🟢
  source: AAP Pediatrics 2020;145(6):e20201011; NSCA Youth Resistance Training 立場聲明; Swimming Australia 處方
  source_ids:
  - src.aap-pediatrics-2020-145-6-e20201011-nsca-you-2020
  age_zh: 🟢 介入年齡：並無『最低年齡』硬門檻——只要孩子能**聽懂並遵守指令與安全規則**（大致 7–8 歲、開始參與有組織運動的時機）就可以開始某種形式的阻力訓練。多個機構建議 5–8 歲是引入的合適區間。
  maturation_zh: 🟢 成熟度優先於實齡：同一實齡的孩子生理成熟度可差 **4–5 歲**，所以要看**生物年齡與訓練年齡**，不是只看出生日期。
  swim_specific_zh: 🟢 游泳專項處方（Swimming Australia）：**尚未進入發育衝刺期（PHV）前，只做自體重量訓練**；負重阻力訓練建議用於女生大於 13 歲（男生更晚，對應其較晚的 PHV）。對齊 ADM 分齡與 PHV（女 ~12.5 / 男 ~14）。
  tools_zh: 工具隨成熟度遞進：自體重量 → 藥球 → 彈力帶 → 器械 → 自由重量；任何階段都把**動作技術與安全**放在負荷之前。
  spectrum_gap_zh: 🔴 素材缺口：上述以兒童／青少年競技為主；**成人初學、masters（高齡泳者）、para（身障泳者）** 的陸訓處方與安全閾值，現有游泳文獻極少，不可把青少年或競技隊的結論直接外推到這些族群。
  plain_zh: 孩子幾歲能重訓？關鍵不是年齡數字，而是『聽不聽得懂指令、守不守得住安全規則』——大約 7、8 歲就可以開始（先用自體重量）。游泳界的標準更保守：發育衝刺期之前只做徒手，女生大約 13 歲後才上負重。重點永遠是先把動作做對，再加重量。（注意：成人初學、高齡、身障泳者的陸訓資料還很缺，別套用青少年的標準。）
  links:
    development_stages:
    - l2t
    - t2t
flexibility_mobility:
  id: periodization.dryland.flexibility
  cert: 🟢
  source: McCullough et al. 2009/2010 踝活動度與踢水推進相關研究; Pink/Tibone 肩關節基線; Kaminoff & Matthews, Yoga Anatomy, 2007
  source_ids:
  - src.mccullough-d
  - src.kaminoff-matthews-2007
  premise_zh: 肩、髖、踝的可用活動度可能限制某些游泳策略，但限制必須在目標動作中確認；被動角度不足、主動控制不足、疼痛保護與技術選擇需要分開。活動度是候選條件，不是看到動作問題就自動成立的硬體天花板。
  shoulder_zh: 🟢 **肩關節**：游泳要求的肩活動範圍是運動界最大之一（過頭屈曲 + 內外旋複合）。划手側內旋肌長期使用會變短變緊，外旋肌相對弱化（見上方 injury_prevention）；陸訓柔軟度的重點是**內旋肌伸展 + 後囊鬆動**，不是把活動度練得無限大（過度鬆會讓肩不穩定，反而提高傷害風險）。常用工具：胸大肌與前三角伸展、肩後囊 sleeper stretch、PVC 棍過頭迴旋。
  hip_zh: 🟢 **髖關節**：蛙式踢腿要求**髖內旋**（讓腳掌可以外翻朝後推水）、蝶式波動要求**髖屈伸**幅度。髖內旋活動度受限的選手蛙踢只能靠加寬膝距代償，造成正面阻力增加。陸訓重點：髖內旋活動度（lying hip rotation、90/90 stretch）、髖屈肌伸展（lunge variations）；對長期久坐者尤其重要（坐姿縮短髂腰肌）。
  ankle_zh: 🟡 **踝關節**：蹠屈幅度會影響腳部能否形成有效推進面。McCullough 等人在 20 名女性自由式泳者中觀察到蹠屈與 flutter-kick 速度呈中度相關（r=0.509），但不是訓練介入研究，也未證明跑者背景、倒退力或特定伸展處方。實務上可評估蹠屈並視限制加入腓腸肌伸展、跪坐扳腳與主動控制練習；效果須以個人前後測確認。
  protocol_zh: 🟡 候選流程：① 用目標泳姿與陸上主動／被動測試確認限制；② 依情境選動態活動、靜態伸展、PNF 或力量控制；③ 新增角度後在主動動作與水中技術中重測。30–60 秒、每週 3–5 次等可作起始劑量，不是唯一處方。
  caveat_zh: 🟡 長時間靜態伸展緊接最大力量／爆發活動可能短暫影響輸出，幅度取決於伸展總量與測法；需要高輸出的課前優先用動態暖身，把較深靜態伸展放在其他時段。
  plain_zh: 肩、髖、踝可能卡住某種技術，但先確認是角度、控制、疼痛還是策略問題。練完不只重測關節角度，也要回水中看原本的掉速或代償是否真的改變。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
null_caveats:
  id: periodization.dryland.caveats
  cert: 🟡
  source: 簡短回顧 (Redalyc 3010); 增強式水上運動 SR (PMC9424421)
  source_ids:
  - src.pmc9424421-b
  items_zh:
  - 回顧的 16 篇研究中約 7 篇對游泳表現**無任何顯著效果**。
  - 臥推力量在部分研究中**無法顯著預測**衝刺速度。
  - 力量耐力／最大力量／對照三組的 **100m 衝刺時間無差異**。
  - 618 名水上運動員的增強式統合分析，對水中垂直跳與敏捷**無效果**；增強式的好處侷限在出發與轉身，不及於整體游速。
  takeaway_zh: 🟡 結論：陸訓的轉移是『有條件成立』而非『普遍成立』。對技術成熟、練最大力量、練法貼近游泳動作的競技泳者，證據最強；脫離這些條件，效果可能歸零。把陸訓當『一定有用』來賣，不符合現有證據。
  plain_zh: 如果有人跟你說『重訓一定讓你游更快』，他沒讀過反面的那一半研究。陸訓有用是有前提的——技術要先穩、要練對的東西（最大力量）、練法要像游泳。前提不滿足，花在陸上的時間很可能換不到水裡的速度。
  links:
    development_stages:
    - t2c
    - t2w
