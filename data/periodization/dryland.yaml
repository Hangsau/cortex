domain: periodization
sub: dryland
schema_version: 1
overview:
  id: periodization.dryland.overview
  cert: 🔵
  premise_zh: 陸訓能提高游泳表現，最佳使用方式是和水中訓練結合：阻力訓練負責提高可用力量，核心與爆發訓練分別補足軀幹傳力、出發與轉身，再由水中賽速訓練把能力接回泳姿。
  author_synthesis_zh: 🟢 2025網絡統合分析的整體排序以『水中＋陸上阻力訓練』最佳；核心訓練對短距離與轉身有明確用途，爆發訓練主要服務出發與蹬牆。先按掉速段選方法，再用水中段落驗收。
  plain_zh: 陸訓要從掉速段開始選：出發慢練爆發，蹬牆與5m慢練下肢力量和核心，水面划水功率不足練最大力量並接水中阻力，肩痛則走疼痛與容量方案。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
transfer_evidence:
  id: periodization.dryland.transfer
  cert: 🟡
  source: Amaro et al. 系統回顧 (Science & Sports, S0765159718302363); 簡短回顧 (Redalyc 3010); Frontiers Physiology 2024 統合分析 (DOI 10.3389/fphys.2024.1406518)
  source_ids:
  - src.fphys-2024-1406518
  - src.wang-2025-training-nma
  positive_zh: 🟢 2025網絡統合分析納入36個隨機試驗、844名競技泳者：水中＋陸上組合訓練對100m、游速、划頻與划距的整體效果最高；其中水中＋陸上阻力訓練在50m、100m、游速與划水指標的排序最高。
  negative_zh: 🟡 無反應時的換法規則：只增加臥推或只做一般力量耐力，可能不會改變100m。連續4–6週陸上指標上升、目標水中段落卻兩次重測不變，就停止增加同一陸上劑量，改用水中阻力、賽速協調或直接針對出發／轉身的方案。
  conditions_zh: 依問題分流：①出發與蹬牆速度低→下肢最大力量＋爆發；②50/100m水面功率不足且技術穩定→上肢／全身最大力量＋水中阻力；③轉身後5m慢且軀幹控制差→核心穩定；④肩痛或姿勢問題→矯正與容量訓練，績效指標改用疼痛、ROM與可承受訓練量。
  plain_zh: 最有效的預設不是只練陸上，而是陸上提高能力、水中把能力接回動作。每個方法都對準一個掉速段：爆發對出發，力量對推牆與划水功率，核心對轉身後5m和短距離穩定。
  links:
    development_stages:
    - t2c
    - t2w
methods:
  id: periodization.dryland.methods
  cert: 🟢
  source: Frontiers Physiology 2025 網絡統合分析 (DOI 10.3389/fphys.2025.1636595); 水上運動增強式 SR (PMC9424421, n=618); 前爬式 S&C 生物力學 SR (PMC8488830); Hermosilla et al. 2021, dry-land turn systematic review
  source_ids:
  - src.pmc9424421-a
  - src.hermosilla-2021
  methods_list:
  - name_zh: 最大力量訓練
    desc_zh: 少次數、大重量（部分研究使用 ≥85% 1RM），用於提高推牆、出發及水面產力；每週接回水中阻力或賽速段落。
    cert: 🟢
  - name_zh: 增強式（plyometrics）
    desc_zh: 跳躍與爆發式動作直接服務出發、蹬牆和轉身後前5m；用離台、入水與5m分段驗收。
    cert: 🟢
  - name_zh: 游泳專項阻力
    desc_zh: 划手板、拖傘、彈力繩等貼近划水動作的阻力。轉移性高於純陸上自由重量，因動作模式相符。
    cert: 🟠
  - name_zh: 力量耐力
    desc_zh: 高次數、中低負荷，用於後段姿勢或局部容量先失守者；若100m與目標水中段落4–6週不變，轉為最大力量或水中賽速阻力。
    cert: 🟡
  caveat_zh: 🟢 重要分辨：增強式『有效』指的多半是**出發與轉身**（這兩段確實是爆發力主導），不是『讓你游每一趟都更快』。把增強式對出發的效益,誇大成對整體游速的效益,是常見的解讀錯誤。
  plain_zh: 出發慢做爆發，推牆或划水產力不足做最大力量，轉身後5m與軀幹控制差做核心，後段姿勢先散才做力量耐力；每一項都用對應水中分段驗收。
  links:
    development_stages:
    - t2c
    - t2w
concurrent_scheduling:
  id: periodization.dryland.concurrent
  cert: 🟢
  source: Delayed Effect of Dry-Land Strength Training Sessions on Swimming Performance, J Funct Morphol Kinesiol 2023 (PMID 37489300 / PMC10366873)
  source_ids:
  - src.pmc10366873
  finding_zh: 8 名泳者（18.6±2.9 歲）傍晚做陸訓（最大力量 MS 或力量耐力 SE，19:00–19:40），接著 90 分鐘泳池課；隔天早上 8:30 測 100m 自由式衝刺。三種條件（MS / SE / 對照）的成績**無顯著差異**（MS 64.70、SE 63.81、CON 64.52 秒，p>0.05），RPE、血乳酸、生物力學變數也都無差異。
  interpretation_zh: 🟢 一般訓練週可把最大力量或力量耐力排在傍晚，隔一晚約12小時後安排100m品質課；這個排程在受測成年青年泳者中維持了隔天成績、RPE、乳酸與生物力學指標。
  caveat_zh: 🟢 排程分流：一般成年青年泳者先用隔夜約12小時；隔天配速、SR/SL或RPE連續兩次掉出個人基線，就拉長到24–36小時。青少年、比賽週與減量週先用24–48小時，再依水中品質縮短。
  plain_zh: 一般訓練週把重陸訓和下一堂品質水課隔一晚；如果隔天配速、SR/SL或RPE連續兩次低於個人基線，就把間隔拉到24–36小時。比賽週與減量週則把重陸訓移出主賽前48小時。
  links:
    development_stages:
    - t2c
    - t2w
needs_analysis:
  id: periodization.dryland.needs_analysis
  cert: 🟡
  source: Haff & Triplett (eds.), NSCA Essentials of Strength Training and Conditioning, 4th ed., 2016
  source_ids:
  - src.haff-triplett-2016
  premise_zh: 陸訓處方從比賽掉速段反推：先定位出發、轉身、水下或水面段，再測最可能限制該段的力量、爆發力、活動度、軀幹控制與左右差，最後選能直接改變該限制的訓練。
  workflow_zh: '1. **任務層**：主項距離、泳式、出發／轉身／水面段哪一段掉速，疲勞出現在何時。

    2. **能力層**：只測可能限制該任務的力量、爆發力、活動度、耐力或左右差；同時記錄疼痛與訓練史。

    3. **處方層**：用最小可辨識劑量改一個主要限制，記錄總負荷（組×次×重量或等價外負荷）與完成品質。

    4. **驗收層**：依序重測陸上能力、水中相位／外力、完整目標泳段。只有末端 outcome 也改善，才稱為對該泳者完成轉移。

    '
  criteria_progression_zh: 進階規則：目標動作無痛、連續兩次技術可重複、完成預定負荷且隔天水中品質維持基線，下一週增加2.5–5%負荷或一個速度等級；若陸上進步而水中段落兩次不變，改成水中阻力或降低陸上疲勞。
  practical_example_zh: 例如轉身後 5m 慢：先分清推牆衝量、流線阻力、起踢時機或 UDK 速度哪一項最先掉；若是推牆能力候選，可練最大力量／爆發力，但仍須用 5m、10m 與 breakout 整段重測。
  plain_zh: 先找掉速段，再開訓練：出發看跳躍與離台，轉身看蹬牆和5m，水下看起踢交點與UDK速度，水面看划水功率與SR/SL。測到哪個限制，就處理哪個限制。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
injury_prevention:
  id: periodization.dryland.injury
  cert: 🟢
  source: McKenzie et al. 2023 SR, Scand J Med Sci Sports (DOI 10.1111/sms.14454); Kabat D2 彈力帶計畫, Frontiers Physiology 2023 (PMC10679734); 綜合傷害預防 RCT (ScienceDirect S1360859225004899)
  source_ids:
  - src.mckenzie-2023-b
  risk_factors_zh: 肩部處理分三型：①疼痛或訓練後症狀上升→先降引發症狀的划量與強度；②無痛但外旋肌力、肩胛控制或主動活動度不足→補容量；③鬆弛度高且末端控制差→練末端穩定，不再追求更大被動角度。
  intervention_zh: 🟢 外旋肌力、肩胛動作或主動活動度不足者，使用8週 Kabat D2 彈力帶與外旋／前鋸肌方案；每週記錄疼痛、ROM、等長肌力與可承受划量，兩週無改善就調整負荷或轉介評估。
  kinetic_chain_zh: 🟢 青少年出現上肢動態穩定不足、跨側軀幹控制差或完整自由式同側失序時，加入跨側推、拉、carry、deadbug與bird-dog；以動態穩定、15–25m完整泳姿和症狀反應驗收。
  plain_zh: 有痛先降引發症狀的負荷；無痛但外旋、肩胛或跨側控制不足，就做8週容量方案；鬆但控制差練穩定，不再拉更開。每週用疼痛、ROM、肌力和可承受划量追蹤。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
youth_safety:
  id: periodization.dryland.youth
  cert: 🟢
  source: AAP Pediatrics 2020;145(6):e20201011; NSCA Youth Resistance Training 立場聲明; Swimming Australia 處方
  source_ids:
  - src.aap-pediatrics-2020-145-6-e20201011-nsca-you-2020
  age_zh: 🟢 介入年齡：並無『最低年齡』硬門檻——只要孩子能**聽懂並遵守指令與安全規則**（大致 7–8 歲、開始參與有組織運動的時機）就可以開始某種形式的阻力訓練。多個機構建議 5–8 歲是引入的合適區間。
  maturation_zh: 🟢 成熟度優先於實齡：同一實齡的孩子生理成熟度可差 **4–5 歲**，所以要看**生物年齡與訓練年齡**，不是只看出生日期。
  swim_specific_zh: 🟢 游泳專項處方（Swimming Australia）：**尚未進入發育衝刺期（PHV）前，只做自體重量訓練**；負重阻力訓練建議用於女生大於 13 歲（男生更晚，對應其較晚的 PHV）。對齊 ADM 分齡與 PHV（女 ~12.5 / 男 ~14）。
  tools_zh: 工具隨成熟度遞進：自體重量 → 藥球 → 彈力帶 → 器械 → 自由重量；任何階段都把**動作技術與安全**放在負荷之前。
  spectrum_gap_zh: 成人初學先用自體重量與器械建立動作品質；masters 依關節症狀、跌倒風險與恢復速度調整負荷和間隔；para 依功能分級、可用肢段與輔具逐動作設定。三類都從可重複、無症狀惡化的負荷開始，每週依水中品質增加2.5–5%。
  plain_zh: 約7、8歲、能守指令就能從自體重量開始；PHV前以徒手為主，成熟後再逐步負重。成人初學先學動作，masters 加長恢復並看關節反應，para 依可用肢段與輔具設定；完成品質穩定再增加2.5–5%。
  links:
    development_stages:
    - l2t
    - t2t
flexibility_mobility:
  id: periodization.dryland.flexibility
  cert: 🟢
  source: McCullough et al. 2009/2010 踝活動度與踢水推進相關研究; Pink/Tibone 肩關節基線; Kaminoff & Matthews, Yoga Anatomy, 2007
  source_ids:
  - src.mccullough-d
  - src.kaminoff-matthews-2007
  premise_zh: 活動度決定泳者能使用哪些技術路徑：肩屈曲／旋轉不足會限制流線與回臂，髖內旋不足會迫使蛙腿加寬，踝蹠屈不足會縮小自由式與蝶腳的有效推進面。處方先分成被動角度不足、主動控制不足與疼痛三型。
  shoulder_zh: 🟢 **肩關節**：游泳要求的肩活動範圍是運動界最大之一（過頭屈曲 + 內外旋複合）。划手側內旋肌長期使用會變短變緊，外旋肌相對弱化（見上方 injury_prevention）；陸訓柔軟度的重點是**內旋肌伸展 + 後囊鬆動**，不是把活動度練得無限大（過度鬆會讓肩不穩定，反而提高傷害風險）。常用工具：胸大肌與前三角伸展、肩後囊 sleeper stretch、PVC 棍過頭迴旋。
  hip_zh: 🟢 **髖關節**：蛙式踢腿要求**髖內旋**（讓腳掌可以外翻朝後推水）、蝶式波動要求**髖屈伸**幅度。髖內旋活動度受限的選手蛙踢只能靠加寬膝距代償，造成正面阻力增加。陸訓重點：髖內旋活動度（lying hip rotation、90/90 stretch）、髖屈肌伸展（lunge variations）；對長期久坐者尤其重要（坐姿縮短髂腰肌）。
  ankle_zh: 🟡 **踝關節**：蹠屈幅度與 flutter-kick 速度呈中度相關（女性自由式泳者 r=0.509）。被動蹠屈不足者做腓腸肌伸展與跪坐扳腳；被動足夠但踢腿時腳背維持不住者做末端蹠屈等長與主動控制；每2週用蹠屈角度與25m踢腿重測。
  protocol_zh: 🟢 分型處方：①被動角度與主動角度都不足→靜態伸展或PNF 30–60秒、每週3–5次，再接主動控制；②被動足夠、主動不足→在末端角度做慢速肌力與CARs；③活動時疼痛→停止追角度，改做疼痛可接受範圍的等長與容量訓練。
  caveat_zh: 🟡 長時間靜態伸展緊接最大力量／爆發活動可能短暫影響輸出，幅度取決於伸展總量與測法；需要高輸出的課前優先用動態暖身，把較深靜態伸展放在其他時段。
  plain_zh: 被動也緊就伸展；被動夠、自己抬不到就練末端力量；一動就痛就先處理疼痛與容量。每次活動度介入後，立刻回水中重測原本受限的流線、蛙腿或踢腿。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
null_caveats:
  id: periodization.dryland.caveats
  cert: 🟡
  source: 簡短回顧 (Redalyc 3010); 增強式水上運動 SR (PMC9424421)
  source_ids:
  - src.pmc9424421-b
  items_zh:
  - 陸上力量上升、水中分段不變：減少一般重量訓練，改接水中阻力與賽速協調。
  - 臥推上升、衝刺不變：停止把臥推當主指標，改測划水功率、15–25m與SR/SL。
  - 力量耐力做滿4–6週、100m後段不變：改最大力量，或直接以後50m配速與技術維持訓練。
  - 增強式進步、完整游速不變：只保留服務出發與轉身的劑量，用5m與15m分段驗收。
  takeaway_zh: 🟡 陸訓每4–6週做一次轉移判定：乾地能力、水中目標分段、完整成績依序檢查。哪一層沒有往下傳，就在那一層換方法，不繼續堆同一劑量。
  plain_zh: 陸上變強卻沒游快，就不要再加同一種重量：把能力接到水中阻力與賽速；臥推不轉移就改測划水功率；增強式只保留給出發和轉身。每4–6週照三層結果換法。
  links:
    development_stages:
    - t2c
    - t2w
