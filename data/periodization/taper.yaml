domain: periodization
sub: taper
schema_version: 1
source_repos:
- resources/books/Periodization__Theory_and_Methodology_of_Training/
definition:
  id: periodization.taper.definition
  cert: 🟢
  source: Ch9; Mujika & Padilla 2003 (PMID 12840640)
  source_ids:
  - src.pmid-12840640-a
  text_en: A progressive, nonlinear reduction of the training load during a variable period of time, intended to reduce physiological and psychological stress of daily training and optimize sport performance.
  text_zh: 在一段可變期間內，漸進、非線性地降低訓練負荷，目的是移除日常訓練累積的生理與心理壓力、使表現最佳化
  purpose_zh: 讓減量期前累積的訓練適應（fitness）保留，同時消除疲勞（fatigue）→ 表現 = fitness − fatigue 的差值在減量末達最大
  plain_zh: 減量＝比賽前那幾週，故意把訓練量慢慢降下來。關鍵在：之前練出來的本事（體能）會留著，但累積的疲勞會被消掉。比賽當天身體既有料又不累，成績自然跑得出來。
variables:
- id: periodization.taper.volume
  key: volume
  name_zh: 訓練量
  cert: 🟢
  source: Ch9; Mujika & Padilla 2003 (PMID 12840640); Bosquet et al. 2007 (PMID 17762369)
  source_ids:
  - src.pmid-12840640-b
  reduction:
    typical: 41–60%
    heavy_pretaper: 60–90%
    note_zh: 回顧與統合研究中的候選區間；不是個人固定處方，須依減量前負荷與反應逐次調整
  role_zh: 減量主旋鈕——量的下降是消除疲勞的最大來源
  plain_zh: 比賽前主要調整『游多少』。研究常見減少四到六成，重負荷情境也出現六到九成；這些是研究範圍，不是所有泳者照抄的答案。先對照自己的減量前基線、速度品質、症狀與恢復反應。
- id: periodization.taper.intensity
  key: intensity
  name_zh: 訓練強度
  cert: 🟡
  source: Ch9
  source_ids:
  - src.ch9
  rule_zh: 維持中高強度以保留適應與技術；強度若一併大降會導致 detraining
  first_week_zh: 減量第一週可微調：功率類 −5–10%、耐力類 −20–30%，之後回拉至接近賽強度
  role_zh: 強度是『保適應』旋鈕，不可大降
  plain_zh: 強度（游多快）不能跟著砍。還是要保留一些接近比賽配速的快游，不然身體會『退掉』，比賽當天反而沒有速度感。
- id: periodization.taper.frequency
  key: frequency
  name_zh: 訓練頻率
  cert: 🟡
  source: Ch9; Mujika & Padilla 2003 (PMID 12840640)
  source_ids:
  - src.pmid-12840640-a
  rule_zh: 回顧常見維持至少約 80% 平時頻率；這是保留技術暴露的候選起點，不是跨族群硬門檻
  role_zh: 頻率是『保技術』旋鈕
  plain_zh: 下水次數通常不和總量等比例大砍；研究常保留約八成頻率，以維持技術暴露。實際仍要看平時頻率、旅行、症狀與每次下水的品質。
- id: periodization.taper.duration
  key: duration
  name_zh: 減量時長
  cert: 🟢
  source: Ch9; Mujika & Padilla 2003 (PMID 12840640)
  source_ids:
  - src.pmid-12840640-a
  range:
    min_days: 8
    max_days: 14
    note_zh: 8–14 天是常見研究區間；個人反應、項目與減量前負荷可使適合時長更短或更長
  role_zh: 時長旋鈕——與減量前疲勞程度成正比
  plain_zh: 研究常見一到兩週（8–14 天），但也有更長的游泳研究。把它當作第一個待測範圍，再用個人基線、目標速度、主觀恢復與症狀調整。
taper_types:
- id: periodization.taper.type.linear
  key: linear
  name_zh: 線性遞減
  cert: 🟡
  source: Ch9
  source_ids:
  - src.ch9
  note_zh: 負荷等量直線下降；增益低於指數型
  plain_zh: 每天等量往下降一直線。最單純，但效果比指數型差。
- id: periodization.taper.type.step
  key: step
  name_zh: 階梯式（單次驟降）
  cert: 🟢
  source: Ch9; Bosquet et al. 2007 (PMID 17762369)
  source_ids:
  - src.pmid-17762369
  perf_gain: ≈1.2–1.5%
  note_zh: 一次性把負荷砍到固定低水平維持；增益最小
  plain_zh: 一次把量砍到一個低水平就維持不動。最省事，但增益最小（大約進步 1–1.5%）。
- id: periodization.taper.type.fast_exponential
  key: fast_exponential
  name_zh: 快速指數遞減
  cert: 🟢
  source: Ch9; Bosquet et al. 2007 (PMID 17762369)
  source_ids:
  - src.pmid-17762369
  perf_gain: ≈4.0–5.0%
  note_zh: 前段快降、後段趨緩；該統合研究的平均估計較高，但研究異質性不足以指定所有泳者的唯一最佳曲線
  default: false
  plain_zh: 前面降得快、後面慢慢收。統合研究的平均估計較高，但不代表每個泳者都會進步 4–5%，也不能據此排除其他曲線；要和自己的歷次 taper 反應比較。
peak:
  id: periodization.taper.peak_window
  cert: 🟡
  source: Ch9; Bompa & Buzzichelli, Periodization, 6th ed., 2019
  source_ids:
  - src.ch9
  - src.bompa-buzzichelli-2019
  maintainable_days:
    min: 7
    max: 14
    note_zh: 教材常用約 7–14 天描述達峰窗，可作排程候選；個人窗須由歷次減量反應估計
  definition_zh: 達峰 = 在目標賽事當下同時擁有最高 fitness 與最低 fatigue 的暫態
  warning_zh: 不能由通用 7–14 天直接判定第 15 天必然回落；多目標賽季應用歷次比賽、疲勞與表現曲線估計個人可維持窗。
  plain_zh: 7–14 天是常用的排程起點，不是每個人的硬期限。留下每次減量後的日序、訓練量、主觀狀態與成績，逐季估計自己的高表現窗口。
swim_application:
  id: periodization.taper.swim
  cert: 🟢
  source: Mujika et al. 1996 (PMID 8775162); Mujika/Padilla/Pyne 2002 (PMID 12439774); Bosquet et al. 2007 (PMID 17762369)
  source_ids:
  - src.mujika
  volume_reduction_zh: 🔵 游泳文獻常見賽前 50–90% 量遞減（與 Bompa 41–60%／重負荷 60–90% 區間一致）
  three_week_taper_zh: 🟢 模型化游泳選手研究：三週減量平均 +2.90±1.50%、四週 +3.20±1.70% 表現增益（Mujika et al. 1996, PMID 8775162, N=18）
  sydney_2000_zh: 🟢 雪梨 2000 奧運游泳：賽前三週減量期間表現平均提升 +2.18±1.50%（男 +2.57%／女 +1.78%，99 筆成績；Mujika/Padilla/Pyne 2002, PMID 12439774）；奧運獎牌的成績差距常在 0.5–1% 量級，故數個百分點的減量增益足以決定名次
  practice_zh: 🔵 swim-coach 候選起點：可先測 8–14 天、量降至平時約 40–60%、保留技術與賽速暴露；不得自動套用，須按個人 pretaper 基線與逐次反應調整
  plain_zh: 可先從研究常見的 8–14 天、總量降到約四至六成、保留部分下水與賽速暴露開始測試。三週游泳研究的平均改善是特定樣本結果，不是每個人保證進步；每次都要留下自己的基線與結果。
  level_stratified_gains_zh: '🟢 表現增益依水準分層（多項研究綜整）：高中／青少年選手減量後常見 5–8% 增益（D''Acquisto 1992 報告 100m 7.96%、400m 5.00%）；大學選手 2.6–3.2%（Costill 1985/91、Johns 1992）；國家／國際級男子減量四週 2.07–2.32%（Bonifazi 2000、Mujika 1996）。

    這個分層暗示：水準越高、表現天花板越近，減量的剩餘空間就越小。教練設定減量目標增益時，應以選手目前水準為基準，避免拿高中數據套到菁英選手身上。

    '
  no_event_specificity_zh: 🟢 雪梨 2000 樣本中，50–1500m 與泳式分組的平均改善未達顯著差異，支持減量可跨項目釋放既有適應；但『未檢出組間差異』不證明所有項目可用同一曲線。賽速暴露、技術負荷與個人恢復仍可依主項調整。
  psychological_aspect_zh: 🟠 心理面與生理面同等重要：減量不只是消除生理疲勞，也是讓選手心理穩定、信心累積、賽前焦慮被導入正確情緒狀態的窗口。教練實務常見的失敗案例不是「體能沒到」而是「心理沒到」——身體在小型比賽超越自己、卻在主賽『撐不住焦慮』。減量期應同步處理：心理回放（影片回看）、目標重整、焦慮管理。
  links:
    development_stages:
    - t2c
    - t2w
