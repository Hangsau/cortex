domain: periodization
sub: zones
schema_version: 1
source_repos:
- resources/books/Periodization__Theory_and_Methodology_of_Training/
intensity_zones:
  id: periodization.zones.table_7_1
  cert: 🟡
  source: Ch7 Table 7.1 Intensity Zones and Training Demand
  source_ids:
  - src.ch7-table-7-1-intensity-zones-and-training-d
  zones:
  - zone: 1
    demand_zh: 非常高
    pct_max_performance: 90–100%
    intensity_zh: 最大
  - zone: 2
    demand_zh: 高
    pct_max_performance: 80–90%
    intensity_zh: 重
  - zone: 3
    demand_zh: 中
    pct_max_performance: 70–80%
    intensity_zh: 中
  - zone: 4
    demand_zh: 低
    pct_max_performance: 50–70%
    intensity_zh: 低
  - zone: 5
    demand_zh: 非常低
    pct_max_performance: <50%
    intensity_zh: 非常低
  - zone: recovery
    demand_zh: 恢復
    pct_max_performance: 無訓練
    intensity_zh: 恢復
  note_zh: 比賽配速 = zone 2；Bompa 建議每週至少 50% 訓練時間落在比賽配速強度。高於賽配速由無氧供能主導，低於賽配速由有氧供能主導
  tid_dialogue_zh: 🔵 對話（極化派 Seiler）：Bompa『每週 ≥50% 落在比賽配速』與 Seiler『80% 低強度＋20% 高強度、避開中間區』表面上直接衝突，但兩套系統的『區』定義不同，不能直接數字對比——Bompa zone 2（賽配速，80–90% 最大表現）對應的可能是 Seiler 的 Z3（高強度）邊界而非『中間區』。若 Bompa 賽配速＝Seiler Z3，則『50% 在賽配速』比『80/20』要求更多高強度（方向相反）；若＝Seiler Z2，則 Bompa 等於主張大量閾值，與極化派『避中間』直接衝突。這個張力本身就是要呈現的辯論，不強行統一（見 school_polarized）。
  plain_zh: Bompa 把訓練強度分成 6 區，用『佔最大表現的百分比』定義。zone 1 最吃力（90–100%），zone 5 最輕（<50%），recovery 是不下水。比賽配速落在 zone 2。一個好記的原則：每週至少一半的訓練時間要落在比賽配速強度。注意這條原則有爭議——極化派（下面 school_polarized）主張剛好相反：大部分量應該是輕鬆的、少碰中間強度。
  links:
    related:
    - periodization.zones.school_polarized
hr_vo2_ergogenesis:
  id: periodization.zones.table_11_2
  cert: 🟡
  source: Ch11 Table 11.2
  source_ids:
  - src.ch11-table-11-2
  rows:
  - pct_hr_max: 50%
    pct_vo2max: 28%
    system_zh: 氧化-糖解（有氧）
    target_zh: 主動恢復 / 有氧基礎
  - pct_hr_max: 70%
    pct_vo2max: 56%
    system_zh: 糖解有氧
    target_zh: 廣度有氧能力 (extensive aerobic capacity)
  - pct_hr_max: 80%
    pct_vo2max: 70%
    system_zh: 糖解無氧-有氧
    target_zh: 強度有氧能力 / 廣度有氧功率
  - pct_hr_max: 90%
    pct_vo2max: 83%
    system_zh: 糖解有氧-無氧
    target_zh: 強度有氧功率 (intensive aerobic power)
  - pct_hr_max: 96%
    pct_vo2max: 90%
    system_zh: 糖解無氧-有氧
    target_zh: 強度有氧功率 + 廣度無氧能力
  - pct_hr_max: 100%
    pct_vo2max: 100%
    system_zh: 最大
    target_zh: 無氧功率 / 最大
  plain_zh: 這張表把心率／攝氧量對應到身體主要靠哪套能量系統供能。心率越高、越偏無氧；心率 50% 上下是有氧恢復區。用途是確認某一組課實際練到的是哪個系統，避免賽季階段跟能量系統錯配。
liee_methods:
  id: periodization.zones.table_11_1
  cert: 🟡
  source: Ch11 Table 11.1 Methods of developing low-intensity exercise endurance
  source_ids:
  - src.ch11-table-11-1-methods-of-developing-low-in
  warning_zh: LIEE（低強度）與 HIEE（高強度）不可混用；耐力型態選錯會降低專項表現
  methods:
  - key: active_rest
    name_zh: 主動恢復
    freq_per_wk: 1–2
    duration: 30–60 min
    intensity_zh: <60% HR / <40% VO2max
  - key: lsd
    name_zh: 長慢距離(LSD)
    freq_per_wk: 1–2
    duration: ≥30 min
    intensity_zh: 66–80% HR / 50–70% VO2max
  - key: continuous_tempo
    name_zh: 連續配速/節奏
    freq_per_wk: 1–2
    duration: 20–30 min
    intensity_zh: 乳酸閾值 (LT)
  - key: aerobic_intervals
    name_zh: 有氧間歇
    freq_per_wk: 1–2
    duration: 20–40 min
    intensity_zh: 80–100% HR / 70–100% VO2max
  - key: anaerobic_intervals
    name_zh: 無氧間歇
    freq_per_wk: 1–2
    duration: <2 min 衝刺 (W:R 1:0.5–1:5)
    intensity_zh: 最大 / 超最大
  - key: fartlek
    name_zh: 法特雷克(變速跑)
    freq_per_wk: '1'
    duration: '>30 min'
    intensity_zh: 變動
  plain_zh: 低強度耐力的幾種練法：主動恢復、長慢游、節奏游、有氧間歇等。最重要的一句警告——低強度耐力和高強度耐力不能亂混著練，耐力型態選錯會拖累專項表現。
endurance_periodization:
  id: periodization.zones.endurance_phases
  cert: 🟡
  source: Ch5 Endurance periodization
  source_ids:
  - src.ch5-endurance-periodization
  phases:
  - key: aerobic_endurance
    name_zh: 有氧耐力
    when_zh: 過渡期 + 準備期早期（1–3 個月）
    focus_zh: 建立有氧基礎、廣度有氧能力
  - key: aerobic_plus_specific
    name_zh: 有氧+專項
    when_zh: 準備期中後段
    focus_zh: 有氧基礎上疊加專項代謝需求
  - key: specific_endurance
    name_zh: 專項耐力
    when_zh: 準備期晚期 + 競賽期
    focus_zh: 對映比賽能量系統的專項耐力
  olbrecht_dialogue_zh: 🟡 對話（Olbrecht）：Bompa 在這個有氧建構階段的主力工具是『閾值配速大量堆量』，Olbrecht 直接質疑——他稱『在最大乳酸穩態速度訓練就能提升耐力』是『魔法子彈謬誤』，主張閾值訓練既非有氧能力的最佳刺激、也非有效的無氧刺激。他的替代：大量輕鬆有氧量＋嵌入短暫（~30–35 秒、超 VO2max）衝刺，並在基礎期刻意排除長間歇閾值組（見 olbrecht_model）。
  plain_zh: 耐力是分階段堆起來的：先用廣度有氧打底（過渡期＋準備期早期），再疊上專項代謝需求，最後練對準比賽的專項耐力。順序不能顛倒——沒打好有氧底就直接衝專項，後面會撐不住。不過『有氧底＝大量練閾值』這點 Olbrecht 反對（下面 olbrecht_model），他主張改用輕鬆量＋短衝刺。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - periodization.zones.olbrecht_model
swim_zones_maglischo:
  id: periodization.zones.swim_maglischo
  cert: 🟢
  source: Maglischo 2012, Training Zones Revisited, J Swimming Research 19(2)（全文）
  source_ids:
  - src.maglischo-2012
  anaerobic_threshold_mmol: 3–5 mmol/L（AnTh 區血乳酸範圍）
  zones:
  - key: recovery
    name_zh: 恢復
    focus_zh: 主動恢復、技術游
  - key: en1
    name_zh: 有氧基礎 (Endurance 1)
    focus_zh: 有氧基礎、低乳酸大量累積
  - key: en2
    name_zh: 有氧維持 (Endurance 2)
    focus_zh: 接近無氧閾值的有氧發展
  - key: en3
    name_zh: 有氧超負荷 (Endurance 3)
    focus_zh: 閾值附近、最高可持續有氧負荷
  - key: anth
    name_zh: 無氧閾值 (Anaerobic Threshold)
    focus_zh: 閾值強度，血乳酸 3–5 mmol
  - key: vo2max
    name_zh: 最大攝氧 (VO2max)
    focus_zh: 刺激最大攝氧量
  sprint_note_zh: SP（衝刺）在 Maglischo 框架中是『類別』而非分區（速度/功率訓練），與上述有氧—閾值光譜分開處理
  caution_zh: 🔴 各區詳細血乳酸 / 配速門檻需翻 Maglischo《Swimming Fastest》原書頁逐區確認；本檔僅收錄全文已確認的 AnTh 3–5mmol 與六區名稱，未逐區填數值以免發明
  plain_zh: Maglischo 是游泳專用的分區系統，用血乳酸＋訓練目的把游泳強度分成：恢復、有氧基礎(En1)、有氧維持(En2)、有氧超負荷(En3)、無氧閾值(AnTh，乳酸 3–5)、最大攝氧(VO2max)。衝刺(SP)另外算一類，不在這條有氧—閾值光譜上。比 Bompa 的『百分比』更貼近游泳教練實際開課的語言。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
swim_zones_three:
  id: periodization.zones.swim_three_zone
  cert: 🟢
  source: 游泳/耐力 TID 文獻通用三區模型（血乳酸界線）
  source_ids:
  - src.tid-three-zone-model
  zones:
  - zone: 1
    lactate_mmol: ≤2
    name_zh: 低強度
    focus_zh: 有氧基礎、恢復
  - zone: 2
    lactate_mmol: 2–4
    name_zh: 閾值區
    focus_zh: 閾值附近
  - zone: 3
    lactate_mmol: '>4'
    name_zh: 高強度
    focus_zh: VO2max / 無氧
  plain_zh: 做訓練強度分布分析時最常用的簡化版：用血乳酸把強度切三段——Z1 輕鬆（≤2）、Z2 閾值（2–4）、Z3 吃力（>4）。下面的 polarized / pyramidal 分布就是用這三區算比例。
  links:
    development_stages:
    - t2c
    - t2w
energy_systems_primer:
  id: periodization.zones.energy_systems_primer
  cert: 🟡
  source: 公認運動生理學（磷酸原/糖酵解/氧化三系統時程為教科書級共識，如 Bompa Ch5/Ch11、McArdle Exercise Physiology）；游泳項目對映見 swim_energy_by_distance 來源（Toussaint & Hollander 1994 / Rodríguez & Mader 2011）
  source_ids:
  - src.bompa-ch5-ch11-mcardle-exercise-physiology-s
  caveat_zh: 🔵 三系統並非開關切換而是連續重疊——任一時刻三者都在供能，差別只在『誰主導』。下列時長為主導窗口的教科書級近似，個體與項目會浮動，不可當精確門檻。
  systems:
  - key: phosphagen
    name_zh: 磷酸原系統（ATP-PCr，無乳酸/alactic）
    dominant_window_zh: 🟡 約 0–10 秒（最大功率前 6–10 秒）
    fuel_zh: 肌肉內既存 ATP + 磷酸肌酸（PCr）儲備
    limiter_zh: 🟡 不產乳酸；受 PCr 儲量限制，耗竭即功率下降
    recovery_zh: 🟡 PCr 再合成快，約 3–5 分鐘大致回補（靠有氧系統供能完成）
    swim_events_zh: 25m 全力、出發/轉身爆發、50m 前段加速
    training_direction_zh: 🔵 極短（≤10–15 秒）最大努力 + 接近完全的長休（高 W:R 比），對應 Maglischo SP（衝刺/功率）類；目的是練速度與爆發力，不是練乳酸耐受。精確組數/休息比協議 🔴 待補（見下 protocol_pending）
  - key: glycolytic
    name_zh: 糖酵解系統（無氧糖解，乳酸/lactic）
    dominant_window_zh: 🟡 約 10 秒–2 分鐘（高峰約 30 秒–1 分鐘）
    fuel_zh: 肌糖原無氧分解
    limiter_zh: 🟡 乳酸與 H⁺ 堆積造成肌肉酸化 → 疲勞；這是『撐不住』的主因
    recovery_zh: 🟡 慢，乳酸清除需數十分鐘，靠有氧系統代謝
    swim_events_zh: 50m 後段、100m、200m 的無氧部分
    training_direction_zh: 🔵 30 秒–2 分鐘高強度 + 不完全恢復（乳酸生成組/乳酸耐受組）。研究層另有 VHL/RSH-VHL 低通氣路線專練此系統（見 research/週期化/低通氣訓練_VHL_RSH.md，屬進階、有樣本限制）。精確協議 🔴 待補
  - key: oxidative
    name_zh: 氧化系統（有氧/aerobic）
    dominant_window_zh: 🟡 約 2 分鐘以上起主導，項目越長越主導
    fuel_zh: 糖 + 脂肪在粒線體內有氧氧化
    limiter_zh: 🟡 副產物為 CO₂ + H₂O，可持續排除；限制在供氧與基質而非酸化
    recovery_zh: 🟡 它同時是『運動後恢復系統』——清乳酸、補 PCr 都靠它
    swim_events_zh: 200m 以上漸增主導，400/800/1500 為主力
    training_direction_zh: 🔵 LSD、節奏游、有氧間歇、閾值（見 liee_methods）；對應 Maglischo En1/En2/En3。即使衝刺選手大部分量仍在此系統（swim_tid sprinter_note）
  training_protocols:
  - system: phosphagen
    name_zh: 磷酸原（速度/功率）
    protocol_zh: 🟠 極短最大努力 6–15 秒、休 90–120 秒（補 PCr）、5–10 reps。範例：6×15m 全力、組間休 90s。重點是每趟接近全速，休息要足以恢復功率，不是練到累。
    cert: 🟠
    source: 教練共識（getphysical / strengthmatters alactic power intervals）；與 PCr 再合成動力學一致（90–120s 部分恢復、3–5min 大致完全，見上 recovery_zh）
    source_ids:
    - src.getphysical-strengthmatters-alactic-power-in
  - system: glycolytic_production
    name_zh: 糖酵解—乳酸生成（lactate production）
    protocol_zh: 🟠 短距離 25–50m 最大努力 + 長休（讓乳酸部分清除以維持每趟全速），單次課前段量約 300–500m；須從跳台全速、不配速（確保最大刺激無氧糖解）。目的是『把乳酸推上去』。
    cert: 🟠
    source: British Swimming《A Guide to Anaerobic Training—Lactate Production》(© British Swimming 2006, Revised 2020)
    source_ids:
    - src.british-swimming-a-guide-to-anaerobic-traini-a
  - system: glycolytic_tolerance
    name_zh: 糖酵解—乳酸耐受（lactate tolerance）
    protocol_zh: 🟠 距離 35–100m（50m 最常用最實用）、組間給足恢復以全程維持專項配速；強度高，完全恢復需 ≥48 小時，通常每週一組即可。目的是『在高乳酸下還能維持速度』。
    cert: 🟠
    source: British Swimming《A Guide to Anaerobic Training—Lactate Tolerance》(© British Swimming 2006, Revised 2020)
    source_ids:
    - src.british-swimming-a-guide-to-anaerobic-traini-b
  - system: glycolytic_measured
    name_zh: 糖酵解—實測血乳酸（佐證）
    protocol_zh: 🟢 衝刺間歇組 4×50 / 6×50 / 8×50m 自由式（不同恢復）可誘發血乳酸 12–18 mmol/L——印證這類組確實打在糖酵解系統。
    cert: 🟢
    source: PMC8607769（Sprint Interval Swim Training Set 與 100m 自由式關聯，血乳酸+運動學）；另見 PMC10747448（訓練組順序對乳酸反應）
    source_ids:
    - src.pmc8607769
  - system: oxidative
    name_zh: 有氧（交叉引用既有節點）
    protocol_zh: 🔵 有氧各區的量與配速不另立——直接用 liee_methods（主動恢復/LSD/節奏/有氧間歇）與 swim_maglischo（En1/En2/En3）。
    cert: 🔵
    source: 本檔 liee_methods（Bompa Ch11 Table 11.1）+ swim_maglischo（Maglischo 2012）
    source_ids:
    - src.liee-methods-bompa-ch11-table-11-1-swim-magl-2012
  protocol_caveat_zh: 🔴 等級限制：上述磷酸原與糖酵解協議多為**教練指南／共識層（🟠）**，非 RCT 驗證的最適處方——具體距離/休息/量是現場慣用值不是實驗最佳化結果。引用時講方向與量級即可，別當精確定論；RCT 級協議比較仍是研究空白。
  plain_zh: 身體有三套供能系統，差別在『撐多久、靠什麼、怎麼累』：① 磷酸原（ATP-PCr）——前 10 秒的爆發力來源，用肌肉裡現成的能量，不產乳酸，但很快用完，休 3–5 分鐘才回補；對應 25m 衝刺、出發轉身。② 糖酵解——10 秒到 2 分鐘的主力，燒肝糖但會堆乳酸讓你發酸撐不住；對應 100、200。③ 有氧——2 分鐘以上越來越主導，燒糖和脂肪、可持續，還負責你運動後的恢復；對應 400 以上。三套不是開關切換，而是隨時都在跑、只是誰當主角。怎麼練：磷酸原用超短衝刺＋長休，糖酵解用 30 秒–2 分鐘的硬組＋不完全休息，有氧用長慢游和節奏游。注意：連衝刺選手大部分訓練量也還是在有氧系統。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - periodization.zones.swim_energy_by_distance
    - periodization.zones.swim_maglischo
    - periodization.zones.swim_tid
    - periodization.zones.table_11_1
swim_energy_by_distance:
  id: periodization.zones.swim_energy_by_distance
  cert: 🟢
  source: Toussaint & Hollander 1994 (Sports Med 18:384–405); Rodríguez & Mader 2011
  source_ids:
  - src.toussaint
  events:
  - event: 50m
    aerobic_pct: ≈5–20%
    cert: 🟢
    note_zh: 有氧占比低，無氧（磷酸原+糖解）主導 ≈80–95%
  - event: 100m
    aerobic_pct: ≈40–50%
    cert: 🟢
    note_zh: 有氧無氧接近各半
  - event: 200m
    aerobic_pct: ≈60–65%
    cert: 🟡
    note_zh: 🟡 此區間文獻支持較弱，標舊文獻
  - event: 400m
    aerobic_pct: 40–84%
    cert: 🟢
    note_zh: 跨研究真實區間：Rodríguez & Mader ≈84% vs Maglischo 40–60%；不可合併成單值
  - event: 800m
    aerobic_pct: 有氧主導
    cert: 🟡
    note_zh: 質性有氧主導；精確 % 文獻分歧大，不填單值
  - event: 1500m
    aerobic_pct: 有氧主導
    cert: 🟡
    note_zh: 質性有氧主導；精確 % 文獻分歧大，不填單值
  caution_zh: 🔴 200m 與 800/1500m 的精確 % 為文獻弱項，故意不收單一數字；只標質性主導方向
  plain_zh: 不同距離靠的能量系統差很多：50m 幾乎全靠無氧（有氧只 5–20%），100m 有氧無氧大概各半，400m 以上開始有氧主導。注意 400m 的有氧占比在不同研究差很大（40% 到 84% 都有人測到），這不是我亂寫，是研究本身的真實分歧——所以保留區間不硬湊成一個數字。實務意義：練 50 自由式衝刺跟練 1500 完全是兩套系統，課表不能共用。
  links:
    development_stages:
    - t2c
    - t2w
swim_tid:
  id: periodization.zones.swim_tid
  cert: 🟢
  source: González-Ravé et al. 2021 (IJSPP 16(7):913–926, PMID 33952709, 系統回顧 9 篇入選/162 筆 TID); Papadimitriou et al. 2025 (Eur J Appl Physiol, DOI 10.1007/s00421-025-06064-x，全文); Barbosa et al. 2019（衝刺者）
  source_ids:
  - src.gonzalez-rave
  archetypes:
  - key: polarized
    name_zh: 極化型
    note_zh: 大量 Z1 + 少量 Z3、極少 Z2
  - key: pyramidal
    name_zh: 金字塔型
    note_zh: Z1 最多、Z2 次之、Z3 最少
  - key: threshold
    name_zh: 閾值型
    note_zh: Z2 比重相對偏高
  pyramidal_majority_zh: 🟢 González-Ravé 2021 系統回顧的 162 筆 TID 資料中：金字塔型 89 筆（多數）、極化型 65 筆、閾值型 8 筆——游泳實證裡金字塔型其實比極化型更常見，不該把『80/20 極化』當游泳鐵律。
  distance_split_zh: 🟢 TID 型態依主項距離分流（González-Ravé 2021 核心結論）：短距離（50–100m，sprint）偏『極化 + 閾值』；中距離（200–400m）偏『閾值 + 金字塔』；長距離（400m+，distance）偏『金字塔』。
  distance_split_caveat_zh: 🔵 證據等級限制：依距離分流為『觀察歸納』而非『實驗驗證』——SR 9 篇入選研究中僅 3 篇為 1b 介入研究、6 篇為 2b 觀察研究。型態描述可信（🟢），但『某距離就該用某型態』的處方性推論仍缺 RCT 支撐。
  sprinter_note_zh: 衝刺項目選手仍約 87–90% 訓練量落在 Z1（Barbosa et al. 2019）——即使是短距離，大部分量還是低強度有氧
  plain_zh: TID＝整個週期裡輕鬆/閾值/吃力三種強度各占多少。主要有三種分布：極化型（大量輕鬆＋少量超吃力、中間幾乎不練）、金字塔型（由下往上遞減）、閾值型（中間那塊偏多）。游泳實證裡『金字塔型』其實比『極化型』更常見（González-Ravé 2021 的 162 筆資料：金字塔 89、極化 65、閾值 8），而且型態會看主項距離變：短距離偏極化、中距離偏閾值/金字塔、長距離偏金字塔。但這是觀察歸納不是 RCT 驗證，別當成『某距離一定要某型態』的鐵律。一個反直覺的事實：連衝刺選手都有約 87–90% 的量是低強度有氧——不是整天衝。
  links:
    development_stages:
    - t2c
    - t2w
swim_application:
  id: periodization.zones.swim
  cert: 🔵
  source: Ch7 Table 7.1 + Ch11 Table 11.2 框架推導（游泳項目對映）
  source_ids:
  - src.ch7-table-7-1-ch11-table-11-2
  pace_mapping_zh: 🔵 游泳組課強度以『比賽配速百分比』表達，直接套 Table 7.1：賽配速=zone 2，高於賽配速（衝刺/乳酸耐受）=zone 1，閾值/節奏=zone 3，有氧基礎=zone 4，恢復游=zone 5
  event_metabolic_zh: 🔵 50–100m 偏無氧功率（zone 1–2）；200m 混合（Fig 5.11 bi-cycle 範例即 200m）；400–1500m 為肌耐力主導，需 specific endurance 階段大量 zone 3–4 鋪墊
  weekly_distribution_zh: 🔵 依 Bompa『每週 ≥50% 賽配速』原則，swim-coach 週課表應確保賽配速組（zone 2）占足比重，其餘以 zone 4 有氧基礎與 zone 5 恢復填充
  energy_system_zh: 🔵 swim-coach 生成單組課時，用 hr_vo2_ergogenesis 對照表標記該組主導能量系統，避免賽季階段與能量系統錯配（如競賽期仍堆 50% HR 主動恢復量）
  author_mapping_note_zh: 🔵 誠實標記：這整個節點是『把 Bompa 通用框架推導到游泳』的自製映射（cert 🔵），不是游泳實證——Bompa 的『最大表現百分比』本來不是為游泳設計的。游泳教練實際開課用的是別的語言：Maglischo 用血乳酸六分區（swim_maglischo）；Sweetenham 用 BBM（最大心率以下幾拍，個體化、只需心率不需採血）並主張反向週期化（速度先行當全季校準錨，而非賽季末才碰）；Olbrecht 用個體乳酸測試（olbrecht_model）。要更貼實務，優先用這些游泳專項語言，本節僅作 Bompa 框架的對接橋樑。
  plain_zh: 游泳怎麼套 Bompa 這套：組課強度用『比賽配速百分比』講——賽配速＝zone 2，比賽更快（衝刺/乳酸耐受）＝zone 1，閾值/節奏＝zone 3，有氧基礎＝zone 4，恢復游＝zone 5。但要老實說：這是把通用理論硬套到游泳的自製對照，不是游泳實證。游泳教練實際上更常用 Maglischo 的乳酸六分區、或 Sweetenham 的 BBM（最大心率以下幾拍）。要貼近現場，優先用那些游泳專用的語言。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - periodization.zones.olbrecht_model
    - periodization.zones.swim_maglischo
    - periodization.zones.table_11_2
school_polarized:
  id: periodization.zones.school_polarized
  cert: 🟢
  source: Seiler & Kjerland 2006 (PMID 16430681); Seiler 2010 (IJSPP 5(3):276–291); Stöggl & Sperlich 2014 (PMC3912323); González-Ravé et al. 2021 (PMID 33952709, IJSPP 16(7):913–926)
  source_ids:
  - src.seiler
  three_zone_basis_zh: 🟢 以通氣閾值 VT1/VT2 劃三區（對應 swim_three_zone 的乳酸三區，但邊界稍浮動不可當精確定論）：Z1 < VT1（≤~2 mmol，可全程對話）；Z2 VT1–VT2（~2–4 mmol，閾值附近）；Z3 > VT2（>4 mmol，間歇強度）。
  distribution:
  - key: polarized
    name_zh: 極化型
    z1: ~75–80%
    z2: ~5–10%
    z3: ~15–20%
    note_zh: 啞鈴型，Z2 被刻意壓低
  - key: pyramidal
    name_zh: 金字塔型
    z1: 最高
    z2: 中
    z3: 最低
    note_zh: 三區由低到高遞減
  - key: threshold
    name_zh: 閾值型
    z1: 中
    z2: 高
    z3: 低
    note_zh: Z2 為主力強度
  key_numbers_zh: 🟢 Seiler & Kjerland 2006（11 名菁英越野滑雪青少年、32 天）：Z1 75%／Z2 8%／Z3 17%（以 session 數計）。Seiler 2010 綜述：約 80% Z1＋20% Z3、Z2 近 0%。
  unit_caveat_zh: 🔵『80/20』的單位是 session 數（每週幾次低/高強度課），不是時間百分比；若改時間加權，因 Z1 每次更長，低強度比例會更高（可能 85–90%）。跨研究比較時這個差異很關鍵。
  avoid_middle_zh: 🔵 為何主張少練 Z2：(1) 應激-回報比差——夠高產生疲勞與乳酸，又不夠高激發 Z3 的強適應信號；(2) 慢性 Z2 疲勞壓縮練 Z3 的空間；(3) 閾值配速難精確維持、易漂進灰色地帶。注意：這是批評『以 Z2 為主力』的閾值模型，不否定 Z2 在特定場景（taper 前節奏、特定賽事）的角色。
  evidence_zh: 🟢 Stöggl & Sperlich 2014（唯一 RCT，48 名訓練有素者、9 週、四組）：POL 組 VO2peak +11.7%、力竭時間 +17.4%，皆優於高量低強度／閾值／HIIT 三組。限制：僅單一 RCT、9 週偏短、非頂級菁英。
  causation_caveat_zh: 🔵 歸因爭議：菁英自然趨向極化，可能是『能承受高量後才能這樣練』（果），而非『這樣練才成菁英』（因）——觀察研究無法定因果方向。
  swim_caveat_zh: 🟢 游泳實證挑戰極化教條：González-Ravé 2021（PMID 33952709，9 研究 162 筆 TID）中金字塔型 89 例（多數）、極化型 65 例、閾值型 8 例——游泳金字塔型其實比極化型更常見。即便衝刺選手（Barbosa 2019）仍約 87–90% 量在 Z1，但型態更接近極化（Z3 比例高、Z2 壓縮）。長距離（400m+）偏金字塔、短距離偏極化；目前無單一型態可宣稱『所有泳者最佳』。
  author_note_zh: 🔵 作者取用：值得吸收的是『大部分量該是輕鬆的、慎用中間閾值區』這個方向性原則（它也呼應 Hellard 2019 菁英游泳 86–90% 量在 ≤4mmol）；但別把『80/20 極化』當游泳鐵律——游泳金字塔型更常見，依距離與個體調整。
  plain_zh: 極化派（Seiler）問的不是『每區強度多少』而是『每區各占幾成』。他觀察菁英耐力選手，發現他們自然形成『大量輕鬆＋少量超吃力、中間幾乎不練』的分布——大約 80% 低強度、20% 高強度（這個 80/20 算的是課次，不是時間）。為什麼避開中間（閾值）區？因為那強度『高不成低不就』：累積疲勞不少，但刺激又不如真正的高強度。唯一的 RCT（Stöggl 2014）支持極化最有效。但游泳要特別注意：游泳實證裡其實『金字塔型』比『極化型』更常見（González-Ravé 2021），所以別把 80/20 當鐵律——長距離偏金字塔、短距離偏極化，看項目和個人調整。
  links:
    development_stages:
    - t2c
    - t2w
    related:
    - periodization.zones.swim_three_zone
olbrecht_model:
  id: periodization.zones.olbrecht_model
  cert: 🟡
  source: Olbrecht 2000《The Science of Winning》(書摘/訪談重建); Scientific Triathlon EP#198 訪談; TMR Coaching / lactate.com / INSCYD 二手摘要
  source_ids:
  - src.olbrecht-2000
  optimum_not_max_zh: 🟡 核心命題『最適而非最大』：有氧與無氧代謝都要發展到『最適』而非『最大』水準才有最佳成績。兩系統反向制衡——無氧能力（VLamax）過高會壓低乳酸閾值與脂肪燃燒、延長恢復；過度追求有氧最大化又壓制無氧速度儲備。目標不是把任一曲線推到極限，而是找各事件的最適組合點。
  threshold_critique_zh: 🟡『魔法子彈謬誤』：Olbrecht 指控『在最大乳酸穩態速度訓練就能最優提升耐力』是迷思——耐力成分複雜，單一強度無法覆蓋；他主張閾值訓練在有氧或無氧上都不比均衡計畫有優勢。現場矛盾佐證：有些選手閾值進步了成績卻沒進步，有些看似失去有氧耐力卻游出生涯最佳。
  capacity_power_zh: 🟢 四象限（理解全框架的前提）：有氧能力＝VO2max（引擎排氣量）；有氧功率＝比賽中能動用多少比例有氧能力，近似乳酸閾值（轉速使用率）；無氧能力＝VLamax 最大乳酸生成速率（渦輪峰值）；無氧功率＝維持近最大速度的持久度。關鍵限制：『能力與功率不能同時提升』（Olbrecht 訪談原話），每階段須有主攻方向、分期安排。
  individualization_zh: 🟡 捨棄通用閾值、改個體乳酸測試：因為『閾值不是獨立生理參數，而是有氧與無氧在次最大強度下的合力衍生物』——光看閾值看不到底層是有氧變好還是無氧降低。用兩泳次乳酸測試估個人曲線，每 5–6 週在小週期第一週（超補償高峰、疲勞最低）重測。恢復比例也個體化：新手 1:1、中級 2:1、菁英 3:2。
  periodization_order_zh: 🟡 順序按『能量系統優先』而非單一量/強度維度：前半賽季同步建構有氧能力＋無氧能力（引擎擴容：大量輕鬆量＋短超 VO2max 衝刺＋無氧能力訓練，刻意排除長間歇閾值）；後半賽季轉有氧功率＋無氧功率（使用效率優化，逼近賽配速、量降質升）。🔴 具體前後半週次比例書中原文不可及。
  swim_note_zh: 🟡 游泳特殊性：200m 以下占游泳競技 >80%，故游泳選手整體需較高 VLamax 儲備、比鐵人/馬拉松更偏無氧側。但短距離選手同樣需要有氧基礎以支撐高強度恢復效率，只是所需『量』可較低。
  caveat_zh: 🔴 原書《The Science of Winning》全文不可及，多數細節由書摘/訪談重建；具體游泳配速處方、原始乳酸測試完整協議、前後半週次比例皆不可追溯，標 🔴。⚠️ VLamax 是 Weber/INSCYD 術語，與 Olbrecht『無氧能力』對應但非完全等同，歸因須注意。
  author_note_zh: 🔵 作者取用：即使沒有實驗室乳酸測試，Olbrecht 最該吸收的是『診斷精神』——別套通用百分比分區，盡量個體化；以及『閾值不是萬靈丹、別在基礎期狂堆閾值』這個與極化派一致的方向。capacity/power 不能同時練的限制，也呼應板塊派『序列集中』。
  plain_zh: Olbrecht（游泳能量系統論）的核心是『最適，不是最大』：有氧和無氧都不是越大越好，要配到最適組合點——無氧太強會拖累有氧效率，有氧練過頭又壓掉速度。他最有名的是質疑閾值訓練是『魔法子彈謬誤』：以為在閾值速度狂練就能變強，其實不然（很多人閾值進步了成績沒動）。他改用個體乳酸測試（每 5–6 週重測），而不是套『最大心率 70%』這種通用百分比。順序上他主張前半季先把有氧無氧的『天花板』一起拉高（用輕鬆量＋短衝刺，不堆閾值），後半季再練『怎麼在比賽中高效用出來』。注意：原書拿不到，具體配速數字都是缺的（標 🔴）。
  links:
    development_stages:
    - t2c
    - t2w
