domain: breathing
sub: physiology
schema_version: 1
muscles:
  id: breathing.physiology.muscles
  cert: 🟡
  source: 胸廓與腹部貢獻比例：Sharp, J. T., Goldberg, N. B., Druz, W. S., & Danon, J. (1975). Relative contributions of rib cage and abdomen to breathing in normal subjects. Journal of Applied Physiology, 39(4), 608–618; 潮氣量與呼吸肌：StatPearls, Physiology, Tidal Volume (NCBI Bookshelf NBK482502)
  source_ids:
  - src.pmid-1194152
  - src.statpearls-tidal-volume
  mechanics_zh: 🟢 先分清主動與被動：**吸氣永遠是主動的**——靠肌肉收縮把胸腔撐大，產生負壓，空氣才被吸進來。**平靜狀態下的吐氣是被動的**——肌肉放鬆，靠肺與胸廓本身的彈性回縮把氣擠出去，不需要出力。只有**用力吐氣**才轉為主動，由腹肌群與內肋間肌收縮加壓排氣。這個不對稱是後面所有討論的起點：教『吸』和教『吐』在生理上根本不是同一件事。
  inspiratory_zh: 🟢 吸氣肌有三組。① **橫膈膜**——最主要的一組，收縮時往下沉，擴大胸腔的垂直徑。② **外肋間肌**——把肋骨向上向外拉，擴大前後徑與左右徑。③ **輔助吸氣肌**（斜角肌、胸鎖乳突肌、提肩胛肌）——平靜呼吸時幾乎不參與，只有在用力吸氣或呼吸困難時才啟動。第三組會不會出來工作，是判讀泳者狀態的關鍵訊號。
  expiratory_zh: 🟢 吐氣肌在用力吐氣時才登場：內肋間肌把肋骨向下向內拉；腹肌群（腹直肌、腹橫肌、腹內外斜肌）收縮，把橫膈往上推。游泳的水中吐氣多半屬於這一類——它不是放著讓氣自己出來，是要出力的。
  proportion_zh: 🟡 關於「橫膈膜佔平靜吸氣潮氣量多少」：**一般引用的數字是約 70–75%**。順帶澄清一個坊間常見的錯——「橫膈膜佔 80%」這個說法沒有可查的出處，不要引用。
  posture_caveat_zh: 🟡 但這個比例**強烈依姿勢變動**，這比數字本身更重要。Sharp 等人 1975 年以 Konno–Mead 量測法在 81 名健康受試者（32 名青壯年男性、29 名女性、20 名老年男性）身上做的量測顯示：平靜呼吸時，**多數人在直立姿勢下是胸廓主導，要到仰臥才換成腹部主導**；性別之間、青壯年與老年之間都沒有顯著差異，而快速的吸吐動作主要由胸廓完成——胸廓肌群的動作速度比橫膈與腹肌快。也就是說，同一個人換個姿勢，主導的呼吸機制就換一組——「腹式呼吸佔七八成」這句話沒有姿勢前提就不成立。（本庫原先在這裡列出「直立時胸廓貢獻可達 74%、個體範圍 47–91%」，2026-09 查證時在該文摘要與可取得的公開記錄中都找不到這組數字，已撤下；上面的方向性結論不受影響。）
  swimming_gap_zh: 🔴 素材缺口，這是本節對教練最要緊的一句：**泳者是俯臥水平姿勢**，既不是坐姿也不是仰臥，跟上面兩種量測情境都不同。把陸上「腹式呼吸佔七八成」的數字直接套到水中換氣，是**沒有根據的外推**——目前文獻未見俯臥水平姿勢下的對應量測。教練可以談腹式呼吸，但要意識到自己引用的是陸上數字、而且那個數字看姿勢；不要把它講成水中換氣的生理定律。
  coaching_signal_zh: 🟠 可觀察的教學訊號（依據是教練觀測，不是文獻）：**聳肩式呼吸代表泳者在依賴輔助吸氣肌**——那組肌肉本來只該在用力吸氣或呼吸困難時出來。效率較差，而且常伴隨肩頸緊繃。這是**岸上就能看見**的訊號，不需要任何儀器：讓學員站著或坐著呼吸，看肩膀有沒有跟著上下走。對成人初學與怕水的學員特別常見。
  observation_basis: 觀察者：Hangsau 教學實務；族群：成人初學、兒童初學為主，競技端亦見於高焦慮狀態；外推邊界：僅為岸上肉眼可辨的粗略訊號，不能替代肌電或肺功能量測，也不能單憑聳肩推斷水中換氣品質。
  plain_zh: 吸氣一定要出力（肌肉把胸腔撐開），平靜時的吐氣則是放鬆讓它自己回彈，只有用力吐才要出力。最主要的吸氣肌是橫膈膜，一般說它佔平靜吸氣的七成多——但這個比例會隨姿勢大幅改變：直立的時候多數人其實是胸廓在主導，躺著才換成肚子主導（這是 1975 年在 81 個健康人身上做的量測，男女與老少之間沒有差別）。而泳者是趴著水平的，這個姿勢目前沒有對應的量測資料，所以陸上那套「腹式呼吸佔八成」不能直接搬到水裡講。教練實務上最好用的一條是：呼吸時肩膀會聳起來，代表他在用『備用的』吸氣肌，通常效率差又緊繃——這件事在岸上看就看得出來。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
neural_control:
  id: breathing.physiology.neural_control
  cert: 🟢
  source: 腦橋呼吸控制機制與 pneumotaxic 框架的修正：Pontine Mechanisms of Respiratory Control (PMC4422496)
  source_ids:
  - src.pmc4422496
  premise_zh: 🟢 呼吸的特殊之處在於：它**不像心臟那樣完全自動**。它是**腦幹的節律產生器**加上**皮質的意識控制**兩層疊加而成的。這一條就是整章呼吸訓練得以成立的前提——如果呼吸跟心跳一樣完全不受意識管，那所有「呼吸法」都不會存在。
  brainstem_zh: 🟢 腦幹這一層的分工：**前包欽格複合體**（pre-Bötzinger complex）位於延腦，是吸氣節律的核心起搏點。**延腦背側呼吸群**（DRG）主要驅動吸氣。**延腦腹側呼吸群**（VRG）同時含吸氣與吐氣兩種神經元，在用力呼吸時負責啟動吐氣肌群——這對應上一節說的「用力吐氣才是主動的」。
  pontine_zh: 🟢 腦橋這一層要用現代說法：**pontine respiratory group（PRG，含 Kölliker-Fuse 核）**調節呼吸頻率，以及吸氣—吐氣之間的相位轉換。早期文獻把它稱為「pneumotaxic center（呼吸調節中樞）」，說它的功能是「限制吸氣時長」——**這個二分框架已被視為過度簡化**：在迷走神經完整的動物身上做慢性損傷，並不會產生 apneusis（吸氣痙攣），只造成吸氣時長小幅增加；經典說法高度依賴麻醉狀態下的實驗條件。因此本檔**不使用 pneumotaxic center 這個詞**作為機制解釋——如果你在別處讀到這個詞，知道它是過時的框架就好。
  cortical_override_zh: 🟢 最關鍵的一層：**皮質可以暫時覆寫腦幹節律**。你想憋就能憋、想放慢就能放慢。這是所有呼吸訓練的神經基礎——你是在用意識**暫時接管一個原本自動化的系統**。「暫時」與「接管」這兩個詞都要留意，下一段就是它的代價。
  swimming_meaning_zh: 🔵 游泳意義（這一節的重點）：上面那條「意識接管自動化系統」正好解釋了 Vortex 心理層已記錄的**呼吸節拍再投資**現象。陸上呼吸是腦幹自動化的，幾乎零注意力成本；但游泳換氣**必須與划臂週期精密對時**，本來就比陸上呼吸多一層要求。一旦這件事被意識接管——例如泳者緊張之後想「重新抓回節拍」——呼吸就從自動化落回工作記憶管控，開始佔用注意力資源。推論到教學現場：**「叫泳者調整呼吸節奏」這個指令本身，就是在要求他把一個自動化系統拉進意識層**。這不代表永遠不能下這個指令，而是下之前要知道你付出的是什麼代價、以及該在什麼時機下（詳見心理層的再投資條目）。
  plain_zh: 呼吸跟心跳不一樣：心跳你插不了手，呼吸你可以。腦幹裡有一組專門產生呼吸節律的神經（前包欽格複合體是核心起搏點），但大腦皮質可以隨時暫時接管它——這就是所有呼吸訓練成立的原因。代價是：接管過來就要花注意力。陸上呼吸完全自動、不用想；游泳換氣本來就要跟划手對時，一旦泳者緊張、開始「用想的」去抓節拍，呼吸就從自動變成手動，注意力被吃掉，動作跟著亂。所以教練喊「調整一下呼吸節奏」這句話本身，就是在把一個自動系統拉進意識——不是不能喊，是要知道你在做什麼。（順帶一提，舊教科書說的『呼吸調節中樞 pneumotaxic center』已經被認為講得太簡化了，本頁不用這個說法。）
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
chemoreceptors:
  id: breathing.physiology.chemoreceptors
  cert: 🟢
  source: 缺氧昏迷機轉與化學受器驅動：StatPearls (PMID 32119507)
  source_ids:
  - src.pmid-32119507
  premise_zh: 🟢 多數人以為呼吸的驅動力是「缺氧」——身體發現氧氣不夠了，所以叫你呼吸。**這是錯的**。正常情況下的主要驅動力是**血液中的二氧化碳濃度**。這個誤解不只是知識細節，它直接連著本章最嚴重的安全問題。
  central_zh: 🟢 **中樞化學受器**位於延腦腹側表面，直接感應腦脊髓液中的氫離子濃度（間接反映 CO2），是呼吸驅動力的**主要來源**。換句話說，那種「憋不住了、非吸一口不可」的窒息感，量的是二氧化碳，不是氧氣。
  peripheral_zh: 🟢 **周邊化學受器**（頸動脈體、主動脈體）主要感應血中的氧分壓與 pH，**只有在血氧明顯下降時才顯著介入**。也就是說，缺氧這條警報線存在，但它啟動得晚——晚到可能來不及。
  swimming_safety_zh: 🟢 游泳意義一（安全，本章最重要的一條因果）：這就是本章安全鐵則的機制根據。**入水前過度換氣會排掉大量 CO2**，把「想呼吸」的警報延後觸發；但**血氧照樣在下降**。結果是人可能**在毫無窒息感的情況下失去意識**——不是撐到極限才昏，是根本沒有感覺就昏。這條機制適用於所有族群，兒童與競技選手都不例外。完整的禁令、判例與教練處置詳見 safety.yaml。
  swimming_teaching_zh: 🔵 游泳意義二（教學）：同一條機制也解釋了 Vortex 心理層記錄的一個矛盾現象——**怕水的人典型是上胸淺快呼吸**，而這種呼吸會讓血中 CO2 偏低，於是「想呼吸」的慾望感**反而變弱**。表面上看起來是呼吸太多、換氣過度，實際上那是後面那場恐慌的引信：CO2 被壓低之後，身體的感覺回饋跟真實狀態脫節，一旦情境再加壓就會急轉直下。教練看到入水前淺快呼吸＋聳肩，處理的優先序應該在動作之前。
  co2_tolerance_direction_zh: 🔵 關於「提高 CO2 耐受」的訓練：布泰科式（Buteyko）練習的邏輯正是把上面這條反過來用——不是壓低 CO2，而是**提高身體對 CO2 累積的耐受閾值**。這裡只交代機制方向。它在**游泳表現上沒有實證**，效果、劑量與適用邊界一律以本章訓練法一節為準，不要從機制合理就推論效果成立。
  plain_zh: 你會想呼吸，主要不是因為缺氧，是因為二氧化碳累積——大腦裡的感應器量的是二氧化碳，缺氧那條警報線啟動得比較晚。這件事有兩個直接後果。第一是安全：下水前拼命深呼吸幾次，會把二氧化碳排掉、把「想呼吸」的警報延後，但血氧照樣在掉，於是人可能完全沒有窒息感就昏過去（詳見安全頁）。第二是教學：怕水的人往往上胸淺快呼吸，這也會壓低二氧化碳、讓想呼吸的感覺變弱——看起來像呼吸太多，其實是恐慌的引信。至於反過來練「耐受二氧化碳」的方法（例如布泰科），機制方向說得通，但對游泳表現沒有實證，看本章訓練法那節怎麼講。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
    related:
    - breathing.training.buteyko
    - breathing.training.co2_tolerance
autonomic_coupling:
  id: breathing.physiology.autonomic_coupling
  cert: 🟢
  mechanism_zh: 🟢 呼吸的兩個相位對自律神經的作用是相反的：**吸氣主要興奮交感神經**，心跳微幅加快；**吐氣主要興奮副交感神經**（迷走張力上升），心跳微幅減慢。這就是「拉長吐氣能鎮定」的生理路徑——不是心理暗示，是有機制的。也順帶說明了為什麼「深呼吸放輕鬆」這句話常常沒用：如果泳者把力氣放在用力吸氣，那反而是在踩交感那一邊。
  vagus_zh: 🟢 **迷走神經**（第十對腦神經）廣泛分布於心臟、肺部與橫膈膜周圍。深而慢的呼吸會**直接機械性刺激**迷走神經——橫膈的大幅移動本身就是刺激來源，這是「慢深呼吸」與「淺快呼吸」在效果上分岔的原因之一。
  rsa_zh: 🟢 **呼吸性竇性心律不整（RSA）**：心跳隨呼吸週期起伏的現象——吸氣時快一點、吐氣時慢一點。它的**振幅**是評估迷走神經功能與心率變異度（HRV）的重要指標。名字裡雖然有「心律不整」，但它是正常且健康的生理現象。
  swimming_meaning_zh: 🔵 游泳意義：Vortex 心理層已記錄**哺乳動物潛水反射**——面部入水時三叉神經受刺激，經迷走神經觸發心率下降與副交感激活。把它跟本節的 RSA 放在一起看，會得到一個對教學很有用的結論：**RSA 與潛水反射是兩條獨立、但方向相同的副交感路徑，而水中環境同時具備這兩條**。也就是說，**水裡其實有降恐慌的內建硬體**——臉入水這件事本身就在幫忙。問題在於，怕水的人往往用上胸淺快呼吸把 RSA 這條路徑關掉了（淺快呼吸的吐氣相既短又不完整，副交感那一邊幾乎沒被啟動）。所以對怕水學員的處置順序不是「先克服再入水」，而是先把吐氣拉長、讓兩條路徑都能運作。這對成人初學、兒童初學、以及開放水域起跑焦慮的鐵三選手同樣適用。
  plain_zh: 吸氣會讓心跳稍微變快（偏興奮那一邊），吐氣會讓心跳稍微變慢（偏放鬆那一邊）——所以「把吐氣拉長」真的會鎮定，這不是心理作用。迷走神經正好經過心臟、肺和橫膈膜附近，深而慢的呼吸等於直接刺激它。心跳隨呼吸起伏的現象叫 RSA，起伏越明顯代表迷走神經功能越好。放到游泳上很有意思：臉入水本身會觸發潛水反射，那是另一條讓人平靜下來的路徑——所以水裡本來就有兩套「內建的鎮定裝置」同時在場。麻煩的是怕水的人習慣淺快呼吸，等於自己把其中一套關掉了。要幫他，先從把吐氣拉長開始，別急著談動作。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
baroreflex_resonance:
  id: breathing.physiology.baroreflex_resonance
  cert: 🟢
  source: 壓力反射共振頻率實測：Vaschillo et al. 2002 (DOI 10.1023/A:1014587304314)
  source_ids:
  - src.vaschillo-2002-baroreflex
  premise_zh: 🟢 血壓調節系統中的**壓力反射迴路**本身存在一個自然振盪頻率，族群平均約 **0.1 赫茲**——換算成呼吸就是每個週期約 10 秒、每分鐘 6 次。這個數字在坊間流傳得很廣，但幾乎都漏掉了下一段的限定。
  individual_variation_zh: 🟢 **重要限定**：Vaschillo 等人的實測顯示，心率振幅最大的頻率落在 **0.055–0.11 Hz**（約每分鐘 3.3–6.6 次），**因人而異**。也就是說 **0.1 Hz 是族群平均，不是任何個人的最適值**。把「每分鐘 6 次」當成放諸四海的處方，是把一個平均值誤當成常數。
  resonance_zh: 🟢 為什麼叫「共振」：當呼吸頻率與這個生理振盪頻率吻合時，RSA 與壓力反射引發的血壓波動會**同相位疊加、互相放大**，產生遠大於平常的 HRV 振幅。這才是共振的真正含義——它是兩個既有振盪對上相位的結果，**不是隨意選定的一個好聽數字**。此機制也被認為能鍛鍊壓力反射本身的敏感度。
  swimming_boundary_zh: 🔵 游泳意義與邊界（這段一定要讀完）：以上是本章**喚醒調節**一節裡「共振呼吸」協議的機制根據。但邊界必須講清楚——**游泳時的換氣頻率是由划臂節奏決定的**，泳者不可能也不應該在水裡追求每分鐘 6 次的呼吸。**共振呼吸是陸上練習，不是水中換氣節律的處方**。請不要有人讀完這一節，就去要求泳者在水裡每分鐘呼吸 6 次——那既做不到，也會直接破壞划臂與換氣的對時（見 neural_control 一節的再投資代價）。它的正確用法是賽前、課前或課後的陸上喚醒調節，跟水中技術是分開的兩件事。
  plain_zh: 人體調節血壓的迴路本身會以固定節奏來回擺盪，平均大約每 10 秒一次（0.1 赫茲，等於每分鐘 6 次）。當你的呼吸頻率剛好對上這個節奏，兩個波會疊在一起互相放大，心率變異度就衝到平常做不到的幅度——這就是「共振呼吸」名稱的由來，不是隨便挑的數字。但有兩件事一定要記得：第一，每分鐘 6 次只是族群平均，實測個人的最佳點落在每分鐘 3.3 到 6.6 次之間，因人而異，別當成標準答案。第二，也是更重要的——**這是陸上練習**。游泳時呼吸頻率是划手節奏決定的，不要有人看完就叫泳者在水裡一分鐘只呼吸 6 次。要用就在岸上用，賽前課前調狀態，跟水裡的換氣是兩回事。
