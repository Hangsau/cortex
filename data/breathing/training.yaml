domain: breathing
sub: training
schema_version: 1
imt:
  id: breathing.training.imt
  cert: 🟡
  source: 游泳 IMT 統合分析：Carvajal-Tello, N., et al. (2024). Effects of inspiratory muscle training on lung function parameter in swimmers. Frontiers in Sports and Active Living, 6, 1429902（13 研究, n=277）; 游泳 RMT 統合分析：Liu, S., Gou, P., & Lin, M. (2025). The effect of respiratory muscle training on swimming performance. Frontiers in Physiology, 16, 1638739（10 研究, n=230）; 分距離 RMT 統合分析：Chen, Y., et al. (2026). Effects of respiratory muscle training on swimming performance, respiratory muscle function, and pulmonary function of competitive swimmers. Frontiers in Physiology, 17, 1770925（14 研究, n=375）; 菁英泳者反例 RCT：Cunha, M., et al. (2019). Porto Biomedical Journal, 4(6), e49
  source_ids:
  - src.pmid-39351143
  - src.liu-2025-rmt-swimming-meta
  - src.chen-2026-rmt-swimmers-meta
  - src.cunha-2019-imt-elite-swimmers-rct
  what_zh: 🟢 是什麼：吸氣肌訓練（IMT）用一個有阻力的呼吸器，讓你**用力吸氣去對抗阻力**，把橫膈與肋間肌當成骨骼肌來練。研究裡的主流器材是 POWERbreathe，Threshold IMT 是較便宜的替代品。RMT（呼吸肌訓練）是把吸氣與吐氣都納入的廣義版本。要注意這一整套的前提：呼吸肌之所以練得動，是因為它本來就是骨骼肌（見 breathing.physiology.muscles）——這跟「練肺活量」是兩回事，肺不是肌肉。
  evidence_zh: 🟡 證據（游泳專項統合分析，本節最該記住的一段）：13 篇研究、277 人的統合分析結果是——**只有最大吸氣壓（MIP）顯著提升，幅度 +29.35 cmH2O**；最大吐氣壓（MEP）**沒有變化**；FEV1（p=0.06）與 FVC（p=0.07）**都未達顯著**。更關鍵的一個數字：**13 篇裡只有 3 篇看到游泳成績進步**。也就是說，「吸氣肌會變強」這件事證據相當一致，「所以游更快」則遠遠沒有。這兩句話中間那道落差，就是本節存在的理由。
  conflict_zh: 🟡 證據（三份統合分析，結論不一致，這件事本身要講）：除了上面那份純 IMT 的分析之外，另有兩份把吸氣與吐氣都納入的 RMT 統合分析。① Liu 等人 2025（10 篇研究、230 人）合併後**確實看到游泳表現顯著改善，SMD −0.49（95% CI −0.70 至 −0.28，p<0.00001）**，屬小到中等效果。② Chen 等人 2026（14 篇研究、375 名競技泳者）**分距離彙整後，50m、100m、200m 自由式成績全部無顯著差異**（SMD 依序 −0.38、−0.17、−0.07，p 值 0.20／0.36／0.80）；但同一份分析裡呼吸肌力與動態肺功能都顯著提升（MIP SMD 0.65、FEV1 0.45、FIV1 0.41）。所以現況是**三份分析裡兩份看不到成績效益、一份看得到**——納入的研究、終點指標與納入標準都不同。教練該記住的是這個不確定狀態本身，而不是挑一份自己喜歡的來引用。
  reconciliation_zh: 🟡 一個看似矛盾、實際對得上的地方（這段值得慢慢看）：本節開頭那份 2024 年分析的 FEV1 未達顯著（p=0.06），Chen 2026 的 FEV1 卻顯著（SMD 0.45）。差別在**介入型態**。Chen 2026 的次群組分析顯示，FEV1 的改善**只出現在合併式 RMT（吸氣＋吐氣一起練，SMD 0.78，95% CI 0.38–1.17），單純 IMT 並不顯著（0.19，95% CI −0.17–0.55），組間差異 P=0.03**。而 2024 那份收的正是純 IMT 研究。所以兩份不是互相打架，是各自量到同一條規律的兩端——**只練吸氣那一側，肺功能指標動不了；把吐氣一起練進去才動得了**。這也回頭修正了本節的器材建議：只用 POWERbreathe 這類純吸氣阻力器，能期待的是 MIP 上升，不該期待 FEV1／FVC 改善。次群組分析同時顯示，競技水準、訓練期長度、每週次數這三項**都沒有調節作用**——所以「菁英要練久一點」「一週要幾次才夠」目前沒有分層證據支撐。
  distance_zh: 🟡 依距離分層的證據現在存在了（本庫先前的說法已過期，這裡明講）：本節原本寫「統合分析層級做不出距離分層」，那句話的依據是 Liu 2025 的自述限制——原始研究報告不一致且數量不足，做不出性別、泳式或競技水準的次群組分析（其中 7 篇是 50–200m 自由式、3 篇未指明泳式）。Chen 2026 已經做出來了，結果是**50m、100m、200m 三個距離都沒有效益**。結論方向沒變——「短距離沒用、長距離才有效」這個說法仍然沒有支撐——但**理由換了**：從「沒有人分析過」變成「分析過了，三段都沒有」。這兩件事的證據強度差很多，不該混為一談。要留意的邊界是：Chen 2026 只彙整到 200m，**400m 以上的距離仍然沒有分層證據**，而那正好是最多人直覺認為 IMT 該有用的區間。
  protocol_zh: 🟢 證據導向的劑量：統合分析歸納出的協議區間是 **50–80% MIP、持續 6–8 週、每週 3–14 次**。實務上的常見寫法是：負荷從 **50% MIP** 起、適應後漸進到 **80% MIP**，每次 **30 次呼吸**、每天 **1–2 組**。若一天做兩組，兩組之間留數小時讓呼吸肌恢復——呼吸肌跟其他骨骼肌一樣需要恢復時間，這一點常被忽略。要注意每週次數的區間非常寬（3 到 14 次），代表**劑量與效果的關係目前並未確立**，別把任何一個具體數字當成最佳解。
  correction_zh: 🟡 一個必須更正的常見錯誤：坊間（含部分器材說明與網路教學）常說「**15–80% MIP 都有統合分析支持**」——**這是錯的**。在多數 IMT 試驗裡，**15% MIP 是安慰劑組／假訓練（sham）的劑量**，它被設計成「有在做動作但不構成有效刺激」的對照條件，不是有效訓練強度。把對照組的劑量講成訓練區間下限，等於叫人整個療程都在做安慰劑。正確的訓練區間是 **50–80% MIP**。
  null_zh: 🟡 誠實反例（這一段不能省）：一份 12 週菁英泳者 RCT（Cunha 2019, PMID 33501396；50% MIP、30 次 ×2/日 ×5 日/週）發現，相較 15% 假訓練組，**游泳成績、吸氣肌力、肺活量、主觀喘感全都沒有顯著差異**。作者推測，菁英泳者的呼吸肌可能早已因長年訓練而適應，邊際空間小。這份研究的價值不在於推翻 IMT，而在於界定它的適用邊界：**訓練史越長的人，可期待的邊際效益越小**。
  mechanism_hypothesis_zh: 🔴 機制假說（標成假說，不要當定論）：有一種流傳很廣的解釋叫「呼吸代謝反射」——說法是呼吸肌疲勞會觸發交感神經反射，把血流從運動肌肉重新分配給呼吸肌，而 IMT 能延緩這個反射被觸發、讓更多血流留在四肢。**本章目前沒有可反查的來源支持這條完整的機制鏈**，因此標 🔴 待查。它讀起來很順，但「機制講得通」不等於「機制成立」，更不等於「效果成立」——請不要拿它去補上 evidence_zh 那道落差。
  coach_use_zh: 🔵 教練意義（本節的落點）：IMT 是**輔助軸，不是捷徑**。判斷要不要用它，只問一個問題——**這個泳者是技術沒問題、但長距離後段明顯喘到掉速嗎？** 是，才有討論空間；如果他的問題其實是緊張、或換氣感知根本還沒建立，IMT 完全幫不上忙，那是另外兩條線的事（見 breathing.framework.overview 三條線）。這也是教練最常犯的錯：拿硬體側的工具去修一個感知側或喚醒側的問題，錢花了、時間花了、問題原封不動。另外記得那條有證據支撐的邊界——訓練史越長的人邊際效益越小（Cunha 那份菁英 RCT），所以對菁英選手的期望值應該壓最低。至於「哪種距離比較適合」，Chen 2026 已經分距離彙整過，50m 到 200m 三段都沒有效益；400m 以上還沒人分層分析，所以那一段仍然只能靠個案觀察，不要當成有證據的建議去講。還有一條器材層的落點：如果真的要用，**選能同時練吐氣的合併式器材**——純吸氣阻力器在統合分析裡只動得了 MIP，動不了肺功能指標。
  plain_zh: 用有阻力的呼吸器練「吸氣的那組肌肉」，肌肉確實會變強——統合分析看到最大吸氣壓平均進步 29.35 cmH2O，這點很一致。但變強會不會讓你游更快？同一份分析裡 13 篇研究只有 3 篇看到成績進步，吐氣肌力和肺功能指標則完全沒動。不過另一份 2025 年的統合分析（10 篇、230 人）合併後倒是看到成績有小幅但顯著的改善；再一份 2026 年的（14 篇、375 人）則是把 50、100、200 公尺分開算，三段全都沒有差別——所以誠實的說法是：**三份分析裡兩份看不到成績效益，這件事目前沒有定論**。順帶戳破一個常聽到的說法：「短距離沒用、長距離才有效」沒有證據，2026 那份已經分距離算過，50 到 200 公尺三段都沒效益（400 公尺以上還沒人分析過）。另外有個很實用的發現：肺功能指標（像 FEV1）只有在**吸氣和吐氣一起練**的時候才會進步，只練吸氣那一側不會——所以要買器材的話，選能同時練吐氣的。做的話劑量大致是：從自己最大吸氣壓的 50% 起，一次 30 下，一天 1 到 2 組（兩組之間隔幾小時），持續 6 到 8 週，習慣了再往 80% 加；每週次數研究之間從 3 次到 14 次都有，代表「做多少才最好」其實還沒答案。要更正一個很常見的說法：網路上講「15% 到 80% 都有效」是錯的——15% 在研究裡是拿來當安慰劑的假訓練劑量，照著做等於白做。還有個誠實的反例：一份 12 週菁英泳者研究做完，成績、吸氣肌力、肺活量、喘的感覺全部都沒差，可能是他們早就練到極限了。所以這東西是錦上添花，不是脫胎換骨。教練該問的只有一句：這個學生是技術好好的但長距離後段喘到掉速嗎？如果他其實只是緊張或還不會換氣，這個練了也沒用。
  links:
    development_stages:
    - t2c
    - t2w
    related:
    - breathing.framework.overview
    - breathing.physiology.muscles
co2_tolerance:
  id: breathing.training.co2_tolerance
  cert: 🔴
  source: 閉氣訓練統合分析：de Asís-Fernández, F., Sereno, D., Turner, A. P., González-Mohíno, F., & González-Ravé, J. M. (2022). Effects of apnoea training on aerobic and anaerobic performance. Frontiers in Physiology, 13, 964144（7 RCT, n=126）; 減少呼吸頻率訓練 RCT：Kapus, J., Ušaj, A., & Lomax, M. (2013). Adaptation of endurance training with a reduced breathing frequency. Journal of Sports Science & Medicine, 12(4), 744–752
  source_ids:
  - src.de-asis-fernandez-2022-apnoea-meta
  - src.pmid-24421735
  what_zh: 🟠 是什麼：自由潛水社群長期使用「CO2 表」與「O2 表」——結構化的靜態閉氣課表，逐步縮短組間休息，用來提高身體對二氧化碳堆積的耐受度。這套做法經常被搬進游泳圈，宣稱能讓人「更耐喘、游更快」。教練會遇到的實際情境通常是：有玩自由潛水的學生或朋友推薦了這套表，來問要不要加進課表。
  observation_basis: 觀察者：自由潛水教學社群的通行做法（非本專案的教練觀測，亦非文獻）；族群：自由潛水練習者；外推邊界：僅描述該社群的既有實務，**不含任何游泳競技脈絡**，不得據此推論對游泳的效果。
  evidence_zh: 🔴 對游泳表現的證據：**沒有任何同行審查 RCT 或系統回顧直接測試過 CO2 表協議能不能提升競技游泳成績**。在游泳脈絡下，這是一個沒有實證的說法，不是「證據還不夠強」而是「根本沒有那份研究」。最接近的兩份旁證都不能替它背書：① 一份閉氣（apnoea）訓練統合分析（7 篇研究）發現 **VO2max 無顯著提升**（MD 0.89 ml/kg/min，p=0.41），但**峰值血乳酸顯著上升**（MD 1.89 mmol/L，p<0.0001）——暗示它引發的是無氧而非有氧方向的適應。② 一份減少呼吸頻率訓練研究確實讓 **對 CO2 的通氣反應下降 45%**（−45±27%，p=0.03；也就是 CO2 耐受真的會升），但要看清楚它的條件：受試者是 **12 名男性、做的是自行車測功計、六週、每分鐘 10 次呼吸**，**完全沒有測游泳表現**。而且那 12 人是**分成實驗組與對照組兩組**的，也就是產生那個 −45% 的實驗組**只有大約六個人**——這個規模不足以支撐任何一般化的建議。更關鍵的是作者自己在論文的 Key Points 裡寫下的限制：**這種呼吸型態無法在較高強度下執行，因此不預期有氧耐力（峰值攝氧量）會改善**。連原作者都沒有宣稱它能提升耐力表現。從騎車推到游泳，中間隔了姿勢、水中阻力與換氣限制三層差異，不能直接搬。
  mechanism_direction_zh: 🔵 機制方向：這類訓練想動的是「想呼吸」那個訊號的觸發閾值，而不是氧氣本身——因為驅動呼吸的主要訊號是二氧化碳不是缺氧。機制細節見 breathing.physiology.chemoreceptors，本節不重複。這裡只提醒同一件事的反面：機制方向說得通，不代表效果成立，上一段的證據狀態才是結論。
  safety_zh: 🟢 安全面：CO2 耐受練習若**完全在陸上、不入水**進行，沒有缺氧溺水的風險。但仍有少見的迷走性昏厥（突然暈過去）可能，因此**即使在陸上也不要獨自做**。而一旦把閉氣搬進水裡，就立刻回到 breathing.safety.hypoxic_blackout 那條致命風險——**絕對禁止**，沒有例外、沒有「只做短的」這種折衷。
  verdict_zh: 🔵 結論：把 CO2 表搬到游泳上主張「提升表現」，目前是**沒有實證的外推**。自由潛水是另一個脈絡——那邊的訓練目標、姿勢、強度區間都跟競速游泳不同，那邊的結論不能直接套過來（反過來也一樣）。未來章節擴充自由潛水內容時，兩邊的結論要各自標明適用脈絡，不共用。
  coach_use_zh: 🔵 教練意義：學生拿這套表來問時，該給的答案有三層——① 對游泳表現**沒有研究支持**，別當成變快的方法；② 真要練，只在陸上、要有人陪，不獨自做；③ **絕對不要帶進水裡**，水下版本是會死人的（見安全節）。另外要辨識一件事：會來問這個的學生，有相當一部分其實是在找「憋氣憋久一點」的方法來解決換氣的不安——那是感知線或喚醒調節線的問題，用閉氣訓練去處理不但無效，還把他推向最危險的那個方向。
  plain_zh: 自由潛水圈那套「CO2 表」（一組一組閉氣、休息越來越短）在游泳圈也很流行，但沒有任何像樣的研究測過它能不能讓你游更快——這是從別的運動硬搬過來的說法。最接近的研究兩份：一份看閉氣訓練（7 篇彙整），發現最大攝氧量沒進步，只有乳酸峰值上升（比較像無氧那邊的適應）；另一份確實讓身體對二氧化碳的耐受提高了 45%，但那是 12 個男生騎腳踏車做六週的研究，而且 12 個人還分成兩組、真正練的那組只有六個左右，根本沒測游泳成績——連原作者都在論文裡寫明「這種呼吸方式沒辦法在高強度下做，所以不要期待耐力會變好」。從騎車推到游泳中間差了姿勢、水的阻力、還有換氣被限制這幾件事，不能直接搬。真要練，只在陸上、找人陪，別自己一個人做（有極少數會暈倒的可能）。最重要的是：永遠不要把閉氣帶進水裡，那是會出人命的。還有一件教練要留意的事——會來問這個的學生，很多其實是換氣讓他不安，才想靠「憋久一點」來壯膽。那是完全不同的問題，用閉氣去解不但沒用，還剛好把他推去最危險的地方。
  links:
    development_stages:
    - t2c
    - t2w
    related:
    - breathing.physiology.chemoreceptors
    - breathing.safety.hypoxic_blackout
buteyko:
  id: breathing.training.buteyko
  cert: 🟡
  source: 澳洲政府委託證據評估：Natural Therapies Review 2024 – Buteyko evidence evaluation; 氣喘統合分析：Wu S, Zhang X, Huang W. (2026). Explore (NY), 22(4), 103414
  source_ids:
  - src.au-natural-therapies-buteyko-2024
  - src.wu-2026-buteyko-meta
  what_zh: 🟢 是什麼：布泰科呼吸法（Buteyko）刻意練習「輕、少、慢」的呼吸量，並搭配「控制停頓」——吐氣之後閉氣到出現輕微缺氧感為止——反覆訓練。它宣稱的機制方向是提高身體對二氧化碳的耐受、減少慢性過度換氣；機制本身見 breathing.physiology.chemoreceptors，本節不重複，只處理「證據到哪裡」。
  evidence_review_zh: 🟡 證據一（政府委託的評估）：澳洲政府委託、由 Cochrane Australia 執行的證據評估（Natural Therapies Review 2024）納入 **11 篇氣喘 RCT**，樣本多屬 28–100 人的小型試驗。因為研究設計有嚴重侷限、加上未發表試驗的疑慮，審查者對**多數關鍵結果評為 very uncertain（極低確定性）**。請特別注意這份文件的性質——**它不是支持性證據**，它是一份說「我們對這些結果沒有把握」的評估。
  evidence_meta_zh: 🟡 證據二（統合分析）：一份納入 7 篇 RCT 的統合分析看到氣喘控制的 SMD 為 **−0.33（95% CI −0.54 至 −0.13）**，但**整體生活品質沒有顯著差異（SMD 0.13, p=0.47）**。作者自己的結論明寫「**證據仍有限**」。
  correction_zh: 🟡 必須明說的更正：坊間（含推廣教材與二手報導）把這套說成「**有中等確定性的改善效果**」是**誤讀**。實際的證據等級是**低／有限確定性、效果量小**，而且效果只出現在氣喘控制這個特定終點上，生活品質那個終點是沒有差異的。把「極低確定性」講成「中等確定性」，是把一份保留態度的評估翻譯成推薦——這中間的落差不是措辭問題。
  swimming_meaning_zh: 🔵 游泳意義（誠實版）：以上所有證據都在**氣喘的臨床脈絡**裡——對象是病人，終點是氣喘控制與生活品質。**沒有任何一篇測的是游泳表現。** 所以本章不把布泰科列為游泳訓練法，它出現在這裡的唯一理由是：教練真的會被問到。
  coach_use_zh: 🔵 教練意義（本節的落點）：教練會遇到的實際情境非常具體——**有氣喘的學生、或學生的家長，拿布泰科來問「這個是不是能改善他游泳時喘不過氣」**。這時該說的是三句話：① 這是氣喘的輔助療法討論，證據有限、而且屬於**臨床範疇**，要跟醫療團隊談，不是教練該下判斷的事；② 它跟「你游得快不快」是兩件事，目前沒有研究把這兩者連起來；③ 不要讓它取代既有的氣喘用藥或醫囑。這一節的價值不在於教練要不要教這套，而在於教練被問到時**不要含糊點頭**——含糊點頭會被理解成背書。
  plain_zh: 布泰科呼吸法練的是「呼吸得輕一點、少一點、慢一點」，加上吐完氣後停一下的「控制停頓」，說法是讓身體更耐受二氧化碳。它的證據狀況要講清楚：澳洲政府委託 Cochrane Australia 做的評估收了 11 篇氣喘研究（多是 28 到 100 人的小型試驗），結論是對多數重要結果「極低確定性」——那不是支持，那是「我們沒把握」。另一份收了 7 篇的統合分析，氣喘控制有小幅改善（SMD −0.33），但整體生活品質沒有差別，作者自己也寫「證據仍有限」。所以坊間說它「有中等確定性的效果」是誤讀，實際上是低確定性、效果小。最關鍵的一點：這些研究**全部**在氣喘病人身上做，終點是氣喘控制，**沒有一篇測游泳成績**。教練實務上會碰到的是有氣喘的學生或家長拿這個來問——該回答的是「這是氣喘輔助療法的討論，證據有限，而且是醫療範疇，要跟醫生談；它跟你游得快不快是兩回事」，不要含糊點頭，也不要讓它取代醫囑。
  links:
    development_stages:
    - t2t
    - t2c
    related:
    - breathing.physiology.chemoreceptors
bolt_test:
  id: breathing.training.bolt_test
  cert: 🟢
  source: BOLT 與運動表現無關聯：Kowalski T, et al. (2024). Front Physiol (PMCID PMC11406178; n=49 菁英競速滑冰選手)
  source_ids:
  - src.kowalski-2024-bolt
  what_zh: 🟢 是什麼：BOLT（Body Oxygen Level Test，身體氧氣濃度測試）是一個自我測量的閉氣秒數，被推廣為「呼吸功能」或「CO2 耐受度」的簡易指標。它在網路與商業呼吸教材裡流傳極廣，教練幾乎一定會被學生拿著一個數字來問。
  procedure_zh: 🟢 測法（要照著做，做錯就不是同一件事）：① 靜坐休息**至少 10 分鐘**，測前避免任何體力消耗。② 用鼻子做一次**平常的**吸氣與吐氣——**不是深呼吸**，這一步最常被做錯。③ 吐氣結束後捏住鼻子閉氣，開始計時。④ 計時到「**第一次出現明顯想吸氣的衝動**」為止——**不是硬撐到極限**，這一步是第二常被做錯的。⑤ 這段秒數就是 BOLT 分數。
  norms_truth_zh: 🟢 參考值的真相（本節的重點）：坊間流傳的「健康成人理想值約 **40 秒**、多數人落在 **15–25 秒**」——**沒有同儕審查的常模研究支持**。追溯下去是這樣：40 秒這個數字出自一般運動生理教科書關於「正常吐氣後閉氣約 40 秒才會出現強烈呼吸驅動」的敘述，後來被 Patrick McKeown / Oxygen Advantage 的商業教材挪用成「理想 BOLT 值」；而「多數人 15–25 秒」則**查不到任何同儕審查來源**。所以當學生說「我只有 18 秒，是不是很糟」，正確的回答是：**那條標準本身沒有常模可以對照**。
  performance_zh: 🟢 與運動表現的關係：一份 2024 年的研究測了 **49 位菁英競速滑冰選手**（Wingate 無氧測試 + 心肺運動測試），發現 **BOLT 分數與表現指標之間沒有顯著相關**（r(47) = −0.172 至 0.013，p = 0.248 至 0.984）。該研究原文並明述 BOLT「**尚未經科學驗證**」。也就是說，這不是「相關性偏低」，是在一群菁英運動員身上完全看不到關聯。
  coach_use_zh: 🔵 教練意義（分清楚可以與不可以）：**可以**——把 BOLT 當成「觀察自己呼吸習慣趨勢」的簡易參考，同一個人在不同時期比自己，看方向。**不可以**——① 不可當表現預測指標（上一段的研究直接反對）；② **絕對不可**拿來當泳者的分級依據或選材依據，那會把一個沒有效度的數字變成影響學生機會的門檻。學生拿 BOLT 分數來問「我是不是呼吸不好」時，教練該回答的是**這個數字沒有經過驗證的常模**，而不是幫他對照一份不存在的標準表。
  plain_zh: BOLT 是一個自己就能測的閉氣秒數。測法：先安靜坐著休息至少 10 分鐘，用鼻子做一次「平常的」吸氣跟吐氣（不是深呼吸），吐完捏住鼻子開始計時，計到「第一次明顯想吸氣」為止就停——不是硬撐到極限。這兩個細節做錯，測出來就不是同一回事。重點來了：網路上流傳的「理想 40 秒、多數人 15 到 25 秒」**沒有任何正式的常模研究支持**。40 秒是從運動生理教科書裡「吐氣後大約 40 秒才會很想吸氣」那句話被商業教材挪用過去的；「多數人 15 到 25 秒」則根本查不到來源。而且 2024 年一份研究測了 49 位菁英競速滑冰選手，BOLT 分數跟他們的運動表現完全沒有相關，論文自己也寫這個測試「尚未經科學驗證」。所以：拿它看自己這幾個月的呼吸習慣有沒有變化，可以；拿它預測誰游得快、拿它幫學生分級或挑選手，不行。學生拿分數來問「我是不是呼吸不好」，該告訴他的是——這個數字沒有可以對照的標準。
  links:
    development_stages:
    - t2t
    - t2c
self_tracking:
  id: breathing.training.self_tracking
  cert: 🔵
  why_zh: 🔵 為什麼要追蹤：呼吸訓練的效果**慢而且不明顯**——不像重量訓練那樣「這週多舉了 5 公斤」一目瞭然。在沒有任何記錄的情況下憑感覺判斷「到底有沒有效」，幾乎一定會被單日狀態誤導：睡得好的那天覺得有效，宿醉的那天覺得白練。追蹤的用途不是把訓練變得科學，而是**把判斷的時間單位從一天拉長到數週**。
  metrics_zh:
  - 🔵 **晨起靜息心率**（每天）：起床後、還沒活動前測，是最容易取得也最穩定的一項。
  - 🔵 **HRV**（RMSSD 或裝置提供的分數，每天）：同樣在**晨起靜息**狀態測最穩定；換測量姿勢或時段會讓數字整個平移，比對就失去意義。
  - 🔵 **BOLT 分數**（每週 1 次即可）：測法見本檔 breathing.training.bolt_test 節，並注意該節對參考值的更正——這裡用它只看自己的趨勢，不對照任何外部標準。
  - 🔵 **主觀壓力與睡眠品質自評**（1–10 分，每天）：最便宜的一項，卻常是解釋其他數字為什麼跳動的關鍵。
  interpretation_zh: 🔵 判讀原則（這一節最重要的一條）：**不要只看單日數字，要看 2–4 週的趨勢線方向。** 單日的高低受睡眠、咖啡因、飲酒、生病影響非常大，一天的難看數字**不代表訓練沒效**，一天的漂亮數字也不代表有效。判讀時問的問題是「這條線這幾週往哪個方向走」，不是「今天幾分」。
  coach_use_zh: 🔵 教練意義（這一節存在的理由）：它防的是兩種很具體的錯誤——① **學生量到一次差數字就放棄**（「我 HRV 掉了，這個沒用」）；② **教練拿單次數字當訓練有效的證據**（「你看你今天心率降了，有效吧」）。兩種都是把單點當趨勢，方向相反但錯誤結構相同。還有一條邊界要講明：這些是**趨勢工具，不是診斷工具**——不可以拿它們去判斷泳者的水感、也不可以拿來分級。水感的判準在 Technica 層，不在這一節，兩者不能互相代用。
  plain_zh: 呼吸訓練的效果慢又不明顯，光憑感覺判斷「有沒有效」很容易被當天狀態騙。可以記的幾項很簡單：每天早上起床測靜息心率、HRV（RMSSD 或手錶給的分數，一樣早上起床測最準）、每天用 1 到 10 分自評壓力跟睡眠，再加上每週測一次 BOLT（測法看本頁 BOLT 那節，記得那節說過參考值沒有常模，這裡只跟自己比）。最重要的原則只有一句：**不要看單日數字，要看 2 到 4 週的趨勢往哪走**。一天的高低會被睡眠、咖啡、喝酒、感冒影響得很厲害，某天數字難看不代表白練。這一節其實是在防兩件事：學生量到一次爛數字就放棄，還有教練拿一次好數字當「有效」的證據——兩個都是把一個點當成一條線。另外要記得，這些是看趨勢的工具，不是拿來診斷的，更不能拿來判斷學生的水感或幫他分級（水感有水感自己的判準）。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - breathing.training.bolt_test
