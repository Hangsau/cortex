hypoxic_blackout:
  id: breathing.safety.hypoxic_blackout
  cert: 🟢
  source: StatPearls 缺氧昏迷機轉 (PMID 32119507); CDC MMWR 2015;64(19) 紐約州 DUBB 致死研究; American Red Cross / YMCA / USA Swimming 缺氧昏迷聯合聲明 (2015/2022)
  source_ids:
  - src.pmid-32119507
  danger_zh: 🟢 先講最重要的一件事：『憋氣練肺活量』『水下閉氣比遠』『游前先用力深呼吸幾次再潛下去』——這些都可能直接致命，不是危言聳聽。機轉是『缺氧昏迷』（hypoxic blackout，舊稱淺水昏迷 SWB）：游泳前過度換氣會把血中二氧化碳壓得很低，而二氧化碳才是大腦『想呼吸』的主要訊號；訊號被壓掉之後，血氧會在你還沒感到任何窒息感之前就先掉到失去意識的程度——人就這樣無聲地在水下昏過去。
  evidence_zh: 🟢 這不是理論：CDC MMWR 統計紐約州 1988–2011 年的危險水下憋氣行為（DUBB），記錄到 16 起、其中 4 人死亡（皆為 17–22 歲男性）；同時把『過度換氣 + 長距離水下游 + 靜態閉氣』幾種行為疊加，致死風險明顯上升。美軍同期也有數十起相關溺斃。
  policy_zh: 🟢 三方權威立場：美國紅十字會、YMCA、USA Swimming 共同聲明把『游前刻意過度換氣』與『水中長時間閉氣』定義為**危險且可能致命的行為**，並要求救生員與教練主動制止。USA Swimming 的教練安全訓練明文規定：任何缺氧訓練**只能在水面做，不能在水下做**。
  rule_zh: 🔵 因此本章所有『呼吸訓練』方法都是在**陸上或水面**進行（呼吸肌訓練器、坐姿呼吸練習），**零水下憋氣**。如果有人教你『閉氣憋久一點練肺』，那不是訓練，是風險。水裡的呼吸該練的是感知線——換氣節律、連續吐氣、兩側順暢，那是 framework.yaml 三條線裡的第一條，在水面換氣，不在水下憋氣。
  plain_zh: 這一頁只有一句話最重要：不要在水下憋氣，也不要下水前猛吸幾口大氣再潛。那不是在練肺活量，是在關掉身體的警報器——二氧化碳才是讓你『想呼吸』的訊號，先把它排掉，人就會在完全沒有窒息感的情況下，安安靜靜地在水裡昏過去。這件事有實際死亡案例，美國紅十字會、YMCA、USA Swimming 三方也明文禁止。想練水裡的呼吸，練的是換氣節律，在水面練。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
hypocapnia_mechanism:
  id: breathing.safety.hypocapnia_mechanism
  cert: 🟢
  source: 低碳酸與腦灌流：J Appl Physiol (DOI 10.1152/japplphysiol.00637.2013); 波爾效應與氧合血紅素解離：StatPearls (NCBI Bookshelf NBK526028)
  source_ids:
  - src.jap-hyperventilation-cerebral-2013
  - src.statpearls-bohr-effect
  mechanism_zh: 🟢 過度換氣會造成**低碳酸血症**（血中二氧化碳過低）。它降低組織供氧的**主導機制是腦血管收縮**——二氧化碳是腦血管的擴張訊號，被排掉之後腦血管收縮，腦血流與送到腦部的氧量隨之下降。這條路徑才是主角。
  secondary_zh: 🟢 次要貢獻是**血紅素解離曲線左移**：低碳酸使血紅素把氧抓得更緊、在組織端更難釋放。它確實存在，但不是主要機制。
  bohr_zh: 🟢 順帶把方向講清楚：波爾效應本身的方向是——二氧化碳上升、pH 下降（偏酸）會使氧合血紅素解離曲線**右移**，促進組織端釋氧。運動中的肌肉產生更多二氧化碳，因此**更容易**取得氧氣。低碳酸是相反的方向。
  misconception_zh: 🔵 常見誤解：把『過度換氣導致組織缺氧』整個歸因於波爾效應。方向沒說錯，但抓了配角當主角——真正讓腦部缺氧的是腦血管收縮，解離曲線左移只是幫兇。教練若只記得波爾效應，會低估這件事發生得多快。
  coach_meaning_zh: 🔵 教練意義（這一段才是重點）：SpO2（血氧機）讀數正常**不代表**腦部氧輸送足夠——血氧機量的是血液帶了多少氧，量不到腦血管收縮之後實際送過去多少。所以『血氧沒掉就沒事』是危險的判斷依據，**不能拿血氧機當缺氧昏迷的防線**。真正的防線只有兩條：不做水下憋氣、不在入水前過度換氣。
  plain_zh: 有人會拿血氧機說『你看血氧正常啊』，這個判斷是錯的。過度換氣真正危險的地方是二氧化碳被排掉後腦血管會收縮，送到腦部的血流變少——血氧機量不到這件事。順便說清楚一個常被搞反的觀念：二氧化碳多、偏酸的時候，血紅素反而更願意把氧放給肌肉（這就是波爾效應）；把二氧化碳吹掉不會讓你更有氧，只會讓警報失靈。防線不是儀器，是不憋氣、不猛吸氣。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
