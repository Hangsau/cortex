hypocapnia_mechanism:
  id: breathing.safety.hypocapnia_mechanism
  cert: 🟢
  source: 低碳酸與腦灌流：J Appl Physiol (DOI 10.1152/japplphysiol.00637.2013); 波爾效應與氧合血紅素解離：StatPearls (NCBI Bookshelf NBK526028)
  source_ids:
  - src.jap-hyperventilation-cerebral-2013
  - src.statpearls-bohr-effect
  mechanism_zh: 🟢 過度換氣會造成**低碳酸血症**（血中二氧化碳過低）。它降低組織供氧的**主導機制是腦血管收縮**——二氧化碳是腦血管的擴張訊號，被排掉之後腦血管收縮，腦血流與送到腦部的氧量隨之下降。這條路徑才是主角。
  secondary_zh: 🟢 次要貢獻是**血紅素解離曲線左移**：低碳酸使血紅素把氧抓得更緊、在組織端更難釋放。它確實存在，但不是主要機制。
  bohr_zh: 🟢 順帶把方向講清楚：波爾效應本身的方向是——二氧化碳上升、pH 下降（偏酸）會使氧合血紅素解離曲線**右移**，促進組織端釋氧。運動中的肌肉產生更多二氧化碳，因此**更容易**取得氧氣。低碳酸是相反的方向。
  misconception_zh: 🔵 常見誤解：把『過度換氣導致組織缺氧』整個歸因於波爾效應。方向沒說錯，但抓了配角當主角——真正讓腦部缺氧的是腦血管收縮，解離曲線左移只是幫兇。教練若只記得波爾效應，會低估這件事發生得多快。
  coach_meaning_zh: 🔵 教練意義（這一段才是重點）：SpO2（血氧機）讀數正常**不代表**腦部氧輸送足夠——血氧機量的是血液帶了多少氧，量不到腦血管收縮之後實際送過去多少。所以『血氧沒掉就沒事』是危險的判斷依據，**不能拿血氧機當缺氧昏迷的防線**。真正的防線只有兩條：不做水下憋氣、不在入水前過度換氣。
  plain_zh: 有人會拿血氧機說『你看血氧正常啊』，這個判斷是錯的。過度換氣真正危險的地方是二氧化碳被排掉後腦血管會收縮，送到腦部的血流變少——血氧機量不到這件事。順便說清楚一個常被搞反的觀念：二氧化碳多、偏酸的時候，血紅素反而更願意把氧放給肌肉（這就是波爾效應）；把二氧化碳吹掉不會讓你更有氧，只會讓警報失靈。防線不是儀器，是不憋氣、不猛吸氣。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
    related:
    - breathing.safety.hypoxic_blackout
