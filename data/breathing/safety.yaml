hypoxic_blackout:
  id: breathing.safety.hypoxic_blackout
  cert: 🟢
  source: 'Bart, Murray & Lau (2026). Shallow water blackout. StatPearls; Boyd, Levy, McProud, Huang, Raneses & Olson (2015). Fatal and nonfatal drowning outcomes related to dangerous underwater breath-holding behaviors — New York State, 1988–2011. MMWR 64(19), 518–521; Craig (1976). Summary of 58 cases of loss of consciousness during underwater swimming and diving. Medicine and Science in Sports 8(3), 171–175; American Red Cross、YMCA of the USA 與 USA Swimming 的缺氧昏迷聯合聲明（2015 年首發、2022 年改版）; Espino & Harvey (2017). Hypoxic blackout: A partnership to raise awareness. 2017 World Congress on Drowning Prevention'
  source_ids:
  - src.statpearls-shallow-water-blackout-nbk554620
  - src.mmwr-2015-dubb-new-york
  - src.craig-1976-underwater-loc
  - src.hypoxic-blackout-joint-statement
  - src.hypoxic-blackout-presentation-2017
  danger_zh: 🟢 先講最重要的一件事：『憋氣練肺活量』『水下閉氣比遠』『游前先用力深呼吸幾次再潛下去』——這些都可能直接致命，不是危言聳聽。機轉是『缺氧昏迷』（hypoxic blackout，舊稱淺水昏迷 SWB）：游泳前過度換氣會把血中二氧化碳壓得很低，而二氧化碳才是大腦『想呼吸』的主要訊號；訊號被壓掉之後，血氧會在你還沒感到任何窒息感之前就先掉到失去意識的程度——人就這樣無聲地在水下昏過去。
  evidence_zh: 🟢 這不是理論。CDC MMWR 統計紐約州 1988–2011 年的危險水下憋氣行為（DUBB），共 16 例、分布在 15 起事件裡，其中 4 人死亡。這裡最該被看見的不是死亡人數，是死者的樣子：四人全是 17–22 歲男性，**全部被列為進階到專家等級的泳者**，而且四人全都刻意做了下水前的過度換氣。同一份統計還指出，把過度換氣、靜態閉氣、長距離水下游這幾種行為疊加起來做的人，致死風險明顯上升。這個輪廓不是紐約州獨有——1976 年一份 58 例水下失去意識的彙整同樣顯示：56 例是男性，最常見年齡是 16–20 歲，**全部是公認泳技良好的人**，其中 23 人死亡，而且**約八成發生在有救生員的泳池裡**。換句話說，這件事殺的不是不會游泳的人，也不是在沒人看管的地方發生的。這也不是上個世代的問題：光是 YMCA 系統的泳池，2008 年之後就至少有 5 人因缺氧昏迷死亡，另有至少 18 人是在水下失去意識後被成功救起的——後面這個數字才是這件事真正的頻率，死亡數只是浮出水面的那一小截。
  policy_zh: 🟢 三方權威立場：美國紅十字會、YMCA of the USA、USA Swimming 共同聲明把『游前刻意過度換氣』與『水中長時間閉氣』定義為**危險且可能致命的行為**。聲明做的第一件事其實是正名——因為水深根本不是機轉的一部分，『淺水昏迷』這個舊稱會誤導人以為深水才危險，所以改稱缺氧昏迷。落到現場的規定是很具體的：教學時**下潛前只能吸一口氣**，水下活動**不得競賽化、不得反覆做**，永遠不出『看誰游得遠、看誰憋得久』這種題目；救生員被訓練成主動禁止而非被動觀察，看到過度換氣或水下閉氣比賽要當場介入制止，**競技隊訓練也一樣要管**。這一點值得停一下想：過去的案例約八成就發生在有救生員的泳池裡，所以『有人看著』從來不是保護——制度才把救生員的角色從『看』改成『停』。
  policy_boundary_zh: 🟢 機構立場要照原文講。三方文件對教練的措辭是『**原則上**在水面進行（海豚腿訓練除外）』，並附帶條件：只用於有經驗、身體狀況良好且有適當監督的泳者，一次最多一到兩口深呼吸，限制反覆次數，給足恢復時間——它是一套有例外、有前提的管理規範，不是一條絕對禁令。本庫採同一套條件式立場（下一段 rule_zh），不另訂「零水下」這種比原文更絕對的規定。**引用時不可把『原則上、除海豚腿外』寫成『一律禁止』**——把別人的規範說得比原文更絕對，聽起來更安全，實際上是引用不實；而且它會把競速必練的水下段一起禁掉，教練一看就知道不可行，整段的可信度會一起賠掉。
  rule_zh: 🔵 因此要把兩件事分開。① **正常訓練**：出發與轉身後的水下段、限量的水下海豚腿、短距離少換氣衝刺，都是競速訓練必要的內容，該在水裡練。條件照三方聲明：下水前不刻意過度換氣（最多一到兩口深呼吸）、每趟有明確距離上限而不是憋到極限、限制趟數並給足恢復、有人專門盯著這一道（約八成案例發生在有救生員的泳池，所以「現場有救生員」不等於有人在盯）。② **危險行為**：下水前猛吸好幾口、水下比遠比久、反覆挑戰自己的最長距離、靜態閉氣、獨自練——這些不做。本章生理線的 CO2／閉氣表屬於靜態憋到極限，仍只在陸上或水面。
  plain_zh: 水下練習本身不是問題——出發和轉身後的水下段、水下海豚腿、短距離少換氣衝刺，都是競速必練的。會出人命的是一個特定組合：下水前猛吸好幾口大氣，再憋到極限（看誰游得遠、憋得久，或一次次挑戰自己最長），而且沒有人專門盯著。原因是二氧化碳才是讓你『想呼吸』的訊號，先把它排掉，人會在完全沒有窒息感的情況下，安安靜靜地在水裡昏過去。出事的人是什麼樣子：紐約州那份統計的四名死者全是十七到二十二歲、全被歸類為進階以上的泳者，而且都刻意先過度換氣；更早一份 58 例的彙整裡，所有人都泳技良好，約八成在有救生員的泳池出事——所以『現場有救生員』不等於有人在盯你這一道。美國紅十字會、YMCA、USA Swimming 給教練的規矩很具體：下水前最多一兩口深呼吸、水下不比賽、限制趟數、給足恢復；在這些條件下，海豚腿訓練可以在水下做。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
    related:
