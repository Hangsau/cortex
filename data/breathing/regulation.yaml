resonance_breathing:
  id: breathing.regulation.resonance_breathing
  cert: 🟡
  source: 'HRVB 方法學回顧：Lalanza JF, Lorente S, Bullich R, García C, Losilla JM, Capdevila L. (2023). Methods for Heart Rate Variability Biofeedback (HRVB): A Systematic Review and Guidelines. Applied Psychophysiology and Biofeedback, 48(3), 275–297 (PMID 36917418); 壓力反射共振頻率實測：Vaschillo et al. 2002 (DOI 10.1023/A:1014587304314)'
  source_ids:
  - src.pmid-36917418
  - src.vaschillo-2002-baroreflex
  what_zh: 🟢 是什麼：共振呼吸（resonance breathing，常與心率變異度生理回饋 HRVB 一起出現）是把呼吸頻率放慢到與身體壓力反射迴路的自然振盪頻率吻合，讓 RSA 與血壓波動同相位疊加、把 HRV 振幅放大的練習。它與生理性嘆息在性質上完全相反：**這一個需要累積練習量，不是當場就靈的急效技巧**（見 framework.yaml grading 節對這條線分級軸的說明）。
  procedure_zh: 🟢 做法：**吸氣 5–6 秒、吐氣 5–6 秒**（換算成頻率約每分鐘 5–6 次呼吸），**每天 10–20 分鐘**，**陸上坐姿**進行。不必刻意加深，重點在頻率而不在深度——把每口氣都吸到最滿反而會讓人撐著、緊繃，那是把練習做成另一件事。
  mechanism_zh: 🟢 機制：**本節不重寫**，見 breathing.physiology.baroreflex_resonance——那一節說明了壓力反射迴路本身的自然振盪頻率（族群平均約 0.1 Hz）、為什麼呼吸頻率對上它會產生共振放大，以及 Vaschillo 等人實測到的個人最適頻率其實落在一個區間而非固定值。這裡只承接一件事：**族群平均不是個人處方**，所以下一段才需要個人化流程。
  evidence_honesty_zh: 🟡 **極重要的誠實聲明（本節存在的最主要理由）**：坊間引用 Lalanza 2023 時，常寫成「143 篇研究證明共振呼吸有效」——**這是誤讀，而且錯得很徹底**。那篇文章是一份**方法學／協議回顧**：它回顧了 143 篇 HRVB 研究，發現其中**約三分之二未充分報告呼吸參數**（也就是連受試者實際用什麼頻率呼吸都沒交代清楚）。換句話說，**它是一份「這個領域的報告品質有問題」的證據，不是療效證據**。把一份指出領域方法學缺陷的文獻，反過來當成該領域有效的背書，是本章遇到最典型的引用倒錯。教練引用時務必分清楚：**機制有實測基礎（Vaschillo），療效證據的品質則是這篇回顧親自標記為有問題的那一塊。**
  personalization_zh: 🟢 個人化共振頻率（怎麼找到自己的那個數字）：既然族群平均不等於個人最適值，就要實測。做法是**依序試每分鐘 4.5、5、5.5、6、6.5 次**這五個頻率，**每個各做 2–3 分鐘**，量測期間的 HRV，取**HRV 振幅最大**的那一個作為自己的共振頻率。這也是這條線唯一有意義的「進階」——**把通用頻率換成個人化頻率，不是把吐氣越拉越長**（見 framework.yaml grading 節）。把秒數一直往上加不是進步，只是換了個方向練錯。
  boundary_zh: 🔵 邊界（這段一定要讀完）：**共振呼吸是陸上練習，不是水中換氣節律的處方。** 游泳時的呼吸頻率是由划臂節奏決定的，泳者不可能也不應該在水裡追求每分鐘 5.5 次呼吸——那既做不到，也會直接破壞划臂與換氣的對時，還會把一個自動化系統拉進意識層（見 breathing.physiology.neural_control 的再投資代價）。這是教練最容易犯的一個轉譯錯誤：讀完共振頻率就去要求學生「在水裡把呼吸放慢」。**不要讓學生把「每分鐘 5.5 次」搬到泳池裡。**
  coach_use_zh: 🔵 教練意義（本節的落點）：它的定位是**長期的陸上狀態管理工具**，不是賽前臨時抱佛腳的技巧——需要每天 10–20 分鐘、累積數週，適合的對象是**長期賽前焦慮明顯、或成人初學者的水中不安反覆出現**的那種學生，而不是今天突然緊張的人（那種情況用生理性嘆息）。推薦給學生時，教練有兩件事必須誠實說出口：① **這需要花時間累積，短期看不到東西**；② 它被驗證的是自律神經與情緒層面，**不是游泳成績**，而且那個領域的療效報告品質本身就被同行標記為有問題。把這兩句話說清楚，比多推薦一個方法重要——說不清楚的話，學生會在兩週後覺得被騙。
  plain_zh: 共振呼吸是把呼吸放很慢——吸 5 到 6 秒、吐 5 到 6 秒（大約一分鐘 5 到 6 次），每天做 10 到 20 分鐘，坐在陸地上做。原理是身體調節血壓的迴路本身有個自然節奏，呼吸對上它的時候兩個波會疊起來互相放大（詳細機制看本章「生理機制」那頁，這裡不重複）。這一個跟生理性嘆息完全相反：**它要練，不是當場就靈的。** 接下來是最重要的一段，請一定要看清楚：網路上很常看到「143 篇研究證明共振呼吸有效」——**這是把一篇文章讀反了**。那篇 2023 年的文章是**檢討研究方法的回顧**，它回顧 143 篇研究後發現**大約三分之二連受試者實際用什麼呼吸頻率都沒交代清楚**。也就是說，它是一份「這個領域的研究報告品質有問題」的證據，**不是有效的證據**。把它拿來當療效背書，等於拿一篇批評報告當成推薦信。至於怎麼找到適合自己的頻率：每分鐘 4.5、5、5.5、6、6.5 次依序各試 2 到 3 分鐘，量心率變異度，哪個頻率下振幅最大就用哪個。這也是這條線唯一的「進階」——換成個人化的頻率，**不是把吐氣一直拉長**，把秒數越拉越長不是進步。最後是最容易犯的錯：**這是岸上的練習，不是水裡換氣的處方。** 游泳時呼吸頻率是划手節奏決定的，千萬不要看完就叫學生「在水裡把呼吸放慢到一分鐘 5.5 次」——做不到，而且會把划手跟換氣的對時整個弄亂。推薦給學生時要老實講兩句話：這個要花好幾週才看得出東西；還有它被驗證的是情緒跟自律神經，不是你的成績。
