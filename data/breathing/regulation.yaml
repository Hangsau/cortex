domain: breathing
sub: regulation
schema_version: 1
principle:
  id: breathing.regulation.principle
  cert: 🔵
  premise_zh: 🔵 這一條線處理的問題很具體：**泳者在下水之前就已經繃住了**。賽前發抖、成人初學站在池邊心跳狂跳、鐵三選手在開放水域起跑前呼吸變淺變快——這些都不是技術問題，也不是呼吸肌力量問題，而是**自律神經的喚醒程度失調**。用動作指令去修它（「放輕鬆」「手再伸長一點」）幾乎沒有效果，因為問題根本不在動作那一層。喚醒調節線就是為了這種情況存在的。
  mechanism_pointer_zh: 🔵 為什麼調呼吸能調喚醒程度：**當吐氣長於吸氣時，副交感神經相對佔優**——吸氣偏向交感（心跳微幅加快），吐氣偏向副交感（迷走張力上升、心跳微幅減慢），把吐氣拉長就是把整個週期的重心壓向放鬆那一側。機制細節**本節不重寫**，見 breathing.physiology.autonomic_coupling（吸吐兩相位的自律神經作用、迷走神經與 RSA）與 breathing.physiology.baroreflex_resonance（壓力反射共振為什麼會放大 HRV）。本檔各節只寫做法、劑量與證據狀態，機制一律指回去。
  evidence_boundary_zh: 🔵 **本節最重要的一條邊界，讀本檔任何一節之前都要先讀這句：「情緒／壓力上的證據」不等於「游泳表現上的證據」。** 本檔引用的所有研究，終點都是情緒量表、焦慮、壓力、呼吸速率、HRV 這類指標——**沒有任何一篇測的是游泳成績**。所以本檔內容能主張的最多是「對緊張、恐懼、賽前過度警醒這類問題有幫助」，**不得延伸成「所以你會游更快」**。這兩件事之間沒有被驗證過的橋（見 framework.yaml 的 principle_evidence 總則）。教練若把這條線當成成績訓練的一環去推銷，就是拿一個沒有的東西去交換學生的時間與信任。
  land_only_zh: 🔵 **第二條邊界，同樣適用於本檔每一節：本檔所有方法一律在陸上進行，沒有任何一項可以帶進水裡。** 理由有兩層——① 水中的呼吸節律是由划臂週期決定的，泳者不可能也不應該在水裡追求某個指定的呼吸頻率（見 breathing.physiology.baroreflex_resonance 的邊界段）；② 更嚴重的是，本檔 wim_hof 一節那種刻意過度換氣，一旦靠近水就會與 breathing.safety.hypoxic_blackout 的缺氧昏迷機制疊加。所以本檔的使用場景固定是：**課前、賽前、換組之間、課後——在岸上、坐著或站穩的狀態下做完，再進水。**
  gap_zh: 🔴 素材缺口（不要當已解決）：本檔所有研究的受試者都是成人，**兒童與青少年族群的喚醒調節呼吸法沒有對應文獻**。兒童在賽前緊張這件事上一樣需要處置，但本檔的劑量與協議不可直接外推過去；面對兒童時，教練能引用的只有機制方向（吐氣長於吸氣偏向副交感），不是這些研究的具體數字。
  coach_use_zh: 🔵 教練意義（本節的落點）：教練該從這一節帶走的判斷是——**遇到一個繃住的泳者，先分辨他繃在哪一層**。是換氣感知還沒建立（回水裡練 drill，見 drills 的 FrBr 系列）？是硬體不夠（那是 training.yaml 的呼吸肌那條線）？還是純粹喚醒程度過高（才是本檔）？分錯層的代價很具體：用憋氣訓練去處理一個其實只是緊張的學生，既無效又危險。而分對層之後，本檔給的是四個工具，各有各的證據強度——這也是為什麼後面每一節都要把「證據到哪裡為止」寫清楚，而不是只給步驟。
  plain_zh: 有些學生的問題不在技術，是在下水之前整個人就已經繃住了——賽前發抖、站在池邊心跳狂跳、開放水域起跑前呼吸變淺變快。這種狀況喊「放輕鬆」沒有用，因為問題不在動作那一層。可以用呼吸去調它，原理很單純：吸氣會讓身體偏興奮，吐氣會讓身體偏放鬆，所以只要把吐氣弄得比吸氣長，整個人就會往鎮定那一邊走。這是有生理機制的，不是心理暗示（機制細節看本章「生理機制」那頁，這裡不重複）。但有兩件事一定要先說清楚。第一，這一頁引用的研究，測的全部都是情緒、焦慮、壓力、心率變異度這些東西，**沒有一篇測過游泳成績**——所以能說的只有「幫助你不那麼緊張」，不能說「所以你會游更快」，這兩件事中間沒有被驗證過的橋。第二，**這一頁的每一個方法都是在岸上做的，沒有任何一個可以帶進水裡。** 水裡的呼吸節奏是划手決定的，而且其中一種做法（後面會講的 Wim Hof）如果靠近水，會跟缺氧昏迷的風險疊在一起，那是會出人命的。所以固定用法是：上課前、比賽前、換組空檔、下課後，在岸上做完再進水。還有一件要老實說的事——這些研究的受試者都是成人，小朋友跟青少年沒有對應資料，遇到緊張的小朋友可以講原理，但別照抄這些數字。
