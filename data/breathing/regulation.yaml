physiological_sigh:
  id: breathing.regulation.physiological_sigh
  cert: 🟢
  source: 嘆息迴路定位：Li P, Janczewski WA, Yackle K, et al. (2016). The peptidergic control circuit for sighing. Nature, 530(7590), 293–297 (PMID 26855425); 呼吸法對照 RCT：Balban MY, Neri E, Kogon MM, et al. (2023). Brief structured respiration practices enhance mood and reduce physiological arousal. Cell Reports Medicine, 4(1), 100895 (PMID 36630953)
  source_ids:
  - src.pmid-26855425
  - src.pmid-36630953
  what_zh: 🟢 是什麼：生理性嘆息（physiological sigh，也叫 cyclic sighing）是身體本來就會自發做的一個動作——你在情緒緩下來時那個不由自主的「深吸一口再長長吐出去」，就是它。這個方法只是把它變成可以主動執行的版本。它在本檔四個工具裡有一個很特別的位置：**零練習門檻**，不需要事前累積練習量，第一次做就能做。
  procedure_zh: 🟢 做法（三步，順序不能換）：① 用鼻子吸一口氣。② **不吐氣，接著再補吸一小口**——這是整個方法的關鍵，兩段式吸氣把肺撐得比單次吸氣更開，也是它跟一般深呼吸最大的差別。③ 用嘴巴**長長地吐氣**，吐到自然吐盡為止，吐氣時間明顯長於吸氣。連續做幾次即可。最常做錯的一步是第二步被省略掉，變成普通的深呼吸——那就不是這個方法了。
  mechanism_zh: 🟢 機制（這是更正過的版本，坊間流傳的說法錯在歸因位置）：表現 **NMB（神經介素 B）** 與 **GRP（胃泌素釋放胜肽）** 的神經元位於 **RTN/pFRG**（retrotrapezoid nucleus / parafacial respiratory group），這些神經元**投射到 preBötzinger complex（前包欽格複合體）**；在 preBötC 之中，約 **200 個神經元**構成一個**同時表現 NMB 與 GRP 兩種受體的重疊次群體**，是這條迴路的接收端。**常見的錯誤說法是「嘆息神經元位於 preBötC」——那是錯的歸因**：發出嘆息訊號的胜肽神經元在 RTN/pFRG，preBötC 是收訊那一端（preBötC 本身作為吸氣節律核心起搏點的角色見 breathing.physiology.neural_control）。這條迴路的意義在於：嘆息不是一個被隨手歸類成「情緒反應」的動作，它有專屬的神經迴路。
  evidence_zh: 🟢 證據（Balban 2023，本節最該記住的一段）：這是一份 **108 人、四組隨機分派**的對照研究——三種呼吸法各一組（**① cyclic sighing ② box breathing ③ cyclic hyperventilation with retention**，第三組就是 Wim Hof 那一類的循環過度換氣，見本檔 wim_hof 節）＋ 一組正念冥想對照組；劑量是**每天 5 分鐘、持續 28 天**。四種做法放在同一份研究裡直接對打，這正是它的價值所在。結果：**cyclic sighing 在情緒改善與呼吸速率下降兩項上，顯著優於正念冥想對照組**。但同一份研究還有一句同樣重要、卻幾乎每次轉述都被丟掉的結果——**HRV 與靜息心率沒有顯著變化**。這句不可省：它代表這個方法被驗證到的是「主觀情緒與呼吸速率」這一層，**不是**自律神經指標全面改善。把它講成「能提升 HRV」就是在補一個研究沒給的結論。
  swimming_meaning_zh: 🔵 游泳意義：它的價值不在效果多大，而在**可用性**——零練習門檻、耗時以秒計、不需要器材、不需要事先累積練習量，所以它是**唯一一個可以在池畔當場拿出來用**的工具。實際場景很具體：檢錄後等出場的那幾分鐘、上台前、一組課表結束後心跳還沒降下來的換組空檔、成人初學站在池邊不敢下去的那一刻。其他三個工具都需要事前練習或不適合當場使用，這一個不需要。
  safety_zh: 🟢 安全：全程在陸上做，坐著或站穩皆可，沒有過度換氣的成分，不造成鹼中毒，因此不與缺氧風險疊加。但邊界仍然要說死——**絕不在水中做**。理由不是這個動作本身危險，而是「任何呼吸法都不帶進水裡」這條規則不留例外；一旦開了例外的口，學生會自行把其他方法也帶下去（見 principle 節的 land_only 段與 breathing.safety.hypoxic_blackout）。
  coach_use_zh: 🔵 教練意義（本節的落點）：這是本檔最推薦教練學起來的一個，理由是**成本最低而且教得會**——不需要學生回家練 28 天才能用（研究裡的 28 天是為了測情緒改善，不是使用門檻），現場示範一次就能跟著做。教的時候只要盯住兩件事：**第二口補吸不能省**、**吐氣要明顯比吸氣長**。同時要誠實告訴學生它能做什麼、不能做什麼——它處理的是當下的緊繃感，**不會讓他游更快**，也不是拿來壓下水中恐懼的替代品（怕水要回感知線處理）。
  plain_zh: 生理性嘆息就是把身體本來就會做的那個動作變成主動可用的版本——你情緒緩下來時那個不由自主的「深吸一口再長長吐出去」，就是它。做法三步：用鼻子吸一口氣，先不要吐，**接著再補吸一小口**（這一步最常被漏掉，漏了就變成普通深呼吸），然後用嘴巴長長地吐出去，吐氣要明顯比吸氣長。連做幾次。機制上它有一條專屬的神經迴路：發出嘆息訊號的那群神經元位在腦幹的 RTN/pFRG，投射到前包欽格複合體，而前包欽格複合體裡大約 200 個神經元同時帶有兩種對應的受體，負責接收。順帶更正一個很常見的說法——不是「嘆息神經元在前包欽格複合體」，那是把發訊端跟收訊端搞混了。效果的證據是 2023 年一份 108 人、分成四組的對照研究：三種呼吸法（生理性嘆息、箱式呼吸、還有一種循環過度換氣，就是後面 Wim Hof 那一類）各一組，再加一組正念冥想當對照，每天 5 分鐘、做 28 天。結果做這個的人在**情緒改善跟呼吸速率下降**兩項上明顯比正念冥想那組好。但同一份研究還有一句常被略過的話：**心率變異度跟靜息心率並沒有顯著變化**——所以別把它講成「能提升 HRV」，研究沒有這麼說。它在游泳上的價值是「可用性」：不用器材、不用事先練、幾秒鐘就做完，是唯一一個可以在池畔當場拿出來用的工具——檢錄後等出場、上台前、一組游完喘不停的空檔、成人初學站在池邊不敢下水的那一刻。研究裡的 28 天是為了測情緒改善，不是說你得練 28 天才能用。教的時候只要盯兩件事：第二口補吸不能省、吐氣要比吸氣長。最後照樣要講死：**絕對不要在水裡做**——不是這個動作危險，而是「呼吸法一律不下水」這條規則不能開例外，開了學生就會把別的也帶下去。
