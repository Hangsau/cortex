    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
    related:
    - breathing.framework.boundaries
    - breathing.physiology.autonomic_coupling
    - breathing.physiology.baroreflex_resonance
    - breathing.regulation.wim_hof
