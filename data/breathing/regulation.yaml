box_breathing:
  id: breathing.regulation.box_breathing
  cert: 🟡
  source: 呼吸法對照 RCT：Balban MY, Neri E, Kogon MM, et al. (2023). Brief structured respiration practices enhance mood and reduce physiological arousal. Cell Reports Medicine, 4(1), 100895 (PMID 36630953)
  source_ids:
  - src.pmid-36630953
  what_zh: 🟢 是什麼：箱式呼吸（box breathing，也叫方塊呼吸）是把呼吸切成四段等長的節拍——吸、閉、吐、閉各佔一邊，因為四段等長像個正方形而得名。它流傳極廣（軍警與高壓職業訓練是常見的流傳管道），也因此是學生最常拿來問「這個有沒有用」的一個。
  procedure_zh: 🟢 做法：**吸氣 4 秒 － 閉氣 4 秒 － 吐氣 4 秒 － 閉氣 4 秒**，四段等長，循環進行。這裡的「閉氣」是短暫的停頓，不是憋到極限——與 training.yaml 那條 CO2 耐受路線是完全不同的兩件事，不要混為一談。
  correction_zh: 🟡 **必須更正的常見說法（本節存在的主要理由）**：在 Balban 2023 那份四組對照研究裡，box breathing 的**情緒改善幅度雖然高於正念冥想對照組，但並未達到統計顯著**。坊間（含大量二手轉述與職場減壓教材）常把它講成「已證實有效」——**那是誤讀**。正確的說法是：它在一份設計良好的對照研究裡被測過，方向看起來是正的，但**沒有跨過顯著性門檻**；同一份研究裡達到顯著的是 cyclic sighing（見本檔 physiological_sigh 節）。「方向看起來是正的」跟「已證實有效」之間的差距，正是本檔要教練分清楚的東西。
  coach_use_zh: 🔵 教練意義（本節的落點）：既然證據沒達到顯著，為什麼還收？兩個理由——① **教練一定會被問到**，而被問到時含糊點頭會被理解成背書（同 training.yaml buteyko 節的邏輯）；② 它有一個實際用途：**賽前等待、上場前的空檔**那種「還要等十分鐘、腦子停不下來」的時間，一個有固定節拍、需要數數的動作本身就佔住了注意力。教練該說的是實話：**「有人覺得有用，但在最直接測過它的那份研究裡沒有達到顯著，別把它當成保證有效的東西。」** 如果只能推薦一個，推薦生理性嘆息——同一份研究裡達到顯著的是那一個。另外要提醒學生：**絕不在水中做**，本檔所有方法都一樣（見 principle 節）。
  plain_zh: 箱式呼吸就是把呼吸切成四段等長：吸 4 秒、閉 4 秒、吐 4 秒、閉 4 秒，像個正方形，所以叫方塊呼吸。這裡的「閉氣」只是短暫停頓，不是憋到極限，跟那些「練憋氣耐受」的東西完全是兩回事。它流傳得非常廣，但有件事一定要更正：在 2023 年那份四組對照研究裡，**箱式呼吸的情緒改善雖然比正念冥想那組好一點，但沒有達到統計顯著**——坊間常說它「已被證實有效」，那是誤讀。同一份研究裡真正達到顯著的是生理性嘆息（就是前面那一節）。那為什麼還要寫它？因為教練一定會被問到，而被問的時候含糊點頭就等於背書。它確實有一個實際用途：賽前還要等十分鐘、腦子停不下來的時候，這種要數拍子的動作本身就會佔住注意力。該說的實話是：「有人覺得有用，但在最直接測過它的那份研究裡沒達到顯著，別當成保證有效的東西。」如果只能推薦一個，推薦生理性嘆息。還有——**絕對不要在水裡做**，這一頁的每個方法都一樣。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - breathing.regulation.principle
    - breathing.regulation.physiological_sigh
    - breathing.training.buteyko
wim_hof:
  id: breathing.regulation.wim_hof
  cert: 🟡
  source: Wim Hof 法內毒素試驗：Kox M, van Eijk LT, Zwaag J, et al. (2014). PNAS, 111(20), 7379–7384 (PMID 24799686); 期望效應分析：van Middendorp H, Kox M, Pickkers P, Evers AWM. (2016). Clinical Rheumatology, 35(4), 1081–1085 (PMID 26194270); Wim Hof 主動對照 RCT：Blades R, Mendes WB, Don BP, et al. (2024). Comprehensive Psychoneuroendocrinology, 20, 100272; guru 效應檢驗：Zwaag J, Naaktgeboren R, van Herwaarden AE, Pickkers P, Kox M. (2022). Psychosomatic Medicine, 84(4), 457–467 (PMID 35213875)
  source_ids:
  - src.pmid-24799686
  - src.pmid-26194270
  - src.blades-2024-whm
  - src.pmid-35213875
  what_zh: 🟢 是什麼：Wim Hof 法（WHM）的呼吸部分是**刻意的循環過度換氣**——連續數十次深快呼吸，把血中 CO2 大量排掉（造成**呼吸性鹼中毒**），**接著閉氣**，如此循環數輪。完整版本常搭配**冷暴露與冥想**。它在網路上的能見度極高，教練幾乎一定會遇到學生說「我在練這個」。注意它與本檔前三個方法在性質上完全不同：前三個都是把呼吸放慢、把吐氣拉長；**這一個是反過來把呼吸加快加深**，走的不是同一條路。
  evidence_kox_zh: 🟡 證據一（Kox 2014, PNAS）：這是最常被引用的那一份——**訓練組 12 人對照組 12 人**的內毒素試驗，看到訓練組交感活性與抗發炎反應的差異。但引用時必須同時說出它的根本限制：**介入是呼吸法＋冷暴露＋冥想的混合介入，無法拆解**是哪一項造成效果。也就是說，這份研究**不能**用來支持「呼吸法本身有效」——它支持的是「這三件事一起做會有某些生理反應」。把混合介入的結果掛在其中一個成分頭上，是本節最常見的歸因錯誤。
  evidence_expectancy_zh: 🟡 證據二（van Middendorp 2016）：這一份分析的是**期望效應**——結果顯示**樂觀傾向可預測腎上腺素反應（rho = 0.76, p < .01）與 IL-10（rho = 0.60, p < .05）**。兩件事要一起講：① **n = 12**，樣本極小；② **相關不等於因果**——這是相關性分析，不能推論「因為樂觀所以產生反應」。它真正的價值是提出一個很難迴避的問題：**受試者的期望本身可能就是效果的一部分**，而這正是任何缺乏主動對照組的研究無法排除的東西。
  evidence_blades_zh: 🟢 證據三（Blades 2024，本節證據品質最高的一份）：**n = 84，而且設有可信的主動對照組**——這一點很關鍵，因為它正好補上了前兩份研究缺的那塊。結果：**憂鬱、焦慮、壓力三項皆為虛無結果**（組間沒有顯著差異）；唯一觀察到的是**壓力後的反芻思考下降**，而且**該效果會消退**。也就是說，在證據品質最好的那份研究裡，這個方法在主要的情緒指標上沒有勝過主動對照組。這一段不能省，它是本節結論的主要依據。
  evidence_guru_zh: 🟢 證據四（Zwaag 2022）：這份檢驗的是所謂 guru effect——效果會不會其實來自創始人本人的個人魅力或授課方式。結果是**沒有觀察到 guru effect**（課程長度 p = 0.71、指導者 p = 0.46）。這一條要誠實地放進來：它是**對這套方法有利**的一項發現——效果（不論多寡）至少不是靠 guru 撐起來的。本檔不是要否定這套方法，而是要把每一份證據放在它該在的位置。
  safety_zh: 🟢 **安全（本節最重要的一段，也是整章對游泳教練最關鍵的一條）：絕不在水中做、絕不站立時做、絕不開車時做。** 刻意過度換氣會造成呼吸性鹼中毒，可能導致頭暈、四肢刺麻，**甚至昏厥**——在陸上站著昏倒是撞傷，在水裡昏倒是死亡。對游泳教練而言還有更嚴重的一層：**在池畔做完刻意過度換氣、然後下水**，等於把鹼中毒狀態帶進水裡，這會與 breathing.safety.hypoxic_blackout 的缺氧昏迷機制**直接疊加**——過度換氣排掉 CO2 之後，「想呼吸」的警報被延後觸發，但血氧照樣在下降，人可能**在毫無窒息感的情況下失去意識**（機制見 breathing.physiology.chemoreceptors）。**這是真的會死人的組合，沒有例外、沒有「只做一輪」這種折衷。** 教練若知道學生在練這套，必須明確要求：**練習與下水之間要完全分開，池畔不做。** 另外，本節的做法**不適用於兒童與青少年**，也不適用於有心血管或癲癇相關病史的人——那屬於醫療判斷，不是教練該下的判斷。
  coach_use_zh: 🔵 教練意義（本節的落點）：教練面對這套方法要做的不是評價它有沒有效，而是**先處理安全、再處理歸因**。① 安全：學生說他在練這個，第一句話就是上一段那條——**不要在池畔做、不要帶進水裡**，這比任何效果討論都優先。② 歸因：學生說「這個很有用」時，該說的是「最常被引用的那份研究是呼吸＋冷水＋冥想一起做的，拆不出來是哪一項；而樣本最大、有主動對照組的那份，在憂鬱焦慮壓力上是虛無結果」。③ 別過度否定：guru effect 那份是對它有利的證據，本檔不做立場性的否定——**要否定的是把它講成有游泳表現證據的說法**，那部分完全沒有研究。這一節也是本檔 claims_gap 節四個判斷樣式的活例子：小樣本、混合介入、短期生理指標、對照組不足，四項在同一個方法上全部出現過。
  plain_zh: Wim Hof 法的呼吸部分是**刻意的過度換氣**——連續幾十次又深又快的呼吸，把二氧化碳大量排掉（造成呼吸性鹼中毒），然後閉氣，反覆幾輪，完整版本還會搭配泡冷水跟冥想。注意它跟這一頁前面三個方法方向相反：前面都是把呼吸放慢、吐氣拉長，這個是把呼吸加快加深。**先講安全，因為這一段比效果重要一百倍：絕對不要在水裡做、不要站著做、不要開車時做。** 過度換氣會讓人頭暈、手腳發麻，甚至昏倒——在陸地上站著昏倒是撞傷，在水裡昏倒是死亡。對游泳教練來說還有更狠的一層：**在池邊做完這套再下水**，等於把鹼中毒的狀態帶進水裡，會跟缺氧昏迷的機制疊在一起——二氧化碳被排光之後，「想呼吸」的警報被延後，但血氧照樣在掉，人可能完全沒有窒息感就昏過去。**這是真的會死人的組合，沒有例外，也沒有「只做一輪」這種折衷。** 知道學生在練這個，就要明確要求：練習跟下水完全分開，池邊不做。小朋友跟青少年不適用；有心血管或癲癇病史的更是醫生的事，不是教練能判斷的。效果的部分，四份研究要一份一份看清楚：① 最常被引用的 2014 年 PNAS 那份，訓練組 12 人對照組 12 人，但介入是呼吸＋冷水＋冥想三件事一起做，**拆不出來是哪一項造成的**——所以它不能拿來證明「呼吸法本身有效」。② 2016 年那份看的是期望的影響，發現樂觀傾向可以預測腎上腺素反應（rho=0.76）跟 IL-10（rho=0.60），但只有 12 個人，而且相關不等於因果——它的意思是「受試者的期待本身可能就是效果的一部分」。③ 2024 年 Blades 那份是品質最好的：84 人，而且有像樣的主動對照組，結果是**憂鬱、焦慮、壓力三項全部沒有差別**，只有壓力後的反芻思考有下降，而且那個效果後來會消退。④ 2022 年還有一份專門檢查「是不是靠創始人本人的魅力」，結果是**沒有這回事**（課程長短 p=0.71、誰教的 p=0.46）——這一條對這套方法是有利的，要一起講，不能只挑對自己論點有用的講。所以總結是：不用全盤否定它，但要否定「它能讓你游更快」這種說法——那部分一篇研究都沒有。
  links:
    development_stages:
    - t2t
    - t2c
    - t2w
    related:
    - breathing.physiology.chemoreceptors
    - breathing.regulation.claims_gap
    - breathing.safety.hypoxic_blackout
claims_gap:
  id: breathing.regulation.claims_gap
  cert: 🔵
  premise_zh: 🔵 這一節不介紹任何呼吸法，它是一組**判斷工具**。使用情境非常具體：**學生（或家長）從網路、社群、商業課程帶著某個呼吸法的宣稱來問「這個對游泳有沒有用」**。教練不可能對每一種呼吸法都讀過原始研究，但可以用四個固定的樣式去問問題——這四個樣式不是抽象的方法學原則，它們全都是本檔前面幾節真實踩到的坑。
  patterns_zh:
  - 🔵 ① **樣本小**：本領域的研究樣本多落在 20–60 人這個量級。小樣本不代表研究沒價值，但代表**結論的穩定度低**——換一批人重做，結果可能不一樣。看到「研究證實」四個字，先問一句「幾個人」。（本檔實例：Kox 2014 是 12 對 12、van Middendorp 2016 是 n=12。）
  - 🔵 ② **混合介入無法拆解歸因**：介入包含好幾個成分（呼吸＋冷暴露＋冥想）時，效果**不能掛在其中任何一個成分頭上**。這是宣稱與證據落差最常見的生產方式——研究做的是整包，宣傳講的是其中一項。（本檔實例：Kox 2014 的三合一介入被廣泛引用成「呼吸法有效」。）
  - 🔵 ③ **短期生理指標 ≠ 長期結果**：心率降了、HRV 上升了、呼吸速率慢了，這些是**當下的生理變化**，不等於幾個月後的情緒改善，更不等於運動表現。要特別留意「效果會消退」這件事——被測到的當下有效，不代表留得住。（本檔實例：Blades 2024 觀察到的反芻思考下降會消退。）
  - 🔵 ④ **對照組不足（缺主動對照）**：沒有對照組、或只有「什麼都不做」的被動對照組時，**無法排除期望效應與注意力效應**——受試者知道自己在被特別對待這件事本身就會產生變化。可信的做法是設**主動對照組**（讓對照組也做一件看起來一樣正經的事）。（本檔實例：Blades 2024 之所以是本檔證據品質最高的一份，正是因為它有主動對照組；而它做出來的是虛無結果。）
  coach_use_zh: 🔵 教練意義（本節的落點）：這四個樣式的用法不是拿來否定學生——**開口就說「那個沒用」會直接關掉對話**，而且往往也不正確。正確的用法是把它們變成四個溫和的問題：「那份研究幾個人？」「他們同時還做了什麼？」「測的是當下的數字還是幾個月後的狀態？」「對照組做了什麼？」問完之後，通常會落到一個誠實的位置：**這個方法可能對你的緊張有幫助，但它沒有游泳表現上的證據**。這也正好回到 principle 節那條總則——本檔全部的內容都停在情緒與自律神經那一層，沒有一篇跨到成績。教練把這件事說清楚，比推薦或否定任何一種呼吸法都有價值。
  plain_zh: 這一節不教任何呼吸法，它是給教練用的一組判斷工具——學生或家長從網路上帶著某個呼吸法的宣稱來問「這個對游泳有沒有用」的時候用。有四個固定的問題可以問。第一，**幾個人？** 這個領域的研究樣本多半只有二十到六十人，人少不代表沒價值，但代表換一批人重做結果可能就不一樣。第二，**他們同時還做了什麼？** 如果研究裡是呼吸加泡冷水加冥想一起做，那效果就不能算在呼吸頭上——這是宣稱跟證據拉開距離最常見的方式：研究做的是整包，宣傳只講其中一項。第三，**測的是當下的數字，還是幾個月後的狀態？** 心跳降了、心率變異度上升了，那是當場的生理變化，不等於長期的情緒改善，更不等於游得比較快；而且要注意有些效果過一陣子就消退了。第四，**對照組做了什麼？** 如果沒有對照組，或對照組只是「什麼都不做」，就沒辦法排除「知道自己在被特別對待」所產生的心理效果；比較可信的是有一組也在做一件看起來同樣正經的事。用這四個問題的重點是——**不要開口就說「那個沒用」**，那會直接把對話關掉，而且通常也不正確。問完之後多半會落在一個誠實的位置：這東西可能對你的緊張有幫助，但它**沒有任何游泳表現上的證據**。把這件事講清楚，比推薦或否定任何一種呼吸法都有用。
