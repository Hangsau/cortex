boundaries:
  id: breathing.framework.boundaries
  cert: 🔵
  premise_zh: 🔵 這一節寫的是**這章刻意不收什麼、以及為什麼**。它的用途是防守：呼吸是所有領域都在講的東西，一旦沒有邊界，一般健康、助眠、瑜伽的呼吸法會源源不絕地灌進游泳知識庫，把章節稀釋成一份『各種呼吸法大全』。教練需要這一節，是因為學生最常拿網路上看到的呼吸法來問『這個對游泳有沒有用』——這一節就是那個問題的答案。
  excluded_zh:
  - 🔵 **不收 4-7-8 助眠法**：屬於一般健康 / 助眠脈絡，與游泳教學沒有可驗證的連結。
  - 🔵 **不收火呼吸（Kapalabhati）**：屬於瑜伽脈絡，與游泳教學沒有可驗證的連結。
  - 🔵 **不收勝利式呼吸（Ujjayi）**：屬於瑜伽脈絡，與游泳教學沒有可驗證的連結。
  - 🔵 **不收交替鼻孔呼吸（Nadi Shodhana）**：屬於瑜伽脈絡，與游泳教學沒有可驗證的連結。
  - 🔵 **不收 COPD 呼吸復健菜單**：屬於臨床復健脈絡，對象與目標都不是游泳教學。
  exclusion_reason_zh: 🔵 排除的共同理由不是『它們沒用』，而是**它們與游泳教學之間沒有可驗證的連結**。把它們收進來只會稀釋章節：內容變多、可查證性變低、教練反而更難判斷該用哪一個。要進這一章，門檻是能說清楚它處理的是三條線的哪一條、以及在游泳脈絡下的證據狀態。
  principle_evidence_zh: 🔵 總則一（最重要的一條）：**『情緒／喚醒改善的證據』不等於『游泳表現改善的證據』**。本章凡是引用情緒或自律神經研究的段落，都只能主張它對『緊張、恐懼、賽前喚醒』這類問題有幫助，**不得延伸成『所以你會游更快』**。這兩件事之間沒有被驗證過的橋，跨過去就是外推。
  principle_freediving_zh: 🔵 總則二：**自由潛水是另一個脈絡**。自由潛水的閉氣訓練結論不可直接外推到游泳，反之亦然。未來章節擴充自由潛水內容時，兩邊的結論要各自標明適用脈絡，不共用。
  plain_zh: 這一章不收 4-7-8 助眠法、火呼吸、勝利式呼吸、交替鼻孔呼吸，也不收 COPD 的呼吸復健菜單——不是說它們沒用，而是它們跟游泳教學之間沒有可查證的連結，收進來只會把這章稀釋掉。還有兩條底線：第一，能讓你比較不緊張，不等於能讓你游更快，這章講情緒與自律神經的段落一律不准延伸成『所以會變快』；第二，自由潛水是另一回事，那邊的閉氣結論不能搬到游泳，游泳的結論也不能搬過去。
  links:
    development_stages:
    - l2t
    - t2t
    - t2c
    - t2w
