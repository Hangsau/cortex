schema_version: 1
overview:
  id: breathing.framework.overview
  cert: 🔵
  premise_zh: 🔵 『呼吸要不要練、怎麼練』之所以永遠講不清楚，是因為大家把三件不同的事混在一起。Vortex 把呼吸拆成三條線：① **感知線（在水裡）**——吐氣連不連續、換氣會不會緊張、兩側順不順，這是水感的一部分，跟『手感腳感』一樣按 L0–L6 分級，靠水裡的 drill 練。② **生理線（陸上）**——呼吸肌（吸氣那組肌肉）有沒有力、對二氧化碳堆積的耐受度，這是純『硬體』，是可以用阻力訓練的骨骼肌，跟水感無關。③ **喚醒調節線（陸上，本章新增）**——用呼吸的節律去調節自律神經狀態，處理賽前緊張、水中恐懼、成人初學焦慮；它既不是水感也不是呼吸肌，走的是第三條路。
  lines_zh:
  - 🔵 ① **感知線（在水裡）**：吐氣連不連續、換氣會不會緊張、兩側順不順。按 L0–L6 分級，內容不在本章而在 drills——自由式 breathing 類：FrBr1 韻律呼吸 / FrBr2 放鬆下沉 / FrBr3 連續涓流吐氣 / FrBr4 兩側換氣。
  - 🔵 ② **生理線（陸上）**：呼吸肌力量與 CO2 耐受。呼吸肌是可被阻力訓練的骨骼肌，跟水感無關，所以它**按負荷分級，不按 L 分級**，定位與『陸上力量訓練』完全平行（都是硬體上限那一側的輔助軸）。內容在 physiology.yaml。
  - 🔵 ③ **喚醒調節線（陸上，本章新增）**：用呼吸節律調節自律神經狀態，處理賽前緊張、水中恐懼、成人初學焦慮。它既不是水感也不是呼吸肌，而是**自律神經路徑**。它與 Vortex 心理層已有的內容（水中恐懼、喚醒調節、迷走張力）是同一條線的兩端——心理層從『情緒與狀態』那頭進去，這條線從『呼吸節律』這頭進去。
  author_synthesis_zh: 🔵 作者立場：教練面對一個換氣有問題的泳者，第一件事不是給練習，是先問這是哪一條線的問題——是『感知還沒建立』（緊張、憋氣、抬頭找氣）、是『呼吸肌不夠力』（技術沒問題但長距離後段喘到掉速），還是『喚醒水準失調』（一到比賽或一下水就整個人繃住）？三種的介入完全不同：第一種回水裡練 drill，第二種才考慮陸上呼吸肌訓練，第三種要走自律神經那條路。把它們混淆——用憋氣訓練去解決一個其實是緊張的問題——**既無效又危險**。這是本章存在的理由，也是最常見的教學錯誤。
  plain_zh: 呼吸有三種『練』：一是在水裡把換氣節律練順（那是水感，去看 drill）；二是在陸上把吸氣的肌肉練得更有力（那是生理訓練）；三是用呼吸的節奏讓自己不要那麼緊繃（那是調節，處理恐懼跟賽前焦慮）。它們解決的是三種不同問題，別搞混——最常見的錯誤是用『憋氣練肺』去處理一個其實只是緊張的學生，既沒效果又很危險。
