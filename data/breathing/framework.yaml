grading:
  id: breathing.framework.grading
  cert: 🔵
  premise_zh: 🔵 『呼吸訓練能不能分級？』能，但要看哪一條線——三條線的分級軸完全不一樣。教練要知道這件事的理由很實際：軸選錯，進度指標就會錯。拿『強度』去衡量一條該用『順序』走的線，或拿『秒數』去衡量一條該用『累積練習量』走的線，都會逼學生往錯的方向努力。
  axes_zh:
  - 🔵 感知線（在水裡）：按 **L0–L2** 分級。L0 水中連續吐氣 → L1 游進中持續吐氣 → L2 兩側換氣。這條按『感知建立的順序』走，**不是按強度**——沒有『吐氣吐得更用力』這種進階，只有下一個感知是否站穩。對應 drill：FrBr1 韻律呼吸 / FrBr2 放鬆下沉（L0）、FrBr3 連續涓流吐氣（L1）、FrBr4 兩側換氣（L2）。
  - 🔵 生理線—呼吸肌（在陸上）：按 **負荷（% MIP）** 分級。50% MIP 起 → 漸進到 80% MIP。這跟陸上重訓一樣是『加阻力』式的漸進分級，跟 L 級無關。
  - 🔵 生理線—CO2 耐受：**不建議當成游泳的分級訓練**。游泳上無實證，而且任何水下版本致命（見 safety.yaml）。
  - 🔵 喚醒調節線（在陸上）：按 **練習量累積** 分級，**不按強度**。共振呼吸屬於需要累積練習量的長期訓練，不是一用就靈的急效技巧；生理性嘆息則相反，是零練習門檻的即時工具，當場就能用。這條線的『進階』是把通用頻率換成個人化頻率，**不是把秒數拉長**——把吐氣越拉越長不是進階，只是換了個練錯的方向。
  coach_use_zh: 🔵 教練怎麼用這三個軸：感知線的進度問「下一個感知站穩了沒」；呼吸肌的進度問「阻力能不能往上加」；喚醒調節的進度問「累積練了多少次、有沒有換成個人化頻率」。三個問題不能互換。
  caveat_zh: 🔴 素材缺口：呼吸肌訓練的劑量證據集中在青少年與菁英泳者；**兒童、成人初學、masters、para** 的呼吸訓練分級沒有對應游泳文獻，不可把菁英協議直接外推到這些族群。
  plain_zh: 可以分級，但分三套，而且尺不一樣：水裡的呼吸節律按『感知順序』分（先在水中吐得出氣，再游進中持續吐，最後兩側換氣）；陸上的呼吸肌按『阻力強度』分（50% 起、慢慢加到 80%，像重訓）；喚醒調節按『練了多少次』分，不是把每口氣拉更長。至於自由潛水那種閉氣表，游泳上沒證據、水下還會要命，不列入游泳的分級。另外要老實說：呼吸肌訓練的劑量研究幾乎都在青少年跟菁英選手身上做的，小朋友、成人初學、masters、身心障礙泳者沒有對應資料，不能照抄。
