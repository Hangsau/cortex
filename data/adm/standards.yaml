framework: 姿勢—平衡—恢復—錨定—加速
applies_note: 理想技術基準應在 T2T（訓練為訓練）階段達到，並在 T2C、T2W 及終身競技階段持續維持。
standards:
- id: std.free.pull
  title: 自由式——拉水技術
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  note: 左右鏡像合併（A.1「左手拉水 & 右手空中恢復」+「右手拉水 & 左手空中恢復」）；criteria 以拉水側 / 對側中性描述涵蓋雙側。
  phases:
  - name: 拉水階段（雙側）
    criteria:
    - 拉水手應低於同側肩
    - 拉水階段用於建立強力推水的姿勢
    - 拉水中點時，手、肘、肩應在矢狀面（sagittal plane）對齊
    - 對側手臂空中恢復速度應與拉水手拉水速度同步
- id: std.free.push
  title: 自由式——推水技術
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  note: 左右鏡像合併（A.1「左手推水 & 右手空中恢復」+「右手推水 & 左手空中恢復」）；criteria 以推水側 / 對側中性描述涵蓋雙側。
  phases:
  - name: 推水階段（雙側）
    criteria:
    - 推水動作來自對前臂的施壓
    - 對側手臂恢復中點時，手、肘、肩在矢狀面對齊
    - 對側手臂恢復速度應與推水手推水速度同步
    - 推水手推水計時應與踢腿動作協調
    - 推水結束時達到峰值速度
- id: std.free.full-cycle
  title: 自由式——完整划水週期
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 完整划水週期
    criteria:
    - 身體動作優化，盡量減少不必要波浪的產生
    - 雙肩以協調節律運作，協助對水施力
    - 核心持續收緊，在踢腿穩定身體的同時優化手臂推進力
    - 呼吸動作與划水節律同步，不干擾節奏、平衡，不製造不必要波浪
- id: std.back.pull
  title: 仰式——拉水技術
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  note: 左右鏡像合併（A.2「左手拉水 & 右手空中恢復」+「右手拉水 & 左手空中恢復」）；criteria 以拉水側 / 對側中性描述涵蓋雙側。
  phases:
  - name: 拉水階段（雙側）
    criteria:
    - 拉水手應低於同側肩
    - 同側抓水（catch）、對側手臂出水（exit）、同側腿踢水（kick）應同步發生
    - 拉水階段用於建立強力推水的姿勢
    - 拉水中點時，手、肘、肩在矢狀面對齊
    - 對側手臂空中恢復速度應與拉水手拉水速度同步
- id: std.back.push
  title: 仰式——推水技術
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  note: 左右鏡像合併（A.2「左手推水 & 右手空中恢復」+「右手推水 & 左手空中恢復」）；criteria 以推水側 / 對側中性描述涵蓋雙側。
  phases:
  - name: 推水階段（雙側）
    criteria:
    - 推水手推水時肘部靠近身體，手臂方向朝向腳端
    - 對側手入水應在推水手推水結束前完成
    - 推水手推水計時應與踢腿動作協調
    - 推水結束時達到峰值速度
- id: std.back.full-cycle
  title: 仰式——完整划水週期
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 完整划水週期
    criteria:
    - 身體動作優化，盡量減少不必要波浪的產生
    - 雙肩以協調節律運作，協助對水施力
    - 核心持續收緊，在踢腿穩定身體的同時優化手臂推進力
    - 划水距離透過恢復階段的充分伸展來達成
- id: std.fly.pull
  title: 蝶式——手臂拉水階段
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 手臂拉水階段
    criteria:
    - 雙手應低於雙肩
    - 入水踢腿（entry kick）在雙手前伸（outsweep 前）結束
    - 以高肘位（high elbows）完成抓水
- id: std.fly.push-kick
  title: 蝶式——手臂推水 & 腿部踢水階段
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 手臂推水 & 腿部踢水階段
    criteria:
    - 肘部略領先手部進入推水階段
    - 推水階段中，下巴前移以準備呼吸
    - 推水與踢腿同步結束
    - 推水結束時達到峰值速度
- id: std.fly.recovery
  title: 蝶式——手臂恢復階段
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 手臂恢復階段
    criteria:
    - 恢復過程中維持相對平坦的身體姿勢
    - 恢復中點時，手、肘、肩在矢狀面對齊
    - 雙手在肩部前方入水並向前推進
- id: std.fly.full-cycle
  title: 蝶式——完整划水週期
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 完整划水週期
    criteria:
    - 身體動作優化，盡量減少不必要波浪的產生
    - 呼吸計時有助於維持整體身體的相對平坦姿勢
    - 核心持續收緊，在踢腿穩定身體的同時優化手臂推進力
    - 划水距離透過維持相對直腿踢腿、且入水時不將胸部下壓來達成
- id: std.breast.kick
  title: 蛙式——腿部踢水階段
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 腿部踢水階段
    criteria:
    - 踢水至流線型姿勢，雙臂向前伸展
    - 收腿時應收腳跟（而非膝蓋），使小腿垂直、腳跟靠近臀部
    - 加速收腿動作有助於外旋進入踢水推進階段
    - 踢水完成時加速收尾，以維持相對高的腳部與腿部位置
- id: std.breast.pull
  title: 蛙式——手臂拉水階段
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 手臂拉水階段
    criteria:
    - 以滑行姿態進入手臂動作
    - 以高肘位向外大幅外展（out sweep）
    - 最大拉水長度在雙手靠近肩線時結束
    - 肘部靠近身體（elbow close to body）
    - 前進速度提升至最高
    - 雙手向內划動時，肘部收向身體
    - 達到峰值前進速度
- id: std.breast.recovery-flex
  title: 蛙式——手臂恢復 & 腿部屈曲階段
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 手臂恢復 & 腿部屈曲階段
    criteria:
    - 開始恢復時不讓整體身體線下沉
    - 雙手在水面恢復，肘部仍在水中
    - 開始收腿準備踢腿
    - 伸展進入流線型姿勢以維持前進速度，但不向前「俯衝」下壓
- id: std.breast.full-cycle
  title: 蛙式——完整划水週期
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 完整划水週期
    criteria:
    - 身體動作優化，盡量減少不必要波浪的產生
    - 呼吸計時有助於維持整體身體的相對平坦姿勢
    - 核心持續收緊，在踢腿穩定身體的同時優化手臂推進力
    - 划水距離透過在水中維持相對高的身體位置來達成
- id: std.start.dive
  title: 潛水式起跳（自由式 / 仰式 / 蝶式 / 蛙式）
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  note: 蛙式起跳動作與一般潛水式起跳相同，水下階段改為 pullout（水下划手）而非蝶式踢。
  phases:
  - name: 零位姿勢（Zero Position）
    criteria:
    - 雙腳交錯站立，腳尖朝前，雙腳分開
    - 後腳穩固踩在楔形輔具（wedge）上
    - 雙臂伸直；肩部在手部正上方或前方
    - 頭部中立；臀部抬高
  - name: 推蹬階段
    criteria:
    - 臀部立即向前移動
    - 後腿完全蹬出；頭部保持中立
    - 手臂彎曲恢復，與前腿同步伸展
  - name: 飛行階段
    criteria:
    - 下腿上提至上腿位置
    - 雙臂向前延伸，在臉部前方準備入水
    - 頭部在雙臂之間對齊；雙手在接觸水面前合攏
  - name: 入水點
    criteria:
    - 維持流線型姿勢
    - 雙腿沿與身體相同路徑入水
    - 腳踝與腳背完全伸展；全身透過同一個「洞」入水
  - name: 水下階段——自由式 / 仰式 / 蝶式
    criteria:
    - 維持流線型姿勢；滑行後再開始踢腿
    - 以恆定高頻率、低幅度踢腿；踢腿完成時臀部保持固定
    - 最後一下踢腿與第一個抓水動作同步
    - 出水時頭部保持中立
  - name: 水下階段——蛙式
    criteria:
    - 維持流線型姿勢；滑行後進行 pullout（水下划手）
    - 以手指向下啟動拉水；拉水後頸部在流線型姿勢中完全伸展
    - 雙手在腳收回前恢復到臉部位置；蛙式踢水時膝蓋朝後
- id: std.start.back
  title: 仰式起跳
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 零位姿勢
    criteria:
    - 臀部靠近牆壁；腳趾至少在水面高度
    - 背部直立；頭部中立
  - name: 推蹬階段
    criteria:
    - 頭部/背部立即向後移動
    - 臀部推動使臀部完全出水；出水後腿部蹬出
    - 腿部蹬出結束時身體與水面平行；手臂與推蹬動作同步伸展
  - name: 飛行階段與入水點
    criteria:
    - 背部拱起越過水面；雙手在接觸水面前合攏
    - 頭部在雙臂之間對齊；雙腿/雙腳完全出水
    - 維持流線型姿勢；全身透過同一個「洞」入水
  - name: 水下階段
    criteria:
    - 維持流線型姿勢；滑行後再開始踢腿
    - 以恆定高頻率、低幅度踢腿；踢腿完成時臀部保持固定
    - 最後一下踢腿與第一個抓水同步；第一個抓水時鼻子在水面
    - 第一個抓水後轉換為捷式踢（flutter kick）；出水時頭部保持中立
- id: std.turn.free
  title: 自由式轉身
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 接近與旋轉
    criteria:
    - 維持游泳速度與划水頻率（SR）；頭部朝下，視線看向池底
    - 最後一划完整且深（與正常划水相同）
    - 從腰部開始彎曲，跟隨入水手的方向
    - 臀部維持在水面；膝蓋收向腹部
  - name: 接觸與推蹬
    criteria:
    - 雙腳與髖同寬；接觸牆面時雙臂伸展至流線型姿勢
    - 背部平坦，臀部收緊；推蹬過程中維持流線型姿勢；推蹬時不旋轉
  - name: 水下與出水
    criteria:
    - 維持流線型姿勢；滑行後再開始踢腿
    - 使用蝶式/魚式踢轉換至俯臥姿勢；踢腿完成時臀部保持固定
    - 最後一下踢腿與第一個抓水同步；第一個抓水後轉換為捷式踢
    - 出水時頭部保持中立；整個出水過程維持充分伸展
- id: std.turn.back
  title: 仰式轉身
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 接近與旋轉
    criteria:
    - 維持游泳速度與划水頻率；翻轉划水時手指朝下
    - 頭部朝下，視線看向池底；最後一划完整且深（自由式划水動作）
    - 從腰部開始彎曲，跟隨入水手的方向；臀部維持在水面；膝蓋收向腹部
  - name: 接觸與推蹬
    criteria:
    - 雙腳與髖同寬；接觸牆面時雙臂伸展至流線型姿勢
    - 背部平坦，臀部收緊；推蹬過程中維持流線型姿勢
  - name: 水下與出水
    criteria:
    - 維持流線型姿勢；滑行後再開始踢腿
    - 以恆定高頻率、低幅度踢腿；踢腿完成時臀部保持固定
    - 最後一下踢腿與第一個抓水同步；第一個抓水時鼻子在水面
    - 第一個抓水後轉換為捷式踢；出水時頭部保持中立
- id: std.turn.breast
  title: 蛙式轉身
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 接近與旋轉
    criteria:
    - 維持游泳速度與划水頻率；以完整一划結束
    - 身體保持平坦在水面；雙手同時觸牆
    - 一手下落時，雙肩保持與牆面平行；下落手通過髖部時，肩部開始旋轉
    - 雙腿從身體下方穿過；身體向後倒落的同時，雙腿向牆延伸
  - name: 接觸與推蹬
    criteria:
    - 雙腳與髖同寬；接觸牆面時雙臂伸展至流線型姿勢
    - 背部平坦，臀部收緊；推蹬過程中維持流線型姿勢；推蹬時不旋轉
  - name: 水下與出水
    criteria:
    - 維持流線型姿勢；滑行後進行 pullout（水下划手）
    - 以手指向下啟動拉水；拉水後頸部在流線型姿勢中完全伸展
    - 雙手在腳收回前恢復到臉部位置；蛙式踢水時膝蓋朝後
- id: std.turn.fly
  title: 蝶式轉身
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  phases:
  - name: 接近與旋轉
    criteria:
    - 維持游泳速度與划水頻率；以完整一划結束
    - 身體保持平坦在水面；雙手同時觸牆
    - 一手下落時，雙肩保持與牆面平行；下落手通過髖部時，肩部開始旋轉
    - 雙腿從身體下方穿過；身體向後倒落的同時，雙腿向牆延伸
  - name: 接觸與推蹬
    criteria:
    - 雙腳與髖同寬；接觸牆面時雙臂伸展至流線型姿勢
    - 背部平坦，臀部收緊；推蹬過程中維持流線型姿勢；推蹬時不旋轉
  - name: 水下與出水
    criteria:
    - 維持流線型姿勢；滑行後再開始踢腿
    - 以恆定高頻率、低幅度踢腿；踢腿完成時臀部保持固定
    - 最後一下踢腿與第一個抓水同步；出水時頭部保持中立
- id: std.turn.im-breast
  title: 個人混合式轉身——蛙式出（IM → Breast）
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  note: 接近與旋轉使用蝶式或自由式的單手觸牆轉身形式，水下採蛙式 pullout。
  phases:
  - name: 接近與旋轉
    criteria:
    - 維持游泳速度與划水頻率；以充分伸展完成最後一划，肩部低於 90 度
    - 翻轉至觸牆，肩部低於 90 度直至觸壁；觸牆後從腰部彎曲啟動旋轉
    - 雙腿收向腹部；雙腿從身體上方越過至側邊；身體側臥時雙腿延伸至牆
  - name: 接觸與推蹬
    criteria:
    - 雙腳與髖同寬；接觸牆面時雙臂伸展至流線型姿勢
    - 背部平坦，臀部收緊；推蹬過程中維持流線型姿勢；推蹬時不旋轉
  - name: 水下與出水
    criteria:
    - 維持流線型姿勢；滑行後進行 pullout
    - 以手指向下啟動拉水；拉水後頸部完全伸展至流線型姿勢
    - 雙手在腳收回前恢復到臉部位置；蛙式踢水時膝蓋朝後
- id: std.turn.im-free
  title: 個人混合式轉身——自由式出（IM → Free）
  framework: 姿勢—平衡—恢復—錨定—加速
  applies_from: t2t
  note: 接近動作使用雙手觸牆，水下採蝶式踢轉換為捷式踢。
  phases:
  - name: 接近與旋轉
    criteria:
    - 維持游泳速度與划水頻率；以完整一划結束
    - 身體保持平坦在水面；雙手同時觸牆
    - 一手下落時，雙肩保持與牆面平行；下落手通過髖部時，肩部開始旋轉
    - 雙腿從身體下方穿過；身體向後倒落的同時，雙腿向牆延伸
  - name: 接觸與推蹬
    criteria:
    - 雙腳與髖同寬；接觸牆面時雙臂伸展至流線型姿勢
    - 背部平坦，臀部收緊；推蹬過程中維持流線型姿勢；推蹬時不旋轉
  - name: 水下與出水
    criteria:
    - 維持流線型姿勢；滑行後再開始踢腿
    - 使用蝶式/魚式踢轉換至俯臥姿勢；踢腿完成時臀部保持固定
    - 最後一下踢腿與第一個抓水同步；第一個抓水後轉換為捷式踢
    - 出水時頭部保持中立；整個出水過程維持充分伸展
